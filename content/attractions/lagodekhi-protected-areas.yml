ka:
  name: ლაგოდეხის დაცული ტერიტორიები
  short: >-
    საქართველოს უძველესი ნაკრძალი აზერბაიჯანის საზღვართან — ტყე, ჩანჩქერები და შავი კლდის ტბის მრავალდღიანი
    ლაშქრობა.
  body: >-
    ლაგოდეხის ნაკრძალი 1912 წელს დაარსდა და საქართველოში უძველესი დაცული ტერიტორიაა. იგი კავკასიონის სამხრეთ
    ფერდობზე, ალაზნის ველიდან სამი ათას მეტრზე მაღალ მწვერვალებამდე ვრცელდება და სწორედ ეს სიმაღლეთა სხვაობა
    ქმნის მის მრავალფეროვნებას: ქვემოთ რცხილნარ-წიფლნარი ტყე, ზემოთ სუბალპური მდელოები, ყველაზე მაღლა
    კი კლდე და ქვაღორღი. აქ ბინადრობს არჩვი, ნიამორი, დათვი და ევროპული ირემი.


    მარშრუტების უმეტესობა ერთი ბაზიდან — ლაგოდეხის ვიზიტორთა ცენტრიდან იწყება. მოკლე ვარიანტია გურგენიანის
    ჩანჩქერი: სამი-ოთხი საათი მიმოსვლაზე, კარგად მონიშნული ბილიკი ტყეში, ზაფხულშიც გრილი. საშუალო სირთულისაა
    მაშავრის ჩანჩქერი და ცხრა კილომეტრიანი წრიული ბილიკი „ტყის მარშრუტი“.


    ნაკრძალის მთავარი მიზანი მაინც **შავი კლდის ტბაა** — სამთვიანი გამყინვარებით წარმოქმნილი ტბა 2800
    მეტრზე, აზერბაიჯანის საზღვართან. მარშრუტი ორ ან სამ დღეს მოითხოვს, ღამის გათევით ბივუაკზე ან თავშესაფარში,
    და ივნისიდან ოქტომბრამდე გადის; მაისში თოვლი ჯერ კიდევ დევს. ყველა ლაშქრობისთვის ვიზიტორთა ცენტრში
    რეგისტრაცია სავალდებულოა, სასაზღვრო ზონის გამო კი მრავალდღიან მარშრუტზე პასპორტიც აუცილებელია. ნაკრძალის
    ბარათი ისიცაა, რომ შესვლა უფასოა და ბილიკები კარგად არის მონიშნული — ეს საქართველოში ყველგან არ გვხვდება.
    ლაგოდეხი ასევე მოსახერხებელი დასასრულია კახეთის რგოლისთვის, თუ სიღნაღიდან აღმოსავლეთით განაგრძობთ.
  tip: >-
    დაიწყეთ ვიზიტორთა ცენტრში — რეგისტრაცია უფასოა და სავალდებულო, იქვე მიიღებთ რუკას და ინფორმაციას ბილიკების
    მდგომარეობაზე. მანქანა ცენტრთან რჩება. ერთდღიანი ლაშქრობისთვის საკმარისია სპორტული ფეხსაცმელი და ორი
    ლიტრი წყალი; შავი კლდის ტბაზე კარვისა და პასპორტის გარეშე არ გაუშვებენ. ტყეში ტკიპებია — ჩაცმა დახურული
    სჯობს. კაფე და ბანკომატი ლაგოდეხის ცენტრშია.
  route: >-
    თბილისიდან კახეთის გზატკეცილით საგარეჯოზე, ბადიაურზე, წნორსა და ყვარელზე — შემდეგ აღმოსავლეთით ლაგოდეხამდე,
    სულ დაახლოებით 160 კმ და ორი საათი ორმოცი წუთი. მთელი გზა ასფალტიანია და ბოლო წლებში საგრძნობლად გამოსწორდა;
    ეკონომ კლასის მანქანა სავსებით საკმარისია. ვიზიტორთა ცენტრი ქალაქის ჩრდილოეთ კიდეშია, მითითებული.
    საწვავი და მაღაზიები ლაგოდეხშივეა. საზღვრის გადაკვეთა აზერბაიჯანში ქირავნობის ავტომობილით არ არის
    ნებადართული.
en:
  name: Lagodekhi Protected Areas
  short: >-
    Georgia's oldest nature reserve on the Azerbaijani border — forest, waterfalls and the multi-day trek
    to Black Rock Lake.
  body: >-
    Lagodekhi was established in 1912 and is the oldest protected area in Georgia. It runs up the southern
    slope of the Caucasus from the floor of the Alazani Valley to peaks above three thousand metres, and
    that range of altitude is what gives it its variety: hornbeam and beech forest low down, subalpine
    meadow higher, then rock and scree at the top. Chamois, bezoar goat, brown bear and red deer all live
    inside the reserve.


    Most routes start from a single base, the visitor centre in Lagodekhi town. The short option is the
    **Gurgeniani waterfall**, three to four hours there and back on a well-marked forest path that stays
    cool even in summer. A step up are the Mashavera falls and the nine-kilometre circular forest trail,
    both comfortable half-day walks with a solid climb in the middle.


    The reserve's headline objective is **Black Rock Lake**, a glacial lake at around 2,800 metres directly
    on the Azerbaijani border. The trek takes two or three days with a night at a bivouac site or shelter,
    and runs from June to October; snow lingers well into May. Registration at the visitor centre is compulsory
    for every walk, and because the upper route enters a border zone, you must carry your passport for
    the multi-day trek.
  tip: >-
    Start at the visitor centre — registration is free and mandatory, and you get a map plus current trail
    conditions at the same time. Leave the car there. For a day walk, trainers and two litres of water
    are enough; you will not be sent up to Black Rock Lake without a tent and a passport. Ticks are present
    in the forest, so covered clothing is sensible. Cafés and ATMs are in the centre of Lagodekhi town.
  route: >-
    From Tbilisi take the Kakheti Highway through Sagarejo, Badiauri, Tsnori and Kvareli, then continue
    east to Lagodekhi — about 160 km and two hours forty. The road is asphalt the whole way and has improved
    considerably in recent years, so an economy car is entirely adequate. The visitor centre is signposted
    at the northern edge of town. Fuel and shops are available in Lagodekhi itself. Note that crossing
    into Azerbaijan is not permitted in a Georgian rental car.
ru:
  name: Лагодехские охраняемые территории
  short: 'Старейший заповедник Грузии у границы с Азербайджаном: лес, водопады и многодневный поход к
    озеру Чёрных скал.'
  body: >-
    Лагодехский заповедник основан в 1912 году и является старейшей охраняемой территорией Грузии. Он
    поднимается по южному склону Кавказа от дна Алазанской долины до вершин выше трёх тысяч метров, и
    именно этот перепад высот создаёт его разнообразие: внизу грабово-буковый лес, выше субальпийские
    луга, на самом верху скалы и осыпи. В заповеднике живут серна, безоаровый козёл, бурый медведь и благородный
    олень.


    Почти все маршруты начинаются от одной точки — визит-центра в городе Лагодехи. Короткий вариант —
    **Гургениановский водопад**: три-четыре часа туда и обратно по хорошо размеченной лесной тропе, прохладной
    даже летом. Ступенью выше идут Машаверские водопады и девятикилометровая кольцевая лесная тропа —
    обе на полдня, с ощутимым подъёмом в середине.


    Главная цель заповедника — **озеро Чёрных скал**, ледниковое озеро на высоте около 2800 метров прямо
    на границе с Азербайджаном. Поход занимает два или три дня с ночёвкой в бивуаке либо в приюте и проходим
    с июня по октябрь; в мае снег ещё лежит. Регистрация в визит-центре обязательна для любого маршрута,
    а на многодневный поход, из-за пограничной зоны, нужен паспорт.
  tip: >-
    Начинайте с визит-центра: регистрация бесплатная и обязательная, там же дадут карту и расскажут о
    состоянии троп. Машину оставляйте на месте. Для однодневной прогулки хватит кроссовок и двух литров
    воды; к озеру Чёрных скал без палатки и паспорта не пустят. В лесу водятся клещи, поэтому закрытая
    одежда разумнее. Кафе и банкоматы — в центре города Лагодехи.
  route: >-
    Из Тбилиси по Кахетинскому шоссе через Сагареджо, Бадиаури, Цнори и Кварели, затем на восток до Лагодехи
    — около 160 км и два часа сорок. Дорога асфальтовая на всём протяжении и заметно улучшилась за последние
    годы, машины эконом-класса вполне достаточно. Визит-центр обозначен указателями на северной окраине
    города. Топливо и магазины есть в самом Лагодехи. Учтите, что выезд в Азербайджан на арендованной
    в Грузии машине не разрешён.
fa:
  name: مناطق حفاظت‌شدهٔ لاگودخی
  short: کهن‌ترین ذخیره‌گاه طبیعی گرجستان روی مرز آذربایجان — جنگل، آبشار و پیمایش چندروزهٔ دریاچهٔ سنگ
    سیاه.
  body: >-
    لاگودخی در 1912 بنیان گذاشته شد و کهن‌ترین منطقهٔ حفاظت‌شدهٔ گرجستان است. از کف درهٔ آلازانی روی دامنهٔ
    جنوبی قفقاز تا قله‌های بالای سه هزار متر بالا می‌رود و همین گسترهٔ ارتفاعی است که تنوع آن را می‌سازد:
    جنگل ممرز و راش در پایین، چمنزار زیرآلپی بالاتر، و سنگ و کورسنگ در بلندترین بخش. شامو، بز بزوآر، خرس
    قهوه‌ای و گوزن سرخ همگی درون ذخیره‌گاه زندگی می‌کنند.


    بیشتر مسیرها از یک پایگاه واحد آغاز می‌شوند: مرکز بازدیدکنندگان در شهر لاگودخی. گزینهٔ کوتاه **آبشار
    گورگنیانی** است، سه تا چهار ساعت رفت و برگشت روی بیلیک جنگلی خوش‌علامتی که حتی در تابستان خنک می‌ماند.
    یک پله بالاتر آبشارهای ماشاورا و مسیر حلقوی نه‌کیلومتری جنگل قرار دارند؛ هر دو پیاده‌روی راحت نیم‌روزه
    با یک سربالایی جدی در میانه.


    هدف اصلی ذخیره‌گاه **دریاچهٔ سنگ سیاه** است، دریاچه‌ای یخچالی در حدود 2,800 متر و درست روی مرز آذربایجان.
    این پیمایش دو تا سه روز طول می‌کشد، با یک شب در محل بیواک یا پناهگاه، و از ژوئن تا اکتبر انجام‌شدنی
    است؛ برف تا اواخر ماه مه باقی می‌ماند. ثبت‌نام در مرکز بازدیدکنندگان برای هر پیاده‌روی الزامی است
    و چون مسیر بالایی وارد منطقهٔ مرزی می‌شود، برای پیمایش چندروزه باید گذرنامه همراه داشته باشید.
  tip: >-
    کار را از مرکز بازدیدکنندگان شروع کنید — ثبت‌نام رایگان و اجباری است و همان‌جا نقشه و وضعیت روز مسیرها
    را هم می‌گیرید. خودرو را همان‌جا بگذارید. برای پیاده‌روی یک‌روزه کفش ورزشی و دو لیتر آب کافی است؛
    بدون چادر و گذرنامه شما را به سوی دریاچهٔ سنگ سیاه راه نمی‌دهند. در جنگل کنه هست، پس لباس پوشیده منطقی
    است. کافه‌ها و خودپردازها در مرکز شهر لاگودخی‌اند.
  route: >-
    از تفلیس بزرگراه کاختی را از میان ساگارجو، بادیااوری، تسنوری و کوارلی بروید و سپس رو به شرق تا لاگودخی
    ادامه دهید — حدود 160 کیلومتر و دو ساعت و چهل دقیقه. جاده در تمام مسیر آسفالت است و در سال‌های اخیر
    به‌روشنی بهتر شده، پس خودروی اقتصادی کاملاً کافی است. مرکز بازدیدکنندگان در حاشیهٔ شمالی شهر علامت‌گذاری
    شده است. سوخت و فروشگاه در خود لاگودخی هست. توجه کنید که عبور به آذربایجان با خودروی اجاره‌ای گرجی
    مجاز نیست.
he:
  name: שמורות לגודחי
  short: שמורת הטבע העתיקה בגאורגיה על גבול אזרבייג'ן — יער, מפלים והמסע הרב-יומי אל אגם הסלע השחור.
  body: >-
    לגודחי הוכרזה ב-1912 והיא השטח המוגן העתיק ביותר בגאורגיה. היא מטפסת במדרון הדרומי של הקווקז מקרקעית
    עמק אלאזני ועד פסגות שמעל שלושת אלפים מטר, וטווח הגבהים הזה הוא שמעניק לה את מגוונה: יער אלון ואשור
    למטה, אחו תת-אלפיני גבוה יותר, ולמעלה סלע וגרוסת אבנים. שמואה, עז בזואר, דוב חום ואייל אדום חיים כולם
    בתוך השמורה.


    רוב המסלולים יוצאים מבסיס אחד, מרכז המבקרים בעיירה לגודחי. האפשרות הקצרה היא **מפל גורגניאני**, שלוש
    עד ארבע שעות הלוך ושוב בשביל יער מסומן היטב שנשאר קריר גם בקיץ. דרגה מעליה נמצאים מפלי משאוורה ושביל
    היער המעגלי באורך תשעה קילומטרים, שניהם הליכות נוחות של חצי יום עם טיפוס רציני באמצע.


    היעד המרכזי של השמורה הוא **אגם הסלע השחור**, אגם קרחוני בגובה של כ-2,800 מטר ממש על גבול אזרבייג'ן.
    המסע נמשך יומיים או שלושה עם לינה באתר ביוואק או במחסה, והוא אפשרי מיוני עד אוקטובר; שלג נשאר כאן
    עד סוף מאי. הרישום במרכז המבקרים הוא חובה לכל הליכה, ומכיוון שהמסלול העליון נכנס לאזור גבול, חובה
    לשאת דרכון במסע הרב-יומי.
  tip: >-
    התחילו במרכז המבקרים — הרישום חינם וחובה, ובאותה הזדמנות תקבלו מפה ומידע עדכני על מצב השבילים. השאירו
    שם את הרכב. להליכת יום מספיקים נעלי ספורט ושני ליטר מים; אל אגם הסלע השחור לא ישלחו אתכם בלי אוהל
    ובלי דרכון. ביער יש קרציות, ולכן לבוש מכסה הוא רעיון נבון. בתי קפה וכספומטים נמצאים במרכז העיירה לגודחי.
  route: >-
    מטביליסי סעו בכביש קחתי דרך סאגארג'ו, באדיאורי, צנורי וקווארלי, והמשיכו מזרחה ללגודחי — כ-160 ק"מ
    ושעתיים ארבעים. הכביש סלול לכל אורכו והשתפר מאוד בשנים האחרונות, ולכן רכב חסכוני מספיק לחלוטין. מרכז
    המבקרים מסומן בשילוט בקצה הצפוני של העיירה, ומשם מתחילים כל השבילים. דלק, חנויות ובתי קפה יש בלגודחי
    עצמה, אז אין צורך להצטייד מראש. שימו לב שמעבר לאזרבייג'ן אינו מותר ברכב שכור גאורגי.
ar:
  name: محميات لاغوديخي
  short: >-
    أقدم محمية طبيعية في جورجيا على الحدود الأذربيجانية — غابات وشلالات ورحلة متعددة الأيام إلى بحيرة
    الصخرة السوداء.
  body: >-
    أُنشئت لاغوديخي عام 1912 وهي أقدم منطقة محمية في جورجيا. تصعد على المنحدر الجنوبي للقوقاز من قاع وادي
    ألازاني حتى قمم تتجاوز ثلاثة آلاف متر، وهذا المدى في الارتفاع هو ما يمنحها تنوعها: غابات الزان والغرب
    في الأسفل، ومروج تحت-ألبية أعلى منها، ثم صخر وحصى في القمم. ويعيش داخل المحمية الشامواه والماعز البزواري
    والدب البني والأيل الأحمر.


    تبدأ معظم المسارات من قاعدة واحدة، هي مركز الزوار في بلدة لاغوديخي. الخيار القصير هو **شلال غورغينياني**،
    ثلاث إلى أربع ساعات ذهاباً وإياباً على درب غابة جيد التعليم يبقى بارداً حتى في الصيف. وأعلى منه درجة
    تأتي شلالات ماشافيرا ودرب الغابة الدائري البالغ تسعة كيلومترات، وكلاهما نزهة مريحة نصف يوم مع صعود
    جاد في الوسط.


    أما هدف المحمية الأبرز فهو **بحيرة الصخرة السوداء**، وهي بحيرة جليدية على ارتفاع نحو 2,800 متر على
    الحدود الأذربيجانية مباشرة. تستغرق الرحلة يومين أو ثلاثة مع مبيت في موقع تخييم أو ملجأ، وتمتد من يونيو
    إلى أكتوبر؛ ويبقى الثلج حتى أواخر مايو. والتسجيل في مركز الزوار إلزامي لكل نزهة، ولأن المسار العلوي
    يدخل منطقة حدودية فعليك حمل جواز سفرك في الرحلة متعددة الأيام.
  tip: >-
    ابدأ من مركز الزوار — التسجيل مجاني وإلزامي، وتحصل في الوقت نفسه على خريطة وعلى حالة الدروب اليوم.
    اترك السيارة هناك. لنزهة يوم واحد يكفي حذاء رياضي ولتران من الماء؛ ولن يُسمح لك بالصعود إلى بحيرة
    الصخرة السوداء من دون خيمة وجواز سفر. وفي الغابة قُراد، لذا فالملابس التي تغطي الجسم خيار حكيم. المقاهي
    وأجهزة الصراف في وسط بلدة لاغوديخي.
  route: >-
    من تبليسي اسلك طريق كاخيتي السريع عبر ساغاريجو وباديوري وتسنوري وكفاريلي، ثم تابع شرقاً إلى لاغوديخي
    — نحو 160 كم وساعتين وأربعين دقيقة. الطريق معبّد طوال المسافة وتحسّن كثيراً في السنوات الأخيرة، لذا
    فسيارة اقتصادية كافية تماماً. ومركز الزوار مُشار إليه باللافتات عند الطرف الشمالي للبلدة. الوقود والمتاجر
    متوفرة في لاغوديخي نفسها. وانتبه إلى أن العبور إلى أذربيجان غير مسموح به بسيارة مستأجرة جورجية.
