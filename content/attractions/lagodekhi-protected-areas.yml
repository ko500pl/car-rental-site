ka:
  name: ლაგოდეხის დაცული ტერიტორიები
  short: >-
    საქართველოს უძველესი ნაკრძალი, 1912 წლიდან: წიფლნარი, ჩანჩქერები და ორ-სამდღიანი ლაშქრობა მყინვარულ
    ტბამდე დაღესტნის ქედზე.
  body: >-
    **საქართველოს პირველი ნაკრძალი იმიტომ არსებობს, რომ ერთ პოლონელ ოფიცერს ტყე შეუყვარდა და ნახევარი
    საუკუნე არ დაანება მისი გაჩეხვა.**


    ლუდვიკ მლოკოსევიჩი ლაგოდეხის გარნიზონში 1853 წელს მოხვდა და აქ პოლკის პარკი გააშენა. 1861 წელს სამსახური
    დატოვა, უდანაშაულოდ დააპატიმრეს და გადაასახლეს, მაგრამ მაინც დაბრუნდა, სატყეო ინსპექტორად დაინიშნა
    და სიცოცხლის ბოლომდე ლაგოდეხში დარჩა. მან მეცნიერებისთვის სამოცამდე ახალი სახეობა აღმოაჩინა; ორს მისი
    სახელი ჰქვია — კავკასიურ როჭოს და ლიმონისფერ იორდასალამს, რომელსაც ინგლისელი მებაღეები, ლათინური სახელის
    წარმოთქმით დაღლილნი, „მოლი ჯადოქარს“ ეძახიან. 1889 წლიდან ის ტყის დაცვას ითხოვდა. ნაკრძალი 1912 წელს,
    მისი გარდაცვალებიდან სამი წლის შემდეგ დაარსდა; თავად მლოკოსევიჩი ლაგოდეხის სასაფლაოზე განისვენებს.


    ნაკრძალი კავკასიონის სამხრეთ კალთას 590-დან 3500 მეტრამდე მიუყვება — აღმოსავლეთით აზერბაიჯანია, ქედზე
    კი რუსეთის დაღესტანი. ტერიტორიის დაახლოებით სამოცდაათი პროცენტი ტყეა, უპირველესად აღმოსავლური წიფელი,
    შემდეგ რცხილა და ნეკერჩხალი, მაღლა კი ტყეს მდელო და ქვაღორღი ცვლის. აქ ბინადრობენ დაღესტნური ჯიხვი,
    არჩვი, კეთილშობილი ირემი, მურა დათვი, ფოცხვერი და მგელი, ცაში კი ბატკანძერა დაფრინავს; სულ 150-მდე
    სახეობის ფრინველია აღრიცხული.


    ქალაქის კიდეზე მდგარი ვიზიტორთა ცენტრიდან ერთდღიანი ბილიკები როჭოსა და ნინოსხევის ჩანჩქერებამდე და
    მაჭის ციხემდე მიდის — XI საუკუნის ნაგებობამდე, რომელიც ტყემ ჩაყლაპა. მთავარი ლაშქრობა კი „შავი კლდის“
    მარშრუტია: დაახლოებით 38 კილომეტრი იქით-აქეთ, ორი-სამი დღე, გრძელ ტბამდე — ნაკრძალის უდიდეს მყინვარულ
    ტბამდე, რომლის სიღრმე 14 მეტრს აღწევს და რომელიც დაახლოებით 2860 მეტრზე, რუსეთის საზღვარზე წევს.


    ქვემოთ, ველზე, ცხელა და მტვერია. ბილიკზე ათი წუთის ასვლის შემდეგ კი წიფლები თავზე იკვრება, ჰაერი გრილდება
    და მხოლოდ წყლის ხმაღა ისმის.
  tip: >-
    დაიწყეთ ვიზიტორთა ცენტრიდან: რეგისტრაცია უფასოა და ყველა ბილიკისთვის სავალდებულოა, მოკლე ჩანჩქერის
    ბილიკებისთვისაც, რეინჯერები კი გეტყვიან, რომელი მარშრუტია ღია. მანქანა იქვე დატოვეთ. ერთდღიანი გასვლისთვის
    საკმარისია კარგი სპორტული ფეხსაცმელი, ორი ლიტრი წყალი და ტკიპებისგან დაცვა — გრძელი შარვალი და საწინააღმდეგო
    საშუალება. „შავი კლდის“ ლაშქრობა სხვა საქმეა: სასაზღვრო ზონისთვის პასპორტი წაიღეთ, „მეტეოსა“ და „დემიდოვის“
    თავშესაფრებისთვის — საძილე ტომარა (საწოლები არის, საბნები — არა), საკვები კი სამი დღით; მაღლა თოვლი
    ივნისამდე დევს. კაფეები, მაღაზიები და ბანკომატები ლაგოდეხის ცენტრშია.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) აღმოსავლეთით, საგარეჯოსა და ბაკურციხის გავლით წნორამდე იარეთ,
    იქიდან კი აზერბაიჯანის საზღვრისკენ, ლაგოდეხამდე განაგრძეთ: დაახლოებით 160 კილომეტრი და ორი საათი და
    ორმოცი წუთი, მთელ გზაზე ასფალტია და ეკონომკლასის მანქანა სავსებით საკმარისია. გზა ალაზნის ველს გრძელი,
    სწორი მონაკვეთებით კვეთს და კავკასიონი მთელი დრო წინ გიდგათ. ვიზიტორთა ცენტრი ქალაქის ჩრდილოეთ კიდეზეა
    მითითებული, იქ, სადაც ქუჩები ტყეს ხვდება; მანქანის დასაყენებელი ადგილიც არის. საწვავი წნორში ან ლაგოდეხში
    ჩაასხით. თუ ყვარლისკენ ან სიღნაღისკენ აპირებთ, ორივე საათის სავალზე ან უფრო ახლოსაა.
en:
  name: Lagodekhi Protected Areas
  short: >-
    Georgia's oldest nature reserve, founded in 1912: beech forest, waterfalls and a two-to-three-day
    trek to a glacial lake on the Dagestan ridge.
  body: >-
    **Georgia's first nature reserve exists because a Polish officer fell for a forest and spent half
    a century refusing to let it be cut down.**


    Ludwik Młokosiewicz arrived at the Lagodekhi garrison in 1853 and planted a regimental park. He left
    the army in 1861, was arrested on a charge he was innocent of and exiled, yet came back to serve as
    inspector of forests and stayed at Lagodekhi for the rest of his life. He found some sixty species
    new to science; two carry his name, the Caucasian black grouse and a lemon-yellow peony that English
    gardeners, defeated by the Latin, call Molly the Witch. From 1889 he lobbied for the forest's protection.
    It came in 1912, three years after his death, and he lies in the Lagodekhi cemetery.


    The reserve climbs the southern wall of the Caucasus from 590 to 3,500 metres, between Azerbaijan
    to the east and Russia's Dagestan along the crest. About seventy per cent of it is forest, oriental
    beech above all, then hornbeam and maple, before the trees give way to meadow and scree. East Caucasian
    tur, chamois, red deer, brown bear, lynx and wolf live here, with bearded vultures overhead; some
    150 bird species have been recorded.


    Day trails lead from the visitor centre on the edge of town to the Grouse and Ninoskhevi waterfalls
    and to Machi, an 11th-century castle swallowed by the trees. The great walk is the Black Rock route,
    roughly 38 km there and back over two or three days, to Lake Grdzeli, the reserve's largest glacial
    lake, up to 14 metres deep at about 2,860 metres on the Russian border.


    Down in the valley it is hot and dusty. Ten minutes up the path the beeches close overhead, the air
    cools and the only sound is water.
  tip: >-
    Start at the visitor centre: registration is free and compulsory for every trail, even the short waterfall
    walks, and the rangers will tell you which paths are open. Leave the car there. For a day walk, good
    trainers, two litres of water and something against ticks, such as long trousers and repellent, are
    enough. The Black Rock trek is another matter: carry your passport for the border zone, a sleeping
    bag for the Meteo and Demidovi shelters, which have bunks but no blankets, and food for three days;
    snow lingers high up into June. Cafés, shops and ATMs are in Lagodekhi town.
  route: >-
    Follow the Kakheti Highway (S5) east from Tbilisi through Sagarejo and Bakurtsikhe to Tsnori, then
    carry on towards the Azerbaijani border to Lagodekhi: about 160 km and two hours forty, with asphalt
    all the way and an economy car entirely sufficient. The road crosses the Alazani plain in long straight
    stretches, with the Caucasus rising ahead all the while. The visitor centre is signposted at the northern
    edge of town, where the streets meet the forest, and has space to park. Fuel up in Tsnori or Lagodekhi.
    If you are driving on to Kvareli or Sighnaghi, both are an hour or less away.
ru:
  name: Лагодехские охраняемые территории
  short: >-
    Старейший заповедник Грузии, основанный в 1912 году: буковый лес, водопады и двух-трёхдневный поход
    к ледниковому озеру на Дагестанском хребте.
  body: >-
    **Первый заповедник Грузии существует потому, что польский офицер влюбился в лес и полвека не давал
    его вырубить.**


    Людвиг Млокосевич прибыл в Лагодехский гарнизон в 1853 году и разбил полковой парк. В 1861-м он оставил
    армию, был арестован по обвинению, в котором не был виновен, и сослан, но вернулся, служил лесным
    инспектором и прожил в Лагодехи до конца дней. Он открыл около шестидесяти новых для науки видов;
    два носят его имя — кавказский тетерев и лимонно-жёлтый пион, который английские садоводы, спасовав
    перед латынью, называют «Молли-колдуньей». С 1889 года он добивался охраны леса. Она пришла в 1912-м,
    через три года после его смерти; похоронен он на лагодехском кладбище.


    Заповедник поднимается по южному склону Кавказа от 590 до 3500 метров, между Азербайджаном на востоке
    и российским Дагестаном вдоль гребня. Около семидесяти процентов его площади занимает лес — прежде
    всего восточный бук, затем граб и клён, — пока деревья не уступают место лугам и осыпям. Здесь живут
    восточнокавказский тур, серна, благородный олень, бурый медведь, рысь и волк, а над ними парят бородачи;
    всего отмечено около 150 видов птиц.


    Однодневные тропы ведут от визит-центра на окраине города к водопадам Рочо (Тетеревиному) и Ниносхеви
    и к Мачи — крепости XI века, поглощённой лесом. Главный маршрут — «Чёрная скала», около 38 км туда
    и обратно за два-три дня, к озеру Грдзели, крупнейшему ледниковому озеру заповедника: глубина до 14
    метров, высота около 2860 метров, прямо на границе с Россией.


    Внизу, в долине, жарко и пыльно. Десять минут вверх по тропе — и буки смыкаются над головой, воздух
    остывает, и слышна только вода.
  tip: >-
    Начните с визит-центра: регистрация бесплатна и обязательна для любой тропы, даже для коротких прогулок
    к водопадам, а рейнджеры подскажут, какие маршруты открыты. Машину оставьте там же. Для однодневной
    прогулки хватит хороших кроссовок, двух литров воды и защиты от клещей — длинных брюк и репеллента.
    Поход к Чёрной скале — другое дело: возьмите паспорт для пограничной зоны, спальник для приютов Метео
    и Демидови (нары там есть, одеял нет) и еду на три дня; наверху снег лежит до июня. Кафе, магазины
    и банкоматы — в городе Лагодехи.
  route: >-
    Из Тбилиси по Кахетинскому шоссе (S5) на восток через Сагареджо и Бакурцихе до Цнори, а дальше в сторону
    азербайджанской границы до Лагодехи: около 160 км и два часа сорок минут, асфальт на всём пути, машины
    эконом-класса вполне достаточно. Дорога пересекает Алазанскую долину длинными прямыми, и всё это время
    впереди встаёт Кавказ. Визит-центр обозначен указателями на северной окраине города, там, где улицы
    упираются в лес; есть парковка. Заправьтесь в Цнори или Лагодехи. Если едете дальше в Кварели или
    Сигнахи, до каждого не больше часа.
fa:
  name: مناطق حفاظت‌شدهٔ لاگودخی
  short: >-
    کهن‌ترین ذخیره‌گاه طبیعی گرجستان، بنیان‌گذاری‌شده در ۱۹۱۲: جنگل راش، آبشارها و پیمایشی دو سه‌روزه
    تا دریاچه‌ای یخچالی بر یال داغستان.
  body: >-
    **نخستین ذخیره‌گاه طبیعی گرجستان از آن رو وجود دارد که افسری لهستانی دل به جنگلی باخت و نیم قرن نگذاشت
    آن را ببُرند.**


    لودویک ملوکوسیه‌ویچ در ۱۸۵۳ به پادگان لاگودخی آمد و باغی برای هنگ کاشت. او در ۱۸۶۱ ارتش را ترک کرد،
    به اتهامی که از آن مبرا بود بازداشت و تبعید شد، اما بازگشت، بازرس جنگل‌ها شد و تا پایان عمر در لاگودخی
    ماند. او حدود شصت گونهٔ ناشناخته برای علم یافت؛ دو گونه نام او را بر خود دارند: سیاه‌خروس قفقازی و
    گل صدتومانیِ زرد لیمویی‌ای که باغبانان انگلیسی، درمانده از نام لاتینش، «مالیِ جادوگر» صدایش می‌کنند.
    او از ۱۸۸۹ برای حفاظت از جنگل کوشید. این حفاظت در ۱۹۱۲، سه سال پس از مرگش، محقق شد و او در گورستان
    لاگودخی آرمیده است.


    ذخیره‌گاه از دامنهٔ جنوبی قفقاز، از ۵۹۰ تا ۳۵۰۰ متر، بالا می‌رود؛ میان آذربایجان در شرق و داغستانِ
    روسیه در امتداد ستیغ. حدود هفتاد درصد آن جنگل است، پیش از همه راش شرقی و سپس ممرز و افرا، تا جایی
    که درختان جای خود را به چمنزار و واریزه می‌دهند. تور قفقاز شرقی (بز کوهی قفقازی)، شاموا، مرال، خرس
    قهوه‌ای، سیاه‌گوش و گرگ در این‌جا زندگی می‌کنند و هما بر فرازشان پرواز می‌کند؛ حدود ۱۵۰ گونه پرنده
    ثبت شده است.


    مسیرهای یک‌روزه از مرکز بازدیدکنندگان در حاشیهٔ شهر به آبشارهای روچو (سیاه‌خروس) و نینوسخوی و به ماچی
    می‌رسند، قلعه‌ای از سدهٔ یازدهم که درختان در خود فرویش برده‌اند. پیمایش بزرگ، مسیر صخرهٔ سیاه است:
    حدود ۳۸ کیلومتر رفت و برگشت در دو یا سه روز تا دریاچهٔ گردزلی، بزرگ‌ترین دریاچهٔ یخچالی ذخیره‌گاه،
    با ژرفای تا ۱۴ متر، در ارتفاع حدود ۲۸۶۰ متر و درست بر مرز روسیه.


    پایین در دره هوا گرم و غبارآلود است. ده دقیقه که از کوره‌راه بالا بروید، راش‌ها بالای سرتان به هم
    می‌رسند، هوا خنک می‌شود و تنها صدای آب می‌ماند.
  tip: >-
    از مرکز بازدیدکنندگان آغاز کنید: ثبت‌نام رایگان و برای همهٔ مسیرها، حتی پیاده‌روی‌های کوتاه تا آبشار،
    اجباری است و جنگلبانان می‌گویند کدام مسیرها باز است. خودرو را همان‌جا بگذارید. برای پیاده‌روی یک‌روزه
    کفش ورزشیِ خوب، دو لیتر آب و چیزی در برابر کنه، مانند شلوار بلند و دافع حشرات، کافی است. پیمایش صخرهٔ
    سیاه حکایت دیگری است: گذرنامه را برای منطقهٔ مرزی همراه داشته باشید، کیسه‌خواب برای پناهگاه‌های متئو
    و دمیدوی، که تخت دارند اما پتو نه، و غذای سه روز؛ برف در ارتفاعات تا ژوئن می‌ماند. کافه، فروشگاه و
    خودپرداز در شهر لاگودخی است.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق، از ساگارجو و باکورتسیخه تا تسنوری، دنبال کنید و سپس به
    سمت مرز آذربایجان تا لاگودخی ادامه دهید: حدود ۱۶۰ کیلومتر و دو ساعت و چهل دقیقه، سراسر آسفالت، و خودروی
    اقتصادی کاملاً کافی است. جاده با راسته‌های بلند و مستقیم از دشت آلازانی می‌گذرد و در تمام راه قفقاز
    پیش رویتان قد می‌کشد. مرکز بازدیدکنندگان در لبهٔ شمالی شهر، جایی که خیابان‌ها به جنگل می‌رسند، تابلو
    دارد و جای پارک هم. در تسنوری یا لاگودخی سوخت بزنید. اگر به کوارلی یا سیغناغی می‌روید، هر دو یک ساعت
    یا کمتر راه‌اند.
he:
  name: השטחים המוגנים של לגודחי
  short: >-
    שמורת הטבע הוותיקה ביותר בגאורגיה, שנוסדה ב-1912: יער אשור, מפלים ומסע של יומיים-שלושה אל אגם קרחוני
    על רכס דגסטן.
  body: >-
    **שמורת הטבע הראשונה של גאורגיה קיימת משום שקצין פולני התאהב ביער, ובמשך חצי מאה סירב לתת לכרות אותו.**


    לודוויק מלוקוסייביץ' הגיע לחיל המצב בלגודחי ב-1853 ונטע פארק לגדוד. ב-1861 עזב את הצבא, נעצר באשמה
    שהיה חף ממנה והוגלה, אך שב לכאן, שימש מפקח יערות ונשאר בלגודחי עד סוף ימיו. הוא גילה כשישים מינים
    חדשים למדע; שניים נושאים את שמו — תרנגול-הבר השחור הקווקזי ואדמונית בצהוב-לימון, שגננים אנגלים, שהלטינית
    הביסה אותם, מכנים "מולי המכשפה". מ-1889 פעל להגנת היער. ההגנה הגיעה ב-1912, שלוש שנים אחרי מותו, והוא
    קבור בבית העלמין של לגודחי.


    השמורה מטפסת על המדרון הדרומי של הקווקז מ-590 עד 3,500 מטרים, בין אזרבייג'ן במזרח לדגסטן הרוסית לאורך
    הרכס. כשבעים אחוז משטחה יער, בראש ובראשונה אשור מזרחי, ואחריו קרפינוס ואדר, עד שהעצים מפנים את מקומם
    לאחו ולמפולות אבנים. חיים כאן יעל קווקזי מזרחי (טור), שמואה, אייל אדום, דוב חום, שונר וזאב, ומעליהם
    חגים פרסים; נרשמו כ-150 מיני ציפורים.


    שבילי יום יוצאים ממרכז המבקרים בשולי העיירה אל מפלי רוצ'ו (מפל תרנגול-הבר) ונינוסחבי, ואל מאצ'י, טירה
    מן המאה ה-11 שהיער בלע. המסלול הגדול הוא מסלול הסלע השחור, כ-38 ק"מ הלוך ושוב ביומיים-שלושה, אל אגם
    גרדזלי, האגם הקרחוני הגדול בשמורה, שעומקו עד 14 מטרים, בגובה של כ-2,860 מטרים על גבול רוסיה.


    למטה בעמק חם ומאובק. עשר דקות במעלה השביל, והאשורים מתחברים מעל הראש, האוויר מתקרר והקול היחיד הוא
    קול המים.
  tip: >-
    התחילו במרכז המבקרים: הרישום חינמי וחובה בכל שביל, גם בטיולים הקצרים למפלים, והפקחים יאמרו לכם אילו
    שבילים פתוחים. השאירו את המכונית שם. לטיול יום מספיקים נעלי ספורט טובות, שני ליטרים מים ומשהו נגד
    קרציות, כמו מכנסיים ארוכים ותכשיר דוחה. מסלול הסלע השחור הוא סיפור אחר: קחו דרכון לאזור הגבול, שק
    שינה לבקתות מטאו ודמידובי, שיש בהן דרגשים אך לא שמיכות, ואוכל לשלושה ימים; השלג נשאר בגבהים עד יוני.
    בתי קפה, חנויות וכספומטים יש בעיירה לגודחי.
  route: >-
    מטביליסי סעו מזרחה על כביש קאחתי (S5) דרך סגרג'ו ובקורציחה עד צנורי, והמשיכו לכיוון גבול אזרבייג'ן
    עד לגודחי: כ-160 ק"מ ושעתיים וארבעים דקות, כביש סלול לכל אורכו, ומכונית אקונומי מספיקה לגמרי. הכביש
    חוצה את עמק אלזאני בקטעים ישרים וארוכים, והקווקז מתנשא מולכם כל הזמן. מרכז המבקרים מסומן בשלטים בקצה
    הצפוני של העיירה, במקום שבו הרחובות פוגשים את היער, ויש בו חניה. תדלקו בצנורי או בלגודחי. אם אתם ממשיכים
    לקוורלי או לסיגנאגי, שתיהן במרחק של שעה או פחות.
ar:
  name: مناطق لاغوديخي المحمية
  short: >-
    أقدم محمية طبيعية في جورجيا، أُسست عام 1912: غابة زان وشلالات ورحلة من يومين أو ثلاثة إلى بحيرة جليدية
    على سلسلة داغستان.
  body: >-
    **توجد أول محمية طبيعية في جورجيا لأن ضابطاً بولندياً وقع في غرام غابة، وظلّ نصف قرن يرفض أن تُقطع.**


    وصل لودفيك ملوكوسيفيتش إلى حامية لاغوديخي عام 1853 وغرس فيها حديقة للفوج. ترك الجيش عام 1861، واعتُقل
    بتهمة كان بريئاً منها ونُفي، لكنه عاد ليعمل مفتشاً للغابات وبقي في لاغوديخي حتى آخر حياته. اكتشف نحو
    ستين نوعاً جديداً على العلم، يحمل اثنان منها اسمه: الطيهوج الأسود القوقازي، وفاوانيا بلون الليمون
    الأصفر يسمّيها البستانيون الإنجليز، وقد أعيتهم لاتينيتها، «مولي الساحرة». ومنذ عام 1889 سعى إلى حماية
    الغابة. وجاءت الحماية عام 1912، بعد وفاته بثلاث سنوات، وهو يرقد في مقبرة لاغوديخي.


    تصعد المحمية السفح الجنوبي للقوقاز من 590 إلى 3500 متر، بين أذربيجان شرقاً وداغستان الروسية على امتداد
    القمم. نحو سبعين في المئة منها غابة، الزان الشرقي قبل كل شيء، ثم الشَّرد (البوقيصا) والقيقب، إلى أن
    تفسح الأشجار المكان للمروج والركام الصخري. ويعيش هنا الوعل القوقازي الشرقي (التور) والشامواه والأيل
    الأحمر والدب البني والوشق والذئب، وتحلّق فوقها النسور الملتحية (كاسر العظام)؛ وسُجّل نحو 150 نوعاً
    من الطيور.


    تنطلق دروب اليوم الواحد من مركز الزوار على طرف البلدة إلى شلالَي روتشو (شلال الطيهوج) ونينوسخيفي،
    وإلى ماتشي، قلعة من القرن الحادي عشر ابتلعتها الأشجار. أما الرحلة الكبرى فهي درب الصخرة السوداء، نحو
    38 كم ذهاباً وإياباً في يومين أو ثلاثة، إلى بحيرة غردزيلي، أكبر البحيرات الجليدية في المحمية، بعمق
    يصل إلى 14 متراً وعلى ارتفاع نحو 2860 متراً عند الحدود الروسية.


    في الوادي، في الأسفل، الجو حار ومغبرّ. عشر دقائق صعوداً في الدرب، فتنغلق أشجار الزان فوق الرأس، ويبرد
    الهواء، ولا يبقى إلا صوت الماء.
  tip: >-
    ابدأ من مركز الزوار: التسجيل مجاني وإلزامي لكل الدروب، حتى النزهات القصيرة إلى الشلالات، وسيخبرك الحراس
    أي الدروب مفتوحة. اترك السيارة هناك. لنزهة يوم واحد يكفي حذاء رياضي جيد ولتران من الماء وشيء يقي من
    القراد، كالسراويل الطويلة وطارد الحشرات. أما درب الصخرة السوداء فأمر آخر: احمل جواز سفرك للمنطقة الحدودية،
    وكيس نوم لمأويَي ميتيو وديميدوفي، ففيهما أسرّة بلا بطانيات، وطعاماً لثلاثة أيام؛ ويبقى الثلج في الأعالي
    حتى يونيو. المقاهي والمتاجر وأجهزة الصراف في بلدة لاغوديخي.
  route: >-
    من تبليسي اتبع طريق كاخيتي السريع (S5) شرقاً عبر ساغاريجو وباكورتسيخي حتى تسنوري، ثم تابع نحو الحدود
    الأذربيجانية حتى لاغوديخي: نحو 160 كم وساعتان وأربعون دقيقة، على الإسفلت طوال الطريق، وتكفي تماماً
    سيارة اقتصادية. يعبر الطريق سهل ألازاني في امتدادات طويلة مستقيمة، والقوقاز ينتصب أمامك طوال الوقت.
    مركز الزوار مشار إليه باللافتات عند الطرف الشمالي للبلدة، حيث تلتقي الشوارع بالغابة، وفيه موقف للسيارات.
    تزوّد بالوقود في تسنوري أو لاغوديخي. وإن كنت ستواصل إلى كفاريلي أو سيغناغي، فكلتاهما على بعد ساعة
    أو أقل.
