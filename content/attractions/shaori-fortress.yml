ka:
  name: შაორის ციხე
  short: >-
    სავარაუდოდ ბრინჯაოს ხანის ციხე დუღაბის გარეშე ნაწყობი ბაზალტისგან, 2 752 მეტრზე, ფარავნის თავზე: მხოლოდ
    ფეხით მიაღწევთ, თავის საიდუმლოს კი დღემდე ინახავს.
  body: >-
    **ვიღაცამ 2 752 მეტრის სიმაღლეზე ბაზალტის ლოდები აზიდა, ერთი მუჭა დუღაბის გარეშე ერთმანეთზე დააწყო
    და სახელი არ დაგვიტოვა — ეს შაორია.**


    შაორის მთა ჯავახეთის ზეგანზე, ფარავნის ტბის ჩრდილოეთ წვერის დასავლეთით აღმართულა. მის კლდოვან თხემზე
    ციკლოპური ციხე-სიმაგრეა: უზარმაზარი ბაზალტის ლოდები მშრალად, დუღაბის გარეშეა ერთმანეთზე მორგებული
    — ისე, როგორც სამხრეთ კავკასიის ბრინჯაოს ხანის სიმაგრეებს აგებდნენ. აქ არქეოლოგიური გათხრები არასოდეს
    ჩატარებულა, ამიტომ ზუსტი თარიღი არავინ იცის; ყველაზე ახლო პარალელები — თრიალეთის ყორღანები — ძვ. წ.
    II ათასწლეულის პირველ ნახევარზე მიუთითებს.


    გეგმა უჩვეულოა. სიმაგრე ორ მეზობელ მწვერვალზეა გაყოფილი, რომბისებური მოხაზულობა აქვს, შიგნით კი წრიული
    სივრცეები. ცენტრალურ ნაწილში, ყველაზე მაღალ ადგილას, აღმოსავლეთიდან მხოლოდ ერთი მეტრი სიგანისა და
    1,3 მეტრი სიმაღლის კარით შეხვალთ — თავის დახრა მოგიწევთ.


    რისთვის აშენდა? გულახდილი პასუხი ასეთია: არ ვიცით. თხემი ყოველდღიური ცხოვრებისთვის მეტისმეტად ციცაბო
    და ვიწროა, ამიტომ ზოგი მკვლევარი აქ საკულტო ადგილს ხედავს; მთის ძირას ბრინჯაოს ხანის ნასახლარების
    კვალი კი სხვებს აფიქრებინებს, რომ ომიანობისას ეს ადგილობრივი ბელადების თავშესაფარი იყო. ასეა თუ ისე,
    ასეთი ციხეები იმ ეპოქას ეკუთვნის, როცა კავკასიაში ახალი ელიტა ყალიბდებოდა და მიწასა თუ ხალხს სიმაღლიდან
    განაგებდა.


    XVIII საუკუნეში შაორი ვახუშტი ბატონიშვილმა აღწერა, ლეონ მელიქსეთ-ბეგმა კი იგი 1938 წელს საქართველოს
    მეგალითური კულტურისადმი მიძღვნილ ნაშრომში განიხილა. ადგილობრივები მას ოდესღაც „ქოროღლისაც“ ეძახდნენ
    — თურქული ეპოსის გმირის, ქოროღლის სახელით.


    დადექით კართან და აღმოსავლეთით გაიხედეთ: ფარავანი ქვემოთ ფიქლის დავარდნილ ფილასავით წევს, სიჩუმე კი
    ისეთივე ძველია, როგორც ეს ლოდები.
  tip: >-
    შესვლის საფასური არ არის — არც მანიშნებლებია, არც წყალი, არც თავშესაფარი. იქ, სადაც გრუნტის გზა თავდება,
    მწვერვალი დაახლოებით ერთი კილომეტრით ჩრდილოეთითაა და 350-იოდე მეტრით მაღლა — ციცაბო, უბილიკო ფერდობზე;
    იქით-აქეთ ორ-სამ საათს გაითვალისწინეთ. თუ მანქანას ტამბოვკაში დატოვებთ, მწვერვალამდე პირდაპირი ხაზით
    დაახლოებით 5 კილომეტრი და 670 მეტრი ასასვლელია, მონიშნული ბილიკის გარეშე — ამ შემთხვევაში ნახევარი
    დღე დაგჭირდებათ. წადით ადგილობრივ გიდთან ერთად ან, სულ მცირე, GPS-ტრეკით და ზეგნის მცოდნე თანამგზავრით.
    თოვლი შეიძლება ივნისშიც იდოს, 2 700 მეტრზე კი ამინდი აგვისტოშიც სწრაფად იცვლება — თბილი ტანსაცმელი
    და საწვიმარი თან იქონიეთ. კედლები მშრალი წყობისაა და ლოდები მოძრავია: აღფრთოვანდით, ოღონდ ზედ ნუ აძვრებით.
  route: >-
    თბილისიდან წყნეთისა და კოჯრის გავლით შ36 გზით მანგლისისკენ იარეთ, შემდეგ შ31 გზით წალკის ზეგანი გადაკვეთეთ
    ნინოწმინდის მიმართულებით; ხაშურის გავლით, ე60-ით წასვლა დიდი შემოვლაა. ფარავნის ტბის ჩრდილოეთ ბოლოსთან
    დასავლეთით, ტამბოვკისკენ გადაუხვიეთ — სოფელი XIX საუკუნის 40-იან წლებში დუხობორებმა დააარსეს ტბის
    ჩრდილოეთ ნაპირზე, 2 080 მეტრზე, თბილისიდან დაახლოებით 125 კილომეტრში. სოფლის იქით მთისკენ დაახლოებით
    7-კილომეტრიანი უხეში გრუნტის გზა მიდის; თბილისიდან მის ბოლომდე დაახლოებით 133 კილომეტრი და 3 საათი
    და 20 წუთია, ბოლო მონაკვეთი ხრეშიანი და მიწისაა. აიღეთ მაღალი გამავლობის მანქანა: ზეგნის გზები დაღარულია,
    დახმარება კი შორს. გზას სავსე ავზით გაუდექით.
en:
  name: Shaori Fortress
  short: >-
    A probable Bronze Age fortress of unmortared basalt on a 2,752 m summit above Lake Paravani, reached
    only on foot, and still keeping its purpose to itself.
  body: >-
    **Someone hauled basalt blocks up to 2,752 metres, stacked them without a spoonful of mortar and left
    no name — that is Shaori.**


    Mount Shaori rises on the Javakheti plateau, west of the northern tip of Lake Paravani. On its rocky
    crown lies a cyclopean hillfort: huge basalt blocks fitted dry, in the manner of the Bronze Age strongholds
    of the South Caucasus. No excavation has ever been carried out, so nobody can date it with certainty;
    its closest parallels, the Trialeti burial mounds, point to the first half of the 2nd millennium BC.


    The plan is unusual. The fort is split between two neighbouring peaks, laid out as a rough rhomboid
    with circular spaces inside. The central enclosure, on the highest ground, is entered from the east
    through a gate barely a metre wide and 1.3 metres high — you duck to pass.


    What was it for? The honest answer is that we do not know. The summit is too steep and cramped for
    everyday life, and some scholars see a ritual or sacred purpose; traces of Bronze Age settlement at
    the mountain's foot suggest to others a wartime refuge for local chiefs. Either way, forts like this
    belong to the age when new elites were rising in the Caucasus and learning to command land and people
    from the heights.


    The 18th-century geographer Prince Vakhushti recorded it, and Leon Melikset-Bek described it in his
    1938 study of Georgia's megalithic culture. Locals once also called it Korogli, after Köroğlu, the
    outlaw-hero of Turkic epic.


    Stand at the gate and look east: Paravani lies below like a dropped sheet of slate, and the silence
    is as old as the stones.
  tip: >-
    No fee, no signposts, no water, no shelter. Where the track gives out, about a kilometre south of
    the summit, some 350 m of steep, trackless climbing remain; allow two to three hours there and back.
    Leave the car in Tambovka instead and the summit is about 5 km away as the crow flies and some 670
    m higher, over slopes with no marked trail — reckon on half a day. Go with a local guide, or at the
    very least a GPS track and a companion who knows the plateau. Snow can linger into June, and at 2,700
    m the weather can turn fast even in August, so pack a warm layer and a rain shell. The walls are dry-stone
    and loose: admire them, don't climb them.
  route: >-
    Leave Tbilisi through Tskneti and Kojori on the Sh36 to Manglisi, then take the Sh31 across the Tsalka
    plateau towards Ninotsminda; the E60 via Khashuri is a long detour. Near the northern end of Lake
    Paravani turn west for Tambovka, a village founded by Doukhobors in the 1840s on the lake's northern
    shore at 2,080 m, about 125 km from Tbilisi. Beyond it a rough track, some 7 km long, heads for the
    mountain: about 133 km and 3 h 20 min from Tbilisi to its end, the last stretch gravel and dirt. Take
    an SUV, because the plateau lanes are rutted and help is far away. Set off with a full tank.
ru:
  name: Крепость Шаори
  short: >-
    Крепость, вероятно, бронзового века из базальта без раствора на вершине 2752 м над озером Паравани:
    дойти можно только пешком, а своё назначение она не выдала.
  body: >-
    **Кто-то втащил базальтовые глыбы на высоту 2752 метра, сложил их без единой ложки раствора и не оставил
    имени — это и есть Шаори.**


    Гора Шаори поднимается на Джавахетском нагорье, к западу от северной оконечности озера Паравани. На
    её скалистой макушке лежит циклопическое городище: огромные базальтовые блоки, пригнанные всухую,
    как в крепостях бронзового века на Южном Кавказе. Раскопок здесь не проводили ни разу, поэтому точно
    датировать крепость никто не может; ближайшие аналогии — курганы Триалети — указывают на первую половину
    II тысячелетия до н. э.


    Планировка необычна. Крепость разделена между двумя соседними вершинами и в плане напоминает неправильный
    ромб с круглыми помещениями внутри. В центральную ограду на самой высокой точке входят с востока через
    ворота шириной едва ли в метр и высотой 1,3 метра — пройти можно лишь пригнувшись.


    Зачем она была нужна? Честный ответ — мы не знаем. Вершина слишком крута и тесна для повседневной
    жизни, и одни исследователи видят в крепости ритуальное, священное место; следы поселения бронзового
    века у подножия горы наводят других на мысль об убежище местных вождей на случай войны. Как бы то
    ни было, такие крепости принадлежат эпохе, когда на Кавказе поднималась новая знать, учившаяся править
    землёй и людьми с высоты.


    Крепость упоминал географ XVIII века царевич Вахушти, а Леон Меликсет-Бек описал её в своём исследовании
    мегалитической культуры Грузии (1938). Местные жители называли её также Короглы — по имени Кёроглу,
    благородного разбойника из тюркского эпоса.


    Встаньте у ворот и посмотрите на восток: внизу лежит Паравани, словно оброненный лист сланца, и тишина
    здесь так же стара, как камни.
  tip: >-
    Ни платы, ни указателей, ни воды, ни укрытия. Там, где кончается грунтовка, примерно в километре к
    югу от вершины, остаётся около 350 м крутого подъёма без тропы; закладывайте два-три часа туда и обратно.
    Если оставить машину в Тамбовке, до вершины около 5 км по прямой и примерно 670 м набора высоты по
    склонам без маркированной тропы — тогда закладывайте полдня. Идите с местным проводником или хотя
    бы с GPS-треком и спутником, который знает нагорье. Снег может лежать до июня, а на высоте 2700 м
    погода способна испортиться стремительно даже в августе, так что возьмите тёплый слой и дождевик.
    Стены сложены всухую и неустойчивы: любуйтесь ими, но не карабкайтесь.
  route: >-
    Выезжайте из Тбилиси через Цхнети и Коджори по Sh36 до Манглиси, затем по Sh31 через Цалкское плато
    в сторону Ниноцминды; путь по E60 через Хашури — долгий крюк. У северной оконечности озера Паравани
    сверните на запад, к Тамбовке — селу, основанному духоборами в 1840-х годах на северном берегу озера,
    на высоте 2080 м, примерно в 125 км от Тбилиси. За ним к горе уходит разбитая грунтовка длиной около
    7 км: от Тбилиси до её конца около 133 км и 3 ч 20 мин, последний отрезок — гравий и грунт. Берите
    внедорожник: дороги на плато в колеях, а помощь далеко. Выезжайте с полным баком.
fa:
  name: قلعهٔ شائوری
  short: >-
    دژی احتمالاً از عصر مفرغ، از بازالت بی‌ملاط، بر قله‌ای ۲۷۵۲ متری بالای دریاچهٔ پاراوانی؛ تنها پیاده
    می‌توان به آن رسید و هنوز راز کاربردش را نگه داشته است.
  body: >-
    **کسی تخته‌سنگ‌های بازالت را تا ارتفاع ۲۷۵۲ متری بالا کشید، بی‌آنکه قاشقی ملاط به کار ببرد آن‌ها را
    روی هم چید و نامی از خود به جا نگذاشت — این شائوری است.**


    کوه شائوری در فلات جاواختی، در غرب منتهی‌الیه شمالی دریاچهٔ پاراوانی، سر برافراشته است. بر تارک صخره‌ای
    آن دژی تپه‌ای از نوع «سیکلوپی» قرار دارد: قطعه‌سنگ‌های عظیم بازالت که بی‌ملاط در هم چفت شده‌اند، به
    شیوهٔ دژهای عصر مفرغ در قفقاز جنوبی. هیچ‌گاه در اینجا کاوشی انجام نشده، پس کسی نمی‌تواند با اطمینان
    قدمتش را تعیین کند؛ نزدیک‌ترین نمونه‌های مشابه، گورتپه‌های تریالتی، به نیمهٔ نخست هزارهٔ دوم پیش از
    میلاد اشاره دارند.


    نقشهٔ دژ غیرعادی است. دژ میان دو قلهٔ همسایه تقسیم شده و طرحی لوزی‌شکل و نامنظم دارد، با فضاهایی دایره‌ای
    در درون. به محوطهٔ مرکزی، بر بلندترین نقطه، از سمت شرق و از دروازه‌ای وارد می‌شوند که پهنایش به‌زحمت
    یک متر و بلندی‌اش ۱٫۳ متر است — برای گذشتن باید خم شوید.


    این دژ به چه کار می‌آمد؟ پاسخ صادقانه این است که نمی‌دانیم. قله برای زندگی روزمره بیش از حد پرشیب
    و تنگ است و برخی پژوهشگران در آن کاربردی آیینی یا مقدس می‌بینند؛ آثار سکونتگاهی از عصر مفرغ در دامنهٔ
    کوه دیگران را به این گمان می‌رساند که پناهگاهی برای سرکردگان محلی در زمان جنگ بوده است. در هر حال،
    چنین دژهایی به روزگاری تعلق دارند که نخبگانی تازه در قفقاز سر برمی‌آوردند و می‌آموختند از بلندی‌ها
    بر زمین و مردم فرمان برانند.


    واخوشتی، جغرافی‌دان و شاهزادهٔ سدهٔ ۱۸، از آن یاد کرده و لئون ملیکست‌بک در پژوهش خود دربارهٔ فرهنگ
    مگالیتی گرجستان (۱۹۳۸) آن را توصیف کرده است. مردم محلی زمانی آن را کوراوغلی هم می‌نامیدند، به نام
    کوراوغلو، قهرمانِ یاغیِ حماسهٔ ترکی.


    کنار دروازه بایستید و به شرق بنگرید: پاراوانی در پایین چون ورقه‌ای از سنگ لوح که از دست افتاده باشد
    آرمیده است، و سکوت به دیرینگی همین سنگ‌هاست.
  tip: >-
    نه ورودیه، نه تابلوی راهنما، نه آب و نه پناهگاه. جایی که راه خاکی تمام می‌شود، حدود یک کیلومتر جنوبِ
    قله، هنوز حدود ۳۵۰ متر صعودِ تند و بی‌مسیر باقی است؛ برای رفت‌وبرگشت دو تا سه ساعت در نظر بگیرید.
    اگر خودرو را در تامبوفکا بگذارید، تا قله در خط مستقیم حدود ۵ کیلومتر راه است و حدود ۶۷۰ متر ارتفاع
    باید گرفت، از دامنه‌هایی که هیچ مسیر نشانه‌گذاری‌شده‌ای ندارند؛ در این صورت نیم روز در نظر بگیرید.
    با راهنمای محلی بروید، یا دست‌کم با مسیر GPS و همراهی که فلات را می‌شناسد. برف ممکن است تا ژوئن بماند
    و در ارتفاع ۲۷۰۰ متری، حتی در ماه اوت، هوا می‌تواند ناگهان برگردد؛ پس یک لایهٔ گرم و یک بارانی همراه
    داشته باشید. دیوارها خشکه‌چین و لق‌اند: تماشایشان کنید، اما از آن‌ها بالا نروید.
  route: >-
    از تفلیس از راه تسخنتی و کوجوری، با جادهٔ Sh36 به مانگلیسی بروید، سپس با Sh31 از فلات تسالکا به سمت
    نینوتسمیندا برانید؛ مسیر E60 از خاشوری دور بزرگی است. نزدیک منتهی‌الیه شمالی دریاچهٔ پاراوانی به سمت
    غرب، به‌سوی تامبوفکا بپیچید؛ روستایی که دوخوبورها در دههٔ ۱۸۴۰ بر کرانهٔ شمالی دریاچه و در ارتفاع
    ۲۰۸۰ متری بنیان نهادند، حدود ۱۲۵ کیلومتر دورتر از تفلیس. پس از آن، راهی خاکی و ناهموار به طول حدود
    ۷ کیلومتر به سمت کوه می‌رود: از تفلیس تا پایان این راه حدود ۱۳۳ کیلومتر و ۳ ساعت و ۲۰ دقیقه است و
    بخش پایانی شنی و خاکی است. خودروی شاسی‌بلند بگیرید، چون جاده‌های فلات پر از شیار است و کمک دور. با
    باک پر راه بیفتید.
he:
  name: מבצר שאורי
  short: >-
    מבצר, כנראה מתקופת הברונזה, בנוי בזלת ללא טיט, על פסגה בגובה 2,752 מטרים מעל אגם פרוואני — מגיעים
    אליו רק ברגל, ואת ייעודו הוא עדיין שומר לעצמו.
  body: >-
    **מישהו גרר גושי בזלת לגובה 2,752 מטרים, ערם אותם בלי כף אחת של טיט ולא השאיר את שמו — זהו שאורי.**


    הר שאורי מתנשא ברמת ג'אווחטי, ממערב לקצהו הצפוני של אגם פרוואני. על פסגתו הסלעית שוכן מבצר גבעה ציקלופי:
    גושי בזלת ענקיים המותאמים זה לזה בבנייה יבשה, כדרכם של מעוזי תקופת הברונזה בדרום הקווקז. מעולם לא
    נערכה כאן חפירה ארכאולוגית, ולכן איש אינו יכול לתארך אותו בוודאות; המקבילות הקרובות ביותר, תלי הקבורה
    של תריאלטי, מצביעות על המחצית הראשונה של האלף ה-2 לפנה"ס.


    התוכנית יוצאת דופן. המבצר מפוצל בין שתי פסגות סמוכות, ותוכניתו היא מעוין לא סדיר ובתוכו חללים עגולים.
    אל המתחם המרכזי, בנקודה הגבוהה ביותר, נכנסים ממזרח דרך שער שרוחבו בקושי מטר וגובהו 1.3 מטרים — כדי
    לעבור בו צריך להתכופף.


    למה שימש המקום? התשובה הכנה היא שאיננו יודעים. הפסגה תלולה וצרה מכדי לשמש למגורים של יום-יום, ויש
    חוקרים הרואים בה אתר פולחני או מקודש; שרידי יישוב מתקופת הברונזה למרגלות ההר מרמזים לאחרים על מקלט
    לשעת מלחמה עבור המנהיגים המקומיים. כך או כך, מבצרים כאלה שייכים לעידן שבו קמו בקווקז אליטות חדשות,
    שלמדו לשלוט באדמה ובבני האדם מן הגבהים.


    הגאוגרף בן המאה ה-18, הנסיך ואחושטי, תיעד את המבצר, ולאון מליקסט-בק תיאר אותו במחקרו על התרבות המגליתית
    של גאורגיה משנת 1938. המקומיים כינו אותו פעם גם קורוגלי, על שם כוראוגלו, גיבור פורע החוק מן האפוס
    של העמים הטורקיים.


    עמדו בשער והביטו מזרחה: פרוואני שרוע למטה כמו לוח צפחה שנשמט ארצה, והדממה עתיקה כמו האבנים.
  tip: >-
    אין דמי כניסה, אין שילוט, אין מים ואין מחסה. במקום שבו דרך העפר נגמרת, כקילומטר דרומית לפסגה, נותרת
    עלייה תלולה של כ-350 מטרים בלי שביל; הקצו שעתיים-שלוש הלוך ושוב. אם תשאירו את הרכב בטמבובקה, הפסגה
    רחוקה כ-5 ק"מ בקו אווירי וגבוהה בכ-670 מטרים, על פני מדרונות ללא שביל מסומן — ואז הקצו חצי יום. צאו
    עם מדריך מקומי, או לכל הפחות עם מסלול GPS ועם בן לוויה שמכיר את הרמה. שלג עלול להחזיק מעמד עד יוני,
    ובגובה 2,700 מטרים מזג האוויר יכול להתהפך במהירות גם באוגוסט, לכן קחו שכבה חמה ומעיל גשם. החומות בנויות
    אבן יבשה ורופפות: התפעלו מהן, אבל אל תטפסו עליהן.
  route: >-
    צאו מטביליסי דרך צקנטי וקוג'ורי בכביש Sh36 עד מנגליסי, ומשם בכביש Sh31 לרוחב רמת צאלקה לכיוון נינוצמינדה;
    הדרך בכביש E60 דרך חשורי היא עיקוף ארוך. סמוך לקצהו הצפוני של אגם פרוואני פנו מערבה לטמבובקה, כפר
    שייסדו דוחובורים בשנות ה-40 של המאה ה-19 על החוף הצפוני של האגם, בגובה 2,080 מטרים, כ-125 ק"מ מטביליסי.
    מעבר לכפר יוצאת דרך עפר משובשת, כ-7 ק"מ, לעבר ההר: מטביליסי ועד סוף הדרך כ-133 ק"מ ו-3 שעות ו-20 דקות,
    והקטע האחרון חצץ ועפר. קחו רכב שטח, כי דרכי הרמה מחורצות והעזרה רחוקה. צאו לדרך עם מיכל מלא.
ar:
  name: قلعة شاوري
  short: >-
    قلعة يُرجَّح أنها من العصر البرونزي، من البازلت بلا ملاط، على قمة ارتفاعها 2752 مترًا فوق بحيرة بارافاني،
    لا يُوصَل إليها إلا مشيًا، وما زالت تكتم غايتها.
  body: >-
    **أحدهم جرّ كتل البازلت إلى ارتفاع 2752 مترًا، ورصّها بلا ملعقة واحدة من الملاط، ولم يترك اسمًا —
    تلك هي شاوري.**


    يرتفع جبل شاوري على هضبة جافاخيتي، غربيّ الطرف الشمالي لبحيرة بارافاني. وعلى قمته الصخرية تقوم قلعة
    تلّية من الطراز «السيكلوبي»: كتل بازلتية ضخمة متراصّة بلا ملاط، على طريقة حصون العصر البرونزي في جنوب
    القوقاز. ولم تُجرَ هنا أي تنقيبات قط، ولذلك لا يستطيع أحد تأريخها على وجه اليقين؛ غير أن أقرب نظائرها،
    تلال الدفن في تريالتي، تشير إلى النصف الأول من الألف الثاني قبل الميلاد.


    تخطيطها غير مألوف. فالقلعة مقسومة بين قمتين متجاورتين، ومخطّطها معيّن غير منتظم تتخلّله فضاءات دائرية.
    ويُدخل إلى الحيّز المسوَّر المركزي، في أعلى نقطة، من جهة الشرق عبر بوابة لا يكاد عرضها يبلغ مترًا
    وارتفاعها 1.3 متر — فلا تعبرها إلا منحنيًا.


    ما الغاية منها؟ الجواب الصادق أننا لا نعرف. فالقمة أشدّ انحدارًا وأضيق من أن تصلح للحياة اليومية،
    ويرى بعض الباحثين أنها كانت ذات وظيفة طقسية أو مقدّسة؛ بينما توحي آثار استيطان من العصر البرونزي عند
    سفح الجبل لآخرين بأنها كانت ملاذًا لزعماء محليين في أوقات الحرب. وأيًّا كان الأمر، فإن حصونًا كهذه
    تنتمي إلى الحقبة التي نشأت فيها نخب جديدة في القوقاز وتعلّمت أن تحكم الأرض والناس من الأعالي.


    وقد دوّنها الجغرافي الأمير فاخوشتي في القرن الثامن عشر، ووصفها ليون ميليكسيت-بيك في دراسته عن الثقافة
    الميغاليثية في جورجيا (1938). وكان السكان المحليون يسمّونها أيضًا كوروغلي، نسبةً إلى كوروغلو، البطل
    الخارج على القانون في ملاحم الشعوب التركية.


    قف عند البوابة وانظر شرقًا: بارافاني ممدودة في الأسفل كلوح من الأردواز سقط من يد، والصمت هنا عتيق
    عتق الحجارة.
  tip: >-
    لا رسوم ولا لافتات ولا ماء ولا مأوى. حيث ينتهي المسلك الترابي، على بعد نحو كيلومتر جنوب القمة، يبقى
    صعود شديد الانحدار بلا درب يقارب 350 مترًا؛ فاحسب ساعتين إلى ثلاث ذهابًا وإيابًا. وإن تركت السيارة
    في تامبوفكا فالقمة تبعد نحو 5 كم في خط مستقيم وترتفع نحو 670 مترًا، عبر منحدرات بلا درب معلَّم؛ وعندها
    احسب نصف يوم. اذهب مع مرشد محلي، أو على الأقل مع مسار GPS ورفيق يعرف الهضبة. قد يبقى الثلج حتى يونيو/حزيران،
    وعلى ارتفاع 2700 متر قد ينقلب الطقس سريعًا حتى في أغسطس/آب، فاحمل طبقة دافئة وسترة واقية من المطر.
    الجدران مرصوصة بلا ملاط وغير ثابتة: تأمّلها، ولا تتسلّقها.
  route: >-
    اخرج من تبليسي عبر تسخنيتي وكوجوري على الطريق Sh36 حتى مانغليسي، ثم اسلك الطريق Sh31 عبر هضبة تسالكا
    باتجاه نينوتسميندا؛ أما الطريق E60 عبر خاشوري فالتفاف طويل. وقرب الطرف الشمالي لبحيرة بارافاني انعطف
    غربًا نحو تامبوفكا، وهي قرية أسسها الدوخوبور في أربعينيات القرن التاسع عشر على الضفة الشمالية للبحيرة
    على ارتفاع 2080 مترًا، على بعد نحو 125 كم من تبليسي. وبعدها يتجه مسلك وعر، طوله نحو 7 كم، نحو الجبل:
    نحو 133 كم و3 ساعات و20 دقيقة من تبليسي حتى نهايته، والجزء الأخير حصى وتراب. استأجر سيارة دفع رباعي،
    فدروب الهضبة مليئة بالأخاديد والنجدة بعيدة. وانطلق بخزان ممتلئ.
