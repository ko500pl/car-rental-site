ka:
  name: გოგიას ციხე
  short: >-
    ბორჯომის თავზე, ქედზე შემორჩენილი ოთხკუთხა კოშკი: ცენტრიდან ათიოდე-ოციოდე წუთის აღმართია და მთელი
    ხეობა ხელისგულივით გადაგეშლებათ.
  body: >-
    **სანამ ბორჯომი კურორტი გახდებოდა, აქ გზას დარაჯობდნენ — და გოგიას კოშკი დღესაც ყარაულზე დგას.**


    შუა საუკუნეებში მტკვრის ეს ხეობა თორის მხარეს ეკუთვნოდა — გზაჯვარედინს, საიდანაც დასავლეთ, აღმოსავლეთ
    და სამხრეთ საქართველოსკენ მიმავალი გზები იყოფოდა. ქალაქს დღესაც გორებიდან სამი ციხე დაჰყურებს: გოგიასი,
    პეტრესი და სალისა. გოგიას ციხე მათ შორის ყველაზე ახლოა. გადმოცემა მის აშენებას ადგილობრივ ფეოდალს,
    გოგია ავალიშვილს, მიაწერს; ავალიშვილები ამ ხეობას XVI საუკუნიდან XIX საუკუნემდე ფლობდნენ. სპეციალისტები
    ციხის წყობას ორ ეპოქას მიაკუთვნებენ — X–XIV და XVII–XVIII საუკუნეებს.


    რაც დღეს დგას, მოკრძალებულია, მაგრამ ნამდვილი. კლდის ქვით ნაგები ოთხკუთხა, ორსართულიანი კოშკი დაახლოებით
    რვა მეტრზეა აზიდული; მას ერთი კარი აქვს, კედლებში კი სათოფურებია დატანებული. მეორე კოშკი და გალავნის
    კედელი ფერდობზე ჩამოიშალა. გვერდით საინფორმაციო დაფაა. ქვემოთ ქალაქი მდინარის გაყოლებაზე იშლება: ძველი
    საკურორტო უბნის სახურავები, პარკის მწვანე მასივი, ხეობაში გაკლაკნილი რკინიგზა.


    ციხემ ნამდვილი ბრძოლაც ნახა — თანაც თავისი ხანგრძლივი ცხოვრების ბოლოს. რუსეთ-ოსმალეთის ომის დროს,
    1828 წლის 21 ივლისს, ოსმალთა ჯარი აქ მდგარ რუსულ საგუშაგოს დაესხა თავს. ქართლის მილიციის ორმოცკაციანმა
    რაზმმა შტაბს-კაპიტან თავად ვეზირიშვილის მეთაურობით მტერს უკან დაახევინა. ისტორიკოსმა ვასილი პოტომ
    ეს ბრძოლა ქართული მილიციის სახელოვან ეპიზოდებს შორის მოიხსენია.


    ლეგენდა უფრო პირქუშ ამბავს ჰყვება. ორი ძმა ერთმანეთს მტრად გადაჰკიდებოდა. შესარიგებლად გოგიას ციხეზე
    დიდი ნადიმი გამართეს და ძმები მართლაც შერიგდნენ — სანამ ღვინომ თავისი არ გაიტანა: შუღლი ხელახლა აგიზგიზდა
    და ერთმანეთი დახოცეს.


    ამოდით საღამოს, როცა ხეობა ჩრდილით ივსება და მზე ყველაზე ბოლოს სწორედ ამ კოშკს ეთხოვება.
  tip: >-
    შესვლა უფასოა, ციხე ყოველთვის ღიაა. ბილიკი ბორჯომის მხარეთმცოდნეობის მუზეუმის მიდამოებიდან იწყება
    — ციხე თითქმის პირდაპირ მუზეუმს დაჰყურებს. აღმართს ათიდან ოც წუთამდე მოანდომებთ: ალაგ-ალაგ ციცაბოა,
    მაგრამ ტექნიკურად მარტივი, ამიტომ ჩვეულებრივი ფეხსაცმელიც საკმარისია, თუმცა წვიმის შემდეგ ბილიკი ტალახიანდება.
    ზემოთ არც წყალია, არც საპირფარეშო, არც კაფე — ყველაფერი ქვემოთ, ქალაქშია. ხეობას ყველაზე რბილი შუქი
    ნაშუადღევს ადგას. ფეხით ადვილად შეუთავსებთ მუზეუმს, ცენტრალურ პარკსა და ლიკანს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 120 კილომეტრი იარეთ ხაშურის გასაყრელამდე,
    შემდეგ ს8 გზით სამხრეთისკენ, ბორჯომის ხეობაში შეუხვიეთ — სულ 160 კილომეტრი და დაახლოებით 2 საათი და
    20 წუთი, მთელ გზაზე ასფალტია. საწვავს ს1-ზეც ადვილად იპოვით და ბორჯომშიც. მანქანა ცენტრში, მუზეუმთან
    ახლოს დატოვეთ: ციხემდე საავტომობილო გზა არ ადის, მხოლოდ ბილიკი. ეკონომკლასის ნებისმიერი მანქანაც საკმარისია.
    ს8 მთავარი გზაა და მთელი წელი მოქმედებს, თუმცა ძლიერი თოვლის შემდეგ ზამთრის საბურავები ზედმეტი არ
    იქნება.
en:
  name: Gogia Fortress (Borjomi)
  short: >-
    A square stone tower on the ridge above Borjomi, a 10–20-minute climb from the centre, with the whole
    spa valley laid out at your feet.
  body: >-
    **Before Borjomi was a spa it was a checkpoint, and Gogia's tower is still standing guard over the
    road.**


    In the Middle Ages this stretch of the Mtkvari gorge belonged to the province of Tori, a crossroads
    where the routes to western, eastern and southern Georgia parted. Three forts — Gogia, Petra and Sali
    — still look down on the town from its hills, and Gogia is the nearest. Tradition credits its building
    to a local lord, Gogia Avalishvili; the Avalishvilis held the gorge from the 16th century into the
    19th. Georgian specialists date the masonry to two periods, the 10th–14th and the 17th–18th centuries.


    What stands today is small but genuine. A square, two-storey tower of rough fieldstone rises about
    eight metres, with a single doorway and gun loops cut through its walls; a second tower and the curtain
    wall have crumbled into the slope. An information board stands beside it. Below, the town unrolls
    along the river: the roofs of the old resort quarter, the green mass of the park, the railway threading
    the valley.


    The fort saw real fire late in its long life. During the Russo-Ottoman war, on 21 July 1828, an Ottoman
    force attacked the Russian outpost stationed here. A forty-man detachment of Kartli militia under
    Staff Captain Prince Vezirishvili drove them back — a stand the historian Vasily Potto counted among
    the militia's finest episodes.


    Legend tells a darker story. Two feuding brothers were brought to a great feast in the fortress to
    make peace, and they did — until the wine had its say, the quarrel flared again, and they killed each
    other.


    Climb up in the evening, when the valley fills with shadow and this tower is the last thing the sun
    lets go of.
  tip: >-
    Free and always open. The path starts near the Borjomi Museum of Local Lore — the fortress sits almost
    directly above it — and takes 10–20 minutes: steep in places but not technical, so ordinary shoes
    will do, though it turns muddy after rain. There is no water, toilet or café at the top; everything
    is back down in town. Late afternoon brings the softest light over the valley. On foot it pairs easily
    with the museum, the Central Park and Likani.
  route: >-
    From Tbilisi take the S1 (E60) west for about 120 km to the Khashuri junction, then turn south onto
    the S8 into the Borjomi gorge — 160 km and about 2 h 20 min in all, asphalt the whole way. Fuel is
    easy to find on the S1 and in Borjomi itself. Leave the car in the centre, near the museum: no road
    climbs to the fortress, only the footpath. Any economy car is fine. The S8 is a main road open year-round,
    but after heavy snow winter tyres are worth having.
ru:
  name: Крепость Гогия (Боржоми)
  short: >-
    Квадратная каменная башня на хребте над Боржоми: 10–20 минут подъёма от центра — и вся курортная долина
    у ваших ног.
  body: >-
    **Прежде чем стать курортом, Боржоми был заставой, и башня Гогия по-прежнему стережёт дорогу.**


    В Средние века этот участок ущелья Мтквари входил в область Тори — перекрёсток, где расходились пути
    в Западную, Восточную и Южную Грузию. Три крепости — Гогия, Петра и Сали — до сих пор смотрят на город
    со своих холмов, и Гогия ближе всех. Предание приписывает её постройку местному владетелю Гогия Авалишвили;
    Авалишвили владели ущельем с XVI века вплоть до XIX. Грузинские специалисты относят кладку к двум
    периодам — X–XIV и XVII–XVIII векам.


    Сохранилось немногое, зато подлинное. Квадратная двухэтажная башня из грубого бутового камня поднимается
    метров на восемь; в ней единственный дверной проём, а стены прорезаны бойницами. Вторая башня и крепостная
    стена осыпались на склон. Рядом стоит информационный стенд. Внизу вдоль реки разворачивается город:
    крыши старого курортного квартала, зелёный массив парка, нитка железной дороги в долине.


    На излёте своей долгой жизни крепость повидала и настоящий бой. В русско-турецкую войну, 21 июля 1828
    года, османский отряд атаковал стоявший здесь русский пост. Сорок картлийских ополченцев под началом
    штабс-капитана князя Везиришвили отбросили нападавших — историк Василий Потто причислял этот бой к
    лучшим страницам истории ополчения.


    Легенда рассказывает историю помрачнее. Двух враждующих братьев привели в крепость на большой пир,
    чтобы помирить, — и они помирились, пока не заговорило вино: ссора вспыхнула снова, и братья убили
    друг друга.


    Поднимитесь сюда вечером, когда долину заливает тень, а эта башня — последнее, что отпускает солнце.
  tip: >-
    Вход свободный, крепость открыта всегда. Тропа начинается у Боржомского краеведческого музея — крепость
    стоит почти прямо над ним — и занимает 10–20 минут: местами круто, но без технических сложностей,
    так что хватит обычной обуви; правда, после дождя становится грязно. Наверху нет ни воды, ни туалета,
    ни кафе — всё это внизу, в городе. Самый мягкий свет над долиной — ближе к вечеру. Пешком крепость
    легко совместить с музеем, Центральным парком и Ликани.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 120 км до развязки у Хашури, затем на юг по S8 в Боржомское
    ущелье — всего 160 км и около 2 ч 20 мин, асфальт на всём пути. Заправки есть на S1 и в самом Боржоми.
    Машину оставьте в центре, у музея: к крепости ведёт не дорога, а только пешая тропа. Подойдёт любой
    автомобиль эконом-класса. S8 — магистраль, открытая круглый год, но после сильного снегопада зимняя
    резина не помешает.
fa:
  name: قلعهٔ گوگیا (بورجومی)
  short: >-
    برجی سنگی و چهارگوش بر یال کوهی بالای بورجومی؛ ۱۰ تا ۲۰ دقیقه سربالایی از مرکز شهر، و سراسر درهٔ آب‌گرم
    زیر پایتان.
  body: >-
    **بورجومی پیش از آنکه شهر آب‌گرم شود پاسگاه بود، و برج گوگیا هنوز هم بر جاده نگهبانی می‌دهد.**


    در سده‌های میانه این بخش از تنگهٔ متکواری جزو ولایت توری بود؛ چهارراهی که راه‌های غرب و شرق و جنوب
    گرجستان در آن از هم جدا می‌شدند. سه دژ — گوگیا، پترا و سالی — هنوز از فراز تپه‌ها به شهر می‌نگرند
    و گوگیا از همه نزدیک‌تر است. روایت‌ها ساختنش را به یکی از بزرگان محلی، گوگیا آوالیشویلی، نسبت می‌دهند؛
    خاندان آوالیشویلی از سدهٔ ۱۶ تا سدهٔ ۱۹ بر این تنگه فرمان می‌راندند. متخصصان گرجی سنگ‌چینی آن را از
    دو دوره می‌دانند: سده‌های ۱۰ تا ۱۴ و سده‌های ۱۷ تا ۱۸.


    آنچه امروز برجاست کوچک است، اما اصیل. برجی چهارگوش و دوطبقه از لاشه‌سنگ‌های زمخت حدود هشت متر قد برافراشته،
    با تنها یک درگاه و مزغل‌هایی که در دیوارهایش گشوده‌اند؛ برج دوم و دیوار بارو فروریخته و در دامنه پراکنده
    شده‌اند. کنار برج تابلویی اطلاع‌رسانی ایستاده است. پایین‌تر، شهر در امتداد رود گسترده است: بام‌های
    محلهٔ قدیمی آب‌گرم، تودهٔ سبز پارک، و راه‌آهنی که از میان دره می‌گذرد.


    این دژ در واپسین دوران عمر درازش جنگ واقعی هم به خود دید. در جریان جنگ روسیه و عثمانی، در ۲۱ ژوئیهٔ
    ۱۸۲۸، نیرویی عثمانی به پاسگاه روسیِ مستقر در اینجا حمله کرد. دسته‌ای چهل‌نفره از میلیشیای کارتلی به
    فرماندهی سروانِ ستاد، شاهزاده وزیریشویلی، مهاجمان را عقب راند؛ ایستادگی‌ای که واسیلی پوتو، مورخ روس،
    آن را از درخشان‌ترین صحنه‌های کارنامهٔ این میلیشیا شمرده است.


    اما افسانه داستانی تیره‌تر روایت می‌کند. دو برادر را که با هم دشمنی داشتند برای آشتی به ضیافتی بزرگ
    در دژ آوردند و آشتی هم کردند — تا آنکه شراب زبان گشود، نزاع دوباره شعله کشید و آن دو یکدیگر را کشتند.


    عصر بالا بروید، وقتی دره از سایه پر می‌شود و این برج آخرین چیزی است که خورشید رهایش می‌کند.
  tip: >-
    ورود رایگان است و دژ همیشه باز است. کوره‌راه از نزدیکی موزهٔ تاریخ محلی بورجومی آغاز می‌شود — دژ تقریباً
    درست بالای آن قرار دارد — و ۱۰ تا ۲۰ دقیقه طول می‌کشد: جاهایی شیب تندی دارد اما فنی نیست، پس کفش معمولی
    کافی است، هرچند پس از باران گِلی می‌شود. بالا نه آب هست، نه دست‌شویی و نه کافه؛ همه‌چیز پایین، در
    شهر است. نرم‌ترین نور بر دره در اواخر بعدازظهر می‌تابد. پیاده به‌آسانی می‌توان دیدار دژ را با موزه،
    پارک مرکزی و لیکانی یکجا کرد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۲۰ کیلومتر به سمت غرب تا تقاطع خاشوری بروید، سپس به جنوب، به جادهٔ
    S8، بپیچید و وارد تنگهٔ بورجومی شوید؛ روی‌هم ۱۶۰ کیلومتر و حدود ۲ ساعت و ۲۰ دقیقه، سراسر آسفالت. سوخت
    در طول S1 و در خود بورجومی به‌آسانی پیدا می‌شود. خودرو را در مرکز شهر، نزدیک موزه، پارک کنید: هیچ
    جاده‌ای تا دژ بالا نمی‌رود، فقط کوره‌راه پیاده. هر خودروی اقتصادی کافی است. S8 جاده‌ای اصلی است که
    در تمام سال باز است، اما پس از بارش سنگین برف، لاستیک زمستانی ارزشش را دارد.
he:
  name: מבצר גוגיה (בורג'ומי)
  short: מגדל אבן מרובע על הרכס שמעל בורג'ומי, 10–20 דקות טיפוס מהמרכז, ועמק עיירת המרפא כולו פרוש לרגליכם.
  body: >-
    **לפני שבורג'ומי הפכה לעיירת מרפא היא הייתה עמדת שמירה, ומגדל גוגיה עדיין עומד על משמרתו מעל הדרך.**


    בימי הביניים השתייך קטע זה של ערוץ המטקוורי למחוז טורי — צומת דרכים שבו נפרדו הנתיבים למערב גאורגיה,
    למזרחה ולדרומה. שלושה מבצרים — גוגיה, פטרה וסאלי — עדיין משקיפים על העיר מגבעותיה, וגוגיה הוא הקרוב
    שבהם. המסורת מייחסת את בנייתו לאציל מקומי, גוגיה אבלישווילי; בית אבלישווילי החזיק בערוץ מהמאה ה-16
    ועד המאה ה-19. מומחים גאורגים מתארכים את הבנייה לשתי תקופות: המאות ה-10 עד ה-14 והמאות ה-17 עד ה-18.


    מה שעומד כאן היום קטן, אבל אמיתי. מגדל מרובע בן שתי קומות, בנוי מאבני שדה גסות, מתנשא לגובה של כשמונה
    מטרים; יש בו פתח כניסה יחיד, ובקירותיו פעורים חרכי ירי. מגדל שני וחומת המבצר התפוררו והתפזרו במורד
    המדרון. לצדו ניצב שלט הסבר. למטה העיר משתרעת לאורך הנהר: גגות רובע המרפא הישן, הגוש הירוק של הפארק,
    ומסילת הרכבת המשתחלת לאורך העמק.


    בשלהי חייו הארוכים ידע המבצר גם קרב של ממש. במלחמה הרוסית–עות'מאנית, ב-21 ביולי 1828, תקף כוח עות'מאני
    את המוצב הרוסי שהוצב כאן. יחידה בת ארבעים לוחמים ממיליציית קרתלי, בפיקודו של סרן-המטה הנסיך וזירישווילי,
    הדפה את התוקפים — עמידה שההיסטוריון וסילי פוטו מנה בין הפרקים המפוארים ביותר בתולדות המיליציה.


    האגדה מספרת סיפור אפל יותר. שני אחים מסוכסכים הובאו למשתה גדול במבצר כדי שישלימו ביניהם, והם אכן השלימו
    — עד שהיין אמר את דברו, הריב ניצת מחדש והשניים הרגו זה את זה.


    טפסו לכאן לעת ערב, כשהעמק מתמלא צללים והמגדל הזה הוא הדבר האחרון שהשמש מרפה ממנו.
  tip: >-
    הכניסה חופשית והמקום פתוח תמיד. השביל מתחיל ליד המוזיאון לתולדות האזור של בורג'ומי — המבצר ניצב כמעט
    ישירות מעליו — והעלייה נמשכת 10–20 דקות: תלולה בקטעים אך לא טכנית, כך שנעליים רגילות יספיקו, אם כי
    אחרי גשם השביל נעשה בוצי. למעלה אין מים, שירותים או בית קפה; הכול נמצא למטה, בעיר. האור הרך ביותר
    על העמק הוא בשעות אחר הצהריים המאוחרות. ברגל קל לשלב את הביקור עם המוזיאון, הפארק המרכזי וליקאני.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) כ-120 ק"מ עד צומת חשורי, ומשם פנו דרומה לכביש S8 אל ערוץ בורג'ומי
    — 160 ק"מ וכשעתיים ו-20 דקות בסך הכול, אספלט לכל אורך הדרך. קל למצוא דלק לאורך S1 ובבורג'ומי עצמה.
    השאירו את הרכב במרכז, ליד המוזיאון: שום כביש אינו עולה אל המבצר, רק שביל הליכה. כל רכב חסכוני יתאים.
    S8 הוא כביש ראשי הפתוח כל השנה, אבל אחרי שלג כבד כדאי להצטייד בצמיגי חורף.
ar:
  name: قلعة غوغيا (بورجومي)
  short: >-
    برج حجري مربّع على الحافة الجبلية فوق بورجومي، على بُعد 10–20 دقيقة صعودًا من وسط البلدة، ووادي المنتجع
    كلّه ممدود عند قدميك.
  body: >-
    **قبل أن تصير بورجومي منتجعًا كانت نقطة حراسة، وما زال برج غوغيا يحرس الطريق حتى اليوم.**


    في العصور الوسطى كان هذا الجزء من مضيق متكفاري تابعًا لإقليم توري، وهو ملتقى طرق تتفرّع عنده المسالك
    إلى غرب جورجيا وشرقها وجنوبها. ولا تزال ثلاث قلاع — غوغيا وبيترا وسالي — تطلّ على البلدة من تلالها،
    وغوغيا أقربها. ويَنسب التقليد بناءها إلى سيّد محلي يُدعى غوغيا أفاليشفيلي؛ وقد حكمت أسرة أفاليشفيلي
    المضيق من القرن السادس عشر حتى القرن التاسع عشر. ويؤرّخ المختصون الجورجيون البناء بفترتين: من القرن
    العاشر إلى الرابع عشر، ومن القرن السابع عشر إلى الثامن عشر.


    ما بقي قائمًا اليوم صغير، لكنه أصيل. برج مربّع من طابقين، مبنيّ من حجارة الحقول الخشنة، يرتفع نحو
    ثمانية أمتار، له مدخل واحد وفي جدرانه فتحات للرمي بالبنادق؛ أما البرج الثاني والسور فقد تهاويا على
    المنحدر. وإلى جانبه لوحة تعريفية. وفي الأسفل تنبسط البلدة على امتداد النهر: أسطح حيّ المنتجع القديم،
    وكتلة الحديقة الخضراء، وسكة الحديد تشقّ طريقها عبر الوادي.


    وقد شهدت القلعة قتالًا حقيقيًا في أواخر عمرها الطويل. ففي أثناء الحرب الروسية العثمانية، في 21 يوليو/تموز
    1828، هاجمت قوة عثمانية المخفر الروسي المرابط هنا، فصدّتها مفرزة من أربعين رجلًا من ميليشيا كارتلي
    بقيادة الأمير فيزيريشفيلي، برتبة نقيب أركان — وهو صمود عدّه المؤرخ فاسيلي بوتو من أروع صفحات تلك الميليشيا.


    أما الأسطورة فتروي حكاية أشدّ قتامة: جيء بأخوين متخاصمين إلى وليمة كبيرة في القلعة ليتصالحا، فتصالحا
    فعلًا — إلى أن قال النبيذ كلمته، فاشتعل الخلاف من جديد وقتل كلٌّ منهما الآخر.


    اصعد إليها في المساء، حين يمتلئ الوادي بالظلال ويغدو هذا البرج آخر ما تفلته الشمس من يدها.
  tip: >-
    الدخول مجاني والموقع مفتوح دائمًا. يبدأ الممشى قرب متحف بورجومي للتاريخ المحلي — فالقلعة تقوم فوقه
    مباشرة تقريبًا — ويستغرق الصعود 10–20 دقيقة: شديد الانحدار في بعض المواضع لكنه لا يتطلّب مهارة تقنية،
    فتكفي الأحذية العادية، وإن كان يصبح موحلًا بعد المطر. لا ماء في الأعلى ولا دورات مياه ولا مقهى؛ فكل
    ذلك في البلدة أسفل التل. وأنعم ضوء على الوادي يكون في أواخر العصر. ويسهل الجمع سيرًا على الأقدام بين
    القلعة والمتحف والحديقة المركزية وليكاني.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غربًا نحو 120 كم حتى تقاطع خاشوري، ثم انعطف جنوبًا إلى الطريق S8 داخل
    مضيق بورجومي — 160 كم ونحو ساعتين و20 دقيقة إجمالًا، والطريق معبّد بالأسفلت طوال المسافة. الوقود متوفّر
    بسهولة على S1 وفي بورجومي نفسها. اترك السيارة في وسط البلدة قرب المتحف: فلا طريق يصعد إلى القلعة،
    بل ممشى للمشاة فقط. أي سيارة اقتصادية تفي بالغرض. الطريق S8 طريق رئيسي مفتوح طوال العام، لكن الإطارات
    الشتوية تستحق العناء بعد تساقط الثلوج بغزارة.
