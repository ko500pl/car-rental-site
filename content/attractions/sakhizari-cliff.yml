ka:
  name: სახიზარის კლდე
  short: >-
    წვიმისგან დაღარული ვულკანური კლდეები თერგის ხეობაში, სიონთან. სახელი თავშესაფარს ნიშნავს: მტრის მოსვლისას
    სოფელი აქ იხიზნებოდა.
  body: >-
    **სახიზარი თავშესაფარს ნიშნავს — და საუკუნეების განმავლობაში ეს კლდეები სწორედ თავშესაფარი იყო: როცა
    თერგის ხეობას მტერი მოადგებოდა, სოფლის ხალხი კლდეებს შეეხიზნებოდა და ელოდა.**


    კლდეები ქაბარჯინას ეკუთვნის — დიდი ხნის წინ მიყუჩებულ ვულკანს, რომელიც 3140 მეტრზე მაღლა აზიდულა თერგისა
    და სნოსწყლის წყალგამყოფზე, მყინვარწვერის მახლობლად, მისი ვულკანური ჯგუფის ნაწილად. მწვერვალი ლავის
    ბრტყელი თხემია, დასავლეთის კალთა კი სულ სხვა ამბავია: უხვმა ნალექებმა ანდეზიტ-დაციტური ტუფი, ტუფ-ბრექჩია
    და ლავა ღარებად, ქიმებად და სვეტებად დაღარა, ძირში კი გამოზიდვის ვეება კონუსი დატოვა, რომელიც თერგს
    ებჯინება. ფერდობებზე დეკა ხარობს.


    ადგილობრივები ამ ადგილს „კლდეების ნანგრევებს“ ეძახიან, და სიონთან, გზიდან, სახელი თავისთავად ცხადდება:
    სვეტები და ჩამოშლილი ქიმები ისე დგას, თითქოს ციხე ჩამოიქცაო — ოღონდ ეს ციხე არავის აუგია.


    სახიზარი ყაზბეგის დაცული ტერიტორიების ბუნების ძეგლებს შორისაა, აბანოს მინერალურ ტბასთან, თრუსოსა და
    ჯვრის უღელტეხილის ტრავერტინებთან ერთად. თქმულებას არც ბრძოლის სახელი ახლავს, არც თარიღი — ის მხოლოდ
    ადგილის სახელში ცოცხლობს. გააჩერეთ, ახედეთ და წარმოიდგინეთ, როგორ აძვრებოდით იქ ზურგზე აკიდებული მთელი
    ქონებით.
  tip: >-
    შესვლა უფასოა; არც მცველია, არც რაიმე მომსახურება. სახიზარით ქვემოდან ისიამოვნეთ: სვეტებამდე მონიშნული
    ბილიკის შესახებ ჩვენ არაფერი ვიცით, ეროზიით დაშლილი ვულკანური ქანი კი ფხვიერი და ციცაბოა — მაღალი
    კლდეები 3000 მეტრზე მაღალ მთას ეკუთვნის და არა გზისპირა სასეირნო ადგილს. მანქანა მხოლოდ გზისპირა მოედანზე
    გააჩერეთ, არა სავალ ნაწილზე: ამ გზაზე სატვირთოები დღე და ღამე დადიან. დასავლეთის კალთა შუადღის შემდეგ
    ნათდება. საჭმელი, საწვავი და საპირფარეშო სტეფანწმინდაშია, დაახლოებით 12 კილომეტრში. ზამთარში ს3-ის
    ჯვრის უღელტეხილის მონაკვეთი შეიძლება დაიკეტოს ან კოლონით იმოძრაონ — გასვლამდე გზის მდგომარეობა გადაამოწმეთ.
  route: >-
    144 კმ, დაახლოებით 2 საათი და 45 წუთი, მთელ გზაზე ასფალტია. თბილისიდან ს1 მაგისტრალით გადით, მცხეთასთან
    ჩრდილოეთით, ს3-ზე — საქართველოს სამხედრო გზაზე გადაუხვიეთ და ჟინვალს, ანანურს, ფასანაურსა და გუდაურს
    გაუყევით. ჯვრის უღელტეხილის (თითქმის 2400 მ) გადავლის შემდეგ კობის გავლით თერგის ხეობაში ეშვებით.
    კლდეები გზის თავზე, სიონის მიდამოებში აღმართულა, სტეფანწმინდამდე დაახლოებით 12 კილომეტრით ადრე. გვიანი
    გაზაფხულიდან შემოდგომამდე ეკონომ-კლასის მანქანაც საკმარისია; ზამთარში ჯაჭვები იქონიეთ ან SUV იქირავეთ
    და უღელტეხილისთვის დამატებითი დრო გაითვალისწინეთ. საწვავი საჭიროების შემთხვევაში ფასანაურში ან გუდაურში
    შეავსეთ.
en:
  name: Sakhizari Cliff Natural Monument
  short: >-
    Rain-carved volcanic cliffs above the Terek near Sioni. The name means 'refuge': villagers once climbed
    into these rocks to hide from raiders.
  body: >-
    **Sakhizari means 'a place of refuge', and for centuries that is exactly what these cliffs were: when
    enemies came up the Terek gorge, the villagers climbed into the rocks and waited.**


    The cliffs belong to Mount Khabarjina, a volcano long fallen silent, rising to just over 3,140 metres
    on the ridge between the Terek and the Sno, close to Kazbek and part of its volcanic group. Its summit
    is a flat-topped lava flow; its western flank is another matter. Heavy rainfall has gullied it into
    ribs, crags and columns of andesite and dacite tuff, breccia and lava, and dumped a great fan of debris
    at its foot that pushes out against the Terek. Caucasian rhododendron grows on the slopes.


    Locals call the place 'the ruins of the rocks', and from the road near Sioni the name explains itself:
    columns and broken crags stand as if a fortress had collapsed, except that nobody ever built it.


    Sakhizari is one of the natural monuments of the Kazbegi Protected Areas, alongside Abano Mineral
    Lake and the Truso and Jvari Pass travertines. No battle and no date are attached to the refuge story;
    it survives in the name alone. Pull over, look up, and imagine climbing up there with everything you
    owned on your back.
  tip: >-
    Free, unstaffed and without facilities. Enjoy Sakhizari from below: we know of no waymarked trail
    to the columns, and the eroded volcanic rock is loose and steep. The high cliffs belong to a 3,000-metre
    mountain, not a roadside stroll. Park in a proper pull-off, never on the carriageway, because lorries
    use this road day and night. The west-facing flank catches the afternoon sun. Food, fuel and toilets
    are in Stepantsminda, about 12 km on. In winter the Jvari Pass section of the S3 can close or run
    in convoys, so check the road status before you leave.
  route: >-
    144 km, about 2 hours 45 minutes, paved throughout. Take the S1 out of Tbilisi, turn north at Mtskheta
    onto the S3 Georgian Military Highway and follow it past Zhinvali, Ananuri, Pasanauri and Gudauri.
    Over the Jvari Pass (almost 2,400 m) the road drops past Kobi into the Terek gorge. The cliffs rise
    above the road around Sioni, roughly 12 km short of Stepantsminda. From late spring to autumn an economy
    car is fine; in winter carry chains or take an SUV, and allow extra time for the pass. If you are
    low on fuel, fill up in Pasanauri or Gudauri.
ru:
  name: Памятник природы «Скала Сахизари»
  short: >-
    Изрезанные дождями вулканические скалы над Тереком у Сиони. Имя значит «убежище»: сюда, в камни, сельчане
    уходили от набегов.
  body: >-
    **Сахизари значит «место, где укрываются», и веками эти скалы были именно убежищем: когда враг поднимался
    по ущелью Терека, сельчане карабкались в камни и пережидали.**


    Скалы принадлежат горе Хабарджина — давно затихшему вулкану высотой чуть более 3140 метров на хребте
    между Тереком и Сно, неподалёку от Казбека; гора входит в его вулканическую группу. Вершина её — плоский
    лавовый поток, а вот западный склон — совсем другое дело. Обильные дожди изрезали его на рёбра, утёсы
    и столбы из андезито-дацитовых туфов, брекчий и лавы и вынесли к подножию огромный конус выноса, который
    теснит Терек. На склонах растёт кавказский рододендрон.


    Местные называют это место «развалинами скал», и с дороги у Сиони название объясняет себя само: столбы
    и обломки утёсов стоят так, будто здесь рухнула крепость, — только её никто никогда не строил.


    Сахизари — один из памятников природы Казбегских охраняемых территорий, наряду с минеральным озером
    Абано и травертинами Трусо и Крестового перевала. Ни битвы, ни даты у предания об убежище нет: оно
    живёт только в названии. Остановитесь, поднимите голову и представьте, как карабкаетесь туда со всем
    своим добром за спиной.
  tip: >-
    Вход свободный; ни персонала, ни удобств. Любуйтесь Сахизари снизу: размеченной тропы к столбам мы
    не знаем, а выветренная вулканическая порода осыпается и круто обрывается. Высокие скалы — часть трёхтысячника,
    а не придорожная прогулка. Ставьте машину только в оборудованном кармане, никогда на проезжей части:
    фуры идут по этой дороге днём и ночью. Западный склон освещён солнцем во второй половине дня. Еда,
    топливо и туалеты — в Степанцминде, примерно в 12 км дальше. Зимой участок S3 через Крестовый перевал
    могут закрыть или пускать по нему колонны, так что перед выездом узнайте о состоянии дороги.
  route: >-
    144 км, около 2 часов 45 минут, асфальт на всём пути. Выезжайте из Тбилиси по S1, у Мцхеты сверните
    на север на S3 — Военно-Грузинскую дорогу — и следуйте мимо Жинвали, Ананури, Пасанаури и Гудаури.
    За Крестовым перевалом (почти 2400 м) дорога спускается мимо Коби в ущелье Терека. Скалы встают над
    дорогой в районе Сиони, примерно в 12 км не доезжая Степанцминды. С поздней весны до осени хватит
    машины эконом-класса; зимой возьмите цепи или внедорожник и заложите лишнее время на перевал. Если
    бензина мало, заправьтесь в Пасанаури или Гудаури.
fa:
  name: اثر طبیعی صخرهٔ ساخیزاری
  short: >-
    صخره‌های آتشفشانیِ باران‌تراش بر فراز رود ترک نزدیک سیونی. نامش یعنی «پناهگاه»: روستاییان روزگاری
    از دست یورشگران به این سنگ‌ها پناه می‌بردند.
  body: >-
    **ساخیزاری یعنی «جای پناه»، و این صخره‌ها قرن‌ها درست همین بودند: هر گاه دشمن از درهٔ رود ترک بالا
    می‌آمد، روستاییان خود را به دل صخره‌ها می‌رساندند و چشم‌به‌راه می‌ماندند.**


    این صخره‌ها بخشی از کوه خابارجینا هستند، آتشفشانی که دیرزمانی است خاموش مانده، به بلندی اندکی بیش
    از ۳۱۴۰ متر بر خط‌الرأس میان رودهای ترک و سنو، نزدیک کازبک و جزو گروه آتشفشانی آن. قله‌اش روانه‌ای
    از گدازه با سطحی هموار است؛ اما دامنهٔ غربی‌اش حکایت دیگری دارد. باران‌های سنگین آن را به تیغه‌ها،
    صخره‌های دندانه‌دار و ستون‌هایی از توف آندزیتی و داسیتی، برش و گدازه شیار زده و در پایش مخروط‌افکنهٔ
    عظیمی از واریزه بر جا گذاشته که رود ترک را پس می‌راند. بر دامنه‌ها رودودندرون قفقازی می‌روید.


    مردم محلی این‌جا را «ویرانه‌های صخره‌ها» می‌نامند، و از جاده، نزدیک سیونی، نام خود را توضیح می‌دهد:
    ستون‌ها و صخره‌های شکسته چنان ایستاده‌اند که گویی دژی فرو ریخته است — جز این‌که هیچ‌کس هرگز آن را
    نساخته است.


    ساخیزاری یکی از آثار طبیعی مناطق حفاظت‌شدهٔ کازبگی است، در کنار دریاچهٔ معدنی آبانو و تراورتن‌های
    تروسو و گردنهٔ جواری. داستان پناه‌گرفتن نه نام نبردی با خود دارد و نه تاریخی؛ تنها در همین نام زنده
    مانده است. کنار جاده بایستید، سر بلند کنید و خود را تصور کنید که با هر آن‌چه داشته‌اید بر پشت، از
    آن‌جا بالا می‌روید.
  tip: >-
    رایگان است، بی‌کارکنان و بی‌امکانات. ساخیزاری را از پایین تماشا کنید: ما مسیر نشانه‌گذاری‌شده‌ای تا
    ستون‌ها سراغ نداریم و سنگ آتشفشانیِ فرسوده سست و پرشیب است. این صخره‌های بلند به کوهی سه‌هزارمتری
    تعلق دارند، نه به گردشگاهی کنار جاده. فقط در جای توقف مناسب کنار جاده پارک کنید، هرگز روی سواره‌رو،
    چون کامیون‌ها شب و روز از این مسیر می‌گذرند. دامنهٔ رو به غرب آفتاب بعدازظهر را می‌گیرد. غذا، سوخت
    و دست‌شویی در استپانتسمیندا است، حدود ۱۲ کیلومتر جلوتر. در زمستان بخش گردنهٔ جواری در جادهٔ S3 ممکن
    است بسته شود یا عبور کاروانی شود؛ پیش از حرکت وضعیت جاده را بررسی کنید.
  route: >-
    ۱۴۴ کیلومتر، حدود ۲ ساعت و ۴۵ دقیقه، سراسر آسفالت. از تفلیس با S1 بیرون بروید، در متسختا به سوی شمال
    وارد S3، جادهٔ نظامی گرجستان، شوید و از کنار ژینوالی، آنانوری، پاسانائوری و گودائوری بگذرید. پس از
    گردنهٔ جواری (نزدیک به ۲۴۰۰ متر) جاده از کنار کوبی به درهٔ ترک سرازیر می‌شود. صخره‌ها حوالی سیونی،
    حدود ۱۲ کیلومتر پیش از استپانتسمیندا، بالای جاده سر برمی‌آورند. از اواخر بهار تا پاییز خودروی سواری
    معمولی کافی است؛ در زمستان زنجیر چرخ همراه داشته باشید یا شاسی‌بلند بگیرید و برای گردنه وقت اضافه
    بگذارید. اگر سوختتان کم است، در پاسانائوری یا گودائوری بنزین بزنید.
he:
  name: אתר הטבע מצוק סאחיזארי
  short: >-
    מצוקים געשיים שחצבו הגשמים מעל נהר הטרק ליד סיוני. השם פירושו "מקלט": תושבי הכפרים טיפסו פעם אל הסלעים
    כדי להסתתר מפני פושטים.
  body: >-
    **סאחיזארי פירושו "מקום מקלט", ובמשך מאות שנים זה בדיוק מה שהיו המצוקים האלה: כשאויבים עלו במעלה ערוץ
    הטרק, תושבי הכפרים טיפסו אל הסלעים וחיכו.**


    המצוקים שייכים להר חברג'ינה, הר געש שדמם מזמן, המתנשא לגובה של קצת יותר מ-3,140 מטר על הרכס שבין הטרק
    לסנו, סמוך לקזבק וכחלק מהקבוצה הגעשית שלו. פסגתו היא זרם לבה שטוח; המדרון המערבי הוא כבר סיפור אחר.
    גשמים עזים חרצו אותו לרכסונים, לצוקים ולעמודים של טוף אנדזיטי ודציטי, ברקציה ולבה, והשליכו למרגלותיו
    מניפת סחף ענקית הדוחקת את הטרק. על המדרונות צומח רודודנדרון קווקזי.


    המקומיים מכנים את המקום "חורבות הסלעים", ומהכביש ליד סיוני השם מסביר את עצמו: עמודים וצוקים שבורים
    ניצבים כאילו התמוטט כאן מבצר — אלא שאיש מעולם לא בנה אותו.


    סאחיזארי הוא אחד מאתרי הטבע של השטחים המוגנים של קזבגי, לצד אגם המינרלים אבאנו ומצבורי הטרוורטין של
    טרוסו ושל מעבר ג'ווארי. לסיפור המקלט לא נקשרו לא קרב ולא תאריך; הוא שרד רק בשם. עצרו בצד, הרימו את
    הראש ודמיינו את עצמכם מטפסים לשם עם כל רכושכם על הגב.
  tip: >-
    הכניסה חופשית, אין צוות ואין מתקנים. תיהנו מסאחיזארי מלמטה: איננו מכירים שביל מסומן אל העמודים, והסלע
    הגעשי השחוק רופף ותלול. המצוקים הגבוהים הם חלק מהר של 3,000 מטר, לא טיול קליל בשולי הכביש. חנו רק
    במפרץ חניה של ממש, לעולם לא על נתיב הנסיעה, כי משאיות נוסעות בכביש הזה יומם ולילה. המדרון הפונה מערבה
    מקבל את שמש אחר הצהריים. אוכל, דלק ושירותים תמצאו בסטפנצמינדה, כ-12 ק״מ הלאה. בחורף הקטע של כביש S3
    במעבר ג'ווארי עלול להיסגר או לפעול בשיירות, לכן בדקו את מצב הדרך לפני היציאה.
  route: >-
    144 ק״מ, כשעתיים ו-45 דקות, סלול לכל אורכו. צאו מטביליסי בכביש S1, במצחתה פנו צפונה אל S3, הדרך הצבאית
    הגאורגית, והמשיכו על פני ז'ינוואלי, אנאנורי, פסנאורי וגודאורי. אחרי מעבר ג'ווארי (כמעט 2,400 מ') הכביש
    יורד על פני קובי אל ערוץ הטרק. המצוקים מתנשאים מעל הכביש באזור סיוני, כ-12 ק״מ לפני סטפנצמינדה. מסוף
    האביב ועד הסתיו רכב פרטי רגיל יספיק; בחורף הצטיידו בשרשראות או קחו רכב שטח, והקצו זמן נוסף למעבר.
    אם הדלק אוזל, תדלקו בפסנאורי או בגודאורי.
ar:
  name: معلم صخرة ساخيزاري الطبيعي
  short: >-
    منحدرات بركانية نحتتها الأمطار فوق نهر تيريك قرب سيوني. اسمها يعني «الملاذ»: كان القرويون يلوذون بهذه
    الصخور هرباً من الغزاة.
  body: >-
    **ساخيزاري تعني «مكان الملاذ»، وعلى مدى قرون كانت هذه الصخور ملاذاً بالفعل: كلما صعد الأعداء في وادي
    تيريك، تسلّق القرويون إلى الصخور وانتظروا.**


    تنتمي الصخور إلى جبل خابارجينا، وهو بركان هدأ منذ زمن بعيد، يرتفع إلى ما يزيد قليلاً على 3140 متراً
    على الحافة الفاصلة بين نهري تيريك وسنو، قرب كازبيك، وهو جزء من مجموعته البركانية. قمته تدفّق لافا
    مسطّح، أما سفحه الغربي فشأن آخر: فقد خدّدته الأمطار الغزيرة إلى أضلاع ونتوءات وأعمدة من التوف الأنديزيتي
    والداسيتي والبريشيا واللافا، وألقت عند قدمه مروحة هائلة من الركام تزاحم نهر تيريك. وعلى المنحدرات
    ينمو الرودودندرون القوقازي.


    يسمّي الأهالي المكان «أطلال الصخور»، ومن الطريق قرب سيوني يشرح الاسم نفسه بنفسه: أعمدة ونتوءات مكسّرة
    تقف كأن حصناً قد انهار هنا، إلا أن أحداً لم يبنه قط.


    ساخيزاري واحد من المعالم الطبيعية في مناطق كازبيغي المحمية، إلى جانب بحيرة أبانو المعدنية وترافرتينات
    تروسو وممر جفاري. لا تقترن حكاية الملاذ بمعركة ولا بتاريخ، بل تعيش في الاسم وحده. توقّف جانباً، وارفع
    رأسك، وتخيّل نفسك تتسلق إلى هناك وكل ما تملك على ظهرك.
  tip: >-
    الدخول مجاني، بلا موظفين ولا مرافق. استمتع بساخيزاري من الأسفل: لا نعرف درباً معلَّماً إلى الأعمدة،
    والصخر البركاني المتآكل هشّ وشديد الانحدار. فهذه المنحدرات العالية جزء من جبل يبلغ 3000 متر، لا نزهة
    على جانب الطريق. أوقف سيارتك في موقف جانبي حقيقي، لا على مسار السير أبداً، فالشاحنات تسلك هذا الطريق
    ليلاً ونهاراً. يتلقى السفح الغربي شمس ما بعد الظهر. الطعام والوقود ودورات المياه في ستيبانتسميندا،
    على بعد نحو 12 كم. في الشتاء قد يُغلق مقطع ممر جفاري من الطريق S3 أو يُفتح للسير في قوافل، فتحقق من
    حالة الطريق قبل الانطلاق.
  route: >-
    144 كم، نحو ساعتين و45 دقيقة، على الإسفلت طوال الطريق. اخرج من تبليسي على الطريق S1، وعند متسخيتا
    انعطف شمالاً إلى S3، الطريق العسكري الجورجي، وتابع مروراً بجينفالي وأنانوري وباساناوري وغوداوري. بعد
    ممر جفاري (قرابة 2400 م) ينحدر الطريق مروراً بكوبي إلى وادي تيريك. ترتفع الصخور فوق الطريق قرب سيوني،
    قبل ستيبانتسميندا بنحو 12 كم. من أواخر الربيع إلى الخريف تكفي سيارة عادية؛ أما في الشتاء فاحمل سلاسل
    أو خذ سيارة دفع رباعي، وخصّص وقتاً إضافياً للممر. إن كان وقودك قليلاً فتزوّد به في باساناوري أو غوداوري.
