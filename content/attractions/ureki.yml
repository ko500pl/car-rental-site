ka:
  name: ურეკი
  short: შავი მაგნიტური ქვიშის პლაჟი გურიის სანაპიროზე — ყველაზე ცნობილი საოჯახო საზაფხულო კურორტი რეგიონში.
  body: >-
    ურეკი გურიის სანაპიროზე მდებარე პატარა საკურორტო დასახლებაა, რომელიც ერთი კონკრეტული თავისებურებით
    გამოირჩევა: აქაური პლაჟის ქვიშა შავია და მაგნიტიტის მაღალ შემცველობას შეიცავს. სწორედ ამან შექმნა
    მისი მრავალწლიანი რეპუტაცია — ითვლება, რომ მაგნიტური ქვიშა სასარგებლოა გულ-სისხლძარღვთა და საყრდენ-მამოძრავებელი
    სისტემისთვის და სწორედ ამიტომ ჩამოდიან აქ ხშირად ბავშვებთან ერთად.


    პრაქტიკული განსხვავება ბათუმისგან მარტივია: ურეკის პლაჟი ქვიშიანია და არა კენჭოვანი, ხოლო შესვლა თანდათანობითია
    — რაც მას ბავშვებისთვის კომფორტულს ხდის. ქვიშა შავია, ამიტომ მზეზე ის სწრაფად თბება და შუადღისას ფეხშიშველა
    სიარული უსიამოვნოა.


    რას მოელოდეთ:


    - **დასახლების ცენტრი** მცირე სასტუმროებით, საოჯახო სახლებითა და საზაფხულო კაფეებით

    - **ფიჭვნარის ტყე** პლაჟის უკან, რომელიც ჩრდილს იძლევა

    - **მეზობელი შეკვეთილი** გასართობი პარკითა და დიდი საკონცერტო მოედნით


    სეზონი ივნისიდან სექტემბრის შუა რიცხვებამდე გრძელდება. სექტემბერი ხშირად საუკეთესო თვეა: ზღვა ჯერ
    კიდევ თბილია, ხალხი კი გაცილებით ნაკლები, ვიდრე აგვისტოს პიკზე, ფასებიც ეცემა. ზამთარში კურორტი პრაქტიკულად
    იძინებს და საზაფხულო ინფრასტრუქტურის უმეტესობა უბრალოდ დაკეტილია. ურეკი ასევე მოსახერხებელი ბაზაა
    მთელი სანაპიროს დასათვალიერებლად — ბათუმამდე საათი გზაა, ქობულეთამდე კი ნახევარი საათი.
  tip: >-
    აგვისტოს პიკზე ურეკი გადატვირთულია და პარკინგი ცენტრში პრობლემად იქცევა — ჩამოსვლა დილით სჯობს, ან
    სექტემბრისთვის გადადეთ. შავი ქვიშა შუადღისას ძალიან ცხელდება, ამიტომ პლაჟის ფლოსტები საჭიროა. მზისგან
    დაცვა აქ სერიოზული საკითხია: ჩრდილი მხოლოდ ფიჭვნარშია და ქოლგა გამოგადგებათ. ბანკომატები და მაღაზიები
    ცენტრშია, თუმცა მცირე კაფეები ხშირად მხოლოდ ნაღდს იღებენ. სასტუმროები ზაფხულში წინასწარ ივსება.
  route: >-
    თბილისიდან ურეკამდე დაახლოებით 320 კმ და ოთხნახევარი-ხუთი საათია. მთელი გზა E60-ზე გადის: გორი, ხაშური,
    რიკოთის ახალი მაგისტრალი, ქუთაისი, სამტრედია და შემდეგ სანაპიროსკენ ბათუმის მიმართულებით. ურეკი პირდაპირ
    ამ ტრასაზეა და მისასვლელი ასფალტია ბოლომდე — ეკონომ კლასის ავტომობილი სავსებით საკმარისია. საწვავი
    სამტრედიაში ან ლანჩხუთში აავსეთ. ზაფხულის შაბათ-კვირას ბათუმის მიმართულებით საცობებია, ამიტომ ადრე
    გამგზავრება ჯობია.
en:
  name: Ureki
  short: A black magnetic-sand beach on the Guria coast — the region's best-known family summer resort.
  body: >-
    Ureki is a small resort settlement on the Guria coast with one very specific distinguishing feature:
    its beach sand is black and unusually rich in magnetite. That is the basis of its long-standing reputation,
    since the magnetic sand is popularly held to benefit the cardiovascular and musculoskeletal systems,
    which is a large part of why families with children come here year after year.


    The practical difference from Batumi is simple. Ureki has sand rather than pebbles, and the entry
    into the water is gradual and shallow, which makes it comfortable for small children. Because the
    sand is black it heats quickly in the sun, so walking barefoot at midday is unpleasant.


    What to expect:


    - **The village centre** with small hotels, guesthouses and seasonal cafes

    - **Pine woods** immediately behind the beach, providing the only real shade

    - **Neighbouring Shekvetili**, with an amusement park and a large concert arena


    The season runs from June to mid-September. September is often the best month: the sea is still warm
    and the crowds are far thinner than at the August peak. In winter the resort essentially shuts down,
    and most of what is open in summer simply is not there.
  tip: >-
    At the August peak Ureki gets crowded and parking in the centre becomes a genuine problem, so arrive
    in the morning or shift your trip to September. The black sand becomes very hot by midday, which makes
    beach sandals worth packing. Sun protection matters here: the only real shade is under the pines,
    so an umbrella helps. ATMs and shops are in the centre, though smaller cafes often take cash only.
    Book accommodation ahead in summer, as it fills early.
  route: >-
    Ureki is about 320 km and four and a half to five hours from Tbilisi. The entire route follows the
    E60: Gori, Khashuri, the new Rikoti section, Kutaisi, Samtredia and then toward the coast in the direction
    of Batumi. Ureki sits directly on this road and the access is paved all the way, so an economy car
    is entirely sufficient. Fill up in Samtredia or Lanchkhuti. On summer weekends traffic toward Batumi
    backs up badly, so an early start makes a noticeable difference to the driving time.
ru:
  name: Уреки
  short: Пляж с чёрным магнитным песком на побережье Гурии — самый известный семейный летний курорт региона.
  body: >-
    Уреки — небольшой курортный посёлок на побережье Гурии с одной очень конкретной особенностью: песок
    здешнего пляжа чёрный и необычно богат магнетитом. На этом и построена его давняя репутация: считается,
    что магнитный песок полезен для сердечно-сосудистой и опорно-двигательной систем, и именно поэтому
    сюда из года в год приезжают семьи с детьми.


    Практическое отличие от Батуми простое. В Уреки песок, а не галька, и вход в воду пологий и мелкий,
    что удобно для маленьких детей. Из-за чёрного цвета песок быстро нагревается на солнце, поэтому ходить
    босиком в середине дня неприятно.


    Чего ожидать:


    - **Центр посёлка** с небольшими отелями, гостевыми домами и сезонными кафе

    - **Сосновый лес** сразу за пляжем — единственная настоящая тень

    - **Соседний Шекветили** с парком аттракционов и большой концертной ареной


    Сезон длится с июня до середины сентября. Сентябрь часто оказывается лучшим месяцем: море ещё тёплое,
    а людей заметно меньше, чем на августовском пике. Зимой курорт фактически засыпает, и большей части
    летней инфраструктуры просто нет.
  tip: >-
    На августовском пике в Уреки многолюдно, а парковка в центре превращается в проблему: приезжайте утром
    или перенесите поездку на сентябрь. Чёрный песок к полудню сильно раскаляется, пляжные тапки стоит
    взять. Защита от солнца здесь важна: настоящая тень есть только под соснами, зонт пригодится. Банкоматы
    и магазины есть в центре, но небольшие кафе часто принимают только наличные. Жильё летом бронируйте
    заранее, оно разбирается рано.
  route: >-
    От Тбилиси до Уреки примерно 320 км и четыре с половиной — пять часов. Весь маршрут идёт по трассе
    E60: Гори, Хашури, новый Рикотский участок, Кутаиси, Самтредиа и далее к побережью в сторону Батуми.
    Уреки стоит прямо на этой дороге, подъезд асфальтирован до конца, машины эконом-класса вполне достаточно.
    Заправляйтесь в Самтредиа или Ланчхути. В летние выходные движение в сторону Батуми плотное, поэтому
    ранний выезд заметно экономит время в пути.
fa:
  name: اورکی
  short: ساحل شن مغناطیسی سیاه در کرانهٔ گوریا — شناخته‌شده‌ترین تفرجگاه تابستانی خانوادگی منطقه.
  body: >-
    اورکی شهرک تفریحی کوچکی در کرانهٔ گوریاست با یک ویژگی بسیار مشخص: شن ساحلش سیاه و به‌طور غیرعادی سرشار
    از مگنتیت است. شهرت دیرینهٔ آن بر همین پایه است، چون در باور عمومی شن مغناطیسی به دستگاه قلبی-عروقی
    و اسکلتی-عضلانی سود می‌رساند، و بخش بزرگی از دلیل بازگشت هرسالهٔ خانواده‌های بچه‌دار همین است.


    تفاوت عملی با باتومی ساده است. اورکی به جای قلوه‌سنگ شن دارد و ورود به آب تدریجی و کم‌عمق است، که
    برای کودکان خردسال راحت است. چون شن سیاه است، زیر آفتاب زود داغ می‌شود و پابرهنه راه رفتن در نیمروز
    ناخوشایند است.


    چه چیزی در انتظار شماست: **مرکز شهرک** با هتل‌های کوچک، اقامتگاه‌ها و کافه‌های فصلی؛ **جنگل کاج**
    بلافاصله پشت ساحل که تنها سایهٔ واقعی را می‌دهد؛ و **شکوتیلی همسایه** با شهربازی و آمفی‌تئاتر بزرگ
    کنسرت. فصل از ژوئن تا میانهٔ سپتامبر است. سپتامبر اغلب بهترین ماه است: دریا هنوز گرم است و ازدحام
    به‌مراتب کمتر از اوج اوت. در زمستان تفرجگاه عملاً تعطیل می‌شود و بیشتر آنچه تابستان باز است، اصلاً
    وجود ندارد.
  tip: >-
    در اوج اوت اورکی شلوغ می‌شود و پارک خودرو در مرکز به مسئله‌ای جدی بدل می‌شود، پس صبح بیایید یا سفر
    را به سپتامبر ببرید. شن سیاه تا نیمروز بسیار داغ می‌شود، که دمپایی ساحلی را ارزشمند می‌کند. محافظت
    از آفتاب اینجا مهم است: تنها سایهٔ واقعی زیر کاج‌هاست، پس چتر آفتابی کمک می‌کند. خودپرداز و فروشگاه
    در مرکز هست، هرچند کافه‌های کوچک‌تر اغلب فقط نقد می‌گیرند. اقامت را در تابستان از پیش رزرو کنید، چون
    زود پر می‌شود.
  route: >-
    اورکی حدود 320 کیلومتر و چهار و نیم تا پنج ساعت از تفلیس فاصله دارد. تمام مسیر E60 را دنبال می‌کند:
    گوری، خاشوری، قطعهٔ نوی ریکوتی، کوتایسی، سامتردیا و سپس رو به کرانه در جهت باتومی. اورکی درست کنار
    همین جاده است و دسترسی تا انتها آسفالت است، پس خودروی اقتصادی کاملاً کافی است. باک را در سامتردیا
    یا لانچخوتی پر کنید. آخرهفته‌های تابستان ترافیک به سوی باتومی به‌شدت جمع می‌شود، پس حرکت زودهنگام
    تفاوت محسوسی در زمان رانندگی می‌گذارد.
he:
  name: אורקי
  short: חוף של חול מגנטי שחור בחופי גוריה — אתר הנופש המשפחתי המוכר ביותר באזור.
  body: >-
    אורקי היא יישוב נופש קטן על חוף גוריה, ולה מאפיין מבחין אחד ומאוד ספציפי: חול החוף שלה שחור ועשיר
    במגנטיט באופן חריג. על כך נשען המוניטין הוותיק שלה, שכן רווחת האמונה שהחול המגנטי מיטיב עם מערכת הלב
    וכלי הדם ועם מערכת השלד והשרירים, וזה חלק גדול מן הסיבה שמשפחות עם ילדים חוזרות לכאן שנה אחר שנה.


    ההבדל המעשי מבטומי פשוט. באורקי יש חול ולא חלוקים, והכניסה למים מדורגת ורדודה, מה שהופך אותה נוחה
    לילדים קטנים. ומכיוון שהחול שחור הוא מתחמם מהר בשמש, כך שהליכה יחפה בצהריים אינה נעימה.


    למה לצפות: **מרכז הכפר** עם מלונות קטנים, בתי הארחה ובתי קפה עונתיים; **יערות אורנים** ממש מאחורי
    החוף, המספקים את הצל האמיתי היחיד; ו**שקווטילי הסמוכה**, עם פארק שעשועים וזירת מופעים גדולה. העונה
    נמשכת מיוני עד אמצע ספטמבר. ספטמבר הוא לעיתים קרובות החודש הטוב ביותר: הים עדיין חם והקהל דליל בהרבה
    מאשר בשיא אוגוסט. בחורף אתר הנופש נסגר למעשה, ורוב מה שפועל בקיץ פשוט איננו.
  tip: >-
    בשיא אוגוסט אורקי הומה והחניה במרכז הופכת לבעיה אמיתית, לכן הגיעו בבוקר או העבירו את הנסיעה לספטמבר.
    החול השחור מתחמם מאוד עד הצהריים, ולכן כדאי לארוז סנדלי חוף. הגנה מפני השמש חשובה כאן: הצל האמיתי
    היחיד הוא תחת האורנים, אז שמשייה עוזרת. כספומטים וחנויות במרכז, אם כי בתי קפה קטנים מקבלים לרוב מזומן
    בלבד. הזמינו לינה מראש בקיץ, כי היא מתמלאת מוקדם.
  route: >-
    אורקי מרוחקת כ-320 ק"מ וארבע וחצי עד חמש שעות מטביליסי. כל המסלול עוקב אחר כביש E60: גורי, חשורי,
    קטע ריקוטי החדש, קוטאיסי, סמטרדיה ומשם לכיוון החוף בכיוון בטומי. אורקי יושבת ישירות על הכביש הזה והגישה
    סלולה לכל האורך, כך שרכב חסכוני מספיק לחלוטין. תדלקו בסמטרדיה או בלאנצחוטי. בסופי שבוע קיציים התנועה
    לכיוון בטומי נערמת קשות, ולכן יציאה מוקדמת עושה הבדל ניכר בזמן הנסיעה.
ar:
  name: أوريكي
  short: شاطئ رمال سوداء مغناطيسية على ساحل غوريا — أشهر منتجع صيفي عائلي في الإقليم.
  body: >-
    أوريكي بلدة اصطياف صغيرة على ساحل غوريا لها ميزة واحدة شديدة الخصوصية: رمال شاطئها سوداء وغنية بالمغنتيت
    على نحو غير معتاد. وعلى ذلك تقوم سمعتها الراسخة، إذ يشيع الاعتقاد بأن الرمال المغناطيسية تنفع الجهاز
    القلبي الوعائي والجهاز العضلي الهيكلي، وهذا جزء كبير من سبب عودة الأسر التي معها أطفال إليها عاماً
    بعد عام.


    والفرق العملي عن باتومي بسيط. في أوريكي رمل لا حصى، والدخول إلى الماء متدرج وضحل، وهو ما يجعله مريحاً
    للأطفال الصغار. ولأن الرمل أسود فإنه يسخن بسرعة تحت الشمس، فالمشي حافياً عند الظهيرة غير محبب.


    وما يمكن توقعه: **مركز البلدة** بفنادقه الصغيرة وبيوت الضيافة والمقاهي الموسمية؛ و**غابات الصنوبر**
    خلف الشاطئ مباشرة، وهي الظل الحقيقي الوحيد؛ و**شيكفيتيلي المجاورة** بمدينة ملاهيها وساحة حفلاتها الكبيرة.
    يمتد الموسم من يونيو إلى منتصف سبتمبر. وغالباً ما يكون سبتمبر أفضل الشهور: فالبحر ما زال دافئاً والزحام
    أخف بكثير من ذروة أغسطس. أما في الشتاء فيغلق المنتجع عملياً، ومعظم ما يعمل في الصيف لا وجود له ببساطة.
  tip: >-
    في ذروة أغسطس تزدحم أوريكي ويصير الوقوف في المركز مشكلة حقيقية، فتعال صباحاً أو انقل الرحلة إلى سبتمبر.
    وتصير الرمال السوداء شديدة الحرارة عند الظهيرة، ما يجعل صندل الشاطئ يستحق الحمل. والوقاية من الشمس
    مهمة هنا: فالظل الحقيقي الوحيد تحت الصنوبر، والشمسية تساعد. أجهزة الصراف والمتاجر في المركز، وإن كانت
    المقاهي الأصغر تقبل النقد فقط غالباً. احجز الإقامة مسبقاً في الصيف فهي تمتلئ باكراً.
  route: >-
    تبعد أوريكي نحو 320 كم وأربع ساعات ونصف إلى خمس ساعات عن تبليسي. ويتبع المسار كله طريق E60: غوري وخاشوري
    ومقطع ريكوتي الجديد وكوتايسي وسامتريديا ثم نحو الساحل باتجاه باتومي. وتقع أوريكي على هذا الطريق مباشرة
    والوصول معبّد طوال المسافة، فالسيارة الاقتصادية كافية تماماً. تزود بالوقود في سامتريديا أو لانتشخوتي.
    وفي عطلات نهاية الأسبوع الصيفية تتكدس الحركة نحو باتومي بشدة، فالانطلاق المبكر يُحدث فرقاً ملموساً
    في زمن القيادة.
