ka:
  name: ურეკი
  short: >-
    შავი, მაგნეტიტით მდიდარი ქვიშა, ფიჭვნარის ზოლი და ნაპირიდან შორს არაღრმა ზღვა: ურეკი გურიის სანაპიროს
    კლასიკური საოჯახო პლაჟია.
  body: >-
    **ურეკის ქვიშას მაგნიტი რომ მიუახლოვოთ, შავი მარცვლები მას თავად შეახტება.** ეს მაგნეტიტია, რკინის
    მადანი, და მან გურიის სანაპიროს ეს ზოლი ორჯერ შეცვალა: ჯერ საბადოდ აქცია, მერე — სამკურნალო ადგილად.


    სახელი ორივეზე ძველია. „ურეკი“ სამონადირეო ტერმინია და ისეთ ხშირ, გაუვალ ტყეს ნიშნავს, საიდანაც ნადირის
    გამორეკვა შეუძლებელია, სხვა განმარტებით კი — ტყეს, სადაც საქონელს ვერ შერეკავ. მდინარე სუფსის შესართავთან
    აღმოჩენილი ბრინჯაოს განძები, რომლებსაც ძველი წელთაღრიცხვის II ათასწლეულით ათარიღებენ, მოწმობს, რომ
    ამ ნაპირზე ხალხი პლაჟის გაჩენამდე დიდი ხნით ადრე ცხოვრობდა.


    მაგნეტიტის მოპოვება 1944 წელს დაიწყო: ქვიშას რუსთავის მეტალურგიული კომბინატისთვის გერმანელი სამხედრო
    ტყვეები ტვირთავდნენ. ადგილობრივი ისტორია მათგან ერთ-ერთს, მეცნიერ ერიხ ანდერეს იხსენებს, რომელსაც
    გულ-სისხლძარღვთა დაავადება და მძიმე ართრიტი აწუხებდა. შავ პლაჟზე თავი უკეთ იგრძნო და ეს საბჭოთა ხელისუფლებას
    აცნობა. ამბავი ზუსტად ასე იყო თუ არა, შედეგი აშკარაა: 1949 წელს გურიის ზღვისპირეთში საკურორტო ზოლის
    მოწყობა გადაწყდა, ქობულეთიდან ფოთამდე, 50 კილომეტრზე, ბიჭვინთის ფიჭვი გააშენეს, 1953 წელს კი ურეკს
    დაბის სტატუსი მიენიჭა.


    ფიჭვნარი დღესაც ერთადერთი ჩრდილია, პლაჟი კი დღესაც იმას აკეთებს, რისთვისაც ოჯახებს უყვართ. ქვიშა წვრილი
    და მუქია, ზღვა კი იმდენად არაღრმა, რომ ზრდასრულ ადამიანს ნაპირიდან ოც-ორმოც მეტრზეც წყალი ყელამდე
    არ სწვდება. პლაჟის გული მაგნეტიტის უბანია, მდინარეებს — კუჩხასა და სეფას — შორის. სამკურნალო თვისებების
    შესახებ ნათქვამი ხალხური რწმენაა და არა დამტკიცებული მედიცინა; თბილ, წყნარ ზღვას კი ასეთი დაცვა არც
    სჭირდება.


    დაბინდებისას ქვიშა გრილდება, ფიჭვნარს ფისის სუნი ასდის და ზღვა ტყვიისფერ ელფერს იღებს.
  tip: >-
    სეზონი ივნისიდან სექტემბრის შუა რიცხვებამდე გრძელდება; სექტემბერში ზღვა ჯერ კიდევ თბილია, ხალხი კი
    ნახევრით ნაკლები. აგვისტოში 10:00-მდე ჩადით, თორემ პლაჟთან პარკინგისთვის ბრძოლა მოგიწევთ. შავი ქვიშა
    შუადღისთვის ფეხს სწვავს: წაიღეთ პლაჟის ფეხსაცმელი, ქოლგა და მზისგან დამცავი კრემი, რადგან ჩრდილი მხოლოდ
    ფიჭვნარშია. მაღაზიები და ბანკომატები ცენტრშია, პატარა კაფეები ხშირად მხოლოდ ნაღდ ფულს იღებენ. ივლის-აგვისტოსთვის
    ღამის გასათევი ადრე დაჯავშნეთ. გვერდით შეკვეთილის დენდროლოგიური პარკი და „შავი ზღვის არენაა“, რომლის
    კონცერტების დღეებში დაბა ხალხით ივსება.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის გვირაბებისა და ქუთაისის გავლით სამტრედიამდე
    იარეთ, შემდეგ ს12-ით (E692) ლანჩხუთის გავლით გრიგოლეთამდე, ზღვის პირას. იქ სამხრეთით, ს2-ზე გადაუხვიეთ:
    ურეკი მდინარე სუფსის გადაღმა, რამდენიმე კილომეტრში იწყება. დაახლოებით 320 კმ და 4 საათი და 40 წუთი,
    მთელ გზაზე ასფალტი და ბენზინგასამართი სადგურები — გაჩერებისთვის სამტრედია და ლანჩხუთი მოსახერხებელია.
    ეკონომ-კლასის მანქანა სავსებით საკმარისია. ზაფხულის პარასკევებსა და შაბათ-კვირას სანაპირო გზაზე ბათუმის
    მიმართულებით საცობებია, ამიტომ თბილისიდან დილაადრიან გამოდით.
en:
  name: Ureki
  short: >-
    Black, magnetite-rich sand, a belt of pines and a sea that stays shallow far from shore: Ureki is
    Georgia's classic family beach on the Guria coast.
  body: >-
    **Hold a magnet over a handful of Ureki's sand and the black grains leap to meet it.** They are magnetite,
    an iron ore, and they have shaped this strip of the Guria coast twice: first as a mine, then as a
    cure.


    The name is older than either. Ureki is an old hunter's word for forest so dense that no game could
    be driven out of it — or, in another reading, no cattle driven in. Hoards of bronze found near the
    mouth of the Supsa, dated to the second millennium BC, show that people lived on this shore long before
    anyone came for the beach.


    Mining began in 1944, and German prisoners of war loaded the sand for the steelworks at Rustavi. Local
    history tells of one of them, a scientist named Erich Andere, who suffered from heart disease and
    arthritis, felt better on the black beach and reported it to the Soviet authorities. Whatever the
    exact truth of the story, change followed: in 1949 a resort strip was planned along the Guria coast,
    a belt of Pitsunda pine was planted for fifty kilometres between Kobuleti and Poti, and in 1953 Ureki
    became an urban settlement.


    The pines are still the only shade, and the beach still does what families love it for. The sand is
    fine and dark, and the sea stays so shallow that an adult can wade twenty to forty metres out before
    the water reaches the chin. The heart of it is the Magnetite quarter, between the Kuchkha and Sepa
    rivers. The healing claims remain popular belief rather than proven medicine; the warm, gentle water
    needs no such defence.


    At dusk the sand cools, the pines smell of resin, and the sea turns the colour of pewter.
  tip: >-
    The season runs from June to mid-September; September brings warm water and half the crowds. In August
    arrive before 10:00, when parking near the beach turns into a contest. The black sand gets painfully
    hot by midday: bring beach shoes, a parasol and strong sun protection, because the pines are the only
    shade. Shops and ATMs are in the centre; small cafés often take cash only. Book accommodation early
    for July and August. Next door are the Shekvetili Dendrological Park and the Black Sea Arena, whose
    concerts can fill the village on show nights.
  route: >-
    From Tbilisi take the S1 (E60) west through the Rikoti tunnels and past Kutaisi to Samtredia, then
    the S12 (E692) through Lanchkhuti to the coast at Grigoleti. Turn south onto the S2: Ureki begins
    just across the Supsa river, a few kilometres on. About 320 km and roughly 4 hours 40 minutes, asphalt
    all the way, with fuel stations throughout — Samtredia and Lanchkhuti are convenient stops. An economy
    car is entirely enough. On summer Fridays and weekends the coast road backs up towards Batumi, so
    leave Tbilisi early in the morning.
ru:
  name: Уреки
  short: >-
    Чёрный песок, богатый магнетитом, полоса сосен и море, что остаётся неглубоким далеко от берега: Уреки
    — классический семейный пляж гурийского побережья.
  body: >-
    **Поднесите магнит к горсти урекского песка — и чёрные зёрна сами прыгнут к нему.** Это магнетит,
    железная руда, и он дважды преобразил эту полосу гурийского побережья: сначала превратив её в рудник,
    потом — в лечебное место.


    Само название старше и того, и другого. «Уреки» — старое охотничье слово, означающее лес такой густой,
    что из него невозможно выгнать зверя, — или, по другому толкованию, невозможно загнать туда скот.
    Бронзовые клады, найденные у устья Супсы и датированные вторым тысячелетием до нашей эры, свидетельствуют,
    что люди жили на этом берегу задолго до появления пляжа.


    Добыча началась в 1944 году, и немецкие военнопленные грузили песок для металлургического завода в
    Рустави. Местная история хранит рассказ об одном из них — учёном по имени Эрих Андере, который страдал
    болезнью сердца и артритом, почувствовал себя лучше на чёрном пляже и сообщил об этом советским властям.
    Насколько эта история точна, сказать трудно, но перемены не заставили себя ждать: в 1949 году вдоль
    гурийского побережья решили устроить курортную зону, на пятидесяти километрах между Кобулети и Поти
    высадили пицундскую сосну, а в 1953 году Уреки получил статус посёлка городского типа.


    Сосны до сих пор остаются единственной тенью, а пляж по-прежнему делает то, за что его любят семьи.
    Песок мелкий и тёмный, а море настолько неглубокое, что взрослый человек может зайти на двадцать-сорок
    метров, прежде чем вода дойдёт до подбородка. Сердце этой полосы — квартал Магнетити, между реками
    Кучха и Сепа. Целебные свойства остаются народным поверьем, а не доказанной медициной; тёплой, спокойной
    воде такая защита и не требуется.


    К сумеркам песок остывает, сосны пахнут смолой, а море окрашивается в оловянный цвет.
  tip: >-
    Сезон длится с июня по середину сентября; сентябрь приносит тёплую воду и вдвое меньше народу. В августе
    приезжайте до 10:00, иначе найти парковку у пляжа будет настоящим состязанием. Чёрный песок к полудню
    раскаляется до боли: возьмите пляжную обувь, зонт и надёжную защиту от солнца, потому что сосны —
    единственная тень. Магазины и банкоматы — в центре, мелкие кафе часто принимают только наличные. Жильё
    на июль и август бронируйте заранее. Рядом — Шекветильский дендрологический парк и концертная арена
    «Блэк Си Арена», концерты которой могут заполнить весь посёлок.
  route: >-
    От Тбилиси по S1 (E60) на запад через Рикотские тоннели и Кутаиси до Самтредиа, затем по S12 (E692)
    через Ланчхути до побережья у Григолети. Сверните на юг, на S2: Уреки начинается сразу за рекой Супса,
    через несколько километров. Около 320 км и приблизительно 4 часа 40 минут, всё по асфальту, заправки
    на всём пути — Самтредиа и Ланчхути удобны для остановки. Хватит любой машины эконом-класса. По летним
    пятницам и выходным прибрежная дорога в сторону Батуми забивается, так что выезжайте из Тбилиси ранним
    утром.
fa:
  name: اورکی
  short: >-
    شنی سیاه و غنی از مگنتیت، نواری از درختان کاج و دریایی که تا دور از ساحل کم‌ژرف می‌ماند: اورکی ساحل
    خانوادگی کلاسیک کرانهٔ گوریاست.
  body: >-
    **آهن‌ربایی بر مشتی از شن اورکی بگیرید، و دانه‌های سیاه خود به‌سویش می‌جهند.** این‌ها مگنتیت‌اند،
    سنگ آهن، و این نوار از کرانهٔ گوریا را دوبار دگرگون کرده‌اند: نخست چون معدن، سپس چون درمانگاه.


    نام حتی از هر دوی این‌ها کهن‌تر است. «اورکی» واژه‌ای کهن از زبان شکارچیان است و به‌معنای جنگلی چنان
    انبوه که هیچ جانوری را از آن نتوان بیرون راند — یا، به روایتی دیگر، هیچ دامی را نتوان به آن راند.
    گنجینه‌های برنزی یافته‌شده نزدیک دهانهٔ سوپسا، که به هزارهٔ دوم پیش از میلاد بازمی‌گردند، نشان می‌دهند
    مردم بر این ساحل، مدت‌ها پیش از پدیدآمدن این ساحل تفریحی، زندگی می‌کردند.


    معدن‌کاری در سال ۱۹۴۴ آغاز شد، و اسیران جنگی آلمانی شن را برای کارخانهٔ فولاد روستاوی بار می‌زدند.
    تاریخ محلی داستان یکی از آن‌ها را روایت می‌کند، دانشمندی به‌نام اریش آندره، که از بیماری قلبی و آرتریت
    رنج می‌برد، بر ساحل سیاه حالش بهتر شد و آن را به مقامات شوروی گزارش داد. درستیِ دقیق این داستان هرچه
    باشد، دگرگونی از پی آن آمد: در سال ۱۹۴۹ منطقه‌ای تفرجگاهی در طول کرانهٔ گوریا برنامه‌ریزی شد، نواری
    از کاج پیتسوندا در پنجاه کیلومتر میان کوبولتی و پوتی کاشته شد، و در سال ۱۹۵۳ اورکی به شهرک تبدیل شد.


    کاج‌ها هنوز تنها سایه‌اند، و ساحل هنوز همان کاری را می‌کند که خانواده‌ها آن را دوست دارند. شن نرم
    و تیره است، و دریا آن‌قدر کم‌ژرف می‌ماند که بزرگسالی می‌تواند بیست تا چهل متر پیش برود، پیش از آن‌که
    آب به چانه‌اش برسد. قلب این نوار محلهٔ مگنتیتی است، میان رودهای کوچخا و سپا. ادعاهای شفابخشی همچنان
    باور عامیانه‌اند، نه پزشکی اثبات‌شده؛ آب گرم و آرام به چنین دفاعی نیازی ندارد.


    در گرگ‌ومیش، شن خنک می‌شود، کاج‌ها بوی رزین می‌دهند، و دریا به رنگ قلع درمی‌آید.
  tip: >-
    فصل از ژوئن تا نیمهٔ سپتامبر ادامه دارد؛ سپتامبر آب گرم و نیمی از جمعیت را با خود می‌آورد. در اوت
    پیش از ساعت ۱۰:۰۰ بیایید، وگرنه پارکینگ کنار ساحل به رقابتی بدل می‌شود. شن سیاه تا ظهر چنان داغ می‌شود
    که پا را می‌سوزاند: کفش ساحلی، سایبان و ضدآفتاب قوی بیاورید، چراکه کاج‌ها تنها سایه‌اند. مغازه‌ها
    و خودپردازها در مرکز شهرک‌اند، و کافه‌های کوچک اغلب تنها نقد می‌پذیرند. برای ژوئیه و اوت اقامتگاه
    را زودتر رزرو کنید. در همسایگی، پارک درخت‌شناسی شکوتیلی و «بلک سی آرنا» قرار دارند، که کنسرت‌هایش
    در شب‌های نمایش می‌تواند شهرک را پر کند.
  route: >-
    از تفلیس با S1 (E60) به سوی غرب، از تونل‌های ریکوتی و کنار کوتایسی تا سامتردیا، سپس با S12 (E692)
    از میان لانچخوتی تا ساحل در گریگولتی بروید. به سوی جنوب، به S2 بپیچید: چند کیلومتر جلوتر، درست آن‌سوی
    رود سوپسا، اورکی آغاز می‌شود. حدود ۳۲۰ کیلومتر و نزدیک به چهار ساعت و چهل دقیقه، همه بر آسفالت، با
    پمپ بنزین در تمام طول مسیر — سامتردیا و لانچخوتی توقفگاه‌های مناسبی‌اند. یک خودروی اقتصادی کاملاً
    کافی است. در جمعه‌ها و آخر هفته‌های تابستان، راه ساحلی به‌سوی باتومی ترافیک سنگینی دارد، پس صبح زود
    از تفلیس حرکت کنید.
he:
  name: אורקי
  short: 'חול שחור עשיר במגנטיט, רצועת אורנים, וים שנשאר רדוד הרחק מהחוף: אורקי הוא חוף הרחצה המשפחתי
    הקלאסי של גוריה.'
  body: >-
    **קרבו מגנט לקומץ חול מאורקי, והגרגרים השחורים ינתרו לעברו מעצמם.** אלה גרגרי מגנטיט, עפרת ברזל, והם
    עיצבו רצועה זו מחוף גוריה פעמיים: פעם ראשונה כמכרה, ופעם שנייה כמרפא.


    השם עתיק משניהם. "אורקי" הוא מונח ישן מלשון הציידים ומשמעו יער סבוך עד כי לא ניתן להבריח ממנו חיה
    — או, בפרשנות אחרת, לא ניתן להכניס אליו בקר. מטמוני ברונזה שנמצאו סמוך לשפך הסופסה, המתוארכים לאלף
    השני לפני הספירה, מעידים שאנשים חיו על חוף זה זמן רב לפני שהחוף היה מוקד תיירות.


    הכרייה החלה ב-1944, ושבויי מלחמה גרמנים העמיסו את החול עבור מפעל הפלדה ברוסתאווי. ההיסטוריה המקומית
    מספרת על אחד מהם, מדען בשם אריך אנדרה, שסבל ממחלת לב ומדלקת פרקים, חש טוב יותר על החוף השחור ודיווח
    על כך לרשויות הסובייטיות. אמת הסיפור המדויקת אינה ברורה, אך שינוי בא בעקבותיו: ב-1949 תוכננה רצועת
    נופש לאורך חוף גוריה, ניטעה רצועה של אורן פיצונדה על פני חמישים קילומטרים בין קובולטי לפוטי, וב-1953
    קיבל אורקי מעמד יישוב עירוני.


    האורנים עדיין הצל היחיד, והחוף עדיין עושה את מה שהמשפחות אוהבות בו. החול דק וכהה, והים נשאר רדוד עד
    כי מבוגר יכול לצעוד עשרים עד ארבעים מטרים לפני שהמים מגיעים לסנטרו. לב הרצועה הוא רובע מגנטיטי, בין
    הנהרות קוצ'חה וספה. הטענות על סגולות מרפא נותרות אמונה עממית ולא רפואה מוכחת; המים החמים והשלווים
    לא זקוקים להגנה כזו.


    בשעת הדמדומים החול מתקרר, האורנים מדיפים ריח שרף, והים מקבל צבע של בדיל.
  tip: >-
    העונה נמשכת מיוני עד אמצע ספטמבר; ספטמבר מביא מים חמים וחצי מהקהל. באוגוסט הגיעו לפני 10:00, אחרת
    מציאת חניה סמוך לחוף תהפוך לתחרות. החול השחור מתחמם עד כאב בצהריים: הביאו נעלי חוף, שמשייה והגנה חזקה
    מהשמש, שכן האורנים הם הצל היחיד. חנויות וכספומטים במרכז, ובתי קפה קטנים מקבלים לעיתים קרובות מזומן
    בלבד. הזמינו לינה מוקדם ליולי ואוגוסט. בשכנות נמצאים הגן הדנדרולוגי של שקוטילי ו"בלק סי ארנה", שהופעותיה
    יכולות למלא את הכפר בערבי מופע.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה, דרך מנהרות ריקוטי ולצד קוטאיסי עד סמטרדיה, אחר כך S12 (E692) דרך לנצ'חוטי
    עד לחוף בגריגולטי. פנו דרומה ל-S2: אורקי מתחיל מיד מעבר לנהר סופסה, כמה קילומטרים משם. כ-320 ק"מ וכארבע
    שעות ו-40 דקות, כולה באספלט, ותחנות דלק לאורך כל הדרך — סמטרדיה ולנצ'חוטי נוחות לעצירה. כל רכב חסכוני
    רגיל יספיק בהחלט. בימי שישי ובסופי שבוע בקיץ הדרך החופית לעבר באתומי מתמלאת בפקקים, אז צאו מטביליסי
    בבוקר מוקדם.
ar:
  name: أوريكي
  short: >-
    رمل أسود غني بالمغنتيت، وحزام من أشجار الصنوبر، وبحر يبقى ضحلًا بعيدًا عن الشاطئ: أوريكي هو الشاطئ
    العائلي الكلاسيكي على ساحل غوريا.
  body: >-
    **قرّب مغناطيسًا من حفنة من رمل أوريكي، فتقفز الحبيبات السوداء لملاقاته.** إنه المغنتيت، خامُ حديد،
    وقد شكّل هذا الشريط من ساحل غوريا مرتين: أولًا كمنجم، وثانيًا كعلاج.


    الاسم أقدم من كليهما. «أوريكي» كلمة قديمة من لغة الصيادين تعني غابة كثيفة إلى حدّ لا يمكن فيه إخراج
    الطريدة منها — أو، بحسب تفسير آخر، لا يمكن إدخال المواشي إليها. تكشف دفائن برونزية عُثر عليها قرب
    مصب نهر سوبسا، ومؤرخة إلى الألفية الثانية قبل الميلاد، أن الناس سكنوا هذا الساحل قبل أن يصبح شاطئًا
    بزمن طويل.


    بدأ التعدين عام 1944، وحمل أسرى حرب ألمان الرمل لمصنع الصلب في روستافي. تروي التقاليد المحلية قصة
    أحدهم، عالِم يُدعى إريش أندريه، كان يعاني من مرض في القلب والتهاب المفاصل، فشعر بتحسن على الشاطئ الأسود
    وأبلغ السلطات السوفيتية بذلك. وأيًا كانت دقة القصة، فقد تبعها تغيير: في عام 1949 خُطِّطت منطقة منتجعات
    على طول ساحل غوريا، وزُرع حزام من صنوبر بيتسوندا على مسافة خمسين كيلومترًا بين كوبوليتي وبوتي، وفي
    عام 1953 حصل أوريكي على صفة بلدة.


    لا يزال الصنوبر الظل الوحيد، ولا يزال الشاطئ يفعل ما تحبه العائلات فيه. الرمل ناعم وداكن، والبحر يبقى
    ضحلًا إلى حدّ أن الشخص البالغ يمكنه السير عشرين إلى أربعين مترًا قبل أن يبلغ الماء ذقنه. قلب هذا الشريط
    هو حي المغنتيت، بين نهري كوتشخا وسيبا. تبقى المزاعم عن خصائصه الشافية معتقدًا شعبيًا لا طبًا مثبتًا؛
    والماء الدافئ الهادئ لا يحتاج إلى مثل هذا الدفاع.


    عند الغسق يبرد الرمل، وتنبعث من الصنوبر رائحة الراتينج، ويأخذ البحر لون القصدير.
  tip: >-
    يمتد الموسم من يونيو إلى منتصف سبتمبر؛ ويجلب سبتمبر ماءً دافئًا ونصف الحشود. في أغسطس تعال قبل الساعة
    10:00، وإلا صار العثور على موقف قرب الشاطئ سباقًا. يسخن الرمل الأسود بشدة بحلول الظهر: احمل حذاء الشاطئ
    وشمسية وحماية قوية من الشمس، فالصنوبر هو الظل الوحيد. المتاجر والصرافات في وسط البلدة، والمقاهي الصغيرة
    كثيرًا ما تقبل النقد فقط. احجز الإقامة مبكرًا ليوليو وأغسطس. على مقربة تقع حديقة شكفيتيلي الدندرولوجية
    و«بلاك سي أرينا»، التي قد تملأ حفلاتها البلدة في ليالي العروض.
  route: >-
    من تبليسي على الطريق S1 (E60) غربًا عبر أنفاق ريكوتي وبمحاذاة كوتايسي حتى سامتريديا، ثم S12 (E692)
    عبر لانتشخوتي إلى الساحل عند غريغوليتي. انحرف جنوبًا إلى S2: يبدأ أوريكي مباشرة بعد نهر سوبسا، بعد
    كيلومترات قليلة. نحو 320 كم وحوالي 4 ساعات و40 دقيقة، كلها على أسفلت، مع محطات وقود طوال الطريق —
    وسامتريديا ولانتشخوتي محطتان مناسبتان للتوقف. سيارة اقتصادية عادية كافية تمامًا. في أيام الجمعة وعطلات
    نهاية الأسبوع الصيفية يزدحم الطريق الساحلي نحو باتومي، فانطلق من تبليسي في الصباح الباكر.
