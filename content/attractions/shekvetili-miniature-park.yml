ka:
  name: მინიატურების პარკი („საქართველო მინიატურაში“)
  short: >-
    საქართველოს ორმოცდაათზე მეტი ღირსშესანიშნაობა 1:25 მასშტაბით, ზღვისპირა შეკვეთილში — მთელი ქვეყანა
    ერთ საათში, ფეხით.
  body: >-
    **შეკვეთილში მთის ქვის კოშკებიდან ძველი თბილისის ხის აივნებამდე ისე მიხვალთ, რომ ნაყინი დადნობასაც
    ვერ მოასწრებს.**


    „საქართველო მინიატურაში“ სანაპირო მაგისტრალის პირას, გასართობი პარკ „ციცინათელას“ გვერდით, დაახლოებით
    ორ ჰექტარზეა გაშენებული. 2016 წელს ფონდმა „ქართუმ“ ის სახელმწიფოს გადასცა. ყველა მაკეტი 1:25 მასშტაბითაა
    დამზადებული — ერთი დეტალური ჩამონათვალი 54-ს ითვლის, ტურიზმის ეროვნული ადმინისტრაცია „დაახლოებით სამოცს“
    წერს — და ერთად მთელ ქვეყანას მოიცავს: სიღნაღის გალავანს, აბანოთუბნის გუმბათებს, კლდეზე შემდგარ მეტეხს,
    ქუთაისის ბაგრატის ტაძარს, ანანურს, უბისას, ქვის სოფელ შატილს, კაცხის სვეტს, სვეტიცხოველს, ნარიყალასა
    და ონის სინაგოგას.


    მასშტაბი თვალს ატყუებს. 1:25-ზე ოცდახუთმეტრიანი სამრეკლო სულ ერთი მეტრია, ამიტომ პატარა ბავშვები ტაძრებს
    თვალებში უყურებენ, მშობლები კი საინფორმაციო დაფებთან იხრებიან. ვინც საქართველოს გზებზე უკვე ერთი კვირაა
    მოგზაურობს, მისთვის მთავარი სიამოვნება ცნობაა: აი, ციხე, რომელზეც სამშაბათს ახვედით, აი, მონასტერი,
    რომელსაც გზად ჩაუარეთ და არ გაჩერდით.


    ნამდვილი, ერთი ერთზე ისტორია თავად კურორტის მიწაშია. XVIII საუკუნეში შეკვეთილი გურიის სავაჭრო ადგილი
    იყო; 1723 წლიდან აქ ოსმალთა გარნიზონი იდგა, რომელიც მას „შეფქეთილს“ ეძახდა, 1812 წლის ბუქარესტის ზავის
    შემდეგ კი რუსებისთვის ის წმინდა ნიკოლოზის სიმაგრე გახდა. 1853 წლის 15-16 ოქტომბრის ღამეს ოსმალთა ლაშქარმა
    საგუშაგო იერიშით აიღო — ეს ყირიმის ომის ერთ-ერთი პირველი შეტაკება იყო კავკასიაში. სანაპიროს ფიჭვნარი
    მოგვიანებით გაჩნდა: 1949 წელს გურიის ზღვისპირეთის საკურორტო ზოლად მოწყობა გადაწყდა და ორმოცდაათ კილომეტრზე
    ბიჭვინთის ფიჭვი გააშენეს.


    აქედან სიით ხელში წახვალთ. ყოველ მაკეტს თავისი სრული ზომის დედანი აქვს — სადღაც იქ, საქარე მინის მიღმა.
  tip: >-
    ტურიზმის ეროვნული ადმინისტრაციის ცნობით, პარკი ზამთარში 09:00-დან 18:00-მდე მუშაობს, ზაფხულში — 09:00-დან
    შუაღამემდე. ბილეთის ბოლოს დაფიქსირებული ფასი 14 ლარი იყო (უფრო ძველი ცნობით — 5 ლარი, ექვს წლამდე
    ბავშვებისთვის უფასოდ), ამიტომ ფასი ადგილზე დააზუსტეთ. ბილიკები სწორია, ბავშვის ეტლითაც მოსახერხებელი,
    მაგრამ ჩრდილი თითქმის არ არის: ივლის-აგვისტოში დილით ან საღამოს ექვსის შემდეგ მოდით, როცა დაბალი მზე
    მაკეტებს გრძელ, მკაფიო ჩრდილებს აყოლებს და ყველა დეტალი უკეთ იკითხება. დღე ახლომდებარე შეკვეთილის
    დენდროლოგიური პარკითა და შეკვეთილის შავი ქვიშის პლაჟზე ბანაობით გააგრძელეთ.
  route: >-
    შეკვეთილამდე თბილისიდან 316 კილომეტრია, დაახლოებით 4 საათი და 15 წუთი, მთელ გზაზე ასფალტით. E60-ით
    (ს1) დასავლეთისკენ იარეთ — ხაშურის, რიკოთის მონაკვეთისა და ზესტაფონის გავლით, ქუთაისის გვერდის ავლით
    სამტრედიამდე; იქიდან ს12-ით ლანჩხუთის გავლით ზღვამდე, გრიგოლეთამდე ჩადით. შემდეგ ს2-ით სამხრეთისკენ,
    ურეკის გავლით, დაახლოებით ათ კილომეტრში ძველ სანაპირო გზაზე შეკვეთილისკენ გადაუხვიეთ; პარკი „ციცინათელას“
    გვერდითაა, ავტოსადგომით. საწვავს ხაშურში, ზესტაფონსა და სამტრედიაში მარტივად შეავსებთ. ეკონომ კლასის
    მანქანა სავსებით საკმარისია; ზაფხულში მხოლოდ გრიგოლეთსა და ქობულეთს შორის საკურორტო საცობები გაითვალისწინეთ.
en:
  name: Miniature Park (Georgia in Miniature)
  short: >-
    Over fifty of Georgia's landmarks at 1:25 scale on two hectares by the sea at Shekvetili — a whole
    country crossed on foot in an hour.
  body: >-
    **At Shekvetili you can stroll from the stone towers of the mountains to the wooden balconies of Old
    Tbilisi before an ice cream has time to melt.**


    Georgia in Miniature spreads over about two hectares beside the coastal highway, next door to the
    Tsitsinatela amusement park. The Cartu Foundation handed it to the Georgian state in 2016. Every model
    is built at 1:25 — one detailed listing counts 54, the national tourism board says about sixty — and
    together they cover the country: the walls of Sighnagi, the bathhouse domes of Abanotubani, Metekhi
    on its cliff, Bagrati Cathedral in Kutaisi, Ananuri, Ubisa, the stone village of Shatili, the Katskhi
    Pillar, Svetitskhoveli, Narikala and the Oni synagogue.


    Scale plays tricks on the eye. At 1:25 a bell tower twenty-five metres high stands a single metre
    tall, so small children meet cathedrals eye to eye while their parents stoop over the information
    panels. For anyone who has already spent a week on Georgian roads, the real pleasure is recognition:
    there is the fortress you climbed on Tuesday, there the monastery you drove past without stopping.


    The full-scale history lies in the ground beneath the resort. In the eighteenth century Shekvetili
    was a Gurian trading post; the Ottomans garrisoned it from 1723 and called it Shefketil, and after
    the Treaty of Bucharest of 1812 it became the Russians' Fort of St Nicholas. On the night of 15–16
    October 1853 an Ottoman force stormed the post — one of the first clashes of the Crimean War in the
    Caucasus. The pines came later: in 1949 the authorities decided to turn this shore into a resort strip,
    and Pitsunda pine was planted along some fifty kilometres of it.


    You will leave with a list. Every model here has a full-size original somewhere beyond the windscreen.
  tip: >-
    Georgia's national tourism board gives the hours as 09:00–18:00 in winter and 09:00 to midnight in
    summer. The last reported ticket price was 14 GEL (an older listing said 5 GEL, with under-sixes free),
    so check at the gate. The paths are flat and easy with a pushchair, but there is almost no shade:
    in July and August come in the morning or after six, when the low sun throws long, crisp shadows and
    the details read better. Round off the day at the Dendrological Park up the road and with a swim off
    Shekvetili's black sand.
  route: >-
    Shekvetili is 316 km from Tbilisi, about 4 hours 15 minutes, on asphalt all the way. Take the E60
    (S1) west past Khashuri, through the Rikoti section and past Zestaponi and Kutaisi to Samtredia, then
    the S12 through Lanchkhuti to the coast at Grigoleti. Turn south on the S2, past Ureki, and after
    about ten kilometres bear off onto the old coast road into Shekvetili; the park sits beside Tsitsinatela,
    with parking at hand. Fuel is easy at Khashuri, Zestaponi and Samtredia. An economy car is all you
    need; in summer the only real hazard is beach traffic between Grigoleti and Kobuleti.
ru:
  name: Парк миниатюр («Грузия в миниатюре»)
  short: >-
    Больше полусотни достопримечательностей Грузии в масштабе 1:25 на двух гектарах у моря в Шекветили
    — целую страну можно пройти пешком за час.
  body: >-
    **В Шекветили от каменных башен высокогорья до деревянных балконов Старого Тбилиси можно дойти прежде,
    чем успеет растаять мороженое.**


    «Грузия в миниатюре» раскинулась примерно на двух гектарах у приморской трассы, по соседству с парком
    развлечений «Цицинатела». В 2016 году фонд «Карту» передал её государству. Каждая модель выполнена
    в масштабе 1:25 — один подробный перечень насчитывает 54 макета, национальная туристическая администрация
    говорит примерно о шестидесяти, — и вместе они охватывают всю страну: стены Сигнахи, купола бань Абанотубани,
    Метехи на своём утёсе, собор Баграти в Кутаиси, Ананури, Убиси, каменное село Шатили, столп Кацхи,
    Светицховели, Нарикала и синагога Они.


    Масштаб обманывает глаз. В пропорции 1:25 колокольня высотой двадцать пять метров вырастает всего
    на метр, так что маленькие дети смотрят на соборы глаза в глаза, а родители склоняются над информационными
    табличками. Тому, кто уже провёл неделю на грузинских дорогах, главное удовольствие здесь — узнавание:
    вот крепость, на которую вы поднимались во вторник, а вот монастырь, мимо которого проехали не останавливаясь.


    Настоящая история, в натуральную величину, лежит в земле под курортом. В XVIII веке Шекветили был
    гурийским торговым пунктом; с 1723 года здесь стоял османский гарнизон, называвший место Шефкетиль,
    а после Бухарестского мира 1812 года оно стало русским укреплением Святого Николая. В ночь с 15 на
    16 октября 1853 года османский отряд штурмом взял пост — это была одна из первых стычек Крымской войны
    на Кавказе. Сосны появились позже: в 1949 году власти решили превратить этот берег в курортную полосу,
    и примерно на пятьдесят километров вдоль него высадили пицундскую сосну.


    Уедете вы отсюда со списком. У каждой модели есть оригинал в полную величину — где-то там, за лобовым
    стеклом.
  tip: >-
    Национальная туристическая администрация Грузии указывает часы работы: зимой 09:00–18:00, летом с
    09:00 до полуночи. Последняя известная цена билета — 14 лари (в более старом источнике — 5 лари, дети
    до шести лет бесплатно), так что уточните на входе. Дорожки ровные, с детской коляской пройти легко,
    но тени почти нет: в июле и августе приезжайте утром или после шести вечера, когда низкое солнце отбрасывает
    длинные чёткие тени и детали читаются лучше. Завершите день в Дендрологическом парке чуть дальше по
    дороге и купанием у чёрного песка Шекветили.
  route: >-
    Шекветили лежит в 316 км от Тбилиси, это около 4 часов 15 минут, и всё время по асфальту. Езжайте
    по E60 (S1) на запад мимо Хашури, через Рикотский участок, мимо Зестафони и Кутаиси до Самтредиа,
    затем по S12 через Ланчхути к морю у Григолети. Там поверните на юг, на S2, мимо Уреки, и примерно
    через десять километров уйдите на старую прибрежную дорогу в Шекветили; парк стоит рядом с «Цицинателой»,
    парковка под рукой. Заправиться легко в Хашури, Зестафони и Самтредиа. Машины эконом-класса вполне
    достаточно; летом единственная настоящая помеха — пляжные пробки между Григолети и Кобулети.
fa:
  name: پارک مینیاتور (گرجستان در مینیاتور)
  short: >-
    بیش از پنجاه جاذبهٔ گرجستان در مقیاس ۱:۲۵ روی دو هکتار کنار دریا در شکوتیلی — کشوری کامل که می‌شود
    در یک ساعت پیاده از آن گذشت.
  body: >-
    **در شکوتیلی می‌توانید از برج‌های سنگی کوهستان تا بالکن‌های چوبی تفلیس قدیم قدم بزنید، پیش از آن‌که
    بستنی‌تان فرصت آب شدن پیدا کند.**


    «گرجستان در مینیاتور» در حدود دو هکتار کنار بزرگراه ساحلی گسترده است، همسایهٔ شهربازی تسیتسیناتلا.
    بنیاد کارتو در سال ۲۰۱۶ آن را به دولت گرجستان واگذار کرد. همهٔ مدل‌ها در مقیاس ۱:۲۵ ساخته شده‌اند
    — یک فهرست دقیق ۵۴ مدل می‌شمارد و ادارهٔ ملی گردشگری از حدود شصت مدل سخن می‌گوید — و روی هم سراسر
    کشور را در بر می‌گیرند: باروهای سیغناغی، گنبدهای حمام‌های آبانوتوبانی، متخی بر فراز صخره‌اش، کلیسای
    جامع باگراتی در کوتایسی، آنانوری، اوبیسا، روستای سنگی شاتیلی، ستون کاتسخی، سوتیتسخوولی، ناریکالا و
    کنیسهٔ اونی.


    مقیاس با چشم بازی می‌کند. در نسبت ۱:۲۵، برج ناقوسی به بلندای بیست‌وپنج متر فقط یک متر قد دارد؛ برای
    همین کودکان خردسال با کلیساهای جامع چشم در چشم می‌شوند و پدر و مادرها روی تابلوهای اطلاعات خم می‌شوند.
    برای کسی که یک هفته را در جاده‌های گرجستان گذرانده، لذت اصلی بازشناختن است: آن‌جا قلعه‌ای است که سه‌شنبه
    از آن بالا رفتید، و آن‌جا صومعه‌ای که بی‌توقف از کنارش گذشتید.


    تاریخ در اندازهٔ واقعی‌اش زیر خاک همین تفرجگاه خفته است. در سدهٔ هجدهم، شکوتیلی پایگاهی تجاری در گوریا
    بود؛ عثمانی‌ها از ۱۷۲۳ در آن پادگان مستقر کردند و آن را «شفکتیل» نامیدند، و پس از معاهدهٔ بخارست در
    ۱۸۱۲ به «دژ سن نیکلای» روس‌ها بدل شد. در شب ۱۵ به ۱۶ اکتبر ۱۸۵۳ نیرویی عثمانی به این پاسگاه یورش برد
    و آن را گرفت — یکی از نخستین درگیری‌های جنگ کریمه در قفقاز. کاج‌ها بعدتر آمدند: در ۱۹۴۹ مقامات تصمیم
    گرفتند این کرانه را به نواری تفریحی تبدیل کنند و در طول حدود پنجاه کیلومتر از آن کاج پیتسوندا کاشتند.


    با یک فهرست از این‌جا خواهید رفت. هر مدل این پارک، اصلی در اندازهٔ واقعی دارد، جایی آن سوی شیشهٔ جلوی
    خودرو.
  tip: >-
    ادارهٔ ملی گردشگری گرجستان ساعات کار را در زمستان ۰۹:۰۰ تا ۱۸:۰۰ و در تابستان ۰۹:۰۰ تا نیمه‌شب اعلام
    کرده است. آخرین قیمت گزارش‌شدهٔ بلیت ۱۴ لاری بوده است (فهرستی قدیمی‌تر ۵ لاری ذکر کرده و ورود کودکان
    زیر شش سال را رایگان دانسته)، پس دم در بپرسید. مسیرها هموار و برای کالسکه آسان‌اند، اما تقریباً هیچ
    سایه‌ای نیست: در ژوئیه و اوت صبح یا بعد از ساعت شش عصر بیایید، وقتی خورشید پایین سایه‌هایی بلند و
    روشن می‌اندازد و جزئیات بهتر دیده می‌شوند. روز را با پارک درخت‌شناسی، کمی بالاتر در همین جاده، و شنایی
    در کنار ماسه‌های سیاه شکوتیلی به پایان ببرید.
  route: >-
    شکوتیلی ۳۱۶ کیلومتر از تفلیس فاصله دارد، حدود ۴ ساعت و ۱۵ دقیقه، و تمام راه آسفالت است. از E60 (S1)
    رو به غرب بروید، از کنار خاشوری، از بخش ریکوتی و از کنار زستافونی و کوتایسی تا سامتردیا؛ سپس از S12
    و از میان لانچخوتی تا ساحل در گریگولتی. آن‌جا به جنوب، به S2، بپیچید، از کنار اورکی بگذرید و پس از
    حدود ده کیلومتر به جادهٔ ساحلی قدیمی به سوی شکوتیلی بروید؛ پارک کنار تسیتسیناتلا است و پارکینگ همان
    نزدیکی. سوخت‌گیری در خاشوری، زستافونی و سامتردیا آسان است. یک خودروی اقتصادی کافی است؛ در تابستان
    تنها دردسر واقعی، ترافیک ساحلی میان گریگولتی و کوبولتی است.
he:
  name: פארק המיניאטורות ("גאורגיה במיניאטורה")
  short: >-
    יותר מחמישים מאתרי גאורגיה בקנה מידה 1:25, על פני שני הקטרים ליד הים בשקווטילי — מדינה שלמה שחוצים
    ברגל בתוך שעה.
  body: >-
    **בשקווטילי אפשר לטייל ממגדלי האבן של ההרים אל המרפסות העשויות עץ של טביליסי העתיקה, לפני שהגלידה
    תספיק להימס.**


    "גאורגיה במיניאטורה" משתרעת על כשני הקטרים לצד הכביש החופי, בשכנות לפארק השעשועים ציצינאטלה. בשנת
    2016 העבירה אותה קרן קארטו לידי המדינה. כל דגם בנוי בקנה מידה 1:25 — רשימה מפורטת אחת מונה 54 דגמים,
    רשות התיירות הלאומית מדברת על כשישים — ויחד הם מכסים את המדינה כולה: חומות סיגנאגי, כיפות בתי המרחץ
    של אבאנוטובני, מטחי על צוקה, קתדרלת בגראטי בקוטאיסי, אנאנורי, אוביסה, כפר האבן שאטילי, עמוד קצחי,
    סווטיצחוולי, נריקלה ובית הכנסת של אוני.


    קנה המידה משחק בעין. ביחס של 1:25, מגדל פעמונים בגובה עשרים וחמישה מטרים מתנשא למטר אחד בלבד, כך שילדים
    קטנים פוגשים קתדרלות בגובה העיניים, בעוד הוריהם רוכנים מעל שלטי ההסבר. למי שכבר בילה שבוע בכבישי גאורגיה,
    ההנאה האמיתית היא הזיהוי: הנה המבצר שטיפסתם אליו ביום שלישי, והנה המנזר שחלפתם על פניו בלי לעצור.


    ההיסטוריה בגודל טבעי טמונה באדמה שמתחת לאתר הנופש. במאה ה־18 הייתה שקווטילי תחנת מסחר גורית; העות׳מאנים
    הציבו בה חיל מצב מ־1723 וקראו לה שפקטיל, ולאחר חוזה בוקרשט של 1812 היא הפכה למבצר סנט ניקולאי של הרוסים.
    בליל 15–16 באוקטובר 1853 הסתער כוח עות׳מאני על המוצב וכבש אותו — אחד העימותים הראשונים של מלחמת קרים
    בקווקז. האורנים הגיעו מאוחר יותר: ב־1949 החליטו השלטונות להפוך את החוף הזה לרצועת נופש, ולאורך כחמישים
    קילומטרים ממנו נשתל אורן פיצונדה.


    תצאו מכאן עם רשימה. לכל דגם כאן יש מקור בגודל מלא, אי שם מעבר לשמשה הקדמית.
  tip: >-
    רשות התיירות הלאומית של גאורגיה מציינת שעות פתיחה של 09:00–18:00 בחורף ו־09:00 עד חצות בקיץ. מחיר
    הכרטיס האחרון שדווח היה 14 לארי (ברשימה ישנה יותר צוין 5 לארי, וכניסה חינם לילדים מתחת לגיל שש), לכן
    כדאי לבדוק בכניסה. השבילים שטוחים ונוחים לעגלת ילדים, אבל כמעט אין צל: ביולי ובאוגוסט בואו בבוקר או
    אחרי שש בערב, כשהשמש הנמוכה מטילה צללים ארוכים וחדים והפרטים נקראים טוב יותר. סיימו את היום בפארק
    הדנדרולוגי, קצת הלאה בהמשך הדרך, ובשחייה מול החול השחור של שקווטילי.
  route: >-
    שקווטילי נמצאת 316 ק"מ מטביליסי, כארבע שעות ורבע, כולה על אספלט. סעו בכביש E60 (S1) מערבה, על פני
    חשורי, דרך קטע ריקוטי ועל פני זסטפוני וקוטאיסי עד סמטרדיה, ומשם בכביש S12 דרך לנצ׳חותי אל החוף בגריגולטי.
    שם פנו דרומה לכביש S2, עברו את אורקי, ואחרי כעשרה קילומטרים סטו אל הכביש החופי הישן אל תוך שקווטילי;
    הפארק שוכן לצד ציצינאטלה, והחניה בהישג יד. קל לתדלק בחשורי, בזסטפוני ובסמטרדיה. רכב חסכוני הוא כל
    מה שצריך; בקיץ הסכנה האמיתית היחידה היא פקקי החוף בין גריגולטי לקובולטי.
ar:
  name: حديقة المصغّرات («جورجيا المصغّرة»)
  short: أكثر من خمسين معلمًا جورجيًا بمقياس 1:25 على هكتارين قرب البحر في شيكفيتيلي — بلدٌ كامل تعبره
    سيرًا في ساعة.
  body: >-
    **في شيكفيتيلي يمكنك أن تتمشّى من الأبراج الحجرية في الجبال إلى الشرفات الخشبية في تبليسي القديمة
    قبل أن يجد الآيس كريم في يدك وقتًا ليذوب.**


    تمتد «جورجيا المصغّرة» على نحو هكتارين بجوار الطريق الساحلي، إلى جانب مدينة الملاهي تسيتسيناتيلا.
    وقد سلّمتها مؤسسة كارتو إلى الدولة الجورجية عام 2016. كل نموذج فيها مصنوع بمقياس 1:25 — تُحصي إحدى
    القوائم المفصّلة 54 نموذجًا، بينما تتحدث الهيئة الوطنية للسياحة عن نحو ستين — ومعًا تغطي البلاد كلها:
    أسوار سيغناغي، وقباب حمّامات أبانوتوباني، وميتيخي فوق جرفها، وكاتدرائية باغراتي في كوتايسي، وأنانوري،
    وأوبيسا، وقرية شاتيلي الحجرية، وعمود كاتسخي، وسفيتيتسخوفيلي، وناريكالا، وكنيس أوني.


    يلعب المقياس بالعين. فبنسبة 1:25، برجُ أجراسٍ ارتفاعه خمسة وعشرون مترًا لا يزيد هنا على متر واحد،
    فيقف الأطفال الصغار أمام الكاتدرائيات عينًا بعين، بينما ينحني آباؤهم على لوحات المعلومات. ومن قضى
    أسبوعًا على طرق جورجيا يجد المتعة الحقيقية في التعرّف: هذه هي القلعة التي صعدت إليها يوم الثلاثاء،
    وذاك هو الدير الذي مررت به دون أن تتوقف.


    أما التاريخ بحجمه الحقيقي فيرقد في الأرض تحت المنتجع. ففي القرن الثامن عشر كانت شيكفيتيلي مركزًا تجاريًا
    غوريًّا؛ ورابطت فيها حامية عثمانية منذ عام 1723 وأطلقت عليها اسم «شفكتيل»، وبعد معاهدة بوخارست عام
    1812 صارت «حصن القديس نيقولاوس» الروسي. وفي ليلة 15–16 أكتوبر 1853 اقتحمت قوة عثمانية الموقع — وكانت
    من أولى اشتباكات حرب القرم في القوقاز. أما الصنوبر فجاء لاحقًا: ففي عام 1949 قررت السلطات تحويل هذا
    الساحل إلى شريط للاصطياف، وغُرس صنوبر بيتسوندا على امتداد نحو خمسين كيلومترًا منه.


    ستغادر من هنا ومعك قائمة. فلكل نموذج في الحديقة أصلٌ بحجمه الكامل، في مكان ما وراء الزجاج الأمامي
    لسيارتك.
  tip: >-
    تحدد الهيئة الوطنية للسياحة في جورجيا ساعات العمل من 09:00 إلى 18:00 شتاءً، ومن 09:00 حتى منتصف الليل
    صيفًا. آخر سعر معلن للتذكرة كان 14 لاري (وذكرت قائمة أقدم 5 لاري، مع دخول مجاني لمن هم دون السادسة)،
    فتحقّق عند البوابة. الممرات مستوية وسهلة لعربة الأطفال، لكن الظل يكاد ينعدم: في يوليو وأغسطس تعالَ
    صباحًا أو بعد السادسة مساءً، حين تلقي الشمس المنخفضة ظلالًا طويلة حادة فتبدو التفاصيل أوضح. واختم
    يومك في حديقة شيكفيتيلي للأشجار القريبة على الطريق نفسه، وبسباحة قبالة الرمال السوداء في شيكفيتيلي.
  route: >-
    تبعد شيكفيتيلي عن تبليسي 316 كم، أي نحو 4 ساعات و15 دقيقة، والطريق معبّد طوال الوقت. اسلك الطريق E60
    (S1) غربًا مرورًا بخاشوري، ثم مقطع ريكوتي، فزيستافوني وكوتايسي حتى سامتريديا، ثم الطريق S12 عبر لانتشخوتي
    إلى الساحل عند غريغوليتي. هناك انعطف جنوبًا إلى الطريق S2 مرورًا بأوريكي، وبعد نحو عشرة كيلومترات
    انحرف إلى الطريق الساحلي القديم داخلًا شيكفيتيلي؛ تقع الحديقة بجوار تسيتسيناتيلا، والموقف في متناول
    اليد. التزوّد بالوقود سهل في خاشوري وزيستافوني وسامتريديا. تكفي سيارة اقتصادية؛ وفي الصيف تبقى العقبة
    الحقيقية الوحيدة زحمة الشاطئ بين غريغوليتي وكوبوليتي.
