ka:
  name: მშვიდობის ხიდი და რიყის პარკი
  short: >-
    მინისა და ფოლადის ტალღა მტკვარზე, რომელიც ფეხის ნაბიჯზე ინთება, და სანაპირო პარკი, საიდანაც საბაგირო
    ნარიყალასკენ მიცურავს.
  body: >-
    **მშვიდობის ხიდზე სიბნელეში შედგამთ ფეხს და მინის მოაჯირი მხოლოდ თქვენი ნაბიჯებისთვის აინთება.** ამას
    240 მოძრაობის სენსორი აკეთებს — ფრანგი დიზაინერის, ფილიპ მარტინოს, განათების სისტემის ნაწილი, რომელიც
    მიკელე დე ლუკის ფოლადისა და მინის 150-მეტრიან გადახურვაშია ჩაშენებული. ხიდი 2010 წლის 6 მაისს გაიხსნა;
    მისი კონსტრუქცია იტალიაში დაამზადეს და თბილისში ორასი სატვირთოთი ჩამოიტანეს.


    ახედეთ ზემოთ: 1208 სანათით მოჭედილი სახურავი თავის პროგრამებს ცვლის — ხან ტალღად გადადის ერთი ნაპირიდან
    მეორეზე, ხან სინათლის ორი ზოლი ერთმანეთს შუაში ხვდება, ხან ღამის ცასავით ციმციმებს. საათში ერთხელ
    მოაჯირებზე მორზეს ანბანით გზავნილი გაირბენს — ქიმიურ ელემენტთა პერიოდული სისტემა. თავად მარტინოს სიტყვით,
    ეს „სიცოცხლისა და ხალხთა შორის მშვიდობის“ ზეიმია. მის წასაკითხად თითქმის არავინ ჩერდება.


    თბილისი ერთსულოვანი არ ყოფილა. არქიტექტორები და ოპოზიციონერი პოლიტიკოსები ამბობდნენ, რომ ხიდი ძველ
    ქალაქს ახშობს და მის ძეგლებს ფარავს, ქალაქის ენამ კი მას ჰიგიენური საფენის სახელი, „ოლვეისი“, შეარქვა.
    მიუხედავად ამისა, მასზე დღენიადაგ გადის ხალხი, შუა ხიდიდან კი ერთდროულად ჩანს კლდეზე შემდგარი მეტეხი,
    ქედზე გაწოლილი ნარიყალა და ფეხქვეშ ჩამავალი მღვრიე მტკვარი.


    მარცხენა ნაპირზე რიყის პარკია: გაზონები, მუსიკალური შადრევანი, უზარმაზარი ჭადრაკის დაფა და ნარიყალას
    საბაგიროს ქვედა სადგური. პარკის შუაგულში მასიმილიანო ფუქსასის ორი გიგანტური ფოლადის მილი — მუსიკალური
    თეატრისა და საგამოფენო დარბაზის შენობა — წევს, ფერდობზე კი საზეიმო სასახლის მინის გუმბათი მოჩანს.
    ერთად ისინი 2000-იანი წლების ბოლოსა და 2010-იანების დასაწყისის მინისა და ფოლადის თბილისის ყველაზე
    თამამი განცხადებაა. აქ შებინდებისას მოდით, როცა ძველი და ახალი ქალაქი ერთად ინთება.
  tip: >-
    ერთი საათი საკმარისია ხიდზე გასავლელად, რიყის პარკის შემოსავლელად და ნარიყალაზე საბაგიროთი ასასვლელად.
    საბაგიროში თბილისის სამგზავრო ბარათით იხდით — მისი ყიდვაც და შევსებაც სადგურის სალაროშია; ნაღდი ფულით
    ტურნიკეტს ვერ გაივლით. წვიმასა და ყინვაში ხიდის იატაკი სრიალებს, ამიტომ კიბეებზე ფრთხილად იარეთ. ზაფხულის
    შუადღეს პარკში ჩრდილი არ არის და ცხელა — ჯობს საღამოს მოხვიდეთ, როცა განათება ირთვება. კაფეები ხიდის
    ორივე ბოლოშია, ტუალეტი — პარკში. პანდუსების წყალობით ხიდი და პარკი ბავშვის ეტლითაც და სავარძელ-ეტლითაც
    მისაწვდომია.
  route: >-
    რიყის პარკი თავისუფლების მოედნიდან დაახლოებით 3 კილომეტრშია — მანქანით 10–15 წუთი: მტკვარი ბარათაშვილის
    ხიდით გადაკვეთეთ და მარცხენა სანაპიროს დინების მიმართულებით ჩაუყევით პარკამდე. აქაური ფასიანი სადგომი
    ძველი ქალაქის მიდამოებში ერთადერთი დიდი და კარგად მოწყობილი ავტოსადგომია: დილით ადგილი ჩვეულებრივ
    არის, ზაფხულის საღამოობით კი ივსება. აქედან ხიდი, საბაგირო და მეტეხი ფეხით სავალზეა, გოგირდის აბანოები
    კი მდინარის გაღმა. მარჯვენა ნაპირზე, ერეკლე II-ისა და შავთელის ვიწრო ქუჩებში, მანქანის დატოვებას ნუ
    ეცდებით. გზა მთლიანად ასფალტია — ეკონომკლასის მანქანაც სავსებით საკმარისია.
en:
  name: Bridge of Peace and Rike Park
  short: >-
    A glass-and-steel wave over the Mtkvari that lights up under your footsteps, and the riverside park
    where the cable car sets off for Narikala.
  body: >-
    **Step onto the Bridge of Peace after dark and the glass rail beside you lights up for your footsteps
    alone.** Two hundred and forty motion sensors do the trick, part of a lighting scheme by the French
    designer Philippe Martinaud laid into Michele De Lucchi's 150-metre canopy of steel and glass. The
    bridge opened on 6 May 2010; its frame was made in Italy and brought to Tbilisi in two hundred trucks.


    Look up and the roof, set with 1,208 LED fixtures, runs through its programmes: waves rolling from
    bank to bank, bands of light racing to meet in the middle, a slow twinkle like a night sky. Once an
    hour a message in Morse code runs along the parapets, spelling out the periodic table of the elements
    — a celebration of "life and peace between people", in Martinaud's words. Almost nobody stops to read
    it.


    Tbilisi was far from unanimous. Architects and opposition politicians protested that the bridge crowds
    the old town and hides its landmarks, and local wit named it after a brand of sanitary pad, "Always
    Ultra". Yet a steady stream of walkers crosses it every day, and from the middle you get Metekhi on
    its cliff, Narikala on the ridge and the brown river sliding beneath your shoes.


    On the left bank lies Rike Park: lawns, a musical fountain, a giant chessboard and the lower station
    of the cable car to Narikala. At its heart lie two enormous steel tubes, Massimiliano Fuksas's Music
    Theatre and Exhibition Hall, and on the slope the glass dome of the Ceremonial Palace. Together they
    are the boldest statement of the glass-and-steel Tbilisi of the late 2000s and early 2010s. Come at
    dusk, when the old city and the new one switch on together.
  tip: >-
    An hour covers the bridge, a loop of Rike Park and the ride up to Narikala. The cable car is paid
    with a Tbilisi transport card, sold and topped up at the station window; cash will not get you through
    the turnstile. The deck turns slippery in rain and frost, so take the steps slowly. On summer afternoons
    the park is shadeless and hot — come in the evening, when the lights begin. Cafés stand at both ends
    and there are toilets in the park. Ramps make the bridge and the park usable with a pushchair or wheelchair.
  route: >-
    Rike Park is about 3 km from Freedom Square, ten to fifteen minutes by car: cross the Mtkvari by Baratashvili
    bridge and follow the left-bank embankment downstream to the park. Its paid car park is the only large,
    properly organised parking near the old town; it usually has space in the morning and fills on summer
    evenings. From here the bridge, the cable car and Metekhi are on foot, and the sulphur baths are just
    across the river. Do not try to leave a car in the narrow lanes of Erekle II or Shavteli Street on
    the right bank. Asphalt throughout — an economy car is all you need.
ru:
  name: Мост Мира и парк Рике
  short: >-
    Стеклянно-стальная волна над Мтквари, которая вспыхивает под вашими шагами, и парк на берегу, откуда
    канатная дорога уходит к Нарикале.
  body: >-
    **Ступите на мост Мира после заката, и стеклянные перила рядом с вами загорятся только для ваших шагов.**
    Это работа двухсот сорока датчиков движения, часть светового замысла французского дизайнера Филиппа
    Мартино, вписанного в 150-метровый навес из стали и стекла по проекту Микеле Де Лукки. Мост открыли
    6 мая 2010 года; его конструкцию изготовили в Италии и привезли в Тбилиси на двухстах грузовиках.


    Поднимите глаза: кровля с 1208 светодиодными светильниками перебирает свои программы. Волны катятся
    от берега к берегу, световые полосы мчатся навстречу друг другу и сходятся посередине, медленно мерцает
    что-то похожее на ночное небо. Раз в час по парапетам бежит послание азбукой Морзе: периодическая
    таблица элементов, по словам Мартино, во славу «жизни и мира между людьми». Почти никто не останавливается,
    чтобы её прочесть.


    Тбилиси встретил мост далеко не единодушно. Архитекторы и оппозиционные политики возмущались, что
    он теснит старый город и заслоняет его ориентиры, а городские остряки окрестили его в честь марки
    гигиенических прокладок — «Олвейз Ультра». И всё же по нему каждый день течёт ровный поток пешеходов,
    а с середины видны Метехи на своей скале, Нарикала на гребне и бурая река, скользящая прямо у вас
    под ногами.


    На левом берегу раскинулся парк Рике: газоны, музыкальный фонтан, гигантская шахматная доска и нижняя
    станция канатной дороги на Нарикалу. В самом сердце парка лежат две огромные стальные трубы — Музыкальный
    театр и выставочный зал Массимилиано Фуксаса, — а на склоне блестит стеклянный купол Церемониального
    дворца. Вместе они — самое дерзкое высказывание стеклянно-стального Тбилиси конца 2000-х — начала
    2010-х. Приходите в сумерки, когда старый и новый город зажигаются одновременно.
  tip: >-
    На мост, круг по парку Рике и подъём к Нарикале хватит часа. Канатная дорога оплачивается тбилисской
    транспортной картой, которую продают и пополняют в окошке на станции; с наличными через турникет не
    пройти. В дождь и мороз настил становится скользким, так что ступеньки проходите не спеша. Летом днём
    в парке нет тени и жарко, приходите вечером, когда включается подсветка. Кафе есть на обоих концах
    моста, туалеты в парке. Благодаря пандусам по мосту и парку можно пройти с коляской или на инвалидной
    коляске.
  route: >-
    Парк Рике находится примерно в 3 км от площади Свободы, в десяти-пятнадцати минутах езды: переезжайте
    Мтквари по мосту Бараташвили и следуйте по левобережной набережной вниз по течению до парка. Его платная
    парковка — единственная большая и толково устроенная стоянка возле старого города; по утрам места
    обычно есть, летними вечерами она заполняется. Отсюда до моста, канатной дороги и Метехи можно дойти
    пешком, а серные бани — сразу за рекой. Не пытайтесь оставить машину в узких переулках улиц Ираклия
    II или Шавтели на правом берегу. Асфальт на всём пути, хватит машины эконом-класса.
fa:
  name: پل صلح و پارک ریکه
  short: >-
    موجی از شیشه و فولاد بر فراز رود متکواری که زیر گام‌هایتان روشن می‌شود، و پارکی کنار رود که تله‌کابین
    ناریکالا از آن به راه می‌افتد.
  body: >-
    **پس از تاریکی پا بر پل صلح بگذارید تا نردهٔ شیشه‌ایِ کنارتان تنها برای گام‌های شما روشن شود.** این
    کار دویست و چهل حسگر حرکتی است، بخشی از طرح نورپردازی فیلیپ مارتینو، طراح فرانسوی، که در سایه‌بان
    ۱۵۰ متریِ فولاد و شیشهٔ میکله د لوکی جای گرفته است. پل در ۶ مهٔ ۲۰۱۰ گشایش یافت؛ اسکلتش در ایتالیا
    ساخته شد و با دویست کامیون به تفلیس رسید.


    سر بلند کنید: سقف، با ۱۲۰۸ چراغ ال‌ای‌دی، برنامه‌هایش را یکی‌یکی اجرا می‌کند. موج‌هایی از این کرانه
    تا آن کرانه می‌غلتند، نوارهای نور به سوی هم می‌شتابند و در میانه به هم می‌رسند، و سوسویی آرام، همچون
    آسمان شب، بر سقف می‌دود. ساعتی یک بار پیامی به الفبای مورس در طول جان‌پناه‌ها روان می‌شود و جدول تناوبی
    عناصر را هجی می‌کند؛ به گفتهٔ مارتینو، ستایشی از «زندگی و صلح میان مردم». تقریباً هیچ‌کس برای خواندنش
    نمی‌ایستد.


    تفلیس دربارهٔ این پل به هیچ روی هم‌داستان نبود. معماران و سیاستمداران مخالف اعتراض کردند که پل شهر
    قدیم را در تنگنا می‌گذارد و نشانه‌هایش را می‌پوشاند، و طنز مردم شهر نام یک مارک نوار بهداشتی را رویش
    گذاشت: «آلویز اولترا». با این همه، جریانی پیوسته از رهگذران هر روز از آن می‌گذرد، و از میانهٔ پل متخی
    را بر صخره‌اش، ناریکالا را بر یال کوه و رود قهوه‌ای را می‌بینید که زیر کفش‌هایتان می‌لغزد.


    بر کرانهٔ چپ، پارک ریکه گسترده است: چمنزارها، فوارهٔ موزیکال، صفحهٔ شطرنجی غول‌پیکر و ایستگاه پایینی
    تله‌کابین ناریکالا. در دل پارک دو لولهٔ فولادی عظیم آرمیده‌اند، تئاتر موسیقی و تالار نمایشگاهِ ماسیمیلیانو
    فوکساس، و بر شیب تپه گنبد شیشه‌ای کاخ تشریفات می‌درخشد. این‌ها با هم جسورانه‌ترین بیانیهٔ تفلیسِ شیشه
    و فولادِ اواخر دههٔ ۲۰۰۰ و اوایل دههٔ ۲۰۱۰ اند. هنگام غروب بیایید، وقتی شهر کهنه و شهر نو با هم چراغ‌هایشان
    را روشن می‌کنند.
  tip: >-
    یک ساعت برای پل، گشتی در پارک ریکه و بالا رفتن تا ناریکالا کافی است. کرایهٔ تله‌کابین با کارت حمل‌ونقل
    تفلیس پرداخت می‌شود که در باجهٔ ایستگاه فروخته و شارژ می‌شود؛ با پول نقد از گیت رد نمی‌شوید. کف پل
    در باران و یخبندان لغزنده می‌شود، پس پله‌ها را آهسته بروید. بعدازظهرهای تابستان پارک بی‌سایه و داغ
    است؛ عصر بیایید، وقتی چراغ‌ها روشن می‌شوند. در هر دو سر پل کافه هست و سرویس بهداشتی در پارک. به لطف
    رمپ‌ها، پل و پارک با کالسکه یا ویلچر قابل استفاده‌اند.
  route: >-
    پارک ریکه حدود ۳ کیلومتر با میدان آزادی فاصله دارد، ده تا پانزده دقیقه با خودرو: از پل باراتاشویلی
    از متکواری بگذرید و در امتداد خیابان ساحلیِ کرانهٔ چپ، در جهت جریان رود، تا پارک پیش بروید. پارکینگ
    پولی پارک تنها پارکینگ بزرگ و درست‌وحسابی نزدیک شهر قدیم است؛ صبح‌ها معمولاً جا دارد و عصرهای تابستان
    پر می‌شود. از این‌جا پل، تله‌کابین و متخی پیاده در دسترس‌اند و حمام‌های گوگردی درست آن سوی رود قرار
    دارند. سعی نکنید خودرو را در کوچه‌های باریک خیابان ارکله دوم یا شاوتلی در کرانهٔ راست رها کنید. سراسر
    مسیر آسفالت است و یک خودروی اکونومی همهٔ نیازتان است.
he:
  name: גשר השלום ופארק ריקה
  short: גל של זכוכית ופלדה מעל נהר המטקווארי, שנדלק תחת צעדיכם, והפארק שעל הגדה, שממנו יוצא הרכבל אל
    נריקלה.
  body: >-
    **עלו על גשר השלום אחרי רדת החשכה, ומעקה הזכוכית שלצדכם יידלק לצעדיכם שלכם בלבד.** מאתיים וארבעים
    חיישני תנועה עושים את הקסם, חלק מתכנית תאורה של המעצב הצרפתי פיליפ מרטינו, ששולבה בגגון הפלדה והזכוכית
    באורך 150 מטר שתכנן מיקלה דה לוקי. הגשר נפתח ב-6 במאי 2010; שלדו יוצר באיטליה והובא לטביליסי במאתיים
    משאיות.


    הרימו את העיניים: הגג, ובו 1,208 גופי תאורת לד, מחליף תכניות. גלים מתגלגלים מגדה לגדה, רצועות אור
    דוהרות זו לקראת זו ונפגשות באמצע, ונצנוץ איטי מזכיר שמי לילה. פעם בשעה רץ לאורך המעקות מסר בקוד מורס,
    המאיית את הטבלה המחזורית של היסודות, ובלשונו של מרטינו, חגיגה של "חיים ושלום בין בני אדם". כמעט איש
    אינו עוצר לקרוא אותו.


    טביליסי כלל לא הייתה תמימת דעים. אדריכלים ופוליטיקאים מן האופוזיציה מחו שהגשר דוחק את העיר העתיקה
    ומסתיר את ציוני הדרך שלה, וההומור המקומי כינה אותו על שם מותג של תחבושות היגייניות, "אולוויז אולטרה".
    ובכל זאת, זרם קבוע של הולכי רגל חוצה אותו מדי יום, ומאמצעו נשקפים מטחי על צוקו, נריקלה על הרכס והנהר
    החום המחליק מתחת לנעליים.


    על הגדה השמאלית משתרע פארק ריקה: מדשאות, מזרקה מוזיקלית, לוח שחמט ענק והתחנה התחתונה של הרכבל לנריקלה.
    בלב הפארק שוכנים שני צינורות פלדה עצומים, תיאטרון המוזיקה ואולם התערוכות של מסימיליאנו פוקסאס, ועל
    המדרון כיפת הזכוכית של ארמון הטקסים. יחד הם ההצהרה הנועזת ביותר של טביליסי של הזכוכית והפלדה מסוף
    שנות ה-2000 וראשית שנות ה-2010. בואו בשעת בין הערביים, כשהעיר העתיקה והעיר החדשה נדלקות יחד.
  tip: >-
    שעה מספיקה לגשר, לסיבוב בפארק ריקה ולעלייה לנריקלה. את הרכבל משלמים בכרטיס התחבורה של טביליסי, שנמכר
    ונטען בקופה שבתחנה; במזומן לא תעברו את הקרוסלה. הרצפה של הגשר נעשית חלקלקה בגשם ובכפור, אז צעדו במדרגות
    לאט. בשעות אחר הצהריים בקיץ אין בפארק צל והוא לוהט; בואו בערב, כשהאורות נדלקים. יש בתי קפה בשני הקצוות
    ושירותים בפארק. בזכות הרמפות אפשר לעבור בגשר ובפארק עם עגלת תינוק או בכיסא גלגלים.
  route: >-
    פארק ריקה נמצא כ-3 ק"מ מכיכר החירות, עשר עד חמש עשרה דקות נסיעה: חצו את המטקווארי בגשר בראטאשווילי
    והמשיכו לאורך טיילת הגדה השמאלית במורד הזרם עד הפארק. החניון בתשלום של הפארק הוא החניון הגדול והמסודר
    היחיד ליד העיר העתיקה; בבוקר יש בו בדרך כלל מקום, ובערבי הקיץ הוא מתמלא. מכאן הגשר, הרכבל ומטחי במרחק
    הליכה, ומרחצאות הגופרית ממש מעבר לנהר. אל תנסו להשאיר רכב בסמטאות הצרות של רחוב ארקלה השני או רחוב
    שאווטלי בגדה הימנית. אספלט לכל אורך הדרך, ורכב חסכוני הוא כל מה שצריך.
ar:
  name: جسر السلام وحديقة ريكه
  short: >-
    موجة من الزجاج والفولاذ فوق نهر متكفاري تضيء تحت خطواتك، وحديقة على الضفة ينطلق منها التلفريك إلى
    قلعة ناريكالا.
  body: >-
    **اخطُ على جسر السلام بعد حلول الظلام، فيضيء الدرابزين الزجاجي بجانبك لخطواتك أنت وحدك.** يصنع هذا
    مئتان وأربعون حساس حركة، هي جزء من مخطط إضاءة وضعه المصمم الفرنسي فيليب مارتينو داخل المظلة الفولاذية
    الزجاجية التي صممها ميكيلي دي لوكي بطول 150 متراً. افتُتح الجسر في 6 مايو 2010؛ وصُنع هيكله في إيطاليا
    ونُقل إلى تبليسي على مئتي شاحنة.


    ارفع بصرك: السقف المرصع بـ1208 وحدات إضاءة ليد يتنقل بين برامجه. أمواج تتدحرج من ضفة إلى ضفة، وأشرطة
    من الضوء تتسابق نحو بعضها لتلتقي في الوسط، ووميض بطيء كأنه سماء الليل. ومرة كل ساعة تجري على الحواجز
    الجانبية رسالة بشيفرة مورس تتهجى الجدول الدوري للعناصر، احتفاءً بـ"الحياة والسلام بين الناس" بعبارة
    مارتينو. لا يكاد أحد يتوقف ليقرأها.


    لم تُجمع تبليسي على الجسر أبداً. فقد احتج معماريون وسياسيون معارضون بأنه يزاحم المدينة القديمة ويحجب
    معالمها، وأطلق عليه ظرفاء المدينة اسم ماركة من الفوط الصحية: "أولويز ألترا". ومع ذلك يعبره كل يوم
    سيل متصل من المشاة، ومن منتصفه ترى ميتيخي على جرفها، وناريكالا على حافة التل، والنهر البني ينساب تحت
    حذائك.


    وعلى الضفة اليسرى تمتد حديقة ريكه: مروج، ونافورة موسيقية، ورقعة شطرنج عملاقة، والمحطة السفلى للتلفريك
    الصاعد إلى ناريكالا. وفي قلبها يقوم أنبوبان فولاذيان هائلان هما المسرح الموسيقي وقاعة المعارض من تصميم
    ماسيميليانو فوكساس، وعلى المنحدر القبة الزجاجية لقصر المراسم. وهي معاً أجرأ بيان لتبليسي الزجاج والفولاذ
    في أواخر العقد الأول وأوائل العقد الثاني من الألفية. تعالَ عند الغسق، حين تضيء المدينة القديمة والمدينة
    الجديدة معاً.
  tip: >-
    تكفي ساعة للجسر ولجولة في حديقة ريكه وللصعود إلى ناريكالا. يُدفع أجر التلفريك ببطاقة النقل في تبليسي،
    التي تُباع وتُشحن من شباك المحطة؛ أما النقود فلن تعبر بك البوابة الدوارة. تصبح أرضية الجسر زلقة في
    المطر والصقيع، فانزل الدرجات على مهل. في عصاري الصيف تكون الحديقة بلا ظل وحارة؛ تعالَ مساءً حين تبدأ
    الأضواء. المقاهي عند طرفي الجسر ودورات المياه في الحديقة. وبفضل المنحدرات يمكن التنقل على الجسر وفي
    الحديقة بعربة أطفال أو بكرسي متحرك.
  route: >-
    تبعد حديقة ريكه نحو 3 كم عن ساحة الحرية، وتستغرق من عشر دقائق إلى ربع ساعة بالسيارة: اعبر نهر متكفاري
    على جسر باراتاشفيلي ثم اتبع كورنيش الضفة اليسرى مع اتجاه التيار حتى الحديقة. موقفها المدفوع هو الموقف
    الكبير المنظم الوحيد قرب المدينة القديمة؛ وتتوفر فيه أماكن عادة صباحاً، ويمتلئ في أمسيات الصيف. ومن
    هنا تصل مشياً إلى الجسر والتلفريك وميتيخي، والحمامات الكبريتية على الضفة المقابلة مباشرة. لا تحاول
    ترك السيارة في الأزقة الضيقة لشارعي إريكلي الثاني وشافتيلي على الضفة اليمنى. الطريق مسفلت كله، وتكفيك
    سيارة اقتصادية.
