ka:
  name: მშვიდობის ხიდი და რიყის პარკი
  short: |-
    შუშისა და ფოლადის საფეხმავლო ხიდი მტკვარზე და მის ბოლოში გაშენებული პარკი საბაგიროს ქვედა სადგურით.
  body: |-
    **მშვიდობის ხიდი თბილისის ყველაზე მეტად განხილული თანამედროვე ნაგებობაა.** 2010 წლის მაისში გაიხსნა, დააპროექტა იტალიელმა არქიტექტორმა მიკელე დე ლუკიმ, სიგრძით დაახლოებით 150 მეტრი, ფოლადის კარკასითა და შუშის ტალღოვანი ჩამონაფარით. ღამით მასზე ათასობით შუქდიოდი ინთება; განათების პროგრამა ყოველ საათში მორზეს კოდით ადამიანის ორგანიზმის ქიმიური ელემენტების სახელებს „ამბობს" — დეტალი, რომელსაც თითქმის არავინ ამჩნევს.

    ხიდმა ადგილობრივებში ერთბაშად მოიპოვა დამცინავი მეტსახელები, თუმცა ფუნქციურად ის მუშაობს: ძველ ქალაქსა და მარცხენა ნაპირს შორის სიარული მისი გახსნის შემდეგ ნამდვილად გამარტივდა.

    მარცხენა ბოლოში რიყის პარკია, გაშენებული იმავე წლებში ყოფილ სამრეწველო ნაპირზე. აქ არის:

    - საბაგიროს ქვედა სადგური, საიდანაც ვაგონი ნარიყალამდე 2-3 წუთში ადის

    - მუსიკალური შადრევანი და დიდი ჭადრაკის დაფა

    - ორი უზარმაზარი ფოლადის მილი — დაუმთავრებელი საკონცერტო და საგამოფენო ცენტრი, ასევე დე ლუკის პროექტი, რომელიც არასდროს გახსნილა და დღემდე ცარიელი დგას

    - გუმბათიანი ყოფილი პრეზიდენტის სასახლე პარკის ზემოთ

    პარკი მოკლე გასაჩერებელია და არა დღის პროგრამა: ბალახი მწირია, ჩრდილი ცოტა. მისი ღირებულება ლოგისტიკურია — აქ იყრის თავს ხიდი, საბაგირო, პარკინგი და ორივე ნაპირის სასეირნო მარშრუტი. საღამოს, როცა განათება ინთება და მეტეხის კლდე შუქდება, ეს ქალაქის ერთ-ერთი საუკეთესო წერტილია.

    ხიდი ცალკე ობიექტი კი არა, ერთი პოლიტიკური პროგრამის ნაწილია. 2008–2012 წლებში ხელისუფლებამ თბილისში განზრახ თანამედროვე, გამჭვირვალე შენობები ააგო — შუშის პოლიციის განყოფილებები, იუსტიციის სახლი მარცხენა ნაპირზე მასიმილიანო ფუკსასის პროექტით, ეს ხიდი. მესიჯი გამჭვირვალობა და დასავლეთისკენ სვლა იყო. დღემდე კამათობენ, ეს ქალაქისთვის სასარგებლო იყო თუ ძველი თბილისისთვის უცხო.
  tip: |-
    ერთი საათი ხიდზე გასავლელად, პარკის შემოსავლელად და საბაგიროზე ასასვლელად საკმარისია. საბაგიროს ბილეთი ჩვეულებრივი სამგზავრო ბარათით იყიდება — მისი შეძენა კასაშივე შეიძლება; ნაღდი ფული არ ვარდება. ხიდის შუშის ზედაპირი წვიმაში სრიალებს. ზაფხულში პარკში ჩრდილი თითქმის არ არის და შუადღისას ცხელა. ტუალეტი პარკშია, კაფეები — ორივე ბოლოში. ეტლით და ეტლიანი ბავშვით ორივე მხარეს პანდუსია.
  route: |-
    ცენტრიდან ბარათაშვილის ან მეტეხის ხიდით გადმოდი მარცხენა ნაპირზე და ჩადი რიყის პარკის ქვედა პარკინგში — ეს ძველი ქალაქის მიდამოში ერთადერთი დიდი და ნორმალურად ორგანიზებული სადგომია, ანაზღაურებადი და ჩვეულებრივ ადგილიანი დილით. აქედან ხიდი, აბანოთუბანი, მეტეხი და საბაგირო ფეხითაა. მარჯვენა ნაპირზე, ერეკლე II-ის და შავთელის ვიწრო ქუჩებში მანქანის დატოვება არ ღირს. საწვავი ავლაბრის მიმართულებით. ეკონომკლასის მანქანა სავსებით საკმარისია.
en:
  name: Bridge of Peace and Rike Park
  short: |-
    A glass and steel footbridge over the Mtkvari and the park at its far end, with the cable car station.
  body: |-
    **The Bridge of Peace is the most argued-about modern structure in Tbilisi.** It opened in May 2010, designed by the Italian architect Michele De Lucchi: about 150 metres long, a steel frame under a curving glass canopy. At night thousands of LEDs light up, and the programme spells out, in Morse code, the names of the chemical elements that make up the human body — a detail almost nobody notices.

    Locals gave it a set of unflattering nicknames within a week. Functionally, though, it works: walking between the old town and the left bank became far easier once it opened.

    At the far end lies Rike Park, laid out in the same years on what had been an industrial strip of riverbank. It contains:

    - the lower station of the cable car, which lifts you to Narikala in two or three minutes

    - a musical fountain and an oversized chessboard

    - two enormous steel tubes — an unfinished concert and exhibition hall, also by De Lucchi, which never opened and stands empty

    - the domed former presidential palace on the slope above

    The park is a short stop rather than a day out: the grass is thin and there is little shade. Its value is logistical, since the bridge, the cable car, the car park and the riverside walks on both banks all converge here. In the evening, when the lighting comes on and the Metekhi cliff is floodlit, it is one of the best places to stand in the city.

    The bridge is not a stand-alone object but part of a political programme. Between roughly 2008 and 2012 the government deliberately built modern, transparent structures across Georgia — glass police stations, the mushroom-canopied Public Service Hall on the left bank by Massimiliano Fuksas, this bridge. The message was transparency and a turn westwards. Whether that was good for the city or simply alien to old Tbilisi is still argued in Georgian newspapers, and you can form your own view in ten minutes here.
  tip: |-
    An hour covers the bridge, a loop of the park and the ride up. The cable car takes the ordinary city transport card, which you can buy at the station window; it does not accept coins. The glass deck of the bridge is slippery in rain. In summer the park has almost no shade and is uncomfortable at midday. There are toilets in the park and cafes at both ends. Ramps on both sides make it usable with a pushchair or wheelchair.
  route: |-
    From the centre cross to the left bank by Baratashvili or Metekhi bridge and drop into the lower car park at Rike Park. This is the only large, properly organised parking anywhere near the old town: paid, and usually with space in the morning. From it the bridge, the sulphur baths, Metekhi and the cable car are all on foot. Do not try to leave a car in the narrow lanes of Erekle II or Shavteli on the right bank. Fuel is available towards Avlabari. An economy car is entirely sufficient.
ru:
  name: Мост Мира и парк Рике
  short: |-
    Стеклянно-стальной пешеходный мост через Куру и парк на другом его конце со станцией канатной дороги.
  body: |-
    **Мост Мира — самая обсуждаемая современная постройка Тбилиси.** Он открылся в мае 2010 года по проекту итальянского архитектора Микеле Де Лукки: около 150 метров длины, стальной каркас под изогнутым стеклянным навесом. Ночью загораются тысячи светодиодов, и программа подсветки азбукой Морзе выдаёт названия химических элементов, из которых состоит человеческое тело, — деталь, которую почти никто не замечает.

    Местные придумали мосту несколько нелестных прозвищ в первую же неделю. Функционально он, впрочем, работает: после открытия ходить между старым городом и левым берегом стало заметно проще.

    На дальнем конце разбит парк Рике, устроенный в те же годы на бывшей промышленной набережной. В нём:

    - нижняя станция канатной дороги, поднимающей к Нарикале за две-три минуты

    - музыкальный фонтан и огромная шахматная доска

    - две гигантские стальные трубы — недостроенный концертно-выставочный центр, тоже по проекту Де Лукки, который так и не открылся и стоит пустым

    - бывший президентский дворец с куполом на склоне выше

    Парк — короткая остановка, а не программа на день: трава редкая, тени мало. Его ценность логистическая: здесь сходятся мост, канатная дорога, парковка и набережные обоих берегов. Вечером, когда включают подсветку и скалу Метехи заливает свет, это одна из лучших точек города.

    Мост — не отдельный объект, а часть политической программы. Примерно с 2008 по 2012 год власти намеренно строили по всей Грузии современные прозрачные здания: стеклянные полицейские участки, Дом юстиции с грибовидным навесом на левом берегу по проекту Массимилиано Фуксаса, этот мост. Посланием были прозрачность и поворот на Запад. Пошло ли это городу на пользу или осталось чуждым старому Тбилиси, спорят до сих пор, и своё мнение здесь складывается за десять минут.
  tip: |-
    Часа хватает на мост, круг по парку и подъём наверх. Канатная дорога принимает обычную транспортную карту, купить её можно тут же в кассе; монеты не принимаются. Стеклянный настил моста скользит в дождь. Летом в парке почти нет тени и в полдень неуютно. Туалеты есть в парке, кафе — с обеих сторон. С коляской и в кресле проезжаемо: пандусы есть на обоих берегах.
  route: |-
    Из центра переезжайте на левый берег по мосту Бараташвили или Метехскому и спускайтесь на нижнюю парковку парка Рике. Это единственная большая и нормально организованная стоянка рядом со старым городом: платная и обычно со свободными местами утром. Отсюда мост, серные бани, Метехи и канатная дорога — пешком. На правом берегу не пытайтесь бросить машину в узких переулках Ираклия II и Шавтели. Заправка в сторону Авлабари. Машины эконом-класса вполне достаточно.
fa:
  name: پل صلح و پارک ریکه
  short: |-
    پل پیادهٔ شیشه‌ای و فولادی روی متکواری و پارکی در انتهای آن با ایستگاه تله‌کابین.
  body: |-
    **پل صلح پربحث‌ترین ساختهٔ امروزی تفلیس است.** در مه ۲۰۱۰ به طراحی معمار ایتالیایی میکله دلوکی گشوده شد: حدود ۱۵۰ متر درازا، اسکلتی فولادی زیر سایبانی شیشه‌ای و موج‌دار. شب‌ها هزاران دیود روشن می‌شوند و برنامهٔ نورپردازی با کد مورس نام عنصرهای شیمیایی سازندهٔ بدن انسان را می‌گوید؛ جزئیاتی که تقریباً کسی متوجهش نمی‌شود.

    مردم شهر در همان هفتهٔ اول چند لقب طعنه‌آمیز به آن دادند. با این حال از نظر کارکرد جواب داده است: پس از گشایش آن، رفت‌وآمد میان شهر قدیم و کرانهٔ چپ بسیار ساده‌تر شد.

    در انتهای دیگر پارک ریکه گسترده است که در همان سال‌ها روی نواری صنعتی از ساحل رودخانه ساخته شد. در آن هست:

    - ایستگاه پایین تله‌کابین که در دو سه دقیقه شما را به ناریکالا می‌رساند

    - فوارهٔ موسیقایی و یک صفحهٔ شطرنج بسیار بزرگ

    - دو لولهٔ فولادی عظیم؛ تالار کنسرت و نمایشگاهی ناتمام، باز هم از دلوکی، که هرگز گشوده نشد و خالی مانده است

    - کاخ گنبددار ریاست‌جمهوری پیشین بر شیب بالای پارک

    پارک یک توقف کوتاه است نه برنامهٔ یک روز: چمنش کم‌پشت است و سایه کم دارد. ارزشش لجستیکی است، چون پل و تله‌کابین و پارکینگ و پیاده‌روهای دو کرانه همه اینجا به هم می‌رسند. عصرها که چراغ‌ها روشن می‌شوند و صخرهٔ متخی زیر نور می‌رود، این یکی از بهترین نقاط ایستادن در شهر است.

    این پل شیئی مستقل نیست، بخشی از یک برنامهٔ سیاسی است. تقریباً میان ۲۰۰۸ تا ۲۰۱۲ دولت به‌عمد در سراسر گرجستان بناهای امروزی و شفاف ساخت: کلانتری‌های شیشه‌ای، تالار خدمات عمومی با سایبان قارچی‌شکل در کرانهٔ چپ به طرح ماسیمیلیانو فوکساس، و همین پل. پیام، شفافیت و چرخش به سوی غرب بود. اینکه این کار به سود شهر بود یا با تفلیس قدیم بیگانه، هنوز محل بحث است و در ده دقیقه می‌توانید نظر خودتان را بسازید.
  tip: |-
    یک ساعت برای پل و یک دور پارک و بالا رفتن با تله‌کابین کافی است. تله‌کابین با کارت معمولی حمل‌ونقل شهری کار می‌کند که همان‌جا از گیشه خریدنی است؛ سکه نمی‌پذیرد. کف شیشه‌ای پل در باران لیز است. تابستان پارک تقریباً سایه ندارد و نیمروز آزاردهنده است. سرویس بهداشتی در پارک و کافه در دو سر مسیر هست. با کالسکه و ویلچر شدنی است، چون هر دو طرف سطح شیب‌دار دارد.
  route: |-
    از مرکز شهر با پل باراتاشویلی یا پل متخی به کرانهٔ چپ بروید و به پارکینگ پایین پارک ریکه بروید. این تنها پارکینگ بزرگ و سامان‌یافته در نزدیکی شهر قدیم است: پولی، و صبح‌ها معمولاً جا دارد. از آنجا پل و حمام‌های گوگردی و متخی و تله‌کابین همه پیاده‌اند. در کرانهٔ راست تلاش نکنید خودرو را در کوچه‌های تنگ ارکله دوم و شاوتلی رها کنید. پمپ بنزین در مسیر آولابری است. خودروی اقتصادی کاملاً کافی است.
he:
  name: גשר השלום ופארק ריקה
  short: |-
    גשר הולכי רגל מזכוכית ופלדה מעל המתקוורי, והפארק בקצהו עם תחנת הרכבל.
  body: |-
    **גשר השלום הוא המבנה המודרני השנוי ביותר במחלוקת בטביליסי.** הוא נפתח במאי 2010 בתכנון האדריכל האיטלקי מיקלה דה לוקי: כ-150 מטרים אורך, שלד פלדה תחת גגון זכוכית מתעגל. בלילה נדלקות אלפי נורות לד, ותוכנית התאורה מאייתת בקוד מורס את שמות היסודות הכימיים המרכיבים את גוף האדם — פרט שכמעט איש אינו מבחין בו.

    התושבים העניקו לו כמה כינויים לא מחמיאים כבר בשבוע הראשון. מבחינה תפקודית הוא בכל זאת עובד: מאז שנפתח, המעבר בין העיר העתיקה לגדה השמאלית נעשה קל בהרבה.

    בקצה השני משתרע פארק ריקה, שהוקם באותן שנים על רצועת גדה תעשייתית לשעבר. יש בו:

    - התחנה התחתונה של הרכבל, שמעלה אל נריקאלה בשתיים-שלוש דקות

    - מזרקה מוזיקלית ולוח שחמט ענק

    - שני צינורות פלדה עצומים — אולם קונצרטים ותערוכות בלתי גמור, גם הוא של דה לוקי, שמעולם לא נפתח ועומד ריק

    - ארמון הנשיאות לשעבר עם הכיפה, במדרון שמעל

    הפארק הוא עצירה קצרה ולא תוכנית ליום שלם: הדשא דליל והצל מועט. ערכו לוגיסטי, שכן הגשר, הרכבל, החניון וטיילות שתי הגדות נפגשים כאן. בערב, כשהתאורה נדלקת וצוק מטחי מוצף אור, זו אחת הנקודות הטובות בעיר.

    הגשר אינו מבנה עומד בפני עצמו אלא חלק מתוכנית פוליטית. בערך בין 2008 ל-2012 בנה השלטון בכוונה מבנים מודרניים ושקופים ברחבי גאורגיה: תחנות משטרה מזכוכית, היכל השירות הציבורי עם גגות הפטריות בגדה השמאלית בתכנון מסימיליאנו פוקסאס, והגשר הזה. המסר היה שקיפות ופנייה מערבה. אם זה היטיב עם העיר או נותר זר לטביליסי העתיקה עדיין שנוי במחלוקת, ואפשר לגבש כאן דעה בעשר דקות.
  tip: |-
    שעה מספיקה לגשר, להקפת הפארק ולעלייה ברכבל. הרכבל מקבל את כרטיס התחבורה העירוני הרגיל, שאפשר לקנות בקופה במקום; מטבעות אינם מתקבלים. רצפת הזכוכית של הגשר חלקלקה בגשם. בקיץ אין בפארק כמעט צל ובצהריים לא נעים בו. יש שירותים בפארק ובתי קפה בשני הקצוות. עם עגלה ובכיסא גלגלים אפשרי, יש רמפות בשתי הגדות.
  route: |-
    מן המרכז חצו לגדה השמאלית בגשר בראטאשווילי או בגשר מטחי ורדו לחניון התחתון של פארק ריקה. זהו החניון הגדול והמסודר היחיד בקרבת העיר העתיקה: בתשלום, ובדרך כלל עם מקום בשעות הבוקר. משם הגשר, מרחצאות הגופרית, מטחי והרכבל כולם במרחק הליכה. אל תנסו להשאיר רכב בסמטאות הצרות של ארקלה השני ושאווטלי בגדה הימנית. תחנת דלק יש בכיוון אוולברי. רכב חסכוני מספיק לחלוטין.
ar:
  name: جسر السلام وحديقة ريكه
  short: |-
    جسر مشاة من الزجاج والفولاذ فوق نهر متكفاري، وحديقة عند طرفه فيها محطة التلفريك.
  body: |-
    **جسر السلام أكثر منشأة حديثة أثارت الجدل في تبليسي.** افتُتح في مايو 2010 بتصميم المعماري الإيطالي ميكيلي دي لوكي: نحو 150 متراً طولاً، وهيكل فولاذي تحت مظلة زجاجية منحنية. وفي الليل تُضاء آلاف المصابيح، ويهجّئ برنامج الإضاءة بشيفرة مورس أسماء العناصر الكيميائية المكوّنة لجسم الإنسان، وهي تفصيلة لا ينتبه إليها أحد تقريباً.

    وقد أطلق عليه أهل المدينة ألقاباً ساخرة في أسبوعه الأول. غير أنه من حيث الوظيفة ناجح: فمنذ افتتاحه صار التنقل بين المدينة القديمة والضفة اليسرى أسهل بكثير.

    وعند الطرف الآخر تمتد حديقة ريكه التي أُنشئت في السنوات نفسها على شريط صناعي سابق من ضفة النهر. وفيها:

    - المحطة السفلى للتلفريك، ويرفعك إلى ناريكالا في دقيقتين أو ثلاث

    - نافورة موسيقية ورقعة شطرنج ضخمة

    - أنبوبان فولاذيان هائلان، وهما قاعة حفلات ومعارض لم تكتمل، من تصميم دي لوكي أيضاً، لم تُفتتح قط وما زالت فارغة

    - القصر الرئاسي السابق ذو القبة على المنحدر أعلاها

    الحديقة محطة قصيرة لا برنامج يوم: العشب فيها خفيف والظل قليل. وقيمتها لوجستية، إذ يلتقي هنا الجسر والتلفريك والموقف وممشيا الضفتين. وفي المساء حين تُضاء الأنوار ويغمر الضوء صخرة ميتيخي تصبح من أفضل المواقف في المدينة.

    الجسر ليس منشأة قائمة بذاتها بل جزء من برنامج سياسي. فبين 2008 و2012 تقريباً بنت الحكومة عمداً في أنحاء جورجيا مبانيَ حديثة شفافة: مخافر شرطة زجاجية، وقصر الخدمات العامة بمظلاته الفطرية على الضفة اليسرى من تصميم ماسيميليانو فوكساس، وهذا الجسر. وكانت الرسالة الشفافية والتوجه غرباً. وما زال يُتجادل في أن ذلك أفاد المدينة أم بقي غريباً عن تبليسي القديمة، ويمكنك أن تكوّن رأيك هنا في عشر دقائق.
  tip: |-
    ساعة تكفي للجسر ولدورة في الحديقة وللصعود بالتلفريك. ويعمل التلفريك ببطاقة النقل العام العادية التي تُشترى من شباك المحطة، ولا يقبل النقود المعدنية. وأرضية الجسر الزجاجية زلقة في المطر. وفي الصيف تكاد الحديقة تخلو من الظل وتكون الظهيرة مزعجة فيها. ودورات المياه داخل الحديقة والمقاهي عند الطرفين. والتنقل بعربة الطفل أو الكرسي المتحرك ممكن، فالمنحدرات متوفرة على الجانبين.
  route: |-
    من وسط المدينة اعبر إلى الضفة اليسرى عبر جسر باراتاشفيلي أو جسر ميتيخي وانزل إلى الموقف السفلي في حديقة ريكه. وهو الموقف الكبير الوحيد المنظم قرب المدينة القديمة: مدفوع، وفيه أماكن عادة في الصباح. ومنه يمكنك الوصول سيراً إلى الجسر وحمامات الكبريت وميتيخي والتلفريك. ولا تحاول ترك السيارة في أزقة إيريكلي الثاني وشافتيلي الضيقة على الضفة اليمنى. والوقود متوفر باتجاه أفلابري. وسيارة اقتصادية تكفي تماماً.
