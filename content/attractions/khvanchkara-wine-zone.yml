ka:
  name: ხვანჭკარის ზონა
  short: >-
    რიონის მარჯვენა ნაპირის ვიწრო ვენახები ტოლასა და სადმელს შორის, სადაც საქართველოს ყველაზე ცნობილი
    ბუნებრივად ნახევრად ტკბილი ღვინო იბადება.
  body: >-
    **ხვანჭკარა ჯიშის სახელი არ არის — ეს ადგილია.** ღვინოს აძლევს სახელს პატარა სოფელი ამბროლაურის ჩრდილო-დასავლეთით,
    რიონის დინების ქვემოთ, ხოლო კონტროლირებული მიკროზონა ვიწრო ზოლია რიონის მარჯვენა ნაპირზე, დაახლოებით
    ტოლადან სადმელამდე, სოფლებით ბუგეული, ძირაგეული, აბარი და ჭორჯო. მთელი აპელაცია რამდენიმე ასეულ ჰექტარს
    მოიცავს — საქართველოს ერთ-ერთი უმცირესი ღვინის ზონაა.


    ღვინო ორი ადგილობრივი წითელი ჯიშის ნაზავია: **ალექსანდროული** და **მუჯურეთული**, ჩვეულებრივ დაახლოებით
    ორი მესამედი და ერთი მესამედი. ორივე გვიან მწიფდება — კრეფა ხშირად ოქტომბრის ბოლოსკენ იწყება, როცა
    ღამეები უკვე ცივია. სწორედ სიცივე ქმნის ღვინოს: დუღილი მარნის ბუნებრივ ტემპერატურაზე თავად ჩერდება
    და ღვინოში დარჩენილი შაქარი მას ნახევრად ტკბილს ხდის. ეს ტექნოლოგიური ხრიკი არ არის, არამედ კლიმატის
    შედეგი, და ამიტომაც ვერ მეორდება სხვაგან.


    ხვანჭკარა XIX საუკუნის ბოლოს კიპიანების მამულში ჩამოყალიბდა და 1907 წელს ბელგიაში მედალი აიღო; საბჭოთა
    პერიოდში ის დეფიციტურ, თითქმის მითოლოგიურ ღვინოდ იქცა, რასაც სტალინის სიმპათიის ამბავიც ემატებოდა.
    დღეს სახელს ბევრი იყენებს — ბოთლების დიდი ნაწილი, რომელზეც „ხვანჭკარა“ წერია, ამ ხეობაში არასდროს
    ყოფილა.


    ამიტომ ვიზიტს აზრი აქვს. ხეობაში რამდენიმე ოჯახური მარანი და ორიოდე უფრო დიდი საწარმოა, სადაც კრეფის
    შემდეგ ღვინის სრული ციკლი ჩანს: ვენახები, რომლებიც ციცაბო ტერასებზე ადის, ქვევრები, საზამთრო ლორი
    კედელზე ჩამოკიდებული. ბევრი მარანი მხოლოდ წინასწარი შეთანხმებით მუშაობს და უცხო ენაზე იშვიათად საუბრობენ.


    სექტემბრის ბოლოსა და ოქტომბერში მთელი ხეობა რთველითაა დაკავებული; მაისიდან ივლისამდე ვენახები მწვანეა
    და ცარიელი, მაგრამ მარნები მაინც ხსნიან კარს.
  tip: >-
    სამი საათი ერთი მარნისთვის და ვენახებში სეირნობისთვის საკმარისია. ვიზიტი წინასწარ შეათანხმე — ეს ოჯახური
    მეურნეობებია და უცხო სტუმარს უბრალოდ ვერ ელოდებიან. მძღოლი დაგჭირდება: დეგუსტაცია რაჭაში ორ ჭიქას
    იშვიათად ჩერდება. ბოთლი პირდაპირ მარნიდან იყიდე და არა გზისპირა ჯიხურიდან. ოქტომბერში რთველია და ხალხი
    დაკავებულია, სამაგიეროდ სწორედ მაშინ ჩანს ყველაფერი. ტუალეტი და კვება მხოლოდ ამბროლაურშია.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ წყალტუბოზე და ალპანაზე რიონის ხეობით ზემოთ — 315 კმ, ხუთი და
    ნახევარი საათი. მთელი გზა ასფალტია; ალპანასა და ამბროლაურს შორის მონაკვეთი ვიწროა და მდინარეს მიუყვება,
    მოსახვევებში ხედვა შეზღუდულია. სოფლები მთავარი გზის პირას და მის ზემოთ დგას, მიმავალი შესახვევები
    მოკლე, მაგრამ ხშირად მოხრეშილია. საწვავი ქუთაისსა და ამბროლაურში აიღე. ეკონომ-კლასის ავტომობილი საკმარისია,
    თუ მარანი მთავარ გზასთან ახლოსაა.
en:
  name: Khvanchkara Wine Zone
  short: >-
    The narrow right-bank vineyards between Tola and Sadmeli, where Georgia's best-known naturally semi-sweet
    red wine is made.
  body: >-
    **Khvanchkara is not a grape variety — it is a place.** The wine takes its name from a small village
    downstream of Ambrolauri, and the controlled microzone is a thin strip on the right bank of the Rioni
    running roughly from Tola to Sadmeli, taking in Bugeuli, Dzirageuli, Abari and Chorjo. The whole appellation
    covers a few hundred hectares, which makes it one of the smallest wine zones in Georgia.


    The wine is a blend of two local red varieties, **Aleksandrouli** and **Mujuretuli**, usually around
    two thirds to one third. Both ripen late, and picking often starts towards the end of October, when
    the nights are already cold. That cold is what makes the wine: fermentation stalls by itself at the
    natural temperature of the cellar, leaving residual sugar behind. The result is semi-sweet not by
    any addition but by climate, and this is precisely why it cannot be reproduced elsewhere.


    Khvanchkara took shape on the Kipiani family estate at the end of the 19th century and won a medal
    in Belgium in 1907. Under the Soviet Union it became a scarce, half-mythical bottle, helped along
    by the story of Stalin's fondness for it. Today the name is used freely, and a great many bottles
    labelled Khvanchkara have never been anywhere near this valley.


    That is the argument for coming. A handful of family marani and two or three larger producers work
    in the valley, and after the harvest you can follow the whole cycle: vineyards climbing in narrow
    terraces above the road, qvevri sunk in the cellar floor, hams hanging on the wall for winter. Most
    cellars work by prior arrangement and few speak much English.


    Late September and October are given over entirely to the harvest. From May to July the vines are
    green and the work quiet, but the cellars still open their doors.
  tip: >-
    Three hours covers one cellar and a walk through the vineyards. Arrange the visit in advance — these
    are working family farms and cannot absorb unannounced guests. Bring a driver: tastings in Racha rarely
    stop at two glasses. Buy the bottle from the cellar itself rather than from a roadside kiosk, where
    the label means very little. October is harvest, so people are busy, but that is also when everything
    is visible. Toilets and food are in Ambrolauri only.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head north via Tskaltubo and Alpana up the Rioni gorge
    — 315 km, five and a half hours. The road is asphalt throughout; the stretch between Alpana and Ambrolauri
    is narrow, follows the river closely and has poor sightlines through the bends. The villages sit on
    and just above the main road, and the turnings up to them are short but often gravel. Fuel at Kutaisi
    and Ambrolauri. An economy car is enough if the cellar is near the main road.
ru:
  name: Винная зона Хванчкары
  short: >-
    Узкие виноградники правого берега Риони между Толой и Садмели, где рождается самое известное грузинское
    природно-полусладкое красное.
  body: >-
    **Хванчкара — это не сорт, а место.** Вино названо по маленькому селу ниже Амбролаури по течению Риони,
    а контролируемая микрозона представляет собой узкую полосу на правом берегу Риони примерно от Толы
    до Садмели, включая Бугеули, Дзирагеули, Абари и Чорджо. Весь аппелласьон занимает несколько сотен
    гектаров — одна из самых маленьких винных зон Грузии.


    Вино — купаж двух местных красных сортов, **александроули** и **муджуретули**, обычно в пропорции
    примерно два к одному. Оба созревают поздно, сбор нередко начинается в конце октября, когда ночи уже
    холодные. Именно холод и делает это вино: брожение само останавливается при естественной температуре
    марани, оставляя часть сахара несброженной. Полусладость здесь не приём, а следствие климата, и потому
    её невозможно повторить в другом месте.


    Хванчкара сложилась в имении Кипиани в конце XIX века и получила медаль в Бельгии в 1907 году. В советские
    годы она стала дефицитной, почти мифической бутылкой, чему помогала и история о пристрастии Сталина.
    Сегодня название используют свободно, и огромная часть бутылок с надписью «Хванчкара» никогда не бывала
    в этой долине.


    Это и есть довод в пользу поездки. В ущелье работают несколько семейных марани и два-три производителя
    покрупнее, и после сбора можно проследить весь цикл: виноградники, поднимающиеся узкими террасами
    над дорогой, квеври, врытые в пол погреба, окорока, подвешенные на зиму. Большинство погребов принимает
    только по договорённости, и по-английски говорят там редко.


    Конец сентября и октябрь целиком отданы ртвели. С мая по июль лозы зелены, работа спокойна, но двери
    марани всё равно открывают.
  tip: >-
    Трёх часов хватит на один погреб и прогулку по виноградникам. Визит договаривайте заранее — это действующие
    семейные хозяйства, они не рассчитаны на случайных гостей. Возьмите водителя: дегустация в Раче редко
    заканчивается двумя бокалами. Бутылку покупайте в самом марани, а не в придорожном киоске, где этикетка
    ничего не значит. В октябре все заняты сбором, зато именно тогда видно всё. Туалеты и еда — только
    в Амбролаури.
  route: >-
    Из Тбилиси по E60 до Кутаиси, далее на север через Цхалтубо и Алпану вверх по ущелью Риони — 315 км,
    пять с половиной часов. Асфальт на всём пути; участок Алпана — Амбролаури узкий, идёт вплотную к реке,
    обзор в поворотах плохой. Сёла стоят у самой трассы и чуть выше неё, съезды к ним короткие, но часто
    гравийные. Заправки в Кутаиси и Амбролаури. Машины эконом-класса достаточно, если марани стоит недалеко
    от основной дороги.
fa:
  name: منطقهٔ شراب خوانچکارا
  short: تاکستان‌های باریک کرانهٔ راست ریونی میان تولا و سادملی، زادگاه مشهورترین شراب سرخ نیمه‌شیرین
    طبیعی گرجستان.
  body: >-
    **خوانچکارا نام یک رقم انگور نیست، نام یک جاست.** شراب نامش را از روستایی کوچک در پایین‌دست آمبرولائوری
    گرفته و منطقهٔ کنترل‌شده نواری باریک بر کرانهٔ راست ریونی است که تقریباً از تولا تا سادملی کشیده می‌شود
    و روستاهای بوگئولی، دزیراگئولی، آباری و چورجو را در بر می‌گیرد. کل این ناحیه چند صد هکتار است و یکی
    از کوچک‌ترین مناطق شراب گرجستان به شمار می‌رود.


    شراب آمیزه‌ای از دو رقم سرخ بومی است: **الکساندرولی** و **موجورتولی**، معمولاً حدود دو سوم به یک سوم.
    هر دو دیررس‌اند و برداشت اغلب تا اواخر مهر و آبان به درازا می‌کشد، وقتی شب‌ها سرد شده‌اند. همین سرما
    شراب را می‌سازد: تخمیر در دمای طبیعی سردابه خودبه‌خود می‌ایستد و بخشی از قند در شراب می‌ماند. نیمه‌شیرینی
    اینجا نتیجهٔ افزودن چیزی نیست، نتیجهٔ اقلیم است، و درست به همین دلیل جای دیگر تکرار نمی‌شود.


    خوانچکارا در اواخر سدهٔ نوزدهم در املاک خاندان کیپیانی شکل گرفت و در ۱۹۰۷ در بلژیک مدال گرفت. در دورهٔ
    شوروی به بطری‌ای کمیاب و نیمه‌افسانه‌ای بدل شد و داستان علاقهٔ استالین نیز بر این افسانه افزود. امروز
    نام آن آزادانه به کار می‌رود و بسیاری از بطری‌هایی که برچسب خوانچکارا دارند هرگز به این درّه نزدیک
    هم نشده‌اند.


    همین دلیل رفتن است. چند سردابهٔ خانوادگی و دو سه تولیدکنندهٔ بزرگ‌تر در درّه کار می‌کنند و پس از برداشت
    می‌توان همهٔ چرخه را دنبال کرد: تاکستان‌هایی که پلکانی بالای جاده بالا می‌روند، کوره‌های سفالی فرورفته
    در کف سردابه، و ران‌های دودی آویخته برای زمستان. بیشتر سردابه‌ها فقط با هماهنگی قبلی پذیرا هستند و
    کمتر کسی زبان خارجی می‌داند.


    اواخر شهریور تا آبان تماماً وقف برداشت است. از اردیبهشت تا تیر تاک‌ها سبز و کار آرام است، اما درِ
    سردابه‌ها همچنان باز می‌شود.
  tip: >-
    سه ساعت برای یک سردابه و قدم زدن در تاکستان کافی است. بازدید را از پیش هماهنگ کنید؛ اینها مزرعه‌های
    خانوادگیِ در حال کارند و مهمان ناخوانده را نمی‌توانند بپذیرند. راننده همراه ببرید: چشیدن شراب در راچا
    کمتر در دو گیلاس متوقف می‌شود. بطری را از خود سردابه بخرید نه از دکه‌های کنار جاده، که برچسب در آنجا
    معنای چندانی ندارد. مهر و آبان فصل برداشت است و همه گرفتارند، اما همه چیز هم همان وقت دیده می‌شود.
    سرویس بهداشتی و غذا فقط در آمبرولائوری هست.
  route: >-
    از تفلیس با E60 تا کوتائیسی و سپس به شمال از تسخالتوبو و آلپانا در تنگهٔ ریونی بالا بروید — ۳۱۵ کیلومتر،
    پنج ساعت و نیم. جاده تا انتها آسفالت است؛ بخش آلپانا تا آمبرولائوری باریک است، چسبیده به رود پیش می‌رود
    و دید در پیچ‌ها کم است. روستاها کنار جادهٔ اصلی و کمی بالاتر از آن‌اند و انشعاب‌های منتهی به آنها
    کوتاه اما اغلب شنی است. سوخت را در کوتائیسی و آمبرولائوری بگیرید. خودروی اقتصادی کافی است، به شرط
    آنکه سردابه نزدیک جادهٔ اصلی باشد.
he:
  name: אזור היין חוונצ'קארה
  short: כרמים צרים בגדה הימנית של הריוני בין טולה לסדמלי, שבהם נוצר היין האדום החצי-מתוק המפורסם של גאורגיה.
  body: >-
    **חוונצ'קארה איננה זן ענבים — היא מקום.** היין נקרא על שם כפר קטן במורד הריוני מאמברולאורי, והמיקרו-אזור
    המבוקר הוא רצועה דקה בגדה הימנית של הריוני, מטולה בערך ועד סדמלי, הכוללת את בוגאולי, דזירגאולי, אבארי
    וצ'ורג'ו. כל האזור מקיף כמה מאות הקטרים בלבד, מן הקטנים בגאורגיה.


    היין הוא תערובת של שני זנים אדומים מקומיים, **אלכסנדראולי** ו**מוג'ורטולי**, בדרך כלל ביחס של שני
    שלישים לשליש. שניהם מבשילים מאוחר, והבציר נמשך לא פעם עד סוף אוקטובר, כשהלילות כבר קרים. הקור הזה
    הוא שיוצר את היין: התסיסה נעצרת מעצמה בטמפרטורה הטבעית של המרתף ומשאירה בו סוכר. המתיקות כאן איננה
    תוספת אלא תוצאה של אקלים, ובדיוק משום כך אי אפשר לשחזר אותה במקום אחר.


    חוונצ'קארה התגבשה באחוזת משפחת קיפיאני בשלהי המאה ה-19 וזכתה במדליה בבלגיה ב-1907. בברית המועצות הפכה
    לבקבוק נדיר וכמעט מיתולוגי, בסיוע הסיפור על חיבתו של סטלין אליה. כיום משתמשים בשם בחופשיות, וחלק גדול
    מן הבקבוקים שנושאים את התווית מעולם לא היו בקרבת העמק הזה.


    זו בדיוק הסיבה לבוא. בעמק פועלים כמה מרתפים משפחתיים ושניים-שלושה יצרנים גדולים יותר, ואחרי הבציר
    אפשר לעקוב אחר המחזור כולו: כרמים מטפסים במדרגות צרות מעל הכביש, קווברי שקועים ברצפת המרתף, וקותלי
    חזיר תלויים על הקיר לקראת החורף. רוב המרתפים מקבלים רק בתיאום מראש, ומעטים מדברים אנגלית.


    סוף ספטמבר ואוקטובר נתונים כולם לבציר. ממאי עד יולי הגפנים ירוקות והעבודה שקטה, אך המרתפים עדיין פותחים
    את דלתותיהם.
  tip: >-
    שלוש שעות מספיקות למרתף אחד ולסיבוב בכרמים. תאמו את הביקור מראש — אלה משקים משפחתיים עובדים שאינם
    ערוכים לאורחים מזדמנים. קחו נהג: טעימה בראצ'ה נעצרת לעיתים רחוקות בשתי כוסות. קנו את הבקבוק במרתף
    עצמו ולא בדוכן שבצד הדרך, שם התווית כמעט חסרת משמעות. אוקטובר הוא חודש הבציר, כולם עסוקים, אבל דווקא
    אז הכול גלוי לעין. שירותים ואוכל יש רק באמברולאורי.
  route: >-
    מטביליסי בכביש E60 עד קותאיסי, ומשם צפונה דרך צחלטובו ואלפאנה במעלה נקיק הריוני — 315 ק״מ, חמש שעות
    וחצי. הכביש סלול לכל אורכו; הקטע בין אלפאנה לאמברולאורי צר, נצמד לנהר ושדה הראייה בעיקולים מוגבל.
    הכפרים יושבים על הכביש הראשי ומעט מעליו, והפניות אליהם קצרות אך לרוב לא סלולות. דלק בקותאיסי ובאמברולאורי.
    רכב חסכוני מספיק אם המרתף קרוב לכביש הראשי.
ar:
  name: منطقة نبيذ خفانتشكارا
  short: كروم ضيقة على الضفة اليمنى لريوني بين تولا وسادملي، حيث يُصنع أشهر نبيذ أحمر نصف حلو طبيعياً
    في جورجيا.
  body: >-
    **خفانتشكارا ليست اسم صنف عنب، بل اسم مكان.** أخذ النبيذ اسمه من قرية صغيرة أسفل أمبرولاوري مع مجرى
    ريوني، والمنطقة المحمية شريط ضيق على الضفة اليمنى لنهر ريوني يمتد تقريباً من تولا إلى سادملي، ويضم
    بوغيولي ودزيراغيولي وأباري وتشورجو. لا تتجاوز مساحة التسمية بضع مئات من الهكتارات، وهي من أصغر مناطق
    النبيذ في جورجيا.


    النبيذ مزيج من صنفين أحمرين محليين، **ألكساندرولي** و**موجوريتولي**، بنسبة ثلثين إلى ثلث عادةً. وكلاهما
    متأخر النضج، فيمتد القطاف غالباً إلى أواخر تشرين الأول حين تكون الليالي قد بردت. وهذا البرد هو ما
    يصنع النبيذ: يتوقف التخمّر من تلقاء نفسه عند حرارة القبو الطبيعية فيبقى في النبيذ شيء من السكر. الحلاوة
    هنا ليست إضافة بل نتيجة مناخ، ولهذا لا يمكن تكرارها في مكان آخر.


    تبلورت خفانتشكارا في ضيعة آل كيبياني أواخر القرن التاسع عشر، ونالت ميدالية في بلجيكا عام 1907. وفي
    العهد السوفييتي صارت زجاجة نادرة شبه أسطورية، وأعانت على ذلك حكاية شغف ستالين بها. أما اليوم فالاسم
    يُستعمل بحرية، وكثير من الزجاجات التي تحمل الملصق لم تقترب من هذا الوادي قط.


    وهذه بعينها حجة الزيارة. يعمل في الوادي عدد من الأقبية العائلية ومنتجان أو ثلاثة أكبر، وبعد القطاف
    يمكن تتبع الدورة كاملة: كروم تتسلق مصاطب ضيقة فوق الطريق، وجرار قفيري مدفونة في أرض القبو، وأفخاذ
    معلّقة على الجدار استعداداً للشتاء. ومعظم الأقبية لا تستقبل إلا بموعد سابق، وقلّ من يتكلم فيها لغة
    أجنبية.


    أواخر أيلول وتشرين الأول مكرّسان للقطاف بالكامل. ومن أيار إلى تموز تكون الكروم خضراء والعمل هادئاً،
    غير أن الأقبية تفتح أبوابها مع ذلك.
  tip: >-
    ثلاث ساعات تكفي لقبو واحد وجولة في الكروم. نسّق الزيارة مسبقاً، فهذه مزارع عائلية عاملة لا تحتمل ضيوفاً
    مفاجئين. خذ معك سائقاً: نادراً ما يقف التذوق في راتشا عند كأسين. اشترِ الزجاجة من القبو نفسه لا من
    أكشاك الطريق، حيث لا يعني الملصق شيئاً يُذكر. تشرين الأول موسم القطاف والناس مشغولون، لكنه أيضاً الوقت
    الذي يظهر فيه كل شيء. دورات المياه والطعام في أمبرولاوري فقط.
  route: >-
    من تبليسي على الطريق E60 إلى كوتايسي، ثم شمالاً عبر تسخالتوبو وألبانا صعوداً في مضيق ريوني — 315 كم،
    خمس ساعات ونصف. الطريق معبّد بكامله؛ ومقطع ألبانا–أمبرولاوري ضيق يلاصق النهر ومدى الرؤية في منعطفاته
    محدود. تقع القرى على الطريق الرئيسي وفوقه بقليل، والمنعطفات المؤدية إليها قصيرة لكنها في الغالب حصوية.
    الوقود في كوتايسي وأمبرولاوري. وسيارة اقتصادية تكفي إن كان القبو قريباً من الطريق الرئيسي.
