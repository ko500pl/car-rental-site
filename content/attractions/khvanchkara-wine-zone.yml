ka:
  name: ხვანჭკარის ზონა
  short: >-
    რიონის მარჯვენა ნაპირის 35–40-კილომეტრიანი მზიანი ფერდობები, სადაც ალექსანდროული და მუჯურეთული ყველაზე
    ცნობილ ქართულ ნახევრადტკბილ წითელ ღვინოდ იქცევა.
  body: >-
    **ხვანჭკარა არც ყურძნის ჯიშია და არც სავაჭრო ნიშანი — ის ადგილია, და კანონიც ამბობს, რომ ეს ღვინო
    სხვაგან ვერ დაიბადება.** სახელი მას რიონის მარჯვენა ნაპირზე, ამბროლაურიდან 14 კილომეტრით ქვემოთ, ზღვის
    დონიდან 560 მეტრზე მდებარე სოფელმა უწოდა, სადაც დაახლოებით 470 კაცი ცხოვრობს. დაცული მიკროზონა ხეობის
    გასწვრივ 35–40 კილომეტრზეა გადაჭიმული, ლეჩხუმის ქედის სამხრეთ კალთებზე, მაღალი ქედებით დაცულ ქვაბულში;
    ვენახები დაახლოებით 450-დან 750 მეტრამდე ადის, ზოგი კი მდინარის გაღმა, რაჭის ქედის ჩრდილოეთ ფერდობებზეც
    გადადის. მიკროზონის სანედლეულო ბაზა დაახლოებით 900 ჰექტარია.


    ღვინოს ორი ადგილობრივი წითელი ჯიში ქმნის. ალექსანდროულს ძველად კაბისტონს ეძახდნენ; გადმოცემა მის გაშენებას
    მეფე ალექსანდრეს სახელს უკავშირებს — აქედანაა სახელწოდებაც. მისი მარცვალი სექტემბრის ბოლოს მწიფდება
    — მუქი ლურჯი, თითქმის შავი, სქელი ცვილისებრი ნაფიფქით — და შაქრიანობა 24–30%-ს აღწევს. მუჯურეთულთან
    ერთად ის მუქ ლალისფერ, ხავერდოვან ღვინოს იძლევა ჟოლოს ტონით: 10,5–12% სპირტი და ლიტრზე 30–50 გრამი
    შაქარი, რომელიც თავად ყურძენმა დატოვა. არაფერს უმატებენ.


    ეს სახელი ეტიკეტებზე 1907 წლიდან იწერება; მანამდე ღვინოს „ყიფიანის ღვინოს“ ეძახდნენ. ქინძმარაულთან
    ერთად ის სტალინის საყვარელ ღვინოებს შორის იყო, საბჭოთა მოთხოვნამ კი ლეგენდად აქცია. 2010 წლის კანონით
    ხვანჭკარა ადგილწარმოშობის დაცულ დასახელებად იქცა, 2012 წელს კი სახელმწიფომ ის მემკვიდრეობის ბრენდად
    აღიარა.


    ეს პატარა ღვინოა ვიწრო ხეობიდან და ყველაზე მეტად საკუთარ თავს მაშინ ჰგავს, როცა იმ ფერდობს უყურებთ,
    რომელზეც გაიზარდა.
  tip: >-
    სამი საათი ერთი მარნისა და ვენახებში გასეირნებისთვის საკმარისია. ვიზიტი წინასწარ შეათანხმეთ: ეს მოქმედი
    ოჯახური მეურნეობებია და არა სადეგუსტაციო დარბაზები, ინგლისურად კი იშვიათად ლაპარაკობენ. ფხიზელ მძღოლზე
    წინასწარ იზრუნეთ — რაჭული სტუმართმოყვარეობა ორ ჭიქაზე იშვიათად ჩერდება. ბოთლი პირდაპირ მარანში იყიდეთ,
    სადაც იცით, რომელი ფერდობიდანაა. სექტემბრის ბოლოდან რთველია — ხალხი დაკავებულია, სამაგიეროდ მთელ ციკლს
    დაინახავთ; მაისიდან ივლისამდე უფრო მშვიდია. კვებისა და ტუალეტისთვის ამბროლაურს დაეყრდენით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, შემდეგ შ16-ით ჩრდილოეთით, რიონის ხეობით, ალპანას გავლით
    ხვანჭკარამდე: დაახლოებით 315 კმ და ხუთი საათი და ნახევარი, აქედან ქუთაისის შემდეგ — 77-მდე კილომეტრი.
    გზა ბოლომდე ასფალტია; ალპანასა და ამბროლაურს შორის ვიწროვდება, მდინარეს მიუყვება და მოსახვევებში ხედვა
    შეზღუდულია. სოფლები მთავარ გზაზე ან ოდნავ ზემოთ დგას, მარნებისკენ ასასვლელი შესახვევები მოკლე, მაგრამ
    ხშირად ხრეშიანია. საწვავი ქუთაისში ან ამბროლაურში ჩაასხით. ეკონომ-კლასის მანქანა საკმარისია; თუ მარანი
    გზიდან მაღლაა, ბოლო მონაკვეთის შესახებ მასპინძელს ჰკითხეთ.
en:
  name: Khvanchkara Wine Zone
  short: >-
    A 35–40 km ribbon of south-facing vineyards on the Rioni's right bank, where Aleksandrouli and Mujuretuli
    become Georgia's best-known semi-sweet red.
  body: >-
    **Khvanchkara is not a grape and not a brand: it is a place, and the law says the wine can come from
    nowhere else.** It takes its name from a village of some 470 people on the right bank of the Rioni,
    14 km downstream of Ambrolauri at 560 metres. The protected zone runs for 35–40 km along the valley,
    on the southern slopes of the Lechkhumi range, in a basin sheltered by high ridges; the vineyards
    climb from about 450 to 750 metres, and a few cross the river onto the northern slopes of the Racha
    range. Its grape-growing base is put at roughly 900 hectares.


    Two local red varieties make the wine. Aleksandrouli was once called Kabistoni; tradition links its
    planting to a King Alexander, hence the name. Its berries ripen towards the end of September, dark
    blue to almost black under a heavy waxy bloom, with sugar reaching 24–30 per cent. Blended with Mujuretuli,
    it gives a dark ruby, velvety wine with a note of raspberry: 10.5–12 per cent alcohol and 30–50 grams
    of sugar per litre that the grapes themselves leave behind. Nothing is added.


    The name has appeared on labels since 1907; before that the wine was known as 'Kipiani's wine'. Stalin
    counted it, with Kindzmarauli, among his favourites, and Soviet demand turned it into a legend. A
    law of 2010 made Khvanchkara a protected appellation, and in 2012 the state declared it a heritage
    brand.


    It is a small wine from a narrow valley, and it tastes most like itself within sight of the slope
    it grew on.
  tip: >-
    Three hours cover one cellar and a walk among the vines. Arrange the visit in advance: these are working
    family farms, not tasting rooms, and English is rare. Bring a designated driver — Racha hospitality
    seldom stops at two glasses. Buy bottles at the cellar door, where you know which slope they came
    from. From late September the harvest keeps everyone busy but shows you the whole cycle; May to July
    is quieter. For food and toilets, plan on Ambrolauri.
  route: >-
    From Tbilisi take the S1 (E60) to Kutaisi, then the Sh16 north up the Rioni gorge via Alpana to Khvanchkara:
    about 315 km and five and a half hours, some 77 km of it after Kutaisi. The road is asphalt throughout;
    between Alpana and Ambrolauri it narrows, hugs the river and gives poor sightlines on the bends. The
    villages sit on or just above the main road, and the lanes up to the cellars are short but often gravel.
    Refuel in Kutaisi or Ambrolauri. An economy car is enough; if your cellar sits high above the road,
    ask your host about the last stretch.
ru:
  name: Винная зона Хванчкара
  short: >-
    Лента виноградников в 35–40 км на правом берегу Риони, где Александроули и Муджуретули становятся
    самым известным полусладким вином Грузии.
  body: >-
    **Хванчкара — не сорт винограда и не бренд, а место, и по закону это вино не может родиться больше
    нигде.** Название дано по селу, где живёт около 470 человек: оно стоит на правом берегу Риони, в 14
    км ниже Амбролаури по течению, на высоте 560 метров. Защищённая зона тянется на 35–40 км вдоль долины
    по южным склонам Лечхумского хребта, в котловине, укрытой высокими горными грядами; виноградники поднимаются
    примерно с 450 до 750 метров, а некоторые переходят через реку, на северные склоны Рачинского хребта.
    Её виноградная база оценивается примерно в 900 гектаров.


    Вино делают из двух местных красных сортов. Александроули когда-то называли Кабистони; предание связывает
    его посадку с неким царём Александром — отсюда и название. Ягоды созревают к концу сентября, тёмно-синие,
    почти чёрные, под густым восковым налётом, а сахаристость достигает 24–30 процентов. В купаже с Муджуретули
    получается тёмно-рубиновое бархатистое вино с малиновой нотой: 10,5–12 процентов спирта и 30–50 граммов
    сахара на литр, которые оставил сам виноград. Ничего не добавляют.


    Название стоит на этикетках с 1907 года; до этого вино знали как «вино Кипиани». Сталин числил его,
    вместе с Киндзмараули, среди своих любимых, и советский спрос превратил его в легенду. Закон 2010
    года сделал Хванчкару защищённым наименованием места происхождения, а в 2012 году государство объявило
    её «брендом наследия».


    Это маленькое вино из узкой долины, и настоящий его вкус узнаёшь, только когда перед глазами склон,
    на котором оно выросло.
  tip: >-
    Трёх часов хватит на один погреб и прогулку среди лоз. Договоритесь о визите заранее: это действующие
    семейные хозяйства, а не дегустационные залы, и по-английски здесь говорят редко. Возьмите с собой
    непьющего водителя — рачинское гостеприимство редко останавливается на двух бокалах. Покупайте бутылки
    прямо в погребе: там вы знаете, с какого они склона. С конца сентября сбор урожая занимает всех, зато
    показывает весь цикл; с мая по июль спокойнее. Поесть и найти туалет лучше в Амбролаури.
  route: >-
    Из Тбилиси по S1 (E60) до Кутаиси, затем по Sh16 на север вверх по ущелью Риони через Алпану до Хванчкары:
    около 315 км и пять с половиной часов, из них примерно 77 км после Кутаиси. Асфальт на всём пути;
    между Алпаной и Амбролаури дорога сужается, жмётся к реке, и на поворотах плохой обзор. Сёла стоят
    прямо на трассе или чуть выше неё, а подъезды к погребам короткие, но часто гравийные. Заправляйтесь
    в Кутаиси или Амбролаури. Машины эконом-класса достаточно; если ваш погреб стоит высоко над дорогой,
    спросите хозяина о последнем участке.
fa:
  name: منطقهٔ شراب خوانچکارا
  short: >-
    نواری ۳۵ تا ۴۰ کیلومتری از تاکستان‌ها بر کرانهٔ راست ریونی، جایی که آلکساندرولی و موجورتولی به نامدارترین
    شراب نیمه‌شیرین گرجستان بدل می‌شوند.
  body: >-
    **خوانچکارا نه نام یک انگور است و نه یک برند؛ نام یک مکان است، و به حکم قانون این شراب از هیچ جای
    دیگری نمی‌تواند بیاید.** نامش را از روستایی حدود ۴۷۰ نفری گرفته که بر کرانهٔ راست ریونی، ۱۴ کیلومتر
    پایین‌تر از آمبرولائوری در مسیر رود و در ارتفاع ۵۶۰ متری قرار دارد. منطقهٔ حفاظت‌شده ۳۵ تا ۴۰ کیلومتر
    در امتداد دره، بر دامنه‌های جنوبی رشته‌کوه لچخومی و در حوضه‌ای در پناه ستیغ‌های بلند، کشیده شده است؛
    تاکستان‌ها از حدود ۴۵۰ تا ۷۵۰ متر بالا می‌روند و شماری از آن‌ها از رود می‌گذرند و به دامنه‌های شمالی
    رشته‌کوه راچا می‌رسند. پایهٔ انگورکاری آن را حدود ۹۰۰ هکتار برآورد می‌کنند.


    دو انگور قرمز بومی این شراب را می‌سازند. آلکساندرولی را روزگاری کابیستونی می‌نامیدند؛ روایت‌ها کاشتنش
    را به پادشاهی به نام الکساندر نسبت می‌دهند و نامش از همین‌جاست. حبه‌هایش نزدیک به پایان سپتامبر می‌رسند،
    آبی تیره تا تقریباً سیاه، زیر لایه‌ای ضخیم از پوشش مومی، و قندشان به ۲۴ تا ۳۰ درصد می‌رسد. آمیخته
    با موجورتولی، شرابی یاقوتیِ تیره و مخملی با رایحه‌ای از تمشک به دست می‌دهد: ۱۰٫۵ تا ۱۲ درصد الکل و
    ۳۰ تا ۵۰ گرم قند در هر لیتر که خودِ انگور بر جا می‌گذارد. هیچ چیز به آن افزوده نمی‌شود.


    این نام از سال ۱۹۰۷ بر برچسب‌ها آمده است؛ پیش از آن، این شراب را «شراب کیپیانی» می‌شناختند. استالین
    آن را، همراه با کیندزماراولی، از شراب‌های محبوبش می‌شمرد و تقاضای دوران شوروی از آن افسانه‌ای ساخت.
    قانونی در سال ۲۰۱۰ خوانچکارا را به نام مبدأ حفاظت‌شده بدل کرد و در سال ۲۰۱۲ دولت آن را «برند میراث»
    اعلام کرد.


    این شرابی کوچک از دره‌ای باریک است و طعم راستینش را تنها آن‌جا نشان می‌دهد که دامنه‌ای را که بر آن
    رسیده پیش چشم داشته باشید.
  tip: >-
    سه ساعت برای یک سردابه و قدم‌زدنی میان تاک‌ها کافی است. بازدید را از پیش هماهنگ کنید: این‌ها مزرعه‌های
    خانوادگیِ فعال‌اند، نه سالن‌های شراب‌چشی، و انگلیسی به‌ندرت شنیده می‌شود. راننده‌ای همراه بیاورید
    که ننوشد؛ مهمان‌نوازی راچایی کمتر به دو جام بسنده می‌کند. بطری‌ها را از خودِ سردابه بخرید، جایی که
    می‌دانید از کدام دامنه آمده‌اند. از اواخر سپتامبر انگورچینی همه را مشغول می‌کند، اما کل چرخه را پیش
    چشمتان می‌گذارد؛ مه تا ژوئیه آرام‌تر است. برای غذا و سرویس بهداشتی روی آمبرولائوری حساب کنید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را تا کوتائیسی بروید، سپس جادهٔ Sh16 را به سمت شمال در تنگهٔ ریونی و از راه
    آلپانا تا خوانچکارا بگیرید: حدود ۳۱۵ کیلومتر و پنج ساعت و نیم، که حدود ۷۷ کیلومترش پس از کوتائیسی
    است. جاده سراسر آسفالت است؛ میان آلپانا و آمبرولائوری باریک می‌شود، به رود می‌چسبد و در پیچ‌ها دید
    کمی دارد. روستاها بر خود جادهٔ اصلی یا کمی بالاتر از آن‌اند و راه‌های فرعی تا سردابه‌ها کوتاه اما
    اغلب شنی است. در کوتائیسی یا آمبرولائوری سوخت بگیرید. یک خودروی اقتصادی کافی است؛ اگر سردابهٔ میزبانتان
    بسیار بالاتر از جاده است، دربارهٔ آخرین تکهٔ راه از او بپرسید.
he:
  name: אזור היין חוונצ'קארה
  short: >-
    רצועה באורך 35–40 ק"מ של כרמים הפונים דרומה על הגדה הימנית של הריוני, שבה אלכסנדרולי ומוג'ורטולי הופכים
    ליין האדום החצי-מתוק המפורסם ביותר של גאורגיה.
  body: >-
    **חוונצ'קארה אינה זן ענבים ואינה מותג: היא מקום, והחוק קובע שהיין הזה אינו יכול לבוא משום מקום אחר.**
    שמה ניתן על שם כפר של כ-470 תושבים על הגדה הימנית של הריוני, 14 ק"מ במורד הנהר מאמברולאורי, בגובה
    560 מטר. האזור המוגן משתרע לאורך 35–40 ק"מ של העמק, על המדרונות הדרומיים של רכס לצ'חומי, באגן שרכסים
    גבוהים מגוננים עליו; הכרמים מטפסים מגובה של כ-450 מטר עד 750 מטר, וכמה מהם חוצים את הנהר אל המדרונות
    הצפוניים של רכס ראצ'ה. שטח גידול הענבים שלו מוערך בכ-900 הקטר.


    שני זנים אדומים מקומיים יוצרים את היין. אלכסנדרולי נקרא פעם קביסטוני; המסורת קושרת את נטיעתו למלך
    בשם אלכסנדר, ומכאן שמו. גרגריו מבשילים לקראת סוף ספטמבר, כחולים כהים עד כמעט שחורים תחת ציפוי שעווה
    עבה, ותכולת הסוכר בהם מגיעה ל-24–30 אחוזים. בשילוב עם מוג'ורטולי מתקבל יין קטיפתי בגוון אודם כהה,
    עם נימה של פטל: 10.5–12 אחוזי אלכוהול ו-30–50 גרם סוכר לליטר, שהענבים עצמם משאירים. דבר אינו מוסף.


    השם מופיע על התוויות מאז 1907; לפני כן נקרא היין "היין של קיפיאני". סטלין מנה אותו, לצד הקינדזמאראולי,
    בין היינות האהובים עליו, והביקוש הסובייטי הפך אותו לאגדה. חוק משנת 2010 הפך את חוונצ'קארה לכינוי מקור
    מוגן, וב-2012 הכריזה עליה המדינה "מותג מורשת".


    זה יין קטן מעמק צר, וטעמו האמיתי מתגלה רק כשהמדרון שעליו גדל נמצא מול עיניכם.
  tip: >-
    שלוש שעות מספיקות למרתף אחד ולהליכה בין הגפנים. תאמו את הביקור מראש: אלה משקים משפחתיים פעילים, לא
    חדרי טעימות, ואנגלית נשמעת כאן לעתים רחוקות. הביאו נהג תורן — הכנסת האורחים של ראצ'ה נעצרת לעתים רחוקות
    בשתי כוסות. קנו בקבוקים ישירות במרתף, שם תדעו מאיזה מדרון הם באו. מסוף ספטמבר הבציר מעסיק את כולם,
    אבל מראה לכם את המחזור כולו; מאי עד יולי שקטים יותר. לאוכל ולשירותים תכננו לעצור באמברולאורי.
  route: >-
    מטביליסי סעו בכביש S1 ‏(E60) עד קוטאיסי, ומשם צפונה בכביש Sh16 במעלה ערוץ הריוני דרך אלפנה עד חוונצ'קארה:
    כ-315 ק"מ וחמש שעות וחצי, מהם כ-77 ק"מ אחרי קוטאיסי. הכביש סלול לכל אורכו; בין אלפנה לאמברולאורי הוא
    נעשה צר, צמוד לנהר, ושדה הראייה בעיקולים גרוע. הכפרים שוכנים על הכביש הראשי או מעט מעליו, והדרכים
    אל המרתפים קצרות אך לרוב מכוסות חצץ. תדלקו בקוטאיסי או באמברולאורי. רכב מקטגוריית אקונומי מספיק; אם
    המרתף שלכם שוכן גבוה מעל הכביש, שאלו את המארח על הקטע האחרון.
ar:
  name: منطقة نبيذ خفانتشكارا
  short: >-
    شريط من الكروم المواجهة للجنوب يمتد 35–40 كم على الضفة اليمنى لنهر ريوني، حيث يتحوّل عنبا ألكساندرولي
    وموجوريتولي إلى أشهر نبيذ أحمر شبه حلو في جورجيا.
  body: >-
    **خفانتشكارا ليست صنف عنب ولا علامة تجارية: إنها مكان، والقانون ينص على أن هذا النبيذ لا يأتي من أي
    مكان آخر.** وتحمل اسم قرية يسكنها نحو 470 نسمة على الضفة اليمنى لنهر ريوني، على بُعد 14 كم من أمبرولاوري
    في اتجاه مجرى النهر وعلى ارتفاع 560 متراً. تمتد المنطقة المحمية 35–40 كم على طول الوادي، على السفوح
    الجنوبية لسلسلة جبال ليتشخومي، في حوض تحميه قمم مرتفعة؛ وتتسلق الكروم من نحو 450 متراً إلى 750 متراً،
    ويعبر بعضها النهر إلى السفوح الشمالية لسلسلة جبال راتشا. وتُقدَّر رقعة زراعة العنب فيها بنحو 900 هكتار.


    يصنع هذا النبيذَ صنفان محليان من العنب الأحمر. كان ألكساندرولي يُسمّى قديماً كابيستوني؛ ويربط التقليد
    غرسه بملك يُدعى ألكسندر، ومن هنا جاء اسمه. تنضج حبّاته قرب نهاية أيلول، زرقاء داكنة تكاد تكون سوداء
    تحت غشاء شمعي كثيف، ويبلغ محتواها من السكر 24–30 في المئة. وبمزجه مع موجوريتولي يعطي نبيذاً مخملياً
    بلون الياقوت الداكن فيه لمسة من توت العُلّيق: 10.5–12 في المئة كحول، و30–50 غراماً من السكر في اللتر
    يتركها العنب نفسه. لا يُضاف إليه شيء.


    ظهر الاسم على الملصقات منذ عام 1907؛ وقبل ذلك كان النبيذ يُعرف بـ«نبيذ كيبياني». وعدّه ستالين، مع
    كيندزماراولي، من أحبّ الأنبذة إليه، فحوّله الطلب السوفييتي إلى أسطورة. وفي عام 2010 جعل قانونٌ خفانتشكارا
    تسميةَ منشأ محمية، وفي عام 2012 أعلنتها الدولة «علامةً تراثية».


    إنه نبيذ صغير من وادٍ ضيق، ولا يكون أشبه بنفسه إلا حين ترى المنحدر الذي نما عليه.
  tip: >-
    تكفي ثلاث ساعات لزيارة قبو واحد ونزهة بين الكروم. رتّب الزيارة مسبقاً: فهذه مزارع عائلية عاملة لا
    قاعات تذوّق، والإنجليزية نادرة. اصطحب سائقاً لا يشرب، فكرم الضيافة في راتشا نادراً ما يتوقف عند كأسين.
    اشترِ الزجاجات من باب القبو، حيث تعرف من أي منحدر جاءت. منذ أواخر أيلول ينشغل الجميع بالقطاف، لكنه
    يريك الدورة كاملة؛ أما من أيار إلى تموز فالأجواء أهدأ. للطعام ودورات المياه، اعتمد على أمبرولاوري.
  route: >-
    من تبليسي اسلك الطريق S1 ‏(E60) حتى كوتايسي، ثم الطريق Sh16 شمالاً صعوداً في مضيق ريوني عبر ألبانا
    حتى خفانتشكارا: نحو 315 كم وخمس ساعات ونصف، منها قرابة 77 كم بعد كوتايسي. الطريق معبّد بالكامل؛ وبين
    ألبانا وأمبرولاوري يضيق ويلازم النهر، والرؤية ضعيفة عند المنعطفات. تقع القرى على الطريق الرئيسي أو
    فوقه بقليل، والدروب الصاعدة إلى الأقبية قصيرة لكنها كثيراً ما تكون مفروشة بالحصى. تزوّد بالوقود في
    كوتايسي أو أمبرولاوري. تكفي سيارة اقتصادية؛ وإن كان القبو الذي تقصده مرتفعاً فوق الطريق، فاسأل مضيفك
    عن المقطع الأخير.
