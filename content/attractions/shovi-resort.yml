ka:
  name: შოვის კურორტი
  short: მაღალმთიანი კურორტი ონის ზემოთ, ჭანჭახის ხეობაში — სეზონური და 2023 წლის სტიქიის შემდეგ ნაწილობრივ
    აღდგენილი.
  body: >
    შოვი ონის მუნიციპალიტეტში, მდინარე ჭანჭახის ხეობაში, ზღვის დონიდან დაახლოებით ათას ხუთას ოც მეტრზეა.
    ის საბჭოთა პერიოდში კლიმატურ და მინერალური წყლების კურორტად ჩამოყალიბდა: წიწვოვანი ტყე, გრილი ჰაერი
    და კავკასიონის მთავარი ქედის ხედი მას რაჭის მთავარ საზაფხულო ადგილად აქცევდა.


    **2023 წლის აგვისტოში ხეობაში მძლავრი ღვარცოფი ჩამოვიდა, რომელმაც კურორტის ნაწილი გაანადგურა და ადამიანთა
    მსხვერპლი გამოიწვია.** მას შემდეგ ტერიტორიაზე აღდგენითი და გამაგრებითი სამუშაოები მიმდინარეობს, ინფრასტრუქტურის
    ნაწილი აღარ არსებობს და სიტუაცია დროთა განმავლობაში იცვლება. სწორედ ამიტომ **ვიზიტამდე აუცილებლად
    დააზუსტე გზის მდგომარეობა და სასტუმროების მუშაობა** — ეს არ არის ადგილი, სადაც შემთხვევით მიდიხარ.


    თუ გზა ღიაა და ამინდი მშრალია, შოვი მაინც შთამბეჭდავია:


    - ჭანჭახის ხეობა და კავკასიონის მაღალი ქედები

    - წიწვოვანი ტყე და მინერალური წყაროები

    - გლოლისა და ღების მიმართულებით გამავალი მარშრუტების საწყისი წერტილი


    სეზონი მოკლეა: ივნისიდან სექტემბრამდე. ზამთარში გზა თოვლით იკეტება, გაზაფხულზე კი წყალდიდობისა და
    ღვარცოფის რისკი მაღალია. ეს ხეობა ამინდზე მკვეთრად რეაგირებს და ძლიერი წვიმის დროს აქ ყოფნა არ ღირს.


    ონი, საიდანაც შოვისკენ უხვევ, თავისთავად საინტერესო პატარა ქალაქია: აქ XIX საუკუნის სინაგოგა და ისტორიული
    ცენტრია შემორჩენილი. თუ შოვისკენ გზა დახურულია ან ამინდი არ იძლევა საშუალებას, ონში გაჩერება მარშრუტს
    მაინც ამართლებს.
  tip: >
    გამგზავრებამდე დარეკე სასტუმროში ან ონის მუნიციპალიტეტში და დააზუსტე გზისა და ინფრასტრუქტურის მდგომარეობა
    — ის სეზონიდან სეზონამდე იცვლება. ძლიერი წვიმის პროგნოზის დროს მარშრუტი გადადე. თბილი ტანსაცმელი ზაფხულშიც
    აუცილებელია: ღამით ტემპერატურა ხუთ გრადუსამდე ეცემა. საწვავი ამბროლაურში ან ონში აავსე, ზემოთ გასამართი
    არაა. მობილური კავშირი ხეობაში არასტაბილურია. ღვარცოფის რისკის გამო ხეობაში ღამის გათევა ძლიერი წვიმის
    დროს არ არის გონივრული გადაწყვეტილება.
  route: >
    თბილისიდან რაჭაში ჩვეული გზით ხვალ — ქუთაისის მიმართულებით, შემდეგ ტყიბულზე და ამბროლაურამდე; იქიდან
    ონისკენ და ჭანჭახის ხეობაში შოვამდე. სულ დაახლოებით სამას ოთხმოცდათხუთმეტი კილომეტრი და ექვსი საათი
    ორმოცდაათი წუთი — ეს ერთი მიმართულებით სრული დღეა. ასფალტი ონამდე ძირითადად კარგია, ზემოთ კი მონაკვეთები
    ხრეშოვანი და სტიქიის შემდეგ შეკეთებულია. მაღალი კლირენსი ნამდვილად სასურველია. ღამის გათევა ამბროლაურში
    ან ონში დაგეგმე. ონამდე მისვლა შედარებით მარტივია, ამიტომ მარშრუტი ონზე შეგიძლია დაასრულო, თუ ზემოთ
    პირობები არ არის.
en:
  name: Shovi Resort
  short: >-
    A high mountain resort above Oni in the Chanchakhi valley — strictly seasonal and partly rebuilt after
    the 2023 disaster.
  body: >-
    Shovi sits in Oni municipality in the valley of the Chanchakhi river, at about 1,520 metres. It developed
    in the Soviet period as a climatic and mineral water resort: pine forest, cool air and views towards
    the main Caucasus ridge made it the summer destination of Racha.


    **In August 2023 a large debris flow swept down the valley, destroying part of the resort and causing
    loss of life.** Recovery and slope-stabilisation work has been under way since, some of the infrastructure
    no longer exists, and the situation continues to change. For that reason **check road conditions and
    whether accommodation is operating before you set out** — this is not somewhere to arrive on spec.


    If the road is open and the weather is dry, Shovi remains a striking place:


    - the Chanchakhi gorge and the high ridges of the Caucasus

    - pine forest and mineral springs

    - the starting point for routes towards Glola and Ghebi


    The season is short, roughly June to September. In winter the road closes with snow, and in spring
    the risk of flooding and debris flows is high. This valley reacts sharply to weather, and heavy rain
    is a good reason to be somewhere else that day.
  tip: >-
    Before setting out, call a hotel or the Oni municipality and confirm the state of the road and what
    is actually operating — this changes from season to season. If heavy rain is forecast, postpone the
    trip rather than risk the valley. Warm clothing is essential even in summer, as nights fall towards
    five degrees. Fill the tank in Ambrolauri or Oni, since there is no fuel higher up. Mobile coverage
    in the gorge is unreliable.
  route: >-
    Follow the usual approach into Racha: from Tbilisi towards Kutaisi, north through Tkibuli to Ambrolauri,
    then east to Oni and up the Chanchakhi valley to Shovi. Around 395 km and close to seven hours one
    way, which makes this a full day of driving on its own. Asphalt is mostly decent as far as Oni; above
    that there are gravel sections and stretches repaired since the disaster. Real ground clearance is
    advisable. Plan an overnight stop in Ambrolauri or Oni rather than attempting a return run.
ru:
  name: Курорт Шови
  short: >-
    Высокогорный курорт выше Они в ущелье Чанчахи — строго сезонный и частично восстановленный после стихии
    2023 года.
  body: >
    Шови находится в Онском муниципалитете, в ущелье реки Чанчахи, на высоте около 1 520 метров. Курорт
    сложился в советское время как климатический и бальнеологический: хвойный лес, прохладный воздух и
    виды на Главный Кавказский хребет делали его главным летним местом Рачи.


    **В августе 2023 года по ущелью сошёл мощный селевой поток, разрушивший часть курорта и приведший
    к гибели людей.** С тех пор ведутся восстановительные работы и укрепление склонов, часть инфраструктуры
    утрачена, а обстановка продолжает меняться. Поэтому **перед поездкой обязательно уточняйте состояние
    дороги и работу гостиниц** — сюда не стоит ехать наугад.


    Если дорога открыта и погода сухая, Шови по-прежнему впечатляет:


    - ущелье Чанчахи и высокие хребты Кавказа

    - хвойный лес и минеральные источники

    - отправная точка маршрутов в сторону Глолы и Геби


    Сезон короткий, примерно с июня по сентябрь. Зимой дорогу закрывает снег, весной высок риск паводков
    и селей. Это ущелье резко реагирует на погоду, и при сильном дожде находиться здесь не стоит.


    Они, откуда сворачивают к Шови, сам по себе интересный городок: здесь сохранились синагога XIX века
    и историческая застройка центра. Если дорога к Шови закрыта или погода не позволяет подниматься, остановка
    в Они всё равно оправдывает поездку в этот угол Рачи.
  tip: >-
    Перед выездом позвоните в гостиницу или в администрацию Они и уточните состояние дороги и что реально
    работает — от сезона к сезону это меняется. При прогнозе сильного дождя поездку лучше перенести. Тёплая
    одежда нужна даже летом: ночью температура опускается примерно до пяти градусов. Заправляйтесь в Амбролаури
    или Они, выше заправок нет. Мобильная связь в ущелье неустойчивая.
  route: >-
    Ехать нужно обычным путём в Рачу: из Тбилиси в сторону Кутаиси, затем на север через Ткибули до Амбролаури,
    оттуда на восток в Они и вверх по ущелью Чанчахи до Шови. Всего около 395 км и почти семь часов в
    одну сторону — это полноценный день за рулём. До Они асфальт в основном приличный, выше встречаются
    гравийные участки и отрезки, восстановленные после стихии. Настоящий клиренс здесь желателен. Ночёвку
    планируйте в Амбролаури или Они.
fa:
  name: ییلاق شووی
  short: ییلاقی کوهستانی بالای اونی در درهٔ چانچاخی — کاملاً فصلی و پس از فاجعهٔ 2023 تا حدی بازسازی‌شده.
  body: >-
    شووی در شهرستان اونی، در درهٔ رود چانچاخی و در حدود 1,520 متری قرار دارد. در دورهٔ شوروی به‌عنوان
    ییلاقی اقلیمی و آب معدنی رشد کرد: جنگل کاج، هوای خنک و چشم‌اندازی به ستیغ اصلی قفقاز آن را به مقصد
    تابستانی راچا بدل کرده بود.


    **در اوت 2023 جریان بزرگی از گل‌ولای و آوار دره را درنوردید، بخشی از ییلاق را ویران کرد و جان انسان‌ها
    را گرفت.** از آن زمان کار بازسازی و تثبیت دامنه‌ها ادامه دارد، بخشی از زیرساخت دیگر وجود ندارد و وضعیت
    همچنان در حال تغییر است. به همین دلیل **پیش از راه افتادن، وضعیت جاده و اینکه آیا اقامتگاهی فعال است
    یا نه را بررسی کنید** — اینجا جایی نیست که سرزده به آن برسید.


    اگر جاده باز باشد و هوا خشک، شووی همچنان جایی چشمگیر است: تنگهٔ چانچاخی و ستیغ‌های بلند قفقاز، جنگل
    کاج و چشمه‌های معدنی، و نقطهٔ شروع مسیرها به سوی گلولا و غبی. فصل کوتاه است، تقریباً از ژوئن تا سپتامبر.
    در زمستان برف جاده را می‌بندد و در بهار خطر سیل و جریان آوار بالاست. این دره به هوا واکنش تندی نشان
    می‌دهد، و باران سنگین دلیل خوبی است که آن روز جای دیگری باشید.
  tip: >-
    پیش از راه افتادن به یک هتل یا به شهرداری اونی زنگ بزنید و وضعیت جاده و اینکه واقعاً چه چیزی فعال
    است را تأیید کنید — این از فصلی به فصل دیگر تغییر می‌کند. اگر باران سنگین پیش‌بینی شده، سفر را عقب
    بیندازید و دره را به خطر نیندازید. لباس گرم حتی در تابستان ضروری است، چون شب‌ها دما به پنج درجه می‌افتد.
    باک را در آمبرولاوری یا اونی پر کنید، چون بالاتر سوختی نیست. پوشش تلفن همراه در تنگه قابل اعتماد نیست.
  route: >-
    همان مسیر همیشگی ورود به راچا را بگیرید: از تفلیس به سوی کوتایسی، رو به شمال از تکیبولی تا آمبرولاوری،
    بعد به شرق تا اونی و بالا رفتن از درهٔ چانچاخی تا شووی. حدود 395 کیلومتر و نزدیک هفت ساعت یک‌طرفه،
    که این را به‌تنهایی به یک روز کامل رانندگی بدل می‌کند. آسفالت تا اونی بیشتر جاها قابل قبول است؛ بالاتر
    از آن مقاطع شنی و بخش‌هایی که پس از فاجعه ترمیم شده‌اند وجود دارد. ارتفاع کف واقعی توصیه می‌شود. به‌جای
    تلاش برای رفت‌وبرگشت در یک روز، شبی را در آمبرولاوری یا اونی برنامه‌ریزی کنید.
he:
  name: אתר הנופש שובי
  short: אתר נופש הררי מעל אוני בעמק צ'אנצ'אחי — עונתי לחלוטין ומשוקם חלקית אחרי אסון 2023.
  body: >-
    שובי שוכנת במחוז אוני, בעמק נהר צ'אנצ'אחי, בגובה של כ-1,520 מטר. היא התפתחה בתקופה הסובייטית כאתר
    נופש אקלימי ומים מינרליים: יער אורנים, אוויר קריר ונופים לעבר הרכס הראשי של הקווקז הפכו אותה ליעד
    הקיץ המובהק של רצ'ה.


    **באוגוסט 2023 שטפה זרימת בוץ וסחף גדולה את העמק, החריבה חלק מן האתר וגבתה חיי אדם.** מאז נמשכות עבודות
    שיקום וייצוב מדרונות, חלק מן התשתית כבר אינו קיים, והמצב ממשיך להשתנות. משום כך **בדקו את מצב הדרך
    ואת השאלה אם יש לינה פעילה לפני שאתם יוצאים** — זה אינו מקום שמגיעים אליו על עיוור.


    אם הדרך פתוחה ומזג האוויר יבש, שובי נשארת מקום מרשים: ערוץ צ'אנצ'אחי והרכסים הגבוהים של הקווקז, יער
    אורנים ומעיינות מינרליים, ונקודת מוצא למסלולים לכיוון גלולה וגבי שבהמשך העמק. העונה כאן קצרה, בערך
    מיוני עד ספטמבר בלבד. בחורף השלג סוגר את הדרך, ובאביב הסיכון לשיטפונות ולזרימות סחף גבוה. העמק הזה
    מגיב בחדות לכל שינוי במזג האוויר, וגשם כבד הוא סיבה טובה לחלוטין להיות באותו יום במקום אחר.
  tip: >-
    לפני היציאה התקשרו לבית מלון או למועצת אוני וּודאו את מצב הדרך ואת מה שפועל בפועל — הדברים משתנים
    מעונה לעונה. אם צפוי גשם כבד, דחו את הנסיעה במקום להסתכן בעמק. ביגוד חם הוא הכרחי גם בקיץ, כי הלילות
    יורדים לכיוון חמש מעלות. מלאו את מכל הדלק באמברולאורי או באוני, כי מעלה משם אין דלק. הקליטה הסלולרית
    בערוץ אינה אמינה.
  route: >-
    עקבו אחרי הגישה הרגילה אל רצ'ה: מטביליסי לכיוון קוטאיסי, צפונה דרך טקיבולי לאמברולאורי, ואז מזרחה
    לאוני ובמעלה עמק צ'אנצ'אחי אל שובי. כ-395 ק״מ וקרוב לשבע שעות לכיוון אחד, מה שהופך את זה ליום נהיגה
    שלם בפני עצמו. האספלט סביר ברובו עד אוני; מעליה יש קטעי חצץ וקטעים שתוקנו מאז האסון. מומלץ גובה גחון
    אמיתי. תכננו לינה באמברולאורי או באוני במקום לנסות נסיעה הלוך ושוב ביום אחד.
ar:
  name: منتجع شوفي
  short: منتجع جبلي مرتفع فوق أوني في وادي تشانتشاخي — موسمي بحت وأُعيد بناؤه جزئياً بعد كارثة 2023.
  body: >-
    تقع شوفي في بلدية أوني، في وادي نهر تشانتشاخي، على نحو 1,520 متراً. وقد نمت في العهد السوفييتي منتجعاً
    مناخياً ومائياً معدنياً: غابات الصنوبر والهواء البارد والإطلالات نحو سلسلة القوقاز الرئيسية جعلتها
    وجهة راتشا الصيفية.


    **وفي أغسطس 2023 اجتاح الوادي انهيار طيني وركامي كبير، فدمر جزءاً من المنتجع وأودى بأرواح.** ومنذ
    ذلك الحين تتواصل أعمال التعافي وتثبيت المنحدرات، ولم يعد جزء من البنية التحتية قائماً، والوضع ما زال
    يتغير. ولهذا **تحقق من حالة الطريق ومما إذا كانت أماكن الإقامة تعمل قبل أن تنطلق** — فهذا ليس مكاناً
    تصل إليه على غير هدى.


    وإن كان الطريق مفتوحاً والجو جافاً، تبقى شوفي مكاناً لافتاً: مضيق تشانتشاخي وسلاسل القوقاز العالية،
    وغابات الصنوبر والينابيع المعدنية، ونقطة انطلاق المسارات نحو غلولا وغيبي. الموسم قصير، من يونيو إلى
    سبتمبر تقريباً. وفي الشتاء يغلق الثلج الطريق، وفي الربيع يرتفع خطر الفيضانات والانهيارات الطينية.
    هذا الوادي يستجيب بحدة لتقلبات الطقس، والمطر الغزير سبب وجيه لأن تكون في مكان آخر ذلك اليوم.
  tip: >-
    قبل الانطلاق اتصل بفندق أو ببلدية أوني وتأكد من حالة الطريق ومما يعمل فعلاً — فهذا يتغير من موسم إلى
    آخر. وإن كان المطر الغزير متوقعاً فأجّل الرحلة بدل المخاطرة في الوادي. والملابس الدافئة ضرورية حتى
    في الصيف، إذ تهبط حرارة الليل نحو خمس درجات. املأ الخزان في أمبرولاوري أو أوني، فلا وقود في الأعلى.
    وتغطية الهاتف المحمول في المضيق غير موثوقة.
  route: >-
    اتبع طريق الدخول المعتاد إلى راتشا: من تبليسي نحو كوتايسي، ثم شمالاً عبر تكيبولي إلى أمبرولاوري، ثم
    شرقاً إلى أوني وصعوداً في وادي تشانتشاخي حتى شوفي. نحو 395 كم وقرابة سبع ساعات في الاتجاه الواحد،
    وهو ما يجعلها يوم قيادة كاملاً بحد ذاته. الإسفلت مقبول في معظمه حتى أوني؛ وفوقها مقاطع حصوية وأخرى
    أُصلحت منذ الكارثة. ويُنصح بخلوص أرضي حقيقي. وخطط لمبيت في أمبرولاوري أو أوني بدل محاولة الذهاب والعودة
    في يوم واحد.
