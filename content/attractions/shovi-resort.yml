ka:
  name: შოვის კურორტი
  short: >-
    საბჭოთა მთის კურორტი 1520 მეტრზე, კავკასიონის მთავარი ქედის ძირას — წიწვოვანი ტყე, ნახშირმჟავა წყაროები
    და 2023 წლის აგვისტოს ხსოვნა.
  body: >-
    **შოვი სუნთქვისთვის ააშენეს — და თითქმის ერთი საუკუნე ხალხი აქ სწორედ ამისთვის ამოდიოდა.** 1925 წელს
    ექიმ-კურორტოლოგისა და საბჭოთა მოხელის, შამშე ლეჟავას, ინიციატივით კავკასიონის მთავარი ქედის ძირას,
    ზღვის დონიდან 1520 მეტრზე, იქ, სადაც ბუბისწყალი ჭანჭახს ერთვის, პირველი სანატორიუმის საძირკველი ჩაეყარა.
    კურორტი 1928 წლის 18 სექტემბერს გაიხსნა და დამაარსებლის პატივსაცემად „შამშოვი“ ეწოდა. 1938 წელს ლეჟავა
    რეპრესიებს ემსხვერპლა — და კურორტის სახელს პირველი მარცვალი ჩუმად ჩამოაჭრეს.


    ხეობა მარტივსა და იშვიათს გთავაზობდა: ცივ ნახშირმჟავა წყაროებს, ფერდობებზე მუქ წიწვოვან ტყეს და აგვისტოს,
    რომლის საშუალო ტემპერატურა 16 გრადუსია, როცა ბარი სიცხისგან იწვის. ყოველ ზაფხულს ხეობის ძირს სანატორიუმები,
    დასასვენებელი სახლები, პანსიონატები და ტურბაზა ავსებდა.


    2023 წლის 3 აგვისტოს, დაახლოებით ოთხ საათზე, ბუბის ხეობით ღვარცოფი ჩამოვიდა და კურორტის დიდი ნაწილი
    ქვითა და ლამით დაფარა. ორასზე მეტი ადამიანი ვერტმფრენით გამოიყვანეს; 32 ადამიანის დაღუპვა დადასტურდა,
    ერთი დღემდე დაკარგულად ითვლება. აქ ისე ამოდით, როგორც ნებისმიერ გლოვის ადგილას: ჩუმად, დრონის გარეშე,
    იმ ოჯახების პატივისცემით, რომლებმაც აქ ახლობლები დაკარგეს.


    თავად გარემო არ შეცვლილა. ჩრდილოეთიდან ხეობას კავკასიონის მთავარი ქედი კეტავს, სამხრეთიდან — შოდა-კედელას
    ქედი; გზა, რომლითაც ამოხვედით, ძველი ოსეთის სამხედრო გზის მონაკვეთია, რუსეთის საზღვრამდე კი სულ რაღაც
    შვიდიოდე კილომეტრია. შოვიდან უძირო ტბისკენ მარკირებული ბილიკი ტყეში შედის, სოფელი გლოლა კი რამდენიმე
    კილომეტრით ქვემოთ, ჭანჭახის დინების გაყოლებით მდებარეობს.


    შოვი ისევ ლამაზია. უბრალოდ, უდარდელი აღარ არის.
  tip: >-
    გამგზავრებამდე დაურეკეთ სასტუმროს ან ონის მუნიციპალიტეტს და დააზუსტეთ, რა მუშაობს და გახსნილია თუ
    არა გზა ონის ზემოთ — 2023 წლის შემდეგ ეს სეზონიდან სეზონამდე იცვლება. თუ ძლიერ წვიმას პროგნოზირებენ,
    მგზავრობა გადადეთ: ამ ხეობამ უკვე აჩვენა, რა შეუძლია უეცრად მოვარდნილ წყალს. თბილი ფენა აგვისტოშიც
    წაიღეთ — თვის საშუალო ტემპერატურა მხოლოდ 16 გრადუსია, ღამით კი უფრო ცივა. ნაღდი ფული აიღეთ და საწვავი
    ჩაასხით ამბროლაურში ან ონში. ხეობაში მობილური კავშირი შეიძლება წყდებოდეს. ღვარცოფის ზონას მემორიალივით
    მოეპყარით: არც დრონი, არც „სუვენირები“.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 193 კმ თერჯოლის გასასვლელამდე იარეთ, შ19-ით
    თერჯოლის გავლით ტყიბულამდე, იქიდან კი შ17-ით ჩრდილოეთით, ნაქერალას უღელტეხილის გავლით, ამბროლაურამდე.
    ამბროლაურში შ16-ზე გადადით, რიონს აღმოსავლეთით აუყევით ონამდე და იქიდან ჭანჭახის ხეობით შოვამდე ადით:
    სულ დაახლოებით 320 კმ — გაჩერებების გარეშე ხუთნახევრიდან ექვს საათამდე გაითვალისწინეთ. ონამდე ასფალტი
    კარგია; ზემოთ დაგხვდებათ დაკერებული მონაკვეთები, ხრეში და 2023 წლის შემდეგ დაწყებული სარემონტო სამუშაოები.
    აირჩიეთ SUV — ზედა მონაკვეთზე კლირენსი ნამდვილად გამოგადგებათ. საწვავის ბოლო საიმედო წერტილი ონია.
    მთის გზებზე ერთ დღეში წასვლა-დაბრუნება დამღლელია, ამიტომ ღამე ამბროლაურში ან ონში გაათიეთ.
en:
  name: Shovi Resort
  short: >-
    A Soviet-era mountain spa at 1,520 metres beneath the main Caucasus ridge — conifer forest, carbonated
    springs, and the memory of August 2023.
  body: >-
    **Shovi was built as a place to breathe, and for almost a century that is what people came here to
    do.** In 1925, on the initiative of Shamshe Lezhava, a spa physician and Soviet official, the foundations
    of the first sanatorium were laid at 1,520 metres, where the Buba stream joins the Chanchakhi beneath
    the main Caucasus ridge. The resort opened on 18 September 1928 and was named Shamshovi in his honour.
    In 1938 Lezhava fell victim to the purges, and the name quietly lost its first syllable.


    What the valley offered was simple and rare: cold carbonated springs, dark conifer forest on the slopes,
    and an August that averages 16 °C while the lowlands bake. Every summer sanatoria, rest houses, boarding
    houses and a tourist base filled the valley floor.


    At about four in the afternoon on 3 August 2023, a debris flow came down the Buba valley and buried
    much of the resort. More than 200 people were lifted out by helicopter; 32 were confirmed dead, and
    one has never been found. Come here as you would to any place of grief: quietly, without drones, with
    thought for the families who lost people here.


    The setting itself has not changed. The Greater Caucasus closes the valley to the north and the Shoda-Kedela
    range to the south; the road you drove up is a stretch of the old Ossetian Military Road, and the
    Russian border lies only about seven kilometres away. From Shovi the marked trail to Lake Udziro climbs
    into the forest, and the village of Glola sits a few kilometres downstream.


    Shovi is still beautiful. It is simply no longer carefree.
  tip: >-
    Before you set out, call your guesthouse or the Oni municipality and ask what is actually open and
    whether the road above Oni is clear — since 2023 the answer changes from season to season. If heavy
    rain is forecast, postpone: this valley has shown what sudden water can do. Bring a warm layer even
    in August, when the monthly average is just 16 °C and the nights are colder. Draw cash and fill the
    tank in Ambrolauri or Oni. Mobile signal can drop in the gorge. Treat the slide area as a memorial:
    no drones, no souvenir-hunting.
  route: >-
    From Tbilisi take the S1 (E60) west for about 193 km to the Terjola exit, then the Sh19 through Terjola
    to Tkibuli and the Sh17 north over the Nakerala pass to Ambrolauri. There join the Sh16, follow the
    Rioni east to Oni and turn up the Chanchakhi valley to Shovi: about 320 km in all, so allow five and
    a half to six hours without stops. The asphalt is decent as far as Oni; above it expect patched stretches,
    gravel and repair works dating from after 2023. Choose an SUV — the clearance matters on the upper
    section. Oni is the last reliable fuel stop. Mountain driving makes a same-day round trip exhausting,
    so sleep in Ambrolauri or Oni.
ru:
  name: Курорт Шови
  short: >-
    Советский горный курорт на высоте 1520 метров под Главным Кавказским хребтом: хвойный лес, углекислые
    источники и память об августе 2023 года.
  body: >-
    **Шови строили как место, где дышат, — и почти столетие люди приезжали сюда именно за этим.** В 1925
    году по инициативе Шамше Лежавы, врача-курортолога и советского чиновника, на высоте 1520 метров,
    там, где ручей Буба впадает в Чанчахи под Главным Кавказским хребтом, заложили первый санаторий. Курорт
    открылся 18 сентября 1928 года и в его честь получил имя Шамшови. В 1938 году Лежава стал жертвой
    репрессий, и название тихо лишилось первого слога.


    Долина давала простое и редкое: холодные углекислые источники, тёмный хвойный лес на склонах и август
    со средней температурой 16 °C, когда низины изнывают от жары. Каждое лето дно долины заполняли санатории,
    дома отдыха, пансионаты и турбаза.


    3 августа 2023 года, около четырёх часов дня, по долине Бубы сошёл селевой поток и погрёб под собой
    бо́льшую часть курорта. Больше 200 человек эвакуировали вертолётами; гибель 32 человек подтверждена,
    один так и не найден. Приезжайте сюда, как в любое место скорби: тихо, без дронов, помня о семьях,
    потерявших здесь близких.


    Сами горы вокруг не изменились. С севера долину замыкает Большой Кавказ, с юга — Шода-Кедельский хребет;
    дорога, по которой вы поднялись, — участок старой Военно-Осетинской дороги, а до российской границы
    всего около семи километров. Из Шови в лес уходит размеченная тропа к озеру Удзиро, а село Глола лежит
    в нескольких километрах ниже по течению.


    Шови по-прежнему прекрасен. Просто он больше не беззаботен.
  tip: >-
    Перед поездкой позвоните в свой гостевой дом или в муниципалитет Они и узнайте, что на самом деле
    работает и свободна ли дорога выше Они: после 2023 года ответ меняется от сезона к сезону. Если обещают
    сильные дожди, отложите поездку — эта долина уже показала, на что способна внезапная вода. Тёплую
    одежду берите даже в августе: средняя за месяц всего 16 °C, а ночи холоднее. Наличные снимите и бак
    заправьте в Амбролаури или Они. В ущелье может пропадать связь. Относитесь к месту схода селя как
    к мемориалу: никаких дронов, никаких «сувениров».
  route: >-
    Из Тбилиси по S1 (E60) на запад около 193 км до съезда на Терджолу, затем по Sh19 через Терджолу до
    Ткибули и по Sh17 на север через перевал Накерала до Амбролаури. Там выезжайте на Sh16, вдоль Риони
    на восток до Они и сворачивайте в долину Чанчахи к Шови: всего около 320 км, закладывайте пять с половиной
    – шесть часов без остановок. До Они асфальт приличный; выше ждите латаных участков, гравия и ремонтных
    работ, начатых после 2023 года. Берите машину класса SUV — на верхнем участке важен клиренс. Они —
    последняя надёжная заправка. По горным дорогам обернуться туда и обратно за один день утомительно,
    поэтому ночуйте в Амбролаури или Они.
fa:
  name: تفرجگاه شووی
  short: >-
    تفرجگاه کوهستانی دوران شوروی در ارتفاع ۱,۵۲۰ متری، پای خط‌الرأس اصلی قفقاز — جنگل سوزنی‌برگ، چشمه‌های
    آب گازدار و یاد اوت ۲۰۲۳.
  body: >-
    **شووی را برای نفس کشیدن ساختند، و نزدیک به یک سده مردم برای همین به اینجا می‌آمدند.** در ۱۹۲۵، به
    ابتکار شامشه لژاوا، پزشک درمان با آب‌های معدنی و مقام شوروی، شالودهٔ نخستین آسایشگاه در ارتفاع ۱,۵۲۰
    متری گذاشته شد، جایی که نهر بوبا زیر خط‌الرأس اصلی قفقاز به چانچاخی می‌پیوندد. تفرجگاه در ۱۸ سپتامبر
    ۱۹۲۸ گشایش یافت و به احترام او «شامشووی» نام گرفت. در ۱۹۳۸ لژاوا قربانی پاکسازی‌های سیاسی شد، و نام
    بی‌صدا نخستین هجایش را از دست داد.


    آنچه دره عرضه می‌کرد ساده و کمیاب بود: چشمه‌های سرد آب گازدار، جنگل تیرهٔ سوزنی‌برگ بر دامنه‌ها، و
    اوتی با میانگین ۱۶ درجه، در حالی که دشت‌ها در گرما می‌سوختند. هر تابستان آسایشگاه‌ها، خانه‌های استراحت،
    پانسیون‌ها و یک اردوگاه گردشگری کف دره را پر می‌کردند.


    حدود ساعت چهار بعدازظهر ۳ اوت ۲۰۲۳، سیلابی از گل و سنگ از درهٔ بوبا فرو ریخت و بخش بزرگی از تفرجگاه
    را زیر خود دفن کرد. بیش از ۲۰۰ نفر با بالگرد تخلیه شدند؛ مرگ ۳۲ نفر تأیید شد و یک نفر هرگز پیدا نشد.
    همان‌گونه به اینجا بیایید که به هر جای سوگواری می‌روید: آرام، بی‌پهپاد، و با یاد خانواده‌هایی که عزیزانشان
    را اینجا از دست دادند.


    خودِ این چشم‌انداز دگرگون نشده است. قفقاز بزرگ دره را از شمال می‌بندد و رشته‌کوه شودا-کدلا از جنوب؛
    جاده‌ای که از آن بالا آمدید تکه‌ای از جادهٔ نظامی قدیم اوستیاست، و مرز روسیه تنها حدود هفت کیلومتر
    دورتر است. از شووی، مسیر نشانه‌گذاری‌شدهٔ دریاچهٔ اودزیرو به درون جنگل بالا می‌رود، و روستای گلولا
    چند کیلومتر پایین‌تر در امتداد رود است.


    شووی هنوز زیباست. فقط دیگر بی‌دغدغه نیست.
  tip: >-
    پیش از راه افتادن به مهمانسرای خود یا شهرداری اونی زنگ بزنید و بپرسید چه چیزی واقعاً باز است و آیا
    جادهٔ بالای اونی قابل عبور است — از ۲۰۲۳ به این سو پاسخ از فصلی به فصل دیگر فرق می‌کند. اگر بارش سنگین
    پیش‌بینی شده، سفر را عقب بیندازید: این دره نشان داده که آب ناگهانی چه می‌تواند بکند. حتی در اوت یک
    لایه لباس گرم بردارید؛ میانگین ماهانه تنها ۱۶ درجه است و شب‌ها سردتر. پول نقد را در آمبرولائوری یا
    اونی بگیرید و باک را همان‌جا پر کنید. آنتن تلفن همراه ممکن است در تنگه قطع شود. منطقهٔ سیل گل‌وسنگ
    را یادمان بدانید: نه پهپاد، نه یادگاری‌جویی.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۳ کیلومتر به سوی غرب تا خروجی ترجولا بروید، سپس Sh19 را از ترجولا
    تا تکیبولی و Sh17 را به سمت شمال، از گردنهٔ ناکرالا، تا آمبرولائوری. آنجا وارد Sh16 شوید، در امتداد
    ریونی به سوی شرق تا اونی بروید و به درهٔ چانچاخی به سمت شووی بپیچید: روی هم حدود ۳۲۰ کیلومتر؛ بی‌توقف
    پنج ساعت و نیم تا شش ساعت در نظر بگیرید. آسفالت تا اونی خوب است؛ بالاتر از آن منتظر تکه‌های وصله‌شده،
    شن و کارهای تعمیری پس از ۲۰۲۳ باشید. خودروی شاسی‌بلند (SUV) انتخاب کنید — در بخش بالایی فاصلهٔ کف
    تا زمین اهمیت دارد. اونی آخرین جایگاه سوخت مطمئن است. رفت و برگشت در یک روز در این جاده‌های کوهستانی
    خسته‌کننده است؛ پس در آمبرولائوری یا اونی شب بمانید.
he:
  name: אתר הנופש שובי
  short: >-
    אתר נופש הררי מהתקופה הסובייטית בגובה 1,520 מטר למרגלות רכס הקווקז הראשי — יער מחטני, מעיינות מים
    מוגזים וזיכרון אוגוסט 2023.
  body: >-
    **שובי נבנה כמקום לנשום בו, ובמשך כמעט מאה שנה לשם כך בדיוק באו אליו אנשים.** ב-1925, ביוזמתו של שמשה
    לז'אווה, רופא בתחום רפואת המרפא ופקיד סובייטי, הונחו יסודות הסנטוריום הראשון בגובה 1,520 מטר, במקום
    שבו נחל בובה נשפך אל הצ'אנצ'אחי מתחת לרכס הקווקז הראשי. אתר הנופש נפתח ב-18 בספטמבר 1928 ונקרא על
    שמו שמשובי. ב-1938 נפל לז'אווה קורבן לטיהורים, והשם איבד בשקט את ההברה הראשונה שלו.


    מה שהעמק הציע היה פשוט ונדיר: מעיינות קרים של מים מוגזים, יער מחטני כהה על המדרונות, ואוגוסט שהטמפרטורה
    הממוצעת בו 16 מעלות, בזמן שהשפלה נצלית בחום. בכל קיץ מילאו את קרקעית העמק סנטוריומים, בתי הבראה, פנסיונים
    ומחנה תיירים.


    ב-3 באוגוסט 2023, בסביבות ארבע אחר הצהריים, ירדה בעמק הבובה זרימת בוץ וסלעים וקברה תחתיה חלק גדול
    מאתר הנופש. יותר מ-200 בני אדם חולצו במסוקים; מותם של 32 אושר, ואחד לא נמצא עד היום. בואו לכאן כפי
    שבאים לכל מקום של אבל: בשקט, בלי רחפנים, מתוך מחשבה על המשפחות שאיבדו כאן את יקיריהן.


    הנוף עצמו לא השתנה. הקווקז הגדול סוגר את העמק מצפון ורכס שודה-קדלה מדרום; הכביש שבו עליתם הוא קטע
    מן הדרך הצבאית האוסטית הישנה, והגבול עם רוסיה נמצא במרחק של כשבעה קילומטרים בלבד. משובי מטפס שביל
    מסומן אל תוך היער, אל אגם אודזירו, והכפר גלולה יושב כמה קילומטרים במורד הזרם.


    שובי עדיין יפה. רק שהוא כבר אינו חסר דאגות.
  tip: >-
    לפני היציאה התקשרו לבית ההארחה שלכם או לעיריית אוני ושאלו מה באמת פתוח והאם הדרך שמעל אוני פנויה —
    מאז 2023 התשובה משתנה מעונה לעונה. אם צפוי גשם כבד, דחו את הנסיעה: העמק הזה כבר הראה מה מים פתאומיים
    מסוגלים לעולל. קחו שכבה חמה גם באוגוסט, כשהממוצע החודשי הוא 16 מעלות בלבד והלילות קרים יותר. משכו
    מזומן ותדלקו באמברולאורי או באוני. הקליטה הסלולרית עלולה להיעלם בערוץ. התייחסו לאזור המפולת כאל אתר
    הנצחה: בלי רחפנים ובלי לחפש מזכרות.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) כ-193 ק״מ עד היציאה לטרג'ולה, משם בכביש Sh19 דרך טרג'ולה עד טקיבולי,
    ואז בכביש Sh17 צפונה דרך מעבר נקראלה עד אמברולאורי. שם עלו על כביש Sh16, סעו מזרחה לאורך הריוני עד
    אוני ופנו במעלה עמק הצ'אנצ'אחי לשובי: בסך הכול כ-320 ק״מ; הקצו חמש וחצי עד שש שעות בלי עצירות. האספלט
    סביר עד אוני; מעליה צפו לקטעים מטולאים, חצץ ועבודות תיקון שהחלו אחרי 2023. בחרו רכב SUV — מרווח הגחון
    חשוב בקטע העליון. אוני היא תחנת הדלק האמינה האחרונה. נסיעה הלוך ושוב ביום אחד בכבישי ההרים האלה מתישה,
    לכן לינו באמברולאורי או באוני.
ar:
  name: منتجع شوفي
  short: >-
    منتجع جبلي من الحقبة السوفييتية على ارتفاع 1,520 متراً تحت خط القمم الرئيسي للقوقاز — غابات مخروطية
    وينابيع مياه غازية وذكرى أغسطس 2023.
  body: >-
    **بُنيت شوفي مكاناً للتنفّس، وطوال قرن تقريباً كان الناس يأتونها لهذا تحديداً.** ففي عام 1925، بمبادرة
    من شامشي ليجافا، الطبيب المختص بالمنتجعات العلاجية والمسؤول السوفييتي، وُضع أساس المصحّة الأولى على
    ارتفاع 1,520 متراً، حيث يلتقي جدول بوبا بنهر تشانتشاخي تحت خط القمم الرئيسي للقوقاز. افتُتح المنتجع
    في 18 سبتمبر 1928 وسُمّي «شامشوفي» تكريماً له. وفي عام 1938 سقط ليجافا ضحية حملات التطهير، ففقد الاسم
    مقطعه الأول بصمت.


    كان ما يقدّمه الوادي بسيطاً ونادراً: ينابيع باردة من المياه الغازية، وغابات مخروطية داكنة على المنحدرات،
    وأغسطس بمتوسط حرارة 16 درجة بينما تلتهب السهول. وكل صيف كانت المصحّات ودور الاستراحة والنُّزُل وقاعدة
    سياحية تملأ قاع الوادي.


    قرابة الرابعة عصر 3 أغسطس 2023 انحدر سيلٌ طيني صخري عبر وادي بوبا وطمر جزءاً كبيراً من المنتجع. أُجلي
    أكثر من 200 شخص بالمروحيات؛ وتأكدت وفاة 32 شخصاً، وما زال شخص واحد مفقوداً. تعال إلى هنا كما تأتي
    إلى أي مكان للحداد: بهدوء، ومن دون طائرات مسيّرة، مستحضراً العائلات التي فقدت هنا أحبّتها.


    أما المكان نفسه فلم يتغير. يغلق القوقاز الكبير الوادي من الشمال وسلسلة شودا-كيديلا من الجنوب؛ والطريق
    الذي صعدت عليه جزء من الطريق العسكري الأوسيتي القديم، والحدود الروسية لا تبعد سوى نحو سبعة كيلومترات.
    ومن شوفي يصعد درب مُعلَّم عبر الغابة إلى بحيرة أودزيرو، وتقع قرية غلولا على بعد بضعة كيلومترات أسفل
    مجرى النهر.


    شوفي ما زالت جميلة. غير أنها لم تعد هانئة البال.
  tip: >-
    قبل الانطلاق اتصل ببيت الضيافة أو ببلدية أوني واسأل عمّا هو مفتوح فعلاً، وهل الطريق فوق أوني سالكة
    — فمنذ 2023 يتغير الجواب من موسم إلى آخر. وإن كانت التوقعات تنذر بمطر غزير فأجّل الرحلة: فهذا الوادي
    أظهر ما يستطيعه الماء المفاجئ. خذ طبقة دافئة حتى في أغسطس، إذ لا يتجاوز المتوسط الشهري 16 درجة والليالي
    أبرد. اسحب النقد واملأ الخزان في أمبرولاوري أو أوني. وقد تنقطع إشارة الهاتف في المضيق. وتعامل مع منطقة
    السيل كنُصب تذكاري: لا طائرات مسيّرة ولا بحث عن تذكارات.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً نحو 193 كم حتى مخرج تيرجولا، ثم الطريق Sh19 عبر تيرجولا إلى تكيبولي،
    ثم الطريق Sh17 شمالاً عبر ممر ناكيرالا حتى أمبرولاوري. هناك انضمّ إلى الطريق Sh16، واتبع نهر ريوني
    شرقاً حتى أوني، ثم انعطف صعوداً في وادي تشانتشاخي إلى شوفي: المجموع نحو 320 كم، فخصّص من خمس ساعات
    ونصف إلى ست ساعات دون توقف. الإسفلت جيد حتى أوني؛ وبعدها توقّع مقاطع مرقّعة وحصى وأعمال إصلاح بدأت
    بعد 2023. اختر سيارة من فئة SUV — فالخلوص الأرضي مهم في المقطع العلوي. أوني آخر محطة وقود يُعتمد عليها.
    الذهاب والعودة في يوم واحد على هذه الطرق الجبلية مرهق، فنَم في أمبرولاوري أو أوني.
