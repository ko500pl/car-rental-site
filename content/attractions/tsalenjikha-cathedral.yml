ka:
  name: წალენჯიხის მაცხოვრის ფერისცვალების ტაძარი
  short: >-
    სამეგრელოს ტაძარი, რომელიც XIV საუკუნის მიწურულს კონსტანტინოპოლელმა მანუელ ევგენიკოსმა მოხატა — გვიანბიზანტიური
    ხელოვნების პირველი რიგის ნიმუში.
  body: >-
    **XIV საუკუნის მიწურულს სამეგრელოს მთავარმა კონსტანტინოპოლში ორი კაცი გაგზავნა მხატვრის ჩამოსაყვანად
    — და მხატვარიც ჩამოვიდა.**


    მათი სახელები დღემდე წერია წალენჯიხის მაცხოვრის ფერისცვალების ტაძრის ჩრდილო-დასავლეთ ბურჯზე: მახარობელი
    კვაბალია და ანდრონიკე გაბისულავა. ისინი ვამეყ I დადიანმა გაგზავნა, რომელიც სამეგრელოს 1384–1396 წლებში
    განაგებდა. ჩამოყვანილმა ოსტატმა თავისი ნამუშევარი სამხრეთ-დასავლეთ ბურჯზე ბერძნულ-ქართული წარწერით
    მოაწერა: კირ მანუელ ევგენიკოსი. ბიზანტიური სამყაროს მხატვრები სახელს იშვიათად ტოვებდნენ; აქ კი ვიცით
    მხატვრისაც, შემკვეთისაც და იმ ორი კაცის სახელიც, ვინც მის მოსაძებნად გაემგზავრა.


    ტაძარი XII–XIV საუკუნეებში ჩამოყალიბდა: ჯვარგუმბათოვანი ნაგებობაა ნართექსითა და სამი თაღოვანი გალერეით,
    რომელთაგან ორი დადიანებმა მოგვიანებით საოჯახო სამლოცველოდ აქციეს. ეზოს გალავანი არტყია, ჩრდილო-დასავლეთ
    კუთხეში ორსართულიანი სამრეკლო დგას, გალავნის გარეთ კი დადიანების სასახლის ნანგრევებია. ტაძრიდან დასავლეთით
    40–45 მეტრი სიგრძისა და 3–4 მეტრი სიმაღლის გვირაბი მიემართება.


    შიგნით თვალს რამდენიმე წუთი აცალეთ. ევგენიკოსი დედაქალაქის გვიანპალეოლოგოსური მანერით ხატავდა: მაღალი,
    მოქნილი ფიგურები, ღრმა ნაკეცებად ჩამოშვებული სამოსი, სინათლის წვრილი შტრიხებით გამოძერწილი სახეები;
    იკონოგრაფიული პროგრამა კი სავსეა ქართული ეკლესიებისთვის იშვიათი დეტალებით. მკვლევრები მას გვიანპალეოლოგოსური
    მხატვრობის საუკეთესო ნიმუშებს შორის მოიაზრებენ.


    მეორე ფენა XVII საუკუნისაა: ეპისკოპოსმა ევდემონ ჯაიანმა ძველი მხატვრობა შეაკეთებინა, ლევან II დადიანმა
    (1611–1657) კი მიშენებული სამლოცველო მოახატვინა. ამ ნამუშევრიდან მხოლოდ ფრაგმენტებია შემორჩენილი;
    სამლოცველოს სამხრეთ კედელზე ლევანის საოჯახო პორტრეტი მოძებნეთ.


    კონსერვაცია ჩამორჩება: 1960–80-იან წლებში დაწყებული სასწრაფო სამუშაოები ბოლომდე არ მიუყვანიათ და კედლების
    ნაწილი ნესტსა და ჭუჭყს დაუბინდავს. ეს შუა საუკუნეების კავკასიის ერთ-ერთი დიდებული ინტერიერია, რომელიც
    ჯერ კიდევ იმ მზრუნველობას ელის, რასაც იმსახურებს.
  tip: >-
    ერთი საათი საკმარისია, მხატვრობის მოყვარულს — მეტიც დასჭირდება. ტაძარი მოქმედია: ჩაიცვით მოკრძალებულად,
    ქალებმა თავი დაიფარონ, წირვის დროს კი სიჩუმე დაიცავით. თუ კარი დაკეტილია, გასაღები ეზოში ან მეზობელ
    სახლებში იკითხეთ. შიგნით ბინდია — პატარა ფანარი გამოგადგებათ, ოღონდ სხივს მხატვრობას ნუ მიაპყრობთ,
    ფლეშს ნურასოდეს გამოიყენებთ და გადაღებამდე ნებართვა ითხოვეთ. ეზოში ტუალეტი არ არის; კაფე და მაღაზიები
    ქალაქის ცენტრშია. საუკეთესო სინათლე მზიანი დღის შუა საათებშია, როცა ყელის სარკმლებიდან შემოსული მზე
    გუმბათს ნელ-ნელა ხსნის.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით, ქუთაისისა და სენაკის გავლით, ზუგდიდამდე იარეთ, იქიდან კი შ6-ით
    ჩრდილო-აღმოსავლეთით წალენჯიხამდე — დაახლოებით 30 კილომეტრი სოფლებში გამავალი ასფალტით. ქალაქიდან ტაძრამდე
    ერთკილომეტრიანი განშტოება მიდის. სულ დაახლოებით 345 კმ და ხუთი საათია. ს1 დიდ მონაკვეთებზე სწრაფი
    მაგისტრალია; შ6 უფრო ვიწროა და სოფლებში ნელი, მაგრამ საფარი კარგია. ეკონომ-კლასის ავტომობილი ნებისმიერ
    სეზონზე საკმარისია. საწვავი ზუგდიდში შეავსეთ. ვიზიტს კარგად ერწყმის ზუგდიდის დადიანების სასახლე და
    ენგურის კაშხალი ჯვარში, წალენჯიხიდან შ94-ით 13 კილომეტრზე.
en:
  name: Tsalenjikha Cathedral
  short: >-
    A Mingrelian cathedral painted in the late 14th century by the Constantinople master Manuel Eugenikos:
    late Byzantine art of the first rank.
  body: >-
    **Late in the fourteenth century a Mingrelian prince sent two men to Constantinople to fetch a painter,
    and the painter came.**


    Their names are still written on the north-western pier of the Cathedral of the Transfiguration in
    Tsalenjikha: Makharobeli Kvabalia and Andronike Gabisulava, sent by Vameq I Dadiani, who ruled Mingrelia
    from 1384 to 1396. The master they brought back signed his work on the south-western pier, in Greek
    and Georgian: Kyr Manuel Eugenikos. Painters of the Byzantine world seldom left their names. Here
    we know the painter, his patron and the two men who went to find him.


    The church grew between the twelfth and fourteenth centuries: a domed cross-in-square with a narthex
    and three arcaded galleries, two of which the Dadianis later turned into their family chapel. A wall
    rings the yard, a two-storey bell tower holds its north-western corner, and outside lie the ruins
    of a Dadiani palace. A tunnel 40 to 45 metres long and 3 to 4 metres high runs west from the church.


    Eugenikos worked in the late Palaiologan manner of the capital: tall, slender figures, drapery falling
    in deep folds, faces built up with fine strokes of light, and an iconographic programme full of details
    rarely seen in Georgian churches. Scholars count it among the best examples of late Palaiologan painting.


    A second layer belongs to the seventeenth century, when Bishop Eudemon Jaiani had the old murals repaired
    and Levan II Dadiani (r. 1611–1657) had the adjoining chapel painted. Only fragments survive; look
    on the chapel's south wall for Levan's family portrait.


    Conservation has lagged. Emergency work in the 1960s to 1980s was never completed, and damp and grime
    have dimmed parts of the walls. This is one of the great interiors of the medieval Caucasus, still
    waiting for the care it deserves.
  tip: >-
    Allow an hour, more if you love painting. This is a working church: dress modestly, women cover their
    hair, and keep quiet during services. If the door is locked, ask in the yard or at the neighbouring
    houses for the keyholder. It is dim inside, so a small torch helps, but keep the beam off the paint,
    never use flash, and ask before photographing. There is no toilet in the yard; cafés and shops are
    in the town centre. The best light comes in the middle of a bright day, when sun through the drum
    windows slowly opens up the dome.
  route: >-
    From Tbilisi follow the E60/S1 west past Kutaisi and Senaki to Zugdidi, then take the Sh6 north-east
    to Tsalenjikha, about 30 km of asphalt through villages. A one-kilometre spur leads from the town
    to the cathedral. In all it is about 345 km and five hours. The S1 is fast highway for long stretches;
    the Sh6 is narrower and slow through the villages but well surfaced. An economy car is enough in any
    season. Refuel in Zugdidi. The visit pairs well with the Dadiani Palace in Zugdidi and with the Enguri
    dam at Jvari, 13 km from Tsalenjikha along the Sh94.
ru:
  name: Цаленджихский собор
  short: >-
    Мегрельский собор, расписанный в конце XIV века константинопольским мастером Мануилом Евгеником: поздневизантийская
    живопись высшего класса.
  body: >-
    **В конце XIV века мегрельский владетель отправил двоих людей в Константинополь за художником — и
    художник приехал.**


    Их имена до сих пор написаны на северо-западном столпе собора Преображения в Цаленджихе: Махаробели
    Квабалия и Андронике Габисулава, посланные Вамеком I Дадиани, правившим Мегрелией с 1384 по 1396 год.
    Мастер, которого они привезли, подписал свою работу на юго-западном столпе по-гречески и по-грузински:
    Кир Мануил Евгеник. Живописцы византийского мира редко оставляли имена. Здесь же известны и художник,
    и заказчик, и те двое, что ездили его искать.


    Храм складывался с XII по XIV век: крестово-купольная церковь с притвором и тремя аркадными галереями,
    две из которых Дадиани позднее превратили в родовой придел. Двор обнесён стеной, северо-западный её
    угол занимает двухъярусная колокольня, а за оградой лежат руины дворца Дадиани. От церкви на запад
    уходит тоннель длиной 40–45 метров и высотой 3–4 метра.


    Евгеник работал в поздней палеологовской манере столицы: высокие стройные фигуры, одежды, спадающие
    глубокими складками, лица, вылепленные тонкими световыми штрихами, и иконографическая программа, полная
    деталей, редких для грузинских храмов. Исследователи ставят эту роспись в ряд лучших образцов поздней
    палеологовской живописи.


    Второй слой относится к XVII веку: епископ Евдемон Джаиани велел подновить старые росписи, а Леван
    II Дадиани (правил в 1611–1657 годах) заказал роспись примыкающего придела. От неё остались лишь фрагменты;
    на южной стене придела найдите семейный портрет Левана.


    Реставрация отстаёт. Аварийные работы 1960–1980-х годов так и не были завершены, и сырость с копотью
    притушили часть стен. Это один из великих интерьеров средневекового Кавказа — и он всё ещё ждёт заботы,
    которой заслуживает.
  tip: >-
    Отведите час, а если любите живопись — больше. Это действующий храм: одевайтесь скромно, женщины покрывают
    голову, во время службы соблюдайте тишину. Если дверь заперта, спросите во дворе или в соседних домах,
    у кого ключ. Внутри полумрак, так что пригодится небольшой фонарик, но не направляйте луч на роспись,
    никогда не пользуйтесь вспышкой и спрашивайте, прежде чем фотографировать. Туалета во дворе нет; кафе
    и магазины — в центре города. Лучший свет — в середине ясного дня, когда солнце из окон барабана постепенно
    раскрывает купол.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Кутаиси и Сенаки до Зугдиди, затем по Sh6 на северо-восток до Цаленджихи
    — около 30 км асфальта через сёла. От города к собору ведёт километровое ответвление. Всего около
    345 км и пять часов. S1 на длинных отрезках — скоростная трасса; Sh6 более узкая и в сёлах медленнее,
    но с хорошим покрытием. В любое время года хватит машины эконом-класса. Заправьтесь в Зугдиди. Поездку
    удобно совместить с дворцом Дадиани в Зугдиди и с плотиной Ингурской ГЭС у Джвари, в 13 км от Цаленджихи
    по Sh94.
fa:
  name: کلیسای جامع تسالنجیخا
  short: >-
    کلیسای جامعی در مگرلیا که در اواخر سدهٔ چهاردهم به دست مانوئل ائوگنیکوس، استادی از قسطنطنیه، نقاشی
    شد: هنر بیزانسی متأخر در بالاترین مرتبه.
  body: >-
    **در اواخر سدهٔ چهاردهم، امیری مگرلی دو مرد را به قسطنطنیه فرستاد تا نقاشی بیاورند — و نقاش آمد.**


    نام آن دو هنوز بر ستون شمال‌غربی کلیسای جامع تبدیل هیئت در تسالنجیخا نوشته است: ماخاروبلی کوابالیا
    و آندرونیکه گابیسولاوا، فرستادگان وامق یکم دادیانی که از ۱۳۸۴ تا ۱۳۹۶ بر مگرلیا فرمان راند. استادی
    که با خود آوردند، کارش را بر ستون جنوب‌غربی به یونانی و گرجی امضا کرد: سرور مانوئل ائوگنیکوس. نقاشان
    جهان بیزانس کمتر نامی از خود به جا می‌گذاشتند. اینجا اما هم نقاش را می‌شناسیم، هم حامی‌اش را و هم
    دو مردی را که به جست‌وجویش رفتند.


    کلیسا میان سده‌های دوازدهم و چهاردهم شکل گرفت: بنایی گنبددار با نقشهٔ صلیب در مربع، با دهلیز ورودی
    (نارتکس) و سه رواق طاق‌دار که دادیانی‌ها بعدها دوتای آن را به نمازخانهٔ خانوادگی خود بدل کردند. دیواری
    گرد حیاط کشیده شده، برج ناقوسی دوطبقه گوشهٔ شمال‌غربی آن را گرفته و بیرون از آن ویرانه‌های کاخی از
    دادیانی‌ها افتاده است. تونلی به درازای ۴۰ تا ۴۵ متر و بلندای ۳ تا ۴ متر از کلیسا به سمت غرب می‌رود.


    ائوگنیکوس به شیوهٔ متأخر پالئولوگیِ پایتخت کار می‌کرد: پیکرهایی بلند و باریک، جامه‌هایی که در چین‌های
    ژرف فرو می‌ریزند، چهره‌هایی که با ضربه‌های ظریف نور ساخته شده‌اند، و برنامهٔ شمایل‌نگاری‌ای سرشار
    از جزئیاتی که در کلیساهای گرجستان کمتر دیده می‌شود. پژوهشگران آن را در شمار بهترین نمونه‌های نقاشی
    پالئولوگی متأخر می‌دانند.


    لایهٔ دوم از آنِ سدهٔ هفدهم است، هنگامی که اسقف ائودمون جایانی دستور مرمت نقاشی‌های کهن را داد و لوان
    دوم دادیانی (حکومت ۱۶۱۱–۱۶۵۷) نقاشی نمازخانهٔ مجاور را سفارش داد. تنها پاره‌هایی از آن مانده است؛
    بر دیوار جنوبی نمازخانه، تصویر خانوادگی لوان را بجویید.


    مرمت عقب مانده است. کارهای اضطراری دهه‌های ۱۹۶۰ تا ۱۹۸۰ هرگز به پایان نرسید و رطوبت و دوده بخش‌هایی
    از دیوارها را کدر کرده است. این یکی از باشکوه‌ترین فضاهای درونی قفقاز قرون‌وسطی است که هنوز چشم‌انتظار
    مراقبتی است که سزاوارش است.
  tip: >-
    یک ساعت وقت بگذارید، و اگر دلدادهٔ نقاشی هستید بیشتر. این کلیسا فعال است: پوشیده لباس بپوشید، بانوان
    موی سر را بپوشانند و هنگام مراسم سکوت را رعایت کنید. اگر در قفل بود، در حیاط یا از خانه‌های همسایه
    سراغ کلیددار را بگیرید. درون کلیسا کم‌نور است، پس چراغ‌قوهٔ کوچکی به کار می‌آید، اما نورش را از نقاشی‌ها
    دور نگه دارید، هرگز از فلاش استفاده نکنید و پیش از عکاسی اجازه بگیرید. در حیاط سرویس بهداشتی نیست؛
    کافه‌ها و فروشگاه‌ها در مرکز شهرند. بهترین نور در میانهٔ روزی آفتابی است، وقتی خورشید از پنجره‌های
    ساقهٔ گنبد می‌تابد و گنبد را آرام‌آرام می‌گشاید.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب، از کنار کوتائیسی و سناکی تا زوگدیدی بروید، سپس جادهٔ Sh6 را به
    شمال‌شرق تا تسالنجیخا بگیرید؛ حدود ۳۰ کیلومتر آسفالت از میان روستاها. یک راه فرعی یک‌کیلومتری از شهر
    به کلیسا می‌رسد. روی هم حدود ۳۴۵ کیلومتر و پنج ساعت. S1 در بخش‌های طولانی بزرگراهی سریع است؛ Sh6 باریک‌تر
    است و در روستاها کند، اما رویه‌ای خوب دارد. در هر فصلی خودروی اقتصادی کافی است. در زوگدیدی سوخت بگیرید.
    این بازدید را می‌توان با کاخ دادیانی در زوگدیدی و سد انگوری در جواری، در ۱۳ کیلومتری تسالنجیخا از
    راه Sh94، همراه کرد.
he:
  name: קתדרלת צלנג׳יחה
  short: >-
    קתדרלה מגרלית שצוירה בסוף המאה ה-14 בידי מנואל אאוגניקוס, אמן מקונסטנטינופול: אמנות ביזנטית מאוחרת
    מן השורה הראשונה.
  body: >-
    **בסוף המאה הארבע-עשרה שלח נסיך מגרלי שני אנשים לקונסטנטינופול להביא צייר — והצייר בא.**


    שמותיהם עדיין כתובים על העמוד הצפון-מערבי של קתדרלת ההשתנות בצלנג׳יחה: מחרובלי קוובליה ואנדרוניקה
    גביסולאווה, שליחיו של ואמק הראשון דדיאני, ששלט במגרליה מ-1384 עד 1396. האמן שהביאו חתם על עבודתו על
    העמוד הדרום-מערבי, ביוונית ובגאורגית: מנואל אאוגניקוס, בתוספת התואר היווני "קיר" (אדון). ציירי העולם
    הביזנטי הותירו את שמם לעיתים רחוקות. כאן אנחנו מכירים את הצייר, את פטרונו ואת שני האנשים שיצאו לחפש
    אותו.


    הכנסייה נבנתה בין המאה ה-12 למאה ה-14: כנסיית כיפה בתוכנית צלב בתוך ריבוע, עם נרתקס (אולם כניסה) ושלוש
    גלריות מקושתות, ששתיים מהן הפכו בני דדיאני מאוחר יותר לקפלה המשפחתית שלהם. חומה מקיפה את החצר, מגדל
    פעמונים דו-קומתי ניצב בפינתה הצפון-מערבית, ומחוץ לה שוכנות חורבות ארמון של בני דדיאני. מן הכנסייה
    מערבה נמשכת מנהרה שאורכה 40 עד 45 מטר וגובהה 3 עד 4 מטר.


    אאוגניקוס עבד בסגנון הפליאולוגי המאוחר של הבירה: דמויות גבוהות ותמירות, גלימות הנופלות בקפלים עמוקים,
    פנים הבנויות במשיכות אור עדינות, ותוכנית איקונוגרפית עשירה בפרטים שנדיר לראותם בכנסיות גאורגיות. החוקרים
    מונים אותה בין הדוגמאות הטובות ביותר של הציור הפליאולוגי המאוחר.


    שכבה שנייה שייכת למאה ה-17, כשהבישוף אאודמון ג׳איאני הורה לתקן את ציורי הקיר הישנים, ולוואן השני דדיאני
    (שלט 1611–1657) הזמין את ציור הקפלה הסמוכה. שרדו ממנה רק שברים; חפשו על הקיר הדרומי של הקפלה את דיוקן
    משפחתו של לוואן.


    השימור מתעכב. עבודות חירום בשנות ה-60 עד ה-80 של המאה העשרים לא הושלמו מעולם, ולחות ופיח העמימו חלקים
    מן הקירות. זהו אחד מחללי הפנים הגדולים של הקווקז בימי הביניים, והוא עדיין מחכה לטיפול שמגיע לו.
  tip: >-
    הקדישו שעה, ויותר אם אתם אוהבי ציור. זו כנסייה פעילה: התלבשו בצניעות, נשים מכסות את השיער, ושמרו על
    שקט בזמן התפילות. אם הדלת נעולה, שאלו בחצר או בבתים השכנים מי מחזיק במפתח. בפנים שורר אור עמום, כך
    שפנס קטן יעזור — אבל הרחיקו את האלומה מן הציורים, לעולם אל תשתמשו בפלאש, ובקשו רשות לפני שאתם מצלמים.
    בחצר אין שירותים; בתי קפה וחנויות יש במרכז העיר. האור הטוב ביותר הוא באמצע יום בהיר, כשהשמש החודרת
    מחלונות תוף הכיפה חושפת את הכיפה לאט-לאט.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני קוטאיסי וסנאקי עד זוגדידי, ומשם בכביש Sh6 צפונה-מזרחה עד צלנג׳יחה
    — כ-30 ק״מ של אספלט דרך כפרים. שלוחה של קילומטר אחד מובילה מן העיר אל הקתדרלה. בסך הכול כ-345 ק״מ
    וחמש שעות. ה-S1 הוא כביש מהיר לאורך קטעים ארוכים; ה-Sh6 צר יותר ואיטי בכפרים, אבל הסלילה בו טובה.
    רכב אקונומי מספיק בכל עונה. תדלקו בזוגדידי. את הביקור כדאי לשלב עם ארמון דדיאני בזוגדידי ועם סכר האנגורי
    בג׳ווארי, 13 ק״מ מצלנג׳יחה בכביש Sh94.
ar:
  name: كاتدرائية تسالينجيخا
  short: >-
    كاتدرائية ميغريلية زيّنها بالرسوم في أواخر القرن الرابع عشر المعلّم القسطنطيني مانويل إفغينيكوس: فن
    بيزنطي متأخر من الطراز الأول.
  body: >-
    **في أواخر القرن الرابع عشر أرسل أمير ميغريلي رجلين إلى القسطنطينية ليأتيا برسّام، فجاء الرسّام.**


    ما زال اسماهما مكتوبين على الدعامة الشمالية الغربية لكاتدرائية التجلي في تسالينجيخا: ماخاروبيلي كفاباليا
    وأندرونيكه غابيسولافا، مبعوثا فامق الأول دادياني الذي حكم ميغريليا من 1384 إلى 1396. أما المعلّم الذي
    عادا به فقد وقّع عمله على الدعامة الجنوبية الغربية باليونانية والجورجية: كير مانويل إفغينيكوس («كير»
    لقب تبجيل يوناني). ونادرًا ما ترك رسّامو العالم البيزنطي أسماءهم. أما هنا فنعرف الرسّام وراعيه والرجلين
    اللذين ذهبا للبحث عنه.


    نشأت الكنيسة بين القرنين الثاني عشر والرابع عشر: كنيسة ذات قبة على مخطط الصليب داخل مربع، لها رواق
    مدخل (نارثكس) وثلاثة أروقة مقنطرة، حوّل آل دادياني اثنين منها لاحقًا إلى مصلّى عائلي لهم. يحيط سورٌ
    بالفناء، ويشغل زاويته الشمالية الغربية برج أجراس من طابقين، وخارجه تقع أطلال قصر لآل دادياني. ويمتد
    من الكنيسة غربًا نفق طوله 40 إلى 45 مترًا وارتفاعه 3 إلى 4 أمتار.


    عمل إفغينيكوس على الطراز الباليولوجي المتأخر السائد في العاصمة: شخوص طويلة ممشوقة، وثياب تنسدل في
    طيّات عميقة، ووجوه مبنية بلمسات دقيقة من الضوء، وبرنامج أيقوني حافل بتفاصيل قلّما تُرى في الكنائس
    الجورجية. ويعدّها الباحثون من أرفع نماذج التصوير الباليولوجي المتأخر.


    وتعود طبقة ثانية إلى القرن السابع عشر، حين أمر الأسقف إيفديمون جاياني بترميم الرسوم القديمة، وأمر
    ليفان الثاني دادياني (حكم 1611–1657) بتزيين المصلّى الملاصق بالرسوم. لم يبقَ منها سوى شذرات؛ ابحث
    على الجدار الجنوبي للمصلّى عن صورة ليفان مع أسرته.


    لقد تأخر الترميم. فأعمال الإنقاذ في الستينيات حتى الثمانينيات من القرن العشرين لم تكتمل قط، وأطفأت
    الرطوبة والسُّخام أجزاءً من الجدران. هذا واحد من أعظم الفضاءات الداخلية في قوقاز القرون الوسطى، وما
    زال ينتظر العناية التي يستحقها.
  tip: >-
    خصّص ساعة، وأكثر إن كنت من عشّاق الرسم. هذه كنيسة عامرة بالعبادة: البس لباسًا محتشمًا، وتغطي النساء
    شعورهن، والتزم الهدوء أثناء الصلوات. إن وجدت الباب مقفلًا فاسأل في الفناء أو في البيوت المجاورة عمّن
    يحمل المفتاح. الداخل خافت الضوء، فمصباح صغير يفيد، لكن أبعد شعاعه عن الرسوم، ولا تستعمل الفلاش أبدًا،
    واستأذن قبل التصوير. لا توجد دورة مياه في الفناء؛ المقاهي والمتاجر في وسط البلدة. أجمل ضوء يكون في
    منتصف يوم مشمس، حين تتسلل الشمس من نوافذ رقبة القبة فتكشف القبة شيئًا فشيئًا.
  route: >-
    من تبليسي اتبع الطريق E60/S1 غربًا مرورًا بكوتايسي وسيناكي حتى زوغديدي، ثم خذ الطريق Sh6 شمالًا شرقًا
    إلى تسالينجيخا، نحو 30 كم من الأسفلت عبر القرى. ويقود فرع طوله كيلومتر واحد من البلدة إلى الكاتدرائية.
    المجموع نحو 345 كم وخمس ساعات. الطريق S1 سريع على امتداد مقاطع طويلة؛ أما Sh6 فأضيق وبطيء عبر القرى
    لكنه جيد الرصف. سيارة اقتصادية تكفي في أي فصل. تزوّد بالوقود في زوغديدي. وتنسجم الزيارة مع قصر دادياني
    في زوغديدي ومع سد إنغوري في جفاري، على بعد 13 كم من تسالينجيخا عبر الطريق Sh94.
