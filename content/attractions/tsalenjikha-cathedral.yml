ka:
  name: წალენჯიხის მაცხოვრის ფერისცვალების ტაძარი
  short: XIV საუკუნის ბიზანტიური კედლის მხატვრობა, შესრულებული კონსტანტინოპოლელი ოსტატის მიერ, პატარა
    მეგრულ ქალაქში.
  body: >-
    **საქართველოში შემორჩენილი საუკეთესო ბიზანტიური კედლის მხატვრობა პატარა მეგრულ ქალაქშია** — იქ, სადაც
    მგზავრების უმეტესობა უბრალოდ ჩაუვლის ხოლმე. მაცხოვრის ფერისცვალების ტაძარი წალენჯიხის ცენტრში, გალავნით
    შემოსაზღვრულ ეზოში დგას.


    შენობა XII-XIV საუკუნეებში ჩამოყალიბდა: ჯვარგუმბათოვანი ეკლესია მაღალი ყელით, გვერდით ცალკე მდგარი
    სამრეკლოთი და XVII საუკუნეში ლევან II დადიანის მიერ მიშენებული სამლოცველოთი. გარედან ის სხვა მეგრულ
    ეკლესიებს ჰგავს — ქვის წყობა არაერთგვაროვანია, არაერთხელ შეკეთებული. მთავარი შიგნითაა.


    1380-იან წლებში სამეგრელოს მთავარმა ვამეყ I დადიანმა კონსტანტინოპოლიდან მხატვარი ჩამოიყვანა: კვირიკე
    მანუელ ევგენიკოსი. მან თავისი ნამუშევარი სამხრეთ-დასავლეთ ბურჯზე ბერძნულ-ქართული ორენოვანი წარწერით
    მოაწერა. ბიზანტიური სამყაროს იმ მცირერიცხოვან მხატვართა შორისაა, ვისი სახელიც საერთოდ ვიცით.


    მისი მხატვრობა გვიანპალეოლოგოსური ხანის პირველი რიგის ნიმუშია: წაგრძელებული ფიგურები, ღრმა ნაკეცები,
    მწვანე ქვესაფენზე თხელი თეთრი ხაზებით მოდელირებული სახეები და ისეთი იკონოგრაფიული პროგრამა, სადაც
    ქართული ეკლესიებისთვის უჩვეულო სცენებია. გუმბათი, ყელი, აფსიდი და კამარები მთლიანად დაფარულია; ქვედა
    რეგისტრებში მდგომ წმინდანთა რიგებია.


    XVII საუკუნეში ეპისკოპოს ევდემონ ჯაიანისა და ლევან II დადიანის დროს დამატებული ფენა უფრო უხეშია და
    ადვილად გასარჩევი; მისგან მხოლოდ ფრაგმენტებია შემორჩენილი.


    პროგრამა თავისი დროის ბიზანტიურ წესს მისდევს — მაცხოვარი ზემოთ, წინასწარმეტყველები ყელში, სადღესასწაულო
    ციკლი კამარებზე, მღვდელმთავრები საკურთხეველში — მაგრამ იშვიათი სიხშირითაა გაწერილი და პატარა სცენებიც
    ცალკე დათვალიერებას იმსახურებს. ქვედა კედლებს ნესტმა შეაჭამა; კონსერვაცია წყვეტილი იყო, ამიტომ ზოგი
    მონაკვეთი გაწმენდილი და ნათელია, ზოგიც ჯერ კიდევ ჭვარტლისფერი.


    წალენჯიხა ეპისკოპოსის კათედრა იყო და ტაძარიც სწორედ ამიტომ არის ასეთი დიდი პატარა ქალაქისთვის. ვიზიტი
    კარგად ერწყმის იმავე დღეს ენგურის კაშხალსა და ზუგდიდის დადიანების სასახლეს — სამივე ერთმანეთისგან
    ნახევარ საათშია.


    ეკლესია ბნელია და თვალს შეგუება სჭირდება. საუკეთესო დროა ნათელი დღის შუადღე, როცა სინათლე ყელის სარკმლებიდან
    ჩამოდის და გუმბათის მხატვრობა თანდათან იკითხება. ფოტოს გადაღების წესები მკაცრია — ანთებული შუქი ფრესკებს
    აზიანებს.


    ეზო თავისთავად უბრალოა: ბალახი, რამდენიმე საფლავი და სამრეკლო. ქალაქიც პროვინციული და ჩუმია. სწორედ
    ეს კონტრასტი ხდის ვიზიტს დასამახსოვრებელს — რიგი არ დგას, ბილეთი არ იყიდება, კარი კი ღიაა.
  tip: >-
    ერთი საათი სავსებით საკმარისია, თუმცა თუ მხატვრობა გაინტერესებს, მეტიც გაივლის შეუმჩნევლად. ჩაცმის
    წესი მოქმედებს: ქალებისთვის თავსაფარი და გრძელი კალთა, კარებთან დევს. შიგნით ბნელია — ფანარი ან ტელეფონის
    განათება დაგეხმარება, მაგრამ ფრესკებზე პირდაპირ ნუ მიმართავ. ფოტოსთვის ნებართვა ჰკითხე. ტაძარი მუდმივად
    ღია არ არის; თუ კარი დაკეტილია, ეზოში ან მეზობლად იკითხე მნათე. პარკირება ქუჩაშია, უფასო; კაფე და
    მაღაზია ორ წუთზეა. ტუალეტი ეზოში არ არის, ამიტომ ზუგდიდში ან გზაზე გაითვალისწინე.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდის მიმართულებით, ზუგდიდიდან კი ჩრდილო-აღმოსავლეთით წალენჯიხისკენ
    — სულ დაახლოებით 345 კმ და ხუთი საათი. მთელი გზა ასფალტია; ბოლო ოცდახუთი კილომეტრი ვიწროვდება, სოფლებში
    გადის და ნელი მოძრაობა მოგიწევს, მაგრამ საფარი კარგია. ტაძარი ქალაქის ცენტრშია, მთავარი ქუჩიდან მოკლე
    შესახვევით; ნიშანი პატარაა. საწვავი ზუგდიდში აიღე — წალენჯიხაში სადგური ნაკლებია. ტაძრის ეზოსთან ორიოდე
    მანქანა თუ დაეტევა, ამიტომ ხშირად მთავარ ქუჩაზე გაჩერება მოგიწევს. ეკონომ-კლასის ავტომობილი მთელი
    წლის განმავლობაში საკმარისია, ზამთარშიც.
en:
  name: Tsalenjikha Cathedral
  short: >-
    The finest Byzantine wall painting in Georgia, made by a master from Constantinople, in a small Mingrelian
    town.
  body: >-
    **The best Byzantine wall painting surviving in Georgia is in a small Mingrelian town that most travellers
    drive straight past.** The Cathedral of the Transfiguration of the Saviour stands in a walled yard
    in the middle of Tsalenjikha.


    The building took shape between the twelfth and fourteenth centuries: a domed cross-in-square church
    with a tall drum, a separate bell tower alongside, and a chapel added in the seventeenth century by
    Levan II Dadiani. From outside it looks like other Mingrelian churches, its masonry patched by repeated
    repair. The reason to come is inside.


    In the 1380s Vameq I Dadiani, ruler of Mingrelia, brought a painter from Constantinople: Cyrus Manuel
    Eugenikos. He signed the work in a bilingual Greek and Georgian inscription on the south-western pier,
    which makes him one of the very few painters of the Byzantine world whose name we know at all.


    What he left is late Palaiologan painting of the first rank: elongated figures, deep folds, faces
    modelled over a green underlayer with thin white highlights, and an iconographic programme containing
    scenes rarely found in Georgian churches. The dome, the drum, the apse and the vaults are entirely
    covered; the lower registers carry ranks of standing saints.


    A second layer, added in the seventeenth century under Bishop Eudemon Jaiani and Levan II Dadiani,
    is coarser, easy to tell apart, and survives only in fragments.


    The programme follows the Byzantine order of its day — Christ above, prophets around the drum, the
    feast cycle across the vaults, bishops in the sanctuary — but it is worked out with unusual density,
    and the smaller scenes repay a slow circuit. Damp has eaten into the lower walls and conservation
    has been intermittent, so some panels are clean and bright while others are still grey with grime.


    Tsalenjikha was a bishop's seat, which is why the church is so large for so small a town. It pairs
    well in one day with the Enguri dam and the Dadiani palace in Zugdidi.


    The church is dark and your eyes need time. The best moment is the middle of a bright day, when light
    falls through the windows of the drum and the dome slowly becomes readable. Photography rules are
    strict, and rightly so: flash damages pigment.


    The yard is plain: grass, a few graves, the bell tower. That contrast is what stays with you — no
    queue, no ticket desk, no crowd, only an open door and one of the great interiors of the medieval
    Caucasus.
  tip: >-
    An hour is enough, though anyone interested in painting will lose more time than they planned. Dress
    rules apply; scarves and wrap skirts are left by the door. It is dark inside, so a torch helps, but
    never point a light straight at the frescoes and never use flash. Ask before photographing. The church
    is not always open — if the door is locked, ask in the yard or the houses next door for the keyholder.
    Street parking is free, and there are shops and a café two minutes away.
  route: >-
    From Tbilisi take the E60 to Senaki, continue towards Zugdidi, then head north-east from Zugdidi to
    Tsalenjikha — about 345 km in all and five hours. The whole route is asphalt. The last twenty-five
    kilometres narrow, run through villages and are slow, but the surface is decent. The cathedral sits
    in the town centre, a short turn off the main street, and the sign is small, so watch for the bell
    tower above the roofs. Refuel in Zugdidi. An economy car is enough all year, including winter.
ru:
  name: Цаленджихский собор Преображения
  short: Лучшая византийская стенопись Грузии, сделанная мастером из Константинополя, в небольшом мегрельском
    городке.
  body: >-
    **Лучшая сохранившаяся в Грузии византийская стенопись находится в маленьком мегрельском городке,
    мимо которого почти все проезжают.** Собор Преображения Спасителя стоит в обнесённом оградой дворе
    в центре Цаленджихи.


    Здание сложилось между XII и XIV веками: крестово-купольная церковь с высоким барабаном, отдельно
    стоящая колокольня рядом и придел, пристроенный в XVII веке Леваном II Дадиани. Снаружи оно похоже
    на другие мегрельские храмы — кладка неровная, много раз чиненная. Смысл поездки внутри.


    В 1380-е годы владетель Мегрелии Вамек I Дадиани привёз художника из Константинополя: Кира Мануила
    Евгеника. Он подписал работу двуязычной греко-грузинской надписью на юго-западном пилоне, и это делает
    его одним из немногих живописцев византийского мира, чьё имя мы вообще знаем.


    Оставленное им — палеологовская живопись первого ряда: вытянутые фигуры, глубокие складки, лица, вылепленные
    по зелёному подмалёвку тонкими белыми движками, и иконографическая программа со сценами, редкими для
    грузинских храмов. Купол, барабан, апсида и своды покрыты целиком; в нижних регистрах — ряды стоящих
    святых.


    Второй слой добавили в XVII веке при епископе Евдемоне Джаиани и Леване II Дадиани. Он грубее и легко
    отличим, и от него уцелели только фрагменты.


    Программа следует византийскому порядку своего времени — Христос вверху, пророки в барабане, праздничный
    цикл по сводам, святители в алтаре, — но выстроена с необычной плотностью, и мелкие сцены стоят медленного
    обхода. Нижние стены съедены сыростью, реставрация шла с перерывами: одни участки расчищены и ярки,
    другие ещё серы от копоти.


    Цаленджиха была епископской кафедрой, поэтому храм так велик для столь небольшого города. Поездка
    хорошо укладывается в один день с Ингурской ГЭС и дворцом Дадиани в Зугдиди: все три места в получасе
    друг от друга.


    В церкви темно, и глазам нужно время. Лучший момент — середина ясного дня, когда свет падает из окон
    барабана и купол постепенно становится читаемым. Правила съёмки строгие, и справедливо: вспышка разрушает
    пигмент.


    Двор прост — трава, несколько надгробий, колокольня. Городок тихий и провинциальный. Именно этот контраст
    и запоминается: ни очереди, ни кассы, ни толпы, только открытая дверь и один из великих интерьеров
    средневекового Кавказа.
  tip: >-
    Часа достаточно, хотя интересующийся живописью потеряет здесь больше времени, чем планировал. Действуют
    правила одежды, платки и юбки лежат у входа. Внутри темно, фонарик помогает, но никогда не светите
    прямо на фрески и не пользуйтесь вспышкой. Перед съёмкой спросите. Храм открыт не всегда: если дверь
    заперта, спросите во дворе или в соседних домах, у кого ключ. Парковка на улице бесплатная, магазины
    и кафе в двух минутах.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше в сторону Зугдиди, а от Зугдиди на северо-восток к Цаленджихе
    — всего около 345 км и пять часов. Весь маршрут асфальтирован. Последние двадцать пять километров
    сужаются, идут через сёла и требуют медленной езды, но покрытие приличное. Собор в центре городка,
    короткий поворот с главной улицы; указатель маленький, поэтому ориентируйтесь на колокольню над крышами.
    Заправляйтесь в Зугдиди. Машины эконом-класса достаточно круглый год, включая зиму.
fa:
  name: کلیسای جامع تسالنجیخا
  short: بهترین نقاشی دیواری بیزانسی گرجستان، کار استادی از قسطنطنیه، در شهری کوچک در مینگرلیا.
  body: >-
    **بهترین نقاشی دیواری بیزانسی بازمانده در گرجستان در شهرکی کوچک در مینگرلیا است که بیشتر مسافران از
    کنارش رد می‌شوند.** کلیسای جامع تجلی مسیح در حیاطی حصاردار در میانهٔ تسالنجیخا ایستاده است.


    بنا میان سده‌های دوازدهم و چهاردهم شکل گرفت: کلیسایی چلیپایی گنبددار با ساقهٔ بلند، برج ناقوسی جداگانه
    در کنارش، و نمازخانه‌ای که در سدهٔ هفدهم لوان دوم داديانی افزود. از بیرون شبیه دیگر کلیساهای مینگرلی
    است؛ سنگ‌چینش ناهموار و بارها تعمیرشده. دلیل آمدن در درون است.


    در دههٔ ۱۳۸۰ میلادی، وامِک یکم داديانی فرمانروای مینگرلیا نقاشی از قسطنطنیه آورد: کیروس مانوئل اِوگِنیکوس.
    او کارش را با کتیبه‌ای دوزبانه به یونانی و گرجی بر جرز جنوب غربی امضا کرد، و همین او را از معدود نقاشان
    جهان بیزانس می‌کند که نامشان را می‌دانیم.


    آنچه به جا گذاشته نقاشی درجه‌یک اواخر دورهٔ پالئولوگ است: پیکرهای کشیده، چین‌های ژرف، چهره‌هایی که
    روی زیرلایهٔ سبز با خطوط نازک سفید پرداخت شده‌اند، و برنامه‌ای شمایل‌نگارانه با صحنه‌هایی که در کلیساهای
    گرجی کمتر دیده می‌شود. گنبد و ساقه و محراب و طاق‌ها یکسره پوشیده‌اند و در ردیف‌های پایین صف‌های قدیسان
    ایستاده‌اند.


    لایهٔ دومی در سدهٔ هفدهم در روزگار اسقف اِودِمون جایانی و لوان دوم داديانی افزوده شد. زمخت‌تر است
    و به‌آسانی تشخیص داده می‌شود، و تنها پاره‌هایی از آن مانده است.


    برنامهٔ نقاشی از نظم بیزانسی روزگار خود پیروی می‌کند — مسیح در بالا، پیامبران گرد ساقه، چرخهٔ اعیاد
    بر طاق‌ها و اسقفان در محراب — اما با تراکمی غیرعادی اجرا شده و صحنه‌های کوچک‌تر ارزش یک دور آهسته
    را دارند. رطوبت دیوارهای پایینی را خورده و مرمت با وقفه پیش رفته است؛ بخشی از قاب‌ها پاکیزه و روشن‌اند
    و بخشی هنوز خاکستری از دوده.


    تسالنجیخا کرسی اسقفی بود و به همین سبب کلیسا برای شهری چنین کوچک این‌قدر بزرگ است. این دیدار به‌خوبی
    در یک روز با سد اینگوری و کاخ داديانی در زوگدیدی جمع می‌شود؛ هر سه در فاصلهٔ نیم‌ساعت از یکدیگرند.


    درون کلیسا تاریک است و چشم به زمان نیاز دارد. بهترین هنگام میانهٔ روزی روشن است، وقتی نور از پنجره‌های
    ساقه فرو می‌ریزد و گنبد کم‌کم خوانا می‌شود. قواعد عکاسی سخت‌گیرانه است و به‌حق: فلاش رنگدانه را از
    میان می‌برد.


    حیاط ساده است: چمن، چند سنگ قبر و برج ناقوس. شهر آرام و ولایتی است. همین تضاد است که دیدار را ماندگار
    می‌کند؛ نه صفی هست، نه گیشه‌ای، نه ازدحامی — تنها دری باز و یکی از بزرگ‌ترین فضاهای درونی قفقاز سده‌های
    میانه.
  tip: >-
    یک ساعت کافی است، هرچند هرکس به نقاشی علاقه داشته باشد بیش از آنچه برنامه ریخته اینجا می‌ماند. قواعد
    پوشش برقرار است و شال و دامن کنار در گذاشته شده. داخل تاریک است و چراغ‌قوه کمک می‌کند، اما هرگز نور
    را مستقیم به فرسک نتابانید و از فلاش استفاده نکنید. پیش از عکاسی بپرسید. کلیسا همیشه باز نیست؛ اگر
    در بسته بود در حیاط یا خانه‌های همسایه سراغ کلیددار را بگیرید. پارک خیابانی رایگان است و مغازه و کافه
    دو دقیقه فاصله دارد.
  route: >-
    از تفلیس با E60 تا سناکی، سپس به سوی زوگدیدی و از زوگدیدی به شمال شرقی تا تسالنجیخا — رویهم حدود ۳۴۵
    کیلومتر و پنج ساعت. تمام مسیر آسفالت است. بیست و پنج کیلومتر پایانی باریک می‌شود، از میان روستاها
    می‌گذرد و کند است، اما رویهٔ جاده خوب است. کلیسا در مرکز شهر و با انشعابی کوتاه از خیابان اصلی است؛
    تابلو کوچک است، پس برج ناقوس بالای بام‌ها را نشانه بگیرید. سوخت را در زوگدیدی بگیرید. خودروی اقتصادی
    تمام سال، از جمله زمستان، کافی است.
he:
  name: קתדרלת צאלנג׳יחה
  short: ציור הקיר הביזנטי המשובח בגאורגיה, מעשה ידי אמן מקונסטנטינופול, בעיירה מינגרלית קטנה.
  body: >-
    **ציור הקיר הביזנטי הטוב ביותר ששרד בגאורגיה נמצא בעיירה מינגרלית קטנה שרוב הנוסעים חולפים על פניה.**
    קתדרלת התגלות המושיע עומדת בחצר מוקפת חומה במרכז צאלנג׳יחה.


    המבנה התגבש בין המאה השתים-עשרה לארבע-עשרה: כנסייה מכופפת בעלת כיפה ותוף גבוה, מגדל פעמונים נפרד לצדה,
    וקפלה שהוסיף במאה השבע-עשרה לוואן השני דאדיאני. מבחוץ היא דומה לכנסיות מינגרליות אחרות, בנייתה לא
    אחידה ומטולאת מתיקונים חוזרים. הסיבה לבוא נמצאת בפנים.


    בשנות השמונים של המאה הארבע-עשרה הביא ואמק הראשון דאדיאני, שליט מינגרליה, צייר מקונסטנטינופול: קירוס
    מנואל אוגניקוס. הוא חתם על עבודתו בכתובת דו-לשונית ביוונית ובגאורגית על העמוד הדרומי-מערבי, וזה הופך
    אותו לאחד הציירים המעטים בעולם הביזנטי ששמם ידוע לנו בכלל.


    מה שהותיר הוא ציור פליאולוגי מאוחר מן השורה הראשונה: דמויות מוארכות, קפלים עמוקים, פנים המעוצבות מעל
    שכבת בסיס ירוקה בקווים לבנים דקים, ותוכנית איקונוגרפית ובה סצנות נדירות בכנסיות גאורגיות. הכיפה, התוף,
    האפסיס והקמרונות מכוסים כליל; בשורות התחתונות ניצבים טורי קדושים.


    שכבה שנייה נוספה במאה השבע-עשרה בימי הבישוף אודמון ג׳איאני ולוואן השני דאדיאני. היא גסה יותר וקל להבחין
    בה, ורק שברים ממנה שרדו.


    התוכנית הולכת בסדר הביזנטי של זמנה — המשיח למעלה, נביאים סביב התוף, מחזור החגים על הקמרונות, בישופים
    בקודש — אך היא מבוצעת בצפיפות יוצאת דופן, והסצנות הקטנות מצדיקות סיבוב איטי. הלחות כרסמה בקירות התחתונים
    והשימור נעשה לסירוגין: יש לוחות נקיים ובהירים ויש כאלה שעדיין אפורים מפיח.


    צאלנג׳יחה הייתה מושב בישוף, ומכאן גודלה של הכנסייה בעיירה כה קטנה. הביקור משתלב היטב ביום אחד עם סכר
    האינגורי וארמון דאדיאני בזוגדידי; שלושת המקומות במרחק חצי שעה זה מזה.


    בכנסייה חשוך והעיניים זקוקות לזמן. הרגע הטוב ביותר הוא אמצע יום בהיר, כשהאור נופל מחלונות התוף והכיפה
    נעשית קריאה בהדרגה. כללי הצילום מחמירים, ובצדק: מבזק הורס פיגמנט.


    החצר עצמה פשוטה — דשא, כמה מצבות, מגדל הפעמונים. העיירה שקטה ופרובינציאלית. הניגוד הזה הוא שנחרת בזיכרון:
    אין תור, אין קופה ואין קהל, רק דלת פתוחה ואחד הפנים הגדולים של הקווקז של ימי הביניים.
  tip: >-
    שעה מספיקה, אף שמי שמתעניין בציור יאבד כאן יותר זמן משתכנן. חלים כללי לבוש, ומטפחות וחצאיות עטיפה
    מונחות ליד הדלת. בפנים חשוך ופנס עוזר, אך לעולם אל תכוונו אור ישר אל ציורי הקיר ואל תשתמשו במבזק.
    שאלו לפני שאתם מצלמים. הכנסייה אינה פתוחה תמיד: אם הדלת נעולה, שאלו בחצר או בבתים הסמוכים מי מחזיק
    במפתח. החניה ברחוב חינם, וחנויות ובית קפה במרחק שתי דקות.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לכיוון זוגדידי, ומזוגדידי צפונה-מזרחה לצאלנג׳יחה — כ-345 ק״מ בסך
    הכול וחמש שעות. כל המסלול סלול. עשרים וחמישה הקילומטרים האחרונים מצטמצמים, עוברים בכפרים ומחייבים
    נסיעה איטית, אך המשטח סביר. הקתדרלה במרכז העיירה, בפנייה קצרה מן הרחוב הראשי, והשילוט קטן, לכן חפשו
    את מגדל הפעמונים מעל הגגות. תדלקו בזוגדידי. רכב חסכוני מספיק כל השנה, גם בחורף.
ar:
  name: كاتدرائية تسالنجيخا
  short: أجود تصوير جداري بيزنطي في جورجيا، من صنع معلم قادم من القسطنطينية، في بلدة مينغريلية صغيرة.
  body: >-
    **أفضل تصوير جداري بيزنطي باقٍ في جورجيا موجود في بلدة مينغريلية صغيرة يمر بها أكثر المسافرين دون
    توقف.** تقوم كاتدرائية تجلي المخلص في فناء مسوَّر وسط تسالنجيخا.


    تشكّل البناء بين القرنين الثاني عشر والرابع عشر: كنيسة متصالبة ذات قبة ورقبة عالية، وبرج أجراس منفصل
    إلى جانبها، ومصلى أضافه في القرن السابع عشر ليفان الثاني داديياني. تبدو من الخارج كسائر كنائس مينغريليا،
    حجارتها غير متجانسة ومرقّعة بترميمات متكررة. أما سبب المجيء فهو في الداخل.


    في ثمانينيات القرن الرابع عشر استقدم فامِك الأول داديياني حاكم مينغريليا مصوراً من القسطنطينية: كيروس
    مانويل إفغينيكوس. وقد وقّع عمله بكتابة ثنائية اللغة باليونانية والجورجية على الدعامة الجنوبية الغربية،
    وهو ما يجعله من المصورين القلائل في العالم البيزنطي الذين نعرف أسماءهم أصلاً.


    وما تركه تصوير من الطراز الأول في أواخر العصر الپالايولوغي: أشكال ممدودة، وثنيات عميقة، ووجوه مصوغة
    فوق طبقة خضراء بخطوط بيضاء رفيعة، وبرنامج أيقوني يضم مشاهد نادرة في الكنائس الجورجية. القبة والرقبة
    والحنية والأقبية مغطاة بكاملها، وفي الصفوف السفلى تقف صفوف القديسين.


    وأُضيفت طبقة ثانية في القرن السابع عشر في عهد الأسقف إفديمون جاياني وليفان الثاني داديياني. وهي أخشن
    وأسهل تمييزاً، ولم يبق منها سوى شذرات.


    يتبع البرنامج النظام البيزنطي المعهود في زمنه — المسيح في الأعلى، والأنبياء حول الرقبة، ودورة الأعياد
    على الأقبية، والأساقفة في الهيكل — غير أنه منفَّذ بكثافة غير مألوفة، والمشاهد الصغيرة تستحق جولة بطيئة.
    وقد نخرت الرطوبة الجدران السفلى وجاء الترميم متقطعاً، فبعض الألواح نظيف مضيء وبعضها ما زال رمادياً
    بالسناج.


    كانت تسالنجيخا كرسياً أسقفياً، ومن هنا اتساع الكنيسة في بلدة بهذا الصغر. وتنتظم الزيارة جيداً في يوم
    واحد مع سد إنغوري وقصر داديياني في زوغديدي؛ فالمواضع الثلاثة على بعد نصف ساعة من بعضها.


    الكنيسة معتمة وتحتاج العين إلى وقت. وأفضل لحظة منتصف نهار صافٍ حين يهبط الضوء من نوافذ الرقبة فتغدو
    القبة مقروءة شيئاً فشيئاً. وقواعد التصوير صارمة وعن حق: فالفلاش يفتك بالصباغ.


    الفناء نفسه بسيط: عشب وبضعة قبور وبرج الأجراس. والبلدة هادئة ريفية. وهذا التباين هو ما يبقى في الذاكرة:
    لا طابور ولا شباك تذاكر ولا زحام، بل باب مفتوح وواحد من أعظم الفضاءات الداخلية في قوقاز العصور الوسطى.
  tip: >-
    ساعة تكفي، وإن كان المهتم بالتصوير سيقضي هنا وقتاً أطول مما خطط له. قواعد اللباس مطبقة، والأوشحة والتنانير
    موضوعة عند الباب. الداخل معتم والمصباح اليدوي يساعد، لكن لا توجّه الضوء إلى الرسوم مباشرة ولا تستخدم
    الفلاش أبداً. اسأل قبل التصوير. والكنيسة ليست مفتوحة دائماً؛ فإن وجدت الباب مغلقاً فاسأل في الفناء
    أو في البيوت المجاورة عمن يحمل المفتاح. الوقوف في الشارع مجاني، والمتاجر والمقهى على بعد دقيقتين.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم باتجاه زوغديدي، ومن زوغديدي شمالاً شرقاً إلى تسالنجيخا — نحو
    345 كم إجمالاً وخمس ساعات. الطريق كله معبّد. الخمسة والعشرون كيلومتراً الأخيرة تضيق وتمر بالقرى وتفرض
    سرعة بطيئة، لكن سطحها مقبول. الكاتدرائية في وسط البلدة، بمنعطف قصير عن الشارع الرئيسي، واللافتة صغيرة،
    فابحث عن برج الأجراس فوق السطوح. تزوّد بالوقود في زوغديدي. والسيارة الاقتصادية كافية طوال السنة، بما
    في ذلك الشتاء.
