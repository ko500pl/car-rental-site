ka:
  name: ვაშლოვანის ეროვნული პარკი
  short: >-
    საქართველოს მშრალი სამხრეთ-აღმოსავლეთი კიდე: თიხის ხრამები, ველური ფსტის მეჩხერი ტყე და ალაზანი აზერბაიჯანის
    საზღვარზე — მხოლოდ ჯიპით.
  body: >-
    **ვაშლოვანი ის საქართველოა, რომელსაც ღია ბარათზე არავინ ბეჭდავს: წვიმისგან გალესილი ნაცრისფერი თიხის
    ქედები, ველური ფსტის იშვიათი ტყე და სიჩუმე, რომელიც აზერბაიჯანამდე გრძელდება.**


    ეს მიწა პირველად 1935 წელს დაიცვეს, აქაური იშვიათი მშრალი ტყის გადასარჩენად; 2003 წლის აპრილში ნაკრძალი
    გაფართოვდა და მის გარშემო 251 კვადრატული კილომეტრის ეროვნული პარკი შეიქმნა. დღეს ვაშლოვანის დაცულ
    ტერიტორიებში ბუნების ძეგლებიც შედის — არწივის ხეობა, ალაზნის ჭალა და ტახტი-თეფას ტალახის ვულკანები;
    ზოგან მიწა ზღვის დონიდან სულ რაღაც ასიოდე მეტრზეა.


    სახელი თითქოს ვაშლზე მიგვანიშნებს, მაგრამ გადმოცემით, ის თავად ტყის იერიდან მოდის: ერთმანეთისგან მოშორებით
    მდგარი საკმლის ხეები თავიანთი მომრგვალო ვარჯით ძველ ვაშლის ბაღს მოგაგონებს.


    გზად რას ნახავთ:


    - **ალესილები** — თიხის კლდეები, წვიმისგან ფრთებად და ნეკნებად გამოთლილი; სახელი თავისთავად ყველაფერს
    ამბობს


    - **ფანტიშარა** — ხეობა, საიდანაც მარკირებული ბილიკი დათვისხევისკენ მიდის


    - **მიჯნისყურე** — ალაზნის ნაპირი აზერბაიჯანის საზღვარზე, სადაც უდაბნოს ხშირი ჭალის ტყე ცვლის


    ცხოველთა სამყარო აქ ჩამოსვლის მეორე მიზეზია. პარკში ძუძუმწოვრების 46 სახეობა ბინადრობს — მგელი, ფოცხვერი,
    მურა დათვი, ლელიანის კატა, მაჩვზღარბა — ფრინველებისა ასზე მეტი, მათ შორის ბეგობა, სვავი და შავი ყარყატი,
    ქვეწარმავლებიდან კი გიურზა. 2003 წელს აქ ჯიქის — კავკასიური ლეოპარდის — ნაკვალევი იპოვეს, მომდევნო
    წელს კი ფოტოხაფანგმა თავად ცხოველი აღბეჭდა. ხელახლა დასახლებული ქურციკები დღეს სამუხის ველზე მრავლდებიან.


    აქ ყველაფერს სეზონი წყვეტს. გაზაფხულზე ფერდობები მწვანდება და იორდასალამი და ორქიდეები ყვავის; შუა
    ზაფხულში მიწა ხმება და ხურდება; შემოდგომის სინათლე გრძელი და რბილია. წვიმის შემდეგ კი თიხის გზები
    საათებში საპონივით სრიალა ხდება — ეს პარკის ყველაზე გულწრფელი გაფრთხილებაა.
  tip: >-
    ეს ექსპედიციაა და არა ნაშუადღევის გასეირნება. პარკში შესვლამდე დედოფლისწყაროს ვიზიტორთა ცენტრში (ბარათაშვილის
    ქ. N5) რეგისტრაცია სავალდებულოა, ამიტომ პირადობის მოწმობა ან პასპორტი თან იქონიეთ; იქვე გაიგებთ ტარიფებსა
    და უსაფრთხოების წესებს და მარშრუტსაც შეარჩევთ. ბილიკები მარკირებულია, მათ გასწვრივ ბუნგალოები, საპიკნიკე
    და საკემპინგე ადგილებია; ცეცხლი მხოლოდ გამოყოფილ ადგილას დაანთეთ. წყალი იმაზე მეტი წამოიღეთ, ვიდრე
    გგონიათ — დღეში კაცზე სამი ლიტრი მაინც — ქუდი და გრძელსახელოებიანი ტანსაცმელიც. მაღალყელიანი ფეხსაცმელი
    ჩაიცვით: აქ გიურზა ბინადრობს. მობილურ კავშირს ნუ დაეყრდნობით.
  route: >-
    თბილისიდან ს5-ით აღმოსავლეთით, საგარეჯოს გავლით იარეთ, შ40-ზე სიღნაღისკენ გადაუხვიეთ, შემდეგ შ41-ით
    ბოდბის გავლით შ39-მდე და დედოფლისწყარომდე — დაახლოებით 130 კმ ასფალტი, ორიოდე საათი. ქალაქში რეგისტრაცია
    გაიარეთ და ავზი ბოლომდე შეავსეთ: შემდეგ ბენზინგასამართის იმედი ნუ გექნებათ. დედოფლისწყაროდან სამხრეთ-აღმოსავლეთით
    შ39 ქვემო ქედისკენ კიდევ ოციოდე კილომეტრს მიდის; მერე გზა იშლება და ბოლო მონაკვეთი ალაზნამდე, მიჯნისყურემდე,
    გრუნტისა და თიხის გზაა. სულ დაახლოებით 190 კმ — გაითვალისწინეთ ოთხი საათი და ოცდაათი წუთი. აუცილებელია
    ნამდვილი, მაღალი გამავლობის ოთხწამყვანიანი ჯიპი. წვიმის შემდეგ პარკში ნუ შეხვალთ.
en:
  name: Vashlovani National Park
  short: >-
    Georgia's dry south-eastern edge: clay badlands, open pistachio woodland and the Alazani on the Azerbaijani
    border, reached only by 4x4.
  body: >-
    **Vashlovani is the Georgia nobody prints on a postcard: grey clay ridges honed by rain, open woodland
    of wild pistachio, and a silence that runs all the way to Azerbaijan.**


    The land was first protected in 1935 to save its rare arid woodland; in April 2003 the reserve was
    enlarged and a 251 km² national park created around it. Vashlovani's protected areas now also take
    in Eagle Gorge, the Alazani floodplain forest and the Takhti-Tepha mud volcanoes, and in places the
    ground lies only about 100 metres above sea level.


    The name sounds like apples (vashli), but tradition says it comes from the look of the woodland itself:
    widely spaced, round-crowned pistachio trees that resemble an old apple orchard.


    What you drive through:


    - **Alesilebi**, clay cliffs carved by rain into fins and ribs; the name means 'the sharpened ones'


    - **Pantishara**, a gorge where a marked trail sets off for Datvis Khevi, the Bear Gorge


    - **Mijniskure**, on the Alazani at the Azerbaijani border, where dense riverside forest replaces
    the desert


    Wildlife is the other reason to come. Forty-six mammal species live here, among them wolf, lynx, brown
    bear, jungle cat and porcupine, with more than a hundred kinds of bird, including imperial eagle,
    black vulture and black stork, and reptiles such as the Levantine viper. In 2003 a Caucasian leopard's
    track was found here; in 2004 a camera trap caught the animal itself. Goitered gazelles, reintroduced
    to the steppe, now breed on the Samukhi plain.


    Timing is everything. Spring brings green slopes, peonies and orchids; high summer bleaches and bakes
    the land; autumn light is long and kind. After rain the clay tracks turn slick as soap within hours,
    and that is the park's most honest warning.
  tip: >-
    This is an expedition, not an afternoon out. Registration at the visitor centre in Dedoplistskaro
    (5 Baratashvili Street) is mandatory before you enter, so bring a passport or ID; fees, safety rules
    and route advice are all handled there. Trails are marked, with bungalows, picnic spots and campsites
    along them; light fires only where permitted. Carry more water than you think, at least three litres
    per person per day, plus a hat and long sleeves. Wear boots that cover the ankle: vipers live here.
    Do not count on mobile signal.
  route: >-
    From Tbilisi take the S5 east past Sagarejo, turn onto the Sh40 for Sighnaghi, then follow the Sh41
    via Bodbe to the Sh39 and Dedoplistskaro: about 130 km of asphalt, two hours. Register at the visitor
    centre and fill the tank; do not count on fuel beyond the town. South-east of Dedoplistskaro the Sh39
    runs another 20 km or so towards Kvemo Kedi, then the road breaks up, and the last stretch to the
    Alazani at Mijniskure is dirt and clay track. Total about 190 km; allow four and a half hours. A genuine
    high-clearance 4x4 is essential. After rain, do not go in.
ru:
  name: Национальный парк Вашловани
  short: >-
    Сухой юго-восточный край Грузии: глинистые бэдленды, разреженные фисташковые леса и Алазани на границе
    с Азербайджаном — только на внедорожнике.
  body: >-
    **Вашловани — та Грузия, которую не печатают на открытках: серые глинистые гряды, отточенные дождём,
    разреженные леса дикой фисташки и тишина, что тянется до самого Азербайджана.**


    Эти земли впервые взяли под охрану в 1935 году, чтобы сохранить редкий засушливый лес; в апреле 2003
    года заповедник расширили и вокруг него создали национальный парк площадью 251 км². Охраняемые территории
    Вашловани сегодня включают также Орлиное ущелье, пойменный лес Алазани и грязевые вулканы Тахти-Тепа,
    а местами земля лежит всего в 100 метрах над уровнем моря.


    Название звучит как «яблоки» (вашли), но, по преданию, оно связано с самим видом леса: редко стоящие,
    круглокронные фисташковые деревья напоминают старый яблоневый сад.


    Через что проходит дорога:


    - **Алесилеби** — глинистые обрывы, изваянные дождём в рёбра и плавники; название означает «заточенные»


    - **Пантишара** — ущелье, откуда начинается размеченная тропа к Датвис-Хеви, Медвежьему ущелью


    - **Мижнискуре** — на Алазани у границы с Азербайджаном, где пустыню сменяет густой приречный лес


    Дикая природа — вторая причина приезжать сюда. Здесь живёт сорок шесть видов млекопитающих: волк,
    рысь, бурый медведь, камышовый кот и дикобраз, свыше ста видов птиц, включая орла-могильника, чёрного
    грифа и чёрного аиста, а также пресмыкающиеся, например гюрза. В 2003 году здесь нашли след кавказского
    леопарда, а в 2004-м фотоловушка сняла и самого зверя. Джейраны, заново выпущенные в степь, теперь
    размножаются на Самухской равнине.


    Здесь всё решает сезон. Весна приносит зелёные склоны, пионы и орхидеи; в разгар лета земля выгорает
    и раскаляется; осенний свет — долгий и мягкий. После дождя глинистые дороги за считаные часы становятся
    скользкими, как мыло, и это самое честное предупреждение парка.
  tip: >-
    Это экспедиция, а не прогулка на полдня. Регистрация в визит-центре в Дедоплисцкаро (улица Бараташвили,
    5) обязательна перед въездом — возьмите с собой паспорт или удостоверение личности; там же решаются
    вопросы платы, правил безопасности и маршрута. Тропы размечены, вдоль них есть бунгало, места для
    пикника и кемпинги; костры разводите только там, где это разрешено. Берите больше воды, чем кажется
    нужным — не менее трёх литров на человека в день, а также шляпу и одежду с длинным рукавом. Обувь
    должна закрывать лодыжку: здесь водится гюрза. На мобильную связь не рассчитывайте.
  route: >-
    Из Тбилиси езжайте по S5 на восток мимо Сагареджо, поверните на Sh40 к Сигнахи, затем следуйте по
    Sh41 через Бодбе на Sh39 к Дедоплисцкаро: около 130 км асфальта, два часа. Зарегистрируйтесь в визит-центре
    и заправьтесь: за городом на бензин не рассчитывайте. К юго-востоку от Дедоплисцкаро Sh39 тянется
    ещё около 20 км к Квемо-Кеди, затем асфальт кончается, и последний участок к Алазани у Мижнискуре
    — грунтовая и глинистая дорога. Всего около 190 км; закладывайте четыре с половиной часа. Настоящий
    полноприводный внедорожник с высоким клиренсом обязателен. После дождя не выезжайте.
fa:
  name: پارک ملی واشلووانی
  short: >-
    کرانهٔ خشک جنوب‌شرقی گرجستان: زمین‌های بدلندی رسی، بیشه‌زار باز پسته وحشی و رود آلازانی بر مرز آذربایجان،
    تنها با خودروی ۴×۴ در دسترس.
  body: >-
    **واشلووانی گرجستانی است که هیچ کارت‌پستالی از آن چاپ نمی‌شود: تیغه‌های خاکستری رسی که باران تراشیده،
    بیشه‌زار باز پسته وحشی، و سکوتی که تا آذربایجان ادامه دارد.**


    این سرزمین نخستین بار در سال ۱۹۳۵ برای حفظ بیشه‌زار کمیاب و خشکش حفاظت شد؛ در آوریل ۲۰۰۳ ذخیره‌گاه
    گسترش یافت و پارک ملی‌ای به مساحت ۲۵۱ کیلومتر مربع پیرامون آن پدید آمد. مناطق حفاظت‌شدهٔ واشلووانی
    امروز تنگهٔ عقاب، جنگل سیلابی آلازانی و آتشفشان‌های گِلی تاختی-تِپا را نیز در بر می‌گیرد، و در جاهایی
    زمین تنها حدود ۱۰۰ متر بالاتر از سطح دریاست.


    نام آن یادآور سیب (واشلی) است، اما به روایتی از ظاهر خود بیشه‌زار می‌آید: درختان پستهٔ دور از هم و
    گردتاج که به باغ سیب کهنه‌ای شباهت دارند.


    آنچه در مسیر می‌بینید:


    - **آلِسیلِبی**، صخره‌های رسی که باران آن‌ها را به تیغه و دنده تراشیده؛ نامش به معنای «تیزشده‌ها»
    است


    - **پانتیشارا**، تنگه‌ای که از آن مسیری نشانه‌گذاری‌شده به سوی داتویس‌خِوی، تنگهٔ خرس، آغاز می‌شود


    - **میژنیسکوره**، بر آلازانی در مرز آذربایجان، جایی که جنگل انبوه کناررود جای بیابان را می‌گیرد


    حیات وحش دلیل دیگر آمدن به این‌جاست. چهل و شش گونهٔ پستاندار، از جمله گرگ، سیاه‌گوش، خرس قهوه‌ای،
    گربهٔ جنگلی و تشی، در کنار بیش از صد گونهٔ پرنده از جمله عقاب شاهی، کرکس سیاه و لک‌لک سیاه، و خزندگانی
    چون گرزه‌مار (افعی لِوانتی)، در این‌جا زیست می‌کنند. در سال ۲۰۰۳ ردپای یک پلنگ قفقازی در این‌جا یافت
    شد؛ در ۲۰۰۴ دوربین تله‌ای خود حیوان را ثبت کرد. غزال‌های ایرانی که به این استپ بازگردانده شده‌اند،
    اکنون در دشت ساموخی زاد و ولد می‌کنند.


    این‌جا همه‌چیز به فصل بستگی دارد. بهار دامنه‌های سبز، گل‌های صدتومانی (پیونی) و ارکیده می‌آورد؛ اوج
    تابستان زمین را می‌سوزاند و می‌خشکاند؛ نور پاییز طولانی و ملایم است. پس از باران، جاده‌های رسی در
    عرض چند ساعت لیز می‌شوند، همچون صابون، و این صادق‌ترین هشدار پارک است.
  tip: >-
    این یک اکسپدیشن است، نه یک گردش بعدازظهری. ثبت‌نام در مرکز بازدیدکنندگان در ددوپلیستسکارو (خیابان
    باراتاشویلی، پلاک ۵) پیش از ورود الزامی است، پس گذرنامه یا کارت شناسایی همراه داشته باشید؛ هزینه‌ها،
    قوانین امنیتی و راهنمایی مسیر همگی آن‌جا روشن می‌شود. مسیرها علامت‌گذاری شده‌اند، با اقامتگاه‌های
    چوبی، محل‌های پیک‌نیک و اردوگاه در طول آن‌ها؛ آتش را تنها جایی که اجازه دارید روشن کنید. آب بیشتر
    از آنچه گمان می‌کنید همراه ببرید، دست‌کم سه لیتر برای هر نفر در روز، به همراه کلاه و آستین‌بلند. کفشی
    بپوشید که مچ پا را بپوشاند: افعی‌ها این‌جا زندگی می‌کنند. روی آنتن تلفن همراه حساب نکنید.
  route: >-
    از تفلیس مسیر S5 را به‌سوی شرق بگیرید و از ساگارِجو بگذرید، به راه Sh40 به‌سوی سیغناغی بپیچید، سپس
    از Sh41 از راه بودبه به Sh39 و ددوپلیستسکارو برسید: حدود ۱۳۰ کیلومتر آسفالت، دو ساعت. در مرکز بازدیدکنندگان
    ثبت‌نام کنید و باک را پر کنید؛ پس از شهر روی سوخت حساب نکنید. جنوب‌شرقی ددوپلیستسکارو، Sh39 حدود ۲۰
    کیلومتر دیگر به‌سوی کوِمو کِدی ادامه می‌یابد، سپس آسفالت تمام می‌شود، و آخرین بخش مسیر تا آلازانی
    در میژنیسکوره خاکی و رسی است. مسافت کل حدود ۱۹۰ کیلومتر؛ چهار ساعت و نیم زمان بگذارید. خودروی ۴×۴
    واقعی با فاصلهٔ زیاد از زمین ضروری است. پس از باران، به راه نیفتید.
he:
  name: הגן הלאומי ואשלובני
  short: >-
    הקצה היבש של דרום־מזרח גאורגיה: מדבר חרסית, יער פתוח של פיסטוק בר ונהר האלזני על גבול אזרבייג'ן, נגיש
    רק ברכב שטח.
  body: >-
    **ואשלובני היא גאורגיה שאף אחד לא מדפיס על גלויה: רכסי חרסית אפורים שהגשם ליטש, יער פתוח של פיסטוק
    בר, ודממה שנמשכת עד אזרבייג'ן.**


    השטח הוגן לראשונה ב-1935 להצלת היער היובשני הנדיר שבו; באפריל 2003 הורחבה השמורה והוקם סביבה גן לאומי
    בשטח 251 קמ"ר. השטחים המוגנים של ואשלובני כוללים כיום גם את ערוץ הנשרים, יער מישור ההצפה של האלזני
    והרי הגעש הבוציים של טחתי-טפה, ובמקומות מסוימים הקרקע שוכנת רק כ-100 מטרים מעל פני הים.


    השם נשמע כמו "תפוחים" (ואשלי), אך המסורת אומרת שהוא נובע ממראה היער עצמו: עצי פיסטוק מרוחקים זה מזה,
    בעלי צמרת עגולה, המזכירים מטע תפוחים ישן.


    מה תראו בדרך:


    - **אלסילבי**, מצוקי חרסית שהגשם גילף לסנפירים ולצלעות; השם פירושו "המחודדים"


    - **פנטישרה**, ערוץ שממנו יוצא שביל מסומן לעבר דטביס-חווי, ערוץ הדוב


    - **מיז'ניסקורה**, על האלזני בגבול אזרבייג'ן, שם יער נהר צפוף מחליף את המדבר


    חיות הבר הן הסיבה האחרת לבוא. ארבעים ושישה מיני יונקים חיים כאן, בהם זאב, שונר, דוב חום, חתול ביצות
    ודורבן, יחד עם למעלה ממאה מיני ציפורים, כולל עיט שמש, עוזנייה שחורה וחסידה שחורה, וזוחלים כגון האפעה
    הלבנטינית. ב-2003 נמצאו כאן עקבות של נמר קווקזי; ב-2004 תיעדה מצלמת מלכודת את החיה עצמה. צבאים פרסיים,
    שהוחזרו לערבה, מתרבים כיום במישור סמוחי.


    כאן העונה קובעת הכול. האביב מביא מדרונות ירוקים, אדמונית וסחלבים; בשיא הקיץ הקרקע מלבינה ונצלית; אור
    הסתיו ארוך ונעים. לאחר גשם, שבילי החרסית הופכים חלקלקים כסבון בתוך שעות ספורות, וזו האזהרה הכנה ביותר
    של הגן.
  tip: >-
    זו משלחת, לא בילוי של אחר הצהריים. הרשמה במרכז המבקרים בדדופליסצקרו (רחוב ברתשווילי 5) חובה לפני הכניסה,
    אז הביאו דרכון או תעודת זהות; דמי כניסה, כללי בטיחות וייעוץ מסלול מתבררים שם. השבילים מסומנים, עם
    בונגלואים, אתרי פיקניק ואתרי קמפינג לאורכם; הדליקו מדורות רק במקום המותר. הביאו יותר מים ממה שנראה
    לכם נחוץ, לפחות שלושה ליטרים לאדם ליום, וגם כובע וחולצות עם שרוול ארוך. נעלו נעליים המכסות את הקרסול:
    יש כאן צפעים. אל תסמכו על קליטה סלולרית.
  route: >-
    מטביליסי קחו את כביש S5 מזרחה מעבר לסאגארג'ו, פנו לכביש Sh40 לעבר סיגנאגי, ואז המשיכו בכביש Sh41 דרך
    בודבה לכביש Sh39 ולדדופליסצקרו: כ-130 ק"מ אספלט, שעתיים. הירשמו במרכז המבקרים ומלאו דלק; אל תסמכו
    על תדלוק מעבר לעיר. מדרום־מזרח לדדופליסצקרו, כביש Sh39 נמשך עוד כ-20 ק"מ לעבר קוומו קדי, ואז האספלט
    מתפרק, והקטע האחרון לעבר האלזני במיז'ניסקורה הוא דרך עפר וחרסית. בסך הכול כ-190 ק"מ; הקצו ארבע וחצי
    שעות. רכב שטח אמיתי עם מרווח גחון גבוה הוא הכרחי. לאחר גשם, אל תיסעו.
ar:
  name: منتزه فاشلوفاني الوطني
  short: >-
    الحافة الجافة لجنوب شرق جورجيا: أراضٍ طينية وعرة، وغابات فستق برية مفتوحة، ونهر ألازاني على الحدود
    الأذربيجانية، لا يُبلغ إلا بسيارة دفع رباعي.
  body: >-
    **فاشلوفاني هي جورجيا التي لا يطبعها أحد على بطاقة بريدية: نتوءات طينية رمادية نحتها المطر، وغابات
    فستق بري مفتوحة، وصمت يمتد حتى أذربيجان.**


    حُميت هذه الأرض لأول مرة عام 1935 لصون غابتها الجافة النادرة؛ وفي أبريل 2003 وُسّع المحمى وأُنشئ حوله
    منتزه وطني تبلغ مساحته 251 كيلومترًا مربعًا. تضم مناطق فاشلوفاني المحمية اليوم أيضًا وادي النسور،
    وغابة الفيضان على ألازاني، وبراكين تاختي-تيبا الطينية، وفي بعض المواقع لا يتجاوز ارتفاع الأرض فوق
    سطح البحر 100 متر تقريبًا.


    يبدو الاسم كأنه يعني التفاح (فاشلي)، لكن التقليد يقول إنه مستوحى من شكل الغابة نفسها: أشجار فستق متباعدة،
    مستديرة التاج، تشبه بستان تفاح قديمًا.


    ما تعبره في الطريق:


    - **أليسيليبي**، منحدرات طينية نحتها المطر إلى زعانف وأضلاع؛ ومعنى الاسم «المسنونة»


    - **بانتيشارا**، واد ينطلق منه مسار مُعلَّم نحو داتفيس خيفي، وادي الدب


    - **ميجنيسكوره**، على ألازاني عند الحدود الأذربيجانية، حيث تحلّ غابة نهرية كثيفة محل الصحراء


    الحياة البرية سبب آخر للمجيء. يعيش هنا ستة وأربعون نوعًا من الثدييات، منها الذئب والوشق والدب البني
    وقط المستنقعات والنيص، إلى جانب أكثر من مئة نوع من الطيور، منها العقاب الملكي والنسر الأسود واللقلق
    الأسود، وزواحف مثل الأفعى اللفانتية. في عام 2003 عُثر هنا على أثر قدم لنمر قوقازي؛ وفي 2004 التقطت
    كاميرا فخّية صورة الحيوان نفسه. وغزلان الريم، التي أُعيد توطينها في السهب، تتكاثر الآن في سهل ساموخي.


    هنا يحسم الموسمُ كل شيء. يجلب الربيع منحدرات خضراء والفاوانيا والأوركيد؛ ويحرق منتصف الصيف الأرض ويجفّفها؛
    وضوء الخريف طويل ولطيف. بعد المطر، تصبح المسارات الطينية زلقة كالصابون في غضون ساعات، وهذا أصدق تحذير
    يقدّمه المنتزه.
  tip: >-
    هذه رحلة استكشافية، لا نزهة بعد الظهر. التسجيل في مركز الزوار في ديدوبليستسكارو (شارع براتاشفيلي رقم
    5) إلزامي قبل الدخول، فاحمل جواز سفر أو بطاقة هوية؛ تُحسم الرسوم وقواعد السلامة ونصائح المسار هناك.
    المسارات مُعلَّمة، وتتوفر عليها أكواخ ومواقع نزهات ومخيمات؛ لا تُشعل النار إلا حيث يُسمح بذلك. احمل
    ماءً أكثر مما تظنه كافيًا، ثلاثة لترات على الأقل للشخص يوميًا، وقبعة وأكمامًا طويلة. انتعل حذاءً يغطي
    الكاحل: تعيش هنا الأفاعي السامة. لا تعتمد على تغطية الهاتف المحمول.
  route: >-
    من تبليسي، خذ الطريق S5 شرقًا متجاوزًا ساغاريجو، وانحرف إلى الطريق Sh40 نحو سيغناغي، ثم اتبع Sh41
    عبر بودبي إلى Sh39 وديدوبليستسكارو: نحو 130 كم من الأسفلت، ساعتان. سجّل في مركز الزوار واملأ خزان
    الوقود؛ لا تعتمد على وجود وقود بعد البلدة. جنوب شرق ديدوبليستسكارو يمتد طريق Sh39 نحو 20 كم أخرى نحو
    كفيمو كيدي، ثم ينقطع الأسفلت، ويصبح الجزء الأخير نحو ألازاني عند ميجنيسكوره مسارًا تُرابيًا وطينيًا.
    المسافة الإجمالية نحو 190 كم؛ خصص أربع ساعات ونصف. سيارة دفع رباعي حقيقية بارتفاع كافٍ عن الأرض ضرورية.
    بعد المطر، لا تذهب.
