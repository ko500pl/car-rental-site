ka:
  name: ვაშლოვანის ეროვნული პარკი
  short: >-
    საქართველოს ყველაზე მშრალი და უცხო კუთხე — ნახევრადუდაბნო, თიხის კანიონები და ფისტას ტყე აზერბაიჯანის
    საზღვართან.
  body: >-
    **ვაშლოვანი იმ საქართველოს გვიჩვენებს, რომელსაც ღია ბარათებზე ვერ ნახავ.** დედოფლისწყაროდან სამხრეთით
    მინდვრები თანდათან ქრება და იწყება ნახევრადუდაბნო: ნაცრისფერი თიხის ბორცვები, მარილიანი ხრამები და
    გაფანტული, დაბალი ხეები.


    ტერიტორია 1935 წლიდან ინახება, ეროვნული პარკის სტატუსი კი 2003 წელს მიიღო. მთავარი ღირებულება იშვიათი
    მშრალი ტყეა — ველური ფისტა და ღვია, რომელიც სხვაგან საქართველოში ასეთ მასშტაბში აღარ შემორჩა. სახელი
    "ვაშლოვანი" ველური ვაშლის ხეებიდან მოდის, რომლებიც ხეობებში იზრდება.


    რასაც რეალურად ნახავ:


    - **ალესილები** — თიხის ბედლენდები, სადაც წვიმამ ფერდობები ვიწრო ქედებად და კბილებად გამოკვეთა


    - **არწივის ხეობა** — კლდოვანი კანიონი ბუდობის კედლებით, სადაც სვავები და ორბები ტრიალებენ


    - **ფანტიშარა** — მთავარი ბანაკის ადგილი მდინარის კალაპოტში, ჭაბურღილითა და რეინჯერების სახლით


    - **მიჯნისყურე** — ალაზნის ნაპირი აზერბაიჯანის საზღვართან, ტუგაის ტყით


    ცხოველთა სია არაჩვეულებრივია: ზოლიანი აფთარი, მგელი, ფოცხვერი, გარეული ღორი, კუ, ხმელთაშუაზღვური გველგესლები
    და თითქმის ყველა სვავი, რომელიც კავკასიაში გვხვდება. გაზაფხულზე ჯეირანიც ჩნდება — ის აქ ხელახლა ჩაასახლეს.


    სეზონი მკაცრად კარნახობს, რას ნახავ. აპრილი და მაისი მწვანეა, ყვავილებით; ივლისსა და აგვისტოში ტემპერატურა
    40 გრადუსს აჭარბებს და ლანდშაფტი მოთეთრო-ყვითელი ხდება; ოქტომბერი კვლავ სასიამოვნოა. წვიმის შემდეგ
    თიხის გზები საათებში გაუვალი ხდება — ეს არ არის გაზვიადება.
  tip: >-
    ეს ერთდღიანი გასეირნება არ არის. ნებართვა და მარშრუტის რეგისტრაცია დედოფლისწყაროს ვიზიტორთა ცენტრში
    ხდება, იქვე იხდი შესვლის საფასურს. წყალი თან უნდა გქონდეს — მინიმუმ სამი ლიტრი ადამიანზე დღეში. მზისგან
    თავშესაფარი თითქმის არსად არის, ქუდი და გრძელი ტანსაცმელი აუცილებელია. კუდიანი გველები ბილიკზე ხშირია,
    ამიტომ მაღალყელიანი ფეხსაცმელი ეცვი. მობილური კავშირი პარკის დიდ ნაწილში არ მუშაობს. ღამისთევა მხოლოდ
    დანიშნულ ბანაკებშია ნებადართული.
  route: >-
    თბილისიდან კახეთის გზით საგარეჯოსა და წნორის გავლით დედოფლისწყაროსკენ — დაახლოებით 140 კმ ასფალტი.
    ქალაქიდან სამხრეთით გზა ჯერ გრუნტდება, შემდეგ თიხის ორლიანდაგიან კოლეებში გადადის; ფანტიშარამდე კიდევ
    50 კმ და დაახლოებით ორი საათი. ეს მონაკვეთი მხოლოდ მაღალგამავლობის ავტომობილისთვისაა, დიფერენციალის
    ბლოკირებით და ნორმალური საბურავებით. საწვავი ბოლოს დედოფლისწყაროში აიღე — შიგნით არაფერია. სველ ამინდში
    საერთოდ არ შეხვიდე.
en:
  name: Vashlovani National Park
  short: >-
    The driest and strangest corner of Georgia — semi-desert, clay badlands and pistachio woodland on
    the Azerbaijani border.
  body: >-
    **Vashlovani shows you a Georgia that never appears on the postcards.** South of Dedoplistskaro the
    ploughed fields thin out, the horizon flattens, and within twenty minutes you are in semi-desert:
    grey clay hills, salt-crusted gullies and scattered low trees that look more Anatolian than Caucasian.


    The area has been protected since 1935 and became a national park in 2003. Its real value is a habitat
    that has almost vanished elsewhere in the South Caucasus — open arid woodland of wild pistachio and
    juniper, growing on slopes too dry for anything taller. The name comes from the wild apple trees that
    survive in the shaded gorges.


    What you actually go to see:


    - **The Alesilebi badlands**, where rain has carved the clay into fins, ridges and blunt teeth, and
    nothing grows at all


    - **Eagle Canyon**, a rock gorge whose ledges hold nesting griffon and Egyptian vultures


    - **Pantishara**, the main camp in a dry riverbed, with a ranger cabin, a well and enough shade to
    sit out midday


    - **Mijniskure**, on the Alazani at the Azerbaijani border, where riverine tugai forest replaces the
    desert entirely


    The wildlife list is unusual for Europe: striped hyena, wolf, lynx, wild boar, tortoises, Levantine
    vipers, and the largest concentration of vultures in Georgia. Goitered gazelle, extinct here for decades,
    has been reintroduced on the Eldari steppe and is occasionally seen.


    Season dictates everything. April and May are green and full of flowers; July and August push past
    40°C and bleach the whole landscape to bone; October is comfortable again and the light is long. After
    rain the clay tracks become genuinely impassable within an hour — this is not a caution added for
    form.
  tip: >-
    This is not a casual afternoon out. Permits and route registration are done at the visitor centre
    in Dedoplistskaro, where the entrance fee is also paid. Carry your own water, three litres per person
    per day as a minimum, because there is almost none inside. Shade is scarce, so a hat and long sleeves
    matter more than sunscreen alone. Wear boots that cover the ankle — snakes are common on the tracks.
    Mobile coverage fails across most of the park, and overnight stays are only allowed at marked camps.
  route: >-
    Take the Kakheti highway from Tbilisi through Sagarejo and Tsnori to Dedoplistskaro, about 140 km
    of asphalt in reasonable condition. South of the town the road turns to gravel and then to twin clay
    ruts; it is another 50 km and roughly two hours to Pantishara. That section needs a genuine high-clearance
    4x4 with proper tyres, not a soft crossover. Fill the tank in Dedoplistskaro, as there is no fuel,
    shop or workshop beyond it. In wet weather do not attempt the descent at all.
ru:
  name: Национальный парк Вашловани
  short: >-
    Самый сухой и непривычный угол Грузии — полупустыня, глиняные бедленды и фисташковое редколесье у
    границы с Азербайджаном.
  body: >-
    **Вашловани показывает Грузию, которой нет на открытках.** К югу от Дедоплисцкаро распаханные поля
    редеют, горизонт выравнивается, и через двадцать минут вы оказываетесь в полупустыне: серые глиняные
    холмы, солёные промоины и разбросанные низкие деревья, больше похожие на анатолийские, чем на кавказские.


    Территория охраняется с 1935 года, статус национального парка получен в 2003-м. Главная ценность —
    редколесье из дикой фисташки и можжевельника, которое почти исчезло в остальном Закавказье: оно растёт
    на склонах, слишком сухих для любого другого леса. Название происходит от диких яблонь, уцелевших
    в тенистых ущельях.


    Что здесь смотрят на самом деле:


    - **Алесилеби** — глиняные бедленды, где дожди выточили склоны в гребни, рёбра и зубцы, и не растёт
    ничего


    - **Орлиное ущелье** — скальный каньон с гнездовьями белоголовых сипов и стервятников


    - **Пантишара** — основной лагерь в сухом русле, с домиком рейнджера, колодцем и тенью, где можно
    переждать полдень


    - **Миджнискуре** — берег Алазани у азербайджанской границы, где пустыню сменяет пойменный тугайный
    лес


    Список фауны для Европы необычен: полосатая гиена, волк, рысь, кабан, черепахи, гюрза и самое большое
    в Грузии скопление грифов. Джейран, исчезнувший здесь на десятилетия, вновь выпущен на Эльдарскую
    степь и иногда попадается на глаза.


    Всё решает сезон. Апрель и май зелёные и в цветах; в июле и августе за 40 градусов, и пейзаж выцветает
    добела; октябрь снова комфортен, а свет становится длинным. После дождя глиняные колеи делаются непроезжими
    буквально за час — это не формальное предупреждение.
  tip: >-
    Это не прогулка на полдня. Разрешение и регистрация маршрута оформляются в визит-центре в Дедоплисцкаро,
    там же платят за вход. Воду везите свою — минимум три литра на человека в день, внутри её практически
    нет. Тени почти не бывает, так что шляпа и длинный рукав важнее крема. Обувь — с закрытой щиколоткой:
    змеи на тропах обычное дело. Мобильная связь на большей части парка не работает, ночёвка разрешена
    только в отмеченных лагерях.
  route: >-
    Из Тбилиси по кахетинской трассе через Сагареджо и Цнори до Дедоплисцкаро — около 140 км асфальта
    в приемлемом состоянии. Южнее города дорога переходит в грунт, а затем в две глиняные колеи; до Пантишары
    ещё 50 км и примерно два часа. Этот участок требует настоящего внедорожника с высоким клиренсом и
    нормальной резиной, а не паркетника. Заправляйтесь в Дедоплисцкаро: дальше нет ни топлива, ни магазина,
    ни мастерской. В сырую погоду спускаться вниз не стоит вовсе.
fa:
  name: پارک ملی واشلوانی
  short: خشک‌ترین و ناآشناترین گوشهٔ گرجستان — نیمه‌بیابان، تپه‌های رسی فرسوده و بیشهٔ پستهٔ وحشی در مرز
    آذربایجان.
  body: >-
    **واشلوانی گرجستانی را نشان می‌دهد که هرگز روی کارت‌پستال‌ها نمی‌آید.** جنوب ددوپلیس‌تسقارو کشتزارها
    کم‌کم تمام می‌شوند، افق صاف می‌شود و ظرف بیست دقیقه در نیمه‌بیابان هستید: تپه‌های رسی خاکستری، آبکندهای
    نمک‌زده و درختان کوتاه پراکنده که بیشتر به آناتولی می‌مانند تا به قفقاز.


    این منطقه از 1935 حفاظت شده و در 2003 پارک ملی شد. ارزش اصلی‌اش زیستگاهی است که در باقی قفقاز جنوبی
    تقریباً از میان رفته: بیشه‌زار باز و خشک از پستهٔ وحشی و اورس، بر دامنه‌هایی که برای هر درخت بلندتری
    بیش از حد خشک‌اند. نام پارک از درختان سیب وحشی می‌آید که در درّه‌های سایه‌دار مانده‌اند.


    آنچه واقعاً برای دیدنش می‌روید:


    - **آلسیله‌بی**، بدلندهای رسی که باران دامنه‌ها را به تیغه و دندانه بریده و هیچ گیاهی در آن نمی‌روید


    - **درّهٔ عقاب**، تنگه‌ای سنگی که در طاقچه‌هایش کرکس‌ها و دال‌ها لانه می‌گذارند


    - **پانتیشارا**، اردوگاه اصلی در بستر خشک رودخانه، با کلبهٔ جنگلبان، چاه و سایه‌ای برای گذراندن نیمروز


    - **میجنیس‌کوره**، کنار رود آلازانی بر مرز آذربایجان، جایی که جنگل حاشیهٔ رود جای بیابان را می‌گیرد


    فهرست جانوران برای این عرض جغرافیایی غیرعادی است: کفتار راه‌راه، گرگ، سیاه‌گوش، گراز، لاک‌پشت، افعی
    لوانت و بزرگ‌ترین تجمع لاشخور در گرجستان. آهوی گواتردار که دهه‌ها اینجا منقرض بود، دوباره در دشت الداری
    رها شده و گاه دیده می‌شود.


    فصل همه‌چیز را تعیین می‌کند. فروردین و اردیبهشت سبز و پر از گل است؛ تیر و مرداد از چهل درجه می‌گذرد
    و رنگ همه‌چیز را می‌شوید؛ مهر دوباره مطبوع است و نور کشیده. پس از باران، مسیرهای رسی ظرف یک ساعت واقعاً
    غیرقابل عبور می‌شوند.
  tip: >-
    این یک گردش نیم‌روزه نیست. مجوز و ثبت مسیر در مرکز بازدیدکنندگان ددوپلیس‌تسقارو انجام می‌شود و ورودی
    هم همان‌جا پرداخت می‌گردد. آب را خودتان ببرید، دست‌کم سه لیتر برای هر نفر در روز، چون داخل پارک تقریباً
    هیچ منبعی نیست. سایه کمیاب است، پس کلاه و آستین بلند از کرم ضدآفتاب مهم‌تر است. کفشی بپوشید که مچ
    پا را بپوشاند؛ مار روی مسیرها عادی است. آنتن موبایل در بیشتر پارک قطع است و شب‌مانی فقط در اردوگاه‌های
    مشخص مجاز است.
  route: >-
    از تفلیس بزرگراه کاختی را از ساگارجو و تسنوری تا ددوپلیس‌تسقارو بگیرید، حدود 140 کیلومتر آسفالت با
    وضعیت قابل قبول. جنوب شهر جاده به شن و سپس به دو شیار رسی تبدیل می‌شود؛ تا پانتیشارا 50 کیلومتر دیگر
    و نزدیک دو ساعت راه است. این بخش خودروی چهارچرخ‌محرک واقعی با ارتفاع مناسب و لاستیک درست می‌خواهد،
    نه کراس‌اوور شهری. باک را در ددوپلیس‌تسقارو پر کنید؛ پس از آن نه پمپ بنزین هست، نه مغازه و نه تعمیرگاه.
    در هوای بارانی اصلاً پایین نروید.
he:
  name: הפארק הלאומי וושלובני
  short: הפינה היבשה והזרה ביותר בגאורגיה — מדבר למחצה, גבעות חמר מחורצות וחורש פיסטוק על גבול אזרבייג'ן.
  body: >-
    **וושלובני מראה גאורגיה אחרת לגמרי, כזו שלא מגיעה לגלויות.** מדרום לדדופליסצקארו השדות החרושים מתדלדלים,
    האופק משתטח, ותוך עשרים דקות אתם בתוך מדבר למחצה: גבעות חמר אפורות, ערוצים בקרום מלח ועצים נמוכים
    ומפוזרים שנראים אנטוליים יותר מקווקזיים.


    השטח מוגן מאז 1935 והוכרז פארק לאומי ב-2003. הערך האמיתי שלו הוא בית גידול שנעלם כמעט לחלוטין בשאר
    דרום הקווקז: חורש פתוח וצחיח של פיסטוק בר וערער, שגדל במדרונות יבשים מכדי לשאת עץ גבוה יותר. השם בא
    מעצי התפוח הבר ששרדו בערוצים המוצלים.


    מה באמת באים לראות כאן:


    - **אלסילבי**, בדלנדס של חמר שהגשם חרץ לצלעות, רכסים ושיניים קהות, ובהם לא צומח דבר


    - **ערוץ הנשרים**, קניון סלע שבמדפיו מקננים נשרי מקרא ורחמים


    - **פנטישארה**, המחנה הראשי באפיק יבש, עם בקתת פקח, באר ומספיק צל כדי לשבת בשעות הצהריים


    - **מיג'ניסקורה**, על גדת האלאזני בגבול אזרבייג'ן, שם יער גדות מחליף את המדבר לגמרי


    רשימת החיות חריגה לאזור: צבוע מפוספס, זאב, שונר, חזיר בר, צבים, צפע לבנטיני והריכוז הגדול ביותר של
    נשרים בגאורגיה. צבי הגויטר, שנכחד כאן לפני עשרות שנים, הושב לערבת אלדארי ולעתים נראה שוב.


    העונה קובעת הכול. אפריל ומאי ירוקים ומלאי פריחה; ביולי ובאוגוסט עוברים ארבעים מעלות והנוף מתלבן; אוקטובר
    נעים שוב והאור ארוך. אחרי גשם הדרכים החמריות הופכות בלתי עבירות ממש בתוך שעה, וזו אינה אזהרה למראית
    עין.
  tip: >-
    זה לא טיול של אחר צהריים. אישור כניסה ורישום המסלול נעשים במרכז המבקרים בדדופליסצקארו, ושם גם משלמים
    את דמי הכניסה. הביאו מים משלכם, שלושה ליטר לאדם ליום לכל הפחות, כי בפנים כמעט אין. צל כמעט ואין, ולכן
    כובע ושרוול ארוך חשובים יותר מקרם הגנה לבדו. נעלו נעליים שמכסות את הקרסול, נחשים על השבילים הם עניין
    שבשגרה. קליטה סלולרית אינה עובדת ברוב הפארק, ולינה מותרת רק במחנות המסומנים.
  route: >-
    צאו מטביליסי בכביש קחתי דרך סגרג'ו וצנורי אל דדופליסצקארו, כ-140 ק״מ אספלט במצב סביר. מדרום לעיירה
    הכביש הופך לחצץ ואחר כך לשני תלמי חמר; עד פנטישארה עוד 50 ק״מ וכשעתיים נסיעה. הקטע הזה מחייב רכב שטח
    אמיתי עם מרווח גחון וצמיגים מתאימים, לא קרוסאובר עירוני. מלאו דלק בדדופליסצקארו, שכן מעבר לה אין תחנה,
    חנות או מוסך. במזג אוויר גשום עדיף לא לרדת כלל.
ar:
  name: حديقة فاشلوفاني الوطنية
  short: أكثر أركان جورجيا جفافاً وغرابة — شبه صحراء وتلال طينية متآكلة وأحراج فستق برية عند حدود أذربيجان.
  body: >-
    **تُظهر فاشلوفاني جورجيا التي لا تظهر في البطاقات البريدية.** جنوب ددوبليستسقارو تتباعد الحقول المحروثة،
    ويستوي الأفق، وخلال عشرين دقيقة تجد نفسك في شبه صحراء: تلال طينية رمادية، وأخاديد تعلوها قشرة ملحية،
    وأشجار قصيرة متفرقة أقرب إلى الأناضول منها إلى القوقاز.


    حُميت المنطقة منذ عام 1935 وصارت حديقة وطنية عام 2003. قيمتها الحقيقية موئل كاد يختفي من جنوب القوقاز
    كله: حرج جاف مفتوح من الفستق البري والعرعر ينمو على منحدرات أشد جفافاً من أن تحتمل شجراً أعلى. أما
    الاسم فمن أشجار التفاح البري الباقية في الأودية المظللة.


    وما يأتي الزائر لرؤيته فعلاً:


    - **أليسيليبي**، أراضٍ طينية وعرة نحتها المطر أضلاعاً وحوافّ وأسناناً لا ينبت فيها شيء


    - **وادي النسور**، أخدود صخري تعشش في أرففه النسور الرمادية والعُقاب المصري


    - **بانتيشارا**، المخيم الرئيسي في مجرى جاف، وفيه كوخ حارس وبئر وظل يكفي لقضاء ساعات الظهيرة


    - **ميجنيسكوري**، على ضفة نهر ألازاني عند الحدود الأذربيجانية، حيث يحل غاب النهر محل الصحراء تماماً


    وقائمة الحيوانات غير مألوفة في هذه العروض: الضبع المخطط والذئب والوشق والخنزير البري والسلاحف وأفعى
    ليبانتين، وأكبر تجمع للنسور في جورجيا. أما غزال الرمل الذي انقرض هنا عقوداً فقد أُعيد إطلاقه في سهب
    إلداري ويُرى أحياناً.


    والموسم يحدد كل شيء. نيسان وأيار أخضران مزهران؛ وتموز وآب يتجاوزان الأربعين وتبيضّ الأرض كلها؛ وتشرين
    الأول معتدل من جديد وضوءه ممتد. وبعد المطر تصير المسالك الطينية غير سالكة خلال ساعة واحدة، وهذا ليس
    تحذيراً شكلياً.
  tip: >-
    ليست هذه نزهة بعد الظهر. يُستخرج التصريح وتُسجل خطة المسار في مركز الزوار بددوبليستسقارو، وهناك تُدفع
    رسوم الدخول أيضاً. احمل ماءك معك، ثلاثة لترات للشخص يومياً على الأقل، فالداخل يكاد يخلو منه. والظل
    نادر، فالقبعة والأكمام الطويلة أهم من واقي الشمس وحده. والبس حذاءً يغطي الكاحل، فالأفاعي على المسالك
    أمر معتاد. تغطية الهاتف منقطعة في معظم الحديقة، والمبيت مسموح في المخيمات المحددة فقط.
  route: >-
    اسلك من تبليسي طريق كاخيتي عبر ساغاريجو وتسنوري إلى ددوبليستسقارو، نحو 140 كم من الإسفلت بحالة مقبولة.
    وجنوب البلدة يتحول الطريق إلى حصى ثم إلى أخدودين من الطين؛ ويبقى إلى بانتيشارا 50 كم ونحو ساعتين.
    يحتاج هذا القسم سيارة دفع رباعي حقيقية بارتفاع مناسب وإطارات ملائمة، لا سيارة عبور حضرية. املأ الخزان
    في ددوبليستسقارو، فبعدها لا وقود ولا متجر ولا ورشة. وفي الطقس الممطر لا تحاول النزول أصلاً.
