ka:
  name: შენაქო და დიკლო
  short: >-
    თუშეთის აღმოსავლეთი სოფლები გომეწრის ხეობაში, წითელსახურავიანი ეკლესიით და დაღესტნის საზღვართან მდგარი ციხით.
  body: >-
    **შენაქო და დიკლო თუშეთის აღმოსავლეთი კიდეა — იქ, სადაც გზა და საქართველო მთავრდება.** ორივე გომეწრის ხეობაშია, ომალოდან აღმოსავლეთით; შენაქომდე დაახლოებით 12 კმ-ია, დიკლომდე კიდევ რვა.


    **შენაქო** 2100 მეტრზეა და შორიდანვე ჩანს წითელი თუნუქის სახურავით — ეს წმინდა გიორგის ეკლესიაა, XIX საუკუნის. თუშეთისთვის ეს უჩვეულოა: აქ ისტორიულად ქრისტიანობა ძველ მთის სალოცავებთან — ხატებთან — თანაარსებობდა, და ეკლესია მცირე იყო. სოფელი კარგადაა შემონახული: ქვის სახლები, ხის აივნები, ვიწრო ქუჩები.


    **დიკლო** უფრო აღმოსავლეთით და დაბლაა. სოფლის ზემოთ, ერთსაათიან ციცაბო ასვლაზე, დგას დიკლოს ციხე — კლდის თხემზე აშენებული სასაზღვრო სიმაგრე, საიდანაც დაღესტნის ხეობები იშლება. 1830 წელს იგი ალყაში მოექცა და დაინგრა; ნაშთები დღემდე დგას.


    ეს არის საზღვრისპირა ზონა და ეს იგრძნობა: მესაზღვრეთა პოსტი, პირადობის შემოწმება, სიჩუმე. ტურისტი აქ დართლოსთან შედარებით ბევრად ნაკლებია.


    შენაქოს ზემოთ, ჩრდილოეთით, დგას თუშეთის უმაღლესი მწვერვალები — თებულოსმთა (4493 მ) და დიკლოსმთა. კარგ ამინდში ისინი სოფლის ცენტრიდანვე ჩანს, თოვლიანი მთელი წლის განმავლობაში.
  tip: >-
    პირადობის მოწმობა ან პასპორტი აუცილებლად თან იქონიე — საზღვრის ზონაა და შემოწმება ხდება. საოჯახო სასტუმროები ორივე სოფელშია, მაგრამ მცირე; ივნისიდან სექტემბრამდე მუშაობს. დიკლოს ციხემდე ასვლა ერთი საათია, ბილიკი ციცაბო და ქვიანია, მოაჯირები არ არის. საკვები და ნაღდი ფული თან წაიღე. ღამით სიცივეა 2100 მეტრზე. ომალოდან აქამდე გზა ვიწროა და ჯიპს მოითხოვს.
  route: >-
    გზა თბილისიდან ომალომდე ერთია: გომბორი, თელავი, ფშაველი, აბანოს უღელტეხილი — დაახლოებით ექვსნახევარი საათი და 220 კმ. ომალოდან აღმოსავლეთით შენაქომდე 12 კმ გრუნტია, დაახლოებით ორმოცი წუთი, დიკლომდე კიდევ ნახევარი საათი. სულ 235 კმ და დაახლოებით შვიდნახევარი საათი. მხოლოდ ჯიპით და მხოლოდ ივნისიდან ოქტომბრის დასაწყისამდე. საწვავი ფშაველში ბოლოა.
en:
  name: Shenako and Diklo
  short: >-
    The eastern villages of Tusheti in the Gometsari valley, with a red-roofed church and a fortress on the Dagestan border.
  body: >-
    **Shenako and Diklo are the eastern edge of Tusheti — where the road, and Georgia, run out.** Both sit in the Gometsari valley east of Omalo: Shenako about 12 km along, Diklo a further eight.


    **Shenako** stands at 2,100 m and announces itself from a distance with a red tin roof — the 19th-century church of St George. That is unusual here. Historically the Tush kept Christianity alongside older mountain shrines, the khati, and built churches rarely and small; Shenako's is the exception, and it was raised at a time when the Russian empire was actively encouraging them. The village itself is well preserved: stone houses, wooden balconies, lanes barely wide enough for a horse.


    **Diklo** lies further east and lower. Above the village, an hour of steep climbing, stands Diklo fortress, a border stronghold built along a rock crest with the Dagestani valleys falling away beyond it. It was besieged and destroyed in 1830 during the fighting in the north Caucasus, and the ruins have been left as they were.


    This is a border zone and it feels like one: a guard post, an ID check, and very little noise. Compared with Dartlo, hardly anyone comes over here, which is a large part of the appeal.


    North of Shenako rise the highest summits of Tusheti — Tebulosmta at 4,493 m and Diklosmta. In clear weather they are visible from the middle of the village, carrying snow all year.


    Between the two villages the road runs along an open hillside with the valley dropping away and nothing to interrupt the view; for a good many visitors this short stretch, rather than either settlement, is the best half hour in Tusheti. Diklo itself was burned during the 19th-century wars in the north Caucasus and rebuilt lower down the slope, which is why the fortress now stands so far above the houses.
  tip: >-
    Carry a passport or ID card; this is a border zone and checks do happen. Both villages have guesthouses, but only a handful, operating June to September. The climb to Diklo fortress takes an hour on a steep stony path with no railings, and it is not one to do in the dark. Bring food and cash; there are no shops. Nights are cold at 2,100 m even in midsummer. The road from Omalo is narrow, exposed in places and needs a 4x4.
  route: >-
    There is only one way in from Tbilisi: Gombori, Telavi, Pshaveli and the Abano Pass to Omalo, about six and a half hours and 220 km. From Omalo it is 12 km of dirt track east to Shenako, roughly forty minutes, and another half hour to Diklo. Total 235 km and around seven and a half hours. Only by 4x4, and only from June to early October. The last fuel is at Pshaveli, so plan the return leg before you set out.
ru:
  name: Шенако и Дикло
  short: >-
    Восточные сёла Тушети в долине Гомецари, с церковью под красной крышей и крепостью у дагестанской границы.
  body: >-
    **Шенако и Дикло — восточный край Тушети, там, где кончается дорога, а с ней и Грузия.** Оба села лежат в долине Гомецари восточнее Омало: до Шенако около 12 км, до Дикло ещё восемь.


    **Шенако** стоит на 2100 метрах и издали узнаётся по красной жестяной крыше — это церковь святого Георгия XIX века. Для Тушети это необычно: исторически тушины совмещали христианство со старыми горными святилищами, хати, и церкви строили редко и маленькими. Шенакская — исключение, возведённое в пору, когда Российская империя активно этому способствовала. Само село сохранилось хорошо: каменные дома, деревянные балконы, улочки шириной чуть шире лошади.


    **Дикло** лежит восточнее и ниже. Над селом, в часе крутого подъёма, стоит Диклойская крепость — пограничное укрепление на скальном гребне, за которым обрываются дагестанские ущелья. В 1830 году её осадили и разрушили во время боёв на Северном Кавказе; руины оставлены как есть.


    Это пограничная зона, и это чувствуется: пост, проверка документов и почти полная тишина. По сравнению с Дартло сюда почти никто не доезжает, и в этом немалая часть привлекательности.


    К северу от Шенако поднимаются высшие вершины Тушети — Тебулосмта (4493 м) и Диклосмта. В ясную погоду они видны прямо из центра села и держат снег круглый год.
  tip: >-
    Паспорт или удостоверение личности держите при себе: это пограничная зона, проверки бывают. Гостевые дома есть в обоих сёлах, но их единицы, работают с июня по сентябрь. Подъём к крепости Дикло занимает час по крутой каменистой тропе без перил, и в темноте туда идти не стоит. Везите еду и наличные, магазинов нет. Ночи на 2100 метрах холодные даже в разгар лета. Дорога от Омало узкая, местами открытая, нужен внедорожник.
  route: >-
    Путь из Тбилиси один: Гомбори, Телави, Пшавели и перевал Абано до Омало — около шести с половиной часов и 220 км. От Омало на восток 12 км грунтовки до Шенако, примерно сорок минут, и ещё полчаса до Дикло. Всего 235 км и порядка семи с половиной часов. Только на внедорожнике и только с июня до начала октября. Последняя заправка в Пшавели, так что обратную дорогу просчитайте заранее.
fa:
  name: شناکو و دیکلو
  short: >-
    روستاهای شرقی توشتی در درّهٔ گومتساری، با کلیسایی سرخ‌بام و قلعه‌ای بر مرز داغستان.
  body: >-
    **شناکو و دیکلو لبهٔ شرقی توشتی هستند؛ آنجا که جاده و گرجستان هر دو تمام می‌شوند.** هر دو در درّهٔ گومتساری و شرق اومالو قرار دارند: شناکو حدود دوازده کیلومتر جلوتر و دیکلو هشت کیلومتر پس از آن.


    **شناکو** در 2100 متری است و از دور با بام حلبی سرخش شناخته می‌شود؛ کلیسای قدیس گئورگی از سدهٔ نوزدهم. این در توشتی غیرعادی است. تاریخاً توشی‌ها مسیحیت را در کنار زیارتگاه‌های کهن کوهستانی نگه داشتند و کلیسا کم و کوچک می‌ساختند؛ کلیسای شناکو استثناست و در روزگاری برپا شد که امپراتوری روسیه به ساختن آنها تشویق می‌کرد. خود روستا خوب مانده است: خانه‌های سنگی، بالکن‌های چوبی و کوچه‌هایی به‌زحمت به پهنای یک اسب.


    **دیکلو** شرقی‌تر و پایین‌تر است. بالای روستا، پس از یک ساعت صعود تند، قلعهٔ دیکلو ایستاده؛ دژی مرزی بر ستیغ سنگی که پشت آن درّه‌های داغستان فرو می‌افتند. در 1830 در جریان نبردهای قفقاز شمالی محاصره و ویران شد و ویرانه‌ها همان‌گونه رها شده‌اند.


    اینجا منطقهٔ مرزی است و این حس می‌شود: پاسگاه، بررسی شناسنامه و سکوتی تقریباً کامل. در مقایسه با دارتلو کمتر کسی تا اینجا می‌آید و بخش بزرگی از جاذبه در همین است.


    شمال شناکو بلندترین قله‌های توشتی سر برمی‌آورند: تبولوسمتا با 4493 متر و دیکلوسمتا. در هوای صاف از میان روستا دیده می‌شوند و تمام سال برف دارند.
  tip: >-
    گذرنامه یا کارت شناسایی همراه داشته باشید؛ اینجا منطقهٔ مرزی است و بازرسی انجام می‌شود. هر دو روستا مهمان‌خانه دارند، اما تعدادشان انگشت‌شمار است و از خرداد تا شهریور کار می‌کنند. صعود به قلعهٔ دیکلو یک ساعت است، روی مسیری تند و سنگی و بی‌نرده، و در تاریکی رفتنی نیست. خوراک و پول نقد ببرید، مغازه‌ای نیست. شب‌ها در 2100 متری حتی در اوج تابستان سرد است. راه از اومالو باریک و جاهایی بی‌پناه است و خودروی چهارچرخ‌محرک می‌خواهد.
  route: >-
    از تفلیس تنها یک راه هست: گومبوری، تلاوی، پشاولی و گردنهٔ آبانو تا اومالو، حدود شش ساعت و نیم و 220 کیلومتر. از اومالو دوازده کیلومتر راه خاکی به شرق تا شناکو، نزدیک چهل دقیقه، و نیم ساعت دیگر تا دیکلو. جمعاً 235 کیلومتر و نزدیک هفت ساعت و نیم. تنها با خودروی چهارچرخ‌محرک و تنها از خرداد تا اوایل مهر. آخرین سوخت در پشاولی است، پس بازگشت را از پیش حساب کنید.
he:
  name: שנאקו ודיקלו
  short: >-
    כפרי המזרח של טושתי בעמק גומצארי, עם כנסייה בעלת גג אדום ומבצר על גבול דאגסטן.
  body: >-
    **שנאקו ודיקלו הן הקצה המזרחי של טושתי, שם נגמרת הדרך ואיתה גאורגיה.** שתיהן שוכנות בעמק גומצארי ממזרח לאומאלו: שנאקו כשנים עשר קילומטרים משם, ודיקלו עוד שמונה.


    **שנאקו** ניצבת בגובה 2,100 מ' ומכריזה על עצמה מרחוק בגג פח אדום — כנסיית גאורגיוס הקדוש מן המאה ה-19. זה חריג כאן. היסטורית שמרו הטושים על הנצרות לצד מקדשי הרים עתיקים, החאטי, ובנו כנסיות במשורה ובקטן; זו של שנאקו היא היוצא מן הכלל, והוקמה בתקופה שבה האימפריה הרוסית עודדה זאת. הכפר עצמו שמור היטב: בתי אבן, מרפסות עץ וסמטאות ברוחב סוס בקושי.


    **דיקלו** שוכנת מזרחה יותר ונמוך יותר. מעל הכפר, שעה של טיפוס תלול, ניצב מבצר דיקלו, מעוז גבול שנבנה לאורך רכס סלע ומעברו נופלים עמקי דאגסטן. הוא נצור ונהרס ב-1830 בעת הקרבות בצפון הקווקז, וההריסות הושארו כפי שהן.


    זהו אזור גבול וזה מורגש: עמדת שמירה, בדיקת תעודות ומעט מאוד רעש. בהשוואה לדארטלו כמעט איש אינו מגיע לכאן, וזה חלק גדול מהקסם.


    מצפון לשנאקו מתנשאות הפסגות הגבוהות של טושתי — טבולוסמטה בגובה 4,493 מ' ודיקלוסמטה. במזג אוויר צלול הן נראות ממרכז הכפר ונושאות שלג כל השנה.
  tip: >-
    שאו דרכון או תעודת זהות; זהו אזור גבול ובדיקות אכן מתקיימות. בשני הכפרים יש בתי הארחה, אך מעטים, והם פועלים מיוני עד ספטמבר. הטיפוס למבצר דיקלו אורך שעה בשביל תלול ואבני ללא מעקות, ואין לעשותו בחשכה. הביאו אוכל ומזומן, אין חנויות. הלילות בגובה 2,100 מ' קרים גם באמצע הקיץ. הדרך מאומאלו צרה, חשופה במקומות, ומחייבת רכב שטח.
  route: >-
    מטביליסי יש דרך אחת בלבד: גומבורי, טלאווי, פשאוולי ומעבר אבאנו עד אומאלו, כשש שעות וחצי ו-220 ק״מ. מאומאלו 12 ק״מ של דרך עפר מזרחה לשנאקו, כארבעים דקות, ועוד חצי שעה לדיקלו. בסך הכול 235 ק״מ וכשבע וחצי שעות. רק ברכב שטח, ורק מיוני עד תחילת אוקטובר. הדלק האחרון בפשאוולי, אז חשבו את דרך החזרה מראש.
ar:
  name: شيناكو وديكلو
  short: >-
    قريتا توشيتي الشرقيتان في وادي غوميتساري، بكنيسة حمراء السقف وقلعة على حدود داغستان.
  body: >-
    **شيناكو وديكلو هما الطرف الشرقي لتوشيتي، حيث ينتهي الطريق وتنتهي معه جورجيا.** تقعان في وادي غوميتساري شرق أومالو: شيناكو على نحو اثني عشر كيلومتراً، وديكلو على ثمانية أخرى بعدها.


    **شيناكو** على ارتفاع 2100 م وتُعرف من بعيد بسقفها الصفيحي الأحمر، وهو كنيسة القديس جيورجي من القرن التاسع عشر. وهذا غير مألوف هنا. فقد حفظ التوش تاريخياً المسيحية إلى جانب مزارات جبلية أقدم تُعرف بالخاتي، وبنوا الكنائس نادراً وصغيرة؛ وكنيسة شيناكو استثناء أُقيم في زمن كانت الإمبراطورية الروسية تشجع على ذلك. والقرية نفسها محفوظة جيداً: بيوت حجرية وشرفات خشبية وأزقة بالكاد تتسع لفرس.


    أما **ديكلو** فأبعد شرقاً وأخفض. وفوق القرية، بعد ساعة من الصعود الحاد، تقوم قلعة ديكلو، معقل حدودي بُني على حيد صخري تتهاوى خلفه أودية داغستان. حوصرت ودُمرت عام 1830 في أثناء القتال في شمال القوقاز، وتُركت أنقاضها على حالها.


    وهذه منطقة حدودية ويُحس ذلك: نقطة حراسة، وتدقيق هوية، وضجيج شبه معدوم. ومقارنة بدارتلو لا يكاد أحد يصل إلى هنا، وفي ذلك جانب كبير من جاذبيتها.


    وشمال شيناكو تنهض أعلى قمم توشيتي: تيبولوسمتا عند 4493 م وديكلوسمتا. وفي الجو الصافي تُرى من وسط القرية وتحمل الثلج طوال السنة.
  tip: >-
    احمل جواز سفر أو بطاقة هوية؛ فهذه منطقة حدودية والتدقيق يحدث فعلاً. وفي القريتين بيوت ضيافة لكنها قليلة جداً وتعمل من حزيران إلى أيلول. والصعود إلى قلعة ديكلو ساعة على درب حاد صخري بلا درابزين، ولا يُسلك في العتمة. واحمل طعاماً ونقداً، فلا متاجر. والليالي باردة على 2100 م حتى في ذروة الصيف. والطريق من أومالو ضيق ومكشوف في مواضع ويستلزم دفعاً رباعياً.
  route: >-
    من تبليسي طريق واحد لا غير: غومبوري وتيلافي وبشاولي وممر أبانو حتى أومالو، نحو ست ساعات ونصف و220 كم. ومن أومالو اثنا عشر كيلومتراً من المسلك الترابي شرقاً إلى شيناكو في نحو أربعين دقيقة، ونصف ساعة أخرى إلى ديكلو. المجموع 235 كم ونحو سبع ساعات ونصف. ولا يُسلك إلا بدفع رباعي ومن حزيران إلى أوائل تشرين الأول فقط. وآخر وقود في بشاولي، فاحسب رحلة العودة قبل الانطلاق.
