ka:
  name: შენაქო და დიკლო
  short: >-
    ორი ქვის სოფელი თუშეთის აღმოსავლეთ კიდეზე: XIX საუკუნის შეთეთრებული ეკლესია და შუა საუკუნეების ციხის
    ნანგრევები დაღესტნის საზღვრიდან რამდენიმე კილომეტრში.
  body: >-
    **შენაქოსა და დიკლოს იქით საქართველო უბრალოდ მთავრდება: მერე დაღესტნისა და ჩეჩნეთის ხეობებია, თუშეთის
    მდინარეები კი კასპიისკენ მიემართება.**


    შენაქო პირიქითის ქედის სამხრეთ კალთაზე, 2080 მეტრზე დგას, იმ ადგილის მახლობლად, სადაც პირიქითისა და
    გომეწრის (თუშეთის) ალაზნები ერთმანეთს ხვდება; საზღვრის გადაკვეთის შემდეგ მათ ერთიან ნაკადს ანდის ყოისუ
    ჰქვია, ბოლოს კი, სულაქის სახელით, კასპიის ზღვას უერთდება. სოფელი ქვის სახლებისა და ხის აივნების მჭიდრო
    კვანძია, რომელსაც დიკლოსმთა დაჰყურებს. ზამთარი სოფელს ყოველწლიურად აცარიელებს — 2024 წლის აღწერამ
    აქ მუდმივი მცხოვრები ვეღარ იპოვა. ზაფხულში ბუხრები ისევ ბოლავს.


    სოფლის აღმოსავლეთ განაპირას ეკლესია დგას — XIX საუკუნის პატარა, თავისუფალი ჯვრის ტიპის გუმბათოვანი
    ნაგებობა, ფიქლითა და კირის დუღაბით ნაშენი, შელესილი და შეთეთრებული; რვაწახნაგა ყელს თუნუქის პირამიდული
    სახურავი ახურავს. კულტურული მემკვიდრეობის რეესტრში იგი წმინდა გიორგის სახელითაა შეტანილი, სხვა წყაროები
    მას სამების ეკლესიად მოიხსენიებენ. ეკლესიის უკან სალოცავი ნიშია — ძველი მთური რწმენის ნაშთი, რომელიც
    თუშურმა ქრისტიანობამ შეისისხლხორცა და არ წაშალა.


    შენაქოს ეკრანზეც ჰქონდა თავისი წუთი: აქ და ომალოში გადაიღეს ფილმ „მიმინოს“ სოფლური სცენები. ელექტროენერგია
    კი, რომელიც 1988 წელს გადამცემი ხაზის დაზიანებამ შეწყვიტა, სოფელს მხოლოდ 2011 წელს დაუბრუნდა — ამერიკის
    შეერთებული შტატების დაფინანსებით აშენებული მცირე ჰიდროელექტროსადგურის წყალობით.


    დიკლო რამდენიმე კილომეტრით მოშორებით, დაახლოებით 2150 მეტრზე დგას, დაღესტნის საზღვრიდან ოთხ, ჩეჩნეთისგან
    კი ცხრა კილომეტრში. 2002 წელს აქ თექვსმეტი ადამიანი ცხოვრობდა, 2014 წელს — არავინ. სახლების ზემოთ
    შუა საუკუნეების ციხის ნანგრევები საზღვარს დარაჯობს. გადმოცემით, ერთხელ ამ ციხეს თექვსმეტი მეომარი
    თვრამეტი დღე იცავდა ათასობით მტრისგან.


    თექვსმეტი — ლეგენდაში, თექვსმეტი — აღწერაში: დიკლოს ყოველთვის ცოტანი იცავდნენ.
  tip: >-
    პასპორტი ან პირადობის მოწმობა აუცილებლად თან იქონიეთ: ეს სასაზღვრო ზონაა და პატრული დოკუმენტებს ამოწმებს.
    ორივე სოფელში რამდენიმე საოჯახო სასტუმროა, რომლებიც დაახლოებით ივნისიდან სექტემბრამდე მუშაობს; წინასწარ
    დაჯავშნეთ და ნაღდი ფული წაიღეთ — მაღაზია და ბანკომატი აქ არ არის. დიკლოდან ციხემდე ბილიკი ციცაბო და
    ქვიანია, მოაჯირების გარეშე: იარეთ მხოლოდ დღისით და მშრალ ამინდში. 2000 მეტრზე ღამე აგვისტოშიც ცივა.
    თუ მანქანის ომალოში დატოვება გირჩევნიათ, ომალო–შენაქო–დიკლოს ბილიკი მშვენიერი ერთდღიანი სალაშქრო მარშრუტია.
  route: >-
    თბილისიდან გომბორის უღელტეხილით (შ38) თელავამდე იარეთ, იქიდან ახმეტამდე — აქ შეავსეთ ავზი, ეს ბოლო
    საიმედო ბენზინგასამართია, — შემდეგ ალაზანს ჩრდილოეთით აუყევით ფშაველამდე: დაახლოებით 140 კილომეტრი
    ასფალტი. ფშაველიდან შ44 ხრეშიანი ხდება და დაახლოებით 70 კილომეტრზე, 2826-მეტრიანი აბანოს უღელტეხილის
    გავლით, ომალომდე მიდის — ოთხი საათი ან მეტი ვიწრო, მოაჯირებს მოკლებულ გზაზე. ომალოდან აღმოსავლეთით
    შენაქომდე დაახლოებით 7 კილომეტრი გრუნტია, იქიდან კი დიკლომდე გრძელდება. სულ დაახლოებით 220 კილომეტრი
    და შვიდი საათი მაინც. მხოლოდ მაღალი გამავლობის ავტომობილით და მხოლოდ მაშინ, როცა უღელტეხილი ღიაა —
    ჩვეულებრივ ივნისიდან ოქტომბრის შუა რიცხვებამდე, თოვლის მიხედვით.
en:
  name: Shenako and Diklo
  short: >-
    Two stone villages at the eastern edge of Tusheti: a whitewashed 19th-century church and a ruined
    fortress a few kilometres from Dagestan.
  body: >-
    **Beyond Shenako and Diklo, Georgia simply stops: further on lie the valleys of Dagestan and Chechnya,
    and the rivers of Tusheti leave for the Caspian.**


    Shenako stands at 2,080 m on the southern slope of the Pirikiti range, near the spot where the Pirikiti
    and Gometsari (Tusheti) Alazani rivers meet. Across the border their joined water becomes the Andi
    Koysu and, as the Sulak, reaches the Caspian Sea. The village is a tight knot of stone houses and
    wooden balconies, overlooked by Diklosmta. Winter empties it every year, and the 2024 census found
    no permanent residents at all; in summer the chimneys smoke again.


    On the eastern edge of the village stands the church, a small 19th-century domed building of free-cross
    plan, built of slate and lime mortar, plastered and whitewashed, its octagonal drum capped by a pyramid
    of tin. The national heritage register lists it as St George's; other sources call it Holy Trinity.
    Behind it is a sanctuary niche, a relic of the older mountain faith that Tush Christianity absorbed
    rather than erased.


    Shenako has had its moment on screen, too: village scenes of the Soviet film "Mimino" were shot here
    and in Omalo. Its electricity, cut in 1988 when a power line was damaged, returned only in 2011, from
    a small hydropower plant funded by the United States.


    Diklo lies a few kilometres further on, at about 2,150 m, four kilometres from the Dagestani border
    and nine from Chechnya. Sixteen people lived here in 2002; by 2014, none. Above the houses, the ruins
    of a medieval fortress keep watch on the frontier. Tradition says that sixteen defenders once held
    it for eighteen days against an army of thousands.


    Sixteen in the legend, sixteen in the census: Diklo has always been held by very few.
  tip: >-
    Carry a passport or ID card: this is a border zone and patrols do check. Both villages have a handful
    of family guesthouses, open roughly June to September; book ahead and bring cash, as there are no
    shops or ATMs. The path from Diklo up to the fortress is steep and stony, with no railings, so climb
    it only in daylight and dry weather. Nights at 2,000 m are cold even in August. If you would rather
    leave the car in Omalo, the trail from Omalo through Shenako to Diklo makes a fine day's walk.
  route: >-
    From Tbilisi cross the Gombori Pass (Sh38) to Telavi and continue to Akhmeta, where you should fill
    up: it is the last reliable fuel. Then follow the Alazani north to Pshaveli, about 140 km of asphalt
    in all. At Pshaveli the Sh44 turns to gravel for some 70 km over the 2,826 m Abano Pass to Omalo:
    four hours or more on a narrow road without barriers. From Omalo a dirt track runs about 7 km east
    to Shenako and on to Diklo. Reckon on some 220 km and at least seven hours. Offroad class only, and
    only while the pass is open, usually June to mid-October depending on snow.
ru:
  name: Шенако и Дикло
  short: >-
    Два каменных села на восточном краю Тушети: белёная церковь XIX века и разрушенная крепость в нескольких
    километрах от Дагестана.
  body: >-
    **За Шенако и Дикло Грузия просто заканчивается: дальше лежат долины Дагестана и Чечни, а реки Тушети
    уходят к Каспию.**


    Шенако стоит на высоте 2080 м на южном склоне Пирикитского хребта, недалеко от места, где сливаются
    реки Пирикитская и Гомецарская (Тушетская) Алазани. За границей их общий поток становится Андийским
    Койсу и под именем Сулак достигает Каспийского моря. Село — тесный узел каменных домов и деревянных
    балконов под взглядом Диклосмты. Зима каждый год опустошает его, и перепись 2024 года не нашла здесь
    ни одного постоянного жителя; летом трубы снова дымятся.


    На восточном краю села стоит церковь — небольшое купольное здание XIX века свободнокрестового плана,
    сложенное из сланца на известковом растворе, оштукатуренное и белёное, с восьмигранным барабаном под
    жестяным шатром. В государственном реестре наследия она числится церковью Святого Георгия; по другим
    данным — Святой Троицы. За ней — святилищная ниша, остаток более древней горной веры, которую тушинское
    христианство впитало, а не искоренило.


    Был у Шенако и свой миг на экране: деревенские сцены советского фильма «Мимино» снимали здесь и в
    Омало. Электричество, отключённое в 1988 году после повреждения линии, вернулось только в 2011-м,
    от небольшой ГЭС, построенной на средства США.


    Дикло лежит в нескольких километрах дальше, на высоте около 2150 м, в четырёх километрах от дагестанской
    границы и в девяти от чеченской. В 2002 году здесь жили шестнадцать человек; к 2014-му — никого. Над
    домами стоят на страже границы руины средневековой крепости. Предание говорит, что шестнадцать защитников
    держали её восемнадцать дней против многотысячного войска.


    Шестнадцать в легенде, шестнадцать в переписи: Дикло всегда держалось на очень немногих.
  tip: >-
    Возьмите с собой паспорт или удостоверение личности: это пограничная зона, и патрули действительно
    проверяют документы. В обоих сёлах есть по несколько семейных гостевых домов, открытых примерно с
    июня по сентябрь; бронируйте заранее и берите наличные — ни магазинов, ни банкоматов здесь нет. Тропа
    от Дикло вверх к крепости крутая и каменистая, без перил, так что подниматься стоит только днём и
    в сухую погоду. Ночи на высоте 2000 м холодны даже в августе. Если хотите оставить машину в Омало,
    маршрут из Омало через Шенако в Дикло — прекрасная однодневная прогулка.
  route: >-
    Из Тбилиси через Гомборский перевал (Sh38) до Телави и далее до Ахметы, где стоит заправиться: это
    последняя надёжная заправка. Затем следуйте вдоль Алазани на север до Пшавели — всего около 140 км
    асфальта. В Пшавели Sh44 переходит в гравий на протяжении около 70 км через перевал Абано (2826 м)
    до Омало: четыре часа и более по узкой дороге без ограждений. От Омало грунтовая дорога ведёт около
    7 км на восток к Шенако и далее к Дикло. Рассчитывайте примерно на 220 км и не менее семи часов. Только
    внедорожник, и только пока перевал открыт — обычно с июня до середины октября, в зависимости от снега.
fa:
  name: شناکو و دیکلو
  short: >-
    دو روستای سنگی در منتهی‌الیه شرقی توشتی: کلیسایی سپیدکاری‌شده از سده‌ی نوزدهم و دژی ویرانه چند کیلومتری
    داغستان.
  body: >-
    **پس از شناکو و دیکلو، گرجستان به‌سادگی به پایان می‌رسد: از آن پس دره‌های داغستان و چچن آغاز می‌شوند،
    و رودهای توشتی به سوی دریای خزر روانه می‌شوند.**


    شناکو در ارتفاع ۲٬۰۸۰ متری بر دامنه‌ی جنوبی رشته‌کوه پیریکیتی قرار دارد، نزدیک نقطه‌ای که رودهای پیریکیتی
    و گومتساری (توشتی) آلازانی به هم می‌رسند. آن‌سوی مرز، آب به‌هم‌پیوسته‌شان به آندی کویسو بدل می‌شود
    و به‌نام سولاک به دریای خزر می‌رسد. روستا گره‌ای تنگ از خانه‌های سنگی و بالکن‌های چوبی است، زیر نگاه
    دیکلوسمتا. زمستان هر سال آن را خالی می‌کند، و سرشماری ۲۰۲۴ هیچ ساکن دائمی‌ای در آن نیافت؛ در تابستان
    دودکش‌ها دوباره دود می‌کنند.


    در کنار شرقی روستا کلیسایی ایستاده است، بنایی کوچک گنبددار از سده‌ی نوزدهم به طرح صلیب آزاد، ساخته‌شده
    از سنگ‌لوح و ملاط آهکی، اندوده و سپیدکاری‌شده، با استوانه‌ای هشت‌ضلعی که سقفی هرمی از حلب بر فراز
    آن نشسته است. فهرست میراث ملی آن را کلیسای گئورگیِ قدیس می‌خواند؛ منابع دیگر آن را تثلیث مقدس می‌نامند.
    پشت آن طاقچه‌ای نیایشی است، بازمانده‌ای از آیین کهن‌تر کوهستانی که مسیحیت توشی آن را در خود جای داد،
    نه آنکه نابودش کند.


    شناکو لحظه‌ای هم بر پرده داشته است: صحنه‌های روستایی فیلم شوروی «میمینو» در همین‌جا و در اومالو فیلم‌برداری
    شد. برق آن، که در سال ۱۹۸۸ با آسیب‌دیدن خطی قطع شد، تنها در سال ۲۰۱۱، از نیروگاه برق‌آبی کوچکی که
    با کمک مالی ایالات متحده ساخته شد، بازگشت.


    دیکلو چند کیلومتر دورتر، در ارتفاع حدود ۲٬۱۵۰ متری، چهار کیلومتر از مرز داغستان و نه کیلومتر از چچن
    قرار دارد. در سال ۲۰۰۲ شانزده نفر در آن می‌زیستند؛ تا سال ۲۰۱۴، هیچ‌کس. بر فراز خانه‌ها، ویرانه‌های
    دژی سده‌های میانه بر مرز نگهبانی می‌دهد. روایت می‌گوید که شانزده مدافع روزی هجده روز آن را در برابر
    سپاهی هزاران‌نفره نگه داشتند.


    شانزده در افسانه، شانزده در سرشماری: دیکلو همیشه به دست شمار بسیار اندکی نگه داشته شده است.
  tip: >-
    گذرنامه یا کارت شناسایی همراه داشته باشید: این‌جا منطقه‌ای مرزی است و گشت‌ها واقعاً بازرسی می‌کنند.
    هر دو روستا چند مهمان‌خانه‌ی خانوادگی دارند که تقریباً از ژوئن تا سپتامبر بازند؛ پیشاپیش رزرو کنید
    و نقد همراه ببرید، چون نه مغازه‌ای هست و نه دستگاه خودپرداز. مسیر از دیکلو به‌سوی بالا تا دژ پرشیب
    و سنگلاخی است، بدون نرده، پس تنها در روز و هوای خشک از آن بالا بروید. شب‌ها در ارتفاع ۲٬۰۰۰ متری حتی
    در ماه اوت سرد است. اگر ترجیح می‌دهید خودرو را در اومالو بگذارید، مسیر از اومالو از میان شناکو تا
    دیکلو پیاده‌روی یک‌روزه‌ی خوبی می‌سازد.
  route: >-
    از تفلیس از گذرگاه گومبوری (Sh38) به تلاوی و سپس به آخمِتا بروید، جایی که باید باک را پر کنید: آخرین
    پمپ بنزین مطمئن. سپس از مسیر آلازانی به سوی شمال تا پشاولی ادامه دهید، جمعاً نزدیک به ۱۴۰ کیلومتر
    آسفالت. در پشاولی، جاده‌ی Sh44 به مسیری خاکی برای نزدیک به ۷۰ کیلومتر از گذرگاه آبانو (۲٬۸۲۶ متر)
    تا اومالو بدل می‌شود: چهار ساعت یا بیشتر بر جاده‌ای باریک و بدون نرده. از اومالو راهی خاکی به درازای
    حدود ۷ کیلومتر به سوی شرق به شناکو و سپس دیکلو می‌رسد. جمعاً حدود ۲۲۰ کیلومتر و دست‌کم هفت ساعت در
    نظر بگیرید. تنها با خودروی آفرود، و تنها تا زمانی که گذرگاه باز است، معمولاً از ژوئن تا میانه‌ی اکتبر،
    بسته به برف.
he:
  name: שנאקו ודיקלו
  short: 'שני כפרי אבן בקצה המזרחי של טושתי: כנסייה מסוידת מהמאה ה-19 ומצודה חרבה במרחק כמה קילומטרים
    מדגסטן.'
  body: >-
    **מעבר לשנאקו ולדיקלו, גאורגיה פשוט נגמרת: מעבר לזה משתרעים עמקי דגסטן וצ'צ'ניה, ונהרות טושתי יוצאים
    לכיוון הים הכספי.**


    שנאקו שוכן בגובה 2,080 מטר על המדרון הדרומי של רכס פיריקיטי, קרוב למקום שבו נפגשים נהרות האלזני של
    פיריקיטי ושל גומצארי (טושתי). מעבר לגבול מימיהם המאוחדים הופכים לאנדי קויסו, ובשם סולאק מגיעים לים
    הכספי. הכפר הוא מקבץ צפוף של בתי אבן ומרפסות עץ, בהשגחת דיקלוסמטה. החורף מרוקן אותו כל שנה, ומפקד
    2024 לא מצא בו תושבים קבועים בכלל; בקיץ הארובות מעלות עשן מחדש.


    בקצה המזרחי של הכפר עומדת הכנסייה, מבנה כיפה קטן מהמאה ה-19 בתכנית צלב חופשי, בנוי מצפחה ומטיט סיד,
    מטויח ומסויד, עם תוף מתומן נושא פירמידת פח. מרשם המורשת הלאומי רושם אותה ככנסיית גיאורגי הקדוש; מקורות
    אחרים קוראים לה השילוש הקדוש. מאחוריה נמצאת גומחת פולחן, שריד לאמונה ההררית העתיקה יותר שהנצרות הטושית
    קלטה ולא מחקה.


    לשנאקו היה גם רגע על המסך: סצנות הכפר של הסרט הסובייטי "מימינו" צולמו כאן ובאומאלו. החשמל בכפר, שנפסק
    ב-1988 כשקו החשמל ניזוק, חזר רק ב-2011, מתחנת כוח הידרואלקטרית קטנה שמומנה על ידי ארצות הברית.


    דיקלו שוכן כמה קילומטרים הלאה, בגובה של כ-2,150 מטר, ארבעה קילומטרים מהגבול הדגסטני ותשעה מצ'צ'ניה.
    ב-2002 חיו בו שישה עשר איש; עד 2014, אף אחד. מעל הבתים שומרות חורבות מצודה מימי הביניים על הגבול.
    המסורת מספרת כי שישה עשר מגינים החזיקו בה שמונה עשר יום בפני צבא של אלפים.


    שישה עשר באגדה, שישה עשר במפקד: דיקלו הוחזק תמיד בידי מעטים ביותר.
  tip: >-
    קחו דרכון או תעודת זהות: זה אזור גבול, והפטרולים בודקים באמת. בשני הכפרים יש כמה בתי הארחה משפחתיים,
    פתוחים בערך מיוני עד ספטמבר; הזמינו מראש והביאו מזומן, כי אין חנויות או כספומטים. השביל מדיקלו למעלה
    למצודה תלול וסלעי, בלי מעקות, כך שיש לעלות בו רק באור יום ובמזג אוויר יבש. הלילות בגובה 2,000 מטר
    קרים גם באוגוסט. אם מעדיפים להשאיר את הרכב באומאלו, המסלול מאומאלו דרך שנאקו לדיקלו מהווה טיול יום
    מצוין.
  route: >-
    מטביליסי חצו את מעבר גומבורי (Sh38) לטלאווי והמשיכו לאחמטה, שם כדאי לתדלק: זו תחנת הדלק האחרונה שאפשר
    לסמוך עליה. לאחר מכן עקבו אחר נהר אלזני צפונה לפשאוולי, כ-140 ק"מ סלולים בסך הכול. בפשאוולי כביש Sh44
    עובר לחצץ למשך כ-70 ק"מ מעל מעבר אבאנו (2,826 מטר) לאומאלו: ארבע שעות או יותר בדרך צרה בלי מעקות.
    מאומאלו שביל עפר מוביל כ-7 ק"מ מזרחה לשנאקו ומשם לדיקלו. יש לחשב כ-220 ק"מ ולפחות שבע שעות. רק רכב
    שטח, ורק כשהמעבר פתוח, בדרך כלל מיוני עד אמצע אוקטובר, בהתאם לשלג.
ar:
  name: شيناكو وديكلو
  short: >-
    قريتان حجريتان عند الطرف الشرقي لتوشيتي: كنيسة مبيَّضة من القرن التاسع عشر وقلعة متهدّمة على بعد كيلومترات
    قليلة من داغستان.
  body: >-
    **بعد شيناكو وديكلو، تتوقف جورجيا ببساطة: فيما بعدها تمتد وديان داغستان والشيشان، وتغادر أنهار توشيتي
    نحو بحر قزوين.**


    تقع شيناكو عند ارتفاع 2,080 مترًا على المنحدر الجنوبي لسلسلة بيريكيتي، قرب النقطة التي يلتقي فيها
    نهرا ألازاني بيريكيتي وألازاني غوميتساري (توشيتي). وبعد الحدود، يصبح ماؤهما المتّحد نهر أندي كويسو،
    ثم يصل، باسم سولاك، إلى بحر قزوين. والقرية عقدة متراصة من بيوت حجرية وشرفات خشبية، تحت نظر ديكلوسمتا.
    يُفرغها الشتاء كل عام، ولم يجد تعداد 2024 فيها ساكنًا دائمًا واحدًا؛ وفي الصيف تدخّن المداخن من جديد.


    وعلى الطرف الشرقي من القرية تقوم الكنيسة، مبنى صغير مقبّب من القرن التاسع عشر بتخطيط صليبي حر، مشيَّد
    من الصخر الصفحي والمونة الكلسية، مكسوّ بالملاط ومبيَّض، يعلو طبلته الثُّمانية سقف هرمي من الصفيح.
    ويسجّلها سجل التراث الوطني باسم كنيسة القديس جاورجيوس؛ وتسمّيها مصادر أخرى كنيسة الثالوث الأقدس. وخلفها
    كوّة عبادة، أثر من الإيمان الجبلي الأقدم الذي استوعبته المسيحية التوشية دون أن تمحوه.


    وكان لشيناكو لحظتها على الشاشة أيضًا: صُوّرت مشاهد القرية من الفيلم السوفيتي "ميمينو" هنا وفي أومالو.
    وقد انقطعت كهرباؤها عام 1988 بعد تضرر خط الكهرباء، ولم تعد إلا عام 2011، من محطة كهرومائية صغيرة بتمويل
    من الولايات المتحدة.


    وتقع ديكلو على بعد كيلومترات قليلة أخرى، عند ارتفاع نحو 2,150 مترًا، على أربعة كيلومترات من الحدود
    الداغستانية وتسعة من الشيشان. وكان يعيش فيها ستة عشر شخصًا عام 2002؛ وبحلول 2014، لم يبق أحد. وفوق
    البيوت، تقف أنقاض قلعة من العصور الوسطى حارسةً على الحدود. وتقول الرواية إن ستة عشر مدافعًا صمدوا
    فيها ثمانية عشر يومًا في وجه جيش من آلاف الجنود.


    ستة عشر في الأسطورة، وستة عشر في التعداد: لم تكن ديكلو أبدًا في عُهدة أكثر من قلة قليلة.
  tip: >-
    احمل جواز سفرك أو بطاقة هويتك: هذه منطقة حدودية، والدوريات تتحقق بالفعل. تضم القريتان كلتاهما بضعة
    بيوت ضيافة عائلية، مفتوحة تقريبًا من يونيو إلى سبتمبر؛ فاحجز مسبقًا واحمل نقدًا، فلا متاجر ولا صرّافات
    آلية هناك. والمسار من ديكلو صعودًا إلى القلعة وعر وحجري، بلا حواجز، فلا تصعده إلا نهارًا وفي جو جاف.
    والليالي عند 2,000 متر باردة حتى في أغسطس. وإن فضّلت ترك سيارتك في أومالو، فإن المسار من أومالو عبر
    شيناكو إلى ديكلو يشكّل نزهة نهارية رائعة.
  route: >-
    من تبليسي، اعبر ممر غومبوري (Sh38) إلى تيلافي وتابع إلى أخميتا، حيث ينبغي التزود بالوقود: فهي آخر
    محطة موثوقة. ثم اتبع نهر ألازاني شمالًا إلى بشافيلي، أي نحو 140 كم من الإسفلت إجمالًا. وفي بشافيلي
    يتحول طريق Sh44 إلى حصى لمسافة نحو 70 كم عبر ممر أبانو (2,826 مترًا) إلى أومالو: أربع ساعات أو أكثر
    على طريق ضيق بلا حواجز. ومن أومالو يمتد مسار ترابي نحو 7 كم شرقًا إلى شيناكو ثم إلى ديكلو. احسب نحو
    220 كم وسبع ساعات على الأقل. لا يصلح إلا لسيارات الدفع الرباعي، وفقط ما دام الممر مفتوحًا، غالبًا
    من يونيو إلى منتصف أكتوبر، تبعًا للثلوج.
