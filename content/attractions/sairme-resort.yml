ka:
  name: საირმის კურორტი
  short: ტყიან ხეობაში მოქცეული მინერალური წყლის კურორტი ბაღდათთან, ცხრაასორმოცდაათ მეტრზე.
  body: >
    საირმე ბაღდათის მუნიციპალიტეტში, ვიწრო და მჭიდროდ ტყიან ხეობაშია, ზღვის დონიდან დაახლოებით ცხრაასორმოცდაათ
    მეტრზე. კურორტად ის ჯერ კიდევ საბჭოთა პერიოდში ჩამოყალიბდა, 2010-იან წლებში კი მთლიანად განაახლეს
    — დღეს აქ თანამედროვე სასტუმროები, სამკურნალო კორპუსები და მოწესრიგებული ბულვარია.


    მთავარი მიზეზი, რის გამოც აქ მოდიან, **მინერალური წყლის წყაროებია**. მათი შემადგენლობა და მინერალიზაცია
    ერთმანეთისგან განსხვავდება და ტრადიციულად თითოეული სხვადასხვა ჩვენებისთვის გამოიყენება — საჭმლის მომნელებელი
    სისტემა, თირკმელები, ნივთიერებათა ცვლა. წყალი უშუალოდ პავილიონებში ისხმება და დაგემოვნება უფასოა.


    გარდა სასმელი კურსისა:


    - ტყის სასეირნო ბილიკები ხეობის გასწვრივ, მოკლედან ნახევარდღიანამდე

    - სპა და აბაზანების პროცედურები სასტუმროებში

    - ბაღდათისა და ვანის მიმართულებით მოკლე გასვლების საშუალება


    საირმეს კლიმატი ზაფხულშიც გრილია: ხეობა ვიწროა, ტყე მჭიდრო და დღის ტემპერატურა ქუთაისზე რამდენიმე
    გრადუსით დაბალია. სწორედ ამიტომ იყენებენ მას აგვისტოს სიცხისგან თავის შესაფარებლად. ეს არ არის ერთსაათიანი
    გაჩერების ადგილი — საირმეში ან ნახევარი დღე უნდა გაატარო, ან ღამე გაათიო.


    საირმის ხეობა ვიწროა და მზე აქ გვიან ამოდის, ადრე კი ჩადის — დღის რეალური სინათლე რამდენიმე საათით
    ნაკლებია, ვიდრე ბარში. ეს ბუნებრივ რიტმს კარნახობს: დილით სასეირნო ბილიკები, შუადღეს წყაროები და პროცედურები,
    საღამოს კი ბულვარი და ხეობის სიგრილე.
  tip: >
    თუ სამკურნალო კურსი გაინტერესებს, სასტუმროსთან წინასწარ დაზუსტდი — პროცედურები ჯავშნით ხდება და ცალკე
    იხდება; უბრალო დაგემოვნება კი უფასოა. ცარიელი ბოთლი თან წაიღე. ხეობაში საღამოს გრილა, ჟაკეტი ზაფხულშიც
    გამოგადგება. ბილიკებისთვის სასეირნო ფეხსაცმელი აუცილებელია. კაფეები და მაღაზიები კურორტზეა, ბანკომატი
    — ბაღდათსა და ქუთაისში, ამიტომ ნაღდი ფული წინასწარ აიღე. თუ მხოლოდ წყალი გაინტერესებს, ერთი-ორი საათიც
    კმარა, მაგრამ გზა ისე გრძელია, რომ ღამის გათევა თითქმის ყოველთვის უფრო გამართლებულია.
  route: >
    თბილისიდან E60-ით ქუთაისის მიმართულებით მიდიხარ, შემდეგ სამხრეთით უხვევ ბაღდათზე და იქიდან ხეობის
    სიღრმეში ოციოდე კილომეტრი გრძელდება — სულ დაახლოებით ორას ორმოცდათხუთმეტი კილომეტრი და ოთხი საათი.
    გზა ბოლომდე ასფალტიანია და ბოლო წლებში განახლდა, თუმცა ვიწროა და მოხვევებიანი; ზამთარში ხეობაში ყინული
    და თოვლი ხშირია. ეკონომ კლასი საკმარისია, ზამთარში კროსოვერი უფრო კომფორტული. საწვავი ქუთაისში ან
    ბაღდათში აავსე. ბაღდათის შემდეგ გზაზე მაღაზიები თითქმის აღარაა, ამიტომ საკვები წინასწარ იყიდე.
en:
  name: Sairme Resort
  short: A mineral water resort in a wooded gorge near Baghdati, at around 950 metres.
  body: >-
    Sairme lies in Baghdati municipality, in a narrow, densely wooded gorge at roughly 950 metres above
    sea level. It took shape as a resort in the Soviet period and was comprehensively rebuilt during the
    2010s; today it has modern hotels, treatment buildings and a tidy promenade.


    The reason people come is **the mineral springs**. Their composition and mineralisation differ from
    one another, and each has traditionally been used for different conditions — digestion, kidneys, metabolism.
    The water is drawn directly in the drinking pavilions and tasting it costs nothing.


    Beyond the drinking cure:


    - forest walking trails along the gorge, from short loops to half-day routes

    - spa and bath treatments at the hotels

    - short drives towards Baghdati and Vani for a change of scene


    Sairme stays cool even in summer. The gorge is tight, the forest dense, and daytime temperatures run
    several degrees below Kutaisi, which is exactly why Georgians use it to escape August heat. This is
    not a one-hour stop: either give it half a day or stay the night. Arriving, drinking a glass of water
    and driving away misses the point of the place entirely.
  tip: >-
    If you want an actual treatment course, check with a hotel in advance — procedures are booked and
    charged separately, while simply tasting the water at the pavilions is free. Bring an empty bottle.
    Evenings in the gorge are chilly and a jacket is useful even in summer. Walking shoes matter for the
    trails. Cafes and shops are on the resort itself, but ATMs are in Baghdati and Kutaisi, so draw cash
    before you arrive.
  route: >-
    From Tbilisi take the E60 towards Kutaisi, then turn south for Baghdati and continue about twenty
    kilometres up the gorge — roughly 255 km and four hours in total. The road is paved the whole way
    and has been resurfaced in recent years, but it is narrow and winding, and in winter the gorge collects
    ice and snow. An economy car is sufficient; a crossover is more comfortable in the cold months. Fill
    up in Kutaisi or Baghdati before the climb.
ru:
  name: Курорт Саирме
  short: Курорт минеральных вод в лесистом ущелье под Багдати, на высоте около 950 метров.
  body: >
    Саирме находится в Багдатском муниципалитете, в узком и густо заросшем лесом ущелье на высоте примерно
    950 метров. Как курорт он сложился ещё в советское время, а в 2010-х был полностью обновлён: сегодня
    здесь современные гостиницы, лечебные корпуса и ухоженная набережная-бульвар.


    Едут сюда прежде всего ради **минеральных источников**. Их состав и минерализация различаются, и традиционно
    каждый используют при разных показаниях — пищеварение, почки, обмен веществ. Воду набирают прямо в
    питьевых павильонах, дегустация бесплатна.


    Помимо питьевого курса:


    - лесные тропы вдоль ущелья, от коротких кругов до полудневных маршрутов

    - спа и ванные процедуры при гостиницах

    - короткие выезды в сторону Багдати и Вани


    В Саирме прохладно даже летом: ущелье тесное, лес плотный, дневная температура на несколько градусов
    ниже, чем в Кутаиси. Именно поэтому сюда уезжают от августовской жары. Это не место для часовой остановки:
    либо закладывайте полдня, либо оставайтесь на ночь. Приехать, выпить стакан воды и уехать — значит
    не понять смысла места.


    Ущелье Саирме узкое, солнце сюда приходит поздно и уходит рано: реального дневного света здесь на
    пару часов меньше, чем на равнине. Это задаёт естественный ритм — утром прогулочные тропы, днём источники
    и процедуры, вечером бульвар и прохлада ущелья.
  tip: >-
    Если нужен полноценный лечебный курс, уточните всё в гостинице заранее: процедуры бронируются и оплачиваются
    отдельно, а просто попробовать воду в павильонах можно бесплатно. Возьмите пустую бутылку. Вечером
    в ущелье прохладно, куртка пригодится даже летом. Для троп нужна обувь для ходьбы. Кафе и магазины
    есть на курорте, а банкоматы — в Багдати и Кутаиси, так что наличные снимайте заранее.
  route: >-
    Из Тбилиси по E60 в сторону Кутаиси, затем поворот на юг к Багдати и ещё около двадцати километров
    вглубь ущелья — всего примерно 255 км и четыре часа. Дорога асфальтированная на всём протяжении и
    в последние годы обновлена, но узкая и извилистая; зимой в ущелье часто лежит снег и образуется наледь.
    Достаточно машины эконом-класса, в холодные месяцы комфортнее кроссовер. Заправляйтесь в Кутаиси или
    Багдати перед подъёмом.
fa:
  name: ییلاق سایرمه
  short: ییلاق آب معدنی در دره‌ای جنگلی نزدیک باغداتی، در حدود 950 متر.
  body: >-
    سایرمه در شهرستان باغداتی قرار دارد، در دره‌ای باریک و پوشیده از جنگل انبوه در حدود 950 متری سطح دریا.
    در دورهٔ شوروی به‌عنوان ییلاق شکل گرفت و در دههٔ 2010 به‌طور کامل بازسازی شد؛ امروز هتل‌های مدرن،
    ساختمان‌های درمانی و گردشگاهی مرتب دارد.


    دلیل آمدن مردم **چشمه‌های معدنی** است. ترکیب و میزان املاح این چشمه‌ها با هم فرق دارد و هر کدام به‌طور
    سنتی برای عارضه‌ای دیگر به کار می‌رفته است — گوارش، کلیه، سوخت‌وساز. آب مستقیم در آب‌خوری‌های سرپوشیده
    برداشته می‌شود و چشیدن آن هیچ هزینه‌ای ندارد. جز نوشیدن آب، مسیرهای پیاده‌روی جنگلی در امتداد دره
    هست، از حلقه‌های کوتاه تا مسیرهای نیم‌روزه، و نیز خدمات اسپا و حمام در هتل‌ها و رانندگی‌های کوتاه
    به سوی باغداتی و وانی برای تغییر منظره.


    سایرمه حتی در تابستان خنک می‌ماند. دره تنگ است، جنگل انبوه، و دمای روز چند درجه پایین‌تر از کوتایسی
    — و دقیقاً به همین دلیل گرجی‌ها از گرمای اوت به اینجا می‌گریزند. این جایی برای توقف یک‌ساعته نیست:
    یا نیم روز به آن بدهید یا شب را بمانید. رسیدن و یک لیوان آب خوردن و راه افتادن، تمام معنای این جا
    را از دست می‌دهد.
  tip: >-
    اگر واقعاً دوره‌ای درمانی می‌خواهید، از پیش با هتل هماهنگ کنید — روش‌های درمانی جداگانه رزرو و حساب
    می‌شوند، در حالی که چشیدن ساده در آب‌خوری‌ها رایگان است. یک بطری خالی همراه بیاورید. غروب‌های دره
    خنک است و کاپشن حتی در تابستان به کار می‌آید. برای مسیرهای جنگلی کفش پیاده‌روی مهم است. کافه و مغازه
    در خود ییلاق هست، اما خودپردازها در باغداتی و کوتایسی‌اند، پس پیش از رسیدن پول نقد بگیرید.
  route: >-
    از تفلیس با E60 به سوی کوتایسی بروید، بعد رو به جنوب به سمت باغداتی بپیچید و حدود بیست کیلومتر دره
    را بالا بروید — روی هم تقریباً 255 کیلومتر و چهار ساعت. جاده در تمام مسیر آسفالت است و در سال‌های
    اخیر روکش تازه خورده، اما باریک و پرپیچ است و در زمستان یخ و برف در دره جمع می‌شود. خودروی اقتصادی
    کافی است؛ کراس‌اوور در ماه‌های سرد راحت‌تر است. پیش از شروع سربالایی، باک را در کوتایسی یا باغداتی
    پر کنید.
he:
  name: אתר הנופש סאירמה
  short: אתר מים מינרליים בערוץ מיוער ליד באגדאטי, בגובה של כ-950 מטר.
  body: >-
    סאירמה שוכנת במחוז באגדאטי, בערוץ צר ומיוער בצפיפות בגובה של כ-950 מטר מעל פני הים. היא התגבשה כאתר
    נופש בתקופה הסובייטית ונבנתה מחדש מן היסוד במהלך שנות ה-2010; היום יש בה בתי מלון מודרניים, מבני טיפול
    וטיילת מסודרת.


    הסיבה שאנשים מגיעים היא **המעיינות המינרליים**. ההרכב ורמת המינרליזציה שונים ממעיין למעיין, וכל אחד
    מהם שימש באופן מסורתי לבעיות אחרות — עיכול, כליות, חילוף חומרים. את המים שואבים ישירות בביתני השתייה,
    והטעימה אינה עולה דבר. מעבר לשתייה יש כאן שבילי הליכה ביער לאורך הערוץ, מהקפות קצרות ועד מסלולים של
    חצי יום, טיפולי ספא ומרחץ בבתי המלון, ונסיעות קצרות לכיוון באגדאטי וואני לשינוי נוף.


    סאירמה נשארת קרירה גם בקיץ. הערוץ צר, היער סמיך, והטמפרטורות ביום נמוכות בכמה מעלות מאשר בקוטאיסי
    — ובדיוק בשל כך גאורגים בורחים לכאן מחום אוגוסט. זו אינה עצירה של שעה: או שמקדישים לה חצי יום, או
    שלנים כאן. להגיע, לשתות כוס מים ולנסוע הלאה זה בדיוק לפספס את כל העניין של המקום.
  tip: >-
    אם אתם רוצים סדרת טיפולים אמיתית, בדקו מראש מול בית מלון — הטיפולים מוזמנים ומחויבים בנפרד, ואילו
    טעימת המים בביתנים היא בחינם. הביאו בקבוק ריק. הערבים בערוץ קרירים ומעיל מועיל גם בקיץ. לשבילים חשובות
    נעלי הליכה. בתי קפה וחנויות יש באתר עצמו, אבל הכספומטים נמצאים בבאגדאטי ובקוטאיסי, לכן משכו מזומן
    לפני שאתם מגיעים.
  route: >-
    מטביליסי סעו על E60 לכיוון קוטאיסי, פנו דרומה לכיוון באגדאטי והמשיכו עוד כעשרים קילומטרים במעלה הערוץ
    — כ-255 ק״מ וארבע שעות בסך הכול. הכביש סלול לכל אורכו וזכה לריבוד מחדש בשנים האחרונות, אך הוא צר ומפותל,
    ובחורף נאספים בערוץ קרח ושלג. רכב חסכוני מספיק למסלול הזה; קרוסאובר פשוט נוח יותר בחודשים הקרים. תדלקו
    בקוטאיסי או בבאגדאטי לפני העלייה.
ar:
  name: منتجع سايرمي
  short: منتجع مياه معدنية في واد مشجر قرب باغداتي، على نحو 950 متراً.
  body: >-
    تقع سايرمي في بلدية باغداتي، في واد ضيق كثيف الغابات على نحو 950 متراً فوق سطح البحر. تشكلت منتجعاً
    في العهد السوفييتي وأُعيد بناؤها بالكامل خلال عقد 2010؛ وفيها اليوم فنادق حديثة ومبانٍ علاجية وممشى
    مرتب.


    والسبب الذي يجيء الناس من أجله هو **الينابيع المعدنية**. يختلف تركيبها ودرجة تمعدنها من واحد إلى آخر،
    وقد استُعمل كل منها تقليدياً لعلة مختلفة — الهضم والكلى والاستقلاب. ويُسحب الماء مباشرة في أجنحة الشرب،
    وتذوقه لا يكلف شيئاً. وإلى جانب الشرب هناك دروب مشي في الغابة على امتداد الوادي، من حلقات قصيرة إلى
    مسارات نصف يوم، وعلاجات سبا وحمامات في الفنادق، وجولات قصيرة بالسيارة نحو باغداتي وفاني لتغيير المشهد.


    تبقى سايرمي باردة حتى في الصيف. الوادي ضيق والغابة كثيفة، وحرارة النهار أدنى بعدة درجات منها في كوتايسي
    — ولهذا بالذات يهرب إليها الجورجيون من حر أغسطس. وهذه ليست محطة لساعة واحدة: إما أن تمنحها نصف يوم
    أو أن تبيت فيها. أما أن تصل وتشرب كوب ماء وتمضي، فذلك يُفوّت مغزى المكان كله.
  tip: >-
    إن أردت برنامجاً علاجياً حقيقياً فراجع فندقاً مسبقاً — فالجلسات تُحجز وتُحاسب على حدة، بينما تذوق
    الماء في الأجنحة مجاني. احمل معك زجاجة فارغة. أمسيات الوادي باردة، والسترة مفيدة حتى في الصيف. وحذاء
    المشي مهم للدروب. المقاهي والمتاجر داخل المنتجع نفسه، لكن الصرافات في باغداتي وكوتايسي، فاسحب النقد
    قبل وصولك.
  route: >-
    من تبليسي اسلك E60 نحو كوتايسي، ثم انعطف جنوباً إلى باغداتي وواصل نحو عشرين كيلومتراً صعوداً في الوادي
    — أي نحو 255 كم وأربع ساعات إجمالاً. الطريق معبّد على امتداده وأُعيد رصفه في السنوات الأخيرة، لكنه
    ضيق ومتعرج، وفي الشتاء يتجمع الجليد والثلج في الوادي. وسيارة اقتصادية تكفي؛ والكروس أوفر أريح في الأشهر
    الباردة. املأ الخزان في كوتايسي أو باغداتي قبل الصعود.
