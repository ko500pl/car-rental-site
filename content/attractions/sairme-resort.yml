ka:
  name: საირმის კურორტი
  short: >-
    კურორტი მესხეთის ქედის სოჭნარით ჩაბნელებულ ხეობაში — სახელი ირმებს უკავშირდება, რომლებმაც მონადირეები
    მარილიან, ჟანგიან წყაროებამდე მიიყვანეს.
  body: >-
    **საირმე ირმებმა იპოვეს.** გადმოცემით, ორი ძმა დაჭრილი ირმის კვალს მისდევდა ტყეში და წყაროს წააწყდა,
    რომელიც ჟანგით გაწითლებულ ქვებზე მოედინებოდა; ირგვლივ მიწა მარილს გადაეთეთრებინა, და ირმის ჯოგები
    აქ წყლისა და მარილისთვის მოდიოდნენ. ამიტომაც უწოდეს ადგილს საირმე.


    კურორტი ბაღდათის მუნიციპალიტეტშია, მესხეთის ქედის ჩრდილოეთ კალთაზე, მდინარე წაბლარისწყლის ხეობაში,
    ზღვის დონიდან ცხრაას მეტრზე ოდნავ მაღლა, ბაღდათიდან 25 კილომეტრზე. საირმის წყლები ჩანაწერებში XIX
    საუკუნის 90-იანი წლებიდან იხსენიება; მისი ჩამოსხმა 1893 წელს დაიწყო — წყალს ცხენებით ეზიდებოდნენ ბეღელში
    და იქ ხელით ასხამდნენ. 1912 წელს ბაღდათელმა სტუდენტმა, შემდგომში ექიმმა კელენჯერაძემ, სინჯი პირველი
    ქიმიური ანალიზისთვის პეტერბურგში წაიღო. 1930-იან წლებში საირმეს კურორტის სტატუსი მიენიჭა, 1940-იან
    წლებში ბაღდათამდე საავტომობილო გზა გაიყვანეს, 1954 წელს კი ჩამოსხმის ქარხანა აშენდა.


    აქ ორი ჯიშის წყალი ამოდის: „ნარზანის“ ტიპის ნახშირმჟავა ჰიდროკარბონატული კალციუმ-ნატრიუმიანი და „ბორჯომის“
    ტიპის ჰიდროკარბონატული ნატრიუმიანი; მინერალიზაცია ლიტრზე 1,6-დან 9,5 გრამამდე მერყეობს. თუ პავილიონებში
    ორივე მოედინება, გვერდიგვერდ დააგემოვნეთ — სხვაობას ენა მაშინვე იგრძნობს.


    ხეობა ციცაბოა და ნაძვით, სოჭითა და წიფლით არის ჩაკეტილი; ქვის სანაპიროებს შორის ლოდებზე ანკარა ნაკადული
    მიჩქეფს, ზედ პატარა ხიდებია გადებული, ზემოთ კი საბჭოთა სანატორიუმის დიდი თეთრი შენობა და ახალი სასტუმროები
    დგას. აგვისტოშიც კი საშუალო ტემპერატურა მხოლოდ 17 გრადუსია. სამხრეთ-აღმოსავლეთით ტყე ბორჯომ-ხარაგაულის
    ეროვნულ პარკს ებჯინება.


    ამბობენ, მწყემსებს შეუმჩნევიათ, რომ ირმის წყაროდან სამიოდე კილომეტრში ერთ მინდორზე თოვლი არასდროს
    დებდა, მიწა კი წვიმიდან რამდენიმე წუთში შრებოდა. გამოცანა XX საუკუნეში ამოიხსნა: გეოლოგებმა მიწის
    სიღრმეში ცხელი მინერალური წყალი აღმოაჩინეს.
  tip: >-
    წყაროს პავილიონებში დაგემოვნება უფასოა — ცარიელი ბოთლი თან იქონიეთ. აბაზანებსა და სამკურნალო პროცედურებს
    სანატორიუმი და სასტუმროები ატარებენ, ცალკე ჯავშნითა და საფასურით, ამიტომ თუ სწორედ ამისთვის მიდიხართ,
    წინასწარ შეუთანხმდით. ხეობაში გრილა, საღამოობით ზაფხულშიც კი სიცივე იცის — თბილი სამოსი და ნესტიან
    ტყის ბილიკზე სავალი ფეხსაცმელი წაიღეთ. კურორტზე კაფეებიც არის და მაღაზიებიც, მაგრამ ცოტაოდენი ნაღდი
    ფული ბაღდათში ან ქუთაისში აიღეთ. გზა იმდენად გრძელია, რომ ერთი ჭიქა წყლისთვის ამოსვლას და მაშინვე
    დაბრუნებას ღამის გათევა ბევრად სჯობს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, ზესტაფონამდე იარეთ — დაახლოებით
    187 კმ. იქიდან შ54-ით 18 კილომეტრი ბაღდათამდე, შემდეგ სამხრეთით შ14-ზე გადაუხვიეთ და წაბლარისწყლის
    ხეობას 25-იოდე კილომეტრი აუყევით კურორტამდე — სულ დაახლოებით 236 კმ და ოთხი საათი. გზა ბოლომდე ასფალტიანია,
    მაგრამ ხეობის მონაკვეთი ვიწრო და კლაკნილია, ზამთარში კი ჩრდილიან ადგილებში ყინული და თოვლი დგება.
    ეკონომკლასის მანქანა საკმარისია; ნოემბრიდან მარტამდე ზამთრის საბურავები გამოიყენეთ. საწვავი ზესტაფონში
    ან ბაღდათში ჩაასხით.
en:
  name: Sairme Resort
  short: >-
    A spa town in a fir-dark gorge of the Meskheti Range, named after the deer that led hunters to its
    salty, rust-stained springs.
  body: >-
    **Sairme was found by deer.** Tradition says two brothers, following the trail of a wounded deer through
    the forest, came upon a spring running over stones stained red with rust; all around it the ground
    was white with salt, and herds of deer came there to drink and lick. So the place was called Sairme,
    the place of the deer.


    The resort lies in Baghdati municipality, in the gorge of the Tsablaristskali on the northern slope
    of the Meskheti Range, a little over 900 metres up and some 25 kilometres beyond Baghdati. The waters
    appear in records from the 1890s, and bottling began in 1893, when the water was carried by horse
    to a barn and filled by hand. In 1912 a young man from Baghdati, later Doctor Kelenjeradze, took a
    sample to St Petersburg for the first chemical analysis. Resort status followed in the 1930s, a road
    to Baghdati in the 1940s, and a bottling plant in 1954.


    Two families of water rise here: a Narzan-type calcium–sodium bicarbonate water and a Borjomi-type
    sodium bicarbonate water, with mineralisation ranging from 1.6 to 9.5 grams per litre. If the pavilions
    offer both, taste them side by side and the difference is plain on the tongue.


    The gorge is steep and closed in by fir, spruce and beech; a clear stream runs over boulders between
    stone embankments, crossed by footbridges, under a large white Soviet sanatorium and the newer hotels.
    Even in August the average is only 17 °C. To the south-east the forest runs on into Borjomi–Kharagauli
    National Park.


    Shepherds, the story goes, once noticed a glade about three kilometres from the deer spring where
    snow never settled and the earth dried minutes after rain. The riddle was solved in the twentieth
    century: geologists found hot mineral water beneath it.
  tip: >-
    Tasting at the spring pavilions is free — bring an empty bottle. Baths and treatments are run by the
    sanatorium and hotels, and are booked and paid for separately, so arrange them in advance if that
    is why you are coming. The gorge is cool and evenings can be chilly even in summer; pack a warm layer
    and shoes that can handle wet forest paths. There are cafés and shops at the resort, but bring some
    cash from Baghdati or Kutaisi. The drive is long enough that an overnight stay makes far more sense
    than a quick glass of water and a turn back.
  route: >-
    From Tbilisi follow the S1 (E60) west past Gori and Khashuri to Zestaponi, about 187 km. There take
    the Sh54 for 18 km to Baghdati, then turn south onto the Sh14 and follow it about 25 km up the Tsablaristskali
    gorge to the resort — roughly 236 km and four hours in total. The road is asphalt all the way, but
    the gorge section is narrow and twisting, and in winter it can hold ice and snow in the shade. An
    economy car is sufficient; fit winter tyres from November to March. Fill up in Zestaponi or Baghdati.
ru:
  name: Курорт Саирме
  short: >-
    Курортный посёлок в затемнённом пихтами ущелье Месхетского хребта, названный в честь оленей, которые
    вывели охотников к его солёным, ржаво-рыжим источникам.
  body: >-
    **Саирме нашли олени.** Предание гласит: два брата, идя по следу раненого оленя через лес, вышли к
    источнику, бегущему по камням, окрашенным ржавчиной в красный цвет; вся земля вокруг была белой от
    соли, и стада оленей приходили сюда пить воду и лизать соль. Так место назвали Саирме — «место оленя».


    Курорт стоит в муниципалитете Багдати, в ущелье реки Цабларисцкали на северном склоне Месхетского
    хребта, чуть выше 900 метров, примерно в 25 километрах от Багдати. Первые упоминания о водах появляются
    в записях 1890-х годов, а разлив по бутылкам начался в 1893 году, когда воду возили на лошадях в сарай
    и разливали вручную. В 1912 году молодой человек из Багдати, впоследствии доктор Келенджерадзе, отвёз
    образец в Петербург для первого химического анализа. Статус курорта Саирме получило в 1930-х, дорогу
    до Багдати проложили в 1940-х, а завод по разливу построили в 1954 году.


    Здесь выходят на поверхность две группы вод: гидрокарбонатная кальциево-натриевая вода типа «Нарзан»
    и гидрокарбонатная натриевая вода типа «Боржоми», с минерализацией от 1,6 до 9,5 грамма на литр. Если
    в павильонах есть обе, попробуйте их одну за другой — разница на языке ощущается сразу.


    Ущелье крутое, стиснутое пихтовым, еловым и буковым лесом; чистый ручей течёт по валунам между каменными
    набережными, через него переброшены пешеходные мостики, а выше стоят большой белый советский санаторий
    и новые гостиницы. Даже в августе средняя температура здесь всего 17 °C. К юго-востоку лес переходит
    в Национальный парк Боржоми-Харагаули.


    Рассказывают, что пастухи когда-то заметили поляну примерно в трёх километрах от оленьего источника,
    где никогда не задерживался снег, а земля высыхала через несколько минут после дождя. Загадку разгадали
    в XX веке: геологи нашли под ней горячую минеральную воду.
  tip: >-
    Дегустация у павильонов бесплатна — возьмите с собой пустую бутылку. Ванны и процедуры проводят санаторий
    и гостиницы, их бронируют и оплачивают отдельно, так что если вы едете именно за этим, договоритесь
    заранее. В ущелье прохладно, вечерами свежо даже летом — возьмите тёплую вещь и обувь, пригодную для
    влажных лесных троп. На курорте есть кафе и магазины, но немного наличных стоит взять в Багдати или
    Кутаиси. Дорога достаточно длинная, чтобы ночёвка была куда разумнее, чем стакан воды и разворот обратно.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад, через Гори и Хашури, до Зестафони — около 187 км. Оттуда по
    Sh54 18 км до Багдати, затем поверните на юг на Sh14 и поднимайтесь по ущелью Цабларисцкали примерно
    25 км до курорта — всего около 236 км и четыре часа. Дорога полностью асфальтирована, но участок в
    ущелье узкий и извилистый, а зимой в тени может держаться лёд и снег. Машины эконом-класса достаточно;
    с ноября по март ставьте зимние шины. Заправьтесь в Зестафони или Багдати.
fa:
  name: تفرجگاه آب‌معدنی سائیرمه
  short: >-
    شهرکی درمانی در دره‌ای تیره از جنگل نراد بر رشته‌کوه مسخِتی، که به‌نام گوزن‌هایی خوانده شد که شکارچیان
    را به چشمه‌های نمکین و زنگ‌زده‌اش رهنمون شدند.
  body: >-
    **سائیرمه را گوزن‌ها یافتند.** روایت است که دو برادر که رد گوزنی زخمی را در جنگل دنبال می‌کردند، به
    چشمه‌ای رسیدند که بر سنگ‌هایی سرخ‌شده از زنگ می‌جوشید؛ زمین در پیرامون آن از نمک سپید بود، و گله‌های
    گوزن برای نوشیدن و لیسیدن نمک به آن می‌آمدند. از این‌رو، این مکان را سائیرمه، یعنی «جای گوزن»، نامیدند.


    این تفرجگاه در شهرستان باغداتی قرار دارد، در دره‌ی رود تسابلاریستسکالی بر دامنه‌ی شمالی رشته‌کوه مسخِتی،
    اندکی بالاتر از ۹۰۰ متر و نزدیک به ۲۵ کیلومتر پس از باغداتی. نام آب‌های آن نخستین‌بار در اسناد دهه‌ی
    ۱۸۹۰ آمده، و بطری‌کردن آب از سال ۱۸۹۳ آغاز شد، هنگامی که آب را با اسب به انباری می‌بردند و به‌دست
    پر می‌کردند. در سال ۱۹۱۲، جوانی از باغداتی که بعدها پزشک شد (دکتر کلنجرادزه)، نمونه‌ای برای نخستین
    آزمایش شیمیایی به سن‌پترزبورگ برد. عنوان تفرجگاه در دهه‌ی ۱۹۳۰ به سائیرمه رسید، راهی به باغداتی در
    دهه‌ی ۱۹۴۰ ساخته شد، و کارخانه‌ی بطری‌کردن آب در سال ۱۹۵۴ بنا شد.


    دو خانواده‌ی آب اینجا برمی‌جوشد: آبی از نوع نارزان با بی‌کربنات کلسیم-سدیم، و آبی از نوع بورجومی با
    بی‌کربنات سدیم، با مجموع املاح ۱٫۶ تا ۹٫۵ گرم در لیتر. اگر در غرفه‌ها هر دو را بیابید، آن‌ها را کنار
    هم بچشید؛ تفاوتشان بی‌درنگ بر زبان آشکار می‌شود.


    دره پرشیب است و از نراد، پیسه‌آ و راش پوشیده؛ نهری زلال بر تخته‌سنگ‌ها میان سکوهای سنگی جاری است،
    پل‌های پیاده بر آن گذر می‌کنند، و بالاتر آسایشگاه بزرگ و سپید دوران شوروی و هتل‌های تازه‌تر ایستاده‌اند.
    حتی در اوت میانگین دما تنها ۱۷ درجه است. در جنوب شرقی، جنگل به پارک ملی بورجومی-خاراگائولی می‌پیوندد.


    می‌گویند چوپانان زمانی علفزاری را نزدیک به سه کیلومتری چشمه‌ی گوزن یافتند که برف هرگز در آن نمی‌نشست
    و زمین چند دقیقه پس از باران خشک می‌شد. راز آن در سده‌ی بیستم گشوده شد: زمین‌شناسان زیر آن آبی معدنی
    و گرم یافتند.
  tip: >-
    چشیدن در غرفه‌های چشمه رایگان است — بطری خالی همراه ببرید. حمام‌ها و درمان‌ها را آسایشگاه و هتل‌ها
    اداره می‌کنند و جدا رزرو و پرداخت می‌شوند، پس اگر برای همین می‌آیید، از پیش هماهنگ کنید. دره خنک است
    و عصرها حتی در تابستان سرد می‌شود؛ لایه‌ای گرم و کفشی مناسب مسیرهای مرطوب جنگلی همراه ببرید. در تفرجگاه
    کافه و مغازه هست، اما مقداری نقد از باغداتی یا کوتائیسی همراه بیاورید. راه آنقدر طولانی است که ماندن
    یک شب بسیار معقول‌تر از یک لیوان آب و بازگشت فوری است.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب، از گوری و خاشوری، تا زستافونی برانید — حدود ۱۸۷ کیلومتر. از آن‌جا
    با Sh54، ۱۸ کیلومتر تا باغداتی، سپس رو به جنوب به Sh14 بپیوندید و نزدیک به ۲۵ کیلومتر دره‌ی تسابلاریستسکالی
    را بالا بروید تا تفرجگاه — در مجموع نزدیک به ۲۳۶ کیلومتر و چهار ساعت. جاده تمام مسیر آسفالته است،
    اما بخش درون دره تنگ و پرپیچ است و زمستان‌ها در سایه‌ها یخ و برف می‌ماند. خودرویی معمولی کافی است؛
    از نوامبر تا مارس لاستیک زمستانی ببندید. در زستافونی یا باغداتی سوخت‌گیری کنید.
he:
  name: אתר הנופש סאירמה
  short: >-
    עיירת מרפא בעמק אפל מאשוחים ברכס מסחתי, שנקראת בשם האיילים שהובילו את הציידים למעיינותיה המלוחים,
    המוכתמים בחלודה.
  body: >-
    **את סאירמה מצאו איילים.** המסורת מספרת על שני אחים, שעקבו אחר עקבות אייל פצוע ביער, ונתקלו במעיין
    הזורם על אבנים שהוכתמו באדום מחלודה; כל הקרקע מסביב הייתה לבנה ממלח, ועדרי איילים באו לשם לשתות וללקק.
    כך נקרא המקום סאירמה, מקום האייל.


    האתר שוכן במוניציפליטת בגדאתי, בעמק נהר צבלריסצקלי על המדרון הצפוני של רכס מסחתי, קצת מעל 900 מטרים,
    כ-25 קילומטרים מעבר לבגדאתי. המים מוזכרים לראשונה ברשומות משנות ה-1890, ומילוי המים בבקבוקים החל ב-1893,
    אז הובלו המים על גבי סוסים לאסם ומולאו ביד. ב-1912 לקח צעיר מבגדאתי, לימים הרופא ד"ר קלנג'רדזה, דגימה
    לסנט פטרסבורג לניתוח הכימי הראשון. מעמד אתר המרפא הוענק בשנות ה-1930, כביש לבגדאתי נבנה בשנות ה-1940,
    ומפעל ביקבוק נבנה ב-1954.


    שתי משפחות מים עולות כאן: מים מסוג נרזן — ביקרבונט סידן-נתרן, ומים מסוג בורג'ומי — ביקרבונט נתרן,
    עם מינרליזציה שנעה בין 1.6 ל-9.5 גרם לליטר. אם בביתני המעיין יש את שניהם, טעמו אותם זה לצד זה, וההבדל
    יורגש מיד על הלשון.


    העמק תלול וסגור באשוחים, אשוחיות ואשור; נחל צלול זורם על סלעים בין סוללות אבן, ומעליו גשרי הליכה,
    ומעל לכול עומד בית ההבראה הסובייטי הגדול והלבן ובתי המלון החדשים יותר. אפילו באוגוסט הטמפרטורה הממוצעת
    היא רק 17 מעלות. מדרום-מזרח היער נמשך אל תוך הפארק הלאומי בורג'ומי-חראגאולי.


    מספרים שרועים שמו לב לקרחת יער כשלושה קילומטרים ממעיין האיילים, שבה שלג לא שכב לעולם והאדמה התייבשה
    דקות אחרי הגשם. את התעלומה פתרו במאה ה-20: גאולוגים מצאו תחתיה מים מינרליים חמים.
  tip: >-
    הטעימה בביתני המעיין היא בחינם — הביאו בקבוק ריק. אמבטיות וטיפולים מנוהלים על ידי בית ההבראה ובתי
    המלון, ומוזמנים ומשולמים בנפרד, אז אם זו הסיבה לביקורכם, ארגנו מראש. העמק קריר וערביו קרים אפילו בקיץ;
    הביאו שכבה חמה ונעליים שמתמודדות עם שבילי יער רטובים. באתר יש בתי קפה וחנויות, אבל הביאו מזומן מבגדאתי
    או מקוטאיסי. הנסיעה מספיק ארוכה כדי שלינה תהיה הגיונית בהרבה מכוס מים וסיבוב חזרה.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי וחשורי, עד זסטפוני — כ-187 ק"מ. משם ב-Sh54 18 ק"מ עד בגדאתי,
    ואז פנו דרומה ל-Sh14 והמשיכו כ-25 ק"מ במעלה עמק צבלריסצקלי עד האתר — כ-236 ק"מ בסך הכול וארבע שעות.
    הכביש אספלט כל הדרך, אך הקטע בעמק צר ומתפתל, ובחורף עלול להיות קרח ושלג בצללים. רכב אקונומי מספיק;
    החליפו לצמיגי חורף מנובמבר עד מרץ. תדלקו בזסטפוני או בבגדאתי.
ar:
  name: منتجع سايرمه
  short: >-
    بلدة استشفاء في وادٍ معتم بأشجار الشوح على سلسلة مسخيتي، سُمّيت باسم الأيائل التي قادت الصيادين إلى
    ينابيعها المالحة الملطخة بالصدأ.
  body: >-
    **وجدت الأيائلُ سايرمه.** تقول الرواية إن أخوين تتبّعا أثر أيّل جريح في الغابة، فوصلا إلى نبع يجري
    على حجارة صبغها الصدأ بالأحمر؛ وكانت الأرض حولها بيضاء من الملح، وكانت قطعان الأيائل تأتي إليه لتشرب
    وتلعق الملح. فسُمّي المكان سايرمه، أي «مكان الأيّل».


    يقع المنتجع في بلدية باغداتي، في وادي نهر تسابلاريستسكالي على المنحدر الشمالي لسلسلة مسخيتي، على ارتفاع
    يزيد قليلًا على 900 متر، على نحو 25 كيلومترًا بعد باغداتي. تظهر مياهه في السجلات منذ تسعينيات القرن
    التاسع عشر، وبدأت تعبئتها في زجاجات عام 1893، حين كانت تُحمَل بالخيول إلى حظيرة وتُعبَّأ يدويًا. وفي
    عام 1912 أخذ شاب من باغداتي، عُرف لاحقًا بالدكتور كيلينجيرادزه، عينة إلى سانت بطرسبرغ لأول تحليل كيميائي.
    وحصلت سايرمه على صفة المنتجع في ثلاثينيات القرن العشرين، وشُقّ طريق إلى باغداتي في الأربعينيات، وبُني
    مصنع للتعبئة عام 1954.


    هنا ينبع نوعان من المياه: مياه من نوع نارزان بيكربوناتية كالسيوم-صوديوم، ومياه من نوع بورجومي بيكربوناتية
    صوديومية، بتمعدن يتراوح بين 1.6 و9.5 غرام في اللتر. وإن وجدتهما معًا عند الأجنحة، فتذوّقهما جنبًا
    إلى جنب، وسيتضح الفرق على اللسان فورًا.


    الوادي شديد الانحدار ومحاط بأشجار التنّوب والشوح والزان؛ يجري جدول صافٍ على الصخور بين ضفاف حجرية،
    تعبره جسور للمشاة، وفوقه يقف المصح السوفييتي الأبيض الكبير والفنادق الأحدث. حتى في أغسطس لا يتجاوز
    المتوسط 17 درجة. وإلى الجنوب الشرقي تمتد الغابة إلى داخل حديقة بورجومي-خاراغاولي الوطنية.


    يُقال إن رعاة لاحظوا يومًا فسحة على نحو ثلاثة كيلومترات من نبع الأيائل لم يسقط عليها الثلج قط وكانت
    الأرض تجفّ بعد المطر بدقائق. حُلّ اللغز في القرن العشرين: وجد الجيولوجيون تحتها مياه معدنية حارة.
  tip: >-
    التذوّق عند أجنحة النبع مجاني — احمل زجاجة فارغة. تُدار الحمامات والعلاجات من قِبل المصح والفنادق،
    وتُحجز وتُدفع بشكل منفصل، فإن كان هذا سبب زيارتك، رتّب الأمر مسبقًا. الوادي بارد والمساءات فيه قد
    تكون قارسة حتى في الصيف؛ احمل طبقة دافئة وحذاءً يتحمل مسارات الغابة الرطبة. في المنتجع مقاهٍ ومتاجر،
    لكن احمل بعض النقد من باغداتي أو كوتايسي. الطريق طويل بما يكفي ليكون المبيت أكثر منطقية من كوب ماء
    وعودة فورية.
  route: >-
    من تبليسي خذ S1 (E60) غربًا عبر غوري وخاشوري إلى زيستافوني — نحو 187 كم. من هناك عبر Sh54 لمسافة 18
    كم إلى باغداتي، ثم اتجه جنوبًا على Sh14 واتبعه نحو 25 كم صعودًا في وادي تسابلاريستسكالي حتى المنتجع
    — نحو 236 كم وأربع ساعات إجمالًا. الطريق مُعبّد بالكامل، لكن القطاع داخل الوادي ضيق ومتعرّج، وقد يحمل
    جليدًا وثلجًا في الظل شتاءً. سيارة اقتصادية كافية؛ ركّب إطارات شتوية من نوفمبر إلى مارس. تزوّد بالوقود
    في زيستافوني أو باغداتي.
