ka:
  name: ტიმოთესუბნის მონასტერი
  short: >-
    თამარის ეპოქის მოვარდისფრო აგურის ტაძარი გუჯარეთის ხეობაში, წაღვერთან; შიგნით 1205–1215 წლების ქართული
    მხატვრობის ერთ-ერთი საუკეთესო ანსამბლია.
  body: >-
    **შუა საუკუნეების საქართველო ეკლესიებს ქვით აშენებდა — ამიტომაც გაჩერებთ ტიმოთესუბანი უკვე ჭიშკართან:
    ღვთისმშობლის მიძინების ტაძარი მოვარდისფრო აგურითაა ნაგები და შუადღის მზეზე თითქოს მთელი შენობა წითლდება.**


    ტაძარი გუჯარეთისწყლის მარჯვენა ნაპირზე, კურორტ წაღვერიდან ორ კილომეტრში დგას, შუა საუკუნეების თორის
    შუაგულში. ააგო თორის მფლობელმა შალვა ახალციხელმა, თორელთა გვარის შვილმა, XII–XIII საუკუნეების მიჯნაზე
    — თამარ მეფის ზეობაში ან უშუალოდ მის შემდეგ. შალვა იმ სარდალთა შორის იყო, ვინც ბასიანის ბრძოლაში რუმის
    სულთნის ლაშქარს ქართული ჯარის ცენტრით დაუხვდა; მოგვიანებით მეჭურჭლეთუხუცესი გახდა და 1227 წელს გარდაიცვალა.


    ტაძარი ჩახაზული ჯვრის ტიპისაა, აღმოსავლეთით სამი შვერილი აფსიდით. გუმბათი ორ თავისუფლად მდგარ ბოძსა
    და საკურთხევლის კედლის შვერილებს ეყრდნობა, ყელი კი ლაჟვარდოვანი ჭიქურის ფიალებითაა შემკული. ზემო ტერასაზე
    წმინდა ბარბარეს პატარა ერთნავიანი ბაზილიკა დგას, ირგვლივ კი ძველი სამონასტრო ნაგებობების ნაშთებია.


    მთავარი მაინც შიგნითაა. კედლები მთლიანად მოხატულია; მხატვრობა 1205–1215 წლებით თარიღდება და იკონოგრაფიული
    პროგრამით არაჩვეულებრივად მდიდარია. ერთიანი სტილის ფარგლებში აქ რამდენიმე ოსტატის ხელი ირჩევა, თითოეული
    — თავისი მკვეთრი, განუმეორებელი ხასიათით. ერთ-ერთ წარწერაში თავად შალვა ახალციხელია მოხსენიებული.


    ფრესკები 1972–1976 წლებში ე. პრივალოვას ხელმძღვანელობით გაწმინდეს და შეისწავლეს, 2000–2006 წლებში
    კი, მსოფლიო ძეგლების ფონდისა და სემიუელ კრესის ფონდის დახმარებით, ხელახლა გაამაგრეს. XVIII საუკუნეში
    ვახუშტი ბატონიშვილმა ეს სავანე ასე აღწერა: „გუმბათიანი, კეთილშენი, მშვენიერს ადგილს“. სამი საუკუნის
    შემდეგაც ამას დასამატებელი არაფერი აქვს.
  tip: >-
    ერთი საათი საკმარისია, თუმცა ფრესკები მეტსაც იმსახურებს. შეარჩიეთ ნათელი დღე და შუადღის საათები: ინტერიერი
    მხოლოდ სარკმლებიდან შემოსული შუქით ნათდება და მოღრუბლულ საღამოს მხატვრობა კედლებში ჩაიძირება. მონასტერი
    მოქმედია — ქალებს თავსაფარი და კაბა სჭირდებათ (მოსასხამები ჩვეულებრივ კართან კიდია), კაცებს გრძელი
    შარვალი; შიგნით გადაღებამდე ნებართვა ითხოვეთ და ხმადაბლა ილაპარაკეთ, აქ ბერები ცხოვრობენ. კაფე ადგილზე
    არ არის: მაღაზიები და საჭმელი ორ კილომეტრში, წაღვერშია, მეტი არჩევანი — ბაკურიანში. შესვლა უფასოა;
    სანთელი ან მცირე შესაწირი თავაზიანობის ნიშანია.
  route: >-
    თბილისიდან E60/ს1-ით დასავლეთით ხაშურამდე იარეთ (დაახლოებით 130 კმ), შემდეგ ს8-ით სამხრეთით ბორჯომამდე.
    ბორჯომში ბაკურიანის გზას, შ20-ს, დაადექით და წაღვერამდე აუყევით; კურორტის შემდეგ ნიშნიანი გზა მარცხნივ,
    გუჯარეთის ხეობაში ჩადის და დაახლოებით ორ კილომეტრში მონასტერთან მიდის. სულ დაახლოებით 180 კილომეტრი
    და ორი საათი და სამი მეოთხედი. შესახვევამდე ასფალტია, ბოლო მონაკვეთი ვიწრო და ადგილ-ადგილ დაზიანებულია,
    თუმცა ეკონომკლასის მანქანა უპრობლემოდ გაივლის. მანქანა ჭიშკართან, პატარა მოედანზე დატოვეთ. საწვავი
    ბორჯომში შეავსეთ. ზამთარში ბაკურიანის გზას წმენდენ, მაგრამ ზამთრის საბურავები აუცილებელია.
en:
  name: Timotesubani Monastery
  short: >-
    A rose-brick church of Queen Tamar's age in the Gujareti valley near Tsagveri, painted inside in 1205–1215
    by some of Georgia's finest masters.
  body: >-
    **Medieval Georgia built its churches in stone, which is exactly why Timotesubani stops you at the
    gate: the Church of the Dormition is laid in pinkish brick, and in the midday sun the whole building
    seems to blush.**


    It stands on the right bank of the Gujaretistskali, two kilometres from the resort of Tsagveri, in
    the heart of medieval Tori. It was raised by the lord of Tori, Shalva Akhaltsikheli of the Toreli
    clan, at the turn of the 12th and 13th centuries — in Queen Tamar's reign or just after it. Shalva
    was one of the commanders who met the army of the Sultan of Rum at Basiani with the centre of the
    Georgian line; he later became Lord High Treasurer and died in 1227.


    The church is a cross-in-square with three projecting apses to the east. The dome rests on two free-standing
    piers and the ledges of the altar wall, and its drum is set with bowls of lapis-blue glaze. On the
    upper terrace stands the small single-nave basilica of St Barbara, among the remains of old monastic
    buildings.


    The real reason to come is inside. The walls are painted throughout, dated to 1205–1215, with an iconographic
    programme of unusual richness. Within one style you can tell several masters apart, each with a sharp,
    unrepeatable character of his own. One inscription names Shalva Akhaltsikheli himself.


    The murals were cleaned and studied in 1972–1976 under E. Privalova, and secured again in 2000–2006
    with help from the World Monuments Fund and the Samuel H. Kress Foundation. In the 18th century Prince
    Vakhushti described the monastery as 'domed, well built, in a beautiful place'. Three centuries on,
    there is nothing to add.
  tip: >-
    An hour is enough, though the frescoes deserve more. Choose a bright day and come around midday: the
    interior is lit only through its windows, and on a grey evening the paintings sink back into the walls.
    It is a working monastery — women need a headscarf and a skirt (wraps usually hang by the door), men
    long trousers; ask before photographing inside and keep your voice low, as monks live here. There
    is no café: shops and food are 2 km away in Tsagveri, with more choice in Bakuriani. Entry is free;
    a candle or a small donation is the courtesy.
  route: >-
    From Tbilisi take the E60/S1 west to Khashuri, about 130 km, then the S8 south to Borjomi. There join
    the Sh20 towards Bakuriani and climb to Tsagveri; just beyond the resort a signed road drops left
    into the Gujareti valley and runs about 2 km to the monastery. In all, about 180 km and two and three-quarter
    hours. It is asphalt to the turn; the last stretch is narrow and broken in places, but an economy
    car copes easily. Park in the small clearing by the gate. Refuel in Borjomi. In winter the Bakuriani
    road is ploughed, but winter tyres are essential.
ru:
  name: Монастырь Тимотесубани
  short: >-
    Храм из розового кирпича эпохи царицы Тамар в Гуджаретском ущелье у Цагвери, расписанный в 1205–1215
    годах одними из лучших мастеров Грузии.
  body: >-
    **Средневековая Грузия строила храмы из камня — именно поэтому Тимотесубани останавливает вас уже
    у ворот: церковь Успения сложена из розоватого кирпича, и на полуденном солнце всё здание словно заливается
    румянцем.**


    Она стоит на правом берегу Гуджаретисцкали, в двух километрах от курорта Цагвери, в самом сердце средневекового
    Тори. Воздвиг её владетель Тори Шалва Ахалцихели из рода Торели на рубеже XII и XIII веков — в царствование
    Тамар или сразу после него. Шалва был одним из военачальников, которые встретили войско Румского султана
    при Басиани, командуя центром грузинского строя; позже он стал мечурчлетухуцеси — великим казначеем
    — и умер в 1227 году.


    Церковь крестово-купольная, с тремя выступающими апсидами на востоке. Купол опирается на два свободно
    стоящих столба и выступы алтарной стены, а в барабан вставлены глазурованные чаши цвета лазурита.
    На верхней террасе, среди остатков старых монастырских построек, стоит маленькая однонефная базилика
    святой Варвары.


    Но главная причина приехать — внутри. Стены расписаны сплошь; роспись датируется 1205–1215 годами,
    а её иконографическая программа необычайно богата. В пределах одного стиля можно различить руку нескольких
    мастеров, у каждого — свой острый, неповторимый характер. Одна из надписей называет самого Шалву Ахалцихели.


    Росписи расчищали и изучали в 1972–1976 годах под руководством Э. Приваловой, а в 2000–2006 годах
    их вновь укрепили при поддержке Всемирного фонда памятников и Фонда Сэмюэла Х. Кресса. В XVIII веке
    царевич Вахушти описал монастырь как «купольный, хорошо построенный, в красивом месте». Три столетия
    спустя добавить нечего.
  tip: >-
    Часа достаточно, хотя фрески заслуживают большего. Выбирайте ясный день и приезжайте около полудня:
    интерьер освещается только через окна, и пасмурным вечером росписи словно тонут в стенах. Это действующий
    монастырь: женщинам нужны платок и юбка (накидки обычно висят у входа), мужчинам — длинные брюки;
    спрашивайте разрешения, прежде чем фотографировать внутри, и говорите вполголоса — здесь живут монахи.
    Кафе нет: магазины и еда — в 2 км, в Цагвери, а больше выбора в Бакуриани. Вход бесплатный; свеча
    или небольшое пожертвование — знак вежливости.
  route: >-
    Из Тбилиси езжайте по E60/S1 на запад до Хашури — около 130 км, затем по S8 на юг до Боржоми. Там
    выезжайте на Sh20 в сторону Бакуриани и поднимайтесь до Цагвери; сразу за курортом дорога с указателем
    уходит налево вниз, в Гуджаретское ущелье, и около 2 км ведёт к монастырю. Всего примерно 180 км и
    два часа сорок пять минут. До поворота асфальт; последний отрезок узкий и местами разбитый, но машина
    эконом-класса справится без труда. Оставьте её на маленькой поляне у ворот. Заправьтесь в Боржоми.
    Зимой дорогу на Бакуриани чистят, но зимняя резина обязательна.
fa:
  name: صومعهٔ تیموتسوبانی
  short: >-
    کلیسایی از آجر گلی‌رنگ از روزگار ملکه تامار در درهٔ گوجارتی نزدیک تساگوری، که برخی از چیره‌دست‌ترین
    استادان گرجستان در ۱۲۰۵ تا ۱۲۱۵ درونش را نقاشی کردند.
  body: >-
    **گرجستانِ سده‌های میانه کلیساهایش را از سنگ می‌ساخت، و درست به همین دلیل تیموتسوبانی شما را دم دروازه
    میخکوب می‌کند: کلیسای خواب مریم مقدس از آجری گلی‌رنگ ساخته شده و در آفتاب نیمروز گویی چهرهٔ سراسر
    بنا گل می‌اندازد.**


    بر کرانهٔ راست گوجارتیس‌تسکالی ایستاده است، دو کیلومتر دورتر از استراحتگاه تساگوری، در دل توری سده‌های
    میانه. آن را فرمانروای توری، شالوا آخالتسیخلی از خاندان تورلی، در گذار سده‌های دوازدهم به سیزدهم بنا
    کرد؛ در دوران فرمانروایی ملکه تامار یا اندکی پس از آن. شالوا یکی از فرماندهانی بود که در باسیانی با
    قلب سپاه گرجستان به مقابلهٔ لشکر سلطان روم رفتند؛ او بعدها خزانه‌دار بزرگ شد و در ۱۲۲۷ درگذشت.


    کلیسا نقشه‌ای صلیبی محاط در مربع دارد، با سه محراب‌خانهٔ برآمده (اپسیس) در سوی خاور. گنبد بر دو پایهٔ
    مستقل و بر پیش‌آمدگی‌های دیوار محراب تکیه دارد، و گریو آن با کاسه‌هایی لعاب‌دار به رنگ لاجوردی آراسته
    است. بر مهتابی بالایی، در میان بازمانده‌های ساختمان‌های کهن صومعه، بازیلیکای کوچک و تک‌ناو قدیسه باربارا
    ایستاده است.


    اما دلیل اصلی آمدن در درون است. دیوارها سراسر نقاشی شده‌اند، با تاریخ ۱۲۰۵ تا ۱۲۱۵، و برنامهٔ شمایل‌نگاری‌شان
    غنایی کم‌مانند دارد. در دل یک سبک واحد می‌توان دست چند استاد را از هم بازشناخت، که هر یک منشی تیز
    و تکرارنشدنی از آنِ خود دارد. یکی از کتیبه‌ها نام خودِ شالوا آخالتسیخلی را آورده است.


    نقاشی‌ها در سال‌های ۱۹۷۲ تا ۱۹۷۶ زیر نظر ا. پریوالوا پاک‌سازی و بررسی شدند، و در سال‌های ۲۰۰۰ تا ۲۰۰۶
    با یاری صندوق جهانی بناهای تاریخی و بنیاد ساموئل اچ. کرس دوباره استحکام یافتند. در سدهٔ هجدهم شاهزاده
    واخوشتی صومعه را چنین وصف کرد: «گنبددار، خوش‌ساخت، در جایی زیبا». سه سده گذشته است و چیزی برای افزودن
    نمانده.
  tip: >-
    یک ساعت بس است، هرچند نقاشی‌های دیواری سزاوار زمان بیشتری‌اند. روزی آفتابی را برگزینید و حوالی نیمروز
    بیایید: درون کلیسا فقط از پنجره‌هایش نور می‌گیرد و در غروبی ابری نقاشی‌ها در دیوارها فرو می‌روند.
    این صومعه‌ای فعال است: زنان به روسری و دامن نیاز دارند (معمولاً کنار در پوشش‌هایی آویخته است)، و مردان
    به شلوار بلند؛ پیش از عکاسی در درون اجازه بگیرید و آهسته سخن بگویید، زیرا راهبان این‌جا زندگی می‌کنند.
    کافه‌ای نیست: فروشگاه و خوراک در ۲ کیلومتری، در تساگوری، پیدا می‌شود و گزینه‌های بیشتر در باکوریانی.
    ورود رایگان است؛ روشن کردن شمعی یا کمکی کوچک نشانهٔ ادب است.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سوی غرب تا خاشوری بروید، حدود ۱۳۰ کیلومتر، سپس S8 را به سوی جنوب تا بورجومی.
    آنجا به جادهٔ Sh20 به سمت باکوریانی بپیچید و تا تساگوری بالا بروید؛ کمی پس از این استراحتگاه، جاده‌ای
    با تابلو به چپ و رو به پایین به درهٔ گوجارتی می‌رود و حدود ۲ کیلومتر تا صومعه ادامه دارد. روی‌هم حدود
    ۱۸۰ کیلومتر و دو ساعت و سه‌ربع. تا سر پیچ آسفالت است؛ تکهٔ پایانی باریک و جابه‌جا خراب است، اما خودروی
    اقتصادی به‌راحتی از پسش برمی‌آید. در محوطهٔ کوچک باز کنار دروازه پارک کنید. در بورجومی سوخت‌گیری کنید.
    در زمستان برف جادهٔ باکوریانی روبیده می‌شود، اما لاستیک زمستانی ضروری است.
he:
  name: מנזר טימותסובאני
  short: >-
    כנסייה מלבנים ורדרדות מימי המלכה תמר בעמק גוג'רטי ליד צגוורי, שצוירה מבפנים ב-1205–1215 בידי כמה מגדולי
    האמנים של גאורגיה.
  body: >-
    **גאורגיה של ימי הביניים בנתה את כנסיותיה מאבן, ובדיוק משום כך טימותסובאני עוצרת אתכם כבר בשער: כנסיית
    הירדמות מרים בנויה לבנים ורדרדות, ובשמש הצהריים נדמה שהמבנה כולו מסמיק.**


    היא עומדת על הגדה הימנית של הגוג'רטיסצקאלי, שני קילומטרים מעיירת הנופש צגוורי, בלב טורי של ימי הביניים.
    הקים אותה שליט טורי, שלווה אחלציחלי מבית טורלי, במפנה המאות ה-12 וה-13 — בימי מלכותה של תמר או מעט
    אחריהם. שלווה היה אחד המפקדים שעמדו מול צבא הסולטן של רום בבסיאני בראש מרכז המערך הגאורגי; מאוחר יותר
    נעשה לגזבר העליון, ומת ב-1227.


    הכנסייה בנויה בתוכנית של צלב חסום בריבוע, עם שלוש אפסידות בולטות במזרח. הכיפה נשענת על שני עמודים
    חופשיים ועל זיזי קיר המזבח, ובתוף הכיפה משובצות קערות בזיגוג כחול לאפיס לזולי. על הטרסה העליונה, בין
    שרידי מבני המנזר הישנים, ניצבת הבזיליקה הקטנה, החד-ספינתית, של ברברה הקדושה.


    אבל הסיבה האמיתית לבוא נמצאת בפנים. הקירות מצוירים כולם, בציורים המתוארכים ל-1205–1215, בתוכנית איקונוגרפית
    עשירה במידה נדירה. בתוך סגנון אחד אפשר להבחין בידיהם של כמה אמנים, לכל אחד אופי חד ובלתי חוזר משלו.
    כתובת אחת מזכירה בשמו את שלווה אחלציחלי עצמו.


    ציורי הקיר נוקו ונחקרו ב-1972–1976 בהנהגת א. פריבלובה, ויוצבו שוב ב-2000–2006 בסיוע קרן המונומנטים
    העולמית וקרן סמואל ה. קרס. במאה ה-18 תיאר הנסיך ואחושטי את המנזר כ"בעל כיפה, בנוי היטב, במקום יפה".
    שלוש מאות שנה אחר כך, אין מה להוסיף.
  tip: >-
    שעה מספיקה, אם כי ציורי הקיר ראויים ליותר. בחרו יום בהיר ובואו סביב הצהריים: הפנים מואר רק דרך החלונות,
    ובערב אפור הציורים שוקעים בחזרה אל הקירות. זהו מנזר פעיל — נשים צריכות כיסוי ראש וחצאית (בדרך כלל
    תלויים ליד הדלת כיסויים להשאלה), גברים מכנסיים ארוכים; בקשו רשות לפני צילום בפנים ודברו בשקט, כי נזירים
    חיים כאן. אין בית קפה: חנויות ואוכל יש במרחק 2 ק״מ, בצגוורי, ומבחר גדול יותר בבקוריאני. הכניסה חופשית;
    נר או תרומה קטנה הם מחווה של נימוס.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד חשורי, כ-130 ק״מ, ואז בכביש S8 דרומה עד בורג'ומי. שם עלו על כביש
    Sh20 לכיוון בקוריאני וטפסו עד צגוורי; מעט אחרי העיירה יורדת שמאלה דרך מסומנת אל עמק גוג'רטי ונמשכת
    כ-2 ק״מ עד המנזר. בסך הכול כ-180 ק״מ ושעתיים ושלושה רבעים. עד הפנייה הכביש סלול; הקטע האחרון צר ומשובש
    פה ושם, אבל רכב חסכוני מסתדר בקלות. חנו בקרחת הקטנה ליד השער. תדלקו בבורג'ומי. בחורף הכביש לבקוריאני
    מפונה משלג, אבל צמיגי חורף הכרחיים.
ar:
  name: دير تيموتيسوباني
  short: >-
    كنيسة من الآجر الوردي من عصر الملكة تامار في وادي غوجاريتي قرب تساغفيري، زيّن بعض أمهر معلمي جورجيا
    داخلها بالرسوم بين 1205 و1215.
  body: >-
    **بنت جورجيا في العصور الوسطى كنائسها بالحجر، ولهذا بالذات يستوقفك تيموتيسوباني عند البوابة: فكنيسة
    رقاد السيدة العذراء مبنية بآجر مائل إلى الوردي، وفي شمس الظهيرة يبدو المبنى كله وكأنه يتورّد خجلاً.**


    تقوم الكنيسة على الضفة اليمنى لنهر غوجاريتيستسكالي، على بعد كيلومترين من منتجع تساغفيري، في قلب منطقة
    توري في العصور الوسطى. شيّدها سيد توري، شالفا أخالتسيخيلي من آل توريلي، عند منعطف القرنين الثاني عشر
    والثالث عشر، في عهد الملكة تامار أو بعده بقليل. وكان شالفا أحد القادة الذين واجهوا جيش سلطان الروم
    في باسياني على رأس قلب الصف الجورجي؛ ثم صار لاحقاً أمين الخزانة الأكبر، وتوفي عام 1227.


    الكنيسة على مخطط الصليب المحصور في مربع، ولها ثلاث حنيات بارزة نحو الشرق. وترتكز القبة على دعامتين
    قائمتين بذاتهما وعلى نتوءات جدار الهيكل، أما رقبتها فمرصّعة بطاسات مزججة بلون اللازورد. وعلى المصطبة
    العليا، بين بقايا مبانٍ رهبانية قديمة، تقوم بازيليكا القديسة بربارة الصغيرة ذات الصحن الواحد.


    لكن السبب الحقيقي للمجيء في الداخل. فالجدران مغطاة بالرسوم بالكامل، وتعود رسومها إلى 1205–1215، ببرنامج
    أيقوني نادر الثراء. وفي إطار أسلوب واحد يمكنك أن تميّز أيدي عدة معلمين، لكل منهم طابع حادّ لا يتكرر.
    وأحد النقوش يذكر شالفا أخالتسيخيلي نفسه بالاسم.


    نُظّفت الرسوم الجدارية ودُرست بين 1972 و1976 بإشراف إ. بريفالوفا، ثم ثُبّتت مجدداً بين 2000 و2006
    بمساعدة صندوق الآثار العالمي ومؤسسة صموئيل هـ. كريس. وفي القرن الثامن عشر وصف الأمير فاخوشتي الدير
    بأنه «ذو قبة، حسن البناء، في موضع جميل». وبعد ثلاثة قرون، ليس ثمة ما يُضاف.
  tip: >-
    تكفي ساعة، وإن كانت الجداريات تستحق أكثر. اختر يوماً مشمساً وتعالَ نحو الظهيرة: فالداخل لا يُضاء إلا
    من نوافذه، وفي مساء رمادي تغوص الرسوم عائدة في الجدران. إنه دير عامر: تحتاج النساء إلى غطاء للرأس
    وتنورة (وعادة ما تُعلَّق أغطية عند الباب)، والرجال إلى سراويل طويلة؛ واستأذن قبل التصوير في الداخل،
    واخفض صوتك، فهنا يعيش رهبان. لا يوجد مقهى: المتاجر والطعام على بعد 2 كم في تساغفيري، وخيارات أوسع
    في باكورياني. الدخول مجاني، وشمعة أو تبرع صغير من باب اللياقة.
  route: >-
    من تبليسي اسلك الطريق E60/S1 غرباً حتى خاشوري، نحو 130 كم، ثم الطريق S8 جنوباً حتى بورجومي. وهناك
    انتقل إلى الطريق Sh20 باتجاه باكورياني واصعد حتى تساغفيري؛ وبعد المنتجع بقليل ينحدر يساراً طريق عليه
    لافتة إلى وادي غوجاريتي ويمتد نحو 2 كم حتى الدير. المسافة الإجمالية نحو 180 كم، وساعتان وثلاثة أرباع
    الساعة. الإسفلت يمتد حتى المنعطف؛ أما المقطع الأخير فضيق ومتكسّر في مواضع، لكن السيارة الاقتصادية
    تجتازه بسهولة. اركن في الفسحة الصغيرة عند البوابة. تزوّد بالوقود في بورجومي. في الشتاء تُزال الثلوج
    عن طريق باكورياني، لكن الإطارات الشتوية ضرورية.
