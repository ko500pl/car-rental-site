ka:
  name: ტიმოთესუბნის მონასტერი
  short: >-
    თამარ მეფის ხანის აგურის ტაძარი ბორჯომ-ბაკურიანის გზაზე, XIII საუკუნის ფრესკების იშვიათად სრული ციკლით.
  body: >-
    **ტიმოთესუბანი მთელ სამცხეში საუკეთესოდ შემონახული ფრესკების მქონე ტაძარია** და, რაც არანაკლებ საინტერესოა, ქართული შუასაუკუნეების არქიტექტურაში იშვიათი მაგალითია — ის ქვისა კი არა, ვარდისფერი აგურისაა.


    ღვთისმშობლის მიძინების მთავარი ტაძარი 1195-1215 წლებში აშენდა, ანუ ზუსტად თამარ მეფის ეპოქაში. ქტიტორი შალვა ახალციხელი იყო, ტორელთა საგვარეულოს წარმომადგენელი და ბასიანის ბრძოლის ერთ-ერთი სარდალი. ნაგებობა ჯვარგუმბათოვანია, მაღალი, სუფთა პროპორციების ყელით; გარედან თითქმის მთლიანად აგურით ნაწყობი ზედაპირი ნაზი, თბილი ფერისაა და მზეზე თითქმის ვარდისფრად ბრწყინავს.


    მთავარი ინტერიერშია. კედლის მხატვრობა 1205-1215 წლებით თარიღდება და ქართული „ოქროს ხანის“ სამონუმენტო ფერწერის ერთ-ერთი ყველაზე სრული ანსამბლია: ღრმა ლურჯი ფონები, დიდი, მშვიდი ფიგურები, ვრცელი ევანგელური ციკლი და ქტიტორთა პორტრეტები. 2000-იან წლებში ქართულ-იტალიურმა ჯგუფმა ფრესკების კონსერვაცია გაატარა და დღეს მათი კითხვა გაცილებით უკეთაა შესაძლებელი, ვიდრე ოცდაათი წლის წინ.


    აგური ქართულ ხუროთმოძღვრებაში ჩვეულებრივი მასალა არ ყოფილა და ტიმოთესუბანი საუკეთესოდ აჩვენებს, რას აკეთებდნენ მისით ადგილობრივი ოსტატები: კედლები თანაბარი რიგებითაა ნაწყობი, დეკორი კი — ბრმა თაღები და გეომეტრიული ორნამენტი — მხოლოდ თვით წყობის რიტმით არის მიღწეული, ქვის კვეთის გარეშე.


    ეზოში ასევე დგას პატარა სამლოცველო, გვიანდელი სამრეკლო და სამონასტრო ნაგებობათა ნაშთები. მონასტერი მოქმედია, აქ ბერები ცხოვრობენ, ამიტომ სიჩუმე ბუნებრივი მოთხოვნაა.


    ადგილიც თავისთავად ლამაზია: ტაძარი გუჯარეთის ხეობაში, ფიჭვნარისა და ფოთლოვანი ტყის საზღვარზე დგას, დაახლოებით ათასი მეტრის სიმაღლეზე. აქ თითქმის არასოდესაა ხალხმრავლობა — ბაკურიანისკენ მიმავალთა უმრავლესობა გვერდით ჩაივლის და არ იცის, რომ ორ კილომეტრში საქართველოს ერთ-ერთი მთავარი შუასაუკუნეების მხატვრობა დგას.
  tip: >-
    ერთი საათი საკმარისია, თუმცა ფრესკებს უფრო მეტი დრო უნდა. ინტერიერი ბუნებრივი შუქითაა განათებული, ამიტომ საუკეთესო დროა შუადღე, მოწმენდილ ამინდში; ღრუბლიან საღამოს კედლები თითქმის არაფერს გამოკვეთს. ფოტოზე შეიძლება შეზღუდვა იყოს — ჯერ იკითხე. ქალებს თავსაფარი და გრძელი კალთა, კაცებს გრძელი შარვალი დასჭირდება; კართან ჩვეულებრივ დევს. ტუალეტი მარტივია, საჭმელი ადგილზე არაა — უახლოესი კაფეები ცაღვერსა და ბაკურიანშია.
  route: >-
    თბილისიდან E60-ით ხაშურამდე, შემდეგ ბორჯომზე გავლით ბაკურიანის გზას გაჰყევი. ცაღვერის შემდეგ ტიმოთესუბნის მიმანიშნებელი ნიშანია — მარცხნივ, ხეობაში ჩასასვლელი. სულ 180 კმ, დაახლოებით ორი საათი და ორმოცდახუთი წუთი. მთავარი გზა ასფალტია, ბოლო ორი კილომეტრი კი ვიწრო და ადგილ-ადგილ დაზიანებული, თუმცა ჩვეულებრივი მანქანით გასავლელი. მონასტრის კართან პატარა მოედანია სამანქანედ. საწვავი ბორჯომში აიღე.
en:
  name: Timotesubani Monastery
  short: >-
    A brick church of Queen Tamar's reign off the Borjomi-Bakuriani road, holding an unusually complete 13th-century fresco cycle.
  body: >-
    **Timotesubani has the best-preserved wall paintings in Samtskhe,** and it is also, less obviously, a rarity in Georgian medieval architecture: the church is built not of stone but of rose-coloured brick.


    The main church, dedicated to the Dormition of the Virgin, went up between 1195 and 1215, precisely in the reign of Queen Tamar. Its patron was Shalva Akhaltsikheli of the Toreli family, one of the commanders at the battle of Basiani. The plan is a domed cross-in-square with a tall, cleanly proportioned drum, and the brick surface takes on a warm, almost pink tone in sunlight.


    The point of coming, though, is inside. The murals date from about 1205 to 1215 and form one of the most complete ensembles of Georgian golden-age monumental painting: deep blue grounds, large and unhurried figures, a full gospel cycle and portraits of the donors. A Georgian-Italian team conserved the paintings during the 2000s, and they can be read far better today than they could thirty years ago.


    Brick was never a common building material in Georgia, and Timotesubani is the clearest surviving demonstration of what local masons could do with it. The walls are laid in even courses, and the decoration — blind arcading and simple geometric patterns — is achieved purely through the rhythm of the coursing, with no carved stone at all.


    The yard also holds a small chapel, a later bell tower and the footings of monastic buildings. The monastery is active and monks live here, so quiet is simply expected rather than requested.


    The setting helps. The church stands in the Gujareti valley at about a thousand metres, on the line where pine forest gives way to broadleaf woodland, and it is almost never crowded. Most of the traffic on the Bakuriani road drives straight past without knowing that two kilometres to the side stands one of the major surviving works of medieval Georgian painting.
  tip: >-
    An hour is enough for the site, though the frescoes reward longer. The interior is lit only by daylight, so the best time is the middle of a clear day; on a cloudy evening the walls give up almost nothing. Photography may be restricted, so ask first. Women need a headscarf and a long skirt, men long trousers; wraps are usually left by the door. The toilet is basic and there is no food on site, the nearest cafes being in Tsagveri and Bakuriani.
  route: >-
    From Tbilisi take the E60 to Khashuri, then head through Borjomi and follow the Bakuriani road. Beyond Tsagveri a sign marks the turn for Timotesubani, dropping left into the side valley. The total is 180 km, about two hours forty-five. The main road is asphalt; the final two kilometres are narrow and broken in places but perfectly passable in an ordinary car. There is a small clearing for parking at the monastery gate. Refuel in Borjomi.
ru:
  name: Монастырь Тимотесубани
  short: >-
    Кирпичный храм эпохи царицы Тамар у дороги Боржоми — Бакуриани с необычайно полным циклом фресок XIII века.
  body: >-
    **В Тимотесубани сохранилась лучшая стенная роспись во всём Самцхе,** а сам храм — редкость для грузинского средневековья: он сложен не из камня, а из розоватого кирпича.


    Главную церковь Успения Богородицы построили между 1195 и 1215 годами, то есть ровно в царствование Тамар. Ктитором был Шалва Ахалцихели из рода Торели, один из полководцев в Басианской битве. План — крестово-купольный, с высоким барабаном чистых пропорций, а кирпичная поверхность на солнце приобретает тёплый, почти розовый оттенок.


    Но ехать сюда стоит ради интерьера. Росписи датируются примерно 1205-1215 годами и образуют один из самых полных ансамблей грузинской монументальной живописи золотого века: глубокие синие фоны, крупные неторопливые фигуры, полный евангельский цикл и портреты ктиторов. В 2000-х годах грузино-итальянская группа провела консервацию, и сегодня фрески читаются намного лучше, чем тридцать лет назад.


    Кирпич никогда не был в Грузии распространённым строительным материалом, и Тимотесубани лучше всего показывает, что умели с ним делать местные мастера. Стены выложены ровными рядами, а декор — глухие аркады и простые геометрические узоры — достигнут исключительно ритмом самой кладки, без единой резной детали.


    Во дворе стоят также небольшая часовня, поздняя колокольня и остатки монастырских построек. Монастырь действующий, здесь живут монахи, так что тишина здесь не просьба, а норма.


    Помогает и место. Храм стоит в Гуджаретском ущелье на высоте около тысячи метров, на границе соснового и лиственного леса, и людно тут не бывает почти никогда. Основной поток на Бакуриани проезжает мимо, не зная, что в двух километрах в сторону находится один из главных памятников средневековой грузинской живописи.
  tip: >-
    Часа на осмотр достаточно, хотя фрески заслуживают большего. Интерьер освещён только дневным светом, поэтому лучшее время — середина ясного дня; пасмурным вечером стены почти ничего не показывают. Съёмка может быть ограничена, спросите заранее. Женщинам нужны платок и длинная юбка, мужчинам длинные брюки; накидки обычно лежат у входа. Туалет простой, еды на месте нет — ближайшие кафе в Цагвери и Бакуриани.
  route: >-
    Из Тбилиси по E60 до Хашури, затем через Боржоми по дороге на Бакуриани. За Цагвери есть указатель на Тимотесубани — поворот налево, вниз в боковое ущелье. Всего 180 км, около двух часов сорока пяти минут. Основная дорога асфальтированная, последние два километра узкие и местами разбитые, но вполне проезжие на обычной машине. У монастырских ворот есть небольшая площадка для машин. Заправляйтесь в Боржоми.
fa:
  name: صومعهٔ تیموتسوبانی
  short: >-
    کلیسایی آجری از روزگار ملکه تامار در کنار جادهٔ بورجومی-باکوریانی، با مجموعه‌ای کم‌نظیر از نقاشی‌های دیواری سدهٔ سیزدهم.
  body: >-
    **تیموتسوبانی بهترین نقاشی‌های دیواری محفوظ‌مانده در سراسر سامتسخه را دارد،** و کمتر آشکار آنکه در معماری قرون وسطای گرجستان نیز کمیاب است: این کلیسا نه از سنگ که از آجر گلگون ساخته شده است.


    کلیسای اصلی، وقف خوابیدگی مریم، میان سال‌های ۱۱۹۵ تا ۱۲۱۵ برپا شد، یعنی درست در دوران ملکه تامار. بانی آن شالوا آخالتسیخلی از خاندان تورلی بود، یکی از فرماندهان نبرد باسیانی. طرح بنا صلیبی‌گنبدی است با ساقه‌ای بلند و متناسب، و سطح آجری در آفتاب رنگی گرم و تقریباً صورتی می‌گیرد.


    اما دلیل آمدن، درون بناست. نقاشی‌ها به حدود ۱۲۰۵ تا ۱۲۱۵ بازمی‌گردند و یکی از کامل‌ترین مجموعه‌های نقاشی یادمانی عصر زرین گرجستان‌اند: زمینه‌های آبی ژرف، پیکرهای بزرگ و آرام، چرخهٔ کامل انجیلی و تصویر واقفان. در دههٔ دوهزار گروهی گرجی-ایتالیایی این نقاشی‌ها را مرمت و تثبیت کرد و امروز بسیار بهتر از سی سال پیش خوانده می‌شوند.


    آجر هرگز در گرجستان مصالح رایجی نبود، و تیموتسوبانی روشن‌ترین نمونهٔ بازمانده از توان معماران محلی در کار با آن است. دیوارها در رگ‌های یکنواخت چیده شده و تزیین — طاق‌نماهای کور و نقش‌های سادهٔ هندسی — تنها از ضرباهنگ همان رگ‌چینی به دست آمده است، بی هیچ سنگ کنده‌کاری‌شده.


    در حیاط نیز نمازخانه‌ای کوچک، برج ناقوسی متأخر و پی ساختمان‌های رهبانی برجاست. صومعه فعال است و راهبان در آن زندگی می‌کنند، پس سکوت اینجا خواهش نیست، عرف است.


    جای بنا هم به آن کمک می‌کند. کلیسا در درهٔ گوجارتی و در ارتفاع حدود هزار متر ایستاده، درست بر مرزی که جنگل کاج به جنگل پهن‌برگ می‌رسد، و تقریباً هرگز شلوغ نیست. بیشتر خودروهای جادهٔ باکوریانی از کنارش می‌گذرند بی‌آنکه بدانند دو کیلومتر آن‌سوتر یکی از مهم‌ترین آثار بازماندهٔ نقاشی گرجی سده‌های میانه ایستاده است.
  tip: >-
    یک ساعت برای محوطه کافی است، هرچند نقاشی‌ها وقت بیشتری می‌طلبند. فضای داخل تنها با نور روز روشن می‌شود، پس بهترین زمان میانهٔ روزی صاف است؛ عصر ابری دیوارها تقریباً چیزی نشان نمی‌دهند. عکاسی ممکن است محدود باشد، نخست بپرسید. زنان به روسری و دامن بلند و مردان به شلوار بلند نیاز دارند؛ پوشش‌ها معمولاً کنار در گذاشته شده‌اند. سرویس بهداشتی ساده است و در محوطه خوراکی نیست؛ نزدیک‌ترین کافه‌ها در تساگوری و باکوریانی‌اند.
  route: >-
    از تفلیس با بزرگراه E60 تا خاشوری و سپس از بورجومی جادهٔ باکوریانی را دنبال کنید. بعد از تساگوری تابلوی تیموتسوبانی هست: انحراف به چپ و سرازیری به درهٔ فرعی. مجموع ۱۸۰ کیلومتر و حدود دو ساعت و چهل‌وپنج دقیقه. جادهٔ اصلی آسفالت است و دو کیلومتر پایانی باریک و جابه‌جا خراب، اما با خودروی معمولی کاملاً قابل عبور. کنار دروازهٔ صومعه محوطهٔ کوچکی برای پارک هست. سوخت را در بورجومی بگیرید.
he:
  name: מנזר טימותסובני
  short: >-
    כנסיית לבנים מימי המלכה תמר בצד הדרך מבורג'ומי לבקוריאני, ובה מחזור ציורי קיר שלם להפליא מן המאה ה-13.
  body: >-
    **בטימותסובני שמורים ציורי הקיר הטובים ביותר בכל סמצחה,** והכנסייה עצמה נדירה בארכיטקטורה הגאורגית של ימי הביניים: היא בנויה לא מאבן אלא מלבנים בגוון ורוד.


    הכנסייה המרכזית, המוקדשת להירדמות הבתולה, נבנתה בין 1195 ל-1215, כלומר בדיוק בימי מלכותה של תמר. הפטרון היה שלווה אחלציחלי מבית טורלי, אחד המפקדים בקרב בסיאני. התוכנית היא צלב-בריבוע מכופף, עם תוף גבוה ומידתי, ומשטח הלבנים מקבל באור השמש גוון חמים וכמעט ורדרד.


    אבל הסיבה לבוא נמצאת בפנים. הציורים מתוארכים לשנים 1205 עד 1215 בקירוב ומהווים אחד המכלולים השלמים ביותר של הציור המונומנטלי הגאורגי בתור הזהב: רקעים בכחול עמוק, דמויות גדולות ושלוות, מחזור אוונגליוני מלא ודיוקנאות התורמים. בשנות האלפיים שימר צוות גאורגי-איטלקי את הציורים, וכיום אפשר לקרוא אותם הרבה יותר טוב מאשר לפני שלושים שנה.


    לבנים מעולם לא היו חומר בנייה נפוץ בגאורגיה, וטימותסובני היא ההדגמה הברורה ביותר ששרדה ליכולתם של הבנאים המקומיים בחומר הזה. הקירות מונחים בנדבכים אחידים, והעיטור — קשתות עיוורות ודוגמאות גיאומטריות פשוטות — מושג אך ורק דרך המקצב של הנדבכים, בלי שום אבן מגולפת.


    בחצר עומדים גם קפלה קטנה, מגדל פעמונים מאוחר ויסודות מבני המנזר. המנזר פעיל ונזירים חיים בו, ולכן השקט כאן אינו בקשה אלא מובן מאליו.


    גם המקום עצמו עוזר. הכנסייה עומדת בעמק גוג'רתי בגובה של כאלף מטר, על הקו שבו יער האורנים מתחלף ביער עלים, וכמעט אף פעם אין כאן צפיפות. רוב הנוסעים בדרך לבקוריאני חולפים על פניה בלי לדעת ששני קילומטרים הצידה עומדת אחת היצירות החשובות ששרדו מן הציור הגאורגי של ימי הביניים.
  tip: >-
    שעה מספיקה לאתר, אם כי הפרסקאות מתגמלות שהייה ארוכה יותר. הפנים מואר באור יום בלבד, ולכן הזמן הטוב ביותר הוא אמצע יום בהיר; בערב מעונן הקירות כמעט אינם נקראים. ייתכנו מגבלות צילום, אז שאלו תחילה. נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים למכנסיים ארוכים; כיסויים מונחים בדרך כלל ליד הדלת. השירותים בסיסיים ואין אוכל באתר, בתי הקפה הקרובים הם בצגברי ובבקוריאני.
  route: >-
    מטביליסי בכביש E60 עד חשורי, ומשם דרך בורג'ומי בדרך לבקוריאני. אחרי צגברי יש שילוט לטימותסובני, פנייה שמאלה ויורדת אל עמק צדדי. בסך הכול 180 ק״מ, כשעתיים וארבעים וחמש דקות. הדרך הראשית סלולה, ושני הקילומטרים האחרונים צרים ושבורים במקומות אך עבירים לחלוטין ברכב רגיל. ליד שער המנזר יש מגרש קטן לחניה. תדלקו בבורג'ומי.
ar:
  name: دير تيموتيسوباني
  short: >-
    كنيسة من الآجر من عهد الملكة تامار قرب طريق بورجومي-باكورياني، وفيها مجموعة نادرة الاكتمال من رسوم القرن الثالث عشر.
  body: >-
    **في تيموتيسوباني أفضل رسوم جدارية محفوظة في سامتسخه كلها،** والكنيسة نفسها نادرة في العمارة الجورجية الوسيطة: فهي مبنية لا بالحجر بل بالآجر الوردي.


    شُيدت الكنيسة الرئيسية، المكرسة لرقاد العذراء، بين عامي 1195 و1215، أي في عهد الملكة تامار بالضبط. وكان واقفها شالفا أخالتسيخيلي من بيت توريلي، وأحد قادة معركة باسياني. والمخطط صليبي مقبب بساق عالية متناسبة، ويكتسب سطح الآجر في الشمس لوناً دافئاً يكاد يكون وردياً.


    غير أن سبب المجيء في الداخل. تعود الرسوم إلى نحو عامي 1205 و1215 وتشكل واحدة من أكمل مجموعات التصوير الجداري الجورجي في العصر الذهبي: أرضيات زرقاء عميقة، وشخوص كبيرة هادئة، ودورة إنجيلية كاملة، وصور الواقفين. وفي العقد الأول من هذا القرن رمّم فريق جورجي إيطالي هذه الرسوم، وصارت اليوم أوضح بكثير مما كانت قبل ثلاثين عاماً.


    لم يكن الآجر يوماً مادة بناء شائعة في جورجيا، وتيموتيسوباني أوضح ما بقي من برهان على ما كان يصنعه البناؤون المحليون به. فالجدران مرصوفة بمداميك متساوية، والزخرفة — عقود عمياء ورسوم هندسية بسيطة — متأتية من إيقاع الرصف وحده، بلا حجر منحوت البتة.


    وفي الفناء أيضاً مصلى صغير وبرج أجراس متأخر وأساسات مبانٍ رهبانية. والدير عامر يسكنه رهبان، فالصمت هنا ليس رجاءً بل عرفاً.


    ويعين المكان نفسه على ذلك. تقوم الكنيسة في وادي غوجاريتي على ارتفاع نحو ألف متر، عند الخط الذي تتحول عنده غابة الصنوبر إلى غابة عريضة الأوراق، ونادراً ما تزدحم. ومعظم السيارات على طريق باكورياني تمر من جانبها دون أن تعلم أن على بعد كيلومترين واحداً من أهم ما بقي من التصوير الجورجي في العصور الوسطى.
  tip: >-
    ساعة تكفي للموقع، وإن كانت الرسوم تستحق وقتاً أطول. لا يضيء الداخل إلا ضوء النهار، فأفضل وقت هو منتصف يوم صافٍ؛ أما في مساء غائم فالجدران لا تُقرأ تقريباً. وقد يكون التصوير مقيداً، فاسأل أولاً. تحتاج النساء إلى غطاء رأس وتنورة طويلة والرجال إلى بنطال طويل؛ والأغطية موضوعة عادة عند الباب. دورة المياه بسيطة ولا طعام في الموقع، وأقرب المقاهي في تساغفيري وباكورياني.
  route: >-
    من تبليسي على الطريق E60 حتى خاشوري، ثم عبر بورجومي على طريق باكورياني. وبعد تساغفيري لافتة تدل على تيموتيسوباني: انعطاف يساراً ونزول إلى الوادي الجانبي. المجموع 180 كم ونحو ساعتين وخمس وأربعين دقيقة. الطريق الرئيسي معبّد، والكيلومتران الأخيران ضيقان ومتضرران في مواضع لكنهما سالكان تماماً بسيارة عادية. وعند بوابة الدير ساحة صغيرة للوقوف. تزوّد بالوقود في بورجومي.
