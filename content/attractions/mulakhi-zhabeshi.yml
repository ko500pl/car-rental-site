ka:
  name: მულახი და ჟაბეში
  short: >-
    სვანური კოშკების სოფლები მულხურის ხეობაში, თეთნულდის ძირას — მესტია–უშგულის ლაშქრობის პირველი ღამე
    ოჯახურ სასტუმროში, კოშკის ჩრდილში.
  body: >-
    **მულახში კოშკები მუზეუმის ექსპონატები არ არის: მათ ჩრდილში სარეცხი შრება, ძირას კი ლაშქრობით დაღლილი
    მოგზაურები იძინებენ.**


    მულახი სვანური სოფლების თემია მდინარე მულხურის ხეობაში, მესტიის აღმოსავლეთით: ლახირი, ჩოლაში, მაჟვდიერი,
    ჭვაბიანი, წალდაში და, ზღვის დონიდან დაახლოებით 1600 მეტრზე, ჟაბეში. ყველა მათგანს თეთნულდი დაჰყურებს
    — 4852 მეტრი კლდე და ყინული; ბილიკიდან მას ცაზე უშბა და გისტოლაც ემატება.


    მოგზაურთა უმეტესობისთვის აქ მესტია–უშგულის კლასიკური ლაშქრობის პირველი დღე სრულდება: მესტიიდან 17
    კილომეტრი და ექვს-შვიდსაათიანი სიარული გვალდის უღელტეხილის (დაახლოებით 2000 მ) გადავლით. ადგილობრივმა
    ოჯახებმა საკუთარი სახლები სასტუმროებად აქციეს, ასე რომ, ვახშამს ეზოში მიირთმევთ, სადაც ყველაზე გრძელ
    ჩრდილს ისევ შუა საუკუნეების საგუშაგო კოშკი ჰფენს.


    ჟაბეშში მოძებნეთ მაცხოვრის ეკლესია — XI საუკუნის ძეგლი, რომელსაც ქართული ხუროთმოძღვრების გამორჩეულ
    ნიმუშად მიიჩნევენ. სოფლის ზემოთ, დაახლოებით 2230 მეტრზე, ლამარიას ეკლესია დგას; ლამარია სვანურად ღვთისმშობელს
    ჰქვია. იქამდე ციცაბო, დაუნდობელი აღმართი ადის, სამაგიეროდ ზემოდან თეთნულდი და უშბა პირისპირ დგანან,
    მათ ძირას კი წანერისა და ტვიბერის მყინვარები მოჩანს.


    მულახს ერთი დიდი, სავიზიტო ბარათად ქცეული ძეგლი არ აქვს და არც იჩემებს. მდინარე წანერულაზე გადებული
    ხიდის ზემოთ მარტოხელა საგუშაგო კოშკი დგას, დანარჩენი კი ჩვეულებრივი სვანური ცხოვრებაა. სწორედ მისთვის
    ჩამოდით: როცა შებინდებისას საქონელი შინ ბრუნდება, ბუხრის კვამლი ეზოებზე იფინება და თეთნულდის თოვლს
    ბოლო სხივი სტოვებს.
  tip: >-
    შესვლა თავისუფალია, მაგრამ ეს ცოცხალი სოფელია: ადამიანების ან ეზოების გადაღებამდე ნებართვა ითხოვეთ.
    ივლის-აგვისტოში ოჯახური სასტუმრო წინასწარ დაჯავშნეთ; ჟაბეშში კარვის გასაშლელი ადგილებიც არის. საწვავი
    ბოლოს მესტიაშია, ნაღდი ფულიც იქვე მოიმარაგეთ. ლამარიამდე ასვლა დილაადრიან დაიწყეთ, წყალი თან იქონიეთ
    — შუადღისთვის მთებზე ხშირად ღრუბელი იყრის თავს. გვალდის უღელტეხილზე თოვლი გვიან გაზაფხულამდე დევს,
    ამიტომ ფეხით გადასვლისთვის საუკეთესო დრო მაისიდან ოქტომბრამდეა; ზამთარში აქ მხოლოდ მანქანით, მესტიის
    გზით ამოხვალთ, ისიც ამინდის მიხედვით.
  route: >-
    თბილისიდან ჟაბეშამდე დაახლოებით 464 კილომეტრია. ს1 (E60) მაგისტრალით დასავლეთით, ქუთაისის გავლით,
    ზუგდიდამდე იარეთ, შემდეგ შ7-ით ჩრდილოეთით, ჯვრისა და ენგურის კაშხლის გავლით, მესტიამდე აუყევით ხეობას.
    ზუგდიდი–მესტიის 130 კილომეტრი ასფალტია, მაგრამ ვიწრო და კლაკნილი — სამი საათი ჩათვალეთ. მესტიიდან
    იმავე შ7-ით, უშგულის მიმართულებით, კიდევ 13–15 კილომეტრი და ნახევარი საათია: გზა მულახის გადასახვევამდე
    მყარი საფარითაა, სოფლის ბოლო ერთი-ორი კილომეტრი კი ხრეშიანი და ციცაბოა. სულ ცხრა-ათი საათი; ჯობს,
    მგზავრობა ზუგდიდში ან მესტიაში გაწყვიტოთ. საწვავი ბოლოს მესტიაში ჩაასხით. გირჩევთ ჯიპს: ვიწრო მთის
    გზასა და ხრეშიან აღმართებზე მაღალი კლირენსი გამოგადგებათ.
en:
  name: Mulakhi and Zhabeshi
  short: >-
    Svan tower-hamlets along the Mulkhura under Tetnuldi — the first night of the Mestia–Ushguli trek,
    in family guesthouses beside the towers.
  body: >-
    **In Mulakhi the towers are not museum pieces: washing dries in their shadow, and trekkers sleep in
    the farmhouses at their feet.**


    Mulakhi is a community of small Svan hamlets strung up the Mulkhura river east of Mestia — Lakhiri,
    Cholashi, Majvdieri, Chvabiani, Tsaldashi and, at about 1,600 metres, Zhabeshi. Over all of them stands
    Tetnuldi, 4,852 metres of rock and ice; from the trail, Ushba and Gistola join it on the skyline.


    For most visitors this is the end of day one on the classic Mestia–Ushguli trek: 17 km and six to
    seven hours on foot from Mestia, over the Gvaldi pass at roughly 2,000 metres. Families here have
    turned their homes into guesthouses, so supper comes in a farmyard where a medieval defensive tower
    still throws the longest shadow.


    In Zhabeshi, look for the Church of the Saviour, dated to the 11th century and counted among the finer
    works of Georgian architecture. High above the village, at about 2,230 metres, stands the church of
    Lamaria — the Svan name for the Mother of God. The path up is steep and relentless; the reward is
    Tetnuldi and Ushba face to face, with the ice of the Tsaneri and Tviberi glaciers below them.


    Mulakhi has no single headline monument, and does not pretend to. A lone watchtower stands above the
    bridge over the Tsanerula stream; the rest is ordinary Svan life. Come for exactly that: cattle ambling
    home at dusk, woodsmoke drifting across the yards, and the last light leaving the snows of Tetnuldi.
  tip: >-
    There is no fee, but this is a living village: ask before photographing people or walking into yards.
    In July and August book your guesthouse ahead; Zhabeshi also has spots for tents. Mestia is the last
    place for fuel and cash. Start the climb to Lamaria early and carry water — clouds often gather on
    the peaks by midday. Snow lingers on the Gvaldi pass into late spring, so the walking season is May
    to October; in winter you can only come up by road from Mestia, and only when the weather allows.
  route: >-
    Zhabeshi is about 464 km from Tbilisi. Take the S1 (E60) west past Kutaisi to Zugdidi, then the Sh7
    north past Jvari and the Enguri dam and up the gorge to Mestia. The 130 km from Zugdidi to Mestia
    are paved but narrow and winding — allow three hours. From Mestia stay on the Sh7 towards Ushguli
    for another 13–15 km, about half an hour: the road is surfaced as far as the Mulakhi turn, and only
    the last kilometre or two of village lane is steep gravel. Budget nine to ten hours, ideally with
    a night in Zugdidi or Mestia; fill up in Mestia. An SUV is the sensible class: narrow mountain road,
    steep gravel at the end.
ru:
  name: Мулахи и Жабеши
  short: >-
    Сванские хутора с башнями вдоль Мулхуры под Тетнульди — первая ночёвка на треке Местиа — Ушгули, в
    семейных гостевых домах у самых башен.
  body: >-
    **В Мулахи башни — не музейные экспонаты: в их тени сохнет бельё, а у их подножия, в крестьянских
    домах, ночуют путники с трека.**


    Мулахи — община небольших сванских селений, нанизанных на реку Мулхуру к востоку от Местиа: Лахири,
    Чолаши, Мажвдиери, Чвабиани, Цалдаши и, на высоте около 1600 метров, Жабеши. Над всеми ними возвышается
    Тетнульди — 4852 метра камня и льда; с тропы к нему на горизонте присоединяются Ушба и Гистола.


    Для большинства гостей здесь заканчивается первый день классического трека Местиа — Ушгули: 17 км
    и шесть-семь часов пешком от Местиа через перевал Гвалди на высоте примерно 2000 метров. Местные семьи
    превратили свои дома в гостевые, так что ужинать вы будете во дворе крестьянской усадьбы, где самую
    длинную тень по-прежнему отбрасывает средневековая оборонительная башня.


    В Жабеши разыщите церковь Спаса — её датируют XI веком и причисляют к лучшим образцам грузинской архитектуры.
    Высоко над селом, примерно на 2230 метрах, стоит церковь Ламария — так сваны называют Богородицу.
    Тропа наверх крутая и не даёт передышки; награда — Тетнульди и Ушба прямо перед вами, а под ними лёд
    ледников Цанери и Твибери.


    У Мулахи нет одного громкого памятника, и он не делает вид, что есть. Над мостом через ручей Цанерула
    стоит одинокая сторожевая башня; всё остальное — обычная сванская жизнь. Ради неё и приезжайте: в
    сумерках скот неспешно бредёт домой, над дворами стелется дым очагов, а последний свет уходит со снегов
    Тетнульди.
  tip: >-
    Платы за вход нет, но это живое село: прежде чем фотографировать людей или заходить во дворы, спросите
    разрешения. В июле и августе бронируйте гостевой дом заранее; в Жабеши есть и места для палаток. Местиа
    — последний пункт, где можно заправиться и раздобыть наличные. К Ламарии выходите пораньше и берите
    воду: к полудню на вершинах часто собираются облака. Снег на перевале Гвалди лежит до поздней весны,
    поэтому пеший сезон длится с мая по октябрь; зимой сюда можно подняться только по дороге из Местиа
    — и лишь когда позволяет погода.
  route: >-
    От Тбилиси до Жабеши около 464 км. Поезжайте по S1 (E60) на запад мимо Кутаиси до Зугдиди, затем по
    Sh7 на север — через Джвари, мимо Ингурской плотины и вверх по ущелью до Местиа. 130 км от Зугдиди
    до Местиа заасфальтированы, но дорога узкая и извилистая — закладывайте три часа. От Местиа продолжайте
    по Sh7 в сторону Ушгули ещё 13–15 км, около получаса: твёрдое покрытие тянется до самого поворота
    на Мулахи, и лишь последние один-два километра сельской дороги — крутой гравий. Всего рассчитывайте
    на девять-десять часов, лучше с ночёвкой в Зугдиди или Местиа; заправьтесь в Местиа. Разумный выбор
    — внедорожник: узкая горная дорога, в конце крутой гравий.
fa:
  name: مولاخی و ژابشی
  short: >-
    آبادی‌های برج‌دار سوان در کنار رود مولخورا، زیر تتنولدی — منزل نخستین شبِ پیاده‌روی مستیا–اوشگولی،
    در مهمان‌خانه‌های خانوادگی کنار برج‌ها.
  body: >-
    **در مولاخی برج‌ها اشیای موزه نیستند: در سایه‌شان رخت خشک می‌شود و پای آن‌ها، در خانه‌های روستایی،
    کوه‌پیمایان شب را به صبح می‌رسانند.**


    مولاخی مجموعه‌ای از آبادی‌های کوچک سوانی است که در شرق مستیا، در امتداد رود مولخورا، پشت سر هم ردیف
    شده‌اند: لاخیری، چولاشی، ماژودیری، چوابیانی، تسالداشی و، در ارتفاع حدود ۱,۶۰۰ متر، ژابشی. بر فراز
    همهٔ آن‌ها تتنولدی ایستاده است — ۴,۸۵۲ متر صخره و یخ؛ از روی مسیر پیاده، اوشبا و گیستولا هم در افق
    به آن می‌پیوندند.


    برای بیشتر بازدیدکنندگان، اینجا پایان روز نخست پیاده‌روی کلاسیک مستیا–اوشگولی است: ۱۷ کیلومتر و شش
    تا هفت ساعت پیاده از مستیا، با گذر از گردنهٔ گوالدی در ارتفاع حدود ۲,۰۰۰ متر. خانواده‌های اینجا خانه‌هایشان
    را به مهمان‌خانه بدل کرده‌اند؛ پس شام را در حیاط مزرعه‌ای می‌خورید که هنوز بلندترین سایه‌اش را برجی
    دفاعی از سده‌های میانه می‌اندازد.


    در ژابشی سراغ کلیسای منجی را بگیرید که قدمتش را به سدهٔ یازدهم می‌رسانند و از آثار برجستهٔ معماری
    گرجی به شمار می‌آید. بسیار بالاتر از روستا، در حدود ۲,۲۳۰ متری، کلیسای لاماریا ایستاده است — لاماریا
    نام سوانیِ مادر خداست. راه بالا شیب‌دار و بی‌امان است؛ پاداشش تتنولدی و اوشبا در برابر چشمان شماست
    و زیر پایشان یخِ یخچال‌های تسانری و تویبری.


    مولاخی بنای شاخص یگانه‌ای ندارد و ادعایش را هم نمی‌کند. بالای پلِ رودک تسانرولا برج دیدبانی تنهایی
    ایستاده است؛ باقی، زندگی معمولی سوانی است. درست برای همین بیایید: گاوهایی که هنگام غروب آرام به خانه
    برمی‌گردند، دود هیزمی که روی حیاط‌ها می‌خزد، و آخرین روشنایی که از برف‌های تتنولدی رخت برمی‌بندد.
  tip: >-
    ورودیه‌ای در کار نیست، اما اینجا روستایی زنده است: پیش از عکس گرفتن از مردم یا پا گذاشتن به حیاط‌ها
    اجازه بگیرید. در ژوئیه و اوت مهمان‌خانه را از پیش رزرو کنید؛ در ژابشی جای برپا کردن چادر هم هست. مستیا
    آخرین جایی است که سوخت و پول نقد پیدا می‌شود. صعود به لاماریا را زود آغاز کنید و آب همراه داشته باشید
    — ابرها اغلب تا نیمروز روی قله‌ها جمع می‌شوند. برف تا اواخر بهار روی گردنهٔ گوالدی می‌ماند، پس فصل
    پیاده‌روی از مه تا اکتبر است؛ در زمستان تنها از راه جاده و از مستیا می‌توان بالا آمد، آن هم فقط وقتی
    هوا اجازه دهد.
  route: >-
    ژابشی حدود ۴۶۴ کیلومتر از تفلیس فاصله دارد. از S1 (E60) رو به غرب، از کنار کوتائیسی تا زوگدیدی بروید،
    سپس Sh7 را رو به شمال بگیرید: از جواری و کنار سد انگوری می‌گذرد و از تنگه تا مستیا بالا می‌رود. ۱۳۰
    کیلومترِ زوگدیدی تا مستیا آسفالت است، اما باریک و پرپیچ‌وخم — سه ساعت در نظر بگیرید. از مستیا روی
    همان Sh7 به سوی اوشگولی ۱۳ تا ۱۵ کیلومتر دیگر، حدود نیم ساعت، ادامه دهید: جاده تا دوراهی مولاخی روکش
    دارد و تنها یکی دو کیلومتر آخرِ راه روستایی شنی و پرشیب است. روی هم نه تا ده ساعت حساب کنید و بهتر
    است شبی در زوگدیدی یا مستیا بمانید؛ در مستیا باک را پر کنید. انتخاب معقول، کلاس شاسی‌بلند است: جادهٔ
    کوهستانی باریک و شیب شنی در پایان راه.
he:
  name: מולאחי וז'בשי
  short: >-
    כפרי מגדלים סוואניים לאורך נהר המולחורה למרגלות טטנולדי — הלינה הראשונה במסלול מסטיה–אושגולי, בבתי
    הארחה משפחתיים לצד המגדלים.
  body: >-
    **במולאחי המגדלים אינם מוצגים של מוזיאון: בצילם מתייבשת הכביסה, ולמרגלותיהם, בבתי האיכרים, ישנים המטיילים.**


    מולאחי היא קהילה של כפרונים סוואניים קטנים הפזורים לאורך נהר המולחורה ממזרח למסטיה: לאחירי, צ'ולאשי,
    מאז'בדיירי, צ'וובייאני, צלדאשי, ובגובה של כ-1,600 מטר — ז'בשי. מעל כולם מתנשא טטנולדי, 4,852 מטרים
    של סלע וקרח; מן השביל מצטרפים אליו בקו הרקיע גם אושבה וגיסטולה.


    לרוב המבקרים כאן מסתיים היום הראשון במסלול הקלאסי מסטיה–אושגולי: 17 ק״מ ושש עד שבע שעות הליכה ממסטיה,
    דרך מעבר גוואלדי בגובה של כ-2,000 מטר. המשפחות כאן הפכו את בתיהן לבתי הארחה, כך שארוחת הערב מוגשת
    בחצר משק שבה מגדל הגנה מימי הביניים עדיין מטיל את הצל הארוך ביותר.


    בז'בשי חפשו את כנסיית המושיע, המתוארכת למאה ה-11 ונמנית עם היצירות המשובחות של האדריכלות הגאורגית.
    הרחק מעל הכפר, בגובה של כ-2,230 מטר, עומדת כנסיית למאריה — כך קוראים הסוואנים לאם האלוהים. השביל למעלה
    תלול ואינו מרפה; השכר הוא טטנולדי ואושבה פנים אל פנים, ומתחתיהם הקרח של קרחוני צאנרי וטוויברי.


    למולאחי אין אתר דגל אחד, והיא גם אינה מעמידה פנים שיש לה. מעל הגשר שעל פלג צאנרולה עומד מגדל שמירה
    בודד; כל השאר הוא חיי היומיום של סוואנטי. בואו בדיוק בשבילם: הבקר משתרך הביתה בין הערביים, עשן העצים
    נישא מעל החצרות, והאור האחרון נפרד משלגי טטנולדי.
  tip: >-
    אין דמי כניסה, אבל זהו כפר חי: בקשו רשות לפני שאתם מצלמים אנשים או נכנסים לחצרות. ביולי ובאוגוסט הזמינו
    בית הארחה מראש; בז'בשי יש גם מקומות לאוהלים. מסטיה היא המקום האחרון לתדלוק ולמשיכת מזומן. צאו מוקדם
    לעלייה ללמאריה וקחו מים — עננים מתקבצים לעיתים קרובות על הפסגות עד הצהריים. השלג נשאר על מעבר גוואלדי
    עד סוף האביב, ולכן עונת ההליכה היא ממאי עד אוקטובר; בחורף אפשר להגיע לכאן רק בכביש ממסטיה, וגם זה
    רק כשמזג האוויר מאפשר.
  route: >-
    ז'בשי נמצאת כ-464 ק״מ מטביליסי. סעו בכביש S1 (E60) מערבה, על פני קוטאיסי, עד זוגדידי, ומשם בכביש Sh7
    צפונה — דרך ג'וארי, על פני סכר אנגורי ובמעלה הערוץ עד מסטיה. 130 הקילומטרים מזוגדידי למסטיה סלולים,
    אך צרים ומפותלים — הקדישו להם שלוש שעות. ממסטיה המשיכו ב-Sh7 לכיוון אושגולי עוד 13–15 ק״מ, כחצי שעה:
    הכביש מצופה עד הפנייה למולאחי, ורק הקילומטר או השניים האחרונים של דרך הכפר הם חצץ תלול. חשבו תשע עד
    עשר שעות בסך הכול, רצוי עם לינה בזוגדידי או במסטיה; תדלקו במסטיה. הבחירה הנבונה היא רכב שטח: כביש
    הרים צר, ובסופו חצץ תלול.
ar:
  name: مولاخي وجابيشي
  short: >-
    قرى سفانية ذات أبراج على ضفاف نهر مولخورا تحت قمة تيتنولدي — محطة الليلة الأولى في مسار ميستيا–أوشغولي،
    في بيوت ضيافة عائلية بجوار الأبراج.
  body: >-
    **في مولاخي ليست الأبراج قطعاً متحفية: في ظلها يجفّ الغسيل، وعند أقدامها، في بيوت الفلاحين، ينام المتنزهون.**


    مولاخي تجمّع لقرى سفانية صغيرة تنتظم على طول نهر مولخورا شرقي ميستيا: لاخيري وتشولاشي وماجفديري وتشفابياني
    وتسالداشي، ثم جابيشي على ارتفاع نحو 1,600 متر. وفوقها جميعاً تنتصب تيتنولدي، 4,852 متراً من الصخر
    والجليد؛ ومن الدرب تنضم إليها أوشبا وغيستولا في خط الأفق.


    لمعظم الزوار، هنا ينتهي اليوم الأول من المسار الكلاسيكي بين ميستيا وأوشغولي: 17 كم وست إلى سبع ساعات
    سيراً من ميستيا، عبر ممر غفالدي على ارتفاع نحو 2,000 متر. وقد حوّلت العائلات هنا بيوتها إلى دور ضيافة،
    فيُقدَّم العشاء في فناء مزرعة ما زال برج دفاعي من العصور الوسطى يلقي فيه أطول الظلال.


    في جابيشي ابحث عن كنيسة المخلّص، المؤرخة بالقرن الحادي عشر والمعدودة بين أرقى أعمال العمارة الجورجية.
    وعالياً فوق القرية، على ارتفاع نحو 2,230 متراً، تقوم كنيسة لاماريا — وهو الاسم السفاني لوالدة الإله.
    الدرب إليها شديد الانحدار لا يمنحك استراحة؛ والمكافأة تيتنولدي وأوشبا وجهاً لوجه، وتحتهما جليد نهرَي
    تسانيري وتفيبيري الجليديين.


    ليس لمولاخي معلم واحد يتصدّر المشهد، ولا هي تدّعي ذلك. فوق الجسر المقام على جدول تسانيرولا يقف برج
    مراقبة وحيد؛ وما عدا ذلك حياة سفانية عادية. تعالَ من أجلها تحديداً: ماشية تعود على مهل عند الغسق،
    ودخان الحطب ينساب فوق الأفنية، وآخر الضوء يغادر ثلوج تيتنولدي.
  tip: >-
    لا رسوم دخول، لكنها قرية مأهولة: استأذن قبل تصوير الناس أو دخول الأفنية. في يوليو وأغسطس احجز بيت
    الضيافة مسبقاً؛ وفي جابيشي أماكن للخيام أيضاً. ميستيا آخر مكان للتزود بالوقود والنقد. ابدأ الصعود
    إلى لاماريا باكراً واحمل الماء، فكثيراً ما تتجمع الغيوم على القمم مع اقتراب الظهر. يبقى الثلج على
    ممر غفالدي حتى أواخر الربيع، لذا يمتد موسم المشي من مايو إلى أكتوبر؛ أما في الشتاء فلا سبيل إلى هنا
    إلا بالطريق من ميستيا، وحين يسمح الطقس فقط.
  route: >-
    تبعد جابيشي عن تبليسي نحو 464 كم. اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي حتى زوغديدي، ثم الطريق
    Sh7 شمالاً عبر جفاري بمحاذاة سد إنغوري صعوداً في المضيق حتى ميستيا. الكيلومترات الـ130 بين زوغديدي
    وميستيا معبّدة لكنها ضيقة ومتعرجة، فاحسب لها ثلاث ساعات. ومن ميستيا تابع على Sh7 باتجاه أوشغولي مسافة
    13–15 كم أخرى، نحو نصف ساعة: الطريق ذو سطح صلب حتى منعطف مولاخي، ولا يبقى إلا كيلومتر أو اثنان أخيران
    من درب القرية بالحصى وبانحدار شديد. قدّر تسع إلى عشر ساعات إجمالاً، ويُستحسن المبيت في زوغديدي أو
    ميستيا؛ واملأ الخزان في ميستيا. والخيار المعقول سيارة دفع رباعي: طريق جبلي ضيق وحصى شديد الانحدار
    في آخره.
