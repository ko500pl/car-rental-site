ka:
  name: გაბრიაძის თეატრი და საათის კოშკი
  short: >-
    შავთელის ქუჩაზე მიდრეკილი საათის კოშკი, საიდანაც ყოველ საათში ანგელოზი გამოდის, და მის გვერდით — რეზო
    გაბრიაძის ოთხმოცადგილიანი მარიონეტების თეატრი.
  body: >-
    **შავთელის ქუჩის პატარა თეატრი ლათინური დევიზით ცხოვრობს: Extra cepam nihil cogito nos lacrimare —
    „ცრემლი მხოლოდ ხახვის დაჭრისას დავღვაროთ“.** ეს რეზო გაბრიაძის (1936–2021) მთელი ფილოსოფიაა ერთ სტრიქონში,
    თეატრის გვერდით კი თბილისის ყველაზე უცნაური ხუმრობა დგას.


    ეს საათის კოშკია — მიდრეკილი, თითქოს ნამტვრევებისგან აწყობილი სვეტი, გაბრიაძის ესკიზებით აშენებული
    და მისივე კერამიკული პანოებით მორთული. 2010 წლიდან მის წინ ხალხი არ იკლებს. ისე გამოიყურება, თითქოს
    საუკუნეებია აქ დგას და ცოტა შეზარხოშებულიცაა. ყოველ საათში მოხატული კარი იღება, ანგელოზი გამოდის და
    ჩაქუჩით ზარს ჩამოჰკრავს. დღეში ორჯერ ზემოთ პატარა სარკმელი იხსნება და „სიცოცხლის წრე“ იწყება — უსიტყვო
    თოჯინური წარმოდგენა ადამიანის მთელ ცხოვრებაზე. 2019 წელს „ატლას ობსკურამ“ ეს კოშკი მსოფლიოს ყველაზე
    ცნობილ მონუმენტურ საათებს შორის დაასახელა.


    მარიონეტების თეატრი გაბრიაძემ 1981 წელს დააარსა, მანამდე კი საბჭოთა კინოს ერთ-ერთი საუკეთესო სცენარისტი
    იყო — „მიმინო“ და „კინ-ძა-ძა!“ მან გიორგი დანელიასთან ერთად დაწერა. დარბაზში სულ 80 მაყურებელი ეტევა.
    მისი თოჯინები ავინიონში, ედინბურგში, ნიუ-იორკსა და ტორონტოში თამაშობდნენ; შინ დღესაც დგამენ „ჩემი
    გაზაფხულის შემოდგომას“, „რამონასა“ და „ალფრედსა და ვიოლეტას“ — ახლა უკვე მისი ვაჟის, ლევან (ლეო) გაბრიაძის
    ხელმძღვანელობით.


    თეატრთან კაფეცაა, იმავე სულისკვეთებით მოწყობილი, და ანჩისხატის ბაზილიკაც სულ რამდენიმე ნაბიჯშია. საათის
    დარეკვამდე ხუთი წუთით ადრე ხალხში დადექით და ანგელოზს დაელოდეთ. მაშინ მიხვდებით, რატომ ამჯობინა კაცმა,
    რომელმაც სიცოცხლე თოჯინებს მიუძღვნა, ცრემლი მხოლოდ ხახვისთვის დაეთმო.
  tip: >-
    ანგელოზი ყოველ საათში გამოდის; თოჯინური წარმოდგენისთვის, რომელიც ტრადიციულად შუადღისას და საღამოს
    შვიდზე იმართება, რამდენიმე წუთით ადრე მიდით (დრო კაფეში დააზუსტეთ). კოშკის ნახვა უფასოა, ქუჩიდან.
    სპექტაკლის ბილეთები სწრაფად იყიდება — სეზონში რამდენიმე კვირით ადრე დაჯავშნეთ: დარბაზი 80-ადგილიანია
    და დაგვიანებულებს შეიძლება აღარ შეუშვან. გადაამოწმეთ, აქვს თუ არა თქვენს სპექტაკლს სუბტიტრები. თეატრი
    კულისებში ექსკურსიებსა და კერამიკის მოხატვის მასტერკლასებსაც მართავს — კარგი ალტერნატივაა, თუ ბილეთები
    გაიყიდა. საათის დარეკვისას შავთელის ქუჩა ხალხით ივსება — ჩანთას თვალი ადევნეთ.
  route: >-
    თეატრი თავისუფლების მოედნიდან დაახლოებით 1 კილომეტრშია, იოანე შავთელის ქუჩის 13 ნომერში, მაგრამ მანქანა
    კარამდე ვერ მიგიყვანთ: შავთელის ქუჩა ვიწროა და ნაწილობრივ საფეხმავლო. მარცხენა სანაპიროზე გადადით,
    მანქანა რიყის პარკის სადგომზე დატოვეთ და მშვიდობის ხიდით გადმოდით — კოშკამდე დაახლოებით შვიდი წუთის
    სავალია. სათადარიგო ვარიანტია ფასიანი ადგილები ბარათაშვილის აღმართზე. საღამოს სპექტაკლის დროს რიყეზე
    ადგილი ჩვეულებრივ იშოვება. ნებისმიერი ეკონომკლასის მანქანა გამოდგება — აქ ცხენის ძალა კი არა, კომფორტული
    ფეხსაცმელი გჭირდებათ.
en:
  name: Gabriadze Theatre and Clock Tower
  short: >-
    A leaning clock tower on Shavteli Street where an angel steps out every hour, and beside it Rezo Gabriadze's
    eighty-seat marionette theatre.
  body: >-
    **The tiny theatre on Shavteli Street lives by a Latin motto: Extra cepam nihil cogito nos lacrimare
    — let tears flow only from chopping onions.** It is the whole philosophy of Rezo Gabriadze (1936–2021)
    in a single line, and next door stands the strangest joke in Tbilisi.


    That joke is the clock tower: a leaning, patched-together column built to Gabriadze's sketches and
    set with his own ceramic panels, drawing crowds since 2010. It looks centuries old and slightly tipsy.
    On the hour, painted doors swing open and an angel steps out to strike the bell with a hammer. Twice
    a day a small window higher up opens on The Circle of Life, a wordless puppet play about a whole human
    life. In 2019 Atlas Obscura listed it among the world's iconic monumental clocks.


    Gabriadze founded his marionette theatre in 1981, after years as one of Soviet cinema's great screenwriters
    — Mimino and Kin-dza-dza! are his, written with the director Georgiy Daneliya. The hall seats just
    80. His puppets have played Avignon, Edinburgh, New York and Toronto; at home they still perform The
    Autumn of My Springtime, Ramona and Alfred and Violetta, now under his son Levan (Leo) Gabriadze.


    The theatre has its own café, fitted out in the same spirit, and Anchiskhati Basilica is only a few
    steps along the street. Stand in the crowd five minutes before the hour and wait for the angel. You
    will see why a man who gave his life to puppets preferred to leave the tears to the onions.
  tip: >-
    The angel appears every hour; for the puppet play, traditionally at noon and 7pm, arrive a few minutes
    early (confirm the times at the café). The tower is free and seen from the street. Performance tickets
    go fast — book weeks ahead in season, since the hall holds only 80 and latecomers may not be admitted.
    Check whether your show has surtitles. The theatre also runs backstage tours and ceramic-painting
    masterclasses, a good plan B if performances are sold out. Shavteli Street packs tight around the
    hour: keep an eye on your bag.
  route: >-
    The theatre is about 1 km from Freedom Square, at 13 Ioane Shavteli Street, but your car should stop
    well short of it: Shavteli is narrow and partly pedestrian. Cross to the left bank, leave the car
    at the Rike Park car park and walk back over the Bridge of Peace — about seven minutes to the tower.
    The fallback is the paid bays on the Baratashvili rise. For evening performances there is usually
    space at Rike. Any economy car will do; what you need here is not horsepower but comfortable shoes.
ru:
  name: Театр Габриадзе и часовая башня
  short: >-
    Кривая часовая башня на улице Шавтели, из которой каждый час выходит ангел, а рядом — кукольный театр
    Резо Габриадзе на восемьдесят мест.
  body: >-
    **Крошечный театр на улице Шавтели живёт под латинским девизом: Extra cepam nihil cogito nos lacrimare
    — пусть слёзы льются только от нарезанного лука.** В одной строке — вся философия Резо Габриадзе (1936–2021),
    а рядом с театром стоит самая странная шутка Тбилиси.


    Эта шутка — часовая башня: кривая, будто собранная из заплат колонна, построенная по эскизам Габриадзе
    и украшенная его собственными керамическими панно; с 2010 года она собирает толпы. Выглядит она так,
    словно ей несколько веков и она слегка навеселе. Каждый час распахиваются расписные дверцы, выходит
    ангел и бьёт молоточком в колокол. Дважды в день выше открывается окошко, и в нём идёт «Круговорот
    жизни» — кукольный спектакль без слов о целой человеческой жизни. В 2019 году сайт «Атлас Обскура»
    включил башню в число самых знаковых монументальных часов мира.


    Габриадзе основал свой театр марионеток в 1981 году, после многих лет в ряду великих сценаристов советского
    кино: «Мимино» и «Кин-дза-дза!» написаны им вместе с режиссёром Георгием Данелией. Зал вмещает всего
    80 зрителей. Его куклы играли в Авиньоне, Эдинбурге, Нью-Йорке и Торонто; дома они и сейчас играют
    «Осень моей весны», «Рамону» и «Альфреда и Виолетту» — теперь под руководством его сына Левана (Лео)
    Габриадзе.


    При театре есть своё кафе, оформленное в том же духе, а до базилики Анчисхати — несколько шагов по
    улице. Встаньте в толпу за пять минут до боя часов и дождитесь ангела. Вы поймёте, почему человек,
    отдавший жизнь куклам, предпочёл оставить слёзы луку.
  tip: >-
    Ангел появляется каждый час; кукольный спектакль в окошке по традиции идёт в полдень и в 19:00 — приходите
    на несколько минут раньше (время уточните в кафе). Смотреть на башню можно бесплатно, прямо с улицы.
    Билеты на спектакли разлетаются быстро: в сезон бронируйте за несколько недель — в зале всего 80 мест,
    а опоздавших могут не пустить. Проверьте, есть ли на вашем спектакле субтитры. Театр проводит и экскурсии
    за кулисы, и мастер-классы по росписи керамики — хороший запасной план, если билетов нет. Перед боем
    часов на Шавтели становится тесно: следите за сумкой.
  route: >-
    Театр примерно в 1 км от площади Свободы, на улице Иоане Шавтели, 13, но машину стоит оставить задолго
    до него: Шавтели узкая и частично пешеходная. Переезжайте на левый берег, оставьте машину на парковке
    парка Рике и вернитесь пешком по мосту Мира — до башни около семи минут. Запасной вариант — платные
    места на подъёме Бараташвили. На вечерние спектакли у Рике обычно есть свободные места. Подойдёт любая
    машина эконом-класса: здесь нужны не лошадиные силы, а удобная обувь.
fa:
  name: تئاتر گابریادزه و برج ساعت
  short: >-
    برج ساعتی کج در خیابان شاوتلی که هر ساعت فرشته‌ای از آن بیرون می‌آید، و کنارش تئاتر عروسکی هشتادنفرهٔ
    رزو گابریادزه.
  body: >-
    **تئاتری کوچک در خیابان شاوتلی با شعاری لاتین زندگی می‌کند: Extra cepam nihil cogito nos lacrimare
    — بگذار اشک فقط از خرد کردن پیاز جاری شود.** این تمام فلسفهٔ رزو گابریادزه (۱۹۳۶–۲۰۲۱) است در یک سطر،
    و کنار تئاتر غریب‌ترین شوخی تفلیس ایستاده است.


    آن شوخی برج ساعت است: ستونی کج و وصله‌پینه‌شده که بر پایهٔ طرح‌های گابریادزه ساخته و با کاشی‌نگاره‌های
    سرامیکی خود او آراسته شده، و از ۲۰۱۰ جمعیت را به سوی خود می‌کشد. چنان می‌نماید که گویی چند قرن عمر
    دارد و کمی هم سرخوش است. سر هر ساعت درهای نقاشی‌شده باز می‌شوند و فرشته‌ای بیرون می‌آید تا با چکش
    بر ناقوس بکوبد. روزی دو بار دریچه‌ای کوچک در بالاتر گشوده می‌شود و «چرخهٔ زندگی» را نشان می‌دهد، نمایش
    عروسکی بی‌کلامی دربارهٔ یک زندگی کامل انسانی. در ۲۰۱۹ وب‌سایت «اطلس آبسکیورا» آن را در شمار ساعت‌های
    یادمانی نمادین جهان آورد.


    گابریادزه تئاتر ماریونتش را در ۱۹۸۱ بنیاد نهاد، پس از سال‌ها که از فیلمنامه‌نویسان بزرگ سینمای شوروی
    بود: «میمینو» و «کین-دزا-دزا!» را او با کارگردان، گئورگی دانلیا، نوشت. سالن تنها ۸۰ صندلی دارد. عروسک‌هایش
    در آوینیون، ادینبرو، نیویورک و تورنتو به صحنه رفته‌اند؛ و در خانه هنوز «پاییزِ بهارِ من»، «رامونا»
    و «آلفرد و ویولتا» را اجرا می‌کنند، اکنون به سرپرستی پسرش لوان (لئو) گابریادزه.


    تئاتر کافهٔ خودش را دارد که به همان حال‌وهوا آراسته شده، و باسیلیکای آنچیسخاتی تنها چند قدم آن‌سوتر
    در همین خیابان است. پنج دقیقه پیش از سر ساعت میان جمعیت بایستید و منتظر فرشته بمانید. آن‌وقت می‌فهمید
    چرا مردی که عمرش را پای عروسک‌ها گذاشت ترجیح داد اشک را به پیاز واگذارد.
  tip: >-
    فرشته هر ساعت ظاهر می‌شود؛ نمایش عروسکی دریچه به‌طور معمول ظهر و ساعت ۱۹ اجرا می‌شود، پس چند دقیقه
    زودتر برسید (ساعت‌ها را در کافه بپرسید). تماشای برج رایگان است و از خیابان دیده می‌شود. بلیت اجراها
    زود تمام می‌شود؛ در فصل شلوغ چند هفته جلوتر رزرو کنید، چون سالن فقط ۸۰ نفر جا دارد و ممکن است دیررسیدگان
    را راه ندهند. بپرسید اجرای شما زیرنویس دارد یا نه. تئاتر تور پشت صحنه و کارگاه نقاشی روی سرامیک هم
    برگزار می‌کند؛ اگر بلیت تمام شده، برنامهٔ جایگزین خوبی است. نزدیک سر ساعت خیابان شاوتلی بسیار شلوغ
    می‌شود: مراقب کیفتان باشید.
  route: >-
    تئاتر حدود ۱ کیلومتر از میدان آزادی فاصله دارد، در خیابان یوآنه شاوتلی، شمارهٔ ۱۳، اما ماشینتان باید
    خیلی پیش‌تر بایستد: شاوتلی باریک و بخشی از آن پیاده‌رو است. به کرانهٔ چپ بروید، ماشین را در پارکینگ
    پارک ریکه بگذارید و پیاده از پل صلح برگردید؛ حدود هفت دقیقه تا برج. گزینهٔ دوم جای پارک پولی در سربالایی
    باراتاشویلی است. برای اجراهای شبانه معمولاً در ریکه جا پیدا می‌شود. هر خودروی اکونومی کافی است؛ اینجا
    به اسب‌بخار نیاز ندارید، به کفش راحت نیاز دارید.
he:
  name: תיאטרון גבריאדזה ומגדל השעון
  short: >-
    מגדל שעון עקום ברחוב שבטלי שממנו יוצא מלאך בכל שעה עגולה, ולצדו תיאטרון המריונטות בן שמונים המושבים
    של רזו גבריאדזה.
  body: >-
    **תיאטרון זעיר ברחוב שבטלי חי לפי מוטו לטיני: Extra cepam nihil cogito nos lacrimare — שהדמעות יזלו
    רק מחיתוך בצל.** זו כל משנתו של רזו גבריאדזה (1936–2021) בשורה אחת, ולצד התיאטרון עומדת הבדיחה המוזרה
    ביותר בטביליסי.


    הבדיחה הזאת היא מגדל השעון: עמוד עקום, כאילו הורכב מטלאים, שנבנה לפי רישומיו של גבריאדזה ושובצו בו
    לוחות קרמיקה פרי ידיו, ומאז 2010 הוא מושך המונים. הוא נראה בן כמה מאות שנים ומעט שתוי. בכל שעה עגולה
    נפתחות דלתות מצוירות, ומלאך יוצא ומכה בפטיש על הפעמון. פעמיים ביום נפתח חלון קטן גבוה יותר, ובו מוצג
    "מעגל החיים", הצגת בובות ללא מילים על חיי אדם שלמים. ב-2019 כלל אותו אתר "אטלס אובסקורה" בין השעונים
    המונומנטליים האיקוניים של העולם.


    גבריאדזה ייסד את תיאטרון המריונטות שלו ב-1981, אחרי שנים שבהן היה מגדולי התסריטאים של הקולנוע הסובייטי:
    את "מימינו" ואת "קין-דזה-דזה!" כתב עם הבמאי גאורגי דנליה. האולם מכיל 80 מושבים בלבד. בובותיו הופיעו
    באביניון, באדינבורו, בניו יורק ובטורונטו; בבית הן עדיין מעלות את "סתיו האביב שלי", "רמונה" ו"אלפרד
    וויולטה", היום בניהולו של בנו לבאן (לאו) גבריאדזה.


    לתיאטרון בית קפה משלו, מעוצב באותה רוח, ובזיליקת אנצ'יסחאטי נמצאת כמה צעדים משם באותו רחוב. עמדו בקהל
    חמש דקות לפני השעה העגולה וחכו למלאך. תבינו למה אדם שהקדיש את חייו לבובות העדיף להשאיר את הדמעות לבצל.
  tip: >-
    המלאך מופיע בכל שעה עגולה; הצגת הבובות שבחלון מתקיימת בדרך כלל בצהריים וב-19:00, אז הגיעו כמה דקות
    קודם (ודאו את השעות בבית הקפה). הצפייה במגדל חינם, מן הרחוב. הכרטיסים להצגות נחטפים מהר — בעונה הזמינו
    שבועות מראש, כי באולם 80 מקומות בלבד וייתכן שמאחרים לא יוכנסו. בדקו אם בהצגה שלכם יש כתוביות. התיאטרון
    מקיים גם סיורים מאחורי הקלעים וסדנאות ציור על קרמיקה — תוכנית ב' טובה אם ההצגות אזלו. סביב השעה העגולה
    רחוב שבטלי נדחס: שימו עין על התיק.
  route: >-
    התיאטרון נמצא כ-1 ק"מ מכיכר החירות, ברחוב יואנה שבטלי 13, אבל הרכב צריך לעצור הרבה לפני כן: שבטלי
    צר ובחלקו מדרחוב. עברו לגדה השמאלית, השאירו את הרכב בחניון של פארק ריקה וחזרו ברגל על גשר השלום —
    כשבע דקות עד המגדל. האפשרות החלופית היא מקומות החניה בתשלום בעליית ברטשווילי. להצגות ערב יש בדרך כלל
    מקום בריקה. כל רכב חסכוני יתאים; מה שצריך כאן הוא לא כוחות סוס אלא נעליים נוחות.
ar:
  name: مسرح غابريادزه وبرج الساعة
  short: برج ساعة مائل في شارع شافتيلي يخرج منه ملاك كل ساعة، وإلى جواره مسرح الدمى لريزو غابريادزه بمقاعده
    الثمانين.
  body: >-
    **لمسرح صغير في شارع شافتيلي شعار لاتيني يعيش به: Extra cepam nihil cogito nos lacrimare — لتكن الدموع
    من تقطيع البصل وحده.** تلك فلسفة ريزو غابريادزه (1936–2021) كلها في سطر واحد، وإلى جوار المسرح تقف
    أغرب مزحة في تبليسي.


    تلك المزحة هي برج الساعة: عمود مائل كأنه مرقّع من قطع شتى، بُني وفق رسوم غابريادزه ورُصّع بلوحات خزفية
    من صنع يديه، ويجتذب الحشود منذ عام 2010. يبدو كأن عمره قرون، وكأنه ثمل قليلاً. عند رأس كل ساعة تنفتح
    أبواب ملوّنة ويخرج ملاك ليضرب الجرس بمطرقة. ومرتين في اليوم تنفتح نافذة صغيرة أعلى منها على «دائرة
    الحياة»، عرض دمى صامت عن حياة إنسان كاملة. وفي عام 2019 أدرجه موقع "أطلس أوبسكورا" بين الساعات النُّصُبية
    الأيقونية في العالم.


    أسس غابريادزه مسرح الماريونيت عام 1981، بعد سنوات كان فيها من كبار كتّاب السيناريو في السينما السوفييتية:
    فـ«ميمينو» و«كين-دزا-دزا!» من تأليفه مع المخرج غيورغي دانيليا. لا تتسع القاعة إلا لـ 80 متفرجاً. وقد
    عرضت دماه في أفينيون وإدنبرة ونيويورك وتورنتو؛ وفي موطنها ما زالت تقدّم «خريف ربيعي» و«رامونا» و«ألفريد
    وفيوليتا»، اليوم بإدارة ابنه ليفان (ليو) غابريادزه.


    للمسرح مقهاه الخاص المصمَّم بالروح نفسها، وبازيليكا أنشيسخاتي على بعد خطوات في الشارع ذاته. قف بين
    الجموع قبل رأس الساعة بخمس دقائق وانتظر الملاك. ستفهم لماذا آثر رجل وهب حياته للدمى أن يترك الدموع
    للبصل.
  tip: >-
    يظهر الملاك كل ساعة؛ أما عرض الدمى في النافذة فيجري عادةً ظهراً وفي الساعة 19:00، فاحضر قبله ببضع
    دقائق (تأكد من المواعيد في المقهى). ومشاهدة البرج مجانية من الشارع. تذاكر العروض تنفد سريعاً — احجز
    قبل أسابيع في الموسم، فالقاعة لا تتسع إلا لـ 80 شخصاً وقد لا يُسمح للمتأخرين بالدخول. تحقق مما إذا
    كان عرضك مصحوباً بترجمة مكتوبة. ويقدّم المسرح أيضاً جولات خلف الكواليس وورشاً للرسم على الخزف، وهي
    خطة بديلة جيدة إن نفدت التذاكر. يزدحم شارع شافتيلي بشدة قرب رأس الساعة، فانتبه لحقيبتك.
  route: >-
    يقع المسرح على بعد نحو 1 كم من ساحة الحرية، في 13 شارع يوآنه شافتيلي، لكن على سيارتك أن تتوقف قبله
    بمسافة: فشافتيلي ضيق وجزء منه للمشاة. اعبر إلى الضفة اليسرى، واترك السيارة في موقف حديقة ريكي، ثم
    عد سيراً عبر جسر السلام — نحو سبع دقائق حتى البرج. والبديل أماكن الوقوف المدفوعة على منحدر باراتاشفيلي.
    وفي عروض المساء يتوفر مكان عادةً في ريكي. أي سيارة اقتصادية تفي بالغرض؛ فما تحتاجه هنا ليس قوة المحرك
    بل حذاء مريح.
