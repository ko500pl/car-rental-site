ka:
  name: გაბრიაძის თეატრი და საათის კოშკი
  short: |-
    დახრილი აგურის კოშკი ანგელოზით და მის გვერდით მდგარი პატარა მარიონეტების თეატრი შავთელის ქუჩაზე.
  body: |-
    **ეს თბილისში ერთადერთი შენობაა, რომელიც განზრახ არის მრუდე.** საათის კოშკი 2010 წელს ააგო რეზო გაბრიაძემ — მხატვარმა, სცენარისტმა და თოჯინების თეატრის დამფუძნებელმა — თავისივე თეატრის გვერდით, შავთელის ვიწრო ქუჩაზე. ის ძველი აგურით, ნაპოვნი კრამიტითა და მოზაიკის ნატეხებით არის აწყობილი და ისე გამოიყურება, თითქოს რამდენიმე საუკუნეა იქ დგას, თუმცა ჩვენზე ახალგაზრდაა.

    ყოველ საათში კარი იღება და ანგელოზი გამოდის ჩაქუჩით ზარს რომ დაჰკრას. დღეში ორჯერ, შუადღისას და საღამოს შვიდზე, ზემოთ პატარა ფანჯარა იხსნება და ორმოცდაათწამიან თოჯინურ სცენას აჩვენებს — დაბადებიდან სიბერემდე მთელი ცხოვრება, უტექსტოდ.

    გვერდით მდგარი თეატრი 1981 წელს დაარსდა. დარბაზი ძალიან პატარაა, ოთხმოციოდე ადგილით, სცენა კი დაახლოებით მაგიდის ზომისაა. აქ იდგმება გაბრიაძის საკუთარი პიესები — „სტალინგრადის ბრძოლა", „რამონა", „ჩემი გაზაფხულის შემოდგომა" — რომლებიც სამყაროს ომს, სიყვარულს და დანაკარგს ორმოცსანტიმეტრიანი თოჯინებით ჰყვება. სპექტაკლები ქართულადაა, ტიტრებით. გაბრიაძე 2021 წელს გარდაიცვალა, თეატრი კი მუშაობს.

    კოშკი უფასოა და ქუჩიდან ჩანს, ამიტომ მასთან ხალხი ყოველთვის დგას — განსაკუთრებით საათის დარტყმამდე ხუთი წუთით ადრე. თეატრის ეზოში პატარა კაფეა, ქუჩის მოპირდაპირე მხარეს კი ანჩისხატის ბაზილიკა — ორივე ერთ გასეირნებაში იკრიბება.

    გაბრიაძე მხოლოდ თოჯინების ავტორი არ იყო. ის საბჭოთა კინოს ორი ყველაზე ცნობილი კომედიის — „მიმინოსა" და „კინ-ძა-ძას" — სცენარისტია, და მისი პატარა ქანდაკებები რამდენიმე ქალაქშია გაფანტული, მათ შორის სანქტ-პეტერბურგში. თეატრის კაფე და ინტერიერიც მისივე ხელითაა გაფორმებული: მოხატული კედლები, უცნაური ავეჯი და დეტალები, რომლებიც იმავე ლოგიკით მუშაობს, როგორც კოშკი — არაფერი სწორი, ყველაფერი განზრახ.
  tip: |-
    კოშკისთვის ნახევარი საათი საკმარისია, თუ თოჯინურ სცენას დაელოდები. მიდი 11:55-ზე ან 18:55-ზე — სხვა დროს მხოლოდ ანგელოზი გამოდის. სპექტაკლზე ბილეთი წინასწარ უნდა იყიდო: დარბაზი პატარაა და ხშირად კვირებით ადრე იყიდება; შესვლა დაწყების შემდეგ არ ხდება. ქუჩა ვიწროა და ხალხმრავალი — ჩანთას თვალი ადევნე. ტუალეტი კაფეშია. სპექტაკლის ხანგრძლივობა ჩვეულებრივ საათნახევარია, ანტრაქტის გარეშე.
  route: |-
    შავთელის ქუჩა ვიწროა და მანქანით მასზე შესვლა უაზროა — ნაწილი საფეხმავლოა. მოდი ბარათაშვილის ხიდის ან ერეკლე II-ის მხრიდან და მანქანა დატოვე რიყის პარკის ქვედა პარკინგში მდინარის მეორე მხარეს: მშვიდობის ხიდის გავლით კოშკამდე 7 წუთის სავალია და ეს უახლოესი ნორმალური სადგომია. ალტერნატივა — ზონალური ადგილები ბარათაშვილის აღმართზე. საღამოს სპექტაკლის შემთხვევაში პარკინგში ადგილი ჩვეულებრივ არის. ეკონომკლასის მანქანა საკმარისია.
en:
  name: Gabriadze Theatre and Clock Tower
  short: |-
    A deliberately crooked brick tower with an angel, and the small marionette theatre beside it on Shavteli Street.
  body: |-
    **This is the only building in Tbilisi that leans on purpose.** The clock tower was built in 2010 by Rezo Gabriadze — painter, screenwriter and founder of the puppet theatre next door — on the narrow line of Shavteli Street. It is assembled from old brick, salvaged tiles and fragments of mosaic, and it looks as though it has stood for centuries, though it is younger than most of the people looking at it.

    On the hour a door opens and an angel comes out to strike the bell with a hammer. Twice a day, at noon and at seven in the evening, a small window higher up opens for a fifty-second puppet scene: a whole life from birth to old age, without a word spoken.

    The theatre beside it was founded in 1981. The hall is very small, around eighty seats, and the stage is roughly the size of a dining table. It stages Gabriadze's own plays — The Battle of Stalingrad, Ramona, Autumn of My Springtime — which tell stories of war, love and loss with puppets forty centimetres high, and which have toured half the world's festivals. Performances are in Georgian with surtitles. Gabriadze died in 2021; the theatre continues.

    The tower is free and visible from the street, so there is always a small crowd in front of it, thickest about five minutes before the hour. There is a cafe in the theatre courtyard, and Anchiskhati Basilica stands a few doors along the same street, so the two fit naturally into one short walk.

    Gabriadze was not only a puppeteer. He wrote the screenplays for two of the best-known Soviet comedies, Mimino and Kin-dza-dza!, and his small sculptures are scattered through several cities, including St Petersburg. The theatre cafe and its interiors are his work too: painted walls, odd furniture and details that follow the same logic as the tower — nothing straight, everything deliberate. Even if the hall is sold out, the cafe and the tower together give a clear sense of how his mind worked.
  tip: |-
    Half an hour is enough for the tower if you wait for the puppet scene. Arrive at 11:55 or 18:55 for the full show; at other hours you only get the angel. For a performance, book ahead — the hall is tiny and often sells out weeks in advance, and latecomers are not admitted. The street is narrow and crowded, so keep an eye on your bag. Toilets are in the cafe. Performances usually run about ninety minutes with no interval.
  route: |-
    Shavteli Street is narrow and partly pedestrian, so driving into it is pointless. Approach from Baratashvili Bridge or Erekle II Street and leave the car in the lower car park at Rike Park on the other bank: across the Bridge of Peace it is a seven-minute walk, and it is the nearest properly organised parking. The alternative is metered bays on the Baratashvili rise. For an evening performance there is normally space in the Rike car park. An economy car is enough.
ru:
  name: Театр Габриадзе и часовая башня
  short: |-
    Нарочито кривая кирпичная башня с ангелом и маленький театр марионеток рядом с ней на улице Шавтели.
  body: |-
    **Это единственное здание в Тбилиси, которое кривое намеренно.** Часовую башню построил в 2010 году Резо Габриадзе — художник, сценарист и основатель соседнего театра кукол — на узкой улице Шавтели. Она сложена из старого кирпича, найденной черепицы и обломков мозаики и выглядит так, будто стоит здесь века, хотя моложе большинства тех, кто на неё смотрит.

    Каждый час открывается дверца, и ангел выходит ударить молоточком в колокол. Дважды в день, в полдень и в семь вечера, окошко выше распахивается для пятидесятисекундной кукольной сцены: целая жизнь от рождения до старости, без единого слова.

    Театр рядом основан в 1981 году. Зал крошечный, мест восемьдесят, а сцена размером примерно с обеденный стол. Здесь идут пьесы самого Габриадзе — «Сталинградская битва», «Рамона», «Осень моей весны», — которые рассказывают о войне, любви и утрате куклами высотой сорок сантиметров и объехали половину мировых фестивалей. Спектакли на грузинском с титрами. Габриадзе умер в 2021 году, театр работает.

    Башня бесплатна и видна с улицы, поэтому перед ней всегда небольшая толпа, самая плотная минут за пять до боя часов. Во дворе театра есть кафе, а в нескольких шагах по той же улице стоит базилика Анчисхати, так что оба места складываются в одну короткую прогулку.

    Габриадзе был не только кукольником. Он написал сценарии двух самых известных советских комедий — «Мимино» и «Кин-дза-дза!», а его маленькие скульптуры разбросаны по нескольким городам, включая Петербург. Кафе театра и его интерьеры тоже сделаны им: расписанные стены, странная мебель и детали, работающие по той же логике, что и башня, — ничего прямого, всё нарочно. Даже если зал распродан, кафе и башня вместе дают ясное представление о том, как он мыслил.
  tip: |-
    На башню хватит получаса, если дождаться кукольной сцены. Приходите к 11:55 или 18:55 ради полного представления; в остальные часы выходит только ангел. На спектакль билеты берите заранее: зал крошечный, всё часто расходится за недели, опоздавших не пускают. Улица узкая и людная, следите за сумкой. Туалеты в кафе. Спектакли обычно идут около полутора часов без антракта.
  route: |-
    Улица Шавтели узкая и частично пешеходная, заезжать в неё бессмысленно. Подъезжайте от моста Бараташвили или по улице Ираклия II и оставляйте машину на нижней парковке парка Рике на другом берегу: через Мост мира идти семь минут, и это ближайшая нормально устроенная стоянка. Альтернатива — размеченные места на подъёме Бараташвили. К вечернему спектаклю на парковке Рике места обычно есть. Достаточно машины эконом-класса.
fa:
  name: تئاتر گابریادزه و برج ساعت
  short: |-
    برجی آجری که عمداً کج ساخته شده، با فرشته‌ای در آن، و تئاتر کوچک عروسکی کنارش در خیابان شاوتلی.
  body: |-
    **این تنها ساختمان تفلیس است که به‌عمد کج است.** برج ساعت را در ۲۰۱۰ رزو گابریادزه ساخت؛ نقاش و فیلمنامه‌نویس و بنیان‌گذار تئاتر عروسکی همسایه، در امتداد باریک خیابان شاوتلی. برج از آجر کهنه و سفال‌های بازیافتی و تکه‌های کاشی چیده شده و چنان می‌نماید که قرن‌هاست ایستاده، حال آنکه از بیشتر تماشاگرانش جوان‌تر است.

    سر هر ساعت دری باز می‌شود و فرشته‌ای بیرون می‌آید تا با چکش بر ناقوس بکوبد. روزی دو بار، نیمروز و ساعت هفت شب، پنجره‌ای بالاتر برای صحنه‌ای عروسکی به درازای پنجاه ثانیه گشوده می‌شود: یک زندگی کامل از تولد تا پیری، بی‌آنکه کلمه‌ای گفته شود.

    تئاتر کنار آن در ۱۹۸۱ بنیاد گرفت. تالار بسیار کوچک است، حدود هشتاد صندلی، و صحنه تقریباً به اندازهٔ یک میز غذاخوری. نمایش‌های خود گابریادزه اینجا اجرا می‌شوند — نبرد استالینگراد، رامونا، پاییز بهار من — که جنگ و عشق و از دست دادن را با عروسک‌هایی چهل سانتی‌متری روایت می‌کنند و نیمی از جشنواره‌های جهان را گشته‌اند. اجراها به گرجی با زیرنویس است. گابریادزه در ۲۰۲۱ درگذشت و تئاتر همچنان کار می‌کند.

    برج رایگان است و از کوچه دیده می‌شود، پس همیشه جمعیتی کوچک جلوی آن ایستاده، پرشمارتر از همه پنج دقیقه پیش از سر ساعت. در حیاط تئاتر کافه‌ای هست و چند در آن‌طرف‌تر در همان کوچه بازیلیکای آنچیسخاتی، و این دو در یک گردش کوتاه کنار هم می‌نشینند.

    گابریادزه تنها عروسک‌گردان نبود. او فیلمنامهٔ دو تا از شناخته‌شده‌ترین کمدی‌های شوروی، میمینو و کین‌دزا‌دزا، را نوشت و مجسمه‌های کوچکش در چند شهر از جمله سن‌پترزبورگ پراکنده است. کافهٔ تئاتر و فضاهای داخلی‌اش نیز کار خود اوست: دیوارهای نقاشی‌شده، اثاث عجیب و جزئیاتی که به همان منطق برج کار می‌کنند؛ هیچ‌چیز راست نیست و همه‌چیز عمدی است. حتی اگر بلیت تمام شده باشد، کافه و برج با هم تصویری روشن از ذهن او می‌دهند.
  tip: |-
    اگر منتظر صحنهٔ عروسکی بمانید، نیم ساعت برای برج کافی است. ساعت ۱۱:۵۵ یا ۱۸:۵۵ برسید تا نمایش کامل را ببینید؛ در ساعت‌های دیگر تنها فرشته بیرون می‌آید. برای اجرا از پیش بلیت بگیرید: تالار بسیار کوچک است و اغلب هفته‌ها زودتر پر می‌شود، و دیررسیدگان را راه نمی‌دهند. کوچه باریک و پرجمعیت است، مراقب کیفتان باشید. سرویس بهداشتی در کافه است. اجراها معمولاً حدود نود دقیقه و بدون میان‌پرده‌اند.
  route: |-
    خیابان شاوتلی باریک و بخشی از آن پیاده‌رو است، پس ورود با خودرو بی‌فایده است. از پل باراتاشویلی یا خیابان ارکله دوم نزدیک شوید و خودرو را در پارکینگ پایین پارک ریکه در کرانهٔ دیگر بگذارید: از روی پل صلح هفت دقیقه پیاده است و نزدیک‌ترین پارکینگ سامان‌یافته همان است. گزینهٔ دیگر جای‌های خط‌کشی‌شدهٔ سربالایی باراتاشویلی است. برای اجرای شبانه معمولاً در پارکینگ ریکه جا هست. خودروی اقتصادی کافی است.
he:
  name: תיאטרון גבריאדזה ומגדל השעון
  short: |-
    מגדל לבנים עקום בכוונה ובו מלאך, ולצדו תיאטרון בובות קטן ברחוב שאווטלי.
  body: |-
    **זהו הבניין היחיד בטביליסי הנוטה בכוונה תחילה.** מגדל השעון נבנה ב-2010 בידי רזו גבריאדזה — צייר, תסריטאי ומייסד תיאטרון הבובות שלצדו — בקו הצר של רחוב שאווטלי. הוא מורכב מלבנים ישנות, רעפים שנאספו ושברי פסיפס, ונראה כאילו הוא עומד כאן מאות שנים, אף שהוא צעיר מרוב המתבוננים בו.

    בכל שעה עגולה נפתחת דלת ומלאך יוצא להכות בפעמון בפטיש. פעמיים ביום, בצהריים ובשבע בערב, נפתח חלון גבוה יותר לסצנת בובות בת חמישים שניות: חיים שלמים מלידה עד זקנה, בלי מילה אחת.

    התיאטרון שלצדו נוסד ב-1981. האולם קטן מאוד, כשמונים מושבים, והבמה בערך בגודל שולחן אוכל. מוצגות בו יצירותיו של גבריאדזה עצמו — קרב סטלינגרד, רמונה, סתיו האביב שלי — המספרות על מלחמה, אהבה ואובדן בעזרת בובות בגובה ארבעים סנטימטרים, ושסבבו במחצית פסטיבלי העולם. ההצגות בגאורגית עם כתוביות. גבריאדזה נפטר ב-2021, והתיאטרון ממשיך.

    המגדל חינם ונראה מן הרחוב, ולכן תמיד עומד מולו קהל קטן, צפוף במיוחד כחמש דקות לפני השעה העגולה. בחצר התיאטרון יש בית קפה, וכמה דלתות משם באותו רחוב ניצבת בזיליקת אנצ'יסחאטי, כך שהשניים משתלבים בטיול קצר אחד.

    גבריאדזה לא היה רק בובנאי. הוא כתב את התסריטים לשתיים מן הקומדיות הסובייטיות הידועות ביותר, מימינו וקין-דזה-דזה, ופסליו הקטנים פזורים בכמה ערים, ובהן סנקט פטרבורג. גם בית הקפה של התיאטרון והפנים שלו הם מעשה ידיו: קירות מצוירים, רהיטים מוזרים ופרטים שפועלים באותו היגיון של המגדל — שום דבר אינו ישר, והכול בכוונה. גם אם האולם אזל, בית הקפה והמגדל יחד נותנים מושג ברור על אופן חשיבתו.
  tip: |-
    חצי שעה מספיקה למגדל אם ממתינים לסצנת הבובות. הגיעו ב-11:55 או ב-18:55 להצגה המלאה; בשעות אחרות יוצא רק המלאך. להצגה הזמינו מראש — האולם זעיר ולעתים קרובות אוזל שבועות מראש, ומאחרים אינם מוכנסים. הרחוב צר וסואן, שימו לב לתיק. שירותים בבית הקפה. ההצגות נמשכות בדרך כלל כתשעים דקות בלי הפסקה.
  route: |-
    רחוב שאווטלי צר וחלקו להולכי רגל, אז אין טעם להיכנס אליו ברכב. הגיעו מגשר בראטאשווילי או מרחוב ארקלה השני והשאירו את הרכב בחניון התחתון של פארק ריקה בגדה שממול: דרך גשר השלום זו הליכה של שבע דקות, וזהו החניון המסודר הקרוב ביותר. חלופה היא מקומות מסומנים במעלה בראטאשווילי. להצגת ערב בדרך כלל יש מקום בחניון ריקה. רכב חסכוני מספיק.
ar:
  name: مسرح غابريادزه وبرج الساعة
  short: |-
    برج من الآجر مائل عن قصد وفيه ملاك، وإلى جانبه مسرح دمى صغير في شارع شافتيلي.
  body: |-
    **هذا هو المبنى الوحيد في تبليسي المائل عن عمد.** بنى برج الساعة عام 2010 ريزو غابريادزه، الرسام وكاتب السيناريو ومؤسس مسرح الدمى المجاور، على خط شارع شافتيلي الضيق. وهو مركّب من آجر قديم وقرميد مستعاد وشظايا فسيفساء، ويبدو كأنه قائم منذ قرون مع أنه أصغر سناً من معظم من ينظرون إليه.

    وعند رأس كل ساعة يُفتح باب صغير فيخرج ملاك ليقرع الجرس بمطرقة. ومرتين في اليوم، ظهراً والسابعة مساءً، تُفتح نافذة أعلى لمشهد دمى مدته خمسون ثانية: عمر كامل من الولادة إلى الشيخوخة بلا كلمة واحدة.

    وأُسس المسرح المجاور عام 1981. والقاعة صغيرة جداً، نحو ثمانين مقعداً، والخشبة بحجم مائدة طعام تقريباً. وتُعرض فيه مسرحيات غابريادزه نفسه: معركة ستالينغراد، ورامونا، وخريف ربيعي، وهي تحكي الحرب والحب والفقد بدمى طولها أربعون سنتيمتراً، وقد جالت نصف مهرجانات العالم. والعروض بالجورجية مع ترجمة معروضة. توفي غابريادزه عام 2021 والمسرح مستمر.

    والبرج مجاني ويُرى من الشارع، فأمامه دائماً حشد صغير يبلغ ذروته قبل رأس الساعة بخمس دقائق. وفي فناء المسرح مقهى، وعلى بعد أبواب في الشارع نفسه تقوم بازيليكا أنتشيسخاتي، فيجتمع الاثنان في نزهة قصيرة واحدة.

    لم يكن غابريادزه محرّك دمى فحسب. فقد كتب سيناريو اثنتين من أشهر الكوميديات السوفييتية، ميمينو وكين دزا دزا، وتنتشر منحوتاته الصغيرة في مدن عدة منها سانت بطرسبرغ. ومقهى المسرح وتصميمه الداخلي من عمله أيضاً: جدران مرسومة وأثاث غريب وتفاصيل تسير على منطق البرج نفسه؛ لا شيء مستقيم وكل شيء مقصود. وحتى إن نفدت تذاكر القاعة، فالمقهى والبرج معاً يعطيانك فكرة واضحة عن طريقة تفكيره.
  tip: |-
    نصف ساعة تكفي للبرج إن انتظرت مشهد الدمى. احضر في الساعة 11:55 أو 18:55 لترى العرض الكامل؛ وفي غير ذلك يخرج الملاك وحده. وللعرض المسرحي احجز مسبقاً، فالقاعة ضيقة وكثيراً ما تنفد تذاكرها قبل أسابيع، ولا يُسمح بدخول المتأخرين. والشارع ضيق مزدحم فانتبه لحقيبتك. ودورات المياه في المقهى. والعروض تستغرق نحو تسعين دقيقة عادة بلا استراحة.
  route: |-
    شارع شافتيلي ضيق وجزء منه للمشاة، فلا جدوى من دخوله بالسيارة. اقترب من جسر باراتاشفيلي أو شارع إيريكلي الثاني، واترك السيارة في الموقف السفلي لحديقة ريكه على الضفة المقابلة: فعبر جسر السلام تمشي سبع دقائق، وهو أقرب موقف منظم. والبديل الأماكن المخططة على صعود باراتاشفيلي. وللعرض المسائي يتوفر مكان عادة في موقف ريكه. وسيارة اقتصادية تكفي.
