ka:
  name: სიყვარულის ჩანჩქერი
  short: >-
    ხავსიანი კლდე ამბროლაურის პირას, სადაც წყალი გულის ფორმის ქვაბულის პირზე წვეთავს. გული ხელით არის
    ნაკვეთი და ეს ამბავი ნამდვილია.
  body: >-
    **ეს გული ბუნების ხრიკი არ არის: ის ადგილობრივმა კაცმა კლდეში თავად გამოკვეთა, მოგვიანებით კი — მეორეც,
    უფრო პატარა, ცოლისთვის.**


    ამბროლაურის დასავლეთ განაპირას, ძირაგეულში, პატარა, ხავსით დაფარული კლდიდან წყალი ჟონავს და თხელ,
    მოციმციმე ფარდად ეშვება. წლების განმავლობაში ის უბრალო ნაპრალიდან წვეთავდა. შემდეგ იქვე მცხოვრებმა
    სტომატოლოგმა, ლევან მურუსიძემ, ხელსაწყოები აიღო და ნაპრალი გულის ფორმამდე გააფართოვა. როგორც მან 2022
    წელს „პრაიმტაიმს“ უამბო, მაშინ შეყვარებულიც კი არ ყოფილა. უბრალოდ, მოუნდა, წყალი გულიდან ჩამოსულიყო.


    სიყვარული მერე მოვიდა. 2009 წელს, მეგობრის ქორწილში, სადაც მეჯვარე იყო, კახეთიდან ჩამოსულ სტუმარს
    გაიცნო; 2011 წელს დაქორწინდნენ. ცოტა ხანში, კლდესთან ჩავლისას, დიდი გულის ზემოთ მეორე, პატარა ნაპრალი
    შენიშნა. ცოლისთვის არაფერი უთქვამს: დაღამებას დაელოდა, ჩუმად გავიდა სახლიდან და ნაჯახით ისიც გულად
    აქცია, მეორე დღეს კი მეუღლე ჩანჩქერთან მიიყვანა და უთხრა, რომ მას უძღვნიდა. წლების განმავლობაში ამ
    ამბავს არავის უყვებოდა და ეღიმებოდა, როცა ჩანჩქერზე ლეგენდასავით წერდნენ.


    მოლოდინი ზომიერი იქონიეთ: ეს რამდენიმემეტრიანი კლდეა და არა გამოქვაბული. ხიბლი დეტალებშია — სქელი
    ხავსი, შესასვლელს შემოხვეული სურო, წყალი, რომელიც კლდის ნაპირიდან ოთხივე სეზონზე წვეთავს, და ზედა
    გული, იმდენად პატარა, რომ შიგ ვერავინ შეეტევა. მოკლე ბილიკი რამდენიმე მეტრით შიგნით, ჩამომავალი წვეთების
    მიღმა შეგიყვანთ, საიდანაც სამყაროს უკვე გულის ჩარჩოში დაინახავთ.


    რომანტიკული ადგილების უმეტესობას ლეგენდა ქმნის. ეს კი ახირებამ, ნაჯახმა და ქორწინებამ შექმნა.
  tip: >-
    ნახევარი საათი სავსებით საკმარისია. კლდე მთელი წლის განმავლობაში სველი და მოლიპულია, ამიტომ მყარძირიანი
    ფეხსაცმელი ჩაიცვით, პატარა ბავშვებს კი გამოქვაბულის შესასვლელთან ხელი არ გაუშვათ. ადგილზე არაფერია
    — არც კაფე, არც ტუალეტი, — თუმცა ამბროლაურის ცენტრამდე მანქანით რამდენიმე წუთია. ადგილი პოპულარულია,
    ამიტომ ზაფხულის შაბათ-კვირას ფოტოსთვის რიგის დაცდა მოგიწევთ. ბუნებრივად ერწყმის ამბროლაურის, ბარაკონის
    ტაძრისა და ხვანჭკარის ვენახების მონახულებას. კლდეზე საკუთარ წარწერებს ნუ ამოკვეთთ: ამ კლდეს ავტორი
    უკვე ჰყავს.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190 კილომეტრი იარეთ, ზესტაფონსა და ქუთაისს
    შორის ჩრდილოეთით, შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე ადით, შემდეგ შ17-ით ნაქერალას
    უღელტეხილი გადაიარეთ და ამბროლაურში ჩაეშვით: დაახლოებით 264 კმ, გაუჩერებლად ოთხი საათი და მეოთხედი.
    ქალაქში შესვლისთანავე დასავლეთით, ძირაგეულისკენ გადაუხვიეთ და სოფლის ქუჩებს დაახლოებით ორი კილომეტრი
    მიჰყევით კლდემდე; ტურისტების მოსაზიდად აქამდე გზაც გაიყვანეს. მანქანა იქ დატოვეთ, სადაც ქუჩა საშუალებას
    მოგცემთ, ბოლო რამდენიმე მეტრი კი ფეხით გაიარეთ. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Waterfall of Love
  short: >-
    A mossy rock on the edge of Ambrolauri where water drips across a heart-shaped cave mouth. The heart
    was cut by hand, and the story is true.
  body: >-
    **The heart is no trick of nature: a local man cut it into the rock, and later a second, smaller one
    for his wife.**


    On the western edge of Ambrolauri, in Dzirageuli, water seeps from a small, moss-covered rock and
    falls in a thin, glittering curtain. For years it dripped from an ordinary crevice. Then Levan Murusidze,
    a dentist who lives nearby, took his tools to the rock and widened the opening into a heart. As he
    told the Georgian news site Primetime in 2022, he was not even in love at the time. He simply wanted
    the water to fall from a heart.


    Love came afterwards. In 2009, as best man at a friend's wedding in Racha, he met a guest from Kakheti;
    they married in 2011. Soon after, passing the rock, he noticed a second, smaller hollow above the
    first. He said nothing, waited for dark, slipped out and cut it into a heart with an axe, and the
    next day brought his wife here and dedicated the waterfall to her. For years he kept quiet and smiled
    when people wrote about it as a legend.


    Adjust your expectations: this is a few metres of rock, not a grotto. The pleasure is in the detail:
    thick moss, ivy framing the cave mouth, water ticking off the lip in every season, and the upper heart,
    too small for anyone to enter. A short path takes you a few metres inside, behind the falling drops,
    so you can look back out through the heart.


    Most romantic landmarks are made of legend. This one was made of a whim, an axe and a marriage.
  tip: >-
    Half an hour is plenty. The rock is wet and slippery all year, so wear shoes with grip and keep a
    hand on small children at the cave mouth. There is nothing on site, no café and no toilet, but Ambrolauri's
    centre is a few minutes' drive away. The place is popular, so on summer weekends expect to wait your
    turn for the photograph. It pairs naturally with Ambrolauri itself, Barakoni church and the Khvanchkara
    vineyards. Please do not add carvings of your own: the rock already has its author.
  route: >-
    From Tbilisi take the S1 (E60) west for about 190 km, turn north between Zestaponi and Kutaisi on
    the Sh19 through Terjola to Tkibuli, then follow the Sh17 over the Nakerala pass down into Ambrolauri:
    about 264 km, some four and a quarter hours without stops. As the Sh17 reaches the town, turn west
    into Dzirageuli and follow the village lanes for about two kilometres to the rock; a lane was laid
    to it to bring visitors in. Park where the lane allows and walk the last few metres. An economy car
    is fine.
ru:
  name: Водопад Любви
  short: >-
    Замшелая скала на окраине Амбролаури: вода капает с края входа в пещеру в форме сердца. Сердце вырезано
    руками, а история — правда.
  body: >-
    **Сердце — не игра природы: его вырезал в скале местный житель, а позже добавил второе, поменьше,
    — для жены.**


    На западной окраине Амбролаури, в Дзирагеули, вода сочится из небольшой замшелой скалы и падает тонкой
    искрящейся завесой. Долгие годы она капала из обычной расщелины. Потом Леван Мурусидзе, стоматолог,
    живущий неподалёку, взялся за инструменты и расширил отверстие до формы сердца. Как он рассказал в
    2022 году грузинскому новостному сайту «Primetime», тогда он даже не был влюблён. Ему просто хотелось,
    чтобы вода падала из сердца.


    Любовь пришла позже. В 2009 году, будучи шафером на свадьбе друга в Раче, он познакомился с гостьей
    из Кахетии; в 2011-м они поженились. Вскоре после этого, проходя мимо скалы, он заметил над первым
    проёмом второе углубление, поменьше. Никому ничего не сказав, он дождался темноты, тихо вышел из дома
    и вырубил его топором в форме сердца, а на следующий день привёл сюда жену и посвятил водопад ей.
    Годами он молчал и лишь улыбался, когда о водопаде писали как о легенде.


    Не ждите слишком многого: это несколько метров скалы, а не грот. Вся прелесть — в деталях: густой
    мох, плющ, обрамляющий вход в пещеру, вода, срывающаяся с края в любое время года, и верхнее сердце,
    слишком маленькое, чтобы в него кто-нибудь пролез. Короткая тропинка уводит на несколько метров внутрь,
    за пелену капель, и оттуда можно посмотреть наружу сквозь сердце.


    Большинство романтических мест сложено из легенд. Это — из прихоти, топора и брака.
  tip: >-
    Хватит получаса. Скала мокрая и скользкая круглый год, поэтому наденьте обувь с цепкой подошвой и
    держите маленьких детей за руку у входа в пещеру. На месте ничего нет — ни кафе, ни туалета, но до
    центра Амбролаури несколько минут езды. Место популярное, так что летом по выходным будьте готовы
    подождать своей очереди на фото. Логично совместить его с самим Амбролаури, церковью Баракони и виноградниками
    Хванчкары. И, пожалуйста, не вырезайте ничего своего: у этой скалы уже есть автор.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 190 км, между Зестафони и Кутаиси сверните на север на Sh19
    и через Терджолу доезжайте до Ткибули, затем по Sh17 через перевал Накерала спуститесь в Амбролаури:
    около 264 км, примерно четыре с четвертью часа без остановок. Там, где Sh17 входит в город, сверните
    на запад в Дзирагеули и около двух километров езжайте сельскими улочками до скалы — к ней специально
    проложили дорогу для посетителей. Оставьте машину там, где позволяет улочка, и последние метры пройдите
    пешком. Хватит и машины эконом-класса.
fa:
  name: آبشار عشق
  short: >-
    صخره‌ای خزه‌پوش در حاشیهٔ آمبرولائوری که آب از جلوی دهانهٔ غاری قلبی‌شکل می‌چکد. قلب را دست آدمی تراشیده،
    و داستانش راست است.
  body: >-
    **این قلب بازیِ طبیعت نیست: مردی از اهالی آن را در سنگ تراشید، و بعدها قلبی دوم و کوچک‌تر را برای
    همسرش.**


    در حاشیهٔ غربی آمبرولائوری، در دزیراگئولی، آب از صخرهٔ کوچکِ خزه‌پوشی تراوش می‌کند و چون پرده‌ای نازک
    و درخشان فرو می‌ریزد. سال‌ها از شکافی معمولی می‌چکید. تا اینکه لوان موروسیدزه، دندان‌پزشکی که همان
    نزدیکی زندگی می‌کند، ابزارش را برداشت و دهانه را به شکل قلب گشاد کرد. به گفتهٔ خودش در سال ۲۰۲۲ به
    وبگاه خبری گرجی «پرایم‌تایم»، آن روزها حتی عاشق هم نبود. فقط می‌خواست آب از یک قلب فرو بریزد.


    عشق بعدتر آمد. در سال ۲۰۰۹، وقتی ساقدوشِ داماد در عروسی دوستش در راچا بود، با مهمانی از کاختی آشنا
    شد؛ در سال ۲۰۱۱ ازدواج کردند. اندکی بعد، هنگام گذر از کنار صخره، فرورفتگی دوم و کوچک‌تری بالای اولی
    دید. به کسی چیزی نگفت، منتظر تاریکی ماند، بی‌صدا بیرون رفت و با تبر آن را به شکل قلب تراشید؛ فردای
    آن روز همسرش را به اینجا آورد و آبشار را به او پیشکش کرد. سال‌ها سکوت کرد و هر بار که دربارهٔ آبشار
    چون افسانه‌ای می‌نوشتند، فقط لبخند می‌زد.


    انتظارتان را تنظیم کنید: اینجا چند متر صخره است، نه غاری بزرگ. لذتش در جزئیات است: خزهٔ انبوه، پیچکی
    که دهانهٔ غار را قاب گرفته، آبی که در هر فصلی از لبهٔ سنگ می‌چکد، و قلب بالایی که برای ورود هیچ‌کس
    جا ندارد. کوره‌راهی کوتاه شما را چند متر به درون می‌برد، پشت پردهٔ قطره‌ها، تا از میان قلب به بیرون
    نگاه کنید.


    بیشتر نشانه‌های عاشقانه از افسانه ساخته شده‌اند. این یکی از هوسی گذرا، یک تبر و یک ازدواج ساخته شد.
  tip: >-
    نیم ساعت کافی است. صخره در تمام سال خیس و لغزنده است، پس کفشی با کف چسبنده بپوشید و کنار دهانهٔ غار
    دست کودکان خردسال را رها نکنید. در محل هیچ امکاناتی نیست، نه کافه و نه دست‌شویی، اما مرکز آمبرولائوری
    چند دقیقه با خودرو فاصله دارد. اینجا پرطرفدار است و آخر هفته‌های تابستان باید برای عکس گرفتن منتظر
    نوبت بمانید. به‌طور طبیعی می‌شود آن را با خود آمبرولائوری، کلیسای باراکونی و تاکستان‌های خوانچکارا
    همراه کرد. لطفاً نقشی از خودتان بر سنگ نکَنید: این صخره خودش صاحب‌اثر دارد.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سوی غرب بروید، میان زستافونی و کوتائیسی به شمال بپیچید
    و از Sh19 و از میان ترجولا تا تکیبولی برانید، سپس با Sh17 از گردنهٔ ناکرالا بگذرید و به آمبرولائوری
    سرازیر شوید: حدود ۲۶۴ کیلومتر، حدود چهار ساعت و ربع بی‌توقف. جایی که Sh17 به شهر می‌رسد، به غرب به
    سوی دزیراگئولی بپیچید و حدود دو کیلومتر کوچه‌های روستا را تا صخره دنبال کنید؛ برای آوردن بازدیدکنندگان
    راهی تا آنجا کشیده‌اند. هر جا کوچه اجازه داد خودرو را پارک کنید و چند متر آخر را پیاده بروید. خودروی
    اقتصادی کافی است.
he:
  name: מפל האהבה
  short: סלע מכוסה טחב בקצה אמברולאורי, שבו מים מטפטפים על פני פתח מערה בצורת לב. את הלב חצבה יד אדם,
    והסיפור אמיתי.
  body: >-
    **הלב אינו תעלול של הטבע: איש מקומי חצב אותו בסלע, ואחר כך גם לב שני, קטן יותר, בשביל אשתו.**


    בקצה המערבי של אמברולאורי, בדזירגאולי, מים מחלחלים מסלע קטן מכוסה טחב ונופלים בווילון דק ונוצץ. במשך
    שנים הם טפטפו מסדק רגיל. ואז לבן מורוסידזה, רופא שיניים שגר בסמוך, יצא אל הסלע עם כליו והרחיב את הפתח
    לצורת לב. כפי שסיפר ב-2022 לאתר החדשות הגאורגי "פריים טיים", באותה תקופה הוא אפילו לא היה מאוהב. הוא
    פשוט רצה שהמים ייפלו מתוך לב.


    האהבה באה אחר כך. ב-2009, כשהיה שושבין בחתונה של חבר בראצ'ה, הכיר אורחת מקאחתי; ב-2011 הם נישאו. זמן
    קצר אחר כך, כשעבר ליד הסלע, הבחין בשקע שני, קטן יותר, מעל הראשון. הוא לא אמר מילה, חיכה לחשכה, התגנב
    החוצה וחצב אותו בגרזן לצורת לב, ולמחרת הביא לכאן את אשתו והקדיש לה את המפל. שנים שתק, וחייך כשכתבו
    על המפל כעל אגדה.


    כדאי להנמיך ציפיות: מדובר בכמה מטרים של סלע, לא במערה גדולה. ההנאה היא בפרטים: טחב עבה, קיסוס שממסגר
    את פתח המערה, מים שמטפטפים משפת הסלע בכל עונות השנה, והלב העליון, קטן מכדי שמישהו ייכנס בו. שביל קצר
    מוביל כמה מטרים פנימה, אל מאחורי הטיפות הנופלות, כך שאפשר להביט החוצה דרך הלב.


    רוב האתרים הרומנטיים עשויים מאגדות. זה עשוי מגחמה, מגרזן ומנישואים.
  tip: >-
    חצי שעה מספיקה. הסלע רטוב וחלקלק כל השנה, אז נעלו נעליים עם אחיזה טובה והחזיקו ילדים קטנים ביד ליד
    פתח המערה. אין במקום דבר – לא בית קפה ולא שירותים – אבל מרכז אמברולאורי נמצא במרחק כמה דקות נסיעה.
    המקום פופולרי, ובסופי שבוע בקיץ צפו להמתין בתור לצילום. הוא משתלב באופן טבעי עם אמברולאורי עצמה, כנסיית
    ברקוני וכרמי חוואנצ'קרה. ובבקשה, אל תוסיפו חריטות משלכם: לסלע הזה כבר יש יוצר.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60) כ-190 ק"מ, פנו צפונה בין זסטפוני לקוטאיסי לכביש Sh19 דרך טרג'ולה עד
    טקיבולי, ומשם בכביש Sh17 עברו את מעבר נקרלה ורדו אל אמברולאורי: כ-264 ק"מ, כארבע שעות ורבע בלי עצירות.
    במקום שבו ה-Sh17 נכנס לעיר, פנו מערבה אל דזירגאולי והמשיכו בסמטאות הכפר כשני קילומטרים עד הסלע; דרך
    נסללה אליו כדי להביא מבקרים. חנו היכן שהסמטה מאפשרת, ואת המטרים האחרונים עברו ברגל. רכב חסכוני מספיק.
ar:
  name: شلال الحب
  short: >-
    صخرة يكسوها الطحلب على طرف أمبرولاوري، يقطر الماء أمام فتحة كهف فيها على شكل قلب. القلب نُحت باليد،
    والقصة حقيقية.
  body: >-
    **ليس القلب من ألاعيب الطبيعة: نحته في الصخر رجل من أهل المكان، ثم نحت لاحقاً قلباً ثانياً أصغر لزوجته.**


    على الطرف الغربي من أمبرولاوري، في دزيراغيولي، يرشح الماء من صخرة صغيرة يكسوها الطحلب ويهبط في ستارة
    رقيقة لامعة. ظل لسنوات يقطر من شقّ عادي. ثم حمل ليفان موروسيدزه، طبيب الأسنان الذي يسكن قريباً، أدواته
    إلى الصخرة ووسّع الفتحة على هيئة قلب. وكما روى لموقع الأخبار الجورجي «برايم تايم» عام 2022، لم يكن
    حينها عاشقاً أصلاً. كل ما أراده أن يسقط الماء من قلب.


    جاء الحب بعد ذلك. ففي عام 2009، وكان إشبيناً للعريس في عرس صديق له في راتشا، التقى بضيفة قادمة من
    كاخيتي؛ وتزوّجا عام 2011. وبعد ذلك بقليل، وهو يمرّ بالصخرة، لاحظ تجويفاً ثانياً أصغر فوق الأول. لم
    يقل شيئاً، وانتظر حلول الظلام، وتسلّل خارجاً ونحته بفأس على شكل قلب، وفي اليوم التالي جاء بزوجته إلى
    هنا وأهداها الشلال. وظلّ صامتاً سنوات، يبتسم كلما كتب الناس عن الشلال بوصفه أسطورة.


    خفّف من توقعاتك: هذه أمتار قليلة من الصخر، لا مغارة. المتعة في التفاصيل: طحلب كثيف، ولبلاب يؤطّر فتحة
    الكهف، وماء يقطر من الحافة في كل فصول السنة، والقلب العلوي الذي يضيق عن أن يدخله أحد. ويقودك ممر قصير
    بضعة أمتار إلى الداخل، خلف القطرات المتساقطة، فتنظر إلى الخارج عبر القلب.


    معظم المعالم الرومانسية صُنعت من الأساطير. أما هذا فصُنع من نزوة وفأس وزواج.
  tip: >-
    نصف ساعة تكفي. الصخرة مبتلّة وزلقة طوال العام، فانتعل حذاءً جيد القبضة وأمسك بأيدي الأطفال الصغار
    عند فتحة الكهف. لا شيء في المكان، لا مقهى ولا دورة مياه، لكن وسط أمبرولاوري على بُعد دقائق بالسيارة.
    المكان مقصود بكثرة، ففي عطل نهاية الأسبوع صيفاً توقّع أن تنتظر دورك لالتقاط الصورة. ويمكن بطبيعة الحال
    أن تجمعه بزيارة أمبرولاوري نفسها وكنيسة باراكوني وكروم خفانتشكارا. ورجاءً لا تضف نقوشاً من عندك: فللصخرة
    صاحبها.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً نحو 190 كم، ثم انعطف شمالاً بين زيستافوني وكوتايسي إلى Sh19 عبر
    ترجولا حتى تكيبولي، ثم اتبع Sh17 عبر ممر ناكيرالا نزولاً إلى أمبرولاوري: نحو 264 كم، ونحو أربع ساعات
    وربع دون توقف. وعند دخول Sh17 إلى المدينة انعطف غرباً إلى دزيراغيولي واتبع أزقّة القرية نحو كيلومترين
    حتى الصخرة؛ فقد شُقّ إليها طريق لاستقبال الزوار. اركن حيث يسمح الزقاق وامشِ الأمتار الأخيرة. تكفي
    سيارة اقتصادية.
