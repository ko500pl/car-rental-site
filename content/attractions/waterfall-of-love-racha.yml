ka: {name: სიყვარულის ჩანჩქერი, short: ამბროლაურის შესასვლელთან გულის ფორმის ქვაბულიდან ჩამოშვებული პატარა ჩანჩქერი., body: ჩანჩქერის წყალი ხელოვნურად გამოკვეთილი გულის ფორმის კლდოვანი შესასვლელიდან ფარდასავით ეშვება. მოკლე ბილიკი ფოტოსა და მშვიდი გაჩერებისთვისაა., tip: სველი კლდე მოცურებადია; მყარ ძირიანი ფეხსაცმელი ჩაიცვით., route: ამბროლაურის შესასვლელთან, ძირაგეულის მხარეს; ნავიგაციაში ზუსტი ნიშნული გამოიყენეთ.}
en: {name: Waterfall of Love, short: A small waterfall dropping through a heart-shaped rock opening near Ambrolauri., body: Water falls like a curtain over an artificially shaped heart entrance. A short path makes this an easy scenic stop., tip: Wet rock is slippery; wear shoes with grip., route: Near the entrance to Ambrolauri on the Dzirageuli side; use the exact map pin.}
ru: {name: Водопад Любви, short: Небольшой водопад в проёме в форме сердца у въезда в Амбролаури., body: Вода спускается завесой над вырезанным в скале сердцем; к месту ведёт короткая тропа., tip: Мокрые камни скользкие; нужна обувь с хорошей подошвой., route: У въезда в Амбролаури со стороны Дзирагеули.}
fa: {name: آبشار عشق, short: آبشار کوچک با دهانه سنگی قلب‌شکل نزدیک آمبرولائوری., body: آب مانند پرده از دهانه قلب‌شکل فرو می‌ریزد و مسیر کوتاهی دارد., tip: سنگ خیس لغزنده است., route: در ورودی آمبرولائوری؛ از نشان دقیق نقشه استفاده کنید.}
he: {name: מפל האהבה, short: מפל קטן דרך פתח סלע בצורת לב ליד אמברולאורי., body: המים יורדים כווילון מעל הפתח ושביל קצר מוביל למקום., tip: הסלע הרטוב חלק., route: סמוך לכניסה לאמברולאורי; השתמשו בסימון המדויק.}
