ka:
  name: აბუდელაურის ტბები
  short: სამი მყინვარული ტბა — ცისფერი, მწვანე და თეთრი — ჭაუხის მასივის ძირში, 2500–2800 მეტრზე, ხევსურეთის ერთ-ერთი ყველაზე ლამაზი სალაშქრო მარშრუტი.
  body: >-
    **აბუდელაურის ტბები ხევსურეთის ყველაზე ცნობილი ბუნებრივი სანახაობაა.** სამი მყინვარული ტბა — ცისფერი,
    მწვანე და თეთრი — ჭაუხის კლდოვანი მასივის ჩრდილოეთ ძირში დევს, ზღვის დონიდან 2500–2800 მეტრზე. თითოეულს
    თავისი ხასიათი აქვს: ცისფერი ტბა წყნარ ამინდში ზურმუხტისფრად ანათებს და მასში ჭაუხის მწვერვალები ირეკლება,
    მწვანე ტბა რododendron-ებით შემოსილ ქვაყრილშია ჩამალული, თეთრი კი — ყველაზე მაღალი და ყველაზე ცივი —
    პირდაპირ მყინვარის ენის ქვეშ დგას და რძისფერი აქვს წყალი.


    ბილიკი იწყება სოფელ როშკაში (დაახლოებით 2000 მ), რომელიც თავად ღირს ნახვად: გიგანტური ლოდები, ქვის
    სახლები და ხედი გუდამაყრის ქედზე. ცისფერ და მწვანე ტბამდე სვლა აღმართში 2–2.5 საათია კარგად გაკვალული
    ბილიკით; თეთრ ტბამდე კიდევ 40–60 წუთი გიწევს ქვაყრილზე. ივნისში ფერდობები ველური ყვავილებითაა დაფარული,
    სექტემბერში კი ჰაერი ყველაზე გამჭვირვალეა და ჭაუხი თოვლის პირველი საფარით ჩანს.


    ტბები პშავ-ხევსურეთის ეროვნული პარკის ტერიტორიაზეა. აქედანვე იწყება გადასასვლელი ჭაუხის უღელტეხილით
    (3338 მ) ჯუთისკენ — ეს სრული დღის მძიმე ლაშქრობაა და მხოლოდ გამოცდილ მოლაშქრეებს ურჩევთ. ჩვეულებრივი
    ვიზიტისთვის როშკა–ტბები–როშკა წრე 5–7 საათში თავსდება.
  tip: >-
    ამინდი აქ სწრაფად იცვლება — საწვიმარი და თბილი შრე ზაფხულშიც აუცილებელია. წყალი და საკვები როშკაშივე
    აიღე: ბილიკზე არაფერი იყიდება, სოფელში კი რამდენიმე საოჯახო სასტუმროა, სადაც სადილს შეუკვეთ. ტბებში
    ბანაობა მკაცრად ცივი წყლის გამო სახიფათოა. საუკეთესო შუქი ფოტოებისთვის დილაა, სანამ ჭაუხს ღრუბელი
    მოადგება. მობილური კავშირი როშკის ზემოთ პრაქტიკულად არ არის — მარშრუტი წინასწარ ჩამოტვირთე.
  route: >-
    თბილისიდან ჟინვალამდე საქართველოს სამხედრო გზით, შემდეგ მარჯვნივ ბარისახოსკენ ხევსურეთის გზაზე. ბარისახოდან
    როშკამდე 12 კმ სერპანტინია — გრუნტოვანი, ქვიანი მონაკვეთებით, რომელიც მშრალ ამინდში მაღალი კლირენსის
    კროსოვერით გავლადია, წვიმის შემდეგ კი 4x4 გირჩევნია. სულ თბილისიდან როშკამდე ±116 კმ და დაახლოებით
    სამი საათი. მანქანა სოფლის ბოლოში რჩება, შემდეგ მხოლოდ ფეხით. ზამთარში როშკის გზა ხშირად ჩაკეტილია.
en:
  name: Abudelauri Lakes
  short: Three glacial lakes — Blue, Green and White — under the Chaukhi massif at 2,500–2,800 m, the finest
    day hike in Khevsureti.
  body: >-
    **The Abudelauri lakes are Khevsureti's most celebrated natural sight.** Three glacial lakes — Blue,
    Green and White — lie at the northern foot of the jagged Chaukhi massif at 2,500–2,800 metres. Each
    has its own character: in calm weather the Blue lake glows a deep turquoise and mirrors the Chaukhi
    towers, the Green lake hides among boulders overgrown with rhododendron, and the White lake — the
    highest and coldest — sits directly beneath the glacier tongue, its water a milky grey.


    The trail starts in Roshka village (about 2,000 m), itself worth a stop for its giant glacial boulders
    and stone houses. Reaching the Blue and Green lakes takes 2–2.5 hours of steady climbing on a well-trodden
    path; the White lake is another 40–60 minutes over rock debris. In June the slopes are covered in
    wildflowers; in September the air is at its clearest and Chaukhi carries its first dusting of snow.


    The lakes lie within Pshav-Khevsureti National Park. From here the trail continues over the Chaukhi
    Pass (3,338 m) to Juta — a hard full-day crossing for experienced hikers only. For a normal visit,
    the Roshka–lakes–Roshka loop fits comfortably into 5–7 hours.
  tip: >-
    Weather changes fast here — carry a rain shell and a warm layer even in July. Buy water and food in
    Roshka: nothing is sold on the trail, and the village guesthouses will cook a meal if you ask. Swimming
    is dangerous — the water is glacial. Morning light is best for photographs, before cloud builds on
    Chaukhi. There is effectively no mobile signal above Roshka, so download your maps in advance.
  route: >-
    From Tbilisi take the Georgian Military Highway to Zhinvali, then turn right onto the Khevsureti road
    towards Barisakho. From Barisakho a 12 km serpentine climbs to Roshka — gravel with rocky stretches,
    passable in a high-clearance crossover when dry, better with a 4x4 after rain. In total about 116
    km and three hours from Tbilisi. Cars stay at the end of the village; from there it is foot only.
    In winter the Roshka road is frequently closed.
ru:
  name: Абуделаурские озёра
  short: Три ледниковых озера — Голубое, Зелёное и Белое — у подножия массива Чаухи на высоте 2500–2800
    м, лучший однодневный маршрут Хевсурети.
  body: >-
    **Абуделаурские озёра — самая известная природная достопримечательность Хевсурети.** Три ледниковых
    озера — Голубое, Зелёное и Белое — лежат у северного подножия зубчатого массива Чаухи на высоте 2500–2800
    метров. У каждого свой характер: Голубое в тихую погоду светится бирюзой и отражает башни Чаухи, Зелёное
    прячется среди валунов, заросших рододендроном, а Белое — самое высокое и холодное — стоит прямо под
    языком ледника, и вода у него молочно-серая.


    Тропа начинается в селе Рошка (около 2000 м), которое само по себе стоит остановки: гигантские ледниковые
    валуны и каменные дома. До Голубого и Зелёного озёр — 2–2,5 часа ровного подъёма по натоптанной тропе;
    до Белого — ещё 40–60 минут по каменной осыпи. В июне склоны покрыты альпийскими цветами, в сентябре
    воздух прозрачнее всего, а Чаухи стоит в первом снегу.


    Озёра находятся на территории национального парка Пшав-Хевсурети. Отсюда тропа продолжается через
    перевал Чаухи (3338 м) в Джуту — тяжёлый маршрут на полный день только для опытных туристов. Обычный
    визит Рошка–озёра–Рошка укладывается в 5–7 часов.
  tip: >-
    Погода меняется быстро — дождевик и тёплый слой нужны даже в июле. Воду и еду берите в Рошке: на тропе
    ничего не продаётся, а в гостевых домах села приготовят обед по просьбе. Купаться опасно — вода ледниковая.
    Лучший свет для фотографий утром, пока Чаухи не затянуло облаками. Выше Рошки мобильной связи практически
    нет — скачайте карты заранее.
  route: >-
    Из Тбилиси по Военно-Грузинской дороге до Жинвали, затем направо на хевсуретскую дорогу к Барисахо.
    От Барисахо к Рошке поднимается 12-километровый серпантин — гравий с каменистыми участками; в сухую
    погоду проходим на кроссовере с высоким клиренсом, после дождя лучше 4x4. Всего от Тбилиси около 116
    км и три часа. Машина остаётся на краю села, дальше только пешком. Зимой дорога на Рошку часто закрыта.
fa:
  name: دریاچه‌های آبودلائوری
  short: سه دریاچهٔ یخچالی — آبی، سبز و سفید — در پای تودهٔ چائوخی در ارتفاع 2,500 تا 2,800 متر؛ بهترین
    پیاده‌روی یک‌روزهٔ خوسورتی.
  body: >-
    **دریاچه‌های آبودلائوری نامدارترین جاذبهٔ طبیعی خوسورتی است.** سه دریاچهٔ یخچالی — آبی، سبز و سفید
    — در پای شمالی تودهٔ دندانه‌دار چائوخی در ارتفاع 2,500 تا 2,800 متر آرمیده‌اند. هر یک خلق‌وخوی خود
    را دارد: دریاچهٔ آبی در هوای آرام به رنگ فیروزه‌ای می‌درخشد و برج‌های چائوخی را بازمی‌تاباند، دریاچهٔ
    سبز میان تخته‌سنگ‌های پوشیده از خرزهره پنهان است و دریاچهٔ سفید — بلندترین و سردترین — درست زیر زبانهٔ
    یخچال نشسته و آبی شیری‌رنگ دارد.


    کوره‌راه از روستای روشکا (حدود 2,000 متر) آغاز می‌شود که خودش با تخته‌سنگ‌های غول‌پیکر یخچالی و خانه‌های
    سنگی ارزش توقف دارد. رسیدن به دریاچه‌های آبی و سبز 2 تا 2.5 ساعت بالا رفتن یکنواخت روی راهی کوبیده
    است؛ دریاچهٔ سفید 40 تا 60 دقیقهٔ دیگر روی واریزه‌های سنگی راه دارد. در ژوئن دامنه‌ها پر از گل‌های
    وحشی است و در سپتامبر هوا شفاف‌ترین حالت را دارد و چائوخی نخستین برف خود را به تن می‌کند.


    دریاچه‌ها در پارک ملی پشاو-خوسورتی قرار دارند. از اینجا مسیر از گردنهٔ چائوخی (3,338 متر) به سوی جوتا
    ادامه می‌یابد — گذری دشوار و تمام‌روز فقط برای کوهنوردان باتجربه. برای بازدید معمولی، حلقهٔ روشکا–دریاچه‌ها–روشکا
    در 5 تا 7 ساعت جا می‌گیرد.
  tip: >-
    هوا اینجا سریع عوض می‌شود — بادگیر بارانی و لایهٔ گرم حتی در ژوئیه لازم است. آب و خوراک را در روشکا
    بردارید: در مسیر چیزی فروخته نمی‌شود و مهمان‌خانه‌های روستا اگر بخواهید غذا می‌پزند. شنا خطرناک است
    — آب یخچالی است. بهترین نور عکاسی صبح است، پیش از آنکه ابر روی چائوخی بنشیند. بالای روشکا عملاً آنتن
    موبایل نیست — نقشه‌ها را از پیش دانلود کنید.
  route: >-
    از تفلیس با بزرگراه نظامی گرجستان تا ژینوالی بروید و سپس به راست به جادهٔ خوسورتی به سوی باریساخو
    بپیچید. از باریساخو سربالایی مارپیچ 12 کیلومتری به روشکا می‌رسد — شنی با تکه‌های سنگلاخ؛ در هوای خشک
    با کراس‌اوور شاسی‌بلند می‌گذرد و پس از باران 4x4 بهتر است. روی هم از تفلیس حدود 116 کیلومتر و سه ساعت.
    خودرو در انتهای روستا می‌ماند و از آنجا فقط پیاده. در زمستان جادهٔ روشکا اغلب بسته است.
he:
  name: אגמי אבודלאורי
  short: שלושה אגמים קרחוניים — כחול, ירוק ולבן — למרגלות מסיב צ'אוחי בגובה 2,500–2,800 מטר; מסלול היום
    היפה ביותר בחווסורטי.
  body: >-
    **אגמי אבודלאורי הם אתר הטבע המפורסם ביותר של חווסורטי.** שלושה אגמים קרחוניים — כחול, ירוק ולבן —
    שוכנים למרגלותיו הצפוניות של מסיב צ'אוחי המשונן בגובה 2,500–2,800 מטר. לכל אחד אופי משלו: האגם הכחול
    זוהר בטורקיז במזג אוויר שקט ומשקף את מגדלי צ'אוחי, הירוק מסתתר בין סלעים מכוסי רודודנדרון, והלבן —
    הגבוה והקר מכולם — יושב ממש מתחת ללשון הקרחון ומימיו אפורים-חלביים.


    השביל מתחיל בכפר רושקה (כ-2,000 מטר), ששווה עצירה בפני עצמו בזכות סלעי הענק הקרחוניים ובתי האבן. ההליכה
    לאגמים הכחול והירוק אורכת 2–2.5 שעות של טיפוס מתון בשביל כבוש; האגם הלבן דורש עוד 40–60 דקות על פזורת
    סלעים. ביוני המדרונות מכוסים פרחי בר, ובספטמבר האוויר צלול מתמיד וצ'אוחי עוטה את השלג הראשון.


    האגמים נמצאים בשטח הפארק הלאומי פשאב-חווסורטי. מכאן ממשיך השביל דרך מעבר צ'אוחי (3,338 מטר) אל ג'וטה
    — חצייה קשה של יום שלם למטיילים מנוסים בלבד. לביקור רגיל, הלולאה רושקה–אגמים–רושקה נכנסת בנוחות ב-5–7
    שעות.
  tip: >-
    מזג האוויר משתנה כאן מהר — קחו מעיל גשם ושכבה חמה גם ביולי. מים ואוכל קנו ברושקה: על השביל לא נמכר
    דבר, ובבתי ההארחה בכפר יבשלו ארוחה לפי בקשה. השחייה מסוכנת — המים קרחוניים. האור הטוב ביותר לצילום
    הוא בבוקר, לפני שהעננים מתקבצים על צ'אוחי. מעל רושקה אין למעשה קליטה סלולרית — הורידו מפות מראש.
  route: >-
    מטביליסי נוסעים בכביש הצבא הגאורגי עד ז'ינוואלי, ואז פונים ימינה לכביש חווסורטי לכיוון בריסאחו. מבריסאחו
    מטפס סרפנטין של 12 ק״מ לרושקה — כביש כורכר עם קטעים סלעיים; יבש הוא עביר לקרוסאובר גבוה, אחרי גשם
    עדיף 4x4. בסך הכול כ-116 ק״מ ושלוש שעות מטביליסי. הרכב נשאר בקצה הכפר, ומשם רק ברגל. בחורף הדרך לרושקה
    סגורה לעיתים קרובות.
ar:
  name: بحيرات أبوديلاوري
  short: ثلاث بحيرات جليدية — الزرقاء والخضراء والبيضاء — عند سفح كتلة تشاوخي على ارتفاع 2,500–2,800 متر؛
    أجمل مسير يوم واحد في خفسوريتي.
  body: >-
    **بحيرات أبوديلاوري هي أشهر معلم طبيعي في خفسوريتي.** ثلاث بحيرات جليدية — الزرقاء والخضراء والبيضاء
    — ترقد عند السفح الشمالي لكتلة تشاوخي المسنّنة على ارتفاع 2,500 إلى 2,800 متر. ولكل واحدة طبعها: فالزرقاء
    تتوهج فيروزيةً في الطقس الهادئ وتعكس أبراج تشاوخي، والخضراء تختبئ بين جلاميد يكسوها الدفلى الجبلي،
    والبيضاء — الأعلى والأبرد — تجلس مباشرة تحت لسان النهر الجليدي وماؤها رمادي حليبي.


    يبدأ الدرب في قرية روشكا (نحو 2,000 متر)، وهي بذاتها تستحق التوقف بجلاميدها الجليدية العملاقة وبيوتها
    الحجرية. يستغرق بلوغ البحيرتين الزرقاء والخضراء ساعتين إلى ساعتين ونصف من صعود متصل على درب واضح؛
    والبيضاء تبعد 40 إلى 60 دقيقة أخرى فوق ركام صخري. في يونيو تكتسي المنحدرات بالأزهار البرية، وفي سبتمبر
    يبلغ الهواء أقصى صفائه وتلبس تشاوخي أول ثلوجها.


    تقع البحيرات ضمن منتزه بشاف-خفسوريتي الوطني. ومن هنا يواصل الدرب عبر ممر تشاوخي (3,338 متراً) نحو
    جوتا — عبور شاق يستغرق يوماً كاملاً وللمتمرسين فقط. أما الزيارة العادية فحلقة روشكا–البحيرات–روشكا
    تتم في 5 إلى 7 ساعات.
  tip: >-
    يتقلب الطقس هنا بسرعة — خذ واقياً من المطر وطبقة دافئة حتى في يوليو. اشترِ الماء والطعام في روشكا:
    لا يُباع شيء على الدرب، وبيوت الضيافة في القرية تطبخ وجبة إن طلبت. السباحة خطرة — فالماء جليدي. أفضل
    ضوء للتصوير في الصباح قبل أن يتجمع الغيم على تشاوخي. لا إرسال هاتفياً عملياً فوق روشكا — نزّل الخرائط
    مسبقاً.
  route: >-
    من تبليسي عبر الطريق العسكري الجورجي حتى جينفالي، ثم انعطف يميناً إلى طريق خفسوريتي نحو باريساخو. من
    باريساخو يتسلق طريق متعرج طوله 12 كم إلى روشكا — حصوي مع مقاطع صخرية؛ يمكن اجتيازه بكروس أوفر مرتفع
    في الجفاف، وبعد المطر يُفضَّل الدفع الرباعي. الإجمالي نحو 116 كم وثلاث ساعات من تبليسي. تُترك السيارة
    في آخر القرية ثم سيراً فقط. وفي الشتاء كثيراً ما يُغلق طريق روشكا.
