ka:
  name: აბუდელაურის ტბები
  short: >-
    სამი მყინვარული ტბა ჭაუხის ძირში — მწვანე, ცისფერი და მყინვართან, 2800 მეტრზე მაღლა, რძესავით თეთრი;
    როშკიდან 7 კილომეტრი ფეხით ან ცხენით.
  body: >-
    **სამი ტბა, სამი ფერი, ქვის ამფითეატრი ჭაუხის კბილების ქვეშ — როშკის იქით კი გზა აღარ არის.**


    როშკა 2067 მეტრზე დგას და გზა სოფლის პირასვე გაოცებით იწყება: ფერდზე სახლის ოდენა ლოდები ყრია — უდიდესი
    25 მეტრი სიგრძისაა. ისინი პლეისტოცენის მყინვარმა ჩამოზიდა, რომლის ენაც ლეღვამდე, 1450 მეტრამდე ეშვებოდა.
    დღეს „როშკის ლოდები“ ბუნების ძეგლია, სოფლიდან ათ წუთში მიხვალთ.


    ტბებამდე ბილიკი შვიდ კილომეტრს ითვლის და ფეხითაც გაივლება და ცხენითაც. ის მდელოებსა და დეკიანს მიუყვება,
    ბოლოს კი ქვაყრილზე ადის, სადაც მწვანე და ცისფერი ტბები ერთმანეთის გვერდით წევს. მათ ფერს მყინვარის
    მოტანილი ნალექი ქმნის: წყალში შეტივტივებული წვრილი ნაწილაკები მზის სხივს ხან ცისფრად, ხან მწვანედ
    აირეკლავენ, წყნარ ამინდში კი ჭაუხის კოშკები ზედაპირზე თავდაყირა დგანან. თეთრი ტბა კიდევ კილომეტრნახევრით
    მაღლაა, მყინვარის ჩამოტანილ ლოდებს შორის, 2800 მეტრზე ზემოთ, ჭაუხის მყინვარის ძირში. მისი რძისფერი
    წყალი კარბონატებითაა გაჯერებული.


    აქ ყველაზე კარგი დრო ივნისი და ივლისია; აგვისტოში ტბებს წყალი აკლდება, წლის დანარჩენ ნაწილში კი ყველაფერი
    თოვლის ქვეშაა. თეთრი ტბის იქით ბილიკი ჭაუხის ქედზე გადადის და ჯუთაში ეშვება — ეს მძიმე გადასასვლელია,
    გრძელი დღე ან ორი, მხოლოდ გამოცდილი მოლაშქრეებისთვის.


    შუადღისას ცისფერ ტბასთან ჩამოჯექით და მხოლოდ ნადნობი წყლის ჩუხჩუხი მოგესმებათ. მყინვარი, რომელმაც
    ეს ყველაფერი შექმნა, ჯერ კიდევ იქ, ზემოთაა და საქმეს არ ანებებს თავს.
  tip: >-
    ცისფერ და მწვანე ტბებამდე და უკან, თეთრი ტბის ჩათვლით, ექვს-რვა საათს ანგარიშობენ. ამინდი აქ დღის
    განმავლობაში რამდენჯერმე იცვლება: მზიანი დილა წვიმიან შუადღედ იქცევა, ამიტომ საწვიმარი და თბილი შრე
    ივლისშიც აუცილებელია. ბილიკზე არაფერი იყიდება — წყალი და საგზალი როშკიდან წაიღეთ; სოფლის საოჯახო სასტუმროები
    სადილსაც მოგიმზადებენ, კარვის გაშლაც შეიძლება. როშკაში ბანკომატი არ არის, ფული ბარისახომდე აიღეთ.
    მყინვარის წყალში ბანაობა სახიფათოა. როშკის ზემოთ მობილური კავშირი თითქმის არ არის, რუკა წინასწარ ჩამოტვირთეთ.
  route: >-
    თბილისიდან სამხედრო გზით (S3/E117) ჟინვალამდე იარეთ, იქ კი ხევსურეთის გზაზე, ფშავის არაგვის ხეობით
    ბარისახოსკენ გადაუხვიეთ — აქამდე ასფალტია. ბარისახოს შემდეგ ციცაბო, ქვიანი გრუნტის გზა როშკამდე ადის:
    მშრალ ამინდში მაღალი კლირენსის კროსოვერი ავა, წვიმის შემდეგ კი ნამდვილი ოთხწამყვანიანი მანქანა გჭირდებათ.
    სულ დაახლოებით 119 კილომეტრი და სამ საათზე ცოტა მეტი. მანქანა სოფლის ბოლოს რჩება, შემდეგ მხოლოდ ფეხით
    ან ცხენით. ივნისიდან სექტემბრამდე გზა ჩვეულებრივ გახსნილია, დანარჩენ თვეებში თოვლი ხშირად კეტავს.
    ავზი სამხედრო გზიდან გადახვევამდე შეავსეთ.
en:
  name: Abudelauri Lakes
  short: >-
    Three glacial lakes under Chaukhi, green, blue and a milky white one at the glacier's foot above 2,800
    m, seven kilometres on foot or horseback from Roshka.
  body: >-
    **Three lakes, three colours, one stone amphitheatre under the teeth of Chaukhi — and no road beyond
    Roshka.**


    Roshka stands at 2,067 metres, and the walk begins with a shock at the edge of the village: boulders
    the size of houses, the largest 25 metres long, scattered across the slope. A Pleistocene glacier
    carried them here when its tongue reached all the way down to Leghvi, at 1,450 metres. The Roshka
    boulders are now a protected natural monument, ten minutes from the last house.


    The trail to the lakes runs seven kilometres and can be done on foot or on horseback. It climbs through
    meadow and rhododendron scrub, then over rubble to the Green and Blue lakes, which lie close together.
    Their colours come from glacial sediment, fine particles suspended in the water that throw the sunlight
    back blue or green; on a still morning the towers of Chaukhi hang upside down in them. The White Lake
    is another kilometre and a half up, across boulders dropped by the ice, above 2,800 metres at the
    base of the Chaukhi glacier. Its milky water is loaded with carbonates.


    June and July are the months to come. By August the water runs low, and for the rest of the year snow
    covers everything. Beyond the White Lake a path crosses the Chaukhi ridge to Juta, a serious crossing
    of a long day or two for experienced hikers only.


    Sit by the Blue Lake at noon and the only sound is meltwater. The glacier that made all of this is
    still up there, and still at work.
  tip: >-
    Allow six to eight hours for the round trip including the White Lake. The weather turns several times
    a day, a sunny morning becoming a wet afternoon, so carry a rain shell and a warm layer even in July.
    Nothing is sold on the trail: take water and food from Roshka, where guesthouses will cook for you
    and camping is possible. There is no ATM in Roshka, so bring cash from Barisakho or earlier. Glacial
    water makes swimming dangerous. Above the village there is almost no mobile signal, so download maps
    before you set off.
  route: >-
    From Tbilisi take the Georgian Military Highway (S3/E117) to Zhinvali, then turn onto the Khevsureti
    road up the Pshavi Aragvi valley to Barisakho, asphalt so far. Beyond Barisakho a steep, stony gravel
    road climbs to Roshka: a high-clearance crossover manages it in the dry, but after rain you want a
    real 4x4. In all it is about 119 km and a little over three hours. Cars stay at the end of the village;
    from there it is feet or hooves. The road is normally open from June to September and often snowbound
    the rest of the year. Fill the tank before you leave the Military Highway.
ru:
  name: Абуделаурские озёра
  short: >-
    Три ледниковых озера под Чаухи — зелёное, голубое и молочно-белое у подножия ледника, выше 2800 м,
    в семи километрах пешком или верхом от Рошки.
  body: >-
    **Три озера, три цвета, каменный амфитеатр под зубцами Чаухи — и дальше Рошки дороги нет.**


    Рошка стоит на высоте 2067 метров, и прогулка начинается с потрясения прямо на околице: по склону
    разбросаны валуны размером с дом, самый большой — 25 метров в длину. Их принёс плейстоценовый ледник,
    язык которого спускался до самого Легви, на высоту 1450 метров. Сегодня рошкинские валуны — охраняемый
    памятник природы в десяти минутах от последнего дома.


    Тропа к озёрам длиной семь километров, пройти её можно пешком или верхом. Она поднимается лугами и
    зарослями рододендрона, потом по каменной осыпи к Зелёному и Голубому озёрам, которые лежат рядом.
    Цвет им дают ледниковые наносы: тончайшая взвесь в воде отражает солнечный свет синим или зелёным,
    а тихим утром в них вниз головой висят башни Чаухи. До Белого озера — ещё полтора километра вверх
    по валунам, брошенным льдом, выше 2800 метров, у основания ледника Чаухи. Его молочная вода насыщена
    карбонатами.


    Приезжать стоит в июне и июле. К августу вода мелеет, а весь остальной год здесь лежит снег. За Белым
    озером тропа переваливает через хребет Чаухи в Джуту — серьёзный переход на долгий день или два, только
    для опытных туристов.


    Посидите в полдень у Голубого озера: единственный звук здесь — талая вода. Ледник, создавший всё это,
    по-прежнему там, наверху, и по-прежнему работает.
  tip: >-
    На путь туда и обратно с Белым озером закладывайте шесть–восемь часов. Погода меняется по нескольку
    раз за день, солнечное утро легко оборачивается дождливым днём, так что даже в июле берите дождевик
    и тёплую кофту. На тропе ничего не продают: воду и еду возьмите в Рошке, где гостевые дома накормят,
    а палатку тоже можно поставить. Банкомата в Рошке нет — наличные везите из Барисахо или раньше. Купаться
    в ледниковой воде опасно. Выше села связи почти нет, поэтому скачайте карты заранее.
  route: >-
    Из Тбилиси — по Военно-Грузинской дороге (S3/E117) до Жинвали, затем сверните на хевсурскую дорогу
    вверх по долине Пшавской Арагви до Барисахо; до этого места — асфальт. За Барисахо крутая каменистая
    грунтовка поднимается к Рошке: в сухую погоду кроссовер с высоким клиренсом справится, но после дождя
    нужен настоящий полноприводный внедорожник. Всего около 119 км и чуть больше трёх часов. Машину оставляют
    на краю села, дальше — пешком или верхом. Обычно дорога открыта с июня по сентябрь, в остальное время
    её часто заметает снегом. Заправьтесь до того, как свернёте с Военно-Грузинской дороги.
fa:
  name: دریاچه‌های آبودلائوری
  short: >-
    سه دریاچهٔ یخچالی زیر چائوخی، سبز و آبی و یکی شیری‌رنگ در پای یخچال بالای ۲,۸۰۰ متر، هفت کیلومتر پیاده
    یا سواره از روشکا.
  body: >-
    **سه دریاچه، سه رنگ، آمفی‌تئاتری سنگی زیر دندانه‌های چائوخی — و هیچ جاده‌ای از روشکا فراتر نمی‌رود.**


    روشکا در ارتفاع ۲,۰۶۷ متر نشسته و پیاده‌روی از همان لبهٔ روستا با حیرت آغاز می‌شود: تخته‌سنگ‌هایی
    به بزرگی خانه روی شیب پراکنده‌اند و بزرگ‌ترینشان ۲۵ متر درازا دارد. یخچالی از دوران پلیستوسن آن‌ها
    را به اینجا آورده، روزگاری که زبانه‌اش تا لغوی، در ارتفاع ۱,۴۵۰ متر، پایین می‌آمد. تخته‌سنگ‌های روشکا
    امروز اثر طبیعی حفاظت‌شده‌اند و تنها ده دقیقه با آخرین خانه فاصله دارند.


    راه دریاچه‌ها هفت کیلومتر است و می‌توان آن را پیاده یا سواره پیمود. از میان علفزار و بوته‌زار رودودندرون
    بالا می‌رود، سپس از روی سنگ‌ریزه‌ها به دریاچه‌های سبز و آبی می‌رسد که کنار هم افتاده‌اند. رنگشان از
    رسوب یخچالی است: ذرات ریزی معلق در آب که نور خورشید را آبی یا سبز بازمی‌تابانند؛ در صبحی آرام، برج‌های
    چائوخی وارونه در آب‌هایشان آویخته‌اند. دریاچهٔ سفید یک‌ونیم کیلومتر بالاتر است، آن‌سوی تخته‌سنگ‌هایی
    که یخ برجا گذاشته، بالاتر از ۲,۸۰۰ متر و در پای یخچال چائوخی. آب شیری‌رنگش سرشار از کربنات است.


    ژوئن و ژوئیه بهترین ماه‌های سفرند. تا اوت آب پایین می‌رود و در باقی سال برف همه‌چیز را می‌پوشاند.
    آن‌سوی دریاچهٔ سفید، کوره‌راهی از روی یال چائوخی به جوتا می‌رسد؛ گذری جدی در یک روز طولانی یا دو روز،
    تنها برای کوهنوردان باتجربه.


    نیمروز کنار دریاچهٔ آبی بنشینید؛ تنها صدایی که می‌شنوید شُرشُر آبِ ذوب‌شدهٔ یخ است. یخچالی که همهٔ
    این‌ها را ساخته هنوز آن بالاست و هنوز کارش را می‌کند.
  tip: >-
    برای رفت‌وبرگشت همراه با دریاچهٔ سفید شش تا هشت ساعت وقت بگذارید. هوا چند بار در روز عوض می‌شود و
    صبح آفتابی به بعدازظهری بارانی بدل می‌شود، پس حتی در ژوئیه بارانی و یک لایهٔ گرم همراه داشته باشید.
    در مسیر چیزی فروخته نمی‌شود: آب و خوراک را از روشکا بردارید؛ مهمان‌خانه‌ها آنجا برایتان غذا می‌پزند
    و چادر زدن هم ممکن است. در روشکا خودپرداز نیست، پس پول نقد را از باریساخو یا پیش از آن همراه بیاورید.
    آب یخچالی شنا را خطرناک می‌کند. بالای روستا تقریباً هیچ آنتن موبایلی نیست، پس نقشه‌ها را پیش از راه
    افتادن دانلود کنید.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (S3/E117) را تا ژینوالی بروید، سپس به جادهٔ خوسورتی بپیچید که درهٔ آراگوی
    پشاوی را تا باریساخو بالا می‌رود؛ تا اینجا آسفالت است. پس از باریساخو جاده‌ای شنی، تند و سنگلاخ تا
    روشکا بالا می‌رود: کراس‌اوورِ شاسی‌بلند در هوای خشک از پسش برمی‌آید، اما پس از باران یک خودروی چهارچرخ‌محرک
    واقعی لازم دارید. روی‌هم حدود ۱۱۹ کیلومتر و کمی بیش از سه ساعت. خودروها در انتهای روستا می‌مانند؛
    از آنجا یا پای پیاده یا سم اسب. جاده معمولاً از ژوئن تا سپتامبر باز است و در باقی سال اغلب زیر برف
    می‌ماند. پیش از ترک جادهٔ نظامی باک را پر کنید.
he:
  name: אגמי אבודלאורי
  short: >-
    שלושה אגמים קרחוניים מתחת לצ'אוחי: ירוק, כחול ולבן-חלבי למרגלות הקרחון בגובה של יותר מ-2,800 מטר,
    שבעה קילומטרים ברגל או על סוס מרושקה.
  body: >-
    **שלושה אגמים, שלושה צבעים, אמפיתיאטרון של אבן מתחת לשיני הסלע של צ'אוחי – ואף כביש אינו ממשיך מעבר
    לרושקה.**


    רושקה שוכנת בגובה 2,067 מטר, וההליכה נפתחת בהלם כבר בקצה הכפר: סלעים בגודל של בתים פזורים על המדרון,
    והגדול שבהם באורך 25 מטר. קרחון מתקופת הפליסטוקן הביא אותם לכאן, בימים שבהם לשונו הגיעה עד לגווי,
    בגובה 1,450 מטר. סלעי רושקה הם כיום אתר טבע מוגן, עשר דקות מהבית האחרון.


    השביל לאגמים אורכו שבעה קילומטרים, ואפשר לעבור אותו ברגל או על גב סוס. הוא מטפס דרך אחו וסבך רודודנדרון,
    ואחר כך על פני מפולת סלעים אל האגם הירוק והאגם הכחול, השוכנים סמוך זה לזה. את צבעיהם הם מקבלים ממשקע
    קרחוני: חלקיקים זעירים המרחפים במים ומחזירים את אור השמש בכחול או בירוק; בבוקר שקט משתקפים בהם מגדלי
    צ'אוחי הפוכים. האגם הלבן נמצא עוד קילומטר וחצי למעלה, על פני סלעים שהותיר הקרח, בגובה של יותר מ-2,800
    מטר, בבסיס קרחון צ'אוחי. מימיו החלביים רוויים בקרבונטים.


    הזמן הטוב ביותר לבוא הוא יוני ויולי. עד אוגוסט מפלס המים יורד, ובשאר השנה השלג מכסה הכול. מעבר לאגם
    הלבן חוצה שביל את רכס צ'אוחי אל ג'וטה: מעבר רציני של יום ארוך או יומיים, למטיילים מנוסים בלבד.


    שבו ליד האגם הכחול בצהריים, והצליל היחיד שתשמעו הוא פכפוך מי ההפשרה. הקרחון שיצר את כל זה עדיין שם
    למעלה, ועדיין עושה את מלאכתו.
  tip: >-
    הקצו שש עד שמונה שעות הלוך ושוב, כולל האגם הלבן. מזג האוויר מתהפך כמה פעמים ביום, ובוקר שמשי הופך
    לאחר צהריים גשום, אז קחו מעיל גשם ושכבה חמה גם ביולי. לאורך השביל לא מוכרים דבר: הצטיידו במים ובאוכל
    ברושקה, שבה בתי ההארחה יבשלו בשבילכם ואפשר גם להקים אוהל. אין כספומט ברושקה, אז הביאו מזומן מבריסאחו
    או ממקום מוקדם יותר. המים הקרחוניים הופכים רחצה למסוכנת. מעל הכפר כמעט אין קליטה סלולרית, אז הורידו
    מפות לפני היציאה.
  route: >-
    מטביליסי סעו בכביש הצבאי הגאורגי (S3/E117) עד ז'ינוואלי, ואז פנו לכביש לחבסורטי, העולה בעמק אראגווי
    של פשאווי עד בריסאחו; עד כאן אספלט. אחרי בריסאחו מטפסת דרך עפר תלולה ואבנית אל רושקה: קרוסאובר עם
    מרווח גחון גבוה יעבור כשיבש, אבל אחרי גשם צריך רכב שטח של ממש עם הנעה כפולה. בסך הכול כ-119 ק"מ וקצת
    יותר משלוש שעות. המכוניות נשארות בקצה הכפר; משם ממשיכים ברגל או על סוס. הדרך פתוחה בדרך כלל מיוני
    עד ספטמבר, ובשאר השנה היא חסומה לעיתים קרובות בשלג. מלאו את המכל לפני שאתם יורדים מהכביש הצבאי.
ar:
  name: بحيرات أبوديلاوري
  short: >-
    ثلاث بحيرات جليدية تحت تشاوخي: خضراء وزرقاء وبيضاء حليبية عند قدم النهر الجليدي فوق 2,800 متر، على
    بعد سبعة كيلومترات مشياً أو على ظهر حصان من روشكا.
  body: >-
    **ثلاث بحيرات، ثلاثة ألوان، ومدرج حجري تحت أسنان تشاوخي — ولا طريق للسيارات بعد روشكا.**


    تقع روشكا على ارتفاع 2,067 متراً، وتبدأ المسيرة بمفاجأة عند طرف القرية مباشرة: جلاميد بحجم البيوت
    متناثرة على المنحدر، أكبرها بطول 25 متراً. حملها إلى هنا نهر جليدي من العصر البليستوسيني حين كان لسانه
    يمتد نزولاً حتى ليغفي على ارتفاع 1,450 متراً. وجلاميد روشكا اليوم معلم طبيعي محمي، على بعد عشر دقائق
    من آخر بيت.


    يمتد الدرب إلى البحيرات سبعة كيلومترات، ويمكن قطعه مشياً أو على ظهر حصان. يصعد عبر المروج وأجمات الرودودندرون،
    ثم فوق الركام الصخري إلى البحيرتين الخضراء والزرقاء المتجاورتين. ويأتي لونهما من الرواسب الجليدية:
    جسيمات دقيقة عالقة في الماء تعكس ضوء الشمس أزرق أو أخضر؛ وفي صباح ساكن تتدلى أبراج تشاوخي مقلوبة على
    صفحتيهما. أما البحيرة البيضاء فتقع أعلى بكيلومتر ونصف، عبر جلاميد خلّفها الجليد، فوق 2,800 متر عند
    قاعدة نهر تشاوخي الجليدي. وماؤها الحليبي مشبع بالكربونات.


    يونيو ويوليو هما شهرا الزيارة. فبحلول أغسطس ينحسر الماء، وفي بقية العام يغطي الثلج كل شيء. وبعد البحيرة
    البيضاء يعبر درب سلسلة تشاوخي إلى جوتا، وهو عبور جادّ يستغرق يوماً طويلاً أو يومين، ولا يصلح إلا للمتنزهين
    المتمرسين.


    اجلس عند البحيرة الزرقاء ظهراً، فلن تسمع سوى خرير ماء الذوبان. والنهر الجليدي الذي صنع هذا كله لا
    يزال هناك في الأعلى، ولا يزال يعمل.
  tip: >-
    خصّص ست إلى ثماني ساعات للذهاب والإياب بما في ذلك البحيرة البيضاء. يتقلب الطقس مرات عدة في اليوم،
    فيصير الصباح المشمس ظهيرة ماطرة، لذا احمل سترة واقية من المطر وطبقة دافئة حتى في يوليو. لا شيء يُباع
    على الدرب: خذ الماء والطعام من روشكا، حيث تطهو لك بيوت الضيافة ويمكن التخييم. لا صراف آلياً في روشكا،
    فأحضر النقود من باريساخو أو قبلها. الماء الجليدي يجعل السباحة خطرة. وفوق القرية تكاد تنعدم تغطية الهاتف،
    فنزّل الخرائط قبل الانطلاق.
  route: >-
    من تبليسي اسلك الطريق العسكري الجورجي (S3/E117) حتى جينفالي، ثم انعطف إلى طريق خيفسوريتي صاعداً في
    وادي بشافي أراغفي حتى باريساخو، والطريق معبّد حتى هنا. بعد باريساخو يصعد طريق حصوي وعر شديد الانحدار
    إلى روشكا: تجتازه سيارة كروس أوفر عالية الخلوص في الطقس الجاف، أما بعد المطر فتحتاج إلى سيارة دفع
    رباعي حقيقية. المسافة الإجمالية نحو 119 كم وما يزيد قليلاً على ثلاث ساعات. تبقى السيارات عند طرف القرية؛
    ومن هناك إما القدمان وإما الحوافر. يُفتح الطريق عادة من يونيو إلى سبتمبر، وكثيراً ما يغلقه الثلج في
    بقية العام. املأ خزان الوقود قبل مغادرة الطريق العسكري.
