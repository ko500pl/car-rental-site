ka:
  name: ბუღდაშენის ტბა
  short: >-
    ჯავახეთის ზეგნის ზედაპირული ვულკანური ტბა, არსად 85 სანტიმეტრზე ღრმა — რამსარის ჭარბტენიანი ტერიტორია
    გადამფრენი ფრინველებისთვის.
  body: >-
    **ბუღდაშენის ტბა თითქმის ფეხით გადაილახება: 0,39 კვადრატული კილომეტრი წყალი 2040 მეტრის სიმაღლეზე,
    რომელიც არსად 85 სანტიმეტრზე ღრმა არ არის.**


    ტბა ჯავახეთის ვულკანური ზეგნის ფერდობებს შორის, ნინოწმინდიდან დაახლოებით ათ კილომეტრში, სამხრეთ-აღმოსავლეთით
    წევს. მას თოვლის ნადნობი, წვიმა და მიწისქვეშა წყალი კვებავს დაახლოებით 69 კვადრატული კილომეტრის აუზიდან.
    წყალი გაზაფხულზე ყველაზე მაღლა დგას, შემოდგომისკენ კი იკლებს; საშუალო სიღრმე სულ 42 სანტიმეტრია. ტბიდან
    პატარა მდინარე ბუღდაშენი გამოედინება და მდინარე ფარავანს უერთდება.


    თავთხელი წყალი და უკაცრიელი ნაპირები ზუსტად ისაა, რასაც გადამფრენი ფრინველები ეძებენ, და ისინიც მიგრაციის
    სეზონებში აქ ჩერდებიან. ტბაში თევზიც ბევრია, მათ შორის კალმახი. ამ სიმშვიდის დასაცავად 2011 წელს ბუღდაშენის
    აღკვეთილი შეიქმნა, 2020 წლის 8 ივლისს კი ტბა საერთაშორისო მნიშვნელობის ჭარბტენიან ტერიტორიად, რამსარის
    სიაში შეიტანეს. დღეს მას ჯავახეთის დაცული ტერიტორიების ადმინისტრაცია უვლის, მადატაფასა და ზეგნის სხვა
    აღკვეთილებთან ერთად.


    ოღონდ თავს ნუ მოიტყუებთ: აქ არც ბილიკია, არც კაფე, არც მოწყობილი გადასახედი — მხოლოდ ბალახი, წყალი
    და უზარმაზარი ცა. ბუღდაშენი ზეგნის დიდ ტბებს შორის შესვენებაა — მადატაფა 8,5 კილომეტრშია, ხანჩალი
    ცოტა მოშორებით — და არა დამოუკიდებელი მიზანი. ძრავა ჩააქრეთ და დაელოდეთ: აქ ყველაზე ხმამაღლა ფრინველები
    უნდა ისმოდნენ.
  tip: >-
    ეს აღკვეთილია, ამიტომ წასვლამდე შესვლის წესები ჯავახეთის დაცული ტერიტორიების ადმინისტრაციაში ან ნინოწმინდის
    მხარის რეინჯერებთან გადაამოწმეთ; საფასურის შესახებაც ადგილზე გაიგებთ. გაზაფხულსა და ზაფხულის დასაწყისში,
    როცა ფრინველები ნაპირზე არიან, მყარ მიწაზე იარეთ და წყლის პირს მოერიდეთ. ბინოკლი წაიღეთ: ფრინველები
    ახლოს არ მიგიშვებენ. სეზონი ივნისიდან სექტემბრამდეა, თუმცა 2000 მეტრზე ქარი ზაფხულშიც ცივია. აქ არაფერია
    — საჭმელი და წყალი თან იქონიეთ, ავზი ნინოწმინდაში შეავსეთ. ერთი საათი საკმარისია; იმავე დღეს მადატაფა
    და ხანჩალიც მოინახულეთ.
  route: >-
    თბილისიდან შ36-ით, წყნეთისა და კოჯრის გავლით, მანგლისამდე იარეთ, შემდეგ შ31-ით დასავლეთისკენ, წალკის
    ზეგნის გადაკვეთით — წალკისა და ფარავნის ტბის გავლით — ნინოწმინდამდე. იქ ს11-ზე გადადით და სამხრეთ-აღმოსავლეთით
    დაახლოებით 9 კილომეტრი გაიარეთ; ნაპირამდე ბოლო კილომეტრ-ნახევარი გრუნტის გზაა. სულ დაახლოებით 176
    კილომეტრია, მაგრამ მოსახვევების, დაზიანებული ასფალტისა და გზაზე გამოსული საქონლის გამო სამნახევარი
    საათი გაითვალისწინეთ. ბოლო მონაკვეთისთვის ჯიპი სჯობს. საწვავი წალკაში ან ნინოწმინდაში ჩაასხით. ნოემბრიდან
    აპრილამდე წალკა–ნინოწმინდის მონაკვეთზე თოვლი და ყინულია.
en:
  name: Bughdasheni Lake
  short: >-
    A shallow volcanic lake on the Javakheti plateau, nowhere deeper than 85 cm and protected as a Ramsar
    wetland for the birds that rest on its shores.
  body: >-
    **Bughdasheni is a lake you could almost wade across: 0.39 square kilometres of water at 2,040 metres,
    nowhere deeper than 85 centimetres.**


    It lies in a fold of the volcanic Javakheti plateau about ten kilometres south-east of Ninotsminda,
    filled by snowmelt, rain and groundwater from a catchment of some 69 square kilometres. The water
    stands highest in spring and sinks through the autumn; the average depth is just 42 centimetres. What
    leaves the lake flows out as the little Bughdasheni river, a tributary of the Paravani.


    Shallow water and empty shores are exactly what migrating birds look for, and in season they stop
    here. The lake holds plenty of fish too, trout among them. To keep it that way, the Bughdasheni Managed
    Reserve was created in 2011, and on 8 July 2020 the lake was listed as a Ramsar wetland of international
    importance. Rangers of the Javakheti Protected Areas Administration now look after it, together with
    Lake Madatapa and the plateau's other reserves.


    Be honest about what you are driving for. There is no path, no café, no viewing platform: only grass,
    water and an enormous sky. Bughdasheni is a pause between the plateau's bigger lakes, with Madatapa
    8.5 km away and Khanchali a little further, not a destination in its own right. Switch off the engine
    and wait. The loudest thing here should be the birds.
  tip: >-
    This is a managed reserve, so check the current access rules with the Javakheti Protected Areas Administration
    or the rangers around Ninotsminda before you go; any fee is set locally. In spring and early summer,
    when birds are on the shore, keep to firm ground and away from the water's edge. Bring binoculars,
    because the birds will not let you close. June to September is the season, though even then the wind
    at 2,000 metres is cold. There is nothing here: carry food and water and fill the tank in Ninotsminda.
    An hour is enough, so pair it with Madatapa and Khanchali.
  route: >-
    From Tbilisi take the Sh36 through Tskneti and Kojori to Manglisi, then the Sh31 west across the Tsalka
    plateau, through Tsalka and past Lake Paravani, to Ninotsminda. There join the S11 south-east for
    about 9 km; the last kilometre and a half to the shore is an unpaved track. It is about 176 km, but
    allow three and a half hours for the bends, the broken asphalt and the cattle. An SUV is the sensible
    choice for the final stretch. Refuel in Tsalka or Ninotsminda. From November to April snow and ice
    make the Tsalka–Ninotsminda section hard going.
ru:
  name: Озеро Бугдашени
  short: >-
    Мелкое вулканическое озеро на Джавахетском нагорье: нигде не глубже 85 см, а ради птиц на его берегах
    оно охраняется как Рамсарское водно-болотное угодье.
  body: >-
    **Бугдашени — озеро, которое почти можно перейти вброд: 0,39 квадратного километра воды на высоте
    2040 метров и нигде не глубже 85 сантиметров.**


    Оно лежит в складке вулканического Джавахетского нагорья, километрах в десяти к юго-востоку от Ниноцминды,
    и питается талым снегом, дождями и подземными водами с водосбора площадью около 69 квадратных километров.
    Выше всего вода стоит весной и к осени опускается; средняя глубина — всего 42 сантиметра. Из озера
    вытекает речка Бугдашени, приток Паравани.


    Мелкая вода и безлюдные берега — ровно то, что ищут перелётные птицы, и в сезон они здесь останавливаются.
    Рыбы в озере тоже много, в том числе форели. Чтобы так и оставалось, в 2011 году создали заказник
    Бугдашени, а 8 июля 2020 года озеро внесли в список водно-болотных угодий международного значения
    Рамсарской конвенции. Теперь за ним присматривают рейнджеры Администрации охраняемых территорий Джавахети
    — вместе с озером Мадатапа и другими заповедными местами нагорья.


    Будем честны насчёт того, ради чего вы едете. Здесь нет ни тропы, ни кафе, ни смотровой площадки —
    только трава, вода и огромное небо. Бугдашени — пауза между крупными озёрами нагорья (до Мадатапы
    8,5 км, до Ханчали чуть дальше), а не самостоятельная цель. Заглушите мотор и подождите. Громче всего
    здесь должны звучать птицы.
  tip: >-
    Это заказник, поэтому перед поездкой уточните действующие правила посещения в Администрации охраняемых
    территорий Джавахети или у рейнджеров в окрестностях Ниноцминды; если плата и взимается, её устанавливают
    на месте. Весной и в начале лета, когда на берегу птицы, держитесь твёрдой земли и не подходите к
    кромке воды. Возьмите бинокль: близко птицы не подпустят. Сезон — с июня по сентябрь, но даже тогда
    ветер на высоте 2000 метров холодный. Здесь нет ничего: везите еду и воду и заправьтесь в Ниноцминде.
    Часа хватит, так что совместите поездку с Мадатапой и Ханчали.
  route: >-
    Из Тбилиси по Sh36 через Цкнети и Коджори до Манглиси, затем по Sh31 на запад через Цалкское плато
    — через Цалку и мимо озера Паравани — до Ниноцминды. Там выезжайте на S11 и около 9 км держите на
    юго-восток; последние полтора километра до берега — грунтовка. Всего около 176 км, но закладывайте
    три с половиной часа: серпантины, разбитый асфальт и скот на дороге. Для последнего отрезка разумнее
    взять внедорожник. Заправка — в Цалке или Ниноцминде. С ноября по апрель снег и лёд делают участок
    Цалка — Ниноцминда трудным.
fa:
  name: دریاچهٔ بوغداشنی
  short: >-
    دریاچه‌ای آتشفشانی و کم‌عمق در فلات جاواخِتی که هیچ‌جایش از ۸۵ سانتی‌متر عمیق‌تر نیست و به خاطر پرندگانی
    که بر کرانه‌هایش می‌آسایند، تالاب حفاظت‌شدهٔ رامسر است.
  body: >-
    **بوغداشنی دریاچه‌ای است که تقریباً می‌شود پیاده از آن گذشت: ۰٫۳۹ کیلومتر مربع آب در ارتفاع ۲۰۴۰ متری،
    که هیچ‌جایش از ۸۵ سانتی‌متر عمیق‌تر نیست.**


    دریاچه در چینی از فلات آتشفشانی جاواخِتی، حدود ده کیلومتری جنوب‌شرقی نینوتسمیندا، آرمیده است و آبش
    از برفاب، باران و آب‌های زیرزمینیِ حوضه‌ای به وسعت حدود ۶۹ کیلومتر مربع تأمین می‌شود. آب در بهار به
    بالاترین حد می‌رسد و در طول پاییز پایین می‌رود؛ میانگین عمق فقط ۴۲ سانتی‌متر است. آنچه از دریاچه بیرون
    می‌رود، به شکل رود کوچک بوغداشنی جاری می‌شود که شاخه‌ای از پاراوانی است.


    آب کم‌عمق و کرانه‌های خلوت دقیقاً همان چیزی است که پرندگان مهاجر می‌جویند، و در فصلش اینجا توقف می‌کنند.
    دریاچه ماهی فراوان هم دارد، از جمله قزل‌آلا. برای آنکه چنین بماند، در سال ۲۰۱۱ ذخیره‌گاه حفاظت‌شدهٔ
    بوغداشنی تأسیس شد و در ۸ ژوئیهٔ ۲۰۲۰ دریاچه به‌عنوان تالاب دارای اهمیت بین‌المللی در فهرست کنوانسیون
    رامسر ثبت شد. اکنون محیط‌بانان ادارهٔ مناطق حفاظت‌شدهٔ جاواخِتی از آن نگهداری می‌کنند، همراه با دریاچهٔ
    ماداتاپا و دیگر مناطق حفاظت‌شدهٔ فلات.


    دربارهٔ مقصد این رانندگی صادق باشیم. اینجا نه کوره‌راهی هست، نه کافه‌ای، نه سکوی تماشایی؛ فقط علف،
    آب و آسمانی بی‌کران. بوغداشنی مکثی است میان دریاچه‌های بزرگ‌تر فلات، با ماداتاپا در ۸٫۵ کیلومتری و
    خانچالی کمی دورتر، نه مقصدی مستقل. موتور را خاموش کنید و صبر کنید. بلندترین صدای اینجا باید صدای پرندگان
    باشد.
  tip: >-
    اینجا ذخیره‌گاه حفاظت‌شده است، پس پیش از سفر قوانین فعلی دسترسی را از ادارهٔ مناطق حفاظت‌شدهٔ جاواخِتی
    یا محیط‌بانان اطراف نینوتسمیندا بپرسید؛ اگر ورودیه‌ای باشد، به‌صورت محلی تعیین می‌شود. در بهار و اوایل
    تابستان، که پرندگان روی کرانه‌اند، روی زمین سفت بمانید و از لب آب فاصله بگیرید. دوربین دوچشمی بیاورید،
    چون پرندگان نمی‌گذارند نزدیکشان شوید. فصل مناسب ژوئن تا سپتامبر است، هرچند حتی در این ماه‌ها باد در
    ارتفاع ۲۰۰۰ متری سرد است. اینجا هیچ امکاناتی نیست: غذا و آب همراه بیاورید و باک را در نینوتسمیندا
    پر کنید. یک ساعت کافی است، پس آن را با ماداتاپا و خانچالی همراه کنید.
  route: >-
    از تفلیس جادهٔ Sh36 را از راه تسکنتی و کوجوری تا مانگلیسی بگیرید، سپس جادهٔ Sh31 را به سمت غرب، از
    میان فلات تسالکا، از تسالکا و کنار دریاچهٔ پاراوانی، تا نینوتسمیندا ادامه دهید. آنجا وارد جادهٔ S11
    شوید و حدود ۹ کیلومتر به سمت جنوب‌شرقی بروید؛ یک کیلومتر و نیم پایانی تا کرانه راهی خاکی است. مسافت
    حدود ۱۷۶ کیلومتر است، اما به خاطر پیچ‌ها، آسفالت خراب و دام‌هایی که به جاده می‌آیند سه ساعت و نیم
    وقت بگذارید. برای بخش پایانی، خودروی شاسی‌بلند انتخاب معقولی است. در تسالکا یا نینوتسمیندا سوخت بگیرید.
    از نوامبر تا آوریل برف و یخ عبور از بخش تسالکا–نینوتسمیندا را دشوار می‌کند.
he:
  name: אגם בוגדאשני
  short: >-
    אגם געשי רדוד ברמת ג'וואחתי, שעומקו אינו עולה בשום מקום על 85 ס"מ, ומוגן כאתר רמסר בזכות הציפורים
    שנחות על גדותיו.
  body: >-
    **בוגדאשני הוא אגם שכמעט אפשר לחצות ברגל: 0.39 קמ"ר של מים בגובה 2,040 מטר, ובשום מקום עומקו אינו
    עולה על 85 סנטימטר.**


    הוא שוכב בקפל של רמת ג'וואחתי הגעשית, כעשרה קילומטרים דרומית-מזרחית לנינוצמינדה, וניזון מהפשרת שלגים,
    מגשם וממי תהום מאגן היקוות של כ-69 קמ"ר. מפלס המים גבוה ביותר באביב ויורד במהלך הסתיו; העומק הממוצע
    הוא 42 סנטימטר בלבד. המים היוצאים מהאגם זורמים בנחל בוגדאשני הקטן, יובל של נהר פאראווני.


    מים רדודים וגדות ריקות הם בדיוק מה שציפורים נודדות מחפשות, ובעונה הן עוצרות כאן. באגם יש גם דגים רבים,
    ובהם פורל. כדי שכך יישאר, הוכרזה ב-2011 שמורת בוגדאשני, וב-8 ביולי 2020 נרשם האגם כאתר רמסר — אזור
    לח בעל חשיבות בינלאומית. כיום שומרים עליו פקחי מנהלת השטחים המוגנים של ג'וואחתי, יחד עם אגם מדאטאפה
    ושאר השמורות ברמה.


    בואו נהיה כנים לגבי מה שאתם נוסעים אליו. אין כאן שביל, אין בית קפה, אין תצפית מוסדרת: רק עשב, מים
    ושמיים עצומים. בוגדאשני הוא הפוגה בין האגמים הגדולים של הרמה — מדאטאפה במרחק 8.5 ק"מ וחנצ'לי מעט רחוק
    יותר — ולא יעד בפני עצמו. כבו את המנוע וחכו. הקול החזק ביותר כאן צריך להיות של הציפורים.
  tip: >-
    זו שמורה מנוהלת, ולכן בררו לפני היציאה את כללי הגישה העדכניים במנהלת השטחים המוגנים של ג'וואחתי או
    אצל הפקחים באזור נינוצמינדה; אם נגבה תשלום, הוא נקבע במקום. באביב ובתחילת הקיץ, כשהציפורים על החוף,
    הישארו על קרקע יציבה והתרחקו מקו המים. הביאו משקפת, כי הציפורים לא יתנו לכם להתקרב. העונה היא יוני
    עד ספטמבר, אבל גם אז הרוח בגובה 2,000 מטר קרה. אין כאן כלום: הביאו אוכל ומים ותדלקו בנינוצמינדה. שעה
    מספיקה, אז שלבו את הביקור עם מדאטאפה וחנצ'לי.
  route: >-
    מטביליסי סעו בכביש Sh36 דרך צקנתי וקוג'ורי עד מאנגליסי, ומשם בכביש Sh31 מערבה לרוחב רמת צאלקה — דרך
    צאלקה ועל פני אגם פאראווני — עד נינוצמינדה. שם עלו על כביש S11 לכ-9 ק"מ דרומית-מזרחית; הקילומטר וחצי
    האחרונים עד החוף הם דרך עפר. המרחק כ-176 ק"מ, אבל הקצו שלוש וחצי שעות בגלל העיקולים, האספלט השבור
    והבקר. לקטע האחרון רכב שטח הוא הבחירה הנבונה. תדלקו בצאלקה או בנינוצמינדה. מנובמבר עד אפריל שלג וקרח
    הופכים את הקטע צאלקה–נינוצמינדה לקשה למעבר.
ar:
  name: بحيرة بوغداشيني
  short: >-
    بحيرة بركانية ضحلة على هضبة جاواخيتي لا يتجاوز عمقها في أي موضع 85 سم، ومحمية ضمن أراضي رامسار الرطبة
    من أجل الطيور التي تحطّ على ضفافها.
  body: >-
    **بوغداشيني بحيرة تكاد تُعبر خوضًا: 0.39 كيلومتر مربع من الماء على ارتفاع 2040 مترًا، ولا يتجاوز عمقها
    في أي موضع 85 سنتيمترًا.**


    تقع في ثنية من هضبة جاواخيتي البركانية على بعد نحو عشرة كيلومترات جنوب شرقي نينوتسميندا، وتتغذى من
    ذوبان الثلوج والأمطار والمياه الجوفية من حوض تصريف تبلغ مساحته نحو 69 كيلومترًا مربعًا. يبلغ الماء
    أعلى منسوبه في الربيع ويهبط على امتداد الخريف؛ ومتوسط العمق 42 سنتيمترًا فقط. وما يفيض من البحيرة
    يجري في نهير بوغداشيني الصغير، أحد روافد نهر بارافاني.


    الماء الضحل والشطآن الخالية هما تمامًا ما تبحث عنه الطيور المهاجرة، فتتوقف هنا في موسمها. وفي البحيرة
    سمك وفير أيضًا، ومنه السلمون المرقط. وللحفاظ على ذلك أُنشئت محمية بوغداشيني عام 2011، وفي 8 يوليو
    2020 أُدرجت البحيرة ضمن قائمة رامسار للأراضي الرطبة ذات الأهمية الدولية. ويرعاها اليوم حراس إدارة
    المناطق المحمية في جاواخيتي، إلى جانب بحيرة ماداتابا وسائر محميات الهضبة.


    لنكن صادقين بشأن ما ستقطعون الطريق من أجله. لا درب هنا ولا مقهى ولا منصة مشاهدة: فقط عشب وماء وسماء
    هائلة. بوغداشيني استراحة بين بحيرات الهضبة الأكبر، إذ تبعد ماداتابا 8.5 كم وخانتشالي أبعد قليلًا،
    وليست وجهة قائمة بذاتها. أطفئوا المحرك وانتظروا. ينبغي أن تكون الطيور أعلى الأصوات هنا.
  tip: >-
    هذه محمية مُدارة، فتحققوا قبل الذهاب من قواعد الدخول الحالية لدى إدارة المناطق المحمية في جاواخيتي
    أو لدى الحراس في محيط نينوتسميندا؛ وإن وُجدت رسوم فهي تُحدَّد محليًا. في الربيع ومطلع الصيف، حين تكون
    الطيور على الشاطئ، ابقوا على الأرض الصلبة وابتعدوا عن حافة الماء. أحضروا منظارًا، فالطيور لن تدعكم
    تقتربون. الموسم من يونيو إلى سبتمبر، وحتى حينها تكون الريح باردة على ارتفاع 2000 متر. لا شيء هنا:
    احملوا الطعام والماء واملؤوا الخزان في نينوتسميندا. تكفي ساعة، فاجمعوا الزيارة مع ماداتابا وخانتشالي.
  route: >-
    من تبليسي خذوا طريق Sh36 عبر تسكنيتي وكوجوري حتى مانغليسي، ثم طريق Sh31 غربًا عبر هضبة تسالكا، مرورًا
    بتسالكا وبحيرة بارافاني، حتى نينوتسميندا. هناك اسلكوا طريق S11 باتجاه الجنوب الشرقي نحو 9 كم؛ أما
    الكيلومتر والنصف الأخيران حتى الشاطئ فمسلك غير معبّد. المسافة نحو 176 كم، لكن خصصوا ثلاث ساعات ونصفًا
    بسبب المنعطفات والإسفلت المتكسّر والماشية. سيارة الدفع الرباعي هي الخيار المعقول للمقطع الأخير. تزوّدوا
    بالوقود في تسالكا أو نينوتسميندا. ومن نوفمبر إلى أبريل يجعل الثلج والجليد مقطع تسالكا–نينوتسميندا
    شاقًا.
