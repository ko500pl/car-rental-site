ka:
  name: საქართველოს ბანკის სათავო ოფისი (გზების სამინისტროს ყოფილი შენობა)
  short: >-
    1975 წლის ბრუტალისტური ნაგებობა: ბეტონის ხუთი ორსართულიანი ბლოკი ტყიან ფერდზე ჯვარედინად აწყვია —
    გზათმშენებლებს აუშენეს, დღეს ბანკია.
  body: >-
    **საბურთალოში, ტყიან ფერდობზე, ბეტონის ხუთი ორსართულიანი ბლოკი ჰაერში ჯვარედინად აწყვია — მათ ქვეშ
    მიწა კი განზრახ ხეებს დაუტოვეს.**


    შენობა საქართველოს სსრ გზების მშენებლობის სამინისტროსთვის არქიტექტორებმა გიორგი ჩახავამ და ზურაბ ჯალაღანიამ,
    ინჟინერ თემურ თხილავასთან ერთად, დააპროექტეს და 1975 წელს დასრულდა (ზოგი წყარო 1976 წელს ასახელებს).
    ჩახავა მაშინ ამავე სამინისტროში მინისტრის მოადგილე იყო — ერთდროულად დამკვეთიც და მთავარი არქიტექტორიც,
    ამიტომ ადგილიც თავად შეარჩია. მშენებლობა ექვსი მილიონი მანეთი დაჯდა.


    მისი იდეა, რომელიც ჩახავამ „სივრცითი ქალაქის“ მეთოდის სახელით დააპატენტა, ასეთი იყო: მიწა რაც შეიძლება
    ნაკლებად დაიფაროს, შენობის ქვეშ დარჩენილი სივრცე კი ბუნებას დაუბრუნდეს. თავად ამას ტყეს ადარებდა:
    სამი ბეტონის ბირთვი ხის ტანია, ჰორიზონტალური ბლოკები — ვარჯი. უმაღლესი ბირთვი 18-სართულიანია; სამი
    ბლოკი ფერდობის გარდიგარდმოა გაწოლილი, ორი — გასწვრივ. კრიტიკოსები მის წინაპრად ელ ლისიცკის 1920-იანი
    წლების „ჰორიზონტალურ ცათამბჯენებს“ ასახელებენ, „ნიუ-იორკ ტაიმსის“ არქიტექტურის კრიტიკოსმა ნიკოლაი
    უროსოვმა კი აღნიშნა, რომ მძიმე კონსოლური მასები გარემოს ფაქიზად ეხმიანება.


    2007 წელს შენობა საქართველოს ბანკმა შეიძინა; იმავე წელს მას კულტურული მემკვიდრეობის უძრავი ძეგლის
    სტატუსი მიენიჭა, 2010–2011 წლებში კი ახალი მთავარი შესასვლელი და მიწისქვეშა ვესტიბიული მოეწყო. ხალხი
    მას „ჯენგას“ ან ბეტონის „ჰეშთეგს“ ეძახის, კინოს მოყვარულები კი „ფორსაჟის“ მეცხრე ნაწილიდან (2021)
    იცნობენ.


    ოფისების უმეტესობა იმისთვის შენდება, რომ მათი ფანჯრიდან გაიხედო. ეს კი ისე ააგეს, რომ თავად მის გამჭოლ
    იყურებოდე: ქვემოდან ახედეთ და ბეტონის ძელებს შორის ცას დაინახავთ.
  tip: >-
    ეს მოქმედი საბანკო ოფისია და არა მუზეუმი: შიგნით საზოგადოებისთვის შესასვლელი არ არის, ამიტომ შენობით
    გაგარინის ქუჩის საჯარო ტროტუარიდან დატკბით და თანამშრომელთა ეზოსა თუ ავტოსადგომზე ნუ შეხვალთ. დათვალიერება
    უფასოა და ნახევარი საათიც საკმარისია. ფასადებს ნაშუადღევის შუქი უფრო უხდება, ქუჩის გასწვრივ გავლისას
    კი სილუეტი თვალსა და ხელს შუა იცვლება. ერთი სამოგზაურო გზამკვლევის ცნობით, ახალ შუშის პავილიონში პროექტის
    ნახაზები და მაკეტებია გამოფენილი — თუ თანამშრომლები შეგიშვებენ, ჩათვალეთ სასიამოვნო სიურპრიზად და
    არა დაპირებად. შაბათ-კვირას, როცა ოფისი ცარიელია, გადაღება უფრო მშვიდად შეიძლება.
  route: >-
    თავისუფლების მოედნიდან დაახლოებით 7 კმ და 20 წუთია ქალაქის ქუჩებით. პუშკინის ქუჩითა და ბარათაშვილის
    გამზირით ჩადით მარჯვენა სანაპიროზე და გაჰყევით ჩრდილოეთით — ჯერ ზვიად გამსახურდიას, შემდეგ ჰეიდარ
    ალიევის სახელობის სანაპიროს — გმირთა მოედნის გავლით. გადაუხვიეთ გიორგი სააკაძის დაღმართზე, ამოდით
    ჟიული შარტავას ქუჩაზე, შემდეგ ანა კალანდაძის ქუჩითა და პეკინის გამზირით გადით იური გაგარინის ქუჩაზე;
    შენობა №29ა-შია. ნებისმიერი ეკონომ-კლასის მანქანა გამოდგება. სამუშაო დღეებში სანაპიროზე პიკის საათებს
    აარიდეთ თავი, პარკირება კი მიმდებარე ქუჩებში ეძებეთ და არა დატვირთულ მისასვლელ გზებზე.
en:
  name: Bank of Georgia Headquarters (former Ministry of Highways)
  short: >-
    A 1975 Brutalist landmark of five two-storey concrete blocks stacked crosswise over a wooded slope
    — built for Soviet road-builders, now a bank.
  body: >-
    **Five concrete blocks, two storeys each, are stacked crosswise in mid-air above a wooded slope in
    Saburtalo — and the ground beneath them was left, on purpose, to the trees.**


    George Chakhava and Zurab Jalaghania, with the engineer Temur Tkhilava, designed the building for
    the Georgian SSR's Ministry of Highway Construction, and it was finished in 1975 (some sources say
    1976). Chakhava was then the ministry's deputy minister, so he was both client and lead architect,
    free to choose the site himself. The bill came to six million roubles.


    His idea, which he patented as the "Space City" method, was to cover as little earth as possible and
    hand the space underneath back to nature. He described it as a forest: three concrete cores for trunks,
    the horizontal blocks for crowns. The tallest core rises 18 storeys; three blocks run across the slope,
    two along it. Critics trace its family tree to El Lissitzky's "horizontal skyscrapers" of the 1920s,
    and the New York Times critic Nicolai Ouroussoff wrote that its heavy cantilevered forms "relate sensitively
    to their context".


    Bank of Georgia bought the building in 2007, the same year it was listed as an immovable cultural
    monument, and in 2010–11 added a new main entrance and an underground lobby. Locals call it the Jenga
    tower or the concrete hashtag; film-goers may recognise it from a cameo in Fast & Furious 9 (2021).


    Most office blocks are built to be looked out of. This one was built to be looked through: stand on
    the street below and the sky shows between the beams.
  tip: >-
    This is a working bank headquarters, not a museum. There is no public entry, so admire it from the
    public pavement on Gagarin Street and keep out of the staff forecourt and car park. It costs nothing,
    and half an hour is plenty. Afternoon light suits the façades best, and the silhouette shifts sharply
    as you move along the street. One travel guide reports a small display of blueprints and models in
    the newer glass entrance pavilion; treat that as a pleasant surprise if staff let you look, not a
    promise. Weekends, when the offices are empty, are calmer for photographs.
  route: >-
    About 7 km and 20 minutes from Freedom Square on city streets. Head down Pushkin Street and Baratashvili
    Avenue to the right-bank embankment and follow it north, first as Zviad Gamsakhurdia Embankment, then
    as Heydar Aliyev Embankment, past Heroes' Square. Take the slip road onto Giorgi Saakadze Descent,
    climb to Zhiuli Shartava Street, then continue along Ana Kalandadze Street and Pekini (Beijing) Avenue
    into Yuri Gagarin Street; the building is at no. 29a. Any economy car will do. Avoid the embankment
    at weekday rush hours, and look for parking in the side streets rather than stopping on the busy approach
    roads.
ru:
  name: Штаб-квартира Банка Грузии (бывшее Министерство автодорог)
  short: >-
    Икона брутализма 1975 года: пять двухэтажных бетонных блоков крест-накрест над лесистым склоном. Строили
    для советских дорожников, теперь тут банк.
  body: >-
    **Пять бетонных блоков, каждый в два этажа, крест-накрест висят в воздухе над лесистым склоном в Сабуртало,
    а землю под ними намеренно оставили деревьям.**


    Георгий Чахава и Зураб Джалагания вместе с инженером Темуром Тхилавой спроектировали здание для Министерства
    строительства автомобильных дорог Грузинской ССР; его достроили в 1975 году (по некоторым источникам
    — в 1976-м). Чахава был тогда заместителем министра, то есть одновременно заказчиком и главным архитектором,
    и участок выбирал сам. Стройка обошлась в шесть миллионов рублей.


    Его замысел, запатентованный как метод «Пространственного города», был прост: занять как можно меньше
    земли и вернуть пространство под зданием природе. Сам архитектор сравнивал постройку с лесом: три
    бетонных ядра — стволы, горизонтальные блоки — кроны. Самое высокое ядро поднимается на 18 этажей;
    три блока лежат поперёк склона, два — вдоль. Критики ведут его родословную от «горизонтальных небоскрёбов»
    Эль Лисицкого 1920-х годов, а архитектурный критик The New York Times Николай Урусофф писал, что его
    тяжёлые консольные объёмы «чутко откликаются на окружение».


    Банк Грузии купил здание в 2007 году — в том же году оно получило статус недвижимого памятника культуры,
    — а в 2010–2011 годах пристроил новый главный вход и подземный вестибюль. Местные зовут его «башней
    Дженга» или «бетонным хештегом»; киноманы, возможно, узнают его по короткому появлению в «Форсаже
    9» (2021).


    Большинство офисных зданий строят, чтобы смотреть из них. Это построили, чтобы смотреть сквозь него:
    встаньте на улице внизу — и между балками покажется небо.
  tip: >-
    Это действующая штаб-квартира банка, а не музей. Внутрь посетителей не пускают, поэтому любуйтесь
    зданием с общественного тротуара на улице Гагарина и не заходите на служебный двор и парковку. Это
    бесплатно, и получаса вполне хватит. Фасады лучше всего смотрятся в послеполуденном свете, а силуэт
    резко меняется, пока идёшь вдоль улицы. Один путеводитель упоминает небольшую выставку чертежей и
    макетов в новом стеклянном входном павильоне — считайте это приятным сюрпризом, если сотрудники позволят
    взглянуть, а не обещанием. В выходные, когда офисы пустуют, фотографировать спокойнее.
  route: >-
    Около 7 км и 20 минут от площади Свободы по городским улицам. Спуститесь по улице Пушкина и проспекту
    Бараташвили к набережной правого берега и держите на север — сначала это набережная Звиада Гамсахурдия,
    затем набережная Гейдара Алиева, — мимо площади Героев. Съезжайте на спуск Георгия Саакадзе, поднимитесь
    к улице Жиули Шартава, затем по улице Аны Каландадзе и проспекту Пекина выезжайте на улицу Юрия Гагарина;
    здание — дом 29а. Подойдёт любая машина эконом-класса. В будничные часы пик набережную лучше объехать,
    а парковку ищите в боковых улицах, а не на оживлённых подъездах.
fa:
  name: ستاد مرکزی بانک گرجستان (ساختمان پیشین وزارت راه‌ها)
  short: >-
    بنایی شاخص به سبک بروتالیسم از سال ۱۹۷۵: پنج بلوک بتنی دوطبقه، چلیپاوار بر فراز شیبی جنگلی؛ ساخته‌شده
    برای راه‌سازان شوروی و اکنون بانک.
  body: >-
    **پنج بلوک بتنی، هر یک دوطبقه، بر فراز شیبی جنگلی در سابورتالو چلیپاوار در هوا روی هم نشسته‌اند —
    و زمینِ زیرشان را عمداً به درختان سپرده‌اند.**


    گیورگی چاخاوا و زوراب جالاغانیا، همراه با مهندس تمور تخیلاوا، این ساختمان را برای وزارت راه‌سازی جمهوری
    شوروی سوسیالیستی گرجستان طراحی کردند و کار ساخت در سال ۱۹۷۵ به پایان رسید (برخی منابع ۱۹۷۶ را ذکر
    می‌کنند). چاخاوا در آن زمان معاون وزیر همین وزارتخانه بود؛ یعنی هم کارفرما بود و هم معمار اصلی، و
    زمینِ ساختمان را هم خودش برگزید. هزینهٔ ساخت به شش میلیون روبل رسید.


    ایدهٔ او، که با نام روش «شهر فضایی» به ثبت رساند، این بود که کمترین زمینِ ممکن پوشانده شود و فضای
    زیر ساختمان به طبیعت بازگردد. خودش آن را به جنگل تشبیه می‌کرد: سه هستهٔ بتنی، تنهٔ درختان‌اند و بلوک‌های
    افقی، تاجِ آن‌ها. بلندترین هسته ۱۸ طبقه ارتفاع دارد؛ سه بلوک عمود بر شیب کشیده شده‌اند و دو بلوک در
    امتداد آن. منتقدان تبارش را به «آسمان‌خراش‌های افقی» ال لیسیتسکی در دههٔ ۱۹۲۰ می‌رسانند، و نیکلای
    اوروسوف، منتقد معماری نیویورک تایمز، نوشت که حجم‌های سنگین و طره‌ای‌اش «با ظرافت با بستر پیرامون خود
    پیوند می‌یابند».


    بانک گرجستان ساختمان را در سال ۲۰۰۷ خرید — همان سالی که به‌عنوان اثر فرهنگی غیرمنقول به ثبت رسید —
    و در سال‌های ۲۰۱۰ و ۲۰۱۱ ورودی اصلی تازه و لابی زیرزمینی به آن افزود. اهالی آن را «برج جنگا» یا «هشتگ
    بتنی» می‌نامند و سینمادوستان شاید آن را از حضور کوتاهش در فیلم «سریع و خشمگین ۹» (۲۰۲۱) به یاد بیاورند.


    بیشتر ساختمان‌های اداری را می‌سازند تا از درونشان بیرون را تماشا کنند. این یکی را ساخته‌اند تا از
    میانش نگاه کنید: در خیابانِ پایین بایستید، آسمان را میان تیرها خواهید دید.
  tip: >-
    این‌جا ستاد فعال یک بانک است، نه موزه. ورود برای عموم ممکن نیست؛ پس ساختمان را از پیاده‌روی عمومی
    خیابان گاگارین تماشا کنید و وارد حیاط کارکنان و پارکینگ نشوید. هزینه‌ای ندارد و نیم ساعت کاملاً کافی
    است. نور بعدازظهر بیش از همه به نماها می‌آید و با قدم‌زدن در طول خیابان، نیم‌رخ بنا به‌شدت دگرگون
    می‌شود. یک راهنمای سفر از نمایشگاه کوچکی از نقشه‌ها و ماکت‌ها در غرفهٔ شیشه‌ای ورودیِ جدید خبر می‌دهد؛
    اگر کارکنان اجازه دادند نگاهی بیندازید، آن را غافلگیری خوشایندی بدانید، نه وعده‌ای قطعی. آخر هفته‌ها
    که دفترها خالی‌اند، عکاسی آرام‌تر است.
  route: >-
    حدود ۷ کیلومتر و ۲۰ دقیقه از میدان آزادی، از خیابان‌های شهر. از خیابان پوشکین و بلوار باراتاشویلی
    به‌سوی خیابان ساحلیِ کرانهٔ راست پایین بروید و آن را به سمت شمال دنبال کنید — نخست با نام ساحل زویاد
    گامساخوردیا و سپس ساحل حیدر علی‌اف — و از کنار میدان قهرمانان بگذرید. از راه فرعی وارد سراشیبی گیورگی
    ساآکادزه شوید، تا خیابان ژیولی شارتاوا بالا بروید، سپس از خیابان آنا کالاندادزه و بلوار پکن به خیابان
    یوری گاگارین برسید؛ ساختمان در پلاک ۲۹ الف است. هر خودروی سواری معمولی کافی است. در ساعات شلوغ روزهای
    کاری از خیابان ساحلی پرهیز کنید و به‌جای توقف در راه‌های دسترسیِ پرتردد، در کوچه‌های فرعی جای پارک
    بجویید.
he:
  name: מטה בנק גאורגיה (לשעבר משרד הכבישים)
  short: >-
    ציון דרך ברוטליסטי מ-1975: חמישה גושי בטון דו-קומתיים מוצלבים מעל מדרון מיוער. נבנה בשביל סוללי הכבישים
    הסובייטים, וכיום משמש בנק.
  body: >-
    **חמישה גושי בטון, בני שתי קומות כל אחד, מוצלבים זה מעל זה באוויר מעל מדרון מיוער בסבורטלו — והאדמה
    שמתחתם הושארה, בכוונה, לעצים.**


    גיורגי צ'חאווה וזוראב ג'לגניה, יחד עם המהנדס תמור תחילאווה, תכננו את הבניין עבור המשרד לבניית כבישים
    של הרפובליקה הסובייטית הסוציאליסטית הגאורגית, והוא הושלם ב-1975 (יש מקורות הנוקבים ב-1976). צ'חאווה
    כיהן אז כסגן השר באותו משרד, ולכן היה בבת אחת המזמין והאדריכל הראשי, וחופשי לבחור את המגרש בעצמו.
    העלות הסתכמה בשישה מיליון רובל.


    הרעיון שלו, שאותו רשם כפטנט בשם שיטת "העיר המרחבית", היה לכסות כמה שפחות קרקע ולהחזיר לטבע את החלל
    שמתחת לבניין. הוא עצמו תיאר זאת כיער: שלוש ליבות בטון הן הגזעים, והגושים האופקיים הם הצמרות. הליבה
    הגבוהה ביותר מתנשאת ל-18 קומות; שלושה גושים חוצים את המדרון לרוחבו ושניים נמתחים לאורכו. מבקרים מאתרים
    את שורשיו ב"גורדי השחקים האופקיים" של אל ליסיצקי משנות ה-20 של המאה ה-20, ומבקר האדריכלות של הניו
    יורק טיימס, ניקולאי אורוסוף, כתב שהמסות הכבדות והבולטות שלו "מתייחסות ברגישות לסביבתן".


    בנק גאורגיה קנה את הבניין ב-2007, באותה שנה שבה הוכרז כאתר מורשת תרבות, וב-2010–2011 הוסיף לו כניסה
    ראשית חדשה ולובי תת-קרקעי. המקומיים מכנים אותו "מגדל הג'נגה" או "ההאשטאג מבטון"; חובבי קולנוע אולי
    יזהו אותו מהופעת אורח קצרה ב"מהיר ועצבני 9" (2021).


    רוב בנייני המשרדים נבנים כדי שיביטו מתוכם החוצה. את זה בנו כדי שיביטו דרכו: עמדו ברחוב שמתחתיו, והשמיים
    ייראו בין הקורות.
  tip: >-
    זהו מטה פעיל של בנק, לא מוזיאון. אין כניסה לקהל, ולכן התבוננו בבניין מהמדרכה הציבורית ברחוב גגרין
    והתרחקו מחצר העובדים ומהחניון. זה לא עולה דבר, וחצי שעה מספיקה בהחלט. אור אחר הצהריים מחמיא לחזיתות
    יותר מכול, וקו המתאר משתנה בחדות ככל שמתקדמים לאורך הרחוב. מדריך טיולים אחד מדווח על תצוגה קטנה של
    שרטוטים ודגמים בביתן הכניסה החדש מזכוכית; ראו בה הפתעה נעימה אם הצוות ירשה להציץ, לא הבטחה. בסופי
    שבוע, כשהמשרדים ריקים, רגוע יותר לצלם.
  route: >-
    כ-7 ק״מ וכ-20 דקות נסיעה מכיכר החירות ברחובות העיר. רדו ברחוב פושקין ובשדרות ברטשווילי אל דרך הסוללה
    שעל הגדה הימנית והמשיכו בה צפונה — תחילה היא נקראת סוללת זביאד גמסחורדיה ואחר כך סוללת היידר אלייב
    — על פני כיכר הגיבורים. צאו בכביש הגישה אל מורד גיורגי סאאקדזה, טפסו לרחוב ז'יולי שרטאווה, והמשיכו
    ברחוב אנה קלנדדזה ובשדרות פקיני (בייג'ינג) אל רחוב יורי גגרין; הבניין נמצא במספר 29א. כל רכב פרטי
    רגיל יספיק. הימנעו מהסוללה בשעות העומס של ימי חול, וחפשו חניה ברחובות הצדדיים ולא על כבישי הגישה העמוסים.
ar:
  name: المقر الرئيسي لبنك جورجيا (مبنى وزارة الطرق سابقًا)
  short: >-
    معلم من العمارة الوحشية يعود إلى عام 1975: خمس كتل خرسانية من طابقين متقاطعة فوق منحدر مشجّر، شُيّدت
    لبنّائي الطرق السوفييت وصارت اليوم مصرفًا.
  body: >-
    **خمس كتل خرسانية، كلٌّ منها من طابقين، تتقاطع معلّقةً في الهواء فوق منحدر مشجّر في حي سابورتالو،
    أما الأرض تحتها فقد تُركت عمدًا للأشجار.**


    صمّم غيورغي تشاخافا وزوراب جالاغانيا، مع المهندس تيمور تخيلافا، هذا المبنى لوزارة إنشاء الطرق في جمهورية
    جورجيا السوفيتية الاشتراكية، واكتمل عام 1975 (وتذكر بعض المصادر عام 1976). وكان تشاخافا آنذاك نائبًا
    لوزير هذه الوزارة، فجمع بين صفة صاحب المشروع ومعماريّه الرئيسي، وكان حرًّا في اختيار الموقع بنفسه.
    وبلغت الكلفة ستة ملايين روبل.


    كانت فكرته، التي سجّل براءتها باسم أسلوب «المدينة الفضائية»، أن يشغل أقل ما يمكن من الأرض ويعيد ما
    تحت المبنى إلى الطبيعة. وكان يشبّهه بغابة: ثلاث نوى خرسانية هي الجذوع، والكتل الأفقية هي التيجان.
    ترتفع أعلى النوى 18 طابقًا؛ وتمتد ثلاث كتل عرضًا عبر المنحدر واثنتان على طوله. ويردّ النقاد نسبه إلى
    «ناطحات السحاب الأفقية» التي رسمها إل ليسيتسكي في عشرينيات القرن العشرين، وكتب نيكولاي أوروسوف، الناقد
    المعماري في صحيفة نيويورك تايمز، أن كتله الثقيلة الناتئة «تتجاوب بحساسية مع محيطها».


    اشترى بنك جورجيا المبنى عام 2007، وهو العام نفسه الذي أُدرج فيه معلمًا ثقافيًا ثابتًا، ثم أضاف إليه
    في 2010–2011 مدخلًا رئيسيًا جديدًا وبهوًا تحت الأرض. يسمّيه أهل تبليسي «برج جينغا» أو «الهاشتاغ الخرساني»،
    وقد يتعرّف إليه محبّو السينما من ظهوره العابر في فيلم «السرعة والغضب 9» (2021).


    تُبنى معظم مباني المكاتب ليُطلّ الناس منها. أما هذا فبُني ليُنظر من خلاله: قف في الشارع تحته، وسترى
    السماء بين العوارض.
  tip: >-
    هذا مقرّ مصرفي فعلي، لا متحف. لا يُسمح للجمهور بالدخول، فتأمّل المبنى من الرصيف العام في شارع غاغارين
    وابتعد عن باحة الموظفين وموقف السيارات. الزيارة مجانية، ونصف ساعة تكفي. يناسب ضوء ما بعد الظهر الواجهات
    أكثر من سواه، وتتبدّل هيئة المبنى وخطوطه الخارجية تبدّلًا لافتًا كلما تقدّمت على طول الشارع. يذكر
    أحد أدلّة السفر معرضًا صغيرًا للمخططات والمجسّمات في جناح المدخل الزجاجي الجديد؛ اعتبره مفاجأة سارّة
    إن سمح لك الموظفون بإلقاء نظرة، لا وعدًا مضمونًا. وفي عطلة نهاية الأسبوع، حين تخلو المكاتب، يكون التصوير
    أهدأ.
  route: >-
    نحو 7 كم و20 دقيقة من ساحة الحرية عبر شوارع المدينة. انزل في شارع بوشكين وجادة باراتاشفيلي إلى كورنيش
    الضفة اليمنى، واتبعه شمالًا — أولًا باسم كورنيش زفياد غامساخورديا ثم كورنيش حيدر علييف — مرورًا بساحة
    الأبطال. اسلك المخرج إلى منحدر غيورغي ساآكادزه، واصعد إلى شارع جيولي شارتافا، ثم تابع في شارع آنا
    كالاندادزه وجادة بكين حتى شارع يوري غاغارين؛ المبنى في الرقم 29 أ. تكفي أي سيارة عادية. تجنّب الكورنيش
    في ساعات الذروة أيام العمل، وابحث عن موقف في الشوارع الجانبية بدل التوقف على طرق الوصول المزدحمة.
