ka:
  name: ანატორის აკლდამები
  short: >-
    ფიქლის სამარხები არღუნის თავზე, შატილთან: გისოსებს მიღმა ძვლები, ჟამიანობის თქმულება და უფრო მშვიდი
    სიმართლე, რომელსაც მეცნიერები ვარაუდობენ.
  body: >-
    **ანატორში ძვლები ნამდვილია. ამბავი, რომელსაც მათზე ყველა ყვება, შესაძლოა, არა.**


    შატილში იკითხეთ და გიამბობენ. ოდესღაც — რომელ საუკუნეში, არავინ იცის — ვაჭარმა სოფელ ანატორში ჟამი
    შემოიტანა. სნეულები ლოგინიდან წამოდგნენ და იქ წავიდნენ, სადაც ორი მდინარე ერთვის ერთმანეთს. ზოგი მდინარეს
    მიეცა, ზოგი კი წინასწარ აშენებულ ქვის სამარხებში შეძვრა და ფიქლის თაროებზე, მკვდრებს გვერდით დაწვა,
    რომ სოფელი გადარჩენილიყო. ზოგ ვერსიაში სამარხის შესასვლელი მათ შიგნიდან, ქვა-ქვა, თავად ამოაშენეს.


    ეთნოგრაფი შორენა ქურციკიძე, შატილის მხარის წეს-ჩვეულებებზე დაწერილი წიგნის თანაავტორი, ამბობს, რომ
    ამ ამბის არანაირი მტკიცებულება არ არსებობს. მიწისზედა ქვის სამარხები, სადაც მიცვალებულს არ მარხავდნენ,
    არამედ ასვენებდნენ, საზღვრის გაღმა, ჩეჩნეთსა და ინგუშეთში, ფართოდ იყო გავრცელებული, და ანატორი, შესაძლოა,
    იმავე წესის ერთადერთი მაგალითია საქართველოში. რატომ ირჩევდა ხალხი ასეთ დაკრძალვას, ზუსტად ცნობილი
    არ არის; ერთი მოსაზრებით, ეს მიწისადმი პატივისცემის ნიშანი იყო. თავადვე აღიარებს, რომ მეტი მტკიცებულების
    გარეშე მხოლოდ ვარაუდი შეგვიძლია.


    რასაც ხედავთ, უბრალოა და შემზარავი. ფიქლის ფილებით ნაგები რამდენიმე ოთხკუთხა აკლდამა კლდის შვერილზე
    დგას, შატილიდან დაახლოებით სამ კილომეტრში, მუცოს გზაზე, ჩეჩნეთის საზღვართან ახლოს. პატარა სარკმლებიდან
    თაროები, თავის ქალები და ძვლები ჩანს. სარკმლებს ახლა რკინის გისოსები ფარავს — ძვლების გაქრობის შემდეგ
    დააყენეს; ერთი ამბავი მოგვითხრობს სტუმარზე, რომელმაც მდინარე გადალახა და თავის ქალებით სავსე ტომრით
    წავიდა.


    გისოსთან ცოტა უფრო დიდხანს შეჩერდით, ვიდრე მოგინდებათ. ჟამმა მოიყვანა ისინი აქ თუ ჩვეულებამ — ანატორის
    მკვდრები თქვენს დუმილს თქმულების გარეშეც იმსახურებენ.
  tip: >-
    შეხედეთ, მაგრამ აკლდამებში ნუ შეხვალთ და ნურაფერს შეეხებით: ეს სასაფლაოა და ხევსურებისთვის წმინდა
    ადგილი. დათვალიერებას 20–30 წუთი ეყოფა, ამიტომ შატილთან ერთად ნახეთ — სოფელთან, რომელსაც დაახლოებით
    60 ქვის კოშკი აქვს და რომლის მოსახლეობა საბჭოთა ხელისუფლებამ 1950-იანი წლების დასაწყისში ბარად ჩაასახლა;
    2014 წლის აღწერით იქ სულ 22 ადამიანი ცხოვრობდა. ეს სასაზღვრო ზონაა: პასპორტი თან იქონიეთ და დოკუმენტების
    შემოწმებას ელოდეთ. ძეგლთან კაფე და ტუალეტი არ არის — უახლოესი შატილის საოჯახო სასტუმროებშია. საზღვართან
    ასე ახლოს დრონს ნუ აუშვებთ.
  route: >-
    თბილისიდან საქართველოს სამხედრო გზით (E117) ჟინვალამდე იარეთ, შემდეგ Sh26-ით ბარისახოს გავლით დათვისჯვრის
    უღელტეხილზე (2676 მ) ადით და არღუნის ხეობაში, შატილში ჩადით. იქიდან ანატორამდე მუცოს გზაზე კიდევ 3
    კილომეტრია: სულ დაახლოებით 155 კილომეტრი და ხუთი საათი, რომლის ბოლო 50-ოდე კილომეტრი მოუასფალტებელი
    მთის გზაა. შატილის ასეთი გვერდითი გზისთვის ნამდვილი მაღალი კლირენსის ჯიპი გჭირდებათ. ბარისახოს შემდეგ
    ბენზინგასამართი არ არის, ამიტომ სავსე ავზით გადით. უღელტეხილი, თოვლის მიხედვით, მხოლოდ დაახლოებით
    ივნისიდან ოქტომბრამდეა ღია. ერთ დღეში მისვლა-დაბრუნებას ნუ ეცდებით: ღამე შატილში გაათიეთ.
en:
  name: Anatori Crypts
  short: >-
    Slate burial vaults on a bluff above the Arghuni near Shatili: bones behind iron grilles, a plague
    legend everyone tells, and a quieter truth scholars suggest.
  body: >-
    **At Anatori the bones are real. The story everybody tells about them may not be.**


    Ask in Shatili and you will hear it. In some past century, and nobody says which, a merchant carried
    the plague, *zhami* in Georgian, into the village of Anatori. The sick rose from their beds and walked
    to a bluff where two rivers meet. Some threw themselves into the current; others crawled into stone
    huts built for the purpose and lay down on slate shelves beside the dead, so that the village might
    live. Some retellings even have them walling themselves in, stone by stone.


    The ethnographer Shorena Kurtsikidze, co-author of a book on the customs of the Shatili borderland,
    says there is no evidence for any of it. Above-ground stone necropolises, where the dead were laid
    out rather than buried, were widespread just across the border in Chechnya and Ingushetia, and Anatori
    may be the only Georgian example of the same rite. Why people chose it is not known for certain; one
    theory holds that it was a way of showing respect to the land. She admits that, without more evidence,
    everyone can only speculate.


    What you see is plain and unsettling. A few rectangular vaults of stacked slate stand on the bluff
    about three kilometres beyond Shatili, on the road to Mutso, close to the Chechen border. Through
    small openings you can see the shelves, the skulls and the long bones. Iron grilles cover the openings
    now, fitted after bones began to vanish; one story tells of a visitor who crossed the river and left
    with a sack of skulls.


    Stay at the grille a minute longer than feels comfortable. Whether plague or custom brought them here,
    the dead of Anatori do not need a legend to deserve your silence.
  tip: >-
    Look, but do not enter the vaults or touch anything: this is a cemetery and holy ground for the Khevsurs.
    Twenty to thirty minutes is enough, so pair it with Shatili, a village of some 60 stone towers whose
    people were moved down to the lowlands by the Soviet authorities in the early 1950s; only 22 people
    lived there at the 2014 census. This is a border zone: carry your passport and expect document checks.
    There are no cafés or toilets at the site; the nearest are in Shatili's guesthouses. Do not fly a
    drone this close to the border.
  route: >-
    From Tbilisi take the Georgian Military Highway (E117) to Zhinvali, then the Sh26 up through Barisakho
    and over the Datvisjvari Pass (2,676 m) down into the Arghuni gorge to Shatili. From there Anatori
    is another 3 km along the track to Mutso: about 155 km and five hours in all, with roughly the last
    50 km on unpaved mountain road. This is a side track beyond Shatili: you need a real high-clearance
    4x4. There is no fuel after Barisakho, so leave with a full tank. The pass is open only from about
    June to October, depending on snow. Do not try it as a day trip: sleep in Shatili.
ru:
  name: Склепы Анатори
  short: >-
    Сланцевые склепы на утёсе над Аргуном у Шатили: кости за железными решётками, чумная легенда, которую
    знают все, и более тихая правда учёных.
  body: >-
    **В Анатори кости настоящие. А вот история, которую о них рассказывают все, — возможно, нет.**


    Спросите в Шатили — и вам её расскажут. В каком-то давнем веке — в каком, никто не уточняет — купец
    занёс в село Анатори чуму, по-грузински *жами*. Больные поднялись с постелей и ушли на утёс, где сливаются
    две реки. Одни бросились в поток; другие заползли в каменные домики, выстроенные для этой цели, и
    легли на сланцевые полки рядом с мёртвыми, чтобы село могло жить. В некоторых пересказах они даже
    замуровывают себя изнутри, камень за камнем.


    Этнограф Шорена Курцикидзе, соавтор книги об обычаях пограничья Шатили, говорит, что никаких доказательств
    этому нет. Наземные каменные некрополи, где умерших не хоронили, а укладывали, были широко распространены
    совсем рядом, по ту сторону границы, в Чечне и Ингушетии, и Анатори, возможно, единственный грузинский
    пример того же обряда. Почему люди выбрали его, точно неизвестно; по одной из версий, так выражали
    уважение к земле. Она признаёт, что без новых свидетельств всем остаётся лишь гадать.


    То, что вы увидите, просто и тревожно. Несколько прямоугольных склепов из сложенного плитами сланца
    стоят на утёсе примерно в трёх километрах за Шатили, по дороге на Муцо, у самой чеченской границы.
    Сквозь небольшие проёмы видны полки, черепа и длинные кости. Теперь проёмы закрыты железными решётками
    — их поставили после того, как кости начали пропадать; рассказывают об одном посетителе, который перешёл
    реку и ушёл с мешком черепов.


    Постойте у решётки на минуту дольше, чем вам удобно. Что бы ни привело их сюда — чума или обычай,
    — мёртвые Анатори и без легенды заслуживают вашего молчания.
  tip: >-
    Смотрите, но не заходите в склепы и ничего не трогайте: это кладбище и святое место для хевсуров.
    Двадцати–тридцати минут достаточно, так что совместите визит с Шатили — селом примерно из 60 каменных
    башен, жителей которого советские власти в начале 1950-х годов переселили на равнину; по переписи
    2014 года там жили всего 22 человека. Это пограничная зона: возьмите паспорт и будьте готовы к проверке
    документов. Кафе и туалетов у памятника нет; ближайшие — в гостевых домах Шатили. Не запускайте дрон
    так близко к границе.
  route: >-
    Из Тбилиси поезжайте по Военно-Грузинской дороге (E117) до Жинвали, затем по Sh26 через Барисахо и
    перевал Датвисджвари (2676 м) вниз, в ущелье Аргуна, до Шатили. Оттуда до Анатори ещё 3 км по дороге
    на Муцо: всего около 155 км и пять часов, причём примерно последние 50 км — горная грунтовка. Это
    боковая дорога за Шатили: нужен настоящий полноприводный внедорожник с высоким клиренсом. После Барисахо
    заправок нет, так что выезжайте с полным баком. Перевал открыт лишь примерно с июня по октябрь, в
    зависимости от снега. Не пытайтесь уложиться в один день: ночуйте в Шатили.
fa:
  name: دخمه‌های آناتوری
  short: >-
    دخمه‌های سنگ‌لوحی بر صخره‌ای بالای رود آرگون نزدیک شاتیلی: استخوان‌هایی پشت نردهٔ آهنی، افسانهٔ طاعونی
    که همه می‌گویند و حقیقتی آرام‌تر از زبان پژوهشگران.
  body: >-
    **در آناتوری استخوان‌ها واقعی‌اند. اما داستانی که همه دربارهٔ آن‌ها می‌گویند شاید واقعی نباشد.**


    در شاتیلی بپرسید تا آن را بشنوید. در سده‌ای از گذشته، که هیچ‌کس نمی‌گوید کدام، بازرگانی طاعون را،
    که به گرجی *ژامی* می‌گویند، به روستای آناتوری آورد. بیماران از بستر برخاستند و به صخره‌ای رفتند که
    دو رود در پای آن به هم می‌پیوندند. برخی خود را به آب سپردند؛ دیگران به درون کلبه‌های سنگی‌ای خزیدند
    که برای همین کار ساخته شده بود و بر تاقچه‌های سنگ‌لوحی کنار مردگان دراز کشیدند، تا روستا زنده بماند.
    در برخی روایت‌ها حتی خود را سنگ به سنگ در آن‌ها محصور می‌کنند.


    شورنا کورتسیکیدزه، قوم‌نگار و از نویسندگان کتابی دربارهٔ آداب مرزنشینان شاتیلی، می‌گوید هیچ مدرکی
    برای این‌ها وجود ندارد. گورستان‌های سنگیِ روی زمین، که مردگان را در آن‌ها نه به خاک که بر زمین می‌نهادند،
    درست آن سوی مرز، در چچن و اینگوشتیا، رواج فراوان داشتند و آناتوری شاید تنها نمونهٔ گرجیِ همین آیین
    باشد. اینکه چرا مردم این آیین را برگزیدند به‌درستی روشن نیست؛ یک نظریه می‌گوید راهی برای ادای احترام
    به زمین بوده است. او خود می‌پذیرد که بی‌شواهد بیشتر، همه تنها می‌توانند گمانه‌زنی کنند.


    آنچه می‌بینید ساده و دلهره‌آور است. چند دخمهٔ چهارگوش از لوح‌سنگ‌های روی‌هم‌چیده بر صخره‌ای در حدود
    سه کیلومتری پس از شاتیلی ایستاده‌اند، بر سر راه موتسو و نزدیک مرز چچن. از روزن‌های کوچک، تاقچه‌ها،
    جمجمه‌ها و استخوان‌های بلند پیداست. اکنون نرده‌های آهنی روی روزن‌ها را پوشانده است؛ آن‌ها را پس از
    آنکه استخوان‌ها رفته‌رفته ناپدید شدند نصب کردند. روایتی از بازدیدکننده‌ای می‌گوید که از رود گذشت و
    با کیسه‌ای پر از جمجمه بازگشت.


    یک دقیقه بیش از آنچه برایتان آسان است کنار نرده بمانید. چه طاعون آنان را به اینجا آورده باشد و چه
    رسم و آیین، مردگان آناتوری برای سزاوار بودنِ سکوت شما به افسانه نیازی ندارند.
  tip: >-
    نگاه کنید، اما به درون دخمه‌ها نروید و به چیزی دست نزنید: اینجا گورستان و برای خوسورها زمینی مقدس
    است. بیست تا سی دقیقه بس است، پس دیدارش را با شاتیلی همراه کنید؛ روستایی با حدود ۶۰ برج سنگی که مقامات
    شوروی در اوایل دههٔ ۱۹۵۰ مردمش را به دشت‌ها کوچاندند و در سرشماری ۲۰۱۴ تنها ۲۲ نفر در آن می‌زیستند.
    اینجا منطقهٔ مرزی است: گذرنامه همراه داشته باشید و منتظر بازرسی مدارک باشید. در محل کافه یا سرویس
    بهداشتی نیست؛ نزدیک‌ترین‌ها در مهمان‌خانه‌های شاتیلی‌اند. این‌قدر نزدیک به مرز پهپاد پرواز ندهید.
  route: >-
    از تفلیس جادهٔ نظامی گرجستان (E117) را تا ژینوالی بروید، سپس از راه Sh26 به باریساخو بروید و از گردنهٔ
    داتویسجواری (۲۶۷۶ متر) به درهٔ آرگون تا شاتیلی سرازیر شوید. از آنجا آناتوری ۳ کیلومتر دیگر در راه
    موتسو است: روی هم حدود ۱۵۵ کیلومتر و پنج ساعت، که تقریباً ۵۰ کیلومتر پایانی‌اش جادهٔ کوهستانی خاکی
    است. این راهی فرعی در ادامهٔ شاتیلی است: خودروی چهارچرخ‌محرک واقعی با فاصلهٔ زیاد از زمین لازم است.
    پس از باریساخو سوختی نیست، پس با باک پر راه بیفتید. گردنه بسته به برف تنها از حدود ژوئن تا اکتبر باز
    است. این سفر را یک‌روزه نروید: شب را در شاتیلی بمانید.
he:
  name: קברי אנאטורי
  short: >-
    מבני קבורה מלוחות צפחה על צוק מעל נהר ארגוני ליד שאטילי: עצמות מאחורי סורגי ברזל, אגדת מגפה שכולם
    מספרים ואמת שקטה יותר שמציעים החוקרים.
  body: >-
    **באנאטורי העצמות אמיתיות. הסיפור שכולם מספרים עליהן – אולי לא.**


    שאלו בשאטילי ותשמעו אותו. באחת המאות שעברו, ואיש אינו אומר באיזו, הביא סוחר את המגפה, *ז'אמי* בגאורגית,
    לכפר אנאטורי. החולים קמו ממיטותיהם והלכו אל צוק שבו נפגשים שני נהרות. חלקם השליכו את עצמם אל הזרם;
    אחרים זחלו אל בקתות אבן שנבנו לשם כך ושכבו על מדפי צפחה לצד המתים, כדי שהכפר יוכל לחיות. בכמה מהגרסאות
    הם אף חוסמים את הפתח על עצמם, אבן אחר אבן.


    האתנוגרפית שורנה קורציקידזה, שותפה לכתיבת ספר על מנהגי אזור הגבול של שאטילי, אומרת שאין לכך שום ראיה.
    בתי קברות מאבן מעל פני הקרקע, שבהם המתים הונחו ולא נקברו, היו נפוצים ממש מעבר לגבול, בצ'צ'ניה ובאינגושטיה,
    ואנאטורי הוא אולי הדוגמה הגאורגית היחידה לאותו טקס. מדוע בחרו בו אין יודעים בוודאות; לפי אחת ההשערות,
    זו הייתה דרך להביע כבוד לאדמה. היא מודה שבלי ראיות נוספות, כולם יכולים רק לשער.


    מה שרואים כאן פשוט ומטריד. כמה מבני קבורה מלבניים, עשויים לוחות צפחה מוערמים, עומדים על הצוק כשלושה
    קילומטרים אחרי שאטילי, בדרך למוצו, סמוך לגבול צ'צ'ניה. דרך פתחים קטנים אפשר לראות את המדפים, את הגולגלות
    ואת העצמות הארוכות. היום הפתחים מכוסים בסורגי ברזל, שהותקנו אחרי שעצמות החלו להיעלם; אחד הסיפורים
    מספר על מבקר שחצה את הנהר ויצא עם שק מלא גולגלות.


    עמדו ליד הסורג דקה אחת יותר ממה שנוח לכם. בין שהביאה אותם לכאן מגפה ובין שמנהג, המתים של אנאטורי ראויים
    לשתיקתכם גם בלי אגדה.
  tip: >-
    הביטו, אבל אל תיכנסו למבני הקבורה ואל תיגעו בדבר: זהו בית קברות ואדמה קדושה לחבסורים. עשרים עד שלושים
    דקות מספיקות, אז שלבו את הביקור עם שאטילי, כפר של כ־60 מגדלי אבן שתושביו הועברו בידי השלטונות הסובייטיים
    אל האזורים הנמוכים בתחילת שנות ה־50; במפקד 2014 חיו בו רק 22 אנשים. זהו אזור גבול: קחו דרכון וצפו
    לבדיקת מסמכים. באתר אין בתי קפה או שירותים; הקרובים ביותר נמצאים בבתי ההארחה של שאטילי. אל תטיסו רחפן
    קרוב כל כך לגבול.
  route: >-
    מטביליסי סעו בכביש הצבאי הגאורגי (E117) עד ז'ינוואלי, ואז בכביש Sh26 דרך בריסאחו, מעל מעבר דטוויסג'ווארי
    (2,676 מ') ומטה אל ערוץ ארגוני עד שאטילי. משם אנאטורי נמצא עוד 3 ק"מ בדרך העפר למוצו: בסך הכול כ־155
    ק"מ וחמש שעות, כשכ־50 הק"מ האחרונים הם דרך הררית לא סלולה. זו דרך צדדית שמעבר לשאטילי: צריך רכב שטח
    אמיתי עם הנעה כפולה ומרווח גחון גבוה. אחרי בריסאחו אין דלק, אז צאו עם מכל מלא. המעבר פתוח רק מיוני
    עד אוקטובר בערך, תלוי בשלג. אל תנסו לעשות זאת כטיול יום: לינו בשאטילי.
ar:
  name: مدافن أناتوري
  short: >-
    أقبية دفن من الأردواز على جرف فوق نهر أرغون قرب شاتيلي: عظام خلف قضبان حديدية، وأسطورة طاعون يرويها
    الجميع، وحقيقة أهدأ يقترحها الباحثون.
  body: >-
    **في أناتوري العظام حقيقية. أما الحكاية التي يرويها الجميع عنها فقد لا تكون كذلك.**


    اسأل في شاتيلي وستسمعها. في قرن مضى، لا يقول أحد أيّ قرن، حمل تاجرٌ الطاعونَ، *جامي* بالجورجية، إلى
    قرية أناتوري. فنهض المرضى من فُرُشهم ومشوا إلى جرف يلتقي عنده نهران. بعضهم ألقى بنفسه في التيار؛ وزحف
    آخرون إلى أكواخ حجرية بُنيت لهذا الغرض، واستلقوا على رفوف من الأردواز إلى جانب الموتى، كي تحيا القرية.
    بل إن بعض الروايات تجعلهم يسدّون المداخل على أنفسهم، حجراً فوق حجر.


    تقول عالمة الإثنوغرافيا شورينا كورتسيكيدزه، المشاركة في تأليف كتاب عن عادات منطقة شاتيلي الحدودية،
    إنه لا دليل على شيء من ذلك. فالمقابر الحجرية فوق الأرض، حيث كان الموتى يُمدَّدون لا يُدفنون، كانت
    منتشرة على الجانب الآخر من الحدود مباشرة، في الشيشان وإنغوشيا، وربما كانت أناتوري المثال الجورجي الوحيد
    على الشعيرة نفسها. ولا يُعرف على وجه اليقين لماذا اختارها الناس؛ إذ ترى إحدى النظريات أنها كانت وسيلة
    لإظهار الاحترام للأرض. وهي تعترف بأنه، في غياب مزيد من الأدلة، لا يملك أحد سوى التخمين.


    ما تراه بسيط ومقلق. بضعة أقبية مستطيلة من ألواح الأردواز المرصوصة تقوم على الجرف على بعد نحو ثلاثة
    كيلومترات بعد شاتيلي، على الطريق إلى موتسو، قريباً من الحدود الشيشانية. ومن فتحات صغيرة ترى الرفوف
    والجماجم والعظام الطويلة. تغطي الفتحاتِ اليومَ قضبانٌ حديدية رُكّبت بعد أن بدأت العظام تختفي؛ وتروي
    إحدى الحكايات قصة زائر عبر النهر وغادر بكيس من الجماجم.


    قف عند القضبان دقيقة أطول مما يريحك. سواء أجاء بهم الطاعون أم العادة، فإن موتى أناتوري لا يحتاجون
    إلى أسطورة ليستحقوا صمتك.
  tip: >-
    انظر، لكن لا تدخل الأقبية ولا تلمس شيئاً: فهذه مقبرة وأرض مقدسة عند الخيفسوريين. تكفي عشرون إلى ثلاثين
    دقيقة، فاجمع الزيارة مع شاتيلي، القرية التي تضم نحو 60 برجاً حجرياً، والتي نقلت السلطات السوفييتية
    سكانها إلى الأراضي المنخفضة في أوائل خمسينيات القرن العشرين؛ ولم يكن يعيش فيها سوى 22 شخصاً بحسب تعداد
    2014. هذه منطقة حدودية: احمل جواز سفرك وتوقّع التدقيق في الوثائق. لا مقاهي ولا دورات مياه في الموقع؛
    أقربها في بيوت الضيافة في شاتيلي. لا تُطيّر طائرة مسيّرة على هذا القرب من الحدود.
  route: >-
    من تبليسي اسلك الطريق العسكري الجورجي (E117) إلى جينفالي، ثم الطريق Sh26 صعوداً عبر باريساخو وفوق
    ممر داتفيسجفاري (2676 م) نزولاً إلى وادي أرغون حتى شاتيلي. ومن هناك تبعد أناتوري 3 كم أخرى على المسلك
    المؤدي إلى موتسو: نحو 155 كم وخمس ساعات في المجمل، منها قرابة 50 كم الأخيرة على طريق جبلي غير معبّد.
    هذا مسلك فرعي من مسالك شاتيلي: تحتاج إلى سيارة دفع رباعي حقيقية عالية الخلوص. لا وقود بعد باريساخو،
    فانطلق بخزان ممتلئ. لا يُفتح الممر إلا من نحو يونيو إلى أكتوبر، بحسب الثلوج. لا تحاول أن تجعلها رحلة
    يوم واحد: بِتْ في شاتيلي.
