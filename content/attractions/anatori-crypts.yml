ka:
  name: ანატორის აკლდამები
  short: >-
    შუა საუკუნეების სამარხი აკლდამები შატილთან, სადაც ჭირით დაავადებულები სასიკვდილოდ თავად მიდიოდნენ
    — არღუნის ხეობის ყველაზე მძიმე ძეგლი.
  body: >-
    **ანატორი ის ადგილია, სადაც ადამიანები სიკვდილს საკუთარი ფეხით მიდიოდნენ.** გადმოცემით, როცა ხევსურეთში
    ჭირი შემოვიდა, სოფელ ანატორის დაავადებული მოსახლეობა ოჯახების გადასარჩენად თავად ტოვებდა სახლებს,
    აკლდამებში შედიოდა და იქ, ქვის თაროებზე, უკვე გარდაცვლილთა გვერდით ელოდა აღსასრულს. ეს კარანტინის
    ალბათ ყველაზე რადიკალური ფორმაა, რაც კაცობრიობას მოუფიქრებია.


    ძეგლი შატილიდან სამიოდე კილომეტრში, არღუნის ხეობაში დგას, ჩეჩნეთის საზღვრის სიახლოვეს — იქ, სადაც
    გზა მუცოსკენ უხვევს. კომპლექსი ფიქლის ქვით ნაგები რამდენიმე ოთხკუთხა აკლდამისგან შედგება:


    - **სამარხი კამერები** სარკმლებით, რომლებშიც შიგნით ჩახედვა შეიძლება

    - **ქვის თაროები**, სადაც მომაკვდავები წვებოდნენ

    - ადამიანის ძვლები და თხემები, დღემდე თვალით ხილული


    სარკმლებზე ლითონის გისოსები მას შემდეგ დააყენეს, რაც ძვლების გატანის შემთხვევები დაფიქსირდა. ადგილს
    ხევსურული წარმართულ-ქრისტიანული ტრადიციები დღემდე სიწმინდედ მიიჩნევს — მოწიწებით მოეპყარი. ზამთარში
    გზა დაკეტილია; რეალური სეზონი ივნისიდან ოქტომბრამდეა.
  tip: >-
    აკლდამებში შესვლა და ძვლების ხელით შეხება მკაცრად მიუღებელია — ეს სასაფლაოა და ადგილობრივებისთვის
    წმინდა ადგილი. დათვალიერებას 20-30 წუთი ეყოფა, შატილთან ერთად დააწყვილე. საზღვრისპირა ზონაა — პასპორტი
    თან იქონიე, სასაზღვრო პოლიცია ზოგჯერ ამოწმებს. კაფე და ტუალეტი აქ არ არის, უახლოესი შატილშია. დრონის
    აშვება საზღვართან შეზღუდულია.
  route: >-
    თბილისიდან ჟინვალის, ბარისახოსა და დათვისჯვრის უღელტეხილის (2676 მ) გავლით შატილამდე — დაახლოებით
    150 კმ და ხუთი საათი, ბოლო 50 კმ მთის გრუნტია. შატილიდან ანატორამდე კიდევ 3 კმ-ია მუცოს გზაზე. ბარისახოს
    შემდეგ ბენზინგასამართი აღარ არის — აუცილებლად სავსე ავზით იმგზავრე. მაღალი განივლობის SUV მინიმუმია;
    გზა მხოლოდ ივნისიდან ოქტომბრამდეა ღია. ერთ დღეში მისვლა-მოსვლა დამღლელია — შატილში ღამისთევა აჯობებს.
en:
  name: Anatori Crypts
  short: >-
    Medieval burial vaults near Shatili where plague victims walked in to die — the most haunting monument
    of the Argun gorge.
  body: >-
    **Anatori is the place where people walked to their own deaths.** According to local tradition, when
    plague swept into Khevsureti, the infected villagers of Anatori left their homes to save their families,
    climbed into the crypts and lay down on stone shelves beside those already dead, waiting for the end.
    It is perhaps the most radical form of quarantine humanity has ever devised.


    The site stands about three kilometres beyond Shatili in the Argun gorge, close to the Chechen border,
    where the road forks towards Mutso. The complex consists of several rectangular vaults built of slate:


    - **Burial chambers** with small window openings you can look through

    - **Stone shelves** where the dying lay down

    - Human bones and skulls, still plainly visible today


    Steel grates were fitted over the openings after cases of bone theft were reported. For Khevsur tradition,
    which blends pagan and Christian custom, the site remains sacred ground — treat it with quiet respect.
    In winter the road over the pass is closed; the realistic season runs from June to October.
  tip: >-
    Entering the vaults or touching the bones is strictly out of bounds — this is a cemetery and a sacred
    place for locals. Twenty to thirty minutes is enough; pair it with Shatili. This is a border zone,
    so carry your passport — border police sometimes check documents. There is no cafe or toilet here;
    the nearest are in Shatili. Drone flying is restricted this close to the border.
  route: >-
    From Tbilisi via Zhinvali, Barisakho and the Datvisjvari Pass (2,676 m) to Shatili — roughly 150 km
    and five hours, the last 50 km on mountain gravel. From Shatili it is another 3 km along the Mutso
    road to Anatori. There are no petrol stations after Barisakho, so set out with a full tank. A high-clearance
    SUV is the minimum; the road is open only from about June to October. Doing it as a same-day return
    is punishing — overnight in Shatili instead.
ru:
  name: Склепы Анатори
  short: >-
    Средневековые погребальные склепы у Шатили, куда заражённые чумой уходили умирать — самый пронзительный
    памятник ущелья Аргун.
  body: >-
    **Анатори — место, куда люди шли умирать на своих ногах.** По местному преданию, когда в Хевсурети
    пришла чума, заболевшие жители села Анатори, спасая семьи, сами покидали дома, забирались в склепы
    и ложились на каменные полки рядом с уже умершими — ждать конца. Это, пожалуй, самая радикальная форма
    карантина, которую придумало человечество.


    Памятник стоит примерно в трёх километрах за Шатили, в ущелье Аргуна, у самой границы с Чечнёй — там,
    где дорога уходит на Муцо. Комплекс состоит из нескольких прямоугольных склепов, сложенных из сланца:


    - **Погребальные камеры** с небольшими оконными проёмами, в которые можно заглянуть

    - **Каменные полки**, на которые ложились умирающие

    - Человеческие кости и черепа, видимые до сих пор


    Металлические решётки на проёмах появились после случаев кражи костей. Для хевсурской традиции, где
    переплелись языческое и христианское, это место остаётся святыней — ведите себя тихо и уважительно.
    Зимой дорога через перевал закрыта; реальный сезон — с июня по октябрь.
  tip: >-
    Заходить в склепы и трогать кости категорически нельзя — это кладбище и святое место для местных.
    На осмотр хватит 20-30 минут, совместите с Шатили. Это приграничная зона: возьмите паспорт, пограничники
    иногда проверяют документы. Кафе и туалета здесь нет, ближайшие — в Шатили. Запуск дронов у границы
    ограничен.
  route: >-
    Из Тбилиси через Жинвали, Барисахо и перевал Датвисджвари (2676 м) до Шатили — примерно 150 км и пять
    часов, последние 50 км по горной гравийке. От Шатили до Анатори ещё 3 км по дороге на Муцо. После
    Барисахо заправок нет — выезжайте с полным баком. SUV с высоким клиренсом — необходимый минимум; дорога
    открыта примерно с июня по октябрь. Обернуться за день тяжело — лучше заночевать в Шатили.
fa:
  name: دخمه‌های آناتوری
  short: >-
    دخمه‌های تدفین سده‌های میانه نزدیک شاتیلی که طاعون‌زدگان با پای خود برای مردن به آنها می‌رفتند — تکان‌دهنده‌ترین
    یادگار درهٔ آرگون.
  body: >-
    **آناتوری جایی است که مردم با پای خود به سوی مرگ می‌رفتند.** بنا بر روایت محلی، وقتی طاعون به خوسورتی
    رسید، بیماران روستای آناتوری برای نجات خانواده‌هایشان خانه را ترک می‌کردند، به دخمه‌ها می‌خزیدند و
    بر تاقچه‌های سنگی، کنار آنان که پیش‌تر مرده بودند، دراز می‌کشیدند و پایان را انتظار می‌کشیدند. این
    شاید ریشه‌ای‌ترین شکل قرنطینه‌ای باشد که بشر به آن اندیشیده است.


    این یادگار حدود سه کیلومتر پس از شاتیلی، در درهٔ آرگون و نزدیک مرز چچن ایستاده — همان‌جا که جاده به
    سوی موتسو دوشاخه می‌شود. مجموعه از چند دخمهٔ چهارگوش از سنگ لوح ساخته شده است:


    - **اتاقک‌های تدفین** با روزن‌های کوچکی که می‌توان از آنها به درون نگریست

    - **تاقچه‌های سنگی** که محتضران بر آنها می‌آرمیدند

    - استخوان‌ها و جمجمه‌های انسان، که هنوز به‌روشنی دیده می‌شوند


    پس از گزارش‌هایی از سرقت استخوان، بر روزن‌ها نردهٔ فولادی نصب شد. در سنت خوسوری، که آیین‌های کهن و
    مسیحی در آن درآمیخته، اینجا هنوز زمینی مقدس است — با احترام و در سکوت رفتار کنید. زمستان جادهٔ گردنه
    بسته است؛ فصل واقعی از ژوئن تا اکتبر است.
  tip: >-
    ورود به دخمه‌ها و دست‌زدن به استخوان‌ها مطلقاً ممنوع است — اینجا گورستان و برای اهالی مکانی مقدس است.
    بیست تا سی دقیقه کافی است؛ آن را با شاتیلی همراه کنید. منطقهٔ مرزی است، گذرنامه همراه داشته باشید؛
    پلیس مرزی گاهی مدارک را می‌بیند. کافه و سرویس بهداشتی اینجا نیست؛ نزدیک‌ترین در شاتیلی است. پرواز
    پهپاد در این نزدیکی مرز محدود است.
  route: >-
    از تفلیس از راه ژینوالی، باریساخو و گردنهٔ داتویسجواری (2676 متر) تا شاتیلی — حدود 150 کیلومتر و پنج
    ساعت؛ 50 کیلومتر آخر شن‌راه کوهستانی است. از شاتیلی تا آناتوری 3 کیلومتر دیگر در جادهٔ موتسو است.
    پس از باریساخو پمپ بنزین نیست — با باک پر راه بیفتید. شاسی‌بلند با ارتفاع مناسب حداقلِ لازم است؛ جاده
    تنها از حدود ژوئن تا اکتبر باز است. رفت‌وبرگشت یک‌روزه فرساینده است — شب را در شاتیلی بمانید.
he:
  name: קברי אנאטורי
  short: כוכי קבורה מימי הביניים ליד שאטילי, שאליהם נכנסו חולי המגפה למות — האנדרטה הצורבת ביותר של ערוץ
    הארגון.
  body: >-
    **אנאטורי הוא המקום שאליו הלכו אנשים אל מותם ברגליהם שלהם.** על פי המסורת המקומית, כשהמגפה הגיעה לחבסורתי,
    עזבו תושבי הכפר אנאטורי שנדבקו את בתיהם כדי להציל את משפחותיהם, נכנסו אל הכוכים ונשכבו על מדפי האבן
    לצד אלה שכבר מתו — לחכות לסוף. זו אולי צורת הבידוד הקיצונית ביותר שהמציאה האנושות.


    האתר עומד כשלושה קילומטרים אחרי שאטילי, בערוץ נהר הארגון, סמוך לגבול צ'צ'ניה — במקום שבו הדרך מתפצלת
    למוצו. המכלול מורכב מכמה כוכים מלבניים בנויים אבן צפחה:


    - **תאי קבורה** עם פתחי חלון קטנים שאפשר להציץ דרכם

    - **מדפי אבן** שעליהם נשכבו הגוססים

    - עצמות אדם וגולגלות, גלויות לעין עד היום


    סורגי פלדה הותקנו על הפתחים אחרי שדווחו מקרים של גניבת עצמות. במסורת החבסורית, השוזרת מנהגים פגאניים
    ונוצריים, המקום נותר אדמה קדושה — נהגו בו בכבוד שקט. בחורף הדרך דרך המעבר סגורה; העונה המציאותית היא
    יוני עד אוקטובר.
  tip: >-
    כניסה לכוכים או נגיעה בעצמות אסורה בתכלית — זה בית קברות ומקום קדוש למקומיים. עשרים עד שלושים דקות
    מספיקות; שלבו את הביקור עם שאטילי. זהו אזור גבול, קחו דרכון — משמר הגבול בודק לפעמים מסמכים. אין כאן
    בית קפה או שירותים; הקרובים בשאטילי. הטסת רחפנים מוגבלת כל כך קרוב לגבול.
  route: >-
    מטביליסי דרך ז'ינוואלי, בריסאחו ומעבר דטוויסג'ווארי (2,676 מ') עד שאטילי — כ-150 ק"מ וחמש שעות, 50
    הק"מ האחרונים על חצץ הררי. משאטילי עוד 3 ק"מ בדרך למוצו עד אנאטורי. אחרי בריסאחו אין תחנות דלק — צאו
    עם מכל מלא. רכב שטח גבוה הוא המינימום; הדרך פתוחה רק מיוני עד אוקטובר בערך. הלוך ושוב באותו יום זה
    מפרך — עדיף ללון בשאטילי.
ar:
  name: مدافن أناتوري
  short: أقبية دفن من العصور الوسطى قرب شاتيلي دخلها مرضى الطاعون ليموتوا — أكثر آثار وادي أرغون قسوةً
    على القلب.
  body: >-
    **أناتوري هو المكان الذي مشى فيه الناس إلى موتهم بأقدامهم.** تقول الرواية المحلية إنه حين اجتاح الطاعون
    خيفسوريتي، غادر مرضى قرية أناتوري بيوتهم لإنقاذ عائلاتهم، ودخلوا الأقبية واستلقوا على الرفوف الحجرية
    إلى جانب من ماتوا قبلهم — منتظرين النهاية. لعله أكثر أشكال الحجر الصحي تطرفاً مما ابتكرته البشرية.


    يقع الموقع على نحو ثلاثة كيلومترات بعد شاتيلي، في وادي أرغون قرب الحدود الشيشانية — حيث يتفرع الطريق
    نحو موتسو. ويتألف المجمّع من عدة أقبية مستطيلة مبنية من حجر الأردواز:


    - **حجرات دفن** بفتحات نوافذ صغيرة يمكن النظر عبرها

    - **رفوف حجرية** كان يستلقي عليها المحتضرون

    - عظام بشرية وجماجم ما زالت ظاهرة للعيان حتى اليوم


    رُكّبت قضبان فولاذية على الفتحات بعد ورود حالات سرقة للعظام. وفي التقليد الخيفسوري، الذي تمتزج فيه
    الطقوس الوثنية بالمسيحية، يبقى المكان أرضاً مقدسة — فتعامل معه باحترام صامت. في الشتاء يُغلق طريق
    الممر؛ والموسم الواقعي من يونيو إلى أكتوبر.
  tip: >-
    دخول الأقبية أو لمس العظام ممنوع منعاً باتاً — فهذه مقبرة ومكان مقدس عند الأهالي. تكفي عشرون إلى ثلاثين
    دقيقة؛ اجمعها مع زيارة شاتيلي. المنطقة حدودية، فاحمل جواز سفرك — شرطة الحدود تفحص الوثائق أحياناً.
    لا مقهى ولا مرافق هنا؛ الأقرب في شاتيلي. وتحليق الطائرات المسيّرة مقيد بهذا القرب من الحدود.
  route: >-
    من تبليسي عبر جينفالي وباريساخو وممر داتفيسجفاري (2676 م) حتى شاتيلي — نحو 150 كم وخمس ساعات، آخر
    50 كم منها حصى جبلي. ومن شاتيلي 3 كم أخرى على طريق موتسو حتى أناتوري. لا محطات وقود بعد باريساخو —
    فانطلق بخزان ممتلئ. سيارة دفع رباعي مرتفعة هي الحد الأدنى؛ والطريق مفتوح فقط من نحو يونيو إلى أكتوبر.
    الذهاب والعودة في يوم واحد مرهق — فالأفضل المبيت في شاتيلي.
