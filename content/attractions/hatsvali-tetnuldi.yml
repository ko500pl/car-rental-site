ka:
  name: ჰაწვალი და თეთნულდი
  short: >-
    მესტიის ორი სათხილამურო კურორტი: ჰაწვალი, სადაც ქალაქიდან საბაგიროთი ადიხართ, და თეთნულდი სამხრეთ
    კავკასიის ყველაზე გრძელი, 9,5-კილომეტრიანი ტრასით.
  body: >-
    **სვანეთის სათხილამურო ზამთარს ორი სახე აქვს: ჰაწვალი, სადაც მესტიის კოშკებიდან საბაგიროთი ადიხართ,
    და თეთნულდი, სადაც ერთი ტრასა 9,5 კილომეტრს გრძელდება.**


    ჰაწვალი პირველი იყო — მესტიის პირველი სათხილამურო კურორტი ქალაქის თავზე, ზღვის დონიდან 1868-დან 2348
    მეტრამდე. საბაგირო მას პირდაპირ მესტიის ცენტრთან აკავშირებს: დილით შუასაუკუნეების კოშკის ძირას ისაუზმებთ,
    მერე კი პირდაპირ თოვლზე ამოხვალთ. ხუთი ტრასის ჯამური სიგრძე დაახლოებით 5,5 კილომეტრია: დამწყებთათვის
    500-მეტრიანი ფერდობი და მის გვერდით სასწავლო მოედანი, 600-მეტრიანი საშუალო სირთულის ტრასა და 4,4-კილომეტრიანი
    დაშვება, რომელიც გამოცდილ მოთხილამურესაც გამოცდის. საბაგიროები ჰაწვალს, ბიგელს, სლალომსა და ზურულდს
    ემსახურება, კურორტი კი სტუმრებს ზამთრის გარდა სხვა დროსაც ელოდება.


    თეთნულდი მესტიიდან თხუთმეტ კილომეტრშია და ორივეს შორის უფრო დიდი და უფრო ველურია. მშენებლობა 2014
    წლის მაისში დაიწყო, პირველი ეტაპი 2016 წლის იანვარში დასრულდა. ხუთი საბაგირო მოთხილამურეს 2260-დან
    3160 მეტრამდე აჰყავს; ცხრა ტრასა ჯამში დაახლოებით 13 კილომეტრია, მთავარი დაშვება კი, 9,5 კილომეტრი,
    მთელ სამხრეთ კავკასიაში ყველაზე გრძელია. 2022 წლიდან მისი ტრასგარეშე ფერდობები ფრირაიდის მსოფლიო ტურის
    (Freeride World Tour) შესარჩევ ეტაპებს მასპინძლობს.


    თოვლი აქ სეზონის განმავლობაში ხასიათს იცვლის: დასაწყისში ფაფუკი და მსუბუქია, შუა ზამთარში — მკვრივი
    და დატკეპნილი, ბოლოს კი უხეში, მარცვლოვანი გაზაფხულის თოვლი დგება. მაშველები ზვავსაშიშროებას მუდმივად
    აკვირდებიან, ტრასგარეშე სრიალი კი მხოლოდ პროფესიონალ გიდთან ერთადაა ნებადართული.


    ერთი „მულტიბარათი“ აქაურ საბაგიროებზეც მოქმედებს და გუდაურში, ბაკურიანსა და გოდერძზეც. რასაც აქ ვერ
    იპოვით, გუდაურის ფუსფუსია: საჭმელი უბრალოა, ღამის გასათევი მესტიის საოჯახო სასტუმროებშია, საღამოები
    კი ბარებს კი არა, სვანურ სუფრას ეკუთვნის.


    სვანეთში საბაგირო ახალმოსულია. კოშკები და მწვერვალები აქ მასზე ადრე იყო — და ამას ყოველ დაშვებაზე
    იგრძნობთ.
  tip: >-
    სეზონი ჩვეულებრივ ნოემბრის ბოლოდან ან დეკემბრიდან აპრილის შუა რიცხვებამდე გრძელდება, თუმცა თოვლი წლიდან
    წლამდე მკვეთრად იცვლება — გრძელ გზას სანამ დაადგებით, გადაამოწმეთ, რომელი საბაგიროები მუშაობს. იყიდეთ
    „მულტიბარათი“, რომელიც ორივე კურორტზე მოქმედებს; ფასები ყოველ სეზონზე იცვლება. თეთნულდის ზედა ფერდობები
    ჰაწვალზე გაცილებით ცივი და ქარიანია — სახის დამცავი და კარგი ხელთათმანები აუცილებელია. ტრასგარეშე
    სრიალი მხოლოდ გიდთან და ზვავის აღჭურვილობით, გამონაკლისის გარეშე. კაფეები ჰაწვალის შუა და ზედა სადგურებთან
    და თეთნულდზეც არის, ღამის გასათევი კი მესტიასა და მიმდებარე სოფლებშია.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით, ქუთაისისა და სენაკის გავლით, ზუგდიდამდე, შემდეგ კი შ7-ით ენგურის
    ხეობის აყოლებით ზემოთ, მესტიამდე — ჰაწვალის ბაზამდე სულ დაახლოებით 478 კმ და 8 საათი და 50 წუთი, თოვლში
    კი გაცილებით მეტი. ჰაწვალამდე მისვლა უფრო მარტივია: მისი საბაგირო თავად მესტიიდან იწყება, ბაზამდე
    გზაც ადის. თეთნულდი მესტიიდან დაახლოებით 15 კილომეტრშია; გზის ნაწილი ასფალტია, ნაწილი ხრეში, ზამთარში
    დატკეპნილი თოვლით დაფარული. ამიტომ საჭიროა მაღალი გამავლობის (SUV) ავტომობილი ზამთრის საბურავებით,
    საბარგულში კი — ჯაჭვები. საწვავი ზუგდიდში ან მესტიაში შეავსეთ: ბაზებზე გასამართი არ არის.
en:
  name: Hatsvali and Tetnuldi Ski Areas
  short: >-
    Mestia's two ski areas: Hatsvali, a cable-car ride from town, and Tetnuldi, whose 9.5 km run is the
    longest in the South Caucasus.
  body: >-
    **Svaneti's ski winter has two faces: Hatsvali, a cable-car ride above Mestia's towers, and Tetnuldi,
    where a single run keeps going for 9.5 kilometres.**


    Hatsvali came first. Mestia's original ski area spreads between 1,868 and 2,348 metres on the slopes
    above town, and a cable car links it directly with the centre, so you can breakfast beneath a medieval
    tower and ride straight up to the snow. Five runs add up to about 5.5 km: a 500-metre beginners' slope
    with a training area beside it, a 600-metre intermediate run, and a 4.4-kilometre descent that tests
    strong skiers. Lifts serve Hatsvali, Bigeli, Slalomi and Zuruldi, and the area stays open for visitors
    outside winter too.


    Tetnuldi, fifteen kilometres from Mestia, is the bigger and wilder of the pair. Construction began
    in May 2014 and the first phase was finished in January 2016. Five lifts carry skiers from 2,260 to
    3,160 metres across nine runs, about 13 km in all, and the main descent of 9.5 km is the longest in
    the South Caucasus. Since 2022 its off-piste slopes have hosted qualifying events of the Freeride
    World Tour.


    The snow changes character through the season: light powder early on, firm packed pistes in midwinter,
    coarse granular spring snow at the end. Rescue teams watch the avalanche risk constantly, and off-piste
    skiing is allowed only with a professional guide.


    One multicard pass covers the lifts here as well as at Gudauri, Bakuriani and Goderdzi. What you will
    not find is Gudauri's bustle: food is simple, beds are in Mestia's guesthouses, and the evenings belong
    to Svan tables rather than bars.


    In Svaneti the ski lift is the newcomer. The towers and the peaks were here first, and you feel it
    on every run.
  tip: >-
    The season usually runs from late November or December to mid-April, but snow varies sharply from
    year to year, so check which lifts are open before you commit to the long drive. Buy the multicard,
    valid at both areas; prices change every season. Tetnuldi's upper slopes are far colder and windier
    than Hatsvali's, so pack a buff and proper gloves. Off-piste means a guide and avalanche kit, no exceptions.
    There are cafés near Hatsvali's middle and upper stations and a few at Tetnuldi, but accommodation
    is in Mestia and the villages around it.
  route: >-
    From Tbilisi follow the E60/S1 west past Kutaisi and Senaki to Zugdidi, then the Sh7 north up the
    Enguri gorge to Mestia: about 478 km and 8 h 50 min to the Hatsvali base, much longer in snow. Hatsvali
    is the easy one, since its cable car starts in Mestia itself and a road also climbs to the base. Tetnuldi
    lies about 15 km from Mestia; part of the road is asphalt and part gravel, packed with snow in winter.
    That is why an SUV on winter tyres, with chains in the boot, is the right choice. Fill up in Zugdidi
    or Mestia: there is no fuel at either base.
ru:
  name: Горнолыжные зоны Хацвали и Тетнульди
  short: >-
    Два горнолыжных курорта Местиа: Хацвали, куда из города везёт канатная дорога, и Тетнульди, чья трасса
    длиной 9,5 км — самая длинная на Южном Кавказе.
  body: >-
    **У сванской лыжной зимы два лица: Хацвали, куда канатная дорога поднимает прямо над башнями Местиа,
    и Тетнульди, где одна-единственная трасса тянется 9,5 километра.**


    Первым был Хацвали. Старейшая горнолыжная зона Местиа раскинулась на склонах над городом, между 1868
    и 2348 метрами, и канатная дорога связывает её прямо с центром: можно позавтракать под средневековой
    башней и сразу подняться к снегу. Пять трасс дают в сумме около 5,5 км: 500-метровый склон для новичков
    с учебной площадкой рядом, 600-метровая трасса средней сложности и спуск длиной 4,4 км, который проверит
    на прочность сильных лыжников. Подъёмники обслуживают Хацвали, Бигели, Слаломи и Зурульди, а открыта
    зона для гостей и вне зимы.


    Тетнульди, в пятнадцати километрах от Местиа, — больше и суровее. Строить его начали в мае 2014 года,
    а первую очередь завершили в январе 2016-го. Пять подъёмников везут лыжников с 2260 до 3160 метров,
    к девяти трассам общей длиной около 13 км, а главный спуск в 9,5 км — самый длинный на Южном Кавказе.
    С 2022 года на здешних внетрассовых склонах проходят отборочные этапы Freeride World Tour.


    Снег за сезон меняет характер: вначале лёгкая пушистая целина, в разгар зимы плотные укатанные трассы,
    к концу — крупнозернистый весенний снег. Спасатели постоянно следят за лавинной опасностью, а кататься
    вне трасс разрешено только с профессиональным гидом.


    Единый ски-пасс «Мультикард» действует здесь, а также в Гудаури, Бакуриани и Годердзи. Чего здесь
    не найти, так это суеты Гудаури: еда простая, ночуют в гостевых домах Местиа, а вечера принадлежат
    сванскому застолью, а не барам.


    В Сванетии подъёмник — новичок. Башни и вершины стояли здесь задолго до него, и это чувствуется на
    каждом спуске.
  tip: >-
    Сезон обычно длится с конца ноября или декабря до середины апреля, но снега год от года бывает очень
    по-разному, так что прежде чем пускаться в долгую дорогу, проверьте, какие подъёмники работают. Купите
    «Мультикард» — он действует в обеих зонах; цены меняются каждый сезон. Верхние склоны Тетнульди куда
    холоднее и ветреннее, чем в Хацвали, поэтому возьмите бафф и хорошие перчатки. Вне трасс — только
    с гидом и лавинным снаряжением, без исключений. У средней и верхней станций Хацвали есть кафе, в Тетнульди
    — несколько, но жильё — в Местиа и окрестных сёлах.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Кутаиси и Сенаки до Зугдиди, затем по Sh7 на север по ущелью Ингури
    до Местиа: около 478 км и 8 ч 50 мин до нижней станции Хацвали, а в снегопад гораздо дольше. С Хацвали
    всё просто: его канатная дорога начинается в самой Местиа, а к базе ведёт и автодорога. Тетнульди
    лежит примерно в 15 км от Местиа; дорога туда частью асфальтовая, частью гравийная, а зимой укатана
    снегом. Поэтому правильный выбор — внедорожник на зимней резине и с цепями в багажнике. Заправьтесь
    в Зугдиди или Местиа: ни на одной из баз заправки нет.
fa:
  name: پیست‌های اسکی هاتسوالی و تتنولدی
  short: >-
    دو پیست اسکی مستیا: هاتسوالی که با تله‌کابین از شهر به آن می‌رسید، و تتنولدی که مسیر ۹٫۵ کیلومتری‌اش
    طولانی‌ترین مسیر اسکی قفقاز جنوبی است.
  body: >-
    **زمستانِ اسکی در سوانتی دو چهره دارد: هاتسوالی، که تله‌کابین شما را از فراز برج‌های مستیا به آن می‌رساند،
    و تتنولدی، جایی که تنها یک مسیر ۹٫۵ کیلومتر بی‌وقفه ادامه دارد.**


    هاتسوالی زودتر آمد. نخستین پیست اسکی مستیا بر دامنه‌های بالای شهر، میان ۱۸۶۸ و ۲۳۴۸ متر گسترده است
    و تله‌کابینی آن را مستقیم به مرکز شهر وصل می‌کند؛ می‌توانید زیر برجی قرون‌وسطایی صبحانه بخورید و یکراست
    به برف برسید. پنج مسیر روی هم حدود ۵٫۵ کیلومتر می‌شوند: شیبی ۵۰۰ متری برای مبتدیان با محوطهٔ آموزشی
    در کنارش، مسیری ۶۰۰ متری برای سطح متوسط، و سرازیری ۴٫۴ کیلومتری که اسکی‌بازان قوی را می‌آزماید. بالابرها
    به هاتسوالی، بیگلی، اسلالومی و زورولدی می‌رسند و این پیست بیرون از زمستان هم به روی بازدیدکنندگان
    باز است.


    تتنولدی، در پانزده کیلومتری مستیا، بزرگ‌تر و وحشی‌ترِ این دو است. ساختش در مه ۲۰۱۴ آغاز شد و مرحلهٔ
    نخست در ژانویهٔ ۲۰۱۶ به پایان رسید. پنج بالابر اسکی‌بازان را از ۲۲۶۰ تا ۳۱۶۰ متر بالا می‌برند و به
    نُه مسیر با درازای روی هم حدود ۱۳ کیلومتر می‌رسانند، و سرازیری اصلی ۹٫۵ کیلومتری‌اش طولانی‌ترین در
    قفقاز جنوبی است. از ۲۰۲۲ دامنه‌های بیرون از پیستش میزبان رقابت‌های مقدماتی تور جهانی فری‌راید (Freeride
    World Tour) بوده‌اند.


    برف در طول فصل خُلقش را عوض می‌کند: در آغاز پودری سبک، در میانهٔ زمستان پیست‌های کوبیده و سفت، و در
    پایان برفِ درشت‌دانهٔ بهاری. گروه‌های امداد پیوسته خطر بهمن را زیر نظر دارند و اسکی بیرون از پیست
    تنها با راهنمای حرفه‌ای مجاز است.


    یک کارت واحد به نام «مولتی‌کارت» برای بالابرهای اینجا و همچنین گودائوری، باکوریانی و گودردزی معتبر
    است. آنچه اینجا نمی‌یابید شلوغی گودائوری است: غذا ساده است، جای خواب در مهمان‌خانه‌های مستیاست و شب‌ها
    از آنِ سفره‌های سوانی است، نه بارها.


    در سوانتی، بالابر اسکی تازه‌وارد است. برج‌ها و قله‌ها پیش از آن اینجا بوده‌اند، و این را در هر سرازیری
    حس می‌کنید.
  tip: >-
    فصل معمولاً از اواخر نوامبر یا دسامبر تا نیمهٔ آوریل است، اما مقدار برف از سالی به سال دیگر بسیار
    فرق می‌کند؛ پس پیش از آنکه راه طولانی را در پیش بگیرید، ببینید کدام بالابرها کار می‌کنند. «مولتی‌کارت»
    را بخرید که در هر دو پیست معتبر است؛ قیمت‌ها هر فصل تغییر می‌کند. دامنه‌های بالایی تتنولدی بسیار سردتر
    و بادخیزتر از هاتسوالی‌اند، پس یک گردن‌پوش و دستکش درست‌وحسابی بردارید. اسکی بیرون از پیست یعنی راهنما
    و تجهیزات بهمن، بی‌هیچ استثنا. نزدیک ایستگاه‌های میانی و بالایی هاتسوالی کافه هست و در تتنولدی هم
    چند تایی، اما اقامتگاه‌ها در مستیا و روستاهای پیرامون آن‌اند.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب، از کنار کوتائیسی و سناکی تا زوگدیدی بروید و سپس جادهٔ Sh7 را
    از درهٔ انگوری به شمال تا مستیا بگیرید: حدود ۴۷۸ کیلومتر و ۸ ساعت و ۵۰ دقیقه تا پای پیست هاتسوالی،
    و در برف بسیار بیشتر. هاتسوالی ساده است، چون تله‌کابینش از خود مستیا راه می‌افتد و جاده‌ای هم تا پای
    پیست بالا می‌رود. تتنولدی حدود ۱۵ کیلومتر از مستیا فاصله دارد؛ بخشی از جاده آسفالت و بخشی شنی است
    و در زمستان زیر برفِ کوبیده. برای همین انتخاب درست یک خودروی شاسی‌بلند (SUV) با لاستیک زمستانی و زنجیر
    چرخ در صندوق عقب است. در زوگدیدی یا مستیا سوخت بگیرید: در هیچ‌یک از دو پیست پمپ بنزین نیست.
he:
  name: אתרי הסקי חצוואלי וטטנולדי
  short: >-
    שני אתרי הסקי של מסטיה: חצוואלי, נסיעה ברכבל מן העיר, וטטנולדי, שמסלולו באורך 9.5 ק״מ הוא הארוך ביותר
    בדרום הקווקז.
  body: >-
    **לחורף הסקי של סוונטי יש שני פנים: חצוואלי, נסיעה ברכבל מעל המגדלים של מסטיה, וטטנולדי, שבו מסלול
    אחד ויחיד נמשך 9.5 קילומטרים.**


    חצוואלי היה הראשון. אתר הסקי הוותיק של מסטיה משתרע על המדרונות שמעל העיר, בין 1,868 ל-2,348 מטר, ורכבל
    מחבר אותו ישירות למרכז — אפשר לאכול ארוחת בוקר למרגלות מגדל מימי הביניים ולעלות היישר אל השלג. חמישה
    מסלולים מצטברים לכ-5.5 ק״מ: מדרון מתחילים באורך 500 מטר ולצדו אזור לימוד, מסלול בינוני באורך 600 מטר,
    וגלישה של 4.4 ק״מ שמעמידה במבחן גולשים חזקים. המעליות משרתות את חצוואלי, ביגלי, סלאלומי וזורולדי,
    והאתר פתוח למבקרים גם מחוץ לחורף.


    טטנולדי, חמישה-עשר קילומטרים ממסטיה, הוא הגדול והפראי מבין השניים. בנייתו החלה במאי 2014, והשלב הראשון
    הושלם בינואר 2016. חמש מעליות נושאות את הגולשים מ-2,260 עד 3,160 מטר, אל תשעה מסלולים שאורכם הכולל
    כ-13 ק״מ, והגלישה הראשית, 9.5 ק״מ, היא הארוכה ביותר בדרום הקווקז. מאז 2022 מתקיימים במדרונות שמחוץ
    למסלולים שלו אירועי מוקדמות של סבב הפרירייד העולמי (Freeride World Tour).


    השלג משנה את אופיו במהלך העונה: אבקה קלה בתחילתה, מסלולים דחוסים ומוצקים באמצע החורף, ושלג אביבי גס
    וגרגרי בסופה. צוותי חילוץ עוקבים בלי הפסקה אחר סכנת המפולות, וגלישה מחוץ למסלולים מותרת רק עם מדריך
    מקצועי.


    כרטיס אחד, "מולטיקארד", תקף למעליות כאן וגם בגודאורי, בבקוריאני ובגודרדזי. מה שלא תמצאו כאן הוא ההמולה
    של גודאורי: האוכל פשוט, הלינה בבתי ההארחה של מסטיה, והערבים שייכים לשולחנות הסוואניים ולא לברים.


    בסוונטי, מעלית הסקי היא העולה החדשה. המגדלים והפסגות היו כאן לפניה, ומרגישים את זה בכל גלישה.
  tip: >-
    העונה נמשכת בדרך כלל מסוף נובמבר או מדצמבר ועד אמצע אפריל, אבל כמות השלג משתנה מאוד משנה לשנה, לכן
    בדקו אילו מעליות פועלות לפני שאתם יוצאים לנסיעה הארוכה. קנו את כרטיס ה"מולטיקארד", התקף בשני האתרים;
    המחירים משתנים מדי עונה. המדרונות העליונים של טטנולדי קרים וסוערים הרבה יותר מאלה של חצוואלי, אז ארזו
    צווארון חם (באף) וכפפות רציניות. מחוץ למסלולים — רק עם מדריך וציוד מפולות, בלי יוצא מן הכלל. יש בתי
    קפה ליד התחנה האמצעית והעליונה של חצוואלי וכמה גם בטטנולדי, אבל הלינה נמצאת במסטיה ובכפרים שסביבה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 על פני קוטאיסי וסנאקי עד זוגדידי, ומשם בכביש Sh7 צפונה בערוץ האנגורי
    עד מסטיה: כ-478 ק״מ ו-8 שעות ו-50 דקות עד בסיס חצוואלי, והרבה יותר בשלג. חצוואלי הוא הקל מבין השניים,
    כי הרכבל שלו יוצא ממסטיה עצמה, וגם כביש עולה עד הבסיס. טטנולדי נמצא כ-15 ק״מ ממסטיה; חלק מהדרך סלול
    וחלקה חצץ, ובחורף היא מכוסה שלג דחוס. לכן הבחירה הנכונה היא רכב שטח (SUV) עם צמיגי חורף ושרשראות בתא
    המטען. תדלקו בזוגדידי או במסטיה: באף אחד מהבסיסים אין תחנת דלק.
ar:
  name: منطقتا التزلج هاتسفالي وتيتنولدي
  short: >-
    منطقتا التزلج في ميستيا: هاتسفالي التي تبلغها بالتلفريك من البلدة، وتيتنولدي التي يُعدّ مسارها البالغ
    9.5 كم الأطول في جنوب القوقاز.
  body: >-
    **لشتاء التزلج في سفانيتي وجهان: هاتسفالي، رحلة تلفريك فوق أبراج ميستيا، وتيتنولدي، حيث يمتد مسار
    واحد مسافة 9.5 كيلومتر.**


    جاءت هاتسفالي أولًا. تمتد منطقة التزلج الأقدم في ميستيا على المنحدرات المطلة على البلدة بين 1868 و2348
    مترًا، ويصلها تلفريك بالمركز مباشرة، فتتناول فطورك تحت برج من القرون الوسطى ثم تصعد رأسًا إلى الثلج.
    خمسة مسارات يبلغ مجموعها نحو 5.5 كم: منحدر للمبتدئين طوله 500 متر وإلى جانبه منطقة تدريب، ومسار متوسط
    طوله 600 متر، ونزول طوله 4.4 كم يختبر المتزلجين الأقوياء. وتخدم المصاعد مواقع هاتسفالي وبيغيلي وسلالومي
    وزورولدي، وتبقى المنطقة مفتوحة للزوار خارج الشتاء أيضًا.


    أما تيتنولدي، على بعد خمسة عشر كيلومترًا من ميستيا، فهي الأكبر والأكثر وعورة بين الاثنتين. بدأ بناؤها
    في مايو 2014 واكتملت مرحلتها الأولى في يناير 2016. خمسة مصاعد تحمل المتزلجين من 2260 إلى 3160 مترًا
    نحو تسعة مسارات يبلغ مجموعها نحو 13 كم، والنزول الرئيسي البالغ 9.5 كم هو الأطول في جنوب القوقاز. ومنذ
    عام 2022 تستضيف منحدراتها خارج المسارات جولات تأهيلية ضمن جولة فري رايد العالمية (Freeride World Tour).


    يتبدّل طابع الثلج على مدار الموسم: بودرة خفيفة في أوله، ومسارات مضغوطة صلبة في منتصف الشتاء، وثلج
    ربيعي خشن الحبيبات في آخره. وتراقب فرق الإنقاذ خطر الانهيارات الثلجية باستمرار، ولا يُسمح بالتزلج
    خارج المسارات إلا مع مرشد محترف.


    بطاقة واحدة، «مولتي كارد»، تغطي المصاعد هنا وفي غوداوري وباكورياني وغوديردزي أيضًا. أما ما لن تجده
    فهو صخب غوداوري: الطعام بسيط، والمبيت في دور الضيافة في ميستيا، والأمسيات لموائد السفان لا للحانات.


    في سفانيتي، مصعد التزلج هو الوافد الجديد. فالأبراج والقمم سبقته إلى هنا، وأنت تشعر بذلك في كل نزول.
  tip: >-
    يمتد الموسم عادةً من أواخر نوفمبر أو ديسمبر حتى منتصف أبريل، لكن الثلج يتفاوت كثيرًا من عام إلى آخر،
    فتحقّق من المصاعد العاملة قبل أن تلتزم بالرحلة الطويلة. اشترِ بطاقة «مولتي كارد» الصالحة في المنطقتين؛
    الأسعار تتغير كل موسم. المنحدرات العليا في تيتنولدي أبرد وأشد رياحًا بكثير من منحدرات هاتسفالي، فاحمل
    وشاح رقبة وقفازات جيدة. التزلج خارج المسارات يعني مرشدًا ومعدات الانهيارات الثلجية، بلا استثناء. توجد
    مقاهٍ قرب المحطتين الوسطى والعليا في هاتسفالي وبضعة مقاهٍ في تيتنولدي، أما الإقامة ففي ميستيا والقرى
    المحيطة بها.
  route: >-
    من تبليسي اتبع الطريق E60/S1 غربًا مرورًا بكوتايسي وسيناكي حتى زوغديدي، ثم الطريق Sh7 شمالًا صعودًا
    في وادي إنغوري حتى ميستيا: نحو 478 كم و8 ساعات و50 دقيقة حتى قاعدة هاتسفالي، وأطول بكثير في الثلج.
    هاتسفالي هي الأسهل، إذ ينطلق تلفريكها من ميستيا نفسها، كما يصعد إلى قاعدتها طريق للسيارات. تقع تيتنولدي
    على بعد نحو 15 كم من ميستيا؛ جزء من الطريق معبّد وجزء مفروش بالحصى، ويغطيه الثلج المضغوط في الشتاء.
    لذلك فالخيار الصحيح سيارة دفع رباعي (SUV) بإطارات شتوية وسلاسل في صندوق الأمتعة. تزوّد بالوقود في
    زوغديدي أو ميستيا: لا توجد محطة وقود في أي من القاعدتين.
