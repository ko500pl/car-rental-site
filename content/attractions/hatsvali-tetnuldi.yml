ka:
  name: ჰაწვალი და თეთნულდი
  short: მესტიის ორი სათხილამურო ზონა — ჰაწვალი ტყის ტრასებით და თეთნულდი, სადაც კანატკა 3000 მეტრს სცილდება.
  body: >-
    ზემო სვანეთს ორი სათხილამურო ზონა აქვს და ისინი ერთმანეთს ავსებენ, ვიდრე ეჯიბრებიან. ჰაწვალი მესტიიდან
    რვა კილომეტრშია, დაახლოებით 1870 მეტრზე იწყება და ძირითადად ტყეში გაკვალული ტრასებით გამოირჩევა —
    მოკლე, დაცული ქარისგან და კომფორტული საშუალო დონისთვის. მისი გონდოლა ზაფხულშიც მუშაობს და ხედის გამო
    ბევრს სწორედ ივლის-აგვისტოში ადის.


    თეთნულდი მესტიიდან 15–16 კილომეტრშია, უფრო მაღალია და უფრო სერიოზული: საბაგირო სისტემა სამი ათას მეტრზე
    მაღლა აჰყავს მოთხილამურეს და აქედან იშლება ღია, ხის ზონის ზემოთ მდებარე ფერდობები. ეს საქართველოს
    ერთ-ერთი ყველაზე მაღალი სათხილამურო წერტილია და ხედი შხარაზე, უშბასა და თეთნულდზე თავისთავად ღირს
    ბილეთად.


    პრაქტიკული განსხვავებები:


    - **ჰაწვალი** — მოკლე გზა, ტყის ტრასები, ნაკლები ქარი, უფრო მოკრძალებული პერეპადი

    - **თეთნულდი** — გრძელი და ნაწილობრივ უხეში მისასვლელი, ალპური ზონა, უფრო დიდი დაშვება

    - **ორივე ზონა** მოკლე სეზონზე მუშაობს და ინფრასტრუქტურით უფრო მოკრძალებულია, ვიდრე გუდაური


    აღჭურვილობის გაქირავება ორივე ბაზაზეა, თუმცა არჩევანი შეზღუდულია — თუ საკუთარი ჩექმები გაქვთ, წაიღეთ.
    მესტიის ცენტრიდან ორივემდე რეგულარული ტრანსფერი დადის.
  tip: >-
    სეზონი დაახლოებით დეკემბრის ბოლოდან მარტის ბოლომდე გრძელდება, თუმცა თოვლის ხარისხი წლიდან წლამდე მკვეთრად
    იცვლება — ამინდი წინასწარ შეამოწმეთ. ორივე ბაზაზე მუშაობს პატარა კაფე, მაგრამ ბანკომატი არ არის: ნაღდი
    ლარი აუცილებლად თან იქონიეთ. თეთნულდზე უფრო ცივი და ქარიანია, ამიტომ ნიღაბი და თბილი ხელთათმანები
    საჭიროა. მანქანა ბაზასთან პარკინგზე ტოვებთ უფასოდ; ზამთარში ზამთრის საბურავები სავალდებულოა, ჯაჭვები
    კი სასურველი.
  route: >-
    თბილისიდან მესტიამდე 470 კმ და რვა-ცხრა საათია ზუგდიდისა და ენგურის ხეობის გავლით. მესტიიდან ჰაწვალამდე
    რვა კილომეტრი ასფალტის სერპანტინია — 20 წუთი. თეთნულდამდე 15–16 კმ-ია და ნახევარ საათზე მეტი: გზის
    ნაწილი ასფალტია, ნაწილი კი ხრეშოვანი და ზამთარში ნაგრეხი. სწორედ ამიტომ სჯობია მაღალი კლირენსის ავტომობილი
    ზამთრის საბურავებით. საწვავი მესტიაში აავსეთ, ბაზებზე გასამართი არ არის. ცუდი ამინდის დროს ორგანიზებული
    ტრანსფერი უფრო ლოგიკური არჩევანია.
en:
  name: Hatsvali and Tetnuldi Ski Areas
  short: Mestia's two ski zones — Hatsvali with sheltered forest runs, and Tetnuldi, where the lifts pass
    3,000 metres.
  body: >-
    Upper Svaneti has two ski areas, and they complement each other rather than compete. Hatsvali lies
    eight kilometres from Mestia, starts at about 1,870 metres and is defined by runs cut through forest:
    short, sheltered from wind and comfortable for intermediate skiers. Its gondola also operates in summer,
    and plenty of visitors ride it in July and August purely for the view.


    Tetnuldi sits 15–16 kilometres from Mestia, higher and considerably more serious. Its lift system
    takes skiers above three thousand metres, opening onto wide treeless slopes. This is one of the highest
    lift-served points in Georgia, and the panorama across Shkhara, Ushba and Tetnuldi itself justifies
    the ticket on its own.


    The practical differences:


    - **Hatsvali** — short access road, forest runs, less wind, modest vertical

    - **Tetnuldi** — longer and partly rough access, alpine terrain, much bigger descent

    - **Both areas** run a short season and have simpler infrastructure than Gudauri


    Equipment rental exists at both bases, but the range is limited, so bring your own boots if you have
    them. Regular transfers run from Mestia centre to each area, which many people prefer to driving.
    Neither resort has the queues or the nightlife of larger Georgian resorts, and that is a large part
    of the appeal here.
  tip: >-
    The season runs roughly from late December to late March, though snow quality varies sharply from
    year to year, so check conditions before committing. Both bases have a small cafe but no ATM: carry
    cash in lari. Tetnuldi is colder and windier, so a face mask and warm gloves are genuinely needed.
    Parking at each base is free and rarely full. Winter tyres are compulsory in the season and chains
    are worth having in the car, particularly for the upper part of the Tetnuldi road.
  route: >-
    Tbilisi to Mestia is 470 km and eight to nine hours via Zugdidi and the Enguri gorge. From Mestia,
    Hatsvali is eight kilometres of paved switchbacks, about twenty minutes. Tetnuldi is 15–16 km and
    takes over half an hour: part of the road is asphalt, part is gravel and gets churned up in winter.
    That is why a high-clearance car on winter tyres is the sensible choice here. Fill up in Mestia, since
    there is no fuel at either base. In poor weather an organised transfer from town is the easier option.
ru:
  name: Хацвали и Тетнулди
  short: Две горнолыжные зоны Местиа — Хацвали с лесными трассами и Тетнулди, где подъёмники уходят выше
    3000 метров.
  body: >-
    В Верхней Сванетии две горнолыжные зоны, и они скорее дополняют друг друга, чем конкурируют. Хацвали
    находится в восьми километрах от Местиа, стартует примерно с 1870 метров и известен трассами, прорубленными
    в лесу: короткими, закрытыми от ветра и удобными для среднего уровня. Его гондола работает и летом,
    и многие поднимаются на неё в июле-августе исключительно ради вида.


    Тетнулди расположен в 15–16 километрах от Местиа, он выше и заметно серьёзнее. Система подъёмников
    поднимает лыжников выше трёх тысяч метров, откуда открываются широкие безлесные склоны. Это одна из
    самых высоких обслуживаемых подъёмниками точек Грузии, а панорама на Шхару, Ушбу и сам Тетнулди оправдывает
    билет сама по себе.


    Практические различия:


    - **Хацвали** — короткий подъезд, лесные трассы, меньше ветра, скромный перепад

    - **Тетнулди** — длинная и частично разбитая дорога, альпийская зона, большой спуск

    - **Обе зоны** работают короткий сезон и по инфраструктуре проще Гудаури


    Прокат снаряжения есть на обеих базах, но выбор ограничен: свои ботинки лучше привезти. Из центра
    Местиа к обеим зонам ходят регулярные трансферы, и многие предпочитают их собственной машине.
  tip: >-
    Сезон длится примерно с конца декабря до конца марта, но качество снега сильно меняется от года к
    году — уточняйте условия заранее. На обеих базах есть небольшое кафе, банкомата нет: наличные лари
    обязательны. На Тетнулди холоднее и ветренее, нужны маска и тёплые перчатки. Парковка у баз бесплатная
    и редко бывает переполнена. Зимняя резина в сезон обязательна, а цепи стоит возить с собой, особенно
    для верхней части дороги на Тетнулди.
  route: >-
    От Тбилиси до Местиа 470 км и восемь-девять часов через Зугдиди и Ингурское ущелье. От Местиа до Хацвали
    восемь километров асфальтового серпантина, около двадцати минут. До Тетнулди 15–16 км и больше получаса:
    часть дороги асфальт, часть — грунт, который зимой разбивают колёса. Поэтому здесь разумен автомобиль
    с высоким клиренсом на зимней резине. Заправляйтесь в Местиа, на базах топлива нет. В плохую погоду
    организованный трансфер из посёлка — более простой вариант.
fa:
  name: پیست‌های اسکی هاتسوالی و تتنولدی
  short: دو منطقهٔ اسکی مستیا — هاتسوالی با مسیرهای جنگلی پناه‌دار، و تتنولدی، جایی که تله‌سیژها از 3,000
    متر می‌گذرند.
  body: >-
    سوانتی علیا دو منطقهٔ اسکی دارد و این دو بیشتر مکمل یکدیگرند تا رقیب. هاتسوالی هشت کیلومتر با مستیا
    فاصله دارد، از حدود 1,870 متر آغاز می‌شود و شناسنامه‌اش مسیرهایی است که در دل جنگل بریده شده‌اند:
    کوتاه، پناه‌گرفته از باد و راحت برای اسکی‌بازان متوسط. گندولای آن در تابستان هم کار می‌کند و بسیاری
    از بازدیدکنندگان در ژوئیه و اوت تنها به‌خاطر منظره سوارش می‌شوند.


    تتنولدی 15–16 کیلومتر از مستیا دور است، بلندتر و به‌مراتب جدی‌تر. سامانهٔ تله‌سیژ آن اسکی‌بازان را
    به بالای سه هزار متر می‌برد و به دامنه‌های پهن و بی‌درخت می‌رساند. این یکی از بلندترین نقاط گرجستان
    است که تله‌سیژ به آن سرویس می‌دهد، و پانورامای شخارا، اوشبا و خود تتنولدی به‌تنهایی بهای بلیت را توجیه
    می‌کند.


    تفاوت‌های عملی:


    - **هاتسوالی** — جادهٔ دسترسی کوتاه، مسیرهای جنگلی، باد کمتر، اختلاف ارتفاع متوسط

    - **تتنولدی** — دسترسی طولانی‌تر و تا حدی ناهموار، زمین آلپی، فرودی بسیار بزرگ‌تر

    - **هر دو منطقه** فصلی کوتاه دارند و زیرساختشان ساده‌تر از گودائوری است


    اجارهٔ تجهیزات در هر دو پایگاه هست، اما تنوع محدود است، پس اگر پوتین اسکی دارید خودتان بیاورید. از
    مرکز مستیا به هر دو منطقه ترانسفر منظم می‌رود و بسیاری آن را به رانندگی ترجیح می‌دهند. هیچ‌کدام از
    این دو پیست صف‌ها و زندگی شبانهٔ پیست‌های بزرگ‌تر گرجستان را ندارند و بخش بزرگی از جذابیت اینجا در
    همین است.
  tip: >-
    فصل تقریباً از اواخر دسامبر تا اواخر مارس ادامه دارد، هرچند کیفیت برف سال به سال بسیار فرق می‌کند،
    پس پیش از تصمیم قطعی شرایط را بررسی کنید. هر دو پایگاه کافهٔ کوچکی دارند اما خودپرداز ندارند: پول
    نقد به لاری همراه داشته باشید. تتنولدی سردتر و بادخیزتر است، پس ماسک صورت و دستکش گرم واقعاً لازم‌اند.
    پارکینگ هر دو پایگاه رایگان است و به‌ندرت پر می‌شود. لاستیک زمستانی در فصل الزامی است و بهتر است زنجیر
    چرخ در ماشین باشد، به‌ویژه برای بخش بالایی جادهٔ تتنولدی.
  route: >-
    از تفلیس تا مستیا 470 کیلومتر و هشت تا نه ساعت راه است، از راه زوگدیدی و تنگهٔ انگوری. از مستیا، هاتسوالی
    هشت کیلومتر سرپیچ آسفالت است، حدود بیست دقیقه. تتنولدی 15–16 کیلومتر فاصله دارد و بیش از نیم ساعت
    طول می‌کشد: بخشی از جاده آسفالت است و بخشی شنی که زمستان‌ها زیر و رو می‌شود. به همین دلیل ماشینی با
    ارتفاع کف بالا و لاستیک زمستانی اینجا انتخاب معقولی است. در مستیا سوخت‌گیری کنید، چون در هیچ‌کدام
    از دو پایگاه پمپ‌بنزین نیست. در هوای بد، ترانسفر سازمان‌یافته از شهر گزینهٔ ساده‌تری است.
he:
  name: אתרי הסקי הצוואלי וטטנולדי
  short: שני אזורי הסקי של מסטיה — הצוואלי עם מסלולי יער מוגנים, וטטנולדי, שבו המעליות חוצות 3,000 מטר.
  body: >-
    לסוואנטי העילית שני אתרי סקי, והם משלימים זה את זה יותר משהם מתחרים. הצוואלי שוכן שמונה קילומטרים
    ממסטיה, מתחיל בגובה כ-1,870 מטר ומאופיין במסלולים שנחצבו בתוך היער: קצרים, מוגנים מרוח ונוחים לגולשים
    ברמה בינונית. הגונדולה שלו פועלת גם בקיץ, ולא מעט מבקרים עולים בה ביולי ובאוגוסט אך ורק בשביל הנוף.


    טטנולדי נמצא 15–16 קילומטרים ממסטיה, גבוה יותר ורציני בהרבה. מערכת המעליות שלו מעלה את הגולשים אל
    מעל שלושת אלפים מטר, ומשם נפתחים מדרונות רחבים וחשופים מעצים. זו אחת הנקודות הגבוהות בגאורגיה שמעליות
    מגיעות אליהן, והפנורמה על שחרה, אושבה וטטנולדי עצמו מצדיקה את הכרטיס בפני עצמה.


    ההבדלים המעשיים:


    - **הצוואלי** — דרך גישה קצרה, מסלולי יער, פחות רוח, מפל גובה צנוע

    - **טטנולדי** — גישה ארוכה וחלקה מחוספסת, שטח אלפיני, ירידה גדולה בהרבה

    - **שני האתרים** פועלים עונה קצרה והתשתית בהם פשוטה מזו של גודאורי


    השכרת ציוד קיימת בשתי התחנות, אך המבחר מוגבל, ולכן כדאי להביא נעליים משלכם אם יש לכם. ממרכז מסטיה
    יוצאות הסעות סדירות אל כל אחד מן האזורים, ורבים מעדיפים אותן על נסיעה עצמאית. באף אחד מן האתרים אין
    את התורים או את חיי הלילה של אתרי הסקי הגדולים בגאורגיה, וזה חלק גדול מן הקסם כאן.
  tip: >-
    העונה נמשכת בערך מסוף דצמבר עד סוף מרץ, אך איכות השלג משתנה מאוד משנה לשנה, לכן בדקו את התנאים לפני
    שאתם מתחייבים. בשתי התחנות יש בית קפה קטן אך אין כספומט: החזיקו מזומן בלארי. טטנולדי קר ורוחני יותר,
    ולכן מסכת פנים וכפפות חמות באמת נחוצות שם. החניה בכל תחנה חינם ולעיתים רחוקות מתמלאת. צמיגי חורף הם
    חובה בעונה וכדאי להחזיק שרשראות ברכב, במיוחד עבור החלק העליון של הדרך לטטנולדי.
  route: >-
    מטביליסי למסטיה 470 ק״מ ושמונה עד תשע שעות נסיעה דרך זוגדידי וערוץ אנגורי. ממסטיה, הצוואלי הוא שמונה
    קילומטרים של סרפנטינות סלולות, כעשרים דקות נסיעה. טטנולדי נמצא 15–16 ק״מ ולוקח יותר מחצי שעה: חלק
    מן הדרך אספלט וחלק חצץ שנחרש ומתקלקל בחורף. לכן רכב עם גובה גחון על צמיגי חורף הוא הבחירה ההגיונית
    כאן. מלאו דלק במסטיה, שכן אין תדלוק באף אחת מן התחנות. במזג אוויר גרוע הסעה מאורגנת מן העיירה היא
    האפשרות הפשוטה יותר.
ar:
  name: منطقتا التزلج هاتسفالي وتيتنولدي
  short: منطقتا التزلج في ميستيا — هاتسفالي بمساراتها الحرجية المحمية، وتيتنولدي حيث تتجاوز المصاعد 3,000
    متر.
  body: >-
    في سفانيتي العليا منطقتا تزلج، وهما تتكاملان أكثر مما تتنافسان. تقع هاتسفالي على بعد ثمانية كيلومترات
    من ميستيا، وتبدأ عند نحو 1,870 متراً، وتتحدد ملامحها بمسارات شُقّت في الغابة: قصيرة ومحمية من الريح
    ومريحة للمتزلجين المتوسطين. ويعمل تلفريكها في الصيف أيضاً، ويركبه كثير من الزوار في يوليو وأغسطس من
    أجل المنظر وحده.


    أما تيتنولدي فتبعد 15–16 كيلومتراً عن ميستيا، وهي أعلى وأكثر جدية بكثير. تحمل منظومة مصاعدها المتزلجين
    إلى ما فوق ثلاثة آلاف متر، لتنفتح على منحدرات واسعة خالية من الأشجار. وهذه من أعلى النقاط التي تخدمها
    المصاعد في جورجيا، وبانوراما شخارا وأوشبا وتيتنولدي نفسها تبرر ثمن التذكرة وحدها.


    الفروق العملية:


    - **هاتسفالي** — طريق وصول قصير، مسارات حرجية، رياح أقل، فارق ارتفاع متواضع

    - **تيتنولدي** — وصول أطول ووعر جزئياً، تضاريس ألبية، هبوط أكبر بكثير

    - **المنطقتان معاً** موسمهما قصير وبنيتهما التحتية أبسط من غوداوري


    ويتوفر تأجير المعدات في القاعدتين، لكن التشكيلة محدودة، فأحضر حذاءك معك إن كان لديك. وتسير حافلات
    نقل منتظمة من وسط ميستيا إلى كل منطقة، ويفضلها كثيرون على القيادة بأنفسهم. ولا يوجد في أي من المنتجعين
    طوابير المنتجعات الجورجية الكبرى ولا حياتها الليلية، وهذا جزء كبير من جاذبية المكان هنا.
  tip: >-
    يمتد الموسم تقريباً من أواخر ديسمبر إلى أواخر مارس، غير أن جودة الثلج تتفاوت بحدة من سنة إلى أخرى،
    فتحقق من الأحوال قبل أن تحسم أمرك. وفي القاعدتين مقهى صغير لكن لا صراف آلي: احمل نقداً باللاري. وتيتنولدي
    أبرد وأكثر رياحاً، فقناع الوجه والقفازات الدافئة ضرورة فعلية هناك. ووقوف السيارات في كل قاعدة مجاني
    ونادراً ما يمتلئ. وإطارات الشتاء إلزامية في الموسم ويستحسن وجود السلاسل في السيارة، خصوصاً للجزء العلوي
    من طريق تيتنولدي.
  route: >-
    من تبليسي إلى ميستيا 470 كم وثماني إلى تسع ساعات عبر زوغديدي ومضيق إنغوري. ومن ميستيا، هاتسفالي على
    بعد ثمانية كيلومترات من المنعطفات المعبّدة، أي نحو عشرين دقيقة. أما تيتنولدي فتبعد 15–16 كم وتستغرق
    أكثر من نصف ساعة: جزء من الطريق إسفلت وجزء حصى يتفكك ويسوء في الشتاء. ولهذا فسيارة بخلوص أرضي عالٍ
    على إطارات شتوية هي الخيار المعقول هنا. املأ الخزان في ميستيا، إذ لا وقود في أي من القاعدتين. وفي
    الطقس السيئ يبقى النقل المنظَّم من البلدة الخيار الأسهل.
