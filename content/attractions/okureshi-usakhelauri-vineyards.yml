ka:
  name: ოყურეში და უსახელოურის ვენახები
  short: >-
    ლეჩხუმური სოფელი ხვამლის კალთაზე, სადაც რამდენიმე ციცაბო ფერდობზე საქართველოს ერთ-ერთი უიშვიათესი
    წითელი ჯიში, უსახელოური, ხარობს.
  body: >-
    **საქართველოს ერთ-ერთ უიშვიათეს წითელ ღვინოს ნამდვილი სახელი არც კი დაურქმევიათ: უსახელოური „უსახელოს“
    ნიშნავს, ანუ ისეთს, რისთვისაც სიტყვა არ გყოფნის.**


    ეს ვაზი ლეჩხუმის რამდენიმე ციცაბო ფერდობზე ხარობს, უმთავრესად სამი სოფლის — ოყურეშის, ზუბისა და ისუნდერის
    — ირგვლივ. სამივე ერთად წელიწადში სულ სამიოდე ტონა ყურძენს იძლევა. ჯიშის სრული სახელი — ოყურეშის უსახელოური
    — სწორედ ამ სოფელს უკავშირდება. ღვინო წითელია, ბუნებრივად ნახევრად ტკბილი, და ყოველთვის ცოტა დგება.


    თავად ოყურეში წყნარი სოფელია: მისი სახლები და ვენახები ხვამლის ჩრდილო-დასავლეთ კალთაზე, ცხენისწყლის
    მარცხენა მხარესაა მიმოფანტული. 2014 წლის აღწერით აქ 387 მოსახლე ცხოვრობდა, 2002 წელს კი — 633.


    მთა სოფლის მეორე მემკვიდრეობაა. ხვამლი 2002 მეტრს აღწევს: თხემი ბრტყელი აქვს, ირგვლივ კირქვის კლდეები
    ზღუდავს, მის მღვიმეებს კი ძველი ამბები ახლავს. XIV საუკუნის „ასწლოვანი მატიანე“ მოგვითხრობს, რომ 1259
    წელს, როცა საქართველო ორ მეფეს შორის გაიყო, სამეფო განძის დიდი ნაწილი ხვამლის მღვიმეში დარჩა. 1840-იან
    წლებში თავადმა დადიანმა მისი ძებნა სცადა და ვერაფერი იპოვა. ხალხური გადმოცემა უფრო შორს მიდის და ამავე
    კლდეზე ამირანს აჯაჭვავს.


    აქ არაფერია სტუმრისთვის დადგმული: არც დეგუსტაციის დარბაზია, არც ბილეთი — მხოლოდ საოჯახო მარნები და
    პატარა ნაკვეთები, მოუსავლიანი წლის შემდეგ კი გასაყიდი შეიძლება არაფერი დარჩეს. შემოდგომით ჩამოდით,
    ვიზიტი წინასწარ შეათანხმეთ და, ვინ იცის, ისეთ ღვინოს დაგისხამენ, რომელსაც სახელი არ აქვს — და არც
    სჭირდება.
  tip: >-
    ოყურეშში მარანი სტუმარს ღია კარით არ ელოდება, ამიტომ ვიზიტი გზაზე გამოსვლამდე შეათანხმეთ: სთხოვეთ
    ცაგერელ მასპინძელს ან ლეჩხუმელ ღვინის გიდს, რომელიმე ოჯახს დაურეკოს. უსახელოური ძალიან ცოტა დგება
    და მოუსავლიან წელს გასაყიდი შეიძლება არც დარჩეს; თუ ბოთლს შემოგთავაზებენ, იაფი არ იქნება. პირველ ჭიქამდე
    გადაწყვიტეთ, ვინ დაჯდება საჭესთან — ნასვამ მძღოლს საქართველოში მკაცრად სჯიან. ნაღდი ფული იქონიეთ.
    საუკეთესო დრო შემოდგომაა, რთველის ხანა. ხვამლის პლატოსკენ ამავალი გზები ციცაბო და დაზიანებულია: ისინი
    ადგილობრივ მძღოლებს დაუტოვეთ, ან ფეხით იარეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით ქუთაისამდე, შემდეგ შ15-ით ჩრდილოეთით, წყალტუბოს გავლით,
    ცაგერის მიმართულებით. გზა ხვამლის ძირს მიუყვება და ოყურეშს შუაზე კვეთს — ქუთაისიდან დაახლოებით 55
    კილომეტრში; ცაგერი აქედან კიდევ 18 კილომეტრზეა. სულ დაახლოებით 275 კმ და ოთხნახევარი საათია. გზა ბოლომდე
    ასფალტიანია, წყალტუბოს შემდეგ ვიწრო და კლაკნილი, და ეკონომკლასის მანქანა სავსებით საკმარისია. საწვავი
    ქუთაისში ან წყალტუბოში ჩაასხით: სოფელში ბენზინგასამართი არ არის. ქულბაქის ტბა დაახლოებით 14 კილომეტრშია,
    ჩრდილოეთით, ჯონოულას ხეობის სიღრმეში. ტვიშამდე ასფალტით, ცაგერისა და ალპანის გავლით, დაახლოებით 55
    კილომეტრია; ხვამლის კალთაზე გადასასვლელი უფრო მოკლე გზა მხოლოდ მაღალი გამავლობის მანქანებისთვისაა.
en:
  name: Okureshi and the Usakhelouri Vineyards
  short: >-
    A Lechkhumi village on the flank of Mount Khvamli, where Usakhelouri, one of Georgia's rarest red
    grapes, grows on a handful of steep slopes.
  body: >-
    **One of Georgia's rarest red wines never received a proper name: usakhelouri means 'nameless', and
    those who drink it take that to mean beyond words.**


    The grape, also spelt Usakhelauri, grows on a few steep slopes in Lechkhumi, chiefly around three
    villages: Okureshi, Zubi and Isunderi. Together they yield only about three tonnes of grapes a year.
    The variety's full name, Okureshis Usakhelouri, ties it to this village. The wine is red and naturally
    semi-sweet, and there is never much of it.


    Okureshi itself is quiet: houses and vineyards scattered across the north-western flank of Mount Khvamli,
    above the left bank of the Tskhenistskali. The 2014 census counted 387 people here, down from 633
    in 2002.


    The mountain is the village's other inheritance. Khvamli rises to 2,002 metres, flat-topped and walled
    with limestone cliffs, and its caves hold old stories. The 14th-century Chronicle of a Hundred Years
    says that when Georgia was divided between two kings in 1259, most of the royal treasure stayed behind
    in a cave on Khvamli; a Prince Dadiani dug for it in the 1840s and found nothing. Folk tradition goes
    further and chains Amirani, the Georgian Prometheus, to the same rock.


    Nothing here is staged for visitors. There is no tasting room and no ticket, only family cellars and
    small plots, and after a lean harvest there may be nothing left to sell. Come in autumn, arrange a
    visit beforehand, and you may be poured a glass of something that has no name and needs none.
  tip: >-
    Okureshi has no cellar door, so arrange a visit before you set out: ask your host in Tsageri or a
    Lechkhumi wine guide to call one of the families. Usakhelouri is made in tiny quantities, and a lean
    year may leave nothing to sell; if a bottle is offered, it will not be cheap. Decide who drives before
    the first glass, because Georgia is strict about drink-driving. Carry cash. Autumn, the harvest season,
    is the best time to come. The tracks climbing higher towards the Khvamli plateau are steep and broken:
    leave them to local drivers, or walk.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh15 north through Tskaltubo towards Tsageri.
    The road runs along the foot of Khvamli and straight through Okureshi, about 55 km after Kutaisi;
    Tsageri is another 18 km on. In all it is about 275 km and four and a half hours. It is asphalt all
    the way, narrow and winding after Tskaltubo, and an economy car is enough. Fill up in Kutaisi or Tskaltubo,
    as there is no fuel in the village. Kulbaki Lake is about 14 km away, up the Jonoula valley to the
    north. Tvishi is about 55 km away on asphalt via Tsageri and Alpana; the shorter track over the shoulder
    of Khvamli is for high-clearance vehicles only.
ru:
  name: Окуреши и виноградники Усахелоури
  short: >-
    Лечхумское село на склоне горы Хвамли, где на нескольких крутых участках растёт усахелоури — один
    из редчайших красных сортов винограда Грузии.
  body: >-
    **Одно из самых редких красных вин Грузии так и не получило настоящего имени: «усахелоури» значит
    «безымянный», а те, кто его пьёт, понимают это как «невыразимый словами».**


    Сорт, который пишут и как Усахелаури, растёт на нескольких крутых склонах Лечхуми, главным образом
    вокруг трёх сёл: Окуреши, Зуби и Исундери. Вместе они дают лишь около трёх тонн винограда в год. Полное
    название сорта — Окурешис Усахелоури — привязывает его к этому селу. Вино красное, естественно полусладкое,
    и его всегда мало.


    Само Окуреши — тихое село: дома и виноградники рассыпаны по северо-западному склону горы Хвамли над
    левым берегом Цхенисцкали. Перепись 2014 года насчитала здесь 387 жителей — против 633 в 2002-м.


    Гора — второе наследство села. Хвамли поднимается до 2002 метров, у неё плоская вершина и стены известняковых
    обрывов, а в её пещерах живут старые истории. «Столетняя хроника» XIV века рассказывает, что, когда
    в 1259 году Грузия разделилась между двумя царями, большая часть царской казны осталась в пещере на
    Хвамли; в 1840-х годах некий князь Дадиани копал в поисках клада и ничего не нашёл. Народное предание
    идёт дальше и приковывает к той же скале Амирани, грузинского Прометея.


    Здесь ничего не устроено напоказ. Нет ни дегустационного зала, ни билетов — только семейные марани
    и небольшие участки, а после скудного урожая продавать может быть нечего. Приезжайте осенью, договоритесь
    о визите заранее — и, возможно, вам нальют бокал того, у чего нет имени и чему оно не нужно.
  tip: >-
    В Окуреши нет винодельни, открытой для гостей, поэтому договоритесь о визите до выезда: попросите
    хозяев гостевого дома в Цагери или гида по винам Лечхуми позвонить одной из семей. Усахелоури делают
    в крошечных объёмах, и в неурожайный год продавать может быть нечего; если бутылку всё же предложат,
    дешёвой она не будет. Решите, кто сядет за руль, до первого бокала: в Грузии строго относятся к вождению
    в нетрезвом виде. Возьмите наличные. Лучшее время — осень, сезон сбора урожая. Дороги, которые уходят
    выше, к плато Хвамли, крутые и разбитые: оставьте их местным водителям или идите пешком.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh15 на север через Цхалтубо в сторону Цагери.
    Дорога идёт вдоль подножия Хвамли и проходит прямо через Окуреши, примерно в 55 км за Кутаиси; до
    Цагери отсюда ещё 18 км. Всего около 275 км и четыре с половиной часа. Асфальт на всём пути, после
    Цхалтубо дорога узкая и извилистая, машины эконом-класса достаточно. Заправьтесь в Кутаиси или Цхалтубо:
    в селе заправки нет. Озеро Кулбаки — примерно в 14 км к северу, вверх по долине Джоноулы. До Твиши
    около 55 км по асфальту через Цагери и Алпану; более короткая дорога через отрог Хвамли годится только
    для машин с высоким клиренсом.
fa:
  name: اوکورشی و تاکستان‌های اوساخلوری
  short: >-
    روستایی در لچخومی بر دامنهٔ کوه خواملی، جایی که اوساخلوری، یکی از کمیاب‌ترین انگورهای سرخ گرجستان،
    بر چند شیب تند می‌روید.
  body: >-
    **یکی از کمیاب‌ترین شراب‌های سرخ گرجستان هرگز نامی درست به خود ندید: «اوساخلوری» یعنی «بی‌نام»، و
    آنان که می‌نوشندش این را «وصف‌ناپذیر» معنا می‌کنند.**


    این انگور، که «اوساخلائوری» هم نوشته می‌شود، بر چند شیب تند در لچخومی می‌روید، به‌ویژه پیرامون سه
    روستا: اوکورشی، زوبی و ایسوندری. این سه روی‌هم سالانه تنها حدود سه تن انگور می‌دهند. نام کامل این
    رقم، «اوکورشیس اوساخلوری»، آن را به همین روستا پیوند می‌زند. شرابش سرخ و به‌طور طبیعی نیمه‌شیرین است
    و هیچ‌گاه فراوان نیست.


    خودِ اوکورشی آرام است: خانه‌ها و تاکستان‌هایی پراکنده بر دامنهٔ شمال‌غربی کوه خواملی، بالای کرانهٔ
    چپ تسخنیستسکالی. سرشماری ۲۰۱۴ این‌جا ۳۸۷ نفر شمرد، در برابر ۶۳۳ نفر در ۲۰۰۲.


    کوه، میراث دیگر روستاست. خواملی تا ۲٬۰۰۲ متر بالا می‌رود، با قله‌ای تخت و دیواره‌هایی از صخره‌های
    آهکی، و غارهایش داستان‌های کهن در خود دارند. «وقایع‌نامهٔ صدساله» از سدهٔ چهاردهم می‌گوید که چون گرجستان
    در ۱۲۵۹ میان دو شاه تقسیم شد، بیشتر گنجینهٔ سلطنتی در غاری در خواملی بر جای ماند؛ یکی از شاهزادگان
    دادیانی در دههٔ ۱۸۴۰ در پی آن کندوکاو کرد و چیزی نیافت. سنت عامیانه از این هم فراتر می‌رود و آمیرانی،
    پرومتهٔ گرجی، را به همین صخره به زنجیر می‌کشد.


    این‌جا هیچ چیز برای گردشگران صحنه‌آرایی نشده است. نه تالار چشیدن شراب هست و نه بلیتی؛ تنها سرداب‌های
    خانوادگی و قطعه‌زمین‌های کوچک، و پس از برداشتی کم‌بار شاید چیزی برای فروش نمانده باشد. پاییز بیایید،
    از پیش دیدار را هماهنگ کنید، و شاید جامی برایتان بریزند از چیزی که نامی ندارد و نیازی هم به نام ندارد.
  tip: >-
    اوکورشی شراب‌سازی‌ای با درِ باز به روی بازدیدکنندگان ندارد، پس پیش از راه افتادن دیدار را هماهنگ کنید:
    از میزبانتان در تساگری یا یک راهنمای شراب لچخومی بخواهید با یکی از خانواده‌ها تماس بگیرد. اوساخلوری
    در مقادیر بسیار اندک ساخته می‌شود و سالی کم‌محصول ممکن است چیزی برای فروش باقی نگذارد؛ اگر بطری‌ای
    پیشنهاد شد، ارزان نخواهد بود. پیش از نخستین جام تصمیم بگیرید چه کسی رانندگی می‌کند، چون گرجستان دربارهٔ
    رانندگی پس از نوشیدن الکل سخت‌گیر است. پول نقد همراه داشته باشید. پاییز، فصل برداشت، بهترین زمان آمدن
    است. راه‌هایی که بالاتر به سوی فلات خواملی می‌روند پرشیب و خراب‌اند: آن‌ها را به رانندگان محلی بسپارید
    یا پیاده بروید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب تا کوتائیسی بروید، سپس Sh15 را به سوی شمال، از راه تسخالتوبو،
    به سمت تساگری بگیرید. جاده در دامنهٔ خواملی پیش می‌رود و درست از میان اوکورشی می‌گذرد، حدود ۵۵ کیلومتر
    پس از کوتائیسی؛ تساگری ۱۸ کیلومتر جلوتر است. روی‌هم حدود ۲۷۵ کیلومتر و چهار ساعت و نیم. سراسر راه
    آسفالت است، پس از تسخالتوبو باریک و پرپیچ، و خودروی اقتصادی کافی است. در کوتائیسی یا تسخالتوبو باک
    را پر کنید، چون در روستا پمپ‌بنزین نیست. دریاچهٔ کولباکی حدود ۱۴ کیلومتر دورتر است، در شمال و در بالادست
    درهٔ جونولا. تویشی از راه آسفالته و از مسیر تساگری و آلپانا حدود ۵۵ کیلومتر فاصله دارد؛ راه کوتاه‌تری
    که از شانهٔ خواملی می‌گذرد تنها برای خودروهای شاسی‌بلند مناسب است.
he:
  name: אוקורשי וכרמי האוסחלורי
  short: >-
    כפר בלצ'חומי על מורדות הר חוואמלי, שבו גדל על קומץ מדרונות תלולים האוסחלורי, אחד מזני הענבים האדומים
    הנדירים ביותר בגאורגיה.
  body: >-
    **אחד היינות האדומים הנדירים ביותר בגאורגיה מעולם לא זכה לשם של ממש: "אוסחלורי" פירושו "חסר שם", ואלה
    ששותים אותו מפרשים זאת כ"מעבר למילים".**


    הזן, שנכתב גם אוסחלאורי, גדל על מדרונות תלולים ספורים בלצ'חומי, בעיקר סביב שלושה כפרים: אוקורשי, זובי
    ואיסונדרי. יחד הם מניבים רק כשלוש טונות ענבים בשנה. שמו המלא של הזן, אוקורשיס אוסחלורי, קושר אותו
    לכפר הזה. היין אדום וחצי-מתוק באופן טבעי, ותמיד יש ממנו מעט.


    אוקורשי עצמה שקטה: בתים וכרמים פזורים על המורד הצפון-מערבי של הר חוואמלי, מעל הגדה השמאלית של הצחניסצקאלי.
    מפקד 2014 מנה כאן 387 תושבים, לעומת 633 ב-2002.


    ההר הוא הירושה האחרת של הכפר. חוואמלי מתנשא לגובה 2,002 מטר, שטוח פסגה ומוקף מצוקי גיר, ובמערותיו
    שמורים סיפורים עתיקים. "כרוניקת מאה השנים" מן המאה ה-14 מספרת שכאשר חולקה גאורגיה ב-1259 בין שני מלכים,
    רוב אוצר המלוכה נשאר במערה בחוואמלי; נסיך מבית דדיאני חפר אחריו בשנות ה-40 של המאה ה-19 ולא מצא דבר.
    המסורת העממית מרחיקה לכת עוד יותר וכובלת לאותו סלע את אמירני, הפרומתאוס הגאורגי.


    שום דבר כאן אינו מבוים למבקרים. אין חדר טעימות ואין כרטיס, רק מרתפים משפחתיים וחלקות קטנות, ואחרי
    בציר דל ייתכן שלא יישאר מה למכור. בואו בסתיו, תאמו ביקור מראש, ואולי ימזגו לכם כוס ממשהו שאין לו שם
    ואינו זקוק לשם.
  tip: >-
    באוקורשי אין יקב הפתוח למבקרים, לכן תאמו ביקור לפני שאתם יוצאים לדרך: בקשו מהמארחים שלכם בצאגרי או
    ממדריך יין בלצ'חומי להתקשר לאחת המשפחות. אוסחלורי מיוצר בכמויות זעירות, ושנה דלה עלולה לא להשאיר דבר
    למכירה; אם יציעו לכם בקבוק, הוא לא יהיה זול. החליטו מי נוהג לפני הכוס הראשונה, כי גאורגיה מחמירה בנהיגה
    תחת השפעת אלכוהול. הביאו מזומן. הסתיו, עונת הבציר, הוא הזמן הטוב ביותר להגיע. הדרכים המטפסות גבוה
    יותר לעבר רמת חוואמלי תלולות ומשובשות: השאירו אותן לנהגים מקומיים, או לכו ברגל.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד קותאיסי, ומשם בכביש Sh15 צפונה דרך צחלטובו לכיוון צאגרי. הכביש
    עובר לרגלי חוואמלי וחוצה את אוקורשי, כ-55 ק״מ אחרי קותאיסי; צאגרי נמצאת 18 ק״מ הלאה. בסך הכול כ-275
    ק״מ וארבע שעות וחצי. הכביש סלול לכל אורכו, צר ומפותל אחרי צחלטובו, ורכב אקונומי מספיק. תדלקו בקותאיסי
    או בצחלטובו, כי בכפר אין דלק. אגם קולבקי נמצא כ-14 ק״מ מכאן, צפונה במעלה עמק הג'ונואולה. תווישי מרוחקת
    כ-55 ק״מ בכביש סלול דרך צאגרי ואלפאנה; הדרך הקצרה יותר, מעל כתפו של חוואמלי, מתאימה רק לרכבים בעלי
    מרווח גחון גבוה.
ar:
  name: أوكوريشي وكروم أوساخيلوري
  short: >-
    قرية في ليتشخومي على سفح جبل خفاملي، حيث ينمو أوساخيلوري، أحد أندر أصناف العنب الأحمر في جورجيا، على
    حفنة من المنحدرات الشديدة.
  body: >-
    **واحد من أندر أنواع النبيذ الأحمر في جورجيا لم يُمنح قطّ اسماً حقيقياً: فـ«أوساخيلوري» تعني «بلا
    اسم»، ومن يشربونه يفهمونها على أنها «فوق الوصف».**


    ينمو هذا العنب، الذي يُكتب أيضاً أوساخيلاوري، على بضعة منحدرات شديدة في ليتشخومي، ولا سيما حول ثلاث
    قرى: أوكوريشي وزوبي وإيسونديري. ولا تنتج القرى الثلاث مجتمعةً سوى نحو ثلاثة أطنان من العنب في السنة.
    واسم الصنف الكامل، أوكوريشيس أوساخيلوري، يربطه بهذه القرية. نبيذه أحمر نصف حلو بطبيعته، ولا يكون منه
    الكثير أبداً.


    أما أوكوريشي نفسها فهادئة: بيوت وكروم متناثرة على السفح الشمالي الغربي لجبل خفاملي، فوق الضفة اليسرى
    لنهر تسخينيستسكالي. أحصى تعداد 2014 هنا 387 نسمة، مقابل 633 في 2002.


    والجبل هو الإرث الآخر للقرية. يرتفع خفاملي إلى 2,002 متر، مسطّح القمة تحيط به جروف كلسية، وفي كهوفه
    حكايات قديمة. تروي «حولية المئة عام» من القرن الرابع عشر أنه حين انقسمت جورجيا بين ملكين عام 1259،
    بقي معظم الكنز الملكي في كهف على خفاملي؛ وقد حفر أحد أمراء آل دادياني بحثاً عنه في أربعينيات القرن
    التاسع عشر فلم يجد شيئاً. ويذهب الموروث الشعبي أبعد من ذلك، فيقيّد أميراني، بروميثيوس الجورجي، بالصخرة
    ذاتها.


    لا شيء هنا مُعدّ للاستعراض أمام الزوار. لا قاعة تذوّق ولا تذاكر، بل أقبية عائلية وقطع أرض صغيرة، وبعد
    موسم شحيح قد لا يبقى شيء للبيع. تعالَ في الخريف، ورتّب زيارتك مسبقاً، فلعلّهم يصبّون لك كأساً من شيء
    لا اسم له ولا حاجة له إلى اسم.
  tip: >-
    لا توجد في أوكوريشي معصرة مفتوحة للزوار، فرتّب زيارتك قبل الانطلاق: اطلب من مضيفك في تساغيري أو من
    مرشد نبيذ في ليتشخومي أن يتصل بإحدى العائلات. يُصنع أوساخيلوري بكميات ضئيلة، وقد لا تترك سنة شحيحة
    شيئاً للبيع؛ وإن عُرضت عليك زجاجة فلن تكون رخيصة. حدّد من سيقود قبل الكأس الأولى، فجورجيا صارمة في
    مسألة القيادة تحت تأثير الكحول. احمل نقداً. الخريف، موسم القطاف، أفضل وقت للمجيء. أما الدروب الصاعدة
    إلى هضبة خفاملي فشديدة الانحدار ومتكسّرة: اتركها للسائقين المحليين، أو امشِ.
  route: >-
    من تبليسي اسلك S1 (E60) غرباً حتى كوتايسي، ثم Sh15 شمالاً عبر تسخالتوبو نحو تساغيري. يمرّ الطريق عند
    سفح خفاملي ويخترق أوكوريشي مباشرة، على بعد نحو 55 كم بعد كوتايسي؛ وتساغيري أبعد منها بـ18 كم. المجموع
    نحو 275 كم وأربع ساعات ونصف. الطريق مسفلت على طوله، ضيق ومتعرج بعد تسخالتوبو، والسيارة الاقتصادية
    كافية. املأ الخزان في كوتايسي أو تسخالتوبو، إذ لا وقود في القرية. وتقع بحيرة كولباكي على بعد نحو 14
    كم شمالاً، في أعلى وادي جونولا. أما تفيشي فعلى بعد نحو 55 كم على طريق مسفلت عبر تساغيري وألبانا؛ والدرب
    الأقصر فوق كتف خفاملي لا يصلح إلا للمركبات ذات الخلوص الأرضي العالي.
