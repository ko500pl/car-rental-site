ka:
  name: ჯუმათის მონასტერი
  short: >-
    მთავარანგელოზთა მონასტერი სუფსის ხეობის თავზე: მისი ბიზანტიური მინანქრები ნიუ-იორკსა და პეტერბურგშია,
    ჰორიზონტი კი ისევ აქაა.
  body: >-
    **1873 წელს დიმიტრი ბაქრაძემ ჯუმათის მწვერვალზე ორი დღე გაატარა და შემდეგ დაწერა: „არსად მთელ კავკასიაში
    არ შემიძლია დაგისახელოთ ისეთი ფართო ჰორიზონტი, როგორსაც აქედან ვჭვრეტდი“.**


    მიქაელ და გაბრიელ მთავარანგელოზთა მონასტერი გურიის ქედის ერთ-ერთ თხემზე, ზღვის დონიდან დაახლოებით
    490 მეტრზე დგას, სუფსის ხეობისა და სოფელ ძირიჯუმათის თავზე, ოზურგეთიდან 14 კილომეტრში. გალავნიდან
    თვალი კოლხეთის დაბლობს გადაჰყვება პალიასტომის ტბამდე და აჭარის სანაპირომდე, მოწმენდილ დღეს კი — კავკასიონის
    თოვლიან ქედამდე. XV–XIX საუკუნეებში აქ ჯუმათელი ეპისკოპოსი იჯდა, ვახუშტის სიტყვით, „მწყემსი სუფსეის
    მდინარისა და რიონს შორისის ადგილთა“. ლეგენდა კი უფრო შორეულ დასაბამს ჰყვება: როცა პალიასტომის წყალმა
    ირგვლივ მიწა შთანთქა, მხოლოდ ერთი დიაკვანი, გვარად დარჩია, გადარჩა; მან მთავარანგელოზის ხატი ამ მთაზე
    აიტანა და მას აქ ეკლესია აუშენეს.


    ჯუმათის სახელმა მის ხედზე ბევრად შორს გაიარა. მთავარანგელოზთა ორი ვერცხლის ხატი ოქროს ტიხრული მინანქრის
    მედალიონებით იყო შემკული — დაახლოებით 1100 წლის ნამუშევრით, სავარაუდოდ კონსტანტინოპოლის საიმპერატორო
    სახელოსნოდან. 1881 წელს თბილისელმა ფოტოგრაფმა საბინ-გუსმა მათი „რესტავრაციისთვის“ წაღების ნებართვა
    მიიღო. ხატები აღარ დაბრუნებულა, მედალიონები კი რუს კოლექციონერებს მიჰყიდეს. ცხრა მათგანი დღეს ნიუ-იორკში,
    მეტროპოლიტენ-მუზეუმშია, სხვები — პეტერბურგის ერმიტაჟსა და რუსეთის მუზეუმში, პარიზის კლიუნის მუზეუმსა
    და თბილისში, სადაც ნაწილი 1923 წელს დაბრუნდა.


    ბორცვზე დარჩენილი უფრო უბრალოა და უფრო გულთან ახლოს: თლილი ქვიშაქვის დარბაზული ეკლესია, 1847 წელს
    რუხი პორფირით მოპირკეთებული, შიგნით კი XVI–XVIII საუკუნეების დაზიანებული მხატვრობა — ჩრდილოეთ კედლის
    თაღში მაღალი მთავარანგელოზი, ნავის ორსავე მხარეს კი, ერთმანეთის პირისპირ, გურიის მთავარი და მისი მეუღლე.
    სამონასტრო ცხოვრება აქ 1990 წლის 21 ნოემბერს აღდგა. მინანქრები ნიუ-იორკშია; ჰორიზონტი, რომელიც ბაქრაძემ
    დაინახა, ისევ აქაა.
  tip: >-
    ერთი საათი გამოყავით, მოწმენდილ ცაზე — მეტი: აქ მთავარი ხედია. მონასტერი მოქმედია, ამიტომ მოკრძალებულად
    ჩაიცვით: ქალებს თავსაფარი და კაბა სჭირდებათ, მამაკაცებს — გრძელი შარვალი. ბოლო აღმართი ციცაბოა, ასფალტი
    დაზიანებული და წვიმის შემდეგ მოლიპული; დაღმართზე დაბალი გადაცემით ჩამოდით. ბორცვზე არც კაფეა და არც
    სხვა მომსახურება — ორივე ლანჩხუთსა და ოზურგეთშია. ყველაზე შორს ხშირად წვიმის მომდევნო გრილ დილას ჩანს,
    თუმცა ხეობებში ნისლი შეიძლება ჯერ კიდევ იდგეს. ბინოკლი აქ ნამდვილად გამოგადგებათ. ჯუმათი შემოქმედთან
    ერთად ნახეთ: ორივე საგანძური 1881 წელს ერთმა და იმავე ფოტოგრაფმა დააცარიელა.
  route: >-
    თბილისიდან დაახლოებით 300 კმ-ია — გზას ოთხნახევარი საათი ან ცოტა მეტი დასჭირდება. ს1 (E60) მაგისტრალით
    ქუთაისის გავლით სამტრედიამდე მიდიხართ, იქიდან ს12-ით — ლანჩხუთამდე. ლანჩხუთიდან შ47 ადგილობრივ გზას
    სამხრეთით დაახლოებით 11 კმ მიჰყევით, შემდეგ კი დაახლოებით 9-კილომეტრიანი სოფლის გზა ძირიჯუმათის თავზე,
    მონასტრამდე აგიყვანთ. მთავარი გზები კარგი ასფალტია; ბოლო ორი-სამი კილომეტრი ვიწრო, ციცაბო და დაზიანებულია.
    მშრალ ამინდში ეკონომ-კლასის მანქანაც ავა; წვიმის შემდეგ ნელა იარეთ და დაღმართზე დაბალი გადაცემა გამოიყენეთ.
    საწვავი ლანჩხუთში შეავსეთ. ჯუმათამდე ოზურგეთიდანაც შეიძლება მისვლა — იქიდან დაახლოებით 14 კმ-ია.
en:
  name: Jumati Monastery
  short: >-
    A hilltop monastery of the Archangels above the Supsa valley. Its Byzantine enamels are in New York
    and St Petersburg; its horizon is still here.
  body: >-
    **In 1873 the historian Dimitri Bakradze spent two days on the summit at Jumati and wrote that nowhere
    in the whole Caucasus could he name a horizon so wide.**


    The monastery of the Archangels Michael and Gabriel stands at about 490 metres on a crest of the Guria
    range, above the Supsa valley and the village of Dzirijumati. From its wall the view runs across the
    Colchis lowland to Lake Paliastomi and the Adjara coast, and on clear days to the snows of the Caucasus.
    From the fifteenth to the nineteenth century it was the seat of the bishops of Jumati. Legend gives
    it an older beginning: when the waters of Paliastomi swallowed the land below, one deacon, Darchia,
    escaped with an icon of the Archangel and carried it up here, where a church was raised for it.


    Jumati's fame travelled further than its view. Its two silver icons of the Archangels were set with
    gold cloisonné enamel medallions made around 1100, most likely in the imperial workshops of Constantinople.
    In 1881 a Tbilisi photographer, Sabin-Gus, obtained permission to take them away "for restoration".
    They never came back; the medallions went to Russian collectors. Nine are now in the Metropolitan
    Museum of Art in New York; others are in the Hermitage and the Russian Museum in St Petersburg, the
    Musée de Cluny in Paris, and in Tbilisi, where some returned in 1923.


    What remains is plainer and closer to the heart: a single-nave hall church of dressed sandstone, faced
    with grey porphyry in 1847, with damaged frescoes of the sixteenth to eighteenth centuries — a tall
    archangel in a north-wall arch, and a prince of Guria and his wife facing each other across the nave.
    Monastic life returned on 21 November 1990. The enamels are in New York; the horizon Bakradze saw
    is still here.
  tip: >-
    Allow an hour, more if the sky is clear — the view is the point. The monastery is active, so dress
    modestly: a headscarf and skirt for women, long trousers for men. The final climb is steep, the asphalt
    broken and slick after rain; come down in low gear. There is no café or other facility on the hill
    — Lanchkhuti and Ozurgeti have both. The longest views often come on a fresh morning after rain, though
    mist may still lie in the valleys. Binoculars earn their place here. Pair Jumati with Shemokmedi:
    the same photographer emptied both treasuries in 1881.
  route: >-
    From Tbilisi it is about 300 km; allow four and a half hours or a little more. Take the S1 (E60) west
    past Kutaisi to Samtredia, then the S12 to Lanchkhuti. From Lanchkhuti follow the Sh47 local road
    south for about 11 km, then a village road of roughly 9 km that climbs to the monastery above Dzirijumati.
    The main roads are good asphalt; the last two or three kilometres are narrow, steep and broken. In
    dry weather an economy car manages; after rain, drive slowly and use low gear on the descent. Fill
    up in Lanchkhuti. Jumati can also be reached from Ozurgeti, about 14 km away.
ru:
  name: Монастырь Джумати
  short: >-
    Монастырь Архангелов на вершине холма над долиной Супсы. Его византийские эмали — в Нью-Йорке и Санкт-Петербурге;
    его горизонт — всё ещё здесь.
  body: >-
    **В 1873 году историк Димитрий Бакрадзе провёл два дня на вершине у Джумати и написал, что нигде на
    всём Кавказе не смог бы назвать столь широкого горизонта.**


    Монастырь Архангелов Михаила и Гавриила стоит на высоте около 490 метров на гребне Гурийского хребта,
    над долиной Супсы и селом Дзириджумати. От его стены вид простирается через Колхидскую низменность
    до озера Палиастоми и побережья Аджарии, а в ясные дни — до снегов Кавказа. С XV по XIX век здесь
    была кафедра джуматских епископов. Легенда даёт ему более древнее начало: когда воды Палиастоми поглотили
    землю внизу, один дьякон, Дарчия, спасся с иконой Архангела и вынес её сюда, где для неё возвели церковь.


    Слава Джумати ушла дальше, чем хватает глаз с его стены. Две серебряные иконы Архангелов были украшены
    золотыми медальонами перегородчатой эмали, изготовленными около 1100 года, скорее всего, в императорских
    мастерских Константинополя. В 1881 году тбилисский фотограф Сабин-Гус получил разрешение вывезти их
    «на реставрацию». Иконы так и не вернулись; медальоны попали к российским коллекционерам. Девять из
    них теперь в музее Метрополитен в Нью-Йорке; другие — в Эрмитаже и Русском музее в Санкт-Петербурге,
    в музее Клюни в Париже и в Тбилиси, куда часть вернулась в 1923 году.


    Что осталось — проще и ближе к сердцу: однонефная зальная церковь из тёсаного песчаника, облицованная
    серым порфиром в 1847 году, с повреждёнными фресками XVI–XVIII веков — высокий архангел в арке северной
    стены, и князь Гурии с супругой, обращённые друг к другу через весь неф. Монашеская жизнь вернулась
    21 ноября 1990 года. Эмали — в Нью-Йорке; горизонт, что видел Бакрадзе, — всё ещё здесь.
  tip: >-
    Отведите час, больше — если небо ясное: вид здесь главное. Монастырь действующий, оденьтесь скромно:
    женщинам платок и юбка, мужчинам длинные брюки. Финальный подъём крутой, асфальт разбит и скользит
    после дождя; спускайтесь на пониженной передаче. На холме ни кафе, ни другой инфраструктуры — и то
    и другое есть в Ланчхути и Озургети. Самые дальние виды часто открываются в свежее утро после дождя,
    хотя в долинах ещё может лежать туман. Бинокль здесь оправдывает себя. Совместите Джумати с Шемокмеди:
    тот же фотограф опустошил обе сокровищницы в 1881 году.
  route: >-
    Из Тбилиси около 300 км; дорога займёт четыре с половиной часа или немного больше. Двигайтесь по S1
    (E60) на запад через Кутаиси до Самтредиа, затем по S12 до Ланчхути. Из Ланчхути следуйте по местной
    дороге Sh47 на юг около 11 км, затем по сельской дороге длиной примерно 9 км, поднимающейся к монастырю
    над Дзириджумати. Основные дороги — хороший асфальт; последние два-три километра узкие, крутые и разбитые.
    В сухую погоду машина эконом-класса справится; после дождя езжайте медленно и на спуске используйте
    пониженную передачу. Заправьтесь в Ланчхути. В Джумати можно попасть и из Озургети — до него около
    14 км.
fa:
  name: صومعهٔ جوماتی
  short: >-
    صومعهٔ فرشتگان مقرّب بر فراز تپه‌ای بر درهٔ سوپسا. میناکاری‌های بیزانسی‌اش در نیویورک و سن‌پترزبورگ‌اند؛
    افق آن هنوز همین‌جاست.
  body: >-
    **در ۱۸۷۳ تاریخ‌نگار دیمیتری باکرادزه دو روز بر فراز جوماتی گذراند و نوشت که در سراسر قفقاز نمی‌تواند
    افقی به این پهناوری نام ببرد.**


    صومعهٔ فرشتگان مقرّب، میکائیل و جبرائیل، بر ارتفاع نزدیک ۴۹۰ متری، بر تیغه‌ای از رشتهٔ گوریا، بر فراز
    درهٔ سوپسا و روستای دزیریجوماتی، ایستاده است. از دیوارش، چشم‌انداز به‌سوی دشت کلخیس تا دریاچهٔ پالیاستومی
    و ساحل آجارا می‌رود، و در روزهای صاف تا برف‌های قفقاز. از سدهٔ پانزدهم تا نوزدهم، اینجا کرسی اسقفان
    جوماتی بود. افسانه آغازی کهن‌تر بدان می‌بخشد: آنگاه که آب‌های پالیاستومی زمین پایین را بلعیدند، دیاکونی
    به‌نام دارچیا با شمایل فرشتهٔ مقرّب گریخت و آن را بدین‌جا آورد، جایی که کلیسایی برایش برافراشتند.


    آوازهٔ جوماتی دورتر از چشم‌اندازش سفر کرد. دو شمایل نقره‌ای فرشتگان مقرّب با مدالیون‌های مینای کلوازونهٔ
    زرینی که نزدیک به سال ۱۱۰۰، به‌احتمال زیاد در کارگاه‌های شاهانهٔ قسطنطنیه، ساخته شده بودند، آراسته
    بودند. در ۱۸۸۱ عکاسی تفلیسی به‌نام سابین-گوس اجازهٔ بردن آن‌ها را «برای بازسازی» گرفت. آن‌ها هرگز
    بازنگشتند؛ مدالیون‌ها به مجموعه‌داران روسی رسیدند. نه‌تای آن‌ها اکنون در موزهٔ متروپولیتن نیویورک
    است؛ دیگران در ارمیتاژ و موزهٔ روسیهٔ سن‌پترزبورگ، موزهٔ کلونی پاریس، و در تفلیس، که بخشی از آن‌ها
    در ۱۹۲۳ به آن بازگشت.


    آنچه باقی مانده ساده‌تر و نزدیک‌تر به دل است: کلیسای تالاری تک‌شبستانی از سنگ ماسه‌ای تراش‌خورده،
    که در ۱۸۴۷ با پورفیر خاکستری روکش شد، با نگاره‌های دیواری آسیب‌دیدهٔ سده‌های شانزدهم تا هجدهم — فرشتهٔ
    مقرّبی بلندبالا در طاق دیوار شمالی، و شاهزادهٔ گوریا و همسرش رو‌به‌روی هم در دو سوی شبستان. زندگی
    راهبانه در ۲۱ نوامبر ۱۹۹۰ بازگشت. میناکاری‌ها در نیویورک‌اند؛ افقی که باکرادزه دید، هنوز همین‌جاست.
  tip: >-
    یک ساعت در نظر بگیرید، بیشتر اگر آسمان صاف باشد — چشم‌انداز اینجا هدف اصلی است. صومعه فعال است، پس
    لباس پوشیده بپوشید: زنان روسری و دامن، مردان شلوار بلند. صعود پایانی تند است، آسفالت شکسته و پس از
    باران لغزنده؛ در سرازیری با دندهٔ سنگین برانید. بر تپه نه کافه‌ای هست و نه امکانات دیگری — هر دو در
    لانچخوتی و اوزورگتی‌اند. دورترین چشم‌اندازها اغلب در صبحی تازه پس از باران فرامی‌رسند، هرچند مه هنوز
    ممکن است در دره‌ها بماند. دوربین دوچشمی اینجا به‌کارتان می‌آید. جوماتی را با شمکمدی همراه کنید: همان
    عکاس هر دو خزانه را در ۱۸۸۱ خالی کرد.
  route: >-
    از تفلیس نزدیک به ۳۰۰ کیلومتر است؛ چهار ساعت و نیم یا کمی بیشتر زمان بگیرید. از S1 (E60) به سوی غرب،
    از کوتایسی گذشته، تا سامتردیا برانید، سپس از S12 تا لانچخوتی. از لانچخوتی راه محلی Sh47 را به‌سوی
    جنوب نزدیک به ۱۱ کیلومتر دنبال کنید، سپس راهی روستایی نزدیک به ۹ کیلومتر که به صومعه بر فراز دزیریجوماتی
    بالا می‌رود. راه‌های اصلی آسفالت خوبی دارند؛ دو یا سه کیلومتر پایانی باریک، تند و شکسته‌اند. در هوای
    خشک خودرویی اقتصادی از پس آن برمی‌آید؛ پس از باران، آهسته برانید و در سرازیری از دندهٔ سنگین استفاده
    کنید. در لانچخوتی سوخت‌گیری کنید. جوماتی را از اوزورگتی نیز می‌توان رسید، نزدیک به ۱۴ کیلومتر دورتر.
he:
  name: מנזר ג'ומאטי
  short: >-
    מנזר המלאכים הראשיים על גבעה מעל עמק סופסה. האמיילים הביזנטיים שלו נמצאים בניו יורק ובסנקט פטרבורג;
    האופק שלו עדיין כאן.
  body: >-
    **ב־1873 העביר ההיסטוריון דימיטרי בקראדזה יומיים על הפסגה בג'ומאטי, וכתב שבשום מקום בכל הקווקז לא
    יכול היה למנות אופק רחב כזה.**


    מנזר המלאכים הראשיים מיכאל וגבריאל עומד בגובה כ־490 מטרים על רכס גוריה, מעל עמק סופסה והכפר דזיריג'ומאטי.
    מהחומה שלו נשקף הנוף על פני שפלת קולכיס עד אגם פליאסטומי וחוף אג'ריה, ובימים בהירים עד שלגי הקווקז.
    מהמאה החמש־עשרה עד התשע־עשרה היה זה מקום מושבם של בישופי ג'ומאטי. האגדה נותנת לו התחלה עתיקה יותר:
    כשמי פליאסטומי בלעו את הארץ שלמטה, נמלט דיאקון אחד, דארצ'יה, עם איקונת המלאך הראשי, ונשא אותה עד כאן,
    שם הוקמה כנסייה בשבילה.


    תהילת ג'ומאטי הגיעה רחוק יותר מהנוף שלו. שתי איקונות הכסף של המלאכים הראשיים היו משובצות במדליונים
    של אמייל מחיצות (קלואזונה) מזהב שנוצרו סביב 1100, קרוב לוודאי בבתי המלאכה הקיסריים בקונסטנטינופול.
    ב־1881 קיבל צלם מטביליסי, סבין-גוס, רשות לקחת אותן "לשחזור". הן לא חזרו עוד; המדליונים עברו לאספנים
    רוסים. תשעה נמצאים כיום במוזיאון המטרופוליטן לאמנות בניו יורק; אחרים באירמיטאז' ובמוזיאון הרוסי בסנקט
    פטרבורג, במוזיאון קלוני בפריז, ובטביליסי, שאליה הוחזרו כמה ב־1923.


    מה שנשאר פשוט יותר וקרוב יותר ללב: כנסיית אולם חד-ספינתית מאבן חול מסותתת, שכוסתה בפורפיר אפור ב־1847,
    עם פרסקאות פגומות מהמאות השש־עשרה עד השמונה־עשרה — מלאך ראשי גבוה בקשת הקיר הצפוני, ונסיך גוריה ואשתו
    פונים זה אל זה משני עברי האולם. חיי המנזר חזרו ב־21 בנובמבר 1990. האמיילים נמצאים בניו יורק; האופק
    שבקראדזה ראה עדיין כאן.
  tip: >-
    הקצו שעה, יותר אם השמיים בהירים — הנוף הוא העיקר. המנזר פעיל, אז התלבשו בצניעות: כיסוי ראש וחצאית
    לנשים, מכנסיים ארוכים לגברים. הטיפוס האחרון תלול, האספלט שבור וחלקלק אחרי גשם; רדו בהילוך נמוך. אין
    בית קפה או מתקן אחר על הגבעה — שניהם קיימים בלנצ'חוטי ובאוזורגטי. הנופים המרוחקים ביותר מגיעים לרוב
    בבוקר צח אחרי גשם, אף שערפל עדיין עשוי לרבוץ בעמקים. משקפת תשתלם כאן. שלבו את ג'ומאטי עם שמוקמדי:
    אותו צלם רוקן את אוצרות שני המנזרים ב־1881.
  route: >-
    מטביליסי כ-300 ק"מ; הקצו ארבע וחצי שעות או קצת יותר. סעו ב-S1 (E60) מערבה, ליד קוטאיסי, עד סמטרדיה,
    ואז ב-S12 עד לנצ'חוטי. מלנצ'חוטי המשיכו בכביש המקומי Sh47 דרומה כ-11 ק"מ, ואז בדרך כפרית של כ-9 ק"מ
    המטפסת למנזר מעל דזיריג'ומאטי. הכבישים הראשיים הם אספלט טוב; שני-שלושה הקילומטרים האחרונים צרים, תלולים
    ושבורים. במזג אוויר יבש רכב חסכוני יתמודד; אחרי גשם סעו לאט והשתמשו בהילוך נמוך בירידה. תדלקו בלנצ'חוטי.
    אפשר להגיע לג'ומאטי גם מאוזורגטי, כ-14 ק"מ משם.
ar:
  name: دير جوماتي
  short: >-
    دير رئيسَي الملائكة على قمة تلة فوق وادي سوبسا. ميداليات المينا البيزنطية الخاصة به في نيويورك وسانت
    بطرسبرغ؛ أما أفقه فما زال هنا.
  body: >-
    **في عام 1873 قضى المؤرخ ديميتري باكرادزه يومين على قمة جوماتي، وكتب أنه لا يستطيع أن يذكر في القوقاز
    كله أفقًا بهذا العرض.**


    يقف دير رئيسَي الملائكة ميخائيل وغبريال على ارتفاع نحو 490 مترًا على قمّة من سلسلة غوريا، فوق وادي
    سوبسا وقرية دزيريجوماتي. ومن سوره تمتد الرؤية عبر سهل كولخيس حتى بحيرة باليستومي وساحل أجاريا، وفي
    الأيام الصافية حتى ثلوج القوقاز. ومن القرن الخامس عشر إلى التاسع عشر كان مقرًّا لأساقفة جوماتي. وتُعطيه
    الأسطورة بداية أقدم: حين ابتلعت مياه باليستومي الأرض في الأسفل، هرب شمّاس يُدعى دارتشيا حاملًا أيقونة
    رئيس الملائكة وحملها إلى هنا، حيث أُقيمت كنيسة لها.


    سافرت شهرة جوماتي أبعد من مدى أفقه. كانت أيقونتاه الفضيتان لرئيسَي الملائكة مطعّمتين بميداليات ذهبية
    من المينا المقسّمة (كلوازونيه) صُنعت نحو عام 1100، على الأرجح في الورش الإمبراطورية بالقسطنطينية.
    وفي عام 1881 حصل مصوّر من تبليسي، سابين-غوس، على إذن بأخذها «للترميم». ولم تعد قط؛ فانتقلت الميداليات
    إلى جامعين روس. تسعٌ منها الآن في متحف متروبوليتان للفنون في نيويورك؛ وأخرى في الإرميتاج والمتحف الروسي
    في سانت بطرسبرغ، ومتحف كلوني في باريس، وفي تبليسي، التي أُعيد بعضها إليها عام 1923.


    أما ما تبقّى فأبسط وأقرب إلى القلب: كنيسة قاعة أحادية الصحن من الحجر الرملي المنحوت، كُسيت بالبورفير
    الرمادي عام 1847، وفيها جداريات متضررة من القرنين السادس عشر إلى الثامن عشر — رئيس ملائكة فارع القامة
    في قوس الجدار الشمالي، وأمير غوريا وزوجته يتقابلان عبر صحن الكنيسة. عادت الحياة الرهبانية في 21 نوفمبر
    1990. المينا في نيويورك؛ والأفق الذي رآه باكرادزه ما زال هنا.
  tip: >-
    خصص ساعة، وأكثر إن كانت السماء صافية — فالمنظر هو الغاية. الدير عامر بالرهبان، فارتد لباسًا محتشمًا:
    غطاء رأس وتنورة للنساء، وسراويل طويلة للرجال. الصعود الأخير حاد، والإسفلت متشقق وزَلِق بعد المطر؛
    فانزل بغيار منخفض. لا يوجد مقهى أو مرفق آخر على التلة — يوجد كلاهما في لانتشخوتي وأوزورغيتي. غالبًا
    ما تنفتح أبعد المشاهد في صباح منتعش بعد المطر، مع أن الضباب قد يظل عالقًا في الوديان. والمنظار مفيد
    جدًا هنا. اجمع بين جوماتي وشيموكميدي: المصوّر نفسه أفرغ الخزانتين عام 1881.
  route: >-
    من تبليسي نحو 300 كم؛ خصص أربع ساعات ونصف أو أكثر بقليل. اتخذ الطريق S1 (E60) غربًا مرورًا بكوتايسي
    حتى سامتريديا، ثم الطريق S12 حتى لانتشخوتي. من لانتشخوتي اتبع الطريق المحلي Sh47 جنوبًا لنحو 11 كم،
    ثم طريقًا قرويًا يمتد نحو 9 كم يرتقي إلى الدير فوق دزيريجوماتي. الطرق الرئيسية إسفلت جيد؛ وآخر كيلومترين
    أو ثلاثة ضيقة وشديدة الانحدار ومتشققة. في الطقس الجاف تتدبر سيارة اقتصادية أمرها؛ وبعد المطر، قُد
    ببطء واستخدم غيارًا منخفضًا في النزول. تزوَّد بالوقود في لانتشخوتي. يمكن الوصول إلى جوماتي أيضًا من
    أوزورغيتي، على نحو 14 كم.
