ka:
  name: ჯუმათის მონასტერი
  short: >-
    მთავარანგელოზთა მონასტერი ბორცვზე ოზურგეთის ჩრდილო-დასავლეთით, ცნობილი ბიზანტიური ემალებით, რომლებიც აქ აღარაა.
  body: >-
    **ჯუმათი გურიის ერთ-ერთი მთავარი სასულიერო ცენტრი იყო და ერთი უჩვეულო ისტორიის მფლობელი.** მონასტერი
    ბორცვზე დგას, ოზურგეთიდან ჩრდილო-დასავლეთით, და ხეობის ფართო ხედი აქვს. ეს მთავარანგელოზთა — მიქაელისა
    და გაბრიელის — სახელობის სავანეა.

    ეკლესია ძირითადად XVI საუკუნისაა, თუმცა ადგილი გაცილებით ძველია და ნაწილი ნაგებობის XII-XIII საუკუნეებით
    თარიღდება. გურიელების, გურიის მთავრების, ერთ-ერთი საძვალე სწორედ აქ იყო.

    ჯუმათის სახელი მსოფლიო ხელოვნებათმცოდნეობაში სხვა მიზეზით შევიდა. აქ ინახებოდა **ბიზანტიური ხატები
    ტიხრული ემალით** — X-XII საუკუნეების ნამუშევრები, რომლებიც ევროპის საუკეთესო ემალის ნიმუშთა შორისაა.
    1859 წელს კოლექციის ნაწილი გაიყიდა და საზღვარგარეთ გავიდა; დღეს ჯუმათის ემალები ბოსტონისა და ნიუ-იორკის
    მუზეუმებშია, ნაწილი კი საქართველოს ეროვნულ მუზეუმში, თბილისში. თვითონ მონასტერში ისინი აღარაა —
    ამის ცოდნა ჯობია ჩამოსვლამდე.

    რაც ადგილზეა:

    - **ეკლესია** მარტივი, კარგად შენარჩუნებული ქვის ნაგებობა, სამრეკლოთი

    - **ფრესკის ფრაგმენტები** შიგნით, ძლიერ დაზიანებული

    - **ხედი** ბორცვიდან — გურიის ბორცვები, ჩაის ყოფილი პლანტაციები და შორს კოლხეთის დაბლობი

    ერთი საათი. ეს არაა დიდი ძეგლი და მისი ღირებულება ნაწილობრივ ისტორიულია — მაგრამ ბორცვიდან ხედი
    და სიმშვიდე ორივე ნამდვილია.
  tip: >-
    ერთი საათი. მონასტერი მოქმედია — ჩაცმის წესები მოქმედებს, თავსაფარი და გრძელი ქვედაბოლო კართან დევს.
    ბოლო ორი კილომეტრი ბორცვზე ციცაბო აღმართია, ასფალტი დაზიანებულია და წვიმის შემდეგ მოლიპულია; ფრთხილად
    დაბლა ჩამოსვლისას. ტუალეტი და კაფე ადგილზე არაა, უახლოესი ოზურგეთშია. საუკეთესო დროა დილა, როცა
    ხეობა ჯერ ნისლშია.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ სამხრეთით ლანჩხუთის გავლით ოზურგეთისკენ და ბოლო მონაკვეთი
    სოფლის გზით ჩრდილო-დასავლეთით — 320 კმ, დაახლოებით ოთხი საათი ორმოცდაათი წუთი. მთავარი გზა ასფალტია;
    ბოლო ორი-სამი კილომეტრი ვიწრო და ციცაბოა. მშრალ ამინდში ჩვეულებრივი მანქანა ავა, წვიმის შემდეგ სიფრთხილეა
    საჭირო. საწვავი ლანჩხუთსა და ოზურგეთშია. ეკონომ-კლასი საკმარისია.
en:
  name: Jumati Monastery
  short: >-
    A monastery of the Archangels on a hill north-west of Ozurgeti, known for enamels it no longer holds.
  body: >-
    **Jumati was one of the principal religious centres of Guria, and it carries an unusual history.**
    The monastery stands on a hill north-west of Ozurgeti with a wide view over the valley. It is dedicated
    to the Archangels Michael and Gabriel.

    The church is largely 16th century, though the site is far older and parts of the fabric are dated
    to the 12th or 13th. One of the burial vaults of the Gurieli, the princes of Guria, was here.

    Jumati entered the wider history of art for a different reason. It held **Byzantine icons in cloisonné
    enamel** — 10th to 12th century work, among the finest enamels anywhere in Europe. In 1859 part of
    the collection was sold and left the country; today the Jumati enamels are in museums in Boston and
    New York, with some pieces in the Georgian National Museum in Tbilisi. They are not at the monastery,
    and it is better to know that before you drive up.

    What is on site:

    - The **church**, a plain, well-kept stone building with a bell tower

    - **Fragments of fresco** inside, heavily damaged

    - The **view** from the hill — the ridges of Guria, the old tea plantations, and the Kolkheti lowland
    in the distance

    An hour. This is not a large monument and part of its interest is historical rather than visual, but
    the view from the hill and the quiet are both real, and the drive up through the hazelnut orchards
    is pleasant in itself.
  tip: >-
    An hour. The monastery is active, so dress rules apply and headscarves and wrap skirts are left by
    the door. The last two kilometres climb the hill steeply, the asphalt is broken and it is slippery
    after rain; take the descent carefully. There are no toilets or cafe on site, the nearest being in
    Ozurgeti. Morning is the best time, while mist still lies in the valley below.
  route: >-
    From Tbilisi take the E60 to Samtredia, then south through Lanchkhuti towards Ozurgeti and finally
    a village road north-west — 320 km, about four hours fifty. The main roads are asphalt; the last two
    or three kilometres are narrow and steep. In dry weather an ordinary car will manage, but take care
    after rain. Fuel is available in Lanchkhuti and Ozurgeti. An economy car is sufficient.
ru:
  name: Монастырь Джумати
  short: >-
    Монастырь Архангелов на холме северо-западнее Озургети, известный эмалями, которых там больше нет.
  body: >-
    **Джумати был одним из главных духовных центров Гурии, и с ним связана необычная история.** Монастырь
    стоит на холме северо-западнее Озургети, с широким видом на долину. Он посвящён архангелам Михаилу
    и Гавриилу.

    Церковь в основном XVI века, хотя само место гораздо старше, а часть кладки датируют XII-XIII веками.
    Здесь находилась одна из усыпальниц Гуриели, князей Гурии.

    В историю искусства Джумати вошёл по другой причине. Здесь хранились **византийские иконы с перегородчатой
    эмалью** — работы X-XII веков, из лучших образцов эмали в Европе. В 1859 году часть собрания продали,
    и оно ушло за границу; сегодня джуматские эмали находятся в музеях Бостона и Нью-Йорка, часть — в
    Национальном музее Грузии в Тбилиси. В самом монастыре их нет, и об этом лучше знать заранее.

    Что есть на месте:

    - **Церковь** — простое, хорошо сохранившееся каменное здание с колокольней

    - **Фрагменты фресок** внутри, сильно повреждённые

    - **Вид** с холма: гурийские гряды, старые чайные плантации и вдали Колхидская низменность

    Час. Это не крупный памятник, и интерес к нему отчасти исторический, а не зрительный, но вид с холма
    и тишина вполне настоящие, а подъём через фундучные сады приятен сам по себе.
  tip: >-
    Час. Монастырь действующий, правила одежды соблюдаются, платки и юбки лежат у входа. Последние два
    километра круто идут в гору, асфальт разбит и после дождя скользит; спускайтесь аккуратно. Ни туалета,
    ни кафе на месте нет, ближайшие в Озургети. Лучшее время — утро, пока в долине внизу ещё лежит туман.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем на юг через Ланчхути в сторону Озургети и последний отрезок
    по сельской дороге на северо-запад — 320 км, около четырёх часов пятидесяти минут. Главные дороги
    асфальтированные; последние два-три километра узкие и крутые. В сухую погоду обычная машина поднимется,
    после дождя нужна осторожность. Заправки в Ланчхути и Озургети. Машины эконом-класса достаточно.
fa:
  name: صومعهٔ جوماتی
  short: >-
    صومعهٔ فرشتگان مقرب بر تپه‌ای شمال‌غرب اوزورگتی، مشهور به میناهایی که دیگر آنجا نیستند.
  body: >-
    **جوماتی از مراکز اصلی دینی گوریا بود و تاریخی نامعمول دارد.** صومعه بر تپه‌ای شمال‌غرب اوزورگتی
    ایستاده و چشم‌اندازی پهن به دره دارد. وقف فرشتگان مقرب میکائیل و جبرئیل است.

    کلیسا عمدتاً از سدهٔ شانزدهم است، هرچند خود مکان بسیار کهن‌تر است و بخش‌هایی از بنا به سدهٔ دوازدهم
    یا سیزدهم بازمی‌گردد. یکی از دخمه‌های گوریلی‌ها، امیران گوریا، اینجا بود.

    اما جوماتی به دلیلی دیگر وارد تاریخ هنر جهان شد. اینجا **شمایل‌های بیزانسی با مینای خانه‌بندی** نگهداری
    می‌شد؛ کارهایی از سدهٔ دهم تا دوازدهم که از بهترین نمونه‌های مینا در سراسر اروپاست. در ۱۸۵۹ بخشی
    از مجموعه فروخته شد و از کشور بیرون رفت؛ امروز میناهای جوماتی در موزه‌های بوستون و نیویورک‌اند و
    بخشی در موزهٔ ملی گرجستان در تفلیس. در خود صومعه نیستند، و بهتر است پیش از راه‌افتادن این را بدانید.

    آنچه در محل هست:

    - **کلیسا**، بنایی سنگی ساده و خوب‌نگهداری‌شده با ناقوس‌خانه

    - **پاره‌های فرسک** در درون، به‌شدت آسیب‌دیده

    - **چشم‌انداز** از تپه — یال‌های گوریا، باغ‌های چای کهنه، و جلگهٔ کلخیدا در دوردست

    یک ساعت. این بنای بزرگی نیست و بخشی از جذابیتش تاریخی است نه دیداری، اما منظرهٔ تپه و سکوت هر دو
    واقعی‌اند و بالا رفتن از میان باغ‌های فندق خود خوشایند است.
  tip: >-
    یک ساعت. صومعه فعال است و قواعد پوشش برقرار؛ روسری و دامن کنار در گذاشته شده. دو کیلومتر آخر تند
    بالا می‌رود، آسفالت شکسته است و پس از باران لیز؛ در سرازیری محتاط باشید. سرویس بهداشتی و کافه در
    محل نیست و نزدیک‌ترین‌ها در اوزورگتی است. بهترین وقت صبح است، وقتی مه هنوز در دره پایین نشسته.
  route: >-
    از تفلیس با E60 تا سامترِدیا، سپس به جنوب از لانچخوتی به سوی اوزورگتی و در پایان جاده‌ای روستایی
    به شمال‌غرب — ۳۲۰ کیلومتر، حدود چهار ساعت و پنجاه دقیقه. جاده‌های اصلی آسفالت‌اند؛ دو سه کیلومتر
    آخر باریک و تند است. در هوای خشک خودروی معمولی بالا می‌رود و پس از باران احتیاط لازم است. سوخت در
    لانچخوتی و اوزورگتی. خودروی اقتصادی کافی است.
he:
  name: מנזר ג׳ומאתי
  short: >-
    מנזר המלאכים על גבעה מצפון-מערב לאוזורגטי, מפורסם באמייל שכבר אינו שם.
  body: >-
    **ג׳ומאתי היה אחד המרכזים הדתיים המרכזיים של גוריה, ונושא היסטוריה חריגה.** המנזר עומד על גבעה מצפון-מערב
    לאוזורגטי עם נוף רחב אל העמק. הוא מוקדש למלאכים מיכאל וגבריאל.

    הכנסייה היא ברובה מן המאה ה-16, אף שהאתר עתיק בהרבה וחלקים מן הבנייה מתוארכים למאה ה-12 או ה-13.
    כאן היה אחד ממקומות הקבורה של בית גוריאלי, נסיכי גוריה.

    אבל ג׳ומאתי נכנס לתולדות האמנות מסיבה אחרת. כאן נשמרו **איקונות ביזנטיות באמייל קלואזונה** — עבודות
    מן המאות ה-10 עד ה-12, מן המשובחות באירופה כולה. ב-1859 נמכר חלק מן האוסף ויצא מן הארץ; כיום נמצאים
    אמייל ג׳ומאתי במוזיאונים בבוסטון ובניו יורק, וחלק מן הפריטים במוזיאון הלאומי של גאורגיה בטביליסי.
    הם אינם במנזר, ומוטב לדעת זאת לפני שנוסעים.

    מה שיש באתר:

    - **הכנסייה**, מבנה אבן פשוט ומטופח עם מגדל פעמונים

    - **שברי ציורי קיר** בפנים, פגומים מאוד

    - **הנוף** מן הגבעה — רכסי גוריה, מטעי התה הישנים, והשפל של קולחתי במרחק

    שעה. זה אינו מונומנט גדול וחלק מן העניין בו הוא היסטורי ולא חזותי, אבל הנוף מן הגבעה והשקט אמיתיים
    לגמרי, והעלייה בין מטעי אגוזי הלוז נעימה בפני עצמה.
  tip: >-
    שעה. המנזר פעיל, ולכן חלים כללי לבוש ומטפחות וחצאיות מונחות ליד הדלת. שני הקילומטרים האחרונים מטפסים
    בתלילות, האספלט שבור וחלקלק אחרי גשם; רדו בזהירות. אין שירותים ואין בית קפה במקום, והקרובים ביותר
    באוזורגטי. הבוקר הוא הזמן הטוב ביותר, כשהערפל עדיין שוכב בעמק למטה.
  route: >-
    מטביליסי בכביש E60 עד סמטרדיה, ואז דרומה דרך לנצ׳חותי לכיוון אוזורגטי ולבסוף בדרך כפרית צפונה-מערבה
    — 320 ק״מ, כארבע שעות וחמישים. הכבישים הראשיים סלולים; שניים-שלושה הקילומטרים האחרונים צרים ותלולים.
    במזג אוויר יבש רכב רגיל יעלה, ואחרי גשם דרושה זהירות. תדלוק בלנצ׳חותי ובאוזורגטי. רכב חסכוני מספיק.
ar:
  name: دير جوماتي
  short: >-
    دير رؤساء الملائكة على تل شمال غرب أوزورغيتي، مشهور بمينا لم تعد عنده.
  body: >-
    **كان جوماتي أحد المراكز الدينية الرئيسية في غوريا، ويحمل تاريخاً غير معتاد.** يقوم الدير على تل
    شمال غرب أوزورغيتي بإطلالة واسعة على الوادي. وهو مكرس لرئيسي الملائكة ميخائيل وجبرائيل.

    الكنيسة في معظمها من القرن السادس عشر، وإن كان الموقع أقدم بكثير وتُؤرخ أجزاء من البناء بالقرن الثاني
    عشر أو الثالث عشر. وهنا كان أحد مدافن آل غورييلي، أمراء غوريا.

    غير أن جوماتي دخل تاريخ الفن لسبب آخر. فقد حُفظت فيه **أيقونات بيزنطية بمينا الحواجز** من القرن العاشر
    إلى الثاني عشر، وهي من أجود أعمال المينا في أوروبا كلها. وفي 1859 بيع جزء من المجموعة وخرج من البلاد؛
    واليوم توجد مينا جوماتي في متاحف بوسطن ونيويورك، وبعض القطع في المتحف الوطني الجورجي بتبليسي. وهي
    ليست في الدير، ومن الأفضل معرفة ذلك قبل القيادة إليه.

    ما هو موجود في الموقع:

    - **الكنيسة**، بناء حجري بسيط حسن الصيانة ببرج أجراس

    - **بقايا رسوم جدارية** في الداخل، متضررة بشدة

    - **الإطلالة** من التل — تلال غوريا ومزارع الشاي القديمة ومنخفض كولخيتي في البعيد

    ساعة. ليس هذا نصباً كبيراً وجزء من أهميته تاريخي لا بصري، لكن المنظر من التل والهدوء حقيقيان تماماً،
    والصعود بين بساتين البندق ممتع بذاته.
  tip: >-
    ساعة واحدة. الدير عامل وتُطبق قواعد اللباس، والأغطية والتنانير موضوعة عند الباب. آخر كيلومترين يصعدان
    بحدة، والإسفلت متكسر وزلق بعد المطر؛ فانزل بحذر. لا دورات مياه ولا مقهى في الموقع، وأقربها في أوزورغيتي.
    والصباح أفضل الأوقات، حين لا يزال الضباب راقداً في الوادي.
  route: >-
    من تبليسي على E60 حتى سامتريديا، ثم جنوباً عبر لانتشخوتي نحو أوزورغيتي وأخيراً طريق قروي إلى الشمال
    الغربي — 320 كم، نحو أربع ساعات وخمسين دقيقة. الطرق الرئيسية معبّدة؛ وآخر كيلومترين أو ثلاثة ضيقة
    وحادة. في الجو الجاف تصعد سيارة عادية، وبعد المطر يلزم الحذر. الوقود في لانتشخوتي وأوزورغيتي. وسيارة
    اقتصادية تكفي.
