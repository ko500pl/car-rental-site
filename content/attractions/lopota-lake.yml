ka:
  name: ლოპოტას ტბა
  short: >-
    კავკასიონის ძირას „მივიწყებული“ ტბა 2008 წელს კურორტის გულად იქცა; ქვემოთ კი ნაფარეულია — ღვინის სოფელი,
    რომელიც იმაზე ძველია, ვიდრე ჩანს.
  body: >-
    **ნაფარეულის თავზე, იქ, სადაც მდინარე ლოპოტა კავკასიონს ალაზნის ვაკისკენ ტოვებს, პატარა ტბა, დიდხანს
    რომ მიტოვებული იყო, დიდი კურორტის შუაგულად იქცა.**


    კურორტი 2008 წელს გაიხსნა. ტბის გარშემო სასტუმროს კორპუსები, აუზები, სპა და საკუთარი მარანი დგას,
    ტერიტორია კი დაახლოებით მილიონ კვადრატულ მეტრს მოიცავს. მშენებლები ამ წყალს „მივიწყებულ ტბას“ უწოდებენ.
    უქარო დილით ზედაპირი უძრავია და მასში კავკასიონის მწვანე კალთები ირეკლება; დღისით წყალზე ნავები სრიალებს,
    საღამოს კი ხეობიდან გრილი ჰაერი ჩამოდის.


    ქვემოთ მდებარე სოფელი იმაზე ძველი და საინტერესოა, ვიდრე ერთი შეხედვით ჩანს. სახელი „ნაფარეული“ ცხვრის
    ფარის ნადგომს ნიშნავს: აქ გადიოდა ცხვრის გზა, რომლითაც თუშები, კახელები და პანკისელები ფარებს შილდის,
    ყვარლისა და ჭიაურის გავლით დაღესტნის მთებისკენ მიერეკებოდნენ. ერეკლე II-მ ნაფარეული გარსევან ჭავჭავაძეს
    უბოძა. მისმა ძემ, წინანდლის პატრონმა პოეტმა ალექსანდრე ჭავჭავაძემ, XIX საუკუნის 20-იან წლებში მილიონი
    მანეთი ისესხა და აქ ვენახები და ხეხილის ბაღები გააშენა; 1883 წელს სოფელში ღვინის ქარხანა დაარსდა.
    დღეს „ნაფარეული“ ადგილწარმოშობის დასახელების ღვინოცაა.


    სოფელს XVIII საუკუნის ციხე-გალავანიც შემორჩა, ლეკიანობის ჟამს აგებული. 1812 წლის ზაფხულს, რუსეთის
    მმართველობის წინააღმდეგ კახეთის აჯანყებისას, მის სიახლოვეს რუსეთის მეფის ჯარი დამარცხდა. გამარჯვებულმა
    კახელებმა სწორედ ნაფარეულიდან გაგზავნეს ომან მაყაშვილი და იოსებ ანდრონიკაშვილი ერევანში — ალექსანდრე
    ბატონიშვილი კახეთის ტახტზე მოეწვიათ.


    დილა ტბაზე გაატარეთ, ერთი საათი კი სოფელსაც დაუთმეთ: ნაფარეულის კარიერის მარმარილო ლენინგრადისა და
    ვარშავის მეტროში გამოიყენეს და მგზავრები ამ ქვას დღემდე ყოველდღე ჩაუვლიან.
  tip: >-
    ტბა და მისი ნაპირები კერძო კურორტს ეკუთვნის, ამიტომ დღიური ვიზიტის პირობები, ნავებისა და სხვა აქტივობების
    ფასი წინასწარ, ტელეფონით ან რეცეფციაზე გადაამოწმეთ. შაბათ-კვირას და ზაფხულის საღამოებით ხალხმრავლობაა,
    სამუშაო დღეები გაცილებით წყნარია. რესტორნები, ტუალეტი და სადგომი ადგილზეა. ზაფხულში კოღოს საწინააღმდეგო
    საშუალება წამოიღეთ, ივლისშიც კი თხელი ქურთუკი — ხეობიდან ჩამოსული ჰაერი საღამოს სწრაფად აგრილებს.
    სექტემბერ-ოქტომბერში, რთველისას, ლოპოტა წინანდლისა და თელავის მარნების მოსანახულებლად მშვიდი ბაზაა.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) საგარეჯომდე, შემდეგ გომბორის უღელტეხილით (შ38) თელავამდე, იქიდან
    კი ყვარლის გზით, წინანდლის გავლით, ნაფარეულამდე — კურორტის მისასვლელი სოფლიდან მითითებულია. სულ დაახლოებით
    115 კმ და ორ საათზე ცოტა მეტი. გზა ბოლომდე ასფალტიანია; გომბორზე მოსახვევი ბევრია და ზამთარში თოვლი
    დევს — მაშინ კახეთის გზატკეცილით, გურჯაანის გავლით იარეთ. საწვავი თელავში ჩაასხით, ნაფარეულის მხარეს
    გასამართი ცოტაა. ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში საკმარისია.
en:
  name: Lopota Lake
  short: >-
    A once-forgotten lake at the foot of the Caucasus, turned into a resort in 2008, above a wine village
    with more history than it lets on.
  body: >-
    **Above Napareuli, where the Lopota river leaves the Caucasus for the Alazani plain, a small lake
    that was long left to itself has become the centrepiece of a large resort.**


    The resort opened in 2008. Hotel buildings, pools, a spa and a winery of its own stand round the water,
    on grounds of about a million square metres, and the builders like to call the place a "forgotten
    lake". On a windless morning the surface lies still enough to hold the green slopes of the Caucasus;
    by day boats slide across it, and in the evening cool air pours down out of the gorge.


    The village below is older and more interesting than it looks. Napareuli means, roughly, "where the
    flock once stood": the old sheep road ran through it, and Tush, Kakhetian and Pankisi shepherds drove
    their flocks along it, by way of Shilda, Kvareli and Chiauri, up into the mountains of Dagestan. King
    Erekle II granted Napareuli to Garsevan Chavchavadze. His son Alexander, the poet of Tsinandali, borrowed
    a million roubles in the 1820s to plant vineyards and orchards here, and a winery followed in 1883.
    Today Napareuli is a wine appellation in its own right.


    The village also keeps an 18th-century fortified wall, built against the mountain raids of the time.
    In the summer of 1812, during the Kakhetian uprising against Russian rule, tsarist troops were beaten
    near it. From Napareuli the victors sent two envoys, Oman Makashvili and Ioseb Andronikashvili, to
    Yerevan to invite Prince Alexander, a son of King Erekle II, to take the throne of Kakheti.


    Spend the morning at the lake, then give the village an hour. Marble from Napareuli's quarry went
    into the Leningrad and Warsaw metros, and commuters still pass it every day.
  tip: >-
    The lake and its shores belong to a private resort, so check day-visitor terms and the prices of boats
    and other activities by phone or at reception before you plan your day around them. Weekends and summer
    evenings are busy; weekdays are much quieter. Restaurants, toilets and parking are on site. Bring
    insect repellent in summer and a light jacket even in July, as air sliding down from the gorge cools
    the evenings quickly. In September and October, harvest time, Lopota makes a calm base for the cellars
    of Tsinandali and Telavi.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) to Sagarejo, cross the Gombori Pass (Sh38) to Telavi, then
    follow the Kvareli road past Tsinandali to Napareuli, where the resort turn-off is signed. Allow about
    115 km and a little over two hours. It is asphalt all the way. Gombori is a long chain of bends and
    holds snow in winter; when it does, go round via the Kakheti Highway and Gurjaani. Fill up in Telavi,
    since fuel stations are sparse on the Napareuli side. An economy car is fine all year.
ru:
  name: Озеро Лопота
  short: >-
    Забытое было озеро у подножия Кавказа, превращённое в 2008 году в курорт, — над винной деревней, у
    которой истории куда больше, чем кажется.
  body: >-
    **Над Напареули, где река Лопота выходит из Кавказа на Алазанскую равнину, небольшое озеро, которое
    долго оставляли в покое, стало сердцем крупного курорта.**


    Курорт открылся в 2008 году. Гостиничные корпуса, бассейны, спа и собственная винодельня стоят вокруг
    воды, на территории около миллиона квадратных метров, а строители любят называть это место «забытым
    озером». В безветренное утро вода так неподвижна, что в ней отражаются зелёные склоны Кавказа; днём
    по воде скользят лодки, а вечером из ущелья вниз льётся прохладный воздух.


    Деревня внизу старше и интереснее, чем кажется на первый взгляд. Название Напареули означает примерно
    «место, где стояло стадо»: здесь проходила старая овечья дорога, по которой тушинские, кахетинские
    и панкисские пастухи вели свои стада — через Шилду, Кварели и Чиаури — вверх, в горы Дагестана. Царь
    Ираклий II пожаловал Напареули Гарсевану Чавчавадзе. Его сын Александр, поэт из Цинандали, в 1820-х
    годах взял в долг миллион рублей, чтобы посадить здесь виноградники и сады, а в 1883 году появилась
    винодельня. Сегодня Напареули — самостоятельное наименование места происхождения вина.


    Деревня хранит также крепостную стену XVIII века, возведённую для защиты от набегов горцев. Летом
    1812 года, во время Кахетинского восстания против российской власти, царские войска были разбиты недалеко
    от неё. Из Напареули победители отправили двух посланцев, Омана Макашвили и Иосеба Андроникашвили,
    в Ереван — пригласить царевича Александра, сына царя Ираклия II, занять кахетинский престол.


    Утро проведите на озере, а деревне уделите час. Мрамор из напареульской каменоломни пошёл на ленинградское
    и варшавское метро, и пассажиры до сих пор каждый день проходят мимо него.
  tip: >-
    Озеро и его берега принадлежат частному курорту, так что уточните условия для однодневных посетителей
    и цены на лодки и другие развлечения по телефону или на стойке регистрации, прежде чем строить на
    этом планы. Выходные и летние вечера многолюдны, будни — намного тише. Рестораны, туалеты и парковка
    есть на месте. Летом возьмите репеллент от насекомых и лёгкую куртку даже в июле — воздух, спускающийся
    из ущелья, быстро охлаждает вечера. В сентябре-октябре, во время сбора урожая, Лопота становится спокойной
    базой для поездок по погребам Цинандали и Телави.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) до Сагареджо, через Гомборский перевал (Sh38) до Телави, затем
    по дороге на Кварели через Цинандали до Напареули, где указан поворот на курорт. Всего около 115 км
    и чуть больше двух часов. Дорога асфальтирована на всём пути. Гомбори — длинная цепь поворотов, зимой
    там бывает снег; в этом случае объезжайте по Кахетинской трассе через Гурджаани. Заправляйтесь в Телави,
    так как на стороне Напареули заправок мало. Машина эконом-класса годится в любое время года.
fa:
  name: دریاچهٔ لوپوتا
  short: >-
    دریاچه‌ای فراموش‌شده در دامنهٔ قفقاز که در سال ۲۰۰۸ به اقامتگاهی بدل شد — بالای روستایی شراب‌خیز که
    تاریخش بیش از آن است که نشان می‌دهد.
  body: >-
    **بالای ناپارئولی، جایی که رود لوپوتا از قفقاز به دشت آلازانی می‌رسد، دریاچه‌ای کوچک که مدت‌ها به
    حال خود رها شده بود، اکنون قلب یک اقامتگاه بزرگ شده است.**


    این اقامتگاه در سال ۲۰۰۸ افتتاح شد. بناهای هتل، استخرها، اسپا و شراب‌سازیِ خاص خود دور آب ایستاده‌اند،
    بر زمینی نزدیک به یک میلیون متر مربع، و سازندگان دوست دارند این‌جا را «دریاچهٔ فراموش‌شده» بنامند.
    در بامدادی بی‌باد، سطح آب چنان آرام است که دامنه‌های سبز قفقاز در آن بازتاب می‌یابد؛ در روز قایق‌ها
    بر آن می‌لغزند، و شامگاه هوای خنکی از تنگه به پایین می‌ریزد.


    روستای پایین‌دست کهن‌تر و جالب‌تر از آن است که به نظر می‌رسد. ناپارئولی تقریباً به معنای «جایی که
    گله می‌ایستاد» است: راه کهن گله‌داری از آن می‌گذشت، و چوپانان توش، کاختی و پانکیسی، از راه شیلدا،
    کوارلی و چیائوری، گله‌های خود را از آن‌جا تا کوهستان‌های داغستان می‌راندند. پادشاه اِرِکله دوم ناپارئولی
    را به گارسِوان چاوچاوادزه بخشید. پسرش الکساندر، شاعر تسیناندالی، در دههٔ ۱۸۲۰ یک میلیون روبل وام گرفت
    تا در این‌جا تاکستان و باغ بکارد، و در سال ۱۸۸۳ کارخانهٔ شراب‌سازی بنیاد نهاده شد. امروز ناپارئولی
    خود نامِ خاستگاهیِ مستقلی برای شراب است.


    این روستا همچنین بارویی دفاعی از سدهٔ هجدهم نگه داشته که در برابر یورش‌های کوه‌نشینان در آن دوران
    ساخته شده بود. در تابستان ۱۸۱۲، در جریان قیام کاختی علیه حکومت روسیه، نیروهای تزاری نزدیک آن شکست
    خوردند. از ناپارئولی، پیروزمندان دو فرستاده، اومان ماکاشویلی و یوسِب آندرونیکاشویلی، را به ایروان
    فرستادند تا شاهزاده الکساندر، پسر پادشاه اِرِکله دوم، را به تخت کاختی دعوت کنند.


    صبح را در کنار دریاچه بگذرانید، سپس یک ساعت به روستا بدهید. مرمر معدن ناپارئولی در متروی لنینگراد
    و ورشو به کار رفته و مسافران هنوز هر روز از کنارش می‌گذرند.
  tip: >-
    دریاچه و کناره‌هایش به اقامتگاهی خصوصی تعلق دارد، پس شرایط بازدید روزانه و قیمت قایق و دیگر فعالیت‌ها
    را پیش از برنامه‌ریزی از طریق تلفن یا پذیرش بررسی کنید. آخر هفته‌ها و شب‌های تابستان شلوغ است؛ روزهای
    کاری آرام‌تر. رستوران، سرویس بهداشتی و پارکینگ در محل موجود است. در تابستان دافع حشره و ژاکتی سبک
    حتی در ژوئیه همراه ببرید، چون هوای فرودآمده از تنگه شامگاهان را زود خنک می‌کند. در سپتامبر و اکتبر،
    فصل برداشت، لوپوتا پایگاهی آرام برای سفر به سردابه‌های شراب تسیناندالی و تلاوی است.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را تا ساگارِجو بگیرید، از گذرگاه گومبوری (Sh38) بگذرید تا تلاوی، سپس در
    مسیر کوارلی از کنار تسیناندالی بگذرید تا ناپارئولی، جایی که تابلوی ورودی اقامتگاه دیده می‌شود. حدود
    ۱۱۵ کیلومتر و کمی بیش از دو ساعت زمان بگذارید. راه تا انتها آسفالته است. گومبوری زنجیره‌ای طولانی
    از پیچ‌هاست و زمستان برفی می‌شود؛ در آن صورت از بزرگراه کاختی و گورجانی دور بزنید. در تلاوی سوخت‌گیری
    کنید، چون ایستگاه سوخت در سوی ناپارئولی کم است. خودروی اقتصادی در تمام سال کافی است.
he:
  name: אגם לופוטה
  short: אגם שנשכח פעם למרגלות הקווקז, שהפך ב-2008 לאתר נופש, מעל כפר יין שההיסטוריה שלו עשירה משנדמה.
  body: >-
    **מעל נפאראולי, שם נהר לופוטה עוזב את הקווקז למישור אלזאני, אגם קטן שהוזנח זמן רב הפך למרכזו של אתר
    נופש גדול.**


    אתר הנופש נפתח ב-2008. בנייני מלון, בריכות, ספא ויקב משלו עומדים סביב המים, על שטח של כמיליון מטרים
    רבועים, והבנאים אוהבים לקרוא למקום "האגם שנשכח". בבוקר חסר רוח פני המים שקטים כל כך שהמדרונות הירוקים
    של הקווקז משתקפים בהם; ביום סירות שטות על פניו, ובערב אוויר קר נשפך מן הערוץ.


    הכפר שלמטה עתיק ומעניין יותר משהוא נראה. השם נפאראולי פירושו בערך "המקום שבו עמד העדר": דרך הצאן הישנה
    עברה בו, ורועים מטושטי, מקאחתי ומפנקיסי הובילו בה את עדריהם, דרך שילדה, קוורלי וצ'יאורי, עד הרי דאגסטן.
    המלך אירקלה השני העניק את נפאראולי לגרסבן צ'בצ'בדזה. בנו אלכסנדר, משורר צינאנדלי, לווה מיליון רובל
    בשנות ה-1820 כדי לשתול כרמים ומטעים כאן, ויקב הוקם ב-1883. כיום נפאראולי היא כינוי מקור (אפלסיון)
    עצמאי ליין.


    הכפר משמר גם חומת מבצר מהמאה השמונה־עשרה, שנבנתה נגד פשיטות בני ההרים של אותה תקופה. בקיץ 1812, בעת
    מרד קאחתי בשלטון הרוסי, נוצחו כוחות הצאר סמוך לה. מנפאראולי שלחו המנצחים שני שליחים, אומן מקשווילי
    ויוסב אנדרוניקשווילי, לירוואן להזמין את הנסיך אלכסנדר, בנו של המלך אירקלה השני, לתפוס את כס קאחתי.


    הקדישו את הבוקר לאגם, ותנו לכפר שעה. שיש ממחצבת נפאראולי שימש ברכבות התחתיות של לנינגרד ושל ורשה,
    ונוסעים עדיין חולפים על פניו מדי יום.
  tip: >-
    האגם וגדותיו שייכים לאתר נופש פרטי, אז בדקו את תנאי המבקרים ליום ואת מחירי הסירות והפעילויות האחרות
    בטלפון או בקבלה לפני שאתם מתכננים סביבם את היום. סופי שבוע וערבי קיץ עמוסים; ימי חול שקטים בהרבה.
    מסעדות, שירותים וחניה נמצאים במקום. הביאו דוחה יתושים בקיץ ומעיל קל אפילו ביולי, כי האוויר היורד מהערוץ
    מקרר את הערבים במהירות. בספטמבר ואוקטובר, עונת הבציר, לופוטה משמש בסיס שקט למרתפי צינאנדלי וטלאווי.
  route: >-
    מטביליסי קחו את כביש קאחתי (S5) עד סגרג'ו, חצו את מעבר גומבורי (Sh38) לטלאווי, ואז המשיכו בכביש קוורלי,
    דרך צינאנדלי, לנפאראולי, שם מסומנת פנייה לאתר הנופש. הקצו כ-115 ק"מ ומעט יותר משעתיים. הכביש אספלט
    לכל אורכו. גומבורי הוא שרשרת פיתולים ארוכה, ובחורף הוא מושלג לעתים; במקרה כזה עקפו דרך כביש קאחתי
    וגורג'אני. תדלקו בטלאווי, כי תחנות דלק מעטות בצד נפאראולי. רכב אקונומי מתאים כל השנה.
ar:
  name: بحيرة لوبوتا
  short: بحيرة نُسيت طويلًا عند سفح القوقاز، تحوّلت عام 2008 إلى منتجع، فوق قرية نبيذ يفوق تاريخها ما
    تُظهره.
  body: >-
    **فوق نابارئولي، حيث يترك نهر لوبوتا القوقاز إلى سهل ألازاني، تحوّلت بحيرة صغيرة أُهملت طويلًا إلى
    محور منتجع كبير.**


    افتُتح المنتجع عام 2008. تقف حوله مبانٍ فندقية، ومسابح، ومنتجع صحي، ومعمل نبيذ خاص به، على أرض تبلغ
    نحو مليون متر مربع، ويحب البناؤون تسمية المكان «البحيرة المنسية». في صباح ساكن الريح يسكن سطح الماء
    حتى تنعكس فيه سفوح القوقاز الخضراء؛ ونهارًا تنزلق القوارب فوقه، ومساءً ينسكب هواء بارد من الوادي.


    القرية الواقعة تحته أقدم وأكثر إثارة للاهتمام مما تبدو. يعني اسم نابارئولي تقريبًا «حيث كان القطيع
    يقف»: كان طريق الرعي القديم يمر منها، وكان رعاة التوش وكاخيتي وبانكيسي يسوقون قطعانهم فيه، مرورًا
    بشيلدا وكفاريلي وتشياوري، صعودًا إلى جبال داغستان. منح الملك إيراكلي الثاني نابارئولي لغارسِفان تشافتشافادزه.
    واستدان ابنه ألكسندر، شاعر تسيناندالي، مليون روبل في عشرينيات القرن التاسع عشر لغرس الكروم والبساتين
    هنا، وأُسس معمل نبيذ عام 1883. واليوم تحمل نابارئولي تسمية نبيذ مستقلة بذاتها.


    تحتفظ القرية أيضًا بسور تحصين من القرن الثامن عشر، بُني لصدّ غارات الجبليين في ذلك العصر. في صيف 1812،
    خلال انتفاضة كاختي على الحكم الروسي، هُزمت قوات القيصر قربه. ومن نابارئولي أرسل المنتصرون مبعوثين،
    أومان مكاشفيلي ويوسب أندرونيكاشفيلي، إلى يريفان لدعوة الأمير ألكسندر، ابن الملك إيراكلي الثاني، لتولي
    عرش كاختي.


    اقضِ الصباح عند البحيرة، ثم أعطِ القرية ساعة. استُخدم رخام محجر نابارئولي في مترو لينينغراد ووارسو،
    وما زال الركاب يمرّون به كل يوم.
  tip: >-
    البحيرة وضفافها مملوكة لمنتجع خاص، فتحقق من شروط الزيارة النهارية وأسعار القوارب والأنشطة الأخرى عبر
    الهاتف أو في الاستقبال قبل التخطيط ليومك حولها. تكون عطلات نهاية الأسبوع والأمسيات الصيفية مزدحمة؛
    أما أيام الأسبوع فأهدأ كثيرًا. تتوفر المطاعم والمرافق الصحية ومواقف السيارات في الموقع. احمل طارد
    حشرات في الصيف وسترة خفيفة حتى في يوليو، لأن الهواء المنسكب من الوادي يبرّد المساءات بسرعة. في سبتمبر
    وأكتوبر، موسم القطاف، تصبح لوبوتا قاعدة هادئة لزيارة أقبية تسيناندالي وتيلافي.
  route: >-
    من تبليسي، خذ طريق كاختي السريع (S5) إلى ساغاريجو، واعبر ممر غومبوري (Sh38) إلى تيلافي، ثم اتبع طريق
    كفاريلي عبر تسيناندالي إلى نابارئولي، حيث توجد لافتة تشير إلى منعطف المنتجع. احسب نحو 115 كم وما يزيد
    قليلًا على ساعتين. الطريق مُعبَّد بالكامل. غومبوري سلسلة طويلة من المنحنيات وتغطيه الثلوج شتاءً؛ في
    هذه الحالة التفّ عبر طريق كاختي وغورجاني. تزوّد بالوقود في تيلافي، فمحطات الوقود قليلة في جانب نابارئولي.
    سيارة اقتصادية تكفي طوال السنة.
