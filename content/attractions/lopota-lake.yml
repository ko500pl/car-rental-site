ka:
  name: ლოპოტას ტბა
  short: ტბა და კურორტული ხეობა კავკასიონის ძირში, ნაფარეულთან — ნავები, აუზები და ალაზნის ველის ხედები.
  body: >-
    **ლოპოტა ის ადგილია, სადაც კახეთი ღვინის ტურიდან დასვენებად იქცევა.** ტბა ლოპოტას ვიწრო ხეობაში დევს,
    სოფელ ნაფარეულის ზემოთ, პირდაპირ კავკასიონის მწვანე კალთების ძირში — თბილისიდან დაახლოებით 100 კილომეტრში
    და თელავიდან 26 კილომეტრში.


    2008 წლიდან ტბის გარშემო კურორტი მუშაობს: სასტუმროების რამდენიმე კორპუსი, აუზები, სპა და საკუთარი
    მარანი. ტერიტორია დიდია — დაახლოებით ერთი მილიონი კვადრატული მეტრი — და ტბა მისი ცენტრია.


    რას აკეთებ ადგილზე:


    - **ნავით ან კატამარანით სეირნობა** ტბაზე, რომელშიც კავკასიონი ირეკლება

    - **ცხენით ჯირითი** ხეობის ბილიკებზე

    - **ღვინის დეგუსტაცია** ადგილობრივ მარანში — ნაფარეული ხომ ღვინის მიკროზონაა

    - ტბის გარშემო გასეირნება და ალაზნის ველის ხედები


    საუკეთესო დროა გვიანი გაზაფხულიდან შემოდგომამდე, როცა ხეობა მწვანეა და წყალზე აქტივობები მუშაობს.
    სექტემბერ-ოქტომბერში კი ლოპოტა რთველის მარშრუტის მშვიდი გაჩერებაა — დილით ტბა, დღისით ნაფარეულისა
    და თელავის მარნები.
  tip: >-
    ტერიტორია კერძო კურორტს ეკუთვნის — არასტუმრებისთვის შესვლის პირობები და აქტივობების ფასები წინასწარ
    გადაამოწმე ტელეფონით ან რეცეფციაზე. შაბათ-კვირას და ზაფხულის საღამოებით ხალხმრავლობაა, სამუშაო დღეები
    გაცილებით მშვიდია. რესტორნები და ტუალეტები ადგილზეა, პარკინგი — შესასვლელთან. ზაფხულში კოღოებისთვის
    საშუალება წამოიღე, ხეობაში საღამოს გრილა — მსუბუქი ქურთუკი გამოგადგება.
  route: >-
    თბილისიდან ყველაზე სწრაფი გზა გომბორის უღელტეხილია: კახეთის გზატკეცილით საგარეჯოს მიმართულებით, შემდეგ
    გომბორის გავლით თელავამდე და იქიდან ნაფარეულისკენ — სულ დაახლოებით 100 კმ, ორი საათი. გზა ბოლომდე
    ასფალტიანია; გომბორზე მოსახვევები ბევრია, ზამთარში კი ხანდახან თოვლი დევს. საწვავი თელავში აიღე —
    ნაფარეულის მხარეს ბენზინგასამართი ცოტაა. ეკონომ-კლასის ავტომობილი მთელი სეზონისთვის საკმარისია.
en:
  name: Lopota Lake
  short: >-
    A lake and resort valley at the foot of the Caucasus near Napareuli — boats, pools and views over
    the Alazani wine country.
  body: >-
    **Lopota is where a Kakheti wine trip turns into an actual holiday.** The lake sits in the narrow
    Lopota gorge above the village of Napareuli, right at the base of the green lower slopes of the Greater
    Caucasus — about 100 km from Tbilisi and 26 km from Telavi.


    A resort has grown around the water since 2008: several hotel buildings, pools, a spa and its own
    winery spread over roughly a million square metres, with the lake as the centrepiece.


    What you actually do here:


    - **Row or pedal a boat** across water that mirrors the Caucasus wall

    - **Ride horses** on valley trails above the gorge

    - **Taste wine** at the estate cellar — Napareuli is a wine appellation in its own right

    - Walk the lakeside loop for views back over the Alazani valley


    The sweet spot runs from late spring to autumn, when the gorge is green and everything on the water
    operates. In September and October Lopota makes a calm base for the rtveli harvest season — lake in
    the morning, the cellars of Napareuli and Telavi in the afternoon.
  tip: >-
    The grounds belong to a private resort, so check day-visitor access and activity prices by phone or
    at reception before building your day around it. Weekends and summer evenings get busy; weekdays are
    far quieter. Restaurants, toilets and parking are on site. Bring mosquito repellent in summer, and
    a light jacket — evenings in the gorge cool down fast even in July.
  route: >-
    The quickest way from Tbilisi is over the Gombori pass: take the Kakheti highway towards Sagarejo,
    climb over Gombori to Telavi, then continue towards Napareuli — about 100 km and two hours in total.
    The road is asphalt the whole way; Gombori is a long series of bends and can hold snow in winter.
    Fill up in Telavi, as fuel stations are sparse on the Napareuli side. An economy car is fine for the
    whole season.
ru:
  name: Озеро Лопота
  short: Озеро и курортная долина у подножия Кавказа рядом с Напареули — лодки, бассейны и виды на Алазанскую
    долину.
  body: >-
    **Лопота — то место, где винный тур по Кахетии превращается в настоящий отдых.** Озеро лежит в узком
    ущелье Лопота над селом Напареули, прямо у подножия зелёных склонов Большого Кавказа — около 100 км
    от Тбилиси и 26 км от Телави.


    С 2008 года вокруг воды вырос курорт: несколько гостиничных корпусов, бассейны, спа и собственная
    винодельня на территории примерно в миллион квадратных метров, и озеро — её центр.


    Чем здесь заняться:


    - **Покататься на лодке или катамаране** по воде, в которой отражается кавказская стена

    - **Проехаться верхом** по тропам над ущельем

    - **Продегустировать вино** в местном марани — Напареули само по себе винный аппелласьон

    - Пройти круг вдоль берега ради видов на Алазанскую долину


    Лучшее время — с конца весны до осени, когда ущелье зелёное и работает всё, что на воде. В сентябре-октябре
    Лопота — спокойная база на сезон ртвели: утром озеро, днём погреба Напареули и Телави.
  tip: >-
    Территория принадлежит частному курорту, поэтому условия входа для не-гостей и цены на активности
    уточняйте заранее по телефону или на ресепшен. В выходные и летними вечерами многолюдно, в будни заметно
    тише. Рестораны, туалеты и парковка на месте. Летом возьмите средство от комаров и лёгкую куртку —
    вечером в ущелье быстро холодает даже в июле.
  route: >-
    Быстрее всего из Тбилиси через Гомборский перевал: по Кахетинской трассе в сторону Сагареджо, через
    Гомбори до Телави и дальше на Напареули — всего около 100 км, два часа. Дорога асфальтированная на
    всём протяжении; на Гомбори много поворотов, зимой возможен снег. Заправьтесь в Телави — на стороне
    Напареули заправок мало. Машины эконом-класса достаточно весь сезон.
fa:
  name: دریاچهٔ لوپوتا
  short: دریاچه و درهٔ تفریحی در پای قفقاز نزدیک ناپارئولی — قایق‌سواری، استخر و چشم‌انداز درهٔ شراب آلازانی.
  body: >-
    **لوپوتا جایی است که سفر شراب کاختی به یک تعطیلات واقعی بدل می‌شود.** دریاچه در درهٔ باریک لوپوتا
    بالای روستای ناپارئولی قرار دارد، درست در پای دامنه‌های سبز قفقاز بزرگ — حدود 100 کیلومتر از تفلیس
    و 26 کیلومتر از تلاوی.


    از سال 2008 گرد این آب مجموعه‌ای تفریحی شکل گرفته است: چند ساختمان هتل، استخرها، اسپا و یک شراب‌سازی
    اختصاصی در محوطه‌ای نزدیک به یک میلیون متر مربع، که دریاچه قلب آن است.


    اینجا چه می‌کنید:


    - **قایق پارویی یا پدالی** روی آبی که دیوارهٔ قفقاز در آن بازتاب می‌یابد

    - **اسب‌سواری** در مسیرهای بالای دره

    - **چشیدن شراب** در سردابهٔ مجموعه — ناپارئولی خود یک منطقهٔ ثبت‌شدهٔ شراب است

    - پیاده‌روی دور دریاچه با منظرهٔ درهٔ آلازانی


    بهترین زمان از اواخر بهار تا پاییز است، وقتی دره سبز است و همهٔ تفریحات آبی فعال‌اند. در سپتامبر و
    اکتبر لوپوتا پایگاهی آرام برای فصل برداشت انگور است — صبح دریاچه، بعدازظهر سردابه‌های ناپارئولی و
    تلاوی.
  tip: >-
    محوطه متعلق به یک مجموعهٔ خصوصی است؛ شرایط ورود بازدیدکنندگان روزانه و قیمت تفریحات را از پیش تلفنی
    یا در پذیرش بپرسید. آخر هفته‌ها و غروب‌های تابستان شلوغ است و روزهای هفته بسیار آرام‌تر. رستوران،
    سرویس بهداشتی و پارکینگ در محل هست. در تابستان دافع پشه بیاورید و یک ژاکت سبک هم — غروب‌ها هوای دره
    حتی در ژوئیه سریع خنک می‌شود.
  route: >-
    سریع‌ترین راه از تفلیس گردنهٔ گمبوری است: از بزرگراه کاختی به سوی ساگارجو، عبور از گمبوری تا تلاوی
    و سپس به سمت ناپارئولی — در مجموع حدود 100 کیلومتر و دو ساعت. جاده سراسر آسفالت است؛ گمبوری پرپیچ
    است و در زمستان گاهی برف دارد. در تلاوی سوخت بزنید، چون در سمت ناپارئولی پمپ بنزین کم است. خودروی
    اقتصادی برای تمام فصل کافی است.
he:
  name: אגם לופוטה
  short: אגם ועמק נופש למרגלות הקווקז ליד נפראולי — סירות, בריכות ונופי עמק היין אלזאני.
  body: >-
    **לופוטה הוא המקום שבו טיול יין בקחתי הופך לחופשה אמיתית.** האגם שוכן בערוץ לופוטה הצר מעל הכפר נפראולי,
    ממש למרגלות המדרונות הירוקים של הקווקז הגדול — כ-100 ק״מ מטביליסי ו-26 ק״מ מטלאווי.


    מאז 2008 צמח סביב המים אתר נופש: כמה בנייני מלון, בריכות, ספא ויקב משלו, על שטח של כמיליון מ״ר, כשהאגם
    במרכזו.


    מה עושים כאן בפועל:


    - **חותרים או דוושים בסירה** על מים שמשקפים את חומת הקווקז

    - **רוכבים על סוסים** בשבילים שמעל הערוץ

    - **טועמים יין** במרתף המקומי — נפראולי הוא אזור יין רשום בפני עצמו

    - מקיפים את האגם ברגל לנופים של עמק אלזאני


    הזמן הטוב ביותר הוא מסוף האביב עד הסתיו, כשהעמק ירוק וכל פעילויות המים עובדות. בספטמבר-אוקטובר לופוטה
    היא בסיס רגוע לעונת הבציר: בבוקר האגם, אחר הצהריים המרתפים של נפראולי וטלאווי.
  tip: >-
    השטח שייך לאתר נופש פרטי — בדקו מראש בטלפון או בקבלה את תנאי הכניסה למבקרי יום ואת מחירי הפעילויות.
    בסופי שבוע ובערבי קיץ צפוף; באמצע השבוע שקט בהרבה. מסעדות, שירותים וחניה יש במקום. בקיץ קחו דוחה יתושים
    וגם ז'קט קל — הערבים בערוץ מתקררים מהר אפילו ביולי.
  route: >-
    הדרך המהירה מטביליסי היא דרך מעבר גומבורי: בכביש קחתי לכיוון סגרג'ו, טיפוס על גומבורי עד טלאווי והמשך
    לכיוון נפראולי — בסך הכול כ-100 ק״מ ושעתיים. הכביש סלול לכל אורכו; גומבורי מפותל, ובחורף ייתכן שלג.
    תדלקו בטלאווי — בצד של נפראולי תחנות הדלק מעטות. רכב חסכוני מספיק לכל העונה.
ar:
  name: بحيرة لوبوتا
  short: بحيرة ووادٍ سياحي عند سفح القوقاز قرب نابارئولي — قوارب ومسابح وإطلالات على وادي ألازاني.
  body: >-
    **لوبوتا هي المكان الذي تتحول فيه جولة النبيذ في كاخيتي إلى عطلة حقيقية.** تقع البحيرة في وادي لوبوتا
    الضيق فوق قرية نابارئولي، عند سفح المنحدرات الخضراء لجبال القوقاز الكبرى مباشرة — على نحو 100 كم من
    تبليسي و26 كم من تيلافي.


    منذ عام 2008 نما حول الماء منتجع كامل: عدة مبانٍ فندقية ومسابح وسبا ومصنع نبيذ خاص، على مساحة تقارب
    مليون متر مربع، والبحيرة قلبها النابض.


    ماذا تفعل هنا فعلاً:


    - **التجديف أو قارب الدواسة** فوق ماء تنعكس فيه جدران القوقاز

    - **ركوب الخيل** على دروب الوادي

    - **تذوق النبيذ** في قبو المنتجع — فنابارئولي منطقة نبيذ مسجلة بحد ذاتها

    - المشي حول البحيرة لإطلالات على وادي ألازاني


    أفضل وقت من أواخر الربيع حتى الخريف، حين يخضرّ الوادي وتعمل كل الأنشطة المائية. وفي سبتمبر وأكتوبر
    تصبح لوبوتا قاعدة هادئة لموسم قطاف العنب: البحيرة صباحاً، وأقبية نابارئولي وتيلافي بعد الظهر.
  tip: >-
    الأرض ملك لمنتجع خاص، فاستفسر مسبقاً بالهاتف أو عند الاستقبال عن شروط دخول زوار اليوم وأسعار الأنشطة.
    عطلات نهاية الأسبوع وأمسيات الصيف مزدحمة، وأيام الأسبوع أهدأ بكثير. المطاعم ودورات المياه والموقف
    متوفرة في المكان. في الصيف خذ طارد البعوض وسترة خفيفة — فالمساء في الوادي يبرد سريعاً حتى في يوليو.
  route: >-
    أسرع طريق من تبليسي عبر ممر غومبوري: خذ طريق كاخيتي السريع باتجاه ساغاريجو، ثم اصعد غومبوري إلى تيلافي
    وواصل نحو نابارئولي — نحو 100 كم وساعتان إجمالاً. الطريق معبّد بالكامل؛ غومبوري كثير المنعطفات وقد
    يعلوه الثلج شتاءً. تزود بالوقود في تيلافي، فمحطات الوقود قليلة في جهة نابارئولي. سيارة اقتصادية تكفي
    طوال الموسم.
