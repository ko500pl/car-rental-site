ka:
  name: ხორნაბუჯის ციხე
  short: ციცაბო კლდეზე შემორჩენილი შუასაუკუნეების ციხე დედოფლისწყაროსთან, ალაზნის ვაკის თავზე.
  body: >-
    **ხორნაბუჯი შორიდან უფრო კარგად ჩანს, ვიდრე ახლოდან** — და სწორედ ეს იყო ჩანაფიქრი. ციხე ცალკე მდგარ,
    ციცაბო კლდეზეა დედოფლისწყაროდან რამდენიმე კილომეტრში, ალაზნის ვაკის სამხრეთ კიდეზე; ველიდან ის ათეულობით
    კილომეტრიდან იკვეთება.


    ადგილს ქართული წყაროები ჰერეთის ერთ-ერთ მთავარ სიმაგრედ იხსენიებენ. სახელი IV საუკუნიდან გვხვდება,
    დღევანდელი კედლების უმეტესობა კი X-XII საუკუნეებისაა. ხორნაბუჯი აკონტროლებდა გზას, რომელიც ალაზნის
    ვაკიდან სამხრეთით, ივრის ზეგანსა და შემდეგ შირვანისკენ მიდიოდა — ანუ სავაჭრო და სალაშქრო დერეფანს
    ერთდროულად.


    ხალხში ციხეს „თამარის ციხეს" უწოდებენ, თუმცა თამარ მეფესთან პირდაპირი კავშირი დადასტურებული არ არის;
    ეს იმ ათეულობით ქართული ციხის ერთ-ერთია, რომელსაც ეს სახელი მიაწერეს.


    ზემოთ ნახავ ორ დონეზე გაშენებულ ნაშთებს: ქვედა კედლებს კოშკებით და ზედა ციტადელს, სადაც წყლის ცისტერნა
    და პატარა ეკლესიის საძირკველია. ქვა ადგილობრივი, მოყვითალო-ნაცრისფერია და კლდეს ისე ერწყმის, რომ სად
    მთავრდება ბუნებრივი და სად იწყება ნაშენი, ყოველთვის მკაფიო არ არის.


    მთავარი, რისთვისაც აქ ადიან, ხედია: ჩრდილოეთით მთელი ალაზნის ვაკე, მის იქით კავკასიონის ქედი, სამხრეთით
    კი უკვე ნახევრადუდაბნო, რომელიც ვაშლოვანისკენ მიდის. ეს ორი სრულიად სხვადასხვა საქართველოა და ორივე
    ერთი წერტილიდან ჩანს.
  tip: >-
    ასვლა 25-35 წუთია, ბილიკი ციცაბოა და ხრეშზე სრიალებს — კარგი ფეხსაცმელი აუცილებელია, ჯვრები და მოაჯირები
    არ არის. ქარიანია თითქმის ყოველთვის. ზაფხულში მხოლოდ დილით ან საღამოს ადი: შუადღისას აქ 38 გრადუსია
    და ჩრდილი არ არსებობს. წყალი თან წაიღე. ბილეთი და ჯიხური არ არის; ქვემოთ პატარა მოედანია მანქანისთვის.
    ერთნახევარი საათი ასვლა-ჩამოსვლას სავსებით ჰყოფნის.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით საგარეჯოზე, ბადიაურსა და წნორზე გავლით დედოფლისწყაროსკენ — 138
    კმ ასფალტი, ბოლო მონაკვეთი ვიწრო, მაგრამ მთლიანობაში კარგი. ქალაქიდან ჩრდილო-აღმოსავლეთით კიდევ ოთხიოდე
    კილომეტრი მიწისა და ხრეშის გზაა კლდის ძირამდე; მშრალ ამინდში ჩვეულებრივი მანქანაც გაივლის, წვიმის
    შემდეგ კი ჯობია მაღალი კლირენსი. საწვავი დედოფლისწყაროში აიღე.
en:
  name: Khornabuji Fortress
  short: >-
    A medieval fortress on a steep isolated rock near Dedoplistskaro, commanding the southern edge of
    the Alazani plain.
  body: >-
    **Khornabuji reads better from a distance than from close up,** which was rather the point of it.
    The fortress occupies a steep free-standing rock a few kilometres from Dedoplistskaro, at the southern
    edge of the Alazani plain, and from the flat farmland it is visible for tens of kilometres.


    Georgian sources name the site as one of the principal strongholds of Hereti, the historical province
    of the far east. The name appears from the 4th century, though most of the standing masonry is 10th
    to 12th century. Khornabuji controlled the route running south from the Alazani plain across the Iori
    plateau towards Shirvan — a trade corridor and an invasion corridor at the same time, which is why
    it changed hands so often.


    Locally the castle is called Queen Tamar's, but there is no documented connection to her. It is one
    of dozens of Georgian fortresses that have acquired the name over the centuries, and the guides who
    repeat it are passing on folklore rather than history.


    The ruins sit on two levels: lower walls with tower stubs, and an upper citadel holding a rock-cut
    water cistern and the footings of a small church. The stone is local, yellow-grey, and merges into
    the crag so completely that it is not always clear where the rock stops and the building starts.


    The reason to climb is the view. North lies the whole Alazani plain with the Caucasus wall behind
    it; south the ground turns to semi-desert running towards Vashlovani. Two entirely different countries,
    visible from one rock, and the border between them is more or less the line of this ridge.


    The climb is short, but it is the whole visit. There is no museum, no interpretation panel and no
    restoration; everything the site offers is either masonry or horizon, and half of it is horizon.
  tip: >-
    The climb takes 25 to 35 minutes on a steep path that slips on loose gravel. Good shoes are essential;
    there are no railings, chains or steps. It is almost always windy on the top. In summer come early
    or late — midday temperatures reach the high thirties and there is no shade anywhere on the rock.
    Carry water. There is no ticket, no kiosk and no guide, just a small clearing at the bottom where
    cars are left. An hour and a half covers the walk up and down comfortably.
  route: >-
    Take the Kakheti highway from Tbilisi via Sagarejo, Badiauri and Tsnori towards Dedoplistskaro — 138
    km of asphalt, narrow in the final section but sound throughout. From the town head north-east for
    about four kilometres on a dirt and gravel track to the base of the rock; an ordinary car manages
    this in dry weather, but after rain clearance matters and an SUV is the safer choice. Fuel up in Dedoplistskaro.
    Total 142 km, around two and a half hours.
ru:
  name: Крепость Хорнабуджи
  short: Средневековая крепость на крутой отдельно стоящей скале у Дедоплисцкаро, над южным краем Алазанской
    долины.
  body: >-
    **Хорнабуджи читается лучше издалека, чем вблизи,** и в этом, собственно, был замысел. Крепость занимает
    крутую отдельно стоящую скалу в нескольких километрах от Дедоплисцкаро, у южной кромки Алазанской
    долины, и с равнины видна за десятки километров.


    Грузинские источники называют это место одной из главных твердынь Эрети, исторической провинции крайнего
    востока. Имя встречается с IV века, хотя большая часть уцелевшей кладки относится к X-XII столетиям.
    Хорнабуджи держал дорогу, уходившую с Алазанской равнины на юг через Иорское плато к Ширвану, — торговый
    коридор и путь вторжений одновременно, отчего крепость так часто меняла хозяев.


    В народе замок называют Тамариным, но документальной связи с царицей Тамар нет. Это одна из десятков
    грузинских крепостей, получивших такое имя со временем, и гиды, повторяющие его, передают фольклор,
    а не историю.


    Руины расположены на двух уровнях: нижние стены с остатками башен и верхняя цитадель с вырубленной
    в скале цистерной и основанием небольшой церкви. Камень местный, жёлто-серый, и сливается со скалой
    настолько, что не всегда понятно, где кончается природа и начинается постройка.


    Подниматься сюда стоит ради вида. К северу лежит вся Алазанская долина, за ней стена Кавказа; к югу
    земля переходит в полупустыню, уходящую к Вашловани. Две совершенно разные страны, видимые с одной
    скалы, и граница между ними идёт примерно по этому гребню.
  tip: >-
    Подъём занимает 25-35 минут по крутой тропе, скользящей на сыпучем гравии. Нормальная обувь обязательна:
    перил, цепей и ступеней здесь нет. Наверху почти всегда ветрено. Летом идите рано утром или под вечер:
    днём под сорок, а тени на скале нет вовсе. Воду берите с собой. Билета, киоска и гида нет, внизу лишь
    небольшая площадка под машины. Полутора часов на подъём и спуск вполне достаточно.
  route: >-
    Из Тбилиси по кахетинской трассе через Сагареджо, Бадиаури и Цнори в сторону Дедоплисцкаро — 138 км
    асфальта, на последнем участке узкого, но в целом крепкого. От города на северо-восток около четырёх
    километров по грунтово-гравийной дороге до подножия скалы; в сухую погоду проедет обычная машина,
    после дождя важен клиренс, и внедорожник надёжнее. Заправляйтесь в Дедоплисцкаро. Всего 142 км, порядка
    двух с половиной часов.
fa:
  name: قلعهٔ خورنابوجی
  short: قلعه‌ای از سده‌های میانه بر صخره‌ای تند و منفرد نزدیک ددوپلیس‌تسقارو، مشرف بر کرانهٔ جنوبی دشت
    آلازانی.
  body: >-
    **خورنابوجی از دور بهتر خوانده می‌شود تا از نزدیک،** و هدف از ساختش هم دقیقاً همین بود. قلعه بر صخره‌ای
    تند و منفرد چند کیلومتری ددوپلیس‌تسقارو در لبهٔ جنوبی دشت آلازانی نشسته و از میان کشتزارهای هموار
    تا ده‌ها کیلومتر دیده می‌شود.


    منابع گرجی این محل را از دژهای اصلی هِرِتی، ایالت تاریخی شرق دور این سرزمین، شمرده‌اند. نام آن از
    سدهٔ چهارم دیده می‌شود، هرچند بیشتر بنّایی برجای‌مانده به سده‌های دهم تا دوازدهم تعلق دارد. خورنابوجی
    راهی را کنترل می‌کرد که از دشت آلازانی به جنوب و از فلات ایوری به سوی شروان می‌رفت؛ دالانی بازرگانی
    و در همان حال دالان لشکرکشی، و به همین سبب بارها دست به دست شد.


    مردم محل قلعه را «قلعهٔ ملکه تامار» می‌خوانند، اما پیوند مستندی با او در کار نیست. این یکی از ده‌ها
    قلعهٔ گرجی است که در گذر زمان این نام را گرفته‌اند، و راهنمایانی که آن را تکرار می‌کنند فرهنگ عامه
    را نقل می‌کنند نه تاریخ را.


    ویرانه‌ها بر دو تراز قرار دارند: دیوارهای پایینی با بازمانده‌های برج، و ارگ بالایی با آب‌انباری کنده‌شده
    در سنگ و پی یک کلیسای کوچک. سنگ محلی و زرد-خاکستری است و چنان در صخره حل می‌شود که همیشه روشن نیست
    کجا طبیعت تمام و ساختمان آغاز می‌شود.


    دلیل بالا رفتن، منظره است. در شمال تمام دشت آلازانی است و پشت آن دیوارهٔ قفقاز؛ در جنوب زمین به نیمه‌بیابانی
    بدل می‌شود که تا واشلوانی می‌رود. دو کشور کاملاً متفاوت، دیده‌شده از یک صخره، و مرزشان کمابیش همین
    یال است.
  tip: >-
    صعود 25 تا 35 دقیقه طول می‌کشد و مسیر تند است و روی شن سست می‌لغزد. کفش خوب ضروری است؛ نه نرده هست،
    نه زنجیر و نه پله. بالای صخره تقریباً همیشه باد می‌آید. در تابستان صبح زود یا آخر روز بروید: دمای
    نیمروز به نزدیک چهل می‌رسد و هیچ سایه‌ای روی صخره نیست. آب همراه ببرید. بلیت و دکه و راهنما نیست،
    فقط محوطه‌ای کوچک در پایین برای گذاشتن خودرو. یک ساعت و نیم برای رفت و برگشت پیاده کافی است.
  route: >-
    از تفلیس بزرگراه کاختی را از ساگارجو و بادیااوری و تسنوری به سوی ددوپلیس‌تسقارو بگیرید؛ 138 کیلومتر
    آسفالت که در بخش پایانی باریک اما در مجموع سالم است. از شهر حدود چهار کیلومتر به شمال شرق روی راهی
    خاکی و شنی تا پای صخره بروید؛ در هوای خشک خودروی معمولی از پس آن برمی‌آید، اما پس از باران ارتفاع
    خودرو اهمیت دارد و شاسی‌بلند مطمئن‌تر است. باک را در ددوپلیس‌تسقارو پر کنید. جمعاً 142 کیلومتر و حدود
    دو ساعت و نیم.
he:
  name: מבצר חורנבוג'י
  short: מבצר ימי-ביניימי על סלע תלול ומבודד ליד דדופליסצקארו, השולט על שולי מישור האלאזני מדרום.
  body: >-
    **חורנבוג'י נקרא טוב יותר מרחוק מאשר מקרוב,** וזו בדיוק הייתה הכוונה. המבצר תופס סלע תלול ועומד לעצמו
    כמה קילומטרים מדדופליסצקארו, בקצה הדרומי של מישור האלאזני, ומן השדות המישוריים אפשר לראותו עשרות קילומטרים.


    מקורות גאורגיים מונים את האתר בין המעוזים המרכזיים של הרתי, המחוז ההיסטורי במזרח הרחוק. השם מופיע
    כבר מן המאה הרביעית, אף שרוב הבנייה שנותרה היא מן המאות העשירית עד השתים-עשרה. חורנבוג'י שלט על הדרך
    שירדה ממישור האלאזני דרומה, מעל רמת היורי לכיוון שירוואן — פרוזדור מסחר ופרוזדור פלישה גם יחד, ולכן
    החליף ידיים כה הרבה פעמים.


    בפי המקומיים זהו מבצרה של המלכה תמר, אך אין לכך תיעוד. זהו אחד מעשרות מבצרים גאורגיים שקיבלו את השם
    הזה עם השנים, והמדריכים החוזרים עליו מוסרים פולקלור ולא היסטוריה.


    ההריסות פרושות בשתי רמות: חומות תחתונות עם גדמי מגדלים, ומצודה עליונה ובה בור מים חצוב ויסודות של
    כנסייה קטנה. האבן מקומית, צהובה-אפורה, ומתמזגת בצוק עד שלא תמיד ברור היכן נגמר הטבע ומתחיל הבניין.


    הסיבה לטפס היא הנוף. בצפון משתרע מישור האלאזני כולו ומאחוריו חומת הקווקז; בדרום הקרקע הופכת למדבר
    למחצה שנמשך לעבר וושלובני. שתי ארצות שונות לחלוטין, נראות מסלע אחד, והגבול ביניהן עובר פחות או יותר
    לאורך הרכס הזה.
  tip: >-
    הטיפוס אורך 25 עד 35 דקות בשביל תלול שמחליק על חצץ תחוח. נעליים טובות הן הכרח; אין מעקות, שרשראות
    או מדרגות. כמעט תמיד נושבת רוח למעלה. בקיץ הגיעו מוקדם או מאוחר, בצהריים הטמפרטורה מתקרבת לארבעים
    ואין צל בשום מקום על הסלע. הביאו מים. אין כרטיס, אין דוכן ואין מדריך, רק מגרש קטן למטה שבו משאירים
    רכב. שעה וחצי מספיקה בנוחות לעלייה ולירידה.
  route: >-
    סעו מטביליסי בכביש קחתי דרך סגרג'ו, באדיאורי וצנורי לכיוון דדופליסצקארו — 138 ק״מ אספלט, צר בקטע האחרון
    אך תקין לכל אורכו. מהעיירה המשיכו צפונה-מזרחה כארבעה קילומטרים בדרך עפר וחצץ עד למרגלות הסלע; במזג
    אוויר יבש רכב רגיל מסתדר, אך אחרי גשם מרווח הגחון קובע ורכב שטח בטוח יותר. תדלקו בדדופליסצקארו. בסך
    הכול 142 ק״מ, כשעתיים וחצי.
ar:
  name: قلعة خورنابوجي
  short: قلعة من العصور الوسطى على صخرة منفردة شديدة الانحدار قرب ددوبليستسقارو، تشرف على الطرف الجنوبي
    لسهل ألازاني.
  body: >-
    **تُقرأ خورنابوجي من بعيد أفضل مما تُقرأ من قريب،** وهذا كان مقصد بنائها أصلاً. تحتل القلعة صخرة منفردة
    شديدة الانحدار على بعد كيلومترات من ددوبليستسقارو، عند الطرف الجنوبي لسهل ألازاني، وتُرى من الحقول
    المستوية على مدى عشرات الكيلومترات.


    تسمّي المصادر الجورجية هذا الموقع من المعاقل الرئيسية لهيريتي، الإقليم التاريخي في أقصى الشرق. ويرد
    الاسم منذ القرن الرابع، وإن كان معظم البناء القائم من القرن العاشر إلى الثاني عشر. كانت خورنابوجي
    تتحكم في الطريق النازل من سهل ألازاني جنوباً عبر هضبة إيوري نحو شروان، وهو ممر تجارة وممر غزو في آن
    واحد، ولهذا تبدّل أصحابها مراراً.


    ويسميها الأهالي قلعة الملكة تامار، لكن لا صلة موثقة بها. فهي واحدة من عشرات القلاع الجورجية التي اكتسبت
    هذا الاسم مع الزمن، والمرشدون الذين يرددونه ينقلون فولكلوراً لا تاريخاً.


    والأنقاض على مستويين: أسوار سفلى ببقايا أبراج، وقلعة عليا فيها صهريج منحوت في الصخر وأساسات كنيسة
    صغيرة. والحجر محلي أصفر رمادي يمتزج بالصخرة حتى لا يتضح دائماً أين تنتهي الطبيعة ويبدأ البناء.


    وسبب الصعود هو المشهد. في الشمال يمتد سهل ألازاني كله ووراءه جدار القوقاز؛ وفي الجنوب تتحول الأرض
    إلى شبه صحراء تمضي نحو فاشلوفاني. بلدان مختلفان تماماً يُريان من صخرة واحدة، والحد بينهما يمر تقريباً
    على هذا الحيد.
  tip: >-
    يستغرق الصعود من 25 إلى 35 دقيقة في درب حاد ينزلق على حصى مفكك. والحذاء الجيد ضرورة؛ فلا درابزين ولا
    سلاسل ولا درجات. والريح تهب في الأعلى في معظم الأوقات. وفي الصيف اصعد باكراً أو في آخر النهار: فحرارة
    الظهيرة تقارب الأربعين ولا ظل على الصخرة إطلاقاً. احمل ماءك. ولا تذكرة ولا كشك ولا مرشد، بل ساحة صغيرة
    في الأسفل تُترك فيها السيارات. وساعة ونصف تكفي للصعود والنزول براحة.
  route: >-
    اسلك من تبليسي طريق كاخيتي عبر ساغاريجو وباديااوري وتسنوري نحو ددوبليستسقارو، 138 كم من الإسفلت، ضيق
    في مقطعه الأخير لكنه سليم عموماً. ومن البلدة اتجه شمالاً شرقاً نحو أربعة كيلومترات على مسلك ترابي
    حصوي حتى سفح الصخرة؛ تتدبره سيارة عادية في الجو الجاف، أما بعد المطر فالارتفاع عن الأرض مهم وسيارة
    الدفع الرباعي أضمن. زوّد الوقود في ددوبليستسقارو. المجموع 142 كم ونحو ساعتين ونصف.
