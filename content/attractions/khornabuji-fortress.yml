ka:
  name: ხორნაბუჯის ციხე
  short: >-
    ციხის ნანგრევები განმარტოებულ ღია ნაცრისფერ კლდეზე დედოფლისწყაროს თავზე, სადაც V საუკუნეში ვახტანგ
    გორგასალმა ეპისკოპოსი დასვა.
  body: >-
    **ველიდან ხორნაბუჯი აშენებულს კი არა, ამოზრდილს ჰგავს: ღია ნაცრისფერი კლდეები და მათ დამსხვრეულ თხემზე
    კედლებისა და კოშკების ნაშთები, ისე ფერში ჩამჯდარი, რომ კლდე და ნაშენი ერთ სილუეტად იკვრება.**


    ქართული საზომითაც ძველი ციხეა. პირველი სიმაგრე აქ, სავარაუდოდ, ძველი წელთაღრიცხვის I ათასწლეულის ბოლოს
    აიგო, როცა ის ერთადერთი ციხე იყო, რომელიც ივრისა და ალაზნის ხეობებს აკონტროლებდა. წერილობითი ისტორია
    V საუკუნიდან, ვახტანგ გორგასლის მეფობიდან იწყება: ხორნაბუჯი მაშინ კახეთის ერთ-ერთი უდიდესი დასახლება
    იყო და მცხეთაში სვეტიცხოვლის აშენების შემდეგ მეფემ აქ ეპისკოპოსი დასვა.


    მისი ბედი საზღვრისპირა ქალაქის ბედი იყო. V საუკუნის ბოლოს ან VI-ის დასაწყისში სასანიანებმა აიღეს და
    ქალაქი დაანგრიეს, თუმცა კლდის ძირას, ვაკეზე, დასახლება თანდათან ისევ აღდგა. წყაროების ერთი წაკითხვით,
    დაახლოებით 1264 წელს ის ბერქა ყაენის მონღოლებმა გაანადგურეს და გადარჩენილები სიღნაღში გადასახლდნენ;
    სხვა ვერსიით, ქალაქი XVII საუკუნეში, შაჰ-აბასის შემოსევის შემდეგ დაცარიელდა. ასეა თუ ისე, ქალაქი აღარ
    დაბრუნებულა. ციხე კი დაბრუნდა: XVIII საუკუნეში ერეკლე II-მ აღადგინა, 1970-იანი წლების გათხრებმა კი
    მის ძირას, მინდვრების ქვეშ, დაკარგული ქალაქის კვალი გამოაჩინა.


    ხალხი მას დღესაც „თამარის ციხეს“ ეძახის. ზოგი წყაროს მიხედვით, XIII საუკუნეში ციხე თამარ მეფის ბრძანებით
    განაახლეს; სხვა ისტორიკოსები ფიქრობენ, რომ ეს ცნობა სხვა ციხეს ეხება. ასე რომ, სახელი უბრალო ლეგენდაზე
    მეტია, დამტკიცებულ ფაქტამდე კი ჯერ ვერ მისულა.


    ზემოთ ასვლა მოკლეა და ციცაბო. თხემზე ქვეყანა ორად იყოფა: ჩრდილოეთით ალაზნის ველი და, მოწმენდილ დღეს,
    კავკასიონის კედელი; სამხრეთით — მშრალი, გაშლილი ველები, რომლებიც ვაშლოვანისკენ მიიწევს. კედლის ძირას
    ორი საქართველო ხვდება ერთმანეთს, ციხე კი სწორედ ამ ნაკერის სადარაჯოდ აშენდა.
  tip: >-
    ასვლა-ჩამოსვლასა და დათვალიერებას საათნახევარი ეყოფა. ბილეთი და ჯიხური არ არის, ამიტომ წყალი თავად
    წამოიღეთ, ზაფხულში კი ქუდიც: კლდეზე ჩრდილი თითქმის არ არის, შუადღის სიცხე კი აქ მკაცრია. ბოლო აღმართი
    ფეხით უნდა გაიაროთ და ადგილ-ადგილ ციცაბოა — ფეხსაცმელი კარგად მოჭიდებული ძირით ჩაიცვით და ბავშვებს
    კლდის კიდესთან ხელიდან ნუ გაუშვებთ. საუკეთესო დრო გვიანი ნაშუადღევია, როცა ღია ფერის ქვა თბილ ელფერს
    იღებს და ველი გრძელი სინათლით ივსება. არწივის ხეობა სულ რაღაც 3,5 კილომეტრშია და ერთ გასვლაში ორივე
    ბუნებრივად ეტევა; მაღაზიები და საჭმელი დედოფლისწყაროშია.
  route: >-
    თბილისიდან აღმოსავლეთით ს5 კახეთის გზატკეცილით საგარეჯოს გავლით იარეთ; დაახლოებით 90 კილომეტრის შემდეგ
    შ40-ზე სიღნაღისკენ გადაუხვიეთ, შემდეგ შ41-ით, ბოდბის გავლით, სამხრეთ-აღმოსავლეთით გააგრძელეთ, სანამ
    შ39-ს არ შეუერთდებით, რომელიც დედოფლისწყაროში შეგიყვანთ. აქამდე ყველაფერი ასფალტია. ქალაქის ჩრდილოეთ
    კიდიდან კლდის ძირამდე დაახლოებით ორკილომეტრიანი გრუნტისა და ხრეშის გზაა — ცენტრიდან თხუთმეტიოდე წუთი.
    სულ დაახლოებით 133 კმ, გაითვალისწინეთ ორი საათი და ოცდათხუთმეტი წუთი. ამ მონაკვეთისთვის, განსაკუთრებით
    წვიმის შემდეგ, უმჯობესია მაღალი კლირენსის მანქანა (SUV). საწვავი დედოფლისწყაროში შეავსეთ.
en:
  name: Khornabuji Fortress
  short: >-
    Ruined walls on a lone pale-grey crag above Dedoplistskaro, where a 5th-century king seated a bishop
    and the plain gives way to steppe.
  body: >-
    **From the plain, Khornabuji looks grown rather than built: cliffs of pale grey rock, and on their
    broken crest a line of walls and tower stumps so close in colour to the rock that the two make one
    silhouette.**


    It is old even by Georgian standards. The first stronghold here was probably raised at the end of
    the 1st millennium BC, when it was the only fortification commanding the valleys of the Iori and the
    Alazani. The written record begins in the 5th century with King Vakhtang Gorgasali: Khornabuji was
    then one of the largest settlements in Kakheti, and after building Svetitskhoveli in Mtskheta the
    king appointed a bishop here.


    Its fortunes were those of a frontier town. In the late 5th or early 6th century the Sasanians took
    it and destroyed the town, which slowly grew back on the flat ground below. One reading of the sources
    has Mongols under Berke Khan ruining it again around 1264, with the survivors moving to Sighnaghi;
    another blames the 17th-century invasion of Shah Abbas. Either way, the town never came back. The
    castle did: Erekle II rebuilt it in the 18th century, and excavations in the 1970s found the lost
    settlement beneath the fields at its foot.


    Locals still call it Tamar's Fortress. Some sources say the queen ordered it rebuilt in the 13th century;
    other historians think that record describes a different castle. The name is more than folklore, then,
    but not yet proven fact.


    The climb is short and steep. At the top the country splits in two: to the north the Alazani plain
    and, on a clear day, the wall of the Caucasus; to the south open, dry steppe running on towards Vashlovani.
    Two Georgias meet below these walls, and the fortress was built to watch the seam.
  tip: >-
    Allow an hour and a half. There is no ticket and no kiosk, so bring water and, in summer, a hat: the
    crag has almost no shade and the midday heat here is fierce. The last stretch is on foot and steep
    in places, so wear shoes with good grip and keep children close near the edges. Come in the late afternoon,
    when the pale rock warms in colour and long light fills the plain. Artsivi (Eagle) Gorge is only about
    3.5 km away and pairs naturally with the visit; Dedoplistskaro has shops and food.
  route: >-
    Leave Tbilisi eastwards on the S5 Kakheti highway past Sagarejo. After roughly 90 km turn onto the
    Sh40 for Sighnaghi, then follow the Sh41 south-east via Bodbe until it joins the Sh39, which brings
    you into Dedoplistskaro. All of this is asphalt. From the northern edge of town a dirt-and-gravel
    track of about 2 km leads to the foot of the crag, some fifteen minutes from the centre. Total about
    133 km; allow 2 hours 35 minutes. An SUV is the comfortable choice for the track, especially after
    rain. Fill up in Dedoplistskaro.
ru:
  name: Хорнабуджская крепость
  short: >-
    Развалины стен на одинокой светло-серой скале над Дедоплисцкаро, где царь V века посадил епископа
    и равнина переходит в степь.
  body: >-
    **С равнины Хорнабуджи кажется не построенной, а выросшей: светло-серые скалы, а на их изломанном
    гребне — линия стен и обломков башен, настолько близких по цвету к камню, что вместе они образуют
    один силуэт.**


    Она древняя даже по грузинским меркам. Первое укрепление здесь, вероятно, возникло в конце I тысячелетия
    до н. э., когда оно единственное контролировало долины Иори и Алазани. Письменные свидетельства начинаются
    в V веке с царя Вахтанга Горгасали: тогда Хорнабуджи был одним из крупнейших поселений Кахетии, и
    после строительства Светицховели в Мцхете царь назначил здесь епископа.


    Её судьба была судьбой города на границе. В конце V или начале VI века Хорнабуджи взяли и разрушили
    Сасаниды, и город медленно вырос заново на равнине у подножия скалы. По одной из версий источников,
    монголы под предводительством Берке-хана разрушили его снова около 1264 года, и уцелевшие переселились
    в Сигнахи; по другой версии виновником было вторжение шаха Аббаса в XVII веке. В любом случае город
    так и не возродился. Крепость же вернулась: Ираклий II восстановил её в XVIII веке, а раскопки 1970-х
    годов обнаружили утраченное поселение под полями у её подножия.


    Местные до сих пор называют её крепостью Тамар. По одним сведениям, царица приказала перестроить её
    в XIII веке; другие историки полагают, что речь идёт о другой крепости. Так что имя — больше, чем
    фольклор, но пока не доказанный факт.


    Подъём короток и крут. На вершине страна разделяется на две части: на севере — Алазанская равнина
    и, в ясный день, стена Кавказа; на юге — открытая сухая степь, тянущаяся к Вашловани. Две Грузии встречаются
    под этими стенами, и крепость была построена, чтобы следить за этим швом.
  tip: >-
    Отведите на всё полтора часа. Здесь нет ни кассы, ни киоска, так что возьмите воду, а летом — шляпу:
    на скале почти нет тени, а полуденный жар здесь суровый. Последний отрезок пути пешком и местами крут,
    так что наденьте обувь с хорошим сцеплением и держите детей подальше от краёв. Приезжайте под вечер,
    когда светлый камень теплеет в цвете и долгий свет заливает равнину. Ущелье Арциви (Орлиное) — всего
    в 3,5 км, и его стоит посетить вместе; в Дедоплисцкаро есть магазины и еда.
  route: >-
    Выезжайте из Тбилиси на восток по кахетинской трассе S5 через Сагареджо. Примерно через 90 км сверните
    на Sh40 в сторону Сигнахи, затем следуйте по Sh41 на юго-восток через Бодбе, пока она не соединится
    с Sh39, которая приведёт вас в Дедоплисцкаро. Всё это — асфальт. От северной окраины города грунтово-гравийная
    дорога длиной около 2 км ведёт к подножию скалы, минут пятнадцать от центра. Всего около 133 км; отведите
    2 часа 35 минут. Внедорожник — удобный выбор для этого участка, особенно после дождя. Заправляйтесь
    в Дедоплисцкаро.
fa:
  name: دژ خورنابوجی
  short: >-
    دیوارهای ویران بر صخره‌ای تنها و خاکستری‌روشن، بالای دِدوپلیستسکارو، جایی که پادشاهی از سدهٔ پنجم
    اسقفی نشاند و دشت به استپ می‌پیوندد.
  body: >-
    **از دشت، خورنابوجی چون چیزی روییده به نظر می‌رسد تا ساخته‌شده: صخره‌های خاکستری‌روشن، و بر تاج شکستهٔ
    آن‌ها، ردیفی از دیوارها و بازماندهٔ برج‌ها که به‌قدری هم‌رنگ سنگ‌اند که این دو در یک نیم‌رخ یکی می‌شوند.**


    حتی به معیارهای گرجی نیز کهن است. نخستین دژ در این‌جا احتمالاً در پایان هزارهٔ نخست پیش از میلاد برافراشته
    شد، هنگامی که این‌جا یگانه استحکامی بود که بر دره‌های ایوری و آلازانی فرمان می‌راند. سند نوشتاری با
    پادشاه واختانگ گورگاسالی در سدهٔ پنجم آغاز می‌شود: در آن زمان خورنابوجی یکی از بزرگ‌ترین سکونتگاه‌های
    کاختی بود، و پس از ساخت سوِتیتسخووِلی در متسخِتا، پادشاه اسقفی در این‌جا نشاند.


    سرگذشتش سرگذشت شهری مرزی بود. در اواخر سدهٔ پنجم یا آغاز سدهٔ ششم، ساسانیان آن را گرفتند و شهر را
    ویران کردند؛ شهر به‌آهستگی بر زمین هموار پای صخره دوباره پا گرفت. یک روایت از منابع می‌گوید مغولان
    به فرماندهی برکه‌خان آن را بار دیگر حدود سال ۱۲۶۴ ویران کردند، و بازماندگان به سیقناقی کوچیدند؛ روایت
    دیگر تقصیر را به گردن هجوم شاه‌عباس در سدهٔ هفدهم می‌نهد. به هر روی، شهر هرگز بازنگشت. اما دژ بازگشت:
    ارکله دوم آن را در سدهٔ هجدهم بازساخت، و کاوش‌های دههٔ ۱۹۷۰ سکونتگاه گمشده را زیر کشتزارهای پای دژ
    یافت.


    مردم محلی هنوز آن را دژ تامار می‌نامند. برخی منابع می‌گویند ملکه فرمان بازسازی آن را در سدهٔ سیزدهم
    داد؛ برخی تاریخ‌نگاران دیگر بر این باورند که آن سند دژی دیگر را وصف می‌کند. پس این نام بیش از افسانه
    است، اما هنوز واقعیتی اثبات‌شده نیست.


    صعود کوتاه و تند است. بر فراز، سرزمین به دو نیم می‌شود: در شمال، دشت آلازانی و، در روزی صاف، دیوار
    قفقاز؛ در جنوب، استپ خشک و گشوده که به سوی واشلووانی می‌رود. دو گرجستان زیر این دیوارها به هم می‌رسند،
    و دژ برای دیده‌بانی این درز ساخته شده بود.
  tip: >-
    یک ساعت و نیم زمان بگذارید. نه بلیتی هست و نه غرفه‌ای، پس آب همراه ببرید و در تابستان کلاهی بردارید:
    صخره تقریباً هیچ سایه‌ای ندارد و گرمای نیم‌روز این‌جا سخت است. آخرین بخش راه پیاده است و جای‌جای تند،
    پس کفشی با کفِ آج‌دار بپوشید و نزدیک لبه‌ها کودکان را کنار خود نگه دارید. اواخر بعدازظهر بیایید، هنگامی
    که رنگ سنگِ روشن گرم می‌شود و نور مایلِ عصر دشت را پر می‌کند. تنگهٔ آرتسیوی (عقاب) تنها ۳٫۵ کیلومتر
    دورتر است و به‌طور طبیعی با این بازدید همراه می‌شود؛ دِدوپلیستسکارو مغازه و غذا دارد.
  route: >-
    از تفلیس به سوی شرق، بر بزرگراه کاختی S5 از ساگارجو بگذرید. پس از حدود ۹۰ کیلومتر به Sh40 به سوی سیقناقی
    بپیچید، سپس Sh41 را به جنوب‌شرق از بودبه بگیرید تا به Sh39 برسد، که شما را به دِدوپلیستسکارو می‌برد.
    همهٔ این راه آسفالت است. از حاشیهٔ شمالی شهر، راهی خاکی-سنگریزه‌ای به طول حدود ۲ کیلومتر تا پای صخره
    می‌رود، حدود پانزده دقیقه از مرکز. مسافت کل حدود ۱۳۳ کیلومتر؛ ۲ ساعت و ۳۵ دقیقه زمان بگذارید. برای
    این مسیر، خودرویی شاسی‌بلند گزینهٔ راحت‌تری است، به‌ویژه پس از باران. سوخت‌گیری در دِدوپلیستسکارو.
he:
  name: מצודת חורנבוג'י
  short: חומות חרבות על צוק בודד של סלע אפור-בהיר מעל דדופליסצקרו, שם מלך מהמאה ה-5 הושיב בישוף והמישור
    נהפך לערבה.
  body: >-
    **מהמישור, חורנבוג'י נראית כאילו צמחה ולא נבנתה: מצוקים של סלע אפור-בהיר, ועל רכסם השבור שורת חומות
    וגדמי מגדלים כה קרובים בצבעם לסלע ששניהם מתמזגים לצללית אחת.**


    היא עתיקה אף לפי קני המידה הגאורגיים. המצודה הראשונה כאן הוקמה כנראה בשלהי האלף הראשון לפני הספירה,
    כשהייתה הביצור היחיד ששלט בעמקי האיורי והאלאזני. התיעוד הכתוב נפתח במאה ה-5 עם המלך וחטנג גורגסלי:
    חורנבוג'י הייתה אז אחד היישובים הגדולים ביותר בקאחתי, ולאחר בניית סווטיצחובלי במצחתה מינה המלך בישוף
    כאן.


    גורלה היה גורל של עיר גבול. בשלהי המאה ה-5 או תחילת ה-6 כבשו אותה הסאסאנים והחריבו את העיר, שגדלה
    מחדש באיטיות על הקרקע השטוחה למרגלותיה. לפי קריאה אחת של המקורות, מונגולים בפיקוד בֶּרְקֶה חאן החריבו
    אותה שוב בסביבות 1264, והשורדים עברו לסיגנאגי; קריאה אחרת מטילה את האשמה על פלישת השאה עבאס במאה ה-17.
    בכל מקרה, העיר לא חזרה לתחייה. המצודה חזרה: אירקלה השני שיחזר אותה במאה ה-18, וחפירות בשנות ה-70 מצאו
    את היישוב האבוד מתחת לשדות למרגלותיה.


    המקומיים עדיין קוראים לה “מצודת תמר”. מקורות מסוימים אומרים שהמלכה הורתה לשחזרה במאה ה-13; היסטוריונים
    אחרים חושבים שהתיעוד ההוא מתאר מצודה אחרת. השם, אם כך, יותר מפולקלור, אך עדיין אינו עובדה מוכחת.


    העלייה קצרה ותלולה. בפסגה הארץ מתפצלת לשתיים: בצפון מישור האלאזני, וביום בהיר, חומת הקווקז; בדרום
    ערבה יבשה ופתוחה הנמשכת לעבר ושלובני. שתי גאורגיות נפגשות מתחת לחומות הללו, והמצודה נבנתה כדי לשמור
    על התפר.
  tip: >-
    הקדישו שעה וחצי. אין כרטיסים ואין קיוסק, אז הביאו מים ובקיץ — כובע: לצוק אין כמעט צל וחום הצהריים
    כאן קשה. הקטע האחרון הוא ברגל ותלול במקומות, אז נעלו נעליים עם אחיזה טובה והשגיחו על הילדים קרוב לקצוות.
    בואו אחר הצהריים המאוחרים, כשהסלע הבהיר מתחמם בצבעו ואור ארוך ממלא את המישור. גיא הנשרים (ארצווי)
    נמצא רק כ-3.5 ק"מ משם ומשתלב באופן טבעי בביקור; דדופליסצקרו מציעה חנויות ואוכל.
  route: >-
    צאו מטביליסי מזרחה בכביש קאחתי S5 דרך סאגארג'ו. לאחר כ-90 ק"מ פנו לדרך Sh40 לסיגנאגי, ואז המשיכו ב-Sh41
    דרום-מזרחה דרך בודבה עד שהיא מתחברת ל-Sh39, שמובילה אתכם לדדופליסצקרו. כל זה אספלט. מהקצה הצפוני של
    העיר, שביל עפר-וחצץ בן כ-2 ק"מ מוביל למרגלות הצוק, כרבע שעה מהמרכז. בסך הכול כ-133 ק"מ; הקדישו 2 שעות
    ו-35 דקות. רכב שטח הוא הבחירה הנוחה עבור השביל, במיוחד לאחר גשם. תדלקו בדדופליסצקרו.
ar:
  name: قلعة خورنابوجي
  short: >-
    أسوار متهدمة على صخرة رمادية فاتحة منعزلة فوق ديدوبليستسكارو، حيث أقام ملك من القرن الخامس أسقفًا
    وينتهي السهل إلى السهب.
  body: >-
    **من السهل، تبدو خورنابوجي وكأنها نبتت لا بُنيت: منحدرات صخرية رمادية فاتحة، وعلى قمتها المتكسرة صف
    من الأسوار وجذوع الأبراج قريبة جدًا من لون الصخر بحيث يشكلان معًا ظلًا واحدًا.**


    إنها قديمة حتى بالمعايير الجورجية. أُقيم أول حصن هنا في الأرجح في نهاية الألفية الأولى قبل الميلاد،
    حين كان التحصينَ الوحيد المهيمن على واديي إيوري وألازاني. يبدأ السجل المكتوب في القرن الخامس مع الملك
    فاختانغ غورغاسالي: كانت خورنابوجي حينها من أكبر مستوطنات كاختي، وبعد بناء سفيتيتسخوفيلي في متسخيتا،
    عيّن الملك أسقفًا هنا.


    كان مصيرها مصير مدينة حدودية. في أواخر القرن الخامس أو أوائل السادس، استولى الساسانيون عليها ودمروا
    المدينة، التي نمت ببطء من جديد على الأرض المنبسطة عند سفحها. تفيد قراءة واحدة للمصادر بأن المغول بقيادة
    بركة خان دمروها مرة أخرى نحو عام 1264، وانتقل الناجون إلى سيغناغي؛ وتُلقي قراءة أخرى اللوم على غزو
    الشاه عباس في القرن السابع عشر. في الحالتين، لم تعد المدينة قط. لكن القلعة عادت: أعاد إريكله الثاني
    بناءها في القرن الثامن عشر، وعثرت حفريات السبعينيات على المستوطنة المفقودة تحت الحقول عند سفحها.


    لا يزال السكان المحليون يسمونها «قلعة تمار». تقول بعض المصادر إن الملكة أمرت بإعادة بنائها في القرن
    الثالث عشر؛ ويرى مؤرخون آخرون أن ذلك السجل يصف قلعة مختلفة. الاسم إذن أكثر من فولكلور، لكنه ليس حقيقة
    مثبتة بعد.


    التسلق قصير وحاد. عند القمة تنقسم البلاد إلى قسمين: في الشمال سهل ألازاني، وفي يوم صافٍ، جدار القوقاز؛
    في الجنوب سهب جاف ومفتوح يمتد نحو فاشلوفاني. تلتقي جورجيّتان تحت هذه الأسوار، وبُنيت القلعة لرصد هذا
    الخط الفاصل.
  tip: >-
    خصّص ساعة ونصف الساعة. لا توجد تذكرة أو كشك، فاحمل الماء وفي الصيف قبعة: الصخرة لا ظل فيها تقريبًا
    وحرارة الظهيرة هنا قاسية. المقطع الأخير سيرًا على الأقدام وحاد في أماكن، فارتدِ حذاءً جيد التماسك
    وأبقِ الأطفال بعيدًا عن الحواف. تعال في وقت متأخر من بعد الظهر، حين يدفأ لون الصخر الفاتح ويغمر ضوء
    المساء الممتد السهل. يقع وادي النسر (أرتسيفي) على بعد نحو 3.5 كم فقط ويُضمّ إلى الزيارة بسهولة؛ في
    ديدوبليستسكارو محلات وطعام.
  route: >-
    اخرج من تبليسي شرقًا على طريق كاختي السريع S5 متجاوزًا ساغاريجو. بعد نحو 90 كم انحرف إلى الطريق Sh40
    نحو سيغناغي، ثم اتبع الطريق Sh41 جنوب شرقًا عبر بودبه حتى يلتقي بالطريق Sh39، الذي يأخذك إلى ديدوبليستسكارو.
    كل هذا إسفلت. من الحافة الشمالية للبلدة، يمتد مسار من التراب والحصى طوله نحو 2 كم إلى سفح الصخرة،
    على بعد نحو ربع ساعة من المركز. المسافة الإجمالية نحو 133 كم؛ خصص ساعتين و35 دقيقة. السيارة ذات الدفع
    الرباعي هي الخيار المريح لهذا المسار، خاصة بعد المطر. تزود بالوقود في ديدوبليستسكارو.
