ka:
  name: შავი კლდის ტბა
  short: >-
    მყინვარული ტბა ლაგოდეხის ნაკრძალის თხემზე, 2600 მეტრზე, საქართველო-რუსეთის საზღვარზე — კახეთის ყველაზე
    სერიოზული ლაშქრობა.
  body: >-
    **შავი კლდის ტბამდე მანქანით ვერ მიხვალ — და სწორედ ეს არის მისი ხიბლი.** მყინვარული ტბა ლაგოდეხის
    ნაკრძალის თხემზე დევს, დაახლოებით 2600 მეტრზე, პირდაპირ საქართველოსა და რუსეთის (დაღესტნის) საზღვარზე;
    14 მეტრამდე სიღრმის ცივი წყალი ალპურ მდელოებს შორისაა ჩამჯდარი.


    ლაგოდეხის ნაკრძალი 1912 წელს დაარსდა და საქართველოში უძველესია. ტბამდე მისასვლელი მარკირებული წრიული
    ბილიკი დაახლოებით 38 კილომეტრია და სტანდარტულად 2-3 დღეს ითხოვს: პირველ დღეს დაახლოებით 1500 მეტრი
    აღმართია ტყეში, მეორეს — ალპური თხემი და ტბა, მესამეს — დაღმართი.


    რას გელოდება გზაზე:


    - **„მეტეოს“ თავშესაფარი** (16 საწოლი) და **დემიდოვის თავშესაფარი** — ლეიბებით, წყაროს წყლით

    - **კავკასიონის პანორამები** ალაზნის ველიდან დაღესტნის ქედებამდე

    - **მესაზღვრეების პოსტი** თხემზე, სადაც დოკუმენტს გიმოწმებენ


    სეზონი მოკლეა — ივნისის ბოლოდან ოქტომბრის დასაწყისამდე; დანარჩენ დროს თხემი თოვლშია.
  tip: >-
    ვიზიტორთა ცენტრში რეგისტრაცია სავალდებულოა, პასპორტი ან პირადობა თან უნდა გქონდეს — მარშრუტი სასაზღვრო
    ზოლში გადის და გზად მესაზღვრეები გიმოწმებენ. თავშესაფარში ღამისთევა დაახლოებით 20 ლარია, კარვით —
    5 ლარი, გადახდა წინასწარ ცენტრში. ცხენის დაქირავებაც შეიძლება ადგილობრივ გამყოლთან. საკვები მთლიანად
    შენ მიგაქვს; წყალი წყაროებზეა. ამინდი თხემზე წამში იცვლება — თბილი ფენები და საწვიმარი აუცილებელია.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (S5) გურჯაანისა და წნორის გავლით ლაგოდეხამდე 160 კილომეტრია, დაახლოებით
    ორი საათი და ორმოცი წუთი — გზა ბოლომდე ასფალტიანია. ბილიკის საწყისი წერტილი ლაგოდეხის ვიზიტორთა ცენტრია
    ქალაქის ზედა კიდეზე; მანქანას იქვე დატოვებ და შემდეგ ყველაფერი ფეხითაა. საწვავი გურჯაანში ან ლაგოდეხში
    აიღე. ტრეილჰედამდე ეკონომ-კლასის ავტომობილიც თავისუფლად აღწევს — მთაში მანქანა აღარ გჭირდება.
en:
  name: Black Rock Lake
  short: >-
    A glacial lake on the crest of the Lagodekhi reserve at 2,600 m, right on the Georgia-Russia border
    — Kakheti's most serious trek.
  body: >-
    **You cannot drive to Black Rock Lake — and that is precisely the point.** The glacial lake lies on
    the crest of the Lagodekhi reserve at around 2,600 m, straddling the border between Georgia and Russia's
    Dagestan; its cold water, up to 14 m deep, sits cupped in alpine meadow.


    Lagodekhi, founded in 1912, is Georgia's oldest nature reserve. The waymarked loop to the lake runs
    about 38 km and normally takes 2-3 days: day one is a roughly 1,500 m climb through beech forest,
    day two crosses the alpine crest to the lake, day three brings you back down.


    What the trail serves up:


    - **The Meteo shelter** (16 bunks) and the newer **Demidovi shelter** — mattresses provided, spring
    water nearby

    - **Caucasus panoramas** sweeping from the Alazani valley to the ridges of Dagestan

    - **A border guard post** on the crest, where documents are checked


    The season is short — late June to early October; the rest of the year the crest is under snow. This
    is a genuine mountain trek, not a stroll: come fit, equipped and with a weather margin.
  tip: >-
    Registration at the Lagodekhi visitor centre is mandatory and you must carry your passport or ID —
    the route enters the border zone and guards will log you on the way. A shelter bunk costs about 20
    GEL per night, camping 5 GEL, paid in advance at the centre. Horses can be hired with a local guide.
    Carry all your food; springs supply water. Weather on the crest flips in minutes — warm layers and
    a rain shell are essential.
  route: >-
    From Tbilisi follow the Kakheti highway (S5) through Gurjaani and Tsnori to Lagodekhi — 160 km, about
    two hours forty, asphalt the whole way. The trailhead is the Lagodekhi visitor centre at the top edge
    of town; leave the car there, because from that point everything is on foot. Refuel in Gurjaani or
    Lagodekhi. An economy car reaches the trailhead without any trouble — in the mountains you will not
    need it.
ru:
  name: Озеро Чёрной Скалы
  short: >-
    Ледниковое озеро на гребне Лагодехского заповедника, 2600 м, прямо на границе с Россией — самый серьёзный
    трек Кахетии.
  body: >-
    **К озеру Чёрной Скалы нельзя подъехать на машине — и в этом весь смысл.** Ледниковое озеро лежит
    на гребне Лагодехского заповедника на высоте около 2600 м, прямо на границе Грузии и российского Дагестана;
    его холодная вода глубиной до 14 м покоится в чаше среди альпийских лугов.


    Лагодехи, основанный в 1912 году, — старейший заповедник Грузии. Маркированное кольцо к озеру тянется
    около 38 км и обычно занимает 2-3 дня: в первый день — подъём примерно на 1500 м через буковый лес,
    во второй — альпийский гребень и озеро, в третий — спуск.


    Что ждёт на маршруте:


    - **Приют Метео** (16 мест) и более новый **приют Демидови** — с матрасами и родниковой водой рядом

    - **Панорамы Кавказа** от Алазанской долины до хребтов Дагестана

    - **Пограничный пост** на гребне, где проверяют документы


    Сезон короткий — с конца июня до начала октября; остальное время гребень под снегом. Это настоящий
    горный трек, а не прогулка: нужны форма, снаряжение и запас по погоде.
  tip: >-
    Регистрация в визит-центре Лагодехи обязательна, паспорт или ID берите с собой — маршрут проходит
    по погранзоне, и по пути вас запишут пограничники. Место в приюте стоит около 20 лари за ночь, палатка
    — 5 лари, оплата заранее в центре. Можно нанять лошадей с местным проводником. Всю еду несёте сами;
    вода — из родников. Погода на гребне меняется за минуты: тёплые слои и дождевик обязательны.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) через Гурджаани и Цнори до Лагодехи — 160 км, примерно два часа
    сорок минут, асфальт на всём протяжении. Старт трека — визит-центр Лагодехи на верхней окраине города;
    машину оставляете там, дальше всё пешком. Заправляйтесь в Гурджаани или Лагодехи. До начала тропы
    спокойно доезжает машина эконом-класса — в горах она вам всё равно не понадобится.
fa:
  name: دریاچهٔ صخرهٔ سیاه
  short: دریاچه‌ای یخچالی بر ستیغ ذخیره‌گاه لاگودخی در 2600 متری، درست بر مرز گرجستان و روسیه — جدی‌ترین
    ترک کاختی.
  body: >-
    **به دریاچهٔ صخرهٔ سیاه با ماشین نمی‌رسید — و نکته دقیقاً همین است.** این دریاچهٔ یخچالی بر ستیغ ذخیره‌گاه
    لاگودخی در حدود 2600 متری قرار دارد، درست بر مرز گرجستان و داغستانِ روسیه؛ آب سردش با ژرفای تا 14
    متر در کاسه‌ای میان مرغزارهای آلپی نشسته است.


    لاگودخی، بنیان‌گذاری‌شده در 1912، کهن‌ترین ذخیره‌گاه طبیعی گرجستان است. حلقهٔ علامت‌گذاری‌شده تا دریاچه
    حدود 38 کیلومتر است و معمولاً 2 تا 3 روز می‌گیرد: روز نخست صعودی حدوداً 1500 متری در جنگل راش، روز
    دوم گذر از ستیغ آلپی تا دریاچه، و روز سوم فرود.


    مسیر چه دارد:


    - **پناهگاه متئو** (16 تخت) و **پناهگاه دمیدووی** نوتر — با تشک و چشمهٔ آب در نزدیکی

    - **پانورامای قفقاز** از درهٔ آلازانی تا خط‌الرأس‌های داغستان

    - **پست مرزبانی** بر ستیغ که مدارک را ثبت می‌کند


    فصل کوتاه است — از اواخر ژوئن تا اوایل اکتبر؛ باقی سال ستیغ زیر برف است. این یک ترک کوهستانی واقعی
    است، نه پیاده‌روی: آماده، مجهز و با حاشیهٔ امن هوا بیایید.
  tip: >-
    ثبت‌نام در مرکز بازدیدکنندگان لاگودخی اجباری است و گذرنامه یا کارت شناسایی همراهتان باشد — مسیر وارد
    نوار مرزی می‌شود و مرزبانان در راه نامتان را ثبت می‌کنند. تخت پناهگاه شبی حدود 20 لاری و چادر 5 لاری
    است؛ پرداخت پیشاپیش در مرکز. با راهنمای محلی اسب هم می‌توان کرایه کرد. همهٔ خوراک را خودتان می‌برید؛
    آب از چشمه‌هاست. هوای ستیغ در چند دقیقه برمی‌گردد — لایه‌های گرم و بارانی ضروری است.
  route: >-
    از تفلیس با بزرگراه کاختی (S5) از گورجاآنی و تسنوری تا لاگودخی — 160 کیلومتر، حدود دو ساعت و چهل دقیقه،
    سراسر آسفالت. نقطهٔ آغاز، مرکز بازدیدکنندگان لاگودخی در بالای شهر است؛ ماشین را همان‌جا بگذارید، چون
    از آنجا به بعد همه‌چیز پیاده است. در گورجاآنی یا لاگودخی سوخت بزنید. خودروی اقتصادی به‌راحتی به ابتدای
    مسیر می‌رسد — در کوه دیگر به ماشین نیازی نیست.
he:
  name: אגם הסלע השחור
  short: אגם קרחוני על רכס שמורת לגודחי בגובה 2,600 מ', ממש על גבול גאורגיה-רוסיה — הטרק הרציני ביותר
    של קחתי.
  body: >-
    **אל אגם הסלע השחור אי אפשר להגיע ברכב — וזו בדיוק הנקודה.** האגם הקרחוני שוכן על רכס שמורת לגודחי
    בגובה של כ-2,600 מ', רכוב על הגבול בין גאורגיה לדגסטן הרוסית; מימיו הקרים, בעומק של עד 14 מ', יושבים
    בקערה בין כרי דשא אלפיניים.


    לגודחי, שנוסדה ב-1912, היא שמורת הטבע הוותיקה בגאורגיה. המסלול המעגלי המסומן אל האגם משתרע על כ-38
    ק״מ ואורך בדרך כלל 2-3 ימים: ביום הראשון טיפוס של כ-1,500 מ' ביער אשור, בשני — חציית הרכס האלפיני
    אל האגם, בשלישי — הירידה.


    מה מחכה על המסלול:


    - **מקלט מטאו** (16 מיטות) ו**מקלט דמידובי** החדש יותר — עם מזרנים ומעיינות בקרבת מקום

    - **פנורמות קווקז** מעמק אלזאני ועד רכסי דגסטן

    - **עמדת משמר גבול** על הרכס, שם בודקים מסמכים


    העונה קצרה — מסוף יוני עד תחילת אוקטובר; בשאר השנה הרכס מכוסה שלג. זהו טרק הרים אמיתי ולא טיול: בואו
    בכושר, מצוידים ועם מרווח ביטחון למזג האוויר.
  tip: >-
    הרישום במרכז המבקרים של לגודחי חובה, וחייבים לשאת דרכון או תעודת זהות — המסלול נכנס לאזור הגבול, ומשמר
    הגבול ירשום אתכם בדרך. מיטה במקלט עולה כ-20 לארי ללילה, קמפינג 5 לארי, והתשלום מראש במרכז. אפשר לשכור
    סוסים עם מלווה מקומי. את כל האוכל סוחבים בעצמכם; מים יש במעיינות. מזג האוויר על הרכס מתהפך בדקות —
    שכבות חמות ומעיל גשם הכרחיים.
  route: >-
    מטביליסי בכביש קחתי (S5) דרך גורג'אני וצנורי עד לגודחי — 160 ק״מ, כשעתיים וארבעים דקות, אספלט לכל
    האורך. נקודת הזינוק היא מרכז המבקרים של לגודחי בקצה העליון של העיירה; משאירים שם את הרכב, ומשם הכול
    ברגל. תדלקו בגורג'אני או בלגודחי. רכב חסכוני מגיע לתחילת המסלול בלי שום בעיה — בהרים הוא ממילא לא
    יידרש.
ar:
  name: بحيرة الصخرة السوداء
  short: بحيرة جليدية على قمة محمية لاغوديخي عند 2600 متر، على حدود جورجيا وروسيا مباشرة — أجدّ رحلات
    كاخيتي الجبلية.
  body: >-
    **لا يمكنك بلوغ بحيرة الصخرة السوداء بالسيارة — وهذا هو المغزى بالضبط.** تقع البحيرة الجليدية على
    قمة محمية لاغوديخي عند نحو 2600 متر، ممتدة على الحدود بين جورجيا وداغستان الروسية؛ وماؤها البارد،
    بعمق يصل إلى 14 متراً، يستقر في حوض بين المروج الألبية.


    لاغوديخي، المؤسسة عام 1912، هي أقدم محمية طبيعية في جورجيا. المسار الدائري المعلَّم إلى البحيرة يمتد
    نحو 38 كيلومتراً ويستغرق عادة يومين إلى ثلاثة: اليوم الأول صعود نحو 1500 متر عبر غابات الزان، والثاني
    عبور القمم الألبية إلى البحيرة، والثالث النزول.


    ما ينتظرك على الدرب:


    - **مأوى ميتيو** (16 سريراً) و**مأوى ديميدوفي** الأحدث — بفرشات وينابيع ماء قريبة

    - **بانورامات القوقاز** من وادي ألازاني حتى سلاسل داغستان

    - **نقطة حرس الحدود** على القمة حيث تُفحص الوثائق


    الموسم قصير — من أواخر يونيو إلى أوائل أكتوبر؛ وبقية السنة تغطي الثلوج القمم. هذه رحلة جبلية حقيقية
    لا نزهة: تعال لائقاً ومجهزاً وباحتياط للطقس.
  tip: >-
    التسجيل في مركز زوار لاغوديخي إلزامي ويجب حمل جواز السفر أو الهوية — فالمسار يدخل المنطقة الحدودية
    وسيسجلك حرس الحدود في الطريق. سرير المأوى نحو 20 لاري لليلة والتخييم 5 لاري، والدفع مسبقاً في المركز.
    ويمكن استئجار خيول مع مرشد محلي. احمل طعامك كله؛ والماء من الينابيع. طقس القمم ينقلب في دقائق — الطبقات
    الدافئة ومعطف المطر ضروريان.
  route: >-
    من تبليسي عبر طريق كاخيتي السريع (S5) مروراً بغورجاني وتسنوري إلى لاغوديخي — 160 كم في نحو ساعتين
    وأربعين دقيقة، أسفلت على الامتداد كله. نقطة البداية مركز زوار لاغوديخي عند الطرف الأعلى للبلدة؛ اترك
    السيارة هناك، فمن تلك النقطة كل شيء سيراً على الأقدام. تزود بالوقود في غورجاني أو لاغوديخي. سيارة
    اقتصادية تبلغ بداية المسار بلا أي متاعب — وفي الجبال لن تحتاجها أصلاً.
