ka:
  name: შავი კლდეების ტბა (გრძელი ტბა)
  short: >-
    მყინვარული ტბა კავკასიონის თხემზე, დაახლოებით 2800 მეტრზე, დაღესტნის საზღვარზე — მხოლოდ ფეხით: 38-კილომეტრიანი
    წრე ქვეყნის უძველეს ნაკრძალში.
  body: >-
    **შავი კლდეების ტბამდე გზა არ მიდის: კავკასიონის თხემზე ჩამდგარ ამ ცივ წყალს მხოლოდ ორი-სამი დღის
    ფეხით სვლით მიაღწევთ.**


    რუკებზე მას გრძელი ტბა ან ხალახელი ჰქვია; „შავი კლდე“ იმ ბილიკის სახელია, რომელიც აქამდე ამოდის, და
    დროთა განმავლობაში წყალსაც შერჩა. ტბა მთავარ ქედზე, დაახლოებით 2800 მეტრზე წევს და მასზე საქართველოსა
    და რუსეთის ფედერაციის — დაღესტნის — საზღვარი გადის. სარკის ფართობი დაახლოებით 0,17 კვადრატული კილომეტრია,
    უდიდესი სიღრმე — 12 მეტრამდე; ტბა თოვლის, წვიმისა და მიწისქვეშა წყლით საზრდოობს.


    ბილიკი ლაგოდეხის დაცულ ტერიტორიებს ეკუთვნის — საქართველოს უძველეს ნაკრძალს. მისი სულიერი მამა ლუდვიკ
    მლოკოსევიჩი იყო, პოლონელი ოფიცერი, რომელიც 1850-იან წლებში ლაგოდეხის გარნიზონში მსახურობდა, ყაზარმასთან
    პარკი გააშენა, მოგვიანებით კი თითქმის ოცი წელი აქვე მეტყევედ იმუშავა. ხეობის დაცვის საკითხი მან პირველად
    1889 წელს დააყენა; ნაკრძალი 1912 წელს, მისი გარდაცვალებიდან სამი წლის შემდეგ გამოცხადდა. მის სახელს
    დღესაც ატარებს მლოკოსევიჩის იორდასალამი და კავკასიური როჭო.


    მონიშნული წრიული მარშრუტი დაახლოებით 38 კილომეტრია, ჯამში თითქმის 2900 მეტრის აღმართით. პირველი დღე
    წიფლნარში გაუთავებელი აღმართია; შემდეგ ღია ალპური თხემი იწყება, სადაც მესაზღვრეების კარავთან პასპორტს
    გიმოწმებენ. ღამეს „მეტეოსა“ და „დემიდოვოს“ თავშესაფრებში ათევენ. ნაკრძალი აღმოსავლეთკავკასიური ჯიხვის
    ერთ-ერთი მთავარი სამყოფელია, მოწმენდილ დილას კი ხედი ალაზნის ველიდან დაღესტნის ქედებამდე იშლება.


    საქართველოში ცოტა ადგილი მოიძებნება, სადაც ხედი ასე მთლიანად საკუთარი ოფლით უნდა დაიმსახუროთ. ასეთია
    აქაური პირობა — და ის სამართლიანია.
  tip: >-
    გასვლამდე დარეგისტრირდით ლაგოდეხის ვიზიტორთა ცენტრში, ქალაქის ზედა კიდეზე, იქვე შეიძინეთ ბილიკის რუკა
    და თან იქონიეთ პასპორტი ან პირადობის მოწმობა — მარშრუტი სასაზღვრო ზოლში შედის. თავშესაფარში ღამე ერთ
    კაცზე დაახლოებით 30 ლარი ღირს, კარვის ადგილი — 5 ლარი (მიმდინარე ფასი ცენტრში დააზუსტეთ); ლეიბები
    არის, საბნები — არა, ამიტომ საძილე ტომარა წაიღეთ. საკვები მთლიანად თქვენით მიგაქვთ. ბილიკზე წყაროები
    გვხვდება, მაგრამ ზაფხულის ბოლოს ზოგი შრება, ამიტომ წყალი ყოველ შესაძლებლობაზე შეავსეთ. თხემზე ამინდი
    წუთებში იცვლება: აგვისტოშიც კი თბილი ტანსაცმელი და საწვიმარი აუცილებელია.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) აღმოსავლეთით იარეთ — საგარეჯოსა და წნორის გავლით ლაგოდეხამდე,
    აზერბაიჯანის საზღვართან: დაახლოებით 160 კილომეტრი, 2 საათი და 40 წუთი, მთელ გზაზე ასფალტი. ბილიკის
    საწყისი ნაკრძალის ვიზიტორთა ცენტრია ქალაქის ზედა კიდეზე. მანქანა მთელი ლაშქრობის განმავლობაში იქ დარჩება,
    ამიტომ ადგილზევე იკითხეთ, სად დატოვოთ ის ორი-სამი ღამით უსაფრთხოდ. ბენზინგასამართი გზაზე ბევრია, ლაგოდეხშიც.
    ეკონომ კლასი სრულიად საკმარისია: ჭიშკრის იქით მხოლოდ ფეხით სავალი გზაა.
en:
  name: Black Rock Lake (Lake Grdzeli)
  short: >-
    A glacial lake on the Georgia–Dagestan crest at about 2,800 m, reached only on foot: a 38 km loop
    through Georgia's oldest nature reserve.
  body: >-
    **No road reaches Black Rock Lake: the only way to this cold sheet of water on the crest of the Caucasus
    is two or three days on foot.**


    Maps call it Lake Grdzeli, the "Long Lake", or Khala-Khel. Black Rock is the name of the trail that
    climbs to it, and over time the name has stuck to the water as well. The lake lies at about 2,800
    m on the main ridge, and the border between Georgia and Russia's Dagestan runs across it. Its surface
    covers some 0.17 km², it is up to 12 m deep, and it is fed by snow, rain and springs.


    The trail belongs to the Lagodekhi Protected Areas, Georgia's oldest reserve. Its founding spirit
    was Ludwik Młokosiewicz, a Polish officer posted to the Lagodekhi garrison in the 1850s, who planted
    a park beside the barracks and later spent nearly twenty years here as forester. He first asked for
    the valley to be protected in 1889; the reserve was declared in 1912, three years after his death.
    A peony and the Caucasian black grouse still carry his name.


    The waymarked loop runs about 38 km with close to 2,900 m of climbing. Day one is a relentless ascent
    through beech forest; then comes the open alpine crest, where border guards in a tent check passports.
    Nights are spent in the Meteo and Demidovo shelters. The reserve is one of the strongholds of the
    East Caucasian tur, and on a clear morning the view runs from the Alazani valley to the ridges of
    Dagestan.


    Few places in Georgia make you earn a view so completely. That is the whole bargain, and it is a fair
    one.
  tip: >-
    Register at the Lagodekhi visitor centre, at the top of town, before you set off; buy the trail map
    there and carry your passport or ID, because the route enters the border zone. Shelter bunks cost
    about 30 GEL per person per night and a tent pitch 5 GEL (confirm current prices at the centre). Mattresses
    are provided but blankets are not, so bring a sleeping bag. Carry all your food. Springs run along
    the trail, though some dry up by late summer, so refill whenever you can. On the crest the weather
    turns within minutes: pack warm layers and a rain shell, even in August.
  route: >-
    From Tbilisi follow the Kakheti Highway (S5) east through Sagarejo and Tsnori to Lagodekhi, close
    to the Azerbaijani border: about 160 km and 2 hours 40 minutes, asphalt all the way. The trailhead
    is the reserve's visitor centre at the upper edge of town. Your car will stay there for the whole
    trek, so ask on arrival where it can be left safely for two or three nights. Fuel stations are plentiful
    along the way, including in Lagodekhi. An economy car is all you need: beyond the gate, the only way
    on is on foot.
ru:
  name: Озеро Чёрных Скал (озеро Грдзели)
  short: >-
    Ледниковое озеро на гребне между Грузией и Дагестаном на высоте около 2800 м, доступное только пешком:
    38-километровая петля через старейший заповедник Грузии.
  body: >-
    **К озеру Чёрных Скал не ведёт ни одна дорога: единственный путь к этому холодному зеркалу воды на
    гребне Кавказа — два-три дня пешком.**


    На картах его называют озеро Грдзели, «Длинное озеро», или Хала-Хел. «Чёрные Скалы» — так называется
    тропа, что ведёт к нему, и со временем это название закрепилось и за самой водой. Озеро лежит на высоте
    около 2800 м на главном хребте, и по нему проходит граница между Грузией и российским Дагестаном.
    Его площадь — около 0,17 км², глубина до 12 м, питают его снег, дожди и родники.


    Тропа проходит по Лагодехским охраняемым территориям — старейшему заповеднику Грузии. Его вдохновителем
    был Людвик Млокосевич, польский офицер, служивший в лагодехском гарнизоне в 1850-х годах: он разбил
    парк у казарм, а позже почти двадцать лет прожил здесь лесником. В 1889 году он впервые попросил взять
    долину под охрану; заповедник был объявлен в 1912 году, через три года после его смерти. Его имя до
    сих пор носят пион и кавказский тетерев.


    Размеченная петля составляет около 38 км с почти 2900 м набора высоты. Первый день — бесконечный подъём
    через буковый лес; затем открывается альпийский гребень, где пограничники в палатке проверяют паспорта.
    Ночуют в приютах «Метео» и «Демидово». Заповедник — один из оплотов восточнокавказского тура, и в
    ясное утро вид простирается от долины Алазани до хребтов Дагестана.


    Мало где в Грузии вид приходится так честно заработать ногами. Таков здешний уговор — и он честный.
  tip: >-
    Зарегистрируйтесь в визит-центре Лагодехи, в верхней части города, перед выходом; там же купите карту
    маршрута и возьмите с собой паспорт или удостоверение личности, поскольку тропа заходит в пограничную
    зону. Ночёвка в приюте стоит около 30 лари с человека за ночь, место для палатки — 5 лари (уточните
    текущие цены в центре). Матрасы предоставляются, а одеяла нет, так что берите спальный мешок. Всю
    еду несите с собой. Вдоль тропы есть родники, хотя некоторые к концу лета высыхают, так что пополняйте
    запасы воды при любой возможности. На гребне погода меняется за считанные минуты: берите тёплые вещи
    и дождевик даже в августе.
  route: >-
    Из Тбилиси по Кахетинскому шоссе (S5) на восток через Сагареджо и Цнори до Лагодехи, у самой азербайджанской
    границы: около 160 км и 2 часа 40 минут, всё асфальт. Начало тропы — визит-центр заповедника у верхнего
    края города. Машина останется там на всё время похода, так что по приезде уточните, где её можно безопасно
    оставить на две-три ночи. Заправок по пути много, в том числе в Лагодехи. Обычной легковой машины
    достаточно: за воротами дальше можно двигаться только пешком.
fa:
  name: دریاچه‌ی صخره‌ی سیاه (دریاچه‌ی گِرْدزِلی)
  short: >-
    دریاچه‌ای یخچالی بر خط‌الرأس گرجستان-داغستان در ارتفاع حدود ۲٬۸۰۰ متری، تنها با پای پیاده در دسترس:
    حلقه‌ای ۳۸ کیلومتری از میان کهن‌ترین ذخیره‌گاه گرجستان.
  body: >-
    **هیچ راهی به دریاچه‌ی صخره‌ی سیاه نمی‌رسد: تنها راه رسیدن به این آینه‌ی آب سرد، بر خط‌الرأس قفقاز،
    دو یا سه روز پیاده‌روی است.**


    نقشه‌ها آن را دریاچه‌ی گِرْدزِلی، به‌معنای «دریاچه‌ی دراز»، یا خالا-خِل می‌خوانند. «صخره‌ی سیاه» نام
    مسیری است که به آن بالا می‌رود، و با گذر زمان همین نام به خودِ آب هم چسبیده است. دریاچه در ارتفاع
    حدود ۲٬۸۰۰ متری بر خط‌الرأس اصلی قرار دارد، و مرز میان گرجستان و داغستانِ روسیه از میان آن می‌گذرد.
    سطح آن نزدیک به ۰٫۱۷ کیلومترمربع است، ژرفای آن تا ۱۲ متر می‌رسد، و از برف، باران و چشمه‌ها تغذیه می‌شود.


    این مسیر به منطقه‌ی حفاظت‌شده‌ی لاگودخی، کهن‌ترین ذخیره‌گاه گرجستان، تعلق دارد. الهام‌بخش بنیان آن
    لودویک مووُکوشیویچ بود، افسری لهستانی که در دهه‌ی ۱۸۵۰ به پادگان لاگودخی گمارده شد؛ او پارکی کنار
    سربازخانه کاشت و بعدها نزدیک به بیست سال به‌عنوان جنگل‌بان در همین‌جا زیست. او در سال ۱۸۸۹ برای نخستین‌بار
    خواستار حفاظت از این دره شد؛ ذخیره‌گاه در سال ۱۹۱۲، سه سال پس از مرگ او، اعلام شد. گونه‌ای گل صدتومانی
    (پیونی) و سیاه‌خروس قفقازی هنوز نام او را بر خود دارند.


    حلقه‌ی علامت‌گذاری‌شده نزدیک به ۳۸ کیلومتر است با نزدیک به ۲٬۹۰۰ متر صعود. روز نخست صعودی بی‌وقفه
    از میان جنگل راش است؛ سپس خط‌الرأس آلپی باز می‌شود، جایی که مرزبانان در چادری گذرنامه‌ها را بازرسی
    می‌کنند. شب‌ها در پناهگاه‌های «متئو» و «دمیدوو» گذرانده می‌شود. این ذخیره‌گاه یکی از پناهگاه‌های اصلی
    تورِ قفقاز شرقی (بز کوهی داغستانی) است، و در بامدادی صاف، چشم‌انداز از دره‌ی آلازانی تا رشته‌های داغستان
    کشیده می‌شود.


    کمتر جایی در گرجستان چشم‌اندازش را این‌چنین تنها به بهای عرق و گام‌های شما می‌دهد. همه‌ی معامله همین
    است، و معامله‌ای منصفانه است.
  tip: >-
    پیش از حرکت در مرکز بازدیدکنندگان لاگودخی، در بالای شهر، ثبت‌نام کنید؛ نقشه‌ی مسیر را از همان‌جا بخرید
    و گذرنامه یا کارت شناسایی همراه داشته باشید، زیرا مسیر به منطقه‌ی مرزی وارد می‌شود. اقامت در پناهگاه
    نزدیک به ۳۰ لاری برای هر نفر در هر شب هزینه دارد و برپاکردن چادر ۵ لاری (قیمت‌های کنونی را در مرکز
    تأیید کنید). تشک فراهم است اما پتو نه، پس کیسه‌خواب همراه ببرید. تمام غذای خود را حمل کنید. چشمه‌هایی
    در طول مسیر جاری‌اند، هرچند برخی تا پایان تابستان خشک می‌شوند، پس هرگاه ممکن شد آب بردارید. بر خط‌الرأس
    آب‌وهوا در چند دقیقه تغییر می‌کند: لایه‌های گرم و بارانی همراه داشته باشید، حتی در اوت.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق از میان ساگارِجو و تسنوری تا لاگودخی، نزدیک مرز آذربایجان،
    بروید: نزدیک به ۱۶۰ کیلومتر و ۲ ساعت و ۴۰ دقیقه، همه آسفالته. سرآغاز مسیر، مرکز بازدیدکنندگان ذخیره‌گاه
    در لبه‌ی بالایی شهر است. خودروی شما تمام مدت پیمایش همان‌جا می‌ماند، پس هنگام ورود بپرسید کجا می‌توان
    آن را برای دو یا سه شب با امنیت گذاشت. پمپ بنزین در طول راه، از جمله در لاگودخی، فراوان است. خودروی
    اقتصادی کافی است: پس از دروازه، تنها راه ادامه، پای پیاده است.
he:
  name: אגם הסלע השחור (אגם גרדזלי)
  short: >-
    אגם קרחוני על הרכס שבין גאורגיה לדגסטן, בגובה כ-2,800 מטר, שאליו מגיעים רק ברגל: מעגל של 38 ק"מ בשמורת
    הטבע העתיקה ביותר בגאורגיה.
  body: >-
    **שום דרך לא מגיעה לאגם הסלע השחור: הדרך היחידה למראת המים הקרה הזאת על רכס הקווקז היא הליכה של יומיים
    או שלושה.**


    במפות קוראים לו אגם גרדזלי, "האגם הארוך", או חלה-חל. הסלע השחור הוא שם השביל המוביל אליו, ועם הזמן
    השם דבק גם במים עצמם. האגם שוכן בגובה של כ-2,800 מטר על הרכס המרכזי, וקו הגבול בין גאורגיה לדגסטן
    הרוסית חוצה אותו. שטחו כ-0.17 קמ"ר, עומקו מגיע ל-12 מטר, והוא מוזן משלג, גשם ומעיינות.


    השביל שייך לשמורות הטבע של לגודחי, השמורה העתיקה ביותר בגאורגיה. הרוח החיה מאחורי הקמתה הייתה לודוויק
    מלוקוסייביץ', קצין פולני שהוצב בחיל המצב של לגודחי בשנות ה-1850, ששתל גן לצד הקסרקטין ולאחר מכן בילה
    כאן כיערן קרוב לעשרים שנה. ב-1889 ביקש לראשונה להגן על העמק; השמורה הוכרזה ב-1912, שלוש שנים לאחר
    מותו. מין של אדמונית ותרנגול הבר השחור הקווקזי נושאים עד היום את שמו.


    המעגל המסומן משתרע על כ-38 ק"מ עם כ-2,900 מטר טיפוס. היום הראשון הוא עלייה בלתי פוסקת ביער אשור; לאחר
    מכן נפתח הרכס האלפיני, שם שומרי גבול באוהל בודקים דרכונים. הלילות עוברים במחסות "מטאו" ו"דמידובו".
    השמורה היא אחד ממעוזי היעל הקווקזי המזרחי, ובבוקר צלול הנוף משתרע מעמק אלזני ועד לרכסי דגסטן.


    מעטים המקומות בגאורגיה שבהם צריך להרוויח את הנוף ביושר כזה. זו כל העסקה — והיא הוגנת.
  tip: >-
    הירשמו במרכז המבקרים של לגודחי, בקצה העליון של העיר, לפני הצאתכם לדרך; קנו שם את מפת המסלול, וקחו
    דרכון או תעודת זהות, כי המסלול נכנס לאזור הגבול. לינה במחסה עולה כ-30 לארי לאדם ללילה, והצבת אוהל
    5 לארי (יש לוודא מחירים עדכניים במרכז). מזרנים מסופקים אך שמיכות לא, כך שיש להביא שק שינה. את כל האוכל
    תצטרכו לשאת בעצמכם. מעיינות זורמים לאורך המסלול, אם כי חלקם מתייבשים לקראת סוף הקיץ, כך שיש למלא מים
    בכל הזדמנות. על הרכס מזג האוויר מתהפך בתוך דקות: יש לקחת שכבות חמות ומעיל גשם, גם באוגוסט.
  route: >-
    מטביליסי סעו בכביש קאחתי (S5) מזרחה דרך סגרג'ו וצנורי ללגודחי, קרוב לגבול אזרבייג'ן: כ-160 ק"מ ו-2
    שעות ו-40 דקות, סלול כל הדרך. תחילת השביל היא מרכז המבקרים של השמורה בקצה העליון של העיר. הרכב שלכם
    יישאר שם לכל משך המסע, כך שכדאי לשאול בהגעה איפה אפשר להשאיר אותו בבטחה לשניים-שלושה לילות. תחנות
    דלק מרובות בדרך, כולל בלגודחי. רכב חסכוני מספיק לחלוטין: מעבר לשער, הדרך היחידה להמשיך היא ברגל.
ar:
  name: بحيرة الصخرة السوداء (بحيرة غردزيلي)
  short: >-
    بحيرة جليدية على خط القمة بين جورجيا وداغستان عند ارتفاع نحو 2,800 متر، لا يُوصَل إليها إلا سيرًا
    على الأقدام: حلقة 38 كم عبر أقدم محمية طبيعية في جورجيا.
  body: >-
    **لا طريق يصل إلى بحيرة الصخرة السوداء: السبيل الوحيد إلى هذه الصفحة المائية الباردة على قمة القوقاز
    هو يومان أو ثلاثة على القدمين.**


    تسمّيها الخرائط بحيرة غردزيلي، "البحيرة الطويلة"، أو خالا-خيل. أما "الصخرة السوداء" فهو اسم الدرب
    الصاعد إليها، ومع الزمن التصق الاسم بالماء نفسه. تقع البحيرة عند ارتفاع نحو 2,800 متر على خط القمة
    الرئيسي، ويعبرها خط الحدود بين جورجيا وداغستان الروسية. تبلغ مساحتها نحو 0.17 كم²، وعمقها حتى 12 مترًا،
    ويغذّيها الثلج والمطر والعيون.


    يقع الدرب ضمن محميات لاغوديخي الطبيعية، أقدم محمية في جورجيا. وكان الروح الملهمة لتأسيسها لودفيك مووكوشيفيتش،
    وهو ضابط بولندي أُلحق بحامية لاغوديخي في خمسينيات القرن التاسع عشر، أنشأ حديقة إلى جانب الثكنات، وعاش
    هنا فيما بعد نحو عشرين عامًا حارسًا للغابة. طلب لأول مرة حماية الوادي عام 1889؛ وأُعلنت المحمية عام
    1912، بعد ثلاث سنوات من وفاته. ولا تزال زهرة الفاوانيا والطيهوج الأسود القوقازي يحملان اسمه إلى اليوم.


    تمتد الحلقة المُعلَّمة نحو 38 كم بتسلق يقارب 2,900 متر. اليوم الأول صعود متواصل عبر غابة الزان؛ ثم
    ينفتح خط القمة الألبي، حيث يفحص حراس الحدود في خيمة جوازات السفر. تُقضى الليالي في ملجأي "ميتيو" و"ديميدوفو".
    والمحمية من أهم معاقل الوعل القوقازي الشرقي، وفي صباح صافٍ يمتد المشهد من وادي ألازاني إلى سلاسل داغستان.


    قليلة هي الأماكن في جورجيا التي تجعلك تكسب المشهد بعرقك إلى هذا الحد. تلك هي الصفقة كلها، وهي صفقة
    عادلة.
  tip: >-
    سجّل في مركز زوار لاغوديخي، في الطرف الأعلى من البلدة، قبل الانطلاق؛ واشترِ خريطة المسار من هناك،
    واحمل جواز سفرك أو بطاقة هويتك، لأن المسار يدخل المنطقة الحدودية. تكلّف الليلة في الملجأ نحو 30 لاري
    للشخص، ونصب الخيمة 5 لاري (تأكد من الأسعار الحالية في المركز). تُوفَّر الفرشات لكن لا البطانيات، فاحمل
    كيس نوم. احمل كل طعامك بنفسك. تجري عيون ماء على طول المسار، وإن كان بعضها يجفّ قرب نهاية الصيف، فاملأ
    قِرَبك كلما استطعت. وعلى خط القمة يتبدل الطقس في دقائق: احمل طبقات دافئة ومعطف مطر حتى في أغسطس.
  route: >-
    من تبليسي، سِر على طريق كاختي السريع (S5) شرقًا عبر ساغاريجو وتسنوري إلى لاغوديخي، قرب الحدود الأذربيجانية:
    نحو 160 كم وساعتان و40 دقيقة، معبّد بأكمله. ونقطة انطلاق المسار هي مركز زوار المحمية عند الطرف الأعلى
    من البلدة. ستبقى سيارتك هناك طوال مدة الرحلة، فاسأل عند الوصول أين يمكن تركها بأمان ليلتين أو ثلاثًا.
    محطات الوقود كثيرة على الطريق، بما فيها في لاغوديخي. تكفي سيارة اقتصادية: فبعد البوابة، السبيل الوحيد
    للمواصلة هو المشي.
