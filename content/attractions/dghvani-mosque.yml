ka:
  name: დღვანის მეჩეთი
  short: >-
    XX საუკუნის დასაწყისის ხის მეჩეთი ზემო აჭარის პატარა სოფელში: კედლებზე დახატული ლიმონის ხეები, ყურძენი
    და ყვავილები, რომლებიც ნელ-ნელა ქრება.
  body: >-
    **დღვანში ლიმონის ხეები შენობის შიგნით ხარობს: ისინი სოფლის ხის მეჩეთის კედლებზეა დახატული, ზღვის
    დონიდან ათას მეტრზე მაღლა, სადაც ნამდვილი ლიმონი ვერასდროს დამწიფდებოდა.**


    დღვანი ხის სახლების პატარა სოფელია შუახევის მუნიციპალიტეტში, ზემო აჭარაში — მხარეში, რომელიც 1878
    წლამდე ოსმალეთის იმპერიის შემადგენლობაში იყო. ქართული წყაროებით, მეჩეთი XX საუკუნის დასაწყისში ლაზმა
    ოსტატმა ომერ უსტამ ააგო, მოხატულობა კი 1908 წელს ქართველმა მხატვარმა იბრაიმ ეფენდი შავშეთელმა შეასრულა;
    2023 წლის ერთი რეპორტაჟი 1907 წელს ასახელებს და ლაზ ოსტატებზე საუბრობს. როგორც არ უნდა ყოფილიყო, კედლებზე
    ლიმონის ხეები, ყურძნის მტევნები და ყვავილები ყვავის მუქ მწვანე, ლურჯ და ოქროსფერ ტონებში.


    ზემო აჭარის სოფლებში ათობით პატარა ხის მეჩეთია მიმოფანტული. მსგავსი ნაგებობები საზღვრის იქითაც, ჩრდილო-აღმოსავლეთ
    თურქეთში დგას, მაგრამ აჭარული მეჩეთების მოხატულობას, ერთი ჟურნალისტის სიტყვით, ისლამურ სამყაროში ბადალი
    არ ჰყავს: ბევრ მათგანში კოჭებსა და მინბარებზე ბორჯღალია ამოკვეთილი — მზის ძველი, წინაქრისტიანული ქართული
    ნიშანი. არქიტექტორები სიუზან ჰარის-ბრანდტსი და ანჯელა უილერი 2018 წლის წიგნში „აჭარის ხის მეჩეთები“
    მათ ბედს „მიტოვებით შენახვას“ უწოდებენ.


    2023 წელს ჟურნალისტმა ლორა კასინოფმა აქ იმამი შოთა ფუთკარაძე ნახა, გახუნებულ დარბაზში მარტო მლოცველი.
    საღებავი ათწლეულობით მოუვლელობისგან ცვიოდა, წვიმასა და ნესტს კოჭები გაემრუდებინა. იმამმა უთხრა, რომ
    მეჩეთის ხელახლა მოხატვას ვინმე შემთხვევითს არ ანდობდა, — „თუმცა ინგრევა კიდეც“, — დაუმატა მან.


    მეზობელი ზოგიერთი მეჩეთისგან განსხვავებით, დღვანის მეჩეთის ხის კედლებს წვიმისგან თუნუქი არ იფარავს.
    ამოდით, სანამ ის ჯერ კიდევ სალოცავია და არა მხოლოდ მოგონება სალოცავისა.
  tip: >-
    ეს მოქმედი სოფლის მეჩეთია და არა მუზეუმი; მუდმივი სამუშაო საათები არ აქვს, ამიტომ სოფელში იმამი ან
    ის იკითხეთ, ვისაც გასაღები აქვს. შესვლისას ფეხსაცმელი გაიხადეთ, მოკრძალებულად ჩაიცვით, ქალებმა თავი
    დაიფარონ. პარასკევის შუადღის ლოცვას ვიზიტს ნუ დაამთხვევთ, თუ თავად არ ლოცულობთ, ადამიანების გადაღებამდე
    კი ნებართვა ითხოვეთ. შესვლა უფასოა, შემოწირულობა კი მეჩეთის შესაკეთებლად ძალიან გამოადგებათ. ძველ
    იატაკზე ფრთხილად იარეთ. სოფელში საყიდელი არაფერია: საჭმელი და წყალი შუახევიდან ან ხულოდან წამოიღეთ.
    გვიან შემოდგომიდან გაზაფხულამდე ზედა გზას თოვლი და ტალახი ხშირად კეტავს.
  route: >-
    ზაფხულში ყველაზე მოკლე გზა დაახლოებით 320 კილომეტრი და 6 საათი და 50 წუთია: ს1-ით (E60) დასავლეთით,
    ს8-ით ბორჯომის გავლით ახალციხემდე, შ1-ით გოდერძის უღელტეხილის გადავლით ხულომდე, იქიდან კი აჭარისწყალს
    შუახევამდე ჩაუყევით. წინასწარ დარწმუნდით, რომ უღელტეხილი ღიაა და ქირავნობის ხელშეკრულება მასზე გავლის
    უფლებას გაძლევთ. მთელი წლის გზა ბათუმსა და ქედაზე გადის და დაახლოებით 435 კილომეტრია. შუახევში მთავარი
    გზიდან სამხრეთით გადაუხვიეთ: სოფლის გზა დაახლოებით 13 კილომეტრით ადის დღვანამდე, ზღვის დონიდან 1045
    მეტრამდე; ზედა მონაკვეთი მოუასფალტებელია და წვიმის შემდეგ ძნელად სავალი. აიღეთ ჯიპი. საწვავი ხულოში
    ან შუახევში ჩაასხით.
en:
  name: Dghvani Mosque
  short: >-
    An early-20th-century wooden mosque in a hamlet of upper Adjara, its walls painted with lemon trees,
    grapes and flowers that are slowly fading.
  body: >-
    **In Dghvani the lemon trees grow indoors: they are painted on the walls of a wooden village mosque
    more than a thousand metres up, where no real lemon would ever ripen.**


    Dghvani is a tiny hamlet of wooden houses in Shuakhevi municipality, in upper Adjara, a region that
    was part of the Ottoman Empire until 1878. Georgian sources date the mosque to the early 20th century
    and credit it to a Laz master builder, Omer Usta, with the murals painted in 1908 by the Georgian
    artist Ibraim Efendi Shavsheteli; a 2023 report gives 1907 and speaks of Laz craftsmen. Either way,
    the walls bloom with lemon trees, bunches of grapes and flowers in deep greens, blues and gold.


    Dozens of small wooden mosques are scattered through the villages of upper Adjara. Similar buildings
    stand across the border in north-eastern Turkey, but the painted interiors here are, in one reporter's
    words, unlike anything else in the Islamic world; in many of them the borjghali, an ancient pre-Christian
    Georgian sun symbol, is carved into the beams and minbars. The architects Suzanne Harris-Brandts and
    Angela Wheeler, in their 2018 book The Wooden Mosques of Adjara, call their fate 'preservation by
    neglect'.


    In 2023 the journalist Laura Kasinof found the imam, Shota Putkaradze, praying alone in the faded
    room. The paint was peeling after decades without upkeep, and rain and damp had buckled the beams.
    He did not want just anyone to repaint it, he told her. 'But also it's falling apart,' he added.


    Unlike some of its neighbours, Dghvani's mosque has no metal sheeting to shield its timber from the
    rain. Come while it is still a place where someone prays, and not only the memory of one.
  tip: >-
    This is a working village mosque, not a museum, and it keeps no set hours: ask in the village for
    the imam or whoever holds the key. Take off your shoes, dress modestly, and women should cover their
    hair. Avoid Friday midday prayers unless you are joining them, and ask before photographing anyone.
    Entry is free; a donation towards repairs would be well spent. Tread carefully on the old floorboards.
    There is nothing to buy in the hamlet, so bring food and water from Shuakhevi or Khulo. From late
    autumn to spring, snow and mud often close the upper road.
  route: >-
    In summer the shortest way, about 320 km and 6 hours 50 minutes, is the S1 (E60) west, the S8 through
    Borjomi to Akhaltsikhe and the Sh1 over the Goderdzi Pass to Khulo, then down the Adjaristsqali to
    Shuakhevi. Check that the pass is open and that your rental contract allows it. The year-round route
    via Batumi and up the valley through Keda is about 435 km. In Shuakhevi turn south off the main road:
    a village road climbs some 13 km to Dghvani, 1,045 m above sea level, its upper part unpaved and hard
    going after rain. Take an SUV. Fill up in Khulo or Shuakhevi.
ru:
  name: Мечеть Дгвани
  short: >-
    Деревянная мечеть начала XX века в деревушке Верхней Аджарии: её стены расписаны лимонными деревьями,
    виноградом и цветами, которые медленно выцветают.
  body: >-
    **В Дгвани лимонные деревья растут под крышей: они нарисованы на стенах деревянной сельской мечети
    на высоте больше тысячи метров, где настоящий лимон никогда бы не вызрел.**


    Дгвани — крошечная деревушка из деревянных домов в Шуахевском муниципалитете, в Верхней Аджарии, которая
    до 1878 года входила в Османскую империю. Грузинские источники датируют мечеть началом XX века и называют
    её строителем лазского мастера Омера Усту, а роспись 1908 года приписывают грузинскому художнику Ибраиму-эфенди
    Шавшетели; репортаж 2023 года называет 1907 год и говорит о мастерах-лазах. Так или иначе, стены расцветают
    лимонными деревьями, виноградными гроздьями и цветами в глубоких зелёных, синих и золотых тонах.


    По сёлам Верхней Аджарии разбросаны десятки небольших деревянных мечетей. Похожие постройки есть и
    по ту сторону границы, на северо-востоке Турции, но здешние расписные интерьеры, по словам одного
    репортёра, не похожи ни на что в исламском мире; во многих из них на балках и минбарах вырезан борджгали
    — древний дохристианский грузинский солярный знак. Архитекторы Сюзанна Харрис-Брандтс и Анджела Уилер
    в книге «Деревянные мечети Аджарии» (2018) называют их судьбу «сохранением через запустение».


    В 2023 году журналистка Лора Касиноф застала имама Шоту Путкарадзе за одинокой молитвой в выцветшем
    зале. Краска облезала после десятилетий без ухода, дождь и сырость покоробили балки. Он не хотел бы,
    сказал он ей, чтобы заново расписывать взялся кто попало. «Но ведь она ещё и разваливается», — добавил
    он.


    В отличие от некоторых соседних мечетей, у мечети в Дгвани нет металлической обшивки, которая берегла
    бы дерево от дождя. Приезжайте, пока здесь ещё молятся — пока это живое место, а не только память
    о нём.
  tip: >-
    Это действующая сельская мечеть, а не музей, и постоянных часов работы у неё нет: спросите в селе
    имама или того, у кого ключ. Разуйтесь, оденьтесь скромно; женщинам нужно покрыть волосы. Не приезжайте
    к пятничной полуденной молитве, если не собираетесь в ней участвовать, и спрашивайте разрешения, прежде
    чем кого-то фотографировать. Вход бесплатный; пожертвование на ремонт будет потрачено с толком. По
    старым половицам ступайте осторожно. В деревушке ничего не купишь, так что везите еду и воду из Шуахеви
    или Хуло. С поздней осени до весны верхнюю дорогу часто перекрывают снег и грязь.
  route: >-
    Летом кратчайший путь — около 320 км и 6 часов 50 минут: на запад по S1 (E60), по S8 через Боржоми
    до Ахалцихе и по Sh1 через перевал Годердзи до Хуло, затем вниз по долине Аджарисцкали до Шуахеви.
    Убедитесь, что перевал открыт и что договор проката разрешает этот маршрут. Круглогодичный путь через
    Батуми и вверх по долине через Кеду — около 435 км. В Шуахеви сверните с главной дороги на юг: сельская
    дорога поднимается примерно 13 км до Дгвани, на высоту 1045 м над уровнем моря; верхняя её часть без
    покрытия и после дождя тяжела. Берите внедорожник. Заправляйтесь в Хуло или Шуахеви.
fa:
  name: مسجد دغوانی
  short: >-
    مسجدی چوبی از آغاز سدهٔ بیستم در آبادی‌ای در آجارای علیا، با دیوارهایی نقاشی‌شده با درختان لیمو، انگور
    و گل‌هایی که آرام‌آرام رنگ می‌بازند.
  body: >-
    **در دغوانی درختان لیمو زیر سقف می‌رویند: آن‌ها را بر دیوارهای مسجد چوبی روستایی در ارتفاعی بیش از
    هزار متر نقاشی کرده‌اند، جایی که هیچ لیموی واقعی هرگز نمی‌رسد.**


    دغوانی آبادی کوچکی از خانه‌های چوبی در شهرستان شواخوی در آجارای علیاست؛ منطقه‌ای که تا سال ۱۸۷۸ بخشی
    از امپراتوری عثمانی بود. منابع گرجی ساخت مسجد را به آغاز سدهٔ بیستم و به استادکاری لاز به نام عمر
    اوستا نسبت می‌دهند و نقاشی‌هایش را کار نقاش گرجی، ابراهیم افندی شاوشتلی، در سال ۱۹۰۸ می‌دانند؛ گزارشی
    از سال ۲۰۲۳ سال ۱۹۰۷ را آورده و از استادکاران لاز سخن می‌گوید. به هر روی، دیوارها با درختان لیمو،
    خوشه‌های انگور و گل‌هایی به رنگ‌های سبز و آبی سیر و طلایی شکوفا شده‌اند.


    ده‌ها مسجد چوبی کوچک در روستاهای آجارای علیا پراکنده‌اند. بناهای مشابهی آن سوی مرز، در شمال شرقی ترکیه،
    هم هست، اما به گفتهٔ یک خبرنگار، فضای درونیِ نقاشی‌شدهٔ این مسجدها به هیچ چیز دیگری در جهان اسلام
    شباهت ندارد؛ در بسیاری از آن‌ها بورجغالی، نماد خورشیدیِ کهن و پیشامسیحیِ گرجی، بر تیرها و منبرها کنده
    شده است. معماران، سوزان هریس-برانتس و آنجلا ویلر، در کتاب «مسجدهای چوبی آجارا» (۲۰۱۸) سرنوشت آن‌ها
    را «حفاظت از راه بی‌اعتنایی» می‌نامند.


    در سال ۲۰۲۳ روزنامه‌نگار لورا کاسینوف امام مسجد، شوتا پوتکارادزه، را دید که در آن تالار رنگ‌باخته
    تنها نماز می‌خواند. رنگ پس از دهه‌ها بی‌رسیدگی ور آمده بود و باران و نم تیرها را تاب داده بود. امام
    به او گفت نمی‌خواهد هر کسی از راه برسد و دوباره نقاشی‌اش کند. و افزود: «ولی خب، دارد فرو می‌ریزد.»


    برخلاف برخی از همسایگانش، مسجد دغوانی پوشش فلزی ندارد که چوبش را از باران در امان بدارد. تا وقتی هنوز
    جایی است که کسی در آن نماز می‌گزارد، و نه فقط خاطره‌ای از چنین جایی، به دیدنش بیایید.
  tip: >-
    این مسجد روستاییِ دایر است، نه موزه، و ساعت کار مشخصی ندارد: در روستا سراغ امام یا کسی را بگیرید که
    کلید دارد. کفش‌هایتان را درآورید، پوشیده لباس بپوشید و بانوان موی سر را بپوشانند. اگر قصد پیوستن به
    نماز ظهر جمعه را ندارید، آن هنگام نروید و پیش از عکس گرفتن از کسی اجازه بخواهید. ورود رایگان است؛
    کمکی برای تعمیرات به‌جا خرج خواهد شد. روی تخته‌های کهنهٔ کف با احتیاط قدم بردارید. در آبادی چیزی برای
    خرید نیست، پس غذا و آب را از شواخوی یا خولو بیاورید. از اواخر پاییز تا بهار، برف و گل‌ولای اغلب جادهٔ
    بالایی را می‌بندد.
  route: >-
    در تابستان کوتاه‌ترین راه، حدود ۳۲۰ کیلومتر و ۶ ساعت و ۵۰ دقیقه، چنین است: S1 (E60) رو به غرب، S8
    از راه بورجومی تا آخالتسیخه و Sh1 از گردنهٔ گودردزی تا خولو، سپس در سرازیری درهٔ آجاریس‌تسکالی تا
    شواخوی. مطمئن شوید گردنه باز است و قرارداد اجاره عبور از آن را مجاز می‌داند. مسیر تمام‌سال، از راه
    باتومی و بالا رفتن در دره از کدا، حدود ۴۳۵ کیلومتر است. در شواخوی از جادهٔ اصلی رو به جنوب بپیچید:
    جاده‌ای روستایی حدود ۱۳ کیلومتر تا دغوانی، در ارتفاع ۱۰۴۵ متری از سطح دریا، بالا می‌رود؛ بخش بالایی‌اش
    آسفالت نیست و پس از باران سخت‌گذر می‌شود. خودروی شاسی‌بلند بردارید. در خولو یا شواخوی باک را پر کنید.
he:
  name: מסגד דגוואני
  short: מסגד עץ מראשית המאה ה-20 בכפרון באג'ריה העילית, שעל קירותיו מצוירים עצי לימון, ענבים ופרחים ההולכים
    ודוהים.
  body: >-
    **בדגוואני עצי הלימון גדלים בתוך הבית: הם מצוירים על קירותיו של מסגד כפרי מעץ, בגובה של יותר מאלף
    מטרים, במקום שבו שום לימון אמיתי לא היה מבשיל לעולם.**


    דגוואני הוא כפרון זעיר של בתי עץ במוניציפליטת שואחבי שבאג'ריה העילית, אזור שהיה חלק מהאימפריה העות'מאנית
    עד 1878. מקורות גאורגיים מתארכים את המסגד לראשית המאה ה-20 ומייחסים את בנייתו לאומן לאזי בשם עומר
    אוסטה, ואת ציורי הקיר, משנת 1908, לצייר הגאורגי איברהים אפנדי שבשטלי; כתבה מ-2023 נוקבת בשנת 1907
    ומדברת על אומנים לאזים. כך או כך, הקירות פורחים בעצי לימון, באשכולות ענבים ובפרחים בגוונים עמוקים
    של ירוק, כחול וזהב.


    עשרות מסגדי עץ קטנים פזורים בכפרי אג'ריה העילית. מבנים דומים עומדים גם מעבר לגבול, בצפון-מזרח טורקיה,
    אבל הפנים המצוירים כאן, כלשונו של כתב אחד, אינם דומים לשום דבר אחר בעולם האסלאם; ברבים מהם חרוט על
    הקורות ועל המינברים הבורג'גאלי, סמל שמש גאורגי עתיק מן התקופה שלפני הנצרות. האדריכליות סוזן האריס-בראנטס
    ואנג'לה וילר, בספרן 'מסגדי העץ של אג'ריה' מ-2018, מכנות את גורלם 'שימור באמצעות הזנחה'.


    ב-2023 מצאה העיתונאית לורה קסינוף את האימאם, שותא פוטקרדזה, מתפלל לבדו באולם הדהוי. הצבע התקלף אחרי
    עשרות שנים בלי תחזוקה, והגשם והלחות עיקמו את הקורות. הוא לא רוצה שסתם מישהו יצבע אותו מחדש, אמר לה.
    'אבל הוא גם מתפרק', הוסיף.


    בניגוד לכמה משכניו, למסגד דגוואני אין ציפוי מתכת שיגן על העץ מפני הגשם. בואו כל עוד זה מקום שמישהו
    מתפלל בו, ולא רק זיכרון של מקום כזה.
  tip: >-
    זהו מסגד כפרי פעיל, לא מוזיאון, ואין לו שעות פתיחה קבועות: שאלו בכפר על האימאם או על מי שמחזיק במפתח.
    חלצו נעליים, התלבשו בצניעות, ונשים צריכות לכסות את שערן. הימנעו מתפילת הצהריים של יום שישי אלא אם
    אתם מצטרפים אליה, ובקשו רשות לפני שאתם מצלמים מישהו. הכניסה חופשית; תרומה לשיפוצים תנוצל היטב. דרכו
    בזהירות על קרשי הרצפה הישנים. בכפרון אין מה לקנות, אז הביאו אוכל ומים משואחבי או מחולו. מסוף הסתיו
    ועד האביב שלג ובוץ סוגרים לעיתים קרובות את הקטע העליון של הדרך.
  route: >-
    בקיץ הדרך הקצרה ביותר, כ-320 ק״מ ו-6 שעות ו-50 דקות, עוברת בכביש S1 (E60) מערבה, בכביש S8 דרך בורג'ומי
    לאחלציחה ובכביש Sh1 מעל מעבר גודרדזי עד חולו, ומשם במורד עמק האג'ריסצקאלי עד שואחבי. בדקו שהמעבר פתוח
    ושחוזה ההשכרה מתיר לנסוע בו. הדרך הפתוחה כל השנה, דרך בטומי ובמעלה העמק דרך קדה, ארוכה יותר: כ-435
    ק״מ. בשואחבי פנו דרומה מהכביש הראשי: דרך כפרית מטפסת כ-13 ק״מ עד דגוואני, בגובה 1045 מטרים מעל פני
    הים; חלקה העליון אינו סלול וקשה למעבר אחרי גשם. קחו רכב שטח. תדלקו בחולו או בשואחבי.
ar:
  name: مسجد دغفاني
  short: >-
    مسجد خشبي من مطلع القرن العشرين في قرية صغيرة بأدجارا العليا، تزيّن جدرانه رسوم أشجار ليمون وعناقيد
    عنب وأزهار تبهت ألوانها ببطء.
  body: >-
    **في دغفاني تنمو أشجار الليمون تحت السقف: فهي مرسومة على جدران مسجد قروي من الخشب، على ارتفاع يزيد
    على ألف متر، حيث لا يمكن لليمونة حقيقية أن تنضج أبداً.**


    دغفاني قرية صغيرة جداً من البيوت الخشبية في بلدية شواخيفي، في أدجارا العليا، وهي منطقة ظلت جزءاً من
    الدولة العثمانية حتى عام 1878. تؤرّخ المصادر الجورجية المسجد بمطلع القرن العشرين وتنسب بناءه إلى معلّم
    لازي يُدعى عمر أوستا، ورسومه الجدارية إلى الرسام الجورجي إبراهيم أفندي شافشيتيلي عام 1908؛ أما تقرير
    صحفي من عام 2023 فيذكر عام 1907 ويتحدث عن حِرفيين من اللاز. وأياً كان الأمر، فالجدران تزهر بأشجار
    الليمون وعناقيد العنب والأزهار، بألوان عميقة من الأخضر والأزرق والذهبي.


    تنتشر عشرات المساجد الخشبية الصغيرة في قرى أدجارا العليا. وتقوم مبانٍ مشابهة عبر الحدود في شمال شرق
    تركيا، لكن الدواخل المرسومة هنا، بعبارة أحد المراسلين، لا تشبه شيئاً آخر في العالم الإسلامي؛ وفي كثير
    منها نُقش على العوارض والمنابر رمز البورجغالي، وهو رمز شمسي جورجي قديم يعود إلى ما قبل المسيحية. وتصف
    المعماريتان سوزان هاريس-برانتس وأنجيلا ويلر، في كتابهما «المساجد الخشبية في أدجارا» الصادر عام 2018،
    مصير هذه المساجد بأنه «صون بالإهمال».


    في عام 2023 وجدت الصحفية لورا كاسينوف الإمام شوتا بوتكارادزه يصلي وحده في القاعة الباهتة. كان الطلاء
    يتقشر بعد عقود بلا صيانة، وقد لوت الأمطار والرطوبة العوارض. قال لها إنه لا يريد أن يعيد طلاءه أيٌّ
    كان. ثم أضاف: «لكنه يتداعى أيضاً».


    وخلافاً لبعض جيرانه، ليس لمسجد دغفاني كسوة معدنية تقي خشبه من المطر. تعالَ ما دام مكاناً يصلّي فيه
    أحد، لا مجرد ذكرى لمكان كهذا.
  tip: >-
    هذا مسجد قروي عامر لا متحف، وليست له ساعات ثابتة: اسأل في القرية عن الإمام أو عمّن يحمل المفتاح. اخلع
    حذاءك، والبس ثياباً محتشمة، وعلى النساء تغطية الشعر. تجنّب صلاة الجمعة عند الظهيرة ما لم تكن ستشارك
    فيها، واستأذن قبل تصوير أي شخص. الدخول مجاني؛ وأي تبرع للترميم سيكون في محله. امشِ بحذر على ألواح
    الأرضية القديمة. لا شيء يُشترى في القرية، فأحضر الطعام والماء من شواخيفي أو خولو. من أواخر الخريف
    حتى الربيع كثيراً ما يغلق الثلج والوحل الطريق العلوي.
  route: >-
    في الصيف أقصر الطرق، نحو 320 كم و6 ساعات و50 دقيقة، هو S1 (E60) غرباً، ثم S8 عبر بورجومي إلى أخالتسيخه،
    ثم Sh1 عبر ممر غودردزي إلى خولو، ومنها نزولاً مع وادي أدجاريستسكالي إلى شواخيفي. تأكد أن الممر مفتوح
    وأن عقد الاستئجار يسمح بعبوره. أما الطريق المتاح طوال العام، عبر باتومي ثم صعوداً في الوادي مروراً
    بكيدا، فطوله نحو 435 كم. في شواخيفي انعطف جنوباً عن الطريق الرئيسي: طريق قروي يصعد نحو 13 كم إلى دغفاني،
    على ارتفاع 1045 متراً فوق سطح البحر، وجزؤه العلوي غير معبّد وشاق بعد المطر. خذ سيارة دفع رباعي. تزوّد
    بالوقود في خولو أو شواخيفي.
