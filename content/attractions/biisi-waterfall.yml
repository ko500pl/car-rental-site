ka:
  name: ბიისის ჩანჩქერი
  short: >-
    ჩანჩქერი ტანის ზემო წელში: ზაფხულში ოთხი კილომეტრი ფეხით და რამდენიმე ფონი, ზამთარში — ყინულის კედელი
    ალპინისტებისთვის.
  body: >-
    **ბიისის ჩანჩქერი უნდა დაიმსახუროთ: მასთან ტანის ხეობით ოთხიოდე კილომეტრი ფეხით მიდიხართ და მდინარეს
    გზაში რამდენჯერმე ფონით კვეთთ.**


    ჩანჩქერი ტანის ზემო წელში, სოფელ ბიისიდან ოთხიოდე კილომეტრის სავალზე ეშვება. ბიისი გორის მუნიციპალიტეტის
    პაწაწინა სოფელია: 2002 წელს აქ 40 ადამიანი ცხოვრობდა, 2014 წელს კი — 30.


    სჯობს, წინასწარ იცოდეთ, რისთვის მოდიხართ. ზაფხულობით ჩანჩქერის ზედა საფეხური ხშირად უბრალოდ სველი,
    მუქი კლდეა; ჯილდო თავად გზაა, ძირში ცივი გუბე და ძრავის ხმისგან თავისუფალი დღე. ზამთარში იგივე კლდე
    ყინულის სვეტად იქცევა და ადგილობრივი ალპინისტები მასზე ყინულზე ცოცვის შეჯიბრებებს მართავენ.


    სოფელი თავის ზომაზე მეტს ინახავს. სასაფლაოთი დაფარულ ბორცვზე ნატეხი ქვით ნაგები პატარა ღვთისმშობლის
    ეკლესია დგას (8,1 × 5,1 მ), რომელიც სტილის მიხედვით განვითარებული ფეოდალური ხანით, დაახლოებით XI–XIII
    საუკუნეებით თარიღდება. ბიისი მცირე კლიმატურ-ბალნეოლოგიურ კურორტადაც ითვლება: აქაური სულფიდური მინერალური
    წყალი სახსრების, პერიფერიული ნერვული სისტემისა და გინეკოლოგიური დაავადებების სამკურნალო აბაზანებისთვის
    გამოიყენება. ეს ადგილის უფრო მშვიდი სახეა — დღეს სტუმრების უმეტესობა აქ სალაშქრო ფეხსაცმლით მოდის.


    ამოდით ივლისში ან აგვისტოში, ადრე დილით გამოდით და ტემპი მდინარეს მიანდეთ.
  tip: >-
    შესვლა უფასოა, ბილიკზე კი არაფერია: წყალი, საჭმელი და დამუხტული ტელეფონი თან იქონიეთ, მარაგი გორში
    შეივსეთ. ჩაიცვით ფეხსაცმელი, რომლის დასველებაც არ დაგენანებათ — ბილიკი ტანას რამდენჯერმე ფონით კვეთს
    და ქვები სრიალაა. ძლიერი წვიმის შემდეგ ან გაზაფხულის თოვლის დნობისას, როცა მდინარე სწრაფად დიდდება,
    ფონით ნუ გახვალთ; სეზონი ივნისიდან სექტემბრამდეა. სულ დაახლოებით ოთხი საათი დაუთმეთ. ზამთარში გაყინული
    ჩანჩქერი აღჭურვილ ალპინისტებს ეკუთვნის და არა ფეხით მოსეირნეებს. უკანა გზაზე ატენის სიონში შეიარეთ.
  route: >-
    111 კმ ბილიკის დასაწყისამდე, დაახლოებით 2 საათი და 15 წუთი. ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით
    60 კილომეტრი იარეთ გორამდე, ქალაქი გაიარეთ და სამხრეთით, შ137 გზაზე (ხიდისთავი — ატენი — ბოშური) გადადით,
    რომელიც ტანის ხეობას მიუყვება. დაახლოებით 20 კილომეტრის შემდეგ, ატენისა და ბოშურის იქით, ასფალტს ხრეში
    ცვლის. მანქანა ბიისის მიდამოებში, იქ დატოვეთ, სადაც გზა ჩვეულებრივი მოძრაობისთვის მთავრდება, და ჩანჩქერამდე
    დაახლოებით 4 კილომეტრი ფეხით გაიარეთ. ხრეშიანი გზისთვის მაღალი გამავლობის მანქანა ჯობს. საწვავის ბოლო
    საიმედო წერტილი გორია.
en:
  name: Biisi Waterfall
  short: >-
    A walk-in waterfall in the upper Tana valley: four kilometres and several river fords in summer, a
    frozen climbing wall in winter.
  body: >-
    **Biisi is a waterfall you have to earn: roughly four kilometres on foot up the Tana valley, fording
    the river again and again on the way.**


    The fall lies in the upper Tana, about four kilometres' walk above Biisi, a hamlet in Gori municipality
    that counted 40 people in 2002 and 30 in 2014.


    Know what you are coming for. In summer the upper section is often little more than a wet, dark rock
    face; the reward is the walk itself, the cold pool at the foot and a day without engine noise. In
    winter the same cliff freezes into a column of ice, and local climbers hold competitions on it.


    The village holds more than its size suggests. On a knoll covered with graves stands a small rubble-stone
    Church of the Virgin, 8.1 by 5.1 metres, dated by style to roughly the 11th–13th century. Biisi is
    also registered as a small climatic and balneological resort: its sulphide mineral water is used in
    bathing treatments for joint, nerve and gynaecological complaints. It is the place's quieter face;
    most visitors now arrive in hiking boots.


    Come in July or August, start early, and let the river set the pace.
  tip: >-
    There is no fee and nothing on the trail, so carry water, food and a charged phone, and stock up in
    Gori. Wear boots or sandals you are happy to soak: the path fords the Tana several times and the stones
    are slick. Do not attempt the crossings after heavy rain or during spring snowmelt, when the river
    rises fast; June to September is the season. Allow about four hours in all. In winter the frozen fall
    belongs to equipped ice climbers, not walkers. On the way back, stop at Ateni Sioni.
  route: >-
    111 km to the trailhead, about 2 hours 15 minutes. Take the S1 (E60) west for about 60 km to Gori,
    cross the town and turn south onto the Sh137, the Khidistavi–Ateni–Boshuri road, which follows the
    Tana valley. After about 20 km, beyond Ateni and Boshuri, asphalt gives way to gravel. Park around
    Biisi where the road stops being practical for ordinary traffic, then walk roughly 4 km to the fall.
    An SUV is worth it for clearance on the gravel. Gori is your last reliable fuel stop.
ru:
  name: Водопад Бииси
  short: >-
    Водопад в верховьях долины Таны: летом — четыре километра пешком и несколько бродов, зимой — ледовая
    стена для ледолазов.
  body: >-
    **Бииси — водопад, который надо заслужить: около четырёх километров пешком вверх по долине Таны, то
    и дело переходя реку вброд.**


    Вода падает в верховьях Таны, примерно в четырёх километрах ходьбы выше Бииси — деревушки в Горийском
    муниципалитете, где в 2002 году жили 40 человек, а в 2014-м — 30.


    Знайте, за чем едете. Летом верхний каскад нередко превращается в мокрую тёмную скалу; награда — сама
    дорога, холодная чаша у подножия и день без шума моторов. Зимой тот же обрыв замерзает в ледяную колонну,
    и местные альпинисты устраивают на ней соревнования.


    В деревне больше, чем обещает её размер. На пригорке, покрытом могилами, стоит маленькая церковь Богородицы
    из бутового камня, 8,1 на 5,1 метра, по стилю датируемая примерно XI–XIII веками. Кроме того, Бииси
    числится малым климатическим и бальнеологическим курортом: его сульфидную минеральную воду используют
    для лечебных ванн при болезнях суставов, нервной системы и гинекологических недугах. Это более тихое
    лицо места; большинство гостей теперь приходят сюда в треккинговых ботинках.


    Приезжайте в июле или августе, выходите пораньше — и пусть темп задаёт река.
  tip: >-
    Платы нет, и на тропе нет ничего, так что возьмите воду, еду и заряженный телефон, а припасы купите
    в Гори. Надевайте ботинки или сандалии, которые не жалко намочить: тропа несколько раз пересекает
    Тану вброд, а камни скользкие. Не пытайтесь переходить реку после сильного дождя или в весеннее снеготаяние,
    когда вода быстро поднимается; сезон — с июня по сентябрь. Заложите на всё около четырёх часов. Зимой
    замёрзший водопад принадлежит ледолазам со снаряжением, а не пешим туристам. На обратном пути заезжайте
    в Атенский Сион.
  route: >-
    111 км до начала тропы, около 2 часов 15 минут. Езжайте по S1 (E60) на запад около 60 км до Гори,
    пересеките город и сверните на юг на Sh137 — дорогу Хидистави — Атени — Бошури, которая идёт по долине
    Таны. Примерно через 20 км, за Атени и Бошури, асфальт сменяется гравием. Оставьте машину около Бииси,
    там, где дорога перестаёт быть пригодной для обычного транспорта, и дальше идите пешком примерно 4
    км до водопада. Внедорожник оправдает себя клиренсом на гравии. Гори — последняя надёжная заправка.
fa:
  name: آبشار بییسی
  short: >-
    آبشاری در بالادست درهٔ تانا که باید پیاده به آن رسید: در تابستان چهار کیلومتر راه و چند گذر از رود،
    در زمستان دیواره‌ای یخی برای صعود.
  body: >-
    **بییسی آبشاری است که دیدنش زحمت می‌خواهد: حدود چهار کیلومتر پیاده‌روی در بالادست درهٔ تانا، با گذرهای
    پیاپی از میان رود.**


    آب در بالادست تانا فرو می‌ریزد، حدود چهار کیلومتر پیاده‌روی بالاتر از بییسی، آبادی کوچکی در شهرستان
    گوری که در سال ۲۰۰۲، ۴۰ نفر و در سال ۲۰۱۴، ۳۰ نفر جمعیت داشت.


    بدانید برای چه می‌آیید. در تابستان بخش بالایی آبشار اغلب چیزی بیش از صخره‌ای خیس و تیره نیست؛ پاداش،
    خودِ راه است، آبگیر سرد پای آبشار و روزی بی‌صدای موتور. در زمستان همان صخره به ستونی از یخ بدل می‌شود
    و یخ‌نوردان محلی روی آن مسابقه برگزار می‌کنند.


    روستا بیش از آنچه اندازه‌اش نشان می‌دهد در خود دارد. بر تپه‌ای کوچک که گورها آن را پوشانده‌اند، کلیسای
    کوچکی از سنگ‌لاشه به نام حضرت مریم ایستاده، به ابعاد ۸٫۱ در ۵٫۱ متر، که از روی سبک به حدود سده‌های
    یازدهم تا سیزدهم نسبت داده می‌شود. بییسی همچنین به‌عنوان استراحتگاه کوچک اقلیمی و آب‌درمانی ثبت شده
    است: آب معدنی سولفیدی آن در حمام‌های درمانی برای ناراحتی‌های مفاصل، اعصاب و بیماری‌های زنان به کار
    می‌رود. این چهرهٔ آرام‌تر این مکان است؛ بیشتر بازدیدکنندگان امروز با پوتین کوهنوردی می‌آیند.


    در ژوئیه یا اوت بیایید، زود راه بیفتید و بگذارید رود آهنگ گام‌هایتان را تعیین کند.
  tip: >-
    ورودیه‌ای نیست و در مسیر هم هیچ چیز نیست، پس آب، خوراک و تلفن شارژشده همراه داشته باشید و خریدهایتان
    را در گوری انجام دهید. پوتین یا صندل‌هایی بپوشید که خیس شدنشان برایتان مهم نباشد: مسیر چند بار از
    تانا می‌گذرد و سنگ‌ها لیزند. پس از باران سنگین یا هنگام آب شدن برف‌های بهاری که آب رود به‌سرعت بالا
    می‌آید، از رود نگذرید؛ فصل مناسب از ژوئن تا سپتامبر است. روی هم حدود چهار ساعت وقت بگذارید. در زمستان
    آبشار یخ‌زده از آنِ یخ‌نوردان مجهز است، نه کوه‌پیمایان معمولی. در راه بازگشت، در کلیسای سیونی آتنی
    توقف کنید.
  route: >-
    ۱۱۱ کیلومتر تا آغاز مسیر پیاده، حدود ۲ ساعت و ۱۵ دقیقه. جادهٔ S1 (E60) را حدود ۶۰ کیلومتر به سمت غرب
    تا گوری بروید، از شهر بگذرید و رو به جنوب به جادهٔ Sh137، راه خیدیستاوی–آتنی–بوشوری، بپیچید که درهٔ
    تانا را دنبال می‌کند. پس از حدود ۲۰ کیلومتر، آن سوی آتنی و بوشوری، آسفالت جای خود را به شن می‌دهد.
    خودرو را در حوالی بییسی، جایی که جاده دیگر برای خودروهای معمولی مناسب نیست، پارک کنید و سپس حدود ۴
    کیلومتر تا آبشار پیاده بروید. خودروی شاسی‌بلند به خاطر فاصلهٔ کف از زمین روی شن‌ها ارزشش را دارد.
    گوری آخرین جایگاه سوخت مطمئن است.
he:
  name: מפל ביאיסי
  short: 'מפל בעמק הטאנה העליון, שמגיעים אליו רק ברגל: בקיץ ארבעה קילומטרים וכמה חציות נהר, בחורף קיר
    קרח לטיפוס.'
  body: >-
    **ביאיסי הוא מפל שצריך להתאמץ כדי לזכות בו: כארבעה קילומטרים ברגל במעלה עמק הטאנה, תוך חציית הנהר
    שוב ושוב בדרך.**


    המים נופלים בטאנה העליון, כארבעה קילומטרים של הליכה מעל ביאיסי, כפרון בתחום עיריית גורי שמנה 40 תושבים
    ב-2002 ו-30 ב-2014.


    דעו בשביל מה אתם באים. בקיץ החלק העליון של המפל הוא לעיתים קרובות לא יותר מקיר סלע רטוב וכהה; הפרס
    הוא ההליכה עצמה, הבריכה הקרה למרגלותיו ויום בלי רעש מנועים. בחורף אותו מצוק קופא לעמוד קרח, ומטפסים
    מקומיים עורכים עליו תחרויות.


    בכפר יש יותר ממה שגודלו מרמז. על גבעה קטנה מכוסה קברים עומדת כנסיית מריה הבתולה הקטנה, מאבן גוויל,
    8.1 על 5.1 מטרים, המתוארכת על פי סגנונה לערך למאות ה-11 עד ה-13. ביאיסי רשום גם כאתר נופש קטן לאקלים
    ולמרפא במים: מי המינרלים הגופריתיים (סולפידיים) שלו משמשים לטיפולי רחצה בבעיות מפרקים ועצבים ובמחלות
    נשים. זהו פניו השקטים יותר של המקום; רוב המבקרים מגיעים היום בנעלי הליכה.


    בואו ביולי או באוגוסט, צאו מוקדם, ותנו לנהר לקבוע את הקצב.
  tip: >-
    אין דמי כניסה ואין כלום לאורך השביל, אז קחו מים, אוכל וטלפון טעון, והצטיידו בגורי. נעלו נעליים או
    סנדלים שלא אכפת לכם להרטיב: השביל חוצה את הטאנה כמה פעמים והאבנים חלקלקות. אל תנסו את החציות אחרי
    גשם כבד או בזמן הפשרת השלגים באביב, כשהנהר עולה במהירות; העונה היא יוני עד ספטמבר. הקדישו לכל הטיול
    כארבע שעות. בחורף המפל הקפוא שייך למטפסי קרח מצוידים, לא למטיילים. בדרך חזרה עצרו באטני סיוני.
  route: >-
    111 ק"מ עד תחילת השביל, כשעתיים ורבע. סעו מערבה בכביש S1 (E60) כ-60 ק"מ עד גורי, חצו את העיר ופנו
    דרומה לכביש Sh137, דרך חידיסטאבי–אטני–בושורי, העוקבת אחר עמק הטאנה. אחרי כ-20 ק"מ, מעבר לאטני ולבושורי,
    האספלט מתחלף בחצץ. חנו באזור ביאיסי, במקום שבו הדרך מפסיקה להתאים לתנועה רגילה, ומשם לכו כ-4 ק"מ עד
    המפל. רכב שטח שווה את זה בזכות מרווח הגחון על החצץ. גורי היא תחנת הדלק האמינה האחרונה.
ar:
  name: شلال بييسي
  short: >-
    شلال في أعالي وادي تانا لا يُبلغ إلا مشيًا: صيفًا أربعة كيلومترات وعدة مخاضات نهرية، وشتاءً جدار جليدي
    للتسلّق.
  body: >-
    **بييسي شلال عليك أن تستحقه: نحو أربعة كيلومترات سيرًا على الأقدام صعودًا في وادي تانا، تخوض فيها
    النهر مرة بعد مرة.**


    يهوي الماء في أعالي نهر تانا، على مسيرة نحو أربعة كيلومترات فوق بييسي، وهي قرية صغيرة في بلدية غوري
    كان عدد سكانها 40 نسمة عام 2002 و30 عام 2014.


    اعرف ما الذي تأتي من أجله. ففي الصيف كثيرًا ما لا يكون الجزء العلوي أكثر من وجه صخري مبلّل داكن؛ والمكافأة
    هي المسير نفسه، والبركة الباردة عند القاع، ويوم بلا ضجيج محركات. وفي الشتاء يتجمّد الجرف ذاته عمودًا
    من الجليد، وينظّم عليه المتسلقون المحليون مسابقات.


    وفي القرية أكثر مما يوحي به حجمها. فعلى رابية تغطيها القبور تقوم كنيسة صغيرة للسيدة العذراء من الحجر
    الغشيم، أبعادها 8.1 في 5.1 متر، تُؤرَّخ بحسب طرازها بين القرنين الحادي عشر والثالث عشر تقريبًا. وبييسي
    مسجّلة أيضًا منتجعًا مناخيًّا وعلاجيًّا بالمياه صغيرًا: إذ تُستخدم مياهها المعدنية الكبريتيدية في
    حمّامات علاجية لأمراض المفاصل والأعصاب والأمراض النسائية. ذلك هو الوجه الأهدأ للمكان؛ فمعظم الزوار
    يأتون اليوم بأحذية المشي الجبلي.


    تعالَ في تموز/يوليو أو آب/أغسطس، وانطلق باكرًا، ودع النهر يحدّد خطاك.
  tip: >-
    لا رسوم ولا شيء على المسار، فاحمل الماء والطعام وهاتفًا مشحونًا، وتزوّد بحاجاتك في غوري. البس حذاءً
    أو صندلًا لا تمانع في ابتلاله: فالمسار يعبر نهر تانا عدة مرات والحجارة زلقة. لا تحاول العبور بعد الأمطار
    الغزيرة أو في موسم ذوبان الثلوج ربيعًا، حين يرتفع النهر بسرعة؛ والموسم من حزيران/يونيو إلى أيلول/سبتمبر.
    خصّص نحو أربع ساعات للرحلة كلها. وفي الشتاء يكون الشلال المتجمّد لمتسلّقي الجليد المجهّزين، لا للمشاة.
    وفي طريق العودة توقّف عند كنيسة سيوني أتيني.
  route: >-
    111 كم حتى بداية المسار، نحو ساعتين و15 دقيقة. اسلك الطريق S1 (E60) غربًا نحو 60 كم حتى غوري، واعبر
    المدينة ثم انعطف جنوبًا إلى الطريق Sh137، طريق خيديستافي–أتيني–بوشوري، الذي يتبع وادي تانا. وبعد نحو
    20 كم، بعد أتيني وبوشوري، يفسح الإسفلت المجال للحصى. اركن سيارتك قرب بييسي حيث يكفّ الطريق عن أن يكون
    صالحًا لحركة السيارات العادية، ثم امشِ نحو 4 كم إلى الشلال. تستحق سيارة الدفع الرباعي العناء بفضل
    خلوصها الأرضي على الحصى. غوري هي آخر محطة وقود يُعتمد عليها.
