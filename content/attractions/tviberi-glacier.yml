ka:
  name: ტვიბერის მყინვარი
  short: >-
    მძიმე, ხანგრძლივი დღე ჟაბეშიდან ხმაურიანი ტვიბერის ხეობით, ჩანჩქერებისა და მთის ქოხის გავლით — იქამდე,
    სადაც მულხრის სათავის ყინული გამოჩნდება.
  body: >-
    **მდინარე მულხრა ტვიბერის მყინვარზე იბადება, მასთან მისვლა კი მხოლოდ ფეხით შეიძლება — ხეობით, რომელიც
    დაუდევარ ნაბიჯს არ გაპატიებთ.**


    მყინვარი ჟაბეშის ჩრდილოეთით, გვერდითი ხეობის სათავეს ავსებს. ჟაბეში მულახის ერთ-ერთი სოფელია, მესტიიდან
    დაახლოებით 15 კმ-ით აღმოსავლეთით, უშგულის გზაზე; ადგილობრივი გიდების თქმით, მყინვარის სიგრძე 9,5 კილომეტრს
    აღწევს. მისი ნადნობი წყალი, თოვლთან, წვიმასა და წყაროებთან ერთად, მულხრას კვებავს — ენგურის 27-კილომეტრიან
    მარჯვენა შენაკადს, რომელიც აპრილიდან ოქტომბრამდე ადიდებულია, ზამთარში კი მცირდება.


    ბილიკი ჟაბეშიდან, მდინარე ტვიბერის მარცხენა ნაპირიდან იწყება და წყალს ახლოს მიჰყვება — იმდენად ახლოს,
    რომ ზოგან მდინარეს ბილიკი წაუღია და გზა დიდ ლოდებზე უნდა გაიკვლიოთ. კანიონის ფერდებიდან პატარა ჩანჩქერები
    ეშვება — ერთ-ერთს ადგილობრივები „დაღლილი ქალის ცრემლებს“ ეძახიან, — შუა გზაზე კი ქოხია, სადაც შეგიძლიათ
    შეისვენოთ. დაახლოებით 2310 მეტრზე ერთდღიანი მარშრუტი მთავრდება, იქ, სადაც ხეობა ყინულისკენ იხსნება:
    მოჩანს კვიტლოდის მყინვარი, ტიხტინგენის 4618-მეტრიანი მწვერვალი და ცანერის ხეობისკენ გადასასვლელი უღელტეხილი.
    მახლობლად პატარა ტბაა, სადაც მყინვარებზე მიმავალი ალპინისტები ბანაკს შლიან.


    ამის იქით უკვე თოკით სიარულია — ალპინიზმი და არა ლაშქრობა. უმეტესობისთვის თავად ხეობაა მიზანი და ესეც
    საკმარისია.
  tip: >-
    ეს სერიოზული მთის დღეა, წასვლა-მოსვლით 6–7 საათი, და არა სეირნობა. მესტიაში ან მულახში ადგილობრივი
    გიდი აიყვანეთ და ბილიკის ამჟამინდელი მდგომარეობა გამოკითხეთ: მდინარე ზოგჯერ მის მონაკვეთებს რეცხავს,
    გიდები კი თოკის თან ქონას გირჩევენ. გზას განთიადისას დაადექით, ჩაიცვით ნამდვილი სალაშქრო ფეხსაცმელი,
    წაიღეთ საწვიმარი, თბილი ფენა, საკვები და წყლის გასაწმენდი საშუალება — ჟაბეშის იქით მაღაზია აღარ არის.
    იარეთ მხოლოდ ივნისიდან სექტემბრამდე. ნუ აგერევათ სოფელ ტვიბერში, რომელიც სულ სხვა ადგილას, მესტიიდან
    დაახლოებით 13 კმ-ით დასავლეთითაა: ნავიგატორში ჟაბეში შეიყვანეთ. ლამარიის სამლოცველო ჟაბეშის ზემოთ,
    2230 მეტრზე, იმავე სოფლიდან დამოუკიდებელი ლაშქრობაა.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ ზუგდიდამდე იარეთ, შემდეგ შ7 გზით ჩრდილოეთით, ჯვრის გავლით,
    ენგურის ხეობას აუყევით მესტიამდე. იქიდან უშგულის გზით აღმოსავლეთისკენ კიდევ დაახლოებით 15 კმ-ია მულახის
    თემის სოფელ ჟაბეშამდე — სულ დაახლოებით 482 კმ და 8 საათი და 50 წუთი. მესტიამდე ასფალტია, შემდეგ გზა
    ძირითადად მოასფალტებულია; ციცაბო აღმართებისა და მთის ამინდის გამო ჯიპი სწორი არჩევანია. მანქანა ჟაბეშში
    დატოვეთ — იქით მანქანით ვერ წახვალთ. საწვავი მესტიაში ჩაასხით. რეალურად ორდღიანი გეგმა გჭირდებათ:
    ჩამოდით, მესტიაში ან მულახში გაათიეთ ღამე და განთიადისას გაუდექით გზას.
en:
  name: Tviberi Glacier
  short: >-
    A long, hard day up the roaring Tviberi gorge from Zhabeshi, past waterfalls and a mountain hut, to
    where the ice of the Mulkhra's source comes into view.
  body: >-
    **The Mulkhra river begins on the Tviberi Glacier, and the only way to meet it is on foot, up a gorge
    that punishes a careless step.**


    The glacier fills the head of a side valley north of Zhabeshi, one of the Mulakhi villages about 15
    km east of Mestia on the road to Ushguli; local guides put its length at around 9.5 km. Its meltwater,
    with snow, rain and springs, feeds the Mulkhra, a 27-kilometre right-bank tributary of the Enguri
    that runs high from April to October and shrinks through the winter.


    The path leaves Zhabeshi on the left bank of the Tviberi river and keeps close to the water, so close
    that in places the river has torn it away and you pick a line across big boulders instead. Small waterfalls
    spill down the sides of the canyon, one of them known locally as the Tears of the Tired Woman, and
    a hut offers shelter partway up. At around 2,310 metres the day route ends where the valley opens
    towards the ice: the Kvitlodi glacier, the 4,618-metre summit of Tikhtingeni and the pass across to
    the Tsaneri valley. A small lake nearby serves as the camp for alpinists going further, onto the glaciers
    themselves.


    Beyond that point it is roped mountaineering, not hiking. For most people the gorge is the destination,
    and it is enough.
  tip: >-
    This is a serious mountain day, 6 to 7 hours there and back, not a stroll. Hire a local guide in Mestia
    or Mulakhi and ask about the path's current state: the river sometimes washes sections away, and guides
    advise carrying a rope. Start at first light, wear proper boots and pack a waterproof, a warm layer,
    food and water treatment; there are no shops beyond Zhabeshi. Go only from June to September. Don't
    confuse this with Tviberi village, a different place about 13 km west of Mestia: set your navigation
    to Zhabeshi. The Lamaria chapel above Zhabeshi, at 2,230 m, is a separate walk from the same village.
  route: >-
    From Tbilisi take the S1 (E60) west to Zugdidi, then the Sh7 north through Jvari and up the Enguri
    gorge to Mestia. Carry on east along the Ushguli road for about 15 km to Zhabeshi, in the Mulakhi
    community: about 482 km and 8 hours 50 minutes in all. It is asphalt to Mestia and mostly paved beyond;
    an SUV is the right choice for the gradients and mountain weather. Park in Zhabeshi, because no vehicle
    goes further. Fuel up in Mestia. Realistically this is a two-day plan: drive, sleep in Mestia or Mulakhi,
    and walk at dawn.
ru:
  name: Ледник Твибери
  short: >-
    Долгий и трудный день вверх по ревущему ущелью Твибери от Жабеши — мимо водопадов и горного приюта
    туда, где открывается лёд, из которого рождается Мулхра.
  body: >-
    **Река Мулхра берёт начало на леднике Твибери, и встретиться с ним можно только пешком — поднявшись
    по ущелью, которое не прощает неосторожного шага.**


    Ледник заполняет верховье боковой долины к северу от Жабеши — одного из сёл общины Мулахи, примерно
    в 15 км к востоку от Местиа по дороге на Ушгули; местные гиды оценивают его длину примерно в 9,5 км.
    Его талые воды вместе со снегом, дождями и родниками питают Мулхру — 27-километровый правый приток
    Ингури, который полноводен с апреля по октябрь и мелеет за зиму.


    Тропа выходит из Жабеши по левому берегу реки Твибери и держится у самой воды — так близко, что местами
    река её размыла, и приходится выбирать путь по крупным валунам. По стенам каньона сбегают небольшие
    водопады — один из них местные называют «Слёзы усталой женщины», — а по дороге есть хижина, где можно
    укрыться. На высоте около 2310 метров однодневный маршрут заканчивается там, где долина раскрывается
    ко льду: ледник Квитлоди, вершина Тихтингени высотой 4618 метров и перевал в долину Цанери. Небольшое
    озеро неподалёку служит лагерем альпинистам, которые идут дальше, на сами ледники.


    Дальше — уже альпинизм в связках, а не трекинг. Для большинства целью становится само ущелье, и этого
    довольно.
  tip: >-
    Это серьёзный горный день, 6–7 часов туда и обратно, а не прогулка. Наймите местного гида в Местиа
    или Мулахи и расспросите о нынешнем состоянии тропы: река порой смывает целые участки, и гиды советуют
    брать верёвку. Выходите с рассветом, наденьте настоящие трекинговые ботинки и возьмите дождевик, тёплый
    слой, еду и средства для очистки воды; за Жабеши магазинов нет. Идите только с июня по сентябрь. Не
    путайте с селом Твибери — это другое место, примерно в 13 км к западу от Местиа: в навигаторе задавайте
    Жабеши. Часовня Ламария над Жабеши, на высоте 2230 м, — отдельный маршрут из того же села.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Зугдиди, затем по Sh7 на север через Джвари и вверх по ущелью Ингури
    до Местиа. Дальше на восток по дороге на Ушгули ещё около 15 км до Жабеши в общине Мулахи — всего
    примерно 482 км и 8 часов 50 минут. До Местиа асфальт, дальше дорога тоже в основном с покрытием;
    для подъёмов и горной погоды правильный выбор — внедорожник. Машину оставьте в Жабеши: дальше не проедет
    ни один автомобиль. Заправьтесь в Местиа. Реалистично это план на два дня: доехать, переночевать в
    Местиа или Мулахи и выйти на рассвете.
fa:
  name: یخچال طبیعی تویبری
  short: >-
    روزی دراز و دشوار در درهٔ خروشان تویبری از ژابشی، از کنار آبشارها و کلبه‌ای کوهستانی، تا جایی که یخِ
    سرچشمهٔ مولخرا پدیدار می‌شود.
  body: >-
    **رود مولخرا از یخچال تویبری سرچشمه می‌گیرد، و تنها راه دیدارش پیاده است، از دره‌ای که هیچ گام بی‌احتیاطی
    را نمی‌بخشد.**


    یخچال سرِ یک درهٔ فرعی را در شمال ژابشی پر کرده است؛ ژابشی یکی از روستاهای دهستان مولاخی است، حدود
    ۱۵ کیلومتری شرق مستیا بر جادهٔ اوشگولی. راهنمایان محلی درازای یخچال را حدود ۹٫۵ کیلومتر می‌دانند.
    آب ذوب‌شدهٔ آن، همراه با برف و باران و چشمه‌ها، مولخرا را سیراب می‌کند؛ شاخه‌ای ۲۷ کیلومتری در کرانهٔ
    راست انگوری که از آوریل تا اکتبر پرآب است و در طول زمستان کم‌آب می‌شود.


    کوره‌راه از ژابشی در کرانهٔ چپ رود تویبری آغاز می‌شود و به آب نزدیک می‌ماند؛ چنان نزدیک که در جاهایی
    رود آن را کنده و برده است و باید از روی تخته‌سنگ‌های درشت راهی برای خود بیابید. آبشارهای کوچک از دیواره‌های
    تنگه فرو می‌ریزند، که اهالی یکی از آن‌ها را «اشک‌های زن خسته» می‌نامند، و در میانهٔ راه کلبه‌ای سرپناه
    می‌دهد. در ارتفاع حدود ۲۳۱۰ متری، مسیر یک‌روزه جایی به پایان می‌رسد که دره رو به یخ گشوده می‌شود:
    یخچال کویتلودی، قلهٔ ۴۶۱۸ متری تیختینگنی و گردنه‌ای که به درهٔ تسانری می‌رود. دریاچه‌ای کوچک در آن
    نزدیکی اردوگاه کوهنوردانی است که دورتر، به سوی خودِ یخچال‌ها، می‌روند.


    از آنجا به بعد کوهنوردی با طناب است، نه پیاده‌روی. برای بیشتر مردم خودِ تنگه مقصد است، و همین بس.
  tip: >-
    این یک روز جدی کوهستانی است، ۶ تا ۷ ساعت رفت و برگشت، نه گردشی سبک. در مستیا یا مولاخی راهنمای محلی
    بگیرید و از وضع کنونی مسیر بپرسید: رود گاهی بخش‌هایی از آن را می‌شوید و می‌برد، و راهنماها توصیه می‌کنند
    طناب همراه داشته باشید. با نخستین روشنایی راه بیفتید، کفش کوهنوردی درست بپوشید و بارانی، لباس گرم،
    خوراک و وسیلهٔ تصفیهٔ آب بردارید؛ پس از ژابشی هیچ مغازه‌ای نیست. فقط از ژوئن تا سپتامبر بروید. آن
    را با روستای تویبری اشتباه نگیرید، که جای دیگری است در حدود ۱۳ کیلومتری غرب مستیا: مسیریاب را روی
    ژابشی تنظیم کنید. کلیسای کوچک لاماریا بالای ژابشی، در ارتفاع ۲۲۳۰ متر، مسیر پیاده‌روی جداگانه‌ای از
    همان روستاست.
  route: >-
    از تفلیس جادهٔ S1 (E60) را رو به غرب تا زوگدیدی بروید، سپس Sh7 را به سمت شمال از راه جواری و بالا
    در درهٔ انگوری تا مستیا. از آنجا حدود ۱۵ کیلومتر دیگر رو به شرق در جادهٔ اوشگولی تا ژابشی در دهستان
    مولاخی ادامه دهید: روی هم حدود ۴۸۲ کیلومتر و ۸ ساعت و ۵۰ دقیقه. تا مستیا آسفالت است و پس از آن هم
    بیشترش آسفالت؛ برای شیب‌ها و آب‌وهوای کوهستان، شاسی‌بلند انتخاب درستی است. خودرو را در ژابشی پارک
    کنید، چون هیچ وسیلهٔ نقلیه‌ای جلوتر نمی‌رود. در مستیا باک را پر کنید. واقع‌بینانه این برنامه‌ای دوروزه
    است: رانندگی، شب در مستیا یا مولاخی، و پیاده‌روی در سپیده‌دم.
he:
  name: קרחון טוויברי
  short: >-
    יום ארוך וקשה במעלה ערוץ טוויברי השוצף מז'בשי, על פני מפלים ובקתת הרים, עד המקום שבו נגלה הקרח שממנו
    נובע נהר המולחרה.
  body: >-
    **נהר המולחרה נובע מקרחון טוויברי, והדרך היחידה לפגוש אותו היא ברגל, במעלה ערוץ שמעניש כל צעד לא זהיר.**


    הקרחון ממלא את ראש עמק צדדי מצפון לז'בשי, אחד מכפרי מולאחי, כ-15 ק"מ מזרחית למסטיה על הדרך לאושגולי;
    מדריכים מקומיים מעריכים את אורכו בכ-9.5 ק"מ. מי ההפשרה שלו, יחד עם שלג, גשם ומעיינות, מזינים את המולחרה
    – יובל ימני של האנגורי באורך 27 ק"מ, שמימיו גואים מאפריל עד אוקטובר ומתמעטים במהלך החורף.


    השביל יוצא מז'בשי לאורך הגדה השמאלית של נהר טוויברי ונצמד למים, כל כך קרוב שבמקומות מסוימים הנהר קרע
    אותו, ובמקום שביל יש לבחור נתיב בין סלעים גדולים. מפלים קטנים נשפכים במורד דפנות הקניון – אחד מהם
    מכונה בפי המקומיים "דמעות האישה העייפה" – ובקתה בדרך מציעה מחסה. בגובה של כ-2,310 מטרים מסתיים מסלול
    היום, במקום שבו העמק נפתח אל הקרח: קרחון קוויטלודי, פסגת טיחטינגני בגובה 4,618 מטרים והמעבר אל עמק
    צאנרי. אגם קטן בסמוך משמש מחנה למטפסים הממשיכים הלאה, אל הקרחונים עצמם.


    מכאן והלאה זה כבר טיפוס הרים בחבלים, לא טרק. לרוב האנשים הערוץ עצמו הוא היעד, וזה מספיק.
  tip: >-
    זה יום הרים רציני, 6 עד 7 שעות הלוך ושוב, לא טיול קליל. שכרו מדריך מקומי במסטיה או במולאחי ושאלו על
    מצבו העדכני של השביל: הנהר סוחף לפעמים קטעים ממנו, ומדריכים ממליצים לקחת חבל. צאו עם אור ראשון, נעלו
    נעלי הליכה ראויות וארזו מעיל גשם, שכבה חמה, אוכל ואמצעי לטיהור מים; אחרי ז'בשי אין חנויות. העונה היא
    רק מיוני עד ספטמבר. אל תבלבלו עם הכפר טוויברי, מקום אחר לגמרי כ-13 ק"מ מערבית למסטיה: כוונו את הניווט
    לז'בשי. קפלת למריה מעל ז'בשי, בגובה 2,230 מ', היא מסלול הליכה נפרד מאותו כפר.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד זוגדידי, ואז צפונה בכביש Sh7 דרך ג'וארי ובמעלה ערוץ האנגורי עד
    מסטיה. המשיכו מזרחה בדרך לאושגולי עוד כ-15 ק"מ עד ז'בשי שבקהילת מולאחי: בסך הכול כ-482 ק"מ ו-8 שעות
    ו-50 דקות. עד מסטיה הכביש סלול, ומשם והלאה ברובו סלול; רכב שטח הוא הבחירה הנכונה בגלל השיפועים ומזג
    האוויר ההררי. חנו בז'בשי, כי משם אף רכב לא ממשיך. תדלקו במסטיה. באופן מציאותי זו תוכנית ליומיים: נוסעים,
    ישנים במסטיה או במולאחי, ויוצאים ברגל עם שחר.
ar:
  name: نهر تفيبيري الجليدي
  short: >-
    يوم طويل وشاق صعوداً في مضيق تفيبيري الهادر من جابيشي، مروراً بالشلالات وكوخ جبلي، حتى يظهر الجليد
    الذي ينبع منه نهر مولخرا.
  body: >-
    **ينبع نهر مولخرا من جليد تفيبيري، ولا سبيل إلى لقائه إلا سيراً على الأقدام، صعوداً في مضيق لا يغفر
    خطوة طائشة.**


    يملأ النهر الجليدي رأس وادٍ جانبي شمال جابيشي، إحدى قرى مولاخي على بعد نحو 15 كم شرق ميستيا على الطريق
    إلى أوشغولي؛ ويقدّر المرشدون المحليون طوله بنحو 9.5 كم. وتغذّي مياه ذوبانه، مع الثلوج والأمطار والينابيع،
    نهر مولخرا، وهو رافد أيمن لنهر إنغوري طوله 27 كم، يرتفع منسوبه من أبريل إلى أكتوبر ويشحّ طوال الشتاء.


    يخرج الدرب من جابيشي على الضفة اليسرى لمجرى تفيبيري ويلازم الماء ملازمة شديدة، حتى إن النهر جرفه في
    بعض المواضع، فتضطرون إلى شق طريقكم فوق صخور كبيرة. تنسكب شلالات صغيرة على جدران الوادي الضيق، يسمّي
    أهل المكان أحدها «دموع المرأة المتعبة»، وعلى الطريق كوخ يوفّر المأوى. وعلى ارتفاع نحو 2310 أمتار ينتهي
    مسار اليوم الواحد حيث ينفتح الوادي على الجليد: نهر كفيتلودي الجليدي، وقمة تيختينغيني بارتفاع 4618
    متراً، والممر المؤدي إلى وادي تسانيري. وبالقرب بحيرة صغيرة يتخذها مخيّماً متسلقو الجبال الماضون أبعد،
    إلى الأنهار الجليدية نفسها.


    ما بعد ذلك تسلق جبال بالحبال، لا مشي. أما معظم الناس فالمضيق نفسه وجهتهم، وهذا يكفي.
  tip: >-
    هذا يوم جبلي جاد، من 6 إلى 7 ساعات ذهاباً وإياباً، لا نزهة. استأجروا مرشداً محلياً في ميستيا أو مولاخي
    واسألوا عن حالة الدرب الراهنة: فالنهر يجرف أحياناً أجزاء منه، وينصح المرشدون بحمل حبل. انطلقوا مع
    أول الضوء، والبسوا أحذية مشي مناسبة، واحملوا معطفاً واقياً من المطر وطبقة دافئة وطعاماً ووسيلة لتنقية
    الماء؛ فلا متاجر بعد جابيشي. اذهبوا من يونيو إلى سبتمبر فقط. لا تخلطوا بينه وبين قرية تفيبيري، وهي
    مكان آخر على بعد نحو 13 كم غرب ميستيا: اضبطوا الملاحة على جابيشي. أما كنيسة لاماريا الصغيرة فوق جابيشي،
    على ارتفاع 2230 متراً، فمسار مشي منفصل من القرية نفسها.
  route: >-
    من تبليسي اسلكوا الطريق S1 (E60) غرباً حتى زوغديدي، ثم Sh7 شمالاً عبر جفاري وصعوداً في مضيق إنغوري
    حتى ميستيا. تابعوا شرقاً على طريق أوشغولي نحو 15 كم أخرى حتى جابيشي في منطقة مولاخي: قرابة 482 كم
    و8 ساعات و50 دقيقة إجمالاً. الطريق معبّد حتى ميستيا ومعظمه معبّد بعدها؛ وسيارة الدفع الرباعي هي الخيار
    الصحيح للمنحدرات وطقس الجبال. اركنوا في جابيشي، إذ لا تتقدم أي مركبة أبعد من ذلك. تزوّدوا بالوقود
    في ميستيا. واقعياً هذه خطة ليومين: القيادة، ثم المبيت في ميستيا أو مولاخي، والانطلاق سيراً عند الفجر.
