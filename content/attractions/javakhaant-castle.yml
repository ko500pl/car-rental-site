ka:
  name: ჯავახაანთ ციხე (დრისი)
  short: >-
    თეძმის პირას, ერთ კლდეზე დატეული მთელი ციხე-კარი: კოშკი, სასახლის ნანგრევი და მწვერვალზე მწვანე ტუფის
    წმინდა გიორგის ეკლესია.
  body: >-
    **ჯავახაანთ ციხე ერთ კლდეზე დატეული შუა საუკუნეების მთელი კარ-მიდამოა: გალავანი, კოშკი, სასახლე, სამეურნეო
    ნაგებობები და, ყველაზე მაღლა, მწვანე ქვის ეკლესია.**


    კლდე მდინარე თეძმის მარცხენა ნაპირზე აღმართულა, კასპის მუნიციპალიტეტის სოფელ ჭყოპიანიდან 400 მეტრით
    დასავლეთით; მეზობელი სოფლის სახელით მას დრისის ციხესაც ეძახიან. თავად სახელი პატარა საგვარეულო მატიანეა:
    „-ანთ“ ქართულში გვარის კუთვნილებას აღნიშნავს. ერთი ტურისტული წყარო ციხეს XII საუკუნით ათარიღებს, მშენებლებად
    თორელებს ასახელებს, შემდგომ მფლობელებად კი — ჯავახიშვილებს. სამეცნიერო ლიტერატურაში ეს ცნობა ვერ გადავამოწმეთ,
    ამიტომ ის კვალად მიიღეთ და არა განაჩენად. 2006 წლიდან ციხე ეროვნული მნიშვნელობის ძეგლია.


    მშენებლებმა ის გამოიყენეს, რასაც გორა აძლევდათ: ქვიშაქვა და რიყის ქვა, კლდის ფენებს მიყოლებული წყობით.
    ჩრდილოეთიდან კომპლექსს კოშკი იცავს; სამხრეთით მდგარი სასახლისგან დღეს თითქმის მხოლოდ კედლების ხაზიღა
    დარჩა, სამეურნეო ნაგებობები კი მძიმედაა დაზიანებული. სხვა ქვით მხოლოდ მწვერვალის ეკლესიაა ნაშენი:
    წმინდა გიორგის სახელობის ტაძარი მწვანე ტუფითაა აგებული, შესასვლელი კი დასავლეთიდან აქვს.


    ციხის აღმოსავლეთით, ხევის გაღმა, გორის მეორე მხარეს, მეორე, უფრო პატარა ეკლესია დგას — მისი კარი სამხრეთს
    გაჰყურებს. ნანგრევებისკენ ორი ბილიკი ადის: აღმოსავლეთისა, ტყეში გამავალი, შედარებით იოლია, დასავლეთისა
    კი — ციცაბო და მოუხერხებელი. აქ არც სალაროა, არც მოაჯირი და, უმეტესად, არც სხვა სტუმარი.


    ზოგი ამ ნანგრევს „თამარის ციხესაც“ უწოდებს — ისე, როგორც საქართველოში უამრავ ძველ კედელს; დედოფალს
    ამ კლდესთან არცერთი წყარო არ აკავშირებს. სამაგიეროდ, სახელის პატრონი გვარი ძებნას არ საჭიროებს: ჯავახა-ანთ
    უბრალოდ „ჯავახების კუთვნილს“ ნიშნავს.
  tip: >-
    აქ არც წყალია, არც ჩრდილი, არც საპირფარეშო: წყალი და ქუდი თან წაიღეთ, ივლისსა და აგვისტოში კი შუადღის
    ნაცვლად დილით ადით. ჩაიცვით კარგად მოჭიდებული ფეხსაცმელი — კლდეს ციცაბო კიდეები აქვს და მოაჯირი არსადაა,
    ამიტომ ბავშვები ახლოს გყავდეთ და დანგრეულ კედლებზე ნუ აძვრებით. აირჩიეთ აღმოსავლეთის, ტყის ბილიკი
    — ორიდან ის უფრო იოლია. შესვლა უფასოა და ციხე ყოველთვის ღიაა, მაგრამ წვიმის შემდეგ ბილიკიც და სოფლის
    გზაც სრიალა ხდება. ერთი საათი საკმარისია; დღე კასპის წმინდა გიორგის ეკლესიით ან სამთავისის ტაძრით
    შეავსეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით მცხეთისკენ იარეთ, იქიდან კი ძველ შ29 გზას გაჰყევით მტკვრის მარჯვენა
    ნაპირზე, კავთისხევის გავლით, დაახლოებით 30 კილომეტრი. შემდეგ სამხრეთით, შ129-ზე გადაუხვიეთ, დაახლოებით
    2 კმ-ში კი მარჯვნივ — ადგილობრივ გზაზე, რომელიც დასავლეთისკენ 4,5 კმ-ს მიუყვება ჭყოპიანამდე. სულ 63
    კმ-ია, დაახლოებით 1 საათი და 15 წუთი. სოფელთან ასფალტი მთავრდება; ბოლო მონაკვეთი კლდის ძირამდე ღრმა
    კვალით დაღარული გრუნტის გზაა. საწვავი მცხეთაში ან მაგისტრალზე ჩაასხით. გონივრული არჩევანია ჯიპი ან
    კროსოვერი: მშრალ ამინდში სედანიც გაივლის, წვიმის შემდეგ კი დაბალი მანქანა ტალახში ჩაეფლობა.
en:
  name: Javakhaant Castle (Drisi)
  short: >-
    A whole castle household on one rock above the Tedzami: tower, ruined palace and, at the summit, a
    green-tuff church of St George.
  body: >-
    **Javakhaant is an entire medieval household packed onto a single rock: wall, tower, palace, farm
    buildings and, at the very top, a church of green stone.**


    The rock rises on the left bank of the Tedzami river, 400 metres west of the village of Chqopiani
    in Kaspi Municipality; locals also call it the Drisi fortress, after the neighbouring village. The
    name is a small genealogy in itself: the ending *-ant* is how Georgian says "belonging to the family
    of". One travel source dates the castle to the 12th century, credits the Toreli nobles with building
    it and the Javakhishvilis with holding it later. No scholarly source we found confirms it: treat it
    as a lead, not a verdict. Since 2006 the castle has been protected as a Monument of National Importance.


    The builders used what the hill gave them — sandstone and river cobbles, laid along the rock's own
    layers. A tower guards the north side; the palace to the south is now little more than a line of walls;
    the farm buildings are badly damaged. Only the summit church is built of different stuff: dedicated
    to St George, it is made of green tuff, and you enter it from the west.


    East of the castle, across a ravine on the far side of the hill, stands a second, smaller church with
    its door facing south. Two paths climb to the ruins — an easier one through the forest from the east,
    a steep and awkward one from the west. There is no ticket booth, no railing and, most days, no one
    else.


    Some call the ruin "Tamar's fortress", as Georgians call a great many old walls; no source ties the
    queen to this rock. The family behind the name is easier to find: Javakha-ant simply means "of the
    Javakhas".
  tip: >-
    There is no water, shade or toilet here: bring water and a hat, and in July and August climb in the
    morning rather than at midday. Wear shoes with a proper grip — the rock has sheer edges and no railings
    anywhere, so keep children close and stay off the ruined walls. Take the eastern forest path, which
    is the easier of the two. Entry is free and the site is always open, but after rain both the path
    and the village track turn slippery. An hour is enough; pair it with Kaspi's St George's Church or
    Samtavisi Cathedral.
  route: >-
    From Tbilisi take the S1 (E60) towards Mtskheta, then follow the old Sh29 road along the right bank
    of the Mtkvari through Kavtiskhevi for about 30 km. Turn south onto the Sh129 and, after roughly 2
    km, bear right onto the local road that runs some 4.5 km west to Chqopiani. In all it is 63 km, about
    1 hr 15 min. The asphalt gives out near the village; the last stretch to the foot of the rock is a
    rutted dirt track. Fill up in Mtskheta or on the highway. An SUV or crossover is the sensible choice:
    a saloon copes in dry weather, but after rain the mud stops low cars.
ru:
  name: Крепость Джавахаант (Дриси)
  short: >-
    Целая крепостная усадьба на одной скале над Тедзами: башня, руины дворца и на вершине — церковь Святого
    Георгия из зелёного туфа.
  body: >-
    **Джавахаант — целое средневековое хозяйство, уместившееся на одной скале: стена, башня, дворец, хозяйственные
    постройки и на самой вершине — церковь из зелёного камня.**


    Скала поднимается на левом берегу реки Тедзами, в 400 метрах к западу от села Чкопиани в Каспском
    муниципалитете; местные зовут крепость ещё и Дриси — по соседнему селу. Само название — маленькая
    родословная: окончание *-ант* по-грузински означает «принадлежащий роду». Один туристический источник
    датирует крепость XII веком, приписывает её постройку князьям Торели, а позднейшее владение — Джавахишвили.
    Ни один научный источник, который мы нашли, этого не подтверждает: считайте это зацепкой, а не приговором.
    С 2006 года крепость охраняется как памятник национального значения.


    Строители брали то, что давал холм, — песчаник и речной булыжник, укладывая их вдоль природных пластов
    скалы. Северную сторону стережёт башня; от дворца на юге осталась лишь линия стен; хозяйственные постройки
    сильно разрушены. Только церковь на вершине сложена из другого материала: она посвящена святому Георгию,
    построена из зелёного туфа, и вход в неё — с запада.


    К востоку от крепости, за оврагом на дальнем склоне холма, стоит вторая, меньшая церковь с дверью
    на юг. К руинам ведут две тропы — более лёгкая через лес с востока и крутая, неудобная с запада. Здесь
    нет ни кассы, ни перил, а в большинство дней — и ни души.


    Некоторые называют руины «крепостью Тамары», как грузины называют великое множество старых стен; ни
    один источник не связывает царицу с этой скалой. Род, стоящий за названием, найти проще: Джаваха-ант
    значит просто «принадлежащая Джавахам».
  tip: >-
    Здесь нет ни воды, ни тени, ни туалета: возьмите воду и шляпу, а в июле и августе поднимайтесь утром,
    а не в полдень. Нужна обувь с хорошим сцеплением: у скалы отвесные края и нигде нет перил, так что
    держите детей рядом и не лезьте на разрушенные стены. Идите по восточной лесной тропе — она легче.
    Вход бесплатный, место открыто всегда, но после дождя и тропа, и сельская дорога становятся скользкими.
    Часа достаточно; совместите поездку с церковью Святого Георгия в Каспи или собором Самтависи.
  route: >-
    Из Тбилиси по S1 (E60) в сторону Мцхеты, затем около 30 км по старой дороге Sh29 вдоль правого берега
    Куры через Кавтисхеви. Сверните на юг на Sh129 и примерно через 2 км уйдите направо на местную дорогу,
    которая ведёт около 4,5 км на запад до Чкопиани. Всего 63 км, около 1 ч 15 мин. Асфальт заканчивается
    у села; последний отрезок до подножия скалы — разбитая грунтовка. Заправьтесь в Мцхете или на трассе.
    Разумный выбор — внедорожник или кроссовер: седан справится в сухую погоду, но после дождя грязь остановит
    низкую машину.
fa:
  name: قلعهٔ جاواخاآنت (دریسی)
  short: >-
    دژی کامل با همهٔ متعلقاتش بر یک صخره بالای رود تدزامی: برج، کاخی ویران و بر ستیغ، کلیسای گئورگی مقدس
    از توف سبز.
  body: >-
    **جاواخاآنت یک خانمان کامل قرون‌وسطایی است که بر یک صخره فشرده شده: بارو، برج، کاخ، ساختمان‌های مزرعه
    و بر بلندترین نقطه، کلیسایی از سنگ سبز.**


    صخره بر کرانهٔ چپ رود تدزامی، ۴۰۰ متر غرب روستای چقوپیانی در شهرستان کاسپی، سر برافراشته است؛ مردم
    محل قلعه را به نام روستای همسایه، دژ دریسی نیز می‌خوانند. خودِ نام شجره‌نامه‌ای کوچک است: پسوند *-آنت*
    در گرجی یعنی «از آنِ خاندانِ». یک منبع گردشگری قلعه را به سدهٔ دوازدهم نسبت می‌دهد، ساختش را کار اشراف
    تورلی و مالکیت بعدی‌اش را از آنِ جاواخیشویلی‌ها می‌داند. هیچ منبع علمی‌ای که یافتیم این را تأیید نمی‌کند:
    آن را سرنخ بدانید، نه حکم. از ۲۰۰۶ قلعه به‌عنوان اثری با اهمیت ملی حفاظت می‌شود.


    سازندگان از همان چیزی بهره بردند که تپه در اختیارشان می‌گذاشت: ماسه‌سنگ و قلوه‌سنگ رودخانه‌ای، که
    در امتداد لایه‌های خودِ صخره چیده شده‌اند. برجی از سوی شمال نگهبانی می‌دهد؛ از کاخ در جنوب اکنون چیزی
    جز رشته‌ای دیوار نمانده؛ ساختمان‌های مزرعه سخت آسیب دیده‌اند. تنها کلیسای ستیغ از مصالح دیگری است:
    وقف گئورگی مقدس است، از توف سبز ساخته شده و از غرب به آن وارد می‌شوید.


    در شرق قلعه، آن سوی آبکندی در دامنهٔ دیگر تپه، کلیسای دوم و کوچک‌تری ایستاده که درش رو به جنوب است.
    دو کوره‌راه به ویرانه‌ها می‌رسد: یکی آسان‌تر از میان جنگل از شرق، و دیگری پرشیب و ناهموار از غرب.
    نه باجهٔ بلیتی هست، نه نرده‌ای و در بیشتر روزها، نه هیچ‌کس دیگری.


    برخی این ویرانه را «قلعهٔ تامار» می‌نامند، همان‌گونه که گرجی‌ها بسیاری از دیوارهای کهن را می‌نامند؛
    هیچ منبعی ملکه را به این صخره پیوند نمی‌دهد. خاندانی که پشت این نام است آسان‌تر پیدا می‌شود: جاواخا-آنت
    به‌سادگی یعنی «از آنِ جاواخاها».
  tip: >-
    اینجا نه آب هست، نه سایه، نه سرویس بهداشتی: آب و کلاه همراه بیاورید و در ژوئیه و اوت صبح بالا بروید،
    نه نیمروز. کفشی با چسبندگی خوب بپوشید؛ صخره لبه‌های عمودی دارد و هیچ‌جا نرده نیست، پس کودکان را نزدیک
    خود نگه دارید و از دیوارهای ویران بالا نروید. کوره‌راه جنگلی شرقی را برگزینید که آسان‌تر است. ورود
    رایگان است و محوطه همیشه باز، اما پس از باران هم کوره‌راه و هم جادهٔ روستا لغزنده می‌شوند. یک ساعت
    کافی است؛ آن را با کلیسای گئورگی مقدس کاسپی یا کلیسای جامع سامتاویسی همراه کنید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی متسختا بروید، سپس جادهٔ قدیمی Sh29 را در کرانهٔ راست رود کورا (مت‌کواری)
    از راه کاوتیسخوی حدود ۳۰ کیلومتر دنبال کنید. به جنوب، به Sh129 بپیچید و پس از حدود ۲ کیلومتر به راست،
    به جادهٔ محلی‌ای بروید که حدود ۴٫۵ کیلومتر رو به غرب تا چقوپیانی می‌رود. روی هم ۶۳ کیلومتر، حدود ۱
    ساعت و ۱۵ دقیقه. آسفالت نزدیک روستا تمام می‌شود؛ تکهٔ آخر تا پای صخره راهی خاکی و پرچاله است. در متسختا
    یا کنار بزرگراه سوخت بگیرید. شاسی‌بلند یا کراس‌اوور انتخاب معقولی است: سواری در هوای خشک از پسش برمی‌آید،
    اما پس از باران گل‌ولای خودروهای کوتاه را زمین‌گیر می‌کند.
he:
  name: טירת ג'אוואחאאנט (דריסי)
  short: 'משק בית שלם של טירה על סלע אחד מעל נהר הטדזאמי: מגדל, ארמון הרוס ובפסגה כנסיית גאורגיוס הקדוש
    מטוף ירוק.'
  body: >-
    **ג'אוואחאאנט הוא משק בית ימי-ביניימי שלם הדחוס על סלע אחד: חומה, מגדל, ארמון, מבני משק, ובפסגה ממש
    – כנסייה מאבן ירוקה.**


    הסלע מתנשא על הגדה השמאלית של נהר הטדזאמי, 400 מטרים מערבית לכפר צ'קופיאני שבמחוז קאספי; המקומיים
    קוראים לטירה גם מבצר דריסי, על שם הכפר השכן. השם עצמו הוא אילן יוחסין זעיר: הסיומת *-אנט* היא הדרך
    הגאורגית לומר "השייך למשפחת". מקור תיירותי אחד מתארך את הטירה למאה ה-12, מייחס את בנייתה לאצילי בית
    טורלי ואת החזקתה המאוחרת לבני ג'אוואחישווילי. אף מקור מחקרי שמצאנו אינו מאשר זאת: התייחסו לכך ככיוון
    לבדיקה, לא כפסק דין. מאז 2006 הטירה מוגנת כאתר מורשת בעל חשיבות לאומית.


    הבונים השתמשו במה שהגבעה נתנה – אבן חול ואבני נחל מעוגלות, שהונחו לאורך שכבות הסלע עצמו. מגדל שומר
    על הצד הצפוני; מן הארמון שבדרום נותר כעת לא הרבה יותר מקו של קירות; מבני המשק ניזוקו קשות. רק הכנסייה
    שבפסגה בנויה מחומר אחר: היא מוקדשת לגאורגיוס הקדוש, בנויה מטוף ירוק, והכניסה אליה ממערב.


    ממזרח לטירה, מעבר לנקיק בצדה הרחוק של הגבעה, עומדת כנסייה שנייה, קטנה יותר, שדלתה פונה דרומה. שני
    שבילים עולים אל החורבות – קל יותר דרך היער ממזרח, ותלול ומסורבל ממערב. אין קופה, אין מעקה, וברוב הימים
    – אין איש מלבדכם.


    יש המכנים את החורבה "מבצר תמר", כפי שהגאורגים מכנים המון חומות עתיקות; אף מקור אינו קושר את המלכה
    לסלע הזה. את המשפחה שמאחורי השם קל יותר למצוא: ג'אוואחא-אנט פירושו פשוט "של בני ג'אוואחא".
  tip: >-
    אין כאן מים, צל או שירותים: הביאו מים וכובע, וביולי ובאוגוסט עלו בבוקר ולא בצהריים. נעלו נעליים עם
    אחיזה טובה – לסלע יש שוליים זקופים כקיר ואין מעקות בשום מקום, לכן שמרו על הילדים קרוב ואל תטפסו על
    החומות ההרוסות. בחרו בשביל היער המזרחי, הקל מבין השניים. הכניסה חופשית והאתר פתוח תמיד, אבל אחרי גשם
    גם השביל וגם דרך הכפר נעשים חלקלקים. שעה מספיקה; שלבו את הביקור עם כנסיית גאורגיוס הקדוש בקאספי או
    עם קתדרלת סמתאוויסי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) לכיוון מצחתה, ואז המשיכו כ-30 ק"מ בכביש הישן Sh29 לאורך הגדה הימנית של
    נהר קורה (מטקוורי) דרך קאבטיסחווי. פנו דרומה לכביש Sh129 ואחרי כ-2 ק"מ המשיכו ימינה לדרך המקומית,
    שמובילה כ-4.5 ק"מ מערבה עד צ'קופיאני. בסך הכול 63 ק"מ, כשעה ורבע. האספלט נגמר ליד הכפר; הקטע האחרון
    עד רגלי הסלע הוא דרך עפר משובשת. תדלקו במצחתה או על הכביש המהיר. רכב שטח או קרוסאובר הוא הבחירה הנבונה:
    מכונית סדאן תסתדר במזג אוויר יבש, אבל אחרי גשם הבוץ עוצר מכוניות נמוכות.
ar:
  name: قلعة جافاخاانت (دريسي)
  short: >-
    دار قلعة كاملة على صخرة واحدة فوق نهر تيدزامي: برج، وقصر متهدم، وعلى القمة كنيسة القديس جاورجيوس من
    التوف الأخضر.
  body: >-
    **جافاخاانت دارٌ كاملة بكل مرافقها من العصور الوسطى حُشرت على صخرة واحدة: سور وبرج وقصر ومبانٍ زراعية،
    وعلى القمة تماماً كنيسة من الحجر الأخضر.**


    ترتفع الصخرة على الضفة اليسرى لنهر تيدزامي، على بعد 400 متر غرب قرية تشكوبياني في بلدية كاسبي؛ ويسمي
    الأهالي القلعة أيضاً حصن دريسي، نسبة إلى القرية المجاورة. والاسم نفسه شجرة نسب صغيرة: فاللاحقة *-انت*
    هي طريقة الجورجية في قول «المنتمي إلى أسرة». ينسب مصدر سياحي واحد القلعة إلى القرن الثاني عشر، ويعزو
    بناءها إلى نبلاء توريلي وامتلاكها لاحقاً إلى آل جافاخيشفيلي. لم نجد مصدراً علمياً يؤكد ذلك: فاعتبروه
    خيطاً للبحث لا حكماً نهائياً. ومنذ عام 2006 تحظى القلعة بالحماية بوصفها معلماً ذا أهمية وطنية.


    استخدم البناؤون ما جاد به التل من حجر رملي وحصى نهري، رصّوه على امتداد طبقات الصخر نفسه. يحرس برجٌ
    الجهة الشمالية؛ أما القصر في الجنوب فلم يبقَ منه اليوم سوى خط من الجدران؛ والمباني الزراعية متضررة
    بشدة. وحدها الكنيسة على القمة مبنية من مادة أخرى: فهي مكرّسة للقديس جاورجيوس، مشيّدة من التوف الأخضر،
    ويُدخل إليها من الغرب.


    إلى الشرق من القلعة، عبر وهدة على الجانب الآخر من التل، تقف كنيسة ثانية أصغر بابها متجه جنوباً. ويصعد
    دربان إلى الأطلال: أسهلهما عبر الغابة من الشرق، والآخر شديد الانحدار وعسير من الغرب. لا شباك تذاكر
    ولا درابزين، وفي معظم الأيام لا أحد سواكم.


    يسمي بعضهم هذه الأطلال «قلعة تامار»، كما يسمي الجورجيون كثيراً من الأسوار القديمة؛ ولا يربط أي مصدر
    الملكة بهذه الصخرة. أما الأسرة التي وراء الاسم فالعثور عليها أيسر: فـ«جافاخا-انت» تعني ببساطة «لآل
    جافاخا».
  tip: >-
    لا ماء هنا ولا ظل ولا مرحاض: أحضروا ماءً وقبعة، واصعدوا في يوليو وأغسطس صباحاً لا عند الظهيرة. البسوا
    أحذية جيدة القبضة؛ فللصخرة حواف عمودية ولا درابزين في أي مكان، لذا أبقوا الأطفال قريبين ولا تصعدوا
    على الجدران المتهدمة. اسلكوا درب الغابة الشرقي، فهو الأسهل. الدخول مجاني والموقع مفتوح دائماً، لكن
    الدرب وطريق القرية يصيران زلقين بعد المطر. تكفي ساعة؛ واجمعوا الزيارة مع كنيسة القديس جاورجيوس في
    كاسبي أو كاتدرائية سامتافيسي.
  route: >-
    من تبليسي اسلكوا الطريق S1 (E60) باتجاه متسخيتا، ثم اتبعوا الطريق القديم Sh29 على الضفة اليمنى لنهر
    كورا (متكفاري) عبر كافتيسخيفي نحو 30 كم. انعطفوا جنوباً إلى Sh129، وبعد نحو 2 كم انحرفوا يميناً إلى
    الطريق المحلي الذي يمتد نحو 4.5 كم غرباً إلى تشكوبياني. المجموع 63 كم، أي نحو ساعة و15 دقيقة. ينتهي
    الإسفلت قرب القرية؛ والمقطع الأخير حتى سفح الصخرة طريق ترابي مليء بالأخاديد. تزودوا بالوقود في متسخيتا
    أو على الطريق السريع. الخيار الحكيم سيارة دفع رباعي أو كروس أوفر: فالسيارة الصالون تتدبر أمرها في
    الطقس الجاف، لكن الوحل بعد المطر يوقف السيارات المنخفضة.
