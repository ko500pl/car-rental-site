ka:
  name: მურის ციხე
  short: >-
    ლეჩხუმის კლდოვანი ციხე ცაგერის თავზე: საბრძოლო შეძახილებივით დასახელებული კოშკები და, გადმოცემით,
    მაქსიმე აღმსარებლის საფლავი.
  body: >-
    **XVIII საუკუნის გეოგრაფმა ვახუშტი ბატონიშვილმა მურის ციხე ისე აღწერა, რომ დღემდე ტრაბახივით ჟღერს:
    „არავისგან შემუსვრილ-აღებული“.**


    ციხე ცაგერის კიდეზე, ცხენისწყლის თავზე აღმართულ კლდოვან ქედზე დგას. ისტორიკოსმა სიმონ ყაუხჩიშვილმა
    ის სქიომარის ციხედ მიიჩნია — იმ სიმაგრედ, რომელიც, VI საუკუნის ბიზანტიელი ისტორიკოსის, პროკოფი კესარიელის
    თქმით, სკვიმნიიდან სვანეთისკენ მიმავალ გზას კეტავდა. გვიანანტიკური ხანიდან 1867 წლამდე მური ხეობის
    პოლიტიკური ცენტრი იყო და მოპირდაპირე ნაპირზე მდგარ რაგვის კოშკთან ერთად ცხენისწყლის ხეობიდან ბარისკენ
    მიმავალ გზებს კეტავდა. XVIII საუკუნის დასაწყისიდან ციხე დადიანების რეზიდენცია გახდა; 1770 წელს აქაურ
    სასახლეში გარდაიცვალა ერეკლე II-ის და ელისაბედი, სამეგრელოს მთავრის კაცია დადიანის მეუღლე.


    გადმოცემა ციხის ნაწილებს ბრძანებების სახელებს არქმევს. მტრის მოახლოებისას აღმოსავლეთის საყარაულო კოშკი,
    „ჰკა მაგას“, თავციხეს გასძახებდა: „მტერი მოვიდა, მარჯვედ დახვდი!“ — თავციხეს სწორედ „მარჯვედ დახვდი“
    ერქვა. როცა დამარცხებული მტერი პირს იბრუნებდა და დასავლეთის კოშკთან ჩაივლიდა, თავციხე ამ კოშკს გასძახებდა:
    „არ გაუშვა!“


    დღეს ციხეზე ოთხი კოშკია შემორჩენილი. დააკვირდით კლდეში ამოღრმავებულ ადგილს, სადაც ოდესღაც ჭა იყო,
    და აღმოსავლეთ ნაწილში ორსართულიანი სახლის ნანგრევს — სავარაუდოდ, დადიანების სასახლეს. დასავლეთის კოშკის
    ძირში მონასტერი და საფლავია, რომელსაც გადმოცემა 662 წელს გადასახლებაში გარდაცვლილ ბიზანტიელ ღვთისმეტყველს,
    მაქსიმე აღმსარებელს, მიაწერს; ეს ცნობა XII საუკუნის ხელნაწერის არშიაზე გაკეთებულ მინაწერს ეყრდნობა.


    ვახუშტის სიამაყეს ალყის თქმულებაც ხსნის. ოსმალთა ჯარი ციხის ძირში დაბანაკდა და მეციხოვნეთა დაშიმშილებას
    ელოდა. მათ კი კირი ჰქონდათ დამარაგებული და ყოველდღე კედლიდან ერთ-ორ კასრს ძირს ყრიდნენ. ალყის შემკვრელებმა
    იფიქრეს, იმდენი ფქვილი აქვთ, რომ უფუჭდებათო. ზამთარი რომ მოახლოვდა, ბანაკი აიშალა — და მური აუღებელი
    დარჩა.
  tip: >-
    ასვლასა და დათვალიერებას საათნახევარი დაუთმეთ. ბილიკი ციცაბოა: ნელა იარეთ და კარგი ძირის ფეხსაცმელი
    ჩაიცვით — წვიმის შემდეგ ქვა და თიხა სრიალებს. ზემოთ ვერაფერს იყიდით, წყალი თან წაიღეთ. კედლები არამდგრადია:
    დაათვალიერეთ, მაგრამ ზედ ნუ აძვრებით. ზაფხულში მაღალ ბალახში ტკიპები გვხვდება, გრძელი შარვალი გამოგადგებათ.
    თუ წმინდა მაქსიმეს მონასტერსაც ესტუმრებით, ჩაიცვით ისე, როგორც მოქმედ ეკლესიაში შეჰფერის: მხრები და
    მუხლები დაფარული, ქალებს — თავსაფარი. კაფე, მაღაზია და ტუალეტი ცაგერშია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, შემდეგ შ16-ით რიონის ხეობით, ტვიშის გავლით ალპანამდე და
    შ18-ით ცაგერამდე: დაახლოებით 326 კმ და ხუთი საათი. გზა ბოლომდე ასფალტიანია; ქუთაისის შემდეგ ვიწრო
    და კლაკნილია, მაგრამ ეკონომკლასის მანქანა ნებისმიერ სეზონზე გაივლის, ზამთარში — ზამთრის საბურავებით.
    ციხე ქალაქის ჩრდილო-აღმოსავლეთ კიდეზე, ცენტრიდან დაახლოებით ორ კილომეტრში, ქედზე დგას: ნავიგატორში
    „მურის ციხე“ მონიშნეთ, მანქანა ქედის ძირში დატოვეთ და ბილიკის დასაწყისი ადგილობრივებს ჰკითხეთ. საწვავი
    ქუთაისში ჩაასხით; ცაგერში ბენზინგასამართი არის, მაგრამ არჩევანი მცირეა.
en:
  name: Muri Fortress
  short: >-
    Lechkhumi's cliff-top stronghold above Tsageri, with towers named like battle cries and, by tradition,
    the grave of Maximus the Confessor.
  body: >-
    **Prince Vakhushti, the 18th-century geographer, described Muri in words that still read like a boast:
    'never breached or taken by anyone'.**


    The fortress stands on a rocky ridge at the edge of Tsageri, above the Tskhenistskali. The historian
    Simon Kaukhchishvili identified it with Skiomaris, the stronghold that, according to the 6th-century
    Byzantine historian Procopius, barred the road from Skvimnia to Svaneti. From late antiquity until
    1867 Muri was the political centre of the valley, and together with the Ragvi tower on the opposite
    bank it closed the roads from the gorge to the lowlands. From the early 18th century it was a residence
    of the Dadiani. In 1770 Elisabed, sister of King Erekle II and wife of Katsia Dadiani, Prince of Mingrelia,
    died in its palace.


    Tradition gives its parts the names of shouted orders. When an enemy approached, the eastern watchtower,
    Hk'a Magas ('Strike him!'), would call to the keep: 'The enemy is here, meet them well!' The keep
    itself was called Marjved Dakhvdi, 'Meet them well'. When the beaten enemy turned back past the western
    tower, the keep would call to it: Ar Gaushva, 'Don't let him go!'


    Four towers survive. Look for the hollow in the rock where the well once was, and for the ruined two-storey
    house in the eastern part, probably the Dadiani palace. At the foot of the western tower are a monastery
    and a grave that tradition assigns to Maximus the Confessor, the Byzantine theologian who died in
    exile in 662. The claim rests on a note in the margin of a 12th-century manuscript.


    A siege legend explains the boast. An Ottoman army camped below to starve the garrison out. Every
    day the defenders tipped a barrel or two of lime over the wall, and the besiegers took it for flour
    so plentiful it was spoiling. As winter drew near they struck camp, and Muri stayed untaken.
  tip: >-
    Allow an hour and a half for the climb and the ruins. The path is steep, so take it slowly and wear
    shoes with a good grip, because stone and clay turn slippery after rain. There is nothing to buy at
    the top, so carry water. The walls are unstable: look, but don't climb. Long trousers help against
    ticks in the summer grass. If you visit the monastery of St Maximus, dress as you would for any working
    church, with shoulders and knees covered and a headscarf for women. Cafés, shops and toilets are in
    Tsageri.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh16 up the Rioni gorge through Tvishi to
    Alpana and the Sh18 across to Tsageri. That is about 326 km and five hours. It is asphalt all the
    way, narrow and winding after Kutaisi, and an economy car copes in any season with winter tyres in
    the cold months. The fortress stands on the ridge at the north-eastern edge of town, about 2 km from
    the centre. Set your navigator to Muristsikhe, leave the car at the foot of the ridge and ask locally
    where the path starts. Fill up in Kutaisi. Tsageri has a station, but little choice.
ru:
  name: Крепость Мури
  short: >-
    Скальная твердыня Лечхуми над Цагери: башни с именами, похожими на боевые кличи, и, по преданию, могила
    Максима Исповедника.
  body: >-
    **Царевич Вахушти, географ XVIII века, описал Мури словами, которые и сегодня звучат как похвальба:
    «никем не сокрушённая и не взятая».**


    Крепость стоит на скалистом гребне на окраине Цагери, над Цхенисцкали. Историк Симон Каухчишвили отождествил
    её со Скиомарисом — твердыней, которая, по словам византийского историка VI века Прокопия, запирала
    дорогу из Сквимнии в Сванетию. С поздней античности до 1867 года Мури был политическим центром долины,
    а вместе с башней Рагви на противоположном берегу перекрывал пути из ущелья на равнину. С начала XVIII
    века здесь была резиденция Дадиани. В 1770 году во дворце крепости умерла Елисабед — сестра царя Ираклия
    II и жена владетельного князя Мегрелии Кации Дадиани.


    Предание дало частям крепости имена выкрикнутых приказов. Когда приближался враг, восточная сторожевая
    башня, Хка магас («Бей его!»), кричала цитадели: «Враг пришёл, встречай достойно!» Саму цитадель так
    и звали — Марджвед дахвди, «Встречай достойно». А когда разбитый враг поворачивал назад мимо западной
    башни, цитадель кричала ей: Ар гаушва — «Не упусти!»


    Сохранились четыре башни. Найдите углубление в скале, где когда-то был колодец, и руины двухэтажного
    дома в восточной части — вероятно, дворца Дадиани. У подножия западной башни стоят монастырь и могила,
    которую предание связывает с Максимом Исповедником, византийским богословом, умершим в изгнании в
    662 году. Эта атрибуция держится лишь на одной записи на полях рукописи XII века.


    Похвальбу объясняет легенда об осаде. Османское войско встало лагерем внизу, чтобы взять гарнизон
    измором. Каждый день защитники опрокидывали со стены бочку-другую извести, а осаждавшие принимали
    её за муку — мол, её там столько, что она уже портится. К зиме они сняли лагерь, и Мури так и остался
    невзятым.
  tip: >-
    Отведите на подъём и осмотр руин полтора часа. Тропа крутая: идите не спеша и надевайте обувь с цепкой
    подошвой — после дождя камень и глина скользят. Наверху ничего не купить, так что возьмите воду. Стены
    неустойчивы: смотрите, но не залезайте. Летом в высокой траве водятся клещи, выручат длинные брюки.
    Если заглянете в монастырь святого Максима, оденьтесь как для любой действующей церкви: плечи и колени
    закрыты, женщинам — платок. Кафе, магазины и туалеты — в Цагери.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh16 вверх по ущелью Риони через Твиши до Алпаны
    и по Sh18 до Цагери. Это около 326 км и пять часов. Асфальт на всём пути; после Кутаиси дорога узкая
    и извилистая, но машина эконом-класса проедет в любой сезон, зимой — на зимней резине. Крепость стоит
    на гребне у северо-восточной окраины города, примерно в 2 км от центра. Введите в навигатор Muristsikhe,
    оставьте машину у подножия гребня и спросите у местных, где начинается тропа. Заправьтесь в Кутаиси:
    в Цагери заправка есть, но выбор невелик.
fa:
  name: دژ موری
  short: دژ صخره‌ای لچخومی بر فراز تساگری؛ برج‌هایی با نام‌هایی چون فریاد نبرد و، به روایت سنت، آرامگاه
    ماکسیموس معترف.
  body: >-
    **شاهزاده واخوشتی، جغرافی‌دان سدهٔ هجدهم، موری را با کلماتی وصف کرد که هنوز هم بوی فخر می‌دهد: «به
    دست هیچ‌کس نه شکسته شد و نه گشوده».**


    دژ بر ستیغی سنگی در کنارهٔ تساگری، بالای رود تسخنیستسکالی، ایستاده است. سیمون کائوخچیشویلی، مورخ گرجی،
    آن را همان اسکیوماریس دانست؛ دژی که به گفتهٔ پروکوپیوس، مورخ بیزانسی سدهٔ ششم، راه اسکویمنیا به سوانتی
    را می‌بست. از اواخر دوران باستان تا ۱۸۶۷ موری مرکز سیاسی دره بود و همراه برج راگوی در کرانهٔ روبه‌رو،
    راه‌های تنگه به دشت را سد می‌کرد. از آغاز سدهٔ هجدهم اقامتگاه خاندان دادیانی شد. در ۱۷۷۰ الیسابد،
    خواهر شاه ارکلی دوم و همسر کاتسیا دادیانی، فرمانروای مگرلیا، در کاخ همین دژ درگذشت.


    روایت بر هر بخش دژ نام فرمانی را نهاده که فریاد زده می‌شد. چون دشمن نزدیک می‌شد، برج دیده‌بانی شرقی،
    «هکا ماگاس» («بزنش!»)، ارگ را ندا می‌داد: «دشمن رسید، خوب به استقبالش برو!» نام خود ارگ هم «مارجود
    داخودی» بود، یعنی «خوب به استقبالش برو». و چون دشمنِ شکست‌خورده بازمی‌گشت و از کنار برج غربی می‌گذشت،
    ارگ به آن بانگ می‌زد: «آر گائوشوا»، یعنی «نگذار برود!»


    چهار برج برجا مانده است. گودی درون صخره را که روزگاری چاه بوده بجویید، و ویرانهٔ خانه‌ای دوطبقه در
    بخش شرقی را که احتمالاً کاخ دادیانی‌ها بوده است. پای برج غربی صومعه‌ای است و گوری که سنت آن را از
    آنِ ماکسیموس معترف می‌داند، الهی‌دان بیزانسی که در ۶۶۲ در تبعید درگذشت. این انتساب تنها بر یادداشتی
    در حاشیهٔ دست‌نوشته‌ای از سدهٔ دوازدهم تکیه دارد.


    افسانهٔ یک محاصره راز آن فخر را می‌گشاید. سپاهی عثمانی پای دژ اردو زد تا پادگان را با گرسنگی از پا
    درآورد. مدافعان هر روز یکی دو بشکه آهک از فراز دیوار فرو می‌ریختند و محاصره‌کنندگان آن را آرد پنداشتند؛
    آردی چنان فراوان که دارد خراب می‌شود. زمستان که نزدیک شد، اردو برچیدند و موری همچنان ناگشوده ماند.
  tip: >-
    برای بالا رفتن و گشتن در ویرانه‌ها یک ساعت و نیم وقت بگذارید. کوره‌راه شیب تندی دارد؛ آهسته بروید
    و کفشی با کف چسبنده بپوشید، چون پس از باران سنگ و گِل لیز می‌شود. بالا چیزی برای خرید نیست، پس آب
    همراه داشته باشید. دیوارها ناپایدارند: تماشا کنید، اما از آن‌ها بالا نروید. در علف‌های بلند تابستان
    کنه هست و شلوار بلند به کارتان می‌آید. اگر به صومعهٔ قدیس ماکسیموس سر می‌زنید، چنان بپوشید که در هر
    کلیسای فعالی شایسته است: شانه‌ها و زانوها پوشیده، و برای بانوان روسری. کافه، مغازه و سرویس بهداشتی
    در تساگری است.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سمت غرب تا کوتائیسی بروید، سپس با Sh16 در تنگهٔ ریونی بالا بروید و از
    تویشی بگذرید تا آلپانا، و از آنجا با Sh18 به تساگری برسید. روی هم حدود ۳۲۶ کیلومتر و پنج ساعت. تمام
    راه آسفالت است؛ پس از کوتائیسی باریک و پرپیچ‌وخم می‌شود، ولی خودروی اقتصادی در هر فصلی از پسش برمی‌آید،
    و در ماه‌های سرد با لاستیک زمستانی. دژ بر ستیغی در لبهٔ شمال‌شرقی شهر، حدود ۲ کیلومتری مرکز، ایستاده
    است. در مسیریاب Muristsikhe را وارد کنید، خودرو را پای ستیغ بگذارید و از اهالی بپرسید کوره‌راه از
    کجا شروع می‌شود. در کوتائیسی باک را پر کنید؛ تساگری پمپ‌بنزین دارد، ولی انتخاب کم است.
he:
  name: מבצר מורי
  short: 'מעוז הצוק של לצ''חומי מעל צאגרי: מגדלים ששמותיהם נשמעים כקריאות קרב, ולפי המסורת – קברו של מקסימוס
    המוודה.'
  body: >-
    **הנסיך וחושטי, הגאוגרף בן המאה ה-18, תיאר את מורי במילים שנשמעות עד היום כהתפארות: "מעולם לא נפרץ
    ולא נכבש בידי איש".**


    המבצר ניצב על רכס סלעי בשולי צאגרי, מעל נהר הצחניסצקלי. ההיסטוריון סימון קאוחצ'ישווילי זיהה אותו עם
    סקיומריס – המעוז שלפי פרוקופיוס, ההיסטוריון הביזנטי בן המאה ה-6, חסם את הדרך מסקווימניה לסוואנטי.
    מסוף העת העתיקה ועד 1867 היה מורי המרכז המדיני של העמק, ויחד עם מגדל רגווי שעל הגדה שממול חסם את הדרכים
    מן הערוץ אל השפלה. מראשית המאה ה-18 שימש מקום מושב לבית דדיאני. ב-1770 מתה בארמון שבמבצר אליסבד, אחותו
    של המלך ארקלה השני ורעייתו של קציה דדיאני, נסיך מגרליה.


    המסורת נתנה לחלקי המבצר שמות של פקודות צעוקות. כשאויב התקרב, מגדל התצפית המזרחי, "הקא מגס" ("הכה בו!"),
    היה קורא אל המצודה: "האויב כאן, קדם את פניו כראוי!" המצודה עצמה נקראה "מרג'ווד דחוודי" – "קדם את פניו
    כראוי". וכשהאויב המובס נסוג וחלף על פני המגדל המערבי, קראה אליו המצודה: "אר גאושווה" – "אל תניח לו
    לחמוק!"


    ארבעה מגדלים שרדו. חפשו את השקע בסלע שבו הייתה פעם באר, ואת חורבת הבית הדו-קומתי בחלק המזרחי – כנראה
    ארמון בית דדיאני. למרגלות המגדל המערבי עומדים מנזר וקבר שהמסורת מייחסת למקסימוס המוודה, התאולוג הביזנטי
    שמת בגלות ב-662. הייחוס נשען על הערה אחת בשולי כתב יד מן המאה ה-12.


    אגדה על מצור מסבירה את ההתפארות. צבא עות'מאני חנה למרגלות המבצר כדי להרעיב את חיל המצב. מדי יום שפכו
    המגינים חבית או שתיים של סיד מעבר לחומה, והעות'מאנים סברו שזה קמח – כל כך הרבה קמח, שהוא כבר מתקלקל.
    כשהחורף התקרב פירקו את המחנה, ומורי נותר בלתי נכבש.
  tip: >-
    הקדישו שעה וחצי לעלייה ולחורבות. השביל תלול, אז עלו לאט ונעלו נעליים עם אחיזה טובה, כי אבן וחימר נעשים
    חלקלקים אחרי גשם. למעלה אין מה לקנות, לכן קחו מים. החומות אינן יציבות: הסתכלו, אבל אל תטפסו עליהן.
    מכנסיים ארוכים יעזרו נגד קרציות בעשב הגבוה של הקיץ. אם תבקרו במנזר מקסימוס הקדוש, התלבשו כמו לכל כנסייה
    פעילה: כתפיים וברכיים מכוסות, ולנשים כיסוי ראש. בתי קפה, חנויות ושירותים יש בצאגרי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה עד קוטאיסי, משם בכביש Sh16 במעלה ערוץ הריוני דרך טווישי עד אלפנה,
    ובכביש Sh18 עד צאגרי. בסך הכול כ-326 ק"מ וחמש שעות. הכביש סלול לכל אורכו, צר ומפותל אחרי קוטאיסי,
    ורכב אקונומי יעבור בכל עונה – בחודשים הקרים עם צמיגי חורף. המבצר ניצב על הרכס בקצה הצפון-מזרחי של
    העיר, כ-2 ק"מ מהמרכז. הזינו בניווט Muristsikhe, השאירו את הרכב למרגלות הרכס ושאלו את המקומיים היכן
    מתחיל השביל. תדלקו בקוטאיסי: בצאגרי יש תחנת דלק, אבל הבחירה דלה.
ar:
  name: قلعة موري
  short: 'معقل ليتشخومي الصخري فوق تساغيري: أبراج تحمل أسماءً كصيحات القتال، وفيه بحسب التقليد قبر مكسيموس
    المعترف.'
  body: >-
    **وصف الأمير فاخوشتي، جغرافيّ القرن الثامن عشر، قلعة موري بكلمات ما زالت تُقرأ كأنها مفاخرة: «لم يخترقها
    أحد ولم يستولِ عليها قط».**


    تقوم القلعة على سلسلة صخرية عند طرف تساغيري، فوق نهر تسخينيستسكالي. وقد رأى المؤرخ سيمون كاوختشيشفيلي
    أنها سكيوماريس، الحصن الذي قال المؤرخ البيزنطي بروكوبيوس في القرن السادس إنه كان يسدّ الطريق من سكفيمنيا
    إلى سفانيتي. ومنذ أواخر العصور القديمة حتى عام 1867 ظلّت موري المركز السياسي للوادي، وكانت مع برج
    راغفي على الضفة المقابلة تغلق الطرق من المضيق إلى السهول. ومنذ مطلع القرن الثامن عشر صارت مقراً لآل
    دادياني. وفي عام 1770 توفيت في قصرها إليسابيد، أخت الملك إريكلي الثاني وزوجة كاتسيا دادياني أمير ميغريليا.


    ويمنح التقليد أجزاء القلعة أسماءَ أوامر تُطلق صياحاً. فإذا اقترب العدو نادى برجُ المراقبة الشرقي،
    «هكا ماغاس» («اضربه!»)، القلعةَ الداخلية: «جاء العدو، فأحسِن لقاءه!» وكانت القلعة الداخلية نفسها تُدعى
    «مارجفيد داخفدي»، أي «أحسِن لقاءه». وحين كان العدو المهزوم يرتدّ مارّاً بالبرج الغربي، كانت تناديه:
    «آر غاوشفا»، أي «لا تدعه يفلت!»


    وقد بقيت أربعة أبراج. ابحثوا عن التجويف في الصخر حيث كانت البئر، وعن أطلال بيت من طابقين في الجزء
    الشرقي، لعله قصر آل دادياني. وعند سفح البرج الغربي دير وقبر ينسبه التقليد إلى مكسيموس المعترف، اللاهوتي
    البيزنطي الذي مات منفياً عام 662. ولا يستند هذا النسب إلا إلى تعليق على هامش مخطوط من القرن الثاني
    عشر.


    وتفسّر أسطورةُ حصارٍ تلك المفاخرة. فقد عسكر جيش عثماني عند السفح ليُجوِّع الحامية حتى تستسلم. وكان
    المدافعون كل يوم يقلبون برميلاً أو اثنين من الجير من فوق السور، فظنه المحاصِرون دقيقاً وفيراً إلى
    حد أنه صار يفسد. ومع اقتراب الشتاء فكّوا معسكرهم، وبقيت موري عصيّة لم تُؤخذ.
  tip: >-
    خصّصوا ساعة ونصفاً للصعود والتجوّل بين الأطلال. الدرب شديد الانحدار، فتمهّلوا وانتعلوا أحذية تثبت
    على الأرض جيداً، لأن الحجر والطين يصبحان زلقين بعد المطر. لا شيء يُباع في الأعلى، فاحملوا معكم الماء.
    الأسوار غير ثابتة: تأمّلوها ولا تتسلّقوها. والسراويل الطويلة تقي من القراد في عشب الصيف الطويل. وإن
    زرتم دير القديس مكسيموس فالبسوا كما يليق بأي كنيسة تُقام فيها الصلوات، مع ستر الكتفين والركبتين، وغطاء
    رأس للنساء. المقاهي والمتاجر ودورات المياه في تساغيري.
  route: >-
    من تبليسي خذوا الطريق S1 (E60) غرباً إلى كوتايسي، ثم الطريق Sh16 صعوداً في مضيق ريوني عبر تفيشي حتى
    ألبانا، ثم الطريق Sh18 إلى تساغيري. المسافة نحو 326 كم والرحلة خمس ساعات. الطريق معبّد حتى النهاية،
    ضيق ومتعرّج بعد كوتايسي، وتجتازه سيارة اقتصادية في أي فصل، مع إطارات شتوية في الأشهر الباردة. تقوم
    القلعة على السلسلة الصخرية عند الطرف الشمالي الشرقي للبلدة، على بعد نحو 2 كم من المركز. أدخلوا Muristsikhe
    في جهاز الملاحة، واتركوا السيارة عند سفح السلسلة، واسألوا الأهالي عن بداية الدرب. تزوّدوا بالوقود
    في كوتايسي؛ ففي تساغيري محطة، لكن الخيارات قليلة.
