ka:
  name: მურის ციხე
  short: >-
    ლეჩხუმის ციხე კლდეზე ცაგერის თავზე — სამი კოშკი, ბრძანებებივით ჟღერადი სახელებით და ხეობის სრული
    ხედი.
  body: >-
    **მური ის ციხეა, რომელიც არასდროს აუღიათ.** ის ცაგერის ზემოთ, ციცაბო კლდეზე დგას, დაახლოებით ექვსას სამოცდაათი მეტრის სიმაღლეზე, და ცხენისწყლის ხეობას ორივე მიმართულებით აკონტროლებს. სწორედ ამიტომ იყო ის საუკუნეების განმავლობაში ლეჩხუმის — ისტორიული სკვიმნიისა და თაკვერის — პოლიტიკური და ეკონომიკური ცენტრი.


    კომპლექსი აღმოსავლეთიდან დასავლეთისკენ სამი ნაწილისგან შედგება, და გადმოცემა თითოეულს სახელს ბრძანების ფორმით აძლევს: **„ჰიე მაგრად“**, **„მარჯვედ დახვდი“** და **„არ გაუშვა“**. პირველი პატარა სათვალთვალო კოშკია, ასვლისას პირველი საგუშაგო; მთავარი ნაგებობა ზემოთაა, დასავლეთ კოშკთან კი მონასტრის ნაშთია.


    ალყა აქ ბევრჯერ იდგა — მათ შორის ოსმალური თარეშების დროს — და ციხემ ყოველთვის გაუძლო. ამის მიზეზი პროზაულია: კლდე მიუდგომელი იყო, გარნიზონს კი წყალიცა და მარაგიც ჰქონდა.


    2018 წელს კლდის ფერდობზე კიბიანი და განათებული ბილიკი გაიყვანეს, ასვლა კი მას შემდეგ გაცილებით მარტივი გახდა — ადრე ეს ნამდვილი ცოცვა იყო. ზემოდან ცხენისწყლის ხეობა შორს ჩანს, ქვემოთ ცაგერის სახურავები, ხოლო ჩრდილოეთით ქვემო სვანეთის სოფლები.


    ლეჩხუმი მთელი შუა საუკუნეების განმავლობაში სადავო მიწა იყო: მას სამეგრელოს დადიანები და იმერეთის მეფეები ერთმანეთს ეცილებოდნენ, მური კი ის კვანძი იყო, რომლის ფლობაც ხეობის ფლობას ნიშნავდა. როცა 1867 წელს ადმინისტრაციული ცენტრი ქვემოთ, ცაგერში გადავიდა, ციხემ დანიშნულება დაკარგა და დაცარიელდა — დღევანდელი ცაგერი სწორედ მურის მემკვიდრეა. კომპლექსში წყლის შენახვის სისტემის ნაშთებიც ჩანს, რაც ალყის დროს მთავარი იყო.


    გაზაფხულზე და შემოდგომაზე, როცა ფოთოლი მცირეა, ქვის წყობა უკეთ იკითხება; ზაფხულში მცენარეულობა კედლების დიდ ნაწილს ფარავს. საღამოს განათებული ციხე ქალაქიდანაც კარგად ჩანს.
  tip: >-
    საათნახევარი საკმარისია, ასვლის ჩათვლით. ბილიკი კიბიანია, მაგრამ ციცაბო — გულის ან მუხლის პრობლემით ნელა აიღე; მოაჯირი ყველგან არ არის. სველ ამინდში ქვის საფეხურები სრიალებს. წყალი თან წაიღე, ზემოთ ვერაფერს იყიდი. ნანგრევებში კედლები არამდგრადია, ზემოთ ცოცვა არ ღირს. ბალახში ტკიპებია — ზაფხულში გრძელი შარვალი. ტუალეტი, კაფე და მაღაზია ცაგერშია, ბილიკის დასაწყისიდან ხუთიოდე წუთში.
  route: >-
    ციხე ცაგერის თავზეა და ქალაქიდან ფეხით ადიან. თბილისიდან E60-ით ქუთაისამდე, შემდეგ წყალტუბოზე და ალპანაზე ცაგერამდე — 326 კმ, დაახლოებით ხუთი საათი. გზა ბოლომდე ასფალტია; ალპანასა და ცაგერს შორის მონაკვეთი ვიწროა და ცხენისწყალს მიუყვება. მანქანა ცაგერის ცენტრში დატოვე და ბილიკის ნიშანს გაჰყევი. საწვავი ქუთაისსა და ცაგერში აიღე. ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Muri Fortress
  short: >-
    A Lechkhumi stronghold on the cliff above Tsageri — three towers with names that read like orders,
    and the whole valley below.
  body: >-
    **Muri is the fortress that was never taken.** It stands on a sheer cliff above Tsageri at about 670 metres, watching the Tskhenistskali valley in both directions. That position made it the political and economic centre of Lechkhumi — the historical provinces of Skvimnia and Takveri — for centuries.


    The complex runs east to west in three parts, and tradition gives each of them a name in the imperative: **"strike hard"**, **"meet them well"** and **"let none through"**. The first is a small watchtower, the initial checkpoint on the way up; the main building stands higher, and beside the western tower are the remains of a monastery.


    The fortress was besieged repeatedly, including during Ottoman raids, and it held every time. The reason is prosaic: the rock was unclimbable and the garrison had both water and stores.


    In 2018 a stepped and lit path was built up the cliff face, and the ascent has been far easier ever since — before that it was a genuine scramble. From the top the Tskhenistskali valley runs away into the distance, the roofs of Tsageri sit directly below, and the villages of Lower Svaneti show to the north.


    Throughout the Middle Ages Lechkhumi was contested ground, claimed in turn by the Dadiani of Samegrelo and the kings of Imereti, and Muri was the knot: holding it meant holding the valley. When the administrative centre moved down to Tsageri in 1867 the fortress lost its purpose and emptied — the modern town below is Muri's direct successor. Traces of the water storage system are still visible within the walls, and that was the thing that mattered most under siege.


    In spring and autumn, with the leaves thin, the masonry reads much more clearly; by midsummer vegetation covers a good deal of the walls. After dark the lit fortress is visible from the town.
  tip: >-
    An hour and a half is enough, including the climb. The path has steps but is steep, so take it slowly with heart or knee trouble; there is no handrail the whole way. In wet weather the stone treads are slippery. Carry water, since nothing is sold above. The walls are unstable and climbing on them is a bad idea. There are ticks in the long grass, so wear long trousers in summer. Toilets, a cafe and a shop are in Tsageri, five minutes from the foot of the path.
  route: >-
    The fortress is directly above Tsageri and is reached on foot from the town. From Tbilisi take the E60 to Kutaisi, then head north via Tskaltubo and Alpana to Tsageri — 326 km, about five hours. The road is asphalt throughout; the stretch between Alpana and Tsageri is narrow and follows the Tskhenistskali closely. Leave the car in the centre of Tsageri and follow the signed path. Fuel at Kutaisi and Tsageri. An economy car is entirely sufficient.
ru:
  name: Крепость Мури
  short: >-
    Лечхумская твердыня на скале над Цагери — три башни с названиями, звучащими как приказы, и вся
    долина внизу.
  body: >-
    **Мури — крепость, которую так и не взяли.** Она стоит на отвесной скале над Цагери, примерно на 670 метрах, и держит под наблюдением долину Цхенисцкали в обе стороны. Именно поэтому она столетиями оставалась политическим и экономическим центром Лечхуми — исторических Сквимнии и Таквери.


    Комплекс вытянут с востока на запад и состоит из трёх частей, каждой из которых предание даёт имя в повелительном наклонении: **«бей крепче»**, **«встречай смело»** и **«не пропусти»**. Первая — небольшая сторожевая башня, первый пост на подъёме; главное здание стоит выше, а рядом с западной башней сохранились остатки монастыря.


    Крепость осаждали не раз, в том числе во время османских набегов, и она выстояла всегда. Причина прозаична: скала была неприступна, а у гарнизона хватало воды и припасов.


    В 2018 году по склону проложили лестничную и освещённую тропу, и подъём стал заметно проще — прежде это было настоящее карабканье. Сверху долина Цхенисцкали уходит вдаль, прямо под ногами лежат крыши Цагери, а на севере видны сёла Нижней Сванетии.


    Всё Средневековье Лечхуми оставалось спорной землёй, на которую поочерёдно притязали мегрельские Дадиани и имеретинские цари, а Мури был тем узлом, обладание которым означало обладание долиной. Когда в 1867 году административный центр спустился в Цагери, крепость потеряла смысл и опустела — сегодняшний городок внизу и есть прямой наследник Мури. Внутри стен ещё видны следы системы хранения воды, а именно она была главным во время осады.


    Весной и осенью, когда листвы мало, кладка читается гораздо лучше; к середине лета растительность закрывает значительную часть стен. В темноте подсвеченная крепость хорошо видна из города.
  tip: >-
    Полутора часов хватит вместе с подъёмом. Тропа со ступенями, но крутая: с проблемами сердца или коленей идите медленно, перил на всём пути нет. В сырую погоду каменные ступени скользят. Возьмите воду, наверху ничего не продают. Стены неустойчивы, лазать по ним не стоит. В высокой траве есть клещи, летом надевайте длинные брюки. Туалеты, кафе и магазин — в Цагери, в пяти минутах от начала тропы.
  route: >-
    Крепость стоит прямо над Цагери, и подниматься к ней надо пешком из города. Из Тбилиси по E60 до Кутаиси, затем на север через Цхалтубо и Алпану до Цагери — 326 км, около пяти часов. Дорога асфальтированная на всём протяжении; участок Алпана — Цагери узкий и идёт вплотную к Цхенисцкали. Машину оставляйте в центре Цагери и идите по указателю. Заправки в Кутаиси и Цагери. Машины эконом-класса вполне достаточно.
fa:
  name: دژ موری
  short: >-
    دژ لچخومی بر صخرهٔ بالای تساگری — سه برج با نام‌هایی که مانند فرمان‌اند، و تمام درّه در پایین.
  body: >-
    **موری دژی است که هرگز گشوده نشد.** بر صخره‌ای عمودی بالای تساگری در حدود ۶۷۰ متری ایستاده و درّهٔ تسخنیستسکالی را در هر دو جهت زیر نظر دارد. همین موقعیت آن را قرن‌ها مرکز سیاسی و اقتصادی لچخومی، یعنی ولایت‌های تاریخی اسکویمنیا و تاکوری، نگه داشت.


    مجموعه از شرق به غرب سه بخش دارد و روایت به هر یک نامی به صیغهٔ امر داده است: **«محکم بزن»**، **«خوب پیشوازشان برو»** و **«هیچ‌کس را رد نکن»**. نخستین برجی کوچک و دیدبانی است، اولین ایست در راه بالا؛ بنای اصلی بالاتر ایستاده و کنار برج غربی بازمانده‌های صومعه‌ای هست.


    دژ بارها محاصره شد، از جمله در تاختن‌های عثمانی، و هر بار پایداری کرد. دلیلش هم ساده است: صخره صعودناپذیر بود و پادگان هم آب داشت و هم آذوقه.


    در سال ۲۰۱۸ راهی پلکانی و روشن بر دیوارهٔ صخره ساختند و از آن پس صعود بسیار آسان‌تر شده است؛ پیش از آن واقعاً باید بالا می‌خزیدی. از بالا درّهٔ تسخنیستسکالی تا دوردست کشیده می‌شود، بام‌های تساگری درست زیر پا هستند و روستاهای سوانتی پایین در شمال پیدا می‌شوند.


    در سراسر سده‌های میانه لچخومی سرزمینی مورد نزاع ماند که دادیانی‌های سامگرلو و پادشاهان ایمرتی به نوبت مدعی‌اش بودند، و موری همان گره بود: نگه داشتنش یعنی نگه داشتن درّه. وقتی در ۱۸۶۷ مرکز اداری به تساگریِ پایین منتقل شد، دژ کارکردش را از دست داد و خالی شد؛ شهرک امروزیِ زیر آن جانشین مستقیم موری است. درون دیوارها هنوز نشانه‌های سامانهٔ ذخیرهٔ آب دیده می‌شود، و همان بود که در محاصره بیش از هر چیز اهمیت داشت.


    در بهار و پاییز، وقتی برگ کم است، سنگ‌چین بسیار خواناتر می‌شود؛ تا میانهٔ تابستان پوشش گیاهی بخش بزرگی از دیوارها را می‌پوشاند. شب‌ها دژ روشن‌شده از شهر هم دیده می‌شود.
  tip: >-
    یک ساعت و نیم با احتساب صعود کافی است. مسیر پله دارد اما تند است؛ با ناراحتی قلبی یا زانو آهسته بروید، چون در همهٔ طول راه نرده نیست. در هوای مرطوب پله‌های سنگی لیز می‌شوند. آب همراه ببرید، چون بالا چیزی فروخته نمی‌شود. دیوارها ناپایدارند و بالا رفتن از آنها فکر بدی است. در علف بلند کنه هست، پس در تابستان شلوار بلند بپوشید. سرویس بهداشتی و کافه و مغازه در تساگری است، پنج دقیقه از آغاز مسیر.
  route: >-
    دژ درست بالای تساگری است و از خود شهر پیاده به آن می‌روند. از تفلیس با E60 تا کوتائیسی، سپس به شمال از تسخالتوبو و آلپانا تا تساگری — ۳۲۶ کیلومتر، حدود پنج ساعت. جاده تا انتها آسفالت است؛ بخش آلپانا تا تساگری باریک است و چسبیده به تسخنیستسکالی می‌رود. خودرو را در مرکز تساگری بگذارید و تابلوی مسیر را دنبال کنید. سوخت در کوتائیسی و تساگری. خودروی اقتصادی کاملاً کافی است.
he:
  name: מבצר מורי
  short: >-
    מעוז לצ'חומי על הצוק שמעל צאגרי — שלושה מגדלים ששמותיהם נשמעים כפקודות, וכל העמק מתחת.
  body: >-
    **מורי הוא המבצר שמעולם לא נכבש.** הוא עומד על צוק תלול מעל צאגרי בגובה כ-670 מטר, ומשקיף על עמק הצחניסצקאלי לשני הכיוונים. העמדה הזאת עשתה אותו למרכז המדיני והכלכלי של לצ'חומי — המחוזות ההיסטוריים סקווימניה וטאקוורי — במשך מאות שנים.


    המכלול נמתח ממזרח למערב בשלושה חלקים, והמסורת נותנת לכל אחד מהם שם בציווי: **"הכה חזק"**, **"קדם את פניהם היטב"** ו**"אל תיתן לאיש לעבור"**. הראשון מגדל תצפית קטן, נקודת הבידוק הראשונה בדרך למעלה; המבנה המרכזי עומד גבוה יותר, ולצד המגדל המערבי שרידי מנזר.


    המבצר נצור פעמים רבות, ובכללן בפשיטות עות'מאניות, ובכל פעם עמד. הסיבה פרוזאית: הסלע לא היה בר טיפוס, ולחיל המצב היו גם מים וגם מלאי.


    ב-2018 נסלל בצלע הצוק שביל מדורג ומואר, ומאז העלייה קלה בהרבה — קודם לכן היה זה טיפוס של ממש. מלמעלה נמתח עמק הצחניסצקאלי אל המרחק, גגות צאגרי ממש מתחת, וכפרי סוונטי התחתונה נראים מצפון.


    לאורך כל ימי הביניים הייתה לצ'חומי ארץ שנויה במחלוקת, שתבעו לעצמם לסירוגין בית דאדיאני מסמגרלו ומלכי אימרתי, ומורי היה הקשר: מי שהחזיק בו החזיק בעמק. כשעבר המרכז המנהלי ב-1867 מטה אל צאגרי, איבד המבצר את תכליתו והתרוקן — העיירה של היום שלמטה היא יורשתו הישירה של מורי. בתוך החומות עדיין נראים שרידי מערכת אגירת המים, וזה היה הדבר החשוב ביותר בעת מצור.


    באביב ובסתיו, כשהעלווה דלילה, הבנייה נקראת בבירור רב יותר; באמצע הקיץ הצמחייה מכסה חלק ניכר מן החומות. בחשכה נראה המבצר המואר גם מן העיירה.
  tip: >-
    שעה וחצי מספיקה, כולל העלייה. בשביל יש מדרגות אך הוא תלול, לכן עם בעיות לב או ברכיים עלו לאט; אין מעקה לכל האורך. במזג אוויר רטוב מדרגות האבן חלקלקות. קחו מים, שכן למעלה אין מה לקנות. הקירות אינם יציבים וטיפוס עליהם הוא רעיון רע. בעשב הגבוה יש קרציות, לכן לבשו מכנסיים ארוכים בקיץ. שירותים, בית קפה וחנות יש בצאגרי, חמש דקות מתחילת השביל.
  route: >-
    המבצר נמצא ממש מעל צאגרי ומגיעים אליו ברגל מן העיירה. מטביליסי בכביש E60 עד קותאיסי, ומשם צפונה דרך צחלטובו ואלפאנה עד צאגרי — 326 ק״מ, כחמש שעות. הכביש סלול לכל אורכו; הקטע בין אלפאנה לצאגרי צר ונצמד לצחניסצקאלי. השאירו את הרכב במרכז צאגרי ולכו לפי השילוט. דלק בקותאיסי ובצאגרי. רכב חסכוני מספיק לחלוטין.
ar:
  name: قلعة موري
  short: >-
    معقل لتشخومي على الجرف فوق تساغيري — ثلاثة أبراج بأسماء تُقرأ كأوامر، والوادي كله في الأسفل.
  body: >-
    **موري هي القلعة التي لم تسقط قط.** تقف على جرف شديد الانحدار فوق تساغيري عند نحو 670 متراً، وتراقب وادي تسخينيستسكالي في الاتجاهين. وهذا الموقع هو الذي جعلها قروناً المركز السياسي والاقتصادي للتشخومي، أي ولايتَي سكفيمنيا وتاكفيري التاريخيتين.


    يمتد المجمّع من الشرق إلى الغرب في ثلاثة أقسام، وتمنح الرواية كلاً منها اسماً بصيغة الأمر: **«اضرب بقوة»** و**«استقبلهم جيداً»** و**«لا تدع أحداً يمرّ»**. الأول برج مراقبة صغير، وهو أول نقطة تفتيش في الصعود؛ والبناء الرئيسي أعلى منه، وإلى جانب البرج الغربي بقايا دير.


    حوصرت القلعة مراراً، ومن ذلك في الغارات العثمانية، وصمدت في كل مرة. والسبب بسيط: الصخر كان يتعذّر تسلّقه، وكان لدى الحامية ماء ومؤونة.


    وفي عام 2018 شُقّ في وجه الجرف درب مدرّج ومضاء، فصار الصعود أيسر بكثير؛ وكان قبل ذلك تسلّقاً حقيقياً. ومن الأعلى يمتد وادي تسخينيستسكالي إلى البعيد، وتقع سطوح تساغيري تحتك مباشرة، وتظهر شمالاً قرى سوانيتي السفلى.


    ظلت لتشخومي طوال العصور الوسطى أرضاً متنازعاً عليها، يدّعيها بالتناوب آل دادياني في سامغريلو وملوك إيميريتي، وكانت موري العقدة: من أمسك بها أمسك بالوادي. وحين انتقل المركز الإداري عام 1867 إلى تساغيري في الأسفل، فقدت القلعة غرضها وخلت — والبلدة الحالية تحتها هي وريثة موري المباشرة. وما زالت داخل الأسوار آثار منظومة خزن الماء ظاهرة، وهي التي كانت تعني كل شيء وقت الحصار.


    وفي الربيع والخريف، حين يقلّ الورق، تُقرأ المداميك أوضح بكثير؛ أما في منتصف الصيف فيغطي النبات جزءاً كبيراً من الأسوار. وبعد حلول الظلام تُرى القلعة المضاءة من البلدة أيضاً.
  tip: >-
    ساعة ونصف تكفي بما فيها الصعود. في الدرب درجات لكنه حاد، فتمهّل إن كانت لديك مشكلة في القلب أو الركبتين؛ ولا درابزين على امتداده كله. وفي الجو الرطب تزلق الدرجات الحجرية. احمل ماء، فلا شيء يُباع في الأعلى. الجدران غير مستقرة وتسلّقها فكرة سيئة. وفي العشب الطويل قُراد، فالبس بنطالاً طويلاً في الصيف. أما دورات المياه والمقهى والدكان ففي تساغيري، على بُعد خمس دقائق من بداية الدرب.
  route: >-
    القلعة فوق تساغيري مباشرة ويُصعد إليها سيراً من البلدة. من تبليسي على الطريق E60 إلى كوتايسي، ثم شمالاً عبر تسخالتوبو وألبانا إلى تساغيري — 326 كم، نحو خمس ساعات. الطريق معبّد بكامله؛ ومقطع ألبانا–تساغيري ضيق يلاصق نهر تسخينيستسكالي. اترك السيارة في وسط تساغيري واتبع اللافتة. الوقود في كوتايسي وتساغيري. وسيارة اقتصادية تكفي تماماً.
