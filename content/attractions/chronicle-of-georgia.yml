ka:
  name: საქართველოს ისტორიის მემორიალი
  short: წერეთლის უზარმაზარი ბრინჯაოს სვეტები თბილისის ზღვის ზემოთ — ქალაქის ყველაზე დრამატული ხედი მზის
    ჩასვლისას.
  body: >-
    **თექვსმეტი სვეტი, თითოეული თექვსმეტი მეტრი სიმაღლის, ცარიელ გორაზე.** ზურაბ წერეთელმა ეს მემორიალი
    1985 წელს დაიწყო და ის დღემდე დაუსრულებელია — ნაწილობრივ სწორედ ეს დაუმთავრებლობა ქმნის ადგილის უცნაურ,
    თითქმის კინემატოგრაფიულ განწყობას. ტურისტულ ბროშურებში ის იშვიათად ხვდება, ინსტაგრამში კი გაცილებით
    ხშირად.


    სვეტების ქვედა ნახევარზე რელიეფებით გამოსახულია საქართველოს მეფეები, დედოფლები, გმირები და პოეტები
    — ვახტანგ გორგასლიდან შოთა რუსთაველამდე. ზედა ნახევარი ბიბლიურ სცენებს ეთმობა: ქრისტეს დაბადება, ჯვარცმა,
    აღდგომა. ერთი ვერტიკალის ორ ბოლოში ეროვნული და სასულიერო ისტორია ხვდება ერთმანეთს — იდეა, რომელიც
    წერეთელს არაერთხელ გაუმეორებია.


    გორის კიდიდან ხედი თბილისის ზღვაზე იშლება: ხელოვნური წყალსაცავი, ქარის ტურბინები, სტეპური ბორცვები.
    ეს პეიზაჟი ქალაქის ჩვეულ სახეს არ ჰგავს — უფრო შუა აზიას მოგაგონებს.


    იქვე, სვეტების უკან, დგას პატარა ეკლესია და ღია ამფითეატრის მსგავსი ტერასა, საიდანაც წყალსაცავი სრულად
    ჩანს. ხალხი აქ ჩვეულებრივ ორ საქმეს აკეთებს: სვეტებს შორის დადის და რელიეფებს ათვალიერებს, შემდეგ
    კიდეზე ჯდება და მზის ჩასვლას ელოდება.


    პრაქტიკული სიმართლე: ადგილი პრაქტიკულად მიტოვებულია. ბილეთი არ არსებობს, დაცვა და ინფრასტრუქტურა თითქმის
    არ არის, ღამით განათება არ მუშაობს, ბეტონის მოედანი ადგილ-ადგილ დამსკდარია. ეს არც ხარვეზია და არც
    ღირსება — უბრალოდ ასეთია და სწორედ ამიტომ არის აქ ხშირად თითქმის ცარიელი მაშინაც კი, როცა ძველ თბილისში
    ფეხის დადგმა არ შეიძლება.
  tip: >-
    საუკეთესო დროა მზის ჩასვლამდე ერთი საათი — სვეტები დასავლეთისკენ დგას და ბრინჯაო ოქროსფრად ინთება.
    ჩაბნელების შემდეგ არ დარჩე: განათება არ არის და ბილიკები არათანაბარია. ჩრდილი ზაფხულში პრაქტიკულად
    არ არსებობს, ქარი კი მუდმივია — ქუდი და წყალი წაიღე. ტუალეტი, კაფე და ბანკომატი ადგილზე არ არის, უახლოესი
    ინფრასტრუქტურა თბილისის ზღვის მიმდებარე გზაზეა. ერთი საათი სავსებით საკმარისია.
  route: >-
    მემორიალი ქალაქის ჩრდილოეთ კიდეზეა, თბილისის ზღვის დასავლეთ ნაპირთან. ცენტრიდან წადი ჯორჯ ბუშის ქუჩით
    ან თბილისის ზღვის გზით — დაახლოებით 25–30 წუთი. ბოლო ორი კილომეტრი ვიწრო, დაზიანებული ასფალტია, ორმოებით,
    მაგრამ გავლადი. ნავიგატორი ზოგჯერ ცუდ მოსახვევს გთავაზობს, ამიტომ ორიენტირად აიღე თბილისის ზღვის სანაპირო
    გზა და მისი ზედა განშტოება. პარკინგი უფასოა, პირდაპირ სვეტებთან. ეკონომ-კლასის მანქანა კმარა, თუმცა
    კროსოვერზე ბოლო მონაკვეთი უფრო კომფორტულია.
en:
  name: The Chronicle of Georgia
  short: Tsereteli's colossal bronze pillars above the Tbilisi Sea — the city's most cinematic sunset
    viewpoint.
  body: >-
    **Sixteen pillars, each about sixteen metres tall, standing on an empty hill.** Zurab Tsereteli began
    this monument in 1985 and it has never been finished, which is part of why the site feels so strange
    and so cinematic. It rarely appears in printed guidebooks and constantly appears on Instagram.


    The lower half of each column carries relief figures of Georgian kings, queens, heroes and poets,
    from Vakhtang Gorgasali to Shota Rustaveli. The upper half is given to biblical scenes: the Nativity,
    the Crucifixion, the Resurrection. National history and sacred history meet at the two ends of the
    same vertical, an idea Tsereteli returned to throughout his career.


    From the edge of the hill the view opens over the Tbilisi Sea, the large reservoir that supplies the
    city, with wind turbines on the ridges and dry steppe hills beyond. The landscape looks nothing like
    the rest of Tbilisi and rather more like Central Asia.


    One practical truth: the place is essentially unmanaged. There is no ticket, no real infrastructure,
    no lighting after dark, and the concrete platform is cracked in places. That is neither a flaw nor
    a virtue, simply what it is — and the reason it is often almost empty when you arrive.
  tip: >-
    Come in the hour before sunset: the columns face west and the bronze catches fire in that light. Do
    not linger after dark, since there is no lighting and the surfaces are uneven. There is no shade at
    all in summer and the wind is constant, so bring a hat and water. No toilets, café or ATM on site
    — the nearest facilities are along the Tbilisi Sea road. An hour is more than enough time here, unless
    you are photographing.
  route: >-
    The monument stands on the northern edge of the city near the western shore of the Tbilisi Sea. From
    the centre take George Bush Street or the Tbilisi Sea road, roughly 25 to 30 minutes. The last two
    kilometres are narrow, patched asphalt with potholes, but perfectly passable. Navigation apps sometimes
    suggest a poor turning, so use the Tbilisi Sea shore road and its upper branch as your reference.
    Parking is free right at the columns. An economy car copes, though a crossover makes the last stretch
    more comfortable.
ru:
  name: Хроника Грузии
  short: Огромные бронзовые колонны Церетели над Тбилисским морем — самая кинематографичная закатная площадка
    города.
  body: >-
    **Шестнадцать колонн высотой около шестнадцати метров на пустом холме.** Зураб Церетели начал этот
    монумент в 1985 году, и он так и не был закончен — отчасти именно поэтому место производит такое странное,
    почти кинематографическое впечатление. В печатных путеводителях его встретишь редко, в инстаграме
    — постоянно.


    Нижняя половина каждой колонны занята рельефами грузинских царей, цариц, героев и поэтов, от Вахтанга
    Горгасали до Шота Руставели. Верхняя отдана библейским сценам: Рождество, Распятие, Воскресение. Национальная
    и священная история сходятся на двух концах одной вертикали — идея, к которой Церетели возвращался
    всю жизнь.


    С края холма открывается вид на Тбилисское море, крупное водохранилище, снабжающее город, с ветряками
    на гребнях и сухими степными холмами за ними. Пейзаж совсем не похож на остальной Тбилиси и напоминает
    скорее Среднюю Азию.


    Практическая правда: место фактически заброшено. Билетов нет, инфраструктуры почти нет, освещение
    в темноте не работает, бетонная площадка местами потрескалась. Это не недостаток и не достоинство
    — просто так есть, и именно поэтому здесь часто почти безлюдно.
  tip: >-
    Лучшее время — час до заката: колонны обращены на запад, и бронза в этом свете буквально загорается.
    После наступления темноты задерживаться не стоит: освещения нет, поверхность неровная. Летом тени
    нет вообще, а ветер дует постоянно — возьмите головной убор и воду. Туалета, кафе и банкомата на месте
    нет, ближайшая инфраструктура — вдоль дороги у Тбилисского моря. Часа здесь более чем достаточно.
  route: >-
    Памятник стоит на северной окраине города у западного берега Тбилисского моря. Из центра едут по улице
    Джорджа Буша или по дороге вдоль Тбилисского моря, примерно 25–30 минут. Последние два километра —
    узкий латаный асфальт с ямами, но проезжий. Навигатор иногда предлагает неудачный поворот, поэтому
    ориентируйтесь на прибрежную дорогу Тбилисского моря и её верхнее ответвление. Парковка бесплатная,
    прямо у колонн. Машины эконом-класса хватает, хотя на кроссовере последний участок комфортнее.
fa:
  name: تواریخ گرجستان
  short: ستون‌های عظیم برنزی تسرتلی بالای دریای تفلیس — سینمایی‌ترین نقطهٔ غروب شهر.
  body: >-
    **شانزده ستون، هر یک حدود شانزده متر بلندی، روی تپه‌ای خالی.** زوراب تسرتلی این بنا را در 1985 آغاز
    کرد و هرگز تمامش نکرد، و بخشی از حال‌وهوای غریب و سینمایی این جا از همین ناتمامی می‌آید. در راهنماهای
    چاپی به‌ندرت پیدایش می‌کنید و در اینستاگرام مدام.


    نیمهٔ پایینی هر ستون نقش‌برجستهٔ پادشاهان، ملکه‌ها، پهلوانان و شاعران گرجی را دارد، از واختانگ گورگاسالی
    تا شوتا روستاولی. نیمهٔ بالایی به صحنه‌های کتاب مقدس داده شده است: میلاد، مصلوب‌شدن و رستاخیز. تاریخ
    ملی و تاریخ مقدس در دو سر یک محور عمودی به هم می‌رسند؛ فکری که تسرتلی در سراسر کارنامه‌اش به آن بازمی‌گشت.


    از لبهٔ تپه منظره روی دریای تفلیس باز می‌شود، همان آبگیر بزرگی که آب شهر را تأمین می‌کند، با توربین‌های
    بادی روی ستیغ‌ها و تپه‌های استپی خشک در دوردست. این چشم‌انداز هیچ شباهتی به بقیهٔ تفلیس ندارد و بیشتر
    آسیای مرکزی را به یاد می‌آورد. یک واقعیت عملی هم هست: اینجا عملاً هیچ متولی ندارد. نه بلیتی، نه زیرساخت
    واقعی، نه روشنایی پس از تاریکی، و سکوی بتنی جاهایی ترک خورده است. این نه عیب است و نه حسن، فقط همین
    است — و دلیل اینکه اغلب موقع رسیدن تقریباً خالی است.
  tip: >-
    یک ساعت پیش از غروب بیایید: ستون‌ها رو به غرب‌اند و برنز در آن نور آتش می‌گیرد. پس از تاریکی نمانید،
    چون روشنایی نیست و سطح‌ها ناهموارند. در تابستان اصلاً سایه‌ای وجود ندارد و باد همیشه می‌وزد، پس کلاه
    و آب همراه ببرید. در محل نه سرویس بهداشتی هست، نه کافه و نه خودپرداز — نزدیک‌ترین امکانات کنار جادهٔ
    دریای تفلیس است. یک ساعت اینجا بیش از کافی است، مگر اینکه برای عکاسی آمده باشید.
  route: >-
    این بنا در شمال شهر و نزدیک ساحل غربی دریای تفلیس ایستاده است. از مرکز، خیابان جورج بوش یا جادهٔ دریای
    تفلیس را بگیرید، تقریباً 25 تا 30 دقیقه. دو کیلومتر آخر آسفالت باریک و وصله‌دار با چاله است، اما کاملاً
    قابل عبور. اپلیکیشن‌های مسیریاب گاهی پیچ نامناسبی پیشنهاد می‌کنند، پس جادهٔ ساحلی دریای تفلیس و انشعاب
    بالایی آن را مرجع بگیرید. پارکینگ درست کنار ستون‌ها و رایگان است. خودروی اقتصادی از پس آن برمی‌آید،
    هرچند کراس‌اوور بخش پایانی را راحت‌تر می‌کند.
he:
  name: הכרוניקה של גאורגיה
  short: עמודי הברונזה העצומים של צרטלי מעל ים טביליסי — נקודת השקיעה הקולנועית ביותר בעיר.
  body: >-
    **שישה עשר עמודים, כל אחד בגובה של כשישה עשר מטרים, ניצבים על גבעה ריקה.** זוראב צרטלי החל את האנדרטה
    הזאת ב-1985 ומעולם לא סיים אותה, וזה חלק מן הסיבה שהמקום מרגיש כה מוזר וכה קולנועי. הוא כמעט אינו
    מופיע במדריכים מודפסים ומופיע כל הזמן באינסטגרם.


    המחצית התחתונה של כל עמוד נושאת דמויות בתבליט של מלכים, מלכות, גיבורים ומשוררים גאורגיים, מוואחטנג
    גורגסלי ועד שוטא רוסתאוולי. המחצית העליונה מוקדשת לסצנות מקראיות: ההולדת, הצליבה והתחייה. ההיסטוריה
    הלאומית וההיסטוריה הקדושה נפגשות בשני קצותיו של אותו ציר אנכי, רעיון שצרטלי חזר אליו לאורך כל הקריירה
    שלו.


    מקצה הגבעה נפתח הנוף אל ים טביליסי, המאגר הגדול המספק מים לעיר, עם טורבינות רוח על הרכסים וגבעות ערבה
    יבשות מעבר להן. הנוף אינו דומה כלל לשאר טביליסי ומזכיר יותר את מרכז אסיה. ואמת מעשית אחת: המקום כמעט
    אינו מתוחזק. אין כרטיס, אין תשתית של ממש, אין תאורה אחרי רדת החשכה, ורחבת הבטון סדוקה במקומות. זה
    אינו פגם ואינו מעלה, פשוט כך זה — וזו הסיבה שלרוב הוא כמעט ריק כשמגיעים.
  tip: >-
    בואו בשעה שלפני השקיעה: העמודים פונים מערבה והברונזה בוערת באור הזה. אל תישארו אחרי החשכה, כי אין
    תאורה והמשטחים אינם ישרים. בקיץ אין כאן צל בכלל והרוח נושבת ללא הרף, אז קחו כובע ומים. אין במקום שירותים,
    בית קפה או כספומט — המתקנים הקרובים נמצאים לאורך כביש ים טביליסי. שעה אחת יותר מספיקה כאן, אלא אם
    באתם לצלם.
  route: >-
    האנדרטה ניצבת בקצה הצפוני של העיר, סמוך לחוף המערבי של ים טביליסי. מהמרכז סעו ברחוב ג'ורג' בוש או
    בכביש ים טביליסי, כ-25 עד 30 דקות. שני הקילומטרים האחרונים הם אספלט צר ומטולא עם בורות, אך עביר לחלוטין.
    אפליקציות ניווט מציעות לפעמים פנייה גרועה, לכן השתמשו בכביש החוף של ים טביליסי ובהסתעפות העליונה שלו
    כנקודת ייחוס. החניה חינם ממש ליד העמודים. רכב חסכוני מסתדר, אם כי קרוסאובר הופך את הקטע האחרון לנוח
    יותר.
ar:
  name: سجل جورجيا
  short: أعمدة تسيريتيلي البرونزية الضخمة فوق بحر تبليسي — أكثر مطلات المدينة سينمائية عند الغروب.
  body: >-
    **ستة عشر عموداً، ارتفاع كل منها نحو ستة عشر متراً، تقف على تلة خالية.** بدأ زوراب تسيريتيلي هذا النصب
    عام 1985 ولم يُنجزه قط، وهذا جزء من سبب الإحساس الغريب والسينمائي الذي يتركه المكان. نادراً ما يظهر
    في الأدلة المطبوعة، ويظهر باستمرار على إنستغرام.


    يحمل النصف الأسفل من كل عمود نقوشاً بارزة لملوك جورجيا وملكاتها وأبطالها وشعرائها، من فاختانغ غورغاسالي
    إلى شوتا روستافيلي. أما النصف الأعلى فمخصص لمشاهد من الكتاب المقدس: الميلاد والصلب والقيامة. يلتقي
    التاريخ الوطني والتاريخ المقدس عند طرفي المحور الرأسي نفسه، وهي فكرة عاد إليها تسيريتيلي طوال مسيرته.


    ومن حافة التلة ينفتح المنظر على بحر تبليسي، الخزان الكبير الذي يزوّد المدينة بالماء، مع عنفات رياح
    على الحواف وتلال سهبية جافة خلفها. لا يشبه هذا المشهد بقية تبليسي في شيء، ويذكّر بآسيا الوسطى أكثر.
    وثمة حقيقة عملية واحدة: المكان بلا إدارة عملياً. لا تذكرة ولا بنية تحتية حقيقية ولا إضاءة بعد حلول
    الظلام، ومنصة الخرسانة متشققة في مواضع. وهذا ليس عيباً ولا ميزة، بل هو ما هو عليه — وهو سبب كونه شبه
    خالٍ في الغالب حين تصل.
  tip: >-
    تعال في الساعة التي تسبق الغروب: الأعمدة متجهة غرباً والبرونز يشتعل في ذلك الضوء. ولا تتأخر بعد حلول
    الظلام، فلا إضاءة والأسطح غير مستوية. ولا ظل هنا إطلاقاً في الصيف والريح دائمة، فخذ قبعة وماءً. ولا
    دورات مياه ولا مقهى ولا صراف آلي في الموقع — وأقرب الخدمات على طول طريق بحر تبليسي. وساعة واحدة أكثر
    من كافية هنا، إلا إن كنت تصور.
  route: >-
    يقف النصب على الطرف الشمالي للمدينة قرب الشاطئ الغربي لبحر تبليسي. من المركز اسلك شارع جورج بوش أو
    طريق بحر تبليسي، نحو 25 إلى 30 دقيقة. والكيلومتران الأخيران إسفلت ضيق مرقّع بالحفر، لكنه سالك تماماً.
    وتقترح تطبيقات الملاحة أحياناً منعطفاً سيئاً، فاتخذ طريق شاطئ بحر تبليسي وفرعه العلوي مرجعاً لك. والوقوف
    مجاني عند الأعمدة مباشرة. وسيارة اقتصادية تفي بالغرض، وإن كانت الكروس أوفر تجعل المقطع الأخير أكثر
    راحة.
