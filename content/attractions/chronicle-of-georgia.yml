ka:
  name: საქართველოს მატიანე
  short: >-
    თექვსმეტი სვეტი, 35 მეტრამდე სიმაღლის, ყეენის მთაზე, თბილისის ზღვის თავზე: ზურაბ წერეთლის დაუსრულებელი
    ეპოსი ბრინჯაოსა და ქვაში.
  body: >-
    **ბრინჯაოსა და ქვის თექვსმეტი სვეტი, ოცდაათიდან ოცდათხუთმეტ მეტრამდე სიმაღლისა, თბილისის ზღვის თავზე,
    შიშველ გორაზე დგას, როგორც ცისკენ გადაშლილი წიგნის ფურცლები.** ეს „საქართველოს მატიანეა“, რომელიც
    მოქანდაკე ზურაბ წერეთელმა 1985 წელს დაიწყო და ბოლომდე არასოდეს დაუსრულებია. მონუმენტი ნაძალადევის
    რაიონში, ყეენის მთის წვერზე, გრძელი კიბის თავში დგას და თბილისის ერთ-ერთი ყველაზე უცნაური სანახავია:
    გვიანსაბჭოური ოცნება ერის ისტორიაზე, სტეპის თავზე ნახევრად მოყოლილი.


    სვეტებს ჯერ შორიდან შეხედეთ, მერე ახლოს მიდით. მაღალი რელიეფები იარუსებად ალაგია და ყოველი სცენა ჯვრის
    მოხაზულობაშია ჩასმული. აქ არის საუფლო დღესასწაულები, ბზობა, ხარება, ფერისცვალება, აღდგომა და სულთმოფენობა,
    მათ გვერდით კი საქართველო თავის ამბავს თავად ჰყვება: მეფეები და დედოფლები, წმინდანები და მწერლები,
    წმინდა ნინოს ცხოვრება, ცამეტი ასურელი მამა, „შუშანიკის წამება“, ქართველ პოეტთა სტრიქონები. ქართული
    წყაროების ცნობით, კომპლექსის შუაგულში იმ მეფეთა და მოღვაწეთა სიმბოლური საფლავია, რომლებიც სამშობლოს
    გარეთ განისვენებენ.


    სვეტების გვერდით წმინდა ნინოს ვაზის ჯვარი და პატარა სამლოცველო დგას, მონუმენტის მახლობლად კი ყოვლადწმინდა
    ღვთისმშობლის ხარების ეკლესია აღმართულა, რომლის მშენებლობაც 2005 წელს დაიწყო.


    ახლა კი მობრუნდით. ქვემოთ წყალსაცავი იშლება, რომელსაც თბილისი თავის ზღვას ეძახის, შუადღისას ფოლადისფერი,
    მის იქით კი მშრალი ბორცვები მიგორავს. ბილეთს აქ არავინ მოგყიდით და გზას არავინ გიჩვენებთ. მზის ჩასვლისას
    ბრინჯაო ძველი თაფლის ფერს იღებს, წყალი კი ბნელდება, და ხშირად მარტო რჩებით თექვსმეტ გოლიათთან და ერთი
    ქვეყნის მეხსიერებასთან. ვინ იცის, იქნებ სწორედ ასე იკითხება ის ყველაზე პატიოსნად.
  tip: >-
    საუკეთესო დრო მზის ჩასვლამდე ბოლო საათია, როცა დაბალი, თბილი შუქი რელიეფებს ეცემა. დაბნელების შემდეგ
    განათება არ არის, ბეტონი კი დამსკდარი და უსწორმასწოროა, ამიტომ წადით, სანამ ფეხქვეშ ჯერ კიდევ ჩანს.
    ჩრდილი არსად არის, ქარი თითქმის არ წყდება: ზაფხულში წყალი და ქუდი წამოიღეთ, ზამთარში თბილი ქურთუკი.
    ადგილზე არც ტუალეტია, არც კაფე და არც ბანკომატი, ამიტომ ყველაფერი გზაში მოაგვარეთ. სამლოცველო და ეკლესია
    მოქმედია: შიგნით შესვლისას მოკრძალებულად ჩაიცვით, ქალებს თავსაფარი დასჭირდებათ. ერთი საათი საკმარისია,
    თუ რელიეფების სათითაოდ გადაღებას არ აპირებთ.
  route: >-
    მონუმენტი ქალაქის ჩრდილოეთით, თბილისის ზღვის დასავლეთ ნაპირის თავზე, ყეენის მთაზე დგას, ცენტრიდან
    დაახლოებით 11 კილომეტრში: ჩვეულებრივ მოძრაობაში 25–30 წუთი. ჩრდილოეთით, ნაძალადევის რაიონისკენ იარეთ;
    ბოლო მონაკვეთი სანზონაზე, უცნობ გმირთა ქუჩაზე გადის, რომელიც გორაზე ადის. ნავიგატორი ზოგჯერ ცუდ შესახვევებს
    გთავაზობთ, ამიტომ მთავარ გზას ნუ გადაუხვევთ. ბოლო ორიოდე კილომეტრი ვიწრო, ორმოიანი, დაკემსილი ასფალტია,
    თუმცა ნებისმიერი მანქანით გაივლით. მონუმენტთან პარკინგი უფასოა. ეკონომკლასის მანქანა გაართმევს თავს,
    კროსოვერით კი ბოლო მონაკვეთი უფრო კომფორტულია.
en:
  name: The Chronicle of Georgia
  short: >-
    Sixteen pillars up to 35 metres high on Keeni Hill above the Tbilisi Sea: Zurab Tsereteli's unfinished
    epic of bronze and stone.
  body: >-
    **Sixteen pillars of bronze and stone, thirty to thirty-five metres high, stand on a bare hill above
    the Tbilisi Sea like the pages of a book opened to the sky.** This is the Chronicle of Georgia, begun
    by the sculptor Zurab Tsereteli in 1985 and never finished. It crowns Keeni Hill in the Nadzaladevi
    district, at the top of a long flight of steps, and it is one of the strangest sights in Tbilisi:
    a late-Soviet dream of national history, left half-told above the steppe.


    Look at the pillars from a distance first, then close up. Their high reliefs are stacked in tiers,
    each scene set within the outline of a cross. There are the great feasts of the Church, Palm Sunday,
    the Annunciation, the Transfiguration, Easter and Pentecost, and around them Georgia tells its own
    story: kings and queens, saints and writers, the life of St Nino, the Thirteen Assyrian Fathers, the
    Martyrdom of Shushanik, lines of Georgian poetry. At the heart of the complex, Georgian sources describe
    a symbolic grave for the kings and public figures who lie buried beyond the country's borders.


    Beside the pillars stand St Nino's grapevine cross and a small chapel, and beside the monument stands
    the Church of the Annunciation, begun in 2005.


    Then turn round. The reservoir that Tbilisi calls its sea spreads below, steel-grey at noon, and dry
    hills roll away beyond it. Nobody sells tickets and nobody guides you. Towards sunset the bronze warms
    to the colour of old honey while the water darkens, and you are often alone with sixteen giants and
    a country's memory, which may be the most honest way to read it.
  tip: >-
    Come in the last hour before sunset, when the light is low and warm on the reliefs. There is no lighting
    after dark and the concrete is cracked and uneven, so leave while you can still see your feet. There
    is no shade and the wind rarely drops: water and a hat in summer, a proper coat in winter. There are
    no toilets, café or cash machine on site, so stop on the way. The chapel and church are active: dress
    modestly if you step inside, and women should bring a headscarf. An hour is enough unless you mean
    to photograph the reliefs one by one.
  route: >-
    The monument stands in the north of the city, on Keeni Hill above the western shore of the Tbilisi
    Sea, about 11 km from the centre: 25–30 minutes in normal traffic. Head north into the Nadzaladevi
    district; the final approach runs through the Sanzona quarter along Utsnob Gmirta (Unknown Heroes)
    Street, which climbs the hill. Navigation apps sometimes suggest poor side lanes, so stay on the main
    road. The last couple of kilometres are narrow, patched asphalt with potholes, but passable in any
    car. Parking beside the monument is free. An economy car copes; a crossover rides the last stretch
    more comfortably.
ru:
  name: Летопись Грузии
  short: >-
    Шестнадцать столпов высотой до 35 метров на холме Кеени над Тбилисским морем: незавершённая эпопея
    Зураба Церетели в бронзе и камне.
  body: >-
    **Шестнадцать столпов из бронзы и камня высотой от тридцати до тридцати пяти метров стоят на голом
    холме над Тбилисским морем, словно страницы книги, раскрытой навстречу небу.** Это Летопись Грузии:
    скульптор Зураб Церетели начал её в 1985 году и так и не закончил. Монумент венчает холм Кеени в районе
    Надзаладеви, наверху длинной лестницы, и это одно из самых странных мест Тбилиси: позднесоветская
    мечта о национальной истории, недосказанная над степью.


    Сначала посмотрите на столпы издали, потом подойдите вплотную. Их горельефы уложены ярусами, и каждая
    сцена вписана в контур креста. Здесь великие церковные праздники: Вход Господень в Иерусалим, Благовещение,
    Преображение, Пасха и Пятидесятница, а вокруг них Грузия рассказывает собственную историю: цари и
    царицы, святые и писатели, житие святой Нино, тринадцать ассирийских отцов, мученичество Шушаник,
    строки грузинской поэзии. В сердце комплекса, как пишут грузинские источники, устроена символическая
    могила царей и общественных деятелей, похороненных за пределами страны.


    Рядом со столпами стоят виноградный крест святой Нино и маленькая часовня, а неподалёку от памятника
    — церковь Благовещения, строительство которой началось в 2005 году.


    А теперь обернитесь. Внизу раскинулось водохранилище, которое Тбилиси зовёт своим морем, стальное
    в полдень, а за ним катятся сухие холмы. Никто не продаёт билетов и никто не водит экскурсий. К закату
    бронза теплеет до цвета старого мёда, вода темнеет, и часто вы остаётесь наедине с шестнадцатью великанами
    и памятью целой страны. Возможно, так её и честнее всего читать.
  tip: >-
    Приезжайте за час до заката, когда низкий тёплый свет ложится на рельефы. После наступления темноты
    освещения нет, бетон растрескан и неровен, поэтому уходите, пока ещё видите, куда ступаете. Тени нет,
    а ветер почти не стихает: летом нужны вода и шляпа, зимой — настоящая тёплая куртка. На месте нет
    ни туалетов, ни кафе, ни банкомата, так что остановитесь по дороге. Часовня и церковь действующие:
    если заходите внутрь, одевайтесь скромно, женщинам стоит взять платок. Часа хватит, если только вы
    не собираетесь фотографировать рельефы один за другим.
  route: >-
    Памятник стоит на севере города, на холме Кеени над западным берегом Тбилисского моря, примерно в
    11 км от центра: 25–30 минут при обычном движении. Двигайтесь на север, в район Надзаладеви; финальный
    отрезок пути идёт через квартал Санзона по улице Уцноб Гмирта (Неизвестных героев), которая взбирается
    на холм. Навигаторы иногда предлагают плохие боковые проулки, поэтому держитесь главной дороги. Последние
    пару километров — узкий латаный асфальт с ямами, но проедет любая машина. Парковка у памятника бесплатная.
    Машина эконом-класса справится; на кроссовере последний отрезок пройдёт мягче.
fa:
  name: وقایع‌نامهٔ گرجستان
  short: 'شانزده ستون تا ۳۵ متر بلندی بر تپهٔ کئنی بالای دریای تفلیس: حماسهٔ ناتمام زوراب تسرتلی از مفرغ
    و سنگ.'
  body: >-
    **شانزده ستون از مفرغ و سنگ، سی تا سی و پنج متر بلند، بر تپه‌ای برهنه بالای دریای تفلیس ایستاده‌اند،
    مانند صفحه‌های کتابی که رو به آسمان گشوده شده باشد.** این وقایع‌نامهٔ گرجستان است که زوراب تسرتلی،
    پیکرتراش، در ۱۹۸۵ آغازش کرد و هرگز به پایانش نرساند. بنا بر فراز تپهٔ کئنی در ناحیهٔ نادزالادوی، در
    انتهای رشته‌پلکانی طولانی، نشسته و یکی از غریب‌ترین مناظر تفلیس است: رؤیایی از واپسین سال‌های شوروی
    دربارهٔ تاریخ ملی، که بر فراز استپ نیمه‌گفته مانده است.


    نخست ستون‌ها را از دور تماشا کنید و بعد از نزدیک. نقش‌برجسته‌های بلندشان طبقه‌طبقه روی هم چیده شده
    و هر صحنه درون طرح یک صلیب جای گرفته است. اعیاد بزرگ کلیسا این‌جایند، یکشنبهٔ نخل، بشارت، تجلی، عید
    پاک و پنطیکاست، و گرداگردشان گرجستان داستان خودش را روایت می‌کند: شاهان و ملکه‌ها، قدیسان و نویسندگان،
    زندگی قدیسه نینو، سیزده پدر آشوری، شهادت شوشانیک، و سطرهایی از شعر گرجی. به نوشتهٔ منابع گرجی، در
    دل مجموعه گوری نمادین برای شاهان و چهره‌های سرشناسی ساخته شده که بیرون از مرزهای کشور به خاک سپرده
    شده‌اند.


    کنار ستون‌ها صلیب تاکِ قدیسه نینو و نمازخانه‌ای کوچک ایستاده‌اند، و در کنار بنای یادبود کلیسای بشارت
    قرار دارد که ساختش در ۲۰۰۵ آغاز شد.


    سپس رو برگردانید. مخزن آبی که تفلیسی‌ها دریای خود می‌نامندش پایین پایتان گسترده است، نیمروز به رنگ
    فولاد، و آن سوترش تپه‌های خشک موج برمی‌دارند. کسی بلیت نمی‌فروشد و کسی راهنمایی‌تان نمی‌کند. نزدیک
    غروب، مفرغ تا رنگ عسلِ کهنه گرم می‌شود و آب تیره می‌شود، و اغلب با شانزده غول و حافظهٔ یک کشور تنها
    می‌مانید؛ شاید صادقانه‌ترین راه خواندنش همین باشد.
  tip: >-
    در ساعت آخرِ پیش از غروب بیایید، وقتی نور پایین و گرم بر نقش‌برجسته‌ها می‌افتد. پس از تاریکی هیچ روشنایی‌ای
    نیست و بتن ترک‌خورده و ناهموار است، پس تا وقتی هنوز جلوی پایتان را می‌بینید بازگردید. سایه‌ای در کار
    نیست و باد به‌ندرت آرام می‌گیرد: تابستان آب و کلاه، زمستان پالتویی درست‌وحسابی. در محل نه سرویس بهداشتی
    هست، نه کافه و نه خودپرداز؛ پس سر راه توقف کنید. نمازخانه و کلیسا فعال‌اند: اگر وارد می‌شوید پوشیده
    لباس بپوشید و زنان روسری همراه داشته باشند. یک ساعت کافی است، مگر آن‌که بخواهید نقش‌برجسته‌ها را یکی‌یکی
    عکاسی کنید.
  route: >-
    بنای یادبود در شمال شهر، بر تپهٔ کئنی بالای کرانهٔ غربی دریای تفلیس و حدود ۱۱ کیلومتر دورتر از مرکز
    قرار دارد: ۲۵ تا ۳۰ دقیقه در ترافیک معمولی. به سمت شمال و ناحیهٔ نادزالادوی بروید؛ بخش آخر مسیر از
    محلهٔ سانزونا و خیابان اوتسنوب گمیرتا (قهرمانان گمنام) می‌گذرد که از تپه بالا می‌رود. مسیریاب‌ها گاهی
    کوچه‌های فرعی بدی پیشنهاد می‌دهند، پس در جادهٔ اصلی بمانید. دو کیلومتر آخر آسفالتی باریک و وصله‌پینه‌شده
    با چاله است، اما هر خودرویی از آن می‌گذرد. پارکینگ کنار بنا رایگان است. خودروی اکونومی از پسش برمی‌آید؛
    کراس‌اوور تکهٔ آخر را نرم‌تر طی می‌کند.
he:
  name: הכרוניקה של גאורגיה
  short: >-
    שישה עשר עמודים בגובה של עד 35 מטר על גבעת קאני מעל ים טביליסי: האפוס הבלתי גמור של זוראב צרטלי, בברונזה
    ובאבן.
  body: >-
    **שישה עשר עמודים של ברונזה ואבן, בגובה שלושים עד שלושים וחמישה מטר, ניצבים על גבעה חשופה מעל ים טביליסי
    כמו דפיו של ספר פתוח אל השמיים.** זוהי הכרוניקה של גאורגיה, שהפסל זוראב צרטלי החל בה ב-1985 ומעולם
    לא השלים אותה. היא מכתירה את גבעת קאני ברובע נדזלדווי, בראש גרם מדרגות ארוך, והיא אחד המראות המוזרים
    ביותר בטביליסי: חלום סובייטי מאוחר על ההיסטוריה הלאומית, שנותר מסופר למחצה מעל הערבה.


    הביטו בעמודים תחילה מרחוק, ואחר כך מקרוב. התבליטים הגבוהים שלהם מסודרים בקומות, וכל סצנה נתונה בתוך
    קווי המתאר של צלב. יש בהם החגים הגדולים של הכנסייה, יום ראשון של הדקלים, הבשורה, ההשתנות, חג הפסחא
    וחג השבועות הנוצרי (הפנטקוסט), וסביבם גאורגיה מספרת את סיפורה שלה: מלכים ומלכות, קדושים וסופרים, חייה
    של נינו הקדושה, שלושה עשר האבות האשוריים, מות הקדושה של שושניק ושורות משירה גאורגית. בלב המתחם, כך
    מתארים מקורות גאורגיים, יש קבר סמלי למלכים ולאישי ציבור הקבורים מחוץ לגבולות המדינה.


    לצד העמודים ניצבים צלב הגפן של נינו הקדושה וקפלה קטנה, ולצד האנדרטה עומדת כנסיית הבשורה, שבנייתה החלה
    ב-2005.


    ועכשיו הסתובבו. המאגר שטביליסי קוראת לו הים שלה נפרש למטה, אפור כפלדה בצהריים, ומעבר לו מתגלגלות גבעות
    צחיחות. איש אינו מוכר כרטיסים ואיש אינו מדריך אתכם. לקראת השקיעה מתחממת הברונזה לגוון של דבש ישן והמים
    מחשיכים, ולעתים קרובות אתם נשארים לבד עם שישה עשר ענקים ועם זיכרונה של ארץ שלמה. אולי זו הדרך הכנה
    ביותר לקרוא אותה.
  tip: >-
    בואו בשעה האחרונה שלפני השקיעה, כשהאור נמוך וחם על התבליטים. אחרי רדת החשכה אין תאורה, והבטון סדוק
    ולא אחיד, אז צאו כל עוד אתם רואים היכן אתם דורכים. אין צל, והרוח כמעט אינה שוככת: בקיץ מים וכובע,
    בחורף מעיל של ממש. אין במקום שירותים, בית קפה או כספומט, אז עצרו בדרך. הקפלה והכנסייה פעילות: אם אתם
    נכנסים, התלבשו בצניעות, ונשים יביאו מטפחת ראש. שעה מספיקה, אלא אם בכוונתכם לצלם את התבליטים אחד אחד.
  route: >-
    האנדרטה ניצבת בצפון העיר, על גבעת קאני מעל החוף המערבי של ים טביליסי, כ-11 ק"מ מהמרכז: 25–30 דקות
    בתנועה רגילה. סעו צפונה אל רובע נדזלדווי; קטע הגישה האחרון עובר ברובע סנזונה, ברחוב אוצנוב גמירטה
    (רחוב הגיבורים האלמונים), העולה במעלה הגבעה. אפליקציות ניווט מציעות לפעמים סמטאות צדדיות גרועות, לכן
    הישארו על הכביש הראשי. שני הקילומטרים האחרונים הם אספלט צר ומטולא עם בורות, אבל כל רכב יעבור בהם.
    החניה ליד האנדרטה חינם. רכב חסכוני יסתדר; קרוסאובר יעבור את הקטע האחרון בנוחות רבה יותר.
ar:
  name: وقائع جورجيا
  short: >-
    ستة عشر عموداً يصل ارتفاعها إلى 35 متراً على تلة كيئيني فوق بحر تبليسي: ملحمة زوراب تسيريتيلي غير
    المكتملة من البرونز والحجر.
  body: >-
    **ستة عشر عموداً من البرونز والحجر، يتراوح ارتفاعها بين ثلاثين وخمسة وثلاثين متراً، تقف على تلة جرداء
    فوق بحر تبليسي كصفحات كتاب مفتوح نحو السماء.** هذه "وقائع جورجيا"، التي بدأها النحات زوراب تسيريتيلي
    عام 1985 ولم يُتمّها قط. تتوّج تلة كيئيني في حي نادزالاديفي، في أعلى درج طويل، وهي من أغرب المشاهد
    في تبليسي: حلم من أواخر الحقبة السوفييتية بالتاريخ الوطني، بقي مرويّاً إلى نصفه فوق السهوب.


    انظر إلى الأعمدة من بعيد أولاً، ثم من قرب. نقوشها البارزة مرصوفة في طبقات، وكل مشهد مؤطَّر داخل هيئة
    صليب. فيها أعياد الكنيسة الكبرى، أحد الشعانين والبشارة والتجلي والفصح والعنصرة، ومن حولها تروي جورجيا
    حكايتها الخاصة: ملوك وملكات، قديسون وكتّاب، سيرة القديسة نينو، الآباء الآشوريون الثلاثة عشر، استشهاد
    شوشانيك، وأبيات من الشعر الجورجي. وفي قلب المجمع، بحسب المصادر الجورجية، قبر رمزي للملوك والشخصيات
    العامة الذين دُفنوا خارج حدود البلاد.


    وإلى جانب الأعمدة يقف صليب الكرمة للقديسة نينو ومصلّى صغير، وبجوار النصب تقوم كنيسة البشارة التي بدأ
    بناؤها عام 2005.


    ثم استدر. في الأسفل يمتد الخزان المائي الذي تسميه تبليسي بحرها، رمادياً كالفولاذ عند الظهيرة، وخلفه
    تتموج تلال جافة. لا أحد يبيع التذاكر ولا أحد يرشدك. ومع اقتراب الغروب يدفأ البرونز حتى يصير بلون العسل
    المعتّق فيما تُظلم المياه، وكثيراً ما تبقى وحدك مع ستة عشر عملاقاً وذاكرة بلد بأكمله، ولعل تلك أصدق
    طريقة لقراءتها.
  tip: >-
    تعالَ في الساعة الأخيرة قبل الغروب، حين يسقط الضوء منخفضاً دافئاً على النقوش. لا إنارة بعد حلول الظلام،
    والخرسانة متشققة غير مستوية، فغادر ما دمت ترى موطئ قدميك. لا ظل هنا والريح قلّما تهدأ: ماء وقبعة في
    الصيف، ومعطف حقيقي في الشتاء. لا دورات مياه ولا مقهى ولا صراف آلي في الموقع، فتوقف في الطريق. المصلّى
    والكنيسة عاملان: إن دخلت فالبس ثياباً محتشمة، ولتحضر النساء غطاء للرأس. تكفي ساعة، إلا إذا نويت تصوير
    النقوش واحداً واحداً.
  route: >-
    يقع النصب في شمال المدينة، على تلة كيئيني فوق الشاطئ الغربي لبحر تبليسي، على بعد نحو 11 كم من المركز:
    25–30 دقيقة في حركة المرور العادية. اتجه شمالاً إلى حي نادزالاديفي؛ ويمر المقطع الأخير عبر حي سانزونا
    في شارع أوتسنوب غميرتا (شارع الأبطال المجهولين) الذي يصعد التلة. تقترح تطبيقات الملاحة أحياناً أزقة
    جانبية رديئة، فالزم الطريق الرئيسي. الكيلومتران الأخيران أسفلت ضيق مرقّع تكثر فيه الحفر، لكن أي سيارة
    تعبره. الوقوف بجوار النصب مجاني. تكفي السيارة الاقتصادية، أما الكروس أوفر فتجعل المقطع الأخير أكثر
    راحة.
