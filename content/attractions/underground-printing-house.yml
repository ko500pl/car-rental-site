ka:
  name: სტალინის არალეგალური სტამბის მუზეუმი
  short: >-
    1903–1906 წლების საიდუმლო ბოლშევიკური სტამბა, რომელსაც ჭის ძირიდან აღწევდნენ — საბჭოთა დროის კაფსულა
    ავლაბრის განაპირას.
  body: >-
    **მუზეუმი, სადაც დრო 1970-იანებში გაჩერდა, 1906 წლის საიდუმლოს იცავს.** კასპის ქუჩაზე, ჩვეულებრივი
    ხის სახლის ეზოში, თხუთმეტიოდე მეტრის სიღრმის ჭაა. მისი ძირიდან გვირაბი მიწისქვეშა ოთახში გადიოდა,
    სადაც 1903–1906 წლებში ბოლშევიკები — მათ შორის ახალგაზრდა სტალინი — რევოლუციურ პროკლამაციებს ბეჭდავდნენ
    ქართულ, რუსულ და სომხურ ენებზე. გერმანული საბეჭდი დაზგა ქალაქში ნაწილ-ნაწილ, კონტრაბანდით შემოიტანეს
    და მიწის ქვეშ ააწყვეს.


    1906 წელს ჟანდარმებმა სტამბა აღმოაჩინეს და სახლი გადაწვეს, დაზგა კი მიწისქვეშ გადარჩა. საბჭოთა ხელისუფლებამ
    ადგილი სალოცავად აქცია; დღეს მუზეუმს საქართველოს კომუნისტური პარტიის მოხალისეები სახელმწიფო დაფინანსების
    გარეშე ინახავენ და სწორედ ეს ქმნის მის ხიბლს:


    - ჩახედავ აგურით ამოყვანილ ჭას და საბჭოთა დროს დაშენებული კიბით ჩახვალ დაჟანგულ დაზგასთან

    - ზემოთ ლენინისა და სტალინის პორტრეტებით სავსე ოთახებია — ხელუხლებელი საბჭოთა ინტერიერი

    - მომვლელი (ხშირად თავად პარტიის ვეტერანი) ისტორიას ისე ჰყვება, თითქოს გუშინ მომხდარიყოს


    ეს თბილისის ყველაზე უცნაური მუზეუმია: ისტორიის მტვრიანი, გულწრფელი და სრულიად გაუპრიალებელი ნაჭერი.
  tip: >-
    შესვლა 10 ლარია და ნაღდი ფული გქონდეს. ოფიციალურად სამუშაო დღეებში 10:00–18:00-ზეა ღია, მაგრამ რეალურად
    მომვლელის ადგილზე ყოფნაზეა დამოკიდებული — მისვლამდე დარეკვა უმჯობესია (ნომერი კარზეა გაკრული და სამოგზაურო
    ფორუმებზეც იძებნება). ტურები ქართულად და რუსულადაა, ინგლისურად დაბეჭდილი ფურცელი გადმოგცემენ. ჭასთან
    ჩასასვლელი კიბე ციცაბოა — მოხერხებული ფეხსაცმელი ჩაიცვი.
  route: >-
    მუზეუმი ავლაბრის განაპირასაა, კასპის ქუჩაზე, მეტრო „300 არაგველიდან" დაახლოებით 600 მეტრში. ცენტრიდან
    (თავისუფლების მოედნიდან) მანქანით 15 წუთია: გადადი მტკვარზე მეტეხის ან ბარათაშვილის ხიდით და ქეთევან
    წამებულის გამზირს გაჰყევი ისნისკენ, შემდეგ მარჯვნივ, კასპის ქუჩაზე შეუხვიე. უბანი მშვიდი საცხოვრებელია
    — მანქანა კარიბჭესთან, ქუჩის პირას უფასოდ ჩერდება. ეკონომ-კლასის მანქანა სავსებით საკმარისია. სამებას
    ტაძართან ან აბანოთუბანთან ერთ მარშრუტში კარგად ჯდება.
en:
  name: Stalin's Underground Printing House
  short: >-
    A secret Bolshevik press of 1903–1906, reached through the bottom of a well — a Soviet time capsule
    on the edge of Avlabari.
  body: >-
    **A museum where time stopped around the 1970s guards a secret from 1906.** In the yard of an ordinary
    wooden house on Kaspi Street there is a well about fifteen metres deep. From its bottom a tunnel led
    to an underground chamber where, between 1903 and 1906, Bolsheviks — the young Stalin among them —
    printed revolutionary leaflets in Georgian, Russian and Armenian. The German-made press had been smuggled
    into the city in pieces and reassembled below ground.


    In 1906 tsarist gendarmes discovered the operation and burned the house; the press survived underneath.
    Soviet authorities later turned the site into a shrine, and today volunteers of the Georgian Communist
    Party keep the museum going without any state funding — which is precisely its charm:


    - You peer down the brick-lined well, then descend a Soviet-era staircase to the rusting press itself

    - Upstairs, rooms full of Lenin and Stalin portraits preserve an untouched Soviet interior

    - The caretaker — often a party veteran — tells the story as if it happened yesterday


    It is the strangest museum in Tbilisi: a dusty, sincere, entirely unpolished piece of history that
    no curator has ever smoothed over.
  tip: >-
    Entry is 10 GEL, cash only. Officially it opens weekdays 10:00–18:00, but in practice it depends on
    the caretaker being around — calling ahead is wise (the number is pinned to the gate and circulates
    on travel forums). Tours run in Georgian and Russian, with a printed English information sheet handed
    out. The stairs down to the press are steep, so wear sensible shoes.
  route: >-
    The museum sits on the edge of Avlabari, on Kaspi Street, about 600 m from 300 Aragveli metro station.
    From Freedom Square it is a 15-minute drive: cross the Mtkvari by the Metekhi or Baratashvili bridge
    and follow Ketevan Tsamebuli Avenue toward Isani, then turn right onto Kaspi Street. The neighbourhood
    is quiet and residential — you park free at the kerb by the gate. An economy car is entirely sufficient.
    It slots neatly into one route with Sameba Cathedral or the sulphur baths.
ru:
  name: Подпольная типография Сталина
  short: >-
    Тайная большевистская типография 1903–1906 годов, куда попадали через дно колодца, — советская капсула
    времени на краю Авлабари.
  body: >-
    **Музей, где время остановилось где-то в 1970-х, хранит тайну 1906 года.** Во дворе обычного деревянного
    дома на улице Каспи есть колодец глубиной метров пятнадцать. Со дна его вёл тоннель в подземную комнату,
    где в 1903–1906 годах большевики — среди них молодой Сталин — печатали революционные листовки на грузинском,
    русском и армянском языках. Печатный станок немецкого производства был по частям контрабандой доставлен
    в город и собран под землёй.


    В 1906 году царские жандармы раскрыли типографию и сожгли дом; станок уцелел под землёй. Советская
    власть превратила место в святыню, а сегодня музей без всякого государственного финансирования поддерживают
    волонтёры Компартии Грузии — и именно в этом его обаяние:


    - вы заглядываете в выложенный кирпичом колодец, а затем спускаетесь по лестнице советских времён
    к самому ржавеющему станку

    - наверху — комнаты с портретами Ленина и Сталина, нетронутый советский интерьер

    - смотритель, нередко ветеран партии, рассказывает историю так, будто всё случилось вчера


    Это самый странный музей Тбилиси: пыльный, искренний, совершенно неотполированный кусок истории, которого
    не касалась рука куратора.
  tip: >-
    Вход 10 лари, только наличные. Официально музей открыт по будням с 10:00 до 18:00, но на практике
    всё зависит от того, на месте ли смотритель, — лучше позвонить заранее (номер прикреплён к воротам
    и гуляет по туристическим форумам). Экскурсии на грузинском и русском, на английском выдают распечатанный
    листок. Лестница вниз к станку крутая — наденьте удобную обувь.
  route: >-
    Музей стоит на краю Авлабари, на улице Каспи, метрах в шестистах от станции метро «300 арагвинцев».
    От площади Свободы на машине минут пятнадцать: переезжайте Куру по Метехскому мосту или мосту Бараташвили
    и следуйте по проспекту Кетеван Цамебули в сторону Исани, затем направо на улицу Каспи. Район тихий,
    жилой — машина бесплатно встаёт у обочины возле ворот. Эконом-класса вполне достаточно. Музей отлично
    встраивается в один маршрут с собором Самеба или серными банями.
fa:
  name: چاپخانهٔ زیرزمینی استالین
  short: چاپخانهٔ مخفی بلشویکی ۱۹۰۳ تا ۱۹۰۶ که از ته یک چاه به آن می‌رسیدند — کپسول زمان شوروی در حاشیهٔ
    آولاباری.
  body: >-
    **موزه‌ای که زمان در آن حوالی دههٔ ۱۹۷۰ ایستاده، رازی از ۱۹۰۶ را نگه می‌دارد.** در حیاط خانه‌ای چوبی
    و معمولی در خیابان کاسپی، چاهی به ژرفای حدود پانزده متر هست. از ته آن تونلی به اتاقی زیرزمینی می‌رفت
    که در آن، میان ۱۹۰۳ تا ۱۹۰۶، بلشویک‌ها — و در میانشان استالین جوان — اعلامیه‌های انقلابی به گرجی،
    روسی و ارمنی چاپ می‌کردند. ماشین چاپ ساخت آلمان را تکه‌تکه و قاچاقی به شهر آورده و زیر زمین سوار کرده
    بودند.


    در ۱۹۰۶ ژاندارم‌های تزاری ماجرا را کشف کردند و خانه را سوزاندند؛ ماشین چاپ در زیر زمین سالم ماند.
    حکومت شوروی بعدها اینجا را زیارتگاه کرد و امروز داوطلبان حزب کمونیست گرجستان بی‌هیچ بودجهٔ دولتی موزه
    را سر پا نگه می‌دارند — و جذابیتش دقیقاً همین است:


    - به درون چاه آجری سرک می‌کشید و بعد از پلکان دورهٔ شوروی تا خود ماشین زنگ‌زده پایین می‌روید

    - در طبقهٔ بالا اتاق‌هایی پر از تصویر لنین و استالین، با فضای داخلی دست‌نخوردهٔ شوروی

    - نگهبان — اغلب از کهنه‌کاران حزب — داستان را چنان می‌گوید که انگار دیروز رخ داده است


    این عجیب‌ترین موزهٔ تفلیس است: تکه‌ای غبارگرفته، صادق و کاملاً صیقل‌نخورده از تاریخ که دست هیچ موزه‌داری
    مرتبش نکرده است.
  tip: >-
    ورودی ۱۰ لاری و فقط نقد است. رسماً روزهای کاری ۱۰:۰۰ تا ۱۸:۰۰ باز است، اما در عمل بسته به حضور نگهبان
    است — تماس پیش از رفتن عاقلانه است (شماره روی در نصب است و در انجمن‌های سفر هم می‌چرخد). تور به گرجی
    و روسی است و برگهٔ چاپی انگلیسی می‌دهند. پلکان پایین‌رفتن به سوی ماشین چاپ تند است؛ کفش مناسب بپوشید.
  route: >-
    موزه در حاشیهٔ آولاباری، در خیابان کاسپی است، حدود ۶۰۰ متر از ایستگاه متروی «۳۰۰ آراگْوِلی». از میدان
    آزادی با خودرو پانزده دقیقه است: از پل متخی یا پل باراتاشویلی از رود بگذرید و بلوار کتوان تسامبولی
    را به سوی ایسانی بروید، بعد به راست وارد خیابان کاسپی شوید. محله آرام و مسکونی است — خودرو را رایگان
    کنار جدول جلوی در می‌گذارید. خودروی اقتصادی کاملاً کافی است. با کلیسای جامع سامبا یا حمام‌های گوگردی
    در یک مسیر خوب جا می‌گیرد.
he:
  name: בית הדפוס המחתרתי של סטלין
  short: בית דפוס בולשביקי חשאי מ-1906–1903, שאליו הגיעו דרך קרקעית באר — קפסולת זמן סובייטית בשולי אבלברי.
  body: >-
    **מוזיאון שבו הזמן נעצר אי-שם בשנות השבעים שומר על סוד מ-1906.** בחצר של בית עץ רגיל ברחוב כספי יש
    באר בעומק כחמישה-עשר מטרים. מקרקעיתה הוביל מחילה אל חדר תת-קרקעי שבו, בין 1903 ל-1906, הדפיסו בולשביקים
    — וסטלין הצעיר ביניהם — כרוזים מהפכניים בגאורגית, ברוסית ובארמנית. מכונת הדפוס מתוצרת גרמניה הוברחה
    העירה חלקים-חלקים והורכבה מחדש מתחת לאדמה.


    ב-1906 גילו הז'נדרמים הצאריים את המבצע ושרפו את הבית; המכונה שרדה מתחתיו. השלטון הסובייטי הפך את המקום
    למקדש, והיום מתנדבי המפלגה הקומוניסטית של גאורגיה מחזיקים את המוזיאון בלי שום מימון מדינה — וזה בדיוק
    קסמו:


    - מציצים אל תוך הבאר המדופנת לבנים, ואז יורדים במדרגות מהתקופה הסובייטית אל המכונה המחלידה עצמה

    - למעלה חדרים מלאים דיוקנאות של לנין וסטלין — פנים סובייטי שלא נגעו בו

    - השומר, לא פעם ותיק המפלגה, מספר את הסיפור כאילו קרה אתמול


    זהו המוזיאון המוזר ביותר בטביליסי: פיסת היסטוריה מאובקת, כנה ולא מלוטשת, שיד אוצר מעולם לא החליקה
    אותה.
  tip: >-
    הכניסה 10 לארי, מזומן בלבד. רשמית פתוח בימי חול 10:00–18:00, אבל בפועל הכול תלוי בנוכחות השומר — כדאי
    להתקשר מראש (המספר תלוי על השער ומסתובב בפורומים של מטיילים). הסיורים בגאורגית וברוסית, ומחלקים דף
    מידע מודפס באנגלית. המדרגות למטה אל המכונה תלולות — נעלו נעליים נוחות.
  route: >-
    המוזיאון יושב בשולי אבלברי, ברחוב כספי, כ-600 מטר מתחנת המטרו "300 ארגוולי". מכיכר החירות זו נסיעה
    של רבע שעה: חצו את המטקווארי בגשר מטחי או בגשר ברטשווילי, המשיכו בשדרת קתוון צמבולי לכיוון איסני,
    ואז ימינה לרחוב כספי. השכונה שקטה ומגורית — חונים חינם לצד המדרכה ליד השער. רכב חסכוני מספיק לגמרי.
    משתלב יפה במסלול אחד עם קתדרלת סמבה או מרחצאות הגופרית.
ar:
  name: مطبعة ستالين السرية تحت الأرض
  short: مطبعة بلشفية سرية من 1903–1906 كان الوصول إليها عبر قاع بئر — كبسولة زمن سوفييتية على طرف أفلاباري.
  body: >-
    **متحف توقف فيه الزمن عند سبعينيات القرن الماضي يحرس سراً من عام 1906.** في فناء بيت خشبي عادي بشارع
    كاسبي بئرٌ عمقها نحو خمسة عشر متراً. من قاعها كان نفق يفضي إلى غرفة تحت الأرض طبع فيها البلاشفة —
    وبينهم ستالين الشاب — بين 1903 و1906 منشورات ثورية بالجورجية والروسية والأرمنية. أما آلة الطباعة الألمانية
    الصنع فهُرّبت إلى المدينة قطعاً وأعيد تركيبها تحت الأرض.


    في 1906 اكتشف درك القيصر العملية وأحرقوا البيت؛ لكن الآلة نجت في الأسفل. حوّلت السلطة السوفييتية المكان
    لاحقاً إلى مزار، واليوم يبقي متطوعو الحزب الشيوعي الجورجي المتحف حياً من دون أي تمويل حكومي — وهنا
    سحره بالضبط:


    - تطل في البئر المبطنة بالآجر ثم تنزل على درج من الحقبة السوفييتية إلى الآلة الصدئة نفسها

    - في الأعلى غرف مليئة بصور لينين وستالين — ديكور سوفييتي لم تمسه يد

    - والقيّم — وغالباً ما يكون من قدامى الحزب — يروي الحكاية كأنها جرت أمس


    إنه أغرب متاحف تبليسي: قطعة من التاريخ مغبرة وصادقة وغير مصقولة إطلاقاً، لم تمر عليها يد أمين متحف
    قط.
  tip: >-
    الدخول 10 لاري نقداً فقط. رسمياً يفتح أيام الأسبوع 10:00–18:00، لكن الأمر عملياً مرهون بوجود القيّم
    — فالاتصال مسبقاً حكمة (الرقم معلق على البوابة ومتداول في منتديات السفر). الجولات بالجورجية والروسية،
    وتُعطى ورقة معلومات مطبوعة بالإنجليزية. الدرج النازل إلى الآلة شديد الانحدار — البس حذاء مريحاً.
  route: >-
    يقع المتحف على طرف أفلاباري في شارع كاسبي، على نحو 600 متر من محطة مترو «300 أراغفيلي». من ساحة الحرية
    ربع ساعة بالسيارة: اعبر نهر متكفاري على جسر ميتيخي أو جسر باراتاشفيلي وتابع على جادة كيتيفان تساميبولي
    باتجاه إيساني، ثم انعطف يميناً إلى شارع كاسبي. الحي سكني هادئ — تركن السيارة مجاناً على حافة الطريق
    عند البوابة. سيارة اقتصادية تكفي تماماً. ويندرج المتحف بسلاسة في مسار واحد مع كاتدرائية سامبا أو حمامات
    الكبريت.
