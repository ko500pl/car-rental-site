ka:
  name: სტალინის არალეგალური სტამბის მუზეუმი
  short: >-
    1903–1906 წლების საიდუმლო სტამბა ავლაბრის სახლის ქვეშ, რომელსაც წყლიანი ჭითა და გვირაბით აღწევდნენ
    — თბილისის ყველაზე უცნაური მუზეუმი.
  body: >-
    **XX საუკუნის დასაწყისის ტფილისის ყველაზე სახიფათო ოთახში მოსახვედრად ჭაში უნდა ჩასულიყავით.** 1903
    წელს რუსეთის სოციალ-დემოკრატიული მუშათა პარტიის კავკასიის კავშირის კომიტეტმა საკუთარი სტამბის გამართვა
    გადაწყვიტა. საქმეს მიხეილ ბოჭორიძე ჩაუდგა სათავეში. მან რკინიგზის სახელოსნოების ყოფილ მუშას, დ. როსტომაშვილს,
    ავლაბარში ნაკვეთის დათმობა სთხოვა; ქალაქის გამგეობას ფიქტიური სამშენებლო გეგმა წარუდგინეს და ჩვეულებრივი
    სახლი ააშენეს. მის ქვეშ ექვსი თვის განმავლობაში ღრმა სარდაფი გათხარეს. შიგნით მოხვედრა მხოლოდ ასე
    შეიძლებოდა: წყლიან ჭაში ჩასვლა, ჰორიზონტალური გვირაბის გავლა და მეორე ჭიდან კიბით ამოსვლა.


    ზემოთ ბოჭორიძის ნათესავი, ბაბე ლაშაძე-ბოჭორიძე ცხოვრობდა: მესტამბეებს საჭმელს უმზადებდა და ქუჩას თვალს
    არ აშორებდა. როცა პოლიცია ახლოვდებოდა, აივნიდან დარაჯები ზარს რეკავდნენ, რომ ქვემოთ დაზგა გაეჩერებინათ.
    დაზგა კი დაუღალავად მუშაობდა: ქალაქში ფარულად შემოტანილი და მიწისქვეშ აწყობილი აუგსბურგის მანქანათმშენებელ
    ქარხანაში დამზადებული მანქანა დღეში 45 ათასამდე ანაბეჭდს უშვებდა ქართულ, რუსულ და სომხურ ენებზე —
    პროკლამაციებს, ლენინის ნაწერებს, გაზეთ „პროლეტარიატის ბრძოლას“. 1906 წლის 15 აპრილს პოლიციამ სტამბას
    მიაგნო და მიწისქვეშა სათავსები ააფეთქა. საბჭოთა ტრადიციამ მოგვიანებით ამ ამბის ცენტრში ახალგაზრდა
    იოსებ ჯუღაშვილი, მომავალი სტალინი, დააყენა — და დღეს მუზეუმს სწორედ მისი სახელით იცნობენ.


    საბჭოთა ხელისუფლებამ ადგილი აღადგინა და სალოცავივით მოუარა. დღეს აქ დრო თითქოს გაჩერებულია: ლენინისა
    და სტალინის პორტრეტები, გაცვეთილი ვიტრინები, სარდაფში კი, შიშველი ნათურის ქვეშ, მძიმე გერმანული დაზგა,
    რომელსაც მუზეუმი ორიგინალად წარადგენს. ჯერ აგურით ამოყვანილ ჭაში ჩაიხედავთ, მერე კი თავად ჩახვალთ
    მასთან. ეს ადგილი არცერთ კურატორს არ გაუპრიალებია — და სწორედ ამიტომაა ასეთი გულწრფელი.
  tip: >-
    შესვლა 10 ლარია, მხოლოდ ნაღდი ფულით. ოფიციალურად ღიაა ორშაბათიდან პარასკევამდე, 10:00-დან 18:00-მდე,
    შაბათ-კვირას დაკეტილია, მაგრამ სინამდვილეში ყველაფერი მომვლელზეა დამოკიდებული, რომელიც აქვე ცხოვრობს.
    ყველაზე საიმედოა დილის ბოლო საათები, 11:00-ის შემდეგ; თუ ჭიშკარი დაკეტილია, დააკაკუნეთ და ცოტა მოიცადეთ.
    ახსნა-განმარტება ძირითადად ქართულად და რუსულადაა. ვიზიტს 20–40 წუთი დაუთმეთ. დაზგასთან ჩასასვლელი
    კიბე ციცაბოა — ბრტყელძირიანი ფეხსაცმელი ჩაიცვით და მოაჯირს მოეჭიდეთ.
  route: >-
    მუზეუმი ავლაბრის განაპირას, კასპის ქუჩა №7-შია — თავისუფლების მოედნიდან გზით დაახლოებით 3 კმ, მანქანით
    10–15 წუთი. მტკვარზე მეტეხის ან ბარათაშვილის ხიდით გადადით, ქეთევან წამებულის გამზირს ისნისკენ გაჰყევით
    და კასპის ქუჩაზე გადაუხვიეთ. უბანი მშვიდი და საცხოვრებელია, მანქანას ჭიშკართან, ქუჩის პირას, ჩვეულებრივ,
    ადვილად გააჩერებთ. ეკონომ-კლასის მანქანა სავსებით საკმარისია. უმანქანოდ — მეტრო „300 არაგველიდან“
    დაახლოებით 600 მეტრია. ვიზიტი ერთ გასეირნებაში კარგად ეწყობა სამების ტაძართან ან მდინარის გაღმა, აბანოთუბანთან.
en:
  name: Stalin's Underground Printing House
  short: >-
    A secret press of 1903–1906 beneath an Avlabari house, reached down a water well and along a tunnel:
    Tbilisi's strangest museum.
  body: >-
    **To reach the most dangerous room in early-1900s Tiflis, you had to climb down a well.** In 1903
    the Caucasian Union Committee of the Russian Social Democratic Labour Party decided it needed a press
    of its own. The organiser, Mikheil Bochoridze, persuaded a former railway-workshop hand, D. Rostomashvili,
    to give up a plot in Avlabari; a fictitious building plan was filed with the city, and an ordinary-looking
    house went up. Beneath it, over six months, a deep cellar was dug. The only way in was down a well
    with water in it, along a horizontal tunnel, and up a ladder in a second shaft.


    Upstairs lived Bochoridze's aunt, Babe Lashadze-Bochoridze, who cooked for the printers and never
    stopped watching the street. Lookouts on the porch rang a bell whenever police came near, so the men
    below could silence the machine. And the machine worked hard: a Maschinenfabrik Augsburg press, smuggled
    in and assembled underground, turned out up to 45,000 impressions a day in Georgian, Russian and Armenian,
    among them leaflets, Lenin's writings and the newspaper Proletariatis Brdzola. On 15 April 1906 the
    police found it and blew up the underground rooms. Soviet tradition later put the young Iosif Jughashvili,
    the future Stalin, at the heart of the story, and it is by his name that the museum is known today.


    The Soviets restored the site as a shrine. Now it feels like a place time forgot: portraits of Lenin
    and Stalin, tired display cases, and, under a bare bulb in the cellar, the heavy German press the
    museum presents as the original. You peer down the brick-lined well, then go down to meet it. No curator
    has ever smoothed this place over, and it is all the more honest for it.
  tip: >-
    Entry is 10 GEL, cash only. Official hours are 10:00–18:00, Monday to Friday, closed at weekends,
    but in practice they depend on the caretaker, who lives on site. Late morning, after 11:00, is the
    safest bet, and if the gate is shut, knock and wait a minute. Explanations are mostly in Georgian
    and Russian, so read up beforehand or bring a translation app. Allow 20 to 40 minutes. The steps down
    to the press are steep: wear flat shoes and hold the rail.
  route: >-
    The museum is at 7 Kaspi Street, on the edge of Avlabari, about 3 km by road from Freedom Square and
    a 10–15-minute drive. Cross the Mtkvari by the Metekhi or Baratashvili bridge, follow Ketevan Tsamebuli
    Avenue towards Isani and turn off into Kaspi Street. The neighbourhood is quiet and residential, and
    you can usually park at the kerb near the gate. An economy car is all you need. Without a car, the
    300 Aragveli metro station is about 600 metres away. The visit fits easily into one outing with Sameba
    Cathedral or the sulphur baths across the river.
ru:
  name: Подпольная типография Сталина
  short: >-
    Тайная типография 1903–1906 годов под домом в Авлабари, куда вёл путь через колодец с водой и тоннель:
    самый странный музей Тбилиси.
  body: >-
    **Чтобы попасть в самую опасную комнату Тифлиса начала 1900-х, нужно было спуститься в колодец.**
    В 1903 году Кавказский союзный комитет Российской социал-демократической рабочей партии решил, что
    ему нужна собственная типография. Организатор, Михаил Бочоридзе, уговорил бывшего рабочего железнодорожных
    мастерских Д. Ростомашвили уступить участок в Авлабари; в городские власти подали фиктивный план постройки,
    и вырос самый обычный с виду дом. Под ним за полгода вырыли глубокий подвал. Попасть туда можно было
    только одним путём: вниз по колодцу с водой, по горизонтальному тоннелю и вверх по лестнице во второй
    шахте.


    Наверху жила тётя Бочоридзе, Бабе Лашадзе-Бочоридзе: она готовила печатникам и не сводила глаз с улицы.
    Дозорные на крыльце звонили в колокольчик, стоило полиции приблизиться, чтобы люди внизу успели остановить
    машину. А машина работала на износ: печатный станок Maschinenfabrik Augsburg, тайно ввезённый и собранный
    под землёй, выдавал до 45 000 оттисков в день на грузинском, русском и армянском языках — листовки,
    сочинения Ленина, газету «Пролетариатис брдзола» («Борьба пролетариата»). 15 апреля 1906 года полиция
    обнаружила типографию и взорвала подземные помещения. Позднее советская традиция поставила в центр
    этой истории молодого Иосифа Джугашвили, будущего Сталина, — и именно по его имени музей известен
    сегодня.


    Советская власть восстановила это место как святыню. Теперь оно кажется забытым временем: портреты
    Ленина и Сталина, усталые витрины и — под голой лампочкой в подвале — тяжёлый немецкий станок, который
    музей представляет как подлинный. Вы заглядываете в выложенный кирпичом колодец, а потом спускаетесь
    к нему. Ни один куратор так и не пригладил это место, и оттого оно только честнее.
  tip: >-
    Вход — 10 лари, только наличными. Официально музей открыт с 10:00 до 18:00 с понедельника по пятницу,
    в выходные закрыт, но на деле всё зависит от смотрителя, который живёт здесь же. Надёжнее всего приходить
    ближе к полудню, после 11:00; если ворота закрыты, постучите и подождите минуту. Пояснения в основном
    на грузинском и русском, так что почитайте заранее или возьмите приложение-переводчик. Заложите 20–40
    минут. Ступени к станку крутые: наденьте обувь без каблука и держитесь за поручень.
  route: >-
    Музей находится на улице Каспи, 7, на краю Авлабари, примерно в 3 км по дороге от площади Свободы
    — 10–15 минут езды. Переправьтесь через Куру по Метехскому мосту или мосту Бараташвили, двигайтесь
    по проспекту Кетеван Цамебули в сторону Исани и сверните на улицу Каспи. Район тихий, жилой, и у ворот
    обычно можно встать у бордюра. Хватит машины эконом-класса. Без машины: станция метро «300 Арагвели»
    примерно в 600 метрах. Визит легко совместить с собором Самеба или серными банями на другом берегу.
fa:
  name: چاپخانهٔ زیرزمینی استالین
  short: >-
    چاپخانه‌ای مخفی از سال‌های ۱۹۰۳ تا ۱۹۰۶ زیر خانه‌ای در آولاباری، که از راه چاهی آب‌دار و یک تونل به
    آن می‌رسیدند: غریب‌ترین موزهٔ تفلیس.
  body: >-
    **برای رسیدن به خطرناک‌ترین اتاق تفلیسِ سال‌های آغازین سدهٔ بیستم، باید از چاهی پایین می‌رفتید.**
    در ۱۹۰۳ کمیتهٔ اتحادیهٔ قفقاز حزب کارگران سوسیال‌دموکرات روسیه به این نتیجه رسید که به چاپخانه‌ای
    از آنِ خود نیاز دارد. سازمان‌دهنده، میخئیل بوچوریدزه، کارگر پیشین کارگاه‌های راه‌آهن، د. روستوماشویلی،
    را راضی کرد که زمینی در آولاباری را واگذارد؛ نقشهٔ ساختمانی ساختگی به شهرداری سپرده شد و خانه‌ای با
    ظاهری عادی برپا شد. زیر آن، در شش ماه، زیرزمینی ژرف کندند. تنها راه ورود این بود: پایین رفتن در چاهی
    که آب داشت، گذشتن از تونلی افقی و بالا رفتن از نردبانی در چاهی دیگر.


    در طبقهٔ بالا خویشاوند بوچوریدزه، بابه لاشادزه-بوچوریدزه، زندگی می‌کرد؛ برای چاپگران غذا می‌پخت و
    چشم از خیابان برنمی‌داشت. دیده‌بان‌هایی در ایوان هر بار که پلیس نزدیک می‌شد زنگی را به صدا درمی‌آوردند
    تا مردان زیرزمین صدای دستگاه را خاموش کنند. و دستگاه سخت کار می‌کرد: ماشین چاپی ساخت کارخانهٔ ماشین‌سازی
    آگسبورگ، که پنهانی به شهر آورده و در زیر زمین سوار شده بود، روزانه تا ۴۵,۰۰۰ نسخهٔ چاپی به زبان‌های
    گرجی، روسی و ارمنی بیرون می‌داد، از جمله اعلامیه‌ها، نوشته‌های لنین و روزنامهٔ «پرولتاریاتیس بردزولا»
    («نبرد پرولتاریا»). در ۱۵ آوریل ۱۹۰۶ پلیس آن را یافت و اتاق‌های زیرزمینی را منفجر کرد. سنت شوروی بعدها
    یوسف جوگاشویلی جوان، استالینِ آینده، را در کانون این ماجرا نشاند، و امروز موزه با نام او شناخته می‌شود.


    شوروی‌ها این مکان را همچون زیارتگاهی بازسازی کردند. اکنون جایی به نظر می‌رسد که زمان فراموشش کرده:
    چهره‌های لنین و استالین، ویترین‌های خسته، و زیر لامپی برهنه در زیرزمین، ماشین چاپ سنگین آلمانی که
    موزه آن را همان دستگاه اصلی معرفی می‌کند. از لبهٔ چاه آجرچین به درونش سرک می‌کشید، سپس پایین می‌روید
    تا با آن روبه‌رو شوید. هیچ متصدی موزه‌ای هرگز این مکان را بزک نکرده، و همین آن را صادق‌تر کرده است.
  tip: >-
    ورودیه ۱۰ لاری است و فقط نقدی. ساعت رسمی کار ۱۰:۰۰ تا ۱۸:۰۰، دوشنبه تا جمعه، است و آخر هفته تعطیل
    است، اما در عمل به سرایدار بستگی دارد که در همان‌جا زندگی می‌کند. اواخر صبح، پس از ساعت ۱۱:۰۰، مطمئن‌ترین
    زمان است؛ اگر دروازه بسته بود، در بزنید و دقیقه‌ای صبر کنید. توضیحات بیشتر به گرجی و روسی است، پس
    از پیش دربارهٔ آن بخوانید یا یک برنامهٔ ترجمه همراه داشته باشید. ۲۰ تا ۴۰ دقیقه وقت بگذارید. پله‌هایی
    که به ماشین چاپ می‌رسند تند هستند: کفش تخت بپوشید و نرده را بگیرید.
  route: >-
    موزه در خیابان کاسپی، شمارهٔ ۷، در حاشیهٔ آولاباری است؛ حدود ۳ کیلومتر راه از میدان آزادی و ۱۰ تا
    ۱۵ دقیقه رانندگی. از پل متخی یا پل باراتاشویلی از رود متکواری بگذرید، خیابان کتوان تسامه‌بولی را به
    سوی ایسانی دنبال کنید و به خیابان کاسپی بپیچید. محله آرام و مسکونی است و معمولاً می‌توانید کنار جدول،
    نزدیک دروازه، پارک کنید. یک خودروی اقتصادی کافی است. بی‌خودرو، ایستگاه مترو «۳۰۰ آراگوِلی» حدود ۶۰۰
    متر فاصله دارد. این بازدید را به‌آسانی می‌توان در یک گردش با کلیسای جامع سامه‌با یا حمام‌های گوگردی
    آن سوی رود همراه کرد.
he:
  name: בית הדפוס המחתרתי של סטלין
  short: >-
    בית דפוס סודי משנים 1903–1906 מתחת לבית באבלבארי, שהגיעו אליו דרך באר מים ומנהרה: המוזיאון המוזר ביותר
    בטביליסי.
  body: >-
    **כדי להגיע לחדר המסוכן ביותר בטיפליס של ראשית המאה ה-20, היה צריך לרדת לתוך באר.** ב-1903 החליט הוועד
    של האיגוד הקווקזי של מפלגת הפועלים הסוציאל-דמוקרטית הרוסית שהוא זקוק לבית דפוס משלו. המארגן, מיחאיל
    בוצ'ורידזה, שכנע עובד לשעבר בסדנאות הרכבת, ד' רוסטומשווילי, לוותר על מגרש באבלבארי; תוכנית בנייה פיקטיבית
    הוגשה לעירייה, ועל המגרש קם בית רגיל למראה. מתחתיו נחפר במשך שישה חודשים מרתף עמוק. הדרך היחידה להיכנס
    הייתה לרדת בבאר שהיו בה מים, לעבור במנהרה אופקית ולעלות בסולם בפיר שני.


    בקומה העליונה גרה דודתו של בוצ'ורידזה, באבה לשדזה-בוצ'ורידזה, שבישלה לפועלי הדפוס ולא הפסיקה לעקוב
    אחר הרחוב. תצפיתנים במרפסת הכניסה צלצלו בפעמון בכל פעם שהמשטרה התקרבה, כדי שהאנשים למטה ישתיקו את
    המכונה. והמכונה עבדה קשה: מכבש דפוס תוצרת מפעל המכונות של אאוגסבורג, שהוברח לעיר והורכב מתחת לאדמה,
    הפיק עד 45,000 עותקים ביום בגאורגית, ברוסית ובארמנית, ובהם כרוזים, כתבי לנין והעיתון "פרולטריאטיס
    ברדזולה" ("מאבק הפרולטריון"). ב-15 באפריל 1906 גילתה המשטרה את המקום ופוצצה את החדרים התת-קרקעיים.
    מאוחר יותר הציבה המסורת הסובייטית במרכז הסיפור את יוסיף ג'וגשווילי הצעיר, לימים סטלין, ובשמו נקרא
    המוזיאון עד היום.


    הסובייטים שיקמו את המקום כמקדש. כיום הוא נראה כמקום שהזמן שכח: דיוקנאות של לנין ושל סטלין, ויטרינות
    עייפות, ומתחת לנורה חשופה במרתף – מכבש הדפוס הגרמני הכבד, שהמוזיאון מציג כמקורי. אתם מציצים לתוך הבאר
    המצופה לבנים, ואז יורדים לפגוש אותו. שום אוצר מעולם לא ייפה את המקום הזה, ודווקא משום כך הוא כן יותר.
  tip: >-
    הכניסה 10 לארי, מזומן בלבד. שעות הפתיחה הרשמיות הן 10:00–18:00 בימים שני עד שישי, וסגור בסופי שבוע,
    אבל בפועל הכול תלוי בשומר המקום, שגר באתר. סוף הבוקר, אחרי 11:00, הוא ההימור הבטוח ביותר, ואם השער
    סגור – דפקו וחכו דקה. ההסברים הם בעיקר בגאורגית וברוסית, לכן קראו על המקום מראש או הצטיידו באפליקציית
    תרגום. הקדישו 20 עד 40 דקות. המדרגות אל המכבש תלולות: נעלו נעליים שטוחות ואחזו במעקה.
  route: >-
    המוזיאון נמצא ברחוב קספי 7, בשולי אבלבארי, כ-3 ק"מ בכביש מכיכר החירות, נסיעה של 10–15 דקות. חצו את
    המטקווארי בגשר מטחי או בגשר ברטשווילי, המשיכו בשדרות קטבן צמבולי לכיוון איסני ופנו לרחוב קספי. השכונה
    שקטה ומגורית, ובדרך כלל אפשר לחנות לצד המדרכה ליד השער. רכב חסכוני מספיק לגמרי. בלי רכב: תחנת המטרו
    "300 אראגוולי" נמצאת כ-600 מטרים משם. קל לשלב את הביקור בסיור אחד עם קתדרלת סאמבה (השילוש הקדוש) או
    עם מרחצאות הגופרית שמעבר לנהר.
ar:
  name: مطبعة ستالين السرية تحت الأرض
  short: 'مطبعة سرية عملت بين 1903 و1906 تحت بيت في أفلاباري، يُنزل إليها عبر بئر ماء ونفق: أغرب متاحف
    تبليسي.'
  body: >-
    **لكي تبلغ أخطر غرفة في تفليس مطلع القرن العشرين، كان عليك أن تنزل في بئر.** في عام 1903 قرّرت لجنة
    الاتحاد القوقازي التابعة لحزب العمال الاشتراكي الديمقراطي الروسي أنها تحتاج إلى مطبعة خاصة بها. فأقنع
    المنظِّم ميخائيل بوتشوريدزه عاملًا سابقًا في ورش السكك الحديدية يُدعى د. روستوماشفيلي بالتنازل عن
    قطعة أرض في أفلاباري؛ وقُدّم إلى البلدية مخطّط بناء وهمي، وارتفع بيت عادي المظهر. وتحته حُفر على مدى
    ستة أشهر قبو عميق. ولم يكن إليه سوى سبيل واحد: النزول في بئر فيها ماء، ثم السير في نفق أفقي، ثم الصعود
    على سلّم في بئر ثانية.


    وفي الطابق العلوي عاشت قريبة بوتشوريدزه، بابي لاشادزه-بوتشوريدزه، تطبخ للطبّاعين ولا تكفّ عن مراقبة
    الشارع. وكان الرقباء على الشرفة يقرعون جرسًا كلما اقتربت الشرطة، ليُسكت الرجال في الأسفل الآلة. وكانت
    الآلة تعمل بلا هوادة: مطبعة من صنع مصنع آلات أوغسبورغ، هُرّبت وجُمّعت تحت الأرض، تُخرج ما يصل إلى
    45,000 نسخة مطبوعة في اليوم بالجورجية والروسية والأرمنية، من بينها منشورات وكتابات لينين وصحيفة «بروليتارياتيس
    بردزولا» («نضال البروليتاريا»). وفي 15 أبريل 1906 اكتشفتها الشرطة ونسفت الغرف الجوفية. ثم وضع التقليد
    السوفييتي لاحقًا الشابَّ يوسف جوغاشفيلي، ستالين المستقبل، في قلب القصة، وباسمه يُعرف المتحف اليوم.


    أعاد السوفييت ترميم الموقع ليكون مزارًا. أمّا اليوم فيبدو مكانًا نسيه الزمن: صور لينين وستالين، وخزائن
    عرض متعبة، وتحت مصباح عارٍ في القبو، المطبعة الألمانية الثقيلة التي يقدّمها المتحف على أنها الأصلية.
    تطلّ في البئر المبطّنة بالطوب، ثم تنزل لملاقاتها. لم يأتِ قيّمٌ قط ليجمّل هذا المكان، وهو لذلك أصدق.
  tip: >-
    رسم الدخول 10 لاري، نقدًا فقط. المواعيد الرسمية من 10:00 إلى 18:00، من الاثنين إلى الجمعة، ويُغلق
    في عطلة نهاية الأسبوع، لكنها عمليًا تتوقف على الحارس الذي يسكن في الموقع. أواخر الصباح، بعد الساعة
    11:00، هي الأضمن، وإن وجدت البوابة مغلقة فاطرق وانتظر دقيقة. الشروح في معظمها بالجورجية والروسية،
    فاقرأ عن المكان مسبقًا أو استعن بتطبيق ترجمة. خصّص من 20 إلى 40 دقيقة. الدرجات النازلة إلى المطبعة
    شديدة الانحدار: ارتدِ حذاءً مسطّحًا وأمسك بالدرابزين.
  route: >-
    يقع المتحف في الرقم 7 بشارع كاسبي، على طرف أفلاباري، على بعد نحو 3 كم بالسيارة من ساحة الحرية، أي
    10–15 دقيقة قيادة. اعبر نهر متكفاري على جسر ميتيخي أو جسر باراتاشفيلي، واتبع جادة كيتيفان تسامبولي
    باتجاه إيساني، ثم انعطف إلى شارع كاسبي. الحي هادئ وسكني، وعادةً يمكنك الركن بمحاذاة الرصيف قرب البوابة.
    تكفي سيارة اقتصادية. ومن دون سيارة، تبعد محطة مترو «300 أراغفيلي» نحو 600 متر. ويسهل الجمع في جولة
    واحدة بين الزيارة وكاتدرائية سامِيبا (الثالوث المقدس) أو الحمّامات الكبريتية على الضفة الأخرى.
