ka:
  name: სამება–ჯიხეთის დედათა მონასტერი
  short: >-
    დედათა მონასტერი ნიგოითის მთაზე, რომლის ადგილი, გადმოცემით, სამმა მტრედმა აირჩია და სადაც, მონაზვნების
    თქმით, წირვა საბჭოთა წლებშიც არ შეწყვეტილა.
  body: >-
    **გადმოცემით, ჯიხეთის მონაზვნებმა ახალი სავანის ადგილის არჩევა სამ მტრედს მიანდეს — ფრინველები კი
    აქ, ნიგოითის მთაზე, წყაროსთან დაეშვნენ.**


    მათი პირველი, მენელსაცხებლე დედათა სახელობის მონასტერი ჯიხეთის მთაზე, თითქმის მიუვალ ადგილას იდგა.
    სახელი სიტყვიდან „ჯიხა“ მომდინარეობს, რაც ზანურად ციხეს ნიშნავს — ალბათ, ოდესღაც მთის წვერს ციხე აგვირგვინებდა.
    ზეპირი გადმოცემა პირველ ეკლესიას თამარ მეფის ხანას მიაწერს; XIX საუკუნისთვის აქ მხოლოდ ნანგრევები
    იყო, მონაზვნებს კი, ლეგენდის თანახმად, უწყლობა სტანჯავდა.


    დოკუმენტური ისტორია 1886 წლიდან იწყება, როცა აქ მონაზონი ელენე მგალობლიშვილი დასახლდა. თავადმა მაჭუტაძეებმა
    მონაზვნებს მიწა შესწირეს, 1896 წელს კი ოზურგეთელი ილარიონ მენაბდის თაოსნობით ღვთისმშობლის ტაძრად მიყვანების
    ქვის ეკლესია დასრულდა. ელენე სავანეს 1914 წლამდე წინამძღვრობდა; მონასტერთან სკოლაც მუშაობდა, სადაც
    წერა-კითხვას, საოჯახო საქმესა და ხელსაქმეს ასწავლიდნენ. 1905 წელს ათონიდან მღვდელმონაზონმა იონამ ივერიის
    ღვთისმშობლის ხატი გამოგზავნა — იგი დღესაც ტაძარშია და სასწაულმოქმედად ითვლება.


    მონასტრის ისტორიის თანახმად, წირვა აქ არასოდეს შეწყვეტილა, საბჭოთა ათეისტურ ათწლეულებშიც კი — ამიტომ
    სახელმწიფომ მონასტერი სოფლადაც აღრიცხა. 2014 წლის აღწერით მას 21 მცხოვრები ჰყავდა, ყველა — გალავნის
    შიგნით.


    მთავარი ტაძარი მუქი ქვისაა, რუხი თუნუქის სახურავებით, გუმბათიდან კი მაცხოვარი იყურება. 1987 წლიდან
    სავანეს სამრეკლო და კიდევ სამი ეკლესია შეემატა — უკანასკნელი, წმინდა მოციქულთა სახელობისა, 2011 წელს
    აიგო. ეზოში, სანათლავ აუზში, „იორდანეს წყაროს“ წყალი ჩაედინება, რომელსაც მკურნალ ძალას მიაწერენ. მტრედების
    ამბავი რწმენის საქმეა, ერთი რამ კი ცხადია: მათ ისეთი ადგილი აირჩიეს, სადაც წყალი მოედინება და ლოცვა
    არასოდეს შეწყვეტილა.
  tip: >-
    ერთი საათი საკმარისია. მონასტერი მოქმედია: ქალებს თავსაფარი და კაბა სჭირდებათ, მამაკაცებს — გრძელი
    შარვალი; მონაზვნები მხოლოდ მათი ნებართვით გადაიღეთ, წირვის დროს კი ხმადაბლა ისაუბრეთ. 4 დეკემბერს,
    ჯიხეთობას, ხალხმრავლობა და ხანგრძლივი წირვა დაგხვდებათ — ამაღელვებელი დღეა, მაგრამ არა წყნარი. წყაროს
    წყლის წაღება თუ გსურთ, ჯერ დედებს ჰკითხეთ. კაფეზე ნუ იანგარიშებთ — მაღაზიებს და საჭმელს ახლომახლო,
    ლანჩხუთში იპოვით. ვიზიტს კარგად ერწყმის რამდენიმე კილომეტრით აღმოსავლეთით მდებარე ტელეფისის ციხე.
  route: >-
    თბილისიდან დაახლოებით 275 კმ-ია, გზას ოთხიოდე საათი დასჭირდება. ს1 (E60) მაგისტრალით ხაშურის, რიკოთის
    მონაკვეთისა და ქუთაისის გავლით სამტრედიამდე მიდიხართ, იქიდან ს12-ით ლანჩხუთისკენ. ლანჩხუთამდე, სოფელ
    ნიგოითთან, მაგისტრალიდან გადაუხვიეთ: მონასტრამდე დაახლოებით 6 კმ-ია გურიის ქედის ჩრდილოეთ კალთაზე
    — ჯერ ადგილობრივი გზით, ბოლოს კი ვიწრო გზით, რომელიც ტყეში ადის. ბოლო მონაკვეთი ვიწრო და მოსახვევებიანია,
    თუმცა მშრალ ამინდში ეკონომკლასის ავტომობილი სრულიად საკმარისია. საწვავი სამტრედიაში ან ლანჩხუთში შეავსეთ.
en:
  name: Sameba–Jikheti Convent
  short: >-
    A convent on Nigoiti hill whose site, tradition says, was chosen by three doves, and where, the nuns
    say, the liturgy never stopped, even under Soviet rule.
  body: >-
    **Tradition says the nuns of Jikheti let three doves choose where to build again, and the birds came
    down here, on Nigoiti hill, beside a spring.**


    Their first convent, dedicated to the Myrrh-bearing Women, stood in an almost inaccessible spot on
    Jikheti mountain. The name comes from jikha, "fortress" in the Zan language, a hint that a castle
    once crowned the summit. Oral tradition dates the first church to the reign of Queen Tamar; by the
    nineteenth century only ruins were left, and the nuns, the legend goes, were worn down by the lack
    of water.


    The documented story begins in 1886, when the nun Elene Mgaloblishvili settled here. The princely
    Machutadze family gave land, and in 1896, under Ilarion Menabde of Ozurgeti, the stone Church of the
    Presentation of the Mother of God was completed. Elene led the community until 1914, and the convent
    ran a school that taught reading and writing, housekeeping and handicrafts. In 1905 the hieromonk
    Iona sent an Iveron icon of the Mother of God from Mount Athos; it is still in the church, venerated
    as miraculous.


    According to the convent's history, the liturgy here never ceased, not even in the atheist decades
    of Soviet rule — so the state ended up registering the convent as a village. At the 2014 census it
    had 21 inhabitants, all living within its walls.


    The main church is of dark stone under grey metal roofs, and Christ looks down from its dome. Since
    1987 the community has added a bell tower and three more churches, the latest, of the Holy Apostles,
    in 2011. In the courtyard the "Spring of Jordan" runs into a baptismal pool, its water believed to
    heal. Whatever you make of the doves, they chose a place where the water flows and the prayer has
    never stopped.
  tip: >-
    An hour is enough. This is a working convent: women need a headscarf and a skirt, men long trousers;
    photograph the nuns only with their permission, and keep your voice low during services. On 4 December,
    the feast of Jikhetoba, expect crowds and long services — a moving day to come, but not a quiet one.
    If you would like water from the spring, ask the nuns first. Do not count on a café; Lanchkhuti, a
    short drive away, has shops and food. Telefisi Fortress, a few kilometres east, pairs well with the
    visit.
  route: >-
    From Tbilisi it is about 275 km, around four hours. Take the S1 (E60) west past Khashuri, through
    the Rikoti section and past Kutaisi to Samtredia, then the S12 towards Lanchkhuti. Before Lanchkhuti,
    near the village of Nigoiti, leave the highway: the convent lies about 6 km away on the northern slope
    of the Guria range, first along a local road and then up a narrow lane through the woods. The lane
    is tight and winding, but in dry weather an economy car is entirely adequate. Fill up in Samtredia
    or Lanchkhuti.
ru:
  name: Женский монастырь Самеба-Джихети
  short: >-
    Обитель на Нигоитской горе: место, по преданию, выбрали три голубя, а литургия, по словам монахинь,
    не прерывалась и при советской власти.
  body: >-
    **По преданию, монахини Джихети позволили трём голубям выбрать место для новой обители, и птицы опустились
    здесь, на Нигоитской горе, у источника.**


    Их первая обитель, посвящённая Жёнам-мироносицам, стояла в почти недоступном месте на горе Джихети.
    Название происходит от «джиха» — «крепость» на занском языке, что намекает на замок, некогда венчавший
    вершину. Устное предание относит первую церковь ко временам царицы Тамар; к XIX веку от неё остались
    лишь руины, а монахинь, по легенде, измучило безводье.


    Документальная история начинается в 1886 году, когда здесь поселилась монахиня Елена Мгалоблишвили.
    Княжеская семья Мачутадзе подарила землю, и в 1896 году, под руководством Илариона Менабде из Озургети,
    была завершена каменная церковь Введения во храм Богородицы. Елена возглавляла общину до 1914 года,
    и при монастыре работала школа, где учили грамоте, домоводству и рукоделию. В 1905 году иеромонах
    Иона отправил Иверскую икону Богородицы с Афона; она до сих пор в церкви и почитается как чудотворная.


    Согласно истории монастыря, литургия здесь не прерывалась никогда — даже в атеистические десятилетия
    советской власти, — так что государству пришлось зарегистрировать монастырь как село. По переписи
    2014 года в нём проживал 21 человек, все — в пределах его стен.


    Главный храм — из тёмного камня под серыми металлическими крышами, а с купола смотрит вниз Христос.
    С 1987 года община добавила колокольню и ещё три церкви, последнюю — Святых Апостолов — в 2011 году.
    Во дворе «Иорданский источник» стекает в купель, воду которой считают целебной. Что бы вы ни думали
    о голубях, они выбрали место, где течёт вода и не прекращается молитва.
  tip: >-
    Часа достаточно. Это действующий женский монастырь: женщинам нужен платок и юбка, мужчинам — длинные
    брюки; фотографируйте монахинь только с их разрешения и говорите тихо во время служб. 4 декабря, в
    праздник Джихетоба, ждите толп и долгих служб — день трогательный, но не тихий. Если хотите взять
    воду из источника, спросите сначала у монахинь. На кафе не рассчитывайте — магазины и еда есть в Ланчхути,
    недалеко отсюда. Крепость Телефиси, в нескольких километрах к востоку, хорошо сочетается с этим визитом.
  route: >-
    Из Тбилиси около 275 км, около четырёх часов. Двигайтесь по S1 (E60) на запад через Хашури, Рикотский
    участок и Кутаиси до Самтредиа, затем по S12 в сторону Ланчхути. Перед Ланчхути, возле села Нигоити,
    сверните с трассы: монастырь находится примерно в 6 км, на северном склоне Гурийского хребта, сначала
    по местной дороге, затем по узкой дороге, поднимающейся через лес. Дорога узкая и извилистая, но в
    сухую погоду машины эконом-класса вполне хватит. Заправьтесь в Самтредиа или Ланчхути.
fa:
  name: صومعهٔ راهبگان سامبا-جیخِتی
  short: >-
    صومعهٔ راهبگانی بر تپهٔ نیگوئیتی که، به‌روایتی، سه کبوتر جای آن را برگزیدند، و جایی که، به گفتهٔ راهبگان،
    عبادت حتی در دوران شوروی هم قطع نشد.
  body: >-
    **به‌روایتی، راهبگان جیخِتی گذاشتند سه کبوتر جای بازسازی را برگزینند، و پرندگان درست همین‌جا، بر تپهٔ
    نیگوئیتی، کنار چشمه‌ای، فرود آمدند.**


    نخستین صومعهٔ آن‌ها، وقف‌شده به زنانِ حاملِ مُر، در جایی تقریباً دست‌نایافتنی بر کوه جیخِتی ایستاده
    بود. نام آن از «جیخا» می‌آید، «قلعه» به زبان زانی، اشاره‌ای بدین‌که قلعه‌ای زمانی تاجی بر آن قله بوده.
    سنت شفاهی نخستین کلیسا را به روزگار ملکه تامار می‌رساند؛ تا سدهٔ نوزدهم تنها ویرانه‌هایی باقی مانده
    بود، و راهبگان، به‌روایت افسانه، از کم‌آبی خسته شده بودند.


    روایت مستندشده از ۱۸۸۶ آغاز می‌شود، آنگاه که راهبه‌ای به‌نام النه مگالوبلیشویلی اینجا سکونت گزید.
    خاندان شاهزادگان ماچوتادزه زمینی بخشیدند، و در ۱۸۹۶، به‌سرپرستی ایلاریون منابده اهل اوزورگتی، کلیسای
    سنگیِ ورودِ مادر خدا به معبد به پایان رسید. النه تا ۱۹۱۴ جامعه را رهبری کرد، و صومعه مدرسه‌ای داشت
    که خواندن و نوشتن، خانه‌داری و صنایع دستی می‌آموخت. در ۱۹۰۵ راهبِ کشیش، یونا، شمایل ایوریِ مادر خدا
    را از کوه آتوس فرستاد؛ هنوز در کلیساست و معجزه‌گر شمرده می‌شود.


    به‌گفتهٔ تاریخ صومعه، عبادت اینجا هرگز قطع نشد — حتی در دهه‌های بی‌خداییِ حکومت شوروی — به‌گونه‌ای
    که دولت سرانجام صومعه را به‌عنوان روستایی ثبت کرد. در سرشماری ۲۰۱۴، ۲۱ ساکن داشت که همه درون دیوارهایش
    زندگی می‌کردند.


    کلیسای اصلی از سنگ تیره زیر سقف‌های فلزی خاکستری است، و مسیح از گنبدش پایین می‌نگرد. از ۱۹۸۷ جامعه
    سه کلیسای دیگر و یک برج ناقوس افزوده است، تازه‌ترین، کلیسای رسولان مقدس، در ۲۰۱۱. در حیاط، «چشمهٔ
    اردن» به حوضچهٔ تعمید می‌ریزد، آبی که شفابخش پنداشته می‌شود. هرچه دربارهٔ کبوتران بیندیشید، آن‌ها
    جایی را برگزیدند که آب جاری است و دعا هرگز قطع نشده.
  tip: >-
    یک ساعت کافی است. این صومعه‌ای فعال است: زنان به روسری و دامن نیاز دارند، مردان به شلوار بلند؛ راهبگان
    را فقط با اجازهٔ خودشان عکس بگیرید، و در طول عبادت آهسته سخن بگویید. در ۴ دسامبر، جشن جیخِتوبا، ازدحام
    و عبادت‌های طولانی را انتظار داشته باشید — روزی تکان‌دهنده اما نه آرام. اگر می‌خواهید آبی از چشمه
    بردارید، نخست از راهبگان بپرسید. روی کافه‌ای حساب نکنید؛ لانچخوتی، اندکی دورتر، مغازه و غذا دارد.
    قلعهٔ تلفیسی، چند کیلومتر شرقی‌تر، خوب با این بازدید همراه می‌شود.
  route: >-
    از تفلیس نزدیک به ۲۷۵ کیلومتر است، حدود چهار ساعت. از S1 (E60) به سوی غرب، از خاشوری، بخش ریکوتی و
    کوتائیسی گذشته، تا سامتردیا برانید، سپس از S12 به‌سوی لانچخوتی. پیش از لانچخوتی، نزدیک روستای نیگوئیتی،
    از بزرگراه جدا شوید: صومعه حدود ۶ کیلومتر دورتر، بر دامنهٔ شمالی رشته‌کوه گوریا است؛ نخست از راهی
    محلی و سپس از کوره‌راهی باریک در دل جنگل به آن می‌رسید. کوره‌راه تنگ و پرپیچ‌وخم است، اما در هوای
    خشک خودروی کلاس اکونومی کاملاً کافی است. در سامتردیا یا لانچخوتی سوخت‌گیری کنید.
he:
  name: מנזר הנזירות סמבה-ג'יחתי
  short: >-
    מנזר נזירות על גבעת ניגואיטי, שאתרו נבחר, כך אומרת המסורת, בידי שלוש יונים, ושבו, לדברי הנזירות, התפילה
    לא נפסקה אף בשלטון הסובייטי.
  body: >-
    **המסורת מספרת שהנזירות של ג'יחתי הניחו לשלוש יונים לבחור היכן לבנות מחדש, והציפורים ירדו כאן, על
    גבעת ניגואיטי, לצד מעיין.**


    המנזר הראשון שלהן, המוקדש לנשים נושאות המור, עמד במקום כמעט בלתי נגיש על הר ג'יחתי. השם נגזר מ-"ג'יחא",
    "מצודה" בשפה הזאנית, רמז שמצודה עטרה בעבר את הפסגה. המסורת בעל-פה מתארכת את הכנסייה הראשונה לימי המלכה
    תמר; עד המאה התשע־עשרה נותרו רק חורבות, והנזירות, לפי האגדה, נלאו ממחסור במים.


    הסיפור המתועד מתחיל ב־1886, כשהנזירה אלנה מגלובלישוילי התיישבה כאן. משפחת הנסיכים מאצ'וטדזה נתנה קרקע,
    וב־1896, בהנהגת אילריון מנבדה מאוזורגטי, הושלמה כנסיית האבן של הצגת אם האלוהים במקדש. אלנה הובילה
    את הקהילה עד 1914, ובמנזר פעל בית ספר שלימד קרוא וכתוב, ניהול בית ומלאכת יד. ב־1905 שלח הכהן-נזיר
    יונה איקונת אם האלוהים האיברית מהר אתוס; היא עדיין נמצאת בכנסייה, ונחשבת למחוללת ניסים.


    לפי תולדות המנזר, התפילה כאן לא נפסקה אף פעם — אפילו לא בעשורים האתאיסטיים של השלטון הסובייטי — כך
    שהמדינה נאלצה בסופו של דבר לרשום את המנזר ככפר. במפקד 2014 היו בו 21 תושבים, כולם בתוך חומותיו.


    הכנסייה המרכזית היא מאבן כהה תחת גגות מתכת אפורים, וישוע מביט מטה מהכיפה שלה. מאז 1987 הוסיפה הקהילה
    מגדל פעמונים ועוד שלוש כנסיות, האחרונה, של השליחים הקדושים, ב־2011. בחצר זורם "מעיין הירדן" לבריכת
    טבילה, שמימיה נחשבים מרפאים. מה שלא תחשבו על היונים, הן בחרו מקום שבו המים זורמים והתפילה לא נפסקה
    מעולם.
  tip: >-
    שעה מספיקה. זהו מנזר נזירות פעיל: נשים צריכות כיסוי ראש וחצאית, גברים מכנסים ארוכים; צלמו את הנזירות
    רק ברשותן, ודברו בשקט בזמן התפילות. ב-4 בדצמבר, חג ג'יחתובה, ציפו לקהל ולתפילות ארוכות — יום מרגש
    אך לא שקט. אם תרצו מים מהמעיין, שאלו את הנזירות קודם. אל תסמכו על בית קפה; בלנצ'חוטי, נסיעה קצרה משם,
    יש חנויות ואוכל. מצודת טלפיסי, כמה קילומטרים מזרחה, משתלבת יפה עם הביקור.
  route: >-
    מטביליסי כ-275 ק"מ, כארבע שעות. סעו ב-S1 (E60) מערבה, דרך חשורי, קטע ריקוטי וקוטאיסי עד סמטרדיה, ואז
    ב-S12 לכיוון לנצ'חוטי. לפני לנצ'חוטי, סמוך לכפר ניגואיטי, עזבו את הכביש הראשי: המנזר נמצא כ-6 ק"מ
    משם, במדרון הצפוני של רכס גוריה, תחילה בכביש מקומי ואז בדרך צרה המטפסת בין העצים. הדרך צרה ומתפתלת,
    אך במזג אוויר יבש רכב מקטגוריית אקונומי מספיק בהחלט. תדלקו בסמטרדיה או בלנצ'חוטי.
ar:
  name: دير سامبا-جيخيتي للراهبات
  short: >-
    دير للراهبات على تلة نيغويتي اختار موضعه، بحسب التقليد، ثلاث حمائم، ولم يتوقف فيه القداس، كما تقول
    الراهبات، حتى في ظل الحكم السوفييتي.
  body: >-
    **يقول التقليد إن راهبات جيخيتي تركن لثلاث حمائم أن تختار موضع البناء من جديد، فنزلت الطيور هنا، على
    تلة نيغويتي، قرب نبع.**


    كان ديرهنّ الأول، المكرَّس للنساء حاملات الطيب، يقف في موضع يكاد يتعذّر الوصول إليه على جبل جيخيتي.
    والاسم مشتق من «جيخا»، أي «قلعة» باللغة الزانية، وهو ما يشير إلى أن قلعة كانت تتوّج القمة يومًا ما.
    وتُعيد التقاليد الشفوية الكنيسة الأولى إلى عهد الملكة تامار؛ وبحلول القرن التاسع عشر لم يبقَ سوى الأنقاض،
    وقد أنهك شحُّ الماء الراهباتِ، على ما تقول الأسطورة.


    تبدأ القصة الموثّقة عام 1886، حين استقرت هنا الراهبة إيلينه مغالوبليشفيلي. ووهبت أسرة الأمراء ماتشوتادزه
    أرضًا، وفي عام 1896، بإشراف إيلاريون مينابده من أوزورغيتي، اكتملت الكنيسة الحجرية لدخول والدة الإله
    إلى الهيكل. وقادت إيلينه الجماعة حتى عام 1914، وكان الدير يدير مدرسة تعلّم القراءة والكتابة وشؤون
    المنزل والحرف اليدوية. وفي عام 1905 أرسل الراهب الكاهن يونا أيقونة إيفيرون لوالدة الإله من جبل آثوس؛
    وهي ما تزال في الكنيسة، تُكرَّم بوصفها أيقونة عجائبية.


    وفق تاريخ الدير، لم ينقطع القداس هنا قط — ولا حتى في العقود الملحدة من الحكم السوفييتي — حتى انتهى
    الأمر بالدولة إلى تسجيل الدير قريةً. وفي تعداد عام 2014 كان فيه 21 نسمة، جميعهم يعيشون داخل أسواره.


    الكنيسة الرئيسية من حجر داكن تحت أسقف معدنية رمادية، والمسيح ينظر إلى الأسفل من قبتها. ومنذ عام 1987
    أضافت الجماعة برج أجراس وثلاث كنائس أخرى، آخرها كنيسة الرسل الأطهار عام 2011. وفي الساحة يتدفق «نبع
    الأردن» إلى حوض للمعمودية، يُعتقد أن مياهه شافية. وأيًّا كان رأيك في الحمائم، فقد اختارت موضعًا يجري
    فيه الماء ولا تنقطع فيه الصلاة.
  tip: >-
    تكفي ساعة. هذا دير راهبات عامر: تحتاج النساء إلى غطاء رأس وتنورة، والرجال إلى سراويل طويلة؛ صوّر الراهبات
    بإذنهنّ فقط، واخفض صوتك خلال القداس. في 4 ديسمبر، عيد جيخيتوبا، توقّع حشدًا وقداسًا طويلًا — يوم مؤثر
    لكنه ليس هادئًا. إن رغبت بماء من النبع، فاسأل الراهبات أولًا. لا تعتمد على مقهى؛ ففي لانتشخوتي، على
    مسافة قصيرة، متاجر وطعام. تنسجم قلعة تليفيسي، على بعد كيلومترات شرقًا، جيدًا مع هذه الزيارة.
  route: >-
    من تبليسي نحو 275 كم، أي نحو أربع ساعات. اتخذ الطريق S1 (E60) غربًا عبر خاشوري، وقطاع ريكوتي، ومرورًا
    بكوتايسي حتى سامتريديا، ثم الطريق S12 نحو لانتشخوتي. وقبل لانتشخوتي، قرب قرية نيغويتي، غادر الطريق
    السريع: يقع الدير على نحو 6 كم، على المنحدر الشمالي لسلسلة غوريا، أولًا على طريق محلي ثم على درب ضيق
    يصعد عبر الغابة. الدرب ضيق ومتعرّج، لكن سيارة اقتصادية تكفي تمامًا في الطقس الجاف. تزوَّد بالوقود
    في سامتريديا أو لانتشخوتي.
