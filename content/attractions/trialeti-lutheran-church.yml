ka:
  name: ტრიალეთის ევანგელურ-ლუთერანული ეკლესია
  short: >-
    გერმანელი კოლონისტების ქვის ეკლესია ოთხკუთხა სამრეკლოთი ტრიალეთის ზეგანზე — საბჭოთა დროს საწყობი და
    კინო, დღეს ძეგლი აღდგენილი სახურავით.
  body: >-
    **ღია ზეგანზე, 1550 მეტრის სიმაღლეზე, მუქი თლილი ქვის ოთხკუთხა სამრეკლო სოფელს გასცემს, რომელიც ოდესღაც
    გერმანული იყო.**


    1857 წელს აქ სამხრეთ გერმანელმა პროტესტანტმა კოლონისტებმა დასახლება დააარსეს და ალექსანდერსჰილფი უწოდეს.
    ისინი იმ ემიგრანტთა ტალღას ეკუთვნოდნენ, რომლებსაც იმპერატორმა ალექსანდრე I-მა 1815 წელს კავკასიაში
    ჩასახლების ნება დართო; დამაარსებლები ჯერ ელიზაბეტტალში — დღევანდელ ასურეთში — ცხოვრობდნენ და მხოლოდ
    შემდეგ ამოვიდნენ ზეგანზე. საბჭოთა ხელისუფლებამ სოფელს სახელი ორჯერ შეუცვალა: 1921 წელს როზენბერგი
    დაარქვა, 1941 წელს — მოლოტოვი. სწორედ იმ წელს, ნაცისტური გერმანიის თავდასხმის შემდეგ, კავკასიელი გერმანელები
    აღმოსავლეთით გადაასახლეს. ტრიალეთი სოფელს 1957 წლიდან ჰქვია; გერმანელი აქ აღარავინ დარჩა.


    ეკლესია, რომელიც მათ ააგეს, სოფლის ერთადერთი ეკლესიაა. როდის აშენდა, ზუსტად დადგენილი არ არის: 2017
    წლის ცნობით, რომელიც მის რესტავრაციას ეხებოდა, ეკლესია 1862 წელს დააარსეს და 1866 წელს დაასრულეს,
    სხვა წყაროები კი 1906 წელს ასახელებენ. სანამ ძეგლთა რეესტრი ამ კითხვას საბოლოოდ არ გასცემს პასუხს,
    ორივე თარიღს სიფრთხილით მოეკიდეთ.


    რაც დანამდვილებით ცნობილია: 1930-იანი წლებიდან აქ ღვთისმსახურება აიკრძალა, შენობა საწყობად, კლუბად
    და კინოთეატრადაც გამოიყენებოდა, ბოლოს კი უპატრონოდ დარჩა. სახურავი რამდენიმე ადგილას ჩაინგრა, წვიმამ
    და თოვლმა კედლების ბათქაში დააზიანა. 2016 წელს ეკლესიას კულტურული მემკვიდრეობის ძეგლის სტატუსი მიენიჭა,
    შემდეგ კი, გერმანიის საგარეო საქმეთა სამინისტროს დაფინანსებით, სახურავი შეაკეთეს და ფასადი ავთენტიკური
    სახით შეინარჩუნეს.


    დააკვირდით სამრეკლოს პირამიდულ სახურავსა და ჯვარს, წყვილ თაღოვან სარეკლო სარკმელს და მათ ზემოთ პატარა
    მრგვალ სარკმელს, მოწითალო-მურა თლილი ქვის გრძელ ნავს. 1941 წელს გერმანელები აქედან გაასახლეს; ეკლესია
    კი დარჩა და სოფლის ოთხი სახელიდან სამს გადაურჩა.
  tip: >-
    ეკლესია სოფლის ცენტრშია, გზიდან რამდენიმე ნაბიჯში. რეგულარული სამუშაო საათების დადასტურება ვერ მოხერხდა
    — შესაძლოა, კარი დაკეტილი დაგხვდეთ, თუმცა მთავარი მაინც გარე ქვის წყობაა; თუ შიგნით შესვლა გსურთ,
    ადგილობრივებს თავაზიანად ჰკითხეთ. შესვლა უფასოა. 1550 მეტრზე ქარი ზაფხულშიც ცივია, ზამთარში კი თოვლი
    ჩვეულებრივი ამბავია. სოფელში საწვავი და მაღაზია არ არის — წალკაში შეიარეთ. ნახევარი საათი საკმარისია;
    ახლოს ბეშთაშენი და დაშბაშის კანიონია, კავკასიელი გერმანელების ისტორია კი ასურეთსა და ბოლნისში გააგრძელეთ.
  route: >-
    თბილისიდან წყნეთის გზით ამოდით, შ36-ით მანგლისისკენ გაემართეთ, შემდეგ შ31-ით ზეგანი გადაკვეთეთ და
    წალკაში შედით. წალკიდან სამხრეთით შ33-ს (მარნეული–თეთრიწყარო–წალკა) გაუყევით — ტრიალეთამდე დაახლოებით
    7 კილომეტრია. სულ დაახლოებით 98 კილომეტრი და 1 საათი და 45 წუთი, ბოლომდე ასფალტით. ზაფხულში ეკონომკლასის
    მანქანაც საკმარისია, ცივ თვეებში კი საზამთრო საბურავები დაგჭირდებათ, რადგან მანგლისსა და წალკას შორის
    გზა იყინება. საწვავი წალკაში ჩაასხით — ტრიალეთში ბენზინგასამართი სადგური არ არის.
en:
  name: Trialeti Evangelical-Lutheran Church
  short: >-
    A stone church with a square bell tower, built by German colonists on the Trialeti plateau: a Soviet
    warehouse and cinema, now re-roofed and listed.
  body: >-
    **On the open plateau, 1,550 metres up, a square bell tower of dark dressed stone gives away a village
    that was once German.**


    In 1857 South German Protestant colonists founded a settlement here and called it Alexandershilf.
    They belonged to the wave of emigrants whom Emperor Alexander I had allowed into the Caucasus in 1815,
    and the founders had first lived at Elisabethtal — today's Asureti — before moving up to the plateau.
    Soviet rule renamed the village twice: Rosenberg in 1921, Molotov in 1941, the year the Caucasus Germans
    were deported east after Nazi Germany invaded the USSR. It has been Trialeti since 1957. No Germans
    remain.


    The church they built is the only one in the village. Exactly when is not settled: a 2017 report on
    its restoration says it was founded in 1862 and finished in 1866, while other sources give 1906. Until
    the heritage register settles it, treat both dates with caution.


    What is certain is its later life. Services were banned from the 1930s, and the building served as
    a warehouse, a club and a cinema before it was left empty. The roof caved in in several places, and
    rain and snow ate into the plaster. In 2016 it was listed as a cultural heritage monument; the roof
    was then repaired with money from the German Foreign Office, and the exterior was kept as it was.


    Look at the tower's pyramid roof and cross, the paired arched belfry openings with a small round window
    above them, the long nave of reddish-brown dressed stone. The Germans were taken away in 1941. Their
    church stayed, and has outlived three of the village's four names.
  tip: >-
    The church stands in the village centre, a few steps from the road. Regular opening hours could not
    be confirmed, so you may find it locked, but the stonework outside is the point; if you want to see
    inside, ask locals politely. There is no fee. At 1,550 metres the wind bites even in summer, and snow
    is routine in winter. The village has no fuel or shops, so stop in Tsalka. Half an hour is enough;
    Beshtasheni and Dashbashi Canyon are close, and the Caucasus German story continues in Asureti and
    Bolnisi.
  route: >-
    From Tbilisi climb out through Tskneti, take the Sh36 to Manglisi and the Sh31 across the plateau
    into Tsalka. From Tsalka follow the Sh33 (the Marneuli–Tetritskaro–Tsalka road) south for about 7
    km to Trialeti. In all it is about 98 km and 1 hour 45 minutes, on asphalt throughout. An economy
    car is fine in summer; in the cold months fit winter tyres, because the Manglisi–Tsalka stretch ices
    over. Fill up in Tsalka, since Trialeti has no petrol station.
ru:
  name: Евангелическо-лютеранская церковь в Триалети
  short: >-
    Каменная церковь немецких колонистов с квадратной колокольней на плато Триалети: при Советах склад
    и кинотеатр, теперь памятник под новой крышей.
  body: >-
    **На открытом плато, на высоте 1550 метров, квадратная колокольня из тёмного тёсаного камня выдаёт
    село, которое когда-то было немецким.**


    В 1857 году протестантские колонисты из Южной Германии основали здесь поселение и назвали его Александерсхильф.
    Они принадлежали к волне переселенцев, которым император Александр I в 1815 году позволил обосноваться
    на Кавказе, а сами основатели сначала жили в Элизабеттале — нынешнем Асурети — и лишь потом поднялись
    на плато. Советская власть дважды переименовывала село: в 1921 году — в Розенберг, в 1941-м — в Молотов,
    в тот самый год, когда после нападения нацистской Германии на СССР кавказских немцев выслали на восток.
    С 1957 года оно называется Триалети. Немцев здесь не осталось.


    Церковь, которую они построили, — единственная в селе. Когда именно, точно не установлено: в отчёте
    о реставрации 2017 года сказано, что её заложили в 1862 году и закончили в 1866-м, а другие источники
    называют 1906 год. Пока реестр наследия не поставит точку, относитесь к обеим датам с осторожностью.


    Зато её дальнейшая судьба известна точно. С 1930-х годов богослужения были запрещены, и здание служило
    складом, клубом и кинотеатром, а потом опустело. Крыша провалилась в нескольких местах, дождь и снег
    разъедали штукатурку. В 2016 году церковь получила статус памятника культурного наследия; затем крышу
    отремонтировали на средства МИД Германии, а внешний облик сохранили таким, каким он был.


    Посмотрите на пирамидальную кровлю башни с крестом, на парные арочные проёмы звонницы с маленьким
    круглым окном над ними, на длинный неф из красновато-коричневого тёсаного камня. Немцев увезли в 1941
    году. Их церковь осталась — и пережила три из четырёх имён села.
  tip: >-
    Церковь стоит в центре села, в нескольких шагах от дороги. Регулярные часы работы подтвердить не удалось,
    так что она может оказаться закрытой, но главное здесь — каменная кладка снаружи; если хотите заглянуть
    внутрь, вежливо спросите местных. Платы нет. На высоте 1550 метров ветер пробирает даже летом, а снег
    зимой — обычное дело. В селе нет ни заправки, ни магазинов, так что остановитесь в Цалке. Получаса
    достаточно; рядом Бешташени и каньон Дашбаши, а история кавказских немцев продолжается в Асурети и
    Болниси.
  route: >-
    Из Тбилиси поднимитесь через Цкнети, по Sh36 доезжайте до Манглиси и по Sh31 через плато до Цалки.
    Из Цалки по Sh33 (дорога Марнеули — Тетрицкаро — Цалка) на юг около 7 км до Триалети. Всего около
    98 км и 1 час 45 минут, асфальт на всём пути. Летом хватит машины эконом-класса; в холодные месяцы
    ставьте зимнюю резину, потому что участок Манглиси — Цалка обледеневает. Заправьтесь в Цалке: в Триалети
    заправки нет.
fa:
  name: کلیسای انجیلی-لوتری تریالتی
  short: >-
    کلیسایی سنگی با برج ناقوس چهارگوش، ساختهٔ مهاجرنشینان آلمانی بر فلات تریالتی: انبار و سینمای دوران
    شوروی، اکنون با بامی نو و ثبت‌شده در میراث.
  body: >-
    **بر فلات باز، در ارتفاع ۱۵۵۰ متری، برج ناقوسی چهارگوش از سنگ تراش‌خوردهٔ تیره راز روستایی را فاش
    می‌کند که روزگاری آلمانی بود.**


    در سال ۱۸۵۷ مهاجرنشینان پروتستان از جنوب آلمان در اینجا سکونتگاهی بنیاد نهادند و آن را آلکساندرسهیلف
    نامیدند. آنان از موج مهاجرانی بودند که امپراتور الکساندر یکم در سال ۱۸۱۵ اجازهٔ ورودشان به قفقاز را
    داده بود، و بنیان‌گذاران پیش از آنکه به فلات بالا بیایند، نخست در الیزابت‌تال — آسورتی امروزی — زندگی
    می‌کردند. حکومت شوروی نام روستا را دو بار عوض کرد: در ۱۹۲۱ به روزنبرگ و در ۱۹۴۱ به مولوتوف، همان سالی
    که پس از حملهٔ آلمان نازی به اتحاد شوروی، آلمانی‌های قفقاز به شرق تبعید شدند. از سال ۱۹۵۷ نامش تریالتی
    است. دیگر هیچ آلمانی‌ای در آن نمانده است.


    کلیسایی که ساختند تنها کلیسای روستاست. زمان دقیق ساختش روشن نیست: گزارشی دربارهٔ مرمت آن در سال ۲۰۱۷
    می‌گوید بنایش در ۱۸۶۲ آغاز و در ۱۸۶۶ تمام شد، در حالی که منابع دیگر سال ۱۹۰۶ را ذکر می‌کنند. تا زمانی
    که فهرست میراث فرهنگی تکلیف را روشن کند، هر دو تاریخ را با احتیاط بپذیرید.


    آنچه قطعی است، سرگذشت بعدی آن است. از دههٔ ۱۹۳۰ برگزاری مراسم دینی ممنوع شد و بنا پیش از آنکه خالی
    بماند، انبار، باشگاه و سینما بود. سقف در چند جا فرو ریخت و باران و برف گچ‌کاری را خورد. در سال ۲۰۱۶
    به‌عنوان اثر میراث فرهنگی ثبت شد؛ سپس سقف با بودجهٔ وزارت امور خارجهٔ آلمان تعمیر شد و نمای بیرونی
    همان‌گونه که بود حفظ شد.


    به بام هرمی و صلیب برج نگاه کنید، به دهانه‌های جفت و طاق‌دار ناقوس‌خانه با پنجره‌ای گرد و کوچک بالای
    آن‌ها، و به شبستان درازی از سنگ تراش‌خوردهٔ قهوه‌ای مایل به سرخ. آلمانی‌ها را در ۱۹۴۱ بردند. کلیسایشان
    ماند و از سه نام از چهار نام روستا بیشتر عمر کرده است.
  tip: >-
    کلیسا در مرکز روستا، چند قدم دورتر از جاده، ایستاده است. ساعت بازدید منظمی تأیید نشده است، پس ممکن
    است آن را بسته بیابید، اما اصل ماجرا سنگ‌کاری بیرونی است؛ اگر می‌خواهید درون را ببینید، مؤدبانه از
    اهالی بپرسید. ورودیه‌ای در کار نیست. در ارتفاع ۱۵۵۰ متری حتی در تابستان باد گزنده است و برف در زمستان
    امری عادی است. روستا پمپ‌بنزین و مغازه ندارد، پس در تسالکا توقف کنید. نیم ساعت کافی است؛ بشتاشنی و
    درهٔ داشباشی نزدیک‌اند و داستان آلمانی‌های قفقاز در آسورتی و بولنیسی ادامه می‌یابد.
  route: >-
    از تفلیس از راه تسکنتی بالا بروید، از Sh36 تا مانگلیسی و از Sh31 از میان فلات تا تسالکا بروید. از
    تسالکا Sh33 (جادهٔ مارنئولی–تتریتسکارو–تسالکا) را حدود ۷ کیلومتر به سمت جنوب تا تریالتی دنبال کنید.
    روی هم حدود ۹۸ کیلومتر و ۱ ساعت و ۴۵ دقیقه راه است، سراسر آسفالت. در تابستان خودروی اقتصادی کافی است؛
    در ماه‌های سرد لاستیک زمستانی ببندید، چون بخش مانگلیسی–تسالکا یخ می‌زند. در تسالکا باک را پر کنید،
    زیرا تریالتی پمپ‌بنزین ندارد.
he:
  name: הכנסייה האוונגלית-לותרנית בטריאלטי
  short: >-
    כנסיית אבן עם מגדל פעמונים מרובע, שבנו מתיישבים גרמנים ברמת טריאלטי: מחסן ובית קולנוע בימי ברית המועצות,
    וכיום עם גג חדש ומוכרזת כאתר מורשת.
  body: >-
    **על הרמה הפתוחה, בגובה 1,550 מטר, מגדל פעמונים מרובע מאבן גזית כהה מסגיר כפר שהיה פעם גרמני.**


    ב-1857 ייסדו כאן מתיישבים פרוטסטנטים מדרום גרמניה יישוב וקראו לו אלכסנדרסהילף. הם השתייכו לגל המהגרים
    שהקיסר אלכסנדר הראשון התיר להם ב-1815 להיכנס לקווקז, והמייסדים גרו תחילה באליזבטטל — אסורתי של היום
    — לפני שעלו אל הרמה. השלטון הסובייטי שינה את שם הכפר פעמיים: לרוזנברג ב-1921 ולמולוטוב ב-1941, השנה
    שבה גורשו גרמניי הקווקז מזרחה אחרי שגרמניה הנאצית פלשה לברית המועצות. מאז 1957 שמו טריאלטי. לא נותרו
    בו גרמנים.


    הכנסייה שבנו היא היחידה בכפר. מתי בדיוק נבנתה — לא ברור: דוח משנת 2017 על שחזורה קובע שנוסדה ב-1862
    והושלמה ב-1866, ואילו מקורות אחרים נוקבים בשנת 1906. עד שמרשם המורשת יכריע, התייחסו לשני התאריכים
    בזהירות.


    מה שוודאי הוא גורלה המאוחר. משנות ה-30 נאסרו בה טקסי התפילה, והמבנה שימש מחסן, מועדון ובית קולנוע
    לפני שננטש. הגג קרס בכמה מקומות, והגשם והשלג כרסמו בטיח. ב-2016 הוכרזה הכנסייה כאתר מורשת תרבותית;
    לאחר מכן תוקן הגג בכספי משרד החוץ הגרמני, והמראה החיצוני נשמר כפי שהיה.


    הביטו בגג הפירמידלי של המגדל ובצלב שעליו, בפתחי הפעמונים הזוגיים המקושתים עם חלון עגול קטן מעליהם,
    ובאולם התווך הארוך מאבן גזית בגוון חום-אדמדם. הגרמנים נלקחו ב-1941. הכנסייה שלהם נשארה, והאריכה ימים
    יותר משלושה מארבעת שמות הכפר.
  tip: >-
    הכנסייה ניצבת במרכז הכפר, כמה צעדים מהכביש. לא ניתן היה לאמת שעות פתיחה קבועות, כך שייתכן שתמצאו אותה
    נעולה, אבל העיקר הוא עבודת האבן מבחוץ; אם תרצו להציץ פנימה, שאלו בנימוס את המקומיים. אין דמי כניסה.
    בגובה 1,550 מטר הרוח חודרת לעצמות גם בקיץ, ושלג בחורף הוא עניין שבשגרה. בכפר אין דלק או חנויות, אז
    עצרו בצאלקה. חצי שעה מספיקה; בשתאשני וקניון דשבאשי קרובים, וסיפורם של גרמניי הקווקז נמשך באסורתי ובבולניסי.
  route: >-
    מטביליסי עלו דרך צקנטי, סעו בכביש Sh36 עד מאנגליסי ובכביש Sh31 על פני הרמה עד צאלקה. מצאלקה סעו בכביש
    Sh33 (הדרך מרנאולי–טטריצקרו–צאלקה) דרומה כ-7 ק״מ עד טריאלטי. בסך הכול כ-98 ק״מ ושעה ו-45 דקות, על
    אספלט לכל אורך הדרך. בקיץ רכב חסכוני מספיק; בחודשים הקרים התקינו צמיגי חורף, כי הקטע מאנגליסי–צאלקה
    מתכסה קרח. תדלקו בצאלקה, כי בטריאלטי אין תחנת דלק.
ar:
  name: الكنيسة الإنجيلية اللوثرية في ترياليتي
  short: >-
    كنيسة حجرية ببرج أجراس مربّع بناها مستعمرون ألمان على هضبة ترياليتي: كانت مستودعاً وسينما في العهد
    السوفييتي، واليوم رُمّم سقفها وأُدرجت في التراث.
  body: >-
    **على الهضبة المكشوفة، على ارتفاع 1550 متراً، يكشف برج أجراس مربّع من الحجر المنحوت الداكن عن قرية
    كانت ذات يوم ألمانية.**


    في عام 1857 أسّس مستعمرون بروتستانت من جنوب ألمانيا مستوطنة هنا وسمّوها ألكسندرسهيلف. وكانوا جزءاً
    من موجة المهاجرين الذين سمح لهم الإمبراطور ألكسندر الأول عام 1815 بدخول القوقاز، وكان المؤسسون قد
    عاشوا أولاً في إليزابيتتال — أسوريتي اليوم — قبل أن يصعدوا إلى الهضبة. وقد غيّرت السلطة السوفييتية
    اسم القرية مرتين: إلى روزنبرغ عام 1921، وإلى مولوتوف عام 1941، وهو العام الذي رُحّل فيه ألمان القوقاز
    شرقاً بعد غزو ألمانيا النازية للاتحاد السوفييتي. ومنذ 1957 صار اسمها ترياليتي. ولم يبقَ فيها أي ألماني.


    الكنيسة التي بنوها هي الوحيدة في القرية. أما متى بُنيت بالضبط فأمر غير محسوم: فتقرير عن ترميمها صدر
    عام 2017 يذكر أنها أُسّست عام 1862 واكتملت عام 1866، بينما تذكر مصادر أخرى عام 1906. وإلى أن يحسم
    سجل التراث المسألة، تعامل مع التاريخين بحذر.


    أما المؤكد فهو ما جرى لها لاحقاً. فقد مُنعت الصلوات فيها منذ الثلاثينيات، واستُخدم المبنى مستودعاً
    ونادياً ودار سينما قبل أن يُترك خالياً. انهار السقف في عدة مواضع، ونخر المطر والثلج الجص. وفي عام
    2016 أُدرجت الكنيسة معلماً من معالم التراث الثقافي؛ ثم رُمّم السقف بتمويل من وزارة الخارجية الألمانية،
    وحوفظ على المظهر الخارجي كما كان.


    تأمّل سقف البرج الهرمي وصليبه، وفتحات الأجراس المقوّسة المزدوجة تعلوها نافذة مستديرة صغيرة، والصحن
    الطويل من الحجر المنحوت البني المحمرّ. اقتيد الألمان بعيداً عام 1941. أما كنيستهم فبقيت، وعاشت أطول
    من ثلاثة من أسماء القرية الأربعة.
  tip: >-
    تقع الكنيسة في وسط القرية، على بعد خطوات من الطريق. تعذّر التحقق من مواعيد فتح منتظمة، فقد تجدها مغلقة،
    لكن البناء الحجري من الخارج هو المقصود أصلاً؛ وإن أردت رؤية الداخل فاسأل الأهالي بلطف. لا رسوم دخول.
    على ارتفاع 1550 متراً تلسع الريح حتى في الصيف، والثلج في الشتاء أمر معتاد. لا وقود ولا متاجر في القرية،
    فتوقّف في تسالكا. تكفي نصف ساعة؛ وبشتاشيني وأخدود داشباشي قريبان، وتتواصل حكاية ألمان القوقاز في أسوريتي
    وبولنيسي.
  route: >-
    من تبليسي اصعد عبر تسكنيتي، واسلك Sh36 إلى مانغليسي ثم Sh31 عبر الهضبة حتى تسالكا. ومن تسالكا اتبع
    Sh33 (طريق مارنيولي–تيتريتسكارو–تسالكا) جنوباً نحو 7 كم حتى ترياليتي. المسافة الإجمالية نحو 98 كم
    وساعة و45 دقيقة على الأسفلت طوال الطريق. في الصيف تكفي سيارة اقتصادية؛ أما في الأشهر الباردة فركّب
    إطارات شتوية، لأن مقطع مانغليسي–تسالكا يتجمّد. املأ الخزان في تسالكا، إذ لا محطة وقود في ترياليتي.
