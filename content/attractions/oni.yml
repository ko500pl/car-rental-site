ka:
  name: ონი
  short: >-
    ზემო რაჭის მთავარი დაბა რიონის ხეობაში, რვაას ოცდაათ მეტრზე — 1991 წლის მიწისძვრით დაზიანებული და
    ნახევრად აღდგენილი.
  body: >-
    **ონი რაჭის მეორე ქალაქია და ზემო რაჭის ბოლო ნამდვილი დასახლება.** ის რიონის ხეობაში, დაახლოებით რვაას ოცდაათ მეტრზე დგას; აქედან ზემოთ მხოლოდ სოფლებია და გზა თანდათან უარესდება. ორნახევარი ათასამდე მოსახლეობით ონი პატარაა, მაგრამ სკოლა, საავადმყოფო, ბაზარი, მუზეუმი და რამდენიმე სასტუმრო აქვს.


    ქალაქის ისტორია მრავალფენიანია. ონი შუა საუკუნეებში რაჭის საერისთავოს ერთ-ერთი ცენტრი იყო, XIX საუკუნეში კი მას განსაკუთრებული სახე მისცა ებრაულმა თემმა: ონის ებრაელები საქართველოს უძველეს თემებს შორის ითვლებოდნენ და ქალაქის ვაჭრობის დიდი ნაწილი მათ ხელში იყო. 1895 წლის სინაგოგა დღემდე ქალაქის მთავარი შენობაა.


    1991 წლის 29 აპრილს რაჭა ძლიერმა მიწისძვრამ შეარყია — საქართველოს ისტორიაში ერთ-ერთი ყველაზე მძიმე. ონში სახლების დიდი ნაწილი დაინგრა ან გამოუსადეგარი გახდა, მოსახლეობა შემცირდა და ბევრი აღარ დაბრუნდა. ეს დღემდე ჩანს: აღდგენილი ფასადების გვერდით ცარიელი ნანგრევებია, ხოლო ზოგიერთი ქუჩა ნახევრად დაუსახლებელი.


    მიუხედავად ამისა, ონს კარგი განწყობა აქვს. ხის აივნებიანი ძველი სახლები, რიონზე ჩამოკიდებული ხიდი, საბჭოთა ხანის ცენტრალური მოედანი და ირგვლივ ტყიანი ფერდობები — ეს არ არის ტურისტული ქალაქი და სწორედ ამიტომ ღირს აქ ნახევარი დღის გატარება. მხარეთმცოდნეობის მუზეუმი პატარაა, მაგრამ რაჭის არქეოლოგიას და ებრაული თემის ისტორიას აჩვენებს.


    ონი შოვის, უწერის, ღების და ჭანჭახის ხეობის ბაზაა. ივნისიდან სექტემბრამდე ქალაქი გაცოცხლდება; ზამთარში ის ცივი და ჩუმია, გზა კი შეიძლება რამდენიმე დღით დაიხუროს.
  tip: >-
    ორი საათი ქალაქისთვის საკმარისია — სინაგოგა, მუზეუმი და ძველი ქუჩები. ეს ზემო რაჭაში ბოლო ადგილია, სადაც ბანკომატი, აფთიაქი და გამართული ავტოგასამართია: ღებამდე და შოვამდე აღარაფერს იპოვი, ამიტომ ბაქი აქ აავსე და ნაღდი ფული აქვე აიღე. საკვები მარტივია, ორიოდე კაფე მოედანთანაა. ივლის-აგვისტოში ღამის გასათევი წინასწარ დაჯავშნე. ზამთარში წინასწარ გადაამოწმე, გზა ღიაა თუ არა.
  route: >-
    ამბროლაურიდან აღმოსავლეთით რიონის ხეობით — ორმოცდაორიოდე კილომეტრი, ორმოცდახუთი წუთი. თბილისიდან სულ 355 კმ ქუთაისისა და ნაქერალას გავლით, დაახლოებით ექვსი საათი. გზა ძირითადად ასფალტია, თუმცა ბოლო ოცი კილომეტრი ადგილ-ადგილ დაზიანებულია და ორმოებიანი, ხოლო წვიმის შემდეგ ფერდობებიდან ქვა ჩამოდის. ხეობა ვიწროა და მოსახვევები დახურული — ღამით ფრთხილად. საწვავი ამბროლაურში აიღე. ეკონომ-კლასის მანქანა ონამდე საკმარისია, ზემოთ — არა.
en:
  name: Oni
  short: >-
    The main town of Upper Racha, on the Rioni at 830 metres — damaged by the 1991 earthquake and only
    half rebuilt.
  body: >-
    **Oni is Racha's second town and the last real settlement in the upper valley.** It sits on the Rioni at about 830 metres; above it there are only villages, and the road steadily worsens. With around two and a half thousand residents Oni is small, but it has a school, a hospital, a market, a museum and several guesthouses.


    Its history has layers. Oni was one of the centres of the medieval dukedom of Racha, and in the 19th century it was given its particular character by its Jewish community — one of the oldest in Georgia, and for a long time the town's main commercial class. The synagogue of 1895 remains the largest building in Oni.


    On 29 April 1991 a severe earthquake struck Racha, one of the worst in Georgian history. In Oni a great many houses collapsed or were condemned, the population fell, and many of those who left never came back. You can still read this in the streets: restored facades stand next to empty shells, and whole blocks are only half inhabited.


    Even so, the town has an agreeable atmosphere. Old houses with wooden balconies, a suspension footbridge over the Rioni, a Soviet-era central square and wooded slopes on every side. This is not a tourist town, and that is exactly the reason to give it half a day. The museum of local lore is small but covers the archaeology of Racha and the history of the Jewish community.


    Oni is the practical base for Shovi, Utsera, Ghebi and the Chanchakhi valley. From June to September it comes alive; in winter it is cold and very quiet, and the road up from Ambrolauri can close for days at a time.
  tip: >-
    Two hours covers the town — synagogue, museum and the old streets. This is the last place in Upper Racha with an ATM, a pharmacy and a working filling station: there is nothing at all beyond towards Shovi and Ghebi, so fill the tank and draw cash here. Food is simple, with a couple of cafes near the square. Book accommodation ahead in July and August. In winter check before setting out whether the road is open.
  route: >-
    From Ambrolauri head east up the Rioni valley — about 42 km, forty-five minutes. From Tbilisi the total is 355 km via Kutaisi and the Nakerala pass, roughly six hours. The road is mostly asphalt, but the last twenty kilometres are patchy and potholed in places, and after rain stones come down off the slopes. The valley is narrow with blind bends, so take care after dark. Fuel at Ambrolauri. An economy car is fine as far as Oni, but not beyond it.
ru:
  name: Они
  short: >-
    Главный городок Верхней Рачи на Риони, на высоте 830 метров — разрушенный землетрясением 1991 года
    и отстроенный лишь наполовину.
  body: >-
    **Они — второй город Рачи и последнее настоящее поселение в верхней долине.** Он стоит на Риони примерно на 830 метрах; выше только сёла, и дорога постепенно портится. Живёт здесь около двух с половиной тысяч человек, но есть школа, больница, рынок, музей и несколько гостевых домов.


    История у города многослойная. Они был одним из центров средневекового Рачинского эриставства, а в XIX веке его облик определила еврейская община — одна из старейших в Грузии и долгое время основной торговый слой города. Синагога 1895 года и сегодня остаётся самым крупным зданием Они.


    29 апреля 1991 года Рачу тряхнуло сильнейшее землетрясение, одно из самых тяжёлых в истории Грузии. В Они рухнула или была признана негодной значительная часть домов, население сократилось, и многие уехавшие не вернулись. Это до сих пор читается на улицах: отреставрированные фасады стоят рядом с пустыми коробками, а целые кварталы заселены лишь наполовину.


    И всё же в городе приятно. Старые дома с деревянными балконами, подвесной мостик через Риони, советская центральная площадь и лесистые склоны со всех сторон. Это не туристический город, и именно поэтому на него стоит потратить полдня. Краеведческий музей невелик, но показывает археологию Рачи и историю еврейской общины.


    Они — практическая база для Шови, Уцеры, Геби и ущелья Чанчахи. С июня по сентябрь город оживает; зимой он холодный и тихий, а дорога из Амбролаури может закрываться на несколько дней.
  tip: >-
    Двух часов на город хватит — синагога, музей и старые улицы. Это последнее место в Верхней Раче с банкоматом, аптекой и работающей заправкой: дальше, в сторону Шови и Геби, нет ничего, так что заправьтесь и снимите наличные здесь. Еда простая, пара кафе у площади. В июле и августе жильё бронируйте заранее. Зимой перед выездом уточняйте, открыта ли дорога.
  route: >-
    Из Амбролаури на восток вверх по долине Риони — около 42 км, сорок пять минут. От Тбилиси всего 355 км через Кутаиси и перевал Накерала, примерно шесть часов. Дорога в основном асфальтовая, но последние двадцать километров местами разбиты и в ямах, а после дождя со склонов сходят камни. Ущелье узкое, повороты закрытые, в темноте осторожнее. Заправка в Амбролаури. Машины эконом-класса достаточно до Они, но не выше.
fa:
  name: اونی
  short: >-
    شهر اصلی راچای بالا بر رود ریونی در ارتفاع ۸۳۰ متری — آسیب‌دیده از زمین‌لرزهٔ ۱۹۹۱ و تنها نیمه‌بازسازی‌شده.
  body: >-
    **اونی دومین شهر راچا و آخرین سکونتگاه واقعی در درّهٔ بالادست است.** بر رود ریونی در حدود ۸۳۰ متری نشسته؛ بالاتر از آن جز روستا چیزی نیست و جاده رفته‌رفته بدتر می‌شود. با حدود دو هزار و پانصد ساکن، اونی کوچک است اما مدرسه، بیمارستان، بازار، موزه و چند خانهٔ مهمان دارد.


    تاریخش لایه‌لایه است. اونی یکی از کانون‌های دوک‌نشین سده‌های میانهٔ راچا بود و در سدهٔ نوزدهم چهرهٔ خاص خود را از جامعهٔ یهودی گرفت؛ یکی از کهن‌ترین جوامع یهودی گرجستان که مدت‌ها طبقهٔ بازرگان شهر بود. کنیسهٔ ۱۸۹۵ هنوز بزرگ‌ترین ساختمان اونی است.


    در ۲۹ آوریل ۱۹۹۱ زمین‌لرزه‌ای سخت راچا را تکان داد، از سنگین‌ترین زمین‌لرزه‌های تاریخ گرجستان. در اونی شمار زیادی خانه فرو ریخت یا غیرقابل سکونت اعلام شد، جمعیت کاهش یافت و بسیاری از کسانی که رفتند هرگز بازنگشتند. این را هنوز می‌توان در خیابان‌ها خواند: نماهای مرمت‌شده کنار پوسته‌های خالی ایستاده‌اند و محله‌هایی تمام‌وکمال نیمه‌خالی مانده‌اند.


    با این همه شهر حال‌وهوای دلپذیری دارد. خانه‌های قدیمی با ایوان چوبی، پل معلق پیاده بر ریونی، میدان مرکزی از دورهٔ شوروی و دامنه‌های جنگلی در هر سو. اینجا شهر گردشگری نیست و درست به همین دلیل نیم روز وقت گذاشتن برایش می‌ارزد. موزهٔ محلی کوچک است اما باستان‌شناسی راچا و تاریخ جامعهٔ یهودی را نشان می‌دهد.


    اونی پایگاه عملی شووی، اوتسرا، غبی و درّهٔ چانچاخی است. از خرداد تا شهریور جان می‌گیرد؛ در زمستان سرد و بسیار ساکت است و جادهٔ آمبرولائوری ممکن است چند روز بسته بماند.
  tip: >-
    دو ساعت برای شهر کافی است: کنیسه، موزه و کوچه‌های قدیمی. این آخرین جای راچای بالاست که خودپرداز، داروخانه و پمپ بنزین فعال دارد؛ آن‌سوتر به سمت شووی و غبی هیچ چیز نیست، پس باک را پر و پول نقد را همین‌جا تهیه کنید. غذا ساده است و دو کافه نزدیک میدان هست. در تیر و مرداد اقامتگاه را از پیش رزرو کنید. در زمستان پیش از حرکت بپرسید که جاده باز است یا نه.
  route: >-
    از آمبرولائوری به سمت شرق در درّهٔ ریونی بالا بروید — حدود ۴۲ کیلومتر، چهل و پنج دقیقه. از تفلیس در مجموع ۳۵۵ کیلومتر از راه کوتائیسی و گردنهٔ ناکرالا، تقریباً شش ساعت. جاده بیشتر آسفالت است، اما بیست کیلومتر آخر جابه‌جا کنده و چاله‌دار است و پس از باران از دامنه‌ها سنگ می‌ریزد. درّه باریک و پیچ‌ها کور است، پس شب با احتیاط برانید. سوخت در آمبرولائوری. خودروی اقتصادی تا اونی کافی است، بالاتر نه.
he:
  name: אוני
  short: >-
    העיירה המרכזית של ראצ'ה העליונה על נהר הריוני בגובה 830 מטר — שנפגעה ברעידת האדמה של 1991 ושוקמה
    רק בחלקה.
  body: >-
    **אוני היא העיירה השנייה של ראצ'ה והיישוב האמיתי האחרון בעמק העליון.** היא יושבת על הריוני בגובה כ-830 מטר; מעליה יש רק כפרים, והכביש הולך ומתדרדר. עם כאלפיים וחמש מאות תושבים אוני קטנה, אבל יש בה בית ספר, בית חולים, שוק, מוזיאון וכמה בתי הארחה.


    להיסטוריה שלה יש שכבות. אוני הייתה אחד ממרכזי הדוכסות של ראצ'ה בימי הביניים, ובמאה ה-19 עיצבה את אופייה הקהילה היהודית — מן העתיקות בגאורגיה, ובמשך זמן רב מעמד הסוחרים העיקרי של העיירה. בית הכנסת משנת 1895 הוא עד היום המבנה הגדול ביותר באוני.


    ב-29 באפריל 1991 הכתה בראצ'ה רעידת אדמה חזקה, מן הקשות בתולדות גאורגיה. באוני קרסו או נפסלו למגורים בתים רבים, האוכלוסייה הצטמצמה, ורבים מאלה שעזבו לא חזרו. את זה עדיין קוראים ברחובות: חזיתות משופצות עומדות לצד שלדים ריקים, ורחובות שלמים מיושבים רק למחצה.


    ובכל זאת יש לעיירה אווירה נעימה. בתים ישנים עם מרפסות עץ, גשר תלוי להולכי רגל מעל הריוני, כיכר מרכזית סובייטית ומדרונות מיוערים מכל עבר. זו אינה עיירת תיירים, ובדיוק משום כך שווה להקדיש לה חצי יום. המוזיאון האזורי קטן אך מציג את הארכיאולוגיה של ראצ'ה ואת קורות הקהילה היהודית.


    אוני היא הבסיס המעשי לשובי, אוצרה, גבי ולעמק צ'אנצ'אחי. מיוני עד ספטמבר היא מתעוררת; בחורף היא קרה ושקטה מאוד, והכביש מאמברולאורי עלול להיסגר לימים אחדים.
  tip: >-
    שעתיים מכסות את העיירה — בית הכנסת, המוזיאון והרחובות הישנים. זהו המקום האחרון בראצ'ה העליונה שיש בו כספומט, בית מרקחת ותחנת דלק פעילה: הלאה, לכיוון שובי וגבי, אין דבר, לכן מלאו כאן דלק ומשכו מזומן. האוכל פשוט, ויש שני בתי קפה ליד הכיכר. ביולי ובאוגוסט הזמינו לינה מראש. בחורף בררו לפני היציאה אם הכביש פתוח.
  route: >-
    מאמברולאורי מזרחה במעלה עמק הריוני — כ-42 ק״מ, ארבעים וחמש דקות. מטביליסי הסך הכול 355 ק״מ דרך קותאיסי ומעבר נקראלה, כשש שעות. הכביש סלול ברובו, אך עשרים הקילומטרים האחרונים מטולאים ומלאי בורות במקומות, ואחרי גשם נופלות אבנים מן המדרונות. העמק צר והעיקולים אטומים, לכן היזהרו אחרי רדת החשכה. דלק באמברולאורי. רכב חסכוני מספיק עד אוני, אך לא מעבר לה.
ar:
  name: أوني
  short: >-
    بلدة راتشا العليا الرئيسية على نهر ريوني عند 830 متراً — تضرّرت في زلزال 1991 ولم يُعَد بناؤها إلا نصفاً.
  body: >-
    **أوني ثاني بلدات راتشا وآخر مستوطنة حقيقية في أعلى الوادي.** تجلس على نهر ريوني عند نحو 830 متراً؛ وفوقها قرى فحسب، والطريق يزداد سوءاً باطراد. وبنحو ألفين وخمسمائة ساكن تبقى أوني صغيرة، لكن فيها مدرسة ومستشفى وسوق ومتحف وعدة بيوت ضيافة.


    ولتاريخها طبقات. كانت أوني أحد مراكز دوقية راتشا في العصور الوسطى، وفي القرن التاسع عشر منحتها الجالية اليهودية طابعها الخاص؛ وهي من أقدم الجاليات اليهودية في جورجيا وكانت زمناً طويلاً طبقة التجار الأساسية في البلدة. وما زال كنيس عام 1895 أكبر مبانيها.


    في التاسع والعشرين من نيسان 1991 ضرب راتشا زلزال عنيف، من أشد ما عرفته جورجيا. انهار في أوني عدد كبير من البيوت أو حُكم بعدم صلاحيتها، وتراجع عدد السكان، ولم يعد كثير ممن رحلوا. وما زال ذلك يُقرأ في الشوارع: واجهات مرمّمة إلى جوار هياكل خاوية، وأحياء كاملة مأهولة إلى النصف فقط.


    ومع ذلك للبلدة مزاج طيب. بيوت قديمة بشرفات خشبية، وجسر مشاة معلّق فوق ريوني، وساحة مركزية من العهد السوفييتي، ومنحدرات مشجّرة في كل جهة. ليست بلدة سياحية، ولهذا بالضبط يستحق أن تُمنح نصف يوم. والمتحف المحلي صغير لكنه يعرض آثار راتشا وتاريخ الجالية اليهودية.


    أوني هي القاعدة العملية لشوفي وأوتسيرا وغيبي ووادي تشانتشاخي. من حزيران إلى أيلول تدبّ فيها الحياة؛ وفي الشتاء تكون باردة هادئة جداً، وقد يُغلق الطريق الصاعد من أمبرولاوري أياماً.
  tip: >-
    ساعتان تغطيان البلدة: الكنيس والمتحف والشوارع القديمة. هذا آخر موضع في راتشا العليا فيه صراف آلي وصيدلية ومحطة وقود عاملة؛ فما بعده نحو شوفي وغيبي خالٍ تماماً، فاملأ الخزان واسحب النقود هنا. الطعام بسيط، ومقهيان قرب الساحة. في تموز وآب احجز المبيت مسبقاً. وفي الشتاء تحقق قبل الانطلاق إن كان الطريق مفتوحاً.
  route: >-
    من أمبرولاوري شرقاً صعوداً في وادي ريوني — نحو 42 كم، خمس وأربعون دقيقة. ومن تبليسي المجموع 355 كم عبر كوتايسي وممر ناكيرالا، أي نحو ست ساعات. الطريق معبّد في معظمه، لكن العشرين كيلومتراً الأخيرة مرقّعة ومليئة بالحفر في مواضع، وبعد المطر تتساقط الحجارة من المنحدرات. الوادي ضيق والمنعطفات عمياء، فانتبه بعد حلول الظلام. الوقود في أمبرولاوري. وسيارة اقتصادية تكفي حتى أوني، لا أبعد منها.
