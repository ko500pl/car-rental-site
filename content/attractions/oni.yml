ka:
  name: ონი
  short: >-
    რაჭის ერისთავთა ძველი სატახტო რიონზე: თაფლისფერი ქვის სინაგოგა, 14 000 ნივთის მუზეუმი და მაღალ ხეობებამდე
    უკანასკნელი ბანკომატი.
  body: >-
    **ონი დღეს ზემო რაჭის კარიბჭეა, საუკუნეების განმავლობაში კი თავად იყო სატახტო ქალაქი.**


    რიონის მარცხენა ნაპირზე, ზღვის დონიდან 830 მეტრზე გაშენებულ ამ ქალაქში რაჭის ერისთავები ისხდნენ: ჯერ
    კახაბერისძეები, შემდეგ ჭარელიძეები, ბოლოს კი ჩხეტიძეები, რომლებიც აქ 1465 წლიდან 1769 წლამდე ბატონობდნენ
    და ხეობას იმერეთის მეფეებს ეცილებოდნენ. გადმოცემა ონის დაარსებას ძვ. წ. II საუკუნის ქართლის მეფე ფარნაჯომს
    მიაწერს, წერილობით წყაროებში კი ქალაქი მხოლოდ XV საუკუნიდან ჩნდება. 1810 წელს ონი რუსეთის იმპერიამ
    შეიერთა, 1846 წელს კი რაჭის მაზრის ცენტრად აქცია.


    ონი ებრაელთა ქალაქიც იყო: აქ ცხოვრობდა საქართველოში სიდიდით მესამე ებრაული თემი, თბილისისა და ქუთაისის
    შემდეგ. მათი 1895 წლის სინაგოგა დღესაც ბააზოვის ქუჩაზე დგას — თაფლისფერი ქვით ნაგები, ღარებიანი გუმბათით
    დაგვირგვინებული. ამ თემს ეკუთვნოდნენ ბააზოვები: რაბი დავით ბააზოვი, ქართული სიონიზმის ერთ-ერთი მეთაური,
    და მისი ვაჟი, მწერალი გერცელ ბააზოვი, რომელიც 1938 წელს დახვრიტეს.


    1991 წლის 29 აპრილს, 13 საათსა და 13 წუთზე, მიწა შეირყა. რაჭის 7,0 მაგნიტუდის მიწისძვრამ, ყველაზე
    ძლიერმა, რაც კი კავკასიაში დაფიქსირებულა, 270 ადამიანი იმსხვერპლა; მსხვერპლი მეტი იქნებოდა, სოფლელთა
    უმეტესობა იმ საათს მინდვრად რომ არ ყოფილიყო. ონი ამის შემდეგ ბოლომდე აღარ გაივსო: დღეს აქ ორნახევარი
    ათასამდე ადამიანი ცხოვრობს, აღდგენილი ფასადების გვერდით კი დაცარიელებული კედლები დგას.


    ქალაქს აუჩქარებლად ორი საათი დაუთმეთ. დაიწყეთ მუზეუმით, სადაც რაჭის წარსულის 14 000-მდე ნივთია თავმოყრილი
    — არქეოლოგიიდან და ნუმიზმატიკიდან ეთნოგრაფიასა და ხელნაწერებამდე; მერე სინაგოგამდე გაისეირნეთ და მდინარისკენ
    ჩადით, სადაც რიონი ფართო, ხრეშიან კალაპოტში რამდენიმე ტოტად იშლება. ონის იქით ხეობა ვიწროვდება და
    ქალაქები თავდება. აქ ზემო რაჭა ფულს ითვლის, ავზს ავსებს და მთებს ახედავს.
  tip: >-
    მუზეუმს, სინაგოგასა და ძველ ქუჩებში აუჩქარებელ სეირნობას ორი საათი ეყოფა; მუზეუმის სამუშაო საათები
    წინასწარ დააზუსტეთ. ონი ხეობის ზემოთ ბოლო ადგილია, სადაც ბანკომატი და აფთიაქი დაგხვდებათ. ავტოგასამართიც
    არის, მაგრამ ავზი მაინც ამბროლაურში შეავსეთ, ნაღდი ფული კი აქ აიღეთ: უწერის, გლოლისა და ღების მიმართულებით
    მსგავსს ვეღარაფერს იპოვით. კვება უბრალოა, ცენტრში რამდენიმე კაფეა. ივლისსა და აგვისტოში ღამის გასათევი
    წინასწარ დაჯავშნეთ. ზამთარში ქალაქი ცივი და მდუმარეა, ამიტომ გზის მდგომარეობა გამგზავრებამდე გადაამოწმეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 190 კილომეტრი იარეთ; ზესტაფონსა და ქუთაისს
    შორის ჩრდილოეთით, შ19 გზაზე გადაუხვიეთ და თერჯოლის გავლით ტყიბულამდე ადით. იქიდან შ17 ნაქერალას უღელტეხილს
    გადადის და ამბროლაურში ეშვება (სულ დაახლოებით 265 კმ). ბოლო 30 კილომეტრი შ16 გზით რიონის ხეობას მიუყვება:
    ასფალტია, მაგრამ ვიწრო, ბრმა მოსახვევებით, წვიმის შემდეგ კი სავალ ნაწილზე ქვა ცვივა. სულ დაახლოებით
    295 კმ, გაუჩერებლად ხუთიოდე საათი; ეკონომ-კლასის მანქანა სავსებით საკმარისია. ნავიგატორმა შეიძლება
    უფრო მოკლე გზა შემოგთავაზოთ რაჭის ქედზე, საჩხერისა და შქმერის გავლით (შ209). ეს მთის გადასასვლელია,
    ამიტომ ჯერ დარწმუნდით, რომ ღიაა.
en:
  name: Oni
  short: >-
    Racha's old ducal seat on the Rioni: a honey-stone synagogue, a museum of 14,000 objects and the last
    cash machine before the high valleys.
  body: >-
    **Oni is the gateway to Upper Racha today, but for centuries it was a capital in its own right.**


    The dukes of Racha ruled from this town at 830 metres on the left bank of the Rioni: first the Kakhaberisdze,
    then the Charelidze, and finally the Chkhetidze, who held it from 1465 to 1769 while the kings of
    Imereti contested the valley with them. Tradition credits the founding to Pharnajom, a king of Iberia
    in the 2nd century BC; the written record begins only in the 15th century. Russia absorbed Oni in
    1810 and in 1846 made it the centre of the Racha district.


    Oni was a Jewish town too, home to Georgia's third-largest Jewish community after Tbilisi and Kutaisi.
    Their synagogue of 1895 still stands on Baazov Street, honey-coloured stone under a ribbed dome. The
    Baazovs came from this community: Rabbi David Baazov, a leading figure of Georgian Zionism, and his
    son Gerzel, a writer executed in 1938.


    At 13:13 on 29 April 1991 the ground moved. The Racha earthquake, magnitude 7.0 and the strongest
    ever recorded in the Caucasus, killed 270 people; the toll would have been higher had most villagers
    not been out in the fields. Oni never quite filled up again: about 2,500 people live here now, and
    restored façades stand beside emptied walls.


    Give the town two unhurried hours. Start at the museum, which holds some 14,000 objects from Racha's
    past, from archaeology and coins to ethnography and manuscripts; then walk to the synagogue and down
    to the river, where the Rioni splits into several channels across a wide bed of grey shingle. Beyond
    Oni the valley narrows and the towns run out. This is where Upper Racha counts its cash, fills its
    tank and looks up at the mountains.
  tip: >-
    Two hours covers the museum, the synagogue and a slow loop of the old streets; check the museum's
    opening hours before you go. Oni is the last place up the valley with an ATM and a pharmacy. It has
    a filling station too, but fill up in Ambrolauri anyway and take out cash here: towards Utsera, Glola
    and Ghebi you will find nothing of the kind. Food is simple, with a few cafés in the centre. In July
    and August book a bed ahead. In winter the town is cold and very quiet, so check the road before you
    set out.
  route: >-
    From Tbilisi take the S1 (E60) west for about 190 km; between Zestaponi and Kutaisi turn north on
    the Sh19 and climb through Terjola to Tkibuli. From there the Sh17 crosses the Nakerala pass and drops
    to Ambrolauri (about 265 km in all). The last 30 km follow the Sh16 up the Rioni valley: asphalt,
    but narrow, with blind bends and stones on the road after rain. Total about 295 km, some five hours
    without stops; an economy car is fine. Navigation apps may offer a shorter road over the Racha range
    via Sachkhere and Shkmeri (Sh209). It is a mountain crossing, so check it is open before you commit
    to it.
ru:
  name: Они
  short: >-
    Старая столица рачинских эриставов на Риони: синагога из медового камня, музей на 14 000 предметов
    и последний банкомат перед высокогорными долинами.
  body: >-
    **Сегодня Они — ворота в Верхнюю Рачу, но веками он сам был столицей.**


    Эриставы Рачи правили из этого городка на высоте 830 метров на левом берегу Риони: сперва Кахаберисдзе,
    затем Чарелидзе и, наконец, Чхетидзе, державшие его с 1465 по 1769 год, пока имеретинские цари оспаривали
    у них долину. Предание приписывает основание города Фарнаджому, царю Иберии во II веке до н. э.; письменные
    же упоминания начинаются лишь в XV веке. Россия присоединила Они в 1810 году, а в 1846-м сделала его
    центром Рачинского уезда.


    Они был и еврейским городом: здесь жила третья по величине еврейская община Грузии после тбилисской
    и кутаисской. Её синагога 1895 года по-прежнему стоит на улице Баазова — медового цвета камень под
    ребристым куполом. Из этой общины вышли Баазовы: раввин Давид Баазов, одна из ведущих фигур грузинского
    сионизма, и его сын Герцель, писатель, расстрелянный в 1938 году.


    В 13:13 29 апреля 1991 года земля дрогнула. Рачинское землетрясение магнитудой 7,0, сильнейшее из
    когда-либо зарегистрированных на Кавказе, унесло 270 жизней; жертв было бы больше, если бы большинство
    сельчан не работали в тот час в поле. Они так и не заполнился снова: сейчас здесь живёт около 2500
    человек, и отреставрированные фасады соседствуют с опустевшими стенами.


    Подарите городу два неспешных часа. Начните с музея, где хранится около 14 000 предметов из прошлого
    Рачи — от археологии и монет до этнографии и рукописей; потом дойдите до синагоги и спуститесь к реке,
    где Риони растекается несколькими рукавами по широкому ложу из серой гальки. За Они долина сужается,
    а городов больше не будет. Здесь Верхняя Рача пересчитывает наличные, заправляет бак и поднимает глаза
    к горам.
  tip: >-
    Двух часов хватит на музей, синагогу и неторопливую прогулку по старым улицам; часы работы музея уточните
    заранее. Они — последнее место вверх по долине, где есть банкомат и аптека. Заправка здесь тоже есть,
    но бак всё равно лучше наполнить в Амбролаури, а наличные снять здесь: в сторону Уцеры, Глолы и Геби
    ничего подобного не найдёте. Еда простая, в центре несколько кафе. В июле и августе бронируйте ночлег
    заранее. Зимой в городе холодно и очень тихо, так что перед выездом проверьте состояние дороги.
  route: >-
    Из Тбилиси по S1 (E60) на запад около 190 км; между Зестафони и Кутаиси сверните на север на Sh19
    и поднимайтесь через Терджолу к Ткибули. Оттуда Sh17 идёт через перевал Накерала и спускается к Амбролаури
    (всего около 265 км). Последние 30 км идут по Sh16 вверх по долине Риони: асфальт, но узкий, со слепыми
    поворотами и камнями на дороге после дождя. Всего около 295 км, примерно пять часов без остановок;
    машины эконом-класса достаточно. Навигаторы могут предложить более короткую дорогу через Рачинский
    хребет — через Сачхере и Шкмери (Sh209). Это горный перевал, поэтому, прежде чем выбрать его, убедитесь,
    что он открыт.
fa:
  name: اونی
  short: >-
    پایتخت کهن دوک‌های راچا بر کرانهٔ ریونی: کنیسه‌ای از سنگ عسلی‌رنگ، موزه‌ای با ۱۴,۰۰۰ شیء و آخرین خودپرداز
    پیش از دره‌های مرتفع.
  body: >-
    **اونی امروز دروازهٔ راچای علیاست، اما قرن‌ها خود پایتختی بود.**


    دوک‌های راچا از این شهر، در ارتفاع ۸۳۰ متری و بر کرانهٔ چپ ریونی، فرمان می‌راندند: نخست خاندان کاخابریسدزه،
    سپس چارلیدزه و سرانجام چختیدزه که از ۱۴۶۵ تا ۱۷۶۹ آن را در دست داشتند، در حالی که پادشاهان ایمرتی
    بر سر دره با آنان کشمکش داشتند. روایت‌ها بنیاد شهر را به فرناجوم، پادشاه ایبریا در سدهٔ دوم پیش از
    میلاد، نسبت می‌دهند؛ اما اسناد مکتوب تنها از سدهٔ پانزدهم آغاز می‌شوند. روسیه در سال ۱۸۱۰ اونی را
    ضمیمهٔ خود کرد و در ۱۸۴۶ آن را مرکز بخش راچا قرار داد.


    اونی شهری یهودی نیز بود: سومین جامعهٔ بزرگ یهودیان گرجستان، پس از تفلیس و کوتائیسی، در اینجا می‌زیست.
    کنیسهٔ آنان که در سال ۱۸۹۵ ساخته شد، هنوز در خیابان باازوف ایستاده است: سنگی به رنگ عسل زیر گنبدی
    شیاردار. خاندان باازوف از همین جامعه برخاست: خاخام داوید باازوف، از چهره‌های برجستهٔ صهیونیسم در گرجستان،
    و پسرش گرتسل، نویسنده‌ای که در سال ۱۹۳۸ اعدام شد.


    در ساعت ۱۳:۱۳ روز ۲۹ آوریل ۱۹۹۱ زمین لرزید. زمین‌لرزهٔ راچا با بزرگی ۷٫۰، قوی‌ترین زمین‌لرزه‌ای که
    تا کنون در قفقاز ثبت شده، جان ۲۷۰ نفر را گرفت؛ اگر بیشتر روستاییان در آن ساعت در کشتزارها نبودند،
    شمار قربانیان بیشتر می‌شد. اونی هرگز به‌تمامی دوباره پر نشد: امروز حدود ۲۵۰۰ نفر اینجا زندگی می‌کنند
    و نماهای مرمت‌شده کنار دیوارهای متروک ایستاده‌اند.


    دو ساعت بی‌شتاب به شهر بدهید. از موزه آغاز کنید که حدود ۱۴,۰۰۰ شیء از گذشتهٔ راچا را نگه می‌دارد،
    از یافته‌های باستان‌شناسی و سکه‌ها تا اشیای مردم‌نگاری و نسخه‌های خطی؛ سپس تا کنیسه قدم بزنید و به
    سوی رود پایین بروید، جایی که ریونی بر بستری پهن از سنگ‌ریزه‌های خاکستری به چند شاخه تقسیم می‌شود.
    پس از اونی دره تنگ می‌شود و دیگر شهری در کار نیست. اینجاست که راچای علیا پول نقدش را می‌شمارد، باکش
    را پر می‌کند و سر به سوی کوه‌ها بلند می‌کند.
  tip: >-
    دو ساعت برای موزه، کنیسه و گشتی آرام در کوچه‌های قدیمی کافی است؛ پیش از رفتن ساعت کار موزه را بپرسید.
    اونی آخرین جایی در بالادست دره است که خودپرداز و داروخانه دارد. پمپ بنزین هم دارد، اما بهتر است باک
    را در آمبرولائوری پر کنید و پول نقد را اینجا بگیرید: به سوی اوتسرا، گلولا و غبی چنین چیزی نخواهید
    یافت. غذا ساده است و چند کافه در مرکز شهر هست. در ژوئیه و اوت جای خواب را از پیش رزرو کنید. در زمستان
    شهر سرد و بسیار ساکت است، پس پیش از حرکت وضعیت جاده را بررسی کنید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را حدود ۱۹۰ کیلومتر به سمت غرب بروید؛ میان زستافونی و کوتائیسی به جادهٔ Sh19
    به سمت شمال بپیچید و از راه ترجولا تا تکیبولی بالا بروید. از آنجا جادهٔ Sh17 از گردنهٔ ناکرالا می‌گذرد
    و به آمبرولائوری سرازیر می‌شود (روی‌هم حدود ۲۶۵ کیلومتر). ۳۰ کیلومتر پایانی، جادهٔ Sh16 در درهٔ ریونی
    بالا می‌رود: آسفالت، اما باریک، با پیچ‌های کور و سنگ‌هایی که پس از باران روی جاده می‌افتند. کل مسیر
    حدود ۲۹۵ کیلومتر است، نزدیک به پنج ساعت بدون توقف؛ خودروی اقتصادی کافی است. برنامه‌های مسیریابی ممکن
    است راهی کوتاه‌تر از روی رشته‌کوه راچا، از راه ساچخره و شکمری (Sh209)، پیشنهاد کنند. این گذرگاهی کوهستانی
    است، پس پیش از انتخابش مطمئن شوید که باز است.
he:
  name: אוני
  short: >-
    מושבם הישן של דוכסי ראצ'ה על גדת הריוני: בית כנסת מאבן בגוון דבש, מוזיאון ובו 14,000 פריטים והכספומט
    האחרון לפני העמקים הגבוהים.
  body: >-
    **היום אוני היא שער הכניסה לראצ'ה העילית, אבל במשך מאות שנים היא הייתה בירה בזכות עצמה.**


    דוכסי ראצ'ה שלטו מן העיירה הזאת, השוכנת בגובה 830 מטר על הגדה השמאלית של הריוני: תחילה בית קחבריסדזה,
    אחריהם בית צ'רלידזה ולבסוף בית צ'חטידזה, שהחזיקו בה מ-1465 עד 1769 בזמן שמלכי אימרתי נאבקו בהם על
    העמק. המסורת מייחסת את ייסודה לפרנג'ום, מלך איבריה במאה ה-2 לפני הספירה; התיעוד הכתוב מתחיל רק במאה
    ה-15. רוסיה סיפחה את אוני ב-1810, וב-1846 הפכה אותה למרכז מחוז ראצ'ה.


    אוני הייתה גם עיירה יהודית, ביתה של הקהילה היהודית השלישית בגודלה בגאורגיה, אחרי טביליסי וקוטאיסי.
    בית הכנסת שלה משנת 1895 עדיין עומד ברחוב באזוב: אבן בגוון דבש תחת כיפה מצולעת. מן הקהילה הזאת יצאה
    משפחת באזוב: הרב דוד באזוב, מראשי התנועה הציונית בגאורגיה, ובנו הרצל, סופר שהוצא להורג ב-1938.


    ב-13:13 ב-29 באפריל 1991 רעדה האדמה. רעידת האדמה של ראצ'ה, בעוצמה 7.0 — החזקה ביותר שנרשמה אי פעם
    בקווקז — הרגה 270 בני אדם; המספר היה גבוה יותר אילולא רוב תושבי הכפרים היו באותה שעה בשדות. אוני מעולם
    לא התמלאה שוב לגמרי: כ-2,500 איש חיים בה היום, וחזיתות משוחזרות עומדות לצד קירות שהתרוקנו.


    הקדישו לעיירה שעתיים בלי למהר. התחילו במוזיאון, השומר כ-14,000 פריטים מעברה של ראצ'ה, מארכאולוגיה
    ומטבעות ועד אתנוגרפיה וכתבי יד; אחר כך לכו לבית הכנסת ורדו אל הנהר, שם הריוני מתפצל לכמה ערוצים על
    פני אפיק רחב של חלוקי נחל אפורים. אחרי אוני העמק נעשה צר ואין עוד עיירות. כאן ראצ'ה העילית סופרת את
    המזומנים, ממלאת את מיכל הדלק ונושאת עיניה אל ההרים.
  tip: >-
    שעתיים מספיקות למוזיאון, לבית הכנסת ולסיבוב איטי בסמטאות הישנות; בדקו מראש את שעות הפתיחה של המוזיאון.
    אוני היא המקום האחרון במעלה העמק שיש בו כספומט ובית מרקחת. יש בה גם תחנת דלק, אבל בכל זאת מלאו את
    מיכל הדלק באמברולאורי ומשכו מזומן כאן: בדרך לאוצרה, לגלולה ולע'בי לא תמצאו דבר מכל אלה. האוכל פשוט,
    ויש כמה בתי קפה במרכז. ביולי ובאוגוסט הזמינו לינה מראש. בחורף העיירה קרה ושקטה מאוד, אז בדקו את מצב
    הכביש לפני היציאה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 ‏(E60) כ-190 ק"מ; בין זסטאפוני לקוטאיסי פנו צפונה לכביש Sh19 וטפסו דרך
    טרג'ולה עד טקיבולי. משם כביש Sh17 חוצה את מעבר נקראלה ויורד לאמברולאורי (כ-265 ק"מ בסך הכול). 30 הק"מ
    האחרונים עוברים בכביש Sh16 במעלה עמק הריוני: סלול, אבל צר, עם עיקולים עיוורים ואבנים על הכביש אחרי
    גשם. בסך הכול כ-295 ק"מ, כחמש שעות בלי עצירות; רכב מקטגוריית אקונומי מספיק. אפליקציות הניווט עשויות
    להציע דרך קצרה יותר מעל רכס ראצ'ה, דרך סצ'חרה ושקמרי (Sh209). זה מעבר הרים, אז ודאו שהוא פתוח לפני
    שאתם יוצאים לדרך.
ar:
  name: أوني
  short: >-
    مقرّ دوقات راتشا القديم على نهر ريوني: كنيس من حجر بلون العسل، ومتحف يضم 14,000 قطعة، وآخر صرّاف آلي
    قبل الأودية العالية.
  body: >-
    **أوني اليوم بوابة راتشا العليا، لكنها كانت لقرون عاصمةً قائمة بذاتها.**


    حكم دوقات راتشا من هذه البلدة الواقعة على ارتفاع 830 متراً على الضفة اليسرى لنهر ريوني: أولاً آل كاخابيريسدزه،
    ثم آل تشاريليدزه، وأخيراً آل تشخيتيدزه الذين أمسكوا بها من 1465 حتى 1769 فيما كان ملوك إيميريتي ينازعونهم
    الوادي. وتنسب الرواية المتوارثة تأسيسها إلى فارناجوم، ملك أيبيريا في القرن الثاني قبل الميلاد؛ أما
    السجل المكتوب فلا يبدأ إلا في القرن الخامس عشر. ضمّت روسيا أوني عام 1810، وفي عام 1846 جعلتها مركز
    قضاء راتشا.


    وكانت أوني بلدة يهودية أيضاً، موطن ثالث أكبر جالية يهودية في جورجيا بعد تبليسي وكوتايسي. ولا يزال
    كنيسها المبني عام 1895 قائماً في شارع باازوف: حجر بلون العسل تحت قبة مضلّعة. ومن هذه الجالية خرجت
    أسرة باازوف: الحاخام داود باازوف، أحد أبرز وجوه الحركة الصهيونية في جورجيا، وابنه غيرتسل، الكاتب الذي
    أُعدم عام 1938.


    في الساعة 13:13 من يوم 29 أبريل 1991 تحرّكت الأرض. فقد أودى زلزال راتشا، بقوة 7.0 درجات، وهو الأقوى
    الذي سُجّل في القوقاز على الإطلاق، بحياة 270 شخصاً؛ وكان عدد الضحايا سيزيد لولا أن معظم القرويين كانوا
    في الحقول. ولم تمتلئ أوني بسكانها من جديد تماماً: يعيش فيها اليوم نحو 2500 نسمة، وتقف الواجهات المرمَّمة
    بجوار جدران أفرغها الرحيل.


    امنح البلدة ساعتين بلا عجلة. ابدأ بالمتحف الذي يضم نحو 14,000 قطعة من ماضي راتشا، من اللقى الأثرية
    والعملات إلى المقتنيات الإثنوغرافية والمخطوطات؛ ثم امشِ إلى الكنيس وانزل إلى النهر، حيث يتفرع ريوني
    إلى عدة مجارٍ فوق قاع عريض من الحصى الرمادي. بعد أوني يضيق الوادي وتنتهي البلدات. هنا تعدّ راتشا العليا
    نقودها، وتملأ خزانها، وترفع بصرها إلى الجبال.
  tip: >-
    تكفي ساعتان للمتحف والكنيس وجولة متمهّلة في الشوارع القديمة؛ تحقّق من مواعيد عمل المتحف قبل الذهاب.
    أوني آخر مكان صعوداً في الوادي فيه صرّاف آلي وصيدلية. وفيها محطة وقود أيضاً، لكن املأ الخزان في أمبرولاوري
    على أي حال، واسحب النقود هنا: ففي اتجاه أوتسيرا وغلولا وغيبي لن تجد شيئاً من ذلك. الطعام بسيط، وفي
    الوسط بضعة مقاهٍ. احجز مكان المبيت مسبقاً في يوليو وأغسطس. وفي الشتاء تكون البلدة باردة وهادئة جداً،
    فتحقّق من حالة الطريق قبل الانطلاق.
  route: >-
    من تبليسي اسلك الطريق S1 ‏(E60) غرباً نحو 190 كم؛ وبين زيستافوني وكوتايسي انعطف شمالاً إلى الطريق
    Sh19 واصعد عبر تيرجولا إلى تكيبولي. ومن هناك يعبر الطريق Sh17 ممر ناكيرالا وينحدر إلى أمبرولاوري (نحو
    265 كم في المجموع). أما آخر 30 كم فعلى الطريق Sh16 صعوداً في وادي ريوني: معبّد لكنه ضيق، فيه منعطفات
    عمياء وحجارة على الطريق بعد المطر. المجموع نحو 295 كم، قرابة خمس ساعات دون توقف؛ وتكفي سيارة اقتصادية.
    قد تقترح تطبيقات الملاحة طريقاً أقصر فوق سلسلة جبال راتشا عبر ساتشخيري وشكميري (Sh209). إنه معبر جبلي،
    فتأكّد من أنه مفتوح قبل أن تسلكه.
