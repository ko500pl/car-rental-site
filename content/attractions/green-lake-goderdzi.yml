ka:
  name: მწვანე ტბა (გოდერძი)
  short: პატარა ალპური ტბა გოდერძის უღელტეხილთან, სოჭის ტყით შემოსაზღვრული და მხოლოდ ზაფხულში მისადგომი.
  body: >-
    **მწვანე ტბა ღრმა შთაბეჭდილების მომხდენი კი არა, მშვიდი ადგილია** — და მისი ღირებულებაც სწორედ ეს
    არის. ის გოდერძის უღელტეხილიდან რამდენიმე კილომეტრში, დაახლოებით ორი ათასი მეტრის სიმაღლეზეა, ტყისა
    და მდელოს საზღვარზე ჩამჯდარი.

    ტბა მცირეა — რამდენიმე ასეული მეტრი გარშემოწერილობით — და მისი ფერი ის არის, რაზეც სახელი მიუთითებს:
    სოჭისა და ნაძვის ტყე გარშემო წყალს ისე ირეკლავს, რომ დღის უმეტეს დროს ის მუქი მწვანე ჩანს. ღრმა არაა,
    ფსკერი ხილულია და მცენარეულობით დაფარული. თევზი აქ არ არის.

    რასაც აქ ნახავ:

    - **წყლის სარკე** უქარო დილას — შუადღისას ქარი ხშირად ადგება და არეკვლა ქრება

    - **ალპური ყვავილები** ივნისის ბოლოდან — გენციანა, ზამბახი, შქერი ფერდობებზე

    - **ძროხის ნახირი**, რომელიც ბეშუმის საძოვრებიდან ჩამოდის — ისინი ტბასთან წყალს სვამენ და ეს ნაწილია
    სურათის

    ტბასთან ინფრასტრუქტურა თითქმის არაა: არც ბუფეტი, არც ტუალეტი, არც ჩამოსასვლელი ხიდი. ერთი-ორი ხის
    სკამია და მეტი არაფერი. სწორედ ამიტომ ღირს — მაგრამ იმასაც ნიშნავს, რომ ყველაფერი, რაც გჭირდება, თან
    უნდა წაიღო და უკან წამოიღო.

    ტბასთან ბოლო რამდენიმე კილომეტრი ორღარიანი მიწის გზაა. მშრალ ამინდში ჯიპი ადვილად გადის, წვიმის შემდეგ
    კი თიხაში ჩაჯდომა რეალურია. ვინც არ არის დარწმუნებული, ჯობია მანქანა უღელტეხილთან დატოვოს და ორმოცდახუთი
    წუთი ფეხით იაროს.
  tip: >-
    ორი საათი — მისვლა, შემოვლა და დაბრუნება. სეზონი ივნისის შუიდან სექტემბრამდეა; მის გარეთ გზა თოვლშია.
    ინფრასტრუქტურა არაა: წყალი, საკვები, ნაგვის პარკი თან წაიღე. მწერი ზაფხულის შუადღეს ბევრია — რეპელენტი
    გამოგადგება. მთაში ამინდი ერთ საათში იცვლება; წვიმის ქურთუკი მაშინაც წაიღე, როცა ცა სუფთაა.
  route: >-
    თბილისიდან ხაშურზე, ახალციხესა და ადიგენზე გავლით გოდერძის უღელტეხილამდე, შემდეგ დასავლეთით რამდენიმე
    კილომეტრი და ჩრდილოეთით მიწის გზაზე — ჯამში 306 კმ, დაახლოებით შვიდი საათი. ბოლო ორმოცდაათი კილომეტრი
    ხრეშია, ბოლო ხუთი კი ორღარიანი მიწის კვალი. ჯიპი აუცილებელია. საწვავი ადიგენში აიღე. ალტერნატიული
    მისადგომი ბათუმიდან ხულოზეა, დაახლოებით 485 კმ.
en:
  name: Green Lake (Goderdzi)
  short: A small alpine lake near Goderdzi Pass, ringed by fir forest and reachable only in summer.
  body: >-
    **Green Lake is not a spectacular place, it is a quiet one** — and that is exactly its value. It lies
    a few kilometres from Goderdzi Pass at around two thousand metres, set on the line where forest meets
    open pasture.

    The lake is small, a few hundred metres around, and its colour is what the name says: the fir and
    spruce standing around it throw back into the water so completely that for most of the day it reads
    dark green. It is shallow, the bottom visible and weeded. There are no fish.

    What you find here:

    - **A mirror surface** on a still morning — the wind usually gets up by midday and the reflection
    goes

    - **Alpine flowers** from late June: gentian, iris, rhododendron on the slopes above

    - **Cattle** coming down from the Beshumi pastures — they water at the lake, and they are part of
    the picture rather than an intrusion

    There is almost no infrastructure at the lake: no kiosk, no toilet, no boardwalk. A couple of wooden
    benches and nothing else. That is why it is worth the trip, and it also means you carry in everything
    you need and carry out everything you brought.

    The last few kilometres are a two-rut earth track. In dry weather a four-wheel drive handles it easily;
    after rain, getting stuck in clay is a genuine possibility. If you are not confident, leave the car
    near the pass and walk the last forty-five minutes.
  tip: >-
    Two hours covers the drive in, a walk around and the return. The season runs from mid-June to September;
    outside it the track is under snow. There are no facilities at all, so bring water, food and a bag
    for your rubbish. Insects are heavy on summer afternoons — repellent helps. Mountain weather turns
    within the hour, so carry a rain jacket even when the sky is clear on departure.
  route: >-
    From Tbilisi drive via Khashuri, Akhaltsikhe and Adigeni to Goderdzi Pass, then a few kilometres west
    and north on an earth track — 306 km in total, about seven hours. The last fifty kilometres are gravel
    and the final five a pair of ruts. A four-wheel drive is necessary. Take fuel at Adigeni. The alternative
    approach is from Batumi through Khulo, roughly 485 km, which is longer but asphalt for most of the
    way.
ru:
  name: Зелёное озеро (Годердзи)
  short: Небольшое альпийское озеро у перевала Годердзи, окружённое пихтовым лесом и доступное только
    летом.
  body: >-
    **Зелёное озеро — не эффектное место, а тихое,** и в этом его ценность. Оно лежит в нескольких километрах
    от перевала Годердзи, примерно на двух тысячах метров, ровно на линии, где лес переходит в открытое
    пастбище.

    Озеро маленькое, несколько сотен метров по окружности, а цвет у него именно такой, как в названии:
    пихты и ели вокруг отражаются в воде настолько плотно, что большую часть дня она читается тёмно-зелёной.
    Оно мелкое, дно видно, всё в водорослях. Рыбы нет.

    Что здесь есть:

    - **Зеркальная гладь** тихим утром — к полудню обычно поднимается ветер, и отражение исчезает

    - **Альпийские цветы** с конца июня: горечавка, ирис, рододендрон на склонах выше

    - **Коровы**, спускающиеся с бешумских пастбищ, — они приходят на водопой, и это часть картины, а
    не помеха

    Инфраструктуры у озера почти нет: ни киоска, ни туалета, ни настила. Пара деревянных скамеек — и всё.
    Именно поэтому сюда стоит ехать, и именно поэтому всё нужное вы везёте с собой, а весь мусор увозите
    обратно.

    Последние несколько километров — грунтовая колея. В сухую погоду внедорожник проходит легко, после
    дождя вполне реально сесть в глине. Если не уверены, оставьте машину у перевала и пройдите последние
    сорок пять минут пешком.
  tip: >-
    Двух часов хватает на подъезд, обход и возвращение. Сезон с середины июня по сентябрь, вне его колея
    под снегом. Никакой инфраструктуры нет: везите воду, еду и пакет для мусора. Летними днями много насекомых
    — репеллент пригодится. Горная погода меняется за час, так что дождевик берите даже при ясном небе.
  route: >-
    Из Тбилиси через Хашури, Ахалцихе и Адигени до перевала Годердзи, затем несколько километров на запад
    и север по грунтовке — всего 306 км, около семи часов. Последние пятьдесят километров гравийные, последние
    пять — колея. Полный привод необходим. Заправляйтесь в Адигени. Альтернативный подъезд со стороны
    Батуми через Хуло, примерно 485 км: дольше, но почти весь путь по асфальту.
fa:
  name: دریاچهٔ سبز (گودردزی)
  short: دریاچه‌ای کوچک و کوهستانی نزدیک گردنهٔ گودردزی، در حلقهٔ جنگل نوئل و تنها در تابستان دست‌یافتنی.
  body: >-
    **دریاچهٔ سبز جای پرشکوهی نیست، جای آرامی است** — و ارزشش دقیقاً همین است. چند کیلومتر دورتر از گردنهٔ
    گودردزی و در حدود دو هزار متری قرار دارد، درست بر خطی که جنگل به چراگاه باز می‌رسد.

    دریاچه کوچک است، چند صد متر دور تا دورش، و رنگش همان است که نامش می‌گوید: نوئل و صنوبر پیرامونش چنان
    کامل در آب بازمی‌تابند که بیشتر روز سبز تیره خوانده می‌شود. کم‌عمق است، کف پیداست و پوشیده از علف
    آبی. ماهی ندارد.

    آنچه اینجا می‌یابید:

    - **سطحی آینه‌وار** در صبح بی‌باد — معمولاً تا ظهر باد برمی‌خیزد و بازتاب می‌رود

    - **گل‌های کوهستانی** از اواخر خرداد: جنطیانا، زنبق، خرزهره‌کوهی بر دامنه‌های بالا

    - **گله‌های گاو** که از چراگاه‌های بشومی پایین می‌آیند و کنار دریاچه آب می‌خورند؛ آن‌ها بخشی از تصویرند
    نه مزاحم آن

    کنار دریاچه تقریباً هیچ زیرساختی نیست: نه دکه، نه سرویس بهداشتی، نه سکوی چوبی. دو نیمکت چوبی و همین.
    به همین سبب ارزش رفتن دارد، و به همین سبب هرچه لازم دارید باید ببرید و هر زباله‌ای را بازگردانید.

    چند کیلومتر آخر مسیر خاکی دو شیاره است. در هوای خشک خودروی چهار چرخ محرک به‌راحتی می‌گذرد، و پس از
    باران گیرکردن در گِل واقعاً محتمل است. اگر مطمئن نیستید، خودرو را نزدیک گردنه بگذارید و چهل‌وپنج دقیقهٔ
    آخر را پیاده بروید.
  tip: >-
    دو ساعت برای رفت، دور زدن و بازگشت کافی است. فصل از نیمهٔ خرداد تا شهریور است و بیرون از آن مسیر زیر
    برف است. هیچ امکاناتی نیست؛ آب و خوراک و کیسهٔ زباله همراه ببرید. بعدازظهرهای تابستان حشره فراوان
    است و دورکنندهٔ حشرات کمک می‌کند. هوای کوهستان در یک ساعت عوض می‌شود، پس بارانی را حتی با آسمان صاف
    بردارید.
  route: >-
    از تفلیس از راه خاشوری، آخالتسیخه و آدیگنی تا گردنهٔ گودردزی، سپس چند کیلومتر به غرب و شمال روی مسیر
    خاکی — روی‌هم ۳۰۶ کیلومتر، حدود هفت ساعت. پنجاه کیلومتر آخر شنی و پنج کیلومتر پایانی دو شیار خاکی
    است. خودروی چهار چرخ محرک لازم است. سوخت را در آدیگنی بگیرید. راه جایگزین از باتومی و خولو است، نزدیک
    ۴۸۵ کیلومتر.
he:
  name: האגם הירוק (גודרדזי)
  short: אגם אלפיני קטן ליד מעבר גודרדזי, מוקף יער אשוחים ונגיש רק בקיץ.
  body: >-
    **האגם הירוק אינו מקום מרהיב אלא מקום שקט** — וזה בדיוק ערכו. הוא נמצא כמה קילומטרים ממעבר גודרדזי
    בגובה כאלפיים מטר, ממש על הקו שבו היער פוגש את המרעה הפתוח.

    האגם קטן, כמה מאות מטרים בהיקפו, וצבעו הוא בדיוק מה שהשם אומר: האשוחים והאשוחיות סביבו מוחזרים במים
    בשלמות כזאת שרוב שעות היום הוא נקרא ירוק כהה. הוא רדוד, הקרקעית נראית ומכוסה עשב מים. אין בו דגים.

    מה שתמצאו כאן:

    - **משטח מראה** בבוקר דומם — עד הצהריים הרוח בדרך כלל מתגברת וההשתקפות נעלמת

    - **פרחי אלפים** מסוף יוני: גנציאנה, אירוס ורודודנדרון במדרונות שמעל

    - **בקר** היורד ממרעות בשומי — הם באים לשתות, והם חלק מן התמונה ולא הפרעה לה

    כמעט אין תשתית באגם: אין דוכן, אין שירותים, אין שביל עץ. שני ספסלי עץ וזהו. משום כך שווה להגיע, ומשום
    כך גם צריך להביא איתכם כל מה שנחוץ ולהוציא בחזרה כל מה שהבאתם.

    הקילומטרים האחרונים הם דרך עפר בשני תלמים. במזג אוויר יבש רכב הנעה כפולה עובר בקלות; אחרי גשם, שקיעה
    בחימר היא אפשרות ממשית. אם אינכם בטוחים, השאירו את הרכב ליד המעבר ולכו את ארבעים וחמש הדקות האחרונות
    ברגל.
  tip: >-
    שעתיים מכסות את הנסיעה, הקפה של האגם והחזרה. העונה מאמצע יוני עד ספטמבר; מחוצה לה הדרך תחת שלג. אין
    שום מתקנים, אז הביאו מים, אוכל ושקית לאשפה. אחרי הצהריים בקיץ יש הרבה חרקים — דוחה חרקים עוזר. מזג
    אוויר הררי משתנה בתוך שעה, אז קחו מעיל גשם גם כשהשמים בהירים.
  route: >-
    מטביליסי דרך חשורי, אחלציחה ואדיגני עד מעבר גודרדזי, ואז כמה קילומטרים מערבה וצפונה בדרך עפר — 306
    ק״מ בסך הכול, כשבע שעות. חמישים הקילומטרים האחרונים בחצץ, וחמשת האחרונים תלמים. דרושה הנעה כפולה.
    תדלקו באדיגני. הגישה החלופית מבאטומי דרך חולו, כ-485 ק״מ.
ar:
  name: البحيرة الخضراء (غودردزي)
  short: بحيرة جبلية صغيرة قرب ممر غودردزي، تحيط بها غابة التنوب ولا يُوصل إليها إلا صيفاً.
  body: >-
    **البحيرة الخضراء ليست مكاناً مبهراً بل مكاناً هادئاً** — وهذه قيمتها بالضبط. تقع على بعد كيلومترات
    من ممر غودردزي عند نحو ألفي متر، على الخط الذي تلتقي فيه الغابة بالمرعى المفتوح.

    البحيرة صغيرة، بضع مئات من الأمتار محيطاً، ولونها ما يقوله اسمها: التنوب والشربين حولها ينعكسان في
    الماء انعكاساً تاماً حتى تُقرأ معظم النهار خضراء داكنة. وهي ضحلة، قاعها مرئي ومغطى بالأعشاب. ولا سمك
    فيها.

    ما تجده هنا:

    - **سطح كالمرآة** في صباح ساكن — وتهب الريح عادة عند الظهيرة فيزول الانعكاس

    - **زهور جبلية** من أواخر يونيو: الجنطيانا والسوسن والرودودندرون على المنحدرات فوقها

    - **قطعان البقر** النازلة من مراعي بيشومي؛ تشرب عند البحيرة، وهي جزء من الصورة لا اقتحام لها

    لا بنية تحتية عند البحيرة تقريباً: لا كشك ولا دورة مياه ولا ممر خشبي. مقعدان خشبيان وحسب. ولهذا تستحق
    الرحلة، ولهذا أيضاً تحمل معك كل ما تحتاجه وتعيد معك كل ما جلبته.

    آخر بضعة كيلومترات درب ترابي بمسارين. في الطقس الجاف يجتازه الدفع الرباعي بسهولة، وبعد المطر يصبح
    الغرز في الطين احتمالاً حقيقياً. وإن لم تكن واثقاً فاترك السيارة قرب الممر وامشِ الخمس والأربعين دقيقة
    الأخيرة.
  tip: >-
    ساعتان تكفيان للوصول والدوران حول البحيرة والعودة. الموسم من منتصف يونيو إلى سبتمبر، وخارجه يكون الدرب
    تحت الثلج. لا مرافق إطلاقاً، فاحمل الماء والطعام وكيساً لنفاياتك. الحشرات كثيرة بعد الظهر صيفاً وطارد
    الحشرات يفيد. وطقس الجبل يتبدل خلال ساعة، فخذ معطف مطر حتى لو كانت السماء صافية عند الانطلاق.
  route: >-
    من تبليسي عبر خاشوري وأخالتسيخه وأديغيني حتى ممر غودردزي، ثم بضعة كيلومترات غرباً وشمالاً على درب
    ترابي — 306 كم إجمالاً، نحو سبع ساعات. آخر خمسين كيلومتراً حصوية والخمسة الأخيرة مساران ترابيان. الدفع
    الرباعي ضروري. تزود بالوقود في أديغيني. والطريق البديل من باتومي عبر خولو، نحو 485 كم.
