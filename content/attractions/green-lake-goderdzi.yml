ka:
  name: მწვანე ტბა (გოდერძი)
  short: >-
    მწვანე ტბა გოდერძის უღელტეხილთან, 2058 მეტრზე: სულ ხუთი ჰექტარი ზედაპირი, ცხრამეტ მეტრზე მეტი სიღრმე
    და ცივი, გამჭვირვალე წყალი.
  body: >-
    **მწვანე ტბა სულ ხუთიოდე ჰექტარს იკავებს, მისი წყალი კი ცხრამეტ მეტრზე მეტ სიღრმეზე ეშვება.** ტბა
    არსიანის ქედის ჩრდილოეთ ნაწილში, ზღვის დონიდან 2058 მეტრზე, გოდერძის უღელტეხილიდან დაახლოებით ექვს
    კილომეტრშია — იქ, სადაც ბათუმიდან ამომავალი გზა აჭარას ემშვიდობება და მესხეთისკენ ეშვება.


    ტბას არც ერთი ნაკადული არ ერთვის და არც ერთი არ გამოედინება. მას თოვლი, წვიმა და მიწისქვეშა წყაროები
    ავსებს, წყალიც მიწისქვეშა გზით მიდის: გაზაფხულზე ტბა ნაპირებამდე ივსება, ზამთრისთვის კი დაბლა იწევს.
    ფერს ფერდობებზე მდგარი წიწვოვანი ტყე და წიფელი აძლევს — შუადღისას მუქი მწვანეა, მზის დახრასთან ერთად
    ელფერს იცვლის, ნაპირთან, ღია ფერის ქვებზე კი რძიან ფირუზისფერს იღებს. წყალი სუფთაა და სუსტად მინერალიზებული,
    თევზი კი ტბაში საერთოდ არ არის.


    აქ ყველაზე ხშირად მწყემსებს შეხვდებით. მთიანი აჭარის ოჯახები თაობიდან თაობამდე ზაფხულობით ახლომდებარე
    ბეშუმის იაილებზე ადიან, და ძროხები, რომლებიც ნაპირთან წყალში შედიან, ამ ძველი რიტმის ნაწილია. სეზონზე
    ბილიკების პირას ადგილობრივები ყავასა და რძის ნაწარმს გთავაზობენ, ტბაზე შეიძლება რამდენიმე წყლის ველოსიპედი
    და ორიოდე კარავიც დაგხვდეთ. ამით ამოიწურება აქაური „ინფრასტრუქტურა“.


    იმავე უღელტეხილის აღმოსავლეთ კალთაზე ტბის უცნაური ანტიპოდია — გოდერძის ნამარხი ტყე: პალმები, მაგნოლიები
    და ქაფურის ხეები, რომლებიც მილიონობით წლის წინ ვულკანურმა ფერფლმა დამარხა. ზოგი გაქვავებული ღერო დღემდე
    ფეხზე დგას და წლიური რგოლებიც აშკარად ეტყობა.


    აგვისტოს პირველ შაბათ-კვირას ბეშუმში შუამთობა იმართება და მდელოები დოღითა და ცეკვით ივსება. ნებისმიერ
    სხვა უქარო დილას კი ტბა ცას, ორიოდე ნაძვსა და თქვენსავე სიჩუმეს გიბრუნებთ.
  tip: >-
    ჩამოდით ივნისის შუა რიცხვებიდან სექტემბრამდე — დანარჩენ დროს გზა თოვლის ქვეშაა. ადრე გამოდით: სარკისებრი
    ზედაპირი შუადღის ქარამდე ძლებს, ნაშუადღევს კი უღელტეხილს ხშირად ღრუბელი გადმოეფარება. ტუალეტი და მაღაზია
    არ არის, მხოლოდ იშვიათად თუ შეგხვდებათ მწყემსი ყავითა და ყველით — წყალი და საჭმელი თან იქონიეთ, ნაგავი
    კი უკან წამოიღეთ. ცნობარები ტბის წყალს სასმელად ვარგისად მიიჩნევენ, მაგრამ მასში საქონელი შედის. აგვისტოშიც
    კი წაიღეთ წვიმის ქურთუკი, თბილი ტანსაცმელი და მწერების საწინააღმდეგო საშუალება. გზად, ბეშუმთან, გოდერძის
    ალპურ ბაღს (ღიაა 15 მაისიდან 15 ოქტომბრამდე) ნახევარი საათი ნამდვილად ეკუთვნის.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ხაშურამდე იარეთ, იქიდან ს8-ით ბორჯომის გავლით ახალციხემდე, შემდეგ
    შ1-ით ადიგენის გავლით გოდერძის უღელტეხილამდე — დაახლოებით 272 კმ, გზას 5 საათსა და 45 წუთს დაუთმეთ.
    2026 წლის მდგომარეობით ეს აღმოსავლეთი მისადგომი თითქმის მთლიანად ასფალტია, მხოლოდ უღელტეხილთან და
    სათხილამურო კურორტთან გვხვდება ხრეშის მოკლე მონაკვეთები. საწვავი ახალციხეში ან ადიგენში ჩაასხით —
    შემდეგ ბენზინგასამართი აღარ არის. უღელტეხილიდან ტბამდე დაახლოებით ექვსკილომეტრიანი უხეში გრუნტის გზაა:
    მშრალ ამინდში მაღალი გამავლობის 4x4 უმკლავდება, წვიმის შემდეგ კი თიხად იქცევა. იქირავეთ გზაგარეშე
    კლასის მანქანა, ან ეს მონაკვეთი ფეხით გაიარეთ (ცალ მხარეს საათზე მეტი). ბათუმიდან, ხულოს გავლით, გზა
    უფრო გრძელია, ყველაზე ცუდი გრუნტის მონაკვეთი კი დიოკნისსა და რიყეთს შორისაა.
en:
  name: Green Lake (Goderdzi)
  short: >-
    Mtsvane Tba, the Green Lake: five hectares of cold, clear water at 2,058 m near Goderdzi Pass, and
    more than nineteen metres deep.
  body: >-
    **The Green Lake covers barely five hectares, yet its water goes down more than nineteen metres.**
    Mtsvane Tba, as the Georgians call it, lies at 2,058 metres on the northern arm of the Arsiani Range,
    about six kilometres from Goderdzi Pass, the high saddle where the road from Batumi leaves Adjara
    and drops into Meskheti.


    No stream runs in and none runs out. Snowmelt, rain and springs fill the basin, and the water leaves
    the way it came, underground: in spring the lake brims, by winter it has sunk. Conifers and beech
    on the slopes lend it its colour — deep green at noon, changing as the light lowers, a milky turquoise
    over the pale stones of the shallows. The water is clear and faintly mineral, and not a single fish
    lives in it.


    The people you meet here are mostly herders. For generations the families of Upper Adjara have moved
    up to the summer pastures around Beshumi, a few kilometres away, and the cows that wade in at the
    edge to drink belong to that old yayla rhythm. In season, locals along the paths sell coffee, cheese
    and yoghurt; there may be a few pedal boats and a tent or two. That is the full extent of the infrastructure.


    On the eastern slope of the same pass lies the lake's strange opposite: the Goderdzi Fossil Forest,
    where palms, magnolias and camphor trees were buried by volcanic ash millions of years ago. Some of
    the petrified trunks still stand upright, their growth rings plain to see.


    Come on the first weekend of August and Beshumi's Shuamtoba festival fills the meadows with horse
    races and dancing. Come on any other still morning, and the lake hands you back the sky, a spruce
    or two, and your own silence.
  tip: >-
    Go between mid-June and September; the rest of the year the track belongs to the snow. Start early:
    the mirror is at its best before the midday wind, and afternoon cloud often spills over the pass.
    There are no toilets and no shop, only the odd herder selling coffee and cheese, so bring water and
    food and carry your rubbish out — the reference books call the lake water drinkable, but cattle wade
    in it. Pack a rain shell, a warm layer and insect repellent even in August. On the way, the Goderdzi
    Alpine Garden near Beshumi (open 15 May–15 October) is worth half an hour.
  route: >-
    From Tbilisi take the S1 (E60) west to Khashuri, then the S8 south through Borjomi to Akhaltsikhe,
    and the Sh1 through Adigeni up to Goderdzi Pass: about 272 km, allow 5 hours 45 minutes. As of 2026
    this eastern approach is asphalt almost all the way, with short gravel gaps near the pass and the
    ski resort. Fill up in Akhaltsikhe or Adigeni; there is no fuel beyond. From the pass a rough earth
    track of about six kilometres leads to the lake — manageable in a high-clearance 4x4 when dry, clay
    after rain. Hire an off-road class car, or walk that stretch (well over an hour each way). The longer
    Batumi–Khulo approach has its worst dirt between Dioknisi and Riketi.
ru:
  name: Зелёное озеро (Годердзи)
  short: >-
    Мцване Тба, Зелёное озеро: пять гектаров холодной прозрачной воды на высоте 2058 м у перевала Годердзи,
    глубиной больше девятнадцати метров.
  body: >-
    **Зелёное озеро занимает едва пять гектаров, но его вода уходит вглубь более чем на девятнадцать метров.**
    Мцване Тба, как называют его грузины, лежит на высоте 2058 метров, на северном отроге Арсианского
    хребта, примерно в шести километрах от перевала Годердзи — того самого высокого седла, где дорога
    из Батуми покидает Аджарию и спускается в Месхетию.


    В озеро не впадает и не вытекает ни один ручей. Котловину наполняют талый снег, дождь и подземные
    источники, а уходит вода тем же путём — под землёй: весной озеро полнится до краёв, к зиме мелеет.
    Цвет ему дают хвойные леса и бук на склонах — густо-зелёный в полдень, меняющийся с падением света,
    молочно-бирюзовый над светлыми камнями на отмели. Вода прозрачная, со слабым минеральным привкусом,
    и ни одной рыбы в ней не водится.


    Люди, которых вы встретите здесь, — в основном пастухи. Семьи Верхней Аджарии из поколения в поколение
    поднимаются летом на пастбища вокруг Бешуми, в нескольких километрах отсюда, и коровы, что заходят
    у берега в воду попить, — часть этого древнего ритма яйлы — летних кочевий. В сезон местные жители
    на тропах продают кофе, сыр и йогурт; может попасться пара водных велосипедов и палатка-другая. Вот
    и вся здешняя инфраструктура.


    На восточном склоне того же перевала лежит странная противоположность озеру — Годердзский окаменелый
    лес, где пальмы, магнолии и камфорные деревья миллионы лет назад засыпал вулканический пепел. Некоторые
    окаменевшие стволы стоят до сих пор, и годичные кольца на них видны отчётливо.


    Приезжайте в первые выходные августа — и фестиваль Шуамтоба в Бешуми заполнит луга конными скачками
    и танцами. Приезжайте в любое другое тихое утро — и озеро вернёт вам небо, пару елей и вашу собственную
    тишину.
  tip: >-
    Отправляйтесь сюда с середины июня по сентябрь; в остальное время дорога принадлежит снегу. Выезжайте
    рано: зеркальная гладь лучше всего до полуденного ветра, а после обеда через перевал часто наплывают
    облака. Ни туалетов, ни магазина здесь нет, лишь иногда встретится пастух с кофе и сыром, так что
    берите воду и еду и увозите мусор с собой — справочники называют воду озера питьевой, но в неё заходит
    скот. Даже в августе возьмите дождевик, тёплую одежду и средство от насекомых. По дороге стоит заглянуть
    на полчаса в Годердзский альпийский сад у Бешуми (открыт с 15 мая по 15 октября).
  route: >-
    От Тбилиси по S1 (E60) на запад до Хашури, затем по S8 через Боржоми до Ахалцихе, и по Sh1 через Адигени
    до перевала Годердзи: около 272 км, отведите 5 часов 45 минут. По состоянию на 2026 год этот восточный
    подъезд почти весь заасфальтирован, с короткими гравийными участками у перевала и горнолыжного курорта.
    Заправьтесь в Ахалцихе или Адигени — дальше бензоколонок нет. От перевала к озеру ведёт около шести
    километров разбитой грунтовки: в сухую погоду она по силам полноприводному внедорожнику с высоким
    клиренсом, после дождя превращается в глину. Возьмите машину внедорожного класса или пройдите этот
    участок пешком (в одну сторону — заметно больше часа). У более длинного маршрута через Батуми и Хуло
    худший участок грунтовки — между Диокниси и Рикети.
fa:
  name: دریاچهٔ سبز (گودردزی)
  short: >-
    متسوانه تبا، دریاچهٔ سبز: پنج هکتار آب سرد و شفاف در ارتفاع ۲٬۰۵۸ متری، نزدیک گذرگاه گودردزی، با عمقی
    بیش از نوزده متر.
  body: >-
    **دریاچهٔ سبز تنها پنج هکتار سطح دارد، اما آبش به بیش از نوزده متر عمق فرومی‌رود.** متسوانه تبا، چنان‌که
    گرجی‌ها آن را می‌خوانند، در ارتفاع ۲٬۰۵۸ متری، بر شاخهٔ شمالی رشته‌کوه آرسیانی، حدود شش کیلومتر با
    گذرگاه گودردزی فاصله دارد — همان گردنهٔ بلندی که جادهٔ باتومی در آن از آجارا بیرون می‌رود و به سوی
    مسختی سرازیر می‌شود.


    هیچ رودی به دریاچه نمی‌ریزد و هیچ رودی از آن بیرون نمی‌رود. برف‌آب، باران و چشمه‌ها این حوضچه را پر
    می‌کنند، و آب همان‌گونه که آمده، زیرزمینی، بیرون می‌رود: بهار دریاچه لبریز می‌شود، زمستان فرومی‌نشیند.
    جنگل‌های سوزنی‌برگ و درختان راش بر دامنه‌ها رنگش را می‌بخشند — نیمروز سبزی تیره، با افت نور دگرگون‌شونده،
    و بر سنگ‌های روشنِ آب‌های کم‌ژرفا فیروزه‌ای شیری. آب شفاف و اندکی معدنی است، و هیچ ماهی‌ای در آن زندگی
    نمی‌کند.


    آن‌ها که اینجا خواهید دید، بیشتر چوپان و دامدارند. خانواده‌های آجارای بالا نسل به نسل تابستان‌ها به
    چراگاه‌های اطراف بشومی، چند کیلومتر دورتر، کوچ می‌کنند، و گاوهایی که کنار ساحل به آب می‌روند، بخشی
    از همین ریتم کهن ییلاقی‌اند. در فصل، اهالی محلی کنار مسیرها قهوه، پنیر و ماست می‌فروشند؛ شاید چند
    قایق‌پا و یکی‌دو چادر هم بیابید. تمام «زیرساخت» اینجا همین است.


    بر دامنهٔ شرقی همان گذرگاه، نقطهٔ مقابلِ شگفت‌انگیز این دریاچه نهفته است: جنگل سنگواره‌ای گودردزی،
    جایی که نخل‌ها، ماگنولیاها و درختان کافور را میلیون‌ها سال پیش خاکستر آتشفشانی مدفون کرد. برخی تنه‌های
    سنگ‌شده هنوز ایستاده‌اند، و حلقه‌های رشدشان به‌روشنی دیده می‌شود.


    در نخستین آخر هفتهٔ اوت بیایید و جشنوارهٔ شوامتوبا در بشومی چمنزارها را با اسب‌دوانی و رقص پر می‌کند.
    در هر صبح آرام دیگری بیایید، و دریاچه آسمان، یکی‌دو درخت نوئل و سکوت خودتان را به شما بازمی‌گرداند.
  tip: >-
    از نیمهٔ ژوئن تا سپتامبر بیایید؛ در باقی سال راه از آن برف است. زود حرکت کنید: سطح آینه‌مانند تا پیش
    از باد نیمروز بهترین حالت را دارد، و بعدازظهر اغلب ابر بر گذرگاه فرومی‌ریزد. نه سرویس بهداشتی و نه
    مغازه‌ای در کار است، تنها گاهی چوپانی با قهوه و پنیر می‌یابید، پس آب و غذا با خود بیاورید و زباله
    را باز ببرید — کتاب‌های مرجع آب دریاچه را آشامیدنی می‌دانند، اما دام‌ها در آن راه می‌روند. حتی در
    اوت هم بارانی، لباس گرم و ضدحشره با خود بیاورید. در راه، باغ آلپی گودردزی نزدیک بشومی (باز از ۱۵ مه
    تا ۱۵ اکتبر) نیم‌ساعتی می‌ارزد.
  route: >-
    از تفلیس با S1 (E60) به سوی غرب تا خاشوری بروید، سپس با S8 از میان بورجومی تا آخالتسیخه، و با Sh1
    از میان آدیگنی تا گذرگاه گودردزی: حدود ۲۷۲ کیلومتر، پنج ساعت و چهل‌وپنج دقیقه در نظر بگیرید. در سال
    ۲۰۲۶ این مسیر شرقی تقریباً به‌کلی آسفالت است، با تکه‌های کوتاه شنی نزدیک گذرگاه و پیست اسکی. در آخالتسیخه
    یا آدیگنی سوخت‌گیری کنید؛ فراتر از آن پمپ بنزینی نیست. از گذرگاه، راهی خاکی و ناهموار حدود شش کیلومتر
    به دریاچه می‌رسد — با خودروی شاسی‌بلند دودیفرانسیل (4x4) در هوای خشک قابل‌عبور، و پس از باران گِلی
    می‌شود. خودرویی از کلاس آفرود کرایه کنید، یا این بخش را پیاده طی کنید (هر سو خیلی بیش از یک ساعت).
    در مسیر طولانی‌تر باتومی–خولو، بدترین بخش خاکی میان دیوکنیسی و ریکتی است.
he:
  name: האגם הירוק (גודרדזי)
  short: >-
    מצוואנה טבה, האגם הירוק: חמישה הקטרים של מים קרים וצלולים בגובה 2,058 מ' סמוך למעבר גודרדזי, בעומק
    של יותר מתשעה-עשר מטרים.
  body: >-
    **האגם הירוק משתרע על פני חמישה הקטרים בלבד, ואילו מימיו יורדים לעומק של יותר מתשעה-עשר מטרים.** מצוואנה
    טבה, כפי שהגאורגים קוראים לו, שוכן בגובה 2,058 מטרים על הזרוע הצפונית של רכס ארסיאני, כשישה קילומטרים
    ממעבר גודרדזי — האוכף הגבוה שבו הדרך מבטומי עוזבת את אג'ריה ויורדת אל מסחטי.


    שום נחל לא נכנס לאגם ושום נחל לא יוצא ממנו. שלגים נמסים, גשם ומעיינות ממלאים את האגן, והמים עוזבים
    כפי שהגיעו — מתחת לפני הקרקע: באביב האגם מתמלא עד גדותיו, ובחורף הוא שוקע. עצי מחט ואשור על המדרונות
    מעניקים לו את צבעו — ירוק עמוק בשעת הצהריים, משתנה עם דעיכת האור, טורקיז חלבי מעל האבנים הבהירות במים
    הרדודים. המים צלולים ובעלי טעם מינרלי קלוש, ואף דג אחד לא חי בהם.


    האנשים שתפגשו כאן הם בעיקר רועים. משפחות אג'ריה העילית עולות מדור לדור בקיץ אל המרעים שסביב בשומי,
    במרחק כמה קילומטרים, והפרות שנכנסות לשתות בשולי המים הן חלק מאותו מקצב יאילה עתיק. בעונה, תושבים מקומיים
    לאורך השבילים מוכרים קפה, גבינה ויוגורט; אפשר למצוא כמה סירות פדלים ואוהל או שניים. זה כל התשתית שיש.


    על המדרון המזרחי של אותו מעבר שוכן ההיפך המשונה של האגם — יער המאובנים של גודרדזי, שם דקלים, מגנוליות
    ועצי קמפור נטמנו באפר וולקני לפני מיליוני שנים. כמה מהגזעים המאובנים עוד עומדים זקופים, והטבעות השנתיות
    שלהם ברורות לעין.


    הגיעו בסוף השבוע הראשון של אוגוסט, ופסטיבל שואמטובה בבשומי ממלא את האחו במרוצי סוסים ובריקודים. הגיעו
    בכל בוקר שקט אחר, והאגם משיב לכם את השמים, אשוח או שניים, ואת הדממה שלכם עצמכם.
  tip: >-
    בואו בין אמצע יוני לספטמבר; בשאר השנה הדרך שייכת לשלג. צאו מוקדם: פני המראה במיטבם לפני רוח הצהריים,
    ואחר הצהריים עננים נוטים לגלוש מעל המעבר. אין שירותים ואין חנות, רק פה ושם רועה שמוכר קפה וגבינה,
    אז הביאו מים ואוכל וקחו את הזבל בחזרה איתכם — ספרי העיון מגדירים את מי האגם כראויים לשתייה, אך בקר
    נכנס אליהם. ארזו מעיל גשם, שכבה חמה ותכשיר נגד חרקים, גם באוגוסט. בדרך, כדאי לבקר חצי שעה בגן האלפיני
    של גודרדזי סמוך לבשומי (פתוח 15 במאי–15 באוקטובר).
  route: >-
    מטביליסי בכביש S1 (E60) מערבה עד חשורי, אחר כך S8 דרך בורג'ומי לאחלציחה, ו-Sh1 דרך אדיגני עד מעבר
    גודרדזי: כ-272 ק"מ, הקצו 5 שעות ו-45 דקות. נכון ל-2026 הגישה המזרחית הזו כמעט כולה מאספלט, עם קטעי
    חצץ קצרים סמוך למעבר ולאתר הסקי. תדלקו באחלציחה או באדיגני; מעבר לזה אין תחנת דלק. מהמעבר, דרך עפר
    משובשת באורך כשישה קילומטרים מובילה לאגם — עבירה ברכב שטח 4x4 בעל מרווח גחון גבוה ביום יבש, והופכת
    לבוץ חרסיתי אחרי גשם. שכרו רכב מסוג שטח, או עברו את המקטע הזה ברגל (הרבה יותר משעה לכל כיוון). בגישה
    הארוכה יותר מבטומי דרך חולו, קטע העפר הגרוע ביותר הוא בין דיוקניסי לריקטי.
ar:
  name: البحيرة الخضراء (غودردزي)
  short: >-
    متسفانه تبا، البحيرة الخضراء: خمسة هكتارات من الماء البارد الصافي على ارتفاع 2,058 مترًا قرب ممر غودردزي،
    وعمق يتجاوز تسعة عشر مترًا.
  body: >-
    **لا تتجاوز مساحة البحيرة الخضراء خمسة هكتارات، ومع ذلك ينحدر ماؤها إلى أكثر من تسعة عشر مترًا عمقًا.**
    تقع متسفانه تبا، كما يسمّيها الجورجيون، على ارتفاع 2,058 مترًا، على الذراع الشمالي لسلسلة أرسياني،
    على نحو ستة كيلومترات من ممر غودردزي، ذلك السرج المرتفع الذي عنده يترك الطريق من باتومي منطقة أدجارا
    وينحدر نحو مسخيتي.


    لا يصب فيها أي جدول ولا يخرج منها أي جدول. تملأ الحوض ثلوج ذائبة وأمطار وعيون مائية، ويغادر الماء
    من حيث أتى: تحت الأرض؛ في الربيع تفيض البحيرة إلى حافتها، وفي الشتاء تنكمش. تمنحها الغابات الصنوبرية
    وأشجار الزان على المنحدرات لونها — أخضر عميق عند الظهيرة، متغير مع انحدار الضوء، فيروزي حليبي فوق
    الحجارة الفاتحة عند الشاطئ الضحل. الماء صافٍ وذو نكهة معدنية خفيفة، ولا تعيش فيه سمكة واحدة.


    من ستقابلهم هنا هم في الغالب رعاة. تصعد عائلات أعالي أدجارا جيلاً بعد جيل في الصيف إلى مراعي بشومي
    القريبة على بعد بضعة كيلومترات، والأبقار التي تدخل الماء عند الحافة لتشرب هي جزء من ذلك الإيقاع الرعوي
    القديم. في الموسم، يبيع السكان المحليون على طول المسارات القهوة والجبن والزبادي؛ وقد تجد بضعة قوارب
    دواسة وخيمة أو اثنتين. هذا كل ما هنالك من «بنية تحتية».


    على المنحدر الشرقي لذلك الممر نفسه يكمن نقيض البحيرة الغريب: الغابة المتحجرة في غودردزي، حيث دفن الرماد
    البركاني أشجار النخيل والماغنوليا والكافور منذ ملايين السنين. لا تزال بعض الجذوع المتحجرة قائمة، وحلقات
    نموها واضحة للعيان.


    تعال في أول عطلة نهاية أسبوع من أغسطس، فمهرجان شوامتوبا في بشومي يملأ المروج بسباقات الخيل والرقص.
    تعال في أي صباح هادئ آخر، فتردّ البحيرة إليك السماء، وشجرة تنّوب أو اثنتين، وصمتك أنت.
  tip: >-
    تعال بين منتصف يونيو وسبتمبر؛ في بقية العام يكون المسار ملكًا للثلج. انطلق مبكرًا: تكون المرآة المائية
    في أفضل حالها قبل ريح الظهيرة، وكثيرًا ما ينسدل الغيم على الممر بعد الظهر. لا مرافق صحية ولا متجر
    هنا، سوى راعٍ يبيع القهوة والجبن هنا وهناك، فاحمل الماء والطعام وأعد القمامة معك — تصف المراجع ماء
    البحيرة بأنه صالح للشرب، لكن المواشي تخوض فيه. احمل معطف مطر وملابس دافئة وطارد حشرات حتى في أغسطس.
    في الطريق، تستحق الحديقة الألبية في غودردزي قرب بشومي (مفتوحة من 15 مايو إلى 15 أكتوبر) نصف ساعة من
    وقتك.
  route: >-
    من تبليسي على الطريق S1 (E60) غربًا حتى خاشوري، ثم S8 عبر بورجومي إلى أخالتسيخه، وSh1 عبر أديغيني
    حتى ممر غودردزي: نحو 272 كم، خصّص 5 ساعات و45 دقيقة. بحسب وضع عام 2026، هذا المدخل الشرقي معبّد بالأسفلت
    كله تقريبًا، مع مقاطع حصوية قصيرة قرب الممر ومنتجع التزلج. عبّئ الوقود في أخالتسيخه أو أديغيني؛ فلا
    محطات وقود بعد ذلك. من الممر، يمتد طريق ترابي وعر لنحو ستة كيلومترات إلى البحيرة — يمكن قطعه بسيارة
    دفع رباعي ذات خلوص أرضي مرتفع في الجو الجاف، ويتحول إلى طين بعد المطر. استأجر سيارة من فئة الطرق الوعرة،
    أو اقطع هذا المقطع سيرًا (أكثر من ساعة بكثير في كل اتجاه). في المسار الأطول عبر باتومي وخولو، يقع
    أسوأ جزء ترابي بين ديوكنيسي وريكيتي.
