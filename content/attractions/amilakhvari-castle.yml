ka:
  name: ამილახვართა ციხე-დარბაზები
  short: >-
    ამილახვრების XVII–XVIII საუკუნეების სამი ციხე-დარბაზი ქვემო ჭალაში: კოშკები, ეკლესია ფრესკების ნაშთებით,
    დაუმთავრებელი სამრეკლო და გუმბათიანი აბანო.
  body: >-
    **როცა ამილახვრები სხვილოს მაღალი ციხიდან ხეობაში ჩამოვიდნენ, კედლების შენება არ შეუწყვეტიათ — უბრალოდ,
    ახლა ყანებთან ახლოს აშენებდნენ.**


    XVI–XVII საუკუნეებში საგვარეულომ რეზიდენცია ლეხურის ხეობაში, ქვემო ჭალაში გადმოიტანა და XVII–XVIII
    საუკუნეებში აქ ერთი კი არა, სამი ციხე-დარბაზი ააგო. XVIII საუკუნის ერთი ისტორიკოსი აქ „დიდ პალატებს“
    იხსენიებს. დრომ ისინი არ დაინდო: მეტ-ნაკლებად მთლიანად მხოლოდ მთავარი ციხეა შემორჩენილი, დანარჩენი
    ორიდან — ფრაგმენტები, თუმცა ანსამბლი ეროვნული მნიშვნელობის კულტურის უძრავი ძეგლია.


    მთავარ ციხეს შუაზე კედელი ყოფს. სამხრეთი ნაწილი სოფლელებისთვის იყო განკუთვნილი, რომლებიც თავდასხმისას
    აქ აფარებდნენ თავს; ჩრდილოეთით ამილახვრების ორსართულიანი სასახლე იდგა ეკლესიითა და სამრეკლოთი. რეზიდენციას
    სამი კოშკი აქვს — ერთი ოთხკუთხა და ორი მრგვალი, ზედა სართულებზე სათოფურებით. თლილი ქვით მოპირკეთებული,
    ჩუქურთმებით შემკული დარბაზული ეკლესია, აღმოსავლეთ ფასადის წარწერის თანახმად, XVII საუკუნის ბოლო მესამედში
    აზნაურმა პაპუნა ყარუმიძემ ააშენა. მოხატულობის შემორჩენილი ფრაგმენტები დღესაც მკვეთრი, კონტრასტული
    ფერებით ანათებს.


    ეკლესიის გვერდით მდგარი ოთხკუთხა კოშკი სამსართულიან სამრეკლოდ იყო ჩაფიქრებული, მაგრამ XVIII საუკუნის
    შუა ხანებში, როცა თავადი გივი ამილახვარი ხან ოსმალებთან ერთად, ხან მათ წინააღმდეგ იბრძოდა და ნადირ-შაჰსაც
    ებრძოდა, საქმე შეწყდა და კოშკი უბრალო კოშკად დარჩა.


    გზის გაღმა ორი მცირე ციხის ხუთსართულიანი კოშკები დგას; ერთ-ერთის პატარა დარბაზულ ეკლესიაზე წარწერა
    გვამცნობს, რომ ის 1775 წელს ავთანდილის ძემ, ამირინდო ამილახვარმა ააგო. კომპლექსის ჩრდილო-აღმოსავლეთით
    XVIII საუკუნის აბანოა: რვაწახნაგა შესასვლელი დარბაზი ნიშებით, გუმბათიანი ოთახები და აუზიანი საბანაო,
    რომლის გუმბათი სგრაფიტოს ტექნიკითაა შემკული. ომებს შორის ვიღაცამ მაინც მოიცალა, რომ აბანო მოერთო.
  tip: >-
    აქ ნანგრევი დაგხვდებათ და არა აღდგენილი სასახლე-მუზეუმი: კედლები ჩამონგრეულია, იატაკი უსწორმასწორო,
    ეკლესია კი შესაძლოა დაკეტილი იყოს. შესვლის პირობები და ფასი სოფელში იკითხეთ. ერთი საათი საკმარისია
    მთავარი ციხის, გზის გაღმა მდგარი კოშკებისა და აბანოს სანახავად. სოფელში საპირფარეშოსა და კაფეს ნუ
    ელით — წყალი და საგზალი თან წაიღეთ. ეკლესიაში შესვლისას მოკრძალებულად ჩაიცვით. თუ ზემოთ, ქედზე, სხვილოს
    ციხესაც — საგვარეულოს უფრო ძველ სიმაგრეს — ესტუმრებით, ამილახვრების მთელ ამბავს ნახევარ დღეში, არწივის
    ბუდიდან ხეობამდე ნახავთ.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალს დასავლეთისკენ გაჰყევით. ცენტრიდან დაახლოებით 55 კილომეტრში, კასპის
    მუნიციპალიტეტში, მარჯვნივ ადგილობრივ შ133 გზაზე გადაუხვიეთ და ლეხურის ხეობით ჩრდილოეთისკენ დაახლოებით
    4–5 კილომეტრი იარეთ ქვემო ჭალამდე; ციხე სოფელშივე დგას, მანქანიდან სულ რამდენიმე ნაბიჯზე. სულ დაახლოებით
    61 კმ და ერთი საათია. ბოლო მონაკვეთი სოფლის გავლით მოუასფალტებელია და წვიმის შემდეგ ღრმა ნაკვალევი
    რჩება, ამიტომ მაღალი გამავლობის მანქანით უფრო კომფორტულად იმგზავრებთ. საწვავი გადახვევამდე, S1-ზე
    ჩაასხით.
en:
  name: Amilakhvari Castle
  short: >-
    Three 17th–18th-century castles of the Amilakhvari princes at Kvemo Chala: towers, a church with fresco
    fragments, an unfinished belfry and a domed bathhouse.
  body: >-
    **When the Amilakhvari lords came down from their ridge-top fortress at Skhvilo, they did not stop
    building walls; they simply built them closer to the fields.**


    In the 16th–17th centuries the family moved its seat to Kvemo Chala in the Lekhura valley, and over
    the 17th and 18th centuries raised not one castle here but three. An 18th-century historian wrote
    of 'large palaces' on the site. Time has been hard on them: only the main castle survives in any shape,
    with fragments of the other two, but the ensemble is registered as a Cultural Monument of National
    Significance.


    The main castle was split by a wall. The southern half was for the villagers, who could shelter there
    in a raid; the northern half held the family's two-storey residence with its church and bell tower.
    The residence keeps three towers — one square, two round — with loopholes on their upper floors. The
    church, a hall faced with dressed stone and carved ornament, was built in the last third of the 17th
    century by the nobleman Papuna Karumidze, as the inscription on its east façade records. Fragments
    of its frescoes still glow in bright, contrasting colours.


    The square tower beside the church was meant to rise into a three-storey bell tower, but in the mid-18th
    century, while Prince Givi Amilakhvari fought now with, now against the Ottomans, and against Nader
    Shah of Persia, the work stopped and it stayed a plain tower.


    Across the road stand the five-storey towers of the two smaller castles; in one, a little hall church
    bears an inscription: Amirindo Amilakhvari, son of Avtandil, built it in 1775. North-east of the complex
    lies an 18th-century bathhouse: an octagonal hall with niches, domed rooms, and a bathing pool beneath
    a dome worked in sgraffito. Somewhere between wars, someone still found time to decorate a bath.
  tip: >-
    Expect a ruin, not a restored palace-museum: walls are broken, floors uneven, and the church may be
    locked. Ask in the village about access and any fee. An hour covers the main castle, the towers across
    the road and the bathhouse. Do not count on toilets or a café in the village — bring water and something
    to eat. Dress modestly if the church is open. Add Skhvilo Fortress on the ridge above, the family's
    older stronghold, and you have the whole Amilakhvari story in half a day, from eyrie to valley floor.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi. About 55 km from the centre, in Kaspi Municipality,
    turn right onto the local Sh133 and follow it north up the Lekhura valley for roughly 4–5 km to Kvemo
    Chala; the castle stands in the village, a few steps from the car. Total: about 61 km and 1 hour.
    The last stretch through the village is unpaved and rutted after rain, so an SUV is the comfortable
    choice. Fill up on the S1 before the turn-off.
ru:
  name: Замок Амилахвари
  short: >-
    Три замка князей Амилахвари XVII–XVIII веков в Квемо-Чала: башни, церковь с фрагментами фресок, недостроенная
    колокольня и баня под куполом.
  body: >-
    **Спустившись со своей крепости на гребне у Схвило, князья Амилахвари не перестали строить стены —
    они лишь поставили их поближе к полям.**


    В XVI–XVII веках род перенёс свою резиденцию в Квемо-Чала, в долину Лехуры, и за XVII и XVIII столетия
    возвёл здесь не один замок, а целых три. Историк XVIII века писал о «больших дворцах» на этом месте.
    Время обошлось с ними сурово: более или менее цел лишь главный замок, от двух других остались фрагменты,
    но весь ансамбль внесён в список памятников культуры национального значения.


    Главный замок делила надвое стена. Южная половина предназначалась для крестьян, которые могли укрыться
    там во время набега; в северной стояла двухэтажная резиденция семьи с церковью и колокольней. У резиденции
    сохранились три башни — одна квадратная и две круглые, с бойницами на верхних этажах. Церковь — зального
    типа, облицованная тёсаным камнем и украшенная резным орнаментом — построил в последней трети XVII
    века дворянин Папуна Карумидзе, о чём сообщает надпись на восточном фасаде. Фрагменты её росписей
    до сих пор горят яркими, контрастными красками.


    Квадратная башня рядом с церковью должна была вырасти в трёхъярусную колокольню, но в середине XVIII
    века, когда князь Гиви Амилахвари воевал то на стороне османов, то против них, а заодно и против персидского
    Надир-шаха, работы остановились, и башня так и осталась простой башней.


    По другую сторону дороги стоят пятиэтажные башни двух меньших замков; в одном из них — маленькая зальная
    церковь с надписью: её построил в 1775 году Амириндо Амилахвари, сын Автандила. К северо-востоку от
    комплекса лежит баня XVIII века: восьмигранный зал с нишами, купольные помещения и купальня под куполом,
    украшенным в технике сграффито. Где-то между войнами кто-то всё же нашёл время украсить баню.
  tip: >-
    Готовьтесь увидеть руину, а не отреставрированный дворец-музей: стены разрушены, пол неровный, церковь
    может быть заперта. О доступе и возможной плате спросите в селе. Главный замок, башни через дорогу
    и баня укладываются в час. Туалетов и кафе в селе не ждите — возьмите воду и перекус. Если церковь
    открыта, оденьтесь скромно. Добавьте к поездке крепость Схвило на гребне выше — более древнее родовое
    гнездо семьи, — и за полдня вы проследите всю историю Амилахвари, от орлиного гнезда до дна долины.
  route: >-
    Из Тбилиси — по автомагистрали S1 (E60) на запад. Примерно в 55 км от центра, в Каспском муниципалитете,
    сверните направо на местную дорогу Sh133 и поднимайтесь по ней на север долиной Лехуры ещё около 4–5
    км до Квемо-Чала; замок стоит в самом селе, в нескольких шагах от машины. Всего — около 61 км и 1
    час пути. Последний отрезок через село грунтовый и после дождя разбит колеёй, поэтому удобнее ехать
    на внедорожнике. Заправьтесь на S1 до поворота.
fa:
  name: قلعهٔ امیلاخواری
  short: >-
    سه قلعهٔ شاهزادگان امیلاخواری از سده‌های هفدهم و هجدهم در کْوِمو چالا: برج‌ها، کلیسایی با بقایای نقاشی
    دیواری، ناقوس‌خانه‌ای نیمه‌تمام و گرمابه‌ای گنبددار.
  body: >-
    **وقتی خاندان امیلاخواری از دژ خود بر ستیغ سخویلو پایین آمدند، دیوار ساختن را کنار نگذاشتند؛ فقط دیوارها
    را نزدیک‌تر به کشتزارها ساختند.**


    در سده‌های شانزدهم و هفدهم این خاندان مقر خود را به کْوِمو چالا در درهٔ لخورا برد و در طول سده‌های
    هفدهم و هجدهم نه یک قلعه، که سه قلعه در اینجا برپا کرد. مورخی در سدهٔ هجدهم از «کاخ‌های بزرگ» در این
    مکان نوشته است. روزگار با آن‌ها نامهربان بوده است: تنها قلعهٔ اصلی کمابیش سرپا مانده و از دو قلعهٔ
    دیگر پاره‌هایی بیش نمانده، اما کل مجموعه به‌عنوان اثر فرهنگی با اهمیت ملی ثبت شده است.


    دیواری قلعهٔ اصلی را دو نیم می‌کرد. نیمهٔ جنوبی از آنِ روستاییان بود که هنگام یورش می‌توانستند در
    آن پناه بگیرند؛ در نیمهٔ شمالی اقامتگاه دوطبقهٔ خاندان با کلیسا و ناقوس‌خانه‌اش قرار داشت. سه برج
    از این اقامتگاه به جا مانده است، یکی چهارگوش و دو تا گرد، با مزغل‌هایی در طبقه‌های بالایی. کلیسا،
    تالاری تک‌ناوه با نمایی از سنگ تراش‌خورده و تزیینات کنده‌کاری‌شده، در ثلث آخر سدهٔ هفدهم به دست نجیب‌زاده‌ای
    به نام پاپونا کارومیدزه ساخته شد؛ کتیبهٔ نمای شرقی آن این را ثبت کرده است. پاره‌هایی از نقاشی‌های
    دیواری‌اش هنوز با رنگ‌هایی روشن و پرتضاد می‌درخشند.


    برج چهارگوش کنار کلیسا قرار بود به ناقوس‌خانه‌ای سه‌طبقه بدل شود، اما در میانهٔ سدهٔ هجدهم، هنگامی
    که شاهزاده گیوی امیلاخواری گاه در کنار عثمانی‌ها و گاه در برابر آنان، و نیز در برابر نادرشاه ایرانی
    می‌جنگید، کار متوقف شد و آن برج، برجی ساده باقی ماند.


    آن سوی جاده، برج‌های پنج‌طبقهٔ دو قلعهٔ کوچک‌تر ایستاده‌اند؛ در یکی از آن‌ها کلیسای تک‌ناوهٔ کوچکی
    کتیبه‌ای دارد: امیریندو امیلاخواری، پسر اوتاندیل، آن را در ۱۷۷۵ ساخت. در شمال‌شرقی مجموعه، گرمابه‌ای
    از سدهٔ هجدهم قرار دارد: تالاری هشت‌گوش با طاقچه‌ها، اتاق‌هایی گنبددار و حوضی برای شست‌وشو زیر گنبدی
    که با شیوهٔ اسگرافیتو آراسته شده است. جایی میان جنگ‌ها، کسی هنوز فرصت کرده بود گرمابه‌ای را بیاراید.
  tip: >-
    انتظار ویرانه داشته باشید، نه کاخ-موزه‌ای مرمت‌شده: دیوارها شکسته‌اند، کف ناهموار است و کلیسا ممکن
    است قفل باشد. دربارهٔ امکان ورود و ورودیهٔ احتمالی در روستا بپرسید. یک ساعت برای قلعهٔ اصلی، برج‌های
    آن سوی جاده و گرمابه کافی است. روی سرویس بهداشتی یا کافه در روستا حساب نکنید؛ آب و خوراکی همراه بیاورید.
    اگر کلیسا باز بود، پوشش مناسب داشته باشید. دژ سخویلو را هم، که بر ستیغ بالای روستاست و دژ کهن‌تر این
    خاندان به شمار می‌رود، به برنامه بیفزایید تا در نیم‌روز کل داستان امیلاخواری‌ها را ببینید، از آشیانهٔ
    عقاب تا کف دره.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب بگیرید. حدود ۵۵ کیلومتر دورتر از مرکز شهر، در شهرستان کاسپی،
    به راست و به جادهٔ محلی Sh133 بپیچید و آن را حدود ۴ تا ۵ کیلومتر رو به شمال در درهٔ لخورا تا کْوِمو
    چالا دنبال کنید؛ قلعه در خود روستا و چند قدم دورتر از خودرو است. روی هم حدود ۶۱ کیلومتر و یک ساعت.
    تکهٔ آخر در روستا خاکی است و پس از باران پر از شیار می‌شود، پس خودروی شاسی‌بلند انتخاب راحت‌تری است.
    پیش از خروج از S1 باک را پر کنید.
he:
  name: טירת אמילחוורי
  short: >-
    שלוש טירות של נסיכי אמילחוורי מהמאות ה-17 וה-18 בקבמו צ'אלה: מגדלים, כנסייה עם שרידי ציורי קיר, מגדל
    פעמונים שלא הושלם ובית מרחץ בעל כיפה.
  body: >-
    **כשאדוני בית אמילחוורי ירדו ממבצר הרכס שלהם בסחווילו, הם לא הפסיקו לבנות חומות; הם פשוט בנו אותן
    קרוב יותר לשדות.**


    במאות ה-16 וה-17 העבירה המשפחה את מושבה לקבמו צ'אלה שבעמק הלחורה, ובמהלך המאות ה-17 וה-18 הקימה כאן
    לא טירה אחת אלא שלוש. היסטוריון בן המאה ה-18 כתב על "ארמונות גדולים" במקום. הזמן לא היטיב איתן: רק
    הטירה הראשית שרדה במצב סביר, מן השתיים האחרות נותרו שרידים בלבד, אבל המכלול כולו רשום כאתר מורשת תרבותית
    בעל חשיבות לאומית.


    חומה חצתה את הטירה הראשית לשניים. החצי הדרומי נועד לכפריים, שיכלו למצוא בו מחסה בשעת פשיטה; בחצי הצפוני
    עמד מעון המשפחה בן שתי הקומות, עם כנסייה ומגדל פעמונים. במעון שרדו שלושה מגדלים, אחד מרובע ושניים
    עגולים, ובקומות העליונות שלהם חרכי ירי. הכנסייה, כנסיית אולם מצופה אבן מסותתת ומעוטרת בגילופים, נבנתה
    בשליש האחרון של המאה ה-17 בידי האציל פאפונה קרומידזה, כפי שמתעדת הכתובת בחזית המזרחית. שרידי ציורי
    הקיר שלה עדיין זוהרים בצבעים עזים ומנוגדים.


    המגדל המרובע שליד הכנסייה נועד להפוך למגדל פעמונים בן שלוש קומות, אבל באמצע המאה ה-18, בזמן שהנסיך
    גיווי אמילחוורי נלחם פעם לצד העות'מאנים ופעם נגדם, וגם נגד נאדר שאה הפרסי, העבודה נעצרה והוא נותר
    מגדל פשוט.


    מעבר לכביש ניצבים המגדלים בני חמש הקומות של שתי הטירות הקטנות; באחת מהן יש כנסיית אולם קטנה ועליה
    כתובת: אמירינדו אמילחוורי, בנו של אבטנדיל, בנה אותה ב-1775. מצפון-מזרח למכלול שוכן בית מרחץ מהמאה
    ה-18: אולם מתומן עם גומחות, חדרים מקורים בכיפות ובריכת רחצה מתחת לכיפה המעוטרת בטכניקת סגרפיטו. איפשהו
    בין מלחמה למלחמה, מישהו עוד מצא זמן לקשט בית מרחץ.
  tip: >-
    צפו לחורבה, לא לארמון-מוזיאון משוחזר: החומות שבורות, הרצפות לא אחידות, והכנסייה עשויה להיות נעולה.
    שאלו בכפר על אפשרות הכניסה ועל דמי כניסה, אם יש. שעה אחת מספיקה לטירה הראשית, למגדלים שמעבר לכביש
    ולבית המרחץ. אל תסמכו על שירותים או בית קפה בכפר; הביאו מים ומשהו לאכול. אם הכנסייה פתוחה, התלבשו
    בצניעות. הוסיפו את מבצר סחווילו על הרכס שמעל, המעוז הקדום יותר של המשפחה, ובחצי יום תקבלו את כל סיפור
    בית אמילחוורי, מקן הנשרים ועד קרקעית העמק.
  route: >-
    צאו מטביליסי מערבה בכביש המהיר S1 (E60). כ-55 ק"מ ממרכז העיר, בתחום עיריית קספי, פנו ימינה לכביש המקומי
    Sh133 והמשיכו בו צפונה במעלה עמק הלחורה עוד כ-4–5 ק"מ עד קבמו צ'אלה; הטירה עומדת בתוך הכפר, כמה צעדים
    מהרכב. בסך הכול כ-61 ק"מ ושעה נסיעה. הקטע האחרון בתוך הכפר אינו סלול, ואחרי גשם הוא מלא תלמים, ולכן
    רכב שטח הוא הבחירה הנוחה. תדלקו על כביש S1 לפני הפנייה.
ar:
  name: قلعة أميلاخفاري
  short: >-
    ثلاث قلاع لأمراء أميلاخفاري من القرنين السابع عشر والثامن عشر في كفيمو تشالا: أبراج، وكنيسة ببقايا
    جداريات، وبرج أجراس لم يكتمل، وحمّام بقبة.
  body: >-
    **حين نزل أسياد آل أميلاخفاري من حصنهم على الذروة الصخرية في سخفيلو، لم يكفّوا عن بناء الأسوار؛ بل
    اكتفوا بأن بنوها أقرب إلى الحقول.**


    في القرنين السادس عشر والسابع عشر نقلت الأسرة مقرّها إلى كفيمو تشالا في وادي ليخورا، وعلى مدى القرنين
    السابع عشر والثامن عشر شيّدت هنا لا قلعة واحدة بل ثلاثًا. وقد كتب مؤرخ من القرن الثامن عشر عن «قصور
    كبيرة» في هذا الموضع. لم يرفق بها الزمن: فالقلعة الرئيسية وحدها بقيت على شيء من هيئتها، ولم يبقَ من
    الأخريين سوى أجزاء، غير أن المجمّع كله مسجَّل معلمًا ثقافيًّا ذا أهمية وطنية.


    كان سور يشطر القلعة الرئيسية شطرين. الشطر الجنوبي للقرويين، يحتمون به عند الغارات؛ وفي الشطر الشمالي
    قام مسكن الأسرة ذو الطابقين بكنيسته وبرج أجراسه. ولا يزال المسكن يحتفظ بثلاثة أبراج، واحد مربع واثنان
    مستديران، وفي طوابقها العليا فتحات للرمي. أما الكنيسة، وهي كنيسة ذات صحن واحد مكسوّة بالحجر المنحوت
    ومزدانة بزخارف محفورة، فقد بناها النبيل بابونا كاروميدزه في الثلث الأخير من القرن السابع عشر، كما
    يسجّل النقش على واجهتها الشرقية. ولا تزال بقايا جدارياتها تتوهّج بألوان زاهية متباينة.


    كان يُراد للبرج المربع المجاور للكنيسة أن يرتفع برجًا للأجراس من ثلاثة طوابق، لكن في منتصف القرن الثامن
    عشر، فيما كان الأمير غيفي أميلاخفاري يقاتل تارة إلى جانب العثمانيين وتارة ضدهم، وكذلك ضد نادر شاه
    الفارسي، توقف العمل وبقي برجًا عاديًّا.


    وعلى الجانب الآخر من الطريق تنتصب الأبراج ذات الطوابق الخمسة للقلعتين الأصغر؛ وفي إحداهما كنيسة صغيرة
    ذات صحن واحد تحمل نقشًا يقول إن أميريندو أميلاخفاري بن أفتانديل بناها عام 1775. وإلى الشمال الشرقي
    من المجمّع يقع حمّام من القرن الثامن عشر: قاعة مثمّنة ذات كوّات، وغرف مقبّبة، وحوض للاستحمام تحت قبة
    مزخرفة بتقنية السغرافيتو. في مكان ما بين حربين، وجد أحدهم متّسعًا من الوقت لتزيين حمّام.
  tip: >-
    توقّع أطلالًا لا قصرًا-متحفًا مرمَّمًا: الجدران متهدّمة، والأرضيات غير مستوية، وقد تكون الكنيسة مغلقة.
    اسأل في القرية عن إمكانية الدخول وعن أي رسوم. تكفي ساعة للقلعة الرئيسية والأبراج عبر الطريق والحمّام.
    لا تعوّل على دورات مياه أو مقهى في القرية؛ احمل ماءً وشيئًا تأكله. وإن كانت الكنيسة مفتوحة فالبس لباسًا
    محتشمًا. أضِف إلى زيارتك حصن سخفيلو على الذروة فوق القرية، معقل الأسرة الأقدم، فتحيط في نصف يوم بحكاية
    آل أميلاخفاري كاملة، من عشّ النسر إلى قاع الوادي.
  route: >-
    انطلق من تبليسي غربًا على الطريق السريع S1 (E60). وعلى بُعد نحو 55 كم من وسط المدينة، في بلدية كاسبي،
    انعطف يمينًا إلى الطريق المحلي Sh133 وتابعه شمالًا صعودًا في وادي ليخورا نحو 4–5 كم حتى كفيمو تشالا؛
    تقوم القلعة داخل القرية على بُعد خطوات من السيارة. المجموع نحو 61 كم وساعة واحدة. المقطع الأخير عبر
    القرية غير معبّد وتحفره الأخاديد بعد المطر، لذا فسيارة الدفع الرباعي هي الخيار المريح. تزوّد بالوقود
    على الطريق S1 قبل المنعطف.
