ka:
  name: ზენდიდის ციხე
  short: >-
    ძლიერ დანგრეული ციხე ქედასთან, სოფელ ზენდიდის თავზე, რომელიც ოდესღაც ბათუმ-არტანუჯის სავაჭრო გზას
    იცავდა; დღეს იგი ერთი ოჯახის გალავნიან ეზოში დგას.
  body: >-
    **ზენდიდის ციხის სანახავად, დიდი ალბათობით, უცხო ოჯახის ჭიშკარზე დაკაკუნება მოგიწევთ: ქედის ძველი
    მცველის ნანგრევები დღეს კერძო, გალავნით შემოზღუდულ ეზოში დგას.**


    ციხის აშენების თარიღი უცნობია, მიზეზი კი უფრო ნათელია. VII–IX საუკუნეებში ბათუმ-არტანუჯის სავაჭრო
    გზის მთავარი ძარღვი ქედაზე გადიოდა და აჭარისწყლისა და ჭოროხის აუზებს ერთმანეთთან აკავშირებდა. გაცილებით
    გვიან, XVIII საუკუნეში, ვახუშტი ბაგრატიონი აღნიშნავდა, რომ აჭარის ბეგი ქედაში ცხოვრობდა, რომელიც მცირე
    ქალაქს ჰგავდა. ასეთ ადგილს დაცვა სჭირდებოდა და ეს დაცვა ზენდიდის ციხე იყო — ბეგოშვილების, ცივასულას,
    საღორეთის, მთის უბნისა და ჩხუტუნეთის ციხეებთან ერთად ერთი რგოლი იმ ჯაჭვისა, რომელიც არა მარტო ქედას,
    არამედ ხეობაზე გამავალ სავაჭრო გზებსაც დარაჯობდა.


    ციხე ამავე სახელის სოფლის თავზე, მაღალ კლდოვან გორაზე დგას. დრომ იგი არ დაინდო: ნანგრევის საერთო სიგრძე
    დაახლოებით 50 მეტრია, კედლების სისქე — 110–130 სანტიმეტრი, აჭარის ტურიზმის სამსახური კი კოშკების,
    კარიბჭეებისა და სხვადასხვა დანიშნულების ნაგებობების ნაშთებსაც ასახელებს. ყოველივე ეს დღეს კერძო ოჯახის
    ეზოშია, გალავნის მიღმა, ასე რომ, რას ნახავთ, იმაზეა დამოკიდებული, გაგიღებენ თუ არა ჭიშკარს.


    პატარა გაჩერებაა, მაგრამ პატიოსანი: უხეში ქვა, რომელიც ოდესღაც იმ ხეობის გზას დარაჯობდა, რომლითაც
    თქვენ აქ მოხვედით.
  tip: >-
    ციხე კერძო მიწაზეა, ამიტომ გამგზავრებამდე ქედის ტურისტულ საინფორმაციო ცენტრს დაურეკეთ (+995 599 90
    90 93) და დაშვების შესახებ იკითხეთ. თუ შინ არავინ დაგხვდათ, კედლებს ქუჩიდან შეხედეთ და გზა განაგრძეთ;
    წყობაზე ნუ აძვრებით და ეზოში უნებართვოდ ნუ შეხვალთ. ნახევარი საათი სავსებით საკმარისია. ადგილზე არც
    ტუალეტია, არც კაფე; მაღაზიები გზით დაახლოებით 2,3 კილომეტრში, ქედაშია, სადაც ღვინის მარნებიც გელით,
    ქვემოთ, ხეობაში კი — მახუნცეთის ჩანჩქერი და თაღოვანი ხიდი. წვიმის შემდეგ გორაზე ამავალი გრუნტის გზა
    სრიალა ხდება.
  route: >-
    მთელი წლის გზა ბათუმზე გადის: დაახლოებით 400 კილომეტრი და 6 საათი და 10 წუთი — ს1-ით (E60), ს12-ითა
    და ს2-ით ბათუმამდე, იქიდან კი შ1-ით აჭარისწყლის ხეობას მახუნცეთის გავლით ქედამდე მიუყვებით. ზაფხულში
    გოდერძის უღელტეხილი გზას 335 კილომეტრამდე და დაახლოებით 5 საათსა და 50 წუთამდე ამოკლებს: ს1-ით (E60)
    დასავლეთით, შემდეგ ს8-ით ბორჯომის გავლით ახალციხემდე, იქიდან კი შ1-ით უღელტეხილზე გადადიხართ და ხულოსა
    და შუახევის გავლით ქედამდე ეშვებით. უღელტეხილი მაღალმთიანი და სეზონურია: წინასწარ გადაამოწმეთ, ღიაა
    თუ არა, და იძლევა თუ არა ამის უფლებას თქვენი ქირავნობის ხელშეკრულება. ზენდიდი ქედის ცენტრიდან გზით
    დაახლოებით 2,3 კილომეტრშია; გორაზე ამავალი ბოლო მონაკვეთი გრუნტისაა და წვიმის შემდეგ ჯიპი ეკონომ-კლასზე
    უსაფრთხოა. საწვავი ბათუმში, ახალციხეში ან ქედაში ჩაასხით.
en:
  name: Zendidi Fortress
  short: >-
    A heavily ruined fortress above Keda that once guarded the Batumi–Artanuji trade road, and now stands
    inside one family's walled grounds.
  body: >-
    **You will most likely have to knock on a stranger's gate to see Zendidi: what is left of Keda's old
    guard now stands inside a private, walled family yard.**


    No one knows when the fortress was built; the reason for it is clearer. In the 7th to 9th centuries
    the main artery of the trade road between Batumi and Artanuji ran through Keda, linking the basins
    of the Adjaristsqali and the Chorokhi. Much later, in the 18th century, the geographer Vakhushti Bagrationi
    noted that the Beg of Adjara lived in Keda, which he likened to a small town. A place like that needed
    a guard, and Zendidi was it: one link in a chain of castles, with Begoshvilebi, Tsivasula, Saghoreti,
    Mtis Ubani and Chkhutuneti, that watched over both Keda and the trade roads through the valley.


    The fortress sits on a high rocky outcrop above the village that shares its name. Time has been hard
    on it. The ruin measures about 50 metres in all, with walls 110 to 130 centimetres thick, and Adjara's
    tourism office also lists remains of towers, gateways and buildings of various uses. All of it now
    lies within a private family's grounds, behind a perimeter wall, so what you see depends on whether
    the gate opens.


    It is a small stop, and an honest one: rough stone that once kept watch over the valley road you arrived
    by.
  tip: >-
    The fortress stands on private land, so call the Keda Tourist Information Centre (+995 599 90 90 93)
    before you go and ask about access. If no one is home, look at the walls from the lane and move on;
    do not climb the masonry or enter the yard uninvited. Half an hour is plenty. There are no toilets
    or cafés at the site; shops are about 2.3 km away by road in Keda, which also has its wine cellars,
    with the Makhuntseti waterfall and arched bridge further down the valley. After rain the dirt track
    up the hill turns slick.
  route: >-
    About 400 km and 6 hours 10 minutes year-round, via Batumi: the S1 (E60), S12 and S2 to Batumi, then
    up the Adjaristsqali valley on the Sh1 past Makhuntseti to Keda. In summer the Goderdzi Pass cuts
    it to 335 km and about 5 hours 50 minutes: west on the S1 (E60), south on the S8 through Borjomi to
    Akhaltsikhe, then over the pass on the Sh1 and down through Khulo and Shuakhevi to Keda. The pass
    is high and seasonal: check that it is open and that your rental contract allows it. Zendidi is about
    2.3 km by road from Keda centre; the last stretch up the hill is unpaved, and after rain an SUV is
    safer than an economy car. Fill up in Batumi, Akhaltsikhe or Keda.
ru:
  name: Крепость Зендиди
  short: >-
    Сильно разрушенная крепость над Кедой, когда-то стерёгшая торговый путь Батуми — Артануджи, а теперь
    стоящая за оградой на участке одной семьи.
  body: >-
    **Чтобы увидеть Зендиди, скорее всего, придётся постучать в чужие ворота: то, что осталось от давнего
    стража Кеды, стоит теперь в частном семейном дворе, обнесённом стеной.**


    Когда построили крепость, никто не знает; зачем — понятнее. В VII–IX веках через Кеду проходила главная
    артерия торгового пути между Батуми и Артануджи, связывавшего бассейны Аджарисцкали и Чорохи. Гораздо
    позже, в XVIII веке, географ Вахушти Багратиони отметил, что в Кеде, которую он сравнивал с небольшим
    городком, жил аджарский бег. Такому месту нужен был страж, и им стал Зендиди — одно звено в цепи замков
    вместе с Бегошвилеби, Цивасулой, Сагорети, Мтис-Убани и Чхутунети, которые охраняли и саму Кеду, и
    торговые дороги через долину.


    Крепость стоит на высоком скалистом выступе над одноимённым селом. Время обошлось с ней сурово. Руины
    тянутся в общей сложности примерно на 50 метров, толщина стен — от 110 до 130 сантиметров, а туристическое
    ведомство Аджарии упоминает также остатки башен, ворот и построек разного назначения. Всё это теперь
    находится на частном семейном участке, за оградой, так что увидите вы ровно столько, сколько позволят
    открытые или закрытые ворота.


    Остановка небольшая, но честная: грубый камень, который когда-то стерёг ту самую дорогу по долине,
    по которой вы приехали.
  tip: >-
    Крепость стоит на частной земле, поэтому перед поездкой позвоните в туристический информационный центр
    Кеды (+995 599 90 90 93) и спросите о доступе. Если дома никого нет, посмотрите на стены из переулка
    и езжайте дальше; не лазайте по кладке и не входите во двор без приглашения. Получаса хватит с лихвой.
    Туалетов и кафе на месте нет; магазины — примерно в 2,3 км по дороге, в Кеде, где есть и винные погреба,
    а ниже по долине — водопад и арочный мост Махунцети. После дождя грунтовка на холм становится скользкой.
  route: >-
    Круглый год — около 400 км и 6 часов 10 минут через Батуми: по S1 (E60), S12 и S2 до Батуми, затем
    вверх по долине Аджарисцкали по Sh1 мимо Махунцети до Кеды. Летом перевал Годердзи сокращает путь
    до 335 км и примерно 5 часов 50 минут: на запад по S1 (E60), на юг по S8 через Боржоми до Ахалцихе,
    затем по Sh1 через перевал и вниз через Хуло и Шуахеви до Кеды. Перевал высокогорный и открыт только
    в сезон: убедитесь, что он проходим и что договор проката разрешает этот маршрут. От центра Кеды до
    Зендиди около 2,3 км по дороге; последний отрезок вверх по холму без покрытия, и после дождя внедорожник
    надёжнее машины эконом-класса. Заправляйтесь в Батуми, Ахалцихе или Кеде.
fa:
  name: دژ زندیدی
  short: >-
    دژی سخت ویران بالای کدا که روزگاری از راه بازرگانی باتومی–آرتانوجی پاسداری می‌کرد و اکنون درون ملک
    دیوارکشیدهٔ یک خانواده ایستاده است.
  body: >-
    **به احتمال زیاد برای دیدن زندیدی باید درِ خانهٔ غریبه‌ای را بزنید: آنچه از نگهبان دیرین کدا مانده،
    اکنون درون حیاط دیوارکشیدهٔ خانواده‌ای است.**


    کسی نمی‌داند دژ کی ساخته شد؛ چرایی‌اش روشن‌تر است. در سده‌های هفتم تا نهم، شاهراه اصلی راه بازرگانی
    میان باتومی و آرتانوجی از کدا می‌گذشت و حوضه‌های آجاریس‌تسکالی و چوروخی را به هم می‌پیوست. بسیار دیرتر،
    در سدهٔ هجدهم، جغرافی‌دان واخوشتی باگراتیونی نوشت که بیگ آجارا در کدا می‌نشست و کدا را به شهرکی کوچک
    مانند کرد. چنین جایی نگهبان می‌خواست و زندیدی همان نگهبان بود: حلقه‌ای از زنجیرهٔ قلعه‌ها، در کنار
    بگوشویلبی، تسیواسولا، ساغورتی، متیس اوبانی و چخوتونتی، که هم کدا و هم راه‌های بازرگانی دره را می‌پاییدند.


    دژ بر برآمدگی صخره‌ای بلندی بالای روستای هم‌نامش نشسته است. زمان با آن نامهربان بوده است. ویرانه روی‌هم‌رفته
    حدود ۵۰ متر طول دارد، با دیوارهایی به ضخامت ۱۱۰ تا ۱۳۰ سانتی‌متر، و ادارهٔ گردشگری آجارا از بقایای
    برج‌ها، دروازه‌ها و بناهایی با کاربردهای گوناگون نیز نام می‌برد. همهٔ این‌ها اکنون در ملک خصوصی یک
    خانواده و پشت دیواری پیرامونی است، پس آنچه می‌بینید بسته به این است که در به رویتان باز شود یا نه.


    توقفی کوچک است، اما صادقانه: سنگی ناتراشیده که روزگاری مراقب همان جادهٔ دره‌ای بود که شما از آن آمده‌اید.
  tip: >-
    دژ در زمینی خصوصی است، پس پیش از رفتن با مرکز اطلاعات گردشگری کدا (+۹۹۵ ۵۹۹ ۹۰ ۹۰ ۹۳) تماس بگیرید
    و دربارهٔ امکان بازدید بپرسید. اگر کسی خانه نبود، دیوارها را از کوچه تماشا کنید و راهتان را ادامه
    دهید؛ از سنگ‌چین بالا نروید و بی‌دعوت وارد حیاط نشوید. نیم ساعت کاملاً کافی است. در محل نه سرویس بهداشتی
    هست و نه کافه؛ مغازه‌ها حدود ۲٫۳ کیلومتر راه دورتر، در کدا هستند، که سردابه‌های شرابش را هم دارد،
    و پایین‌تر در دره آبشار و پل طاقی ماخونتستی. پس از باران، راه خاکیِ سربالایی تپه لغزنده می‌شود.
  route: >-
    مسیر تمام‌سال، حدود ۴۰۰ کیلومتر و ۶ ساعت و ۱۰ دقیقه، از باتومی می‌گذرد: با S1 (E60)، S12 و S2 تا باتومی،
    و سپس با Sh1 در درهٔ آجاریس‌تسکالی از کنار ماخونتستی تا کدا. در تابستان گردنهٔ گودردزی راه را به ۳۳۵
    کیلومتر و حدود ۵ ساعت و ۵۰ دقیقه کوتاه می‌کند: با S1 (E60) رو به غرب، با S8 رو به جنوب از راه بورجومی
    تا آخالتسیخه، سپس با Sh1 از گردنه و در سرازیری از راه خولو و شواخوی تا کدا. گردنه مرتفع و فصلی است:
    مطمئن شوید باز است و قرارداد اجارهٔ خودرویتان عبور از آن را مجاز می‌داند. زندیدی از مرکز کدا حدود
    ۲٫۳ کیلومتر راه زمینی فاصله دارد؛ تکهٔ آخرِ سربالایی تپه آسفالت نیست و پس از باران خودروی شاسی‌بلند
    از خودروی اقتصادی مطمئن‌تر است. در باتومی، آخالتسیخه یا کدا باک را پر کنید.
he:
  name: מבצר זנדידי
  short: מבצר הרוס ברובו מעל קדה, ששמר פעם על דרך המסחר בטומי–ארטנוג'י ועומד היום בתוך חצר מגודרת של משפחה
    אחת.
  body: >-
    **כדי לראות את זנדידי כנראה תצטרכו לדפוק על שער של זרים: מה שנותר מהשומר הקדום של קדה עומד היום בתוך
    חצר משפחתית פרטית מוקפת חומה.**


    איש אינו יודע מתי נבנה המבצר; הסיבה לבנייתו ברורה יותר. במאות ה-7 עד ה-9 עבר דרך קדה העורק הראשי של
    דרך המסחר בין בטומי לארטנוג'י, שחיברה בין אגני האג'ריסצקאלי והצ'ורוחי. הרבה אחר כך, במאה ה-18, ציין
    הגאוגרף וחושטי בגרטיוני ששליט אג'ריה, הבג, התגורר בקדה, שאותה השווה לעיירה קטנה. מקום כזה היה זקוק
    לשומר, וזנדידי היה השומר: חוליה אחת בשרשרת מבצרים, לצד בגושווילבי, ציווסולה, סאגורטי, מטיס אובני וצ'חוטונטי,
    שהשגיחו הן על קדה והן על דרכי המסחר שעברו בעמק.


    המבצר יושב על שלוחה סלעית גבוהה מעל הכפר הנושא את שמו. הזמן לא חס עליו. אורכה הכולל של החורבה כ-50
    מטרים, ועובי חומותיה 110 עד 130 סנטימטרים; משרד התיירות של אג'ריה מציין גם שרידים של מגדלים, שערים
    ומבנים לשימושים שונים. כל אלה נמצאים היום בשטח פרטי של משפחה, מאחורי חומה היקפית, כך שמה שתראו תלוי
    בשאלה אם השער ייפתח.


    זו עצירה קטנה, וכנה: אבן גסה ששמרה פעם על דרך העמק שבה הגעתם.
  tip: >-
    המבצר נמצא על קרקע פרטית, ולכן לפני היציאה התקשרו למרכז המידע לתיירים של קדה (+995 599 90 90 93) ושאלו
    על אפשרות הגישה. אם אין איש בבית, הביטו בחומות מהסמטה והמשיכו בדרככם; אל תטפסו על הבנייה ואל תיכנסו
    לחצר בלי הזמנה. חצי שעה די והותר. במקום אין שירותים ולא בתי קפה; חנויות יש במרחק כ-2.3 ק״מ בדרך, בקדה,
    שבה גם מרתפי היין, ובהמשך העמק כלפי מטה נמצאים המפל והגשר המקומר של מאחונצטי. אחרי גשם דרך העפר במעלה
    הגבעה נעשית חלקלקה.
  route: >-
    כל השנה — כ-400 ק״מ וכ-6 שעות ו-10 דקות דרך בטומי: בכבישים S1 (E60),‏ S12 ו-S2 עד בטומי, ומשם במעלה
    עמק האג'ריסצקאלי בכביש Sh1 על פני מאחונצטי עד קדה. בקיץ מעבר גודרדזי מקצר את הדרך ל-335 ק״מ וכ-5 שעות
    ו-50 דקות: מערבה בכביש S1 (E60), דרומה בכביש S8 דרך בורג'ומי לאחלציחה, ואז מעל המעבר בכביש Sh1 ובירידה
    דרך חולו ושואחבי עד קדה. המעבר גבוה ועונתי: בדקו שהוא פתוח ושחוזה ההשכרה שלכם מתיר לנסוע בו. זנדידי
    נמצא כ-2.3 ק״מ בדרך ממרכז קדה; הקטע האחרון במעלה הגבעה אינו סלול, ואחרי גשם רכב שטח בטוח יותר מרכב
    חסכוני. תדלקו בבטומי, באחלציחה או בקדה.
ar:
  name: حصن زينديدي
  short: >-
    حصن متهدّم إلى حدّ بعيد فوق كيدا، كان يحرس يوماً طريق التجارة بين باتومي وأرتانوجي، ويقوم اليوم داخل
    أرض مسوّرة تملكها عائلة واحدة.
  body: >-
    **على الأرجح ستضطر إلى طرق بوابة غرباء لترى زينديدي: فما تبقّى من حارس كيدا القديم يقوم اليوم داخل
    فناء عائلي خاص يحيط به سور.**


    لا أحد يعرف متى بُني الحصن؛ أما سبب بنائه فأوضح. ففي القرون من السابع إلى التاسع كان الشريان الرئيسي
    لطريق التجارة بين باتومي وأرتانوجي يمر عبر كيدا، رابطاً حوضي نهري أدجاريستسكالي وتشوروخي. وبعد ذلك
    بكثير، في القرن الثامن عشر، ذكر الجغرافي فاخوشتي باغراتيوني أن بيك أدجارا يقيم في كيدا، وشبّهها ببلدة
    صغيرة. مكان كهذا كان بحاجة إلى حارس، وكان زينديدي هو ذلك الحارس: حلقة في سلسلة من القلاع، مع بيغوشفيليبي
    وتسيفاسولا وساغوريتي ومتيس أوباني وتشخوتونيتي، كانت تحرس كيدا وطرق التجارة العابرة للوادي معاً.


    يجثم الحصن على نتوء صخري مرتفع فوق القرية التي تحمل اسمه. وقد قسا عليه الزمن. يبلغ طول الأطلال كلها
    نحو 50 متراً، بجدران تتراوح سماكتها بين 110 و130 سنتيمتراً، ويذكر مكتب السياحة في أدجارا أيضاً بقايا
    أبراج وبوابات ومبانٍ لأغراض مختلفة. وكل ذلك يقع اليوم ضمن أرض عائلة خاصة، خلف سور محيط، فما ستراه
    يتوقف على ما إذا كانت البوابة ستُفتح لك.


    إنها محطة صغيرة، لكنها صادقة: حجر خشن كان يوماً يحرس طريق الوادي الذي جئت منه.
  tip: >-
    يقع الحصن على أرض خاصة، لذا اتصل قبل الذهاب بمركز المعلومات السياحية في كيدا (+995 599 90 90 93) واسأل
    عن إمكانية الدخول. إن لم يكن أحد في البيت، فتأمّل الأسوار من الزقاق وتابع طريقك؛ لا تتسلق البناء الحجري
    ولا تدخل الفناء دون دعوة. نصف ساعة أكثر من كافية. لا دورات مياه ولا مقاهي في الموقع؛ المتاجر على بعد
    نحو 2.3 كم بالطريق في كيدا، التي تضم أيضاً أقبية النبيذ، وأبعد منها في أسفل الوادي شلال ماخونتسيتي
    والجسر المقوّس. بعد المطر يصبح الدرب الترابي الصاعد إلى التل زلقاً.
  route: >-
    على مدار السنة، نحو 400 كم وقرابة 6 ساعات و10 دقائق عبر باتومي: على S1 (E60) وS12 وS2 حتى باتومي،
    ثم صعوداً في وادي أدجاريستسكالي على Sh1 مروراً بماخونتسيتي حتى كيدا. وفي الصيف يختصر ممر غودردزي الطريق
    إلى 335 كم ونحو 5 ساعات و50 دقيقة: غرباً على S1 (E60)، ثم جنوباً على S8 عبر بورجومي إلى أخالتسيخه،
    ثم عبر الممر على Sh1 نزولاً عبر خولو وشواخيفي إلى كيدا. الممر مرتفع وموسمي: تأكد أنه مفتوح وأن عقد
    استئجار سيارتك يسمح بعبوره. يبعد زينديدي نحو 2.3 كم بالطريق عن مركز كيدا؛ والمقطع الأخير الصاعد إلى
    التل غير معبّد، وبعد المطر تكون سيارة رباعية الدفع أكثر أماناً من السيارة الاقتصادية. تزوّد بالوقود
    في باتومي أو أخالتسيخه أو كيدا.
