ka:
  name: ბათუმის თევზის ბაზარი
  short: >-
    ბაქოს ქუჩაზე, პორტთან, შავი ზღვის თევზს ყინულიდან თავად არჩევთ და გვერდით შესაწვავად მიგაქვთ: ბათუმური
    სადილი, რომელიც დახლთან იწყება.
  body: >-
    **ბათუმის თევზის ბაზარში სადილი არჩევანით იწყება, რომელსაც საკუთარი თვალით აკეთებთ.** ბაქოს ქუჩის
    27 ნომერში მდგარი დარბაზი პორტთან და საბაჟოს ღობესთან ახლოს, ქალაქის ტურისტული ცენტრიდან მოშორებითაა.
    გრძელ დახლებზე დამსხვრეული ყინული ყრია, ყინულზე კი ის აწყვია, რაც იმ დღეს შავმა ზღვამ და თევზის მეურნეობებმა
    გაიმეტეს.


    წესის სასწავლად ერთი ვიზიტი კმარა. რიგებს ჩაუყვებით, ირჩევთ, აწონინებთ, იხდით. გამყიდველი თევზს რამდენიმე
    ლარად — კილოგრამის მიხედვით — გაგიფხეკთ და გაგიწმენდთ. მერე წყლიან პარკს რამდენიმე ნაბიჯზე, ბაზარზე
    მიშენებულ ერთ-ერთ პატარა რესტორანში შეიტანთ, სადაც მზარეულები მცირე საფასურად შეგიწვავენ და პურთან,
    სალათთან და ღვინის ჭიქასთან ერთად ისე მოგიტანენ, რომ ზეთი ჯერ კიდევ შიშინებს.


    დახლებზე ეძებეთ ბარაბულა — ადგილობრივების რჩეული, პატარა, მოვარდისფრო-ოქროსფერი თევზი; ვერცხლისფერ
    გროვებად დაყრილი ქაფშია; ბრტყელი კამბალა; მერლანგი; მდინარის მეურნეობების კალმახი. დანარჩენ ადგილს
    იმპორტული დორადო, ლავრაკი, ორაგული და კრევეტები იკავებს. ადგილობრივები ლაყუჩებს ამოწმებენ — კაშკაშა
    წითელი უნდა იყოს — და თვალებს, რომლებიც გამჭვირვალე უნდა ჰქონდეს; ფასზე ვაჭრობა კი აქ ზრდილობის ნაწილია.


    აქ არავინ იჩემებს, რომ მუზეუმში ხართ. იატაკი სველია, სუნი ავტოსადგომშივე გეგებებათ, ხმად კი დაფებზე
    დანების კაკუნი და დახლებს შორის გადაძახილი ფასები ისმის. სწორედ ამიტომ ღირს აქ გადახვევა: ეს ის ადგილია,
    სადაც ბათუმი საკუთარ სუფრას აწყობს და სტუმრებისთვის სპექტაკლს არ დგამს.


    ბაზრიდან ზღვის სუსტი სუნით გამოდიხართ — ბათუმში ეს ყველაზე ცუდი სუვენირი როდია.
  tip: >-
    ბაზარი ყოველდღე მუშაობს, დაახლოებით 10:00-დან 20:00-მდე; არჩევანი დილითაა საუკეთესო, სანამ დახლები
    დაცარიელდება. გზამკვლევები შეწვის ფასად 5–10 ლარს ასახელებენ, გაწმენდისთვის კი კილოზე 3–5 ლარს, მაგრამ
    ფასები იცვლება — ამიტომ შეთანხმდით, სანამ თევზი ტაფაში ჩავა. თევზი წონით იყიდება: თუ მხოლოდ გასინჯვა
    გინდათ, ცოტა ითხოვეთ. ნაღდი ფული იქონიეთ, ბარათს ყველა დახლთან არ იღებენ, და ისეთი ფეხსაცმელი ჩაიცვით,
    რომლის დასველებაც არ გენანებათ. პარკინგი მწირია: შენობის უკან თხუთმეტამდე ადგილია, კიდევ რამდენიმე
    — საბაჟოს ღობესთან; შუადღისთვის ჩვეულებრივ ივსება.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, რიკოთის გვირაბებისა და ქუთაისის გავლით სამტრედიამდე
    იარეთ, შემდეგ ს12-ით (E692) ლანჩხუთის გავლით გრიგოლეთამდე, ზღვის პირას, იქიდან კი ს2-ით სამხრეთით,
    ქობულეთის გავლით, ბათუმამდე — დაახლოებით 374 კმ და ხუთნახევარი საათი, მთელ გზაზე ასფალტი და ბენზინგასამართი
    სადგურები. ბაზარი ბაქოს ქუჩის 27 ნომერშია, ქალაქის მთავარ შესასვლელ გზაზე, პორტის გვერდით, ამიტომ
    ცენტრამდე ჯერ მას ჩაუვლით; ნავიგატორში „Batumi Fish Market“ აკრიფეთ. ეკონომ-კლასის მანქანა სავსებით
    საკმარისია.
en:
  name: Batumi Fish Market
  short: >-
    On Baku Street by the port you pick your Black Sea fish off the ice and carry it next door to be fried:
    a Batumi meal that starts at the counter.
  body: >-
    **At Batumi's fish market, the meal begins with a choice you make with your own eyes.** The hall at
    27 Baku Street stands out by the port and the customs fence, well away from the postcard centre, and
    its long counters are heaped with crushed ice. On the ice lies whatever the Black Sea and the fish
    farms have given up that day.


    The system takes one visit to learn. You walk the rows, choose, have it weighed, pay. The stallholder
    will gut and clean your fish for a few lari a kilo. Then you carry the dripping bag a few steps to
    one of the small restaurants built against the market, where the cooks fry it for a modest fee and
    bring it back with bread, salad and a glass of wine, the oil still spitting.


    Look for red mullet, the local favourite, small and rosy gold; anchovy, or khamsi, in silver heaps;
    flat flounder; whiting; trout from the river farms. Imported dorado, sea bass, salmon and prawns fill
    out the rest. Locals check the gills, which should be bright red, and the eyes, which should be clear,
    and they haggle over the price as a matter of form.


    Nobody pretends this is a museum. The floor is wet, the smell meets you in the car park, and the soundtrack
    is knives on boards and prices called across the counters. That is exactly why it is worth the detour:
    this is where Batumi buys its own supper, not where it performs for visitors.


    You leave smelling faintly of the sea, which, in Batumi, is not the worst souvenir.
  tip: >-
    Open daily, roughly 10:00–20:00; the choice is best in the morning, before the counters are picked
    over. Guides quote about 5–10 GEL for frying and 3–5 GEL a kilo for cleaning, but prices move, so
    agree them before your fish goes into the pan. Fish is sold by weight — ask for a small amount if
    you only want a taste. Bring cash, as not every stall takes cards, and shoes you do not mind getting
    wet. Parking is tight: about fifteen spaces behind the building and a few more by the customs fence,
    usually full by midday.
  route: >-
    From Tbilisi take the S1 (E60) west through the Rikoti tunnels and past Kutaisi to Samtredia, then
    the S12 (E692) through Lanchkhuti to the coast at Grigoleti, and the S2 south through Kobuleti into
    Batumi: about 374 km and roughly 5½ hours, asphalt all the way with fuel stations throughout. The
    market is at 27 Baku Street, on the main road into the city beside the port, so you reach it before
    the centre; type "Batumi Fish Market" into the navigator. An economy car is all you need.
ru:
  name: Рыбный рынок Батуми
  short: >-
    На улице Баку, у порта, вы сами выбираете черноморскую рыбу со льда и несёте её по соседству, чтобы
    там её пожарили: батумский обед начинается у прилавка.
  body: >-
    **На рыбном рынке Батуми обед начинается с выбора, который вы делаете собственными глазами.** Зал
    на улице Баку, 27, стоит у порта и таможенной ограды, в стороне от открыточного центра, а на его длинных
    прилавках навален колотый лёд. На льду лежит всё, что за этот день отдали Чёрное море и рыбные хозяйства.


    Систему достаточно понять один раз. Вы проходите ряды, выбираете, взвешиваете, платите. Продавец за
    несколько лари с килограмма почистит и выпотрошит вашу рыбу. Затем вы несёте мокрый пакет несколько
    шагов — в один из маленьких ресторанчиков, пристроенных к рынку, где повара за скромную плату обжарят
    её и подадут обратно с хлебом, салатом и стаканом вина, пока масло ещё шипит.


    Ищите барабулю — местную любимицу, маленькую, розово-золотистую; анчоуса, или хамси, серебристыми
    горками; плоскую камбалу; мерланга; форель с речных хозяйств. Остальное место занимают привозные дорадо,
    сибас, лосось и креветки. Местные проверяют жабры, которые должны быть ярко-красными, и глаза, которые
    должны быть прозрачными, а торг о цене здесь — своего рода этикет.


    Никто здесь не делает вид, что это музей. Пол мокрый, запах встречает вас уже на парковке, а музыкальным
    сопровождением служит стук ножей по доскам и цены, которые выкрикивают через прилавки. Именно поэтому
    сюда стоит завернуть: это место, где Батуми покупает собственный ужин, а не разыгрывает спектакль
    для гостей.


    Вы уходите со слабым запахом моря — а в Батуми это не худший сувенир.
  tip: >-
    Открыт ежедневно, приблизительно с 10:00 до 20:00; выбор лучше утром, до того как прилавки опустеют.
    Путеводители называют 5–10 лари за обжарку и 3–5 лари с килограмма за чистку, но цены меняются, так
    что договоритесь заранее, прежде чем рыба попадёт на сковороду. Рыбу продают на вес — если хотите
    только попробовать, попросите немного. Возьмите наличные, карту принимают не везде, и обувь, которую
    не жаль замочить. С парковкой туго: около пятнадцати мест за зданием и ещё несколько у таможенной
    ограды, обычно занятых уже к полудню.
  route: >-
    От Тбилиси по S1 (E60) на запад через Рикотские тоннели и Кутаиси до Самтредиа, затем по S12 (E692)
    через Ланчхути до побережья у Григолети, а по S2 на юг через Кобулети в Батуми: около 374 км и примерно
    5,5 часа, всё по асфальту, заправки на всём пути. Рынок находится на улице Баку, 27, на главной дороге
    в город рядом с портом, так что вы доберётесь до него раньше центра; введите в навигаторе «Batumi
    Fish Market». Хватит любой машины экономкласса.
fa:
  name: بازار ماهی باتومی
  short: >-
    در خیابان باکو، کنار بندر، ماهی دریای سیاه را خودتان از روی یخ برمی‌گزینید و به رستوران کناری می‌برید
    تا سرخش کنند: ناهاری باتومی که از پیشخوان آغاز می‌شود.
  body: >-
    **در بازار ماهی باتومی، غذا با انتخابی آغاز می‌شود که با چشمان خودتان انجام می‌دهید.** سالن در خیابان
    باکو شمارهٔ ۲۷ کنار بندر و حصار گمرک ایستاده، دور از مرکز کارت‌پستالی شهر، و پیشخوان‌های بلندش پر
    از یخ خردشده است. بر یخ هرچه دریای سیاه و مزارع پرورش ماهی آن روز داده‌اند، چیده شده.


    روش کار با یک بار آمدن آموخته می‌شود. از میان ردیف‌ها می‌گذرید، انتخاب می‌کنید، وزن می‌کنند، پول می‌دهید.
    فروشنده کیلویی چند لاری می‌گیرد و شکم ماهی‌تان را خالی و پاکش می‌کند. سپس کیسهٔ چکه‌کننده را چند گام
    دورتر، به یکی از رستوران‌های کوچک ساخته‌شده کنار بازار می‌برید، جایی که آشپزها به هزینه‌ای اندک آن
    را سرخ می‌کنند و همراه با نان، سالاد و جامی شراب برمی‌گردانند، درحالی‌که روغن هنوز جلز و ولز می‌کند.


    به‌دنبال بزماهی (بارابولیا) باشید — محبوب اهالی، کوچک و صورتی‌طلایی؛ آنچوی، یا خامسی، در انبوه‌های
    نقره‌ای؛ کفشک‌ماهیِ پهن؛ ماهی مرلان؛ قزل‌آلای مزارع رودخانه‌ای. باقی جا را دورادو، باس دریایی، سالمون
    و میگوی وارداتی پر می‌کند. اهالی محلی آبشش‌ها را که باید سرخ روشن باشند و چشم‌ها را که باید شفاف باشند
    وارسی می‌کنند، و چانه‌زدن بر قیمت اینجا رسمی از ادب است.


    هیچ‌کس وانمود نمی‌کند که این‌جا موزه است. کف خیس است، بو از همان پارکینگ به استقبالتان می‌آید، و موسیقی
    زمینه صدای کارد بر تخته و قیمت‌هایی است که میان پیشخوان‌ها فریاد می‌شوند. دقیقاً به همین دلیل ارزش
    این انحراف از مسیر را دارد: اینجا جایی است که باتومی شام خودش را می‌خرد، نه جایی که برای گردشگران
    نمایش می‌دهد.


    با بویی ملایم از دریا بیرون می‌روید — و در باتومی، این بدترین یادگاری نیست.
  tip: >-
    بازار هر روز، تقریباً از ۱۰:۰۰ تا ۲۰:۰۰ باز است؛ انتخاب صبح‌ها بهتر است، پیش از آن‌که پیشخوان‌ها خالی
    شوند. راهنماها هزینهٔ سرخ‌کردن را ۵ تا ۱۰ لاری و پاک‌کردن را کیلویی ۳ تا ۵ لاری ذکر می‌کنند، اما قیمت‌ها
    تغییر می‌کنند، پس پیش از آن‌که ماهی به تابه برود، سرِ آن توافق کنید. ماهی وزنی فروخته می‌شود: اگر
    فقط می‌خواهید بچشید، مقدار کمی بخواهید. پول نقد همراه داشته باشید، چون همهٔ غرفه‌ها کارت نمی‌پذیرند،
    و کفشی بپوشید که از خیس‌شدنش نگران نباشید. پارکینگ تنگ است: حدود پانزده جا پشت ساختمان و چند جای دیگر
    کنار حصار گمرک، که معمولاً تا ظهر پر می‌شود.
  route: >-
    از تفلیس با S1 (E60) به سوی غرب، از تونل‌های ریکوتی و کنار کوتایسی تا سامتردیا، سپس با S12 (E692)
    از میان لانچخوتی تا ساحل در گریگولتی، و با S2 به سوی جنوب از میان کوبولتی تا باتومی: حدود ۳۷۴ کیلومتر
    و نزدیک به پنج ساعت و نیم، همه بر آسفالت، با پمپ بنزین در تمام طول مسیر. بازار در خیابان باکو شمارهٔ
    ۲۷ است، بر راه اصلی ورود به شهر کنار بندر، پس پیش از مرکز شهر به آن می‌رسید؛ در مسیریاب «Batumi Fish
    Market» را وارد کنید. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: שוק הדגים של בטומי
  short: >-
    ברחוב באקו, לצד הנמל, בוחרים בעצמכם דג מהים השחור מעל הקרח ונושאים אותו למסעדה הסמוכה לטיגון: ארוחה
    בבטומי שמתחילה בדלפק.
  body: >-
    **בשוק הדגים של בטומי, הארוחה מתחילה בבחירה שעושים בעיניים שלכם.** האולם ברחוב באקו 27 ניצב לצד הנמל
    וגדר המכס, הרחק ממרכז העיר של הגלויות. הדלפקים הארוכים שלו עמוסים בקרח כתוש. על הקרח מוטל כל מה שהים
    השחור וחוות הדגים העלו באותו יום.


    השיטה נלמדת בביקור אחד. הולכים בין השורות, בוחרים, שוקלים, משלמים. הדוכנן ינקה את הדג שלכם ויוציא
    את קרביו תמורת כמה לארי לקילו. אז אתם נושאים את השקית המטפטפת כמה צעדים לאחת המסעדות הקטנות הבנויות
    בצמוד לשוק, שם הטבחים מטגנים אותו בתשלום צנוע ומחזירים אותו עם לחם, סלט וכוס יין, השמן עדיין רוחש.


    חפשו ברבוניה, האהובה המקומית, קטנה וזהובה-אדמדמה; אנשובי, או חמסי, בערמות כסופות; דג משה רבנו שטוח;
    מרלן; פורל מחוות הנחלים. השאר תופסים דורדו מיובא, לברק, סלמון ושרימפס. תושבים מקומיים בודקים את הזימים,
    שאמורים להיות אדומים בוהקים, ואת העיניים, שאמורות להיות צלולות, ומתמקחים על המחיר כעניין של נוהג.


    המקום לא מתיימר להיות מוזיאון. הרצפה רטובה, הריח פוגש אתכם עוד בחניון, והפסקול הוא סכינים על קרשים
    ומחירים שנקראים בין הדלפקים. ובדיוק בגלל זה שווה לסטות מהדרך: זה המקום שבו בטומי קונה את ארוחת הערב
    של עצמה, לא המקום שבו היא מציגה מופע למבקרים.


    יוצאים עם ריח קלוש של הים, ובבטומי זה לא המזכרת הגרועה ביותר.
  tip: >-
    פתוח כל יום, בקירוב 10:00–20:00; הבחירה הטובה ביותר בבוקר, לפני שהדלפקים מתרוקנים. מדריכים מציינים
    כ-5 עד 10 לארי לטיגון ו-3 עד 5 לארי לקילו לניקוי, אך המחירים משתנים, אז הסכימו עליהם לפני שהדג נכנס
    למחבת. דגים נמכרים לפי משקל — בקשו כמות קטנה אם רק רוצים לטעום. הביאו מזומן, לא כל הדוכנים מקבלים
    כרטיסים, ונעליים שלא תצטערו על הרטבתן. החניה צפופה: כ-15 מקומות מאחורי הבניין ועוד כמה לצד גדר המכס,
    שלרוב מתמלאים עד הצהריים.
  route: >-
    מטביליסי בכביש S1 (E60) מערבה, דרך מנהרות ריקוטי ולצד קוטאיסי עד סמטרדיה, אחר כך S12 (E692) דרך לנצ'חוטי
    עד לחוף בגריגולטי, ו-S2 דרומה דרך קובולטי לבטומי: כ-374 ק"מ וכחמש שעות וחצי, כולה באספלט, ותחנות דלק
    לאורך כל הדרך. השוק נמצא ברחוב באקו 27, על הדרך המרכזית לעיר לצד הנמל, כך שתגיעו אליו לפני המרכז;
    הזינו בניווט "Batumi Fish Market". כל רכב חסכוני רגיל יספיק בהחלט.
ar:
  name: سوق السمك في باتومي
  short: >-
    في شارع باكو، قرب الميناء، تختار سمك البحر الأسود بنفسك من فوق الثلج وتحمله إلى المطعم المجاور ليُقلى:
    وجبة باتومية تبدأ من أمام الطاولة.
  body: >-
    **في سوق السمك في باتومي، تبدأ الوجبة باختيار تصنعه بعينيك.** تبرز القاعة في شارع باكو رقم 27 قرب
    الميناء وسياج الجمارك، بعيدًا عن مركز المدينة الذي يزيّن البطاقات البريدية، وتُكسى طاولاتها الطويلة
    بالثلج المجروش. وعلى الثلج يرقد كل ما جاد به البحر الأسود ومزارع الأسماك في ذلك اليوم.


    يكفي زيارة واحدة لتعلم النظام. تمشي بين الصفوف، تختار، يُوزَن لك، تدفع. سيشقّ البائع سمكتك وينظّفها
    مقابل بضعة لاري للكيلوغرام. ثم تحمل الكيس المتقطر خطوات قليلة إلى أحد المطاعم الصغيرة المبنية إلى
    جانب السوق، حيث يقليها الطهاة بأجر متواضع ويعيدونها إليك مع الخبز والسلطة وكأس نبيذ، والزيت لا يزال
    يفرقع.


    ابحث عن سمك البربوني، المفضّل محليًا، صغير ووردي مذهّب؛ والأنشوجة، أو الخامسي، في أكوام فضية؛ وسمك
    موسى المفلطح؛ والميرلان؛ وسمك التراوت من مزارع الأنهار. أما الباقي فتشغله الدورادو المستوردة وسمك
    القاروص والسلمون والقريدس. يتفقّد السكان المحليون الخياشيم التي يجب أن تكون حمراء زاهية، والعينين
    اللتين يجب أن تكونا صافيتين، والمساومة على السعر هنا مسألة تقليد لا أكثر.


    لا أحد هنا يدّعي أن المكان متحف. الأرض مبتلة، والرائحة تستقبلك من موقف السيارات، والموسيقى الخلفية
    هي طقطقة السكاكين على الألواح والأسعار المتبادلة صياحًا بين الطاولات. ولهذا بالضبط يستحق المكان أن
    تنحرف إليه عن طريقك: هذا هو المكان الذي تشتري فيه باتومي عشاءها الخاص، لا المكان الذي تقدّم فيه عرضًا
    للزوار.


    تخرج برائحة خفيفة من البحر، وهي في باتومي ليست أسوأ التذكارات.
  tip: >-
    يفتح السوق يوميًا، من نحو الساعة 10:00 حتى 20:00؛ الاختيار أفضل في الصباح، قبل أن تفرغ الطاولات. تذكر
    أدلة السفر أجرة قلي تتراوح بين 5 و10 لاري وأجرة تنظيف بين 3 و5 لاري للكيلوغرام، لكن الأسعار تتغير،
    فاتفق عليها قبل أن توضع السمكة في المقلاة. يُباع السمك بالوزن — اطلب كمية صغيرة إن كنت تريد التذوق
    فقط. احمل نقدًا، فليست كل البسطات تقبل البطاقات، وانتعل حذاءً لا يهمك أن يتبلل. المواقف ضيقة: نحو
    خمسة عشر مكانًا خلف المبنى وأخرى قليلة قرب سياج الجمارك، وتمتلئ عادة قبل الظهر.
  route: >-
    من تبليسي على الطريق S1 (E60) غربًا عبر أنفاق ريكوتي وبمحاذاة كوتايسي حتى سامتريديا، ثم S12 (E692)
    عبر لانتشخوتي إلى الساحل عند غريغوليتي، ثم S2 جنوبًا عبر كوبوليتي إلى باتومي: نحو 374 كم وحوالي 5
    ساعات ونصف، كلها على أسفلت، مع محطات وقود طوال الطريق. يقع السوق في شارع باكو رقم 27، على الطريق الرئيسي
    المؤدي إلى المدينة قرب الميناء، فتصله قبل الوصول إلى المركز؛ أدخل في جهاز التوجيه «Batumi Fish Market».
    سيارة اقتصادية عادية كافية تمامًا.
