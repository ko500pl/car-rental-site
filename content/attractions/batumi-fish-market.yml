ka:
  name: ბათუმის თევზის ბაზარი
  short: ადგილობრივი ინსტიტუცია პორტთან — თევზს დახლზე ირჩევ, გვერდით რესტორანში კი რამდენიმე ლარად შეგიწვავენ.
  body: >-
    **ბათუმის თევზის ბაზარი ის ადგილია, სადაც ვახშამი დახლიდან იწყება.** სქემა მარტივი და გენიალურია:
    ბაზრის დარბაზში ირჩევ თევზს — დილით დაჭერილს, ყინულზე დაწყობილს — და გვერდით მდგომ რესტორნებში მიგაქვს,
    სადაც 5-10 ლარად გიწმენდენ და გიწვავენ. ათ წუთში მაგიდაზე გიდგას ის, რაც ხელით აარჩიე.


    დახლებზე შავი ზღვის სეზონური ნადავლია: ბარაბულია (აქაური ვარსკვლავი), კეფალი, ქაფშია, ქამბალა, მერლანგი;
    გვერდით — იმპორტული დორადო, სიბასი და კრევეტები. ფასები დამამშვიდებელია: ბარაბულია კილო 20-25 ლარი,
    კეფალი 15-20. გაწმენდა ცალკე ღირს, კილოზე 3-5 ლარი.


    ეს ტურისტული ატრაქციონი კი არა, მოქმედი ბაზარია — პორტის უბანში, სველი იატაკით და თევზის მძაფრი სუნით.
    სწორედ ეს არის მისი ხიბლი: აქ ბათუმელები საკუთარ სუფრას აწყობენ. ბაზარი ყოველდღე მუშაობს, დაახლოებით
    10:00-20:00. საუკეთესო არჩევანი დილითაა, სანამ დღის ჭერილი დაიშლება. სექტემბერ-ოქტომბერში, ქაფშიის
    სეზონზე, ბაზარი განსაკუთრებით ცოცხლდება.
  tip: >-
    დილით მიდი — არჩევანი მაშინ საუკეთესოა. თევზი ისე აარჩიე, როგორც ადგილობრივები: ღია წითელი ლაყუჩები,
    გამჭვირვალე თვალები. ფასზე ვაჭრობა ნორმალურია. შეწვა 5-10 ლარია, გაწმენდა კილოზე 3-5; რესტორნებში
    ღვინო და სალათებიც აქვთ. ნაღდი ფული იქონიე, ბარათს ყველგან არ იღებენ. სველ იატაკს და მძაფრ სუნს ნუ
    შეუშინდები — ეს ავთენტურობის ნაწილია.
  route: >-
    თბილისიდან ბათუმამდე E60/S1 მაგისტრალით: რიკოთი, ქუთაისის შემოვლითი, შემდეგ სანაპირო ქობულეთის გავლით
    — დაახლოებით 374 კმ, 5:30 სთ, ბოლომდე ასფალტი, საწვავი მთელ გზაზე. ბაზარი ცენტრიდან მოშორებით, პორტის
    მხარეს არის, ბაქოს ქუჩა 27-ზე — ქალაქში შესვლისას ნავიგატორში „Batumi Fish Market" აკრიფე. მანქანით
    მისვლა მოსახერხებელია: შესასვლელთან რამდენიმე ათეული უფასო ადგილია, თუმცა შუადღისას ივსება. ეკონომ-კლასი
    სავსებით საკმარისია.
en:
  name: Batumi Fish Market
  short: >-
    A local institution near the port — pick your fish at the counter and the restaurant next door fries
    it for a few lari.
  body: >-
    **At the Batumi fish market, dinner starts at the counter.** The system is simple and brilliant: you
    choose your fish in the market hall — morning-caught, laid out on ice — and carry it to the restaurants
    next door, where for 5-10 GEL they clean and fry it. Ten minutes later, the fish you picked out by
    hand is on your table.


    The stalls carry the Black Sea's seasonal haul: red mullet (the local star), grey mullet, anchovy,
    flounder and whiting, with imported dorado, sea bass and shrimp alongside. Prices are reassuring:
    red mullet runs 20-25 GEL per kilo, grey mullet 15-20. Cleaning costs extra, around 3-5 GEL per kilo.


    This is not a tourist attraction but a working market in the port district, complete with wet floors
    and a punchy smell of fish — and that is precisely the charm: this is where Batumi shops for its own
    table. It operates daily, roughly 10:00-20:00. The best selection is in the morning, before the day's
    catch gets picked over. In September-October, anchovy season, the place gets especially lively.
  tip: >-
    Go in the morning for the best choice. Pick fish like the locals do: bright red gills, clear eyes.
    Haggling is normal. Frying costs 5-10 GEL, cleaning 3-5 GEL per kilo; the restaurants also serve wine
    and salads. Carry cash — cards are not accepted everywhere. Do not be put off by wet floors and the
    strong smell: that is part of the authenticity.
  route: >-
    From Tbilisi take the E60/S1 to Batumi: Rikoti tunnels, the Kutaisi bypass, then the coast road through
    Kobuleti — about 374 km and 5:30 of driving, asphalt throughout, fuel all along the way. The market
    sits away from the centre on the port side of town, at 27 Baku Street — as you enter the city, put
    "Batumi Fish Market" into the navigator. Arriving by car is convenient: there are a couple of dozen
    free spaces by the entrance, though they fill by midday. An economy car is entirely sufficient.
ru:
  name: Рыбный рынок Батуми
  short: >-
    Местная институция у порта — выбираете рыбу на прилавке, а в ресторане по соседству её жарят за несколько
    лари.
  body: >-
    **На рыбном рынке Батуми ужин начинается с прилавка.** Схема проста и гениальна: вы выбираете рыбу
    в торговом зале — утреннего улова, разложенную на льду — и несёте её в соседние рестораны, где за
    5-10 лари её почистят и пожарят. Через десять минут рыба, которую вы выбрали своими руками, стоит
    на столе.


    На прилавках — сезонный черноморский улов: барабулька (местная звезда), кефаль, хамса, камбала, мерланг,
    а рядом привозные дорадо, сибас и креветки. Цены успокаивающие: барабулька 20-25 лари за кило, кефаль
    15-20. Чистка оплачивается отдельно, 3-5 лари за килограмм.


    Это не туристический аттракцион, а работающий рынок в портовом районе — с мокрыми полами и крепким
    рыбным духом. В этом и прелесть: здесь Батуми закупается для собственного стола. Рынок открыт ежедневно,
    примерно с 10:00 до 20:00. Лучший выбор — утром, пока дневной улов не разобрали. В сентябре-октябре,
    в сезон хамсы, рынок особенно оживает.
  tip: >-
    Приходите утром — выбор лучший именно тогда. Выбирайте рыбу как местные: ярко-красные жабры, прозрачные
    глаза. Торговаться нормально. Жарка стоит 5-10 лари, чистка 3-5 лари за кило; в ресторанах есть вино
    и салаты. Возьмите наличные — карты принимают не везде. Не пугайтесь мокрых полов и резкого запаха:
    это часть аутентичности.
  route: >-
    Из Тбилиси — по E60/S1 до Батуми: Рикотские тоннели, объезд Кутаиси, затем побережье через Кобулети
    — около 374 км и 5:30 езды, асфальт на всём пути, заправки повсюду. Рынок находится в стороне от центра,
    в портовой части города, на улице Баку, 27 — при въезде в город вбейте в навигатор «Batumi Fish Market».
    На машине удобно: у входа пара десятков бесплатных мест, но к полудню они заняты. Эконом-класса вполне
    достаточно.
fa:
  name: بازار ماهی باتومی
  short: نهادی محلی نزدیک بندر — ماهی را روی پیشخوان انتخاب می‌کنید و رستوران بغلی با چند لاری برایتان
    سرخش می‌کند.
  body: >-
    **در بازار ماهی باتومی، شام از پیشخوان شروع می‌شود.** سازوکارش ساده و هوشمندانه است: ماهی را در سالن
    بازار انتخاب می‌کنید — صید صبح، چیده روی یخ — و به رستوران‌های بغلی می‌برید تا با 5 تا 10 لاری برایتان
    پاک و سرخش کنند. ده دقیقه بعد، ماهی‌ای که با دست خودتان برگزیده‌اید روی میز است.


    روی پیشخوان‌ها صید فصلی دریای سیاه است: سلطان‌ماهی سرخ (ستارهٔ محلی)، کفال، آنچوی، کفشک و ویتینگ؛
    و کنارشان دورادو، سی‌باس و میگوی وارداتی. قیمت‌ها خیال‌راحت‌کن است: سلطان‌ماهی کیلویی 20 تا 25 لاری،
    کفال 15 تا 20. پاک کردن جداگانه حساب می‌شود، کیلویی 3 تا 5 لاری.


    اینجا جاذبهٔ توریستی نیست؛ بازاری واقعی در محلهٔ بندر است، با کف خیس و بوی تند ماهی — و جذابیتش دقیقاً
    همین است: باتومی سفرهٔ خودش را از همین‌جا می‌چیند. بازار هر روز تقریباً از 10:00 تا 20:00 باز است.
    بهترین انتخاب صبح است، پیش از آنکه صید روز دستچین شود. در سپتامبر و اکتبر، فصل آنچوی، بازار جان تازه‌ای
    می‌گیرد.
  tip: >-
    صبح بروید — بهترین انتخاب همان موقع است. مثل اهالی ماهی انتخاب کنید: آبشش سرخ روشن، چشم شفاف. چانه
    زدن عادی است. سرخ کردن 5 تا 10 لاری و پاک کردن کیلویی 3 تا 5 لاری است؛ رستوران‌ها شراب و سالاد هم
    دارند. پول نقد همراه داشته باشید — همه‌جا کارت نمی‌گیرند. از کف خیس و بوی تند نترسید: بخشی از اصالت
    ماجراست.
  route: >-
    از تفلیس با E60/S1 تا باتومی: تونل‌های ریکوتی، کمربندی کوتایسی، سپس ساحل از کوبولتی — حدود 374 کیلومتر
    و 5:30 ساعت رانندگی، سراسر آسفالت و پمپ‌بنزین در تمام مسیر. بازار دور از مرکز، در سمت بندر شهر، در
    خیابان باکو 27 است — هنگام ورود به شهر در مسیریاب «Batumi Fish Market» را وارد کنید. با خودرو رفتن
    راحت است: کنار ورودی چند ده جای پارک رایگان هست که تا ظهر پر می‌شود. خودروی اقتصادی کاملاً کافی است.
he:
  name: שוק הדגים של בתומי
  short: מוסד מקומי ליד הנמל — בוחרים דג על הדוכן, והמסעדה הסמוכה מטגנת אותו בכמה לארי.
  body: >-
    **בשוק הדגים של בתומי ארוחת הערב מתחילה בדוכן.** השיטה פשוטה וגאונית: בוחרים דג באולם השוק — משלל
    הבוקר, פרוש על קרח — ולוקחים אותו למסעדות הסמוכות, שם תמורת 5-10 לארי ינקו ויטגנו אותו. עשר דקות אחר
    כך, הדג שבחרתם במו ידיכם מונח על השולחן.


    על הדוכנים שלל עונתי מהים השחור: מולית אדומה (הכוכבת המקומית), קיפון, אנשובי, דג משה רבנו ומרלן, ולצידם
    דוראדו, לברק ושרימפס מיובאים. המחירים מרגיעים: מולית אדומה 20-25 לארי לקילו, קיפון 15-20. ניקוי עולה
    בנפרד, 3-5 לארי לקילו.


    זו לא אטרקציה תיירותית אלא שוק עובד ברובע הנמל, כולל רצפות רטובות וריח דגים חזק — וזה בדיוק הקסם:
    כאן בתומי קונה לשולחן של עצמה. השוק פועל יומיום, בערך 10:00-20:00. המבחר הטוב ביותר בבוקר, לפני שהשלל
    היומי מתדלדל. בספטמבר-אוקטובר, עונת האנשובי, השוק מתעורר במיוחד.
  tip: >-
    בואו בבוקר — אז המבחר במיטבו. בחרו דג כמו המקומיים: זימים אדומים בוהקים, עיניים צלולות. להתמקח זה
    בסדר גמור. טיגון עולה 5-10 לארי, ניקוי 3-5 לארי לקילו; במסעדות מגישים גם יין וסלטים. קחו מזומן — לא
    בכל מקום מקבלים כרטיס. אל תירתעו מהרצפות הרטובות ומהריח החזק: זה חלק מהאותנטיות.
  route: >-
    מטביליסי ב-E60/S1 עד בתומי: מנהרות ריקוטי, עוקף כותאיסי, ואז כביש החוף דרך קובולטי — כ-374 ק"מ ו-5:30
    שעות נהיגה, אספלט לכל האורך ותחנות דלק בכל הדרך. השוק נמצא בצד הנמל של העיר, הרחק מהמרכז, ברחוב באקו
    27 — בכניסה לעיר הקלידו בניווט "Batumi Fish Market". להגיע ברכב נוח: ליד הכניסה כמה עשרות מקומות חניה
    חינם, אבל עד הצהריים הם מתמלאים. רכב חסכוני מספיק בהחלט.
ar:
  name: سوق السمك في باتومي
  short: مؤسسة محلية قرب الميناء — تختار سمكتك من البسطة والمطعم المجاور يقليها لك بلاريات قليلة.
  body: >-
    **في سوق السمك بباتومي يبدأ العشاء من البسطة.** النظام بسيط وعبقري: تختار سمكتك في قاعة السوق — من
    صيد الصباح المصفوف على الثلج — وتحملها إلى المطاعم المجاورة حيث ينظفونها ويقلونها مقابل 5-10 لاري.
    وبعد عشر دقائق تكون السمكة التي انتقيتها بيدك على مائدتك.


    على البسطات غلة البحر الأسود الموسمية: السلطان إبراهيم (نجم المكان)، والبوري، والأنشوجة، وسمك موسى،
    والبياض، وإلى جانبها الدورادو والقاروص والروبيان المستورد. الأسعار مطمئنة: السلطان إبراهيم 20-25 لاري
    للكيلو، والبوري 15-20. والتنظيف يُدفع على حدة، نحو 3-5 لاري للكيلو.


    ليست هذه معلماً سياحياً بل سوق عاملة في حي الميناء، بأرضياتها المبتلة ورائحة السمك القوية — وهنا يكمن
    سحرها بالضبط: من هنا تتزود باتومي لمائدتها هي. تعمل السوق يومياً من نحو 10:00 حتى 20:00. أفضل تشكيلة
    في الصباح قبل أن يُنتقى صيد اليوم. وفي سبتمبر وأكتوبر، موسم الأنشوجة، تدب في السوق حياة خاصة.
  tip: >-
    اذهب صباحاً — التشكيلة في أفضل حالاتها. اختر السمك كما يفعل أهل البلد: خياشيم حمراء زاهية وعيون صافية.
    المساومة أمر طبيعي. القلي بـ5-10 لاري والتنظيف بـ3-5 لاري للكيلو؛ وتقدم المطاعم النبيذ والسلطات أيضاً.
    احمل نقوداً — البطاقات لا تُقبل في كل مكان. ولا تنفر من الأرضيات المبتلة والرائحة القوية: فهي جزء
    من الأصالة.
  route: >-
    من تبليسي عبر E60/S1 إلى باتومي: أنفاق ريكوتي، التفافية كوتايسي، ثم الساحل عبر كوبوليتي — نحو 374
    كم و5:30 ساعة قيادة، أسفلت طوال الطريق والوقود متوفر في كل مكان. تقع السوق بعيداً عن المركز في جهة
    الميناء من المدينة، في شارع باكو 27 — عند دخول المدينة اكتب في الملاح «Batumi Fish Market». الوصول
    بالسيارة مريح: قرب المدخل بضع عشرات من المواقف المجانية لكنها تمتلئ عند الظهيرة. سيارة اقتصادية تكفي
    تماماً.
