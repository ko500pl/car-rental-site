ka:
  name: ადიშის მყინვარი
  short: >-
    ადიშჭალის სათავე — თეთნულდის ძირას ჩამოწოლილი 9,5-კილომეტრიანი მყინვარი, რომელიც ნელ-ნელა უკან იხევს,
    ადიშიდან ხეობით ერთი-ორი საათის სავალზე.
  body: >-
    **ადიშიდან ხეობას ერთი-ორი საათი აუყევით და ადიშჭალა იქამდე მიგიყვანთ, სადაც თავად იბადება — თეთნულდის
    ძირას ჩამოწოლილ ყინულის ენამდე.**


    ადიშის, სვანურად ჰადიშის, მყინვარი კავკასიონის სამხრეთ კალთაზე წევს. მას თეთნულდის, გისტოლის, ადიშის
    მწვერვალისა და ლაქუციის ფერდობებიდან ჩამოსული ყინული კვებავს, მისი ნადნობი წყალი კი ადიშჭალად იქცევა.
    სიგრძით დაახლოებით ცხრანახევარი კილომეტრია. ფირნის ველსა, რომელიც 3800 მეტრზე მაღლა მაღალი მწვერვალების
    რკალშია მოქცეული, და ენას შორის ყინული დაახლოებით 1200 მეტრი სიმაღლის ყინულვარდნილით ეშვება — ჩანჩქერით,
    რომელიც ვარდნისას გაიყინა. ციფრები მყინვარის უკან დახევასაც ამჟღავნებს: 1975 წლის ქართული საბჭოთა
    ენციკლოპედია მის ფართობს 12,9 კვადრატულ კილომეტრად, ენის ბოლოს კი 2298 მეტრზე მიუთითებდა; 2015 წლის
    მონაცემებით ფართობი 9,5 კვადრატული კილომეტრია, ენა კი დაახლოებით 2400 მეტრზე ბოლოვდება.


    სოფლიდან ბილიკი ხეობას მიუყვება და სვანური საზომით მსუბუქია: საშუალოდ გაწვრთნილი მოსიარულე მას ტექნიკური
    ჩვევების გარეშე გაივლის. წინ მიიწევთ, ბოლო სახლები უკან რჩება და სიჩუმეს მდინარე ავსებს — რაც უფრო
    თბება დღე და დნება ყინული, მით უფრო ხმამაღლა.


    მესტია–უშგულის ოთხდღიან ლაშქრობაზე მყინვარი მომდევნო დილის ხედიცაა: ადიშის შემდეგ ბილიკი მდინარეს
    ფონით კვეთს და 2655 მეტრზე, ჩხუნდერის უღელტეხილზე ადის, საიდანაც მთელი მყინვარი ზურგს უკან გადაიშლება.


    აქ სიჩუმისთვის მოდიან. ყინულის პირას კი შეჩერდით: მყინვარის ენა საყურებლად არის და არა ასასვლელად.
  tip: >-
    მხოლოდ ზაფხულში (ივნისი–სექტემბერი). ადრე გადით: სოფლიდან ცალ მხარეს ერთი-ორი საათის სავალია, ნადნობი
    წყალი კი შუადღის შემდეგ მატულობს, ამიტომ მდინარის ნებისმიერი გადაკვეთა დილას ეკუთვნის — ადიშის იქით
    ფონზე ფეხით ნუ შეხვალთ, ადგილობრივ მხედრებს ენდეთ. ყინულზე ნუ ახვალთ და მყინვარის ენას ნუ მიუახლოვდებით:
    იქ ქვები და ყინულის ლოდები გაფრთხილების გარეშე ცვივა. ადიშში არც მაღაზიაა, არც ბანკომატი, კავშირიც
    არასანდოა — საჭმელი და ნაღდი ფული მესტიიდან წამოიღეთ, ოფლაინ რუკა წინასწარ ჩამოტვირთეთ. ივლისშიც კი
    მყინვართან ცივა: თბილი ფენა და საწვიმარი თან იქონიეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისისა და სამტრედიის მიმართულებით, სენაკის გავლით
    ზუგდიდამდე იარეთ, იქიდან კი ენგურის ხეობით მესტიამდე ადით — დაახლოებით 470 კმ ასფალტზე. საწვავი ზუგდიდში
    ან მესტიაში ჩაასხით, ზემოთ გასამართი აღარ არის. მესტიიდან უშგულის გზას აღმოსავლეთით დაახლოებით 20
    კმ გაუყევით ბოგრეშის შესახვევამდე; იქიდან სოფლამდე ცხრაოდე კილომეტრი დაღარული, ქვიანი ჯიპის გზა ადის.
    თბილისიდან გზის ბოლომდე სულ დაახლოებით 505 კმ და ათი საათი და თხუთმეტი წუთია — რეალურად ორი დღე, მესტიაში
    ღამის გათევით. ბოლო მონაკვეთი მხოლოდ მაღალი კლირენსის ნამდვილ ჯიპს (ყველგანმავალი კლასი) ეკუთვნის;
    ბევრი მესტიაში ადგილობრივ ჯიპს ქირაობს ან ფეხით ადის. მყინვარამდე სოფლიდან მხოლოდ ფეხით მიდიხართ.
en:
  name: Adishi Glacier
  short: >-
    The source of the Adishchala: a 9.5 km glacier under Tetnuldi, slowly retreating, an hour or two's
    walk up the valley from Adishi.
  body: >-
    **Walk an hour or two up the valley from Adishi and the Adishchala leads you to the place where it
    is born: a tongue of ice at the foot of Tetnuldi.**


    The Adishi Glacier, Hadishi in Svan, lies on the southern flank of the Greater Caucasus. Ice from
    the slopes of Tetnuldi, Gistola, Adishi peak and Lakutsia feeds it, and its meltwater becomes the
    Adishchala. It is roughly nine and a half kilometres long. Between its firn basin, above 3,800 metres
    and ringed by high peaks, and its tongue, the ice tumbles over an icefall some 1,200 metres high,
    a waterfall frozen mid-drop. The numbers also speak of retreat: the Georgian Soviet Encyclopedia of
    1975 gave its area as 12.9 square kilometres and put its tongue at 2,298 metres, while figures for
    2015 give 9.5 square kilometres and a tongue at about 2,400 metres.


    The path from the village follows the valley and is gentle by Svan standards; a reasonably fit walker
    needs no technical skill. As you go, the last houses fall behind and the river fills the silence,
    louder the more the day warms and the ice melts.


    For trekkers on the four-day route from Mestia to Ushguli, the glacier is also the next morning's
    view: beyond Adishi the path fords the river and climbs to the Chkhunderi Pass at 2,655 metres, where
    the whole glacier opens out behind you.


    People come here for the quiet. Stop where the ice begins: the glacier's tongue is for looking at,
    not for climbing.
  tip: >-
    Summer only (June to September). Start early: the walk is one to two hours each way, and meltwater
    rises through the afternoon, so any river crossing belongs to the morning; for the ford beyond Adishi,
    use the local horsemen rather than wading. Stay off the ice and keep well back from the glacier's
    snout, where stones and blocks of ice fall without warning. Adishi has no shop, no cash machine and
    unreliable signal: bring food and cash from Mestia and download an offline map. Even in July it is
    cold by the ice, so carry a warm layer and a rain shell.
  route: >-
    From Tbilisi take the S1 west towards Kutaisi and Samtredia, through Senaki to Zugdidi, then climb
    the Enguri gorge to Mestia — about 470 km of asphalt. Refuel in Zugdidi or Mestia; there is nothing
    higher up. From Mestia follow the Ushguli road east for about 20 km to the Adishi turning at Bogreshi,
    where some nine kilometres of rutted, stony jeep track climb to the village. In all about 505 km and
    ten and a quarter hours to the end of the track, realistically two days with a night in Mestia. The
    last stretch is for a genuine high-clearance 4x4 (offroad class); many hire a local jeep in Mestia
    or walk up. The glacier itself is reached only on foot.
ru:
  name: Ледник Адиши
  short: >-
    Исток Адишчалы: ледник длиной около 9,5 км под Тетнульди, медленно отступающий, в часе-двух ходьбы
    вверх по долине от Адиши.
  body: >-
    **Час-другой вверх по долине от Адиши — и Адишчала приводит вас туда, где рождается сама: к ледяному
    языку у подножия Тетнульди.**


    Ледник Адиши, по-свански Хадиши, лежит на южном склоне Большого Кавказа. Его питает лёд со склонов
    Тетнульди, Гистолы, пика Адиши и Лакуциа, а талая вода становится рекой Адишчалой. В длину он около
    девяти с половиной километров. Между фирновым полем выше 3800 метров, окружённым высокими вершинами,
    и языком лёд низвергается ледопадом высотой около 1200 метров — водопадом, застывшим на лету. Цифры
    говорят и об отступлении: Грузинская советская энциклопедия 1975 года указывала площадь 12,9 квадратного
    километра и конец языка на высоте 2298 метров, а данные за 2015 год — 9,5 квадратного километра и
    язык примерно на 2400 метрах.


    Тропа от села идёт по долине и по сванским меркам пологая; ходоку в сносной форме технические навыки
    не нужны. По пути последние дома остаются позади, и тишину заполняет река — тем громче, чем сильнее
    прогревается день и тает лёд.


    Для тех, кто идёт четырёхдневным маршрутом из Местиа в Ушгули, ледник — ещё и вид следующего утра:
    за Адиши тропа переходит реку вброд и поднимается на перевал Чхундери (2655 метров), откуда за спиной
    открывается весь ледник.


    Сюда приходят за тишиной. Остановитесь там, где начинается лёд: на язык ледника смотрят, а не взбираются.
  tip: >-
    Только летом (с июня по сентябрь). Выходите рано: путь занимает час-два в каждую сторону, а талой
    воды во второй половине дня прибывает, так что любые переправы — дело утра; на броде за Адиши воспользуйтесь
    помощью местных всадников, а не переходите реку сами. Не выходите на лёд и держитесь подальше от конца
    ледникового языка: там без предупреждения падают камни и глыбы льда. В Адиши нет ни магазина, ни банкомата,
    связь ненадёжна: возьмите еду и наличные в Местиа и скачайте офлайн-карту. Даже в июле у льда холодно,
    так что захватите тёплую кофту и дождевик.
  route: >-
    Из Тбилиси поезжайте по S1 на запад, в сторону Кутаиси и Самтредиа, через Сенаки до Зугдиди, затем
    поднимайтесь по ущелью Ингури до Местиа — около 470 км асфальта. Заправьтесь в Зугдиди или Местиа:
    выше ничего нет. Из Местиа поезжайте по дороге на Ушгули на восток около 20 км до поворота на Адиши
    у Богреши, откуда примерно девять километров разбитой каменистой джип-дороги поднимаются к селу. Всего
    около 505 км и десять с четвертью часов до конца дороги — реально это два дня с ночёвкой в Местиа.
    Последний участок — только для настоящего полноприводного внедорожника с высоким клиренсом (класс
    «бездорожье»); многие нанимают в Местиа местный джип или поднимаются пешком. К самому леднику можно
    добраться только пешком.
fa:
  name: یخچال طبیعی آدیشی
  short: >-
    سرچشمهٔ رود آدیشچالا: یخچالی حدوداً ۹٫۵ کیلومتری در پای تتنولدی که آرام‌آرام عقب می‌نشیند، یکی دو
    ساعت پیاده‌روی بالاتر از آدیشی در دره.
  body: >-
    **یکی دو ساعت از آدیشی در دره بالا بروید تا رود آدیشچالا شما را به زادگاهش برساند: زبانه‌ای از یخ
    در پای کوه تتنولدی.**


    یخچال آدیشی، که به زبان سوانی هادیشی خوانده می‌شود، بر دامنهٔ جنوبی قفقاز بزرگ جای دارد. یخِ دامنه‌های
    تتنولدی، گیستولا، قلهٔ آدیشی و لاکوتسیا آن را تغذیه می‌کند و آب ذوب‌شده‌اش رود آدیشچالا را می‌سازد.
    درازایش تقریباً نه و نیم کیلومتر است. میان میدان برف‌یخ (فیرن) آن، بالاتر از ۳۸۰۰ متر و در حلقهٔ قله‌های
    بلند، و زبانه‌اش، یخ از آبشاری یخی به بلندی حدود ۱۲۰۰ متر فرو می‌ریزد — آبشاری که در میانهٔ فرود یخ
    زده است. اعداد از عقب‌نشینی آن هم حکایت دارند: دانشنامهٔ شوروی گرجستان در سال ۱۹۷۵ مساحتش را ۱۲٫۹
    کیلومتر مربع و زبانه‌اش را در ارتفاع ۲۲۹۸ متری ثبت کرده بود، حال آنکه ارقام سال ۲۰۱۵ مساحت را ۹٫۵
    کیلومتر مربع و زبانه را در حدود ۲۴۰۰ متری نشان می‌دهند.


    مسیر از روستا در امتداد دره پیش می‌رود و به معیار سوانتی ملایم است؛ پیاده‌رویی که آمادگی جسمانی معقولی
    داشته باشد به هیچ مهارت فنی نیاز ندارد. در راه، آخرین خانه‌ها پشت سر می‌مانند و صدای رود سکوت را پر
    می‌کند — هرچه روز گرم‌تر شود و یخ بیشتر آب شود، بلندتر.


    برای کوه‌پیمایانی که مسیر چهارروزهٔ مستیا تا اوشگولی را می‌پیمایند، یخچال منظرهٔ صبح روز بعد هم هست:
    پس از آدیشی، راه از رود می‌گذرد و تا گردنهٔ چخوندری در ارتفاع ۲۶۵۵ متری بالا می‌رود، جایی که تمام
    یخچال پشت سرتان گشوده می‌شود.


    مردم برای سکوت به اینجا می‌آیند. همان‌جا که یخ آغاز می‌شود بایستید: زبانهٔ یخچال برای تماشاست، نه
    برای بالا رفتن.
  tip: >-
    فقط تابستان (ژوئن تا سپتامبر). زود راه بیفتید: پیاده‌روی در هر مسیر یک تا دو ساعت طول می‌کشد و آب
    ذوب یخ در طول بعدازظهر بالا می‌آید، پس هر گذر از رود را به صبح بسپارید؛ برای گذر از گدارِ پس از آدیشی،
    به جای آنکه پیاده به آب بزنید، از اسب‌داران محلی کمک بگیرید. پا روی یخ نگذارید و از پیشانی یخچال فاصلهٔ
    زیادی بگیرید، چون سنگ و قطعه‌های یخ بی‌هشدار فرو می‌ریزند. آدیشی نه مغازه دارد، نه خودپرداز، و آنتن
    تلفن هم قابل‌اعتماد نیست: خوراک و پول نقد را از مستیا بیاورید و نقشهٔ آفلاین بارگیری کنید. حتی در
    ژوئیه کنار یخ سرد است؛ یک لایه لباس گرم و یک بارانی همراه داشته باشید.
  route: >-
    از تفلیس جادهٔ S1 را به سمت غرب، به سوی کوتائیسی و سامتردیا، بگیرید و از سناکی بگذرید تا زوگدیدی؛
    سپس درهٔ انگوری را تا مستیا بالا بروید — حدود ۴۷۰ کیلومتر آسفالت. در زوگدیدی یا مستیا سوخت بگیرید؛
    بالاتر چیزی نیست. از مستیا حدود ۲۰ کیلومتر جادهٔ اوشگولی را به سمت شرق تا انشعاب آدیشی در بوگرشی بروید؛
    از آنجا حدود نُه کیلومتر راه جیپ‌روِ ناهموار و سنگلاخ تا روستا بالا می‌رود. روی هم حدود ۵۰۵ کیلومتر
    و ده ساعت و ربع تا انتهای این راه، که در عمل یعنی دو روز با یک شب اقامت در مستیا. بخش آخر فقط برای
    یک خودروی چهارچرخ‌محرک واقعی با فاصلهٔ زیاد از زمین است (ردهٔ آفرود)؛ بسیاری در مستیا جیپ محلی کرایه
    می‌کنند یا پیاده بالا می‌روند. به خود یخچال فقط پیاده می‌توان رسید.
he:
  name: קרחון אדישי
  short: >-
    מקורו של נהר אדישצ'אלה: קרחון באורך של כ-9.5 ק"מ למרגלות טטנולדי, הנסוג לאט, שעה או שעתיים הליכה במעלה
    העמק מאדישי.
  body: >-
    **לכו שעה או שעתיים במעלה העמק מאדישי, והאדישצ'אלה יוביל אתכם אל המקום שבו הוא נולד: לשון של קרח למרגלות
    טטנולדי.**


    קרחון אדישי, ובסוואנית הדישי, שוכן במדרון הדרומי של הקווקז הגדול. הוא ניזון מהקרח שבמדרונות טטנולדי,
    גיסטולה, פסגת אדישי ולקוציה, ומי ההפשרה שלו הופכים לנהר אדישצ'אלה. אורכו כתשעה וחצי קילומטרים. בין
    שדה הפירן שלו, בגובה של יותר מ-3,800 מטרים ומוקף פסגות גבוהות, לבין הלשון, הקרח גולש במפל קרח שגובהו
    כ-1,200 מטרים — מפל שקפא באמצע נפילתו. המספרים מספרים גם על נסיגה: האנציקלופדיה הסובייטית הגאורגית
    משנת 1975 ציינה את שטחו כ-12.9 קמ"ר ואת קצה הלשון בגובה 2,298 מטרים, ואילו נתוני 2015 מעמידים את השטח
    על 9.5 קמ"ר ואת הלשון על כ-2,400 מטרים.


    השביל מהכפר עובר לאורך העמק ונוח למדי בקנה מידה סוואני; מטייל בכושר סביר אינו זקוק לשום מיומנות טכנית.
    בדרך נשארים מאחור הבתים האחרונים, והנהר ממלא את הדממה — קולני יותר ככל שהיום מתחמם והקרח נמס.


    למטיילים במסלול בן ארבעת הימים ממסטיה לאושגולי, הקרחון הוא גם הנוף של הבוקר שלמחרת: מעבר לאדישי השביל
    חוצה את הנהר ומטפס אל מעבר צ'חונדרי שבגובה 2,655 מטרים, ומשם נפרש כל הקרחון מאחוריכם.


    לכאן באים בשביל השקט. עצרו היכן שהקרח מתחיל: בלשון הקרחון מתבוננים, לא מטפסים עליה.
  tip: >-
    בקיץ בלבד (יוני עד ספטמבר). צאו מוקדם: ההליכה נמשכת שעה עד שעתיים לכל כיוון, ומפלס מי ההפשרה עולה
    במהלך אחר הצהריים, כך שכל חציית נהר שייכת לבוקר; בחציית הנהר שאחרי אדישי היעזרו ברוכבי הסוסים המקומיים
    במקום לחצות ברגל. אל תעלו על הקרח והתרחקו היטב מחזית הקרחון, שממנה נופלים אבנים וגושי קרח בלי אזהרה.
    באדישי אין חנות, אין כספומט והקליטה אינה אמינה: הביאו אוכל ומזומן ממסטיה והורידו מפה לא מקוונת. גם
    ביולי קר ליד הקרח, אז קחו שכבה חמה ומעיל גשם.
  route: >-
    מטביליסי סעו מערבה בכביש S1 לכיוון קוטאיסי וסמטרדיה, דרך סנאקי עד זוגדידי, ומשם טפסו בערוץ האנגורי
    עד מסטיה — כ-470 ק"מ של אספלט. תדלקו בזוגדידי או במסטיה; למעלה אין תחנות דלק. ממסטיה סעו מזרחה בדרך
    לאושגולי כ-20 ק"מ עד הפנייה לאדישי בבוגרשי, ומשם מטפסת אל הכפר דרך ג'יפים משובשת ואבנית באורך של כתשעה
    קילומטרים. בסך הכול כ-505 ק"מ ועשר שעות ורבע עד סוף הדרך, ולמעשה יומיים עם לינה במסטיה. הקטע האחרון
    מתאים רק לרכב שטח של ממש בהנעה כפולה ועם מרווח גחון גבוה (קטגוריית שטח); רבים שוכרים ג'יפ מקומי במסטיה
    או עולים ברגל. אל הקרחון עצמו מגיעים רק ברגל.
ar:
  name: نهر أديشي الجليدي
  short: >-
    منبع نهر أديشتشالا: نهر جليدي طوله نحو 9.5 كم تحت قمة تيتنولدي، يتراجع ببطء، على مسيرة ساعة أو ساعتين
    صعودًا في الوادي من أديشي.
  body: >-
    **امشِ ساعة أو ساعتين صعودًا في الوادي من أديشي، وسيقودك نهر أديشتشالا إلى حيث يولد: لسانٌ من الجليد
    عند سفح تيتنولدي.**


    يقع نهر أديشي الجليدي، "هاديشي" بالسفانية، على السفح الجنوبي للقوقاز الكبير. يغذّيه الجليد المنحدر
    من سفوح تيتنولدي وغيستولا وقمة أديشي ولاكوتسيا، وتصير مياه ذوبانه نهر أديشتشالا. يبلغ طوله نحو تسعة
    كيلومترات ونصف. وبين حقل الثلج الحبيبي (الفيرن) فوق 3800 متر، الذي تحيط به القمم العالية، ولسانه،
    ينحدر الجليد في شلال جليدي يبلغ ارتفاعه نحو 1200 متر، كأنه شلال تجمّد في منتصف سقوطه. والأرقام تحكي
    أيضًا عن تراجعه: فالموسوعة السوفيتية الجورجية الصادرة عام 1975 قدّرت مساحته بـ12.9 كيلومترًا مربعًا
    وحدّدت طرف لسانه على ارتفاع 2298 مترًا، في حين تعطي أرقام عام 2015 مساحة 9.5 كيلومترات مربعة ولسانًا
    عند نحو 2400 متر.


    يتبع الدرب من القرية مجرى الوادي، وهو هيّن بمقاييس سفانيتي؛ فلا يحتاج الماشي ذو اللياقة المعقولة إلى
    أي مهارة تقنية. وفي الطريق تتوارى آخر البيوت خلفك ويملأ النهر السكون، ويعلو صوته كلما اشتد دفء النهار
    وذاب الجليد.


    أما لسالكي مسار الأيام الأربعة من ميستيا إلى أوشغولي، فالنهر الجليدي هو أيضًا مشهد صباح اليوم التالي:
    فبعد أديشي يخوض الدرب النهر ويصعد إلى ممر تشخونديري على ارتفاع 2655 مترًا، حيث ينبسط النهر الجليدي
    كله خلفك.


    يأتي الناس إلى هنا من أجل السكون. توقّف حيث يبدأ الجليد: فلسان النهر الجليدي للتأمل، لا للتسلق.
  tip: >-
    في الصيف فقط (من يونيو إلى سبتمبر). ابدأ باكرًا: فالمسير يستغرق من ساعة إلى ساعتين في كل اتجاه، ومياه
    الذوبان ترتفع على مدار فترة ما بعد الظهر، فاجعل أي عبور للنهر في الصباح؛ وعند المخاضة بعد أديشي استعن
    بالخيّالة المحليين بدل الخوض في الماء بنفسك. لا تصعد إلى الجليد وابقَ بعيدًا عن جبهة النهر الجليدي،
    حيث تتساقط الحجارة وكتل الجليد دون سابق إنذار. لا متجر في أديشي ولا صراف آلي، والتغطية غير موثوقة:
    أحضر الطعام والنقود من ميستيا ونزّل خريطة للاستخدام دون اتصال. حتى في يوليو يكون الجو باردًا قرب الجليد،
    فاحمل طبقة دافئة وسترة واقية من المطر.
  route: >-
    من تبليسي اسلك الطريق S1 غربًا باتجاه كوتايسي وسامتريديا، مرورًا بسيناكي حتى زوغديدي، ثم اصعد وادي
    إنغوري حتى ميستيا — نحو 470 كم من الإسفلت. تزوّد بالوقود في زوغديدي أو ميستيا؛ فلا محطات وقود بعدهما
    صعودًا. من ميستيا اتبع طريق أوشغولي شرقًا نحو 20 كم حتى منعطف أديشي عند بوغريشي، حيث يصعد مسار وعر
    مليء بالحجارة لسيارات الجيب نحو تسعة كيلومترات إلى القرية. المجموع نحو 505 كم وعشر ساعات وربع حتى
    نهاية المسار، أي عمليًا يومان مع مبيت في ميستيا. المقطع الأخير لا يصلح إلا لسيارة دفع رباعي حقيقية
    عالية الخلوص (فئة الطرق الوعرة)؛ ويستأجر كثيرون سيارة جيب محلية في ميستيا أو يصعدون سيرًا. أما النهر
    الجليدي نفسه فلا يُبلغ إلا سيرًا على الأقدام.
