ka:
  name: მესტია და სვანური კოშკები
  short: >-
    ზემო სვანეთის დედაქალაქი 1500 მეტრზე: შუა საუკუნეების კოშკები ოჯახურ ეზოებში, 897 წლის ადიშის ოთხთავი
    მუზეუმში და ბილიკები ყველა მიმართულებით.
  body: >-
    **მესტია თავის შუა საუკუნეებს შინ ინახავს: ქვის კოშკები დღესაც ოჯახურ ეზოებში დგას და არა მუზეუმის
    ღობის მიღმა.**


    დაბა ზღვის დონიდან 1500 მეტრზე, მესტიაჭალისა და მულხრის ნაპირებზე გაშენებულა და ოდითგანვე ზემო სვანეთის
    მთავარი თემი იყო. მისი ძველი სახელი სეტია — ამიტომაც ჰქვია ცენტრალურ მოედანს დღემდე სეტის მოედანი.
    დაბის სტატუსი მხოლოდ 1968 წელს მიიღო და ორი ათასამდე მცხოვრები ჰყავს, მაგრამ 1975 წლიდან ტოსკანურ
    სან-ჯიმინიანოსთან, კოშკების ქალაქთან, არის დაძმობილებული. ორივე ქალაქი დღემდე თავისი შუა საუკუნეების
    კოშკების ჩრდილში ცხოვრობს.


    სვანური კარ-მიდამო პატარა ციხე-სიმაგრე იყო: კოშკი, მასზე მიშენებული მაჩუბი, სადაც ოჯახი და საქონელი
    ერთად ზამთრობდა, და ორივეს გარშემო გალავანი. კოშკების უმეტესობა IX–XIII საუკუნეებში აიგო — მტრის შემოსევისგან
    თავდასაცავად, ზვავისა და სისხლის აღების ჟამს თავშესაფრად. მათ შორის ვიწრო შუკებით იარეთ, მერე კი ქალაქის
    თავზე, ჯვართან ადით — იქიდან მთელი ხეობა ერთბაშად მოჩანს, წინ კი უშბის ორი მწვერვალი აღმართულა.


    სვანეთის ისტორიისა და ეთნოგრაფიის მუზეუმში ის ინახება, რაც მთებმა გადაარჩინა: ჭედური ხატები, ლიტანიობის
    ჯვრები და ქართული მწერლობის უძველესი ძეგლები, მათ შორის 897 წლის ადიშის ოთხთავი. ნახევარი საათი მიხეილ
    ხერგიანის სახლ-მუზეუმსაც შემოუნახეთ. 1932 წელს აქ დაბადებულ ალპინისტს ინგლისელებმა „კლდეების ვეფხვი“
    შეარქვეს; 1969 წელს დოლომიტებში, ჩივეტაზე, ჩამოცვენილმა ქვებმა თოკი გაუწყვიტა. ხერგიანი მშობლიურ მესტიაში
    დაკრძალეს.


    მისი სიკვდილის შემდეგ სვანებმა სიმღერები შექმნეს, რომლებშიც ნადირობის ქალღმერთი დალი მას დასტირის.
    მესტიაში მთებიც კი ნათესავებივით გლოვობენ.
  tip: >-
    მესტიაში სულ მცირე ორი ღამე დაგეგმეთ — ერთდღიანი ვიზიტი მხოლოდ გზაში დაღლაა. საიმედო სეზონი ივნისის
    ბოლოდან სექტემბრის ბოლომდეა; ზამთარში მესტია სათხილამურო ბაზაა, თუმცა ზვავის გამო გზა ზოგჯერ იკეტება.
    ამინდი დღეში რამდენჯერმე იცვლება, ამიტომ წვიმის ქურთუკი და თბილი ფენა აგვისტოშიც თან იქონიეთ. მანქანა
    სასტუმროსთან დატოვეთ და ფეხით იარეთ — ცენტრი პატარაა. ბანკომატები და აფთიაქი სეტის მოედანთანაა, მაგრამ
    ბარათს ყველგან არ იღებენ: ნაღდი ლარი იქონიეთ. მესტია უშგულის, კორულდის, ჭალაადისა და ჰაწვალისა და
    თეთნულდის საბაგიროების ბაზაცაა.
  route: >-
    მესტია თბილისიდან დაახლოებით 470 კმ-ითა და რვანახევარი საათითაა დაშორებული. E60-ით (ს-1) დასავლეთით,
    ქუთაისისა და სენაკის გავლით ზუგდიდამდე იარეთ, შემდეგ შ-7-ით ჩრდილოეთით — ჯვართან, ენგურის კაშხალთან
    ჩაუვლით და ხეობას აუყვებით. ზუგდიდიდან 128 კილომეტრი ბოლომდე ასფალტია, მაგრამ ვიწრო და დაუსრულებლად
    კლაკნილი — მარტო ამ მონაკვეთს სამი საათი უნდა; ღამის გათევა ქუთაისში ან ზუგდიდში ღირს. ავზი ზუგდიდში
    ან ჯვარში შეავსეთ — ხეობაში ზემოთ საწვავი ნაკლებად საიმედოა. ასფალტს ნებისმიერი მანქანა გაივლის; მაღალი
    გამავლობის მანქანას (ჯიპს) იმიტომ გირჩევთ, რომ სერპანტინზე უფრო მშვიდია და მესტიიდან გრუნტის გზებზე
    გასვლისას დაგჭირდებათ.
en:
  name: Mestia and the Svan Towers
  short: >-
    Upper Svaneti's capital at 1,500 m: medieval towers in family yards, the 897 Adishi Gospels in the
    museum, and trails leading off in every direction.
  body: >-
    **Mestia keeps its Middle Ages at home: the stone towers still rise from family yards, not from behind
    a museum fence.**


    The town stands at 1,500 metres on the banks of the Mestiachala and Mulkhra, the chief community of
    Upper Svaneti for as long as anyone has kept records. Its old name was Seti, which is why the main
    square is still Seti Square. It became a townlet only in 1968 and has barely 2,000 residents, yet
    since 1975 it has been twinned with San Gimignano, the Tuscan town of towers. Both towns still live
    among their medieval towers.


    A Svan homestead was a fortress in miniature: a tower, the *machubi* house built against it, where
    family and livestock wintered together, and a wall around both. Most towers went up between the 9th
    and 13th centuries, as defence against raiders and as refuge in avalanches and blood feuds. Walk the
    lanes between them, then climb to the Cross viewpoint above town for the whole valley at once, with
    the twin summits of Ushba ahead.


    The Svaneti Museum of History and Ethnography holds what the mountains protected: icons of chased
    metal, processional crosses and some of the oldest Georgian manuscripts, among them the Adishi Gospels
    of 897. Save half an hour for the Mikheil Khergiani House-Museum. Khergiani, born here in 1932, was
    the climber the English nicknamed the "Tiger of the Rocks"; in 1969 falling stones cut his rope on
    Monte Civetta in the Dolomites, and he was brought home to Mestia to be buried.


    After his death Svan singers composed songs in which Dali, the goddess of the hunt, mourns him. In
    Mestia even the mountains grieve like family.
  tip: >-
    Give Mestia at least two nights; a single day here is mostly driving. Late June to late September
    is the dependable window, and the town is a ski base in winter, though avalanches occasionally close
    the road. The weather turns several times a day, so pack a rain shell and a warm layer even in August.
    Leave the car at your guesthouse and walk: the centre is tiny. Cash machines and a pharmacy are around
    Seti Square, but cards are not accepted everywhere, so carry lari. Mestia is also the base for Ushguli,
    Koruldi, Chalaadi and the Hatsvali and Tetnuldi lifts.
  route: >-
    Mestia is about 470 km and eight and a half hours from Tbilisi. Take the E60 (S1) west past Kutaisi
    and Senaki to Zugdidi, then the Sh7 north past the Enguri dam at Jvari and up the gorge. The 128 km
    from Zugdidi are fully paved but narrow and endlessly winding; count on three hours for that stretch
    alone, and consider a night in Kutaisi or Zugdidi. Fill up in Zugdidi or Jvari, since fuel higher
    in the gorge is less dependable. Any car manages the asphalt; we suggest an SUV because it is calmer
    on the switchbacks and you will want it for the gravel side trips from Mestia.
ru:
  name: Местиа и сванские башни
  short: >-
    Столица Верхней Сванетии на высоте 1500 м: средневековые башни во дворах, Адишское Евангелие 897 года
    в музее и тропы во все стороны.
  body: >-
    **Местиа хранит своё Средневековье дома: каменные башни по-прежнему поднимаются из семейных дворов,
    а не из-за музейной ограды.**


    Городок стоит на высоте 1500 метров на берегах Местиачалы и Мулхры и с тех пор, как ведутся записи,
    остаётся главной общиной Верхней Сванетии. Прежде он назывался Сети, поэтому главная площадь и сегодня
    — площадь Сети. Статус посёлка Местиа получила лишь в 1968 году, жителей здесь едва наберётся 2000,
    и всё же с 1975 года она побратим Сан-Джиминьяно, тосканского города башен. Оба городка до сих пор
    живут среди своих средневековых башен.


    Сванская усадьба была крепостью в миниатюре: башня, пристроенный к ней дом-*мачуби*, где семья и скот
    зимовали вместе, и стена вокруг. Большинство башен поднялось между IX и XIII веками — для защиты от
    набегов и как убежище в лавины и кровную месть. Пройдитесь по переулкам между ними, а потом поднимитесь
    к смотровой площадке у Креста над городом — оттуда видна вся долина разом, а впереди — двуглавая Ушба.


    В Сванском музее истории и этнографии хранится то, что сберегли горы: иконы из чеканного металла,
    выносные кресты и одни из древнейших грузинских рукописей, среди них Адишское Евангелие 897 года.
    Оставьте полчаса на дом-музей Михаила Хергиани. Хергиани, родившийся здесь в 1932 году, был тем самым
    альпинистом, которого англичане прозвали «Тигром скал»; в 1969 году на Монте-Чиветта в Доломитах падающие
    камни перебили его верёвку, и его привезли хоронить домой, в Местиа.


    После его гибели сванские певцы сложили песни, в которых его оплакивает Дали, богиня охоты. В Местиа
    даже горы скорбят как родня.
  tip: >-
    Дайте Местиа хотя бы две ночи: один день здесь уходит в основном на дорогу. Надёжное окно — с конца
    июня до конца сентября; зимой городок служит горнолыжной базой, хотя лавины порой закрывают дорогу.
    Погода меняется по нескольку раз на дню, поэтому даже в августе берите дождевик и тёплую кофту. Оставьте
    машину у гостевого дома и ходите пешком: центр крошечный. Банкоматы и аптека — у площади Сети, но
    карты принимают не везде, так что держите при себе лари. Местиа — ещё и база для поездок в Ушгули,
    на Корульди, Чалаади и к подъёмникам Хацвали и Тетнульди.
  route: >-
    До Местиа из Тбилиси около 470 км и восемь с половиной часов. Двигайтесь по E60 (S1) на запад мимо
    Кутаиси и Сенаки до Зугдиди, затем по Sh7 на север мимо Ингурской плотины у Джвари и вверх по ущелью.
    128 км от Зугдиди полностью заасфальтированы, но узки и бесконечно извилисты; только на этот участок
    закладывайте три часа и подумайте о ночёвке в Кутаиси или Зугдиди. Заправляйтесь в Зугдиди или Джвари:
    выше по ущелью с топливом ненадёжно. По асфальту проедет любая машина; мы советуем кроссовер: на серпантине
    с ним спокойнее, и он пригодится для гравийных вылазок из Местиа.
fa:
  name: مستیا و برج‌های سوانی
  short: >-
    پایتخت سوانتی علیا در ارتفاع ۱,۵۰۰ متر: برج‌های سده‌های میانه در حیاط خانه‌ها، انجیل آدیشی از سال
    ۸۹۷ در موزه و کوره‌راه‌هایی به هر سو.
  body: >-
    **مستیا سده‌های میانه‌اش را در خانه نگه داشته است: برج‌های سنگی هنوز از دل حیاط خانواده‌ها قد می‌کشند،
    نه از پشت نردهٔ موزه.**


    شهرک در ارتفاع ۱,۵۰۰ متری، بر کرانه‌های رودهای مستیاچالا و مولخرا ایستاده و از زمانی که کسی چیزی ثبت
    کرده، اصلی‌ترین آبادی سوانتی علیا بوده است. نام کهنش ستی بود و از همین رو میدان اصلی هنوز میدان ستی
    است. تازه در ۱۹۶۸ به شهرکی کوچک بدل شد و به‌زحمت ۲,۰۰۰ نفر جمعیت دارد، با این همه از ۱۹۷۵ خواهرخواندهٔ
    سان جیمینیانو، شهر برج‌های توسکانی، است. هر دو هنوز در میان برج‌های سده‌های میانه‌شان زندگی می‌کنند.


    خانهٔ سوانی دژی کوچک بود: برجی، خانهٔ *ماچوبی* چسبیده به آن که خانواده و دام زمستان را با هم در آن
    می‌گذراندند، و دیواری گرداگرد هر دو. بیشتر برج‌ها میان سده‌های نهم و سیزدهم برپا شدند، برای دفاع در
    برابر یورشگران و پناه گرفتن در بهمن‌ها و خون‌خواهی‌ها. در کوچه‌های میان آن‌ها قدم بزنید و سپس تا دیدگاه
    صلیب بالای شهر بالا بروید تا همهٔ دره را یکجا ببینید و قلهٔ دوگانهٔ اوشبا را روبه‌رویتان.


    موزهٔ تاریخ و مردم‌نگاری سوانتی آنچه را کوه‌ها پاس داشته‌اند در خود دارد: شمایل‌های فلزی قلم‌زده،
    صلیب‌های دسته‌روی و برخی از کهن‌ترین دست‌نوشته‌های گرجی، از جمله انجیل آدیشی از سال ۸۹۷. نیم ساعتی
    هم برای خانه‌موزهٔ میخئیل خرگیانی کنار بگذارید. خرگیانی، زادهٔ ۱۹۳۲ در همین‌جا، کوهنوردی بود که انگلیسی‌ها
    لقب «ببر صخره‌ها» به او دادند؛ در ۱۹۶۹ سنگ‌های ریزان بر مونته چیوتا در دولومیت‌ها طنابش را بریدند،
    و او را برای خاکسپاری به زادگاهش مستیا بازگرداندند.


    پس از مرگش خوانندگان سوانی ترانه‌هایی ساختند که در آن‌ها دالی، الههٔ شکار، بر او سوگواری می‌کند. در
    مستیا حتی کوه‌ها هم مثل خویشاوندان سوگواری می‌کنند.
  tip: >-
    دست‌کم دو شب به مستیا بدهید؛ یک روز اینجا بیشترش به رانندگی می‌گذرد. مطمئن‌ترین بازه از اواخر ژوئن
    تا اواخر سپتامبر است، و در زمستان شهرک پایگاه اسکی است، هرچند گاهی بهمن جاده را می‌بندد. هوا چند بار
    در روز عوض می‌شود، پس حتی در اوت بارانی و یک لایه لباس گرم بردارید. خودرو را کنار مهمان‌خانه بگذارید
    و پیاده بگردید: مرکز شهر کوچک است. خودپرداز و داروخانه در اطراف میدان ستی است، اما همه‌جا کارت نمی‌پذیرند،
    پس لاری نقد همراه داشته باشید. مستیا پایگاه رفتن به اوشگولی، کورولدی، چالاادی و تله‌کابین‌های هاتسوالی
    و تتنولدی هم هست.
  route: >-
    مستیا حدود ۴۷۰ کیلومتر و هشت ساعت و نیم از تفلیس فاصله دارد. با E60 (S1) به سمت غرب، از کنار کوتائیسی
    و سناکی تا زوگدیدی بروید، سپس با Sh7 به شمال، از کنار سد انگوری در جواری بگذرید و تنگه را بالا بروید.
    ۱۲۸ کیلومتر از زوگدیدی به بعد سراسر آسفالت است اما باریک و بی‌پایان پیچ‌درپیچ؛ فقط برای این بخش سه
    ساعت حساب کنید و به ماندن یک شب در کوتائیسی یا زوگدیدی فکر کنید. در زوگدیدی یا جواری سوخت بگیرید،
    چون بالاتر در تنگه سوخت چندان قابل‌اتکا نیست. هر خودرویی از پس آسفالت برمی‌آید؛ ما شاسی‌بلند را پیشنهاد
    می‌کنیم، چون در پیچ‌های تند آرام‌تر است و برای گشت‌های فرعی روی شن از مستیا به کارتان می‌آید.
he:
  name: מסטיה ומגדלי הסוואנים
  short: >-
    בירת סוואנטי העילית בגובה 1,500 מטר: מגדלים מימי הביניים בחצרות המשפחות, ספר הבשורות של אדישי משנת
    897 במוזיאון, ושבילים לכל עבר.
  body: >-
    **מסטיה שומרת את ימי הביניים שלה בבית: מגדלי האבן עדיין מתנשאים מחצרות המשפחות, לא מאחורי גדר של מוזיאון.**


    העיירה שוכנת בגובה 1,500 מטר על גדות הנהרות מסטיאצ'לה ומולחרה, והיא היישוב המרכזי של סוואנטי העילית
    מאז שמישהו טרח לתעד. שמה הישן היה סטי, ולכן הכיכר המרכזית היא עד היום כיכר סטי. רק ב-1968 קיבלה מעמד
    של עיירה, ומתגוררים בה בקושי 2,000 איש, ובכל זאת מאז 1975 היא עיר תאומה של סן ג'מיניאנו, עיר המגדלים
    של טוסקנה. שתיהן חיות עד היום בין מגדלי ימי הביניים שלהן.


    משק בית סוואני היה מבצר בזעיר אנפין: מגדל, בית ה*מצ'ובי* הצמוד אליו, שבו חורפו המשפחה ובעלי החיים
    יחד, וחומה סביב שניהם. רוב המגדלים נבנו בין המאה ה-9 למאה ה-13, להגנה מפני פושטים ולמחסה בעת מפולות
    שלגים ונקמות דם. שוטטו בסמטאות שביניהם, ואז טפסו אל תצפית הצלב שמעל העיירה כדי לראות את כל העמק במבט
    אחד, ומולכם את שתי הפסגות של אושבה.


    המוזיאון להיסטוריה ולאתנוגרפיה של סוואנטי שומר את מה שההרים הגנו עליו: איקונות ממתכת מרוקעת, צלבי
    תהלוכה וכמה מכתבי היד הגאורגיים העתיקים ביותר, ובהם ספר הבשורות של אדישי משנת 897. שמרו חצי שעה לבית-המוזיאון
    של מיכאיל חרגיאני. חרגיאני, שנולד כאן ב-1932, היה המטפס שהאנגלים כינו "טיגריס הסלעים"; ב-1969 קטעו
    אבנים נופלות את החבל שלו על מונטה צ'יווטה שבדולומיטים, והוא הובא הביתה למסטיה להיקבר.


    אחרי מותו חיברו זמרים סוואנים שירים שבהם דאלי, אלת הציד, מקוננת עליו. במסטיה אפילו ההרים מתאבלים כמו
    בני משפחה.
  tip: >-
    תנו למסטיה לפחות שני לילות; יום אחד כאן הולך בעיקר על נהיגה. התקופה הבטוחה היא מסוף יוני עד סוף ספטמבר,
    ובחורף העיירה משמשת בסיס סקי, אף שמפולות שלגים סוגרות מדי פעם את הכביש. מזג האוויר מתהפך כמה פעמים
    ביום, לכן ארזו מעיל גשם ושכבה חמה גם באוגוסט. השאירו את הרכב בבית ההארחה ולכו ברגל: המרכז זעיר. כספומטים
    ובית מרקחת יש סביב כיכר סטי, אבל לא בכל מקום מקבלים כרטיסי אשראי, אז החזיקו לארי במזומן. מסטיה היא
    גם הבסיס לאושגולי, לקורולדי, לצ'לאדי ולרכבלים של הצוואלי וטטנולדי.
  route: >-
    מסטיה נמצאת כ-470 ק"מ ושמונה שעות וחצי מטביליסי. סעו בכביש E60 (S1) מערבה, על פני קוטאיסי וסנאקי עד
    זוגדידי, ומשם בכביש Sh7 צפונה, על פני סכר אנגורי בג'ווארי ובמעלה הערוץ. 128 הק"מ מזוגדידי סלולים לגמרי
    אבל צרים ומתפתלים בלי סוף; חשבו שלוש שעות לקטע הזה לבדו, ושקלו לילה בקוטאיסי או בזוגדידי. תדלקו בזוגדידי
    או בג'ווארי, כי גבוה יותר בערוץ הדלק פחות אמין. כל רכב יסתדר על האספלט; אנחנו ממליצים על רכב פנאי-שטח,
    כי הוא רגוע יותר בסרפנטינות ותרצו אותו לטיולי הצד בדרכי החצץ ממסטיה.
ar:
  name: ميستيا والأبراج السفانية
  short: >-
    عاصمة سفانيتي العليا على ارتفاع 1500 م: أبراج من العصور الوسطى في أفنية البيوت، وإنجيل أديشي من عام
    897 في المتحف، ودروب تنطلق في كل اتجاه.
  body: >-
    **تحتفظ ميستيا بعصورها الوسطى في البيت: فالأبراج الحجرية ما زالت تنهض من أفنية العائلات، لا من خلف
    سياج متحف.**


    تقوم البلدة على ارتفاع 1500 متر على ضفتي نهري ميستياتشالا ومولخرا، وهي أهم بلدات سفانيتي العليا منذ
    أن بدأ أحد بالتدوين. وكان اسمها القديم سيتي، ولذلك ما زالت الساحة الرئيسية تُعرف بساحة سيتي. لم تصبح
    بلدة صغيرة إلا في عام 1968، وبالكاد يبلغ سكانها 2000 نسمة، ومع ذلك فهي منذ 1975 توأم سان جيمينيانو،
    بلدة الأبراج في توسكانا. وكلتاهما ما زالت تعيش بين أبراجها التي تعود إلى العصور الوسطى.


    كان البيت السفاني حصناً مصغّراً: برج، وبيت *الماتشوبي* الملاصق له حيث كانت الأسرة والماشية تقضيان
    الشتاء معاً، وسور يحيط بهما. وقد شُيّد معظم الأبراج بين القرنين التاسع والثالث عشر، للدفاع في وجه
    الغزاة وللاحتماء من الانهيارات الثلجية ومن الثأر. تجوّل في الأزقة بينها، ثم اصعد إلى مطلّ الصليب فوق
    البلدة لترى الوادي كله دفعة واحدة، وقمّتي أوشبا التوأمين أمامك.


    يضم متحف سفانيتي للتاريخ والإثنوغرافيا ما حمته الجبال: أيقونات من المعدن المنقوش، وصلباناً للمواكب،
    وبعضاً من أقدم المخطوطات الجورجية، ومنها إنجيل أديشي من عام 897. واحفظ نصف ساعة لبيت-متحف ميخائيل
    خرغياني. فخرغياني، المولود هنا عام 1932، هو المتسلّق الذي لقّبه الإنجليز «نمر الصخور»؛ وفي عام 1969
    قطعت الحجارة المتساقطة حبله على جبل مونتي تشيفيتا في الدولوميت، فأُعيد إلى بيته في ميستيا ليُدفن فيها.


    وبعد موته نظم المغنّون السفانيون أغاني ترثيه فيها دالي، إلهة الصيد. في ميستيا حتى الجبال تحزن حزن
    الأهل.
  tip: >-
    امنح ميستيا ليلتين على الأقل؛ فاليوم الواحد هنا يذهب معظمه في القيادة. الموسم المضمون من أواخر يونيو
    إلى أواخر سبتمبر، وفي الشتاء تصبح البلدة قاعدة للتزلج، وإن كانت الانهيارات الثلجية تغلق الطريق أحياناً.
    يتقلّب الطقس مرات في اليوم، فاحمل معطفاً واقياً من المطر وطبقة دافئة حتى في أغسطس. اترك السيارة عند
    دار الضيافة وتجوّل سيراً؛ فالمركز صغير جداً. الصرافات الآلية والصيدلية حول ساحة سيتي، لكن البطاقات
    لا تُقبل في كل مكان، فاحمل اللاري نقداً. وميستيا أيضاً قاعدة الانطلاق إلى أوشغولي وكورولدي وتشالاادي
    وتلفريكي هاتسفالي وتيتنولدي.
  route: >-
    تبعد ميستيا عن تبليسي نحو 470 كم وثماني ساعات ونصفاً. خذ الطريق E60 (S1) غرباً مروراً بكوتايسي وسيناكي
    حتى زوغديدي، ثم الطريق Sh7 شمالاً مروراً بسد إنغوري عند جفاري وصعوداً في المضيق. الكيلومترات الـ128
    من زوغديدي معبّدة بالكامل لكنها ضيقة ومتعرّجة بلا نهاية؛ احسب ثلاث ساعات لهذا المقطع وحده، وفكّر في
    المبيت في كوتايسي أو زوغديدي. تزوّد بالوقود في زوغديدي أو جفاري، فالوقود في أعالي المضيق أقل موثوقية.
    أي سيارة تجتاز الإسفلت؛ ونقترح سيارة رياضية متعددة الاستخدامات مرتفعة عن الأرض لأنها أهدأ على المنعطفات
    الحادة، ولأنك ستحتاجها للرحلات الجانبية على الحصى من ميستيا.
