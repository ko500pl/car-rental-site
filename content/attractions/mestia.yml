ka:
  name: მესტია და სვანური კოშკები
  short: >-
    ზემო სვანეთის ცენტრი 1500 მეტრზე — ქვის საბრძოლო კოშკები, ძლიერი მუზეუმები და ყველა მთის მარშრუტის
    საწყისი წერტილი.
  body: >-
    მესტია ზემო სვანეთის ადმინისტრაციული და ტურისტული ცენტრია, რომელიც ენგურის ხეობის ზემო ნაწილში, დაახლოებით
    1500 მეტრის სიმაღლეზე დგას. ქალაქს განსაკუთრებულს ხდის ის, რომ აქ ისტორია არ არის მუზეუმში დაკეტილი
    — საბრძოლო კოშკები, რომელთა უმეტესობა IX–XIII საუკუნეებით თარიღდება, დღემდე ჩვეულებრივი საცხოვრებელი
    ეზოების ნაწილია. კოშკები ოჯახებმა ერთდროულად ორი მიზნით ააგეს: მტრის თავდასხმისგან თავდაცვისთვის და
    ზვავებისა და სისხლის აღების პერიოდში თავშესაფრად.


    მესტიის ძველი უბნები — ლანჩვალი, ლაღამი, ლეხტაგი — ერთმანეთისგან ხიდებითა და ვიწრო ქუჩებითაა გამოყოფილი
    და ფეხით ერთ ნახევარ დღეში მოივლება. სვანეთის ისტორიისა და ეთნოგრაფიის მუზეუმი ინახავს ჯვრებს, ხატებს,
    ჭედურ ხელოვნებას და ხელნაწერებს, რომლებიც საუკუნეების განმავლობაში მთის ეკლესიებში იმალებოდა და სწორედ
    სვანეთის მიუწვდომლობის გამო გადარჩა. ცალკე ღირს მიხეილ ხერგიანის სახლ-მუზეუმის ნახვა — ლეგენდარული
    მთამსვლელის ოჯახის კოშკიანი სახლი.


    რას ნახავთ კონკრეტულად:


    - **მაჩუბი** — ტრადიციული სვანური სახლი, სადაც ოჯახი და პირუტყვი ერთ სივრცეში ზამთრობდა

    - **სეტი მოედანი** — ქალაქის ცენტრი კაფეებით, საინფორმაციო ცენტრითა და გიდების ბირჟით

    - **ჯვრის ხედი** — მოკლე აღმართი ქალაქის ზემოთ, საიდანაც უშბის ორთავიანი მასივი ჩანს


    მესტია ასევე ბაზაა: აქედან იწყება მარშრუტები ჭალაადის მყინვარამდე, კორულდის ტბებამდე, ჰაწვალისა და
    თეთნულდის კურორტებამდე და უშგულამდე. სასტუმროების, გასაქირავებელი ოთახებისა და კვების არჩევანი ყველაზე
    ფართოა მთელ რეგიონში.
  tip: >-
    მესტიაში მინიმუმ ორი ღამე დაგეგმეთ — ერთდღიანი ვიზიტი მხოლოდ გზაში დაღლაა. საუკეთესო დროა ივნისის
    ბოლოდან სექტემბრის ბოლომდე; ზამთარში ქალაქი მუშაობს, მაგრამ გზა ზოგჯერ ზვავის გამო იკეტება. ამინდი
    დღეში რამდენჯერმე იცვლება, ამიტომ წვიმის ქურთუკი და თბილი შრე ზაფხულშიც აუცილებელია. მანქანა სასტუმროსთან
    ან სეტის მოედნის მიმდებარე ქუჩებზე დატოვეთ — ცენტრი პატარაა და ყველგან ფეხით მიდიხართ. ბანკომატები
    და აფთიაქი ცენტრშია, მაგრამ ბარათით ყველგან ვერ გადაიხდით — ნაღდი ლარი თან იქონიეთ.
  route: >-
    თბილისიდან მესტიამდე დაახლოებით 470 კმ და რვა-ცხრა საათია: E60-ით ქუთაისისა და სამტრედიის გავლით ზუგდიდამდე,
    შემდეგ ჩრდილოეთით ჯვრის კაშხალზე და ენგურის ხეობაში. ზუგდიდი–მესტიის 130 კმ ბოლომდე ასფალტია, მაგრამ
    ვიწრო, სერპანტინიანი და მოხვევებით სავსე — სამ საათს ითვლიან. ერთ დღეში გავლა შესაძლებელია, თუმცა
    ქუთაისში ან ზუგდიდში გაჩერება ბევრად კომფორტულია. ბოლო საიმედო ბენზინგასამართები ზუგდიდსა და ჯვარშია;
    ხეობაში არჩევანი მცირდება. კროსოვერი უფრო კომფორტულია გრძელი სერპანტინისთვის, თუმცა ტექნიკურად სედანიც
    ადის.
en:
  name: Mestia and the Svan Towers
  short: >-
    Upper Svaneti's main town at 1,500 m — medieval stone defence towers, two strong museums and the trailhead
    for every route in the region.
  body: >-
    Mestia is the administrative and tourist centre of Upper Svaneti, sitting at roughly 1,500 metres
    in the upper Enguri gorge. What makes it unusual is that its history is not locked inside a museum:
    the stone defence towers, most of them dating from the ninth to thirteenth centuries, still stand
    in ordinary family yards. Svan households built them for two overlapping reasons — protection from
    raiders, and shelter during avalanches and the long blood-feud disputes that shaped local law.


    The old quarters of Lanchvali, Lagami and Lekhtagi are separated by footbridges and narrow lanes,
    and you can walk the lot in half a day. The Svaneti Museum of History and Ethnography holds processional
    crosses, icons, chased metalwork and manuscripts that survived precisely because the region was so
    hard to reach; several pieces were hidden in mountain churches for centuries. The Mikheil Khergiani
    House-Museum, in the tower house of Georgia's most famous climber, is worth a separate half hour.


    What you will actually see:


    - **Machubi** — the traditional Svan house where family and livestock wintered in one hall

    - **Seti Square** — the town centre, with cafes, the information point and the guide exchange

    - **The Cross viewpoint** — a short climb above town with the twin summits of Ushba ahead


    Mestia is also a base. Routes to the Chalaadi glacier, the Koruldi lakes, the Hatsvali and Tetnuldi
    ski areas and Ushguli all start here, and the choice of guesthouses and food is the widest in the
    region.
  tip: >-
    Plan at least two nights in Mestia; a single-day visit is mostly driving. Late June to late September
    is the reliable window. The town works in winter too, but the road occasionally closes after avalanches.
    Weather changes several times a day, so a rain shell and a warm layer are needed even in August. Park
    at your guesthouse or on the streets around Seti Square and walk everywhere — the centre is tiny.
    ATMs and a pharmacy are in the centre, but card payment is not universal, so carry some cash in lari.
  route: >-
    Mestia is about 470 km and eight to nine hours from Tbilisi. Take the E60 west through Kutaisi and
    Samtredia to Zugdidi, then turn north past the Enguri dam at Jvari and into the gorge. The 130 km
    from Zugdidi to Mestia is fully paved but narrow and endlessly winding — count on three hours for
    that stretch alone. Doing it in one day is possible, but an overnight stop in Kutaisi or Zugdidi makes
    the trip far more pleasant. The last dependable fuel stations are in Zugdidi and Jvari. A crossover
    is more comfortable on the long switchbacks, though a sedan will manage.
ru:
  name: Местиа и сванские башни
  short: >-
    Центр Верхней Сванетии на высоте 1500 м — средневековые каменные башни, сильные музеи и старт всех
    горных маршрутов региона.
  body: >-
    Местиа — административный и туристический центр Верхней Сванетии, расположенный примерно на 1500 метрах
    в верхней части Ингурского ущелья. Необычно здесь то, что история не заперта в музее: каменные оборонительные
    башни, большинство из которых относится к IX–XIII векам, до сих пор стоят в обычных жилых дворах.
    Сванские семьи строили их сразу с двумя целями — защита от набегов и убежище во время схода лавин
    и долгих кровных распрей, которые веками определяли местное право.


    Старые кварталы Ланчвали, Лагами и Лехтаги разделены пешеходными мостиками и узкими переулками, обойти
    их можно за полдня. Музей истории и этнографии Сванетии хранит выносные кресты, иконы, чеканку и рукописи,
    уцелевшие именно из-за труднодоступности края: многое веками прятали в горных церквях. Отдельного
    получаса заслуживает дом-музей Михаила Хергиани, легендарного альпиниста, устроенный в башенном доме
    его семьи.


    Что вы увидите конкретно:


    - **Мачуби** — традиционный сванский дом, где семья и скот зимовали в одном помещении

    - **Площадь Сети** — центр городка с кафе, информационным пунктом и биржей гидов

    - **Смотровая у креста** — короткий подъём над посёлком с видом на двуглавую Ушбу


    Местиа служит и базой: отсюда начинаются маршруты к леднику Чалаади, озёрам Корульди, на курорты Хацвали
    и Тетнулди и в Ушгули. Выбор гостевых домов и еды здесь самый широкий в регионе.
  tip: >-
    Закладывайте на Местиа минимум две ночи — однодневный визит превращается в сплошную дорогу. Надёжное
    окно: с конца июня до конца сентября. Зимой посёлок работает, но дорогу иногда закрывают из-за лавин.
    Погода меняется по нескольку раз в день, поэтому дождевая куртка и тёплый слой нужны даже в августе.
    Машину оставьте у гостевого дома или на улицах вокруг площади Сети — центр крошечный, всё обходится
    пешком. Банкоматы и аптека есть, но карты принимают не везде: держите наличные лари.
  route: >-
    От Тбилиси до Местиа около 470 км и восемь-девять часов. Сначала по трассе E60 на запад через Кутаиси
    и Самтредиа до Зугдиди, затем поворот на север мимо Ингурской ГЭС в Джвари и дальше в ущелье. Участок
    Зугдиди — Местиа длиной 130 км полностью асфальтирован, но узок и состоит из бесконечных поворотов:
    на него закладывайте три часа. Проехать всё за день реально, однако ночёвка в Кутаиси или Зугдиди
    делает поездку куда комфортнее. Последние надёжные заправки — в Зугдиди и Джвари. Кроссовер удобнее
    на длинном серпантине, хотя технически доедет и седан.
fa:
  name: مستیا و برج‌های سوان
  short: >-
    شهر اصلی سوانتی علیا در 1,500 متر — برج‌های دفاعی سنگی سده‌های میانه، دو موزهٔ قوی و سرآغاز همهٔ مسیرهای
    منطقه.
  body: >-
    مستیا مرکز اداری و گردشگری سوانتی علیا است و در حدود 1,500 متری بالادست تنگهٔ انگوری نشسته است. آنچه
    آن را غیرعادی می‌کند این است که تاریخش در موزه حبس نشده: برج‌های دفاعی سنگی، که بیشترشان به سده‌های
    نهم تا سیزدهم می‌رسند، هنوز در حیاط خانه‌های معمولی ایستاده‌اند. خانوارهای سوان آن‌ها را به دو دلیل
    هم‌پوشان ساختند — حفاظت در برابر مهاجمان، و پناه در برابر بهمن و کشمکش‌های طولانی خون‌خواهی که قانون
    محلی را شکل می‌داد.


    محله‌های قدیمی لانچوالی، لاگامی و لختاگی با پل‌های پیاده و کوچه‌های باریک از هم جدا می‌شوند و همه
    را می‌توان در نیم روز پیاده گشت. موزهٔ تاریخ و مردم‌شناسی سوانتی صلیب‌های تشریفاتی، شمایل، فلزکاری
    کوبیده و دست‌نویس‌هایی را نگه می‌دارد که دقیقاً به سبب دشواری دسترسی به منطقه باقی مانده‌اند؛ چند
    قطعه قرن‌ها در کلیساهای کوهستانی پنهان بودند. خانه-موزهٔ میخئیل خرگیانی، در برج‌خانهٔ نامدارترین کوهنورد
    گرجستان، نیم ساعت جداگانه می‌ارزد.


    آنچه واقعاً می‌بینید: **ماچوبی**، خانهٔ سنتی سوان که خانواده و دام در یک تالار زمستان را در آن می‌گذراندند؛
    **میدان ستی**، مرکز شهر با کافه‌ها، باجهٔ اطلاعات و محل یافتن راهنما؛ و **دیدگاه صلیب**، صعودی کوتاه
    بالای شهر با دو قلهٔ اوشبا در برابر. مستیا پایگاه هم هست: مسیرهای یخچال چالاادی، دریاچه‌های کورولدی،
    پیست‌های هاتسوالی و تتنولدی و اوشگولی همه از اینجا آغاز می‌شوند و انتخاب مهمان‌خانه و غذا در کل منطقه
    از همه‌جا گسترده‌تر است.
  tip: >-
    دست‌کم دو شب برای مستیا در نظر بگیرید؛ بازدید یک‌روزه بیشترش رانندگی است. پنجرهٔ مطمئن از اواخر ژوئن
    تا اواخر سپتامبر است. شهر در زمستان هم کار می‌کند، اما جاده گاهی پس از بهمن بسته می‌شود. هوا روزی
    چند بار عوض می‌شود، پس حتی در اوت هم بارانی و یک لایهٔ گرم لازم است. خودرو را در مهمان‌خانه یا در
    خیابان‌های اطراف میدان ستی بگذارید و همه‌جا پیاده بروید — مرکز بسیار کوچک است. خودپرداز و داروخانه
    در مرکز هست، اما پرداخت با کارت همه‌جا ممکن نیست، پس مقداری پول نقد به لاری همراه داشته باشید.
  route: >-
    از تفلیس تا مستیا حدود 470 کیلومتر و هشت تا نه ساعت راه است. با E60 رو به غرب از کوتایسی و سامتردیا
    تا زوگدیدی می‌روید، سپس رو به شمال از کنار سد انگوری در جواری به درون تنگه می‌پیچید. 130 کیلومتر زوگدیدی
    تا مستیا کاملاً آسفالت است اما باریک و بی‌وقفه پرپیچ — برای همین مقطع سه ساعت حساب کنید. انجام آن
    در یک روز ممکن است، اما یک شب توقف در کوتایسی یا زوگدیدی سفر را بسیار خوشایندتر می‌کند. آخرین جایگاه‌های
    سوخت قابل‌اتکا در زوگدیدی و جواری‌اند. کراس‌اوور در سربالایی‌های مارپیچ راحت‌تر است، هرچند سدان هم
    از پس آن برمی‌آید.
he:
  name: מסטיה ומגדלי סוואן
  short: >-
    העיירה הראשית של סוואנטי העילית בגובה 1,500 מ' — מגדלי הגנה מימי הביניים, שני מוזיאונים חזקים ונקודת
    הזינוק לכל מסלול באזור.
  body: >-
    מסטיה היא המרכז המנהלי והתיירותי של סוואנטי העילית, והיא יושבת בגובה של כ-1,500 מטר בחלק העליון של
    ערוץ אנגורי. מה שהופך אותה ליוצאת דופן הוא שההיסטוריה שלה אינה נעולה בתוך מוזיאון: מגדלי ההגנה מאבן,
    שרובם מן המאות התשיעית עד השלוש-עשרה, עומדים עד היום בחצרות של משפחות רגילות. משקי הבית הסוואניים
    בנו אותם משתי סיבות שנשזרו זו בזו — הגנה מפני פושטים, ומחסה בזמן מפולות שלגים ובמהלך סכסוכי הדם הארוכים
    שעיצבו את המשפט המקומי.


    הרבעים העתיקים לאנצ'וואלי, לגאמי ולחתגי מופרדים בגשרים להולכי רגל ובסמטאות צרות, ואפשר לעבור את כולם
    בחצי יום של הליכה. מוזיאון סוואנטי להיסטוריה ולאתנוגרפיה מחזיק צלבי תהלוכה, איקונות, מלאכת מתכת מוקשה
    וכתבי יד ששרדו דווקא מפני שהאזור היה קשה כל כך להגעה; כמה פריטים הוסתרו במשך מאות שנים בכנסיות הרים.
    בית-המוזיאון של מיכאיל חרגיאני, במגדל המגורים של המטפס המפורסם ביותר בגאורגיה, שווה חצי שעה נפרדת.


    מה שרואים בפועל: **מאצ'ובי** — בית סוואני מסורתי שבו חרפו המשפחה והבהמות יחד באולם אחד; **כיכר סטי**
    — מרכז העיירה עם בתי קפה, נקודת מידע ומקום המפגש עם מדריכים; ו**תצפית הצלב** — טיפוס קצר מעל העיירה
    עם שתי פסגות אושבה ממול. מסטיה היא גם בסיס: המסלולים אל קרחון צ'לאדי, אגמי קורולדי, אתרי הסקי הצוואלי
    וטטנולדי ואושגולי מתחילים כולם כאן, ומבחר בתי ההארחה והאוכל הוא הרחב באזור.
  tip: >-
    תכננו לפחות שתי לינות במסטיה; ביקור של יום אחד הוא בעיקר נסיעה. החלון האמין נמשך מסוף יוני עד סוף
    ספטמבר. העיירה פועלת גם בחורף, אך הכביש נסגר לעיתים אחרי מפולות שלגים. מזג האוויר משתנה כמה פעמים
    ביום, ולכן מעיל גשם ושכבה חמה נדרשים גם באוגוסט. החנו ליד בית ההארחה או ברחובות סביב כיכר סטי ולכו
    לכל מקום ברגל — המרכז זעיר. כספומטים ובית מרקחת יש במרכז, אך תשלום בכרטיס אינו אפשרי בכל מקום, לכן
    החזיקו מזומן בלארי.
  route: >-
    ממסטיה לטביליסי כ-470 ק"מ ושמונה עד תשע שעות. סעו בכביש E60 מערבה דרך קוטאיסי וסמטרדיה עד זוגדידי,
    ואז פנו צפונה על פני סכר אנגורי בג'וארי ואל תוך הערוץ. 130 הקילומטרים מזוגדידי למסטיה סלולים לחלוטין
    אך צרים ומתפתלים בלי הפסקה — הניחו שלוש שעות לקטע הזה לבדו. אפשר לעשות את כל הדרך ביום אחד, אך לינת
    ביניים בקוטאיסי או בזוגדידי הופכת את הנסיעה לנעימה בהרבה. תחנות הדלק האמינות האחרונות נמצאות בזוגדידי
    ובג'וארי. קרוסאובר נוח יותר בסיבובי ההרים הארוכים, אם כי גם סדאן יסתדר.
ar:
  name: ميستيا وأبراج سفانيتي
  short: >-
    بلدة سفانيتي العليا الرئيسية على ارتفاع 1,500 م — أبراج دفاعية حجرية من العصور الوسطى ومتحفان قويان
    ونقطة انطلاق كل مسارات الإقليم.
  body: >-
    ميستيا هي المركز الإداري والسياحي لسفانيتي العليا، وتقع على ارتفاع نحو 1,500 متر في أعالي مضيق إنغوري.
    وما يجعلها استثنائية أن تاريخها ليس محبوساً داخل متحف: فأبراج الدفاع الحجرية، ومعظمها يعود إلى القرون
    من التاسع إلى الثالث عشر، ما زالت قائمة في أفنية بيوت عادية. وقد بناها أهل سفانيتي لسببين متداخلين
    — الحماية من الغزاة، والاحتماء أثناء الانهيارات الثلجية وخلال نزاعات الثأر الطويلة التي صاغت العرف
    المحلي.


    تفصل الجسور الصغيرة والأزقة الضيقة بين الأحياء القديمة لانتشفالي ولاغامي وليختاغي، ويمكن قطعها كلها
    سيراً في نصف يوم. ويضم متحف سفانيتي للتاريخ والإثنوغرافيا صلباناً موكبية وأيقونات ومشغولات معدنية
    مطروقة ومخطوطات نجت تحديداً لأن الوصول إلى الإقليم كان بالغ الصعوبة؛ وقد أُخفيت عدة قطع منها قروناً
    في كنائس الجبال. أما بيت-متحف ميخائيل خيرغياني، في البرج الذي سكنه أشهر متسلقي جورجيا، فيستحق نصف
    ساعة مستقلة.


    وما تراه فعلاً: **ماتشوبي** — البيت السفاني التقليدي حيث كانت الأسرة والماشية تقضيان الشتاء في قاعة
    واحدة؛ و**ساحة سيتي** — مركز البلدة بمقاهيها ونقطة المعلومات وملتقى المرشدين؛ و**مطل الصليب** — صعود
    قصير فوق البلدة تظهر منه قمتا أوشبا التوأمان. وميستيا قاعدة أيضاً: فمسارات نهر تشالادي الجليدي وبحيرات
    كورولدي ومنطقتي التزلج هاتسفالي وتيتنولدي وأوشغولي تبدأ كلها من هنا، وخيارات بيوت الضيافة والطعام
    هي الأوسع في الإقليم.
  tip: >-
    خطط لليلتين على الأقل في ميستيا؛ فزيارة اليوم الواحد معظمها قيادة. والنافذة الموثوقة من أواخر يونيو
    إلى أواخر سبتمبر. تعمل البلدة شتاءً أيضاً، لكن الطريق يُغلق أحياناً بعد الانهيارات الثلجية. ويتبدل
    الطقس عدة مرات في اليوم، لذا تلزم سترة مطر وطبقة دافئة حتى في أغسطس. اركن عند بيت الضيافة أو في الشوارع
    المحيطة بساحة سيتي وتنقل سيراً — فالمركز صغير جداً. أجهزة الصراف والصيدلية في الوسط، لكن الدفع بالبطاقة
    ليس متاحاً في كل مكان، فاحمل بعض النقد باللاري.
  route: >-
    تبعد ميستيا عن تبليسي نحو 470 كم وثماني إلى تسع ساعات. اسلك الطريق E60 غرباً عبر كوتايسي وسامتريديا
    إلى زوغديدي، ثم انعطف شمالاً بمحاذاة سد إنغوري عند جفاري ثم إلى داخل المضيق. و130 كم بين زوغديدي وميستيا
    معبّدة بالكامل لكنها ضيقة وشديدة التعرج — احسب ثلاث ساعات لهذا المقطع وحده. ويمكن قطع الطريق كله في
    يوم واحد، لكن مبيتاً في كوتايسي أو زوغديدي يجعل الرحلة أمتع بكثير. وآخر محطات الوقود التي يُعتمد عليها
    في زوغديدي وجفاري. وسيارة كروس أوفر أريح على المنعطفات الطويلة، وإن كانت السيدان تتدبر الأمر.
