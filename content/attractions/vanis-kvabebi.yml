ka:
  name: ვანის ქვაბები
  short: >-
    VIII საუკუნის კლდის მონასტერი ვარძიიდან ორ კილომეტრში, სადაც XV საუკუნეში ქალებმა სამლოცველოს კედელზე
    რუსთაველის სტროფები მელნით ჩაწერეს.
  body: >-
    **გამოქვაბულების ყველაზე ზედა სართულზე, კლდეში ჩაშენებულ პატარა ეკლესიაში, XV საუკუნეში იძულებით მოყვანილმა
    ქალებმა კედლებზე ლექსები დაწერეს — მათ შორის „ვეფხისტყაოსნის“ ორი სტროფიც.**


    ვანის ქვაბები ვარძიაზე დაახლოებით ოთხი საუკუნით ძველია: ეკლესიიანი ქვაბების უძველესი ჯგუფი არაუგვიანეს
    VIII საუკუნისაა. IX–XI საუკუნეებში უდაბნო წმინდა გიორგის გუმბათოვანი ტაძრის გარშემო გაიზარდა, სანამ
    1089 წლის მიწისძვრამ მისი შუაგული ტაძრიანად არ ჩამოშალა. 1186–1191 წლებში მონასტრის პატრონმა, იჩქით
    გურგენისძემ, ის განაახლა და წმინდა გიორგის ტაძარი ძვირფასი ხატებით შეამკო, 1204 წელს კი მწიგნობართუხუცესმა
    ანტონ ჭყონდიდელმა ძველი ქვითკირის ზღუდე აღადგინა — სწორედ ის, რომელსაც გზიდან ხედავთ. 1283 წელს კვლავ
    მიწისძვრა დაატყდა; რაც მიწამ დაიწყო, 1551 წელს სპარსელებმა და 1576 წელს ოსმალებმა დაასრულეს, და ბერებმა
    მონასტერი მიატოვეს.


    დღეს აქ დაახლოებით ორასი ქვაბია, თექვსმეტამდე სართულად დალაგებული: სენაკები, სამარხები, წყალსადენის
    ნაშთები და მარანი, სადაც არქეოლოგებმა რვა ქვევრი იპოვეს. მორკალული ზღუდე კლდის წინ ტერასებად დაშვებულ
    ეზოს კეტავს; აქვე, მიწიდან, XII საუკუნის ვერცხლის სამი თასი ამოვიდა.


    ზემოთ ასვლა კი წარწერების გამოა ღირს. მელნით, მხედრულად ნაწერ სტრიქონებში ჩანს სახელები — გულქანი,
    ანა რჩეულიშვილი, თუმიან გოჯიშვილი; ჩანს ბედის მდურავი სიტყვები, სატრფიალო ლექსები, „როსტომიანის“ სტროფი
    და, ზეპირად ჩაწერილი, ნესტანის წერილი ქაჯეთის ციხიდან.


    ნესტანი ციხიდან წერდა, ეს ქალები კი კლდიდან გადაწერდნენ მის სიტყვებს. ამ კლდეს რვა საუკუნე ბერები
    ჩიჩქნიდნენ, მაგრამ მეხსიერებაში სწორედ ქალების ხელწერა გრჩებათ.
  tip: >-
    საათნახევრიდან ორ საათამდე დაუთმეთ. ბილიკები ციცაბოა — გამოკვეთილი საფეხურები, დაბალი გვირაბები და
    მოაჯირის გარეშე კიდეები, — ამიტომ მოუცურებელი ფეხსაცმელი ჩაიცვით და ხელები თავისუფალი დაიტოვეთ. ვისაც
    სიმაღლის ეშინია, ქვედა ტერასებზეც ბევრს ნახავს. ტუფი სიცხეს უკან აბრუნებს, ჩრდილი კი არსად არის: წყალი
    და ქუდი აიღეთ და ადრე მოდით. ზამთარში ზედა სართულები იყინება და რისკად არ ღირს. ეკლესიებს სალოცავად
    მოეპყარით: მხრები და მუხლები დაფარული უნდა იყოს. წარწერებს ხელს ნუ ახლებთ. ტუალეტი და კაფეები ვარძიაშია.
  route: >-
    თბილისიდან E60/S1-ით ხაშურამდე, შემდეგ S8-ით ბორჯომის გავლით ახალციხემდე, იქიდან კი S11-ით ასპინძამდე.
    ასპინძიდან გზა მტკვარს მიუყვება, ხერთვისს ჩაუვლის და ვარძიისკენ მიდის; ასპინძიდან დაახლოებით 27 კილომეტრში,
    ვარძიამდე ორიოდე კილომეტრით ადრე, პატარა ნიშანი მოკლე მისასვლელ გზაზე გადასახვევს აღნიშნავს. სულ 262
    კილომეტრი, დაახლოებით 4 საათი და 15 წუთი. გადასახვევამდე ასფალტია, ბოლო რამდენიმე ასეული მეტრი კი
    ხრეშიანი: მშრალ ამინდში ეკონომკლასიც ავა, წვიმის შემდეგ ღრმულებს ჯიპი უფრო მშვიდად გადალახავს. საწვავი
    ახალციხეში ან ასპინძაში ჩაასხით.
en:
  name: Vanis Kvabebi
  short: >-
    An 8th-century cave monastery two kilometres from Vardzia, where women in the 15th century inked verses
    of Rustaveli on a chapel wall.
  body: >-
    **In a tiny church built into the rock on the highest level of these caves, women brought here against
    their will in the 15th century wrote poetry on the walls, including two stanzas of The Knight in the
    Panther's Skin.**


    Vanis Kvabebi is some four centuries older than Vardzia: its first hermits' caves, with a church,
    date from no later than the 8th century. Between the 9th and 11th centuries the monastery grew around
    a domed church of St George, until the earthquake of 1089 brought down its centre, church and all.
    In 1186–1191 its lord, Ichkit Gurgenidze, rebuilt it and adorned St George's with precious icons,
    and in 1204 the royal chancellor Anton Chkondideli restored the stone wall that you see from the road.
    Another earthquake struck in 1283; Persian raiders in 1551 and Ottoman troops in 1576 finished what
    the ground had begun, and the monks left.


    What remains is some two hundred caves stacked on as many as sixteen levels: cells, burial chambers,
    water channels, and a wine cellar where excavators found eight qvevri. The curved wall closes off
    a terraced courtyard in front of the rock, and three 12th-century silver bowls came out of the ground
    here.


    The inscriptions are the reason to climb. Written in ink, in mkhedruli script, they carry names such
    as Gulkan, Ana Rcheulishvili and Tumian Gojishvili, complaints about their fate, love lyrics, a stanza
    of the Rostomiani and, from memory, the lines of Nestan's letter from the fortress of Kajeti.


    Nestan wrote from a fortress; these women copied her from a cliff. Monks worked this rock for eight
    centuries, yet it is the women's handwriting that stays with you.
  tip: >-
    Allow one and a half to two hours. The paths are steep, with cut steps, low tunnels and unrailed ledges,
    so wear shoes that grip and keep your hands free. Anyone uneasy with heights will still find the lower
    terraces rewarding. The tuff throws back the heat and there is no shade: bring water and a hat, and
    come early. In winter the upper levels ice over and are not worth the risk. Treat the churches as
    sacred spaces: shoulders and knees covered. Never touch the inscriptions. Toilets and cafés are at
    Vardzia.
  route: >-
    From Tbilisi take the E60/S1 to Khashuri and the S8 through Borjomi to Akhaltsikhe, then the S11 to
    Aspindza. From there a road follows the Mtkvari past Khertvisi towards Vardzia; about 27 km after
    Aspindza, some two kilometres short of Vardzia, a small sign marks the turn onto a short access road.
    In all it is 262 km and about 4 hours 15 minutes. It is asphalt to the turn, and the last few hundred
    metres are gravel, fine in dry weather in an economy car, though an SUV handles the ruts after rain
    more calmly. Fuel up in Akhaltsikhe or Aspindza.
ru:
  name: Ванис Квабеби
  short: >-
    Пещерный монастырь VIII века в двух километрах от Вардзии, где в XV веке женщины вывели чернилами
    на стене часовни строки Руставели.
  body: >-
    **В крошечной церкви, врезанной в скалу на самом верхнем ярусе этих пещер, женщины, привезённые сюда
    против воли в XV веке, писали на стенах стихи — среди них две строфы «Витязя в тигровой шкуре».**


    Ванис Квабеби примерно на четыре столетия старше Вардзии: первые кельи отшельников вместе с церковью
    появились здесь не позднее VIII века. В IX–XI веках монастырь разросся вокруг купольной церкви Святого
    Георгия, пока землетрясение 1089 года не обрушило его сердцевину вместе с храмом. В 1186–1191 годах
    владетель этих мест Ичкит Гургенидзе отстроил обитель заново и украсил церковь Святого Георгия драгоценными
    иконами, а в 1204 году царский канцлер Антон Чкондидели восстановил каменную стену, которую видно
    с дороги. В 1283 году ударило новое землетрясение; персидские отряды в 1551 году и османские войска
    в 1576-м довершили то, что начала земля, и монахи ушли.


    Осталось около двухсот пещер, поднимающихся ярусами — их здесь до шестнадцати: кельи, погребальные
    камеры, водоводы и винный погреб, где при раскопках нашли восемь квеври. Изогнутая стена замыкает
    террасированный двор перед скалой; здесь же из земли извлекли три серебряные чаши XII века.


    Подниматься стоит ради надписей. Выведенные чернилами, письмом мхедрули, они хранят имена — Гулкан,
    Ана Рчеулишвили, Тумиан Годжишвили, — жалобы на судьбу, любовную лирику, строфу из «Ростомиани» и
    записанные по памяти строки письма Нестан из крепости Каджети.


    Нестан писала из крепости, а эти женщины переписывали её строки в скале. Монахи трудились в этом камне
    восемь веков, но в памяти остаётся именно женский почерк.
  tip: >-
    Закладывайте полтора-два часа. Тропы крутые: вырубленные ступени, низкие туннели, уступы без перил,
    так что нужна обувь с цепкой подошвой и свободные руки. Тем, кто плохо переносит высоту, будет интересно
    и на нижних террасах. Туф отдаёт жар, а тени нет: берите воду и шляпу и приезжайте пораньше. Зимой
    верхние ярусы обледеневают, и рисковать ради них не стоит. Относитесь к церквям как к святыне: плечи
    и колени должны быть закрыты. Ни в коем случае не трогайте надписи. Туалеты и кафе — в Вардзии.
  route: >-
    Из Тбилиси по E60/S1 до Хашури, по S8 через Боржоми до Ахалцихе, затем по S11 до Аспиндзы. Оттуда
    дорога идёт вдоль Куры мимо Хертвиси в сторону Вардзии; примерно через 27 км после Аспиндзы, километра
    за два до Вардзии, небольшой указатель отмечает поворот на короткий подъезд. Всего 262 км, около 4
    часов 15 минут. До поворота асфальт, последние несколько сотен метров — гравийка: в сухую погоду она
    вполне по силам машине эконом-класса, хотя после дождя внедорожник спокойнее проходит колеи. Заправьтесь
    в Ахалцихе или Аспиндзе.
fa:
  name: وانیس کوابِبی
  short: >-
    صومعه‌ای غاری از قرن هشتم، دو کیلومتر دورتر از واردزیا، جایی که زنانی در قرن پانزدهم ابیاتی از روستاولی
    را با مرکب بر دیوار کلیسایی کوچک نوشتند.
  body: >-
    **در کلیسایی کوچک که در بالاترین طبقهٔ این غارها در دل صخره ساخته شده، زنانی که در قرن پانزدهم به
    اجبار به اینجا آورده شده بودند بر دیوارها شعر نوشتند، و در میان آن‌ها دو بند از «پهلوان پلنگینه‌پوش».**


    وانیس کوابِبی حدود چهار سده از واردزیا کهن‌تر است: نخستین غارهای زاهدان، همراه با یک کلیسا، دست‌کم
    به قرن هشتم بازمی‌گردند. میان قرن‌های نهم و یازدهم، صومعه گرد کلیسای گنبددار گئورگ مقدس گسترش یافت،
    تا اینکه زلزلهٔ ۱۰۸۹ مرکز آن را، همراه با کلیسا، فرو ریخت. در ۱۱۸۶ تا ۱۱۹۱ ارباب این سرزمین، ایچکیت
    گورگنیدزه، آن را از نو ساخت و کلیسای گئورگ مقدس را با شمایل‌های گران‌بها آراست، و در ۱۲۰۴ آنتون چکوندیدلی،
    صدراعظم پادشاه، دیوار سنگی‌ای را که از جاده می‌بینید مرمت کرد. در ۱۲۸۳ زلزلهٔ دیگری رخ داد؛ یورشگران
    ایرانی در ۱۵۵۱ و سپاهیان عثمانی در ۱۵۷۶ کاری را که زمین آغاز کرده بود تمام کردند، و راهبان رفتند.


    آنچه مانده حدود دویست غار است که در حداکثر شانزده طبقه روی هم چیده شده‌اند: حجره‌ها، دخمه‌های تدفین،
    آبراه‌ها، و انبار شرابی که کاوشگران در آن هشت کووری، خمرهٔ سفالی شراب، یافتند. دیوار خمیده حیاطی پلکانی
    را جلوی صخره می‌بندد، و سه کاسهٔ نقره از قرن دوازدهم از خاک همین‌جا بیرون آمد.


    کتیبه‌ها دلیل بالا رفتن‌اند. این نوشته‌ها که با مرکب و به خط مخدرولی نگاشته شده‌اند، نام‌هایی چون
    گولکان، آنا رچئولیشویلی و تومیان گوجیشویلی را در خود دارند، و نیز شکوه از سرنوشت، اشعار عاشقانه، بندی
    از «روستومیانی» و سطرهای نامهٔ نستان از دژ کاجتی را که از حافظه نوشته شده‌اند.


    نستان از دژی نامه نوشت؛ این زنان سخن او را در دل صخره بازنوشتند. راهبان هشت سده در این سنگ کار کردند،
    اما آنچه در یاد می‌ماند دست‌خط زنان است.
  tip: >-
    یک و نیم تا دو ساعت وقت بگذارید. مسیرها شیب‌دارند، با پله‌های کنده‌شده در سنگ، تونل‌های کوتاه‌سقف
    و لبه‌های بی‌نرده؛ پس کفشی با کف غیرلغزنده بپوشید و دست‌هایتان را آزاد نگه دارید. کسی هم که از ارتفاع
    هراس دارد، در تراس‌های پایینی چیزهای دیدنی فراوانی خواهد یافت. سنگ توف گرما را پس می‌دهد و سایه‌ای
    نیست: آب و کلاه بیاورید و زود برسید. در زمستان طبقه‌های بالایی یخ می‌بندند و ارزش خطر کردن ندارند.
    با کلیساها چون مکان‌های مقدس رفتار کنید: شانه‌ها و زانوها پوشیده باشد. هرگز به کتیبه‌ها دست نزنید.
    سرویس بهداشتی و کافه در واردزیاست.
  route: >-
    از تفلیس با E60/S1 تا خاشوری و با S8 از راه بورجومی تا آخالتسیخه بروید، سپس با S11 تا آسپیندزا. از
    آنجا جاده‌ای در امتداد رود متکواری از کنار خرتویسی به سوی واردزیا می‌رود؛ حدود ۲۷ کیلومتر پس از آسپیندزا،
    نزدیک دو کیلومتر مانده به واردزیا، تابلوی کوچکی انشعاب یک راه دسترسی کوتاه را نشان می‌دهد. روی هم
    ۲۶۲ کیلومتر و حدود ۴ ساعت و ۱۵ دقیقه. تا سر انشعاب آسفالت است و چند صد متر آخر شنی؛ در هوای خشک خودروی
    اقتصادی از پسش برمی‌آید، هرچند پس از باران خودروی شاسی‌بلند با آرامش بیشتری از شیارها می‌گذرد. در
    آخالتسیخه یا آسپیندزا سوخت‌گیری کنید.
he:
  name: ואניס קוואבבי
  short: >-
    מנזר מערות מהמאה ה-8, שני קילומטרים מוורדזיה, שבו נשים במאה ה-15 כתבו בדיו שורות של רוסתוולי על קיר
    של כנסייה קטנה.
  body: >-
    **בכנסייה זעירה הבנויה בתוך הסלע, בקומה העליונה של המערות האלה, כתבו נשים שהובאו לכאן בעל כורחן במאה
    ה-15 שירים על הקירות, וביניהם שני בתים מתוך "האביר בעור הנמר".**


    ואניס קוואבבי עתיק מוורדזיה בכארבע מאות שנה: מערות הנזירים הראשונות שלו, ועמן כנסייה, מתוארכות לא
    יאוחר מן המאה ה-8. בין המאה ה-9 למאה ה-11 גדל המנזר סביב כנסיית כיפה על שם גאורגיוס הקדוש, עד שרעידת
    האדמה של 1089 מוטטה את לבו, ואת הכנסייה עמו. ב-1186–1191 בנה אותו מחדש אדון המקום, איצ'קיט גורגנידזה,
    וקישט את כנסיית גאורגיוס הקדוש באיקונות יקרות ערך, וב-1204 שיקם הקנצלר המלכותי אנטון צ'קונדידלי את
    חומת האבן שנראית מן הכביש. רעידת אדמה נוספת פגעה במקום ב-1283; פושטים פרסים ב-1551 וכוחות עות'מאניים
    ב-1576 השלימו את מה שהאדמה התחילה, והנזירים עזבו.


    מה שנותר הוא כמאתיים מערות הערוכות זו מעל זו בגובה של עד שש-עשרה קומות: תאי נזירים, חדרי קבורה, תעלות
    מים ומרתף יין שבו מצאו החופרים שמונה קוורי, כדי חרס גדולים ליין. חומה מעוקלת סוגרת חצר מדורגת שלפני
    הסלע, ושלוש קערות כסף מהמאה ה-12 נחשפו כאן באדמה.


    הכתובות הן הסיבה לטפס. הן נכתבו בדיו, בכתב מחדרולי, ונושאות שמות כמו גולקן, אנה רצ'אולישווילי ותומיאן
    גוג'ישווילי, תלונות על גורלן, שירי אהבה, בית מתוך "רוסטומיאני", ואת שורות מכתבה של נסטן ממבצר קג'טי,
    שנרשמו מן הזיכרון.


    נסטן כתבה ממבצר; הנשים האלה העתיקו את דבריה מתוך צוק. נזירים עבדו בסלע הזה שמונה מאות שנה, ובכל זאת
    כתב היד של הנשים הוא שנשאר איתכם.
  tip: >-
    הקדישו שעה וחצי עד שעתיים. השבילים תלולים, עם מדרגות חצובות, מנהרות נמוכות ומדפי סלע בלי מעקה, אז
    נעלו נעליים עם אחיזה טובה והשאירו את הידיים פנויות. מי שאינו חש בנוח בגובה ימצא עניין רב גם בטרסות
    התחתונות. הטוף מחזיר את החום ואין צל: הביאו מים וכובע, ובואו מוקדם. בחורף הקומות העליונות מתכסות קרח
    ואינן שוות את הסיכון. התייחסו לכנסיות כאל מקומות קדושים: כתפיים וברכיים מכוסות. לעולם אל תגעו בכתובות.
    שירותים ובתי קפה נמצאים בוורדזיה.
  route: >-
    מטביליסי סעו בכביש E60/S1 עד חשורי ובכביש S8 דרך בורג'ומי עד אחאלציחה, ומשם בכביש S11 עד אספינדזה.
    משם מלווה הכביש את המטקוורי, על פני חרטוויסי, לכיוון ורדזיה; כ-27 ק"מ אחרי אספינדזה, כשני קילומטרים
    לפני ורדזיה, שלט קטן מסמן את הפנייה לדרך גישה קצרה. בסך הכול 262 ק"מ וכ-4 שעות ו-15 דקות. עד הפנייה
    הכביש סלול, וכמה מאות המטרים האחרונים הם דרך חצץ – עבירה במזג אוויר יבש ברכב חסכוני, אם כי אחרי גשם
    רכב שטח מתמודד עם התלמים בשלווה רבה יותר. תדלקו באחאלציחה או באספינדזה.
ar:
  name: فانيس كفابيبي
  short: >-
    دير كهفي من القرن الثامن على بعد كيلومترين من فاردزيا، حيث خطّت نساء في القرن الخامس عشر بالحبر أبياتًا
    لروستافيلي على جدار كنيسة صغيرة.
  body: >-
    **في كنيسة ضئيلة مبنيّة داخل الصخر في أعلى طبقات هذه الكهوف، كتبت نساء جيء بهن إلى هنا رغمًا عنهن
    في القرن الخامس عشر شعرًا على الجدران، من بينه مقطعان من «الفارس في جلد النمر».**


    فانيس كفابيبي أقدم من فاردزيا بنحو أربعة قرون: فأولى كهوف النسّاك فيه، ومعها كنيسة، لا يتأخر تاريخها
    عن القرن الثامن. وبين القرنين التاسع والحادي عشر نما الدير حول كنيسة القديس جاورجيوس ذات القبة، إلى
    أن أسقط زلزال 1089 قلبه، والكنيسة معه. وفي 1186–1191 أعاد سيّد المكان إيتشكيت غورغينيدزه بناءه وزيّن
    كنيسة القديس جاورجيوس بأيقونات نفيسة، وفي 1204 رمّم مستشار الملك أنطون تشكونديديلي السور الحجري الذي
    ترونه من الطريق. ثم ضرب زلزال آخر عام 1283؛ وأتمّ المغيرون الفرس عام 1551 والقوات العثمانية عام 1576
    ما بدأته الأرض، فرحل الرهبان.


    وما بقي نحو مئتي كهف متراكبة في ما يصل إلى ست عشرة طبقة: صوامع، وحجرات دفن، وقنوات مياه، وقبو نبيذ
    عثر فيه المنقّبون على ثماني جرار «كفيفري» الفخارية. ويغلق السور المقوّس فناءً مدرّجًا أمام الصخر،
    ومن تربته استُخرجت ثلاث طاسات فضية من القرن الثاني عشر.


    النقوش هي سبب الصعود. كُتبت بالحبر وبخط مخدرولي، وتحمل أسماء مثل غولكان وآنا رتشيوليشفيلي وتوميان
    غوجيشفيلي، وشكاوى من المصير، وقصائد حب، ومقطعًا من «روستومياني»، وأبيات رسالة نستان من قلعة كاجيتي
    مدوّنةً من الذاكرة.


    كتبت نستان من قلعة؛ وهؤلاء النسوة نسخن كلماتها من جوف جرف. عمل الرهبان في هذه الصخرة ثمانية قرون،
    لكن خطّ النساء هو ما يبقى في الذاكرة.
  tip: >-
    خصّصوا ساعة ونصفًا إلى ساعتين. الدروب شديدة الانحدار، فيها درجات منحوتة وأنفاق منخفضة وحواف بلا درابزين،
    فارتدوا أحذية مانعة للانزلاق وأبقوا أيديكم حرة. ومن لا يرتاح للمرتفعات سيجد في المصاطب السفلى ما يستحق.
    يردّ حجر الطُّف الحرارة ولا ظل: احملوا الماء وقبعة وتعالوا باكرًا. في الشتاء تتجمّد الطبقات العليا
    ولا تستحق المجازفة. تعاملوا مع الكنائس بوصفها أماكن مقدسة: الأكتاف والركب مغطاة. لا تلمسوا النقوش
    أبدًا. دورات المياه والمقاهي في فاردزيا.
  route: >-
    من تبليسي خذوا الطريق E60/S1 إلى خاشوري، ثم S8 عبر بورجومي إلى أخالتسيخي، ثم S11 إلى أسبيندزا. ومن
    هناك يساير طريقٌ نهرَ متكفاري مرورًا بخيرتفيسي نحو فاردزيا؛ وبعد نحو 27 كم من أسبيندزا، قبل فاردزيا
    بكيلومترين تقريبًا، تشير لافتة صغيرة إلى المنعطف نحو طريق وصول قصير. المسافة الإجمالية 262 كم، ونحو
    4 ساعات و15 دقيقة. الطريق معبّد حتى المنعطف، وبضع مئات الأمتار الأخيرة حصوية، لا بأس بها في الطقس
    الجاف بسيارة اقتصادية، وإن كانت سيارة الدفع الرباعي تتعامل مع الأخاديد بعد المطر بهدوء أكبر. تزوّدوا
    بالوقود في أخالتسيخي أو أسبيندزا.
