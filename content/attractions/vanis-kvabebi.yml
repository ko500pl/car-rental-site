ka:
  name: ვანის ქვაბები
  short: ვარძიიდან ორ კილომეტრში, ტუფის კლდეში გამოკვეთილი VIII საუკუნის მრავალსართულიანი ბერთა ქალაქი.
  body: >-
    **ვანის ქვაბები ვარძიაზე ოთხასი წლით ძველია** და, სიმართლე რომ ითქვას, ბევრად უფრო ველური. კომპლექსი
    VIII საუკუნეში დაარსდა და ტუფის ციცაბო კედელში ასობით სენაკია გამოკვეთილი — რამდენიმე დონეზე, ვიწრო
    გვირაბებით, საფეხურებითა და შახტებით დაკავშირებული. ეს ერთი მონასტერი კი არა, კლდეში ჩაშენებული მთელი
    ვერტიკალური დასახლებაა.


    XII საუკუნის ბოლოს ფასადზე თავდაცვითი კედელი აღიმართა — თაღოვანი ღიობებით, პირდაპირ კლდის სიბრტყეზე
    მიდგმული. სწორედ ის ჩანს გზიდან და პირველი, რასაც ხვდები. კედლის მიღმა იწყება საკუთრივ ქვაბები: სატრაპეზოები,
    საკნები, წყალსაცავები, სამლოცველოები.


    კომპლექსში ორი ეკლესიაა — წმინდა გიორგის, ქვედა დონეზე, და პატარა სამლოცველო თითქმის მწვერვალზე, რომლამდეც
    ვიწრო გვირაბითა და რკინის კიბით ადიან. სწორედ ზედა ნაწილია მთავარი გამოცდა: ღიობები დაბალია, კიდეები
    მოაჯირის გარეშე და ქვემოთ ორმოცდაათი მეტრი. ვისაც სიმაღლის ეშინია, ქვედა დონეზე უნდა შეჩერდეს — და
    ესეც სავსებით ღირს.


    ვარძია უფრო ცნობილია, მაგრამ ეს ორი ძეგლი ხერთვისსა და თმოგვთან ერთად ერთი თავდაცვითი ჯაჭვის რგოლები
    იყო: თითოეულიდან შემდეგი ჩანდა და ხეობა მთლიანად კონტროლდებოდა. ვანის ქვაბების ზედა ტერასაზე ეს ლოგიკა
    ისე ცხადი ხდება, როგორც ვერცერთი გეგმა ვერ აჩვენებს.


    მიწისძვრებმა კომპლექსის ნაწილი ჩამოშალა, ამიტომ ბევრი სენაკი ჩამონგრეული ან მიუწვდომელია. დღეს აქ
    ისევ რამდენიმე ბერი ცხოვრობს, ამიტომ ხმაური და გაშლილი პიკნიკი ადგილს არ შეეფერება.


    ზემოდან ხედი მტკვრის ხეობაზე ღიაა თითქმის თმოგვის ციხემდე — და, ვარძიისგან განსხვავებით, აქ თითქმის
    არასოდესაა ხალხი. ვარძიის პარკინგზე ორმოცი მანქანა დგას, ვანის ქვაბებთან კი ხშირად შენი ერთადერთია.
  tip: >-
    ორი საათი დაუთმე. ასვლა ციცაბოა, ბოლო ნაწილი — რკინის კიბეები და დაბალი გვირაბები; მაგარძირიანი ფეხსაცმელი
    და თავისუფალი ხელები აუცილებელია, ჩანთა ზურგზე. ზამთარში ზედა მონაკვეთი მოყინულია და აზრი არ აქვს
    რისკს. მზისგან თავშესაფარი არაა და ტუფი ძლიერ ირეკლავს — წყალი, ქუდი და კრემი აუცილებელია. ტუალეტი
    და კაფე ვარძიაშია, ორ კილომეტრში. მოქმედი მონასტერია, ჩაცმაზე გაითვალისწინე.
  route: >-
    თბილისიდან ბორჯომსა და ახალციხეზე გავლით ვარძიის მიმართულებით — ხერთვისის შემდეგ მტკვრის ხეობას აჰყევი.
    ვანის ქვაბები ვარძიამდე ორი კილომეტრით ადრეა, გზის მარცხენა მხარეს; ნიშანი პატარაა და ადვილი გამოსატოვებელია.
    სულ 262 კმ, დაახლოებით ოთხი საათი და თხუთმეტი წუთი. მთავარი გზა ასფალტია, ბოლო რამდენიმე ასეული მეტრი
    კი მოხრეშილი ჩასახვევია. მშრალ ამინდში ჩვეულებრივი მანქანაც გაივლის. საწვავი ახალციხესა და ასპინძაში
    აიღე.
en:
  name: Vanis Kvabebi
  short: An 8th-century multi-level monks' town cut into a tuff cliff, two kilometres short of Vardzia.
  body: >-
    **Vanis Kvabebi is four hundred years older than Vardzia** and, to be honest, a great deal wilder.
    The complex was founded in the 8th century, and several hundred chambers are cut into the steep tuff
    face, arranged on several levels and linked by narrow tunnels, cut steps and shafts. This is not one
    monastery but an entire vertical settlement built into rock.


    At the end of the 12th century a defensive wall was raised across the face, with arched openings,
    set directly against the cliff. That is what you see from the road and what you meet first. Behind
    it the caves proper begin: refectories, cells, water cisterns and chapels.


    There are two churches: St George on the lower level, and a small chapel near the very top, reached
    through a narrow tunnel and up an iron ladder. The upper section is the real test. The openings are
    low, the ledges have no railing, and there is a fifty-metre drop below. Anyone uneasy with heights
    should stop at the lower level, which is thoroughly worth the visit on its own.


    Vardzia is the famous site, but the two were once links in a single defensive chain along the gorge
    together with Khertvisi and Tmogvi: from each one the next was visible, and between them they controlled
    the whole valley. Standing on the upper terrace here, that logic becomes obvious in a way no plan
    on paper can convey.


    Earthquakes have brought down part of the complex, so many cells are collapsed or unreachable. A few
    monks live here again today, so noise and spread-out picnics are out of place.


    From the top the view opens along the Mtkvari valley almost as far as Tmogvi fortress, and unlike
    Vardzia the site is almost never busy. Vardzia's car park holds forty vehicles; at Vanis Kvabebi yours
    is often the only one.
  tip: >-
    Allow two hours. The climb is steep and the final part is iron ladders and low tunnels, so wear shoes
    with grip and keep your hands free by carrying a backpack rather than a bag. In winter the upper section
    ices over and is not worth the risk. There is no shade and the tuff reflects heat hard, so water,
    a hat and sunscreen are essential. Toilets and cafes are at Vardzia, two kilometres on. This is a
    working monastery, so dress accordingly.
  route: >-
    From Tbilisi drive via Borjomi and Akhaltsikhe towards Vardzia, following the Mtkvari gorge after
    Khertvisi. Vanis Kvabebi comes two kilometres before Vardzia, on the left of the road; the sign is
    small and easy to miss. The total is 262 km, about four hours fifteen. The main road is asphalt, and
    only the last few hundred metres are a gravel access track. In dry weather an ordinary car will get
    up it. Refuel in Akhaltsikhe or Aspindza.
ru:
  name: Ванис Квабеби
  short: Многоярусный монашеский пещерный город VIII века в туфовой скале, в двух километрах не доезжая
    Вардзии.
  body: >-
    **Ванис Квабеби на четыреста лет старше Вардзии** и, если честно, куда более дикое место. Комплекс
    основан в VIII веке, и в крутой туфовой стене вырублено несколько сотен помещений, расположенных ярусами
    и связанных узкими тоннелями, ступенями и шахтами. Это не один монастырь, а целое вертикальное поселение,
    врезанное в скалу.


    В конце XII века по фасаду возвели оборонительную стену с арочными проёмами, поставленную прямо к
    обрыву. Именно её видно с дороги и с ней сталкиваешься первой. За стеной начинаются собственно пещеры:
    трапезные, кельи, водосборники, часовни.


    Церквей две: святого Георгия на нижнем ярусе и небольшая часовня почти на самом верху, к которой ведут
    узкий тоннель и железная лестница. Верхняя часть — настоящее испытание: проёмы низкие, у карнизов
    нет перил, а внизу пятьдесят метров пустоты. Кому неуютно на высоте, стоит остановиться на нижнем
    ярусе, он и сам по себе полностью оправдывает поездку.


    Вардзия известнее, но оба памятника были звеньями одной оборонительной цепи вдоль ущелья вместе с
    Хертвиси и Тмогви: от каждого был виден следующий, и вместе они держали всю долину. Стоя на верхней
    террасе Ванис Квабеби, эту логику понимаешь так, как ни один план на бумаге не объяснит.


    Землетрясения обрушили часть комплекса, так что многие кельи разрушены или недоступны. Сегодня здесь
    снова живёт несколько монахов, так что шум и развёрнутый пикник тут неуместны.


    Сверху вид открывается вдоль ущелья Куры почти до крепости Тмогви, и, в отличие от Вардзии, людно
    здесь не бывает почти никогда. На парковке Вардзии стоит сорок машин, у Ванис Квабеби ваша нередко
    единственная.
  tip: >-
    Заложите два часа. Подъём крутой, финальная часть — железные лестницы и низкие тоннели, так что нужна
    обувь с цепким протектором, а руки лучше держать свободными: рюкзак вместо сумки. Зимой верхний участок
    обледеневает, и рисковать не стоит. Тени нет, туф сильно отражает жар — вода, головной убор и крем
    обязательны. Туалеты и кафе есть в Вардзии, в двух километрах дальше. Монастырь действующий, одевайтесь
    соответственно.
  route: >-
    Из Тбилиси через Боржоми и Ахалцихе в сторону Вардзии, после Хертвиси вдоль ущелья Куры. Ванис Квабеби
    находятся за два километра до Вардзии, слева от дороги; указатель маленький, его легко пропустить.
    Всего 262 км, около четырёх часов пятнадцати минут. Основная дорога асфальтированная, гравийным остаётся
    только подъезд длиной в несколько сотен метров. В сухую погоду поднимется и обычная машина. Заправляйтесь
    в Ахалцихе или Аспиндзе.
fa:
  name: وانیس کوابِبی
  short: شهر چندطبقهٔ راهبان از سدهٔ هشتم که در صخرهٔ توف کنده شده، دو کیلومتر پیش از واردزیا.
  body: >-
    **وانیس کوابِبی چهارصد سال از واردزیا کهن‌تر است** و راستش را بخواهید بسیار وحشی‌تر. این مجموعه در
    سدهٔ هشتم بنیاد گرفت و چند صد اتاق در دیوارهٔ تند توف کنده شده است، در چند طبقه و پیوسته به هم با
    تونل‌های باریک و پله‌های تراشیده و چاه‌ها. این یک صومعه نیست، یک آبادی عمودی کامل است که در سنگ کنده
    شده.


    در اواخر سدهٔ دوازدهم دیواری دفاعی با بازشوهای طاقدار درست بر پیشانی صخره برافراشته شد. همان است که
    از جاده دیده می‌شود و نخست با آن روبه‌رو می‌شوید. پشت آن غارها آغاز می‌شوند: غذاخوری‌ها، حجره‌ها،
    آب‌انبارها و نمازخانه‌ها.


    دو کلیسا هست: سنت گئورگی در طبقهٔ پایین، و نمازخانه‌ای کوچک نزدیک اوج که از تونلی باریک و نردبانی
    آهنی به آن می‌رسند. بخش بالایی آزمون واقعی است: بازشوها کوتاه‌اند، لبه‌ها نرده ندارند و پنجاه متر
    پرتگاه در زیر است. هر که با ارتفاع راحت نیست باید در طبقهٔ پایین بماند، که خود به‌تنهایی ارزش سفر
    را دارد.


    واردزیا مشهورتر است، اما این دو زمانی همراه با خرتویسی و تموگوی حلقه‌های یک زنجیرهٔ دفاعی در طول دره
    بودند: از هر یک بعدی دیده می‌شد و با هم تمام دره را در دست داشتند. ایستاده بر ایوان بالایی اینجا،
    این منطق چنان آشکار می‌شود که هیچ نقشه‌ای روی کاغذ نمی‌تواند نشان دهد.


    زمین‌لرزه‌ها بخشی از مجموعه را فرو ریخته‌اند، پس بسیاری از حجره‌ها ویران یا دست‌نیافتنی‌اند. امروز
    چند راهب دوباره اینجا زندگی می‌کنند، پس سروصدا و بساط پیک‌نیک بی‌جاست.


    از بالا چشم‌انداز در امتداد درهٔ متکواری تقریباً تا قلعهٔ تموگوی باز می‌شود، و برخلاف واردزیا اینجا
    تقریباً هرگز شلوغ نیست. پارکینگ واردزیا چهل خودرو دارد؛ در وانیس کوابِبی خودروی شما اغلب تنهاست.
  tip: >-
    دو ساعت در نظر بگیرید. صعود تند است و بخش پایانی نردبان آهنی و تونل کوتاه؛ کفش آج‌دار بپوشید و دست‌ها
    را آزاد نگه دارید، یعنی کوله به جای کیف. زمستان بخش بالایی یخ می‌زند و خطرش نمی‌ارزد. سایه نیست و
    توف گرما را به‌شدت بازمی‌تاباند، پس آب و کلاه و کرم ضدآفتاب ضروری است. سرویس بهداشتی و کافه در واردزیا
    و دو کیلومتر جلوتر است. صومعه فعال است، پوشش را رعایت کنید.
  route: >-
    از تفلیس از راه بورجومی و آخالتسیخه به سوی واردزیا برانید و پس از خرتویسی درهٔ متکواری را دنبال کنید.
    وانیس کوابِبی دو کیلومتر پیش از واردزیا و سمت چپ جاده است؛ تابلو کوچک است و به‌سادگی از دست می‌رود.
    مجموع ۲۶۲ کیلومتر و حدود چهار ساعت و پانزده دقیقه. جادهٔ اصلی آسفالت است و تنها چند صد متر آخر راه
    دسترسی شنی است. در هوای خشک خودروی معمولی هم بالا می‌رود. سوخت را در آخالتسیخه یا آسپیندزا بگیرید.
he:
  name: וניס קוובבי
  short: עיר נזירים רב-קומתית מן המאה ה-8 החצובה בצוק טוף, שני קילומטרים לפני ורדזיה.
  body: >-
    **וניס קוובבי עתיקה מוורדזיה בארבע מאות שנה,** ולמען האמת פראית ממנה בהרבה. המכלול נוסד במאה ה-8,
    ובקיר הטוף התלול חצובים כמה מאות חדרים, מסודרים בכמה מפלסים ומחוברים במנהרות צרות, במדרגות חצובות
    ובפירים. זה אינו מנזר אחד אלא יישוב אנכי שלם שנחצב בסלע.


    בסוף המאה ה-12 הוקמה לרוחב החזית חומת מגן עם פתחים מקושתים, צמודה ממש אל הצוק. אותה רואים מן הכביש
    ובה פוגשים ראשונה. מאחוריה מתחילות המערות עצמן: חדרי אוכל, תאים, בורות מים וקפלות.


    יש כאן שתי כנסיות: גאורגיוס הקדוש במפלס התחתון, וקפלה קטנה כמעט בפסגה, שאליה מגיעים דרך מנהרה צרה
    ובסולם ברזל. החלק העליון הוא המבחן האמיתי: הפתחים נמוכים, למדפי הסלע אין מעקה, ומתחת חמישים מטר של
    תהום. מי שאינו שלם עם גבהים כדאי שיעצור במפלס התחתון, שמצדיק את הנסיעה גם בפני עצמו.


    ורדזיה היא האתר המפורסם, אך השניים היו פעם חוליות בשרשרת הגנה אחת לאורך הערוץ יחד עם חרתוויסי ותמוגווי:
    מכל אחד נראה הבא, ויחד הם שלטו בכל העמק. מן המרפסת העליונה כאן ההיגיון הזה מתבהר באופן ששום תוכנית
    על נייר אינה יכולה להעביר.


    רעידות אדמה הפילו חלק מן המכלול, ולכן תאים רבים קרסו או אינם נגישים. כיום חיים כאן שוב כמה נזירים,
    ולכן רעש ופיקניק פרוש אינם במקומם.


    מלמעלה נפתח הנוף לאורך עמק המטקוורי כמעט עד מבצר תמוגווי, ובניגוד לוורדזיה כמעט אף פעם אין כאן עומס.
    בחניון ורדזיה עומדות ארבעים מכוניות; בווניס קוובבי שלכם היא לרוב היחידה.
  tip: >-
    הקצו שעתיים. הטיפוס תלול והחלק האחרון הוא סולמות ברזל ומנהרות נמוכות, אז נעלו נעליים עם אחיזה ושמרו
    על ידיים פנויות בעזרת תרמיל במקום תיק. בחורף החלק העליון מתכסה קרח ואינו שווה את הסיכון. אין צל והטוף
    מחזיר חום בעוצמה, ולכן מים, כובע וקרם הגנה הם הכרח. שירותים ובתי קפה יש בוורדזיה, שני קילומטרים הלאה.
    זהו מנזר פעיל, התלבשו בהתאם.
  route: >-
    מטביליסי דרך בורג'ומי ואחלציחה לכיוון ורדזיה, ואחרי חרתוויסי לאורך ערוץ המטקוורי. וניס קוובבי נמצאת
    שני קילומטרים לפני ורדזיה, בצד שמאל של הכביש; השלט קטן וקל לפספס אותו. בסך הכול 262 ק״מ, כארבע שעות
    וחמש עשרה דקות. הדרך הראשית סלולה, ורק כמה מאות המטרים האחרונים הם דרך גישה מחצץ. במזג אוויר יבש גם
    רכב רגיל יעלה. תדלקו באחלציחה או באספינדזה.
ar:
  name: فانيس كفابيبي
  short: مدينة رهبان متعددة الطوابق من القرن الثامن منحوتة في صخر التوف، على بعد كيلومترين قبل فاردزيا.
  body: >-
    **فانيس كفابيبي أقدم من فاردزيا بأربعمئة سنة،** وأكثر توحشاً منها بكثير إن أردنا الصدق. أُسس المجمع
    في القرن الثامن، ونُحتت في جدار التوف الحاد بضع مئات من الغرف موزعة على مستويات عدة وموصولة بأنفاق
    ضيقة ودرجات محفورة وآبار عمودية. ليس هذا ديراً واحداً بل قرية عمودية كاملة محفورة في الصخر.


    وفي أواخر القرن الثاني عشر أُقيم على الواجهة سور دفاعي بفتحات معقودة ملتصق بالجرف مباشرة. وهو ما يُرى
    من الطريق وأول ما تلقاه. وخلفه تبدأ الكهوف نفسها: قاعات طعام، وقلالٍ، وصهاريج ماء، ومصليات.


    وفي الموقع كنيستان: القديس جيورجي في المستوى السفلي، ومصلى صغير قرب القمة يُوصل إليه عبر نفق ضيق وسلم
    حديدي. والقسم الأعلى هو الاختبار الحقيقي: الفتحات منخفضة، والحواف بلا درابزين، وتحتها خمسون متراً
    من الفراغ. ومن لا يرتاح للمرتفعات فليتوقف عند المستوى السفلي، وهو وحده يبرر الرحلة.


    فاردزيا هي الموقع المشهور، لكن الاثنين كانا يوماً حلقتين في سلسلة دفاعية واحدة على امتداد الوادي مع
    خيرتفيسي وتموغفي: من كل واحد يُرى الذي يليه، وبها جميعاً كان الوادي كله مضبوطاً. ومن المصطبة العليا
    هنا يتضح هذا المنطق على نحو لا يستطيع أي مخطط على ورق أن ينقله.


    وقد أسقطت الزلازل جزءاً من المجمع، فكثير من القلالي منهار أو غير قابل للوصول. ويعيش هنا اليوم بضعة
    رهبان من جديد، فالضجيج ومدّ سفرة النزهة في غير محلهما.


    ومن الأعلى ينفتح المنظر على امتداد وادي متكفاري حتى قلعة تموغفي تقريباً، وبخلاف فاردزيا لا يكاد الموقع
    يزدحم. موقف فاردزيا يسع أربعين سيارة؛ أما هنا فسيارتك وحدها في الغالب.
  tip: >-
    خصص ساعتين. الصعود حاد والجزء الأخير سلالم حديدية وأنفاق منخفضة، فالبس حذاءً ممسكاً واترك يديك حرتين
    بحمل حقيبة ظهر لا حقيبة يد. وفي الشتاء يتجمد القسم الأعلى ولا يستحق المخاطرة. ولا ظل هناك، والتوف
    يعكس الحرارة بقوة، فالماء والقبعة والواقي الشمسي ضرورة. دورات المياه والمقاهي في فاردزيا على بعد كيلومترين.
    والدير عامر، فالبس بما يليق.
  route: >-
    من تبليسي عبر بورجومي وأخالتسيخه باتجاه فاردزيا، وبعد خيرتفيسي تابع وادي متكفاري. تقع فانيس كفابيبي
    على بعد كيلومترين قبل فاردزيا إلى يسار الطريق؛ واللافتة صغيرة يسهل تفويتها. المجموع 262 كم ونحو أربع
    ساعات وخمس عشرة دقيقة. الطريق الرئيسي معبّد، ولا يبقى حصوياً سوى بضع مئات من الأمتار عند المدخل. وفي
    الطقس الجاف تصعدها سيارة عادية. تزوّد بالوقود في أخالتسيخه أو أسبيندزا.
