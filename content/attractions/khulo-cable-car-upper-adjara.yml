ka:
  name: ხულოს საბაგირო და ზემო აჭარა
  short: საბჭოთა პერიოდის საბაგირო ხულოსა და სოფელ თაგოს შორის, ხეობის თავზე — და ზემო აჭარის მთიანი მარშრუტი.
  body: >-
    ხულო ზემო აჭარის ცენტრია, ბათუმიდან დაახლოებით 88 კილომეტრში, აჭარისწყლის ხეობის ზემო ნაწილში. მისი
    მთავარი ღირსშესანიშნაობა საბაგირო გზაა, რომელიც ხულოს სოფელ თაგოსთან აკავშირებს: დაახლოებით 1700 მეტრი
    სიგრძის ხაზი პირდაპირ ხეობის თავზე გადის და მგზავრობას დაახლოებით ათი წუთი სჭირდება.


    მნიშვნელოვანია გავიგოთ, რომ ეს ტურისტული ატრაქციონი არ არის — საბაგირო 1980-იან წლებში აშენდა და დღემდე
    ადგილობრივი ტრანსპორტის ფუნქციას ასრულებს იმ სოფლისთვის, რომელსაც სხვა მოკლე გზა არ აქვს. კაბინა მარტივია,
    ხედი კი მკვეთრი: ქვემოთ ორასამდე მეტრზე ხეობა და მდინარე ჩანს.


    ზემო აჭარაში ხულოს გარდა სხვა მიმართულებებიცაა:


    - **გოდერძის უღელტეხილი** — დაახლოებით 2025 მეტრზე, ხულოს აღმოსავლეთით

    - **გოდერძის ნამარხი ტყე** — გაქვავებული ხეების უნიკალური ადგილი უღელტეხილთან

    - **ხიხანის ციხე** — შუა საუკუნეების ნანგრევები კლდის თავზე

    - **ტრადიციული ხის სახლები და თაღოვანი ხიდები** სოფლებში


    ზამთარში გოდერძის მიმართულებით გზა ხშირად რთულდება ან იკეტება; ხულომდე კი მისვლა მთელი წელი შესაძლებელია
    შესაბამისი საბურავებით. ზემო აჭარა სანაპიროსგან სრულიად განსხვავებული სამყაროა: აქ ზღვის ნაცვლად ციცაბო
    ფერდობებია, სოფლები მაღლა მთაზეა გაფანტული და რიტმი ბევრად ნელია. ბათუმიდან ერთდღიანი გასვლა შესაძლებელია,
    მაგრამ ხულოში ღამის გათევა მარშრუტს გაცილებით მშვიდს ხდის.
  tip: >-
    საბაგირო მარტივი და იაფია, მაგრამ განრიგი ადგილობრივ საჭიროებაზეა მორგებული და შესაძლოა შეიცვალოს
    — ჩამოსვლისთანავე ადგილზე იკითხეთ. სიმაღლის შიშის მქონე ადამიანებისთვის მარშრუტი რთული იქნება: კაბინა
    ღიაა ხმაურისთვის და ხეობა ღრმაა. ხულოში არის კაფეები, პატარა სასტუმროები და გასამართი სადგური. თუ
    გოდერძის უღელტეხილზე გადასვლას გეგმავთ, ამინდი წინასწარ შეამოწმეთ და საწვავი ხულოში აავსეთ — შემდეგი
    გასამართი შორსაა.
  route: >-
    თბილისიდან ხულომდე დაახლოებით 455 კმ და შვიდი საათი და 20 წუთია. მარშრუტი ბათუმზე გადის: E60-ით სანაპირომდე,
    შემდეგ აღმოსავლეთით აჭარისწყლის ხეობაში — ბათუმიდან ხულომდე 88 კმ და ორ საათამდე. გზა ძირითადად ასფალტია,
    მაგრამ ვიწრო, სერპანტინიანი და ადგილ-ადგილ დაზიანებული, მეწყრული მონაკვეთებით. მაღალი კლირენსის ავტომობილი
    აქ საგრძნობლად უფრო კომფორტულია. თუ გოდერძის უღელტეხილზე აგრძელებთ, ზაფხულის გარეთ 4x4 სავალდებულო
    ხდება.
en:
  name: Khulo Cable Car and Upper Adjara
  short: >-
    A Soviet-era cable car strung between Khulo and the village of Tago across a deep gorge, plus the
    road into Upper Adjara.
  body: >-
    Khulo is the centre of Upper Adjara, about 88 kilometres from Batumi in the upper Adjaristsqali valley.
    Its best-known feature is the cable car linking the town to the village of Tago: a line roughly 1,700
    metres long that crosses directly above the gorge, with a ride of about ten minutes.


    It is worth understanding that this is not a tourist attraction. The cable car was built in the 1980s
    and still functions as local transport for a village with no other short route to the district centre.
    The cabin is basic and the view is dramatic, with the gorge and river a couple of hundred metres below.


    Beyond Khulo, Upper Adjara has several other draws:


    - **The Goderdzi Pass** at roughly 2,025 metres, east of Khulo

    - **The Goderdzi petrified forest**, a rare deposit of fossilised trees near the pass

    - **Khikhani fortress**, medieval ruins on a rock outcrop

    - **Traditional wooden houses and arched bridges** scattered through the villages


    In winter the road toward Goderdzi frequently becomes difficult or closes altogether, while Khulo
    itself remains reachable year-round with appropriate tyres.
  tip: >-
    The cable car is simple and cheap, but its timetable follows local needs and can change, so ask on
    arrival rather than relying on published hours. Anyone uneasy with heights will find the crossing
    hard: the cabin is basic and the gorge is deep. Khulo has cafes, small guesthouses and a fuel station.
    If you plan to continue over the Goderdzi Pass, check the weather first and fill up in Khulo, because
    the next fuel is a long way further on.
  route: >-
    Khulo is about 455 km and seven hours twenty from Tbilisi, with the route running via Batumi: E60
    to the coast, then east into the Adjaristsqali valley — 88 km and up to two hours from Batumi. The
    road is mostly asphalt but narrow, full of switchbacks and damaged in places, with sections prone
    to landslides. A higher-clearance car is noticeably more comfortable here. If you continue over the
    Goderdzi Pass, a 4x4 becomes necessary outside the summer months, and the surface there is unsurfaced
    in stretches.
ru:
  name: Канатная дорога Хуло и Верхняя Аджария
  short: Канатка советских времён между Хуло и селом Таго над глубоким ущельем и дорога в Верхнюю Аджарию.
  body: >-
    Хуло — центр Верхней Аджарии, примерно в 88 километрах от Батуми, в верхней части ущелья Аджарисцкали.
    Самая известная его особенность — канатная дорога, связывающая посёлок с селом Таго: линия длиной
    около 1700 метров проходит прямо над ущельем, поездка занимает порядка десяти минут.


    Важно понимать, что это не туристический аттракцион. Канатку построили в 1980-х, и она до сих пор
    работает как местный транспорт для села, у которого нет другого короткого пути к районному центру.
    Кабина простая, а вид резкий: ущелье и река остаются в паре сотен метров внизу.


    Помимо самого Хуло, в Верхней Аджарии есть и другие направления:


    - **Перевал Годердзи** на высоте около 2025 метров, восточнее Хуло

    - **Годердзский окаменелый лес** — редкое месторождение ископаемых деревьев у перевала

    - **Крепость Хихани** — средневековые руины на скальном выступе

    - **Традиционные деревянные дома и арочные мосты** в окрестных сёлах


    Зимой дорога в сторону Годердзи часто усложняется или закрывается совсем, тогда как до самого Хуло
    можно доехать круглый год при подходящей резине.
  tip: >-
    Канатка простая и дешёвая, но расписание подстроено под нужды местных и может меняться — уточняйте
    на месте, а не по публикациям. Тем, кто плохо переносит высоту, переезд дастся тяжело: кабина базовая,
    ущелье глубокое. В Хуло есть кафе, небольшие гостевые дома и заправка. Если планируете идти дальше
    через перевал Годердзи, сначала проверьте погоду и заправьте бак в Хуло: следующая заправка далеко.
  route: >-
    От Тбилиси до Хуло около 455 км и семь часов двадцать минут, маршрут идёт через Батуми: по E60 до
    побережья, затем на восток в ущелье Аджарисцкали — 88 км и до двух часов от Батуми. Дорога преимущественно
    асфальтовая, но узкая, состоит из серпантинов и местами разбита, отдельные участки оползневые. Автомобиль
    с высоким клиренсом здесь заметно комфортнее. Если продолжать через перевал Годердзи, вне летних месяцев
    внедорожник становится обязательным, а покрытие там местами грунтовое.
fa:
  name: تله‌کابین خولو و آجارای علیا
  short: >-
    تله‌کابینی از دوران شوروی که میان خولو و روستای تاگو بر فراز دره‌ای عمیق کشیده شده، به‌همراه جاده‌ای
    که به آجارای علیا می‌رود.
  body: >-
    خولو مرکز آجارای علیا است، حدود 88 کیلومتر از باتومی در بالادست درهٔ آجاریس‌تسکالی. شناخته‌شده‌ترین
    ویژگی‌اش تله‌کابینی است که شهر را به روستای تاگو وصل می‌کند: خطی به طول تقریبی 1,700 متر که مستقیم
    از بالای دره می‌گذرد و سفری حدود ده دقیقه‌ای دارد.


    خوب است بدانید که این یک جاذبهٔ گردشگری نیست. تله‌کابین در دههٔ 1980 ساخته شد و هنوز به‌عنوان حمل‌ونقل
    محلی برای روستایی کار می‌کند که راه کوتاه دیگری به مرکز ناحیه ندارد. کابین ساده است و منظره نفس‌گیر،
    با دره و رودی که دویست متری پایین‌تر جریان دارند.


    آن‌سوی خولو، آجارای علیا چند جاذبهٔ دیگر هم دارد:


    - **گردنهٔ گودردزی** در ارتفاع حدود 2,025 متر، شرق خولو

    - **جنگل سنگ‌شدهٔ گودردزی**، نهشته‌ای کمیاب از درختان فسیل‌شده نزدیک گردنه

    - **دژ خیخانی**، ویرانه‌هایی از سده‌های میانه بر برون‌زدی صخره‌ای

    - **خانه‌های چوبی سنتی و پل‌های طاقی** که در روستاها پراکنده‌اند


    زمستان‌ها جادهٔ گودردزی اغلب دشوار می‌شود یا یکسره می‌بندد، در حالی که خود خولو با لاستیک مناسب تمام
    سال دسترس‌پذیر می‌ماند.
  tip: >-
    تله‌کابین ساده و ارزان است، اما جدولش تابع نیاز اهالی است و ممکن است عوض شود، پس به‌جای تکیه بر ساعت‌های
    اعلام‌شده، در محل بپرسید. هر کس با ارتفاع مشکل دارد این عبور برایش سخت خواهد بود: کابین ابتدایی است
    و دره عمیق. خولو کافه، مهمان‌خانه‌های کوچک و پمپ‌بنزین دارد. اگر قصد دارید از گردنهٔ گودردزی بگذرید،
    نخست هوا را بررسی کنید و در خولو باک را پر کنید، چون پمپ‌بنزین بعدی خیلی دورتر است.
  route: >-
    خولو حدود 455 کیلومتر و هفت ساعت و بیست دقیقه از تفلیس فاصله دارد و مسیر از باتومی می‌گذرد: E60 تا
    ساحل، سپس به سوی شرق در درهٔ آجاریس‌تسکالی — 88 کیلومتر و تا دو ساعت از باتومی. جاده بیشتر آسفالت
    است اما باریک، پر از سرپیچ و جاهایی آسیب‌دیده، با بخش‌هایی مستعد رانش زمین. ماشینی با ارتفاع کف بیشتر
    اینجا محسوس‌تر راحت است. اگر از گردنهٔ گودردزی هم بگذرید، بیرون از ماه‌های تابستان 4x4 ضروری می‌شود
    و سطح جاده آنجا در بخش‌هایی خاکی است.
he:
  name: הרכבל של חולו ואג'ריה העילית
  short: רכבל מן התקופה הסובייטית המתוח בין חולו לכפר טאגו מעל ערוץ עמוק, ולצידו הדרך אל אג'ריה העילית.
  body: >-
    חולו היא מרכזה של אג'ריה העילית, במרחק כ-88 קילומטרים מבטומי, בחלקו העליון של עמק אג'ריסצקאלי. המאפיין
    המוכר ביותר שלה הוא הרכבל המחבר את העיירה לכפר טאגו שמעברו השני של הערוץ: קו באורך כ-1,700 מטר החוצה
    ישירות מעל התהום, ונסיעה שאורכת כעשר דקות.


    כדאי להבין מראש שאין מדובר כאן באטרקציה תיירותית. הרכבל נבנה בשנות ה-80 של המאה ה-20 ועדיין משמש תחבורה
    מקומית לכפר שאין לו שום דרך קצרה אחרת אל מרכז הנפה. התא בסיסי לגמרי והנוף דרמטי, כשהערוץ והנהר נמצאים
    כמאתיים מטר מתחתיכם.


    מעבר לחולו יש לאג'ריה העילית עוד כמה נקודות משיכה:


    - **מעבר גודרדזי** בגובה של כ-2,025 מטר, ממזרח לחולו

    - **היער המאובן של גודרדזי**, מרבץ נדיר של עצים מאובנים סמוך למעבר

    - **מבצר חיחאני**, חורבות מימי הביניים על זיז סלע

    - **בתי עץ מסורתיים וגשרים מקומרים** הפזורים בין הכפרים שבעמק


    בחורף הדרך לכיוון מעבר גודרדזי נעשית קשה פעמים רבות או נחסמת לגמרי, ואילו חולו עצמה נשארת נגישה לאורך
    כל השנה עם צמיגים מתאימים.
  tip: >-
    הרכבל פשוט וזול, אך לוח הזמנים שלו נגזר מצורכי המקומיים ועשוי להשתנות, לכן שאלו בהגיעכם במקום להסתמך
    על שעות מפורסמות. מי שאינו נוח עם גבהים יתקשה במעבר: התא בסיסי והערוץ עמוק. בחולו יש בתי קפה, אכסניות
    קטנות ותחנת דלק. אם בכוונתכם להמשיך מעל מעבר גודרדזי, בדקו קודם את מזג האוויר ומלאו דלק בחולו, כי
    התחנה הבאה רחוקה מאוד משם.
  route: >-
    חולו נמצאת כ-455 ק״מ ושבע שעות ועשרים דקות מטביליסי, והמסלול עובר דרך בטומי: כביש E60 אל החוף, ואז
    מזרחה אל תוך עמק אג'ריסצקאלי — 88 ק״מ ועד שעתיים מבטומי. הכביש סלול ברובו אך צר, מלא סרפנטינות ופגום
    במקומות, ויש בו קטעים הנוטים למפולות אדמה. רכב עם גובה גחון גדול יותר נוח כאן באופן מורגש. אם תמשיכו
    מעל מעבר גודרדזי, רכב 4x4 הופך להכרחי מחוץ לחודשי הקיץ, והמשטח שם אינו סלול לאורך קטעים שלמים.
ar:
  name: تلفريك خولو وأدجارا العليا
  short: تلفريك من الحقبة السوفييتية ممدود بين خولو وقرية تاغو فوق مضيق عميق، إلى جانب الطريق إلى أدجارا
    العليا.
  body: >-
    خولو هي مركز أدجارا العليا، على بعد نحو 88 كيلومتراً من باتومي في أعالي وادي أدجاريستسكالي. وأشهر
    معالمها هو التلفريك الذي يربط البلدة بقرية تاغو: خط طوله نحو 1,700 متر يعبر فوق المضيق مباشرة، ورحلته
    نحو عشر دقائق.


    ويجدر أن تفهم أن هذا ليس معلماً سياحياً. فقد بُني التلفريك في ثمانينيات القرن الماضي وما زال يعمل
    وسيلة نقل محلية لقرية لا طريق قصيراً آخر لها إلى مركز المقاطعة. والمقصورة بسيطة والمنظر مهيب، والمضيق
    والنهر على بعد مئتي متر تحتك.


    وخلف خولو، في أدجارا العليا عدة مقاصد أخرى:


    - **ممر غوديردزي** على ارتفاع نحو 2,025 متر، شرق خولو

    - **غابة غوديردزي المتحجرة**، وهي رواسب نادرة من أشجار متحجرة قرب الممر

    - **حصن خيخاني**، أطلال من العصور الوسطى على نتوء صخري

    - **البيوت الخشبية التقليدية والجسور المقوسة** المنتشرة بين القرى


    وفي الشتاء كثيراً ما يصبح الطريق نحو غوديردزي صعباً أو يُغلق تماماً، بينما تبقى خولو نفسها قابلة للوصول
    طوال العام بإطارات مناسبة.
  tip: >-
    التلفريك بسيط ورخيص، لكن جدوله يتبع حاجات الأهالي وقد يتغير، فاسأل عند وصولك بدل الاعتماد على المواعيد
    المنشورة. ومن لا يرتاح للمرتفعات سيجد العبور صعباً: فالمقصورة بدائية والمضيق عميق. وفي خولو مقاهٍ
    ونُزل صغيرة ومحطة وقود. وإن كنت تنوي متابعة الطريق فوق ممر غوديردزي، فتحقق من الطقس أولاً واملأ الخزان
    في خولو، لأن محطة الوقود التالية بعيدة جداً.
  route: >-
    تبعد خولو نحو 455 كم وسبع ساعات وعشرين دقيقة عن تبليسي، ويمر المسار عبر باتومي: الطريق E60 إلى الساحل،
    ثم شرقاً إلى وادي أدجاريستسكالي — 88 كم وحتى ساعتين من باتومي. والطريق معبّد في معظمه لكنه ضيق وكثير
    المنعطفات ومتضرر في مواضع، وفيه مقاطع معرضة للانزلاقات الأرضية. وسيارة بخلوص أرضي أعلى أريح هنا بوضوح.
    وإن تابعت فوق ممر غوديردزي فإن سيارة 4x4 تصبح ضرورية خارج أشهر الصيف، والسطح هناك غير معبّد في مقاطع
    منه.
