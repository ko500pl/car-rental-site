ka:
  name: ხულოს საბაგირო და ზემო აჭარა
  short: >-
    ხულო, ზემო აჭარის ძველი სავაჭრო დაბა, და თაგოს გაჩერებული საბაგირო: ერთი 1720-მეტრიანი მალი ხეობის
    თავზე, 2024 წლიდან დაკეტილი.
  body: >-
    **თითქმის ორმოცი წლის განმავლობაში პატარა წითელი კაბინა აჭარისწყლის ხეობას ერთ მალზე გადადიოდა: ორ
    ნაპირს შორის ერთი ანძაც არ იდგა.**


    ხულო-თაგოს საბაგირო 1985 წელს გაიხსნა. 1720 მეტრი სიგრძის ფოლადის ბაგირი მდინარიდან 280 მეტრამდე სიმაღლეზე
    ეკიდა, გადასვლას კი დაახლოებით რვა წუთი სჭირდებოდა. იგი გასართობად არავის აუშენებია: თაგოელ ბავშვებს
    ხულოს სკოლაში ჩაჰყავდა, ტვირთი ზემოთ ამჰქონდა, კაბინა კი მაშინ იძვროდა, როცა მგზავრი საკმარისად შეგროვდებოდა.


    2024 წლიდან საბაგირო გაჩერებულია. მფლობელმა კომპანიამ ხაზი სახიფათოდ და აღდგენისთვის უვარგისად გამოაცხადა.
    აჭარის 2026 წლის ბიუჯეტში 200 000 ლარი გამოიყო, ოღონდ მხოლოდ წინასაპროექტო კვლევისთვის, და 2026 წლის
    სექტემბრის ბოლოსთვის ტენდერიც კი არ იყო გამოცხადებული. ფასი ხეობის გაღმა ჩანს: იმავე სექტემბერს, სასწავლო
    წლის დასაწყისში, თავად თაგოს პატარა სკოლას ერთი მოსწავლეც არ ჰყავდა — საბაგიროს გაჩერების შემდეგ ოჯახები
    სოფლიდან მიდიან.


    ხულო ფეხით მოვლად ღირს. მისი ძველი სახელი, „ხულა“, „სავაჭრო სახლად“ განიმარტება: აქ გადიოდა საქარავნო
    გზა, რომელიც სამცხეს გოდერძის უღელტეხილით შავიზღვისპირეთთან აკავშირებდა. ოსმალობისას ბეგებმა ხიმშიაშვილებმა
    ზემო აჭარის ცენტრი სხალთიდან აქ გადმოიტანეს; 1829 წელს გენერალ ოსტენ-საკენის რუსულმა რაზმმა მათი რეზიდენცია
    დაარბია. 1929 წლის აპრილში მთის სოფლები იძულებითი კოლექტივიზაციისა და რელიგიური დევნის წინააღმდეგ
    აჯანყდნენ, აჯანყება კი საბჭოთა ჯარმა ჩაახშო. დღეს დაბაში XVIII საუკუნის მეჩეთიც დგას და 2019 წელს
    ნაკურთხი წმინდა ანდრია მოციქულის ეკლესიაც.


    ხულოს იქით გზა გოდერძის უღელტეხილისკენ (2025 მ) მიიწევს. აქ ვულკანურმა ღვარცოფებმა გვიანმიოცენურ-ადრეპლიოცენური
    ტყე დამარხა და უღელტეხილის აღმოსავლეთ კალთაზე გაქვავებული ღეროები დღემდე ისე დგას, როგორც ტალახმა
    მოასწრო.


    სანამ ახალ ხაზს ააშენებენ, თაგოს მხოლოდ შორიდან შეხედავთ: მეჩეთი და მიმოფანტული სახლები მოპირდაპირე
    ქიმზე, შუაში კი თითქმის სამასი მეტრი ჰაერი.
  tip: >-
    2026 წლის სექტემბრის მდგომარეობით საბაგირო დაკეტილია და გახსნის თარიღი უცნობია, ამიტომ ადგილზე გადაამოწმეთ,
    სანამ ვინმეს ამ მგზავრობას დაჰპირდებით. თაგომდე მხოლოდ უსწორმასწორო გზა მიდის; ადგილობრივები ხულოდან
    ჯიპ-ტაქსით დადიან. თაგოსა და ხეობის საუკეთესო ხედი მთავარი გზის გადასახედებიდან იშლება. ხულოში არის
    აჭარული სამზარეულოს კაფეები, საოჯახო სასტუმროები და ბენზინგასამართი სადგური. ზამთარში მაღალმთიან ხეობებს
    თოვლი კეტავს (2026 წელს გოდერძის უღელტეხილი აპრილის ბოლოს გაიხსნა). გაქირავების კომპანიების უმეტესობა
    ხელშეკრულებით კრძალავს უღელტეხილზე გადასვლას, ამიტომ მარშრუტის დაგეგმვამდე თქვენი ხელშეკრულება წაიკითხეთ.
  route: >-
    მთელი წლის მარშრუტით თბილისიდან ხულომდე დაახლოებით 455 კმ და შვიდი საათი და ოცი წუთია. ს1 (E60) მაგისტრალით
    სამტრედიამდე იარეთ, ს12-ით გრიგოლეთამდე, ს2-ით სანაპიროს გაყოლებით ბათუმამდე, შემდეგ კი 88 კმ აღმოსავლეთით,
    აჭარისწყლის ხეობაში, ბათუმი-ახალციხის გზით, ქედისა და შუახევის გავლით. გზა ბოლომდე მოასფალტებულია,
    მაგრამ ვიწრო და კლაკნილი, მეწყრებს კი ზოგან ერთ ზოლამდე დაუვიწროებიათ; მაღალი გამავლობის ავტომობილი
    მეტ კომფორტს მოგცემთ, თუმცა აუცილებელი არ არის. ზაფხულში დაახლოებით 290-კილომეტრიანი მოკლე გზაც არსებობს:
    ხაშურის, ს8-ით ახალციხისა და გოდერძის უღელტეხილის გავლით. 2026 წლისთვის ის მოასფალტებული იყო, დიოკნისსა
    და რიკეთს შორის 6–7 კმ გრუნტის გზის გარდა, მაგრამ ჯერ ქირავნობის ხელშეკრულება გადაამოწმეთ. საწვავი
    ხულოში ჩაასხით.
en:
  name: Khulo Cable Car and Upper Adjara
  short: >-
    Khulo, old caravan town of Upper Adjara, and the silent Tago cable car: one 1,720-metre span over
    the gorge, closed since 2024.
  body: >-
    **For almost forty years a small red cabin crossed the Adjaristsqali gorge on a single span of cable,
    with not one tower between the two rims.**


    The Khulo–Tago cable car opened in 1985: 1,720 metres of steel rope hung up to 280 metres above the
    river, and a crossing of about eight minutes. It was never a ride: it took Tago's children down to
    school in Khulo, carried goods back up, and left whenever enough passengers had gathered.


    Since 2024 it has not moved. The operator declared the line unsafe and beyond repair. Adjara's 2026
    budget set aside 200,000 lari, but only for a preliminary design study, and by late September 2026
    no tender had been announced. Across the gorge the cost is plain. When the school year began that
    month, the little school in Tago itself had not a single pupil; families have been leaving since the
    line stopped.


    Khulo itself deserves an hour on foot. Its old name, Khula, is explained as ‘trading house’, because
    a caravan road ran through here from Samtskhe over the Goderdzi Pass to the Black Sea. Under the Ottomans
    the Khimshiashvili beys moved the centre of Upper Adjara here from Skhalta; in 1829 General Osten-Sacken's
    Russian troops sacked their residence. In April 1929 the mountain villages rose against forced collectivisation
    and religious persecution, and Soviet troops crushed the revolt. Today the 18th-century mosque and
    the Church of St Andrew, consecrated in 2019, share the town.


    Beyond Khulo the road climbs to the Goderdzi Pass (2,025 m), where volcanic mudflows buried a Late
    Miocene–Early Pliocene forest; on its eastern slope, fossil trunks still stand upright where the mud
    caught them.


    Until a new line is built, Tago is a place to look at rather than ride to: a mosque and a scatter
    of houses on the far rim, and nearly three hundred metres of air in between.
  tip: >-
    As of September 2026 the cable car is closed with no reopening date, so check locally before promising
    the ride to anyone. Tago can be reached only by a rough road; locals take 4x4 taxis from Khulo. The
    viewpoints along the main road give the best look across the gorge. Khulo has cafés serving Adjarian
    food, guesthouses and a fuel station. In winter snow closes the high valleys (in 2026 the Goderdzi
    Pass reopened in late April). Most rental companies forbid the pass in their contracts, so read yours
    before planning that way.
  route: >-
    The all-season route is about 455 km, seven hours twenty. Take the S1 (E60) to Samtredia, the S12
    to Grigoleti and the S2 down the coast to Batumi, then head 88 km east up the Adjaristsqali on the
    Batumi–Akhaltsikhe road through Keda and Shuakhevi. It is sealed throughout but narrow and twisting,
    squeezed to one lane by landslides in places; an SUV adds comfort but is not essential. In summer
    a shorter route of about 290 km runs via Khashuri, the S8 to Akhaltsikhe and the Goderdzi Pass; by
    2026 it was sealed except for 6–7 km of dirt between Dioknisi and Riketi, but check your rental contract
    first. Fuel up in Khulo.
ru:
  name: Канатная дорога Хуло и Верхняя Аджария
  short: >-
    Хуло, старый караванный городок Верхней Аджарии, и умолкшая канатная дорога на Таго: единственный
    пролёт в 1720 метров над ущельем, закрыта с 2024 года.
  body: >-
    **Почти сорок лет маленькая красная кабинка пересекала ущелье Аджарисцкали одним пролётом троса, без
    единой опоры между берегами.**


    Канатная дорога Хуло–Таго открылась в 1985 году: 1720 метров стального каната повисли на высоте до
    280 метров над рекой, а переход занимал около восьми минут. Это никогда не было развлечением: она
    возила детей Таго в школу в Хуло, поднимала обратно грузы и отправлялась, когда набиралось достаточно
    пассажиров.


    С 2024 года она не движется. Оператор объявил линию небезопасной и не подлежащей ремонту. В бюджете
    Аджарии на 2026 год выделено 200 000 лари, но только на предпроектное исследование, и к концу сентября
    2026 года тендер так и не объявлен. По ту сторону ущелья цена этого видна наглядно: когда в том же
    месяце начался учебный год, в маленькой школе самого Таго не оказалось ни одного ученика — с тех пор
    как канатная дорога остановилась, семьи уезжают из села.


    На сам Хуло стоит потратить час, пройдясь пешком. Его старое имя, Хула, объясняют как «торговый дом»:
    здесь проходила караванная дорога из Самцхе через Годердзский перевал к Чёрному морю. При османах
    беги Химшиашвили перенесли центр Верхней Аджарии сюда из Схалты; в 1829 году русские войска генерала
    Остен-Сакена разгромили их резиденцию. В апреле 1929 года горные сёла поднялись против насильственной
    коллективизации и религиозных гонений, и советские войска подавили восстание. Сегодня в городке рядом
    стоят мечеть XVIII века и церковь Святого Андрея, освящённая в 2019 году.


    За Хуло дорога поднимается к Годердзскому перевалу (2025 м), где вулканические грязевые потоки погребли
    лес конца миоцена — начала плиоцена; на его восточном склоне окаменевшие стволы до сих пор стоят там
    же, где их застигла грязь.


    Пока новую линию не построят, Таго — место, на которое смотрят, а не место, куда едут: мечеть и разбросанные
    дома на дальнем берегу, а между ними — почти триста метров воздуха.
  tip: >-
    По состоянию на сентябрь 2026 года канатная дорога закрыта, дата открытия неизвестна, так что проверьте
    на месте, прежде чем обещать кому-то поездку. До Таго можно добраться только по грунтовой дороге;
    местные ездят на джип-такси из Хуло. Лучший вид на ущелье открывается со смотровых площадок вдоль
    главной дороги. В Хуло есть кафе с аджарской кухней, гостевые дома и заправка. Зимой снег закрывает
    высокие долины (в 2026 году Годердзский перевал открылся только в конце апреля). Большинство прокатных
    компаний запрещают проезд через перевал в своих договорах, так что прочтите свой договор перед тем,
    как строить такой маршрут.
  route: >-
    Круглогодичный путь составляет около 455 км и семь часов двадцать минут. Возьмите С1 (E60) до Самтредиа,
    С12 до Григолети и С2 вдоль побережья до Батуми, затем поверните на восток и поднимитесь на 88 км
    по Аджарисцкали по дороге Батуми–Ахалцихе через Кеду и Шуахеви. Дорога асфальтирована на всём протяжении,
    но узкая и петляющая, местами сужена оползнями до одной полосы; внедорожник добавит комфорта, но не
    обязателен. Летом есть более короткий путь, около 290 км, через Хашури, С8 до Ахалцихе и Годердзский
    перевал; к 2026 году он был асфальтирован, кроме 6–7 км грунтовки между Диокниси и Рикети, но сначала
    проверьте свой договор аренды. Заправьтесь в Хуло.
fa:
  name: تله‌کابین خولو و آجارای بالا
  short: >-
    خولو، شهرک کاروانی کهن آجارای بالا، و تله‌کابین خاموش تاگو: تنها یک دهانه‌ی ۱٬۷۲۰ متری بر فراز دره،
    بسته از سال ۲۰۲۴.
  body: >-
    **نزدیک به چهل سال، کابینی کوچک و سرخ دره‌ی آجاریستسکالی را با یک دهانه‌ی سیم پیوسته می‌پیمود، بی‌آن‌که
    میان دو لبه‌ی دره حتی یک دکل باشد.**


    تله‌کابین خولو-تاگو در سال ۱۹۸۵ گشوده شد: ۱٬۷۲۰ متر سیم فولادی تا بلندی ۲۸۰ متری بالای رودخانه آویخته
    بود، و عبور نزدیک به هشت دقیقه طول می‌کشید. این هرگز سرگرمی نبود: بچه‌های تاگو را به مدرسه‌ی خولو
    می‌برد، بار را به بالا برمی‌گرداند، و هرگاه مسافر کافی جمع می‌شد، حرکت می‌کرد.


    از سال ۲۰۲۴ حرکت نکرده است. شرکت بهره‌بردار خط را ناامن و غیرقابل‌تعمیر اعلام کرد. در بودجه‌ی ۲۰۲۶
    آجارا ۲۰۰٬۰۰۰ لاری کنار گذاشته شد، اما تنها برای مطالعه‌ی پیش‌طراحی، و تا پایان سپتامبر ۲۰۲۶ هیچ مناقصه‌ای
    اعلام نشده بود. آن سوی دره، بها روشن است: وقتی سال تحصیلی در همان ماه آغاز شد، مدرسه‌ی کوچک خودِ تاگو
    حتی یک شاگرد نداشت؛ از وقتی تله‌کابین از کار افتاده، خانواده‌ها روستا را ترک می‌کنند.


    خولو خودش ارزش یک ساعت پیاده‌روی را دارد. نام کهنش، خولا، به «خانه‌ی تجاری» تفسیر می‌شود، چون راهی
    کاروانی از سامتسخه، از گذرگاه گودردزی، تا دریای سیاه از این‌جا می‌گذشت. در دوران عثمانی، بیگ‌های خیمشیاشویلی
    مرکز آجارای بالا را از سخالتا به این‌جا آوردند؛ در سال ۱۸۲۹ سپاه روس به فرماندهی ژنرال اوستن-زاکن
    اقامتگاهشان را ویران کرد. در آوریل ۱۹۲۹ روستاهای کوهستانی در برابر اشتراکی‌سازی اجباری و آزار مذهبی
    برخاستند، و سپاه شوروی شورش را فروکوفت. امروز مسجدی از سده‌ی هجدهم و کلیسای آندریاس قدیس، که در سال
    ۲۰۱۹ تقدیس شد، در این شهرک کنار هم جای دارند.


    فراسوی خولو، راه به سوی گذرگاه گودردزی (۲۰۲۵ متر) بالا می‌رود، جایی که جریان‌های گِل آتشفشانی جنگلی
    از اواخر میوسن تا اوایل پلیوسن را در خود دفن کردند؛ در دامنه‌ی شرقی آن، تنه‌های سنگ‌شده هنوز همان‌جا
    ایستاده‌اند که گِل آن‌ها را گرفتار کرد.


    تا زمانی که خطی تازه ساخته شود، تاگو جایی‌ست که باید به آن نگاه کرد، نه رفت: مسجدی و خانه‌هایی پراکنده
    بر لبه‌ی آن سوی دره، و میان آن‌ها، نزدیک به سیصد متر هوا.
  tip: >-
    در سپتامبر ۲۰۲۶ تله‌کابین همچنان بسته است و تاریخ بازگشایی معلوم نیست، پس پیش از آن‌که به کسی وعده‌ی
    سفر بدهید، در محل بررسی کنید. به تاگو تنها از راهی ناهموار می‌توان رسید؛ مردم محل با تاکسی‌های ۴×۴
    از خولو می‌روند. بهترین دید بر دره از نقاط دیدبانی در طول راه اصلی است. خولو کافه‌هایی با غذای آجاری،
    خانه‌های میهمان و پمپ بنزینی دارد. زمستان برف دره‌های بلند را می‌بندد (در سال ۲۰۲۶ گذرگاه گودردزی
    تا اواخر آوریل بازنشد). بیشتر شرکت‌های اجاره در قراردادشان عبور از گذرگاه را ممنوع می‌کنند، پس قرارداد
    خود را پیش از برنامه‌ریزی بخوانید.
  route: >-
    مسیر همه‌فصل نزدیک ۴۵۵ کیلومتر و هفت ساعت و بیست دقیقه است. از S1 (E60) تا سامتردیا بروید، S12 تا
    گریگولتی، و S2 در طول ساحل تا باتومی، سپس ۸۸ کیلومتر به سوی شرق، در طول آجاریستسکالی، بر راه باتومی-آخالتسیخه،
    از میان کدا و شوآخوی بالا بروید. این راه بی‌وقفه آسفالت است اما باریک و پرپیچ، و در جاهایی به‌واسطه‌ی
    رانش زمین به یک باند باریک شده؛ خودرویی شاسی‌بلند آسایش بیشتری می‌دهد اما ضروری نیست. در تابستان مسیری
    کوتاه‌تر، نزدیک ۲۹۰ کیلومتر، از راه خاشوری، S8 تا آخالتسیخه و گذرگاه گودردزی هست؛ تا سال ۲۰۲۶ آسفالت
    شده بود، به‌جز ۶ تا ۷ کیلومتر خاکی میان دیوکنیسی و ریکتی، اما پیش از هر چیز قرارداد اجاره‌ی خود را
    بررسی کنید. در خولو سوخت‌گیری کنید.
he:
  name: הרכבל של חולו ואג'אריה העילית
  short: >-
    חולו, עיירת השיירות הישנה של אג'אריה העילית, ורכבל טאגו השקט: מפתח יחיד באורך 1,720 מטרים מעל הקניון,
    סגור מאז 2024.
  body: >-
    **כמעט ארבעים שנה חצה תא אדום קטן את קניון אג'אריסצקאלי במפתח כבל יחיד, בלי אף עמוד אחד בין שתי הגדות.**


    הרכבל חולו-טאגו נפתח ב-1985: 1,720 מטרים של כבל פלדה תלוי בגובה של עד 280 מטרים מעל הנהר, וחציה שאורכה
    כשמונה דקות. הוא לא היה מעולם אטרקציה: הוא הוריד את ילדי טאגו לבית הספר בחולו, נשא סחורות בחזרה מעלה,
    ויצא לדרך כשהצטברו די נוסעים.


    מאז 2024 הוא לא זז. המפעיל הכריז שהקו אינו בטוח ואינו ניתן לתיקון. בתקציב אג'אריה ל-2026 הוקצו 200,000
    לארי, אך רק למחקר תכנון מקדים, ועד סוף ספטמבר 2026 לא הוכרז שום מכרז. מעבר לקניון המחיר גלוי לעין:
    כשנפתחה שנת הלימודים באותו חודש, לא היה בבית הספר הקטן של טאגו עצמו אפילו תלמיד אחד; מאז שהרכבל נעצר,
    משפחות עוזבות את הכפר.


    חולו עצמה שווה שעה ברגל. שמה הישן, חולה, מתפרש כ"בית מסחר", כי דרך שיירות עברה כאן מסמצחה, דרך מעבר
    גודרדזי, לחוף הים השחור. תחת העות'מאנים, הבגים לבית חימשיאשווילי העבירו לכאן את מרכז אג'אריה העילית
    מסחלתה; ב-1829 כוחות רוסיים בפיקוד הגנרל אוסטן-זקן שדד את מעונם. באפריל 1929 מרדו הכפרים ההרריים בקולקטיביזציה
    הכפויה וברדיפה הדתית, וכוחות סובייטים דיכאו את המרד. כיום עומדים בעיירה זה לצד זה מסגד מהמאה ה-18
    וכנסיית אנדראס הקדוש, שנחנכה ב-2019.


    מעבר לחולו הדרך מטפסת למעבר גודרדזי (2,025 מ'), שם זרמי בוץ וולקניים קברו יער מסוף המיוקן ותחילת הפליוקן;
    במדרון המזרחי שלו, גזעים מאובנים עדיין עומדים היכן שהבוץ תפס אותם.


    עד שיבנו קו חדש, טאגו הוא מקום שמביטים בו ולא נוסעים אליו: מסגד ובתים מפוזרים על הגדה הרחוקה, ובין
    לבין כשלוש מאות מטרים של אוויר.
  tip: >-
    לפי מצב ספטמבר 2026, הרכבל סגור ואין תאריך לפתיחה מחדש, אז בררו במקום לפני שתבטיחו למישהו את החציה.
    לטאגו אפשר להגיע רק בדרך לא סלולה; המקומיים נוסעים במוניות 4X4 מחולו. הנקודות הטובות ביותר לצפייה
    על הקניון הן לאורך הדרך הראשית. בחולו יש בתי קפה עם אוכל אג'ארי, בתי אירוח ותחנת דלק. בחורף שלג סוגר
    את העמקים הגבוהים (ב-2026 מעבר גודרדזי נפתח רק בסוף אפריל). רוב חברות ההשכרה אוסרות בחוזה שלהן את
    המעבר, אז קראו את החוזה שלכם לפני שתתכננו מסלול כזה.
  route: >-
    המסלול לכל השנה הוא כ-455 ק"מ ושבע שעות ועשרים דקות. סעו ב-S1 (E60) עד סמטרדיה, ב-S12 עד גריגולטי
    וב-S2 לאורך החוף עד בטומי, ואז פנו מזרחה ועלו 88 ק"מ בעמק אג'אריסצקאלי בדרך בטומי-אחלציחה, דרך קדה
    ושואחווי. הדרך סלולה מתחילתה ועד סופה אך צרה ומתפתלת, ובמקומות מצטמצמת לנתיב אחד בשל מפולות; רכב שטח
    מוסיף נוחות אך אינו הכרחי. בקיץ יש מסלול קצר יותר, כ-290 ק"מ, דרך חשורי, S8 עד אחלציחה ומעבר גודרדזי;
    עד 2026 היה סלול פרט ל-6–7 ק"מ עפר בין דיוקניסי לריקטי, אך בררו קודם את חוזה ההשכרה שלכם. תדלקו בחולו.
ar:
  name: تلفريك خولو وأدجاريا العليا
  short: >-
    خولو، بلدة القوافل القديمة في أدجاريا العليا، وتلفريك تاغو الصامت: كابل واحد يمتد 1,720 مترًا فوق
    الوادي، مغلق منذ 2024.
  body: >-
    **قرابة أربعين عامًا، عبرت عربة حمراء صغيرة وادي أدجاريستسكالي على كابل واحد ممتد، دون برج واحد بين
    الحافتين.**


    افتُتح تلفريك خولو-تاغو في عام 1985: 1,720 مترًا من الحبل الفولاذي معلّقة على ارتفاع يصل إلى 280 مترًا
    فوق النهر، وعبور يستغرق نحو ثماني دقائق. لم يكن يومًا وسيلة تسلية: كان ينقل أطفال تاغو إلى مدرستهم
    في خولو، ويحمل البضائع صعودًا، وينطلق حين يتجمّع عدد كافٍ من الركاب.


    منذ عام 2024 توقف عن الحركة. أعلنت الشركة المشغّلة أن الخط غير آمن ولا يمكن إصلاحه. خصّصت موازنة أدجاريا
    لعام 2026 مبلغ 200,000 لاري، لكن فقط لدراسة تصميم أولية، وحتى أواخر سبتمبر 2026 لم تُعلن أي مناقصة.
    وعلى الجانب الآخر من الوادي يبدو الثمن جليًّا: عندما بدأ العام الدراسي في ذلك الشهر نفسه، لم يكن في
    مدرسة تاغو الصغيرة نفسها تلميذ واحد؛ فالعائلات ترحل منذ توقّف الخط.


    خولو نفسها تستحق ساعة سيرًا على الأقدام. يُفسَّر اسمها القديم، خولا، بأنه يعني "بيت التجارة"، لأن
    طريق قوافل كان يمرّ من هنا من سامتسخه، عبر ممر غودردزي، إلى البحر الأسود. تحت الحكم العثماني، نقل
    بكوات خيمشياشفيلي مركز أدجاريا العليا إلى هنا من سخالتا؛ وفي عام 1829 دمّرت قوات روسية بقيادة الجنرال
    أوستن-زاكن مقرّهم. في أبريل 1929 ثارت القرى الجبلية ضد التجميع القسري والاضطهاد الديني، وسحقت القوات
    السوفياتية الثورة. واليوم يقف في البلدة جامع من القرن الثامن عشر وكنيسة القديس أندراوس، التي كُرّست
    عام 2019، جنبًا إلى جنب.


    خلف خولو، يصعد الطريق إلى ممر غودردزي (2,025 مترًا)، حيث دفنت تيارات الطين البركاني غابة من أواخر
    الميوسين وأوائل البليوسين؛ وعلى منحدره الشرقي، ما تزال الجذوع المتحجرة واقفة حيث أمسك بها الطين.


    وإلى أن يُبنى خط جديد، تاغو مكان يُنظر إليه لا يُذهب إليه: جامع وبيوت متناثرة على الضفة البعيدة، وبينهما
    نحو ثلاثمائة متر من الهواء.
  tip: >-
    حتى سبتمبر 2026 التلفريك مغلق ولا تاريخ معروف لإعادة تشغيله، فتحققوا محليًا قبل أن تَعِدوا أحدًا بالرحلة.
    لا يمكن الوصول إلى تاغو إلا بطريق وعر؛ يستخدم السكان المحليون سيارات أجرة دفع رباعي من خولو. أفضل
    مناظر الوادي من نقاط المراقبة على طول الطريق الرئيسي. في خولو مقاهٍ تقدّم الطعام الأدجاري، وبيوت ضيافة،
    ومحطة وقود. في الشتاء يُغلق الثلج الوديان المرتفعة (في 2026 أُعيد فتح ممر غودردزي في أواخر أبريل فقط).
    تمنع معظم شركات التأجير في عقودها عبور الممر، فاقرؤوا عقدكم قبل التخطيط لذلك.
  route: >-
    الطريق الصالح لكل الفصول نحو 455 كم وسبع ساعات وعشرون دقيقة. خذوا S1 (E60) إلى سامتريديا، ثم S12 إلى
    غريغوليتي، و S2 على طول الساحل إلى باتومي، ثم انحرفوا شرقًا واصعدوا 88 كم بمحاذاة أدجاريستسكالي على
    طريق باتومي-أخالتسيخي، عبر كيدا وشواخيفي. الطريق مُعبّد بالكامل لكنه ضيق ومتعرّج، وتضيّقه الانهيارات
    الأرضية في بعض الأماكن إلى مسار واحد؛ سيارة الدفع الرباعي تضيف راحة لكنها ليست ضرورية. في الصيف هناك
    طريق أقصر، نحو 290 كم، عبر خاشوري، و S8 إلى أخالتسيخي وممر غودردزي؛ وبحلول 2026 كان مُعبّدًا باستثناء
    6 إلى 7 كم من الطريق الترابي بين ديوكنيسي وريكيتي، لكن تحققوا أولًا من عقد تأجير سيارتكم. عبّئوا الوقود
    في خولو.
