ka:
  name: ფურტიოს ხიდი
  short: >-
    შუა საუკუნეების ქვის თაღი აჭარისწყალზე, ხულოს ქვემოთ: მდინარის ვიწრო ყელში, კლდეზე დაფუძნებული, დღემდე
    დგას თავისი თანამედროვე მემკვიდრის გვერდით.
  body: >-
    **ხულოდან დაახლოებით ხუთი კილომეტრით ქვემოთ, თანამედროვე საავტომობილო ხიდის გვერდით, ფლეთილი ქვის
    ერთადერთი თაღი, სავარაუდოდ, IX–X საუკუნეებიდან აერთებს აჭარისწყლის ორ ნაპირს.**


    ხიდი ოშოშმანად წოდებულ ადგილას დგას, შუახევის მუნიციპალიტეტის სოფლებს — ზამლეთსა და ფურტიოს — შორის.
    მასზე გადიოდა ყველაზე მოკლე საქარავნო გზა, რომელიც სხალთის ხეობის გზებს აჭარისწყლის ხეობის მთავარ,
    ზღვისკენ მიმავალ გზას უკავშირებდა. ვინ ააშენა, უცნობია: არც წარწერა შემორჩა და არც ქტიტორის სახელი.


    ხიდი თავის სახელ-დიდებაზე პატარაა — და სწორედ ესაა მისი ოსტატობა. მშენებლებმა ისეთი ადგილი შეარჩიეს,
    სადაც მდინარე კლდეებს შორის მკვეთრად ვიწროვდება, რომ ერთი მოკლე თაღი ყოფილიყო საკმარისი. მალი 9,80
    მეტრია, ისარი — 4,40; შემორჩენილი ძირითადი ნაწილის სიგრძე 13,5 მეტრია, სიგანე კი ორ მეტრს ოდნავ აღემატება.
    ზოგიერთ გზამკვლევში მოყვანილი 35 მეტრი გამოქვეყნებულ აზომვას არ შეესაბამება. ორივე მისასვლელი ჩამოქცეულია.
    არც მოაჯირი აქვს, არც ლავგარდანი — მხოლოდ ფლეთილი ქვა და თაღის ორივე მხარეს ორ-ორი პატარა ოთხკუთხა
    ნიში: სწორედ ეს დეტალი განასხვავებს ფურტიოს ხიდს მისი თითქმის ტყუპისცალისგან, მახუნცეთის ხიდისგან.
    ხიდი აღდგენილია, 2006 წლიდან კი ეროვნული მნიშვნელობის ძეგლია.


    ადგილობრივი გადმოცემით, დაახლოებით ორასი წლის წინ აჭარაში დიდი წყალდიდობა იყო: აჭარისწყალი მთებიდან
    უზარმაზარ ლოდებს მოაგორებდა და მთელ ხეობას მისი გრუხუნი ედგა. ფერდობები ჩამოიშალა, ხეები წაიქცა, სახლები
    დაინგრა, ფურტიოს ხიდს კი ვერაფერი დააკლო. ამას იმით ხსნიან, რომ ხიდის ორივე ბოლო ბუნებრივ კლდეს ეყრდნობა.


    გვერდით მდგარი ახალი ხიდი იმავე საქმეს აკეთებს — მეტი ბეტონითა და ნაკლები სინატიფით.
  tip: >-
    ხიდი უფასო და ყოველთვის ხელმისაწვდომია. გზიდან მასთან მოკლე ბილიკი და კიბე ჩადის, რომელიც წვიმის შემდეგ
    სრიალებს, ზემო აჭარაში კი წვიმა ხშირია. მოაჯირი არ აქვს, ამიტომ თაღზე ბავშვებს ხელი არ გაუშვათ. ნახევარი
    საათი საკმარისია. ინფრასტრუქტურა არ არის: ისადილეთ და საწვავი ჩაასხით ხულოში, რამდენიმე წუთის სავალზე,
    ან შუახევში. სხალთის ხეობისკენ, სხალთის მონასტრამდე მიმავალი გზა სულ ახლოს იწყება, ხოლო თუ ბათუმიდან
    ამოდიხართ, გზად მახუნცეთის ხიდთანაც გაჩერდით — ოჯახური მსგავსება თვალნათლივ ჩანს.
  route: >-
    ყველაზე მოკლე გზა, 297 კილომეტრი და დაახლოებით ხუთი საათი და ათი წუთი, გოდერძის უღელტეხილზე გადის:
    ს1-ით (E60) ხაშურამდე, ს8-ით ბორჯომის გავლით ახალციხემდე, შემდეგ შ1-ით ადიგენის გავლით, უღელტეხილზე
    (2025 მ) გადასვლით და ხულოში ჩავლით. ხიდი ხულოდან დაახლოებით ხუთ კილომეტრშია, ზამლეთთან, ახალი ხიდის
    გვერდით. უღელტეხილი საიმედოა მხოლოდ უთოვლო თვეებში; გამგზავრებამდე გადაამოწმეთ მისი მდგომარეობა და
    ქირავნობის ხელშეკრულების პირობები. ჩვეულებრივი მანქანით მთელი წლის გზა ბათუმზე გადის: ს1, ს12 და ს2
    ზღვამდე, შემდეგ დაახლოებით 83 კმ ასფალტიან, მაგრამ დაკლაკნილ შ1-ზე ქედისა და შუახევის გავლით — სულ
    დაახლოებით 440 კმ. საწვავი შუახევში ან ხულოში ჩაასხით.
en:
  name: Furtio Bridge
  short: >-
    A medieval stone arch over the Adjaristsqali below Khulo, set on bedrock where the river narrows,
    still standing beside its modern successor.
  body: >-
    **Some five kilometres below Khulo, beside a modern road bridge, a single arch of split stone has
    linked the two banks of the Adjaristsqali since, it is thought, the 9th or 10th century.**


    The bridge stands at a spot called Oshoshmani, between the villages of Zamleti and Furtio in Shuakhevi
    municipality. It carried the shortest caravan route from the roads of the Skhalta valley to the main
    road down the Adjaristsqali gorge towards the sea. Who built it is not recorded: no inscription and
    no patron's name survive.


    It is smaller than its reputation, and that is its cleverness. The builders chose a place where the
    river is squeezed tight between rocks, so that one short arch would do. The span is 9.8 metres and
    the rise 4.4; the surviving body of the bridge is 13.5 metres long and a little over two metres wide.
    The 35 metres quoted in some guides does not match the published survey. Both approach ramps have
    collapsed. There is no parapet and no cornice, only split stone and, on each side of the arch, a pair
    of small rectangular niches, the one detail that tells Furtio apart from its near-twin at Makhuntseti.
    The bridge has been restored, and since 2006 it has been a monument of national significance.


    Local tradition tells of a great flood some two hundred years ago, when the Adjaristsqali rolled boulders
    down from the mountains and the whole valley rang with its roar. Slopes slid, trees fell and houses
    went, but Furtio held. People credit the living rock on which both its ends are set.


    The new bridge next door does the same job, with more concrete and less grace.
  tip: >-
    Free and always open. The bridge is reached from the road by a short path and steps, which turn slick
    after rain, and upper Adjara gets a great deal of rain. There is no parapet, so keep hold of children
    on the arch. Half an hour is enough. There are no facilities: eat and refuel in Khulo, a few minutes
    up the road, or in Shuakhevi. The side road up the Skhalta valley to Skhalta Monastery begins close
    by, and if you drive up from Batumi, stop at the Makhuntseti bridge on the way to see the family resemblance.
  route: >-
    The shortest route, 297 km and about five hours ten minutes, crosses the Goderdzi Pass: the S1 (E60)
    to Khashuri, the S8 via Borjomi to Akhaltsikhe, then the Sh1 past Adigeni, over the pass (2,025 m)
    and down through Khulo. The bridge is some five kilometres beyond Khulo, beside the modern bridge
    at Zamleti. The pass is reliable only in the snow-free months; check its current state and your rental
    terms before committing. With an ordinary car the year-round way runs via Batumi: the S1, S12 and
    S2 to the coast, then about 83 km up the sealed but twisting Sh1 through Keda and Shuakhevi, roughly
    440 km in all. Fuel in Shuakhevi or Khulo.
ru:
  name: Мост Фуртио
  short: >-
    Средневековая каменная арка над Аджарисцкали ниже Хуло: стоит на скале в теснине реки — рядом со своим
    современным преемником.
  body: >-
    **Километрах в пяти ниже Хуло, рядом с современным автомобильным мостом, одна арка из колотого камня
    соединяет берега Аджарисцкали — как считается, с IX или X века.**


    Мост стоит в урочище Ошошмани, между сёлами Замлети и Фуртио в Шуахевском муниципалитете. По нему
    шёл кратчайший караванный путь, связывавший дороги долины Схалты с главной дорогой, что спускалась
    ущельем Аджарисцкали к морю. Кто его построил, неизвестно: не сохранилось ни надписи, ни имени заказчика.


    Мост меньше своей славы — и в этом его хитрость. Строители выбрали место, где река зажата между скал,
    чтобы хватило одной короткой арки. Пролёт — 9,8 метра, стрела подъёма — 4,4; сохранившаяся часть моста
    — 13,5 метра в длину и чуть больше двух метров в ширину. Цифра в 35 метров, которую приводят некоторые
    путеводители, не сходится с опубликованными обмерами. Оба въездных пандуса обрушились. Нет ни парапета,
    ни карниза — только колотый камень да по паре небольших прямоугольных ниш с каждой стороны арки: единственная
    деталь, которая отличает Фуртио от его почти близнеца в Махунцети. Мост реставрировали, и с 2006 года
    он — памятник национального значения.


    Местное предание рассказывает о великом наводнении лет двести назад, когда Аджарисцкали катила с гор
    валуны и вся долина гудела от её рёва. Сползали склоны, падали деревья, уносило дома, а Фуртио устоял.
    Люди объясняют это коренной скалой, на которую опираются оба его конца.


    Новый мост по соседству делает ту же работу: бетона в нём больше, изящества меньше.
  tip: >-
    Бесплатно и открыто всегда. От дороги к мосту ведут короткая тропа и ступени, которые после дождя
    становятся скользкими, а дождей в Верхней Аджарии очень много. Парапета нет, поэтому на арке крепко
    держите детей. Получаса достаточно. Никакой инфраструктуры нет: поесть и заправиться можно в Хуло,
    в нескольких минутах выше по дороге, или в Шуахеви. Боковая дорога вверх по долине Схалты к монастырю
    Схалта начинается совсем рядом, а если едете из Батуми, остановитесь по пути у моста в Махунцети,
    чтобы увидеть фамильное сходство.
  route: >-
    Самый короткий путь — 297 км, около пяти часов десяти минут — ведёт через перевал Годердзи: по S1
    (E60) до Хашури, по S8 через Боржоми до Ахалцихе, затем по Sh1 мимо Адигени, через перевал (2025 м)
    и вниз через Хуло. Мост — примерно в пяти километрах за Хуло, рядом с новым мостом у Замлети. Перевал
    надёжно проходим только в бесснежные месяцы; перед поездкой уточните его состояние и условия договора
    проката. На обычной машине круглый год ездят через Батуми: по S1, S12 и S2 к побережью, затем около
    83 км вверх по асфальтированной, но извилистой Sh1 через Кеду и Шуахеви — всего примерно 440 км. Заправка
    — в Шуахеви или Хуло.
fa:
  name: پل فورتیو
  short: >-
    طاقی سنگی از سده‌های میانه بر آجاریس‌تسکالی، پایین‌دست خولو، که بر بستر سنگی و در جایی که رود تنگ
    می‌شود بنا شده و هنوز کنار جانشین امروزی‌اش برپاست.
  body: >-
    **حدود پنج کیلومتر پایین‌تر از خولو، کنار پلی امروزی برای خودروها، تک‌طاقی از سنگ شکسته دو کرانهٔ
    آجاریس‌تسکالی را به هم پیوند می‌دهد؛ گمان می‌رود از سدهٔ نهم یا دهم میلادی.**


    پل در محلی به نام اوشوشمانی، میان روستاهای زاملتی و فورتیو در شهرستان شواخوی، ایستاده است. کوتاه‌ترین
    راه کاروان‌رو، که جاده‌های درهٔ سخالتا را به جادهٔ اصلی درهٔ آجاریس‌تسکالی و از آنجا به دریا می‌رساند،
    از روی آن می‌گذشت. سازنده‌اش ثبت نشده است: نه کتیبه‌ای مانده و نه نام بانی‌ای.


    از آوازه‌اش کوچک‌تر است، و زیرکی‌اش در همین است. سازندگان جایی را برگزیدند که رود میان صخره‌ها تنگ
    فشرده می‌شود، تا یک طاق کوتاه کافی باشد. دهانهٔ طاق ۹٫۸ متر و خیز آن ۴٫۴ متر است؛ بدنهٔ برجامانده
    ۱۳٫۵ متر درازا و کمی بیش از دو متر پهنا دارد. رقم ۳۵ متری که برخی راهنماها می‌آورند با اندازه‌گیری‌های
    منتشرشده جور درنمی‌آید. هر دو شیب‌راههٔ دو سوی پل فرو ریخته‌اند. نه جان‌پناهی هست و نه قرنیزی؛ تنها
    سنگ شکسته، و در هر سوی طاق یک جفت طاقچهٔ کوچک چهارگوش، یگانه جزئی که فورتیو را از همزاد تقریبی‌اش
    در ماخونتستی جدا می‌کند. پل مرمت شده و از ۲۰۰۶ اثری با اهمیت ملی است.


    روایتی محلی از سیلی بزرگ در حدود دویست سال پیش می‌گوید، هنگامی که آجاریس‌تسکالی تخته‌سنگ‌ها را از
    کوه فرو می‌غلتاند و غرشش در سراسر دره می‌پیچید. دامنه‌ها لغزیدند، درختان افتادند و خانه‌ها را آب برد،
    اما فورتیو ایستاد. مردم این پایداری را از صخرهٔ طبیعی‌ای می‌دانند که هر دو سرِ پل بر آن نشسته است.


    پل تازهٔ کناری همان کار را می‌کند، با بتن بیشتر و ظرافت کمتر.
  tip: >-
    رایگان است و همیشه باز. از جاده با کوره‌راهی کوتاه و چند پله به پل می‌رسید که پس از باران لغزنده می‌شوند،
    و آجارای علیا باران فراوانی دارد. جان‌پناهی نیست، پس روی طاق دست کودکان را محکم بگیرید. نیم ساعت کافی
    است. هیچ امکاناتی در کار نیست: برای غذا و سوخت به خولو، چند دقیقه بالاتر در همین جاده، یا به شواخوی
    بروید. جادهٔ فرعی درهٔ سخالتا به سوی صومعهٔ سخالتا در همین نزدیکی آغاز می‌شود، و اگر از باتومی بالا
    می‌آیید، سر راه کنار پل ماخونتستی توقف کنید تا شباهت خانوادگی را ببینید.
  route: >-
    کوتاه‌ترین مسیر، ۲۹۷ کیلومتر و حدود پنج ساعت و ده دقیقه، از گردنهٔ گودردزی می‌گذرد: جادهٔ S1 (E60)
    تا خاشوری، S8 از راه بورجومی تا آخالتسیخه، سپس Sh1 از کنار آدیگنی، بر فراز گردنه (۲۰۲۵ متر) و سرازیر
    از میان خولو. پل حدود پنج کیلومتر آن سوی خولو، کنار پل تازه در زاملتی است. گردنه تنها در ماه‌های بی‌برف
    قابل اعتماد است؛ پیش از حرکت، وضعیت کنونی آن و شرایط قرارداد اجارهٔ خودرو را بررسی کنید. با خودروی
    معمولی، راه همه‌فصل از باتومی می‌گذرد: S1، S12 و S2 تا ساحل، سپس حدود ۸۳ کیلومتر سربالایی در Sh1 آسفالت‌شده
    اما پرپیچ‌وخم از میان کدا و شواخوی؛ روی هم حدود ۴۴۰ کیلومتر. سوخت در شواخوی یا خولو.
he:
  name: גשר פורטיו
  short: >-
    קשת אבן מימי הביניים מעל האג'ריסצקאלי, במורד הנהר מחולו, הנשענת על סלע האם במקום שבו האפיק מצטמצם,
    ועדיין עומדת לצד הגשר המודרני שבא אחריה.
  body: >-
    **כחמישה קילומטרים במורד הנהר מחולו, לצד גשר כביש מודרני, קשת יחידה של אבן מבוקעת מחברת בין שתי גדות
    האג'ריסצקאלי – כך מעריכים – מאז המאה ה-9 או ה-10.**


    הגשר ניצב במקום הקרוי אושושמאני, בין הכפרים זמלטי ופורטיו שבמחוז שואחווי. דרכו עבר נתיב השיירות הקצר
    ביותר, שחיבר את דרכי עמק סחאלטה עם הדרך הראשית שירדה בערוץ האג'ריסצקאלי אל הים. מי בנה אותו – לא נרשם:
    לא שרדו כתובת ולא שמו של פטרון.


    הוא קטן מן המוניטין שלו, ובדיוק בזה טמונה חוכמתו. הבונים בחרו נקודה שבה הנהר נדחק בין סלעים, כך שקשת
    אחת קצרה תספיק. מפתח הקשת 9.8 מטרים וגובהה 4.4; גוף הגשר ששרד ארוך 13.5 מטרים ורוחבו מעט יותר משני
    מטרים. הנתון של 35 מטרים שמופיע בכמה מדריכים אינו תואם את המדידות שפורסמו. שתי רמפות הגישה קרסו. אין
    מעקה ואין כרכוב, רק אבן מבוקעת, ומשני צדי הקשת זוג גומחות מלבניות קטנות – הפרט היחיד שמבדיל את פורטיו
    מאחיו הכמעט-תאום במאחונצטי. הגשר שוחזר, ומאז 2006 הוא אתר מורשת בעל חשיבות לאומית.


    מסורת מקומית מספרת על שיטפון גדול לפני כמאתיים שנה, כשהאג'ריסצקאלי גלגל סלעי ענק מן ההרים והעמק כולו
    הדהד משאגתו. מדרונות גלשו, עצים קרסו ובתים נסחפו, אבל פורטיו החזיק מעמד. האנשים זוקפים זאת לזכות הסלע
    החי ששני קצותיו נשענים עליו.


    הגשר החדש שלידו עושה את אותה עבודה – עם יותר בטון ופחות חן.
  tip: >-
    הכניסה חופשית והמקום פתוח תמיד. מן הכביש מגיעים לגשר בשביל קצר ובמדרגות, שנעשים חלקלקים אחרי גשם –
    ובאג'ריה העילית יורד הרבה מאוד גשם. אין מעקה, לכן החזיקו היטב את הילדים על הקשת. חצי שעה מספיקה. אין
    במקום שום מתקנים: אכלו ותדלקו בחולו, כמה דקות במעלה הכביש, או בשואחווי. הדרך הצדדית במעלה עמק סחאלטה
    אל מנזר סחאלטה מתחילה ממש בסמוך, ואם אתם עולים מבטומי, עצרו בדרך ליד הגשר במאחונצטי כדי לראות את הדמיון
    המשפחתי.
  route: >-
    הדרך הקצרה ביותר, 297 ק"מ וכחמש שעות ועשר דקות, חוצה את מעבר גודרדזי: כביש S1 (E60) עד חאשורי, כביש
    S8 דרך בורג'ומי עד אחלציחה, ואז כביש Sh1 על פני אדיגני, מעל המעבר (2,025 מ') ובירידה דרך חולו. הגשר
    נמצא כחמישה קילומטרים אחרי חולו, לצד הגשר המודרני בזמלטי. המעבר אמין רק בחודשים שבהם אין שלג; לפני
    שאתם יוצאים לדרך, בדקו את מצבו העדכני ואת תנאי חוזה ההשכרה. ברכב רגיל, הדרך הפתוחה כל השנה עוברת דרך
    בטומי: כבישים S1, S12 ו-S2 אל החוף, ואז כ-83 ק"מ במעלה כביש Sh1 הסלול אך המפותל, דרך קדה ושואחווי
    – כ-440 ק"מ בסך הכול. תדלוק בשואחווי או בחולו.
ar:
  name: جسر فورتيو
  short: >-
    قوس حجري من العصور الوسطى فوق نهر أدجاريستسكالي أسفل خولو، أُقيم على صخر الأساس حيث يضيق النهر، وما
    زال قائماً إلى جوار خلفه الحديث.
  body: >-
    **على بعد نحو خمسة كيلومترات أسفل خولو، إلى جانب جسر حديث للسيارات، يصل قوس واحد من الحجر المفلوق
    بين ضفتي أدجاريستسكالي منذ القرن التاسع أو العاشر، على ما يُعتقد.**


    يقوم الجسر في موضع يُدعى أوشوشماني، بين قريتي زامليتي وفورتيو في بلدية شواخيفي. كان يمرّ عليه أقصر
    طريق للقوافل، يربط دروب وادي سخالتا بالطريق الرئيسي النازل عبر مضيق أدجاريستسكالي نحو البحر. ولا يُعرف
    من بناه: فلم يبقَ نقش ولا اسم راعٍ.


    هو أصغر من صيته، وفي ذلك تكمن براعته. فقد اختار البناؤون موضعاً ينحشر فيه النهر بين الصخور، لكي يكفي
    قوس واحد قصير. تبلغ فتحة القوس 9.8 أمتار وارتفاعه 4.4 أمتار، ويمتد الجزء الباقي من الجسر 13.5 متراً
    بعرض يزيد قليلاً على مترين. أما رقم الـ35 متراً الذي تذكره بعض الأدلة فلا يطابق القياسات المنشورة.
    وقد انهار المنحدران المؤديان إليه من الجهتين. لا درابزين ولا إفريز، بل حجر مفلوق فحسب، وعلى كل جانب
    من القوس زوج من الكوى المستطيلة الصغيرة، وهو التفصيل الوحيد الذي يميّز فورتيو عن توأمه شبه المطابق
    في ماخونتسيتي. رُمّم الجسر، وهو منذ عام 2006 معلم ذو أهمية وطنية.


    وتروي حكاية محلية أن فيضاناً عظيماً وقع قبل نحو مئتي عام، حين دحرج أدجاريستسكالي الصخور الضخمة من
    الجبال وضجّ الوادي كله بهديره. انزلقت السفوح وسقطت الأشجار وجُرفت البيوت، لكن فورتيو صمد. ويعزو الناس
    ذلك إلى الصخر الحي الذي يستند إليه طرفاه.


    أما الجسر الجديد المجاور فيؤدي المهمة نفسها، بخرسانة أكثر ورشاقة أقل.
  tip: >-
    الدخول مجاني والمكان مفتوح دائماً. يُبلغ الجسر من الطريق عبر ممر قصير ودرجات تصير زلقة بعد المطر،
    والمطر في أدجاريا العليا غزير جداً. لا درابزين هناك، فأمسكوا بالأطفال جيداً على القوس. تكفي نصف ساعة.
    لا توجد أي مرافق: تناولوا الطعام وتزودوا بالوقود في خولو، على بعد دقائق صعوداً على الطريق، أو في شواخيفي.
    تبدأ الطريق الجانبية الصاعدة في وادي سخالتا إلى دير سخالتا على مقربة من هنا، وإن كنتم قادمين من باتومي
    فتوقفوا في طريقكم عند جسر ماخونتسيتي لتروا الشبه العائلي.
  route: >-
    أقصر الطرق، 297 كم ونحو خمس ساعات وعشر دقائق، يعبر ممر غودردزي: الطريق S1 (E60) حتى خاشوري، ثم S8
    عبر بورجومي إلى أخالتسيخي، ثم Sh1 مروراً بأديغيني، فوق الممر (2025 م) ونزولاً عبر خولو. يقع الجسر
    على بعد نحو خمسة كيلومترات بعد خولو، بجوار الجسر الحديث عند زامليتي. لا يُعتمد على الممر إلا في الأشهر
    الخالية من الثلج؛ فتحققوا من حالته الراهنة ومن شروط عقد التأجير قبل الانطلاق. أما بسيارة عادية فالطريق
    المتاح طوال العام يمرّ بباتومي: S1 وS12 وS2 إلى الساحل، ثم نحو 83 كم صعوداً على Sh1 المعبّد لكن المتعرّج
    عبر كيدا وشواخيفي، أي قرابة 440 كم إجمالاً. التزود بالوقود في شواخيفي أو خولو.
