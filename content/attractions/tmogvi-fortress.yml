ka:
  name: თმოგვის ციხე
  short: >-
    სამ კლდოვან ბორცვზე გაშლილი ციხე-ქალაქი მტკვრის ხეობაში: მიწისძვრებმა არაერთხელ დაამხო, დღეს კი მასთან
    მხოლოდ ფეხით ახვალთ.
  body: >-
    **თმოგვს მტერი იშვიათად ერეოდა — ეს ციხე-ქალაქი ბოლოს თავად მიწამ დაამხო.**


    ციხე მტკვრის მარცხენა ნაპირზე, ხერთვისსა და ვარძიას შორის, მიუვალ კლდეზე დგას და ჯავახეთის ზეგნიდან
    ხეობაში ჩამავალ ძველ გზას დარაჯობდა. მატიანეში პირველად 914 წელს იხსენიება: არაბთა სარდალი იუსუფ იბნ
    აბი-ს-საჯი (ქართულ მატიანეში — აბულ-კასიმი) მის კედლებს მიადგა, მაგრამ თმოგვი ვერ დაიმორჩილა. XI საუკუნის
    დასაწყისში საქართველოს გამაერთიანებელმა ბაგრატ III-მ ციხე სამეფო საპყრობილედ აქცია — აქ ჰყავდა გამოკეტილი
    კლარჯეთის ტახტს მოკლებული მეფეები, სუმბატი და გურგენი.


    მერე მიწა აზანზარდა. 1088 წლის მიწისძვრამ ციხე ჩამოაქცია და ქვეშ მოიყოლა მისი პატრონი კახაბერი მეუღლითურთ;
    მიწა 1283 და 1319 წლებშიც შეირყა, თმოგვი კი ყოველ ჯერზე ხელახლა აღდგებოდა. 1191 წელს თამარ მეფემ ციხე
    სარგის მხარგრძელს უბოძა. ამ შტოდან გამოვიდა სარგის თმოგველიც — მწერალი, რომელსაც ტრადიცია სპარსული
    „ვის და რამინის“ ქართული პროზაული ვერსიის, „ვისრამიანის“, ავტორად მიიჩნევს. ბოლო ქართველი პატრონები
    აქ შალიკაშვილები იყვნენ; 1578 წელს თმოგვი ოსმალებმა დაიკავეს.


    დღეს სამ კლდოვან ბორცვს ერთი გალავანი კრავს; თითოეულის თხემზე კოშკების ნაშთია, შიგნით კი ორი წყალსაცავი.
    მოძებნეთ კლდეში გაჭრილი საიდუმლო გვირაბი, რომლითაც ალყის დროს მეციხოვნეები მდინარიდან წყალს ეზიდებოდნენ.
    გალავნის გარეთ, დასავლეთით, ხევში, წმინდა ეფრემის კლდეში ნაკვეთი ეკლესია იმალება, კლდისავე კანკელით,
    ახლომახლო ნანგრევებში კი XIII საუკუნის კედლის მხატვრობის ნაფლეთები შემორჩა.


    სომხები ამ ციხეს თმკაბერდს უწოდებენ. მათი გადმოცემით, ციხის პატრონს ვერავინ ერეოდა, სანამ სპარსთა
    შაჰმა მისი ცოლი არ აცდუნა: ქალმა ქმარი მოწამლა, მეომრები დაათრო და კარი მტერს გაუღო. ამ თქმულებაზე
    ოვანეს თუმანიანმა 1902 წელს პოემა დაწერა, ალექსანდრე სპენდიაროვმა კი ოპერა „ალმასტი“ შექმნა.


    მწუხრისას დასავლეთის ბორცვზე დადექით: ქალაქი, რომელიც მიწამ სამგზის დაამხო, ბალახშია მიმოფანტული,
    ქვემოთ კი მხოლოდ მტკვარი შხუის.
  tip: >-
    დათვალიერებას სულ მცირე ორი საათი მოანდომეთ. აქ არც ბილეთია, არც დარაჯი, არც მოაჯირი და არც მონიშნული
    ბილიკი: მდინარიდან ასვლას 30–45 წუთი სჭირდება ციცაბო, ფხვიერ ქვაზე, ზემოთ კი ფრიალო კიდეები დაუცველია.
    კარგი ფეხსაცმელი ჩაიცვით, მარტო ნუ წახვალთ და ვინმეს უთხარით, სად მიდიხართ — ხეობაში მობილური კავშირი
    ხან ქრება. ჩრდილი არსადაა: თითოეულს ორი ლიტრი წყალი, ქუდი და მზისგან დამცავი კრემი სჭირდება. გაზაფხულსა
    და შემოდგომაზე მაღალ ბალახში ტკიპასა და გველს გაუფრთხილდით. ასპინძის შემდეგ მაღაზიას და ტუალეტს ვეღარ
    ნახავთ; უახლოესი კაფეები ვარძიასთანაა. თოვლსა და ყინულზე ასვლას ნუ ეცდებით.
  route: >-
    ყველაზე მოკლე გზა (დაახლოებით 221 კმ, 4 საათი და 10 წუთი) ჯავახეთის ზეგანზე გადის: თბილისიდან შ36-ით,
    წყნეთის გავლით, მანგლისამდე, შემდეგ შ31-ით წალკაზე ნინოწმინდისკენ, იქიდან ს11-ით ახალქალაქზე და ფარავნის
    კანიონით ხერთვისამდე. ხერთვისიდან ვარძიის გზას (შ58) კიდევ დაახლოებით 12 კილომეტრი გაჰყევით. სოფელ
    თმოგვთან, სადაც გზა ციხის ქვეშ ჩაივლის, მოკლე მოხრეშილ შესახვევზე მანქანა დატოვეთ და მტკვარი საცალფეხო
    ხიდით გადაკვეთეთ. ბორჯომის, ახალციხისა და ასპინძის გავლით დაახლოებით 270 კმ-ია — 4 საათი და 45 წუთი.
    საწვავი ახალქალაქში ან ასპინძაში ჩაასხით. მოხრეშილ მონაკვეთზე, განსაკუთრებით წვიმის შემდეგ, ჯიპის
    მაღალი კლირენსი გამოგადგებათ.
en:
  name: Tmogvi Fortress
  short: >-
    A cliff town-fortress strung across three rocky hills above the Mtkvari, thrown down by earthquakes
    and still reached only on foot.
  body: >-
    **Enemies rarely got the better of Tmogvi; in the end it was the ground itself that brought the town
    down.**


    The fortress holds a crag on the Mtkvari's left bank between Khertvisi and Vardzia, guarding the old
    road from the Javakheti plateau into the gorge. The chronicles first name it in 914, when the Arab
    commander Yusuf ibn Abi'l-Saj reached its walls and left without taking it. Early in the 11th century
    Bagrat III, the king who united Georgia, used it as a royal prison for the deposed princes of Klarjeti,
    Sumbat and Gurgen.


    Then the earth moved. The earthquake of 1088 brought the fortress down on its lord, Kakhaber, and
    his wife; the ground shook again in 1283 and 1319, and each time Tmogvi was rebuilt. In 1191 Queen
    Tamar granted it to Sargis Mkhargrdzeli, and his line produced Sargis Tmogveli, the writer traditionally
    credited with the Georgian prose version of the Persian romance *Vis and Ramin*, the *Visramiani*.
    The Shalikashvili were its last Georgian masters; the Ottomans took it in 1578.


    Today a single wall binds three rocky hills, each crowned with ruined towers, with two cisterns inside.
    Look for the secret passage cut through the rock down to the river, which kept the garrison in water
    under siege. In a ravine west of the walls hides the rock-cut church of St Ephrem, its chancel screen
    carved from the living stone; nearby ruins keep fragments of 13th-century painting.


    Armenians call the place Tmkaberd. Their tradition tells of a lord no army could defeat until a Persian
    shah seduced his wife; she poisoned him, got his soldiers drunk and opened the gates. Hovhannes Tumanyan
    turned the story into a poem in 1902, and Alexander Spendiaryan into the opera *Almast*.


    Stand on the western hill at dusk. The town the earth threw down three times lies scattered in the
    grass, and the only sound is the Mtkvari far below.
  tip: >-
    Allow two hours. There is no ticket, no guard, no railing and no marked path: the climb from the river
    takes 30 to 45 minutes on steep, loose stone, and the drops at the top are unguarded. Wear boots,
    don't go alone and tell someone your plan, as the phone signal comes and goes in the gorge. There
    is no shade at all, so carry two litres of water each, a hat and sun cream. In spring and autumn watch
    for ticks and snakes in the long grass. There are no shops or toilets beyond Aspindza; the nearest
    cafés are at Vardzia. Don't attempt it in snow or ice.
  route: >-
    The shortest way (about 221 km, 4 h 10 min) crosses the Javakheti plateau. From Tbilisi take the Sh36
    through Tskneti to Manglisi, then the Sh31 through Tsalka towards Ninotsminda, and the S11 through
    Akhalkalaki and down the Paravani canyon to Khertvisi. From there it is about 12 km along the Sh58
    Vardzia road. Near Tmogvi village, where the road passes below the fortress, leave the car at the
    short gravel turn-off and cross the Mtkvari by the footbridge. The route via Borjomi, Akhaltsikhe
    and Aspindza is about 270 km and 4 h 45 min. Fill up in Akhalkalaki or Aspindza. An SUV's clearance
    helps on the gravel, especially after rain.
ru:
  name: Крепость Тмогви
  short: >-
    Скальный город-крепость на трёх каменистых холмах над Курой: его рушили землетрясения, и добраться
    до него до сих пор можно только пешком.
  body: >-
    **Враги редко брали верх над Тмогви — в конце концов город погубила сама земля.**


    Крепость занимает утёс на левом берегу Куры между Хертвиси и Вардзией и стережёт старую дорогу с Джавахетского
    плато в ущелье. Летописи впервые называют её под 914 годом: арабский полководец Юсуф ибн Абу-с-Садж
    подступил к стенам и ушёл ни с чем. В начале XI века Баграт III, царь-объединитель Грузии, держал
    здесь, как в царской тюрьме, низложенных князей Кларджети — Сумбата и Гургена.


    А потом дрогнула земля. Землетрясение 1088 года обрушило крепость на её владетеля Кахабера и его жену;
    толчки повторились в 1283 и 1319 годах, и всякий раз Тмогви отстраивали заново. В 1191 году царица
    Тамар пожаловала крепость Саргису Мхаргрдзели, и из его рода вышел Саргис Тмогвели — писатель, которому
    традиция приписывает грузинское прозаическое переложение персидского романа «Вис и Рамин», «Висрамиани».
    Последними грузинскими хозяевами крепости были Шаликашвили; в 1578 году её взяли османы.


    Сегодня единая стена стягивает три скалистых холма, каждый из них увенчан руинами башен, а внутри
    — две цистерны. Отыщите тайный ход, прорубленный в скале к реке: он давал гарнизону воду во время
    осад. В овраге к западу от стен прячется высеченная в скале церковь Святого Ефрема, её алтарная преграда
    вырезана прямо в живом камне; в соседних руинах уцелели фрагменты росписей XIII века.


    Армяне называют это место Тмкаберд. Их предание рассказывает о владетеле, которого не могло одолеть
    ни одно войско, пока персидский шах не соблазнил его жену: она отравила мужа, напоила его воинов и
    открыла ворота. В 1902 году Ованес Туманян сложил из этой истории поэму, а Александр Спендиаров —
    оперу «Алмаст».


    Поднимитесь в сумерках на западный холм. Город, который земля трижды повергала наземь, рассыпан в
    траве, и слышна только Кура далеко внизу.
  tip: >-
    Заложите два часа. Здесь нет ни билетов, ни сторожа, ни перил, ни размеченной тропы: подъём от реки
    занимает 30–45 минут по крутому осыпающемуся камню, а обрывы наверху ничем не огорожены. Наденьте
    ботинки, не ходите в одиночку и предупредите кого-нибудь о своих планах — связь в ущелье то появляется,
    то пропадает. Тени нет совсем, поэтому берите по два литра воды на человека, шляпу и солнцезащитный
    крем. Весной и осенью остерегайтесь клещей и змей в высокой траве. Дальше Аспиндзы нет ни магазинов,
    ни туалетов; ближайшие кафе — у Вардзии. В снег и гололёд не поднимайтесь.
  route: >-
    Кратчайший путь (около 221 км, 4 ч 10 мин) идёт через Джавахетское плато. Из Тбилиси по Sh36 через
    Цхнети до Манглиси, затем по Sh31 через Цалку в сторону Ниноцминды и по S11 через Ахалкалаки и вниз
    по каньону Паравани до Хертвиси. Оттуда около 12 км по вардзийской дороге Sh58. У села Тмогви, где
    дорога проходит под крепостью, оставьте машину на коротком гравийном съезде и перейдите Куру по пешеходному
    мосту. Путь через Боржоми, Ахалцихе и Аспиндзу — около 270 км и 4 ч 45 мин. Заправьтесь в Ахалкалаки
    или Аспиндзе. На гравии пригодится клиренс кроссовера или внедорожника, особенно после дождя.
fa:
  name: قلعهٔ تموگوی
  short: >-
    شهر-دژی صخره‌ای که بر سه تپهٔ سنگی بالای متکواری گسترده است؛ زمین‌لرزه‌ها آن را فرو ریختند و هنوز
    تنها با پای پیاده می‌توان به آن رسید.
  body: >-
    **دشمنان کمتر بر تموگوی چیره شدند؛ سرانجام این خودِ زمین بود که شهر را از پا درآورد.**


    دژ بر صخره‌ای در کرانهٔ چپ متکواری (کورا)، میان خرتویسی و واردزیا، ایستاده و راه کهنی را پاس می‌دارد
    که از فلات جاواختی به درون دره می‌آمد. وقایع‌نامه‌ها نخستین بار در سال ۹۱۴ از آن یاد می‌کنند، هنگامی
    که یوسف بن ابی‌الساج، سردار عرب، به پای دیوارهایش رسید و بی‌آنکه آن را بگشاید بازگشت. در آغاز سدهٔ
    یازدهم، باگرات سوم، پادشاهی که گرجستان را یکپارچه کرد، این دژ را به زندان شاهیِ شاهزادگان برکنارشدهٔ
    کلارجتی، سومبات و گورگن، بدل کرد.


    سپس زمین به جنبش درآمد. زمین‌لرزهٔ ۱۰۸۸ دژ را بر سر خداوندگارش، کاخابر، و همسرش فرو ریخت؛ زمین در
    ۱۲۸۳ و ۱۳۱۹ دوباره لرزید و هر بار تموگوی از نو ساخته شد. در ۱۱۹۱ ملکه تامار آن را به سرگیس مخارگردزلی
    بخشید و از دودمان او سرگیس تموگولی برآمد؛ نویسنده‌ای که سنت، برگردان منثور گرجی داستان عاشقانهٔ فارسی
    «ویس و رامین»، یعنی «ویسرامیانی»، را به او نسبت می‌دهد. خاندان شالیکاشویلی آخرین فرمانروایان گرجی
    آن بودند؛ عثمانیان در ۱۵۷۸ آن را گرفتند.


    امروز دیواری یکپارچه سه تپهٔ سنگی را به هم می‌پیوندد که بر فراز هر یک ویرانهٔ برج‌هایی نشسته است،
    و درون آن دو آب‌انبار هست. گذرگاه پنهانی را بجویید که در دل صخره تا رود کنده شده و در روزهای محاصره
    آب پادگان را تأمین می‌کرد. در آبکندی در غرب دیوارها، کلیسای صخره‌ای قدیس افرم پنهان است که دیوارهٔ
    محرابش از خودِ سنگ زنده تراشیده شده؛ ویرانه‌های نزدیک آن هنوز پاره‌هایی از نقاشی‌های دیواری سدهٔ سیزدهم
    را نگه داشته‌اند.


    ارمنیان اینجا را تمکابرد می‌نامند. روایت آنان از خداوندگاری می‌گوید که هیچ لشکری بر او چیره نمی‌شد،
    تا آنکه شاهی ایرانی همسرش را فریفت؛ زن شوهرش را زهر داد، سربازانش را مست کرد و دروازه‌ها را گشود.
    هوهانس تومانیان در ۱۹۰۲ از این داستان منظومه‌ای ساخت و الکساندر اسپندیاریان اپرای «آلماست» را.


    هنگام غروب بر تپهٔ غربی بایستید. شهری که زمین سه بار فرو افکندش، پراکنده در میان علف‌ها افتاده است
    و تنها صدا، صدای متکواری است در ژرفای دره.
  tip: >-
    دو ساعت وقت بگذارید. اینجا نه بلیتی هست، نه نگهبانی، نه نرده‌ای و نه مسیر نشانه‌گذاری‌شده‌ای: بالا
    رفتن از کنار رود ۳۰ تا ۴۵ دقیقه روی سنگ‌های لق و شیب تند طول می‌کشد و پرتگاه‌های بالا هیچ حفاظی ندارند.
    پوتین بپوشید، تنها نروید و برنامه‌تان را به کسی بگویید، چون آنتن تلفن در دره می‌آید و می‌رود. هیچ
    سایه‌ای نیست؛ برای هر نفر دو لیتر آب، کلاه و کرم ضدآفتاب بردارید. در بهار و پاییز در علف‌های بلند
    مراقب کنه و مار باشید. پس از آسپیندزا نه مغازه‌ای هست و نه سرویس بهداشتی؛ نزدیک‌ترین کافه‌ها در واردزیا
    هستند. در برف و یخبندان سراغش نروید.
  route: >-
    کوتاه‌ترین راه (حدود ۲۲۱ کیلومتر، ۴ ساعت و ۱۰ دقیقه) از فلات جاواختی می‌گذرد. از تفلیس جادهٔ Sh36
    را از راه تسکنتی تا مانگلیسی بگیرید، سپس Sh31 را از تسالکا به سوی نینوتسمیندا، و بعد S11 را از آخالکالاکی
    و سرازیر در تنگهٔ پاراوانی تا خرتویسی. از آنجا حدود ۱۲ کیلومتر در جادهٔ Sh58 به سوی واردزیا راه است.
    نزدیک روستای تموگوی، جایی که جاده از پای دژ می‌گذرد، خودرو را در انشعاب کوتاه شنی بگذارید و از پل
    عابر پیاده از متکواری بگذرید. راه بورجومی، آخالتسیخه و آسپیندزا حدود ۲۷۰ کیلومتر و ۴ ساعت و ۴۵ دقیقه
    است. در آخالکالاکی یا آسپیندزا باک را پر کنید. ارتفاع زیاد خودروی شاسی‌بلند از زمین روی جادهٔ شنی،
    به‌ویژه پس از باران، به کار می‌آید.
he:
  name: מבצר תמוגווי
  short: >-
    עיר-מבצר על צוק, הפרושה על פני שלוש גבעות סלעיות מעל המטקווארי; רעידות אדמה הפילו אותה, ועד היום מגיעים
    אליה רק ברגל.
  body: >-
    **אויבים כמעט לא הצליחו לגבור על תמוגווי; בסופו של דבר הייתה זו האדמה עצמה שהפילה את העיר.**


    המבצר אוחז בצוק על הגדה השמאלית של המטקווארי (נהר הקורה), בין חרטוויסי לוורדזיה, ושומר על הדרך העתיקה
    שירדה מרמת ג'ווחטי אל הערוץ. הכרוניקות מזכירות אותו לראשונה בשנת 914, כשהמצביא הערבי יוסף אבן אבי
    א-סאג' הגיע עד חומותיו והסתלק בלי לכבוש אותו. בראשית המאה ה-11 השתמש בו בגרט השלישי, המלך שאיחד את
    גאורגיה, ככלא מלכותי לנסיכי קלרג'טי המודחים, סומבט וגורגן.


    ואז זזה האדמה. רעידת האדמה של 1088 מוטטה את המבצר על אדונו, קחאבר, ועל אשתו; האדמה רעדה שוב ב-1283
    וב-1319, ובכל פעם נבנתה תמוגווי מחדש. ב-1191 העניקה אותה המלכה תמר לסרגיס מחרגרדזלי, ומשושלתו יצא
    סרגיס תמוגוולי, הסופר שהמסורת מייחסת לו את הנוסח הגאורגי בפרוזה של הרומן הפרסי "ויס ורמין" – ה"ויסרמיאני".
    בני משפחת שליקשווילי היו אדוניה הגאורגים האחרונים; העות'מאנים כבשו אותה ב-1578.


    כיום חומה אחת מקיפה שלוש גבעות סלעיות, שעל כל אחת מהן ניצבות חורבות מגדלים, ובתוך החומה שני בורות
    מים. חפשו את המעבר הסודי שנחצב בסלע ויורד אל הנהר: הוא סיפק לחיל המצב מים בימי מצור. בנקיק שממערב
    לחומות מסתתרת כנסיית אפרים הקדוש החצובה בסלע, ומחיצת המזבח שלה מגולפת בסלע החי עצמו; בחורבות הסמוכות
    שרדו קטעים של ציורי קיר מהמאה ה-13.


    הארמנים קוראים למקום תמקאברד. לפי המסורת שלהם, שלט כאן אדון ששום צבא לא יכול לו, עד ששאה פרסי פיתה
    את אשתו; היא הרעילה אותו, שיכרה את חייליו ופתחה את השערים. ב-1902 הפך הובהנס תומניאן את הסיפור לפואמה,
    ואלכסנדר ספנדיאריאן הפך אותו לאופרה "אלמאסט".


    עלו אל הגבעה המערבית בשעת בין השמשות. העיר שהאדמה הפילה שלוש פעמים מפוזרת בעשב, והקול היחיד הוא המטקווארי
    הרחק למטה.
  tip: >-
    הקדישו לביקור שעתיים. אין כאן כרטיס, שומר, מעקה או שביל מסומן: העלייה מהנהר נמשכת 30 עד 45 דקות במעלה
    תלול של אבנים מתפוררות, והמצוקים בפסגה אינם מגודרים. נעלו נעלי הרים, אל תלכו לבד וספרו למישהו על התוכנית
    שלכם, כי הקליטה הסלולרית בערוץ באה והולכת. אין כאן צל בכלל, לכן קחו שני ליטרים מים לאדם, כובע וקרם
    הגנה. באביב ובסתיו היזהרו מקרציות ומנחשים בעשב הגבוה. אחרי אספינדזה אין חנויות ואין שירותים; בתי הקפה
    הקרובים נמצאים בוורדזיה. אל תנסו לעלות בשלג או בקרח.
  route: >-
    הדרך הקצרה ביותר (כ-221 ק"מ, 4 שעות ו-10 דקות) חוצה את רמת ג'ווחטי. מטביליסי סעו בכביש Sh36 דרך צקנטי
    למנגליסי, משם בכביש Sh31 דרך צלקה לכיוון נינוצמינדה, ואחר כך בכביש S11 דרך אחלקלקי ובירידה בקניון
    פרוואני עד חרטוויסי. משם כ-12 ק"מ בכביש Sh58 לכיוון ורדזיה. ליד הכפר תמוגווי, במקום שבו הכביש עובר
    מתחת למבצר, השאירו את הרכב בפנייה הקצרה לדרך החצץ וחצו את המטקווארי בגשר להולכי רגל. המסלול דרך בורג'ומי,
    אחלציחה ואספינדזה ארוכה יותר: כ-270 ק"מ ו-4 שעות ו-45 דקות. תדלקו באחלקלקי או באספינדזה. מרווח הגחון
    של רכב פנאי-שטח עוזר על החצץ, במיוחד אחרי גשם.
ar:
  name: قلعة تموغفي
  short: >-
    مدينة-قلعة على جرف صخري تمتد فوق ثلاث تلال صخرية مطلّة على نهر متكفاري، أسقطتها الزلازل، ولا يُوصَل
    إليها حتى اليوم إلا سيرًا على الأقدام.
  body: >-
    **نادرًا ما تغلّب الأعداء على تموغفي؛ وفي النهاية كانت الأرض نفسها هي التي أسقطت المدينة.**


    تقوم القلعة على صخرة في الضفة اليسرى لنهر متكفاري (الكُرّ) بين خيرتفيسي وفاردزيا، حارسةً الطريق القديم
    النازل من هضبة جافاخيتي إلى الوادي. تذكرها السجلات أول مرة عام 914، حين بلغ القائد العربي يوسف بن
    أبي الساج أسوارها ثم انصرف دون أن يفتحها. وفي مطلع القرن الحادي عشر اتخذها باغرات الثالث، الملك الذي
    وحّد جورجيا، سجنًا ملكيًا لأميرَي كلارجيتي المخلوعَين سومبات وغورغين.


    ثم تحرّكت الأرض. أسقط زلزال عام 1088 القلعة على سيّدها كاخابر وزوجته؛ وعادت الأرض فاهتزّت عامَي 1283
    و1319، وفي كل مرة أُعيد بناء تموغفي. وفي عام 1191 منحتها الملكة تامار لسارغيس مخارغردزيلي، ومن سلالته
    خرج سارغيس تموغفيلي، الكاتب الذي تنسب إليه الرواية المتوارثة الصيغة النثرية الجورجية للقصة الغرامية
    الفارسية «ويس ورامين»، أي «فيسرامياني». وكان آل شاليكاشفيلي آخر أسيادها الجورجيين، ثم استولى عليها
    العثمانيون عام 1578.


    اليوم يطوّق سورٌ واحد ثلاث تلال صخرية، تعلو كلًّا منها أطلالُ أبراج، وفي داخله صهريجان. ابحث عن الممر
    السري المنحوت في الصخر نزولًا إلى النهر، الذي كان يمدّ الحامية بالماء في أثناء الحصار. وفي وادٍ ضيّق
    غربي الأسوار تختبئ كنيسة القديس أفرام المنحوتة في الصخر، وحاجز هيكلها منحوت في الصخر الحيّ نفسه؛ وتحتفظ
    الأطلال المجاورة بشذرات من رسوم جدارية تعود إلى القرن الثالث عشر.


    يسمّي الأرمن هذا المكان تمكابيرد. وتروي حكايتهم عن سيّد لم يقهره جيش، حتى أغوى شاهٌ فارسي زوجته؛ فسمّمته،
    وأسكرت جنوده، وفتحت الأبواب. وقد نظم هوفهانس تومانيان الحكاية قصيدةً عام 1902، وجعل منها ألكسندر سبندياريان
    أوبرا «ألماست».


    قف على التلة الغربية عند الغسق. المدينة التي أسقطتها الأرض ثلاث مرات متناثرة في العشب، ولا صوت إلا
    هدير متكفاري بعيدًا في الأسفل.
  tip: >-
    خصّص ساعتين. لا تذاكر هنا ولا حارس ولا درابزين ولا مسار مُعلَّم: يستغرق الصعود من النهر 30 إلى 45
    دقيقة على منحدر شديد من الحجارة المفككة، والحافّات في القمة بلا أي حماية. ارتدِ حذاءً جبليًا، ولا
    تذهب وحدك، وأخبر أحدًا بخطتك، فإشارة الهاتف تنقطع وتعود في الوادي. لا ظلّ على الإطلاق، فاحمل لترين
    من الماء لكل شخص وقبعة وواقيًا من الشمس. في الربيع والخريف احذر القراد والأفاعي في العشب الطويل. لا
    متاجر ولا دورات مياه بعد أسبيندزا؛ وأقرب المقاهي في فاردزيا. لا تحاول الصعود في الثلج أو الجليد.
  route: >-
    أقصر طريق (نحو 221 كم، 4 ساعات و10 دقائق) يعبر هضبة جافاخيتي. من تبليسي اسلك الطريق Sh36 عبر تسكنيتي
    إلى مانغليسي، ثم الطريق Sh31 عبر تسالكا باتجاه نينوتسميندا، ثم الطريق S11 عبر أخالكالاكي نزولًا في
    وادي بارافاني الضيق حتى خيرتفيسي. ومن هناك نحو 12 كم على طريق فاردزيا Sh58. قرب قرية تموغفي، حيث يمرّ
    الطريق أسفل القلعة، اترك السيارة عند المنعطف الحصوي القصير واعبر نهر متكفاري على جسر المشاة. أما الطريق
    عبر بورجومي وأخالتسيخي وأسبيندزا فيبلغ نحو 270 كم و4 ساعات و45 دقيقة. املأ خزان الوقود في أخالكالاكي
    أو أسبيندزا. يفيد الخلوص الأرضي المرتفع لسيارات الدفع الرباعي على الحصى، ولا سيما بعد المطر.
