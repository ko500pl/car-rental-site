ka:
  name: თმოგვის ციხე
  short: მტკვრის ხეობის ზემოთ, სამ კლდოვან კონცხზე გადაჭიმული ნანგრევი ციხე ხერთვისსა და ვარძიას შორის.
  body: >-
    **თმოგვი ხერთვისისა და ვარძიის შორის, მტკვრის ხეობის ყველაზე დრამატულ მონაკვეთზე დგას** — და, განსხვავებით
    ორივესგან, აქ მისვლა ფეხით უწევს.


    ციხე X საუკუნიდან იხსენიება. ის ხეობის საკვანძო სიმაგრე იყო და მასთან ერთად ქვემოთ, კლდის ძირში, ქალაქიც
    არსებობდა. 1088 წლის დიდმა მიწისძვრამ თმოგვი მძიმედ დააზიანა და ეს კატასტროფა ქართულ მატიანეებშია
    აღწერილი; ქალაქი ამის შემდეგ ვეღარ აღდგა, ხოლო მოპირდაპირე ნაპირზე მდებარე სოფელს დღემდე ნაქალაქევი
    ჰქვია — „ადგილი, სადაც ქალაქი იდგა“.


    გვარი თმოგველი ქართულ ლიტერატურაშიც ჩანს: სარგის თმოგველს, XII საუკუნის მოღვაწეს, ტრადიციულად „ვისრამიანის“
    ქართული ვერსია მიეწერება.


    ნანგრევები სამ ცალკეულ კლდოვან კონცხზეა გადაჭიმული და ერთმანეთს კედლებით უკავშირდება. კარგად ჩანს
    კოშკები, ცისტერნები და — ყველაზე საინტერესო — **დახურული სვლა, რომელიც კლდეში ჩამოდის მდინარემდე**:
    ალყის დროს ციხე წყალს სწორედ ასე იღებდა. ქართული კლდის სიმაგრეების ეს გადაწყვეტა თმოგვში მკაფიოდ იკითხება.


    ციხე ქვემოდან უფრო პატარა ჩანს, ვიდრე სინამდვილეშია: შემოზღუდული ტერიტორია რამდენიმე ასეულ მეტრზეა
    გადაჭიმული და მხოლოდ კონცხებს შორის გადასვლას ნახევარი საათი უნდა. მიწისძვრის შემდეგაც სიმაგრე გამოყენებაში
    დარჩა — ჯერ ჯაყელების, შემდეგ ოსმალური გარნიზონის ხელში, XVI საუკუნემდე და მის შემდეგაც.


    ადგილი სრულიად მოუწესრიგებელია: არც ბილიკია, არც მოაჯირი, არც ნიშანი, არც ბილეთი. ასვლა მტკვარზე გადებული
    ფეხით სავალი ხიდიდან იწყება და ოცდაათიდან ორმოცდახუთ წუთამდე გრძელდება ციცაბო, ქვიან ფერდობზე. ზემოთ
    ქარი თითქმის ყოველთვის ქრის.


    სამაგიეროდ ხედი ვარძიის ხეობაზე და მტკვრის მარყუჟზე ის არის, რისთვისაც აქ მოდიან — და მთელი დღის განმავლობაში
    შეიძლება ერთი ადამიანიც არ შეგხვდეს.
  tip: >-
    გამოყავი მინიმუმ ორი საათი — ასვლა, დათვალიერება და ჩამოსვლა. ეს არ არის ოჯახური გასეირნება: ფერდობი
    ციცაბოა, ქვა ფხვიერი, კიდეები დაუცველი. მარტო ნუ წახვალ და ვინმეს აცნობე, სად მიდიხარ. მობილურის კავშირი
    ადგილ-ადგილ ქრება. ზაფხულში ჩრდილი არ არსებობს — ორი ლიტრი წყალი, ქუდი და კრემი. გაზაფხულზე და შემოდგომაზე
    ბალახი მაღალია, ტკიპები და გველები რეალურია. ზამთარში ასვლა არ ღირს.
  route: >-
    თბილისიდან ბორჯომსა და ახალციხეზე გავლით ასპინძისა და ხერთვისის მიმართულებით, შემდეგ მტკვრის ხეობით
    ვარძიისკენ. თმოგვის ციხე ხერთვისიდან დაახლოებით ათ კილომეტრში, ხეობის მარჯვენა მხარეს ჩანს; ჩასახვევი
    ნაქალაქევის სოფლისკენ მოხრეშილია და მოკლე. სულ 256 კმ, დაახლოებით ოთხი საათი და ოცი წუთი. მანქანა
    ხიდთან ტოვე. კლირენსიანი ავტომობილი სასურველია, განსაკუთრებით წვიმის შემდეგ. საწვავი ახალციხესა და
    ასპინძაში.
en:
  name: Tmogvi Fortress
  short: A ruined fortress spread over three rocky spurs above the Mtkvari gorge, between Khertvisi and
    Vardzia.
  body: >-
    **Tmogvi stands on the most dramatic stretch of the Mtkvari gorge, between Khertvisi and Vardzia**
    — and unlike either of them, it has to be reached on foot.


    The fortress is first mentioned in the 10th century. It was the key stronghold of the gorge, and a
    town stood below it at the foot of the rock. The great earthquake of 1088 wrecked Tmogvi, a disaster
    recorded in the Georgian chronicles; the town never recovered, and the village on the opposite bank
    is still called Nakalakevi, the place where a town used to be.


    The name survives in Georgian literature too: Sargis Tmogveli, a 12th-century figure, is traditionally
    credited with the Georgian version of the romance Visramiani.


    The ruins run across three separate rocky spurs joined by curtain walls. Towers and cisterns are clearly
    readable, and so is the most interesting feature: **a covered passage cut down through the rock to
    the river**, which is how the garrison drew water under siege. This solution appears in several Georgian
    cliff fortresses, but rarely as legibly as here.


    The fortress is much larger than it looks from below: the walled area runs for several hundred metres,
    and simply walking between the three spurs takes half an hour. It also stayed in use long after the
    earthquake, held first by the Jaqeli princes and then by Ottoman garrisons well into the 16th century
    and beyond.


    The site is entirely unmanaged: no made path, no railings, no signs, no ticket. The climb starts from
    a footbridge over the Mtkvari and takes thirty to forty-five minutes up a steep, stony slope. The
    wind blows almost constantly at the top.


    What you get in return is the view down the valley towards Vardzia and along the loop of the Mtkvari,
    and a very good chance of not meeting another person all day.
  tip: >-
    Allow at least two hours for the climb, the site and the descent. This is not a family stroll: the
    slope is steep, the stone is loose and the drops are unguarded. Do not go alone, and tell somebody
    where you are heading. Mobile coverage disappears in places. In summer there is no shade at all, so
    carry two litres of water, a hat and sunscreen. In spring and autumn the grass is high and ticks and
    snakes are a real possibility. In winter the climb is not worth attempting.
  route: >-
    From Tbilisi drive via Borjomi and Akhaltsikhe towards Aspindza and Khertvisi, then follow the Mtkvari
    gorge towards Vardzia. Tmogvi appears about ten kilometres past Khertvisi, on the right-hand side
    of the gorge; the turn down towards Nakalakevi village is short and gravelled. The total is 256 km,
    roughly four hours twenty. Leave the car by the footbridge. A car with decent ground clearance is
    preferable, especially after rain. Fuel in Akhaltsikhe and Aspindza.
ru:
  name: Крепость Тмогви
  short: Разрушенная крепость на трёх скалистых мысах над ущельем Куры, между Хертвиси и Вардзией.
  body: >-
    **Тмогви стоит на самом драматичном участке ущелья Куры, между Хертвиси и Вардзией,** и, в отличие
    от обеих, добираться сюда приходится пешком.


    Крепость впервые упоминается в X веке. Она была ключевым укреплением ущелья, а внизу, у подножия скалы,
    стоял город. Сильное землетрясение 1088 года разрушило Тмогви — эта катастрофа описана в грузинских
    летописях; город больше не восстановился, а село на противоположном берегу до сих пор называется Накалакеви,
    «место, где был город».


    Имя сохранилось и в литературе: Саргису Тмогвели, деятелю XII века, традиционно приписывают грузинскую
    версию романа «Висрамиани».


    Руины растянуты по трём отдельным скалистым мысам, соединённым стенами. Хорошо читаются башни и цистерны,
    а самое интересное — **крытый ход, прорубленный в скале вниз к реке**: именно так гарнизон брал воду
    во время осады. Это решение встречается в нескольких грузинских скальных крепостях, но редко так наглядно,
    как здесь.


    Крепость гораздо больше, чем кажется снизу: обнесённая стенами территория тянется на несколько сотен
    метров, и только переход между тремя мысами занимает полчаса. Она оставалась в деле и после землетрясения
    — сначала у князей Джакели, затем у османских гарнизонов, вплоть до XVI века и позже.


    Место совершенно необустроено: ни тропы, ни перил, ни указателей, ни билета. Подъём начинается от
    пешеходного моста через Куру и занимает тридцать-сорок пять минут по крутому каменистому склону. Наверху
    почти всегда дует ветер.


    Взамен — вид вниз по долине в сторону Вардзии и на излучину Куры, и очень высокая вероятность не встретить
    за весь день ни одного человека.
  tip: >-
    Заложите минимум два часа на подъём, осмотр и спуск. Это не семейная прогулка: склон крутой, камень
    осыпается, обрывы ничем не огорожены. Не ходите в одиночку и предупредите кого-нибудь, куда вы идёте.
    Мобильная связь местами пропадает. Летом тени нет вовсе — два литра воды, головной убор и крем. Весной
    и осенью трава высокая, клещи и змеи вполне реальны. Зимой подниматься не стоит.
  route: >-
    Из Тбилиси через Боржоми и Ахалцихе в сторону Аспиндзы и Хертвиси, затем вдоль ущелья Куры к Вардзии.
    Тмогви появляется примерно через десять километров после Хертвиси, на правой стороне ущелья; поворот
    вниз к селу Накалакеви короткий и гравийный. Всего 256 км, около четырёх часов двадцати минут. Машину
    оставьте у пешеходного моста. Желателен автомобиль с нормальным клиренсом, особенно после дождя. Заправки
    в Ахалцихе и Аспиндзе.
fa:
  name: قلعهٔ تموگوی
  short: قلعه‌ای ویران گسترده بر سه زبانهٔ صخره‌ای بالای درهٔ متکواری، میان خرتویسی و واردزیا.
  body: >-
    **تموگوی بر دراماتیک‌ترین بخش درهٔ متکواری میان خرتویسی و واردزیا ایستاده است،** و برخلاف هر دوی آنها
    باید پیاده به آن رسید.


    نخستین یاد از این قلعه به سدهٔ دهم بازمی‌گردد. دژ کلیدی دره بود و در پای صخره شهری برپا بود. زلزلهٔ
    بزرگ سال ۱۰۸۸ تموگوی را ویران کرد و این فاجعه در تواریخ گرجی ثبت شده است؛ شهر دیگر برنخاست و روستای
    آن‌سوی رود هنوز ناکالاکوی نام دارد، یعنی جایی که شهری بوده است.


    این نام در ادبیات گرجی نیز مانده است: سرگیس تموگولی، از چهره‌های سدهٔ دوازدهم، به‌طور سنتی برگردان
    گرجی داستان ویسرامیانی به او نسبت داده می‌شود.


    ویرانه‌ها بر سه زبانهٔ صخره‌ای جدا کشیده شده‌اند و با دیوارها به هم پیوسته‌اند. برج‌ها و آب‌انبارها
    به‌روشنی خوانده می‌شوند، و جالب‌تر از همه **دالانی سرپوشیده که در دل سنگ تا رود پایین می‌رود**: پادگان
    در محاصره آب را چنین برمی‌داشت. این راه‌حل در چند قلعهٔ صخره‌ای گرجستان دیده می‌شود، اما کمتر جایی
    به این خوانایی.


    قلعه بسیار بزرگ‌تر از آن است که از پایین می‌نماید: محوطهٔ حصاردار چند صد متر کشیده شده و تنها رفتن
    میان سه زبانه نیم ساعت وقت می‌برد. پس از زلزله نیز مدت‌ها در کار ماند؛ نخست در دست شاهزادگان جاقلی
    و سپس پادگان‌های عثمانی، تا سدهٔ شانزدهم و پس از آن.


    محوطه هیچ سامانی ندارد: نه مسیر ساخته‌شده، نه نرده، نه تابلو، نه بلیت. صعود از پلی پیاده بر متکواری
    آغاز می‌شود و سی تا چهل‌وپنج دقیقه روی دامنه‌ای تند و سنگی طول می‌کشد. بالا تقریباً همیشه باد می‌وزد.


    در عوض چشم‌انداز پایین‌دست دره به سوی واردزیا و بر خم متکواری را دارید، و احتمال بسیار بالای اینکه
    تمام روز به کسی برنخورید.
  tip: >-
    دست‌کم دو ساعت برای صعود و بازدید و فرود در نظر بگیرید. این گردش خانوادگی نیست: دامنه تند است، سنگ
    سست، و پرتگاه‌ها بی‌حفاظ. تنها نروید و به کسی بگویید کجا می‌روید. آنتن موبایل جاهایی قطع می‌شود. تابستان
    هیچ سایه‌ای نیست، پس دو لیتر آب و کلاه و کرم ضدآفتاب ببرید. بهار و پاییز علف بلند است و کنه و مار
    جدی‌اند. زمستان صعود ارزش تلاش ندارد.
  route: >-
    از تفلیس از راه بورجومی و آخالتسیخه به سوی آسپیندزا و خرتویسی برانید و سپس درهٔ متکواری را به سوی
    واردزیا دنبال کنید. تموگوی حدود ده کیلومتر پس از خرتویسی و در سمت راست دره پدیدار می‌شود؛ انحراف به
    سوی روستای ناکالاکوی کوتاه و شنی است. مجموع ۲۵۶ کیلومتر و حدود چهار ساعت و بیست دقیقه. خودرو را کنار
    پل پیاده بگذارید. خودرویی با ارتفاع کف مناسب بهتر است، به‌ویژه پس از باران. سوخت در آخالتسیخه و آسپیندزا.
he:
  name: מבצר תמוגווי
  short: מבצר חרב הפרוש על שלוש לשונות סלע מעל ערוץ המטקוורי, בין חרתוויסי לוורדזיה.
  body: >-
    **תמוגווי עומד בקטע הדרמטי ביותר של ערוץ המטקוורי, בין חרתוויסי לוורדזיה,** ובניגוד לשניהם מגיעים
    אליו רק ברגל.


    המבצר נזכר לראשונה במאה ה-10. הוא היה המעוז המרכזי של הערוץ, ולמרגלות הסלע עמדה עיר. רעידת האדמה הגדולה
    של 1088 החריבה את תמוגווי, אסון שנרשם בכרוניקות הגאורגיות; העיר לא קמה עוד, והכפר שמעבר לנהר נקרא
    עד היום נקאלקווי, המקום שבו הייתה עיר.


    השם שרד גם בספרות: לסרגיס תמוגוולי, דמות מן המאה ה-12, מיוחסת במסורת הגרסה הגאורגית של הרומן ויסראמיאני.


    החורבות פרושות על שלוש לשונות סלע נפרדות המחוברות בחומות. המגדלים ובורות המים ניתנים לקריאה בבירור,
    וכך גם המרכיב המעניין מכולם: **מעבר מקורה החצוב בסלע ויורד אל הנהר**, שדרכו שאב חיל המצב מים בעת מצור.
    הפתרון הזה מופיע בכמה מבצרי צוק בגאורגיה, אך רק לעיתים נדירות בבהירות כזאת.


    המבצר גדול בהרבה ממה שהוא נראה מלמטה: השטח המוקף חומה משתרע על כמה מאות מטרים, ורק המעבר בין שלוש
    לשונות הסלע אורך חצי שעה. הוא גם נשאר בשימוש זמן רב אחרי רעידת האדמה, תחילה בידי נסיכי ג'קלי ואחר
    כך בידי חילות מצב עות'מאניים עד המאה ה-16 ואף לאחריה.


    האתר אינו מתוחזק כלל: אין שביל סלול, אין מעקות, אין שילוט ואין כרטיס. הטיפוס מתחיל מגשר להולכי רגל
    מעל המטקוורי ואורך שלושים עד ארבעים וחמש דקות במעלה מדרון תלול ואבני. למעלה נושבת רוח כמעט תמיד.


    בתמורה מקבלים את הנוף במורד העמק לעבר ורדזיה ואל פיתול המטקוורי, וסיכוי גבוה מאוד לא לפגוש איש כל
    היום.
  tip: >-
    הקצו לפחות שעתיים לטיפוס, לביקור ולירידה. זו אינה טיילת משפחתית: המדרון תלול, האבן מתפוררת, והמצוקים
    אינם מגודרים. אל תלכו לבד, ועדכנו מישהו לאן אתם הולכים. הקליטה הסלולרית נעלמת במקומות מסוימים. בקיץ
    אין צל כלל, אז קחו שני ליטרים מים, כובע וקרם הגנה. באביב ובסתיו העשב גבוה, וקרציות ונחשים אפשריים
    לגמרי. בחורף לא כדאי לטפס.
  route: >-
    מטביליסי דרך בורג'ומי ואחלציחה לכיוון אספינדזה וחרתוויסי, ואז לאורך ערוץ המטקוורי אל ורדזיה. תמוגווי
    מופיע כעשרה קילומטרים אחרי חרתוויסי, בצד ימין של הערוץ; הפנייה למטה לכפר נקאלקווי קצרה ומחצץ. בסך
    הכול 256 ק״מ, כארבע שעות ועשרים דקות. השאירו את הרכב ליד גשר הולכי הרגל. עדיף רכב עם מרווח גחון סביר,
    בייחוד אחרי גשם. דלק באחלציחה ובאספינדזה.
ar:
  name: قلعة تموغفي
  short: قلعة خربة ممتدة على ثلاثة نتوءات صخرية فوق وادي متكفاري، بين خيرتفيسي وفاردزيا.
  body: >-
    **تقوم تموغفي على أشد مقاطع وادي متكفاري إثارة، بين خيرتفيسي وفاردزيا،** وبخلافهما لا يُوصل إليها
    إلا سيراً.


    ذُكرت القلعة أول مرة في القرن العاشر. كانت معقل الوادي الأول، وعند سفح الصخرة قامت مدينة. ثم دمر زلزال
    عام 1088 الكبير تموغفي، وهي كارثة سجلتها الحوليات الجورجية؛ ولم تنهض المدينة بعدها، والقرية على الضفة
    المقابلة ما زالت تُسمى ناكالاكيفي، أي المكان الذي كانت فيه مدينة.


    وبقي الاسم في الأدب الجورجي أيضاً: فسرغيس تموغفيلي، وهو من رجال القرن الثاني عشر، تنسب إليه الرواية
    التقليدية النسخة الجورجية من قصة فيسرامياني.


    تمتد الأطلال على ثلاثة نتوءات صخرية منفصلة تربطها الأسوار. وتُقرأ الأبراج والصهاريج بوضوح، وكذلك أطرف
    عناصرها: **ممر مسقوف محفور في الصخر ينزل إلى النهر**، وبه كانت الحامية تسحب الماء أثناء الحصار. ويظهر
    هذا الحل في عدة قلاع صخرية جورجية، لكن نادراً بهذا الوضوح.


    والقلعة أكبر كثيراً مما تبدو من الأسفل: تمتد المساحة المسوّرة مئات الأمتار، ومجرد الانتقال بين النتوءات
    الثلاثة يستغرق نصف ساعة. كما بقيت في الخدمة طويلاً بعد الزلزال، في يد أمراء جاقلي أولاً ثم حاميات
    عثمانية حتى القرن السادس عشر وما بعده.


    والموقع غير مُدار البتة: لا درب ممهد ولا درابزين ولا لافتات ولا تذكرة. يبدأ الصعود من جسر للمشاة فوق
    متكفاري ويستغرق ثلاثين إلى خمس وأربعين دقيقة على منحدر حاد حجري. والريح في الأعلى تكاد لا تهدأ.


    وفي المقابل تحصل على المنظر نزولاً في الوادي نحو فاردزيا وعلى انحناءة متكفاري، وعلى فرصة كبيرة ألا
    تلقى أحداً طوال اليوم.
  tip: >-
    خصص ساعتين على الأقل للصعود والزيارة والنزول. ليست هذه نزهة عائلية: المنحدر حاد، والحجارة مفككة، والهاوية
    بلا سياج. لا تذهب وحدك، وأخبر أحداً إلى أين تتجه. وتغيب تغطية الهاتف في مواضع. وفي الصيف لا ظل مطلقاً،
    فاحمل لترين من الماء وقبعة وواقياً شمسياً. وفي الربيع والخريف يعلو العشب ويحتمل القراد والأفاعي بجدية.
    أما في الشتاء فالصعود لا يستحق المحاولة.
  route: >-
    من تبليسي عبر بورجومي وأخالتسيخه باتجاه أسبيندزا وخيرتفيسي، ثم بمحاذاة وادي متكفاري نحو فاردزيا. تظهر
    تموغفي بعد نحو عشرة كيلومترات من خيرتفيسي على الجانب الأيمن من الوادي؛ والمنعطف نزولاً إلى قرية ناكالاكيفي
    قصير وحصوي. المجموع 256 كم ونحو أربع ساعات وعشرين دقيقة. اترك السيارة عند جسر المشاة. ويفضل مركبة
    بارتفاع هيكل معقول، خصوصاً بعد المطر. الوقود في أخالتسيخه وأسبيندزا.
rating: 4.0
