ka:
  name: ჯორწყუს მღვიმის ბუნების ძეგლი
  short: >-
    ველური, ორსართულიანი კარსტული მღვიმე მარტვილთან, ჯორწყუს ხეობაში, სადაც თიხაში მღვიმის დათვის ძვლები
    იპოვეს; მასთან მხოლოდ ფეხით მიხვალთ.
  body: >-
    **სამეგრელოს ამ მღვიმის თიხაში მღვიმის დათვის, ფოცხვერისა და დომბის ძვლები ეწყო — და იმ ადამიანების
    კვალიც, ვინც ოდესღაც აქ აფარებდა თავს.**


    ჯორწყუს მღვიმე მარტვილის მუნიციპალიტეტშია, ასხის კირქვულ მასივზე, ზღვის დონიდან 653 მეტრზე, მდინარე
    ჯორწყუს ხეობაში, რომელიც აბაშას მარცხნიდან ერთვის. მღვიმე წყალს ზედაცარცულ, თხელშრეებრივ კირქვაში
    გამოუმუშავებია. შესასვლელი ხევის კლდოვან ფერდზე, ნაკადიდან დაახლოებით 35 მეტრის სიმაღლეზე იხსნება:
    4–5 მეტრი სიგანისაა, 2–3 მეტრი სიმაღლისა და სამხრეთ-დასავლეთს გაჰყურებს. წინ მიმოფანტული ლოდები დიდი
    ხნის წინ ჩამონგრეული ჭერის ნარჩენია.


    შიგნით მღვიმე 276 მეტრზე, ორ სართულად ვრცელდება. ფართო შესასვლელი დარბაზი მეანდრულ დერეფნად ვიწროვდება,
    რომლის სიმაღლე 3–5 მეტრია; შესასვლელიდან 45–50 მეტრზე ის გუმბათოვან დარბაზად იშლება — ჭერი 8–10 მეტრზე
    ადის და ვეებერთელა სტალაქტიტები ჰკიდია. ფსკერს წებოვანი, მოყვითალო-მოყავისფრო თიხა ფარავს, ოთხ მეტრამდე
    სისქისა, რომელიც თავად მღვიმის წყალს დაულექავს. თიხაში ნაკადი მიედინება, მეორეს უერთდება და მთიდან
    ჯორწყუს ნაპირზე წყაროდ გამოდის. ბოლოს, მოზრდილი დარბაზის კედელზე, მეორე სართულის 30-მეტრიანი გალერეა
    იხსნება. ჰაერი შესასვლელთან 18 °C-ია, სიღრმეში კი 11,5 °C-მდე გრილდება.


    ძვლები თიხის ქვედა ფენებში აღმოაჩინეს და ჯერ კიდევ 1958 წელს ქუთაისის პედაგოგიური ინსტიტუტის შრომებში
    აღწერეს. 2013 წლიდან მღვიმე ბუნების ძეგლია და მას დაცული ტერიტორიების სააგენტო მართავს.


    ეს ველური მღვიმეა და არა კეთილმოწყობილი: არც განათებაა, არც მოაჯირი, არც ბილიკი. რასაც თქვენი ფანარი
    იპოვის, იმას ნახავთ.
  tip: >-
    მღვიმესთან არც თანამშრომელია, არც განათება, არც რაიმე ინფრასტრუქტურა. წასვლამდე დაუკავშირდით დაცული
    ტერიტორიების სააგენტოს (apa.gov.ge) და იკითხეთ, სჭირდება თუ არა ვიზიტს რეინჯერი ან გიდი და არის თუ
    არა გადასახდელი — ფასი არსად არის გამოქვეყნებული. მარტო არასოდეს შეხვიდეთ. თითოეულს ორი სანათი გქონდეთ,
    შეძლებისდაგვარად ჩაფხუტიც და თბილი ფენა: შიგნით დაახლოებით 11,5 °C-ია. თიხიანი ფსკერი ღრმა და მოლიპულია
    — ჩაიცვით ფეხსაცმელი, რომლის გაფუჭებაც არ გენანებათ, და სტალაქტიტებს ხელი არ ახლოთ. ნაკადიან მღვიმეში
    ძლიერი წვიმის შემდეგ შესვლა არ ღირს. ბალდის კანიონი 2,4 კმ-შია; წყალი და საჭმელი მარტვილში იყიდეთ.
    წადით მაისიდან ოქტომბრამდე: წვიმიან თვეებში ბილიკი ტალახიანია, ნაკადი კი ადიდებული.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ ადგილობრივი
    გზებით აბაშის გავლით მარტვილამდე და იქიდან ჩრდილოეთით, ბალდის სოფლებისკენ. მეორე ბალდამდე, სადაც ბილიკი
    იწყება, დაახლოებით 290 კმ და ოთხნახევარი საათია. ასფალტი მარტვილის მიდამოებში მთავრდება, შემდეგ ვიწრო,
    ხრეშიანი და ნაკვალევებით დაღარული სოფლის გზაა. მაღალი გამავლობის მანქანა გონივრული არჩევანია, წვიმის
    შემდეგ კი ოთხივე წამყვანი თვლის გარეშე გაგიჭირდებათ. დაცული ტერიტორიების სააგენტოს მონაცემებით, მეორე
    ბალდიდან მღვიმემდე მარკირებული საფეხმავლო ბილიკით 5,5 კმ-ია, ცალ მხარეს დაახლოებით საათნახევრის სავალი.
    ბოლო ბენზინგასამართი და მაღაზიები მარტვილშია.
en:
  name: Jortsku Cave Natural Monument
  short: >-
    A wild two-storey karst cave above the Jortsku stream near Martvili, reached on foot, where cave-bear
    bones lay buried in the clay.
  body: >-
    **Deep in the clay of this Samegrelo cave lay the bones of cave bears, lynx and bison, and the traces
    of people who once sheltered here.**


    Jortsku is a karst cave in Martvili Municipality, worked by water into thin-bedded Upper Cretaceous
    limestone of the Askhi massif, 653 metres above sea level in the gorge of the Jortsku, a left tributary
    of the Abasha. The entrance opens in a rocky slope some 35 metres above the stream: four to five metres
    wide, two to three high, facing south-west. The boulders strewn in front are what is left of a roof
    that fell in long ago.


    Inside, the cave runs for 276 metres on two levels. A broad entrance hall narrows into a meandering
    corridor three to five metres high; about 45 to 50 metres in, it swells into a domed chamber eight
    to ten metres tall, hung with huge stalactites. The floor is a sticky, yellow-brown clay up to four
    metres thick, laid down by the cave's own water. A stream runs through it, meets a second, and leaves
    the hill as a spring on the bank of the Jortsku. At the far end, a 30-metre upper gallery opens off
    the wall of a large hall. The air cools from 18°C at the mouth to about 11.5°C in the depths.


    The bones turned up in the lower layers of the clay and were described as early as 1958 in the proceedings
    of the Kutaisi Pedagogical Institute. Since 2013 the cave has been a protected natural monument, managed
    by the Agency of Protected Areas.


    This is a wild cave, not a show cave: no lights, no handrails, no walkway. What you see is whatever
    your torch finds.
  tip: >-
    There are no staff, lights or facilities at the cave. Contact the Agency of Protected Areas (apa.gov.ge)
    before you go: ask whether a ranger or guide is required and whether a fee applies, since none is
    published. Never go in alone. Carry two light sources each, a helmet if you have one and a warm layer,
    because it is about 11.5°C inside. The clay floor is deep and slick, so wear boots you don't mind
    ruining, and leave the stalactites untouched. A cave with a stream running through it is no place
    to be after heavy rain. Balda Canyon is 2.4 km away; buy water and food in Martvili. Go between May
    and October: in the wet months the footpath turns to mud and the stream runs high.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, then local roads through Abasha to
    Martvili and north to the Balda villages: about 290 km and four and a half hours to the trailhead
    at Second Balda (Meore Balda). The asphalt ends around Martvili, and the village road beyond is narrow,
    gravelled and rutted. An SUV is the sensible choice, and after rain you will want 4x4. From Second
    Balda the Agency of Protected Areas gives the cave as 5.5 km away along a marked footpath, about an
    hour and a half each way. The last fuel and shops are in Martvili.
ru:
  name: Памятник природы — пещера Джорцку
  short: >-
    Дикая двухъярусная карстовая пещера над ручьём Джорцку близ Мартвили, куда добираются пешком; в её
    глине лежали кости пещерных медведей.
  body: >-
    **Глубоко в глине этой мегрельской пещеры лежали кости пещерных медведей, рысей и зубров — и следы
    людей, когда-то укрывавшихся здесь.**


    Джорцку — карстовая пещера в Мартвильском муниципалитете, выработанная водой в тонкослоистых верхнемеловых
    известняках массива Асхи, на высоте 653 метра над морем, в ущелье Джорцку — левого притока Абаши.
    Вход открывается в скалистом склоне примерно в 35 метрах над ручьём: четыре-пять метров в ширину,
    два-три в высоту, обращён на юго-запад. Глыбы, разбросанные перед ним, — всё, что осталось от давно
    обрушившегося свода.


    Внутри пещера тянется на 276 метров в два яруса. Широкий входной зал сужается в меандрирующий коридор
    высотой три-пять метров; метрах в 45–50 от входа он расширяется в купольный зал высотой восемь-десять
    метров, увешанный огромными сталактитами. Пол покрывает вязкая жёлто-бурая глина толщиной до четырёх
    метров, отложенная водами самой пещеры. Сквозь неё течёт ручей, встречается со вторым и выходит из
    горы родником на берегу Джорцку. В дальнем конце, в стене большого зала, открывается 30-метровая верхняя
    галерея. Воздух остывает от 18 °C у входа до примерно 11,5 °C в глубине.


    Кости нашли в нижних слоях глины и описали ещё в 1958 году в трудах Кутаисского педагогического института.
    С 2013 года пещера — охраняемый памятник природы под управлением Агентства охраняемых территорий.


    Это дикая пещера, а не туристическая: ни освещения, ни перил, ни мостков. Вы увидите ровно то, что
    выхватит ваш фонарь.
  tip: >-
    У пещеры нет ни персонала, ни освещения, ни удобств. Перед поездкой свяжитесь с Агентством охраняемых
    территорий (apa.gov.ge): спросите, нужен ли рейнджер или гид и берётся ли плата — она нигде не опубликована.
    Никогда не заходите внутрь в одиночку. У каждого должно быть по два источника света, по возможности
    каска и тёплый слой одежды: внутри около 11,5 °C. Глиняный пол глубокий и скользкий, так что обуйтесь
    в ботинки, которые не жалко, и не трогайте сталактиты. Пещера, через которую течёт ручей, — не место
    для визита после сильного дождя. До каньона Балда 2,4 км; воду и еду покупайте в Мартвили. Лучшее
    время — с мая по октябрь: в сырые месяцы тропа раскисает, а ручей поднимается.
  route: >-
    Из Тбилиси поезжайте по S1 (E60) на запад мимо Кутаиси до Самтредиа, затем по местным дорогам через
    Абашу до Мартвили и на север к сёлам Балда: около 290 км и четыре с половиной часа до начала тропы
    во Второй Балде (Меоре-Балда). Асфальт заканчивается в районе Мартвили, дальше сельская дорога — узкая,
    гравийная, в колеях. Разумный выбор — кроссовер или внедорожник, а после дождя вам понадобится полный
    привод. От Второй Балды, по данным Агентства охраняемых территорий, до пещеры 5,5 км по маркированной
    пешеходной тропе — около полутора часов в одну сторону. Последние заправки и магазины — в Мартвили.
fa:
  name: اثر طبیعی غار جورتسکو
  short: >-
    غاری کارستی و بکر در دو طبقه، بالای نهر جورتسکو نزدیک مارتویلی، که باید پیاده به آن رسید؛ در خاک رسش
    استخوان‌های خرس غار مدفون بود.
  body: >-
    **در ژرفای خاک رس این غار در سامگرلو، استخوان‌های خرس غار، سیاه‌گوش و بیسون خفته بود — و نشانه‌هایی
    از مردمانی که روزگاری اینجا پناه می‌گرفتند.**


    جورتسکو غاری کارستی در شهرستان مارتویلی است که آب آن را در سنگ‌آهک نازک‌لایهٔ کرتاسهٔ بالایی در تودهٔ
    آسخی کنده است؛ در ارتفاع ۶۵۳ متری از سطح دریا، در درهٔ جورتسکو که شاخه‌ای از سمت چپِ رود آباشاست.
    دهانهٔ غار در دامنه‌ای صخره‌ای، حدود ۳۵ متر بالاتر از نهر، باز می‌شود: چهار تا پنج متر پهنا، دو تا
    سه متر بلندی، رو به جنوب غربی. تخته‌سنگ‌های پراکنده در برابرش باقی‌ماندهٔ سقفی‌اند که دیرزمانی پیش
    فرو ریخته است.


    درون غار، راهرو در دو طبقه ۲۷۶ متر امتداد دارد. تالار پهن ورودی به راهرویی پرپیچ‌وخم با بلندی سه تا
    پنج متر تنگ می‌شود؛ حدود ۴۵ تا ۵۰ متر درون‌تر، این راهرو به تالاری گنبدی به بلندی هشت تا ده متر گشوده
    می‌شود که استالاکتیت‌های عظیم از سقفش آویخته‌اند. کف غار را خاک رسی چسبناک و زرد مایل به قهوه‌ای به
    ضخامت تا چهار متر پوشانده که آب خود غار آن را بر جا نهاده است. نهری از میان آن می‌گذرد، به نهر دیگری
    می‌پیوندد و به صورت چشمه‌ای در کرانهٔ جورتسکو از دل کوه بیرون می‌آید. در انتهای غار، بر دیوارهٔ تالاری
    بزرگ، راهروی بالاییِ ۳۰ متری باز می‌شود. هوا از ۱۸ درجهٔ سانتی‌گراد در دهانه به حدود ۱۱٫۵ درجه در
    ژرفا سرد می‌شود.


    استخوان‌ها در لایه‌های زیرین خاک رس پیدا شدند و از همان ۱۹۵۸ در مجموعه‌مقالات دانشسرای عالی کوتایسی
    شرح داده شدند. از ۲۰۱۳ غار اثر طبیعی حفاظت‌شده است و آژانس مناطق حفاظت‌شده آن را اداره می‌کند.


    این غاری بکر است، نه غاری آراسته برای گردشگران: نه چراغی، نه نرده‌ای، نه گذرگاهی. آنچه می‌بینید همان
    است که چراغ‌قوه‌تان پیدا کند.
  tip: >-
    در غار نه کارکنی هست، نه روشنایی، نه امکاناتی. پیش از رفتن با آژانس مناطق حفاظت‌شده (apa.gov.ge) تماس
    بگیرید: بپرسید آیا همراهی محیط‌بان یا راهنما لازم است و آیا ورودیه‌ای دارد، چون چیزی اعلام نشده است.
    هرگز تنها وارد نشوید. هر نفر دو منبع نور همراه داشته باشد، اگر دارید کلاه ایمنی، و یک لایه لباس گرم،
    چون درون غار حدود ۱۱٫۵ درجه است. کف رسی عمیق و لغزنده است، پس پوتینی بپوشید که خراب شدنش برایتان مهم
    نیست، و به استالاکتیت‌ها دست نزنید. غاری که نهری از آن می‌گذرد پس از باران سنگین جای رفتن نیست. تنگهٔ
    بالدا ۲٫۴ کیلومتر دورتر است؛ آب و خوراک را در مارتویلی بخرید. بین ماه مه و اکتبر بروید؛ در ماه‌های
    بارانی مسیر پیاده گل‌آلود می‌شود و آب نهر بالا می‌آید.
  route: >-
    از تفلیس با S1 (E60) رو به غرب، از کنار کوتایسی تا سامتردیا بروید، سپس از جاده‌های محلی و از آباشا
    تا مارتویلی و از آنجا رو به شمال به سوی روستاهای بالدا: حدود ۲۹۰ کیلومتر و چهار ساعت و نیم تا سرِ
    مسیر پیاده در بالدای دوم (مئوره بالدا). آسفالت در حوالی مارتویلی تمام می‌شود و جادهٔ روستایی پس از
    آن باریک، شنی و پر از شیار است. خودروی شاسی‌بلند انتخاب معقولی است و پس از باران به چهارچرخ‌محرک نیاز
    خواهید داشت. به گفتهٔ آژانس مناطق حفاظت‌شده، غار از بالدای دوم ۵٫۵ کیلومتر از راه یک مسیر پیادهٔ نشانه‌گذاری‌شده
    فاصله دارد، حدود یک ساعت و نیم در هر سو. آخرین جایگاه سوخت و فروشگاه‌ها در مارتویلی است.
he:
  name: אתר הטבע מערת ג'ורצקו
  short: >-
    מערה קרסטית פראית בת שתי קומות מעל נחל ג'ורצקו ליד מרטווילי, שמגיעים אליה ברגל — ובחרסית שלה היו קבורות
    עצמות של דובי מערות.
  body: >-
    **עמוק בחרסית של מערה זו בסמגרלו היו טמונות עצמות של דובי מערות, שונרים וביזונים — ועקבות של בני אדם
    שמצאו בה פעם מחסה.**


    ג'ורצקו היא מערה קרסטית במוניציפליות מרטווילי, שהמים חצבו באבן גיר דקת-שכבות מתקופת הקרטיקון העליון
    במסיף אסחי, בגובה 653 מטר מעל פני הים, בערוץ הג'ורצקו, יובל שמאלי של נהר האבשה. הפתח נפער במדרון סלעי
    כ-35 מטר מעל הנחל: רוחבו ארבעה עד חמישה מטרים, גובהו שניים עד שלושה, והוא פונה לדרום-מערב. הסלעים
    הפזורים לפניו הם כל מה שנותר מתקרה שקרסה לפני זמן רב.


    בפנים המערה נמשכת לאורך 276 מטר בשני מפלסים. אולם כניסה רחב מצטמצם למסדרון מתפתל בגובה שלושה עד חמישה
    מטרים; כ-45 עד 50 מטר פנימה הוא מתרחב לאולם כיפתי בגובה שמונה עד עשרה מטרים, שמתקרתו משתלשלים נטיפים
    ענקיים. את הרצפה מכסה חרסית דביקה בצבע צהוב-חום, בעובי של עד ארבעה מטרים, שהשקיעו מימי המערה עצמה.
    נחל זורם דרכה, פוגש נחל שני ויוצא מן ההר כמעיין על גדת הג'ורצקו. בקצה הרחוק, בקירו של אולם גדול, נפתחת
    גלריה עליונה באורך 30 מטר. האוויר מתקרר מ-18°C בפתח לכ-11.5°C במעמקים.


    העצמות נמצאו בשכבות התחתונות של החרסית ותוארו כבר ב-1958 בכתבי המכון הפדגוגי של קוטאיסי. מאז 2013
    המערה היא אתר טבע מוגן, המנוהל בידי הסוכנות לשטחים מוגנים.


    זו מערה פראית, לא מערת תיירות: אין תאורה, אין מעקות, אין שבילי הליכה. מה שתראו הוא מה שהפנס שלכם ימצא.
  tip: >-
    במערה אין צוות, תאורה או מתקנים. לפני היציאה פנו לסוכנות לשטחים מוגנים (apa.gov.ge): שאלו אם נדרש
    פקח או מדריך והאם יש דמי כניסה, כי לא פורסם תעריף. לעולם אל תיכנסו לבד. קחו שני מקורות אור לכל אחד,
    קסדה אם יש לכם ושכבה חמה, כי בפנים כ-11.5°C. רצפת החרסית עמוקה וחלקלקה, לכן נעלו נעליים שלא אכפת לכם
    להרוס, ואל תגעו בנטיפים. מערה שנחל זורם בתוכה אינה מקום להיות בו אחרי גשם כבד. קניון בלדה נמצא במרחק
    2.4 ק"מ; קנו מים ואוכל במרטווילי. הגיעו בין מאי לאוקטובר: בחודשים הגשומים השביל בוצי והנחל גואה.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, על פני קוטאיסי, עד סמטרדיה, ומשם בדרכים מקומיות דרך אבשה למרטווילי
    וצפונה אל כפרי בלדה: כ-290 ק"מ וארבע וחצי שעות עד תחילת השביל בבלדה השנייה (מאורה בלדה). האספלט נגמר
    באזור מרטווילי, ודרך הכפר שאחריו צרה, מכוסה חצץ ומלאה תלמים. רכב שטח הוא הבחירה הנבונה, ואחרי גשם
    תרצו הנעה כפולה. מבלדה השנייה, לפי הסוכנות לשטחים מוגנים, המערה נמצאת 5.5 ק"מ בשביל הליכה מסומן, כשעה
    וחצי לכל כיוון. תחנות הדלק והחנויות האחרונות נמצאות במרטווילי.
ar:
  name: المعلم الطبيعي كهف جورتسكو
  short: >-
    كهف كارستي بكر من طابقين فوق جدول جورتسكو قرب مارتفيلي، يُبلَغ سيراً على الأقدام، وكانت عظام دببة
    الكهوف مدفونة في طينه.
  body: >-
    **في أعماق طين هذا الكهف في سامغريلو رقدت عظام دببة الكهوف والوشق والبيسون، وآثار بشر احتموا به ذات
    يوم.**


    جورتسكو كهف كارستي في بلدية مارتفيلي، نحتته المياه في حجر جيري رقيق الطبقات من العصر الطباشري العلوي
    في كتلة أسخي، على ارتفاع 653 متراً فوق سطح البحر، في وادي جورتسكو، أحد الروافد اليسرى لنهر أباشا.
    ينفتح المدخل في منحدر صخري على ارتفاع نحو 35 متراً فوق الجدول: عرضه أربعة إلى خمسة أمتار، وارتفاعه
    متران إلى ثلاثة، ويتجه نحو الجنوب الغربي. والصخور المتناثرة أمامه هي كل ما تبقى من سقف انهار منذ زمن
    بعيد.


    يمتد الكهف في الداخل 276 متراً على مستويين. تضيق قاعة المدخل الواسعة إلى ممر متعرج يبلغ ارتفاعه ثلاثة
    إلى خمسة أمتار؛ وعلى بعد 45 إلى 50 متراً من المدخل يتسع إلى قاعة مقببة يبلغ ارتفاعها ثمانية إلى عشرة
    أمتار، تتدلى منها هوابط ضخمة. ويغطي الأرضية طين لزج أصفر مائل إلى البني يصل سمكه إلى أربعة أمتار،
    رسّبته مياه الكهف نفسه. يجري فيه جدول يلتقي بآخر، ثم يخرج من الجبل نبعاً على ضفة جورتسكو. وفي الطرف
    الأبعد، في جدار قاعة كبيرة، ينفتح رواق علوي طوله 30 متراً. ويبرد الهواء من 18 درجة مئوية عند الفوهة
    إلى نحو 11.5 درجة في الأعماق.


    عُثر على العظام في الطبقات السفلى من الطين، ووُصفت منذ عام 1958 في أعمال معهد كوتايسي التربوي. ومنذ
    عام 2013 صار الكهف معلماً طبيعياً محمياً تديره وكالة المناطق المحمية.


    هذا كهف بكر لا كهف سياحي: لا إضاءة ولا درابزين ولا ممرات. وما تراه هو ما يعثر عليه مصباحك.
  tip: >-
    لا موظفين ولا إضاءة ولا مرافق عند الكهف. تواصل مع وكالة المناطق المحمية (apa.gov.ge) قبل الذهاب: اسأل
    إن كانت مرافقة حارس أو مرشد مطلوبة وإن كانت هناك رسوم، إذ لم يُعلَن عن أي رسوم. لا تدخل وحدك أبداً.
    احمل مصدرَي ضوء لكل شخص، وخوذة إن توفرت، وطبقة ثياب دافئة، فالحرارة في الداخل نحو 11.5 درجة مئوية.
    أرضية الطين عميقة وزلقة، فانتعل حذاءً لا تمانع إتلافه، ولا تلمس الهوابط. والكهف الذي يجري فيه جدول
    ليس مكاناً تكون فيه بعد مطر غزير. يقع أخدود بالدا على بعد 2.4 كم؛ واشترِ الماء والطعام من مارتفيلي.
    اذهب بين مايو وأكتوبر، ففي الأشهر الماطرة يصبح الدرب موحلاً ويرتفع منسوب الجدول.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي حتى سامتريديا، ثم الطرق المحلية عبر أباشا إلى
    مارتفيلي، ومنها شمالاً إلى قرى بالدا: نحو 290 كم وأربع ساعات ونصف حتى بداية الدرب في بالدا الثانية
    (ميوري بالدا). ينتهي الإسفلت عند مارتفيلي تقريباً، ويليه طريق قروي ضيق مفروش بالحصى ومليء بالأخاديد.
    الخيار المعقول سيارة مرتفعة عن الأرض، وبعد المطر ستحتاج إلى دفع رباعي. ومن بالدا الثانية، بحسب وكالة
    المناطق المحمية، يبعد الكهف 5.5 كم على درب مشاة معلَّم، أي نحو ساعة ونصف في كل اتجاه. آخر محطات الوقود
    والمتاجر في مارتفيلي.
