ka:
  name: ხვამლის მასივი
  short: >-
    ორ ათას მეტრზე მაღალი კირქვის მასივი ლეჩხუმსა და იმერეთს შორის — ბრტყელი მწვერვალი, გამოქვაბულები
    და საგანძურის ლეგენდა.
  body: >-
    **ხვამლი შორიდან ცნობადია: ბრტყელი, თითქოს დანით მოჭრილი მასივი, რომლის სამხრეთი მხარე სამასმეტრიანი
    კედლით ეშვება.** ეს ცარცული ხანის კირქვის მთაა, ცაგერისა და წყალტუბოს მუნიციპალიტეტების საზღვარზე,
    და 2001 მეტრს აღწევს. მისი პროფილი მთელი ქვემო ლეჩხუმიდან და იმერეთის ვაკიდანაც ჩანს.


    ფორმა თავისთავად საინტერესოა: ხვამლი ორმაგი კუესტაა — კირქვის ფენები ერთი მხრიდან რბილად ეშვება, მეორედან
    კი კედლად წყდება, და სწორედ ეს აძლევს მასივს „მოჭრილ“ სილუეტს. ის წყალგამყოფსაც ქმნის ორ ხეობას შორის.
    პლატოზე ზაფხულში მეცხვარეთა დროებითი ბანაკებია, წყალი კი ცისტერნებში ან ჩამოტანილი აქვთ — ზუსტად იმ
    მიზეზით, რომლის გამოც შენც უნდა წაიღო.


    ხვამლი ქართულ წარმოსახვაში მყარად ზის. XIV საუკუნის ქრონიკა აქ დამალულ სამეფო საგანძურს ახსენებს —
    ალმასის ცნობილ ძეწკვს, გრდემლის ფორმად ნაკვეთ ძვირფას ქვას და დიდ მარგალიტს. მეორე გადმოცემით, სწორედ
    ხვამლზე იყო მიჯაჭვული ამირანი, პრომეთეს ქართული ანალოგი, რომელსაც ყორანი ტანჯავდა; ეს ლეგენდა ჟიულ
    ვერნის რომანშიც მოხვდა. მესამე ამბავი ვერძისთავის წყაროს ახსნას ცდილობს, რომელიც ხან იშრიტება და ხან
    ბრუნდება: ბრალი გამოქვაბულებში მცხოვრებ უკვდავ გველეშაპს მიუძღვის.


    გამოქვაბულები რეალურია. მასივის მთავარი მღვიმე — თეკენთერი — დაახლოებით ათას ოთხასი მეტრის სიმაღლეზეა
    და მასში შესასვლელი დიდი წიფლის ხის ღრუშია. კარსტული ძაბრები პლატოზე ყველგან გვხვდება, სისტემა კი
    ბოლომდე შესწავლილი არ არის.


    ასვლა უფრო მარტივია, ვიდრე მთის სახე გპირდება. ოკურეშიდან ასფალტიანი გზა თითქმის ათას შვიდას მეტრამდე
    აჰყავს მანქანას; შემდეგ ორი კილომეტრი ფეხით და დაახლოებით ხუთასი მეტრი აღმართი რჩება. ზემოთ პლატო
    თითქმის სწორია, ცხვრის ფარებით და ჩამწოლილი ბალახით. ნათელ დღეს აღმოსავლეთით რაჭის ქედი და კავკასიონი
    ჩანს, სამხრეთით კი კოლხეთის დაბლობი.
  tip: >-
    პარკინგიდან მწვერვალამდე და უკან დაახლოებით ორი საათია, დასვენებით სამი. წყალი თან წაიღე — პლატო კირქვაა
    და წყარო არ არის. ნისლი აქ სწრაფად ჩამოწვება და ბრტყელ ზედაპირზე ორიენტაცია იკარგება; ასეთ დროს ასვლა
    არ დაიწყო. ბალახი ხშირად სველია, ფეხსაცმელი კარგი გჭირდება. ტუალეტი და კვება არ არის — უახლოესი ცაგერსა
    და ოკურეშშია. მარტი-აპრილში ზემოთ ჯერ კიდევ თოვლია.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე, შემდეგ წყალტუბოზე ცაგერის გზით და ოკურეშთან შესახვევი — 280 კმ, დაახლოებით
    ოთხი საათი და ორმოცი წუთი. ოკურეშიდან ზემოთ გზა ასფალტიანია, მაგრამ ადგილ-ადგილ ოცპროცენტიანი დაქანებით;
    მშრალ ამინდში ჩვეულებრივი მანქანაც ადის, სველში კი ჯობია მეტი კლირენსი და ნორმალური საბურავები. მანქანა
    ზედა პარკინგზე დატოვე. საწვავი ქუთაისსა და ცაგერში აიღე.
en:
  name: Khvamli Massif
  short: >-
    A limestone massif of just over 2,000 metres between Lechkhumi and Imereti — flat-topped, cave-riddled
    and wrapped in a treasure legend.
  body: >-
    **Khvamli is recognisable from a great distance: a flat massif that looks cut off with a knife, its
    southern side falling in a wall some three hundred metres high.** This is Cretaceous limestone, straddling
    the boundary of Tsageri and Tskaltubo municipalities, and it reaches 2,001 metres. Its profile is
    visible across the whole of lower Lechkhumi and out over the Imereti plain.


    The form itself is worth understanding: Khvamli is a double cuesta — the limestone beds dip gently
    from one side and break off in a wall on the other, which is exactly what gives the massif its sliced
    silhouette. It also acts as a watershed between two valleys. In summer there are temporary shepherds'
    camps on the plateau, and they keep water in cisterns or carry it up, for precisely the reason you
    will need to carry your own.


    Khvamli sits deep in the Georgian imagination. A 14th-century chronicle describes the royal treasury
    hidden here and names some of it — a famous chain of diamonds, a jewel cut in the shape of an anvil,
    a great pearl. A second tradition puts Amirani on this mountain, the Georgian counterpart of Prometheus,
    chained and tormented by a raven; Jules Verne borrowed the association for a novel. A third explains
    the Verdzistava spring, which stops and starts, by an immortal dragon living in the caves.


    The caves are real enough. The most important of them, Tekenteri, lies at about 1,400 metres, and
    the way in is through the hollow trunk of a large beech tree. Sinkholes pit the plateau everywhere,
    and the system has never been fully surveyed.


    The climb is easier than the mountain's face suggests. An asphalt road from Okureshi takes a car to
    almost 1,700 metres; from there it is two kilometres on foot and roughly 500 metres of ascent. The
    top is a near-level plateau, cropped short by sheep. On a clear day the Racha range and the Greater
    Caucasus stand to the east, and the Kolkheti lowland spreads out to the south.
  tip: >-
    Allow about two hours up and down from the parking area, three with a stop at the top. Carry water
    — the plateau is limestone and has no springs. Fog comes down quickly here and a flat summit is a
    bad place to lose your bearings, so do not start the walk in cloud. The grass is often wet and proper
    footwear makes a difference. There are no toilets and no food; the nearest are in Tsageri and Okureshi.
    In March and April there is still snow on top.
  route: >-
    From Tbilisi take the E60 to Kutaisi, then head north through Tskaltubo on the Tsageri road and turn
    off at Okureshi — 280 km, about four hours forty. The road above Okureshi is asphalt but reaches gradients
    of around twenty per cent in places; in dry weather an ordinary car manages it, in the wet more clearance
    and decent tyres are worth having. Leave the car at the upper parking area. Fuel at Kutaisi and Tsageri.
ru:
  name: Массив Хвамли
  short: >-
    Известняковый массив чуть выше 2000 метров между Лечхуми и Имерети — плоская вершина, пещеры и легенда
    о царской казне.
  body: >-
    **Хвамли узнаётся издалека: плоский массив, будто срезанный ножом, южная сторона которого обрывается
    стеной метров в триста.** Это меловой известняк на границе Цагерского и Цхалтубского муниципалитетов,
    и высота его — 2001 метр. Силуэт горы виден из всего нижнего Лечхуми и с имеретинской равнины.


    Сама форма стоит понимания: Хвамли — двойная куэста, известняковые пласты полого падают с одной стороны
    и обрываются стеной с другой, и именно это даёт массиву его «срезанный» силуэт. Он же служит водоразделом
    между двумя долинами. Летом на плато стоят временные пастушьи стоянки, воду там держат в цистернах
    или приносят снизу — ровно по той причине, по которой её придётся нести и вам.


    Хвамли прочно сидит в грузинском воображении. Хроника XIV века описывает спрятанную здесь царскую
    казну и даже перечисляет: знаменитую алмазную цепь, драгоценный камень, огранённый в форме наковальни,
    и большую жемчужину. По другому преданию именно на этой горе был прикован Амирани, грузинский двойник
    Прометея, которого терзал ворон; эту связь позаимствовал в одном из романов Жюль Верн. Третья история
    объясняет источник Вердзиставa, то иссякающий, то возвращающийся, бессмертным драконом, живущим в
    пещерах.


    Пещеры вполне реальны. Главная из них, Текентери, лежит примерно на 1400 метрах, а вход в неё — через
    дупло большого бука. Карстовые воронки испещряют плато повсюду, и система до конца не изучена.


    Подъём проще, чем обещает вид горы. Асфальтовая дорога от Окуреши поднимает машину почти до 1700 метров;
    дальше остаётся два километра пешком и около 500 метров набора. Наверху почти ровное плато, выщипанное
    овцами. В ясный день на востоке стоят Рачинский хребет и Кавказ, на юге расстилается Колхидская низменность.
  tip: >-
    От парковки до вершины и обратно — около двух часов, с отдыхом наверху три. Воду берите с собой: плато
    известняковое, источников нет. Туман здесь опускается быстро, а плоская вершина — плохое место, чтобы
    терять ориентиры, так что в облаке подъём не начинайте. Трава часто мокрая, нормальная обувь заметно
    помогает. Туалетов и еды нет, ближайшие — в Цагери и Окуреши. В марте и апреле наверху ещё лежит снег.
  route: >-
    Из Тбилиси по E60 до Кутаиси, затем на север через Цхалтубо по дороге на Цагери, свернуть у Окуреши
    — 280 км, около четырёх часов сорока минут. Выше Окуреши дорога асфальтовая, но местами с уклоном
    до двадцати процентов; в сухую погоду проезжает обычная машина, в мокрую лучше иметь клиренс и приличную
    резину. Машину оставляйте на верхней парковке. Заправки в Кутаиси и Цагери.
fa:
  name: تودهٔ خواملی
  short: تودهٔ آهکی اندکی بلندتر از دو هزار متر میان لچخومی و ایمرتی — قلهٔ تخت، غارهای فراوان و افسانهٔ
    گنج.
  body: >-
    **خواملی از فاصله‌های دور شناخته می‌شود: تودهٔ تختی که گویی با کارد بریده شده و سمت جنوبی‌اش با دیواره‌ای
    نزدیک به سیصد متر فرو می‌افتد.** این سنگ آهک دورهٔ کرتاسه است، بر مرز شهرستان‌های تساگری و تسخالتوبو،
    و به ۲۰۰۱ متر می‌رسد. نیم‌رخش از سراسر لچخومی پایین و از دشت ایمرتی دیده می‌شود.


    خودِ شکل کوه فهمیدنی است: خواملی یک کوستای دوتایی است؛ لایه‌های آهکی از یک سو به‌نرمی شیب می‌گیرند
    و از سوی دیگر با دیواره قطع می‌شوند، و همین است که به توده نیم‌رخ «بریده»اش را می‌دهد. این کوه میان
    دو درّه آبخیزگاه نیز هست. تابستان‌ها بر فلات اردوگاه‌های موقت چوپانان برپاست و آب را در آب‌انبار نگه
    می‌دارند یا از پایین بالا می‌برند، درست به همان دلیلی که شما هم باید آب خود را ببرید.


    خواملی در تخیل گرجی جای محکمی دارد. تاریخ‌نامه‌ای از سدهٔ چهاردهم از خزانهٔ شاهی پنهان‌شده در اینجا
    سخن می‌گوید و حتی نام می‌برد: زنجیر مشهور الماس، گوهری تراشیده به شکل سندان، و مرواریدی بزرگ. روایتی
    دیگر آمیرانی را بر همین کوه می‌نشاند؛ همتای گرجی پرومته که در زنجیر بود و کلاغی عذابش می‌داد. ژول
    ورن همین پیوند را در رمانی به کار گرفت. روایت سوم چشمهٔ وردزیستاوا را که گاه می‌خشکد و گاه بازمی‌گردد،
    به اژدهایی جاودان در غارها نسبت می‌دهد.


    غارها اما واقعی‌اند. مهم‌ترینشان، تکنتری، در حدود هزار و چهارصد متری است و راه ورودش از تنهٔ توخالی
    درخت راش بزرگی می‌گذرد. فروچاله‌های کارستی سراسر فلات را سوراخ کرده‌اند و شبکه هرگز به‌تمامی پیمایش
    نشده است.


    صعود آسان‌تر از آن است که چهرهٔ کوه وعده می‌دهد. جاده‌ای آسفالت از اوکورشی خودرو را تا نزدیک هزار
    و هفتصد متر بالا می‌برد؛ از آنجا دو کیلومتر پیاده و حدود پانصد متر اختلاف ارتفاع می‌ماند. بالا فلاتی
    است تقریباً هموار که گوسفندان علفش را کوتاه کرده‌اند. در روز صاف رشته‌کوه راچا و قفقاز بزرگ در شرق
    ایستاده‌اند و جلگهٔ کولختی در جنوب گسترده است.
  tip: >-
    از پارکینگ تا قله و بازگشت حدود دو ساعت است، با توقفی در بالا سه ساعت. آب همراه ببرید؛ فلات آهکی است
    و چشمه ندارد. مه اینجا تند پایین می‌آید و قلهٔ تخت جای بدی برای گم کردن جهت است، پس در ابر صعود را
    آغاز نکنید. علف اغلب خیس است و کفش مناسب فرق می‌کند. سرویس بهداشتی و غذا نیست؛ نزدیک‌ترینشان در تساگری
    و اوکورشی است. در اسفند و فروردین هنوز بالا برف هست.
  route: >-
    از تفلیس با E60 تا کوتائیسی، سپس به شمال از تسخالتوبو در جادهٔ تساگری و انشعاب نزد اوکورشی — ۲۸۰ کیلومتر،
    حدود چهار ساعت و چهل دقیقه. جادهٔ بالای اوکورشی آسفالت است اما جاهایی شیبی نزدیک بیست درصد دارد؛ در
    هوای خشک خودروی معمولی بالا می‌رود و در هوای بارانی ارتفاع شاسی و لاستیک سالم به کار می‌آید. خودرو
    را در پارکینگ بالایی بگذارید. سوخت در کوتائیسی و تساگری.
he:
  name: גוש חוואמלי
  short: גוש גיר של מעט יותר מ-2,000 מטר בין לצ'חומי לאימרתי — שטוח פסגה, מנוקב מערות ועטוף באגדת אוצר.
  body: >-
    **חוואמלי מזוהה ממרחק רב: גוש שטוח שנראה כאילו נחתך בסכין, וצידו הדרומי נופל בקיר של כשלוש מאות מטר.**
    זהו גיר מתקופת הקרטיקון, על גבול מחוזות צאגרי וצחלטובו, והוא מגיע ל-2,001 מטר. את קווי המתאר שלו רואים
    מכל לצ'חומי התחתונה ומעל מישור אימרתי.


    הצורה עצמה ראויה להבנה: חוואמלי הוא קואסטה כפולה — שכבות הגיר נוטות בשיפוע מתון מצד אחד ונקטעות בקיר
    מן הצד האחר, וזה בדיוק מה שמעניק לגוש את קו המתאר החתוך שלו. הוא גם משמש קו פרשת מים בין שני עמקים.
    בקיץ עומדים על הרמה מחנות רועים זמניים, והמים נשמרים שם בבורות או מובאים מלמטה — בדיוק מן הסיבה שבגללה
    תצטרכו לשאת מים משלכם.


    חוואמלי יושב עמוק בדמיון הגאורגי. כרוניקה מן המאה ה-14 מתארת את אוצר המלוכה שהוסתר כאן ואף מונה חלק
    ממנו: שרשרת יהלומים מפורסמת, אבן חן מלוטשת בצורת סדן, ופנינה גדולה. מסורת אחרת מציבה על ההר הזה את
    אמיראני, מקבילו הגאורגי של פרומתאוס, כבול ומעונה בידי עורב; ז'ול ורן שאל את הקישור הזה לאחד מספריו.
    סיפור שלישי מסביר את מעיין ורדזיסטאווה, הפוסק וחוזר, בדרקון בן אלמוות החי במערות.


    המערות אמיתיות לגמרי. החשובה שבהן, טקנטרי, שוכנת בגובה כ-1,400 מטר, והכניסה אליה עוברת בגזע חלול של
    עץ אשור גדול. בולענים מנקבים את הרמה בכל מקום, והמערכת מעולם לא נסקרה עד תום.


    העלייה קלה ממה שפני ההר מבטיחים. כביש אספלט מאוקורשי מעלה את הרכב עד כמעט 1,700 מטר; משם נותרו שני
    קילומטרים ברגל וכ-500 מטר טיפוס. למעלה משתרעת רמה כמעט מישורית, מכורסמת בידי צאן. ביום בהיר ניצבים
    במזרח רכס ראצ'ה והקווקז הגדול, ובדרום נפרשת שפלת קולחתי.
  tip: >-
    מן החניון אל הפסגה וחזרה כשעתיים, ושלוש עם הפסקה למעלה. קחו מים — הרמה גירנית ואין בה מעיינות. הערפל
    יורד כאן מהר, ופסגה שטוחה היא מקום גרוע לאבד בו כיוון, לכן אל תתחילו בענן. העשב לח לעיתים קרובות והנעליים
    הנכונות עושות הבדל. אין שירותים ואין אוכל; הקרובים בצאגרי ובאוקורשי. במרץ ובאפריל עדיין יש שלג למעלה.
  route: >-
    מטביליסי בכביש E60 עד קותאיסי, ומשם צפונה דרך צחלטובו בכביש לצאגרי, ופנייה באוקורשי — 280 ק״מ, כארבע
    שעות וארבעים דקות. הכביש מעל אוקורשי סלול אך מגיע במקומות לשיפוע של כעשרים אחוז; במזג אוויר יבש מכונית
    רגילה מטפסת בו, וברטוב עדיף מרווח גחון וצמיגים סבירים. השאירו את הרכב בחניון העליון. דלק בקותאיסי
    ובצאגרי.
ar:
  name: كتلة خفاملي
  short: كتلة كلسية تتجاوز الألفي متر بقليل بين لتشخومي وإيميريتي — مسطّحة القمة، مثقوبة بالكهوف، وتلفّها
    أسطورة كنز.
  body: >-
    **يُعرف خفاملي من مسافات بعيدة: كتلة مسطّحة تبدو كأنها قُطعت بسكين، ويهوي جانبها الجنوبي في جدار يناهز
    ثلاثمائة متر.** هذا حجر كلسي من العصر الطباشيري، يمتد على حدود بلديتَي تساغيري وتسخالتوبو، ويبلغ 2001
    متر. ويُرى خطّه من لتشخومي السفلى كلها ومن سهل إيميريتي.


    والشكل نفسه يستحق الفهم: خفاملي كويستا مزدوجة؛ طبقات الكلس تميل بلطف من جهة وتنقطع بجدار من الجهة
    الأخرى، وهذا بالضبط ما يمنح الكتلة خطها المقطوع. وهو أيضاً خط تقسيم مياه بين واديين. وفي الصيف تُنصب
    على الهضبة مخيمات رعاة مؤقتة، ويحفظون الماء في صهاريج أو يحملونه من الأسفل، للسبب عينه الذي يوجب عليك
    حمل مائك.


    ويجلس خفاملي عميقاً في المخيلة الجورجية. فحوليّة من القرن الرابع عشر تصف خزانة الملك المخبأة هنا وتسمّي
    بعضها: سلسلة ألماس شهيرة، وجوهرة مصقولة على هيئة سندان، ولؤلؤة كبيرة. ورواية أخرى تضع على هذا الجبل
    أميراني، نظير بروميثيوس الجورجي، مقيّداً يعذّبه غراب؛ وقد استعار جول فيرن هذا الربط في إحدى رواياته.
    ورواية ثالثة تفسّر نبع فيردزيستافا الذي ينقطع ويعود بتنين خالد يسكن الكهوف.


    أما الكهوف فحقيقية تماماً. أهمها، تيكينتيري، على نحو ألف وأربعمائة متر، ومدخله يمرّ في جذع مجوّف لشجرة
    زان كبيرة. والبواليع تثقب الهضبة في كل موضع، ولم تُمسح الشبكة مسحاً كاملاً قط.


    والصعود أسهل مما يوحي به وجه الجبل. طريق معبّد من أوكوريشي يرفع السيارة إلى ما يقارب ألفاً وسبعمائة
    متر؛ ومن هناك يبقى كيلومتران سيراً ونحو خمسمائة متر ارتفاعاً. والقمة هضبة شبه مستوية قصّت الأغنام
    عشبها. وفي يوم صافٍ تنتصب شرقاً سلسلة راتشا والقوقاز الكبير، وينبسط جنوباً سهل كولخيتي.
  tip: >-
    من الموقف إلى القمة وعودة نحو ساعتين، وثلاث مع وقفة في الأعلى. احمل ماء، فالهضبة كلسية ولا ينابيع
    فيها. والضباب ينزل هنا سريعاً، والقمة المسطّحة موضع سيئ لفقدان الاتجاه، فلا تبدأ المسير في الغيم.
    والعشب رطب في الغالب والحذاء المناسب يحدث فرقاً. لا دورات مياه ولا طعام؛ وأقربها في تساغيري وأوكوريشي.
    وفي آذار ونيسان يبقى الثلج في الأعلى.
  route: >-
    من تبليسي على الطريق E60 إلى كوتايسي، ثم شمالاً عبر تسخالتوبو على طريق تساغيري، والانعطاف عند أوكوريشي
    — 280 كم، نحو أربع ساعات وأربعين دقيقة. الطريق فوق أوكوريشي معبّد لكنه يبلغ في مواضع انحداراً نحو
    عشرين بالمئة؛ وفي الجو الجاف تصعده سيارة عادية، وفي المبلل يُستحسن خلوص أعلى وإطارات سليمة. اترك السيارة
    في الموقف الأعلى. الوقود في كوتايسي وتساغيري.
