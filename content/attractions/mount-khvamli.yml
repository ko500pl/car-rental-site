ka:
  name: ხვამლის მასივი
  short: >-
    2002 მეტრამდე ამართული კირქვის მასივი ლეჩხუმში: თითქოს დანით მოჭრილი თხემი, მეფეთა საგანძურის მღვიმე
    და პრომეთეს თქმულება.
  body: >-
    **იმერეთის ვაკიდან ხვამლი ისე მოჩანს, თითქოს ვიღაცამ მთას თავი დანით მოაჭრა: ბრტყელი თხემი, სამხრეთით
    კი სამასმეტრიანი კირქვის ქარაფი.**


    მასივი ცაგერისა და წყალტუბოს მუნიციპალიტეტების საზღვარზე 2002 მეტრამდე ადის და რიონისა და ცხენისწყლის
    წყალგამყოფს ქმნის. გეოლოგები მას ორმაგ კუესტას უწოდებენ: ცარცული კირქვის ფენები ერთ მხარეს დამრეცად
    ეშვება, მეორეზე კი კლდედ წყდება. ძველი სახელი, ხომლი, ქართულად პლეადების ვარსკვლავგროვას ჰქვია; ვახუშტი
    ბატონიშვილის თქმით, კლდემ ეს სახელი სიმაღლით მოიგო — „ხომლის ვარსკვლავის სწორებით“.


    ეს ქარაფები სამეფოს საგანძურს ინახავდა. ვახუშტი აქ კლდეში გამოკვეთილ ქვაბს აღწერს, „მტერთაგან შეუვალს,
    მეფეთა საგანძურთ სადებს“. XIV საუკუნის მემატიანე, ჟამთააღმწერელი, მოგვითხრობს, რომ როცა 1259 წელს
    დავით ულუმ და დავით ნარინმა ქვეყანა გაიყვეს, ხომლის ქვაბიდან მხოლოდ მცირედი განაწილდა, უფროსი კი ქვაბშივე
    დარჩა. რუსუდანის ძეს, დავით ნარინს, ხვდა „ჯაჭვი იგი სახელდებული, სალმასური და თვალი იგი პატივცემული
    გრდემლი, და მარგალიტი იგი დიდი, რომლის სწორი არავის-სადა უხილავს“. XIX საუკუნის 40-იან წლებში ერთ-ერთმა
    დადიანმა დარჩენილი განძი აქ თხარა და ვერაფერი იპოვა.


    თქმულებამ მთას თავისი ბინადრებიც მიუჩინა: ქარაფზე მიჯაჭვული პრომეთე — ანუ მისი ქართველი ძმა ამირანი,
    — რომელსაც მტაცებელი ფრინველი ტანჯავს (ჟიულ ვერნმა ეს ამბავი რომანში „შეუპოვარი კერაბანი“ გაიმეორა),
    და უკვდავი გველეშაპი, რომლის მოძრაობასაც ვერძისთავის წყაროს ცვალებად დინებას მიაწერენ. მღვიმეები კი
    ნამდვილია. თეკენთერში, დაახლოებით 1400 მეტრზე, დიდი წიფლის ფუღუროდან ჩადიან; თვრამეტი მეტრის სიღრმეზე
    ცივი, ანკარა წყლის ტბაა, რომლის ზედაპირზე ძველი ვედროები და დოქები ტივტივებს.


    მასივზე XII–XIII საუკუნეების წმინდა გიორგის ეკლესიის ნანგრევებია; 1910 წელს აქ აღმოჩენილი წარწერა
    შემწირველს, სვანთა ერისთავ იოანეს, ასახელებს. ქვემოთ, სოფლებში, 20 ივლისს დღესაც ხვამლობას დღესასწაულობენ.
  tip: >-
    ზედა ავტოსადგომიდან მწვერვალამდე და უკან, ზემოთ შესვენების ჩათვლით, დაახლოებით სამი საათი დაუთმეთ.
    წყალი მთლიანად თან წაიღეთ: მასივი კირქვაა და პლატოზე წყარო არ არის. ნისლი თხემს წუთებში ფარავს, ბრტყელ
    თავზე კი ორიენტაციის დაკარგვა ადვილია — მოღრუბლულ ამინდში ნუ გახვალთ და ტრეკი წინასწარ ჩამოტვირთეთ.
    ბალახი ხშირად სველია, კარგი ფეხსაცმელი გამოგადგებათ. მარტსა და აპრილში ზემოთ ჯერ კიდევ თოვლია. ტუალეტი
    და საკვები არ არის — უახლოესი ცაგერშია. თეკენთერი და სხვა კარსტული ჭები აღჭურვილ სპელეოლოგებს დაუტოვეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, შემდეგ შ15-ით წყალტუბოს გავლით ცაგერის მიმართულებით და
    ოყურეშთან გადაუხვიეთ — დაახლოებით 280 კმ და ოთხი საათი და ორმოცი წუთი. ოყურეშიდან ზემოთ გზა ასფალტიანია,
    მაგრამ ადგილ-ადგილ ძალიან ციცაბოა, დაახლოებით 20%-იანი დახრილობით: მშრალ ამინდში ჩვეულებრივი მანქანაც
    ადის, სველში კი მაღალი გამავლობის მანქანის (ჯიპის) კლირენსი და მოჭიდება გამოგადგებათ — სწორედ ამ კლასს
    გირჩევთ. მანქანა იქ დატოვეთ, სადაც გზა მთავრდება, და პლატომდე დაახლოებით ორი კილომეტრი ფეხით გაიარეთ.
    საწვავი ქუთაისში ან წყალტუბოში ჩაასხით.
en:
  name: Khvamli Massif
  short: >-
    A 2,002-metre limestone massif in Lechkhumi: a summit that looks sliced off with a knife, a cave of
    royal treasure and a Prometheus legend.
  body: >-
    **From the Imereti plain Khvamli looks as if someone sliced the top off a mountain: a flat crown,
    and on the south a limestone cliff three hundred metres high.**


    The massif rises to 2,002 metres on the border of Tsageri and Tskaltubo municipalities and forms the
    watershed between the Rioni and the Tskhenistskali. Geologists call it a double cuesta, where beds
    of Cretaceous limestone dip gently one way and break off in cliffs the other. Its old name, Khomli,
    is Georgian for the Pleiades. Prince Vakhushti wrote that the rock earned it by its height, 'level
    with the Khomli stars'.


    Those cliffs held a kingdom's treasury. Vakhushti describes a cave cut into the rock, 'impregnable
    to enemies, a store for the treasures of kings'. The 14th-century Chronicle of a Hundred Years records
    that when David VII and David VI divided Georgia in 1259, most of the Khomli hoard was left in the
    cave. David VI, Queen Rusudan's son, received 'the famous chain of diamonds, the superb jewel cut
    in the form of an anvil and a great pearl, of which the like was never seen'. In the 1840s a Prince
    Dadiani dug for the rest and found nothing.


    Legend has given the mountain other tenants. One is Prometheus, or his Georgian brother Amirani, chained
    to the cliff and tormented by a bird of prey, a story Jules Verne retold in Kéraban the Inflexible.
    Another is an immortal dragon whose movements are said to make the Verdzistava spring stop and start.
    The caves are real. Tekenteri, at about 1,400 metres, is entered through the hollow of a great beech
    and drops eighteen metres to a lake of cold, clear water where old buckets and pitchers float.


    On the massif lie the ruins of a 12th- or 13th-century church of St George; an inscription found in
    1910 names its donor, Ioane, duke of the Svans. Below, the villages still keep the Khvamloba feast
    on 20 July.
  tip: >-
    Allow about three hours from the upper parking area to the top and back, with time to linger. Carry
    all your water, because this is limestone and the plateau has no springs. Fog can swallow the summit
    in minutes, and on a flat top it is easy to lose your bearings, so don't set out in cloud and download
    a track beforehand. The grass is often wet, so wear proper boots. Snow lingers on top into March and
    April. There are no toilets or food; the nearest are in Tsageri. Leave Tekenteri and the other karst
    shafts to equipped cavers.
  route: >-
    From Tbilisi take the S1 (E60) west to Kutaisi, then the Sh15 north through Tskaltubo towards Tsageri
    and turn off at Okureshi. That is about 280 km and four hours forty minutes. The road up from Okureshi
    is asphalt but very steep in places, with gradients of around 20%. In the dry an ordinary car copes;
    in the wet you will want the clearance and grip of an SUV, the class we recommend. Leave the car where
    the road ends and walk about two kilometres to the plateau. Fill up in Kutaisi or Tskaltubo.
ru:
  name: Массив Хвамли
  short: >-
    Известняковый массив высотой 2002 метра в Лечхуми: вершина, будто срезанная ножом, пещера с царской
    казной и легенда о Прометее.
  body: >-
    **С Имеретинской равнины Хвамли выглядит так, будто кто-то срезал горе верхушку: плоская корона, а
    на юге — известняковый обрыв высотой триста метров.**


    Массив поднимается до 2002 метров на границе Цагерского и Цхалтубского муниципалитетов и служит водоразделом
    между Риони и Цхенисцкали. Геологи называют его двойной куэстой: пласты мелового известняка полого
    падают в одну сторону и обрываются утёсами в другую. Его старое имя, Хомли, по-грузински означает
    Плеяды. Царевич Вахушти писал, что скала получила его за свою высоту — «вровень со звёздами Хомли».


    В этих утёсах хранилась казна целого царства. Вахушти описывает высеченную в скале пещеру, «неприступную
    для врагов, хранилище сокровищ царей». «Столетняя хроника» XIV века сообщает, что, когда в 1259 году
    Давид VII и Давид VI поделили Грузию, бо́льшая часть сокровищ Хомли осталась в пещере. Давиду VI,
    сыну царицы Русудан, достались «знаменитая алмазная цепь, великолепный камень, огранённый в форме
    наковальни, и большая жемчужина, подобной которой никогда не видели». В 1840-х годах некий князь Дадиани
    копал здесь в поисках остального и ничего не нашёл.


    Легенда поселила на горе и других обитателей. Один из них — Прометей, или его грузинский собрат Амирани,
    прикованный к скале и терзаемый хищной птицей; эту историю пересказал Жюль Верн в «Упрямце Керабане».
    Другой — бессмертный дракон: говорят, это от его движений родник Вердзистава то замирает, то начинает
    течь снова. А вот пещеры вполне реальны. В Текентери, на высоте около 1400 метров, входят через дупло
    огромного бука; пещера уходит вниз на восемнадцать метров, к озеру холодной прозрачной воды, на которой
    плавают старые вёдра и кувшины.


    На массиве лежат руины церкви Святого Георгия XII или XIII века; надпись, найденная в 1910 году, называет
    её жертвователя — Иоане, эристава сванов. Внизу, в сёлах, до сих пор празднуют Хвамлобу — 20 июля.
  tip: >-
    Заложите около трёх часов от верхней стоянки до вершины и обратно, с запасом, чтобы не спешить. Всю
    воду несите с собой: это известняк, и родников на плато нет. Туман может поглотить вершину за считаные
    минуты, а на плоской макушке легко потерять ориентацию, поэтому не выходите в облачность и заранее
    скачайте трек. Трава часто мокрая — нужны нормальные ботинки. Снег лежит наверху до марта–апреля.
    Туалетов и еды нет; ближайшие — в Цагери. Текентери и другие карстовые колодцы оставьте снаряжённым
    спелеологам.
  route: >-
    Из Тбилиси по S1 (E60) на запад до Кутаиси, затем по Sh15 на север через Цхалтубо в сторону Цагери
    и сверните у Окуреши. Это около 280 км и четыре часа сорок минут. Дорога вверх от Окуреши асфальтирована,
    но местами очень крута — уклон около 20%. В сухую погоду справится обычная машина; в сырую вам понадобятся
    клиренс и сцепление кроссовера — рекомендуемого нами класса. Оставьте машину там, где кончается дорога,
    и пройдите около двух километров пешком до плато. Заправьтесь в Кутаиси или Цхалтубо.
fa:
  name: تودهٔ خواملی
  short: >-
    توده‌ای آهکی به بلندی ۲۰۰۲ متر در لچخومی: قله‌ای که گویی با کارد بریده شده، غاری برای گنج شاهان و
    افسانه‌ای از پرومته.
  body: >-
    **از دشت ایمرتی، خواملی چنان می‌نماید که گویی کسی سرِ کوهی را بریده باشد: تاجی تخت، و در جنوب پرتگاهی
    آهکی به بلندی سیصد متر.**


    این توده بر مرز شهرستان‌های تساگری و تسخالتوبو تا ۲۰۰۲ متر بالا می‌رود و آبپخشانِ میان ریونی و تسخنیستسکالی
    است. زمین‌شناسان آن را «کوئستای دوگانه» می‌نامند: لایه‌های سنگ آهکِ دورهٔ کرتاسه از یک سو به‌نرمی
    شیب می‌گیرند و از سوی دیگر به صورت صخره‌هایی عمودی می‌شکنند. نام کهن آن، خوملی، در زبان گرجی به معنای
    پروین (ثریا) است. شاهزاده واخوشتی نوشته است که این صخره به سبب بلندی‌اش چنین نامی گرفت: «هم‌تراز با
    ستارگان خوملی».


    این صخره‌ها گنجینهٔ یک پادشاهی را در خود نگه می‌داشتند. واخوشتی از غاری تراشیده در سنگ می‌گوید، «دست‌نیافتنی
    برای دشمنان، گنجخانهٔ شاهان». «وقایع‌نامهٔ صدساله» از سدهٔ چهاردهم ثبت کرده است که وقتی داوید هفتم
    و داوید ششم در سال ۱۲۵۹ گرجستان را میان خود تقسیم کردند، بیشتر گنج خوملی در غار ماند. به داوید ششم،
    پسر ملکه روسودان، «زنجیر نامدار الماس، گوهر شکوهمندی که به شکل سندان تراش خورده بود، و مرواریدی بزرگ
    که همانندش هرگز دیده نشده بود» رسید. در دههٔ ۱۸۴۰ شاهزاده‌ای از خاندان دادیانی برای یافتن باقی گنج
    کاوش کرد و چیزی نیافت.


    افسانه ساکنان دیگری هم به این کوه داده است. یکی پرومته است، یا همتای گرجی‌اش امیرانی، که به صخره زنجیر
    شده و پرنده‌ای شکاری آزارش می‌دهد؛ داستانی که ژول ورن در «کرابان لجوج» بازگفته است. دیگری اژدهایی
    جاودان است که می‌گویند جنبش‌هایش چشمهٔ وردزیستاوا را گاه از جریان بازمی‌دارد و گاه دوباره روان می‌کند.
    اما غارها واقعی‌اند. به غار تکنتری، در ارتفاع حدود ۱۴۰۰ متر، از درون حفرهٔ تنهٔ راشی تنومند وارد می‌شوند
    و غار هجده متر پایین می‌رود تا به دریاچه‌ای از آب سرد و زلال برسد که سطل‌ها و کوزه‌های کهنه بر آن
    شناورند.


    بر این توده ویرانه‌های کلیسای گئورگی قدیس از سدهٔ دوازدهم یا سیزدهم افتاده است؛ کتیبه‌ای که در سال
    ۱۹۱۰ یافت شد نام بانی آن را آورده است: یوآنه، اریستاوِ (دوکِ) سوان‌ها. در پایین، روستاها هنوز جشن
    خواملوبا را در ۲۰ ژوئیه برپا می‌کنند.
  tip: >-
    از پارکینگ بالایی تا قله و بازگشت حدود سه ساعت در نظر بگیرید، با فرصتی برای درنگ. همهٔ آبتان را همراه
    ببرید، چون اینجا سنگ آهک است و فلات چشمه‌ای ندارد. مه می‌تواند در چند دقیقه قله را ببلعد و بر بامی
    تخت گم کردن جهت آسان است؛ پس در هوای ابری راه نیفتید و پیش از رفتن مسیر را در گوشی‌تان دانلود کنید.
    علف‌ها اغلب خیس‌اند، پس پوتین مناسب بپوشید. برف تا مارس و آوریل بر بالای کوه می‌ماند. دست‌شویی و غذایی
    در کار نیست؛ نزدیک‌ترین‌ها در تساگری است. تکنتری و دیگر چاه‌های کارستی را به غارنوردان مجهز واگذارید.
  route: >-
    از تفلیس جادهٔ S1 (E60) را به سوی غرب تا کوتائیسی بروید، سپس Sh15 را به شمال از میان تسخالتوبو به
    سوی تساگری بگیرید و در اوکورشی از آن جدا شوید. این حدود ۲۸۰ کیلومتر و چهار ساعت و چهل دقیقه است. جادهٔ
    بالارونده از اوکورشی آسفالت است، اما جاهایی بسیار پرشیب، با شیبی حدود ۲۰ درصد. در هوای خشک خودرویی
    معمولی از پسش برمی‌آید؛ در هوای مرطوب به ارتفاع از زمین و چسبندگی یک شاسی‌بلند، ردهٔ پیشنهادی ما،
    نیاز دارید. خودرو را جایی که جاده تمام می‌شود بگذارید و حدود دو کیلومتر تا فلات پیاده بروید. در کوتائیسی
    یا تسخالتوبو سوخت بزنید.
he:
  name: גוש חוואמלי
  short: 'גוש גיר בגובה 2,002 מטר בלצ''חומי: פסגה שנראית כאילו נחתכה בסכין, מערה של אוצר מלכותי ואגדה
    על פרומתאוס.'
  body: >-
    **ממישור אימרתי נראה חוואמלי כאילו מישהו חתך להר את ראשו: כתר שטוח, ובדרום מצוק גיר בגובה שלוש מאות
    מטר.**


    הגוש מתנשא לגובה 2,002 מטר על הגבול שבין המוניציפליטות צגרי וצחלטובו, ומשמש קו פרשת מים בין הריוני
    לצחניסצקאלי. גאולוגים מכנים אותו קואסטה כפולה: שכבות של גיר מתקופת הקרטיקון נוטות בשיפוע מתון לצד
    אחד ונקטעות במצוקים בצד השני. שמו הקדום, חומלי, הוא השם הגאורגי לכימה (הפליאדות). הנסיך וחושטי כתב
    שהסלע קיבל את השם בזכות גובהו, "בגובה אחד עם כוכבי החומלי".


    המצוקים האלה שמרו על אוצר של ממלכה. וחושטי מתאר מערה שנחצבה בסלע, "שאין לאויבים גישה אליה, מקום משמר
    לאוצרות המלכים". "כרוניקת מאה השנים" מן המאה ה-14 מספרת שכאשר דוד השביעי ודוד השישי חילקו ביניהם את
    גאורגיה ב-1259, רוב אוצר חומלי נותר במערה. דוד השישי, בנה של המלכה רוסודן, קיבל את "שרשרת היהלומים
    המפורסמת, את התכשיט הנהדר שלוטש בצורת סדן ואת הפנינה הגדולה, שכמוה לא נראתה מעולם". בשנות ה-40 של
    המאה ה-19 חפר כאן נסיך מבית דדיאני בחיפוש אחר השאר, ולא מצא דבר.


    האגדה העניקה להר גם דיירים אחרים. אחד מהם הוא פרומתאוס, או אחיו הגאורגי אמיראני, כבול אל המצוק ומעונה
    בידי עוף דורס – סיפור שז'ול ורן סיפר מחדש ב"קראבאן העקשן". אחר הוא דרקון בן אלמוות, שלפי המסופר תנועותיו
    גורמות למעיין ורדזיסטאווה להיעצר ולשוב לזרום. המערות, לעומת זאת, אמיתיות. אל טקנטרי, בגובה של כ-1,400
    מטר, נכנסים דרך חלל בגזעו של עץ אשור ענק; המערה צוללת שמונה-עשר מטרים אל אגם של מים קרים וצלולים שעליו
    צפים דליים וכדים ישנים.


    על הגוש שוכנות חורבות כנסיית גאורגיוס הקדוש מן המאה ה-12 או ה-13; כתובת שנמצאה ב-1910 מזכירה את התורם,
    יואנה, דוכס הסוואנים. למטה, בכפרים, עדיין חוגגים את חג החוואמלובה ב-20 ביולי.
  tip: >-
    הקצו כשלוש שעות מהחניה העליונה אל הפסגה ובחזרה, עם זמן להתעכב. שאו איתכם את כל המים, כי זה גיר ואין
    מעיינות ברמה. ערפל יכול לבלוע את הפסגה תוך דקות, ועל פסגה שטוחה קל לאבד כיוון, לכן אל תצאו בעננות
    והורידו מראש את המסלול לטלפון. הדשא רטוב לעתים קרובות, אז נעלו נעלי הליכה מתאימות. השלג נשאר למעלה
    עד מרץ–אפריל. אין שירותים או אוכל; הקרובים ביותר בצגרי. את טקנטרי ואת שאר הבורות הקארסטיים השאירו
    למערנים מצוידים.
  route: >-
    מטביליסי סעו מערבה ב-S1 (E60) עד קוטאיסי, ומשם ב-Sh15 צפונה דרך צחלטובו לכיוון צגרי, ופנו באוקורשי.
    זה כ-280 ק"מ, ארבע שעות וארבעים דקות. הדרך העולה מאוקורשי סלולה, אבל תלולה מאוד בקטעים, עם שיפועים
    של כ-20%. ביובש רכב רגיל יסתדר; ברטיבות תרצו את מרווח הגחון והאחיזה של רכב פנאי-שטח, הקטגוריה שאנו
    ממליצים עליה. השאירו את הרכב במקום שבו הדרך נגמרת והמשיכו כשני קילומטרים ברגל אל הרמה. תדלקו בקוטאיסי
    או בצחלטובו.
ar:
  name: كتلة خفاملي
  short: 'كتلة كلسية ارتفاعها 2002 متر في ليتشخومي: قمة تبدو كأنها قُطعت بسكين، وكهف لكنوز الملوك، وأسطورة
    بروميثيوس.'
  body: >-
    **من سهل إيميريتي يبدو خفاملي كأن أحداً قطع رأس الجبل: تاج مسطّح، وفي الجنوب جرف كلسي بارتفاع ثلاثمائة
    متر.**


    ترتفع الكتلة إلى 2002 متر على الحدود بين بلديتَي تساغيري وتسخالتوبو، وتشكّل خط تقسيم المياه بين ريوني
    وتسخينيستسكالي. ويسمّيها الجيولوجيون «كويستا مزدوجة»، إذ تميل طبقات الحجر الكلسي من العصر الطباشيري
    ميلاً لطيفاً في اتجاه، وتنكسر جروفاً في الاتجاه الآخر. واسمها القديم، خوملي، هو الاسم الجورجي للثريا.
    وكتب الأمير فاخوشتي أن الصخرة نالت هذا الاسم لعلوّها، «بمحاذاة نجوم خوملي».


    احتفظت هذه الجروف بخزينة مملكة. يصف فاخوشتي كهفاً منحوتاً في الصخر، «منيعاً على الأعداء، مستودعاً
    لكنوز الملوك». وتروي «حوليات المئة عام» من القرن الرابع عشر أنه حين اقتسم داود السابع وداود السادس
    جورجيا عام 1259، بقي معظم كنز خوملي في الكهف. ونال داود السادس، ابن الملكة روسودان، «سلسلة الماس الشهيرة،
    والجوهرة البديعة المصقولة على شكل سندان، واللؤلؤة الكبيرة التي لم يُرَ مثلها قط». وفي أربعينيات القرن
    التاسع عشر حفر أمير من آل دادياني بحثاً عن الباقي، فلم يجد شيئاً.


    وقد أسكنت الأسطورة الجبل سكّاناً آخرين. أحدهم بروميثيوس، أو شقيقه الجورجي أميراني، مقيّداً إلى الجرف
    يعذّبه طائر جارح، وهي حكاية أعاد جول فيرن روايتها في «كيرابان العنيد». وآخر تنّين خالد يُقال إن حركاته
    توقف نبع فيردزيستافا ثم تعيده إلى الجريان. أما الكهوف فحقيقية. يُدخل إلى كهف تيكينتيري، على ارتفاع
    نحو 1400 متر، من تجويف في جذع شجرة زان ضخمة، ثم ينحدر الكهف ثمانية عشر متراً إلى بحيرة من الماء البارد
    الصافي تطفو عليها دلاء وجرار قديمة.


    وعلى الكتلة أطلال كنيسة القديس جاورجيوس من القرن الثاني عشر أو الثالث عشر؛ ونقش عُثر عليه عام 1910
    يذكر اسم واهبها، يوانه، دوق السفان. وفي الأسفل ما زالت القرى تحتفل بعيد خفاملوبا في 20 يوليو.
  tip: >-
    خصّص نحو ثلاث ساعات من الموقف العلوي إلى القمة والعودة، مع وقت للتمهّل. احمل كل ما تحتاجه من ماء،
    فهذا حجر كلسي ولا ينابيع على الهضبة. قد يبتلع الضباب القمة في دقائق، ومن السهل أن تفقد اتجاهك على
    قمة مسطّحة، فلا تنطلق في الغيم وحمّل مسار الطريق على هاتفك مسبقاً. العشب مبتلّ في الغالب، فانتعل حذاء
    مشي مناسباً. يبقى الثلج في الأعلى حتى مارس وأبريل. لا دورات مياه ولا طعام؛ أقربها في تساغيري. واترك
    تيكينتيري وغيره من الآبار الكارستية لمستكشفي الكهوف المجهّزين.
  route: >-
    من تبليسي خذ الطريق S1 (E60) غرباً حتى كوتايسي، ثم Sh15 شمالاً عبر تسخالتوبو باتجاه تساغيري، وانعطف
    عند أوكوريشي. وذلك نحو 280 كم وأربعِ ساعات وأربعين دقيقة. الطريق الصاعد من أوكوريشي مُعبَّد لكنه شديد
    الانحدار في مواضع، إذ يبلغ الميل نحو 20%. في الطقس الجاف تكفي سيارة عادية؛ أما في الطقس الرطب فستحتاج
    إلى الخلوص الأرضي والتماسك اللذين توفّرهما سيارة رياضية متعددة الاستخدامات، وهي الفئة التي نوصي بها.
    اترك السيارة حيث ينتهي الطريق، وامشِ نحو كيلومترين حتى الهضبة. تزوّد بالوقود في كوتايسي أو تسخالتوبو.
