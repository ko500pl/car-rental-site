ka:
  name: ლანჩხუთი
  short: გურიის ჩრდილოეთი კარიბჭე — ჩაისა და თხილის ქალაქი კოლხეთის ჭაობების პირას.
  body: >-
    **ლანჩხუთი ის ადგილია, სადაც გურიაში შედიხარ.** ქალაქი მთავარ გზაზეა, სამტრედიიდან სამხრეთით, და სწორედ
    აქედან იშლება გზები ურეკის, გრიგოლეთისა და ოზურგეთისკენ. მისი უმეტესი მნახველი მხოლოდ საწვავს იღებს
    და მიდის — და, სამართლიანად რომ ვთქვათ, ლანჩხუთი ისეთი ქალაქი არაა, რომელსაც ცალკე დღე უნდა დაუთმო.

    სამაგიეროდ, აქ ორი რამ ჩანს, რაც სხვაგან არა.

    პირველი — **სოფლის მეურნეობა**. ლანჩხუთის მუნიციპალიტეტი საქართველოს ჩაისა და თხილის მთავარი რაიონია.
    საბჭოთა დროს აქ ათასობით ჰექტარი ჩაის პლანტაცია იყო; 1990-იან წლებში უმეტესობა მიატოვეს და დღეს ველური
    ჩაის ბუჩქები ბორცვებზე მაინც ჩანს — ჯერ კიდევ მწკრივებად, უკვე მაღალი. ბოლო წლებში ნაწილი აღდგა და
    მცირე მწარმოებლები ისევ გამოჩნდნენ.

    მეორე — **კოლხეთის ეროვნული პარკის** სამხრეთი ნაწილი. ლანჩხუთის დასავლეთით იმნათის ტორფნარია, ევროპის
    ერთ-ერთი უიშვიათესი ეკოსისტემა: სფაგნუმის ტორფის გუმბათი, რომელიც ათასწლეულებია გროვდება. აქ მისვლა
    მარტივი არაა და გიდი სჭირდება, მაგრამ პარკის ადმინისტრაცია ინფორმაციას აძლევს.

    თვითონ ქალაქში: ბაზარი, სადაც შემოდგომაზე თხილი და თაფლი იყიდება, საბჭოთა კულტურის სახლი და პატარა
    პარკი. ერთი-ორი საათი — და შემდეგ ან ზღვისკენ, ან ოზურგეთისკენ.
  tip: >-
    ერთი-ორი საათი. ქალაქი გამოსადეგია, როგორც პრაქტიკული გაჩერება: აქ ბანკომატი, აფთიაქი, სუპერმარკეტი
    და საწვავია, რაც ურეკსა და გრიგოლეთში ნაკლებად სრულყოფილია. ბაზარი დილით მუშაობს. კოლხეთის პარკის
    ჭაობებში დამოუკიდებლად შესვლა არ ღირს — ბილიკები არ არის და კოღო აუტანელია; ჯერ პარკის ოფისს დაუკავშირდი.
  route: >-
    თბილისიდან E60-ით დასავლეთით ხაშურზე, ზესტაფონსა და ქუთაისზე გავლით სამტრედიამდე, შემდეგ სამხრეთით
    — 298 კმ, დაახლოებით ოთხი საათი ოცი წუთი. გზა ბოლომდე ასფალტია, სამტრედიამდე ძირითადად ოთხზოლიანი
    და სწრაფი. ლანჩხუთი პირდაპირ ტრასაზეა, გვერდის ავლა არ სჭირდება. საწვავი ქუთაისსა და თვითონ ლანჩხუთშია.
    პარკინგი ცენტრში უფასო და თავისუფალია. ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Lanchkhuti
  short: Guria's northern gateway — a town of tea and hazelnuts on the edge of the Kolkheti marshes.
  body: >-
    **Lanchkhuti is where you enter Guria.** The town sits on the main road south of Samtredia, and it
    is here that the routes divide towards Ureki, Grigoleti and Ozurgeti. Most people who pass through
    stop for fuel and drive on, and in fairness Lanchkhuti is not a town that needs a day of its own.

    Two things are visible here that are not obvious elsewhere.

    The first is **agriculture**. Lanchkhuti municipality is Georgia's main tea and hazelnut district.
    In Soviet times thousands of hectares of plantation covered these hills; most were abandoned in the
    1990s, and the feral tea bushes are still legible on the slopes — still in rows, now grown tall. Some
    of it has been brought back in recent years and small producers have reappeared.

    The second is the southern part of **Kolkheti National Park**. West of Lanchkhuti lies the Imnati
    peat bog, one of the rarest ecosystems in Europe: a raised dome of sphagnum peat that has been accumulating
    for thousands of years. Getting into it is not straightforward and needs a guide, but the park administration
    can arrange information.

    In the town itself: a market where hazelnuts and honey are sold in autumn, a Soviet house of culture
    and a small park. An hour or two, and then on to the sea or to Ozurgeti.
  tip: >-
    One to two hours. The town is useful as a practical stop: cash machines, a pharmacy, a supermarket
    and fuel, all of which are patchier in Ureki and Grigoleti. The market works in the morning. Do not
    walk into the Kolkheti marshes on your own — there are no paths and the mosquitoes are unbearable;
    contact the park office first.
  route: >-
    From Tbilisi take the E60 west through Khashuri, Zestaponi and Kutaisi to Samtredia, then turn south
    — 298 km, about four hours twenty. The road is asphalt throughout and mostly four lanes and fast as
    far as Samtredia. Lanchkhuti is directly on the route and needs no detour. Fuel is available in Kutaisi
    and in Lanchkhuti itself. Parking in the centre is free and easy. An economy car is entirely sufficient.
ru:
  name: Ланчхути
  short: Северные ворота Гурии — город чая и фундука на краю колхидских болот.
  body: >-
    **Ланчхути — место, где вы въезжаете в Гурию.** Город стоит на главной дороге южнее Самтредиа, и именно
    отсюда расходятся пути на Уреки, Григолети и Озургети. Большинство проезжающих останавливаются заправиться
    и едут дальше — и, честно говоря, Ланчхути не тот город, которому нужен отдельный день.

    Зато здесь видны две вещи, которые в других местах не бросаются в глаза.

    Первая — **сельское хозяйство**. Ланчхутский муниципалитет — главный чайный и фундучный район Грузии.
    В советское время эти холмы покрывали тысячи гектаров плантаций; в 1990-е большую часть забросили,
    и одичавшие чайные кусты до сих пор читаются на склонах — всё ещё рядами, но уже высокие. Часть плантаций
    в последние годы восстановили, и небольшие производители появились снова.

    Вторая — южная часть **Колхидского национального парка**. Западнее Ланчхути лежит торфяник Имнати,
    одна из редчайших экосистем Европы: выпуклый купол сфагнового торфа, накапливавшийся тысячелетиями.
    Попасть туда непросто и нужен проводник, но администрация парка даёт информацию.

    В самом городе: рынок, где осенью продают фундук и мёд, советский дом культуры и небольшой парк. Час-другой
    — и дальше к морю или в Озургети.
  tip: >-
    Час-два. Город полезен как практическая остановка: банкоматы, аптека, супермаркет и заправка, с чем
    в Уреки и Григолети хуже. Рынок работает по утрам. В колхидские болота самостоятельно заходить не
    стоит: троп нет, а комары невыносимы; сначала свяжитесь с офисом парка.
  route: >-
    Из Тбилиси по E60 на запад через Хашури, Зестафони и Кутаиси до Самтредиа, затем на юг — 298 км, около
    четырёх часов двадцати минут. Дорога асфальтированная, до Самтредиа в основном четырёхполосная и быстрая.
    Ланчхути стоит прямо на маршруте, объезжать не нужно. Заправки в Кутаиси и в самом Ланчхути. Парковка
    в центре бесплатная и свободная. Машины эконом-класса вполне достаточно.
fa:
  name: لانچخوتی
  short: دروازهٔ شمالی گوریا — شهر چای و فندق در کنارهٔ مرداب‌های کلخیدا.
  body: >-
    **لانچخوتی جایی است که وارد گوریا می‌شوید.** شهر بر جادهٔ اصلی جنوب سامترِدیا نشسته و از همین‌جا راه‌ها
    به اورکی و گریگولتی و اوزورگتی جدا می‌شوند. بیشتر گذرندگان برای سوخت می‌ایستند و می‌روند، و انصافاً
    لانچخوتی شهری نیست که یک روز جداگانه بخواهد.

    اما دو چیز اینجا پیداست که جای دیگر آشکار نیست.

    نخست **کشاورزی**. شهرستان لانچخوتی مرکز اصلی چای و فندق گرجستان است. در دوران شوروی هزاران هکتار باغ
    چای این تپه‌ها را پوشانده بود؛ بیشترشان در دههٔ ۱۹۹۰ رها شدند و بوته‌های وحشی‌شدهٔ چای هنوز روی دامنه‌ها
    خوانده می‌شوند — هنوز ردیف‌ردیف، اما اکنون بلند. بخشی از آن‌ها در سال‌های اخیر احیا شده و تولیدکنندگان
    کوچک دوباره پیدا شده‌اند.

    دوم بخش جنوبی **پارک ملی کلخیدا**. غرب لانچخوتی تورب‌زار ایمناتی است، از نادرترین بوم‌سازگان‌های اروپا:
    گنبدی برآمده از تورب اسفاگنوم که هزاران سال است انباشته می‌شود. ورود به آن ساده نیست و راهنما می‌خواهد،
    اما ادارهٔ پارک اطلاعات می‌دهد.

    در خود شهر: بازاری که پاییز در آن فندق و عسل می‌فروشند، خانهٔ فرهنگ دوران شوروی و پارکی کوچک. یکی
    دو ساعت، و بعد به سوی دریا یا اوزورگتی.
  tip: >-
    یک تا دو ساعت. شهر به‌عنوان توقف کاربردی خوب است: خودپرداز، داروخانه، سوپرمارکت و پمپ بنزین، که همهٔ
    این‌ها در اورکی و گریگولتی ناقص‌ترند. بازار صبح‌ها کار می‌کند. به تنهایی وارد مرداب‌های کلخیدا نشوید؛
    مسیری نیست و پشه‌ها تحمل‌ناپذیرند. نخست با دفتر پارک تماس بگیرید.
  route: >-
    از تفلیس با E60 به غرب از خاشوری، زستافونی و کوتایسی تا سامترِدیا، سپس به جنوب — ۲۹۸ کیلومتر، حدود
    چهار ساعت و بیست دقیقه. جاده سرتاسر آسفالت است و تا سامترِدیا بیشتر چهاربانده و تندرو. لانچخوتی درست
    روی مسیر است و انحراف نمی‌خواهد. سوخت در کوتایسی و در خود لانچخوتی. پارکینگ مرکز رایگان و خالی است.
    خودروی اقتصادی کاملاً کافی است.
he:
  name: לנצ׳חותי
  short: שער הצפון של גוריה — עיירה של תה ואגוזי לוז בשולי ביצות קולחתי.
  body: >-
    **בלנצ׳חותי נכנסים לגוריה.** העיירה יושבת על הכביש הראשי מדרום לסמטרדיה, ומכאן מתפצלות הדרכים לאורקי,
    לגריגולטי ולאוזורגטי. רוב העוברים עוצרים לתדלק וממשיכים, ובצדק — לנצ׳חותי אינה עיירה שדורשת יום משלה.

    ובכל זאת נראים כאן שני דברים שאינם בולטים במקומות אחרים.

    הראשון הוא **החקלאות**. מחוז לנצ׳חותי הוא אזור התה ואגוזי הלוז המרכזי בגאורגיה. בתקופה הסובייטית כיסו
    את הגבעות האלה אלפי הקטרים של מטעים; רובם ננטשו בשנות התשעים, ושיחי התה שהתפראו עדיין קריאים על המדרונות
    — עדיין בשורות, אך כעת גבוהים. חלקם שוקמו בשנים האחרונות ויצרנים קטנים שבו והופיעו.

    השני הוא החלק הדרומי של **הפארק הלאומי קולחתי**. ממערב ללנצ׳חותי משתרעת ביצת הכבול אימנאטי, אחת המערכות
    האקולוגיות הנדירות באירופה: כיפה מורמת של כבול ספגנום שהצטברה במשך אלפי שנים. הכניסה אליה אינה פשוטה
    ודורשת מדריך, אך הנהלת הפארק מספקת מידע.

    בעיירה עצמה: שוק שבו נמכרים בסתיו אגוזי לוז ודבש, בית תרבות סובייטי ופארק קטן. שעה או שעתיים, ואז
    הלאה אל הים או לאוזורגטי.
  tip: >-
    שעה עד שעתיים. העיירה שימושית כעצירה מעשית: כספומטים, בית מרקחת, סופרמרקט ודלק, שכולם חלקיים באורקי
    ובגריגולטי. השוק פועל בבוקר. אל תיכנסו לבד לביצות קולחתי — אין שבילים והיתושים בלתי נסבלים; פנו קודם
    למשרד הפארק.
  route: >-
    מטביליסי בכביש E60 מערבה דרך חשורי, זסטאפוני וקוטאיסי עד סמטרדיה, ואז דרומה — 298 ק״מ, כארבע שעות
    ועשרים. הכביש סלול לכל אורכו, ועד סמטרדיה ברובו ארבעה נתיבים ומהיר. לנצ׳חותי נמצאת ממש על המסלול ואינה
    דורשת עקיפה. תדלוק בקוטאיסי ובלנצ׳חותי עצמה. החניה במרכז חינם ופנויה. רכב חסכוני מספיק לחלוטין.
ar:
  name: لانتشخوتي
  short: بوابة غوريا الشمالية — بلدة الشاي والبندق على حافة أهوار كولخيتي.
  body: >-
    **من لانتشخوتي تدخل غوريا.** تقوم البلدة على الطريق الرئيسي جنوب سامتريديا، ومن هنا تتفرع الدروب نحو
    أوريكي وغريغوليتي وأوزورغيتي. ومعظم العابرين يقفون للتزود بالوقود ويمضون، وبإنصاف ليست لانتشخوتي بلدة
    تحتاج يوماً خاصاً بها.

    غير أن شيئين يظهران هنا ولا يظهران بوضوح في مكان آخر.

    الأول **الزراعة**. بلدية لانتشخوتي هي منطقة الشاي والبندق الرئيسية في جورجيا. في العهد السوفيتي غطت
    آلاف الهكتارات من المزارع هذه التلال؛ وهُجر معظمها في التسعينيات، وما زالت شجيرات الشاي المتوحشة مقروءة
    على المنحدرات — لا تزال في صفوف، لكنها صارت عالية. وقد أُعيد إحياء بعضها في السنوات الأخيرة وعاد صغار
    المنتجين إلى الظهور.

    والثاني الجزء الجنوبي من **منتزه كولخيتي الوطني**. غرب لانتشخوتي يمتد مستنقع إيمناتي الخثي، وهو من
    أندر النظم البيئية في أوروبا: قبة مرتفعة من خث السفاغنوم تراكمت آلاف السنين. الدخول إليه ليس هيناً
    ويحتاج مرشداً، لكن إدارة المنتزه تقدم المعلومات.

    وفي البلدة نفسها: سوق يُباع فيه البندق والعسل خريفاً، وقصر ثقافة سوفيتي وحديقة صغيرة. ساعة أو ساعتان،
    ثم إلى البحر أو إلى أوزورغيتي.
  tip: >-
    ساعة إلى ساعتين. البلدة مفيدة كمحطة عملية: صرافات وصيدلية وسوبرماركت ووقود، وكلها أضعف في أوريكي وغريغوليتي.
    السوق يعمل صباحاً. ولا تدخل أهوار كولخيتي وحدك؛ فلا دروب فيها والبعوض لا يُحتمل. اتصل بمكتب المنتزه
    أولاً.
  route: >-
    من تبليسي غرباً على E60 عبر خاشوري وزستافوني وكوتايسي حتى سامتريديا، ثم جنوباً — 298 كم، نحو أربع
    ساعات وعشرين دقيقة. الطريق معبّد كله، وحتى سامتريديا رباعي المسارات وسريع في معظمه. ولانتشخوتي على
    المسار مباشرة ولا تحتاج انحرافاً. الوقود في كوتايسي وفي لانتشخوتي نفسها. الوقوف في الوسط مجاني ومتاح.
    وسيارة اقتصادية تكفي تماماً.
