ka:
  name: ლანჩხუთი
  short: >-
    გურიის ჩრდილოეთი კარიბჭე — ნოე ჟორდანიას სამშობლო, 1905 წლის გლეხთა აჯანყების კერა და ზღვამდე ბოლო
    დიდი გაჩერება.
  body: >-
    **მძღოლების უმეტესობა ლანჩხუთს მხოლოდ საქარე მინიდან ხედავს, ზღვისკენ მიმავალ გზაზე, და ვერც კი ამჩნევს,
    რომ აქ დაიბადა კაცი, რომელიც 1918–1921 წლებში დამოუკიდებელი საქართველოს მთავრობას ედგა სათავეში.**


    ნოე ჟორდანია 1868 წლის იანვარში, წვრილი მემამულის ოჯახში დაიბადა. ორმოცდაათი წლის შემდეგ ის საქართველოს
    დემოკრატიული რესპუბლიკის მთავრობას ხელმძღვანელობდა, სანამ 1921 წელს წითელი არმიის შემოჭრამ საფრანგეთში,
    ემიგრაციაში არ გადახვეწა; იქვე გარდაიცვალა 1953 წელს. 1919 წლის დამფუძნებელი კრების რამდენიმე სხვა
    წევრიც ლანჩხუთელი იყო.


    ეს შემთხვევითი არ ყოფილა. 1902 წელს ადგილობრივი მასწავლებელი გრიგოლ ურატაძე გურიის გლეხთა მოძრაობის
    ერთ-ერთი წამომწყები გახდა; 1903 წლის გაზაფხულზე გლეხებმა მემამულეთა მიწების იჯარით აღებაზე უარი თქვეს,
    1904 წლის 20 აპრილს კი პოლიციამ ჩასაფრებიდან მოძრაობის ორი წევრი მოკლა. 1905 წლის 22 ოქტომბერს აჯანყებულები
    ლანჩხუთის პოლიციაში შეიჭრნენ და იარაღი გაიტაცეს. 1922 წლის 26 მაისს ქალაქის ცენტრში დამოუკიდებლობის
    დღე აღნიშნეს — მიტინგი საბჭოთა ხელისუფლებამ დაარბია.


    რა ვნახოთ:

    - **მხარეთმცოდნეობის მუზეუმი** (დაარსდა 1978 წელს): ძვ. წ. IV საუკუნის ბრინჯაოს მუზარადი, კოლხური
    ბრინჯაოს ცულები, ნოე ჟორდანიას პირადი ნივთები და ამერიკაში ნამოგზაურები გურული მხედრების ნაკვალევი

    - **თეატრი** მთავარ მოედანზე, დეოდარებსა და პალმებს შორის: რვა სვეტი შეწყვილებული ლილვებით და კაპიტელებით,
    რომლებშიც კორინთული და ეგვიპტური ორდერი ერთმანეთს ერწყმის

    - აგარაკის უბნის მრგვალი, ფლეთილი ქვის ოთხმეტრიანი **სამრეკლო** — გამქრალი ეკლესიის თითქმის ერთადერთი
    კვალი


    გადმოცემით, თამარ მეფის ცხენებს აქამდე ხუთჯერ გამოუცვალეს ლანჩი და სახელიც აქედან წამოვიდა; ენათმეცნიერები
    კი მეგრულ-ჭანურ ძირს ხედავენ და სახელს „საძროხედ“ ან „სამზერად“ განმარტავენ. ქალაქის დასავლეთით კოლხეთის
    ტორფნარები იწყება. საწვავისთვის, რა თქმა უნდა, გაჩერდით — ოღონდ მუზეუმსაც ერთი საათი აჩუქეთ.
  tip: >-
    ქალაქს ერთი-ორი საათი დაუთმეთ. მუზეუმის სამუშაო საათები სანდოდ არსად ქვეყნდება, ამიტომ ადგილზე წინასწარ
    იკითხეთ. ლანჩხუთი მარშრუტის პრაქტიკული გაჩერებაცაა: ბანკომატი, აფთიაქი, სუპერმარკეტები და საწვავი,
    რაც ურეკსა და გრიგოლეთში გაცილებით ნაკლებია. ბაზარი დილითაა ყველაზე ცოცხალი, შემოდგომაზე — თხილითა
    და თაფლით. ცენტრში მანქანის დაყენება უფასო და იოლია. კოლხეთის ჭაობებში დამოუკიდებლად ნუ შეხვალთ: ბილიკები
    არ არის, კოღო კი დაუნდობელია — ჯერ ეროვნული პარკის ადმინისტრაციას დაუკავშირდით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ხაშურის, ზესტაფონისა და ქუთაისის გავლით სამტრედიამდე,
    შემდეგ სამხრეთით, ს12-ზე — 298 კმ, დაახლოებით ოთხი საათი და ოცი წუთი. გზა ბოლომდე ასფალტიანია: სამტრედიამდე
    სწრაფი, უმეტესად ოთხზოლიანი, შემდეგ ჩვეულებრივი ორზოლიანი. ლანჩხუთი პირდაპირ ს12-ზე დგას და გადახვევა
    არ სჭირდება; აქ გზა იყოფა — სამხრეთით ოზურგეთისკენ, დასავლეთით კი გრიგოლეთისა და ზღვისკენ. საწვავი
    ქუთაისში, სამტრედიასა და თავად ლანჩხუთშია. ეკონომკლასის მანქანა სრულიად საკმარისია.
en:
  name: Lanchkhuti
  short: >-
    Guria's northern gateway: birthplace of Noe Zhordania, a hotbed of the 1905 peasant revolt, and the
    last big stop before the sea.
  body: >-
    **Most drivers see Lanchkhuti only through the windscreen on the way to the sea, and never notice
    that the man who led independent Georgia's government from 1918 to 1921 was born here.**


    Noe Zhordania came into the world in January 1868, into a family of minor landowners. Fifty years
    later he chaired the government of the Democratic Republic of Georgia, until the Red Army invasion
    of 1921 drove him into exile in France, where he died in 1953. Several other members of the 1919 Constituent
    Assembly were Lanchkhuti men too.


    That was no accident. In 1902 a local schoolteacher, Grigol Uratadze, was among those who started
    the Gurian peasant movement; in the spring of 1903 villagers refused to rent the landlords' fields,
    and on 20 April 1904 police killed two activists from ambush. On 22 October 1905 insurgents stormed
    the town's police station and carried off its weapons. On 26 May 1922 the town gathered to mark Independence
    Day, and the Soviet authorities broke the rally up.


    What to see:

    - the **Museum of Local Lore** (founded 1978): a 4th-century BC bronze helmet, Colchian bronze axes,
    Zhordania's personal belongings, and mementoes of the Gurian horsemen who travelled to America

    - the **theatre** on the main square, among deodars and palms: eight columns with paired shafts and
    capitals that blend the Corinthian and Egyptian orders

    - the round rubble-stone **bell tower** in the Agaraki quarter, four metres tall, all but the last
    trace of a vanished church


    Tradition says Queen Tamar's horses had to be reshod five times before they got here, and the name
    grew from that; linguists prefer a Megrelian-Laz root meaning "cattle place" or "lookout". West of
    the town, the peat bogs of Kolkheti begin. Stop for fuel, by all means — then give the museum an hour.
  tip: >-
    Give the town one to two hours. Museum hours are not published reliably, so ask locally before counting
    on it. Lanchkhuti is also the practical stop of the route: cash machines, a pharmacy, supermarkets
    and fuel, all thinner on the ground in Ureki and Grigoleti. The market is liveliest in the morning,
    with hazelnuts and honey in autumn. Parking in the centre is free and easy. Do not walk into the Kolkheti
    marshes on your own: there are no paths and the mosquitoes are merciless, so contact the national
    park administration first.
  route: >-
    From Tbilisi take the S1 (E60) west past Khashuri, Zestaponi and Kutaisi to Samtredia, then turn south
    onto the S12 — 298 km, about four hours twenty. It is asphalt throughout: fast, largely dual carriageway
    to Samtredia, then an ordinary two-lane road. Lanchkhuti sits directly on the S12, so there is no
    detour; here the roads divide, south to Ozurgeti and west to Grigoleti and the sea. Fuel in Kutaisi,
    Samtredia and Lanchkhuti itself. An economy car is entirely sufficient.
ru:
  name: Ланчхути
  short: >-
    Северные врата Гурии: родина Ноя Жордании, очаг крестьянского восстания 1905 года и последний крупный
    пункт перед морем.
  body: >-
    **Большинство водителей видят Ланчхути лишь через лобовое стекло на пути к морю и даже не замечают,
    что здесь родился человек, возглавлявший правительство независимой Грузии с 1918 по 1921 год.**


    Ной Жордания появился на свет в январе 1868 года, в семье мелких землевладельцев. Пятьдесят лет спустя
    он возглавил правительство Демократической Республики Грузия, пока вторжение Красной армии в 1921
    году не вынудило его отправиться в изгнание во Францию, где он умер в 1953 году. Несколько других
    членов Учредительного собрания 1919 года были уроженцами Ланчхути.


    Это было не случайно. В 1902 году местный учитель Григол Уратадзе стоял у истоков гурийского крестьянского
    движения; весной 1903 года крестьяне отказались арендовать помещичьи поля, а 20 апреля 1904 года полиция
    из засады убила двух активистов. 22 октября 1905 года повстанцы взяли штурмом городской полицейский
    участок и вынесли из него оружие. 26 мая 1922 года город собрался, чтобы отметить День независимости,
    и советские власти разогнали митинг.


    Что стоит увидеть:

    - **краеведческий музей** (основан в 1978 году): бронзовый шлем IV века до н. э., колхидские бронзовые
    топоры, личные вещи Жордании и памятные предметы гурийских всадников, побывавших в Америке

    - **театр** на главной площади, среди гималайских кедров и пальм: восемь колонн с парными стволами
    и капителями, соединяющими коринфский и египетский ордера

    - круглую **колокольню** из бутового камня в квартале Агараки, высотой четыре метра, — почти всё,
    что осталось от исчезнувшей церкви


    Предание гласит, что лошадей царицы Тамар пришлось перековывать пять раз, прежде чем они добрались
    до этого места, и отсюда пошло название; лингвисты же склоняются к мегрело-занской основе со значением
    «пастбище для скота» или «дозорное место». Западнее города начинаются торфяные болота Колхети. Заправьтесь,
    конечно, — а затем дайте музею час своего времени.
  tip: >-
    Дайте городу час-два. Надёжного расписания музея нигде нет, так что уточните часы работы на месте.
    Ланчхути — это ещё и практическая остановка маршрута: банкоматы, аптека, супермаркеты и заправки,
    которых заметно меньше в Уреки и Григолети. Рынок наиболее оживлён по утрам, осенью там продают фундук
    и мёд. Парковка в центре бесплатная и без хлопот. Не заходите в болота Колхети одни: там нет троп,
    а комары беспощадны, так что сначала свяжитесь с администрацией национального парка.
  route: >-
    Из Тбилиси езжайте по S1 (E60) на запад через Хашури, Зестафони и Кутаиси до Самтредиа, затем сверните
    на юг на S12 — 298 км, около четырёх часов двадцати минут. Асфальт на всём протяжении: до Самтредиа
    быстрая трасса, в основном с разделительной полосой, затем обычная двухполосная дорога. Ланчхути стоит
    прямо на S12, так что объезда нет; здесь дороги расходятся — на юг к Озургети и на запад к Григолети
    и морю. Заправиться можно в Кутаиси, Самтредиа и самом Ланчхути. Обычной легковой машины хватит вполне.
fa:
  name: لانچخوتی
  short: 'دروازهٔ شمالی گوریا: زادگاه نوئه ژوردانیا، کانون شورش دهقانی سال ۱۹۰۵، و آخرین توقف بزرگ پیش
    از دریا.'
  body: >-
    **بیشتر رانندگان لانچخوتی را تنها از پس شیشهٔ جلوی خودرو، در راه دریا، می‌بینند و هرگز درنمی‌یابند
    که مردی که از سال ۱۹۱۸ تا ۱۹۲۱ دولت گرجستان مستقل را رهبری کرد، همین‌جا زاده شده است.**


    نوئه ژوردانیا در ژانویهٔ ۱۸۶۸، در خانواده‌ای از زمین‌داران کوچک، به دنیا آمد. پنجاه سال بعد، ریاست
    دولت جمهوری دموکراتیک گرجستان را در دست گرفت، تا آنکه یورش ارتش سرخ در سال ۱۹۲۱ او را به تبعید در
    فرانسه راند، جایی که در سال ۱۹۵۳ درگذشت. چند تن دیگر از اعضای مجمع مؤسسان سال ۱۹۱۹ نیز از مردان لانچخوتی
    بودند.


    این تصادفی نبود. در سال ۱۹۰۲ معلمی محلی به نام گریگول اوراتادزه از کسانی بود که جنبش دهقانی گوریا
    را بنیان نهادند؛ در بهار ۱۹۰۳ روستاییان از اجاره‌کردن زمین‌های ملاکان سر باز زدند، و در ۲۰ آوریل ۱۹۰۴
    پلیس از کمین دو فعال را کشت. در ۲۲ اکتبر ۱۹۰۵ شورشیان به کلانتری شهر یورش بردند و اسلحه‌های آن را
    با خود بردند. در ۲۶ مه ۱۹۲۲ شهر برای بزرگداشت روز استقلال گرد آمد، و مقامات شوروی این تجمع را برهم
    زدند.


    چیزهایی که باید دید:

    - **موزهٔ تاریخ و فرهنگ محلی** (بنیان‌گذاری‌شده در ۱۹۷۸): کلاهخودی برنزی از سدهٔ چهارم پیش از میلاد،
    تبرهای برنزی کولخیایی، اشیای شخصی ژوردانیا و یادگارهای سوارکاران گوریایی که به آمریکا سفر کردند

    - **تئاتر** در میدان اصلی، میان درختان سدر هیمالیایی و نخل‌ها: هشت ستون با ساقه‌های جفت‌شده و سرستون‌هایی
    که سبک کورنتی و مصری را در هم می‌آمیزند

    - **برج ناقوسیِ** گردِ سنگ‌چین در محلهٔ آگاراکی، به ارتفاع چهار متر — تنها بازماندهٔ کلیسایی از میان‌رفته


    روایت می‌گوید که اسبان ملکه تامار پیش از رسیدن به این‌جا پنج بار نو نعل شدند، و نام شهر از همین‌جا
    آمده است؛ اما زبان‌شناسان ریشه‌ای مگرلی-لازی به معنای «جای دام» یا «دیدگاه» را ترجیح می‌دهند. در غرب
    شهر، تالاب‌های تورب‌دار کولخِتی آغاز می‌شوند. البته برای سوخت‌گیری توقف کنید — اما یک ساعت هم به موزه
    بدهید.
  tip: >-
    به شهر یک تا دو ساعت زمان بدهید. ساعات کاری موزه به‌طور مطمئن اعلام نشده، پس پیش از آنکه رویش حساب
    کنید، از مردم محل بپرسید. لانچخوتی همچنین توقف کاربردی مسیر است: دستگاه خودپرداز، داروخانه، سوپرمارکت
    و سوخت، همه چیزهایی که در اورکی و گریگولتی کمترند. بازار در صبح‌ها پرجنب‌وجوش‌ترین است و در پاییز
    فندق و عسل عرضه می‌شود. پارک خودرو در مرکز شهر رایگان و آسان است. به‌تنهایی به تالاب‌های کولخِتی نروید:
    راهی نیست و پشه‌ها بی‌رحم‌اند، پس نخست با مدیریت پارک ملی تماس بگیرید.
  route: >-
    از تفلیس در مسیر S1 (E60) به سوی غرب و از کنار خاشوری، زستافونی و کوتایسی تا سامتردیا برانید، سپس
    به سوی جنوب به S12 بپیچید — ۲۹۸ کیلومتر، حدود چهار ساعت و بیست دقیقه. تمام مسیر آسفالت است: تا سامتردیا
    بزرگ‌راهی سریع و اغلب دوخطه در هر سو، و سپس جاده‌ای معمولی و دوخطه. لانچخوتی درست بر روی S12 قرار
    دارد، پس انحرافی از مسیر لازم نیست؛ در همین‌جا جاده‌ها از هم جدا می‌شوند، به جنوب به اوزورگتی و به
    غرب به گریگولتی و دریا. در کوتایسی، سامتردیا و خودِ لانچخوتی می‌توانید سوخت بگیرید. یک خودروی معمولی
    کاملاً کافی است.
he:
  name: לנצ'חוטי
  short: 'שער הצפון של גוריה: מקום הולדתו של נואה ז''ורדניה, מוקד המרד האיכרי של 1905, והתחנה הגדולה האחרונה
    לפני הים.'
  body: >-
    **רוב הנוסעים רואים את לנצ'חוטי רק מבעד לשמשה הקדמית בדרכם לים, ולעולם אינם שמים לב שהאיש שעמד בראש
    ממשלת גאורגיה העצמאית בין 1918 ל-1921 נולד כאן.**


    נואה ז'ורדניה נולד בינואר 1868, למשפחת בעלי אחוזה קטנים. חמישים שנה לאחר מכן עמד בראש ממשלת הרפובליקה
    הדמוקרטית של גאורגיה, עד שפלישת הצבא האדום ב-1921 שלחה אותו לגלות בצרפת, שם מת ב-1953. גם כמה מחברי
    האספה המכוננת של 1919 היו יוצאי לנצ'חוטי.


    זה לא היה מקרי. ב-1902 היה מורה מקומי, גריגול אוראטדזה, בין מי שיסדו את תנועת האיכרים הגוריאנית; באביב
    1903 סירבו הכפריים לשכור את שדות בעלי האחוזות, וב-20 באפריל 1904 הרגה המשטרה ממארב שני פעילים. ב-22
    באוקטובר 1905 הסתערו מורדים על תחנת המשטרה בעיר ולקחו משם את כלי הנשק. ב-26 במאי 1922 התאספה העיר
    לחגוג את יום העצמאות, והשלטונות הסובייטיים פירקו את העצרת בכוח.


    מה לראות:

    - **מוזיאון המורשת המקומית** (נוסד 1978): קסדת ברונזה מהמאה ה-4 לפנה"ס, גרזני ברונזה קולכיים, חפציו
    האישיים של ז'ורדניה ומזכרות מהפרשים הגוריאנים שנסעו לאמריקה

    - ה**תיאטרון** בכיכר הראשית, בין ארזי הימלאיה ודקלים: שמונה עמודים בעלי גזעים כפולים וכותרות המשלבות
    בין הסדר הקורינתי למצרי

    - **מגדל הפעמונים** העגול מאבן שדה ברובע אגרקי, בגובה ארבעה מטרים — כל מה שנותר, פחות או יותר, מכנסייה
    שנעלמה


    המסורת מספרת שסוסיה של המלכה תמר נדרשו לחמישה חילופי פרסות בטרם הגיעו לכאן, ומכך נובע השם; בלשנים
    מעדיפים שורש מגרלי-לזי שמשמעו "מקום בקר" או "מצפה". ממערב לעיר מתחילות ביצות הכבול של קולחתי. עצרו
    לתדלוק, בהחלט — ואז הקדישו למוזיאון שעה.
  tip: >-
    הקדישו לעיר שעה עד שעתיים. שעות המוזיאון אינן מפורסמות באופן אמין, אז שאלו במקום לפני שסומכים על כך.
    לנצ'חוטי היא גם התחנה המעשית של המסלול: כספומטים, בית מרקחת, סופרמרקטים ותדלוק, כל אלה נדירים יותר
    באורקי ובגריגולטי. השוק תוסס במיוחד בבוקר, עם אגוזי לוז ודבש בסתיו. חנייה במרכז חינם ונוחה. אל תיכנסו
    לביצות קולחתי לבדכם: אין שם שבילים והיתושים חסרי רחמים, אז פנו קודם למנהלת הגן הלאומי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, חלפו על פני חשורי, זסטפוני וקוטאיסי עד סמטרדיה, ואז פנו דרומה ל-S12
    — 298 ק"מ, כארבע שעות ועשרים דקות. הכביש סלול כל הדרך: כביש מהיר, ברובו דו-מסלולי, עד סמטרדיה, ואז
    כביש רגיל בשני נתיבים. לנצ'חוטי שוכנת ממש על S12, כך שאין צורך בעיקוף; כאן מתפצלות הדרכים, דרומה לאוזורגתי
    ומערבה לגריגולטי ולים. אפשר לתדלק בקוטאיסי, בסמטרדיה ובלנצ'חוטי עצמה. רכב פשוט מספיק בהחלט.
ar:
  name: لانتشخوتي
  short: 'بوابة غوريا الشمالية: مسقط رأس نوي جوردانيا، وبؤرة ثورة الفلاحين عام 1905، وآخر محطة كبرى قبل
    البحر.'
  body: >-
    **يرى معظم السائقين لانتشخوتي فقط من خلف زجاج السيارة الأمامي في طريقهم إلى البحر، ولا يلاحظون أبدًا
    أن الرجل الذي قاد حكومة جورجيا المستقلة من 1918 إلى 1921 وُلد هنا.**


    وُلد نوي جوردانيا في يناير 1868، في عائلة من ملّاك الأرض الصغار. وبعد خمسين عامًا رأس حكومة جمهورية
    جورجيا الديمقراطية، إلى أن دفعه غزو الجيش الأحمر في عام 1921 إلى المنفى في فرنسا، حيث توفي عام 1953.
    وكان عدد آخر من أعضاء الجمعية التأسيسية لعام 1919 أيضًا من رجال لانتشخوتي.


    لم يكن ذلك محض صدفة. في عام 1902 كان معلّم محلي، غريغول أوراتادزه، من بين من أطلقوا حركة الفلاحين
    الغورية؛ وفي ربيع 1903 رفض القرويون استئجار حقول الملاكين، وفي 20 أبريل 1904 قتلت الشرطة من كمين ناشطين
    اثنين. وفي 22 أكتوبر 1905 هاجم الثوار مركز شرطة البلدة وحملوا أسلحته. وفي 26 مايو 1922 تجمّعت البلدة
    للاحتفال بيوم الاستقلال، ففرّقت السلطات السوفيتية التجمّع.


    ما يجدر رؤيته:

    - **متحف التراث المحلي** (تأسس عام 1978): خوذة برونزية من القرن الرابع قبل الميلاد، وفؤوس برونزية
    كولخية، ومقتنيات جوردانيا الشخصية، وتذكارات فرسان غوريا الذين سافروا إلى أمريكا

    - **المسرح** في الساحة الرئيسية، بين أرز الهيمالايا والنخيل: ثمانية أعمدة بسيقان مزدوجة وتيجان تمزج
    الطراز الكورنثي بالمصري

    - **برج الجرس** الدائري من الحجر الغشيم في حي أغاراكي، بارتفاع أربعة أمتار — كل ما تبقّى تقريبًا من
    كنيسة اختفت


    يقول التراث الشعبي إن خيول الملكة تامار احتاجت إلى إعادة تنعيل خمس مرات قبل أن تصل إلى هنا، ومن ذلك
    جاء الاسم؛ أما اللغويون فيفضّلون جذرًا ميغريليًا-لازيًا معناه «مكان الماشية» أو «نقطة الرصد». غرب
    البلدة تبدأ مستنقعات الخُث في كولخيتي. توقف للتزود بالوقود، بكل تأكيد — ثم أعطِ المتحف ساعة من وقتك.
  tip: >-
    خصّص للبلدة ساعة إلى ساعتين. لا تُنشر مواعيد المتحف بشكل موثوق، فاستفسر محليًا قبل الاعتماد عليها.
    لانتشخوتي أيضًا محطة عملية على الطريق: أجهزة صرّاف آلي، صيدلية، سوبرماركت ووقود، وكل ذلك أكثر ندرة
    في أوريكي وغريغوليتي. السوق أكثر حيوية في الصباح، ويُعرض فيه البندق والعسل في الخريف. ركن السيارة
    في وسط البلدة مجاني وسهل. لا تدخل مستنقعات كولخيتي بمفردك: فلا مسارات هناك والبعوض لا يرحم، فاتصل
    أولًا بإدارة الحديقة الوطنية.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا مرورًا بخاشوري وزستافوني وكوتايسي حتى سامتريديا، ثم انعطف جنوبًا
    إلى S12 — 298 كم، نحو أربع ساعات وعشرين دقيقة. الطريق معبّد بالكامل: سريع، ومزدوج المسار غالبًا حتى
    سامتريديا، ثم طريق عادي بمسارين. تقع لانتشخوتي مباشرة على S12، فلا حاجة إلى انحراف؛ وهنا تتفرّع الطرق،
    جنوبًا إلى أوزورغيتي وغربًا إلى غريغوليتي والبحر. يمكنك التزود بالوقود في كوتايسي وسامتريديا وفي لانتشخوتي
    نفسها. سيارة اقتصادية عادية تكفي تمامًا.
