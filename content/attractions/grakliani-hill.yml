ka:
  name: გრაკლიანი გორა
  short: >-
    მაგისტრალისპირა ბორცვი, 2007 წელს გზის მშენებლებმა რომ იპოვეს; ქალღმერთის ტაძრის ნიშნები შესაძლოა
    კავკასიის უძველესი დამწერლობა იყოს.
  body: >-
    **გრაკლიანი გორა გზის მშენებლებმა იპოვეს: 2007 წელს, თბილისის დასავლეთით მაგისტრალის გაფართოებისას,
    ტექნიკა ბორცვს შეეჭრა, რომელშიც ქართლის ათასწლეულები აღმოჩნდა.**


    მას შემდეგ აქ ყოველ სეზონზე თბილისის სახელმწიფო უნივერსიტეტის სტუდენტები და მეცნიერები თხრიან, არქეოლოგ
    ვახტანგ ლიჩელის ხელმძღვანელობით. ბორცვზე ცხოვრება ენეოლითიდან გვიან ელინისტურ ხანამდე გრძელდებოდა,
    ექსპედიცია კი ვარაუდობს, რომ ადამიანი აქ გაცილებით ადრეც, შესაძლოა 300 000 წლის წინაც, ჩნდებოდა. მხოლოდ
    პირველ ორ თვეში ასობით სამარხიდან და ნასახლარიდან 35 000-ზე მეტი ნივთი ამოიღეს: ბავშვის სათამაშოები,
    იარაღი, ძვ. წ. VI საუკუნის მოოქროვილი და ამოტვიფრული ოქროსა და ბრინჯაოს დისკოები, სამკურნალო საქმისთვის
    განკუთვნილად მიჩნეული ხელსაწყოები და ძვ. წ. IV საუკუნის იშვიათი საბეჭდავი დოკუმენტების დასამოწმებლად.
    აქვეა ადრებრინჯაოს ხანის ორმოსამარხები და დაახლოებით ძვ. წ. 450–350 წლების სამოთახიანი სახლი სათავსებით.


    ბორცვის გული ძვ. წ. VII საუკუნის ნაყოფიერების ქალღმერთის ტაძარია, დიდი მორთული საკულტო ღუმელით, რომელსაც
    გამთხრელები უპრეცედენტოს უწოდებენ. 2015 წელს უხელფასო მოხალისე სტუდენტებმა ჩამოქცეული საკურთხევლის
    ქვეშ ამოკვეთილი ნიშნების მწკრივები იპოვეს. ლიჩელის ექსპედიცია მიიჩნევს, რომ ეს ადგილობრივი დამწერლობაა,
    რეგიონში აქამდე ცნობილ ადგილობრივ დამწერლობაზე დაახლოებით ათასი წლით ძველი, და რამდენიმე ნიშანი ბერძნულ
    და არამეულ ასოებს მოგვაგონებს; ენათმეცნიერმა კუკური ფიფიამ კი მისი ქართული დამწერლობის სამივე სახეობასთან
    ნათესაობა ივარაუდა. წაკითხვა ჯერ ღიაა.


    რასაც აქ ნახავთ, მოქმედი გათხრებია და არა მუზეუმი: საფეხურებად ჩაჭრილი თხრილები, ქვის საძირკვლები,
    საინფორმაციო დაფები და ქვემოთ, ორიოდე ნაბიჯზე, მაგისტრალზე მიმავალი სატვირთოები. ბორცვის თხემზე დადექით
    და საკურთხევლის გარშემო ატეხილი დავა უცებ პირადი გახდება: ვიღაცას, სწორედ ამ ბორცვზე, რაღაცის ჩაწერა
    მოუნდა.
  tip: >-
    ორმოცდახუთი წუთი საკმარისია. ბილიკი მიწისაა, თხრილების კიდეები კი იშლება: მონიშნულ გზას არ გადაუხვიოთ
    და გათხრებში არასოდეს ჩახვიდეთ. ჩრდილი არ არის — ზაფხულში ქუდი და წყალი აუცილებელია. ადგილზე არც ტუალეტია,
    არც კაფე; იგოეთის გზისპირა მომსახურებით ისარგებლეთ. ყველაზე ცოცხალი სურათი თბილი თვეებისაა, როცა უნივერსიტეტის
    ექსპედიცია მუშაობს და სტუდენტები ხშირად სიამოვნებით აგიხსნით, რა ამოდის მიწიდან. 10 კმ-ში სამთავისის
    ტაძარია — კარგი წყვილი.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ იგოეთამდე — დაახლოებით 55 კმ სწრაფი, ოთხზოლიანი
    გზა. ბორცვი მაგისტრალის ჩრდილოეთ მხარეს, ზემო რენესთან, იგოეთის კვანძის ოდნავ დასავლეთით აღმართულა
    — თბილისიდან მიმავალს მარჯვნივ დაგხვდებათ. მაგისტრალიდან იგოეთთან გადადით და ბოლო ორიოდე კილომეტრი
    ადგილობრივი გზით ბორცვის ძირამდე იარეთ; მაჩვენებლები პატარაა, ამიტომ ნავიგატორში კოორდინატები ჩაწერეთ:
    41.9967, 44.4047. სულ დაახლოებით 58 კმ და ორმოცდაათი წუთი. საწვავი იგოეთშია. ეკონომ-კლასის ავტომობილი
    სავსებით საკმარისია.
en:
  name: Grakliani Hill
  short: >-
    A mound beside the Tbilisi–Gori motorway, found by road-builders in 2007, where a goddess's temple
    hid signs that may be the Caucasus's oldest script.
  body: >-
    **Grakliani Hill was found by road-builders: in 2007, widening the motorway west of Tbilisi, the machines
    cut into a mound that turned out to hold thousands of years of Kartli.**


    Since then students and staff of Tbilisi State University, led by the archaeologist Vakhtang Licheli,
    have dug it season after season. Occupation runs from the Chalcolithic to the late Hellenistic age,
    and the team believes people may have used the hill far earlier, possibly 300,000 years ago. In the
    first two months alone they lifted more than 35,000 objects from hundreds of graves and settlement
    ruins: children's toys, weapons, gilded and engraved discs of gold and bronze from the 6th century
    BC, instruments they read as pharmacological, and a rare 4th-century BC seal for stamping documents.
    There are early Bronze Age pit burials too, and a three-room house with storerooms from about 450–350
    BC.


    The heart of the hill is a 7th-century BC temple to a fertility goddess, with a large decorated ritual
    oven the excavators call unprecedented. In 2015 unpaid student volunteers, clearing beneath its collapsed
    altar, found rows of carved signs. Licheli's team argues they are a local script roughly a thousand
    years older than any native writing previously known in the Caucasus, with a few letters that recall
    Greek and Aramaic; the linguist Kukuri Pipia has proposed a kinship with the three Georgian alphabets
    instead. The reading remains open.


    What you find is a working excavation, not a museum: stepped trenches, stone footings, information
    panels, and the lorries of the motorway a stone's throw below. Stand on the top and the argument over
    the altar turns personal. Somebody, on this very hill, wanted to write something down.
  tip: >-
    Forty-five minutes is enough. The path is bare earth and trench edges crumble: stay on the marked
    route and never climb down into the excavations. There is no shade, so bring a hat and water in summer.
    No toilets or café on site; use the roadside services at Igoeti. The site is at its most alive when
    the university team is digging in the warm months, and students will often explain what is coming
    out of the ground. Samtavisi Cathedral, 10 km away, makes a natural pairing.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi to Igoeti, about 55 km of fast dual carriageway. The
    mound rises right beside the motorway on its north side at Zemo Rene, just west of the Igoeti junction
    — on your right as you drive from Tbilisi. Leave the motorway at Igoeti and follow the local road
    the last couple of kilometres to the foot of the hill; signs are small, so set your navigation to
    41.9967, 44.4047. Around 58 km and 50 minutes in all. Fuel at Igoeti. An economy car is entirely sufficient.
ru:
  name: Холм Граклиани
  short: >-
    Холм у трассы Тбилиси — Гори, найденный дорожниками в 2007 году: в храме богини здесь скрывались знаки
    — возможно, древнейшая письменность Кавказа.
  body: >-
    **Холм Граклиани нашли дорожники: в 2007 году, расширяя автомагистраль к западу от Тбилиси, техника
    врезалась в холм, в котором, как оказалось, лежали тысячелетия Картли.**


    С тех пор студенты и сотрудники Тбилисского государственного университета во главе с археологом Вахтангом
    Личели раскапывают его сезон за сезоном. Слои обитания тянутся от энеолита до позднеэллинистической
    эпохи, а команда считает, что люди, возможно, бывали на холме гораздо раньше — быть может, 300 000
    лет назад. Уже за первые два месяца из сотен погребений и руин поселения подняли больше 35 000 предметов:
    детские игрушки, оружие, позолоченные и гравированные диски из золота и бронзы VI века до н. э., инструменты,
    которые исследователи считают фармакологическими, и редкую печать IV века до н. э. для скрепления
    документов. Есть и ямные погребения ранней бронзы, и трёхкомнатный дом с кладовыми примерно 450–350
    годов до н. э.


    Сердце холма — храм богини плодородия VII века до н. э. с большой украшенной ритуальной печью, которую
    археологи называют беспрецедентной. В 2015 году студенты-волонтёры, бесплатно расчищавшие место под
    обрушившимся алтарём, нашли ряды вырезанных знаков. Команда Личели утверждает, что это местная письменность
    примерно на тысячу лет древнее любой местной письменности, известной прежде на Кавказе, и несколько
    знаков напоминают греческие и арамейские буквы; лингвист Кукури Пипиа, напротив, предположил родство
    с тремя грузинскими алфавитами. Вопрос о прочтении остаётся открытым.


    Здесь вас ждёт не музей, а действующие раскопки: ступенчатые траншеи, каменные основания стен, информационные
    стенды и фуры на автомагистрали — рукой подать, внизу. Встаньте на вершине, и спор об алтаре становится
    личным. Кто-то на этом самом холме хотел что-то записать.
  tip: >-
    Сорока пяти минут достаточно. Тропа — голая земля, а края траншей осыпаются: держитесь размеченного
    маршрута и ни в коем случае не спускайтесь в раскопы. Тени нет, так что летом возьмите шляпу и воду.
    Туалетов и кафе на месте нет; пользуйтесь придорожным сервисом в Игоэти. Живее всего здесь в тёплые
    месяцы, когда копает университетская экспедиция, — студенты часто охотно объясняют, что выходит из
    земли. Естественная пара для поездки — собор Самтависи в 10 км отсюда.
  route: >-
    Из Тбилиси езжайте на запад по автомагистрали S1 (E60) до Игоэти — около 55 км по быстрой четырёхполосной
    дороге. Холм поднимается прямо у трассы, с северной стороны, у Земо-Рене, чуть западнее развязки Игоэти,
    — справа, если ехать из Тбилиси. Съезжайте с магистрали в Игоэти и последние пару километров до подножия
    холма езжайте по местной дороге; указатели маленькие, поэтому задайте в навигаторе 41.9967, 44.4047.
    Всего около 58 км и 50 минут. Заправка в Игоэти. Машины эконом-класса более чем достаточно.
fa:
  name: تپهٔ گراکلیانی
  short: >-
    تپه‌ای کنار بزرگراه تفلیس–گوری که جاده‌سازان در ۲۰۰۷ یافتند؛ در معبد الهه‌ای در آن نشانه‌هایی پنهان
    بود که شاید کهن‌ترین خط قفقاز باشد.
  body: >-
    **تپهٔ گراکلیانی را جاده‌سازان یافتند: در ۲۰۰۷، هنگام تعریض بزرگراه غرب تفلیس، ماشین‌آلات در دل تپه‌ای
    بریدند که معلوم شد هزاران سال از تاریخ کارتلی را در خود نگه داشته است.**


    از آن پس دانشجویان و کارکنان دانشگاه دولتی تفلیس به سرپرستی باستان‌شناس واختانگ لیچلی فصل به فصل در
    آن کاوش کرده‌اند. آثار سکونت از دوران مس‌سنگی تا اواخر دوران هلنیستی امتداد دارد، و گروه کاوش بر این
    باور است که انسان‌ها شاید بسیار پیش‌تر، احتمالاً ۳۰۰٬۰۰۰ سال پیش، از این تپه بهره می‌بردند. تنها در
    دو ماه نخست بیش از ۳۵٬۰۰۰ شیء از صدها گور و ویرانهٔ سکونتگاه بیرون آمد: اسباب‌بازی کودکان، جنگ‌افزار،
    دیسک‌هایی از طلا و مفرغ، زراندود و کنده‌کاری‌شده، از سدهٔ ششم پیش از میلاد، ابزارهایی که کاوشگران
    آن‌ها را دارویی می‌دانند، و مُهری کمیاب از سدهٔ چهارم پیش از میلاد برای مهر زدن بر اسناد. گورهای گودالی
    از آغاز عصر مفرغ هم هست، و خانه‌ای سه‌اتاقه با انبارها از حدود ۴۵۰ تا ۳۵۰ پیش از میلاد.


    قلب تپه معبدی از سدهٔ هفتم پیش از میلاد است برای الههٔ باروری، با تنوری آیینی، بزرگ و آراسته، که کاوشگران
    آن را بی‌سابقه می‌خوانند. در ۲۰۱۵ دانشجویانی داوطلب و بی‌مزد، هنگام پاک‌سازی زیر قربانگاه فروریختهٔ
    آن، ردیف‌هایی از نشانه‌های کنده‌کاری‌شده یافتند. گروه لیچلی بر آن است که این‌ها خطی بومی‌اند، حدود
    هزار سال کهن‌تر از هر خط بومی که پیش‌تر در قفقاز شناخته شده بود، و چند حرفشان یادآور یونانی و آرامی
    است؛ اما کوکوری پیپیا، زبان‌شناس، در عوض خویشاوندی با سه الفبای گرجی را پیشنهاد کرده است. خوانش آن
    هنوز محل بحث است.


    آنچه می‌یابید کاوشی در جریان است، نه موزه: ترانشه‌های پلکانی، پی‌های سنگی، تابلوهای اطلاع‌رسانی، و
    کامیون‌های بزرگراه که چند قدم پایین‌تر می‌گذرند. بر فراز تپه بایستید تا بحث بر سر آن قربانگاه رنگی
    شخصی بگیرد. کسی، درست بر همین تپه، می‌خواست چیزی را بنویسد.
  tip: >-
    چهل‌وپنج دقیقه کافی است. مسیر خاک لخت است و لبهٔ ترانشه‌ها فرو می‌ریزد: در مسیر علامت‌گذاری‌شده بمانید
    و هرگز به درون گودال‌های کاوش پایین نروید. سایه‌ای نیست، پس در تابستان کلاه و آب بیاورید. در محل سرویس
    بهداشتی یا کافه نیست؛ از خدمات کنار جاده در ایگوئتی استفاده کنید. تپه در ماه‌های گرم، وقتی گروه دانشگاه
    مشغول کاوش است، از همیشه زنده‌تر است و دانشجویان اغلب توضیح می‌دهند چه چیزی از خاک بیرون می‌آید. کلیسای
    جامع سامتاویسی در ۱۰ کیلومتری، همراهی طبیعی برای این بازدید است.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب تا ایگوئتی بروید؛ حدود ۵۵ کیلومتر جادهٔ دوبانده و سریع. تپه
    درست کنار بزرگراه، در ضلع شمالی آن، نزدیک زمو رنه و اندکی غرب تقاطع ایگوئتی سر برمی‌آورد؛ اگر از تفلیس
    بیایید، سمت راستتان. در ایگوئتی از بزرگراه خارج شوید و یکی دو کیلومتر آخر را تا پای تپه از جادهٔ محلی
    بروید؛ تابلوها کوچک‌اند، پس مسیریاب را روی ۴۱٫۹۹۶۷, ۴۴٫۴۰۴۷ تنظیم کنید. روی هم حدود ۵۸ کیلومتر و ۵۰
    دقیقه. سوخت در ایگوئتی. خودروی اقتصادی کاملاً کافی است.
he:
  name: גבעת גראקליאני
  short: >-
    תל לצד הכביש המהיר טביליסי–גורי שנחשף בידי סוללי כבישים ב-2007, ובמקדש האלה שבו הסתתרו סימנים שייתכן
    שהם הכתב העתיק ביותר בקווקז.
  body: >-
    **את גבעת גראקליאני גילו סוללי כבישים: ב-2007, כשהרחיבו את הכביש המהיר ממערב לטביליסי, חתכו המכונות
    לתוך תל שהתברר כי הוא אוצר אלפי שנים של קרתלי.**


    מאז חופרים בו עונה אחר עונה סטודנטים ואנשי סגל של אוניברסיטת טביליסי הממלכתית, בהובלת הארכיאולוג וחטנג
    ליצ'לי. שכבות היישוב משתרעות מן התקופה הכלקוליתית ועד סוף התקופה ההלניסטית, והצוות סבור שבני אדם אולי
    השתמשו בגבעה הרבה קודם לכן, אולי לפני 300,000 שנה. כבר בחודשיים הראשונים הוציאו יותר מ-35,000 פריטים
    ממאות קברים ומשרידי יישוב: צעצועי ילדים, כלי נשק, דסקיות מוזהבות וחרוטות של זהב וברונזה מן המאה ה-6
    לפני הספירה, כלים שהחופרים מפרשים כפרמקולוגיים, וחותם נדיר מן המאה ה-4 לפני הספירה להטבעה על מסמכים.
    יש גם קבורות בורות מתקופת הברונזה הקדומה, ובית בן שלושה חדרים עם מחסנים מסביבות 450–350 לפני הספירה.


    לב הגבעה הוא מקדש מן המאה ה-7 לפני הספירה לאלת פריון, ובו תנור פולחן גדול ומעוטר שהחופרים מכנים חסר
    תקדים. ב-2015 מצאו סטודנטים מתנדבים, שעבדו ללא שכר, בעת שפינו את העפר מתחת למזבח שקרס, שורות של סימנים
    חרוטים. צוותו של ליצ'לי טוען שזהו כתב מקומי, עתיק בכאלף שנה מכל כתב מקומי שהיה ידוע עד אז בקווקז,
    וכמה מאותיותיו מזכירות יוונית וארמית; הבלשן קוקורי פיפיה, לעומתו, הציע קרבה לשלושת האלפביתים הגאורגיים.
    שאלת הפענוח עדיין פתוחה.


    מה שתמצאו כאן הוא חפירה פעילה, לא מוזיאון: תעלות מדורגות, יסודות אבן, לוחות מידע, ומשאיות הכביש המהיר
    במרחק זריקת אבן למטה. עמדו על הפסגה, והוויכוח על המזבח הופך אישי. מישהו, על הגבעה הזאת ממש, רצה לכתוב
    משהו.
  tip: >-
    ארבעים וחמש דקות מספיקות. השביל עפר חשוף ושולי התעלות מתפוררים: הישארו במסלול המסומן ולעולם אל תרדו
    לתוך החפירות. אין צל, אז בקיץ הביאו כובע ומים. באתר אין שירותים או בית קפה; השתמשו בשירותי הדרך באיגואתי.
    האתר חי במיוחד בחודשים החמים, כשצוות האוניברסיטה חופר, והסטודנטים מסבירים לא פעם מה עולה מן האדמה.
    קתדרלת סמטאוויסי, 10 ק"מ משם, משתלבת בביקור באופן טבעי.
  route: >-
    סעו מטביליסי מערבה בכביש המהיר S1 (E60) עד איגואתי, כ-55 ק"מ של כביש מהיר דו-מסלולי. התל מתרומם ממש
    לצד הכביש המהיר, בצדו הצפוני, ליד זמו רנה, מעט מערבית למחלף איגואתי — מימינכם כשנוסעים מטביליסי. צאו
    מהכביש המהיר באיגואתי והמשיכו בכביש המקומי את שני הקילומטרים האחרונים בערך עד למרגלות הגבעה; השלטים
    קטנים, אז הגדירו בניווט 41.9967, 44.4047. בסך הכול כ-58 ק"מ ו-50 דקות. דלק באיגואתי. רכב חסכוני מספיק
    לחלוטין.
ar:
  name: تلة غراكلياني
  short: >-
    تلّ بجوار طريق تبليسي–غوري السريع اكتشفه عمّال الطرق عام 2007، وفي معبد إلهةٍ فيه اختبأت علامات قد
    تكون أقدم كتابة في القوقاز.
  body: >-
    **اكتشف عمّال الطرق تلة غراكلياني: ففي عام 2007، وهم يوسّعون الطريق السريع غرب تبليسي، شقّت الآلات
    تلاً تبيّن أنه يحفظ آلاف السنين من تاريخ كارتلي.**


    ومنذ ذلك الحين ينقّب فيه طلاب جامعة تبليسي الحكومية وأساتذتها، بقيادة عالم الآثار فاختانغ ليتشيلي،
    موسماً بعد موسم. تمتد طبقات السكن من العصر النحاسي الحجري إلى أواخر العصر الهلنستي، ويرى الفريق أن
    البشر ربما ارتادوا التلة قبل ذلك بكثير، ربما قبل 300,000 سنة. وفي الشهرين الأولين وحدهما استُخرجت
    أكثر من 35,000 قطعة من مئات المدافن وأطلال المستوطنة: ألعاب أطفال، وأسلحة، وأقراص من الذهب والبرونز
    مذهّبة ومنقوشة من القرن السادس قبل الميلاد، وأدوات يفسّرها المنقّبون بأنها صيدلانية، وختم نادر من
    القرن الرابع قبل الميلاد لختم الوثائق. وثمة أيضاً مدافن حُفَر من العصر البرونزي المبكر، وبيت من ثلاث
    غرف بمخازن يعود إلى نحو 450–350 قبل الميلاد.


    قلب التلة معبد من القرن السابع قبل الميلاد لإلهة الخصوبة، فيه فرن طقسي كبير مزخرف يصفه المنقّبون بأنه
    غير مسبوق. وفي عام 2015 عثر طلاب متطوعون يعملون بلا أجر، وهم يزيلون التراب من تحت مذبحه المنهار، على
    صفوف من العلامات المحفورة. ويرى فريق ليتشيلي أنها كتابة محلية أقدم بنحو ألف عام من أي كتابة محلية
    عُرفت من قبل في القوقاز، وأن بضعة من حروفها تذكّر باليونانية والآرامية؛ أما اللساني كوكوري بيبيا فاقترح
    بدلاً من ذلك قرابتها للأبجديات الجورجية الثلاث. وتبقى قراءتها مسألة مفتوحة.


    ما ستجده هنا موقع تنقيب نشط لا متحف: خنادق متدرجة، وأساسات حجرية، ولوحات تعريفية، وشاحنات الطريق السريع
    على مرمى حجر في الأسفل. قف على القمة، فيصير الجدل حول المذبح شأناً شخصياً. أحدهم، على هذه التلة بالذات،
    أراد أن يدوّن شيئاً.
  tip: >-
    خمس وأربعون دقيقة تكفي. الدرب تراب مكشوف وحواف الخنادق تتفتت: التزم المسار المعلَّم ولا تنزل أبداً
    إلى داخل الحفريات. لا ظل هنا، فاحمل قبعة وماء في الصيف. لا دورات مياه ولا مقهى في الموقع؛ استخدم خدمات
    الطريق في إيغويتي. يكون الموقع في أوج حيويته في الأشهر الدافئة حين يعمل فريق الجامعة، وكثيراً ما يشرح
    الطلاب ما يخرج من الأرض. وكاتدرائية سامتافيسي، على بعد 10 كم، رفيقة طبيعية لهذه الزيارة.
  route: >-
    خذ الطريق السريع S1 (E60) غرباً من تبليسي حتى إيغويتي، نحو 55 كم على طريق مزدوج سريع. يرتفع التل بجوار
    الطريق السريع مباشرة، على جانبه الشمالي عند زيمو ريني، غرب تقاطع إيغويتي بقليل — على يمينك وأنت قادم
    من تبليسي. اخرج من الطريق السريع عند إيغويتي واتبع الطريق المحلي في الكيلومترين الأخيرين حتى سفح التلة؛
    اللافتات صغيرة، فأدخل في نظام الملاحة 41.9967, 44.4047. المجموع نحو 58 كم و50 دقيقة. الوقود في إيغويتي.
    سيارة اقتصادية تكفي تماماً.
