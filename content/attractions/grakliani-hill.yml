ka:
  name: გრაკლიანი გორა
  short: >-
    აქტიური არქეოლოგიური გათხრები კასპთან, სადაც ნეოლითიდან ელინისტურ ხანამდე ცხრა ათასწლეულის ფენებია
    გამოვლენილი.
  body: >-
    **გრაკლიანი გორა თბილისი-გორის მაგისტრალის პირას დგას და მაინც ბევრს გამორჩება.** ეს დაბალი ბორცვია
    იგოეთთან, სადაც 2007 წლიდან თბილისის სახელმწიფო უნივერსიტეტის ექსპედიცია ვახტანგ ლიჩელის ხელმძღვანელობით
    მუშაობს — და აღმოჩენებმა ქართლის ადრეული ისტორიის სურათი შეცვალა.


    ბორცვში მრავალი ფენაა: ნეოლითური დასახლება, ბრინჯაოსა და რკინის ხანის სამარხები, ელინისტური ხანის
    შენობები. გამოვლენილია სამლოცველოები საკურთხევლებით, ხელოსნური სახელოსნოები, სამარხების დიდი ველი
    და ნაგებობა, რომელსაც აღმოჩენილი ჭურჭლისა და ნივთიერი ნაშთების გამო ადრეულ სააფთიაქოს უწოდებენ.


    ყველაზე მეტად სადავო ერთი აღმოჩენაა: საკურთხევლის ბაზაზე ამოკვეთილი ნიშნები, რომლებიც ექსპედიციამ
    ძვ. წ. X-IX საუკუნეებით დაათარიღა და დამწერლობის ადრეულ ნიმუშად მიიჩნია. თუ ეს დათარიღება გამართლდება,
    ეს რეგიონში ერთ-ერთი უძველესი წარწერაა; სპეციალისტების ნაწილი კი როგორც თარიღს, ისე ინტერპრეტაციას
    ეჭვქვეშ აყენებს. კამათი გრძელდება და ეს თავად საინტერესოა.


    რასაც ადგილზე ნახავთ: გათხრილი ტრანშეები, ქვის საძირკვლები, დამცავი ნაგებობა ყველაზე მნიშვნელოვან
    მონაკვეთზე და საინფორმაციო დაფები. ეს არა მუზეუმია, არამედ სამუშაო ობიექტი — ზაფხულში სტუდენტები თხრიან
    და ხშირად ესაუბრებიან სტუმრებს. ვინც სანახაობას ეძებს, უფლისციხეს ამჯობინებს; ვისაც არქეოლოგია აინტერესებს,
    აქ უფრო ცოცხალ სურათს ნახავს.
  tip: >-
    ორმოცდაათი წუთი საკმარისია. ბორცვზე ასვლა მოკლეა, მაგრამ ბილიკი მიწისაა და ტრანშეების კიდეები არამდგრადია
    — მონიშნულ გზას გაჰყევით და გათხრებში არ ჩახვიდეთ. ჩრდილი თითქმის არ არის; ზაფხულში ქუდი და წყალი
    აუცილებელია. ტუალეტი და კაფე ადგილზე არ არის, უახლოესი იგოეთის გზისპირზეა. საუკეთესო დროა ივნისი-სექტემბერი,
    როცა ექსპედიცია მუშაობს.
  route: >-
    თბილისიდან E60-ით გორის მიმართულებით იგოეთამდე — დაახლოებით 55 კმ სწრაფი ავტობანით. გრაკლიანი გორა
    მაგისტრალის ჩრდილოეთით, სოფელ გამდლისწყაროსთანაა; მაჩვენებელი მცირეა, GPS გამოგადგებათ. სულ 58 კმ,
    დაახლოებით ორმოცდაათი წუთი. ბოლო ორი კილომეტრი ვიწრო სოფლის ასფალტია. საწვავი იგოეთის გზისპირზეა.
    მანქანა ბორცვის ძირას რჩება; ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Grakliani Hill
  short: >-
    An active archaeological excavation near Kaspi where nine millennia of layers, from Neolithic to Hellenistic,
    have been uncovered.
  body: >-
    **Grakliani Hill sits beside the Tbilisi-Gori highway and most people still drive straight past it.**
    It is a low rise near Igoeti where a Tbilisi State University expedition led by Vakhtang Licheli has
    dug since 2007, and the finds have changed the picture of early Kartli.


    The mound holds many layers: a Neolithic settlement, Bronze and Iron Age burials, and Hellenistic-period
    buildings. Excavators have exposed shrines with stone altars, craft workshops, a large cemetery field,
    and one structure whose vessels and residues have led the team to describe it as an early pharmacy
    — a workshop where plant preparations were made.


    One find is far more contested. Marks cut into the base of an altar were dated by the expedition to
    the 10th or 9th century BC and interpreted as an early script. If that dating holds, it would be among
    the oldest inscriptions in the region; a number of specialists question both the date and the reading.
    The argument is unresolved, and that in itself is worth knowing before you look at the stone.


    What you actually see on site: open trenches, stone foundations, a protective shelter over the most
    important section, and information boards. This is not a museum but a working dig. In summer students
    are at work and are often happy to explain what is coming out of the ground. Anyone after spectacle
    should choose Uplistsikhe instead; anyone interested in archaeology will find this a livelier picture.
  tip: >-
    Fifty minutes covers it. The walk up is short, but the path is bare earth and trench edges are unstable
    — stay on the marked route and do not climb into the excavations. There is almost no shade, so a hat
    and water matter in summer. No toilets or cafe on site; the nearest are at the roadside services near
    Igoeti. June to September is the best window, when the expedition is working.
  route: >-
    Take the E60 from Tbilisi towards Gori as far as Igoeti, about 55 km of fast dual carriageway. Grakliani
    Hill lies just north of the highway near the village of Gamdlistsqaro; the sign is small, so GPS helps.
    Fifty-eight kilometres in total, roughly fifty minutes. The last two kilometres are narrow village
    asphalt. Fuel is available at the Igoeti roadside stations. Cars are left at the foot of the hill;
    an economy car is entirely sufficient.
ru:
  name: Холм Граклиани
  short: >-
    Действующие археологические раскопки близ Каспи, где вскрыты девять тысячелетий слоёв — от неолита
    до эллинизма.
  body: >-
    **Граклиани стоит у самой трассы Тбилиси — Гори, и большинство всё равно проезжает мимо.** Это невысокий
    холм у Игоети, где с 2007 года работает экспедиция Тбилисского государственного университета под руководством
    Вахтанга Личели, и находки изменили представление о ранней Картли.


    В холме множество слоёв: неолитическое поселение, погребения бронзового и железного века, здания эллинистического
    времени. Раскопаны святилища с каменными алтарями, ремесленные мастерские, обширное поле погребений
    и постройка, которую по найденной посуде и остаткам содержимого исследователи описывают как раннюю
    аптеку — мастерскую, где готовили растительные снадобья.


    Одна находка вызывает куда больше споров. Знаки, вырезанные на основании алтаря, экспедиция датировала
    X-IX веками до нашей эры и истолковала как раннюю письменность. Если датировка подтвердится, это будет
    одна из древнейших надписей региона; ряд специалистов оспаривает и дату, и прочтение. Спор не закрыт,
    и об этом стоит знать, прежде чем смотреть на камень.


    Что действительно видно на месте: открытые траншеи, каменные фундаменты, защитный навес над важнейшим
    участком и информационные щиты. Это не музей, а рабочий раскоп. Летом здесь работают студенты и часто
    охотно рассказывают, что выходит из земли. Кому нужно зрелище — лучше Уплисцихе; кому интересна археология
    — здесь картина живее.
  tip: >-
    Пятидесяти минут достаточно. Подъём короткий, но тропа земляная, а края траншей неустойчивы — держитесь
    размеченного маршрута и не спускайтесь в раскопы. Тени почти нет, летом нужны головной убор и вода.
    Туалетов и кафе на месте нет, ближайшие — на придорожных стоянках у Игоети. Лучшее время — с июня
    по сентябрь, когда работает экспедиция.
  route: >-
    Из Тбилиси по E60 в сторону Гори до Игоети — около 55 км по скоростной трассе. Холм Граклиани лежит
    чуть севернее магистрали, у села Гамдлисцкаро; указатель небольшой, пригодится навигатор. Всего 58
    км, примерно пятьдесят минут. Последние два километра — узкий сельский асфальт. Заправки есть у трассы
    в Игоети. Машины оставляют у подножия холма; автомобиля эконом-класса вполне достаточно.
fa:
  name: تپهٔ گراکلیانی
  short: کاوشی باستان‌شناختی فعال نزدیک کاسپی که در آن نُه هزاره لایه، از نوسنگی تا هلنی، آشکار شده است.
  body: >-
    **تپهٔ گراکلیانی درست کنار بزرگراه تفلیس-گوری است و بیشتر مردم همچنان از کنارش می‌گذرند.** بلندی کوتاهی
    است نزدیک ایگوئتی که هیئتی از دانشگاه دولتی تفلیس به سرپرستی واختانگ لیچلی از ۲۰۰۷ در آن کاوش می‌کند،
    و یافته‌ها تصویر کارتلیِ آغازین را دگرگون کرده‌اند.


    تپه لایه‌های بسیاری دارد: سکونتگاهی نوسنگی، گورهای عصر مفرغ و آهن، و بناهایی از دورهٔ هلنی. کاوشگران
    نیایشگاه‌هایی با محراب سنگی، کارگاه‌های پیشه‌وری، گورستانی گسترده، و بنایی را آشکار کرده‌اند که ظرف‌ها
    و ته‌مانده‌های درونش سبب شده گروه آن را داروخانه‌ای کهن بخوانند، کارگاهی که در آن فرآورده‌های گیاهی
    ساخته می‌شد.


    اما یک یافته به‌مراتب بحث‌برانگیزتر است. نشانه‌هایی کنده‌شده بر پایهٔ یک محراب که هیئت آنها را به
    سدهٔ دهم یا نهم پیش از میلاد تاریخ زد و خطی کهن دانست. اگر این تاریخ‌گذاری بایستد، از کهن‌ترین کتیبه‌های
    منطقه خواهد بود؛ شماری از متخصصان هم در تاریخ و هم در خوانش تردید دارند. بحث هنوز باز است و دانستن
    همین، پیش از نگاه کردن به سنگ، ارزش دارد.


    آنچه در محل واقعاً می‌بینید: ترانشه‌های باز، پی‌های سنگی، سرپناهی محافظ بر مهم‌ترین بخش، و تابلوهای
    توضیحی. اینجا موزه نیست، کارگاه کاوش است. تابستان‌ها دانشجویان مشغول‌اند و اغلب با میل توضیح می‌دهند
    چه چیزی از خاک بیرون می‌آید. هر که دنبال تماشاست بهتر است اوپلیستسیخه را برگزیند؛ و هر که به باستان‌شناسی
    علاقه دارد اینجا تصویری زنده‌تر می‌یابد.
  tip: >-
    پنجاه دقیقه کافی است. بالا رفتن کوتاه است، اما مسیر خاکی است و لبهٔ ترانشه‌ها ناپایدار — روی مسیر
    علامت‌گذاری‌شده بمانید و به درون کاوش‌ها پایین نروید. سایه‌ای تقریباً نیست، پس کلاه و آب در تابستان
    اهمیت دارند. سرویس بهداشتی و کافه در محل نیست؛ نزدیک‌ترین‌ها در توقفگاه‌های کنار جاده نزدیک ایگوئتی‌اند.
    بهترین بازه خرداد تا شهریور است، هنگامی که هیئت کار می‌کند.
  route: >-
    از تفلیس روی E60 به سوی گوری تا ایگوئتی بروید، حدود ۵۵ کیلومتر جادهٔ دوبانده و تند. تپهٔ گراکلیانی
    اندکی شمال بزرگراه نزدیک روستای گامدلیستسکارو است؛ تابلو کوچک است و جی‌پی‌اس کمک می‌کند. روی‌هم ۵۸
    کیلومتر، نزدیک پنجاه دقیقه. دو کیلومتر آخر آسفالت باریک روستایی است. سوخت در پمپ‌های کنار جاده در
    ایگوئتی هست. خودروها را پای تپه می‌گذارند؛ خودروی اقتصادی کاملاً کافی است.
he:
  name: גבעת גראקליאני
  short: חפירה ארכיאולוגית פעילה ליד קאספי שבה נחשפו תשעה אלפי שנים של שכבות, מן הנאוליתי ועד ההלניסטי.
  body: >-
    **גבעת גראקליאני יושבת לצד הכביש טביליסי-גורי, ורוב הנוסעים עדיין חולפים על פניה.** זו גבעה נמוכה
    ליד איגואתי שבה חופרת מאז 2007 משלחת של אוניברסיטת טביליסי בהנהגת ואחטנג ליצ'לי, והממצאים שינו את
    התמונה של קרתלי הקדומה.


    בתל שכבות רבות: יישוב נאוליתי, קברים מתקופת הברונזה והברזל ומבנים מן התקופה ההלניסטית. החופרים חשפו
    מקדשים עם מזבחות אבן, בתי מלאכה, שדה קבורה נרחב, ומבנה שכליו ושרידי תכולתם הובילו את הצוות לתאר אותו
    כבית מרקחת קדום — סדנה שבה הוכנו תכשירים צמחיים.


    ממצא אחד שנוי במחלוקת הרבה יותר. סימנים החרוטים בבסיס מזבח תוארכו בידי המשלחת למאה ה-10 או ה-9 לפני
    הספירה ופורשו ככתב מוקדם. אם התיארוך יעמוד, זו תהיה מן הכתובות העתיקות באזור; חוקרים לא מעטים מטילים
    ספק גם בתאריך וגם בקריאה. הוויכוח לא הוכרע, וכדאי לדעת זאת לפני שמביטים באבן.


    מה שרואים בפועל באתר: תעלות חפירה פתוחות, יסודות אבן, סככת הגנה מעל הקטע החשוב ביותר ולוחות הסבר.
    זה אינו מוזיאון אלא חפירה עובדת. בקיץ הסטודנטים בעבודה ולרוב שמחים להסביר מה עולה מן האדמה. מי שמחפש
    מחזה יבחר באופליסציחה; מי שמתעניין בארכיאולוגיה ימצא כאן תמונה חיה יותר.
  tip: >-
    חמישים דקות מספיקות. העלייה קצרה, אך השביל אדמה ושולי התעלות אינם יציבים — הישארו במסלול המסומן ואל
    תרדו לתוך החפירות. אין כמעט צל, לכן כובע ומים חשובים בקיץ. אין שירותים או בית קפה באתר; הקרובים ביותר
    בתחנות שלצד הכביש ליד איגואתי. החלון הטוב ביותר הוא יוני עד ספטמבר, כשהמשלחת עובדת.
  route: >-
    סעו מטביליסי בכביש E60 לכיוון גורי עד איגואתי, כ-55 ק״מ של כביש מהיר. גבעת גראקליאני נמצאת מעט צפונית
    לכביש ליד הכפר גאמדליסצקארו; השילוט קטן, ולכן ניווט לוויני עוזר. 58 ק״מ בסך הכול, כחמישים דקות. שני
    הקילומטרים האחרונים הם אספלט כפרי צר. דלק יש בתחנות שלצד הכביש באיגואתי. את הרכב משאירים למרגלות הגבעה;
    רכב חסכוני מספיק לחלוטין.
ar:
  name: تلة غراكلياني
  short: تنقيب أثري نشط قرب كاسبي كُشفت فيه تسعة آلاف سنة من الطبقات، من العصر الحجري الحديث إلى الهلنستي.
  body: >-
    **تقع تلة غراكلياني بجوار طريق تبليسي-غوري، ومع ذلك يمر معظم الناس بمحاذاتها دون توقف.** هي مرتفع
    منخفض قرب إيغويتي تنقّب فيه منذ 2007 بعثة من جامعة تبليسي الحكومية بقيادة فاختانغ ليتشيلي، وقد غيّرت
    مكتشفاتها صورة كارتلي المبكرة.


    يحوي التل طبقات كثيرة: مستوطنة من العصر الحجري الحديث، ومدافن من عصري البرونز والحديد، وأبنية من العصر
    الهلنستي. وكشف المنقّبون معابد بمذابح حجرية، وورشاً حرفية، وحقل مدافن واسعاً، ومبنى دفعت أوانيه وبقايا
    محتوياتها الفريق إلى وصفه بصيدلية مبكرة، أي ورشة كانت تُحضَّر فيها مستحضرات نباتية.


    لكن اكتشافاً واحداً أشد إثارة للجدل. فعلامات محفورة على قاعدة مذبح أرّختها البعثة إلى القرن العاشر
    أو التاسع قبل الميلاد وفسّرتها بأنها كتابة مبكرة. وإن صمد هذا التأريخ فستكون من أقدم النقوش في المنطقة؛
    غير أن عدداً من المختصين يشككون في التاريخ وفي القراءة معاً. والنقاش لم يُحسم، ومعرفة ذلك في ذاتها
    تستحق قبل النظر إلى الحجر.


    وما تراه فعلاً في الموقع: خنادق مفتوحة، وأساسات حجرية، ومظلة واقية فوق أهم قطاع، ولوحات تعريفية. هذا
    ليس متحفاً بل ورشة تنقيب. وفي الصيف يعمل الطلاب وغالباً ما يسرّهم أن يشرحوا ما يخرج من الأرض. ومن
    يبتغي المشهد فليختر أوبليستسيخه؛ ومن يهتم بعلم الآثار سيجد هنا صورة أكثر حياة.
  tip: >-
    خمسون دقيقة تكفي. الصعود قصير، لكن الدرب تراب وحواف الخنادق غير ثابتة — التزم المسار المعلّم ولا تنزل
    داخل الحفريات. ولا ظل يُذكر، فالقبعة والماء مهمان في الصيف. ولا دورات مياه ولا مقهى في الموقع؛ وأقربها
    في استراحات الطريق قرب إيغويتي. وأفضل نافذة من حزيران إلى أيلول، حين تكون البعثة في عملها.
  route: >-
    خذ الطريق E60 من تبليسي نحو غوري حتى إيغويتي، نحو 55 كم من الطريق المزدوج السريع. وتقع تلة غراكلياني
    شمال الطريق بقليل قرب قرية غامدليستسكارو؛ واللافتة صغيرة، فنظام الملاحة يساعد. ثمانية وخمسون كيلومتراً
    إجمالاً، نحو خمسين دقيقة. والكيلومتران الأخيران إسفلت قروي ضيق. والوقود متوفر في محطات الطريق عند
    إيغويتي. وتُترك السيارات عند سفح التلة؛ وسيارة اقتصادية تكفي تماماً.
