ka:
  name: წალკის წყალსაცავი
  short: >-
    საქართველოს უდიდესი წყალსაცავი სარკის ფართობით: 33,7 კმ² ცივი, ქარიანი წყალი 1506 მეტრზე, იქ, სადაც
    მიწამ ბრინჯაოს ხანის ოქრო გამოსცა.
  body: >-
    **წალკის ზეგანზე ტყე თავდება და ცა იწყება — და 1946 წელს ამ ბალახოვან სივრცეზე საქართველოს უდიდესი
    წყალსაცავი გაიშალა.**


    წყალსაცავი 1506 მეტრზე, მდინარე ხრამზე — აქ მას ქციასაც უწოდებენ — მდებარეობს; წყალს ლავის სერში გამომუშავებულ
    ვიწრო და ღრმა ხეობაში აგებული ბეტონის კაშხალი აკავებს. სიგრძე დაახლოებით 12 კილომეტრია, სიგანე 3 კილომეტრს
    აღემატება, სარკის ფართობი კი 33,7 კვადრატული კილომეტრია — ქვეყნის ყველა სხვა წყალსაცავზე მეტი. წყალი
    ხრამჰესი I-სა და II-ს ამუშავებს და წელიწადის რიტმით სუნთქავს: ყველაზე დაბალი დონე თებერვალ-მარტშია,
    აპრილიდან ივლისამდე ივსება, ნოემბრიდან კი, როცა ჰესები სრული სიმძლავრით მუშაობს, სწრაფად იკლებს. ზამთარში
    წყალსაცავი დაახლოებით სამი თვით იყინება, ყინულის სისქე ზოგჯერ 80 სანტიმეტრს აღწევს.


    წყალს არქეოლოგები დაასწრნენ. 1936–1940 წლებში, ჰიდროენერგეტიკულ მშენებლობასთან დაკავშირებით, ბორის
    კუფტინმა აქ შუა ბრინჯაოს ხანის 46 ყორღანი გათხარა და მეცნიერებას თრიალეთის კულტურა აღმოუჩინა. ყორღანებიდან
    ამოვიდა სარდიონითა და ფირუზით შემკული ოქროს თასი და ვერცხლის თასი, რომელზეც სარიტუალო მსვლელობაა გამოჭედილი;
    ორივე დღეს საქართველოს ეროვნულ მუზეუმში ინახება.


    ნაპირის სოფლები უფრო ახალ ამბავს ჰყვებიან. 1990 წლამდე წალკის რაიონში დაახლოებით 50 ათასი ბერძენი
    ცხოვრობდა, 49 სოფლიდან 44-ში; ბევრი მათგანი ურუმულად, თურქულ დიალექტზე, ლაპარაკობდა. 1990-იან წლებში
    უმეტესობა საბერძნეთში წავიდა. 1997–2006 წლებში აქ სვანეთსა და აჭარაში მეწყრებით დაზარალებული ოჯახები
    ჩამოასახლეს, დღეს კი მუნიციპალიტეტის მოსახლეობის უმეტესობა ქართველები და სომხები არიან.


    საბანაოდ ეს ტბა არ გამოდგება: აგვისტოშიც წყალი 19 გრადუსს ძლივს აღწევს. აქ ცის სივრცისთვის ამოდიან
    და ქარისთვის, რომელიც თითქმის არასოდეს ჩადგება.
  tip: >-
    ორი საათი გამოყავით, მახლობელ დაშბაშის კანიონთან ერთად კი ნახევარი დღე. ზეგანზე ქარი მუდმივია და ივლისშიც
    გრილა: ქარგაუმტარი ქურთუკი და ქუდი წამოიღეთ. ნაპირზე ჩრდილი, საპირფარეშო და კაფე არ არის; მაღაზიები,
    კაფეები და ბენზინგასამართი წყალსაცავის პირას გაშენებულ წალკაშია. ნაპირის დიდი ნაწილი დაბალი და დამრეცია,
    სამხრეთ-აღმოსავლეთით კი ციცაბო და მაღალი. მეთევზეები დილაადრიან მოდიან. დეკემბრიდან მარტამდე ელოდეთ
    ყინულს, თოვლსა და ძლიერ ყინვას, დიდთოვლობისას კი გზა შეიძლება ჩაიკეტოს. თუ დრო დაგრჩათ, ახლოს ხადიკისა
    და სანთის ტბებიცაა.
  route: >-
    თბილისიდან შ36-ით წყნეთისა და კოჯრის გავლით მანგლისამდე იარეთ, იქიდან კი შ31-ით დასავლეთით, ღია ზეგანზე,
    წალკამდე. სულ დაახლოებით 97 კილომეტრი და საათი და ორმოცდახუთი წუთი, ბოლომდე ასფალტით; კოჯრის შემდეგ
    აღმართი და მკვეთრი მოსახვევებია, ზეგანზე კი ძლიერი გვერდითი ქარი. ალტერნატივა — ს6-ით სამხრეთით და
    კოდისა და თეთრიწყაროს გავლით — ოდნავ გრძელია, მაგრამ უფრო მშვიდი. გაზაფხულიდან შემოდგომამდე ეკონომ-კლასის
    მანქანა სავსებით საკმარისია; ზამთარში 1500 მეტრზე თოვლი და ყინული ჩვეულებრივი ამბავია და ზამთრის საბურავები
    აუცილებელია. საწვავი თბილისში ან წალკაში ჩაასხით. დაშბაშის კანიონის გადასახვევი წალკამდე რამდენიმე
    კილომეტრით ადრეა.
en:
  name: Tsalka Reservoir
  short: >-
    Georgia's largest reservoir by surface: 33.7 km² of cold, wind-whipped water at 1,506 m on the Tsalka
    plateau, where Bronze Age gold came out of the ground.
  body: >-
    **On the Tsalka plateau the trees give out and the sky takes over, and in 1946 the largest reservoir
    in Georgia was laid across the grass.**


    The reservoir lies at 1,506 metres on the Khrami, here also called the Ktsia, held back by a concrete
    dam in a narrow, deep gorge cut through a lava ridge. It is about 12 km long and more than 3 km wide,
    33.7 square kilometres, a bigger surface than any other reservoir in the country, and it drives the
    Khrami I and II power stations downstream. Its level breathes with the seasons: lowest in February
    and March, filling from April to July, drawn down hard from November, when the turbines run at full
    power. In winter it freezes for about three months, the ice sometimes 80 centimetres thick.


    The archaeologists got here before the water. Between 1936 and 1940, prompted by the hydro scheme,
    Boris Kuftin opened 46 Middle Bronze Age burial mounds and gave the world the Trialeti culture. Out
    of them came a gold cup set with carnelian and turquoise and a silver goblet chased with a ritual
    procession, both now in the Georgian National Museum in Tbilisi.


    The villages on the shore tell a newer story. Before 1990 some 50,000 Greeks lived in the Tsalka district,
    in 44 of its 49 villages, and many of them spoke Urum, a Turkic dialect. Most left for Greece in the
    1990s. Between 1997 and 2006 families from Svaneti and Adjara, driven from their homes by landslides,
    were settled here, and today Georgians and Armenians make up most of the district.


    This is no swimming lake: even in August the water barely reaches 19 °C. People come up for the width
    of the sky, and for a wind that almost never drops.
  tip: >-
    Allow two hours, or half a day with the nearby Dashbashi canyon. The plateau wind is constant and
    cool even in July, so bring a windproof jacket and a hat. The shore has no shade, toilets or cafés;
    shops, cafés and fuel are in Tsalka town, which stands by the water. Much of the shoreline is low
    and gently shelving, while the south-east is high and steep. Anglers come at first light. From December
    to March expect ice, snow and hard frost, and heavy snowfall can close the road. With time to spare,
    the Khadiki and Santa lakes lie close by.
  route: >-
    Take the Sh36 out of Tbilisi through Tskneti and Kojori to Manglisi, then the Sh31 west across the
    open plateau to Tsalka. It is about 97 km and an hour and forty-five minutes, asphalt all the way,
    with a climb and tight bends after Kojori and strong crosswinds higher up. The alternative, south
    on the S6 and then through Koda and Tetritskaro, is slightly longer but easier. An economy car is
    fine from spring to autumn; in winter snow and ice are routine at 1,500 metres and winter tyres are
    essential. Refuel in Tbilisi or Tsalka. The turn for the Dashbashi canyon comes a few kilometres before
    Tsalka.
ru:
  name: Цалкское водохранилище
  short: >-
    Крупнейшее по площади водохранилище Грузии: 33,7 км² холодной ветреной воды на высоте 1506 м, на плато,
    где из земли достали золото бронзового века.
  body: >-
    **На Цалкском плато кончаются деревья и начинается небо, а в 1946 году поперёк этой степи легло самое
    большое водохранилище Грузии.**


    Водохранилище лежит на высоте 1506 метров на реке Храми, которую здесь называют ещё Кцией, — за бетонной
    плотиной в узком и глубоком ущелье, прорезающем лавовый гребень. Оно тянется примерно на 12 км в длину
    и больше чем на 3 км в ширину; его площадь, 33,7 квадратного километра, больше, чем у любого другого
    водохранилища страны, и оно питает Храмские ГЭС I и II ниже по течению. Уровень воды дышит вместе
    с временами года: ниже всего в феврале и марте, с апреля по июль водохранилище наполняется, а с ноября,
    когда турбины работают на полную мощность, его резко срабатывают. Зимой оно замерзает примерно на
    три месяца, и лёд порой достигает 80 сантиметров.


    Археологи успели сюда раньше воды. В 1936–1940 годах, в связи с гидростроительством, Борис Куфтин
    раскопал 46 курганов среднего бронзового века и открыл миру триалетскую культуру. Из них вышли золотой
    кубок, инкрустированный сердоликом и бирюзой, и серебряный кубок с чеканной ритуальной процессией;
    оба теперь в Национальном музее Грузии в Тбилиси.


    Прибрежные сёла рассказывают историю поновее. До 1990 года в Цалкском районе жили около 50 тысяч греков
    — в 44 из 49 его сёл, — и многие говорили на урумском, тюркском наречии. В 1990-е годы большинство
    уехало в Грецию. В 1997–2006 годах сюда переселили семьи из Сванетии и Аджарии, которых оползни лишили
    домов, и сегодня большую часть населения района составляют грузины и армяне.


    Купаться здесь не стоит: даже в августе вода едва прогревается до 19 °C. Сюда поднимаются ради ширины
    неба — и ради ветра, который почти никогда не стихает.
  tip: >-
    Заложите два часа, а с соседним каньоном Дашбаши — полдня. Ветер на плато не стихает и холодит даже
    в июле, так что возьмите ветровку и шапку. На берегу нет ни тени, ни туалетов, ни кафе; магазины,
    кафе и заправка — в городке Цалка у самой воды. Бо́льшая часть берега низкая и полого уходит в воду,
    а юго-восточный берег высокий и крутой. Рыбаки приезжают на рассвете. С декабря по март ждите льда,
    снега и крепких морозов; сильный снегопад может закрыть дорогу. Если останется время, рядом лежат
    озёра Хадики и Санта.
  route: >-
    Из Тбилиси по Sh36 через Цхнети и Коджори до Манглиси, а дальше по Sh31 на запад, через открытое плато,
    до Цалки. Это около 97 км и час сорок пять минут, асфальт на всём пути, с подъёмом и крутыми поворотами
    после Коджори и сильным боковым ветром наверху. Запасной вариант — на юг по S6, затем через Коду и
    Тетрицкаро — чуть длиннее, зато проще. С весны до осени достаточно машины эконом-класса; зимой снег
    и гололёд на высоте 1500 метров — обычное дело, и без зимней резины не обойтись. Заправляйтесь в Тбилиси
    или Цалке. Поворот к каньону Дашбаши будет за несколько километров до Цалки.
fa:
  name: مخزن تسالکا
  short: >-
    بزرگ‌ترین مخزن سد گرجستان از نظر پهنه: ۳۳٫۷ کیلومتر مربع آب سرد و بادخورده در ارتفاع ۱۵۰۶ متری بر
    فلات تسالکا، جایی که طلای عصر مفرغ از خاک بیرون آمد.
  body: >-
    **بر فلات تسالکا درختان تمام می‌شوند و آسمان جایشان را می‌گیرد، و در سال ۱۹۴۶ بزرگ‌ترین مخزن آبی گرجستان
    روی این علفزار گسترده شد.**


    مخزن در ارتفاع ۱۵۰۶ متری بر رود خرامی قرار دارد، که اینجا کتسیا هم نامیده می‌شود، و پشت سدی بتنی در
    دره‌ای تنگ و ژرف که در دل رشته‌ای از گدازه بریده شده است. حدود ۱۲ کیلومتر درازا و بیش از ۳ کیلومتر
    پهنا دارد، ۳۳٫۷ کیلومتر مربع، پهنه‌ای بزرگ‌تر از هر مخزن دیگری در این کشور، و نیروگاه‌های خرامی ۱
    و ۲ را در پایین‌دست به کار می‌اندازد. سطح آبش با فصل‌ها دم و بازدم دارد: در فوریه و مارس در پایین‌ترین
    حد است، از آوریل تا ژوئیه پر می‌شود و از نوامبر، که توربین‌ها با تمام توان می‌چرخند، به‌شدت پایین
    کشیده می‌شود. در زمستان نزدیک به سه ماه یخ می‌بندد و ضخامت یخ گاه به ۸۰ سانتی‌متر می‌رسد.


    باستان‌شناسان پیش از آب رسیدند. میان سال‌های ۱۹۳۶ و ۱۹۴۰، به انگیزهٔ طرح برق‌آبی، بوریس کوفتین ۴۶
    گورتپه از عصر مفرغ میانی را کاوید و فرهنگ تریالتی را به جهان شناساند. از این گورها جامی زرین نشانده
    به عقیق سرخ و فیروزه و پیاله‌ای سیمین با نقش برجستهٔ یک صفِ آیینی بیرون آمد، که هر دو اکنون در موزهٔ
    ملی گرجستان در تفلیس‌اند.


    روستاهای کرانه داستانی تازه‌تر می‌گویند. پیش از ۱۹۹۰ نزدیک به ۵۰٬۰۰۰ یونانی در ناحیهٔ تسالکا زندگی
    می‌کردند، در ۴۴ روستا از ۴۹ روستای آن، و بسیاری‌شان به اوروم، گویشی ترکی، سخن می‌گفتند. بیشترشان در
    دههٔ ۱۹۹۰ به یونان رفتند. میان ۱۹۹۷ و ۲۰۰۶ خانواده‌هایی از سوانتی و آجارا را که رانش زمین آواره‌شان
    کرده بود در اینجا اسکان دادند، و امروز بیشتر مردم این ناحیه گرجی و ارمنی‌اند.


    اینجا دریاچه‌ای برای شنا نیست: حتی در اوت دمای آب به‌زحمت به ۱۹ درجه می‌رسد. مردم برای پهنای آسمان
    به اینجا می‌آیند، و برای بادی که تقریباً هرگز فرو نمی‌نشیند.
  tip: >-
    دو ساعت وقت بگذارید، یا با درهٔ داشباشیِ نزدیک، نیم‌روز. باد فلات یکسره می‌وزد و حتی در ژوئیه خنک
    است، پس بادگیر و کلاه بیاورید. کرانه سایه، سرویس بهداشتی و کافه ندارد؛ مغازه، کافه و پمپ بنزین در
    شهر تسالکا است که کنار آب قرار دارد. بیشتر کرانه پست است و با شیبی ملایم به آب می‌رسد، اما کرانهٔ
    جنوب شرقی بلند و پرشیب است. ماهیگیران با نخستین روشنایی صبح می‌آیند. از دسامبر تا مارس منتظر یخ، برف
    و سرمای سخت باشید؛ بارش سنگین برف ممکن است جاده را ببندد. اگر وقت دارید، دریاچه‌های خادیکی و سانتا
    در همین نزدیکی‌اند.
  route: >-
    از تفلیس با جادهٔ Sh36 از راه تسکنتی و کوجوری تا مانگلیسی بروید، سپس با Sh31 رو به غرب از میان فلات
    باز تا تسالکا برانید. حدود ۹۷ کیلومتر و یک ساعت و چهل‌وپنج دقیقه راه است، سراسر آسفالت، با سربالایی
    و پیچ‌های تند پس از کوجوری و بادهای پهلویی تند در ارتفاعات بالاتر. راه دیگر، رو به جنوب با S6 و سپس
    از راه کودا و تتریتسکارو، کمی درازتر اما آسان‌تر است. از بهار تا پاییز خودروی اقتصادی کافی است؛ در
    زمستان برف و یخ در ارتفاع ۱۵۰۰ متری امری عادی است و لاستیک زمستانی ضروری. در تفلیس یا تسالکا سوخت
    بگیرید. انشعاب درهٔ داشباشی چند کیلومتر پیش از تسالکا است.
he:
  name: מאגר צאלקה
  short: >-
    המאגר הגדול בגאורגיה בשטח פניו: 33.7 קמ״ר של מים קרים שהרוח מקציפה, בגובה 1,506 מ׳ ברמת צאלקה, שבה
    נחשף מן האדמה זהב מתקופת הברונזה.
  body: >-
    **ברמת צאלקה העצים נגמרים והשמיים משתלטים, וב-1946 נפרש כאן על פני העשב המאגר הגדול ביותר בגאורגיה.**


    המאגר שוכן בגובה 1,506 מטרים על נהר החראמי, המכונה כאן גם קציה, מאחורי סכר בטון בערוץ צר ועמוק שנחצב
    ברכס של לבה. אורכו כ-12 ק״מ ורוחבו יותר מ-3 ק״מ, 33.7 קמ״ר, שטח פנים גדול מזה של כל מאגר אחר במדינה,
    והוא מניע את תחנות הכוח חראמי 1 ו-2 במורד הזרם. מפלס המים נושם עם עונות השנה: הוא הנמוך ביותר בפברואר
    ובמרץ, מתמלא מאפריל עד יולי, ויורד בחדות מנובמבר, כשהטורבינות פועלות במלוא הכוח. בחורף הוא קופא לכשלושה
    חודשים, ועובי הקרח מגיע לעיתים ל-80 סנטימטרים.


    הארכאולוגים הקדימו את המים. בשנים 1936–1940, בעקבות מפעל ההידרו-חשמל, חפר בוריס קופטין 46 תלי קבורה
    מתקופת הברונזה התיכונה והציג לעולם את תרבות טריאלטי. מתוכם יצאו גביע זהב משובץ קרנליאן וטורקיז וגביע
    כסף שעליו מרוקעת תהלוכה פולחנית, ושניהם נמצאים כיום במוזיאון הלאומי של גאורגיה בטביליסי.


    הכפרים שעל החוף מספרים סיפור חדש יותר. לפני 1990 חיו במחוז צאלקה כ-50,000 יוונים, ב-44 מתוך 49 כפריו,
    ורבים מהם דיברו אורום, ניב טורקי. רובם עזבו ליוון בשנות ה-90. בין 1997 ל-2006 יושבו כאן משפחות מסוואנטי
    ומאג׳ריה שמפולות אדמה גירשו אותן מבתיהן, וכיום רוב תושבי המחוז הם גאורגים וארמנים.


    זה לא אגם לשחייה: גם באוגוסט המים בקושי מגיעים ל-19 מעלות. באים לכאן בשביל רוחב השמיים, ובשביל רוח
    שכמעט אף פעם אינה שוככת.
  tip: >-
    הקדישו שעתיים, או חצי יום יחד עם קניון דשבאשי הסמוך. רוח הרמה נושבת בלי הפסקה וקרירה גם ביולי, אז
    הביאו מעיל רוח וכובע. על החוף אין צל, שירותים או בתי קפה; חנויות, בתי קפה ודלק יש בעיירה צאלקה, השוכנת
    על שפת המים. רוב קו החוף נמוך ומשתפל בעדינות, ואילו החוף הדרום-מזרחי גבוה ותלול. דייגים מגיעים עם
    אור ראשון. מדצמבר עד מרץ צפו לקרח, לשלג ולכפור עז, ושלג כבד עלול לחסום את הדרך. אם נשאר זמן, האגמים
    חדיקי וסנטה נמצאים בקרבת מקום.
  route: >-
    צאו מטביליסי בכביש Sh36 דרך צקנטי וקוג׳ורי עד מאנגליסי, ומשם בכביש Sh31 מערבה על פני הרמה הפתוחה עד
    צאלקה. כ-97 ק״מ ושעה ושלושת רבעי השעה, אספלט לכל אורך הדרך, עם עלייה ועיקולים חדים אחרי קוג׳ורי ורוחות
    צד חזקות למעלה. החלופה, דרומה בכביש S6 ואז דרך קודה וטטריצקרו, מעט ארוכה יותר אך קלה יותר. מן האביב
    עד הסתיו מספיק רכב אקונומי; בחורף שלג וקרח בגובה 1,500 מטרים הם עניין שגרתי, וצמיגי חורף הכרחיים.
    תדלקו בטביליסי או בצאלקה. הפנייה לקניון דשבאשי מגיעה כמה קילומטרים לפני צאלקה.
ar:
  name: خزان تسالكا
  short: >-
    أكبر خزانات جورجيا مساحةً: 33.7 كم² من ماء بارد تجلده الريح على ارتفاع 1506 أمتار فوق هضبة تسالكا،
    حيث خرج من الأرض ذهب العصر البرونزي.
  body: >-
    **على هضبة تسالكا تنتهي الأشجار وتبدأ السماء، وفي عام 1946 بُسط فوق هذا العشب أكبر خزان في جورجيا.**


    يقع الخزان على ارتفاع 1506 أمتار على نهر خرامي، الذي يُسمّى هنا أيضاً كتسيا، خلف سدّ خرساني في وادٍ
    ضيق عميق شُقّ في حافة من الحمم البركانية. طوله نحو 12 كيلومتراً وعرضه أكثر من 3 كيلومترات، ومساحته
    33.7 كيلومتراً مربعاً، وهي أكبر من مساحة أي خزان آخر في البلاد، ويدير محطتي خرامي 1 و2 الكهرومائيتين
    في أسفل النهر. ويتنفّس منسوبه مع الفصول: يبلغ أدناه في فبراير ومارس، ويمتلئ من أبريل إلى يوليو، ثم
    يُسحب منه بقوة ابتداءً من نوفمبر حين تعمل التوربينات بكامل طاقتها. وفي الشتاء يتجمّد نحو ثلاثة أشهر،
    وقد يبلغ سُمك الجليد 80 سنتيمتراً.


    سبق علماءُ الآثار الماءَ إلى هنا. فبين عامي 1936 و1940، وبدافع من مشروع الطاقة الكهرومائية، نقّب بوريس
    كوفتين في 46 تلاً جنائزياً من العصر البرونزي الأوسط، وقدّم للعالم ثقافة ترياليتي. ومنها خرجت كأس ذهبية
    مرصّعة بالعقيق الأحمر والفيروز، وكأس فضية نُقش عليها بالطرق موكب طقسي، وكلتاهما اليوم في المتحف الوطني
    الجورجي في تبليسي.


    أما القرى على الشاطئ فتروي حكاية أحدث. فقبل عام 1990 عاش في منطقة تسالكا نحو 50,000 يوناني، في 44
    من قراها التسع والأربعين، وكان كثير منهم يتكلمون الأوروم، وهي لهجة تركية. وقد رحل معظمهم إلى اليونان
    في التسعينيات. وبين عامي 1997 و2006 أُسكنت هنا عائلات من سفانيتي وأجاريا شرّدتها الانهيارات الأرضية
    من بيوتها، واليوم يشكّل الجورجيون والأرمن معظم سكان المنطقة.


    ليست هذه بحيرة للسباحة: فحتى في أغسطس بالكاد تبلغ حرارة الماء 19 درجة مئوية. يصعد الناس إلى هنا من
    أجل اتساع السماء، ومن أجل ريح لا تكاد تهدأ.
  tip: >-
    خصّص ساعتين، أو نصف يوم إن أضفت أخدود داشباشي القريب. ريح الهضبة لا تنقطع وتظل باردة حتى في يوليو،
    فاحمل سترة واقية من الريح وقبعة. لا ظلّ على الشاطئ ولا دورات مياه ولا مقاهٍ؛ المتاجر والمقاهي والوقود
    في بلدة تسالكا القائمة على شاطئ الخزان. معظم الشاطئ منخفض ينحدر برفق، أما الجهة الجنوبية الشرقية فعالية
    شديدة الانحدار. يأتي الصيادون مع أول الضوء. ومن ديسمبر إلى مارس توقّع الجليد والثلج والصقيع القارس،
    وقد تُغلق الثلوج الكثيفة الطريق. وإن فاض الوقت، فبحيرتا خاديكي وسانتا قريبتان.
  route: >-
    خذ الطريق Sh36 من تبليسي عبر تسكنيتي وكوجوري حتى مانغليسي، ثم الطريق Sh31 غرباً عبر الهضبة المكشوفة
    حتى تسالكا. المسافة نحو 97 كيلومتراً وساعة وخمس وأربعون دقيقة، إسفلت على طول الطريق، مع صعود ومنعطفات
    حادة بعد كوجوري ورياح جانبية قوية في الأعلى. أما البديل، جنوباً على S6 ثم عبر كودا وتيتريتسكارو، فأطول
    قليلاً لكنه أيسر. تكفي سيارة اقتصادية من الربيع إلى الخريف؛ أما في الشتاء فالثلج والجليد على ارتفاع
    1500 متر أمر معتاد، والإطارات الشتوية ضرورية. تزوّد بالوقود في تبليسي أو تسالكا. ويأتي المنعطف إلى
    أخدود داشباشي قبل تسالكا ببضعة كيلومترات.
