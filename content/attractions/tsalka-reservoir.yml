ka:
  name: წალკის წყალსაცავი
  short: დიდი ხელოვნური ტბა ტრიალეთის ზეგანზე 1500 მეტრზე, უხეო ლანდშაფტში და ცარიელ სოფლებს შორის.
  body: >-
    **წალკის წყალსაცავი ისეთი ადგილია, სადაც ჰორიზონტი უფრო შორსაა, ვიდრე საქართველოში მიჩვეული ხართ.**
    ტრიალეთის ზეგანი 1500 მეტრზეა, თითქმის უხეო, ღია ბალახოვანი — უფრო ჯავახეთს ჰგავს, ვიდრე ქვემო ქართლის
    ველს. მდინარე ქციაზე 1946 წელს აშენებული კაშხალი ამ ზეგანზე დიდ, ქარიან წყლის ზედაპირს ქმნის.


    წყალსაცავს არქეოლოგიური ფასიც აქვს — და დანაკარგიც. სწორედ მშენებლობის წინ და მის დროს გათხარეს **თრიალეთის
    ყორღანები**: შუა ბრინჯაოს ხანის, ძვ. წ. II ათასწლეულის სამარხი ბორცვები, სადაც ოქროსა და ვერცხლის
    ჭურჭელი აღმოაჩინეს. ცნობილი თრიალეთის ვერცხლის თასი დღეს საქართველოს ეროვნულ მუზეუმშია თბილისში. ნაწილი
    ყორღანებისა წყლის ქვეშ დარჩა.


    სოფლების ისტორია მეორე ფენაა. XIX საუკუნეში აქ პონტოელი ბერძნები და სომხები დაასახლეს; ქვის სახლები
    ბრტყელი სახურავებით მათი ნაშენია. 1990-იან წლებში ბერძნული მოსახლეობის უმეტესობა საბერძნეთში წავიდა
    და სოფლები ნახევრად დაცარიელდა. მოგვიანებით აქ სვანები და აჭარლები ჩამოასახლეს, რომლებიც მეწყრებმა
    სახლებიდან გამოდევნა. შედეგად ერთ სოფელში ბერძნული წარწერიანი საფლავები და სვანური გვარები ერთმანეთის
    გვერდითაა.


    პრაქტიკულად: ეს არ არის საბანაო ტბა. წყალი ცივია, ნაპირი ლამიანი, ინფრასტრუქტურა თითქმის არ არსებობს.
    ღირს ხედისთვის, თევზაობისთვის და იმ განცდისთვის, რომ თბილისიდან საათნახევარში სრულიად სხვა ქვეყანაშია
    აღმოჩნდი.
  tip: >-
    ორი საათი გამოყავით, დაშბაშის კანიონთან ერთად კი ნახევარი დღე. ზეგანზე ქარი მუდმივია და ზაფხულშიც
    გრილა — ქარსაფარი აუცილებელია. ნაპირზე ჩრდილი და საპირფარეშო არ არის; წალკის დაბაში მაღაზია და რამდენიმე
    კაფეა. ზამთარში აქ -20 გრადუსამდე ეცემა და გზები ხშირად იკეტება თოვლის გამო. თევზაობისთვის ადგილობრივები
    ადრე დილას ურჩევენ.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით კოდაზე გავლით მანგლისისკენ, შემდეგ წალკის გზით ზეგანზე ასვლა. სულ 97
    კმ, დაახლოებით საათი და ორმოცდახუთი წუთი. გზა ბოლომდე ასფალტია და ბოლო წლებში გარემონტდა, თუმცა მთიან
    მონაკვეთზე სერპანტინია და ზამთარში ყინულდება. საწვავი კოდაში ან წალკაში აიღეთ. ეკონომ-კლასის ავტომობილი
    ზაფხულში საკმარისია, ზამთარში კი ზამთრის საბურავები აუცილებელია.
en:
  name: Tsalka Reservoir
  short: >-
    A large artificial lake on the Trialeti plateau at 1,500 metres, in treeless country among half-empty
    villages.
  body: >-
    **Tsalka reservoir is a place where the horizon sits further away than you expect in Georgia.** The
    Trialeti plateau lies at 1,500 metres, almost treeless and open grassland — closer in feel to Javakheti
    than to the plains of Kvemo Kartli. A dam built on the Ktsia river in 1946 put a large, windy sheet
    of water across it.


    The reservoir also carries archaeological value, and archaeological loss. It was immediately before
    and during its construction that the **Trialeti kurgans** were excavated: Middle Bronze Age burial
    mounds of the second millennium BC, which produced gold and silver vessels of exceptional quality.
    The famous Trialeti silver goblet is now in the Georgian National Museum in Tbilisi. Some of the mounds
    ended up under water.


    The villages are a second layer. In the 19th century Pontic Greeks and Armenians were settled here,
    and the flat-roofed stone houses are theirs. In the 1990s most of the Greek population left for Greece
    and the villages half emptied. Later, Svans and Adjarians displaced by landslides in their own regions
    were resettled here. The result is villages where Greek gravestones and Svan surnames stand side by
    side.


    Practically: this is not a swimming lake. The water is cold, the shore muddy and infrastructure almost
    nonexistent. It is worth the drive for the landscape, for fishing, and for the sensation of being
    in a completely different country ninety minutes from Tbilisi.
  tip: >-
    Allow two hours, or half a day combined with Dashbashi canyon. Wind on the plateau is constant and
    it stays cool even in summer, so a windproof layer is necessary. There is no shade or toilet at the
    shore; Tsalka town has a shop and a few cafes. In winter temperatures drop towards minus twenty and
    roads close in snow. Local anglers recommend early morning.
  route: >-
    Head southwest from Tbilisi via Koda towards Manglisi, then take the Tsalka road up onto the plateau.
    Ninety-seven kilometres in total, about an hour and forty-five minutes. The road is asphalt throughout
    and has been resurfaced in recent years, though the mountain section is a switchback and ices over
    in winter. Refuel in Koda or Tsalka. An economy car is fine in summer; in winter proper winter tyres
    are essential.
ru:
  name: Цалкское водохранилище
  short: >-
    Большое искусственное озеро на Триалетском плато на высоте 1500 метров, в безлесной местности среди
    полупустых сёл.
  body: >-
    **Цалкское водохранилище — место, где горизонт отодвинут дальше, чем ожидаешь в Грузии.** Триалетское
    плато лежит на 1500 метрах, почти безлесное, открытая степь — по ощущению ближе к Джавахети, чем к
    равнинам Квемо-Картли. Плотина, построенная на реке Кциа в 1946 году, разлила по нему большую ветреную
    водную гладь.


    У водохранилища есть и археологическая ценность, и археологическая потеря. Именно накануне и во время
    его строительства раскопали **Триалетские курганы**: погребальные насыпи среднего бронзового века,
    II тысячелетия до нашей эры, давшие золотые и серебряные сосуды исключительного качества. Знаменитый
    триалетский серебряный кубок хранится теперь в Национальном музее Грузии в Тбилиси. Часть курганов
    ушла под воду.


    Сёла — второй слой. В XIX веке здесь поселили понтийских греков и армян; каменные дома с плоскими
    крышами построены ими. В 1990-е большая часть греческого населения уехала в Грецию, и сёла наполовину
    опустели. Позже сюда переселили сванов и аджарцев, лишившихся домов из-за оползней. В итоге в одном
    селе греческие надгробия соседствуют со сванскими фамилиями.


    Практически: купаться здесь не стоит. Вода холодная, берег илистый, инфраструктуры почти нет. Ехать
    имеет смысл ради пейзажа, рыбалки и ощущения, что в полутора часах от Тбилиси вы оказались совсем
    в другой стране.
  tip: >-
    Заложите два часа или полдня вместе с Дашбашским каньоном. Ветер на плато постоянный, прохладно даже
    летом — ветрозащитный слой обязателен. На берегу нет ни тени, ни туалета; в посёлке Цалка есть магазин
    и несколько кафе. Зимой температура опускается к минус двадцати, дороги закрываются из-за снега. Местные
    рыбаки советуют раннее утро.
  route: >-
    Из Тбилиси на юго-запад через Кода в сторону Манглиси, затем по цалкской дороге вверх на плато. Всего
    97 км, примерно час сорок пять. Дорога асфальтированная и в последние годы обновлённая, но горный
    участок серпантинный и зимой обледеневает. Заправляйтесь в Кода или Цалке. Летом достаточно машины
    эконом-класса; зимой обязательна зимняя резина.
fa:
  name: آبگیر تسالکا
  short: دریاچه‌ای مصنوعی و بزرگ بر فلات تریالتی در ارتفاع ۱۵۰۰ متری، در سرزمینی بی‌درخت و میان روستاهای
    نیمه‌خالی.
  body: >-
    **آبگیر تسالکا جایی است که افق دورتر از آنچه در گرجستان انتظار دارید می‌نشیند.** فلات تریالتی در ارتفاع
    ۱۵۰۰ متری است، تقریباً بی‌درخت و پوشیده از علفزار باز — حسی نزدیک‌تر به جاواختی تا به دشت‌های کوهمو
    کارتلی. سدی که در ۱۹۴۶ بر رود کتسیا ساخته شد پهنه‌ای بزرگ و بادخیز از آب بر آن گسترد.


    آبگیر ارزش باستان‌شناختی نیز دارد و در همان حال زیانی باستان‌شناختی. درست پیش از ساخت آن و در حین
    آن بود که **گورتپه‌های تریالتی** کاوش شدند: تپه‌های گورِ عصر مفرغ میانه از هزارهٔ دوم پیش از میلاد
    که ظرف‌هایی از زر و سیم با کیفیتی استثنایی به دست دادند. جام سیمین معروف تریالتی امروز در موزهٔ ملی
    گرجستان در تفلیس است. شماری از این تپه‌ها زیر آب رفتند.


    روستاها لایهٔ دوم‌اند. در سدهٔ نوزدهم یونانیان پونتوسی و ارمنیان اینجا اسکان داده شدند و خانه‌های
    سنگی با بام‌های مسطح از آنِ آنان است. در دههٔ ۱۹۹۰ بیشتر جمعیت یونانی به یونان رفتند و روستاها نیمه‌خالی
    شدند. بعدها سوان‌ها و آجارها که رانش زمین خانه‌هایشان را گرفته بود به اینجا کوچانده شدند. نتیجه روستاهایی
    است که در آنها سنگ‌قبرهای یونانی و نام‌های خانوادگی سوانی کنار هم ایستاده‌اند.


    از نظر عملی: اینجا دریاچهٔ شنا نیست. آب سرد است، کرانه گِلی، و زیرساخت تقریباً هیچ. ارزش رفتن در چشم‌انداز
    است، در ماهیگیری، و در این حس که در نود دقیقه از تفلیس به کشوری یکسره دیگر رسیده‌اید.
  tip: >-
    دو ساعت در نظر بگیرید، یا نیم روز همراه با درّهٔ داشباشی. باد فلات پیوسته است و هوا حتی در تابستان
    خنک می‌ماند، پس لایهٔ بادگیر لازم است. کنار آب سایه و سرویس بهداشتی نیست؛ شهرک تسالکا مغازه و چند
    کافه دارد. زمستان دما تا منهای بیست پایین می‌رود و جاده‌ها با برف بسته می‌شوند. ماهیگیران محلی سپیده‌دم
    را توصیه می‌کنند.
  route: >-
    از تفلیس به جنوب‌غرب از کودا به سوی مانگلیسی بروید، سپس جادهٔ تسالکا را تا فلات بالا بگیرید. روی‌هم
    ۹۷ کیلومتر، حدود یک ساعت و چهل‌وپنج دقیقه. جاده تا انتها آسفالت است و در سال‌های اخیر روکش شده، هرچند
    بخش کوهستانی پرپیچ است و زمستان یخ می‌بندد. سوخت را در کودا یا تسالکا بگیرید. خودروی اقتصادی در تابستان
    مناسب است؛ در زمستان لاستیک زمستانی ضروری است.
he:
  name: מאגר צאלקה
  short: אגם מלאכותי גדול על רמת טריאלטי בגובה 1,500 מטר, בנוף חסר עצים ובין כפרים חצי ריקים.
  body: >-
    **מאגר צאלקה הוא מקום שבו האופק רחוק יותר מכפי שמצפים בגאורגיה.** רמת טריאלטי שרועה בגובה 1,500 מטר,
    כמעט ללא עצים, שטח מרעה פתוח — בתחושה קרוב יותר לג'וואחתי מאשר למישורי קוומו קרתלי. סכר שנבנה על נהר
    קציה ב-1946 פרש עליה משטח מים גדול וסוער.


    למאגר יש גם ערך ארכיאולוגי וגם אובדן ארכיאולוגי. דווקא ערב בנייתו ובמהלכה נחפרו **תלי טריאלטי**: תלי
    קבורה מתקופת הברונזה התיכונה, מן האלף השני לפני הספירה, שהניבו כלי זהב וכסף באיכות יוצאת דופן. גביע
    הכסף המפורסם מטריאלטי נמצא כיום במוזיאון הלאומי הגאורגי בטביליסי. חלק מן התלים נותרו מתחת למים.


    הכפרים הם שכבה שנייה. במאה ה-19 יושבו כאן יוונים פונטיים וארמנים, ובתי האבן בעלי הגגות השטוחים הם
    שלהם. בשנות התשעים עזב רוב הציבור היווני ליוון והכפרים התרוקנו למחצה. אחר כך יושבו כאן סוואנים ואג'רים
    שגלישות אדמה עקרו אותם מבתיהם. התוצאה היא כפרים שבהם מצבות יווניות ושמות משפחה סוואניים עומדים זה
    לצד זה.


    מעשית: זה אינו אגם רחצה. המים קרים, החוף בוצי והתשתית כמעט לא קיימת. שווה לנסוע בשביל הנוף, בשביל
    הדיג, ובשביל התחושה שתשעים דקות מטביליסי אתם במדינה אחרת לגמרי.
  tip: >-
    הקצו שעתיים, או חצי יום בשילוב עם קניון דשבאשי. הרוח על הרמה קבועה והמקום נשאר קריר גם בקיץ, לכן שכבה
    נגד רוח הכרחית. אין צל או שירותים בחוף; בעיירת צאלקה יש חנות וכמה בתי קפה. בחורף הטמפרטורות יורדות
    לכיוון מינוס עשרים והדרכים נחסמות בשלג. דייגים מקומיים ממליצים על שעות הבוקר המוקדמות.
  route: >-
    צאו מטביליסי דרום-מערבה דרך קודה לכיוון מאנגליסי, ואז עלו בכביש צאלקה אל הרמה. 97 ק״מ בסך הכול, כשעה
    וארבעים וחמש. הכביש סלול לכל אורכו וחודש בשנים האחרונות, אך הקטע ההררי מפותל ומתקרח בחורף. תדלקו בקודה
    או בצאלקה. רכב חסכוני מתאים בקיץ; בחורף צמיגי חורף הכרחיים.
ar:
  name: خزان تسالكا
  short: بحيرة اصطناعية كبيرة على هضبة تريالتي على ارتفاع 1500 متر، في أرض بلا أشجار وبين قرى نصف خالية.
  body: >-
    **خزان تسالكا مكان يبتعد فيه الأفق أكثر مما تتوقع في جورجيا.** تمتد هضبة تريالتي على ارتفاع 1500 متر،
    شبه خالية من الشجر ومغطاة بعشب مفتوح — أقرب في الإحساس إلى جافاخيتي منها إلى سهول كفيمو كارتلي. وقد
    بسط سدّ بُني على نهر كتسيا عام 1946 فوقها صفحة ماء واسعة عاصفة.


    وللخزان قيمة أثرية وخسارة أثرية في آن. فقبيل إنشائه وأثناءه بالضبط نُقّبت **تلال تريالتي**: تلال دفن
    من العصر البرونزي الأوسط في الألف الثاني قبل الميلاد، أخرجت أواني ذهب وفضة بجودة استثنائية. وكأس تريالتي
    الفضي الشهير محفوظ اليوم في المتحف الوطني الجورجي في تبليسي. وبعض التلال انتهى تحت الماء.


    والقرى طبقة ثانية. ففي القرن التاسع عشر أُسكن هنا يونانيون بنطيون وأرمن، وبيوت الحجر ذات السطوح المستوية
    بيوتهم. وفي التسعينيات غادر معظم السكان اليونانيين إلى اليونان وخلت القرى نصف خلوّ. ثم وُطّن هنا سفانيون
    وأجاريون اقتلعتهم الانهيارات الأرضية من بيوتهم. والنتيجة قرى تقف فيها شواهد قبور يونانية إلى جانب
    أسماء عائلات سفانية.


    وعملياً: هذه ليست بحيرة سباحة. الماء بارد، والشاطئ طيني، والبنية التحتية شبه معدومة. والرحلة تستحق
    من أجل المشهد، ومن أجل صيد السمك، ومن أجل الإحساس بأنك على بعد تسعين دقيقة من تبليسي صرت في بلد آخر
    تماماً.
  tip: >-
    خصّص ساعتين، أو نصف يوم مع وادي داشباشي. والريح على الهضبة دائمة والمكان يبقى بارداً حتى صيفاً، فطبقة
    صادّة للريح ضرورية. ولا ظل ولا دورة مياه عند الشاطئ؛ وفي بلدة تسالكا متجر وبضعة مقاهٍ. وفي الشتاء
    تهبط الحرارة نحو عشرين تحت الصفر وتُغلق الطرق بالثلج. ويوصي الصيادون المحليون بساعات الفجر.
  route: >-
    اتجه جنوب غرب من تبليسي عبر كودا نحو مانغليسي، ثم اصعد بطريق تسالكا إلى الهضبة. سبعة وتسعون كيلومتراً
    إجمالاً، نحو ساعة وخمس وأربعين دقيقة. الطريق معبّد بكامله وقد جُدّد في السنوات الأخيرة، وإن كان المقطع
    الجبلي متعرجاً ويتجمد شتاءً. تزوّد بالوقود في كودا أو تسالكا. وسيارة اقتصادية مناسبة صيفاً؛ أما شتاءً
    فإطارات الشتاء ضرورية.
