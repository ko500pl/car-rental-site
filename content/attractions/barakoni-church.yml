ka:
  name: ბარაკონის ტაძარი
  short: >-
    1753 წლის გუმბათოვანი ეკლესია ცესში, ლუხუნისა და რიონის შესართავთან — ქართული შუასაუკუნეების არქიტექტურის
    ბოლო დიდი ნაწარმოები.
  body: >-
    **ბარაკონი ის ეკლესიაა, რომლითაც ქართული შუასაუკუნეების არქიტექტურა მთავრდება.** ის 1753 წელს სოფელ
    ცესში, ლუხუნის რიონში შესართავის ზემოთ, რაჭის ერისთავის როსტომის დაკვეთით აშენდა. მშენებელი — ავთანდილ
    შულავრელი — აღმოსავლეთ ფასადის წარწერაში სახელით არის დასახელებული, რაც ქართულ ძეგლებში იშვიათია:
    არქიტექტორები თითქმის ყოველთვის უსახელოდ რჩებოდნენ.


    შენობა ჯვარგუმბათოვანია, მკაცრი და მაღალი. ბარაკონის მთავარი თვისება პროპორციაა: გუმბათის ყელი გრძელია
    და გამხდარი, ფასადები კი ისეა შეკრული, რომ ეკლესია რეალურზე დიდი ჩანს. ქვა ღია მოყვითალო-ნაცრისფერია
    და დღის სხვადასხვა დროს განსხვავებულად იჭერს შუქს; საღამოს, როცა მზე ხეობის დასავლეთ ბოლოში ეშვება,
    ფასადი თბილ ფერს იღებს.


    დეკორი ჩუქურთმაშია და არა ფრესკაში. სარკმლების გარშემო, გუმბათის ყელზე და ჯვრის მკლავების ბოლოებში
    ღრმად ნაკვეთი გეომეტრიული და მცენარეული ორნამენტია, XVII–XVIII საუკუნეების ქართული ქვის კვეთის ერთ-ერთი
    საუკეთესო ნიმუში. შიგნით კი თითქმის ცარიელია — ფრესკები არ შემორჩენილა, სივრცე მაღალია, ცივი და მკაცრი.


    ისტორია სევდიანად მთავრდება. როსტომ ერისთავი, რომელმაც ბარაკონი ააგო, 1769 წელს იმერეთის მეფე სოლომონ
    პირველთან დაპირისპირებაში დამარცხდა და რაჭის საერისთავო გაუქმდა. ტაძარი მისი მმართველობის ბოლო დიდი
    ნაშთია.


    ეკლესია მოქმედია, ეზო შემოღობილი და მოვლილი, ირგვლივ მაღალი ხეებია. ზამთარში, როცა ფოთოლი არ არის,
    თეთრი ქვა შავ ტოტებში განსაკუთრებით მკაფიოდ დგას; გაზაფხულზე რიონი ამღვრეული და ხმაურიანია, ქვემოთ
    ხიდიდან კარგად ჩანს.
  tip: >-
    ნახევარი საათი თუ საათი სავსებით საკმარისია. ეზოში ავტომობილი პირდაპირ შედის, პარკინგი უფასოა და ცარიელი.
    ეკლესია ჩვეულებრივ ღიაა, მაგრამ თუ დაკეტილია, გასაღები მეზობელ სახლშია — მოძებნა ღირს. ჩაცმის წესები
    მოქმედებს, თავსაფარი კართან დევს. ტუალეტი და კაფე აქ არ არის, უახლოესი ამბროლაურშია, ექვს კილომეტრში.
    ტაძარი დაბლობზეა და მთელი წელი ღიაა, ზამთარშიც.
  route: >-
    ამბროლაურიდან ონის მიმართულებით ჩრდილო-აღმოსავლეთით — ექვსიოდე კილომეტრი, ათი წუთი. თბილისიდან სულ
    321 კმ ქუთაისისა და ნაქერალას გავლით, დაახლოებით ხუთი საათი და ორმოცი წუთი. გზა ბოლომდე ასფალტია და
    კარგ მდგომარეობაშია. ეკლესია მთავარი გზიდან მარცხნივ, მდინარის თავზე ციცაბო კლდოვან ტერასაზე დგას
    და შორიდან ჩანს; შესახვევი მოკლეა და მოასფალტებული. საწვავი ამბროლაურში აიღე, ონამდე აღარაფერია. ეკონომ-კლასის
    მანქანა სავსებით საკმარისია.
en:
  name: Barakoni Church
  short: >-
    A domed church of 1753 at Tsesi, above the meeting of the Lukhuni and the Rioni — the last great work
    of medieval Georgian architecture.
  body: >-
    **Barakoni is the church with which medieval Georgian architecture ends.** It was built in 1753 in
    the village of Tsesi, above the point where the Lukhuni joins the Rioni, for Rostom, Duke of Racha.
    The builder, Avtandil Shulavreli, is named in the inscription on the east facade — a rarity in Georgia,
    where architects almost always remained anonymous.


    The plan is a cross-in-square with a dome, austere and tall. Barakoni's defining quality is proportion:
    the drum of the dome is long and slender, and the facades are pulled together so tightly that the
    church reads as larger than it is. The stone is a pale yellow-grey that catches the light differently
    through the day; in the evening, as the sun drops towards the western end of the valley, the west
    front warms noticeably.


    The decoration is carved, not painted. Around the windows, on the drum and at the ends of the cross
    arms there is deeply cut geometric and vegetal ornament, among the best Georgian stonework of the
    17th and 18th centuries. Inside, by contrast, the church is almost bare: no frescoes survive, and
    the space is high, cold and severe.


    The story ends unhappily. Rostom, who built Barakoni, lost his contest with King Solomon I of Imereti
    in 1769, and the dukedom of Racha was abolished. The church is the last substantial thing left from
    his rule.


    Barakoni is an active parish church. The yard is walled and well kept, with tall trees around it.
    In winter, with the leaves gone, the white stone stands out sharply against black branches; in spring
    the Rioni below runs loud and brown, and is best seen from the bridge a few hundred metres away.
  tip: >-
    Half an hour to an hour is plenty. You can drive into the yard, and parking is free and usually empty.
    The church is normally open; if it is locked, the key is kept in a neighbouring house and is worth
    asking for. Dress rules apply and headscarves are left by the door. There are no toilets or cafes
    at the site — the nearest are in Ambrolauri, six kilometres away. The church sits low in the valley
    and is accessible all year, including winter.
  route: >-
    From Ambrolauri head north-east towards Oni — about six kilometres, ten minutes. From Tbilisi the
    total is 321 km via Kutaisi and the Nakerala pass, roughly five hours and forty minutes. The road
    is asphalt throughout and in good condition. The church stands on a steep rocky spur above the river,
    to the left of the main road and is visible from some distance; the turning is short and paved. Fill
    up in Ambrolauri, as there is nothing until Oni. An economy car is entirely sufficient.
ru:
  name: Храм Бараконе
  short: >-
    Купольная церковь 1753 года в Цеси, над слиянием Лухуни и Риони — последнее большое произведение средневековой
    грузинской архитектуры.
  body: >-
    **Бараконе — та церковь, на которой средневековая грузинская архитектура заканчивается.** Она построена
    в 1753 году в селе Цеси, над местом впадения Лухуни в Риони, по заказу Ростома, эристава Рачи. Строитель,
    Автандил Шулаврели, назван по имени в надписи на восточном фасаде — редкость для Грузии, где зодчие
    почти всегда оставались безымянными.


    План крестово-купольный, строгий и высокий. Главное качество Бараконе — пропорции: барабан купола
    вытянут и тонок, а фасады собраны так плотно, что храм кажется больше, чем есть. Камень бледный, желтовато-серый,
    и свет ложится на него по-разному в течение дня; вечером, когда солнце уходит к западному концу ущелья,
    западный фасад заметно теплеет.


    Декор здесь резной, а не живописный. Вокруг окон, на барабане и на торцах крестовых рукавов — глубокая
    геометрическая и растительная резьба, один из лучших образцов грузинской работы по камню XVII–XVIII
    веков. Внутри же почти пусто: фресок не сохранилось, пространство высокое, холодное и суровое.


    История кончается печально. Ростом, построивший Бараконе, проиграл противостояние с имеретинским царём
    Соломоном I в 1769 году, и Рачинское эриставство было упразднено. Храм — последнее крупное, что осталось
    от его правления.


    Бараконе — действующая приходская церковь. Двор обнесён оградой и ухожен, вокруг высокие деревья.
    Зимой, без листвы, светлый камень резко выделяется на фоне чёрных ветвей; весной Риони внизу шумит
    и несёт мутную воду, и лучше всего это видно с моста в нескольких сотнях метров.
  tip: >-
    Получаса-часа вполне хватит. Во двор можно въехать, парковка бесплатная и обычно пустая. Церковь,
    как правило, открыта; если заперта, ключ держат в соседнем доме, и спросить стоит. Действуют правила
    одежды, платки лежат у входа. Туалетов и кафе на месте нет, ближайшие — в Амбролаури, в шести километрах.
    Храм стоит низко в долине и доступен круглый год, включая зиму.
  route: >-
    Из Амбролаури езжайте на северо-восток в сторону Они — около шести километров, десять минут. От Тбилиси
    всего 321 км через Кутаиси и перевал Накерала, примерно пять часов сорок минут. Дорога асфальтированная
    и в хорошем состоянии. Церковь стоит на крутом скалистом уступе над рекой, слева от трассы и видна
    издалека; съезд короткий и заасфальтированный. Заправляйтесь в Амбролаури — до Они ничего нет. Машины
    эконом-класса вполне достаточно.
fa:
  name: کلیسای باراکونی
  short: کلیسایی گنبددار از ۱۷۵۳ در تسسی، بالای پیوستگاه لوخونی و ریونی — آخرین اثر بزرگ معماری گرجی سده‌های
    میانه.
  body: >-
    **باراکونی همان کلیسایی است که معماری گرجی سده‌های میانه با آن پایان می‌یابد.** در سال ۱۷۵۳ در روستای
    تسسی، بالای جایی که رود لوخونی به ریونی می‌پیوندد، به سفارش روستوم، دوک راچا ساخته شد. سازندهٔ آن،
    آوتاندیل شولاورلی، در کتیبهٔ نمای شرقی به نام آمده است؛ چیزی کمیاب در گرجستان، جایی که معماران تقریباً
    همیشه گمنام می‌ماندند.


    نقشه صلیبی‌گنبدی است، سختگیر و بلند. ویژگی تعیین‌کنندهٔ باراکونی تناسب است: گریو گنبد کشیده و باریک
    است و نماها چنان جمع‌وجور بسته شده‌اند که کلیسا بزرگ‌تر از اندازهٔ واقعی به نظر می‌رسد. سنگ آن زرد-خاکستری
    روشن است و در ساعت‌های مختلف روز نور را جور دیگری می‌گیرد؛ عصرها که خورشید به انتهای غربی درّه می‌افتد،
    نمای غربی به‌روشنی گرم می‌شود.


    تزیین اینجا کنده‌کاری است نه نقاشی. گرداگرد پنجره‌ها، روی گریو و در انتهای بازوهای صلیب، نقش‌های هندسی
    و گیاهی عمیق کنده شده‌اند؛ از بهترین نمونه‌های سنگ‌تراشی گرجی سده‌های هفدهم و هجدهم. در مقابل، درون
    کلیسا تقریباً خالی است: از فرسک‌ها چیزی نمانده و فضا بلند و سرد و بی‌پیرایه است.


    داستان پایانی تلخ دارد. روستوم، سازندهٔ باراکونی، در ۱۷۶۹ در کشمکش با سلیمان یکم پادشاه ایمرتی شکست
    خورد و دوک‌نشین راچا برچیده شد. این کلیسا آخرین چیز بزرگی است که از حکومت او مانده است.


    باراکونی کلیسایی فعال است. حیاطش دیوار دارد و مرتب است و درختان بلند گرداگرد آن ایستاده‌اند. در زمستان،
    وقتی برگی نمانده، سنگ روشن در برابر شاخه‌های سیاه بسیار گویا می‌ایستد؛ در بهار ریونی در پایین پرصدا
    و گل‌آلود می‌گذرد و بهترین دیدش از پلی است چند صد متر آن‌سوتر.
  tip: >-
    نیم ساعت تا یک ساعت کاملاً بس است. می‌توانید تا داخل حیاط رانندگی کنید و پارکینگ رایگان و معمولاً
    خالی است. کلیسا معمولاً باز است؛ اگر قفل بود کلید در خانه‌ای همسایه نگهداری می‌شود و پرسیدنش می‌ارزد.
    قواعد پوشش برقرار است و روسری کنار در گذاشته شده. سرویس بهداشتی و کافه در محل نیست و نزدیک‌ترینشان
    در آمبرولائوری، شش کیلومتر آن‌سوتر است. کلیسا پایین درّه است و تمام سال، از جمله زمستان، در دسترس.
  route: >-
    از آمبرولائوری به سمت شمال‌شرق و اونی بروید — حدود شش کیلومتر، ده دقیقه. از تفلیس در مجموع ۳۲۱ کیلومتر
    از راه کوتائیسی و گردنهٔ ناکرالا، تقریباً پنج ساعت و چهل دقیقه. جاده تا انتها آسفالت و در وضعیت خوبی
    است. کلیسا بر زبانه‌ای صخره‌ای و تند بالای رود، در سمت چپ جادهٔ اصلی ایستاده و از دور دیده می‌شود؛
    انشعاب کوتاه و آسفالت است. باک را در آمبرولائوری پر کنید، چون تا اونی چیزی نیست. خودروی اقتصادی کاملاً
    کافی است.
he:
  name: כנסיית בראקוני
  short: >-
    כנסייה מכוּפפת מ-1753 בכפר צסי, מעל מפגש הלוחוני והריוני — יצירתה הגדולה האחרונה של האדריכלות הגאורגית
    של ימי הביניים.
  body: >-
    **בראקוני היא הכנסייה שבה מסתיימת האדריכלות הגאורגית של ימי הביניים.** היא נבנתה ב-1753 בכפר צסי,
    מעל הנקודה שבה נשפך הלוחוני אל הריוני, בהזמנת רוסטום, דוכס ראצ'ה. הבנאי, אווטנדיל שולאוורלי, נזכר
    בשמו בכתובת שעל החזית המזרחית — נדירות בגאורגיה, שבה נותרו האדריכלים כמעט תמיד אלמונים.


    התוכנית היא צלב חסום בריבוע עם כיפה, נוקשה וגבוהה. איכותה המכרעת של בראקוני היא הפרופורציה: תוף הכיפה
    ארוך וצר, והחזיתות מהודקות כל כך עד שהכנסייה נראית גדולה משהיא. האבן צהובה-אפורה בהירה ותופסת את האור
    אחרת בכל שעה; לפנות ערב, כשהשמש יורדת אל קצה העמק המערבי, החזית המערבית מתחממת בגוון ניכר.


    העיטור כאן מגולף ולא מצויר. סביב החלונות, על התוף ובקצות זרועות הצלב יש גילוף גיאומטרי וצמחי עמוק,
    מן הטובים שבעבודות האבן הגאורגיות של המאות ה-17 וה-18. בפנים, לעומת זאת, הכנסייה כמעט ריקה: ציורי
    קיר לא שרדו, והחלל גבוה, קר וחמור.


    הסיפור נגמר רע. רוסטום, שבנה את בראקוני, הפסיד ב-1769 במאבקו במלך סולומון הראשון מאימרתי, והדוכסות
    של ראצ'ה בוטלה. הכנסייה היא הדבר המשמעותי האחרון שנותר משלטונו.


    בראקוני היא כנסיית קהילה פעילה. החצר מוקפת חומה ומטופחת, ועצים גבוהים סביבה. בחורף, כשאין עלים, האבן
    הבהירה בולטת בחדות מול הענפים השחורים; באביב הריוני שלמטה שוצף ועכור, ורואים אותו היטב מן הגשר במרחק
    כמה מאות מטרים.
  tip: >-
    חצי שעה עד שעה מספיקות בהחלט. אפשר להיכנס עם הרכב אל החצר, החניה חינם ובדרך כלל ריקה. הכנסייה פתוחה
    בדרך כלל; אם היא נעולה, המפתח נשמר בבית שכן וכדאי לבקש. חלים כללי לבוש ומטפחות מונחות ליד הדלת. אין
    באתר שירותים או בתי קפה — הקרובים נמצאים באמברולאורי, שישה קילומטרים משם. הכנסייה יושבת נמוך בעמק
    ונגישה כל השנה, גם בחורף.
  route: >-
    מאמברולאורי סעו צפון-מזרחה לכיוון אוני — כשישה קילומטרים, עשר דקות. מטביליסי הסך הכול 321 ק״מ דרך
    קותאיסי ומעבר נקראלה, כחמש שעות וארבעים דקות. הכביש סלול לכל אורכו ובמצב טוב. הכנסייה עומדת על צוק
    סלעי תלול מעל הנהר, משמאל לכביש הראשי ונראית ממרחק; הפנייה קצרה וסלולה. מלאו דלק באמברולאורי, שכן
    עד אוני אין דבר. רכב חסכוני מספיק לחלוטין.
ar:
  name: كنيسة باراكوني
  short: >-
    كنيسة مقبّبة من عام 1753 في قرية تسيسي فوق ملتقى نهري لوخوني وريوني — آخر عمل كبير في العمارة الجورجية
    الوسيطة.
  body: >-
    **باراكوني هي الكنيسة التي تنتهي عندها العمارة الجورجية الوسيطة.** بُنيت عام 1753 في قرية تسيسي، فوق
    موضع انصباب نهر لوخوني في ريوني، بأمر روستوم دوق راتشا. وقد ذُكر بانيها، أفتانديل شولافريلي، بالاسم
    في نقش الواجهة الشرقية، وهو أمر نادر في جورجيا حيث ظل المعماريون مجهولين في الغالب.


    المخطط صليبي مقبّب، صارم ومرتفع. وأبرز ما يميز باراكوني هو التناسب: رقبة القبة طويلة نحيلة، والواجهات
    مشدودة بإحكام حتى لتبدو الكنيسة أكبر مما هي. الحجر أصفر مائل إلى الرمادي الفاتح، ويلتقط الضوء على
    نحو مختلف مع ساعات النهار؛ وعند المساء، حين تهبط الشمس نحو الطرف الغربي من الوادي، تدفأ الواجهة الغربية
    بوضوح.


    الزخرفة هنا منحوتة لا مرسومة. حول النوافذ وعلى الرقبة وفي أطراف أذرع الصليب نقش هندسي ونباتي غائر،
    من أجود أعمال الحجر الجورجية في القرنين السابع عشر والثامن عشر. أما الداخل فيكاد يكون خالياً: لم تبقَ
    رسوم جدارية، والفضاء مرتفع بارد شديد التقشف.


    وتنتهي القصة نهاية حزينة. فقد خسر روستوم، باني باراكوني، صراعه مع سليمان الأول ملك إيميريتي عام 1769،
    وأُلغيت دوقية راتشا. والكنيسة آخر شيء كبير بقي من حكمه.


    باراكوني كنيسة رعية عاملة. الفناء مسوّر ومعتنى به، وحوله أشجار عالية. وفي الشتاء، حين يتساقط الورق،
    ينتصب الحجر الفاتح بحدة أمام الأغصان السوداء؛ وفي الربيع يجري ريوني في الأسفل عالياً عكراً، ويُرى
    خير ما يُرى من الجسر على بُعد بضع مئات من الأمتار.
  tip: >-
    نصف ساعة إلى ساعة تكفي تماماً. يمكن إدخال السيارة إلى الفناء، والوقوف مجاني وفارغ عادة. الكنيسة مفتوحة
    في الغالب؛ وإن وجدتها مغلقة فالمفتاح في بيت مجاور ويستحق السؤال عنه. تُطبَّق قواعد اللباس والأغطية
    موضوعة عند الباب. لا دورات مياه ولا مقاهي في الموقع، وأقربها في أمبرولاوري على بُعد ستة كيلومترات.
    الكنيسة منخفضة في الوادي ويمكن الوصول إليها طوال السنة، والشتاء منها.
  route: >-
    من أمبرولاوري اتجه شمالاً شرقاً نحو أوني — نحو ستة كيلومترات، عشر دقائق. ومن تبليسي المجموع 321 كم
    عبر كوتايسي وممر ناكيرالا، أي نحو خمس ساعات وأربعين دقيقة. الطريق معبّد بكامله وبحالة جيدة. تقف الكنيسة
    على نتوء صخري حادّ فوق النهر، يسار الطريق الرئيسي وتُرى من بعيد، والمنعطف قصير ومعبّد. املأ الخزان
    في أمبرولاوري، فلا شيء حتى أوني. وسيارة اقتصادية تكفي تماماً.
