ka:
  name: ბარაკონის ტაძარი
  short: >-
    1753 წელს ერისთავ როსტომის ბრძანებით აგებული ტაძარი ლუხუნისა და რიონის შესართავთან — ქართული გუმბათოვანი
    ხუროთმოძღვრების ერთ-ერთი უკანასკნელი დიდი ძეგლი.
  body: >-
    **ბარაკონით ქართული გუმბათოვანი ტაძრის ხანგრძლივი ისტორია სრულდება.** ის 1753 წელს სოფელ წესთან, ციცაბო
    კლდეზე, ლუხუნისა და რიონის შესართავის თავზე, რაჭის ერისთავის, როსტომის (მართავდა 1750–1769 წლებში),
    ბრძანებით აშენდა. ოსტატი, ავთანდილ შულავრელი, აღმოსავლეთ ფასადის წარწერაშია მოხსენიებული — იშვიათობა
    ქვეყანაში, სადაც ტაძრების მშენებლები თითქმის ყოველთვის უსახელოდ რჩებოდნენ. ორი მდინარის შესართავთან
    მდგარ ბარაკონს ხშირად მცხეთის სვეტიცხოველს ადარებენ.


    როსტომს ცარიელ ადგილას არ დაუწყია. ტაძრის ჩრდილო-დასავლეთით ადრე რაჭის პირველი ერისთავის, რატი ლიპარიტის
    ძის, კარის ეკლესია იდგა — ტუფით ნაშენი ერთნავიანი ბაზილიკა ალებასტრის კანკელით. დღეს მისგან მხოლოდ
    საძირკვლის ქვებია შემორჩენილი.


    ახალი ტაძარი სწორკუთხაა, მინაშენების გარეშე; გუმბათი საკურთხევლის კუთხეებსა და ორ ბოძს ეყრდნობა. ნაშენია
    სოფელ იწიდან მოზიდული ღია ფერის ქვით, ფასადები კი უხვადაა მოჩუქურთმებული: გეომეტრიული და მცენარეული
    მოტივები სარკმლების ირგვლივ და გუმბათის ყელზე, ყველაზე ძველებური სახეები კი აღმოსავლეთ ფასადის ნიშებშია.
    ქართული საბჭოთა ენციკლოპედია დღევანდელ მნახველებზე თავშეკავებულია: მისი სტატიის მიხედვით, ორნამენტი
    მდიდარია, მაგრამ კედელს ზედ აკრავს და არქიტექტურიდან არ იზრდება. გუმბათი ოდესღაც თუთიით იყო გადახურული,
    დღეს კი სპილენძით ბრწყინავს.


    როსტომის აღსასრული მწარე აღმოჩნდა: 1769 წელს იმერეთის მეფე სოლომონ I-მა ის დაამარცხა და რაჭის საერისთავო
    გააუქმა. ბოლშევიკებმა ტაძარი დაკეტეს და შეურაცხყვეს, 1991 წლის მიწისძვრამ მსუბუქად დააზიანა, თუმცა
    მალევე აღადგინეს. დღეს ის კვლავ მოქმედი ეკლესიაა, ეზოში კი სოფლის სასაფლაოა.


    1939 წელს კ. ჭიჭინაძე წერდა: „კლდეზე სხივები კანკალებენ და ბარაკონი / თეთრად ქათქათებს, ვით ჯეჯილში
    ჩამჯდარი გედი“. საღამოს დაბალ შუქზე გზიდან ახედეთ — და მიხვდებით, რას გულისხმობდა პოეტი.
  tip: >-
    ნახევარი საათიდან საათამდე სავსებით საკმარისია. მანქანით ეკლესიის ეზომდე ახვალთ, პარკინგი უფასოა და
    იშვიათად არის გადატვირთული. ტაძარი ჩვეულებრივ ღიაა; თუ დაკეტილი დაგხვდათ, სოფელში იკითხეთ. ჩაიცვით
    თავშეკავებულად — ქალებს თავსაფარი და ქვედაკაბა, შორტებით კი არავინ — და გახსოვდეთ, რომ ეზო სოფლის
    სასაფლაოცაა. ტაძარს გარედან შემოუარეთ: აქ ჩამოსვლის მიზეზი ჩუქურთმაა, ოსტატის წარწერა კი აღმოსავლეთ
    ფასადზეა. ტუალეტი და კაფე აქ არ არის — უახლოესი ამბროლაურშია, 7 კილომეტრში. 660 მეტრ სიმაღლეზე მდგარი
    ტაძარი მთელი წლის განმავლობაში მისადგომია.
  route: >-
    ამბროლაურიდან შ16-ით აღმოსავლეთით, ონის მიმართულებით, დაახლოებით 7 კილომეტრი — ათი წუთი. თბილისიდან
    სულ დაახლოებით 319 კმ და ხუთ საათ-ნახევარია: ს1 (E60) მაგისტრალით ქუთაისამდე, შემდეგ შ17-ით ტყიბულისა
    და ნაქერალას უღელტეხილის გავლით ამბროლაურამდე. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია. ტაძარი
    რიონის თავზე, ციცაბო კლდოვან შვერილზე დგას და შორიდანვე ჩანს; ასასვლელი შესახვევი მოკლე და მოასფალტებულია.
    საწვავი ამბროლაურში ჩაასხით — ონამდე ბენზინგასამართი აღარ არის. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Barakoni Church
  short: >-
    Built in 1753 for Duke Rostom of Racha on a cliff where the Lukhuni meets the Rioni — one of the last
    great domed churches of old Georgia.
  body: >-
    **Barakoni is where the long story of the Georgian domed church draws to its close.** It was raised
    in 1753 at Tsesi, on a steep cliff above the point where the Lukhuni runs into the Rioni, by order
    of Rostom, Duke (eristavi) of Racha (ruled 1750–1769). Its builder, Avtandil Shulavreli, is named
    in the inscription on the east front — a rarity in a country whose church architects usually went
    unrecorded. Standing at the meeting of two rivers, it is often likened to Svetitskhoveli in Mtskheta.


    Rostom did not build on empty ground. North-west of the church stood the court chapel of the first
    duke of Racha, Rati son of Liparit: a single-nave basilica of tuff with an alabaster chancel screen.
    Only its foundation stones remain.


    The new church is a plain rectangle without annexes, its dome carried on the corners of the sanctuary
    and two piers. It is built of pale stone from Itsa, and the facades are thick with carving — geometric
    and plant motifs around the windows and on the drum, the oldest-looking of them in the niches of the
    east front. The Georgian Soviet Encyclopedia was cooler than today's visitors: its entry calls the
    ornament lavish but says it sits on the walls rather than growing out of them. The dome, once roofed
    in zinc, now wears copper.


    Rostom's end was bitter. In 1769 King Solomon I of Imereti defeated him and abolished the duchy. The
    Bolsheviks later closed and desecrated the church, and the 1991 earthquake damaged it slightly before
    a quick repair. Today it is a working church again, with the village cemetery in its yard.


    In 1939 the poet K. Chichinadze saw it 'gleaming white, like a swan settled in young wheat'. Look
    up from the road in low evening light and you will see what he meant.
  tip: >-
    Half an hour to an hour is enough. You can drive up to the churchyard, where parking is free and rarely
    busy. The church is usually open; if not, ask in the village. Dress modestly — headscarves and skirts
    for women, no shorts for anyone — and remember that the yard is also the village cemetery. Walk right
    round the outside: the carving is the reason to come, and the builder's inscription is on the east
    front. There are no toilets or cafés; the nearest are in Ambrolauri, 7 km away. At 660 metres the
    site is open all year.
  route: >-
    From Ambrolauri follow the Sh16 east towards Oni for about 7 km — ten minutes. From Tbilisi the whole
    run is about 319 km and five and a half hours: the S1 (E60) to Kutaisi, then the Sh17 through Tkibuli
    and over the Nakerala pass to Ambrolauri. The road is asphalt all the way and in good condition. The
    church stands on a steep rocky spur above the Rioni and shows itself well before you reach it; the
    turning up is short and paved. Fill up in Ambrolauri, as there is nothing before Oni. An economy car
    is entirely sufficient.
ru:
  name: Храм Баракони
  short: >-
    Построен в 1753 году для эристави Рачи Ростома на скале у слияния Лухуни и Риони — один из последних
    великих купольных храмов старой Грузии.
  body: >-
    **Баракони — это место, где долгая история грузинского купольного храма подходит к концу.** Его возвели
    в 1753 году в Цеси, на крутой скале над местом, где Лухуни впадает в Риони, по велению Ростома, эристави
    (владетельного князя) Рачи, правившего в 1750–1769 годах. Имя строителя, Автандила Шулаврели, названо
    в надписи на восточном фасаде — редкость для страны, где зодчие храмов обычно оставались безымянными.
    Стоящий у слияния двух рек, Баракони нередко сравнивают со Светицховели в Мцхете.


    Ростом строил не на пустом месте. К северо-западу от храма стояла придворная церковь первого эристави
    Рачи, Рати, сына Липарита: однонефная базилика из туфа с алебастровой алтарной преградой. От неё остались
    лишь камни фундамента.


    Новый храм — простой прямоугольник без пристроек; купол опирается на углы алтаря и два столба. Он
    сложен из светлого камня из Ицы, а фасады густо покрыты резьбой — геометрическими и растительными
    мотивами вокруг окон и на барабане; самые архаичные на вид — в нишах восточного фасада. Грузинская
    советская энциклопедия оценивала храм сдержаннее нынешних путешественников: орнамент, по её словам,
    щедр, но лежит на стенах, а не вырастает из них. Купол, некогда крытый цинком, теперь покрыт медью.


    Конец Ростома был горьким. В 1769 году имеретинский царь Соломон I разбил его и упразднил Рачинское
    эриставство. Позднее большевики закрыли и осквернили храм, а землетрясение 1991 года слегка повредило
    его, но вскоре его отремонтировали. Сегодня это снова действующая церковь, а в её ограде — сельское
    кладбище.


    В 1939 году поэт К. Чичинадзе увидел его «сверкающе белым, словно лебедь, опустившийся на молодую
    пшеницу». Взгляните на него с дороги в низком вечернем свете — и вы поймёте, что он имел в виду.
  tip: >-
    Хватит от получаса до часа. К церковной ограде можно подъехать на машине; парковка бесплатная и редко
    бывает занята. Храм обычно открыт, если нет — спросите в селе. Одевайтесь скромно: женщинам — платок
    и юбка, всем — никаких шорт; помните, что двор храма — ещё и сельское кладбище. Обойдите храм кругом:
    ради резьбы сюда и едут, а надпись строителя — на восточном фасаде. Туалетов и кафе нет; ближайшие
    — в Амбролаури, в 7 км. На высоте 660 метров храм доступен круглый год.
  route: >-
    Из Амбролаури по Sh16 на восток в сторону Они около 7 км — десять минут. Из Тбилиси весь путь около
    319 км и пять с половиной часов: по S1 (E60) до Кутаиси, затем по Sh17 через Ткибули и перевал Накерала
    до Амбролаури. Асфальт на всём пути, в хорошем состоянии. Храм стоит на крутом скалистом отроге над
    Риони и виден задолго до подъезда; поворот к нему короткий и асфальтированный. Заправьтесь в Амбролаури:
    до Они заправок нет. Машины эконом-класса вполне достаточно.
fa:
  name: کلیسای باراکونی
  short: >-
    ساخته‌شده در سال ۱۷۵۳ برای رستم، اریستاوی راچا، بر صخره‌ای در محل پیوستن لوخونی به ریونی؛ یکی از واپسین
    کلیساهای گنبددار بزرگ گرجستانِ کهن.
  body: >-
    **باراکونی جایی است که داستان دراز کلیسای گنبددار گرجی به پایان خود نزدیک می‌شود.** این کلیسا در سال
    ۱۷۵۳ در تسسی، بر صخره‌ای پرشیب بالای نقطه‌ای که لوخونی به ریونی می‌ریزد، به فرمان رستم، اریستاوی (دوک)
    راچا که از ۱۷۵۰ تا ۱۷۶۹ حکم راند، برپا شد. نام سازنده‌اش، آوتاندیل شولاورلی، در کتیبهٔ نمای شرقی آمده
    است؛ چیزی کمیاب در سرزمینی که معماران کلیساهایش معمولاً بی‌نام ماندند. باراکونی را که در محل به‌هم‌رسیدن
    دو رود ایستاده، اغلب با سوتیتسخولی در متسختا مقایسه می‌کنند.


    رستم بر زمینی خالی بنا نکرد. در شمال غربی کلیسا، نمازخانهٔ درباری نخستین دوک راچا، راتی پسر لیپاریت،
    قرار داشت: باسیلیکایی تک‌شبستانی از سنگ توف با دیوارهٔ جداکنندهٔ جایگاه مذبح از سنگ آلباستر. جز سنگ‌های
    پی آن چیزی نمانده است.


    کلیسای تازه مستطیلی ساده و بی‌هیچ الحاقیه است؛ گنبدش بر گوشه‌های جایگاه مذبح و دو پایه استوار است.
    آن را از سنگ روشن ایتسا ساخته‌اند و نماهایش سرشار از کنده‌کاری است: نقش‌مایه‌های هندسی و گیاهی گرداگرد
    پنجره‌ها و بر ساقهٔ گنبد، و کهن‌ترین‌شان به ظاهر، در طاقچه‌های نمای شرقی. دانشنامهٔ شوروی گرجستان
    از بازدیدکنندگان امروز خوددارتر است: به گفتهٔ مدخل آن، تزیین سخاوتمندانه است، اما بر دیوارها نشسته،
    نه اینکه از دلشان روییده باشد. گنبد که زمانی پوشش روی داشت، اکنون جامه‌ای از مس بر تن دارد.


    پایان کار رستم تلخ بود. در سال ۱۷۶۹ سولومون یکم، پادشاه ایمرتی، او را شکست داد و دوک‌نشین را برچید.
    بعدها بلشویک‌ها کلیسا را بستند و بی‌حرمت کردند، و زمین‌لرزهٔ ۱۹۹۱ آسیبی اندک به آن رساند که زود ترمیم
    شد. امروز کلیسا دوباره دایر است و گورستان روستا در حیاط آن قرار دارد.


    در سال ۱۹۳۹ شاعری به نام ک. چیچینادزه آن را «سپید و درخشان، چون قویی که بر گندم‌زار نورسته نشسته باشد»
    دید. در نور کم‌رمق غروب از جاده سر بلند کنید تا ببینید چه می‌گفت.
  tip: >-
    نیم ساعت تا یک ساعت کافی است. می‌توانید تا حیاط کلیسا با خودرو بالا بروید؛ پارکینگ رایگان است و به‌ندرت
    شلوغ. کلیسا معمولاً باز است؛ اگر نبود، در روستا بپرسید. پوشش مناسب داشته باشید: روسری و دامن برای
    زنان و برای همه، بدون شلوارک؛ و به یاد داشته باشید که حیاط، گورستان روستا نیز هست. دور تا دور بنا
    را پیاده بگردید: کنده‌کاری‌ها دلیل آمدن به اینجاست و کتیبهٔ سازنده بر نمای شرقی است. سرویس بهداشتی
    و کافه‌ای نیست؛ نزدیک‌ترین‌ها در آمبرولائوری‌اند، ۷ کیلومتر دورتر. این مکان در ارتفاع ۶۶۰ متری در
    تمام سال در دسترس است.
  route: >-
    از آمبرولائوری جادهٔ Sh16 را به سمت شرق و به سوی اونی حدود ۷ کیلومتر بروید؛ ده دقیقه راه است. از تفلیس
    کل مسیر حدود ۳۱۹ کیلومتر و پنج ساعت و نیم است: جادهٔ S1 (E60) تا کوتائیسی، سپس جادهٔ Sh17 از راه تکیبولی
    و گردنهٔ ناکرالا تا آمبرولائوری. جاده سراسر آسفالت و در وضعیت خوبی است. کلیسا بر دماغه‌ای صخره‌ای
    و پرشیب بالای ریونی ایستاده و مدت‌ها پیش از رسیدن پیداست؛ راه فرعیِ بالارو کوتاه و آسفالت است. در
    آمبرولائوری سوخت بگیرید، چون تا اونی چیزی نیست. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: כנסיית בראקוני
  short: >-
    נבנתה ב-1753 עבור רוסטום, הדוכס של ראצ'ה, על צוק במפגש הלוחוני עם הריוני — אחת מכנסיות הכיפה הגדולות
    האחרונות של גאורגיה הישנה.
  body: >-
    **בבראקוני מגיע אל סופו הסיפור הארוך של כנסיית הכיפה הגאורגית.** היא הוקמה ב-1753 בצסי, על צוק תלול
    מעל המקום שבו הלוחוני נשפך אל הריוני, בפקודת רוסטום, הדוכס (אריסטאווי) של ראצ'ה, ששלט בשנים 1750–1769.
    שם הבנאי, אבטנדיל שולאברלי, מופיע בכתובת שבחזית המזרחית — דבר נדיר בארץ שבה אדריכלי הכנסיות נותרו
    בדרך כלל אלמונים. משום שהיא עומדת במפגש של שני נהרות, משווים אותה לעתים קרובות לסבטיצחובלי שבמצחתה.


    רוסטום לא בנה על קרקע ריקה. מצפון-מערב לכנסייה עמדה קפלת החצר של הדוכס הראשון של ראצ'ה, רטי בן ליפריט:
    בזיליקה חד-ספינתית מאבן טוף, ובה מחיצת מזבח מבהט. נותרו ממנה רק אבני היסוד.


    הכנסייה החדשה היא מלבן פשוט ללא אגפים נלווים, וכיפתה נשענת על פינות אזור המזבח ועל שני עמודים. היא
    בנויה מאבן בהירה שהובאה מאיצה, והחזיתות עמוסות גילופים — מוטיבים גאומטריים וצמחיים סביב החלונות ועל
    תוף הכיפה, והעתיקים שבהם למראה בגומחות החזית המזרחית. האנציקלופדיה הגאורגית הסובייטית מתלהבת פחות
    מהמבקרים של היום: לפי הערך שלה, העיטור שופע, אבל מונח על הקירות במקום לצמוח מתוכם. הכיפה, שכוסתה פעם
    באבץ, מצופה היום נחושת.


    סופו של רוסטום היה מר. ב-1769 הביס אותו סולומון הראשון, מלך אימרטי, וביטל את הדוכסות. מאוחר יותר סגרו
    הבולשביקים את הכנסייה וחיללו אותה, ורעידת האדמה של 1991 פגעה בה קלות, אך היא תוקנה במהירות. היום זו
    שוב כנסייה פעילה, ובחצרה בית הקברות של הכפר.


    ב-1939 ראה אותה המשורר ק' צ'יצ'ינאדזה "זוהרת בלובנה, כמו ברבור שנח בשדה חיטה צעירה". הרימו את עיניכם
    מן הכביש באור הנמוך של הערב, ותבינו למה התכוון.
  tip: >-
    חצי שעה עד שעה מספיקות. אפשר לנסוע עד חצר הכנסייה, והחניה שם חינמית ולעתים רחוקות עמוסה. הכנסייה בדרך
    כלל פתוחה; אם לא, שאלו בכפר. התלבשו בצניעות — כיסוי ראש וחצאית לנשים, ובלי מכנסיים קצרים לאף אחד —
    וזכרו שהחצר היא גם בית הקברות של הכפר. הקיפו את המבנה מבחוץ: הגילופים הם הסיבה לבוא, וכתובת הבנאי
    נמצאת בחזית המזרחית. אין שירותים או בתי קפה; הקרובים ביותר באמברולאורי, במרחק 7 ק"מ. האתר, בגובה 660
    מטר, פתוח כל השנה.
  route: >-
    מאמברולאורי סעו מזרחה בכביש Sh16 לכיוון אוני כ-7 ק"מ — עשר דקות. מטביליסי הדרך כולה כ-319 ק"מ וחמש
    שעות וחצי: כביש S1 ‏(E60) עד קוטאיסי, ומשם כביש Sh17 דרך טקיבולי ומעל מעבר נקרלה עד אמברולאורי. הכביש
    סלול לכל אורכו ובמצב טוב. הכנסייה עומדת על שלוחת סלע תלולה מעל הריוני ונראית הרבה לפני שמגיעים אליה;
    הפנייה אליה קצרה וסלולה. תדלקו באמברולאורי, כי עד אוני אין דבר. רכב מקטגוריית אקונומי מספיק בהחלט.
ar:
  name: كنيسة باراكوني
  short: >-
    شُيّدت عام 1753 لروستوم، دوق راتشا، على جرف عند ملتقى نهر لوخوني بنهر ريوني، وهي من آخر الكنائس الكبرى
    ذات القباب في جورجيا القديمة.
  body: >-
    **في باراكوني تبلغ الحكاية الطويلة للكنيسة الجورجية ذات القبة خاتمتها.** شُيّدت عام 1753 في تسيسي،
    على جرف شديد الانحدار فوق النقطة التي يصبّ فيها نهر لوخوني في ريوني، بأمر من روستوم، دوق (إريستافي)
    راتشا الذي حكم بين 1750 و1769. ويرد اسم بانيها، أفتانديل شولافريلي، في النقش على الواجهة الشرقية،
    وهو أمر نادر في بلد ظلّ مهندسو كنائسه في الغالب مجهولي الأسماء. ولأنها تقوم عند ملتقى نهرين، كثيراً
    ما تُشبَّه بكاتدرائية سفيتيتسخوفيلي في متسخيتا.


    لم يبنِ روستوم على أرض خالية. فإلى الشمال الغربي من الكنيسة كانت تقوم كنيسة البلاط الخاصة بأول دوق
    لراتشا، راتي بن ليباريت: بازيليكا ذات صحن واحد من حجر التوف، فيها حاجز هيكل من المرمر الألباستري.
    ولم يبقَ منها سوى حجارة الأساس.


    الكنيسة الجديدة مستطيل بسيط بلا ملحقات، وتقوم قبتها على زوايا الهيكل وعلى دعامتين. بُنيت من حجر فاتح
    اللون جُلب من إيتسا، وواجهاتها مكسوّة بالنقوش: زخارف هندسية ونباتية حول النوافذ وعلى رقبة القبة، وأقدمها
    مظهراً في كوّات الواجهة الشرقية. والموسوعة السوفيتية الجورجية أقلّ حماسة من زوار اليوم: فالزخرفة بحسب
    مدخلها سخية، لكنها موضوعة على الجدران لا نابتة منها. أما القبة التي كانت مكسوّة بالزنك يوماً، فغطاؤها
    اليوم من النحاس.


    كانت نهاية روستوم مريرة. ففي عام 1769 هزمه ملك إيميريتي سليمان الأول وألغى الدوقية. ثم أغلق البلاشفة
    الكنيسة ودنّسوها، وألحق بها زلزال 1991 ضرراً طفيفاً سرعان ما أُصلح. واليوم عادت تُقام فيها الصلوات،
    وفي باحتها مقبرة القرية.


    في عام 1939 رآها الشاعر ك. تشيتشينادزه «بيضاء متلألئة، كبجعة حطّت في حقل قمح فتيّ». ارفع بصرك من الطريق
    في ضوء المساء الخفيض، وستفهم ما قصده.
  tip: >-
    تكفي نصف ساعة إلى ساعة. يمكنك الصعود بالسيارة حتى باحة الكنيسة، حيث الموقف مجاني ونادراً ما يزدحم.
    الكنيسة مفتوحة عادةً؛ وإن لم تكن، فاسأل في القرية. التزم اللباس المحتشم: غطاء الرأس والتنورة للنساء،
    ولا سراويل قصيرة لأحد، وتذكّر أن الباحة هي أيضاً مقبرة القرية. طُف حول المبنى من الخارج: فالنقوش هي
    سبب المجيء، ونقش البنّاء على الواجهة الشرقية. لا دورات مياه ولا مقاهٍ؛ أقربها في أمبرولاوري على بُعد
    7 كم. والموقع، على ارتفاع 660 متراً، مفتوح طوال العام.
  route: >-
    من أمبرولاوري اسلك الطريق Sh16 شرقاً باتجاه أوني نحو 7 كم، في قرابة عشر دقائق. ومن تبليسي تبلغ الرحلة
    كلها نحو 319 كم وخمس ساعات ونصفاً: الطريق S1 ‏(E60) حتى كوتايسي، ثم الطريق Sh17 عبر تكيبولي وفوق ممر
    ناكيرالا حتى أمبرولاوري. الطريق معبّد على طوله وفي حالة جيدة. تقوم الكنيسة على نتوء صخري شديد الانحدار
    فوق ريوني وتظهر قبل الوصول إليها بوقت طويل؛ والمنعطف الصاعد إليها قصير ومعبّد. تزوّد بالوقود في أمبرولاوري،
    إذ لا شيء قبل أوني. وتفي سيارة اقتصادية بالغرض تماماً.
