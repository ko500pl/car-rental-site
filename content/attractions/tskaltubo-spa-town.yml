ka:
  name: წყალტუბო
  short: >-
    საბჭოთა კურორტი, თბილი რადონის წყაროების გარშემო წრედ დაგეგმილი: მოქმედი აბანოები და სანატორიუმები,
    რომლებსაც ნელ-ნელა ტყე ეპატრონება.
  body: >-
    **წყალტუბოს წყალი მიწიდან 33–35 გრადუსით ამოდის, ისე, რომ გათბობა არ სჭირდება, და მთელი საბჭოთა ქალაქი
    სწორედ მის გარშემო, წრედ დაიხაზა.**


    ამ წყაროებს მოსკოვის დაინტერესებამდე დიდი ხნით ადრე იცნობდნენ. ქართული წყაროები მათ VII–IX საუკუნეებში
    ახსენებენ, XIII საუკუნეში კი მეფემ სამკურნალო წყაროები და აბანოები გელათის წინამძღვარ იაკობს უბოძა.
    1782 წლიდან მათზე გერმანელი ბუნებისმეტყველებიც წერდნენ. საბჭოთა ხელისუფლებამ წყაროები მრეწველობად
    აქცია: მშენებლობა 1926 წელს დაიწყო, 1931 წლის დადგენილებით წყალტუბო ბალნეოლოგიურ კურორტად გამოცხადდა,
    1950–1951 წლებში კი არქიტექტორებმა ი. ზაალიშვილმა და ვ. კედიამ ის გეგმა შეადგინეს, რომელიც რუკაზე
    დღესაც იკითხება: შუაში დიდი პარკი აბანოებით, გარშემო კი სანატორიუმების რგოლი. ქალაქის სტატუსი 1953
    წელს მიიღო.


    აყვავების ხანაში აქ წელიწადში 125 000-მდე ადამიანი ჩამოდიოდა სააბაზანოდ. სანატორიუმებში სტალინური
    კლასიციზმი ქართულ ორნამენტს ერწყმოდა, რამდენიმე მათგანი კი გერმანელმა სამხედრო ტყვეებმა ააშენეს. 1950
    წელს აგებული მეექვსე აბანო დღეს მოქმედთაგან უდიდესია. მეცხრე აბანოში შემორჩენილია სტალინის ფრიზი და
    პირადი აუზი, რომელშიც ის ბანაობდა.


    მერე საბჭოთა კავშირი დაიშალა და პაციენტებმა სიარული შეწყვიტეს. 1993 წლიდან დაცარიელებულ სანატორიუმებში
    აფხაზეთის ომით დევნილი 9000-მდე ადამიანი დასახლდა და ბავშვები იმ დარბაზებში იზრდებოდნენ, რომლებიც
    საბჭოთა მშრომელთა დასასვენებლად აშენდა.


    დღეს აქ ძირითადად ფეხით დადიხართ. პარკის მიღმა სახელები გამქრალი სახელმწიფოს სიას ჰგავს: „მეტალურგი“,
    „მედეა“, „იმერეთი“, „თბილისი“, „მეშახტე“. რამდენიმე მათგანს სასტუმროდ აკეთებენ, სხვები ღიად დგას,
    უსახურავოდ, აივნებზე ამოსული ახალგაზრდა ხეებით.


    წყალტუბო ერთდროულად კურორტიც არის, ნანგრევიც და სამშენებლო მოედანიც. ჩამოდით, სანამ არჩევანს გააკეთებს.
  tip: >-
    ნახევარი დღე გამოყავით. ჩაიცვით მაგარძირიანი ფეხსაცმელი და წაიღეთ ფანარი: ნანგრევები მუზეუმი არ არის.
    შიგნით განათება არ არის, იატაკი ზოგან ჩანგრეულია, მოაჯირები აკლია, ზოგ კორპუსში კი დღემდე ცხოვრობენ,
    ამიტომ შესვლამდე ჰკითხეთ და ზედა სართულებზე მარტო ნუ ახვალთ. პარკი უფასოა. მოქმედ აბანოებში ერთჯერადი
    სეანსის შესახებ იკითხეთ; სრული კურსი 20–24 დღეს გრძელდება და ექიმის მეთვალყურეობით მიმდინარეობს. კაფეები,
    ბანკომატი და ტუალეტი პარკთანაა. ზაფხული ნოტიოა და კოღოებიანი. პრომეთეს მღვიმე რამდენიმე კილომეტრით
    ჩრდილოეთითაა.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორისა და ხაშურის გავლით, რიკოთის უღელტეხილზე გადასვლით
    იარეთ ქუთაისამდე, დაახლოებით 220 კმ. ქუთაისიდან შ15-ს, ცაგერისა და ლენტეხისკენ მიმავალ გზას დაადექით
    და ბოლო ათიოდე კილომეტრი ჩრდილო-დასავლეთით გაიარეთ წყალტუბომდე; გზა მონიშნულია და კარგი საფარი აქვს.
    სულ დაახლოებით 245 კმ-ია და სამი საათი და ოცდაათი წუთი, მთლიანად ასფალტზე, ამიტომ ეკონომ-კლასის მანქანაც
    საკმარისია. საწვავი ქუთაისში ჩაასხით. ცენტრალური პარკის გარშემო პარკინგი უფასოა, სანატორიუმებთან კი
    უბრალოდ გზისპირას გაჩერდებით. სათაფლია და პრომეთეს მღვიმე ორივე ათ წუთზე ნაკლებ სავალზეა.
en:
  name: Tskaltubo
  short: >-
    A Soviet spa town laid out in a ring around warm radon springs, where working bathhouses stand beside
    sanatoriums slowly turning into forest.
  body: >-
    **Tskaltubo's water leaves the ground at 33–35 °C, warm enough to bathe in as it is, and a whole Soviet
    town was drawn in a circle around it.**


    The springs were known long before Moscow took an interest. Georgian sources place them in the 7th–9th
    centuries, and in the 13th century a king granted the healing springs and baths to Iakob, abbot of
    Gelati. German naturalists wrote about them from 1782. The Soviets turned them into an industry. Building
    began in 1926, a 1931 decree made Tskaltubo a spa centre, and in 1950–51 the architects I. Zaalishvili
    and V. Kedia drew the plan you can still read on the map: a large park at the centre with the bathhouses,
    and the sanatoriums in a ring around it. Town status followed in 1953.


    At its peak some 125,000 people a year came to soak. The sanatoriums mixed Stalinist classicism with
    Georgian ornament, and several were built by German prisoners of war. Bathhouse No. 6, built in 1950,
    is the largest still working. In Bathhouse No. 9 a frieze of Stalin survives above the private pool
    where he bathed.


    Then the Union ended and the patients stopped coming. From 1993 the empty sanatoriums housed some
    9,000 people displaced by the war in Abkhazia, and children grew up in halls built for convalescing
    Soviet workers.


    What you do here now is walk. Beyond the park the names read like a roll call of a vanished state:
    Metallurg, Medea, Imereti, Tbilisi, Meshakhte ('the Miner'). A few are being turned into hotels. Others
    stand open, their roofs gone and young trees rooting in the balconies.


    Tskaltubo is a spa, a ruin and a building site all at once; come before it chooses.
  tip: >-
    Give it half a day. Wear solid shoes and bring a torch: the ruins are no museum, with no lighting,
    missing floors and absent handrails, and some blocks are still lived in, so ask before you walk in
    and never climb the upper storeys alone. The park is free. At the working bathhouses ask about single
    sessions; a full cure lasts 20–24 days and involves a doctor. Cafés, an ATM and toilets are near the
    park. Summer is humid, with mosquitoes. Prometheus Cave is a few kilometres north.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri and over the Rikoti Pass to Kutaisi, about
    220 km. From Kutaisi take the Sh15, the road towards Tsageri and Lentekhi, north-west for the last
    ten kilometres or so into Tskaltubo; it is signed and well surfaced. In total it is about 245 km and
    three and a half hours, all on asphalt, and an economy car is enough. Fuel up in Kutaisi. Parking
    around the central park is free, and at the sanatoriums you simply pull in at the kerb. Sataplia and
    Prometheus Cave are both within ten minutes' drive.
ru:
  name: Цхалтубо
  short: >-
    Советский курорт, выстроенный кольцом вокруг тёплых радоновых источников: действующие бани и санатории,
    медленно уходящие в лес.
  body: >-
    **Вода Цхалтубо выходит из земли при 33–35 °C — достаточно тёплой, чтобы купаться в ней без подогрева,
    — и вокруг неё был начерчен целый советский город в форме круга.**


    Источники были известны задолго до того, как ими заинтересовалась Москва. Грузинские источники упоминают
    их уже в VII–IX веках, а в XIII веке царь передал целебные источники и бани Иакову, игумену Гелати.
    Немецкие натуралисты писали о них с 1782 года. Советская власть превратила их в индустрию. Строительство
    началось в 1926 году, указ 1931 года сделал Цхалтубо курортным центром, а в 1950–1951 годах архитекторы
    И. Заалишвили и В. Кедия разработали план, который до сих пор виден на карте: большой парк в центре
    с банями и санатории кольцом вокруг него. В 1953 году Цхалтубо получил статус города.


    В пик посещаемости сюда приезжало купаться около 125 000 человек в год. Санатории смешивали сталинский
    классицизм с грузинским орнаментом, и несколько из них строили немецкие военнопленные. Баня № 6, построенная
    в 1950 году, — крупнейшая из действующих. В бане № 9 над личным бассейном, где купался сам Сталин,
    сохранился фриз с его изображением.


    Затем Союз распался, и пациенты перестали приезжать. С 1993 года в пустых санаториях жили около 9000
    человек, вынужденных бежать из-за войны в Абхазии, и дети росли в залах, построенных для отдыха советских
    трудящихся.


    Сегодня здесь просто гуляют. За парком имена читаются как перекличка исчезнувшего государства: «Металлург»,
    «Медея», «Имерети», «Тбилиси», «Мешахте» («Шахтёр»). Некоторые переделывают в отели. Другие стоят
    открытые всем ветрам, без крыш, а молодые деревья пускают корни на балконах.


    Цхалтубо — одновременно курорт, руина и стройка; приезжайте, пока он не сделал выбор.
  tip: >-
    Отведите на это полдня. Наденьте крепкую обувь и возьмите фонарик: руины — не музей, без освещения,
    с провалившимися полами и без перил, а в некоторых блоках до сих пор живут люди, так что спрашивайте
    разрешения, прежде чем заходить, и никогда не поднимайтесь на верхние этажи одни. Парк бесплатный.
    В действующих банях спрашивайте о разовых сеансах; полный курс лечения длится 20–24 дня и проходит
    под наблюдением врача. Кафе, банкомат и туалеты рядом с парком. Летом влажно, много комаров. Пещера
    Прометея — в нескольких километрах к северу.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад через Гори и Хашури, через Рикотский перевал, до Кутаиси —
    около 220 км. Из Кутаиси по Sh15, дороге в сторону Цагери и Лентехи, на северо-запад последние десять
    с небольшим километров до Цхалтубо; есть указатели, покрытие хорошее. Всего около 245 км и три с половиной
    часа, весь путь асфальтирован, машины эконом-класса достаточно. Заправляйтесь в Кутаиси. Парковка
    у центрального парка бесплатная, а у санаториев просто съезжают на обочину. Сатаплия и пещера Прометея
    — в десяти минутах езды.
fa:
  name: تسکالتوبو
  short: >-
    شهرک آب‌درمانی شوروی، حلقه‌وار گرد چشمه‌های گرم رادون؛ حمام‌های فعال کنار آسایشگاه‌هایی که آرام‌آرام
    جنگل می‌شوند.
  body: >-
    **آب تسکالتوبو با دمای ۳۳ تا ۳۵ درجهٔ سانتی‌گراد از زمین بیرون می‌آید — به‌قدر کافی گرم برای آب‌تنی
    بی‌آنکه گرمش کنند — و شهری کامل از دوران شوروی به شکل حلقه‌ای گرداگرد آن ترسیم شد.**


    این چشمه‌ها مدت‌ها پیش از توجه مسکو شناخته‌شده بودند. منابع گرجی آن‌ها را به سده‌های هفتم تا نهم منسوب
    می‌کنند، و در سدهٔ سیزدهم پادشاهی چشمه‌های شفابخش و حمام‌ها را به یعقوب، رئیس صومعهٔ گلاتی، بخشید.
    طبیعت‌شناسان آلمانی از سال ۱۷۸۲ دربارهٔ آن‌ها نوشتند. شوروی آن‌ها را به صنعتی بدل کرد. ساخت‌وساز از
    سال ۱۹۲۶ آغاز شد، فرمانی در سال ۱۹۳۱ تسکالتوبو را به مرکز اسپا بدل کرد، و در سال‌های ۱۹۵۰ تا ۱۹۵۱
    معماران زاالیشویلی و کدیا نقشه‌ای کشیدند که هنوز بر نقشه دیده می‌شود: پارکی بزرگ در مرکز با حمام‌ها،
    و آسایشگاه‌ها حلقه‌وار پیرامون آن. شهر رسماً در سال ۱۹۵۳ این عنوان را گرفت.


    در اوج خود، سالانه حدود ۱۲۵٬۰۰۰ نفر برای غسل به این‌جا می‌آمدند. آسایشگاه‌ها کلاسیسیسم استالینی را
    با تزیینات گرجی می‌آمیختند، و شماری از آن‌ها را اسیران جنگی آلمانی ساخته بودند. حمام شمارهٔ ۶، ساخته‌شده
    در سال ۱۹۵۰، بزرگ‌ترین حمام فعال است. در حمام شمارهٔ ۹ نگاره‌ای از استالین بالای حوض خصوصی‌اش، جایی
    که خود او غسل می‌کرد، همچنان باقی است.


    سپس اتحاد شوروی فروپاشید و بیماران دیگر نیامدند. از سال ۱۹۹۳ آسایشگاه‌های خالی حدود ۹۰۰۰ نفر آوارهٔ
    جنگ آبخازیا را در خود جای دادند، و کودکانی در سالن‌هایی که برای نقاهت کارگران شوروی ساخته شده بود،
    بزرگ شدند.


    آن‌چه امروز این‌جا می‌کنید، پیاده‌روی است. آن‌سوی پارک، نام‌ها چون فهرست‌نامی از دولتی ناپدید خوانده
    می‌شوند: متالورگ، مدئا، ایمرتی، تفلیس، مشاخته («معدنچی»). شماری از آن‌ها به هتل بدل می‌شوند. دیگران
    بی‌در و بی‌سقف رها شده‌اند و درختان جوان در بالکن‌هایشان ریشه دوانده‌اند.


    تسکالتوبو در یک زمان هم اسپاست، هم ویرانه، هم کارگاهی در حال ساخت؛ پیش از آن‌که سرنوشتش را برگزیند،
    بیایید.
  tip: >-
    نیم‌روز برای آن بگذارید. کفشی محکم بپوشید و چراغ‌قوه‌ای همراه ببرید: ویرانه‌ها موزه‌ای نیستند، بدون
    روشنایی، با کف‌های فروریخته و بی‌نرده، و برخی بلوک‌ها هنوز مسکونی‌اند، پس پیش از ورود اجازه بگیرید
    و هرگز به‌تنهایی به طبقات بالاتر نروید. پارک رایگان است. در حمام‌های فعال دربارهٔ جلسات تکی بپرسید؛
    درمان کامل ۲۰ تا ۲۴ روز طول می‌کشد و به پزشک نیاز دارد. کافه، دستگاه خودپرداز و سرویس بهداشتی نزدیک
    پارک است. تابستان مرطوب است، با پشه‌های بسیار. غار پرومتئوس چند کیلومتر در شمال قرار دارد.
  route: >-
    از تفلیس، مسیر S1 (E60) را به سوی غرب، از میان گوری و خاشوری و گذرگاه ریکوتی، تا کوتایسی در پیش بگیرید
    — حدود ۲۲۰ کیلومتر. از کوتایسی، Sh15، راه به سوی تساگری و لنتخی، را به سوی شمال غرب برای آخرین حدود
    ده کیلومتر تا تسکالتوبو بگیرید؛ راهی نشانه‌گذاری‌شده و با روسازی خوب. در مجموع حدود ۲۴۵ کیلومتر و
    سه ساعت و نیم است، همه بر آسفالت، و خودرویی اقتصادی کافی است. در کوتایسی سوخت‌گیری کنید. پارکینگ گرداگرد
    پارک مرکزی رایگان است، و در آسایشگاه‌ها به‌سادگی کنار جاده توقف می‌کنید. ساتاپلیا و غار پرومتئوس هر
    دو در ده دقیقهٔ رانندگی‌اند.
he:
  name: צקלטובו
  short: >-
    עיירת ספא סובייטית שנבנתה במעגל סביב מעיינות רדון חמימים, שבה בתי מרחץ פעילים עומדים לצד בתי הבראה
    ההופכים לאט ליער.
  body: >-
    **מי צקלטובו יוצאים מהאדמה בטמפרטורה של 33–35°C, חמים די הצורך לרחצה כמו שהם, ועיירה סובייטית שלמה
    נמשכה במעגל סביבם.**


    המעיינות היו ידועים הרבה לפני שמוסקבה גילתה בהם עניין. מקורות גאורגיים ממקמים אותם במאות ה-7–9, ובמאה
    ה-13 העניק מלך את המעיינות המרפאים ובתי המרחץ ליעקב, ראש מנזר גלאתי. חוקרי טבע גרמנים כתבו עליהם מ-1782.
    הסובייטים הפכו אותם לתעשייה. הבנייה החלה ב-1926, צו מ-1931 עשה את צקלטובו למרכז ספא, וב-1950–1951
    שרטטו האדריכלים זאלישווילי וקדיה את התוכנית שעדיין ניתן לקרוא על המפה: פארק גדול במרכז עם בתי המרחץ,
    ובתי ההבראה במעגל סביבו. מעמד עירוני הגיע ב-1953.


    בשיאה הגיעו כ-125,000 בני אדם בשנה להתרחץ. בתי ההבראה שילבו קלאסיציזם סטליניסטי עם עיטור גאורגי, וכמה
    מהם נבנו בידי שבויי מלחמה גרמנים. בית המרחץ מס׳ 6, שנבנה ב-1950, הוא הגדול מבין אלה שעדיין פועלים.
    בבית מרחץ מס׳ 9 שרד פריז של סטלין מעל הבריכה הפרטית שבה הוא עצמו רחץ.


    אז ברית המועצות הסתיימה, והחולים חדלו לבוא. מ-1993 אכלסו בתי ההבראה הריקים כ-9,000 אנשים שנעקרו ממלחמת
    אבחזיה, וילדים גדלו באולמות שנבנו להחלמת פועלים סובייטיים.


    מה שעושים כאן היום זה להתהלך. מעבר לפארק נשמעים השמות כמו מפקד של מדינה שנעלמה: מטלורג, מדיאה, אימרתי,
    טביליסי, משחטה ("הכורה"). כמה מהם הופכים למלונות. אחרים עומדים פתוחים, גגותיהם נעדרים, ועצים צעירים
    משרישים במרפסות.


    צקלטובו היא ספא, חורבה ואתר בנייה בבת אחת; בואו לפני שהיא תבחר.
  tip: >-
    הקדישו לזה חצי יום. נעלו נעליים חסונות והביאו פנס: החורבות אינן מוזיאון, בלי תאורה, עם רצפות חסרות
    ומעקות נעדרים, וחלק מהמבנים עדיין מיושבים, אז שאלו לפני שנכנסים ולעולם אל תעלו לקומות העליונות לבד.
    הפארק חינם. בבתי המרחץ הפועלים שאלו על טיפולים בודדים; סדרת טיפולים מלאה נמשכת 20–24 יום ומתנהלת בפיקוח
    רופא. בתי קפה, כספומט ושירותים סמוכים לפארק. הקיץ לח, עם יתושים. מערת פרומתאוס נמצאת כמה קילומטרים
    לצפון.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה דרך גורי וחשורי ומעל מעבר ריקותי לקוטאיסי, כ-220 ק״מ. מקוטאיסי קחו
    את Sh15, הכביש לכיוון צאגרי ולנטחי, צפון-מערבה לכעשרת הקילומטרים האחרונים לצקלטובו; הוא מסומן וסלול
    היטב. בסך הכל כ-245 ק״מ ושלוש וחצי שעות, הכל אספלט, ורכב אקונומי מספיק. תדלקו בקוטאיסי. החניה סביב
    הפארק המרכזי חינם, ובבתי ההבראה עוצרים פשוט בשולי הדרך. סטפליה ומערת פרומתאוס נמצאות שתיהן בטווח נסיעה
    של עשר דקות.
ar:
  name: تسكالتوبو
  short: >-
    بلدة استشفاء سوفيتية رُسمت على شكل حلقة حول ينابيع رادون دافئة، حيث تقف حمامات عاملة إلى جانب مصحات
    تتحول ببطء إلى غابة.
  body: >-
    **تخرج مياه تسكالتوبو من الأرض بحرارة 33 إلى 35 درجة مئوية، دافئة بما يكفي للاستحمام فيها كما هي،
    وقد رُسمت بلدة سوفيتية كاملة على شكل حلقة حولها.**


    كانت الينابيع معروفة قبل أن تلتفت موسكو إليها بزمن طويل. تذكرها المصادر الجورجية في القرون من السابع
    إلى التاسع، وفي القرن الثالث عشر منح ملك الينابيع العلاجية والحمامات لياكوب، رئيس دير غيلاتي. كتب
    علماء طبيعة ألمان عنها منذ عام 1782. حوّلها السوفييت إلى صناعة. بدأ البناء عام 1926، وجعل مرسوم عام
    1931 من تسكالتوبو مركزًا للاستشفاء، وفي 1950–1951 رسم المهندسان إ. زاليشفيلي وف. كيديا المخطط الذي
    لا يزال يُقرأ على الخريطة: حديقة كبيرة في المركز مع الحمامات، والمصحات في حلقة حولها. حصلت البلدة
    على صفة مدينة عام 1953.


    في ذروتها كان يأتي نحو 125,000 شخص سنويًا للاستحمام. جمعت المصحات بين الكلاسيكية الستالينية والزخرفة
    الجورجية، وشيّد بعضها أسرى حرب ألمان. الحمام رقم 6، المبني عام 1950، أكبر الحمامات العاملة اليوم.
    وفي الحمام رقم 9 تبقى جدارية لستالين فوق المسبح الخاص الذي استحم فيه هو نفسه.


    ثم انهار الاتحاد السوفيتي وتوقف المرضى عن القدوم. منذ عام 1993 أسكنت المصحات الفارغة نحو 9,000 شخص
    نزحوا من حرب أبخازيا، وكبر أطفال في قاعات بُنيت لنقاهة العمال السوفييت.


    ما تفعله هنا اليوم هو التمشي فقط. خلف الحديقة، تُقرأ الأسماء كنداء أسماء لدولة زائلة: ميتالورغ، ميديا،
    إيميريتي، تبليسي، ميشاخته ("عامل المنجم"). يتحول بعضها إلى فنادق. وتقف أخرى مفتوحة، بلا أسقف، وأشجار
    فتية تتجذر في الشرفات.


    تسكالتوبو منتجع وخربة وموقع بناء في آنٍ واحد؛ فتعال قبل أن تختار وجهتها.
  tip: >-
    خصص لها نصف يوم. ارتدِ حذاءً متينًا واحمل مصباحًا: الأنقاض ليست متحفًا، بلا إضاءة، بأرضيات مفقودة
    ودرابزين غائب، ولا تزال بعض المباني مسكونة، فاستأذن قبل الدخول ولا تصعد أبدًا إلى الطبقات العلوية
    بمفردك. الحديقة مجانية. في الحمامات العاملة، استفسر عن جلسات فردية؛ يستغرق العلاج الكامل 20 إلى 24
    يومًا ويجري بإشراف طبيب. المقاهي وجهاز الصرف الآلي والمراحيض قريبة من الحديقة. الصيف رطب، وفيه بعوض
    كثير. يقع كهف بروميثيوس على بعد كيلومترات قليلة شمالًا.
  route: >-
    من تبليسي، خذ الطريق S1 (E60) غربًا عبر غوري وخاشوري وممر ريكوتي إلى كوتايسي، نحو 220 كم. من كوتايسي،
    خذ طريق Sh15 نحو تساغيري ولينتخي، شمال غربًا لآخر عشرة كيلومترات تقريبًا إلى تسكالتوبو؛ وهو مُعلَّم
    ومعبَّد جيدًا. الإجمالي نحو 245 كم وثلاث ساعات ونصف، كله أسفلت، وسيارة اقتصادية تكفي. عبّئ الوقود
    في كوتايسي. مواقف السيارات حول الحديقة المركزية مجانية، وعند المصحات تتوقف على جانب الطريق ببساطة.
    تقع ساتابليا وكهف بروميثيوس على بعد عشر دقائق قيادة منها.
