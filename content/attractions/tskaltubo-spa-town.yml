ka:
  name: წყალტუბო
  short: საბჭოთა ბალნეოლოგიის სანიმუშო ქალაქი მოქმედი აბანოებით და ათეულობით მიტოვებული სანატორიუმით.
  body: >-
    **წყალტუბო საბჭოთა ბალნეოლოგიის სავიზიტო ბარათად აშენდა** და დღეს საქართველოს ერთ-ერთი ყველაზე უცნაური
    ქალაქია. რადონ-კარბონატული წყალი აქ 33–35 გრადუსზე ამოდის — ანუ გასათბობად არაფერია საჭირო — და 1950-იანი
    წლებისთვის მთელი დასახლება სწორედ ამ წყლის გარშემო დაიგეგმა: შუაში წრიული პარკი აბანოებით, გარშემო
    კი განიერი გამზირები და სანატორიუმების რგოლი.


    აყვავების პერიოდში კურორტი წელიწადში დაახლოებით 125 000 პაციენტს იღებდა, მოსკოვიდან პირდაპირი მატარებლებით.
    1930-იანებიდან 1980-იანებამდე ოცამდე სანატორიუმი აშენდა და თითოეული სხვადასხვა სამინისტროს ან პროფკავშირს
    ეკუთვნოდა — „მეტალურგი“, „შახტიორი“, „გეოლოგი“, „რკინიგზელი“, „ივერია“, „საქართველო“. რამდენიმე 1945
    წლის შემდეგ გერმანელმა ტყვეებმა ააგეს. მეცხრე აბანოში სტალინის ბარელიეფი და მისი პირადი აუზი შემორჩა.


    საბჭოთა კავშირის დაშლამ ეს ყველაფერი შეაჩერა. 1993 წლიდან ცარიელი კორპუსები აფხაზეთიდან დევნილებმა
    დაიკავეს და ოცდაათი წელი ხალხი კოლონადებში ცხოვრობდა, თეთრეულს მარმარილოს სვეტებს შორის შლიდა. დღეს
    უმეტესობა უკვე გადასახლებულია, შენობები ინვესტორებზე იყიდება: რამდენიმე რემონტშია, ერთი-ორი სასტუმროდ
    მუშაობს, დანარჩენი კი ღიად დგას, უსახურავოდ და ხეებით გაჯერებული.


    აქ ძირითადად დადიხარ. ცენტრალური პარკი მოწესრიგებულია და უფასო — წყაროებით, კაფეებით და მოქმედი აბანოებით.
    მის მიღმა ნანგრევები დაუცველი და ფოტოგენურია: „მედეას“ როტონდა, „ივერიის“ დიდი კიბე, „შახტიორის“ ჩამოცვენილი
    საცეკვაო დარბაზი.


    ორი გაფრთხილება. ეს მუზეუმი არ არის — გადახურვები აკლია, განათება არ არსებობს, ზოგიერთ კორპუსში ჯერ
    კიდევ ცხოვრობენ, ამიტომ შესვლამდე ჰკითხე. და ქალაქი სწრაფად იცვლება: სანატურიუმი, რომელიც ერთ სეზონზე
    ღიაა, მეორეზე სამშენებლო ღობის მიღმა აღმოჩნდება.
  tip: >-
    ნახევარი დღე გამოყავი. საჭიროა მაგარძირიანი ფეხსაცმელი და ფანარი — შიგნით სიბნელეა, მოაჯირები აღარაა
    და იატაკი ბევრგან ჩაცვენილია. ზედა სართულებზე მარტო ნუ ახვალ. დაცვა ხანდახან სიმბოლურ საფასურს ითხოვს
    — ეს არაფორმალურია. აბანოებში პროცედურა წინასწარ ჯავშანს და ცნობას მოითხოვს, უბრალო დათვალიერება კი
    უფასოა. კაფეები, ბანკომატი და ტუალეტი პარკის ირგვლივაა. ზაფხულში ნოტიოა და კოღოა, ზამთარში რბილი,
    მაგრამ წვიმიანი.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ — გორი, ხაშური, განახლებული რიკოთის მონაკვეთი გვირაბებით, ზესტაფონი
    და ქუთაისი. სულ დაახლოებით 245 კმ და სამი საათნახევარი. ქუთაისის ჩრდილოეთ შემოვლითიდან წყალტუბოს მაჩვენებელი
    ნიშანი გატყობინებს — შემდეგ 12 კმ კარგი ასფალტია. საწვავი ზესტაფონსა და ქუთაისში აიღე. პარკინგი ცენტრალური
    პარკის გარშემო უფასოა, სანატორიუმებთან კი პირდაპირ ქუჩაში ჩერდები. ეკონომ-კლასი სავსებით საკმარისია;
    პრომეთეს მღვიმე აქედან 10 კმ-ია.
en:
  name: Tskaltubo
  short: >-
    A model Soviet spa town with working bathhouses and two dozen abandoned sanatoriums standing open
    in the trees.
  body: >-
    **Tskaltubo was designed as a showpiece of Soviet balneology,** and it is now one of the strangest
    towns in Georgia. Radon-carbonate water rises here at 33–35 °C, warm enough to use without heating,
    and by the 1950s the whole settlement had been laid out around it: a circular central park holding
    the bathhouses, and a ring of sanatoriums spreading outwards along wide avenues.


    At its peak the resort handled around 125,000 patients a year, many arriving on direct trains from
    Moscow. Some twenty sanatoriums went up between the 1930s and the 1980s, each belonging to a different
    ministry or trade union — Metallurgist, Miner, Geologist, Railwayman, Iveria, Sakartvelo. Several
    were built by German prisoners of war after 1945. Bathhouse No. 9 still has a frieze of Stalin and
    the private pool he used.


    The Soviet collapse ended all of it. From 1993 the empty sanatoriums were filled with families displaced
    from Abkhazia, and for thirty years people lived inside the colonnaded halls, hanging washing between
    marble columns. Most have now been rehoused and the buildings are being sold to investors: a few are
    under renovation, one or two work again as hotels, and the rest stand open, roofless and slowly filling
    with trees.


    What you do here is walk. The central park is well kept and free, with springs, cafes and the working
    bathhouses. Beyond it the ruins are unguarded and photogenic — Medea's rotunda, the grand staircase
    of Iveria, the peeling ballroom of Shakhtiori.


    Two warnings. This is not a museum: floors are missing, there is no lighting, and a handful of blocks
    are still lived in, so ask before walking in. And the town changes quickly — a sanatorium open one
    season can be behind a construction fence the next.
  tip: >-
    Allow half a day. Bring solid shoes and a torch: interiors are dark, handrails have gone and floors
    are collapsed in places. Do not go up to the top storeys alone. Caretakers sometimes ask a token sum
    to let you in, which is informal. Treatments in the bathhouses need booking and a medical note, but
    looking around the park costs nothing. Cafes, an ATM and toilets are all near the park. Summer is
    humid with mosquitoes; winter is mild but wet.
  route: >-
    Take the E60 west from Tbilisi through Gori and Khashuri, over the rebuilt Rikoti section with its
    tunnels, then past Zestaponi to Kutaisi — about 245 km and three and a half hours. From the northern
    bypass of Kutaisi the turn to Tskaltubo is signed, followed by 12 km of good asphalt. Fuel is easy
    in Zestaponi and Kutaisi. Parking around the central park is free, and at the sanatoriums you simply
    stop on the street. An economy car is enough; Prometheus Cave is 10 km further on.
ru:
  name: Цхалтубо
  short: Образцовый советский курорт с действующими банями и двумя десятками заброшенных санаториев.
  body: >-
    **Цхалтубо строили как витрину советской бальнеологии,** и сегодня это один из самых странных городов
    Грузии. Радоново-карбонатная вода выходит здесь при 33–35 °C — подогревать её не нужно, — и к 1950-м
    весь посёлок спланировали вокруг неё: круглый центральный парк с банями, а от него широкие проспекты
    и кольцо санаториев.


    На пике курорт принимал около 125 000 человек в год, многие приезжали прямыми поездами из Москвы.
    С 1930-х по 1980-е построили около двадцати санаториев, и каждый принадлежал своему министерству или
    профсоюзу — «Металлург», «Шахтёр», «Геолог», «Железнодорожник», «Иверия», «Сакартвело». Несколько
    возвели после 1945 года немецкие военнопленные. В бане № 9 сохранились барельеф Сталина и бассейн,
    которым он пользовался.


    Распад СССР всё это оборвал. С 1993 года пустые корпуса заняли семьи, бежавшие из Абхазии, и тридцать
    лет люди жили в колоннадных залах, развешивая бельё между мраморными колоннами. Сейчас большинство
    расселено, здания продают инвесторам: часть в ремонте, одно-два снова работают как гостиницы, остальные
    стоят открытыми, без кровли, постепенно зарастая деревьями.


    Здесь просто ходят пешком. Центральный парк ухожен и бесплатен — источники, кафе, действующие бани.
    За ним начинаются руины, никем не охраняемые и очень фотогеничные: ротонда «Медеи», парадная лестница
    «Иверии», осыпающийся танцевальный зал «Шахтёра».


    Два предупреждения. Это не музей: перекрытий не хватает, освещения нет, а в нескольких корпусах ещё
    живут люди, так что спрашивайте разрешение. И город быстро меняется — санаторий, открытый в один сезон,
    в другой оказывается за строительным забором.
  tip: >-
    Закладывайте полдня. Нужны крепкая обувь и фонарь: внутри темно, перил нет, полы местами провалены.
    На верхние этажи в одиночку лучше не подниматься. Сторожа иногда просят символическую плату — это
    неофициально. Процедуры в банях требуют записи и справки, а прогулка по парку бесплатна. Кафе, банкомат
    и туалеты — вокруг парка. Летом влажно и много комаров, зима мягкая, но дождливая.
  route: >-
    Из Тбилиси по E60 на запад через Гори и Хашури, по перестроенному участку Рикоти с тоннелями, затем
    мимо Зестафони на Кутаиси — около 245 км, три с половиной часа. С северного обхода Кутаиси есть указатель
    на Цхалтубо, дальше 12 км хорошего асфальта. Заправки — в Зестафони и Кутаиси. Парковка вокруг центрального
    парка бесплатная, у санаториев останавливаются прямо на улице. Машины эконом-класса достаточно; до
    пещеры Прометея отсюда 10 км.
fa:
  name: تسکالتوبو
  short: شهر آبگرم نمونهٔ شوروی با گرمابه‌های فعال و حدود بیست آسایشگاه متروک در میان درختان.
  body: >-
    **تسکالتوبو را به عنوان ویترین آب‌درمانی شوروی ساختند** و امروز یکی از عجیب‌ترین شهرهای گرجستان است.
    آب رادن‑کربناته اینجا با دمای ۳۳ تا ۳۵ درجه از زمین بیرون می‌آید — یعنی نیازی به گرم کردن ندارد —
    و تا دههٔ ۱۹۵۰ کل شهرک بر گرد همین آب طراحی شد: پارکی دایره‌ای در میانه با گرمابه‌ها، و حلقه‌ای از
    آسایشگاه‌ها در امتداد خیابان‌های پهن.


    در اوج کار، این آبگرم سالانه حدود ۱۲۵ هزار بیمار می‌پذیرفت که بسیاری با قطار مستقیم از مسکو می‌آمدند.
    میان دهه‌های ۱۹۳۰ تا ۱۹۸۰ نزدیک بیست آسایشگاه ساخته شد و هر یک به وزارتخانه یا اتحادیه‌ای تعلق داشت:
    فلزکار، معدنچی، زمین‌شناس، کارگر راه‌آهن، ایوریا، ساکارتولو. چند بنا را پس از ۱۹۴۵ اسیران آلمانی برپا
    کردند. در گرمابهٔ شمارهٔ ۹ هنوز نقش‌برجستهٔ استالین و استخر خصوصی او بر جای است.


    فروپاشی شوروی همه‌چیز را متوقف کرد. از ۱۹۹۳ آسایشگاه‌های خالی را خانواده‌های آوارهٔ آبخازیا پر کردند
    و سی سال مردم در تالارهای ستون‌دار زندگی کردند و رخت میان ستون‌های مرمر آویختند. اکنون بیشترشان جابه‌جا
    شده‌اند و ساختمان‌ها به سرمایه‌گذاران فروخته می‌شود: چند بنا در حال بازسازی است، یکی دو تا دوباره
    هتل شده و بقیه بی‌سقف و باز مانده‌اند و آرام آرام پر از درخت می‌شوند.


    کاری که اینجا می‌کنید پیاده‌روی است. پارک مرکزی مرتب و رایگان است، با چشمه‌ها، کافه‌ها و گرمابه‌های
    فعال. آن سوترش ویرانه‌ها بی‌نگهبان و چشم‌نوازند: روتوندای مدیا، پلکان بزرگ ایوریا، تالار رقص پوسته‌پوستهٔ
    شاختیوری.


    دو هشدار. اینجا موزه نیست: کف‌ها فرو ریخته، روشنایی وجود ندارد و در چند بلوک هنوز کسانی زندگی می‌کنند،
    پس پیش از ورود بپرسید. و شهر تند تغییر می‌کند؛ آسایشگاهی که یک فصل باز است، فصل بعد پشت حصار کارگاهی
    قرار می‌گیرد.
  tip: >-
    نیم روز کنار بگذارید. کفش محکم و چراغ‌قوه لازم است: داخل تاریک است، نرده‌ها رفته و کف در جاهایی فرو
    ریخته. تنها به طبقه‌های بالا نروید. نگهبان‌ها گاهی مبلغی نمادین می‌خواهند که غیررسمی است. درمان در
    گرمابه‌ها نیاز به رزرو و گواهی پزشکی دارد، اما گشتن در پارک هزینه‌ای ندارد. کافه، خودپرداز و سرویس
    بهداشتی گرد پارک هست. تابستان شرجی و پشه‌خیز است و زمستان ملایم اما بارانی.
  route: >-
    از تفلیس بزرگراه E60 را به سمت غرب بگیرید: گوری، خاشوری، مقطع بازسازی‌شدهٔ ریکوتی با تونل‌هایش، سپس
    زستافونی و کوتایسی — حدود ۲۴۵ کیلومتر و سه ساعت و نیم. از کمربندی شمالی کوتایسی انشعاب تسکالتوبو تابلو
    دارد و پس از آن ۱۲ کیلومتر آسفالت خوب است. سوخت در زستافونی و کوتایسی فراوان است. پارک کردن گرد پارک
    مرکزی رایگان است و کنار آسایشگاه‌ها همان لب خیابان می‌ایستید. خودروی اقتصادی کافی است؛ غار پرومته
    ۱۰ کیلومتر جلوتر است.
he:
  name: צחלטובו
  short: עיירת מרפא סובייטית לדוגמה, עם בתי מרחץ פעילים וכעשרים בתי הבראה נטושים בין העצים.
  body: >-
    **צחלטובו תוכננה כחלון הראווה של רפואת המרחצאות הסובייטית,** והיום היא אחת העיירות המוזרות בגאורגיה.
    מים רדוניים‑פחמתיים עולים כאן בטמפרטורה של 33–35 מעלות, חמים דיים לשימוש בלי חימום, ועד שנות החמישים
    תוכנן סביבם היישוב כולו: פארק מרכזי עגול ובו בתי המרחץ, וסביבו טבעת בתי הבראה לאורך שדרות רחבות.


    בשיאה קלטה העיירה כ‑125 אלף מבקרים בשנה, רבים מהם ברכבות ישירות ממוסקבה. בין שנות השלושים לשנות השמונים
    נבנו כעשרים בתי הבראה, כל אחד בבעלות משרד ממשלתי או איגוד מקצועי אחר — המתכת, המכרות, הגיאולוגים,
    הרכבת, איווריה, סקארטוולו. אחדים הוקמו לאחר 1945 בידי שבויי מלחמה גרמנים. בבית המרחץ מספר 9 שרדו תבליט
    של סטלין והבריכה הפרטית שבה השתמש.


    התמוטטות ברית המועצות שמה לכך קץ. משנת 1993 אכלסו את המבנים הריקים משפחות שנעקרו מאבחזיה, ובמשך שלושים
    שנה חיו אנשים באולמות העמודים ותלו כביסה בין עמודי שיש. רובם שוכנו מחדש, והמבנים נמכרים כיום למשקיעים:
    אחדים בשיפוץ, אחד או שניים שבו לפעול כמלונות, והשאר עומדים פתוחים, בלי גג, ומתמלאים אט אט בעצים.


    מה שעושים כאן זה ללכת. הפארק המרכזי מטופח וללא תשלום, ובו מעיינות, בתי קפה ובתי המרחץ הפעילים. מעברו
    ההריסות אינן שמורות והן צילומיות מאוד: הרוטונדה של מדיאה, גרם המדרגות של איווריה, אולם הנשפים המתקלף
    של שאחטיורי.


    שתי אזהרות. זה אינו מוזיאון: רצפות חסרות, אין תאורה, ובכמה בניינים עדיין מתגוררים אנשים, אז שאלו לפני
    שנכנסים. והעיירה משתנה מהר — בית הבראה שפתוח בעונה אחת עשוי להימצא בעונה הבאה מאחורי גדר בנייה.
  tip: >-
    הקצו חצי יום. נעליים חזקות ופנס הכרחיים: בפנים חשוך, מעקות אינם, והרצפות שקועות במקומות. אל תעלו לקומות
    העליונות לבד. שומרים מבקשים לעתים סכום סמלי, וזה בלתי רשמי. טיפולים בבתי המרחץ דורשים הזמנה ואישור
    רפואי, אך הסיור בפארק חינם. בתי קפה, כספומט ושירותים נמצאים סביב הפארק. הקיץ לח ומלא יתושים, החורף
    נוח אך גשום.
  route: >-
    מטביליסי נוסעים מערבה בכביש E60 דרך גורי וחשורי, במקטע ריקוטי המחודש על מנהרותיו, ואז ליד זסטפוני
    עד קוטאיסי — כ‑245 ק״מ, שלוש שעות וחצי. מכביש העוקף הצפוני של קוטאיסי הפנייה לצחלטובו משולטת, ואחריה
    12 ק״מ אספלט טוב. תדלוק נוח בזסטפוני ובקוטאיסי. החניה סביב הפארק המרכזי חינם, וליד בתי ההבראה פשוט
    עוצרים ברחוב. רכב חסכוני מספיק; מערת פרומתאוס נמצאת 10 ק״מ הלאה.
ar:
  name: تسخالتوبو
  short: بلدة استشفاء سوفييتية نموذجية بحمّامات عاملة ونحو عشرين مصحّة مهجورة بين الأشجار.
  body: >-
    **صُممت تسخالتوبو لتكون واجهة العلاج المائي السوفييتي،** وهي اليوم من أغرب بلدات جورجيا. يخرج الماء
    الرادوني الكربوني هنا بحرارة 33–35 درجة، أي أنه صالح للاستحمام بلا تسخين، وبحلول الخمسينيات خُطّطت
    البلدة كلها حوله: حديقة مركزية دائرية تضم الحمّامات، وحولها حلقة من المصحّات على جادات عريضة.


    في أوجها كانت البلدة تستقبل نحو 125 ألف زائر سنوياً، وكثيرون كانوا يصلون بقطارات مباشرة من موسكو.
    وبين الثلاثينيات والثمانينيات شُيّدت نحو عشرين مصحّة، كل واحدة تابعة لوزارة أو نقابة مختلفة: عمال
    المعادن، عمال المناجم، الجيولوجيون، عمال السكك، إيفيريا، ساكارتفيلو. وبُني بعضها بعد 1945 على أيدي
    أسرى حرب ألمان. وما زال في الحمّام رقم 9 إفريز يصوّر ستالين والمسبح الخاص الذي كان يستعمله.


    أنهى انهيار الاتحاد السوفييتي ذلك كله. فمنذ 1993 امتلأت المباني الفارغة بعائلات نزحت من أبخازيا، وعاش
    الناس ثلاثين عاماً في القاعات ذات الأعمدة ينشرون الغسيل بين أعمدة الرخام. وقد أُسكن معظمهم في مكان
    آخر، وتُباع المباني اليوم للمستثمرين: بعضها قيد الترميم، وواحد أو اثنان عادا فندقاً، والبقية مفتوحة
    بلا سقوف تمتلئ شيئاً فشيئاً بالأشجار.


    ما تفعله هنا هو المشي. الحديقة المركزية مُعتنى بها ومجانية، وفيها الينابيع والمقاهي والحمّامات العاملة.
    وخلفها تبدأ الأطلال بلا حراسة وهي شديدة الإغراء للتصوير: رواق مِديا المستدير، ودرج إيفيريا الكبير،
    وقاعة الرقص المتقشرة في شاختيوري.


    تحذيران. المكان ليس متحفاً: الأرضيات ناقصة، ولا إضاءة، وبعض المباني ما زال مسكوناً، فاسأل قبل الدخول.
    والبلدة تتغير بسرعة: مصحّة مفتوحة في موسم قد تصبح في الموسم التالي خلف سياج ورشة.
  tip: >-
    خصّص نصف يوم. الحذاء المتين والمصباح ضروريان: الداخل مظلم، والدرابزين اختفى، والأرضيات منهارة في مواضع.
    لا تصعد إلى الطوابق العليا وحدك. يطلب الحراس أحياناً مبلغاً رمزياً وهو أمر غير رسمي. تحتاج جلسات الحمّامات
    إلى حجز وتقرير طبي، أما التجول في الحديقة فمجاني. المقاهي والصراف الآلي ودورات المياه حول الحديقة.
    الصيف رطب وكثير البعوض، والشتاء معتدل لكنه ممطر.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً عبر غوري وخاشوري، ثم مقطع ريكوتي المعاد بناؤه بأنفاقه، فزستافوني وكوتايسي
    — نحو 245 كم وثلاث ساعات ونصف. من الطريق الدائري الشمالي لكوتايسي يوجد مفرق مُعلَّم إلى تسخالتوبو،
    يليه 12 كم من الإسفلت الجيد. الوقود متوفر في زستافوني وكوتايسي. الوقوف حول الحديقة المركزية مجاني،
    وعند المصحّات تقف في الشارع مباشرة. تكفي سيارة اقتصادية؛ وكهف بروميثيوس يبعد 10 كم فقط.
