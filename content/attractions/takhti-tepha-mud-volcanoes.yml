ka:
  name: ტახტი-თეფას ტალახის ვულკანები
  short: >-
    ბორცვი დალის მთის წყალსაცავის სამხრეთით, სადაც ნაცრისფერი ტალახი, აირი და ნავთობის აპკი განუწყვეტლივ
    ამოდის — ვაშლოვანის ყველაზე უცნაური კუთხე.
  body: >-
    **ტახტი-თეფაზე მიწა არასდროს ისვენებს: ნაცრისფერი ტალახი ამოდის, ბუშტად იბერება და რბილი, სველი ტკაცუნით
    სკდება.**


    ეს ვულკანი ცეცხლოვანი გაგებით არ არის. დედოფლისწყაროს მუნიციპალიტეტის მშრალი ბორცვების ქვეშ, ქვიშაქვებსა
    და თიხებში გამომწყვდეული აირი ზემოთ მიიწევს და თან წყალს, თიხასა და ცოტაოდენ ნავთობს ამოიყოლებს; ზედაპირზე
    ეს ნარევი ცივი ამოდის. სასულეები მუდმივად მოქმედებს. ბუნების ძეგლი ვაშლოვანის დაცული ტერიტორიების
    ნაწილია და ივრის ქვემო წელზე, დალის მთის წყალსაცავის სამხრეთით მდებარეობს — სერის თხემზე, სადაც ამონთხეულმა
    ტალახმა რამდენიმემეტრიანი ბორცვი ააგო.


    რასაც აქ ნახავთ, გაცილებით წყნარი და უცნაურია, ვიდრე სიტყვა „ვულკანი“ გპირდებათ. დაბალი კონუსები და
    გუმბათები მკრთალი, დამსკდარი ტალახისა, კიდეებზე მარილის თეთრი ქერქით; ნაცრისფერი გუბეები, რომლებიც
    იჭმუხნება და ტკაცუნობს; უდიდესი კრატერი, 3,5–4 მეტრის დიამეტრით, ცეცხლზე დავიწყებულ ფაფასავით თუხთუხებს.
    სასულეებიდან ამოსული ტალახი ერთ ნაკადად ერთდება და ნელა ჩაცურავს ქვემოთ, ხევში. ზოგან ზედაპირზე ნავთობის
    ცისარტყელისფერი აპკი ტივტივებს.


    ბუნების ძეგლის მთელი ფართობი 9,7 ჰექტარია და მასზე ნახევარკილომეტრიანი ბილიკი გადის, მაგრამ მოქმედი
    გული პატარაა. ნუ ირბენთ კონუსიდან კონუსამდე — ჩამოჯექით ერთ სასულესთან: მისი რიტმი მხოლოდ მომლოდინეს
    ემჟღავნება.


    ირგვლივ თვალს არაფერი აჩერებს: უხეო, მოყვითალო-ნაცრისფერი სტეპი და არც ერთი სახლი, სამხრეთით კი აზერბაიჯანისკენ
    მიმავალი ქედები ცხელ ჰაერში თრთის. გაზაფხულზე ფერდობები ხანმოკლედ მწვანდება, ივლისისთვის კი ყველაფერი
    ერთ, მტვრისფერ ტონში იძირება. სიჩუმე ისეთია, რომ აქ ყველაზე ხმამაღალი ხმა თავად მიწის ყრუ ჩახველებაა.
  tip: >-
    სამხრეთისკენ გასვლამდე დარეგისტრირდით და გადაიხადეთ ვაშლოვანის ვიზიტორთა ცენტრში, დედოფლისწყაროში,
    და რეინჯერებს გზების მდგომარეობა ჰკითხეთ. კრატერის კიდეზე არ დადგეთ: ქერქი მყარი ჩანს, მაგრამ არ არის,
    ტალახი კი ფეხსაცმელს და მანქანის ხალიჩებს აღარასდროს სცილდება. ადგილზე არც ჩრდილია, არც წყალი, საკვები
    თუ მობილური კავშირი — ყველაფერი თან წაიღეთ, წყალი ერთი ლიტრით მეტიც. მოდით დილით ადრე ან დღის ბოლო
    ორ საათში: ზაფხულის შუადღე დაუნდობელია. ვაშლოვანში გველები ხშირია. წვიმის შემდეგ მგზავრობა საერთოდ
    გადადეთ — სველი თიხა კარგ ჯიპსაც აჩერებს.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) საგარეჯომდე იარეთ, შემდეგ კი წნორის გავლით დედოფლისწყარომდე: დაახლოებით
    130 კილომეტრი ასფალტი, ორი საათის სავალი. ავზი და წყლის ბოთლები აქ შეავსეთ — შემდეგ აღარაფერი იქნება.
    ქალაქიდან სამხრეთ-დასავლეთით, დალის მთის წყალსაცავისკენ, გრუნტისა და თიხის გზები მიდის: დაახლოებით
    45 კილომეტრი, თითქმის ორი საათი. მიმდინარე მარშრუტი რეინჯერებთან დააზუსტეთ, რადგან ნიაღვრის შემდეგ
    გზები იცვლება. სულ დაახლოებით 175 კილომეტრი და ოთხი საათი ერთი მიმართულებით. გამოგადგებათ მხოლოდ ნამდვილი,
    მაღალი გამავლობის ჯიპი; უმჯობესია, მეორე მანქანასთან ერთად იმგზავროთ.
en:
  name: Takhti-Tepha Mud Volcanoes
  short: >-
    A low hillock south of the Dali Mta reservoir where grey mud, gas and a sheen of oil seep up without
    pause: Vashlovani's strangest corner.
  body: >-
    **At Takhti-Tepha the ground is never quite still: grey mud wells up, swells into a blister and breaks
    with a soft, wet click.**


    This is no volcano in the fiery sense. Beneath the dry hills of Dedoplistskaro Municipality, gas trapped
    in sandstone and clay forces its way upward, dragging water, clay and a little oil with it, and the
    mixture reaches the surface cold. The vents are permanently active. The natural monument, part of
    the Vashlovani Protected Areas, lies just south of the Dali Mta reservoir on the lower Iori, on a
    ridge crest where the erupted mud has built a hillock a few metres high.


    What you find is quieter and stranger than the word volcano promises. Low cones and domes of pale,
    cracked mud, crusted white with salt at their rims; grey pools that pucker and pop; the largest crater,
    3.5–4 m across, simmering like porridge forgotten on the stove. Mud from the vents merges into a single
    slick tongue and creeps down into the ravine below. Here and there a rainbow film of oil floats on
    the surface.


    The monument covers 9.7 hectares, with a half-kilometre path across it, but its active heart is small.
    Do not hurry from cone to cone; sit beside one vent and wait, because its rhythm only shows itself
    to the patient.


    Nothing around you stops the eye: treeless fawn-and-grey steppe, not a house in sight, the ridges
    towards Azerbaijan trembling in the heat to the south. In spring the slopes green for a few weeks;
    by July everything has sunk into one tone of dust. The silence is so complete that the loudest sound
    out here is the earth clearing its throat.
  tip: >-
    Register and pay at the Vashlovani visitor centre in Dedoplistskaro before heading south, and ask
    the rangers about the state of the tracks. Stay off the crater rims: the crust looks firm and is not,
    and the mud never quite leaves boots or car mats. There is no shade, water, food or mobile signal
    on site, so bring everything, plus a spare litre of water each. Come early or in the last two hours
    of light, as summer middays are brutal. Snakes are common in Vashlovani. After rain, do not attempt
    the trip: wet clay stops even good 4x4s.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) east through Sagarejo, then continue via Tsnori to Dedoplistskaro:
    about 130 km of asphalt, roughly two hours. Fill the tank and the water bottles here, as there is
    nothing further on. From town, dirt and clay tracks run south-west towards the Dali Mta reservoir,
    about 45 km that take close to two hours; confirm the current approach with the rangers, because tracks
    shift after storms. Reckon on some 175 km and four hours each way. Only a genuine high-clearance 4x4
    will do, ideally travelling with a second car.
ru:
  name: Грязевые вулканы Тахти-Тепа
  short: >-
    Невысокий холм южнее водохранилища Дали-Мта, где серая грязь, газ и нефтяная плёнка непрестанно выходят
    на поверхность: самый странный уголок Вашловани.
  body: >-
    **В Тахти-Тепа земля никогда не замирает до конца: серая грязь вспучивается, вздувается пузырём и
    лопается с мягким влажным щелчком.**


    Это вовсе не вулкан в огненном смысле слова. Под сухими холмами Дедоплисцкарского муниципалитета газ,
    запертый в песчанике и глине, пробивает себе путь наверх, увлекая воду, глину и немного нефти, и смесь
    выходит на поверхность холодной. Жерла действуют постоянно. Природный памятник, часть охраняемых территорий
    Вашловани, лежит южнее водохранилища Дали-Мта на нижнем течении Иори, на гребне, где извергнутая грязь
    нарастила холм высотой в несколько метров.


    То, что вы находите здесь, тише и страннее, чем обещает слово «вулкан». Низкие конусы и купола бледной,
    потрескавшейся грязи с белой соляной корочкой по краям; серые лужи, что морщатся и лопаются пузырями;
    самый большой кратер, 3,5–4 м в поперечнике, что медленно бурлит, как забытая на плите каша. Грязь
    из жерл сливается в единый скользкий язык и стекает вниз, в овраг. Кое-где на поверхности играет радужная
    нефтяная плёнка.


    Памятник занимает 9,7 гектара, через него проложена полукилометровая тропа, но живое сердце его невелико.
    Не торопитесь от конуса к конусу; посидите у одного жерла и подождите — его ритм открывается только
    терпеливым.


    Вокруг ничто не задерживает взгляд: безлесная буро-серая степь, ни одного дома, а гряды в сторону
    Азербайджана дрожат от жары на юге. Весной склоны на несколько недель зеленеют; к июлю всё погружается
    в единый пыльный тон. Тишина здесь так полна, что самый громкий звук вокруг — это земля, прочищающая
    горло.
  tip: >-
    Зарегистрируйтесь и оплатите посещение в визит-центре Вашловани в Дедоплисцкаро, прежде чем ехать
    на юг, и спросите у рейнджеров о состоянии дорог. Не подходите к краю кратеров: корка на вид твёрдая,
    но это не так, а грязь потом ещё долго не отчистить с ботинок и коврика в машине. Здесь нет ни тени,
    ни воды, ни еды, ни связи, так что берите всё с собой, включая лишний литр воды на человека. Приезжайте
    рано утром или в последние два часа света: летний полдень здесь беспощаден. В Вашловани много змей.
    После дождя не пытайтесь ехать: мокрая глина остановит даже хороший внедорожник.
  route: >-
    Из Тбилиси по Кахетинскому шоссе (S5) на восток через Сагареджо, затем через Цнори до Дедоплисцкаро:
    около 130 км асфальта, примерно два часа. Заправьте машину и наполните бутылки водой здесь — дальше
    ничего не будет. От города грунтовые и глинистые дороги ведут на юго-запад к водохранилищу Дали-Мта,
    около 45 км, что занимает почти два часа; уточните текущий маршрут у рейнджеров, поскольку дороги
    меняются после ливней. Рассчитывайте примерно на 175 км и четыре часа в одну сторону. Подойдёт только
    настоящий внедорожник с высоким клиренсом, желательно в компании второй машины.
fa:
  name: آتشفشان‌های گِلی تاختی-تِپا
  short: >-
    پشته‌ای پست در جنوب مخزن سد دالی‌متا که در آن گِل خاکستری، گاز و لایه‌ای از نفت پیوسته به سطح می‌جوشند:
    غریب‌ترین گوشه‌ی واشلووانی.
  body: >-
    **در تاختی-تِپا زمین هرگز کاملاً آرام نیست: گِل خاکستری بالا می‌آید، مانند تاول باد می‌کند و با صدایی
    نرم و مرطوب می‌شکافد.**


    این به هیچ رو آتشفشانی به معنای آتشین کلمه نیست. زیر تپه‌های خشک شهرستان دِدوپلیستسکارو، گازی که در
    ماسه‌سنگ و رس محبوس شده، راه خود را به بالا باز می‌کند و آب، رس و اندکی نفت را با خود می‌کشد، و این
    مخلوط سرد به سطح می‌رسد. دهانه‌ها همیشه فعال‌اند. این یادمان طبیعی، بخشی از منطقه‌ی حفاظت‌شده‌ی واشلووانی،
    در جنوب مخزن سد دالی‌متا در بخش پایینی رود ایوری قرار دارد، بر تیغه‌ای که گِل فوران‌کرده در آن پشته‌ای
    به بلندی چند متر ساخته است.


    آنچه در اینجا می‌یابید آرام‌تر و غریب‌تر از چیزی است که واژه‌ی «آتشفشان» وعده می‌دهد. مخروط‌ها و گنبدهای
    کوتاه از گِل کم‌رنگ و ترک‌خورده، با حاشیه‌ای سپید از نمک؛ برکه‌های خاکستری‌ای که چین می‌خورند و می‌ترکند؛
    بزرگ‌ترین دهانه، به قطر ۳٫۵ تا ۴ متر، که چون فرنی فراموش‌شده روی اجاق به‌آرامی می‌جوشد. گِل دهانه‌ها
    به یک زبانه‌ی لغزنده‌ی واحد می‌پیوندد و به درون آبکند زیرین می‌خزد. اینجا و آنجا لایه‌ای رنگین‌کمانی
    از نفت بر سطح شناور است.


    این یادمان ۹٫۷ هکتار را در بر می‌گیرد، با مسیری به درازای نیم‌کیلومتر از میان آن، اما قلب فعال آن
    کوچک است. از مخروطی به مخروط دیگر شتاب نکنید؛ کنار یک دهانه بنشینید و منتظر بمانید، زیرا ضربان آن
    تنها به شکیبایان خود را می‌نمایاند.


    هیچ چیز در اطراف نگاه را متوقف نمی‌کند: استپی بی‌درخت به رنگ خاکستری-نخودی، حتی یک خانه در چشم‌انداز
    نیست، و در جنوب، رشته‌کوه‌های سوی آذربایجان در گرما می‌لرزند. در بهار دامنه‌ها چند هفته سبز می‌شوند؛
    تا ماه ژوئیه همه‌چیز در یک رنگ خاکی فرومی‌رود. سکوت چنان کامل است که بلندترین صدای اینجا صدای زمین
    است که گلویش را صاف می‌کند.
  tip: >-
    پیش از حرکت به سوی جنوب، در مرکز بازدیدکنندگان واشلووانی در دِدوپلیستسکارو ثبت‌نام کنید و ورودیه را
    بپردازید، و از محیط‌بانان درباره‌ی وضعیت مسیرها بپرسید. از لبه‌ی دهانه‌ها دور بمانید: پوسته‌ی آن استوار
    به‌نظر می‌رسد اما نیست، و گِل هرگز کاملاً از چکمه‌ها یا کفپوش خودرو جدا نمی‌شود. اینجا سایه، آب، غذا
    یا آنتن موبایل نیست، پس همه‌چیز، از جمله یک لیتر آب اضافه برای هر نفر، همراه ببرید. صبح زود یا در
    دو ساعت پایانی روشنایی بیایید، چرا که ظهرهای تابستان اینجا بی‌رحم‌اند. در واشلووانی مار فراوان است.
    پس از باران این سفر را نکنید: رس مرطوب حتی خودروهای ۴×۴ خوب را نیز بازمی‌دارد.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق از میان ساگارجو، سپس از راه تسنوری تا دِدوپلیستسکارو بروید:
    نزدیک به ۱۳۰ کیلومتر آسفالت، در حدود دو ساعت. باک و بطری‌های آب را همین‌جا پر کنید، چون پس از آن چیزی
    نیست. از شهر، جاده‌های خاکی و رسی به سوی جنوب‌غرب، به‌سوی مخزن سد دالی‌متا، حدود ۴۵ کیلومتر پیش می‌روند
    که نزدیک به دو ساعت زمان می‌برد؛ مسیر کنونی را با محیط‌بانان هماهنگ کنید، زیرا جاده‌ها پس از طوفان
    تغییر می‌کنند. جمعاً حدود ۱۷۵ کیلومتر و چهار ساعت در هر مسیر در نظر بگیرید. تنها یک خودروی ۴×۴ واقعی
    با شاسی بلند کارساز است، و بهتر است با خودرویی دوم همراه شوید.
he:
  name: הרי הגעש הבוציים של טחתי-טפה
  short: >-
    גבעה נמוכה מדרום למאגר דאלי מטה, שם בוץ אפור, גז ושכבת נפט דקה בוקעים ללא הפסקה: הפינה המשונה ביותר
    של ושלובני.
  body: >-
    **בטחתי-טפה הקרקע כלל לא שוקטת: בוץ אפור מבעבע ועולה, מתנפח לבועה ונשבר בנקישה רכה ולחה.**


    זה בכלל לא הר געש במובן הלוהט. מתחת לגבעות היבשות של מחוז דדופליסצקרו, גז הכלוא באבן חול ובחרסית דוחק
    את דרכו מעלה, סוחב עמו מים, חרסית וקצת נפט, והתמהיל מגיע לפני השטח קר. הפתחים פעילים ללא הפסקה. אתר
    הטבע המוגן, חלק משמורות ושלובני, שוכן ממש מדרום למאגר דאלי מטה בחלקו התחתון של נהר איורי, על רכס שבו
    הבוץ הפורץ בנה גבעה בת כמה מטרים.


    מה שמוצאים כאן שקט ומשונה יותר ממה שמבטיחה המילה "הר געש". חרוטים וכיפות נמוכים של בוץ בהיר וסדוק,
    מצופים קרום מלח לבן בשוליהם; בריכות אפורות שמתקמטות ומבעבעות; המכתש הגדול ביותר, בקוטר 3.5–4 מטרים,
    שרוחש לאיטו כדייסה שנשכחה על האש. הבוץ מפתחי ההתפרצות מתמזג ללשון חלקלקה אחת וזוחל מטה אל הערוץ. פה
    ושם קרום נפט צבעוני צף על פני השטח.


    האתר משתרע על 9.7 הקטרים, עם שביל בן חצי קילומטר החוצה אותו, אך לבו הפעיל קטן. אל תמהרו מחרוט לחרוט;
    שבו לצד פתח אחד והמתינו, כי הקצב שלו מתגלה רק לסבלניים.


    שום דבר סביבכם לא עוצר את המבט: ערבה חשופה מעצים בגוני חום-אפור, אין בית בטווח הראייה, והרכסים לכיוון
    אזרבייג'ן רוטטים בחום שבדרום. באביב המדרונות מוריקים לכמה שבועות; עד יולי הכול שוקע לגוון אבק אחיד.
    השקט שלם כל כך שהצליל החזק ביותר כאן הוא קולה של האדמה המכחכחת בגרונה.
  tip: >-
    הירשמו ושלמו במרכז המבקרים של ושלובני בדדופליסצקרו לפני הנסיעה דרומה, ושאלו את הפקחים על מצב דרכי
    העפר. הישארו מרוחקים משולי המכתשים: הקרום נראה יציב ואינו כזה, והבוץ לא ממש עוזב את הנעליים או שטיחי
    הרכב. אין כאן צל, מים, אוכל או קליטה סלולרית, כך שיש להביא הכול, כולל ליטר מים נוסף לאדם. הגיעו בבוקר
    מוקדם או בשעתיים האחרונות של האור, כי צהרי הקיץ כאן אכזריים. נחשים נפוצים בושלובני. לאחר גשם אין לנסות
    את המסע: חרסית רטובה עוצרת אפילו רכבי שטח טובים.
  route: >-
    מטביליסי סעו בכביש קאחתי (S5) מזרחה דרך סאגארג'ו, ואז דרך צנורי לדדופליסצקרו: כ-130 ק"מ סלולים, כשעתיים.
    תדלקו ומלאו את בקבוקי המים כאן, כי מעבר לזה אין דבר. מהעיר, שבילי עפר וחרסית מובילים דרום-מערבה למאגר
    דאלי מטה, כ-45 ק"מ שנמשכים כשעתיים; יש לוודא את המסלול הנוכחי עם הפקחים, כי השבילים משתנים לאחר סופות.
    הביאו בחשבון כ-175 ק"מ וארבע שעות בכל כיוון. רק רכב שטח אמיתי בעל גחון גבוה יתאים, רצוי בנסיעה עם
    רכב שני.
ar:
  name: براكين تاختي-تيبا الطينية
  short: >-
    رابية منخفضة جنوب خزان دالي متا حيث ينبثق الطين الرمادي والغاز وغشاء من النفط بلا توقف: أغرب زاوية
    في فاشلوفاني.
  body: >-
    **في تاختي-تيبا، لا تسكن الأرض قط: يعلو الطين الرمادي، وينتفخ كفقاعة، ثم ينفجر بصوت رطب خافت.**


    هذا ليس بركانًا بالمعنى الناري للكلمة. فتحت التلال الجافة لبلدية ديدوبليستسكارو، يشقّ الغاز المحتجز
    في الحجر الرملي والصلصال طريقه إلى الأعلى، ساحبًا معه الماء والصلصال وقليلًا من النفط، وتصل الخلطة
    إلى السطح باردة. والفتحات نشطة بلا توقف. ويقع هذا المعلم الطبيعي، وهو جزء من محميات فاشلوفاني، جنوب
    خزان دالي متا مباشرة على مجرى نهر إيوري الأدنى، على ذروة سلسلة تلال، حيث بنى الطين المتدفق رابيةً
    بارتفاع بضعة أمتار.


    وما تجده هنا أهدأ وأغرب مما يعِد به لفظ "البركان". مخاريط وقباب منخفضة من طين شاحب متشقق، مطوّقة بقشرة
    ملحية بيضاء عند حوافها؛ وبِرَك رمادية تتغضّن وتفقّع؛ وأكبر فوهة، بقطر 3.5 إلى 4 أمتار، تغلي بتؤدة
    كعصيدة نُسِيت على النار. يندمج الطين من الفتحات في لسان زلق واحد ينحدر إلى الوادي الصغير أسفله. وهنا
    وهناك تطفو على السطح طبقة قوس-قزحية من النفط.


    يمتد هذا المعلم على 9.7 هكتارات، يعبره ممر بطول نصف كيلومتر، لكن قلبه النشط صغير. لا تُسرع من مخروط
    إلى آخر؛ اجلس قرب فتحة واحدة وانتظر، لأن نبضها لا يكشف نفسه إلا للصبورين.


    لا شيء حولك يستوقف العين: سهب أجرد بلا شجر بلون رمادي-بنّي فاتح، لا بيت في الأفق، والسلاسل الممتدة
    نحو أذربيجان ترتجف من الحرارة جنوبًا. في الربيع تخضرّ المنحدرات لأسابيع قليلة؛ وبحلول يوليو يغرق كل
    شيء في لون غباري واحد. والصمت هنا كامل حتى إن أعلى صوت هو صوت الأرض وهي تُصفّي حلقها.
  tip: >-
    سجّل وادفع في مركز زوار فاشلوفاني بديدوبليستسكارو قبل التوجه جنوبًا، واسأل حراس المحمية عن حالة المسارات.
    ابتعد عن حواف الفوهات: القشرة تبدو صلبة وليست كذلك، والطين لا يكاد يزول عن الأحذية وأرضيات السيارة.
    لا ظل ولا ماء ولا طعام ولا تغطية هاتف هنا، فاحمل كل شيء، بما فيه لتر ماء إضافي لكل شخص. تعال في الصباح
    الباكر أو في الساعتين الأخيرتين من ضوء النهار، فظهيرة الصيف هنا قاسية. الثعابين شائعة في فاشلوفاني.
    لا تحاول الرحلة بعد المطر: يوقف الطين المبلل حتى سيارات الدفع الرباعي الجيدة.
  route: >-
    من تبليسي، سِر على طريق كاختي السريع (S5) شرقًا عبر ساغاريجو، ثم عبر تسنوري إلى ديدوبليستسكارو: نحو
    130 كم من الإسفلت، في حدود ساعتين. عبّئ الوقود وقوارير الماء هنا، فلا يوجد شيء بعدها. ومن البلدة،
    تمتد مسارات ترابية وطينية جنوب غربًا نحو خزان دالي متا، نحو 45 كم تستغرق قرابة ساعتين؛ تأكد من المسار
    الحالي مع حراس المحمية، لأن المسارات تتغير بعد العواصف. احسب نحو 175 كم وأربع ساعات في كل اتجاه. لا
    تصلح إلا سيارة دفع رباعي حقيقية بارتفاع أرضي عالٍ، ويُفضَّل السفر مع سيارة ثانية.
