ka:
  name: თახტი-თეფას ტალახის ვულკანები
  short: ცივი ტალახის პატარა კრატერები ვაშლოვანის ბრტყელ პლატოზე — საქართველოში ერთ-ერთი ყველაზე უცნაური
    ლანდშაფტი.
  body: >-
    **თახტი-თეფა თურქულად „ბრტყელ გორას" ნიშნავს და ზუსტად ასეთია:** მშრალი, დამსკდარი თიხის სუფრა ვაშლოვანის
    სამხრეთ ნაწილში, სადაც სხვა არაფერია, გარდა ჰორიზონტისა და მზისა. სწორედ ამ სუფრაზე დგას რამდენიმე
    ათეული პატარა კონუსი — ტალახის ვულკანები.


    ისინი ნამდვილ ვულკანებთან კავშირში არ არიან. სიღრმეში მოქცეული აირი ზევით მოძრაობს, თან წყალსა და
    თიხას მოაქვს, და ზედაპირზე ნელა ამოდის ცივი, ნაცრისფერი მასა. კონუსები იშვიათად აღემატება ერთ-ორ მეტრს;
    ზოგი მშრალია და გამაგრებული, ზოგში კი ტალახი დროდადრო ბუშტულებით ისკდება. ხმა თითქმის არ ისმის — ჯერ
    დაინახავ, მერე გაიგონებ.


    ბუშტის აფეთქებას წამები აშორებს ერთმანეთისგან, ამიტომ საკმარისია ჩამოჯდე და დაელოდო. წყალი ზოგ კრატერში
    მლაშეა და ირგვლივ თეთრი მარილის ლაქებს ტოვებს. ხანდახან ზეთის თხელი აპკიც ჩანს — ეს რეგიონი ნავთობის
    ველების პირასაა.


    ლანდშაფტი გარშემო ისეთივე უჩვეულოა, როგორც კრატერები: სრულიად უხეო, ღია ყავისფერი და ნაცრისფერი დაბლობი,
    სადაც ხედი ათეულობით კილომეტრზე გადის, აზერბაიჯანის მთებამდე. აპრილში მოკლე ბალახი მწვანდება და ლალები
    ყვავის; ივლისში ყველაფერი ერთფეროვან მტვრად იქცევა.


    ეს არ არის დიდი „ატრაქციონი" — კრატერების ველი დაახლოებით ფეხბურთის მოედნის ზომისაა. მისი ღირებულება
    იმაშია, რომ საქართველოში ასეთი მოვლენა თითქმის აღარსად ხელმისაწვდომია, და რომ აქ სრული სიჩუმეა.
  tip: >-
    ერთი საათი კრატერების ველზე სავსებით საკმარისია, მაგრამ მისვლა-მოსვლა მთელ დღეს მოითხოვს. კრატერის
    კიდეზე არ დადგე — თიხა ღრმად და მოულოდნელად ჩაიწევს, ფეხსაცმელი კი ამის შემდეგ არ იწმინდება. ჩრდილი
    არსად არის, ამიტომ ადრე დილით ან საღამოს მიდი. წყალი და საკვები თან იქონიე. მობილურ ქსელს ნუ ენდობი.
    ვიზიტი მხოლოდ ვაშლოვანის ნებართვასთან ერთად აზრიანია, რადგან გზა პარკზე გადის.
  route: >-
    გზა თბილისიდან დედოფლისწყარომდე ასფალტია, დაახლოებით 140 კმ. შემდეგ ფანტიშარისკენ ეშვები და პარკის
    სამხრეთ კიდისკენ აგრძელებ — კიდევ 70 კმ თიხისა და ხრეშის კოლეებით, დაახლოებით ორნახევარი საათი. ეს
    მონაკვეთი მხოლოდ ჯიპისთვისაა და მშრალ ამინდში; წვიმის შემდეგ თიხა თასმასავით ეკვრება საბურავს. საწვავი
    და სასმელი წყალი დედოფლისწყაროში აიღე. მარტო ერთი მანქანით სიღრმეში შესვლა არ ღირს.
en:
  name: Takhti-Tepha Mud Volcanoes
  short: >-
    A field of small cold mud craters on a flat clay plateau in southern Vashlovani — one of Georgia's
    oddest landscapes.
  body: >-
    **Takhti-Tepha means "flat hill" in Turkic, and the name is exact:** a dry, cracked clay table in
    the southern part of Vashlovani where there is nothing but horizon and sun. Scattered across it are
    a few dozen small cones, the mud volcanoes.


    They have nothing to do with real volcanoes. Gas trapped in the sediments below works its way upward,
    dragging water and clay with it, and what reaches the surface is a cold grey paste at roughly air
    temperature. Most cones are only a metre or two high; some are dry and set hard, while others burp
    slowly, raising a dome of mud that swells and splits. The sound is very quiet — you generally see
    a bubble before you hear it.


    Bubbles come at intervals of a few seconds to a minute, so the sensible thing is to sit down and wait
    rather than walk from cone to cone. Water in some craters is saline and dries to a white crust around
    the rim; occasionally there is a thin oily film, which is unsurprising since the region sits at the
    edge of the Gare Kakheti oil field.


    The setting matters as much as the craters. This is completely treeless country, pale brown and grey,
    with views running tens of kilometres to the mountains inside Azerbaijan and no building in sight.
    In April short grass greens the plateau and tulips flower in the hollows; by July everything is a
    single dusty tone and the heat is hard work.


    Keep expectations proportionate: the crater field is about the size of a football pitch. What makes
    it worth the drive is that nothing else quite like it is reachable in Georgia, and that the silence
    out here is total.
  tip: >-
    An hour at the craters is plenty, but getting there and back fills a whole day. Do not stand on a
    crater rim — the clay gives way deeper than it looks and the mud never really comes out of boots or
    car mats. There is no shade at all, so aim for early morning or the last two hours of light. Carry
    water and food; there is nothing to buy. Do not rely on a mobile signal. The visit only makes sense
    combined with a Vashlovani permit, since the access track runs through the park.
  route: >-
    The road from Tbilisi to Dedoplistskaro is asphalt, about 140 km. From there you drop towards Pantishara
    and continue to the southern edge of the park, another 70 km of clay and gravel ruts, which takes
    roughly two and a half hours. This section is for a proper 4x4 in dry conditions only; wet clay packs
    into the tyres and the tracks become skating rinks. Take on fuel and drinking water in Dedoplistskaro.
    Going in with a single vehicle and no second car is not advisable.
ru:
  name: Грязевые вулканы Тахти-Тепха
  short: >-
    Поле маленьких холодных грязевых кратеров на плоском глиняном плато юга Вашловани — один из самых
    странных пейзажей Грузии.
  body: >-
    **Тахти-Тепха по-тюркски означает «плоский холм», и это точное описание:** сухой растрескавшийся глиняный
    стол на юге Вашловани, где нет ничего, кроме горизонта и солнца. По нему разбросаны несколько десятков
    небольших конусов — грязевые вулканы.


    К настоящим вулканам они отношения не имеют. Газ, запертый в осадочных толщах, пробивается вверх,
    увлекая воду и глину, и на поверхность выходит холодная серая масса примерно температуры воздуха.
    Большинство конусов высотой в метр-два; часть сухая и затвердевшая, часть медленно вздувается пузырём,
    который набухает и лопается. Звук очень тихий — пузырь обычно сначала видишь и лишь потом слышишь.


    Интервалы между всплесками — от нескольких секунд до минуты, поэтому разумнее сесть и подождать, чем
    перебегать от кратера к кратеру. Вода в некоторых воронках солёная и оставляет по краю белую корку;
    иногда заметна тонкая масляная плёнка, что неудивительно: район лежит на краю нефтеносного поля Гаре-Кахети.


    Обрамление здесь не менее важно, чем сами кратеры. Это совершенно безлесная местность, бледно-бурая
    и серая, с обзором на десятки километров до гор уже на азербайджанской стороне и без единой постройки.
    В апреле плато зеленеет короткой травой, в западинах цветут тюльпаны; к июлю всё сводится к одному
    пыльному тону, а жара становится испытанием.


    Соразмеряйте ожидания: поле кратеров размером примерно с футбольное поле. Ехать сюда стоит потому,
    что ничего похожего в Грузии больше не доступно, и потому, что тишина здесь абсолютная.
  tip: >-
    Часа у кратеров вполне достаточно, но дорога туда и обратно съедает весь день. Не вставайте на край
    воронки: глина проваливается глубже, чем кажется, а грязь потом не отмывается ни с обуви, ни с ковриков
    в машине. Тени нет совсем, поэтому планируйте раннее утро или последние два часа света. Везите воду
    и еду, купить негде. На мобильную связь не рассчитывайте. Поездка имеет смысл только вместе с разрешением
    на Вашловани — подъездная колея идёт через парк.
  route: >-
    До Дедоплисцкаро из Тбилиси дорога асфальтовая, около 140 км. Дальше спуск в сторону Пантишары и движение
    к южной кромке парка — ещё 70 км глиняных и щебёночных колей, примерно два с половиной часа. Этот
    участок только для настоящего внедорожника и только по сухому: мокрая глина забивает протектор, и
    колея превращается в каток. Топливо и питьевую воду берите в Дедоплисцкаро. Ехать вглубь одной машиной,
    без сопровождения, не стоит.
fa:
  name: آتشفشان‌های گِلی تختی‌تپه
  short: میدانی از دهانه‌های کوچک گِل سرد بر فلات رسی جنوب واشلوانی — از عجیب‌ترین چشم‌اندازهای گرجستان.
  body: >-
    **تختی‌تپه در ترکی یعنی «تپهٔ صاف» و نام دقیقی است:** میزی از رس خشک و ترک‌خورده در جنوب واشلوانی
    که در آن جز افق و آفتاب چیزی نیست. روی همین پهنه چند ده مخروط کوچک پراکنده‌اند: آتشفشان‌های گِلی.


    اینها با آتشفشان واقعی نسبتی ندارند. گازی که در لایه‌های رسوبی زیرین محبوس شده راه بالا را می‌گیرد
    و آب و رس را با خود می‌آورد، و آنچه به سطح می‌رسد خمیری سرد و خاکستری است، تقریباً هم‌دمای هوا. بیشتر
    مخروط‌ها یک یا دو متر بلندی دارند؛ برخی خشک و سفت شده‌اند و برخی به‌آرامی حبابی بالا می‌آورند که باد
    می‌کند و می‌ترکد. صدا بسیار خفیف است؛ معمولاً حباب را می‌بینید و بعد می‌شنوید.


    فاصلهٔ میان حباب‌ها از چند ثانیه تا یک دقیقه است، پس عاقلانه‌تر آن است که بنشینید و صبر کنید تا آنکه
    از دهانه‌ای به دهانهٔ دیگر بدوید. آب برخی دهانه‌ها شور است و دور لبه پوسته‌ای سفید بر جا می‌گذارد؛
    گاه لایهٔ نازکی از نفت هم دیده می‌شود، که شگفت نیست چون این ناحیه در حاشیهٔ میدان نفتی کاختی بیرونی
    است.


    زمینهٔ اطراف به‌اندازهٔ خود دهانه‌ها اهمیت دارد: سرزمینی یکسره بی‌درخت، قهوه‌ای کمرنگ و خاکستری، با
    دیدی که ده‌ها کیلومتر تا کوه‌های داخل خاک آذربایجان کشیده می‌شود و هیچ ساختمانی در آن نیست. در فروردین
    علف کوتاه فلات را سبز می‌کند و لاله‌ها در گودی‌ها می‌شکفند؛ تا تیرماه همه‌چیز به یک رنگ غبارآلود درمی‌آید.


    انتظار را اندازه نگه دارید: میدان دهانه‌ها به بزرگی یک زمین فوتبال است. ارزش این راه در آن است که
    نمونهٔ دیگری از این پدیده در گرجستان در دسترس نیست، و سکوت اینجا کامل است.
  tip: >-
    یک ساعت کنار دهانه‌ها کافی است، اما رفت و برگشت یک روز کامل می‌برد. روی لبهٔ دهانه نایستید؛ رس عمیق‌تر
    از آنچه به نظر می‌رسد فرو می‌نشیند و این گِل هرگز از کفش و کفپوش خودرو پاک نمی‌شود. سایه اصلاً وجود
    ندارد، پس اول صبح یا دو ساعت پایانی روشنایی را انتخاب کنید. آب و خوراک همراه ببرید، جایی برای خرید
    نیست. به آنتن موبایل تکیه نکنید. این بازدید تنها همراه با مجوز واشلوانی معنا دارد، چون مسیر دسترسی
    از دل پارک می‌گذرد.
  route: >-
    جاده از تفلیس تا ددوپلیس‌تسقارو آسفالت است، حدود 140 کیلومتر. از آنجا به سوی پانتیشارا سرازیر می‌شوید
    و تا لبهٔ جنوبی پارک ادامه می‌دهید: 70 کیلومتر دیگر شیار رسی و شنی، نزدیک دو ساعت و نیم. این بخش تنها
    با خودروی چهارچرخ‌محرک واقعی و تنها در هوای خشک ممکن است؛ رس خیس لای آج لاستیک می‌نشیند و مسیر لغزنده
    می‌شود. سوخت و آب آشامیدنی را در ددوپلیس‌تسقارو تأمین کنید. رفتن به عمق منطقه با یک خودرو و بدون همراه
    توصیه نمی‌شود.
he:
  name: הרי הבוץ טחטי-טפה
  short: שדה של מכתשי בוץ קרים וקטנים על מישור חמר בדרום וושלובני — אחד הנופים המוזרים בגאורגיה.
  body: >-
    **טחטי-טפה פירושו בטורקית "גבעה שטוחה", וזה תיאור מדויק:** שולחן חמר יבש וסדוק בדרום וושלובני, שאין
    בו דבר מלבד אופק ושמש. פזורים עליו כמה עשרות חרוטים קטנים, הם הרי הבוץ.


    אין להם קשר להרי געש אמיתיים. גז הכלוא בשכבות המשקע שמתחת מפלס לו דרך מעלה, גורר איתו מים וחמר, ומה
    שמגיע אל פני השטח הוא עיסה אפורה קרה, בערך בטמפרטורת האוויר. רוב החרוטים גובהם מטר או שניים; חלקם
    יבשים ומוקשים, אחרים מעלים לאט בועה שתופחת ומתבקעת. הקול חלש מאוד, ובדרך כלל רואים את הבועה לפני ששומעים
    אותה.


    בין בעבוע לבעבוע עוברות שניות ולפעמים דקה, ולכן עדיף לשבת ולחכות מאשר לרוץ ממכתש למכתש. המים בחלק
    מהמכתשים מלוחים ומשאירים קרום לבן סביב השפה; לעתים נראית גם שכבת שמן דקה, וזה אינו מפתיע שכן האזור
    יושב בשולי שדה הנפט של קחתי החיצונית.


    הסביבה חשובה כאן לא פחות מן המכתשים. זו ארץ נטולת עצים לחלוטין, חומה בהירה ואפורה, שבה המבט נמשך עשרות
    קילומטרים אל ההרים שכבר בתוך אזרבייג'ן, בלי מבנה אחד באופק. באפריל עשב קצר מוריק על המישור וצבעונים
    פורחים בשקעים; עד יולי הכול נצבע בגוון מאובק אחד.


    שמרו על ציפיות מידתיות: שדה המכתשים בגודל מגרש כדורגל בערך. מה שמצדיק את הנסיעה הוא ששום דבר דומה
    אינו נגיש בגאורגיה, ושהשקט כאן מוחלט.
  tip: >-
    שעה ליד המכתשים מספיקה, אבל הנסיעה הלוך ושוב ממלאת יום שלם. אל תעמדו על שפת מכתש, החמר נכנע עמוק יותר
    משנראה והבוץ הזה לא יורד מנעליים או משטיחי הרכב. אין צל כלל, ולכן כוונו לשעות הבוקר המוקדמות או לשעתיים
    האחרונות של האור. הביאו מים ואוכל, אין מה לקנות. אל תסמכו על קליטה סלולרית. הביקור הגיוני רק בשילוב
    אישור לוושלובני, שכן דרך הגישה עוברת בתוך הפארק.
  route: >-
    הכביש מטביליסי לדדופליסצקארו סלול, כ-140 ק״מ. משם יורדים לכיוון פנטישארה וממשיכים אל הקצה הדרומי של
    הפארק, עוד 70 ק״מ של תלמי חמר וחצץ, כשעתיים וחצי. הקטע הזה מיועד לרכב שטח אמיתי ורק בתנאים יבשים;
    חמר רטוב נדבק לצמיגים והדרך הופכת חלקלקה. תדלקו וקנו מים בדדופליסצקארו. כניסה עמוקה לאזור עם רכב יחיד
    וללא ליווי אינה מומלצת.
ar:
  name: براكين الطين في تختي تبه
  short: حقل من فوهات طينية باردة صغيرة على هضبة طينية مسطحة جنوب فاشلوفاني — من أغرب مشاهد جورجيا.
  body: >-
    **تختي تبه تعني بالتركية «التل المسطح»، والاسم دقيق:** مائدة من الطين الجاف المتشقق في جنوب فاشلوفاني
    لا شيء فيها سوى الأفق والشمس. وتنتشر عليها بضع عشرات من المخاريط الصغيرة، وهي براكين الطين.


    ولا صلة لها بالبراكين الحقيقية. فالغاز المحبوس في الطبقات الرسوبية أسفلها يشق طريقه إلى الأعلى جارّاً
    معه الماء والطين، وما يبلغ السطح عجينة رمادية باردة في حرارة الهواء تقريباً. معظم المخاريط لا يتجاوز
    ارتفاعها متراً أو مترين؛ بعضها جاف متصلب، وبعضها يرفع ببطء فقاعة تنتفخ ثم تنفلق. والصوت خافت جداً،
    وغالباً ترى الفقاعة قبل أن تسمعها.


    تفصل بين الفقاعات ثوانٍ وربما دقيقة، فالأجدى أن تجلس وتنتظر بدل أن تنتقل بين الفوهات. وماء بعض الفوهات
    مالح يترك قشرة بيضاء حول الحافة؛ وقد تظهر أحياناً طبقة زيتية رقيقة، وهذا غير مستغرب لأن المنطقة تقع
    على طرف حقل نفط كاخيتي الخارجية.


    والمحيط هنا لا يقل أهمية عن الفوهات نفسها. أرض خالية من الشجر تماماً، بنية باهتة ورمادية، يمتد فيها
    النظر عشرات الكيلومترات إلى جبال داخل أذربيجان، ولا مبنى واحد في المشهد. في نيسان يخضرّ العشب القصير
    على الهضبة وتتفتح الزنابق في المنخفضات؛ ومع تموز يصير كل شيء لوناً غبارياً واحداً.


    وليكن التوقع بحجمه: حقل الفوهات في مساحة ملعب كرة قدم تقريباً. وما يبرر الطريق أن لا نظير له في متناول
    الزائر داخل جورجيا، وأن الصمت هنا مطبق.
  tip: >-
    ساعة عند الفوهات تكفي، لكن الذهاب والإياب يستغرقان يوماً كاملاً. لا تقف على حافة فوهة، فالطين ينهار
    أعمق مما يبدو ولا يزول بعدها عن الحذاء أو فُرش السيارة. ولا ظل هنا إطلاقاً، فاقصدها في الصباح الباكر
    أو في آخر ساعتين من النهار. احمل ماءك وطعامك، فلا شيء يُشترى. ولا تعتمد على شبكة الهاتف. والزيارة
    لا معنى لها إلا مع تصريح فاشلوفاني، لأن طريق الوصول يمر داخل الحديقة.
  route: >-
    الطريق من تبليسي إلى ددوبليستسقارو معبّد، نحو 140 كم. ومن هناك تهبط نحو بانتيشارا وتتابع إلى الطرف
    الجنوبي للحديقة: 70 كم أخرى من أخاديد الطين والحصى، نحو ساعتين ونصف. هذا القسم لسيارة دفع رباعي حقيقية
    وفي الجو الجاف وحده؛ فالطين المبلل يلتصق بالإطارات ويجعل المسلك زلقاً. زوّد الخزان واشترِ الماء في
    ددوبليستسقارو. ولا يُنصح بالتوغل بسيارة واحدة دون مرافقة.
