ka:
  name: გულის მყინვარი
  short: >-
    ხანგრძლივი ლაშქრობა მაზერიდან, მიტოვებული სოფელ გულის ნანგრევების გავლით, უშბის ძირში, ალპინისტების
    ბანაკამდე, სადაც მყინვარის მორენა იწყება.
  body: >-
    **გულიჭალის ხეობის სათავეში, მორენის კიდეზე, მემორიალური დაფები დგას — სიმბოლური სასაფლაო იმ ალპინისტებისა,
    ვინც უშბამ აღარ დააბრუნა.**


    ეს გვერდი უშბის ძირამდე ლაშქრობას ეძღვნება; მთის ხედები მესტიიდან, ბეჩოდან და მაზერიდან ჩვენს „უშბის“
    გვერდზეა აღწერილი. ბილიკი მაზერის სამხრეთით, მიმთითებელ დაფასთან იწყება, ბაგვდანარს გაივლის და აღმოსავლეთით,
    გულიჭალის ხეობაში უხვევს — ჯერ ჯიპის გზით, მერე კლდოვან ღარს აუყვება და ღია საძოვარზე გადის. წინ გულის
    ნანგრევები მოჩანს: ნაფუძარად ქცეული სახლები და მათ შორის ჯერაც ფეხზე მდგარი ეკლესია. როდის და რატომ
    დაიცალა სოფელი, ჩვენ მიერ ნანახი არც ერთი წყარო არ ამბობს. 2024 წლიდან ეკლესიამდე ცოტა ადრე, ბილიკის
    პირას, პატარა კაფე მუშაობს.


    დაახლოებით ერთ საათში მრავალი ფოტოდან ნაცნობ მწყემსების ქოხებს მიადგებით. აქედან მიმთითებლები გულის
    უღელტეხილისკენ მიგანიშნებენ — ეს კორულდის ტბების გავლით მესტიისკენ მიმავალი გრძელი გადასასვლელია;
    მყინვარის ბილიკი კი პირდაპირ გრძელდება, წყაროს ჩაუვლის, მდინარეს მიჰყვება და დაახლოებით 2580 მეტრიდან
    კლაკნილებით ადის ალპინისტების ბანაკამდე, დაახლოებით 2940 მეტრზე. თქვენ წინ გულის მყინვარის ნაცრისფერი
    მორენაა, უშბა, რომელსაც თავის გადაწევით უყურებთ, და მისი მეზობელი გულბა.


    ბანაკიდან იწყება უშბის სამხრეთ მწვერვალზე 5ბ სირთულის მარშრუტი, რომელიც პირველად 1937 წელს სვანმა
    ალპინისტმა გაბრიელ ხერგიანმა გაიარა და მისი სახელიც ჰქვია. მეორე მსოფლიო ომის დროს ის უღელტეხილებისთვის
    გამართულ შეტაკებებში იბრძოდა, 1943 წელს კი იმ ექსპედიციაში მონაწილეობდა, რომელმაც იალბუზიდან გერმანული
    დროშა ჩამოხსნა. უფროსი ვაჟის დახრჩობის შემდეგ ხალხს განერიდა, მთაში მარტო დადიოდა სანადიროდ და კლდიდან
    ჩამოვარდნით დაიღუპა.
  tip: >-
    მარშრუტი წასვლა-მოსვლით დაახლოებით 16 კმ-ია, თითქმის 1500 მეტრი აღმართით: 8–9 საათი, საიდანაც ხუთამდე
    ასვლას მიაქვს. განთიადისას გაუდექით გზას — უშბა ღრუბელს სწრაფად იკრებს. ქვედა ნახევარი წითელ-თეთრი
    საღებავით არის მონიშნული, ზედა ქვის პირამიდებით. ბოთლები მწყემსების ქოხებთან, წყაროებზე შეავსეთ: ზემოთ
    მყინვარის წყალი ლამით არის სავსე. მორენაზე ნუ გახვალთ — ციცაბოა, ზაფხულში კი ქვაცვენა ნამდვილი საფრთხეა.
    ბანაკის ქვემოთ კარვისთვის ვაკე ადგილია. იარეთ მხოლოდ ივნისიდან სექტემბრამდე, სალაშქრო ფეხსაცმლით,
    საწვიმრითა და თბილი ტანსაცმლით.
  route: >-
    იარეთ ისე, როგორც ბეჩოსა და მაზერისკენ: ს1 (E60) მაგისტრალით დასავლეთისკენ ზუგდიდამდე, შემდეგ შ7 გზით,
    ჯვრის გავლით, ენგურის ხეობას აუყევით; მესტიამდე ცოტა ადრე მარცხნივ, ბეჩოს ხეობაში შეუხვიეთ და მაზერამდე
    მიდით. სულ დაახლოებით 455 კმ და 8 საათი და 20 წუთია. ხეობის ბოლო მონაკვეთი ხრეშიანია, ამიტომ ჯიპი
    წაიყვანეთ. მაზერში საზოგადოებრივი ტრანსპორტი არ დადის; მესტიიდან ტაქსი 2024 წელს 80–100 ლარი ღირდა.
    მანქანა სოფელში დატოვეთ — აქედან მხოლოდ ფეხით. ბოლო საიმედო ბენზინგასამართი ზუგდიდსა და მესტიაშია.
en:
  name: Guli Glacier and Ushba Base
  short: >-
    A long day's walk from Mazeri past the ruined village of Gul to the climbers' camp beneath Ushba,
    where the glacier's moraine begins.
  body: >-
    **At the head of the Gulichala valley, memorial plaques stand at the edge of the moraine, a symbolic
    cemetery for the climbers Ushba never let go.**


    This page is about walking to Ushba's foot; our Mount Ushba page covers the views of the mountain
    from Mestia, Becho and Mazeri. The trail starts at a signpost south of Mazeri, passes the hamlet of
    Bagvdanari and turns east into the Gulichala valley, first on a 4x4 track, then up a rocky chute onto
    open pasture. Ahead lie the ruins of Gul: houses reduced to rubble, and among them a church still
    standing. When and why the village emptied, no source we found records. Since 2024 a small café has
    been open by the trail just before the church.


    About an hour on stand the shepherd huts familiar from many photographs. Signs point up to Guli Pass,
    the long crossing to Mestia by way of the Koruldi Lakes; the glacier path carries straight on, past
    a spring and along the river, then climbs in switchbacks from about 2,580 metres to the mountaineers'
    camp at roughly 2,940. In front of you lie the grey moraine of the Guli glacier, Ushba close enough
    to crane your neck at, and its neighbour Gulba.


    The camp is the start of a 5B route up Ushba's south peak, first climbed in 1937 by the Svan alpinist
    Gabriel Khergiani, whose name it carries. During the Second World War he fought in the skirmishes
    over the mountain passes, and in 1943 he joined the expedition sent to take down the German flag from
    Elbrus. After his eldest son drowned he withdrew into solitary hunting trips in the mountains, and
    he died in a fall from a cliff.
  tip: >-
    The walk is about 16 km there and back with nearly 1,500 m of climbing: 8 to 9 hours, up to five of
    them uphill. Start at dawn, because Ushba gathers cloud quickly. Red-and-white paint marks the lower
    half and stone cairns the upper. Fill your bottles at the springs near the shepherd huts; higher up,
    the glacier water is thick with silt. Don't wander onto the moraine: it is steep, and in summer rockfall
    is real. There is flat ground for tents below the camp. Go from June to September only, with boots,
    a waterproof and warm layers.
  route: >-
    Drive as for Becho and Mazeri: the S1 (E60) west to Zugdidi, then the Sh7 through Jvari and up the
    Enguri gorge; before Mestia turn left into the Becho valley and follow it to Mazeri. That is about
    455 km and 8 hours 20 minutes. The last stretch up the valley is gravel, so take an SUV. There is
    no public transport to Mazeri; a taxi from Mestia cost 80 to 100 GEL in 2024. Park in the village,
    because the trail is on foot only from here. The last reliable fuel is in Zugdidi or Mestia.
ru:
  name: Ледник Гули и лагерь под Ушбой
  short: >-
    Долгий день пешком от Мазери мимо разрушенного села Гуль к лагерю альпинистов под Ушбой, где начинается
    морена ледника.
  body: >-
    **В верховьях долины Гуличала, у края морены, стоят памятные доски — символическое кладбище альпинистов,
    которых Ушба так и не отпустила.**


    Эта страница — о пешем пути к подножию Ушбы; виды на гору из Местиа, Бечо и Мазери описаны на нашей
    странице «Гора Ушба». Тропа начинается у указателя к югу от Мазери, минует хутор Багвданари и сворачивает
    на восток, в долину Гуличала: сначала по колее для внедорожников, потом вверх по каменистому жёлобу
    на открытые пастбища. Впереди — руины Гуля: дома, превратившиеся в груды камня, и среди них уцелевшая
    церковь. Когда и почему опустело село, ни один из найденных нами источников не сообщает. С 2024 года
    у тропы, чуть не доходя до церкви, работает маленькое кафе.


    Примерно через час пути стоят пастушьи хижины, знакомые по множеству фотографий. Указатели ведут вверх,
    на перевал Гули — долгий переход в Местиа через озёра Корульди; тропа к леднику идёт прямо, мимо родника
    и вдоль реки, а затем серпантином поднимается с высоты около 2580 метров к альпинистскому лагерю примерно
    на 2940. Перед вами — серая морена ледника Гули, Ушба так близко, что приходится запрокидывать голову,
    и её соседка Гульба.


    От лагеря начинается маршрут категории 5Б на южную вершину Ушбы — его впервые прошёл в 1937 году сванский
    альпинист Габриэл Хергиани, и маршрут носит его имя. Во время Второй мировой войны Хергиани участвовал
    в стычках за горные перевалы, а в 1943 году вошёл в экспедицию, отправленную снять немецкий флаг с
    Эльбруса. После того как утонул его старший сын, он замкнулся в одиночных охотничьих походах по горам
    и погиб, сорвавшись со скалы.
  tip: >-
    Путь — около 16 км туда и обратно с набором высоты почти 1500 м: 8–9 часов, из них до пяти — на подъём.
    Выходите на рассвете: Ушба быстро затягивается облаками. Нижняя половина маршрута отмечена красно-белой
    краской, верхняя — каменными турами. Набирайте воду в родниках у пастушьих хижин: выше ледниковая
    вода густо замутнена илом. Не сходите на морену: она крутая, а летом камнепады вполне реальны. Ниже
    лагеря есть ровные площадки для палаток. Ходите только с июня по сентябрь, в ботинках, с дождевиком
    и тёплыми вещами.
  route: >-
    Путь тот же, что к Бечо и Мазери: по S1 (E60) на запад до Зугдиди, затем по Sh7 через Джвари вверх
    по ущелью Ингури; не доезжая Местиа, сверните налево в долину Бечо и поднимайтесь по ней до Мазери.
    Это около 455 км и 8 часов 20 минут. Последний отрезок по долине — гравийная дорога, так что берите
    внедорожник. Общественного транспорта до Мазери нет; такси из Местиа в 2024 году стоило 80–100 лари.
    Машину оставьте в селе: дальше тропа только пешая. Последняя надёжная заправка — в Зугдиди или Местиа.
fa:
  name: یخچال گولی و اردوگاه پای اوشبا
  short: >-
    یک روز پیاده‌روی طولانی از مازری، از کنار ویرانه‌های روستای گول، تا اردوگاه کوهنوردان در پای اوشبا،
    جایی که مورن یخچال آغاز می‌شود.
  body: >-
    **در سرِ درهٔ گولیچالا، بر لبهٔ مورن، لوح‌های یادبودی ایستاده‌اند؛ گورستانی نمادین برای کوهنوردانی
    که اوشبا هرگز رهایشان نکرد.**


    این صفحه دربارهٔ پیاده‌روی تا پای اوشباست؛ چشم‌اندازهای کوه از مستیا، بچو و مازری را صفحهٔ «کوه اوشبا»ی
    ما پوشش می‌دهد. مسیر از تابلوی راهنمایی در جنوب مازری آغاز می‌شود، از آبادی باگودناری می‌گذرد و رو
    به شرق به درهٔ گولیچالا می‌پیچد؛ نخست در راهی خاکی برای خودروهای چهارچرخ‌محرک، سپس از آبراهه‌ای سنگلاخی
    بالا تا چراگاه‌های باز. پیش رو ویرانه‌های گول است: خانه‌هایی که به تلی از سنگ بدل شده‌اند، و در میانشان
    کلیسایی که هنوز برپاست. اینکه روستا کی و چرا خالی شد، در هیچ منبعی که یافتیم ثبت نشده است. از ۲۰۲۴
    کافه‌ای کوچک کنار مسیر، کمی پیش از کلیسا، باز است.


    حدود یک ساعت جلوتر کلبه‌های چوپانی‌ای ایستاده‌اند که از عکس‌های بسیار آشنایند. تابلوها رو به بالا
    به گردنهٔ گولی اشاره می‌کنند، گذرگاهی طولانی به مستیا از راه دریاچه‌های کورولدی؛ مسیر یخچال اما مستقیم
    ادامه می‌یابد، از کنار چشمه‌ای و در امتداد رود، و سپس با پیچ‌های تند از حدود ۲۵۸۰ متر تا اردوگاه کوهنوردان
    در حدود ۲۹۴۰ متر بالا می‌رود. پیش رویتان مورن خاکستری یخچال گولی است، اوشبا چنان نزدیک که باید سر
    را به عقب خم کنید، و همسایه‌اش گولبا.


    اردوگاه نقطهٔ آغاز مسیری با درجهٔ 5B به قلهٔ جنوبی اوشباست که نخستین بار در ۱۹۳۷ گابریل خرگیانی، کوهنورد
    سوانی، آن را پیمود و نام او را بر خود دارد. خرگیانی در جنگ جهانی دوم در زد و خوردهای گردنه‌های کوهستانی
    جنگید و در ۱۹۴۳ به گروهی پیوست که برای پایین آوردن پرچم آلمان از البروس فرستاده شد. پس از غرق شدن
    پسر بزرگش، در سفرهای شکار تنهایی در کوهستان در خود فرو رفت و با سقوط از صخره‌ای جان باخت.
  tip: >-
    پیاده‌روی رفت و برگشت حدود ۱۶ کیلومتر است با نزدیک به ۱۵۰۰ متر صعود: ۸ تا ۹ ساعت، که تا پنج ساعتش
    سربالایی است. سپیده‌دم راه بیفتید، چون اوشبا زود ابر می‌گیرد. نیمهٔ پایینی مسیر با رنگ سرخ و سفید
    نشانه‌گذاری شده و نیمهٔ بالایی با سنگ‌چین‌ها. بطری‌ها را از چشمه‌های کنار کلبه‌های چوپانی پر کنید؛
    بالاتر، آب یخچال پر از گل‌ولای است. به روی مورن نروید: شیبش تند است و در تابستان ریزش سنگ خطری واقعی
    است. پایین‌تر از اردوگاه زمین صاف برای چادر هست. فقط از ژوئن تا سپتامبر بروید، با کفش کوه، بارانی
    و لباس گرم.
  route: >-
    مسیر همان راه بچو و مازری است: S1 (E60) رو به غرب تا زوگدیدی، سپس Sh7 از راه جواری و بالا در درهٔ
    انگوری؛ پیش از مستیا به چپ، به درهٔ بچو بپیچید و آن را تا مازری دنبال کنید. روی هم حدود ۴۵۵ کیلومتر
    و ۸ ساعت و ۲۰ دقیقه. تکهٔ آخر در دره شنی است، پس شاسی‌بلند بگیرید. به مازری حمل‌ونقل عمومی نمی‌رود؛
    تاکسی از مستیا در ۲۰۲۴ میان ۸۰ تا ۱۰۰ لاری کرایه داشت. خودرو را در روستا پارک کنید، چون از اینجا مسیر
    فقط پیاده است. آخرین پمپ‌بنزین مطمئن در زوگدیدی یا مستیاست.
he:
  name: קרחון גולי ובסיס אושבה
  short: >-
    יום הליכה ארוך ממזרי, על פני חורבות הכפר גול, אל מחנה המטפסים למרגלות אושבה, במקום שבו מתחילה המורנה
    של הקרחון.
  body: >-
    **בראש עמק גוליצ'אלה, בשולי המורנה, ניצבים לוחות זיכרון – בית קברות סמלי למטפסים שלא שבו מאושבה.**


    עמוד זה עוסק בהליכה אל רגלי אושבה; עמוד "הר אושבה" שלנו מתאר את הנופים אל ההר ממסטיה, מבצ'ו וממזרי.
    השביל מתחיל בשלט הכוונה מדרום למזרי, עובר ליד הכפרון בגוודנארי ופונה מזרחה אל עמק גוליצ'אלה – תחילה
    בדרך עפר לרכבי שטח, ואחר כך במעלה ערוץ סלעי אל כרי מרעה פתוחים. לפניכם חורבות גול: בתים שהפכו לגלי
    אבנים, וביניהם כנסייה שעדיין עומדת. מתי ומדוע התרוקן הכפר – אף מקור שמצאנו אינו מתעד. מאז 2024 פועל
    ליד השביל, מעט לפני הכנסייה, בית קפה קטן.


    כשעה הלאה עומדות בקתות הרועים המוכרות מתצלומים רבים. שלטים מפנים במעלה אל מעבר גולי, המעבר הארוך אל
    מסטיה דרך אגמי קורולדי; שביל הקרחון ממשיך ישר, על פני מעיין ולאורך הנהר, ואז מטפס בעיקולים מגובה של
    כ-2,580 מטרים אל מחנה המטפסים בגובה של כ-2,940. מולכם המורנה האפורה של קרחון גולי, אושבה קרוב כל כך
    שצריך להטות את הראש לאחור, ולצידו שכנו גולבה.


    מן המחנה יוצא מסלול בדרגה 5B אל הפסגה הדרומית של אושבה, שבו טיפס לראשונה ב-1937 המטפס הסוואני גבריאל
    חרגיאני, ושנקרא על שמו. במלחמת העולם השנייה לחם חרגיאני בהתכתשויות על מעברי ההרים, וב-1943 הצטרף למשלחת
    שנשלחה להוריד את הדגל הגרמני מן האלברוס. לאחר שבנו הבכור טבע, הסתגר במסעות ציד בודדים בהרים, ומת בנפילה
    מצוק.
  tip: >-
    ההליכה כ-16 ק"מ הלוך ושוב, עם עלייה מצטברת של כמעט 1,500 מ': 8 עד 9 שעות, עד חמש מהן בעלייה. צאו עם
    שחר, כי אושבה מתכסה עננים במהירות. החצי התחתון מסומן בצבע אדום-לבן, והעליון בערימות אבנים. מלאו בקבוקים
    במעיינות שליד בקתות הרועים; גבוה יותר מי הקרחון עכורים מסחף. אל תעלו על המורנה: היא תלולה, ובקיץ סכנת
    נפילת סלעים ממשית. מתחת למחנה יש שטח מישורי לאוהלים. לכו רק בין יוני לספטמבר, עם נעלי הליכה, מעיל
    גשם ושכבות חמות.
  route: >-
    הנסיעה זהה לזו שלבצ'ו ולמזרי: כביש S1 (E60) מערבה עד זוגדידי, ואז כביש Sh7 דרך ג'וארי ובמעלה ערוץ
    האנגורי; לפני מסטיה פנו שמאלה אל עמק בצ'ו והמשיכו בו עד מזרי. זה כ-455 ק"מ ו-8 שעות ו-20 דקות. הקטע
    האחרון במעלה העמק הוא דרך חצץ, לכן קחו רכב שטח. אין תחבורה ציבורית למזרי; מונית ממסטיה עלתה ב-2024
    בין 80 ל-100 לארי. חנו בכפר, כי מכאן השביל רגלי בלבד. התחנה האמינה האחרונה לתדלוק היא בזוגדידי או
    במסטיה.
ar:
  name: نهر غولي الجليدي وقاعدة أوشبا
  short: يوم مشي طويل من مازيري مروراً بأطلال قرية غول إلى مخيم المتسلقين عند سفح أوشبا، حيث يبدأ الركام
    الجليدي.
  body: >-
    **في رأس وادي غوليتشالا، على حافة الركام الجليدي، تنتصب ألواح تذكارية، مقبرة رمزية للمتسلقين الذين
    لم يعودوا من أوشبا قط.**


    هذه الصفحة عن المشي إلى سفح أوشبا؛ أما صفحتنا «جبل أوشبا» فتتناول مشاهد الجبل من ميستيا وبيتشو ومازيري.
    يبدأ الدرب عند لافتة إرشادية جنوب مازيري، ويمرّ بنجع باغفدناري ثم ينعطف شرقاً إلى وادي غوليتشالا،
    أولاً على مسلك لسيارات الدفع الرباعي، ثم صعوداً في مجرى صخري إلى مراعٍ مفتوحة. أمامكم أطلال غول: بيوت
    صارت ركاماً، وبينها كنيسة لا تزال قائمة. أما متى هُجرت القرية ولماذا، فلا يذكره أي مصدر وجدناه. ومنذ
    عام 2024 يعمل مقهى صغير بجانب الدرب قُبيل الكنيسة.


    بعد نحو ساعة تظهر أكواخ الرعاة المألوفة من صور كثيرة. تشير اللافتات صعوداً إلى ممر غولي، وهو مسار
    عبور طويل إلى ميستيا عن طريق بحيرات كورولدي؛ أما درب النهر الجليدي فيمضي مستقيماً، مروراً بنبع وعلى
    امتداد النهر، ثم يصعد في منعطفات متعرجة من نحو 2580 متراً إلى مخيم متسلقي الجبال على ارتفاع نحو 2940
    متراً. أمامكم الركام الرمادي لنهر غولي الجليدي، وأوشبا قريب حتى إنكم ترفعون رؤوسكم عالياً لتروه، ويجاوره
    غولبا.


    المخيم نقطة انطلاق مسار من درجة 5B إلى القمة الجنوبية لأوشبا، صعده أول مرة عام 1937 متسلق الجبال السفاني
    غابرييل خيرغياني، ويحمل المسار اسمه. في الحرب العالمية الثانية قاتل خيرغياني في المناوشات على الممرات
    الجبلية، وفي عام 1943 انضم إلى البعثة التي أُرسلت لإنزال العلم الألماني عن إلبروس. وبعد أن غرق ابنه
    الأكبر انطوى على نفسه في رحلات صيد منفردة في الجبال، ومات إثر سقوطه من جرف.
  tip: >-
    المسافة نحو 16 كم ذهاباً وإياباً مع صعود يقارب 1500 متر: من 8 إلى 9 ساعات، منها ما يصل إلى خمس ساعات
    صعوداً. انطلقوا عند الفجر، فأوشبا يتلفّع بالغيوم سريعاً. النصف الأدنى معلَّم بطلاء أحمر وأبيض، والأعلى
    بأكوام من الحجارة. املأوا قواريركم من الينابيع قرب أكواخ الرعاة؛ فمياه النهر الجليدي في الأعلى مثقلة
    بالطمي. لا تصعدوا إلى الركام الجليدي: فهو شديد الانحدار، وتساقط الصخور في الصيف خطر حقيقي. تحت المخيم
    أرض مستوية للخيام. اذهبوا من يونيو إلى سبتمبر فقط، بأحذية مشي ومعطف واقٍ من المطر وملابس دافئة.
  route: >-
    الطريق هو نفسه إلى بيتشو ومازيري: S1 (E60) غرباً حتى زوغديدي، ثم Sh7 عبر جفاري وصعوداً في مضيق إنغوري؛
    وقبل ميستيا انعطفوا يساراً إلى وادي بيتشو وتابعوه حتى مازيري. المسافة نحو 455 كم و8 ساعات و20 دقيقة.
    المقطع الأخير في الوادي مفروش بالحصى، فاختاروا سيارة دفع رباعي. لا مواصلات عامة إلى مازيري؛ وكانت
    أجرة سيارة الأجرة من ميستيا في 2024 بين 80 و100 لاري. اركنوا في القرية، فالدرب من هنا للمشاة فقط.
    آخر محطة وقود يُعتمد عليها في زوغديدي أو ميستيا.
