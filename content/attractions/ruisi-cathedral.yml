ka:
  name: რუისის ღვთაების ტაძარი
  short: >-
    აქ ყრმა მეფე აკურთხეს, დავით აღმაშენებლის კრება შეიკრიბა, თემურ-ლენგმა დაანგრია და კვლავ აღსდგა —
    რუისის ჭრელი კედლები ყველაფერს ინახავს.
  body: >-
    **რუისი იმდენჯერ დაიწვა, შეირყა და აღდგა, რომ მისი კედლები ქართული ისტორიის დავთარს ჰგავს — და ჩანაწერების
    უმეტესობას ხელი აწერია.**


    უძველესი, VIII–IX საუკუნეების წყობა საკურთხევლის არეშია შემორჩენილი; X და XI საუკუნეებში ტაძარი გადააკეთეს.
    1055 წელს ძლევამოსილმა ლიპარიტ კლდეკარის ერისთავმა აქ მეფედ აკურთხებინა ყრმა, მომავალი გიორგი II.
    რუისის ეპისკოპოსები მროველის სახელს ატარებდნენ, მათგან ერთ-ერთს, ლეონტის, XI საუკუნეში ქართული მატიანეების
    კრებულის შედგენას მიაწერენ. 1103 წელს დავით აღმაშენებელმა სწორედ აქ და მეზობელ ურბნისში მოიწვია საეკლესიო
    კრება, რომელმაც ფულით ნაყიდი ან მემკვიდრეობით მიღებული კათედრების მფლობელი ეპისკოპოსები გადააყენა
    და ეკლესია გვირგვინს დაუმორჩილა.


    1400 წელს თემურ-ლენგის ლაშქარმა ტაძარი თითქმის მიწასთან გაასწორა. ალექსანდრე I-მა (მეფობდა 1412–1442
    წლებში) იგი ხელახლა ააგო და რუისისა და მცხეთის აღსადგენად განსაკუთრებული გადასახადიც კი შემოიღო; დასავლეთ
    ფასადის წარწერა მეფეს იხსენიებს, სამხრეთისა — ხუროთმოძღვარ შალვას. XVI საუკუნეში ტაძარი რუისის ეპისკოპოსმა
    დიონისე ლარაძემ განაახლა, 1660-იან წლებში — ქართლის დედოფალმა მარიამმა. 1695 წელს აქ, ტყვეობაში, მოკლეს
    იმერეთის მეფე ალექსანდრე IV და აქვე დაკრძალეს. 1920 წლის გორის მიწისძვრამ ტაძარი კვლავ დააზიანა; შეკეთება
    1936–1938 და 1950–1953 წლებში მოჰყვა.


    დღევანდელი ნაგებობა ჯვარ-გუმბათოვანია, 27,3 × 19,6 მეტრი და 23,3 მეტრი სიმაღლის; მაღალ თორმეტწახნაგა
    ყელს თორმეტი სარკმელი ჭრის. კედლები ჭრელია — ქვიშაქვას ბაზალტი, კირქვა და აგური ენაცვლება — ჩუქურთმა
    კი კარ-სარკმლების გარშემო ყველაზე მჭიდროა. შიგნით საკურთხეველს 1781 წლის ხის კვეთილი კანკელი ჰყოფს,
    კედლებზე გვიანი შუა საუკუნეების მოხატულობის მკრთალი ნაშთებია. კარიბჭედ XVII საუკუნის სამსართულიანი
    სამრეკლო გამოიყენება.


    დადექით დასავლეთ კართან და ქვაში საუკუნეები დათვალეთ: აქ ამ შენობაზე ხელი არავის აუღია.
  tip: >-
    ორმოცდახუთი წუთიდან საათამდე საკმარისია; ურბნისთან ერთად დაგეგმეთ, რომელიც გზით სულ 7 კმ-შია — ადრეული
    ბაზილიკა და გვიანდელი გუმბათოვანი ტაძარი, ორივე ერთი კრების ისტორიით. რუისი ურბნისისა და რუისის ეპარქიის
    კათედრაა და ცოცხალი, მოქმედი ტაძარი: მხრები და მუხლები დაფარული, თავსაფარი თან იქონიეთ. კვირა დილით
    წირვაა, კანკელის დასათვალიერებლად სამუშაო დღის ნაშუადღევი სჯობს. ზამთარში შიგნით ცივა და ნესტიანია.
    სოფელში პატარა მაღაზიაა, კაფე — არა; სადილი გორში გამოგივათ.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ, გორის გავლით — დაახლოებით 96 კმ სწრაფი, ოთხზოლიანი
    გზა; ტაძრის გუმბათის ყელი გზის ჩრდილოეთით შორიდანვე ჩანს. რუისისა და ურბნისის გასასვლელზე გადაუხვიეთ
    და მოკლე ადგილობრივი გზით (შ135) დაახლოებით ერთ კილომეტრში სოფელში ხართ. სულ დაახლოებით 99 კმ და საათი
    და ოცი წუთი. სოფლის ქუჩაზე საქონელი დასეირნობს, ამიტომ ნელა იარეთ. საწვავი გორსა და ქარელშია. ტაძრის
    წინ ღია მოედანზე პარკირება უფასოა; ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისია.
en:
  name: Ruisi Cathedral
  short: >-
    It crowned a boy-king, hosted David the Builder's council, fell to Timur and rose again: Ruisi's patched,
    polychrome walls keep every entry.
  body: >-
    **Ruisi has been burnt, shaken and rebuilt so often that its walls read like a ledger of Georgian
    history — and most of the entries are signed.**


    The oldest stones, of the 8th or 9th century, survive around the altar; the church was remodelled
    in the 10th and 11th centuries. In 1055 the powerful Duke Liparit of Kldekari had the boy who would
    become King George II crowned here. The bishops of Ruisi bore the title Mroveli, and one of them,
    Leonti, is credited with compiling the 11th-century corpus of the Georgian chronicles. In 1103 David
    the Builder convened his great church council here and at nearby Urbnisi; it removed bishops who had
    bought or inherited their sees and bound the church to the crown.


    Timur's armies all but destroyed the cathedral in 1400. King Alexander I (r. 1412–1442) rebuilt it,
    raising a special tax for Ruisi and Mtskheta; an inscription on the west façade honours him, and one
    on the south names the architect, Shalva. Bishop Dionise Laradze renewed it in the 16th century, Queen
    Mariam of Kartli in the 1660s. In 1695 King Alexander IV of Imereti, held prisoner at Ruisi, was killed
    and buried in this church. The Gori earthquake of 1920 broke it again; repairs followed in 1936–38
    and 1950–53.


    What stands is a cross-in-square church, 27.3 by 19.6 metres and 23.3 metres high, its tall twelve-sided
    drum pierced by twelve windows. The walls are polychrome — sandstone patched with basalt, limestone
    and brick — and the carving gathers thickly round doors and windows. Inside, a carved wooden iconostasis
    of 1781 screens the sanctuary, and faint late-medieval frescoes survive. A 17th-century bell tower
    of three storeys serves as the gate.


    Stand at the west door and count the centuries in the stone: nobody here ever gave up on this building.
  tip: >-
    Give it 45 minutes to an hour, and pair it with Urbnisi, 7 km away by road: an early basilica and
    a later domed church, both tied to the same council. Ruisi is the seat of the Urbnisi–Ruisi eparchy
    and a busy working church — cover shoulders and knees, bring a headscarf, and expect services on Sunday
    mornings; a weekday afternoon is better for studying the iconostasis. The interior is cold and damp
    in winter. The village has a small shop but no café; eat in Gori.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi past Gori, about 96 km of fast dual carriageway; the
    cathedral's drum is visible just north of the road. Leave at the junction for Ruisi and Urbnisi and
    follow the short local road (Sh135) about a kilometre into the village. Around 99 km and 1 hour 20
    minutes in all. Cattle wander the village lane, so go gently. Fuel in Gori or Kareli. Free parking
    on the open square before the cathedral; an economy car is fine all year round.
ru:
  name: Руисский собор
  short: >-
    Здесь короновали мальчика-царя, заседал собор Давида Строителя, здесь прошёл Тимур — и храм поднялся
    снова: латаные пёстрые стены Руиси хранят каждую запись.
  body: >-
    **Руиси столько раз горел, разрушался от землетрясений и отстраивался заново, что его стены читаются
    как летопись грузинской истории — и большинство записей в ней подписаны.**


    Древнейшие камни, VIII или IX века, сохранились вокруг алтаря; в X и XI веках храм перестраивали.
    В 1055 году могущественный эристави Липарит Клдекарский велел короновать здесь мальчика, которому
    предстояло стать царём Георгием II. Руисские епископы носили титул Мровели, и одному из них, Леонти,
    приписывают составление свода грузинских летописей XI века. В 1103 году Давид Строитель созвал здесь
    и в соседнем Урбниси свой великий церковный собор; тот низложил епископов, купивших или унаследовавших
    кафедры, и подчинил церковь короне.


    В 1400 году войска Тимура почти уничтожили храм. Царь Александр I (правил в 1412–1442 годах) восстановил
    его, введя ради Руиси и Мцхеты особый налог; надпись на западном фасаде прославляет царя, а надпись
    на южном называет зодчего — Шалву. В XVI веке храм обновил епископ Дионисий Ларадзе, в 1660-х — царица
    Картли Мариам. В 1695 году здесь, в Руиси, убили находившегося в плену имеретинского царя Александра
    IV и похоронили в этой церкви. Горийское землетрясение 1920 года снова разрушило храм; ремонт последовал
    в 1936–1938 и 1950–1953 годах.


    Сегодня перед нами крестово-купольный храм размером 27,3 на 19,6 метра и высотой 23,3 метра, с высоким
    двенадцатигранным барабаном, прорезанным двенадцатью окнами. Стены пёстрые: песчаник залатан базальтом,
    известняком и кирпичом, а резьба густо собирается вокруг дверей и окон. Внутри резной деревянный иконостас
    1781 года закрывает алтарь, и сохранились бледные позднесредневековые фрески. Воротами служит трёхъярусная
    колокольня XVII века.


    Встаньте у западного входа и пересчитайте века в камне: здесь никто и никогда не махнул на этот храм
    рукой.
  tip: >-
    Отведите на собор от 45 минут до часа и объедините его с Урбниси в 7 км по дороге: там ранняя базилика
    и более поздняя купольная церковь, обе связаны с тем же собором 1103 года. Руиси — кафедра Урбнисско-Руисской
    епархии и живой, людный храм: закройте плечи и колени, возьмите платок; по воскресеньям с утра идут
    службы, а рассматривать иконостас лучше в будний день после обеда. Зимой внутри холодно и сыро. В
    селе есть маленький магазин, но нет кафе; поесть можно в Гори.
  route: >-
    Выезжайте из Тбилиси на запад по автомагистрали S1 (E60) мимо Гори — около 96 км быстрой четырёхполосной
    трассы; барабан собора виден прямо к северу от дороги. Сверните на развязке к Руиси и Урбниси и по
    короткой местной дороге (Sh135) проедьте около километра до села. Всего около 99 км и 1 час 20 минут.
    По сельской улице бродит скот, так что не торопитесь. Заправиться можно в Гори или Карели. Бесплатная
    парковка — на открытой площади перед собором; машины эконом-класса хватит в любое время года.
fa:
  name: کلیسای جامع روئیسی
  short: >-
    تاج‌گذاری شاهی خردسال، شورای داوید سازنده، ویرانی به دست تیمور و برخاستنی دوباره: دیوارهای وصله‌دار
    و رنگارنگ روئیسی همه را ثبت کرده‌اند.
  body: >-
    **روئیسی آن‌قدر سوخته، لرزیده و از نو ساخته شده که دیوارهایش را می‌توان مثل دفتر ثبت تاریخ گرجستان
    خواند؛ و بیشتر برگ‌های این دفتر امضا دارند.**


    کهن‌ترین سنگ‌ها، از سدهٔ هشتم یا نهم، پیرامون محراب بر جا مانده‌اند؛ در سده‌های دهم و یازدهم بنا دگرگونی‌هایی
    یافت. در سال ۱۰۵۵ لیپاریتِ کلدکاری، دوک قدرتمند، فرمان داد پسربچه‌ای را که بعدها شاه گئورگی دوم شد،
    اینجا تاج بر سر نهند. اسقفان روئیسی لقب «مروِلی» داشتند و گردآوری مجموعهٔ وقایع‌نامه‌های گرجی در سدهٔ
    یازدهم را به یکی از آنان، لئونتی، نسبت می‌دهند. در سال ۱۱۰۳ داوید سازنده شورای بزرگ کلیسایی خود را
    اینجا و در اوربنیسیِ نزدیک برپا کرد؛ شورایی که اسقفانی را که مقام خود را خریده یا به ارث برده بودند
    برکنار کرد و کلیسا را به تاج‌وتخت پیوند زد.


    در سال ۱۴۰۰ سپاهیان تیمور کلیسا را تقریباً با خاک یکسان کردند. شاه الکساندر یکم (سلطنت ۱۴۱۲–۱۴۴۲)
    آن را از نو ساخت و برای روئیسی و متسختا مالیاتی ویژه وضع کرد؛ کتیبه‌ای بر نمای غربی او را گرامی می‌دارد
    و کتیبه‌ای بر نمای جنوبی نام معمار را آورده است: شالوا. اسقف دیونیسه لارادزه در سدهٔ شانزدهم و ملکه
    مریم کارتلی در دههٔ ۱۶۶۰ آن را بازسازی کردند. در سال ۱۶۹۵ الکساندر چهارم، شاه ایمرتی، که در روئیسی
    اسیر بود، کشته و در همین کلیسا به خاک سپرده شد. زمین‌لرزهٔ گوری در ۱۹۲۰ دوباره آن را درهم شکست؛ تعمیرها
    در سال‌های ۱۹۳۶–۱۹۳۸ و ۱۹۵۰–۱۹۵۳ انجام شد.


    آنچه امروز برپاست کلیسایی با طرح صلیب در مربع است، به ابعاد ۲۷٫۳ در ۱۹٫۶ متر و به بلندی ۲۳٫۳ متر،
    با گریوِ گنبدی بلند و دوازده‌ضلعی که دوازده پنجره آن را شکافته‌اند. دیوارها رنگارنگ‌اند: ماسه‌سنگی
    که با بازالت، سنگ آهک و آجر وصله شده، و کنده‌کاری‌ها پیرامون درها و پنجره‌ها انبوه شده‌اند. در درون،
    دیوار شمایل (آیکونوستاز) چوبیِ کنده‌کاری‌شده‌ای از سال ۱۷۸۱ محراب را از نظر پنهان می‌کند و دیوارنگاره‌های
    کم‌رنگی از اواخر سده‌های میانه بر جا مانده است. برج ناقوسی سه‌طبقه از سدهٔ هفدهم نقش دروازه را دارد.


    کنار در غربی بایستید و سده‌ها را در سنگ بشمارید: اینجا هیچ‌کس هرگز از این بنا دست نکشید.
  tip: >-
    ۴۵ دقیقه تا یک ساعت وقت بگذارید و دیدار را با اوربنیسی، که از راه جاده ۷ کیلومتر فاصله دارد، همراه
    کنید: یک باسیلیکای کهن و یک کلیسای گنبددار متأخرتر، که هر دو به همان شورا گره خورده‌اند. روئیسی مقر
    اسقف‌نشین اوربنیسی-روئیسی و کلیسایی فعال و پررفت‌وآمد است: شانه‌ها و زانوها را بپوشانید، روسری همراه
    بیاورید و انتظار مراسم عبادی در صبح‌های یکشنبه را داشته باشید؛ برای تماشای آیکونوستاز بعدازظهر یک
    روز کاری بهتر است. درون کلیسا در زمستان سرد و نمور است. روستا مغازه‌ای کوچک دارد اما کافه ندارد؛ در
    گوری غذا بخورید.
  route: >-
    از تفلیس آزادراه S1 (E60) را به سوی غرب بگیرید و از گوری بگذرید؛ حدود ۹۶ کیلومتر بزرگراه دوبانده و
    تندرو. گریو گنبد کلیسای جامع درست در شمال جاده پیداست. از خروجی روئیسی و اوربنیسی بیرون بروید و جادهٔ
    محلی کوتاه (Sh135) را حدود یک کیلومتر تا روستا دنبال کنید. روی‌هم حدود ۹۹ کیلومتر و ۱ ساعت و ۲۰ دقیقه.
    در کوچهٔ روستا گاوها پرسه می‌زنند؛ آرام برانید. سوخت در گوری یا کارلی. پارکینگ رایگان در میدان باز
    روبه‌روی کلیسای جامع است؛ خودروی کلاس اکونومی در هر فصلی کافی است.
he:
  name: קתדרלת רואיסי
  short: >-
    הכתירה מלך-ילד, אירחה את מועצת דוד הבונה, נפלה בידי טימור וקמה שוב: הקירות המטולאים והרב-גוניים של
    רואיסי שומרים כל רישום.
  body: >-
    **רואיסי נשרפה, הוכתה ברעידות אדמה ונבנתה מחדש פעמים רבות כל כך, שקירותיה נקראים כמו פנקס של ההיסטוריה
    הגאורגית — ורוב הרישומים בו חתומים.**


    האבנים העתיקות ביותר, מהמאה ה-8 או ה-9, שרדו סביב המזבח; במאות ה-10 וה-11 עוצב המבנה מחדש. ב-1055
    הורה כאן הדוכס רב העוצמה ליפריט מקלדקרי להכתיר את הנער שעתיד היה להיות המלך גיאורגי השני. בישופי רואיסי
    נשאו את התואר "מרוולי", ואחד מהם, לאונטי, נחשב למי שערך את קובץ דברי הימים הגאורגיים במאה ה-11. ב-1103
    כינס כאן דוד הבונה, וגם באורבניסי הסמוכה, את מועצת הכנסייה הגדולה שלו; המועצה הדיחה בישופים שקנו את
    כסאם או ירשו אותו, וקשרה את הכנסייה אל הכתר.


    צבאות טימור כמעט החריבו את הקתדרלה ב-1400. המלך אלכסנדר הראשון (מלך בשנים 1412–1442) בנה אותה מחדש
    והטיל לשם כך מס מיוחד למען רואיסי ומצחתה; כתובת בחזית המערבית מפארת אותו, וכתובת בחזית הדרומית נוקבת
    בשם האדריכל, שלווה. הבישוף דיוניסה לרדזה חידש אותה במאה ה-16, ומלכת קרתלי מריאם בשנות ה-60 של המאה
    ה-17. ב-1695 נרצח אלכסנדר הרביעי, מלך אימרתי, שהוחזק שבוי ברואיסי, ונקבר בכנסייה הזאת. רעידת האדמה
    של גורי ב-1920 שברה אותה שוב; תיקונים נעשו בשנים 1936–1938 ו-1950–1953.


    מה שעומד היום הוא כנסייה בתכנית צלב בתוך ריבוע, 27.3 על 19.6 מטר ובגובה 23.3 מטר, ותוף הכיפה שלה,
    גבוה ובעל שתים-עשרה צלעות, מנוקב בשנים-עשר חלונות. הקירות רב-גוניים — אבן חול מטולאת בבזלת, באבן גיר
    ובלבני חרס — והגילופים מתרכזים בצפיפות סביב הדלתות והחלונות. בפנים מסתיר איקונוסטזיס מעץ מגולף משנת
    1781 את אזור המזבח, ושרדו שרידים דהויים של ציורי קיר מסוף ימי הביניים. מגדל פעמונים בן שלוש קומות
    מהמאה ה-17 משמש כשער.


    עמדו ליד הדלת המערבית וספרו את המאות באבן: איש כאן מעולם לא ויתר על הבניין הזה.
  tip: >-
    הקצו לה 45 דקות עד שעה, ושלבו את הביקור עם אורבניסי, 7 ק"מ בכביש: בזיליקה קדומה וכנסיית כיפה מאוחרת
    יותר, שתיהן קשורות לאותה מועצה. רואיסי היא מושב הבישוף של הדיוקסיה אורבניסי-רואיסי וכנסייה פעילה והומה:
    כסו כתפיים וברכיים, הביאו כיסוי ראש, וצפו לתפילות בבוקר יום ראשון; אחר צהריים של יום חול מתאים יותר
    להתבוננות באיקונוסטזיס. בחורף קר ולח בפנים. בכפר יש חנות קטנה אבל אין בית קפה; אכלו בגורי.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) וחלפו על פני גורי — כ-96 ק"מ של כביש מהיר מפוצל; תוף הקתדרלה
    נראה ממש מצפון לכביש. צאו במחלף לרואיסי ולאורבניסי והמשיכו בכביש המקומי הקצר (Sh135) כקילומטר אל תוך
    הכפר. בסך הכול כ-99 ק"מ ושעה ו-20 דקות. בקר משוטט בסמטת הכפר, אז סעו לאט. דלק בגורי או בקארלי. חניה
    חינם בכיכר הפתוחה שלפני הקתדרלה; רכב מקטגוריית אקונומי מספיק בכל עונות השנה.
ar:
  name: كاتدرائية روئيسي
  short: >-
    توّجت ملكاً صبياً، واستضافت مجمع داود البنّاء، وسقطت أمام تيمور ثم نهضت: جدران روئيسي المرقّعة المتعدّدة
    الألوان تحفظ كل صفحة.
  body: >-
    **احترقت روئيسي وزلزلتها الأرض وأُعيد بناؤها مرات كثيرة حتى صارت جدرانها تُقرأ كسجلّ لتاريخ جورجيا،
    ومعظم صفحاته موقّعة.**


    أقدم الحجارة، من القرن الثامن أو التاسع، باقية حول المذبح؛ وفي القرنين العاشر والحادي عشر أُعيد تشكيل
    البناء. وفي عام 1055 أمر الدوق القوي ليباريت الكلدكاري بتتويج الصبي الذي سيصبح الملك جورجي الثاني
    هنا. وكان أساقفة روئيسي يحملون لقب «مروفيلي»، ويُنسب إلى أحدهم، ليونتي، جمع مدوّنة الأخبار الجورجية
    في القرن الحادي عشر. وفي عام 1103 عقد داود البنّاء مجمعه الكنسي الكبير هنا وفي أوربنيسي المجاورة؛
    فعزل الأساقفة الذين اشتروا كراسيهم أو ورثوها، وربط الكنيسة بالتاج.


    في عام 1400 كادت جيوش تيمور تدمّر الكاتدرائية تماماً. فأعاد بناءها الملك ألكسندر الأول (حكم 1412–1442)،
    وفرض من أجل روئيسي ومتسخيتا ضريبة خاصة؛ ونقش على الواجهة الغربية يمجّده، ونقش على الجنوبية يذكر اسم
    المعماري: شالفا. وجدّدها الأسقف ديونيسي لارادزه في القرن السادس عشر، ومريم ملكة كارتلي في ستينيات
    القرن السابع عشر. وفي عام 1695 قُتل ملك إيميريتي ألكسندر الرابع، وكان أسيراً في روئيسي، ودُفن في هذه
    الكنيسة. ثم حطّمها زلزال غوري عام 1920 من جديد، فتلته أعمال ترميم في 1936–1938 و1950–1953.


    القائم اليوم كنيسة على مخطط الصليب داخل مربّع، أبعادها 27.3 في 19.6 متراً وارتفاعها 23.3 متراً، تعلوها
    رقبة قبة عالية ذات اثني عشر ضلعاً تخترقها اثنتا عشرة نافذة. جدرانها متعدّدة الألوان: حجر رملي رُقِّع
    بالبازلت والحجر الجيري والآجر، والنقوش تتكاثف حول الأبواب والنوافذ. وفي الداخل يحجب الهيكلَ أيقونسطاس
    خشبي منحوت من عام 1781، وبقيت رسوم جدارية باهتة من أواخر العصور الوسطى. ويقوم برج أجراس من ثلاثة طوابق
    من القرن السابع عشر مقام البوابة.


    قف عند الباب الغربي وعُدّ القرون في الحجر: لم يتخلَّ أحد هنا عن هذا البناء قط.
  tip: >-
    امنحها ما بين 45 دقيقة وساعة، واجمعها مع أوربنيسي على بُعد 7 كم بالطريق: بازيليكا مبكرة وكنيسة ذات
    قبة أحدث عهداً، وكلتاهما مرتبطة بالمجمع نفسه. روئيسي مقرّ أبرشية أوربنيسي وروئيسي، وكنيسة عامرة بالمصلّين:
    غطِّ الكتفين والركبتين، واحمل غطاء للرأس، وتوقّع القداديس صباح الأحد؛ أما بعد ظهر يوم عادي فأنسب لتأمّل
    الأيقونسطاس. الداخل بارد ورطب في الشتاء. في القرية متجر صغير لكن لا مقهى؛ تناول الطعام في غوري.
  route: >-
    اسلك الطريق السريع S1 (E60) غرباً من تبليسي متجاوزاً غوري، نحو 96 كم من الطريق السريع المزدوج؛ وتظهر
    رقبة قبة الكاتدرائية شمال الطريق مباشرة. اخرج عند تقاطع روئيسي وأوربنيسي واتبع الطريق المحلي القصير
    (Sh135) نحو كيلومتر حتى القرية. المجموع نحو 99 كم وساعة و20 دقيقة. تتجوّل الماشية في درب القرية فتمهّل.
    الوقود في غوري أو كاريلي. الوقوف مجاني في الساحة المكشوفة أمام الكاتدرائية؛ والسيارة الاقتصادية تكفي
    طوال العام.
