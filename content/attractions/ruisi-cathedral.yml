ka:
  name: რუისის ღვთაების ტაძარი
  short: >-
    დიდი გუმბათოვანი ტაძარი ქარელის მუნიციპალიტეტში, სადაც 1103 წელს ქართული ეკლესიის ისტორიის უმნიშვნელოვანესი
    კრება გაიმართა.
  body: >-
    **რუისი ერთი გადაწყვეტილების გამო არის დასამახსოვრებელი.** 1103 წელს, როცა დავით აღმაშენებელი ჯერ
    კიდევ ახალგაზრდა მეფე იყო და ქვეყანა ნაწილებად იყო დაშლილი, მან სწორედ აქ და მეზობელ ურბნისში მოიწვია
    საეკლესიო კრება. რუის-ურბნისის კრებამ გადააყენა ეპისკოპოსები, რომლებიც თანამდებობებს ფულით ან ნათესაობით
    იღებდნენ, დისციპლინის ახალი წესები დაადგინა და ეკლესია სამეფო ხელისუფლებას დაუქვემდებარა. ეს არ იყო
    მხოლოდ საეკლესიო რეფორმა: ეს იყო ნაბიჯი, რომელმაც დავითს ფეოდალების წინააღმდეგ ბრძოლაში ხელი გაუხსნა.


    დღევანდელი ტაძარი ამ კრებას არ ემთხვევა თარიღით. ბირთვი VIII-IX საუკუნეებისაა, თუმცა XVI-XVII საუკუნეებში
    შენობა თითქმის მთლიანად გადააკეთეს, XIX საუკუნეში კი კვლავ შეაკეთეს. შედეგი მასიური, განიერი გუმბათოვანი
    ეკლესიაა, უფრო მძიმე და ნაკლებად დახვეწილი, ვიდრე ერთაწმინდა ან სამთავისი, სამაგიეროდ შთამბეჭდავად
    დიდი. კედლებში სხვადასხვა საუკუნის ქვის ფენები ცალსახად იკითხება.


    ეზო ფართოა, გალავნით და სამრეკლოთი; შიგნით ინტერიერი ძირითადად გვიანდელია, ძველი მოხატულობის მცირე
    კვალით. ტაძარი მოქმედია და სოფლისთვის ცოცხალი ცენტრია — კვირაობით აქ ხალხი იკრიბება.


    რუისი და ურბნისი ერთმანეთისგან რვა კილომეტრშია და მათი ერთად ნახვა უფრო აზრიანია, ვიდრე ცალ-ცალკე:
    ერთი ადრეული ბაზილიკაა, მეორე გვიანი გუმბათოვანი ეკლესია, და ორივე ერთი და იმავე კრების ისტორიას ატარებს.
  tip: >-
    ორმოცდაათი წუთი საკმარისია. ურბნისთან ერთად დაგეგმეთ — რვა კილომეტრია და ერთი გასვლა ორივეს ფარავს.
    ტაძარი მოქმედია, ჩაცმის წესები მოქმედებს. ეზო ბრტყელია, კიბე მცირეა. ტუალეტი მარტივია, კაფე არ არის;
    სოფელში პატარა მაღაზიაა. თუ დაკეტილია, მღვდლის ან მეკლიტურის მოძებნა სოფელში მარტივია. ზამთარში ტაძრის
    შიგნით ცივა და ნესტიანია, თბილად ჩაიცვით.
  route: >-
    თბილისიდან E60-ით გორის მიმართულებით და შემდეგ ქარელისკენ; რუისის მაჩვენებელი მაგისტრალიდან ჩრდილოეთით
    გაიყვანთ. სულ 99 კმ, დაახლოებით საათი და ოცი წუთი. ავტობანი სწრაფია, ბოლო ოთხი კილომეტრი ვიწრო სოფლის
    გზაა, სადაც პირუტყვიც დადის — ნელა იარეთ. საწვავი გორსა და ქარელში აიღეთ. ტაძრის წინ ღია მოედანია,
    პარკინგი უფასოა. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისია.
en:
  name: Ruisi Cathedral
  short: >-
    A large domed cathedral in Kareli municipality, site of the most consequential church council in Georgian
    history, held in 1103.
  body: >-
    **Ruisi is remembered for one decision.** In 1103, when David the Builder was still a young king and
    the country was pulled apart by its own nobles, he convened a church council here and in neighbouring
    Urbnisi. The Ruisi-Urbnisi council removed bishops who had bought their sees or inherited them through
    family, laid down new rules of clerical discipline, and brought the church firmly under royal authority.
    It was not merely a religious reform: it freed David's hand against the feudal lords.


    The building you see is not the one that hosted the council. Its core is 8th or 9th century, but it
    was rebuilt almost entirely in the 16th and 17th centuries and repaired again in the 19th. The result
    is a massive, broad domed church, heavier and less refined than Ertatsminda or Samtavisi, but impressive
    in sheer scale. Different centuries of stonework are clearly readable in the walls, with courses changing
    colour and size partway up.


    The yard is wide, with an enclosure wall and a bell tower. Inside, the decoration is largely late,
    with only slight traces of older painting. The cathedral is in active use and functions as a real
    centre for the village, busy on Sundays rather than kept as a monument.


    Ruisi and Urbnisi are eight kilometres apart, and seeing them together makes far more sense than seeing
    either alone: one an early basilica, the other a late domed church, both carrying the history of the
    same council.
  tip: >-
    Fifty minutes covers it. Plan it with Urbnisi — eight kilometres away, so one outing takes in both.
    The cathedral is in use and dress rules apply. The yard is flat with few steps. Toilets are basic
    and there is no cafe, though the village has a small shop. If the door is locked, finding the priest
    or keyholder in the village is straightforward. In winter the interior is cold and damp, so dress
    warmly.
  route: >-
    Take the E60 west from Tbilisi towards Gori, then continue towards Kareli; the sign for Ruisi turns
    you north off the main road. Ninety-nine kilometres in total, about an hour and twenty minutes. The
    dual carriageway is fast, but the final four kilometres are a narrow village road shared with livestock,
    so slow down. Fuel is available in Gori and Kareli. There is an open square in front of the cathedral
    and parking is free. An economy car is enough all year round.
ru:
  name: Руисский собор
  short: >-
    Крупный купольный собор в Карельском муниципалитете, место самого значимого церковного собора в истории
    Грузии, созванного в 1103 году.
  body: >-
    **Руиси помнят из-за одного решения.** В 1103 году, когда Давид Строитель был ещё молодым царём, а
    страну растаскивали собственные феодалы, он созвал здесь и в соседнем Урбниси церковный собор. Руис-Урбнисский
    собор сместил епископов, купивших кафедры или получивших их по родству, установил новые правила церковной
    дисциплины и решительно подчинил церковь царской власти. Это была не только религиозная реформа: она
    развязала Давиду руки против знати.


    Здание, которое вы видите, не то, что принимало собор. Его ядро относится к VIII-IX векам, но в XVI-XVII
    веках храм перестроили почти целиком, а в XIX веке чинили снова. Получилась массивная широкая купольная
    церковь, более тяжёлая и менее изысканная, чем Эрцминда или Самтависи, зато внушительная по размеру.
    Кладка разных столетий читается в стенах отчётливо: ряды меняют цвет и размер на середине высоты.


    Двор просторный, с оградой и колокольней. Внутри убранство в основном позднее, со слабыми следами
    старой росписи. Собор действующий и служит настоящим центром села: по воскресеньям здесь людно, он
    живёт, а не хранится как памятник.


    Руиси и Урбниси разделяют восемь километров, и смотреть их вместе гораздо осмысленнее, чем по отдельности:
    один — ранняя базилика, другой — поздний купольный храм, и оба несут историю одного и того же собора.
  tip: >-
    Пятидесяти минут хватит. Планируйте вместе с Урбниси — восемь километров, одна поездка охватывает
    оба. Собор действующий, правила одежды действуют. Двор ровный, ступеней мало. Туалет простой, кафе
    нет, но в селе есть маленький магазин. Если дверь заперта, найти священника или человека с ключом
    в селе несложно. Зимой внутри холодно и сыро, одевайтесь теплее.
  route: >-
    Из Тбилиси на запад по E60 в сторону Гори, далее в направлении Карели; указатель на Руиси уводит с
    магистрали на север. Всего 99 км, примерно час двадцать. Скоростная дорога быстрая, но последние четыре
    километра — узкая сельская дорога, по которой ходит и скот, так что сбавьте темп. Заправиться можно
    в Гори и Карели. Перед собором открытая площадь, парковка бесплатная. Машины эконом-класса достаточно
    круглый год.
fa:
  name: کلیسای جامع روئیسی
  short: کلیسای جامع بزرگ و گنبدداری در شهرستان کارلی، جایگاه مهم‌ترین شورای کلیسایی تاریخ گرجستان در
    سال ۱۱۰۳.
  body: >-
    **روئیسی را به سبب یک تصمیم به یاد می‌آورند.** در سال ۱۱۰۳، هنگامی که داوید سازنده هنوز پادشاهی جوان
    بود و کشور را اشراف خودش از هم می‌دریدند، او در همین‌جا و در اوربنیسی همسایه شورایی کلیسایی فراخواند.
    شورای روئیسی-اوربنیسی اسقفانی را که کرسی خود را خریده یا از راه خویشاوندی گرفته بودند برکنار کرد،
    قواعد تازه‌ای برای انضباط روحانیان نهاد و کلیسا را به‌روشنی زیر اقتدار پادشاه آورد. این تنها اصلاحی
    دینی نبود؛ دست داوید را در برابر خانان فئودال باز کرد.


    بنایی که می‌بینید همان نیست که میزبان آن شورا بود. هستهٔ آن به سدهٔ هشتم یا نهم بازمی‌گردد، اما در
    سده‌های شانزدهم و هفدهم تقریباً یکسره از نو ساخته شد و در سدهٔ نوزدهم دوباره مرمت گردید. حاصل، کلیسایی
    گنبددار، سترگ و پهن است؛ سنگین‌تر و کم‌ظرافت‌تر از ارتاتسمیندا یا سامتاویسی، اما در مقیاس چشمگیر.
    سنگ‌کاری سده‌های گوناگون به‌روشنی در دیوارها خوانده می‌شود و رنگ و اندازهٔ رگه‌ها در میانهٔ ارتفاع
    تغییر می‌کند.


    حیاط گشاده است، با دیوار محوطه و برج ناقوس. در درون، آرایه‌ها بیشتر متأخرند و تنها ردهایی کم‌رنگ از
    نقاشی کهن مانده است. کلیسا فعال است و مرکزی واقعی برای روستا؛ یکشنبه‌ها شلوغ است و زنده، نه نگهداری‌شده
    همچون یک یادمان.


    روئیسی و اوربنیسی هشت کیلومتر از هم فاصله دارند و دیدن آنها با هم بسیار معنادارتر از دیدن هریک به‌تنهایی
    است: یکی بازیلیکایی متقدم و دیگری کلیسایی گنبددار و متأخر، و هر دو حامل تاریخ یک شورای واحد.
  tip: >-
    پنجاه دقیقه بس است. آن را با اوربنیسی برنامه‌ریزی کنید؛ هشت کیلومتر فاصله دارد و یک بیرون‌رفت هر دو
    را می‌پوشاند. کلیسا فعال است و قواعد پوشش برقرار. حیاط هموار است و پله کم دارد. سرویس بهداشتی ساده
    است و کافه نیست، هرچند روستا مغازه‌ای کوچک دارد. اگر در بسته بود، یافتن کشیش یا کلیددار در روستا آسان
    است. زمستان درون بنا سرد و نمناک است، پس گرم بپوشید.
  route: >-
    از تفلیس به غرب روی E60 به سوی گوری بروید و سپس به سمت کارلی ادامه دهید؛ تابلوی روئیسی شما را از جادهٔ
    اصلی به شمال می‌برد. نود و نه کیلومتر روی‌هم، نزدیک یک ساعت و بیست دقیقه. جادهٔ دوبانده تند است، اما
    چهار کیلومتر پایانی جاده‌ای روستایی و باریک است که دام هم از آن می‌گذرد، پس آهسته برانید. سوخت در
    گوری و کارلی موجود است. پیش از کلیسا میدانی باز هست و پارکینگ رایگان است. خودروی اقتصادی در تمام سال
    کافی است.
he:
  name: קתדרלת ראוויסי
  short: קתדרלה מכופפת גדולה במחוז קארלי, מקום ועידת הכנסייה המשמעותית ביותר בתולדות גאורגיה, שנערכה ב-1103.
  body: >-
    **את ראוויסי זוכרים בזכות החלטה אחת.** בשנת 1103, כשדוד הבנאי היה עדיין מלך צעיר והמדינה נקרעה בידי
    אצילים משלה, הוא כינס כאן ובאורבניסי הסמוכה ועידת כנסייה. ועידת ראוויסי-אורבניסי הדיחה בישופים שקנו
    את כסאם או קיבלו אותו בירושה משפחתית, קבעה כללים חדשים למשמעת הכמורה, והכפיפה את הכנסייה בבירור לסמכות
    המלך. זו לא הייתה רק רפורמה דתית: היא שיחררה את ידיו של דוד מול האצולה.


    המבנה שרואים כיום אינו זה שאירח את הוועידה. גרעינו מן המאה ה-8 או ה-9, אך הוא נבנה מחדש כמעט כולו
    במאות ה-16 וה-17 ותוקן שוב במאה ה-19. התוצאה היא כנסייה מכופפת מסיבית ורחבה, כבדה ומעודנת פחות מארתאצמינדה
    או מסמטאוויסי, אך מרשימה בגודלה. עבודות אבן ממאות שונות נקראות היטב בקירות, והנדבכים מחליפים צבע וגודל
    באמצע הגובה.


    החצר רחבה, עם חומת מתחם ומגדל פעמונים. בפנים העיטור מאוחר ברובו, ורק שרידים קלושים של ציור עתיק. הקתדרלה
    פעילה ומשמשת מרכז אמיתי לכפר; בימי ראשון היא הומה, חיה ולא נשמרת כאנדרטה.


    ראוויסי ואורבניסי מרוחקות שמונה קילומטרים זו מזו, וראייתן יחד הגיונית הרבה יותר מראיית כל אחת לחוד:
    האחת בזיליקה מוקדמת והשנייה כנסייה מכופפת מאוחרת, ושתיהן נושאות את סיפור אותה ועידה.
  tip: >-
    חמישים דקות מספיקות. תכננו יחד עם אורבניסי — שמונה קילומטרים משם, ויציאה אחת מכסה את שתיהן. הקתדרלה
    פעילה וכללי לבוש חלים. החצר מישורית ויש בה מעט מדרגות. השירותים בסיסיים ואין בית קפה, אם כי בכפר יש
    חנות קטנה. אם הדלת נעולה, קל למצוא בכפר את הכומר או את מחזיק המפתח. בחורף הפנים קר ולח, לכן התלבשו
    בחום.
  route: >-
    סעו מטביליסי מערבה בכביש E60 לכיוון גורי, והמשיכו לכיוון קארלי; השילוט לראוויסי מוציא אתכם צפונה מן
    הכביש הראשי. 99 ק״מ בסך הכול, כשעה ועשרים. הכביש הדו-מסלולי מהיר, אך ארבעת הקילומטרים האחרונים הם
    דרך כפרית צרה שגם בקר עובר בה, לכן האטו. דלק יש בגורי ובקארלי. לפני הקתדרלה כיכר פתוחה והחניה חינם.
    רכב חסכוני מספיק בכל ימות השנה.
ar:
  name: كاتدرائية روئيسي
  short: كاتدرائية كبيرة ذات قبة في بلدية كاريلي، وموضع أهم مجمع كنسي في تاريخ جورجيا، عُقد سنة 1103.
  body: >-
    **تُذكر روئيسي بسبب قرار واحد.** في عام 1103، وداوود البنّاء ما زال ملكاً شاباً والبلاد يمزقها نبلاؤها،
    عقد هنا وفي أوربنيسي المجاورة مجمعاً كنسياً. أقال مجمع روئيسي-أوربنيسي أساقفة اشتروا كراسيهم أو ورثوها
    بالقرابة، ووضع قواعد جديدة لانضباط رجال الدين، وأخضع الكنيسة بوضوح لسلطة الملك. ولم يكن ذلك إصلاحاً
    دينياً فحسب: بل أطلق يد داوود في مواجهة أمراء الإقطاع.


    والبناء الذي تراه ليس الذي احتضن المجمع. فقلبه من القرن الثامن أو التاسع، لكنه أُعيد بناؤه كاملاً
    تقريباً في القرنين السادس عشر والسابع عشر ورُمّم مرة أخرى في التاسع عشر. والنتيجة كنيسة مقببة ضخمة
    عريضة، أثقل وأقل رهافة من إرتاتسميندا أو سامتافيسي، لكنها مهيبة بحجمها وحده. وتُقرأ في الجدران أعمال
    حجرية من قرون مختلفة، إذ تتغير المداميك لوناً وحجماً في منتصف الارتفاع.


    والفناء رحب، بسور وبرج أجراس. وفي الداخل زخرفة متأخرة في معظمها، مع آثار خفيفة لتصوير أقدم. والكاتدرائية
    عاملة وتشكل مركزاً حقيقياً للقرية؛ تمتلئ أيام الأحد، فهي حيّة لا محفوظة كنصب.


    وتفصل ثمانية كيلومترات بين روئيسي وأوربنيسي، ورؤيتهما معاً أكثر معنى بكثير من رؤية إحداهما وحدها:
    واحدة بازيليكا مبكرة والأخرى كنيسة مقببة متأخرة، وكلتاهما تحمل تاريخ المجمع نفسه.
  tip: >-
    خمسون دقيقة تكفي. خطّط لها مع أوربنيسي؛ فهي على بعد ثمانية كيلومترات، وخرجة واحدة تغطي الاثنتين. الكاتدرائية
    عاملة وقواعد اللباس سارية. والفناء مستوٍ ودرجاته قليلة. دورات المياه بسيطة ولا مقهى، وإن كان في القرية
    متجر صغير. وإن كان الباب مغلقاً فالعثور على الكاهن أو حامل المفتاح في القرية سهل. وفي الشتاء يكون
    الداخل بارداً رطباً، فالبس ثياباً دافئة.
  route: >-
    خذ الطريق E60 غرباً من تبليسي نحو غوري، ثم واصل باتجاه كاريلي؛ ولافتة روئيسي تخرجك شمالاً عن الطريق
    الرئيسي. تسعة وتسعون كيلومتراً إجمالاً، نحو ساعة وعشرين دقيقة. الطريق المزدوج سريع، لكن الكيلومترات
    الأربعة الأخيرة طريق قروي ضيق تمر فيه المواشي أيضاً، فخفّف السرعة. والوقود متوفر في غوري وكاريلي.
    وأمام الكاتدرائية ساحة مفتوحة والوقوف مجاني. وسيارة اقتصادية تكفي طوال السنة.
