ka:
  name: სხვიტორი — აკაკი წერეთლის სახლ-მუზეუმი
  short: >-
    ქვის სასახლე სხვიტორში, საჩხერიდან სამ კილომეტრში, სადაც აკაკი წერეთელი 1840 წელს დაიბადა და 1915
    წელს გარდაიცვალა.
  body: >-
    **ამ სახლში აკაკი წერეთელმა 1840 წელს პირველად გაახილა თვალი და 1915 წელს აქვე დახუჭა უკანასკნელად.**
    სახლი 1834 წელს მამამისმა, თავადმა როსტომ წერეთელმა ააშენა კვერეთის კლდისა და ჭიათურის ქვით; ქართველ
    ოსტატებთან ერთად მას ბერძენი მშენებლებიც აშენებდნენ, რომლებიც მაშინ საჩხერეში მუშაობდნენ. ეს არც ხის
    ოდაა და არც გლეხური ფაცხა: ორსართულიანი ქვის სასახლეა, თლილი ქვის კუთხეებით, ზედა სართულზე კი ხუთთაღიანი
    ლოჯია მდელოსა და ბებერ ხეებს გადაჰყურებს. უკან ნაურცევის მთის ტყიანი კალთა ამოდის.


    ბავშვი აქ არ გაზრდილა. ძველი საგვარეულო ჩვეულებით, ჩვილი აკაკი სოფელ სავანეში, გლეხის ოჯახში გაზარდეს
    — და იმ ბავშვობის უბრალო მეტყველება სამუდამოდ დარჩა მის ლექსში. შემდეგ იყო ქუთაისის კლასიკური გიმნაზია
    და პეტერბურგის უნივერსიტეტის აღმოსავლური ენების ფაკულტეტი, რომელიც 1863 წელს დაამთავრა. ილია ჭავჭავაძესთან
    ერთად ის სათავეში ედგა თაობას, რომელიც ქართული კულტურის აღორძინებისა და თვითგამორკვევისთვის იბრძოდა.
    ასობით ლექსი დაწერა, ერთი მათგანი — „სულიკო“ — ხალხურ სიმღერად იქცა. 1879 წელს კი ჭიათურის მიდამოებში
    მადნის საძებნელად წავიდა და მანგანუმს მიაგნო, რომელმაც შემდეგ ქალაქს სახელი გაუთქვა.


    შიგნით XIX საუკუნის ფრანგული, გერმანული და იტალიური ავეჯია, ოჯახის ბიბლიოთეკა ქართული, ფრანგული და
    რუსული წიგნებით, სულხან-საბა ორბელიანის ლექსიკონი, პოეტისა და მისი თანამედროვეების ხელნაწერები და
    „ქართლის ცხოვრების“ ხელნაწერი ნუსხა. ეზოში ხის ნალიები დგას. აკაკის გარდაცვალების შემდეგ მისი მეუღლე,
    ნატალია ბაზილევსკაია, შვილთან ერთად პარიზში გაემგზავრა, სახლი კი საპატრონოდ აკაკის საქმეთა მმართველს,
    კოტე აბდუშელიშვილს დარჩა. 2018 წელს სახლს ავთენტური იერსახე დაუბრუნეს და აივანი განაახლეს.


    აკაკი თბილისში, მთაწმინდის პანთეონში განისვენებს. მისი გზის ორივე ბოლო კი აქ არის, ამ ქვის კედლებში.
  tip: >-
    საათნახევარი დაუთმეთ: ორმოცი წუთი სახლს, დანარჩენი — ეზოსა და პარკს. შესვლა დაახლოებით 5 ლარი ღირს.
    წარწერები ძირითადად ქართულადაა, ინგლისური ცოტაა, თუმცა თანამშრომლები, თუ სთხოვთ, ოთახებში ხშირად თავად
    გაგატარებენ. მეორე სართულზე კიბით ადიხართ, ლიფტი არ არის. პარკის ბილიკები მიწისაა და წვიმის შემდეგ
    ტალახიანდება. ადგილზე კაფე არ არის — კაფეებს საჩხერეში, სამ კილომეტრში, ბაზართან იპოვით. ვიზიტს მოდინახის
    ციხეც მიაყოლეთ, საჩხერის თავზე: წერეთლების ციხე და მათი საგვარეულო სახლი ერთ დილას კარგად ეტევა.
  route: >-
    ყველაზე სწრაფი გზა ზესტაფონზე არ გადის. თბილისიდან E60-ით (ს1) დასავლეთისკენ გორსა და ქარელს გასცდით,
    აგარასთან, დაახლოებით 115-ე კილომეტრზე, გადაუხვიეთ და შ22-ს გაჰყევით, რომელიც გომზე გავლით ბორცვებს
    გადაივლის და საჩხერემდე მიდის — გზა ასფალტიანია, თუმცა კლაკნილი. საჩხერიდან ჩრდილო-აღმოსავლეთით სხვიტორამდე
    და მუზეუმამდე სულ სამი კილომეტრია. სულ დაახლოებით 175 კმ, შესვენების ჩათვლით სამიოდე საათი. მანქანას
    ჭიშკართან დააყენებთ. საწვავი ქარელსა და საჩხერეში. ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში საკმარისია.
en:
  name: Skhvitori — Akaki Tsereteli House-Museum
  short: >-
    The stone manor at Skhvitori, 3 km from Sachkhere, where the poet Akaki Tsereteli was born in 1840
    and died in 1915.
  body: >-
    **Akaki Tsereteli opened his eyes in this house in 1840 and closed them here in 1915.** His father,
    Prince Rostom Tsereteli, built it in 1834 from stone brought from the Kvereti crag and from Chiatura,
    and Greek masons then working in Sachkhere laboured on it alongside Georgian ones. It is no timber
    farmhouse but a two-storey country manor of rubble stone with dressed-stone corners, and a five-arched
    loggia on the upper floor looks out over a lawn and old trees. Behind it rises the wooded slope of
    Mount Naurtsevi.


    The boy did not grow up here. By an old family custom the infant was sent to a peasant household in
    the village of Savane, and the plain speech of that childhood stayed in his verse for good. Then came
    the Kutaisi Classical Gymnasium and St Petersburg’s Faculty of Oriental Languages, from which he graduated
    in 1863. With Ilia Chavchavadze he led the generation that campaigned for Georgia’s cultural revival
    and self-determination. He wrote hundreds of poems, and one of them, *Suliko*, became a folk song.
    In 1879 he went prospecting in the hills around Chiatura and found the manganese that would make the
    town famous.


    Inside are 19th-century furniture made in France, Germany and Italy, a family library of Georgian,
    French and Russian books, Sulkhan-Saba Orbeliani’s dictionary, manuscripts by the poet and his contemporaries,
    and a hand-copied *Kartlis Tskhovreba*, the Georgian chronicles. Wooden corn cribs stand in the yard.
    After Akaki’s death his wife, Natalia Bazilevskaya, left for Paris with their son, and the house was
    left in the care of his steward, Kote Abdushelishvili. In 2018 it was restored to its original look
    and the balcony renewed.


    He lies in Tbilisi, in the Pantheon on Mtatsminda. Both ends of his road, though, are here, inside
    these stone walls.
  tip: >-
    Allow an hour and a half: forty minutes in the house, the rest in the grounds. Entry is around 5 GEL.
    Labels are mostly in Georgian, with little English, but staff will often guide you through the rooms
    if asked. The upper floor is reached by stairs and there is no lift. The park paths are earth and
    turn muddy after rain. There is no café; Sachkhere, three kilometres away, has cafés by the market.
    Pair the visit with Modinakhe fortress on its ridge above Sachkhere: the Tseretelis’ castle and their
    country house make one morning.
  route: >-
    The quickest way is not through Zestaponi. Take the E60 (S1) west from Tbilisi past Gori and Kareli,
    turn off at Agara, about 115 km out, and follow the Sh22 through Gomi and over the hills to Sachkhere,
    a paved but twisting main road. In Sachkhere take the road north-east for the last three kilometres
    to Skhvitori and the museum. That makes about 175 km in all, roughly three hours with a stop. There
    is parking by the gate. Fuel in Kareli or Sachkhere. An economy car is fine all year.
ru:
  name: Схвитори — Дом-музей Акакия Церетели
  short: Каменная усадьба в Схвитори, в 3 км от Сачхере, где поэт Акакий Церетели родился в 1840 году
    и умер в 1915-м.
  body: >-
    **Акакий Церетели открыл глаза в этом доме в 1840 году и закрыл их здесь же в 1915-м.** Его отец,
    князь Ростом Церетели, построил дом в 1834 году из камня, привезённого со скалы Кверети и из Чиатуры,
    и над ним трудились греческие каменщики, работавшие тогда в Сачхере, вместе с грузинскими. Это не
    деревянный сельский дом, а двухэтажная усадьба из бутового камня с тёсаными угловыми блоками, и пятиарочная
    лоджия на верхнем этаже смотрит на лужайку и старые деревья. За домом поднимается лесистый склон горы
    Наурцеви.


    Рос мальчик не здесь. По старому семейному обычаю младенца отдали в крестьянскую семью в деревне Саване,
    и простая речь того детства навсегда осталась в его стихах. Затем — Кутаисская классическая гимназия
    и факультет восточных языков в Санкт-Петербурге, который он окончил в 1863 году. Вместе с Ильёй Чавчавадзе
    он возглавил поколение, боровшееся за культурное возрождение и самоопределение Грузии. Он написал
    сотни стихотворений, и одно из них, «Сулико», стало народной песней. В 1879 году он занялся геологической
    разведкой в холмах вокруг Чиатуры и нашёл марганец, который принёс городу славу.


    Внутри — мебель XIX века, сделанная во Франции, Германии и Италии, семейная библиотека грузинских,
    французских и русских книг, словарь Сулхана-Сабы Орбелиани, рукописи самого поэта и его современников,
    а также рукописный список «Картлис цховреба» — свода грузинских летописей. Во дворе стоят деревянные
    амбары для кукурузы. После смерти Акакия его жена, Наталья Базилевская, уехала в Париж с сыном, а
    дом остался на попечении управляющего, Коте Абдушелишвили. В 2018 году дому вернули первоначальный
    облик и обновили балкон.


    Он покоится в Тбилиси, в Пантеоне на Мтацминде. Но оба конца его пути — здесь, за этими каменными
    стенами.
  tip: >-
    Отведите полтора часа: сорок минут в доме, остальное — в парке. Вход — около 5 лари. Подписи в основном
    на грузинском, английского мало, но сотрудники часто проводят экскурсию по комнатам, если попросить.
    На верхний этаж ведёт лестница, лифта нет. Дорожки в парке грунтовые и после дождя раскисают. Кафе
    на месте нет; в Сачхере, в трёх километрах, есть кафе у рынка. Совместите визит с крепостью Модинахе
    на гребне над Сачхере: замок Церетели и их родовую усадьбу легко увидеть за одно утро.
  route: >-
    Самый быстрый путь — не через Зестафони. Двигайтесь по трассе E60 (S1) на запад от Тбилиси, минуя
    Гори и Карели, примерно через 115 км сверните у Агары и следуйте по дороге Sh22 через Гоми и холмы
    до Сачхере; это асфальтированная, но извилистая главная дорога. Из Сачхере последние три километра
    — на северо-восток, до Схвитори и музея. Всего получается около 175 км, примерно три часа с остановкой.
    У ворот есть парковка. Заправляйтесь в Карели или Сачхере. Автомобиль эконом-класса подойдёт в любое
    время года.
fa:
  name: سخویتوری — خانه‌موزهٔ آکاکی تسرتلی
  short: >-
    عمارت سنگی در سخویتوری، در ۳ کیلومتری ساچخره، جایی که شاعر آکاکی تسرتلی در سال ۱۸۴۰ زاده شد و در سال
    ۱۹۱۵ درگذشت.
  body: >-
    **آکاکی تسرتلی در سال ۱۸۴۰ در این خانه چشم به جهان گشود و در همین‌جا در سال ۱۹۱۵ چشم بست.** پدرش،
    شاهزاده روستوم تسرتلی، آن را در سال ۱۸۳۴ از سنگی ساخت که از صخره کورِتی و از چیاتورا آورده بود، و
    بنایان یونانی که آن هنگام در ساچخره کار می‌کردند در کنار بنایان گرجی بر آن کوشیدند. این خانه نه خانه‌ای
    روستایی از چوب، بلکه عمارتی ییلاقی و دوطبقه است از سنگ لاشه با گوشه‌های تراش‌خورده، و ایوانی پنج‌طاقه
    در طبقه بالا رو به چمنزار و درختانی کهن‌سال باز می‌شود. در پس آن، دامنه جنگلی کوه ناورتسوی بالا می‌رود.


    پسرک در این‌جا بزرگ نشد. بنا به رسمی کهن خانوادگی، نوزاد را به خانواده‌ای دهقانی در روستای ساوانه
    فرستادند، و زبان ساده آن دوران کودکی برای همیشه در شعرش باقی ماند. سپس نوبت دبیرستان کلاسیک کوتایسی
    و دانشکده زبان‌های شرقی سن‌پترزبورگ رسید، که در سال ۱۸۶۳ از آن فارغ‌التحصیل شد. او همراه با ایلیا
    چاوچاوادزه پیشوای نسلی شد که برای احیای فرهنگی و حق تعیین سرنوشت گرجستان کوشید. صدها شعر سرود، و یکی
    از آن‌ها، «سولیکو»، به آوازی مردمی بدل شد. در سال ۱۸۷۹ به کاوش در تپه‌های اطراف چیاتورا رفت و منگنزی
    یافت که شهر را نامدار کرد.


    درون خانه، مبلمانی از سده نوزدهم ساخته فرانسه، آلمان و ایتالیا، کتاب‌خانه خانوادگی از کتاب‌های گرجی،
    فرانسوی و روسی، فرهنگ‌لغت سولخان-سابا اوربلیانی، دست‌نویس‌های شاعر و هم‌روزگارانش، و رونویسی دست‌نگاشته‌ای
    از «کارتلیس تسخوربا»، وقایع‌نامه‌های گرجی، نگه‌داری می‌شود. انبارهای چوبیِ ذرت (نالیا) در حیاط ایستاده‌اند.
    پس از مرگ آکاکی، همسرش، ناتالیا بازیلوسکایا، همراه فرزندشان به پاریس رفت، و خانه به سرپرستی مباشرش،
    کوته آبدوشلیشویلی، سپرده شد. در سال ۲۰۱۸ خانه به شکل نخستینش بازسازی شد و بالکن نیز نوسازی شد.


    او در تفلیس، در پانتئون کوه متاتسمیندا، آرمیده است. اما هر دو سرِ راه او همین‌جاست، درون این دیوارهای
    سنگی.
  tip: >-
    یک ساعت‌ونیم زمان بگذارید: چهل دقیقه در خانه، باقی در باغ. ورودیه نزدیک ۵ لاری است. برچسب‌ها بیشتر
    گرجی‌اند، با اندکی انگلیسی، اما کارکنان اغلب اگر بخواهید در اتاق‌ها همراهی‌تان می‌کنند. به طبقه بالا
    با پله می‌رسید و آسانسوری نیست. مسیرهای باغ خاکی‌اند و پس از باران گِلی می‌شوند. کافه‌ای در محل نیست؛
    ساچخره، سه کیلومتر آن‌سوتر، کافه‌هایی کنار بازار دارد. بازدید را با دژ مودیناخه بر یال کوه بالای ساچخره
    جفت کنید: قلعه خانواده تسرتلی و عمارت ییلاقی‌شان را می‌توان در یک صبح دید.
  route: >-
    سریع‌ترین راه از میان زستافونی نمی‌گذرد. از تفلیس بر جاده E60 (S1) به سوی غرب حرکت کنید، از گوری و
    کارلی بگذرید، در آگارا، حدود ۱۱۵ کیلومتری، بپیچید و بر جاده Sh22 از میان گومی و تپه‌ها تا ساچخره بروید
    — جاده‌ای اصلی، آسفالته اما پرپیچ. از ساچخره سه کیلومتر پایانی را به سوی شمال‌شرقی تا سخویتوری و موزه
    برانید. در مجموع حدود ۱۷۵ کیلومتر می‌شود، تقریباً سه ساعت با یک توقف. کنار دروازه پارکینگ هست. در
    کارلی یا ساچخره سوخت‌گیری کنید. خودرویی اقتصادی در تمام سال کافی است.
he:
  name: סחוויטורי — בית-מוזיאון אקאקי צרתלי
  short: אחוזת האבן בסחוויטורי, 3 ק"מ מסאצחרה, שבה נולד המשורר אקאקי צרתלי ב-1840 ומת בה ב-1915.
  body: >-
    **אקאקי צרתלי פקח את עיניו בבית הזה ב-1840 ועצם אותן כאן ב-1915.** אביו, הנסיך רוסטום צרתלי, בנה אותו
    ב-1834 מאבן שהובאה מצוק קוורתי ומצ'יאטורה, ובנאים יוונים שעבדו אז בסאצחרה עמלו עליו לצד בנאים גאורגים.
    אין זה בית חווה מעץ אלא אחוזה כפרית בת שתי קומות מאבן גולמית עם פינות אבן מסותתת, וגלריה בת חמש קשתות
    בקומה העליונה משקיפה על מדשאה ועצים עתיקים. מאחוריה מתנשא מדרון מיוער של הר נאורצוי.


    הילד לא גדל כאן. לפי מנהג משפחתי עתיק נשלח התינוק למשפחת איכרים בכפר סאוואנה, והדיבור הפשוט של אותה
    ילדות נותר לתמיד בשירתו. אחר כך באו הגימנסיה הקלאסית של קוטאיסי והפקולטה לשפות המזרח בסנקט פטרבורג,
    שאותה סיים ב-1863. יחד עם איליה צ'בצ'בדזה הוביל את הדור שנלחם למען תחייה תרבותית והגדרה עצמית של גאורגיה.
    כתב מאות שירים, ואחד מהם, 'סוליקו', הפך לשיר עם. ב-1879 יצא לחפש מחצבים בגבעות שסביב צ'יאטורה ומצא
    את המנגן שהפך את העיר למפורסמת.


    בפנים רהיטים מהמאה ה-19 שיוצרו בצרפת, בגרמניה ובאיטליה, ספרייה משפחתית של ספרים גאורגיים, צרפתיים
    ורוסיים, מילונו של סולחאן-סבא אורבליאני, כתבי יד של המשורר ובני דורו, והעתק כתוב ביד של 'קרתליס צחוברה',
    הכרוניקות הגאורגיות. בחצר עומדים אסמי תירס מעץ. לאחר מות אקאקי עזבה אשתו, נטליה בזילבסקאיה, לפריז
    עם בנם, והבית נותר בטיפולו של מנהל ענייניו, קוטה אבדושלישווילי. ב-2018 שוחזר הבית למראהו המקורי והמרפסת
    חודשה.


    הוא קבור בטביליסי, בפנתאון שעל מטצמינדה. אך שני קצות דרכו נמצאים כאן, בין קירות האבן הללו.
  tip: >-
    הקדישו שעה וחצי: ארבעים דקות בבית, השאר בשטח. הכניסה כ-5 לארי. השילוט הוא בעיקר בגאורגית, עם מעט אנגלית,
    אך הצוות מוכן לרוב להדריך אתכם בחדרים אם תבקשו. לקומה העליונה עולים במדרגות ואין מעלית. שבילי הפארק
    עשויים עפר והופכים בוציים אחרי גשם. אין בית קפה במקום; בסאצחרה, שלושה קילומטרים משם, יש בתי קפה לצד
    השוק. שלבו את הביקור עם מבצר מודינאחה על הרכס שמעל סאצחרה: את המצודה של בית צרתלי ואת אחוזתם הכפרית
    אפשר לראות בבוקר אחד.
  route: >-
    הדרך המהירה ביותר אינה עוברת בזסטפוני. נסעו בכביש E60 (S1) מטביליסי מערבה, חלפו על פני גורי וקארלי,
    פנו באגארה, אחרי כ-115 ק"מ, והמשיכו בכביש Sh22 דרך גומי ועל פני הגבעות עד סאצחרה — כביש ראשי סלול
    אך מתפתל. מסאצחרה המשיכו צפון-מזרחה לשלושת הקילומטרים האחרונים עד סחוויטורי והמוזיאון. בסך הכול כ-175
    ק"מ, כשלוש שעות עם עצירה. יש חנייה לצד השער. תדלקו בקארלי או בסאצחרה. רכב אקונומי מתאים בכל עונות
    השנה.
ar:
  name: سخفيتوري — المنزل المتحف لآكاكي تسيريتيلي
  short: المنزل الحجري في سخفيتوري، على 3 كم من ساتشخيري، حيث وُلد الشاعر آكاكي تسيريتيلي عام 1840 وتوفي
    فيه عام 1915.
  body: >-
    **فتح آكاكي تسيريتيلي عينيه في هذا البيت عام 1840، وأغمضهما فيه عام 1915.** بناه والده، الأمير روستوم
    تسيريتيلي، عام 1834 من حجر جُلب من صخرة كفيريتي ومن تشياتورا، وشارك في بنائه بنّاؤون يونانيون كانوا
    يعملون وقتها في ساتشخيري، إلى جانب بنّائين جورجيين. وهو ليس بيت مزرعة خشبيًا، بل منزل ريفي من طابقين
    مبني من حجر خشن بزوايا من حجر مشذّب، وتفتح شرفة ذات خمسة أقواس في الطابق العلوي على مرج وأشجار عتيقة.
    وخلفه ينتصب المنحدر المكسو بالغابات لجبل ناورتسيفي.


    لم يترعرع الصبيّ هنا. فبحسب عادة عائلية قديمة، أُرسل الطفل إلى أسرة فلاحية في قرية سافاني، وبقيت لغة
    الناس البسيطة التي سمعها في طفولته أثرًا دائمًا في شعره. ثم جاء جمنازيوم كوتايسي الكلاسيكي، وكلية
    اللغات الشرقية في سانت بطرسبرغ، التي تخرّج منها عام 1863. وقاد إلى جانب إيليا تشافتشافادزه الجيل الذي
    ناضل من أجل النهضة الثقافية وحق جورجيا في تقرير مصيرها. كتب مئات القصائد، وتحوّلت واحدة منها، «سوليكو»،
    إلى أغنية شعبية. وفي عام 1879 ذهب يستكشف التلال المحيطة بتشياتورا فوجد المنغنيز الذي جعل المدينة مشهورة.


    في الداخل أثاث من القرن التاسع عشر صُنع في فرنسا وألمانيا وإيطاليا، ومكتبة عائلية من كتب جورجية وفرنسية
    وروسية، وقاموس سولخان-سابا أوربلياني، ومخطوطات للشاعر ومعاصريه، ونسخة مكتوبة بخط اليد من «كارتليس
    تسخوفريبا»، الحوليات الجورجية. وتقف في الساحة أهراء خشبية للذرة. وبعد وفاة آكاكي، رحلت زوجته، ناتاليا
    بازيليفسكايا، إلى باريس مع ابنهما، وتُرك البيت في عهدة وكيله، كوتي أبدوشيليشفيلي. وفي عام 2018 أُعيد
    ترميم البيت إلى شكله الأصلي وجُدّدت شرفته.


    وهو مدفون في تبليسي، في البانثيون على متاتسميندا. لكن طرفي مسيرته كلاهما هنا، داخل هذه الجدران الحجرية.
  tip: >-
    خصّص ساعةً ونصفًا: أربعون دقيقة في البيت، والباقي في الحديقة. رسم الدخول نحو 5 لاري. اللافتات بالجورجية
    غالبًا، مع قليل من الإنكليزية، لكن الموظفين كثيرًا ما يرشدونك في الغرف إذا طلبت ذلك. يُصعَد إلى الطابق
    العلوي بالدرج، ولا يوجد مصعد. ممرّات الحديقة ترابية وتصبح موحلة بعد المطر. لا يوجد مقهى في الموقع؛
    في ساتشخيري، على ثلاثة كيلومترات، مقاهٍ قرب السوق. اجمع الزيارة مع قلعة موديناخه على التلّ فوق ساتشخيري،
    إذ يمكن رؤية قلعة أسرة تسيريتيلي ومنزلهم الريفي في صباح واحد.
  route: >-
    أسرع طريق لا يمرّ عبر زيستافوني. اتبع الطريق E60 (S1) غربًا من تبليسي متجاوزًا غوري وكاريلي، وانحرف
    عند أغارا، على مسافة نحو 115 كم، واتبع طريق Sh22 عبر غومي وفوق التلال حتى ساتشخيري — طريق رئيسي معبّد
    لكنه متعرّج. وفي ساتشخيري اتجه نحو الشمال الشرقي لقطع الكيلومترات الثلاثة الأخيرة حتى سخفيتوري والمتحف.
    فيكون المجموع نحو 175 كم، أي نحو ثلاث ساعات مع وقفة. يوجد موقف سيارات قرب البوابة. تزوّد بالوقود في
    كاريلي أو ساتشخيري. تكفي سيارة اقتصادية عادية على مدار السنة.
