ka:
  name: სხვიტორი — აკაკი წერეთლის სახლ-მუზეუმი
  short: პოეტ აკაკი წერეთლის მშობლიური სახლი და პარკი საჩხერესთან, ზემო იმერეთის ბორცვებში.
  body: >-
    **სხვიტორი ის სოფელია, სადაც 1840 წლის 9 ივნისს აკაკი წერეთელი დაიბადა.** მამამისი თავადი როსტომ წერეთელი
    იყო, დედა კი ეკატერინე — იმერეთის მეფის, სოლომონ პირველის შთამომავალი. ოჯახის სახლი და გარშემო გაშენებული
    პარკი დღეს სახლ-მუზეუმია.


    აკაკის ბავშვობა ერთი დეტალით ხსნის მთელ მის შემდგომ ბიოგრაფიას: ძველი იმერული ტრადიციის თანახმად,
    ის ჩვილობიდან გლეხის ოჯახში, სოფელ სავანეში გაზარდეს. ამან მას სოფლის ცხოვრება ისე ასწავლა, როგორც
    არც ერთ თანამედროვე თავადს არ სცოდნია — ეს კი მისი პოეზიის ენაზეც აისახა.


    შემდეგ იყო ქუთაისის კლასიკური გიმნაზია, 1863 წელს კი პეტერბურგის უნივერსიტეტის აღმოსავლური ენების
    ფაკულტეტი. ილია ჭავჭავაძესთან ერთად ის იმ თაობის სათავეში იდგა, რომელმაც XIX საუკუნის მეორე ნახევარში
    ქართული ეროვნული მოძრაობა ჩამოაყალიბა. დაწერა ასობით ლექსი, პოემა, სატირა და მოგონება; ხალხურ სიმღერად
    ქცეული „სულიკოს“ ტექსტი მისია.


    ერთი ნაკლებად ცნობილი ფაქტიც: სწორედ აკაკიმ გამოაქვეყნა 1879 წელს ჭიათურის მანგანუმის სამრეწველო მნიშვნელობა
    — ანუ ორმოცი კილომეტრით დაშორებული სამთო ქალაქის ისტორია აქედან იწყება.


    მუზეუმში ხის იმერული სახლი აივნით, ავეჯი, ხელნაწერები, ფოტოები და პირადი ნივთებია. პარკი დიდი და ჩრდილიანია,
    ხედი კი ხეობაზე იშლება. ექსპოზიცია მოკრძალებულია და ძირითადად ქართულენოვანი — მოდი მაშინ, თუ ქართული
    XIX საუკუნე გაინტერესებს, ან თუ საჩხერეში მაინც მიდიხარ.


    აკაკის ადგილი ქართულ კულტურაში გარედან ძნელი დასანახია. ის ილიასთან ერთად უპირველესად საზოგადო მოღვაწე
    იყო და არა მხოლოდ მწერალი: კითხულობდა ლექციებს, არედაქტორებდა, დადიოდა პროვინციებში და საკუთარ ლექსებს
    ხმამაღლა კითხულობდა. 1915 წელს მისი დაკრძალვა ეროვნულ მანიფესტაციად იქცა. სწორედ ამ ბიოგრაფიის საწყისი
    წერტილია სხვიტორის მოკრძალებული სახლი, სადაც ქართული სკოლები დღემდე ყოველ გაზაფხულზე ჩამოდიან.
  tip: >-
    საათნახევარი: ორმოცი წუთი სახლში, დანარჩენი პარკში. ეტიკეტები ძირითადად ქართულადაა, ინგლისური მცირეა
    — თანამშრომლები ხშირად თავად გიყვებიან, თუ სთხოვე. სახლი ხისაა და მეორე სართულზე ციცაბო კიბით ადიხარ,
    ლიფტი არ არის. პარკში ბილიკები მიწისაა და წვიმის შემდეგ ლაფიანდება. ტუალეტი ტერიტორიაზეა, კაფე კი
    არა — უახლოესი საჩხერეშია, ხუთი კილომეტრი. ზამთარში სახლი ცივია.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ ჩრდილოეთით ჭიათურაზე გავლით საჩხერისკენ და კიდევ ხუთიოდე კილომეტრი
    აღმოსავლეთით, სხვიტორისკენ — სულ დაახლოებით 244 კმ და სამი საათი და ოცდათხუთმეტი წუთი. გზა ბოლომდე
    ასფალტიანია, თუმცა ზესტაფონის შემდეგ ვიწრო და კლაკნილი. მუზეუმის წინ უფასო პარკინგია. საწვავი ზესტაფონში,
    ჭიათურასა და საჩხერეში აიღებ. ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისია.
en:
  name: Skhvitori — Akaki Tsereteli House-Museum
  short: The birthplace and park of the poet Akaki Tsereteli, in the hills of Upper Imereti near Sachkhere.
  body: >-
    **Skhvitori is the village where Akaki Tsereteli was born on 9 June 1840.** His father was Prince
    Rostom Tsereteli; his mother Ekaterine descended from Solomon I, king of Imereti. The family house
    and the park around it are now a house-museum.


    One detail of his childhood explains much of the life that followed. By an old Imeretian custom he
    was sent as an infant to be brought up by a peasant family in the village of Savane. It gave him a
    knowledge of village life that no other nobleman of his generation had, and it shows in the plain
    register of his verse.


    After that came the Kutaisi classical gymnasium and, in 1863, the Faculty of Oriental Languages at
    the University of St Petersburg. With Ilia Chavchavadze he stood at the head of the generation that
    shaped the Georgian national movement in the second half of the 19th century. He wrote hundreds of
    poems, narrative works, satires and memoirs; the words of *Suliko*, long since absorbed into folk
    singing, are his.


    A less familiar fact: it was Tsereteli who in 1879 publicised the industrial value of the manganese
    at Chiatura. The mining town forty kilometres away effectively begins here.


    The museum holds the wooden Imeretian house with its balcony, furniture, manuscripts, photographs
    and personal belongings. The park is large and shaded, with a view down the valley. The display is
    modest and mostly in Georgian — come if the Georgian 19th century interests you, or if you are going
    to Sachkhere anyway.


    Akaki's place in Georgian culture is hard to see from outside. With Ilia Chavchavadze he was a public
    figure first and a writer second: he lectured, edited, travelled the provinces and read his verse
    aloud to whoever gathered. His funeral in 1915 turned into a national demonstration. The modest house
    at Skhvitori is where that career is anchored, and Georgian school groups still come here every spring.
  tip: >-
    An hour and a half: forty minutes in the house, the rest in the park. Labels are mainly Georgian with
    limited English, though staff will often talk you through it if asked. The house is wooden and the
    upper floor is reached by a steep stair with no lift. Park paths are earth and turn muddy after rain.
    There is a toilet on site but no cafe — the nearest is in Sachkhere, five kilometres away. The house
    is cold in winter.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then north through Chiatura to Sachkhere and about five
    kilometres further east to Skhvitori — some 244 km in all, three hours thirty-five. The road is asphalt
    the whole way, though narrow and winding beyond Zestaponi. There is free parking in front of the museum.
    Fuel is available in Zestaponi, Chiatura and Sachkhere. An economy car is enough all year round.
ru:
  name: Схвитори — дом-музей Акакия Церетели
  short: Родной дом и парк поэта Акакия Церетели в холмах Верхней Имеретии, близ Сачхере.
  body: >-
    **Схвитори — село, где 9 июня 1840 года родился Акакий Церетели.** Отцом его был князь Ростом Церетели,
    мать Екатерине происходила от Соломона I, царя Имеретии. Семейный дом и разбитый вокруг парк сегодня
    стали домом-музеем.


    Одна деталь детства объясняет многое в дальнейшей жизни. По старому имеретинскому обычаю младенца
    отдали на воспитание в крестьянскую семью в село Саване. Это дало ему знание деревенской жизни, какого
    не имел ни один дворянин его поколения, и это слышно в простом строе его стихов.


    Дальше были Кутаисская классическая гимназия и, в 1863 году, факультет восточных языков Петербургского
    университета. Вместе с Ильёй Чавчавадзе он возглавил поколение, сформировавшее грузинское национальное
    движение второй половины XIX века. Он написал сотни стихотворений, поэм, сатир и воспоминаний; слова
    «Сулико», давно ушедшие в народное пение, принадлежат ему.


    Факт менее известный: именно Церетели в 1879 году обнародовал промышленное значение марганца в Чиатуре.
    Шахтёрский город в сорока километрах отсюда, по сути, начинается здесь.


    В музее — деревянный имеретинский дом с балконом, мебель, рукописи, фотографии и личные вещи. Парк
    большой и тенистый, с видом вниз по долине. Экспозиция скромная и почти целиком на грузинском: ехать
    стоит, если вам интересен грузинский XIX век или если вы всё равно направляетесь в Сачхере.


    Место Акакия в грузинской культуре трудно оценить со стороны. Вместе с Ильёй Чавчавадзе он был прежде
    всего общественным деятелем и только затем писателем: читал лекции, редактировал, ездил по провинциям
    и читал свои стихи вслух всем, кто собирался. Его похороны в 1915 году превратились в национальную
    манифестацию. Скромный дом в Схвитори — точка отсчёта этой биографии, и грузинские школьные группы
    приезжают сюда каждую весну.
  tip: >-
    Полтора часа: сорок минут в доме, остальное в парке. Подписи в основном грузинские, английских мало,
    но сотрудники охотно рассказывают, если попросить. Дом деревянный, на второй этаж ведёт крутая лестница,
    лифта нет. Дорожки в парке грунтовые и после дождя развозит. Туалет на территории есть, кафе нет —
    ближайшее в Сачхере, в пяти километрах. Зимой в доме холодно.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем на север через Чиатуру в Сачхере и ещё около пяти километров
    на восток к Схвитори — всего порядка 244 км, три часа тридцать пять минут. Дорога асфальтированная
    на всём протяжении, но за Зестафони узкая и извилистая. Перед музеем бесплатная парковка. Заправиться
    можно в Зестафони, Чиатуре и Сачхере. Машины эконом-класса достаточно круглый год.
fa:
  name: سخویتوری — خانه‌موزهٔ آکاکی تسرِتِلی
  short: زادگاه و باغ شاعر آکاکی تسرِتِلی، در تپه‌های ایمرتی بالا نزدیک ساچخره.
  body: >-
    **سخویتوری روستایی است که آکاکی تسرِتِلی در نهم ژوئن ۱۸۴۰ در آن زاده شد.** پدرش شاهزاده روستوم تسرِتِلی
    بود و مادرش اکاترینه از تبار سولومون یکم، پادشاه ایمرتی. خانهٔ خانوادگی و باغ پیرامونش امروز خانه‌موزه
    است.


    یک نکته از کودکی او بسیاری از زندگی بعدی‌اش را توضیح می‌دهد. بر پایهٔ رسمی کهن در ایمرتی، او را در
    نوزادی برای پرورش به خانواده‌ای دهقانی در روستای ساوانه سپردند. همین به او شناختی از زندگی روستایی
    داد که هیچ اشراف‌زادهٔ هم‌نسلش نداشت، و در سادگی زبان شعرش پیداست.


    پس از آن دبیرستان کلاسیک کوتایسی بود و در ۱۸۶۳ دانشکدهٔ زبان‌های شرقی دانشگاه سن‌پترزبورگ. او همراه
    ایلیا چاوچاوادزه در رأس نسلی ایستاد که جنبش ملی گرجستان را در نیمهٔ دوم سدهٔ نوزدهم شکل داد. صدها
    شعر و منظومه و هجو و خاطره نوشت؛ متن «سولیکو» که دیرزمانی است به آواز مردمی بدل شده از اوست.


    نکته‌ای کمتر شناخته: همین تسرِتِلی بود که در ۱۸۷۹ ارزش صنعتی منگنز چیاتورا را اعلام کرد. شهر معدنی
    چهل کیلومتر آن‌سوتر عملاً از اینجا آغاز می‌شود.


    موزه خانهٔ چوبی ایمرتی با بالکنش را در بر دارد، همراه اثاث، دست‌نوشته‌ها، عکس‌ها و وسایل شخصی. باغ
    بزرگ و سایه‌دار است و منظره‌ای رو به دره دارد. نمایش فروتنانه و بیشتر به گرجی است؛ اگر سدهٔ نوزدهم
    گرجستان برایتان جالب است یا به هر حال به ساچخره می‌روید بیایید.


    جایگاه آکاکی در فرهنگ گرجستان از بیرون به‌سختی دیده می‌شود. او همراه ایلیا چاوچاوادزه پیش از آنکه
    نویسنده باشد چهره‌ای عمومی بود: سخنرانی می‌کرد، سردبیری می‌کرد، در ولایات سفر می‌کرد و شعرش را با
    صدای بلند برای هر جمعی می‌خواند. تشییع او در ۱۹۱۵ به تظاهراتی ملی بدل شد. خانهٔ فروتن سخویتوری نقطهٔ
    آغاز همین زندگی است و گروه‌های مدرسه‌ای گرجی هنوز هر بهار به اینجا می‌آیند.
  tip: >-
    یک ساعت و نیم: چهل دقیقه در خانه و باقی در باغ. برچسب‌ها عمدتاً گرجی‌اند و انگلیسی کم است، هرچند کارکنان
    اگر بخواهید اغلب توضیح می‌دهند. خانه چوبی است و طبقهٔ بالا با پله‌ای تند و بدون آسانسور است. مسیرهای
    باغ خاکی‌اند و پس از باران گِلی می‌شوند. سرویس بهداشتی در محوطه هست اما کافه نه؛ نزدیک‌ترین در ساچخره،
    پنج کیلومتر آن‌سوتر. زمستان خانه سرد است.
  route: >-
    از تفلیس با E60 تا زستافونی، سپس شمال از راه چیاتورا به ساچخره و حدود پنج کیلومتر دیگر به شرق تا سخویتوری
    — روی‌هم نزدیک ۲۴۴ کیلومتر و سه ساعت و سی‌وپنج دقیقه. جاده تا انتها آسفالت است، هرچند پس از زستافونی
    باریک و پرپیچ می‌شود. جلوی موزه پارکینگ رایگان هست. سوخت در زستافونی و چیاتورا و ساچخره موجود است.
    خودروی اقتصادی در همهٔ فصل‌ها کافی است.
he:
  name: סחוויטורי — בית־המוזיאון של אקאקי צרתלי
  short: בית הולדתו והפארק של המשורר אקאקי צרתלי, בגבעות אימרתי העילית ליד סחחרה.
  body: >-
    **סחוויטורי הוא הכפר שבו נולד אקאקי צרתלי ב-9 ביוני 1840.** אביו היה הנסיך רוסטום צרתלי, ואמו אקטרינה
    הייתה מצאצאי סולומון הראשון, מלך אימרתי. בית המשפחה והפארק סביבו הם היום בית־מוזיאון.


    פרט אחד מילדותו מסביר הרבה מן החיים שבאו אחריה. לפי מנהג אימרתי עתיק נשלח כתינוק לגידול אצל משפחת
    איכרים בכפר סאוואנה. זה העניק לו היכרות עם חיי הכפר שלא הייתה לאף אציל בן דורו, וזה נשמע במשלב הפשוט
    של שירתו.


    אחר כך היו הגימנסיה הקלאסית בקוטאיסי, וב-1863 הפקולטה לשפות המזרח באוניברסיטת סנקט פטרבורג. יחד עם
    איליה צ'אבצ'אוואדזה עמד בראש הדור שעיצב את התנועה הלאומית הגאורגית במחצית השנייה של המאה ה-19. הוא
    כתב מאות שירים, פואמות, סאטירות וזיכרונות; מילות "סוליקו", שנטמעו מזמן בשירת עם, הן שלו.


    עובדה פחות מוכרת: צרתלי הוא שפרסם ב-1879 את ערכו התעשייתי של המנגן בצ'יאטורה. עיירת המכרות במרחק ארבעים
    ק״מ מתחילה למעשה כאן.


    במוזיאון נמצאים בית העץ האימרתי על מרפסתו, רהיטים, כתבי יד, תצלומים וחפצים אישיים. הפארק גדול ומוצל
    ונשקף ממנו העמק. התצוגה צנועה וברובה בגאורגית — כדאי לבוא אם המאה ה-19 הגאורגית מעניינת אתכם, או אם
    ממילא אתם נוסעים לסחחרה.


    מקומו של אקאקי בתרבות הגאורגית קשה להבחנה מבחוץ. יחד עם איליה צ'אבצ'אוואדזה היה קודם כול איש ציבור
    ורק אחר כך סופר: הרצה, ערך, נסע במחוזות והקריא את שיריו בקול לכל מי שהתאסף. הלווייתו ב-1915 הפכה להפגנה
    לאומית. הבית הצנוע בסחוויטורי הוא נקודת המוצא של הקריירה הזאת, וקבוצות בית ספר גאורגיות עדיין מגיעות
    לכאן בכל אביב.
  tip: >-
    שעה וחצי: ארבעים דקות בבית והשאר בפארק. השילוט בעיקר בגאורגית והאנגלית מועטה, אך אנשי הצוות מסבירים
    לרוב אם מבקשים. הבית עשוי עץ ואל הקומה העליונה עולים במדרגות תלולות בלי מעלית. שבילי הפארק עפריים
    ונעשים בוציים אחרי גשם. יש שירותים בשטח אך אין בית קפה — הקרוב בסחחרה, חמישה ק״מ משם. בחורף קר בבית.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז צפונה דרך צ'יאטורה לסחחרה ועוד כחמישה ק״מ מזרחה לסחוויטורי — כ-244
    ק״מ בסך הכול, שלוש שעות ושלושים וחמש דקות. הכביש סלול לכל אורכו, אך צר ומתפתל אחרי זסטפוני. לפני המוזיאון
    יש חניה חינם. דלק יש בזסטפוני, בצ'יאטורה ובסחחרה. רכב חסכוני מספיק כל השנה.
ar:
  name: سخفيتوري — بيت متحف أكاكي تسيريتيلي
  short: مسقط رأس الشاعر أكاكي تسيريتيلي وحديقته، في تلال إيميريتي العليا قرب ساتشخيره.
  body: >-
    **سخفيتوري هي القرية التي وُلد فيها أكاكي تسيريتيلي في التاسع من يونيو 1840.** كان أبوه الأمير روستوم
    تسيريتيلي، وأمه إيكاترينه من نسل سولومون الأول ملك إيميريتي. وبيت الأسرة والحديقة المحيطة به صارا
    اليوم بيتاً متحفاً.


    تفصيل واحد من طفولته يفسّر كثيراً مما تلاها. فبحسب عادة إيميريتية قديمة أُرسل رضيعاً ليُربّى في أسرة
    فلاحية بقرية سافانه. أكسبه ذلك معرفة بحياة القرية لم تكن لأي نبيل من جيله، وهي مسموعة في بساطة لغته
    الشعرية.


    ثم كانت ثانوية كوتايسي الكلاسيكية، وفي 1863 كلية اللغات الشرقية في جامعة سانت بطرسبرغ. ووقف مع إيليا
    تشافتشافادزه على رأس الجيل الذي صاغ الحركة القومية الجورجية في النصف الثاني من القرن التاسع عشر. كتب
    مئات القصائد والمنظومات والهجائيات والمذكرات؛ وكلمات «سوليكو» التي دخلت الغناء الشعبي منذ زمن بعيد
    له.


    وثمة واقعة أقل شهرة: تسيريتيلي هو من أعلن عام 1879 القيمة الصناعية لمنغنيز تشياتورا. فمدينة المناجم
    على بعد أربعين كيلومتراً تبدأ من هنا عملياً.


    يضم المتحف البيت الخشبي الإيميريتي بشرفته، والأثاث والمخطوطات والصور والمقتنيات الشخصية. والحديقة
    واسعة ظليلة تطل على الوادي. والعرض متواضع وبالجورجية في معظمه — تعال إن كان القرن التاسع عشر الجورجي
    يعنيك، أو إن كنت ذاهباً إلى ساتشخيره على أي حال.


    مكانة أكاكي في الثقافة الجورجية يصعب إدراكها من الخارج. كان مع إيليا تشافتشافادزه شخصية عامة أولاً
    وكاتباً ثانياً: يحاضر ويحرّر ويجوب الأقاليم ويقرأ شعره بصوت عالٍ لكل من يجتمع. وتحوّل تشييعه عام 1915
    إلى مظاهرة وطنية. والبيت المتواضع في سخفيتوري هو نقطة انطلاق تلك السيرة، وما زالت المجموعات المدرسية
    الجورجية تأتي إليه كل ربيع.
  tip: >-
    ساعة ونصف: أربعون دقيقة في البيت والباقي في الحديقة. البطاقات بالجورجية أساساً والإنجليزية قليلة،
    غير أن الموظفين يشرحون غالباً إن طلبت. البيت خشبي ويُصعد إلى طابقه العلوي بدرج حاد بلا مصعد. وممرات
    الحديقة ترابية تصير موحلة بعد المطر. توجد دورة مياه في الموقع لكن لا مقهى؛ وأقربه في ساتشخيره على
    بعد خمسة كيلومترات. والبيت بارد شتاءً.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، ثم شمالاً عبر تشياتورا إلى ساتشخيره ونحو خمسة كيلومترات أخرى
    شرقاً إلى سخفيتوري — قرابة 244 كم إجمالاً وثلاث ساعات وخمس وثلاثين دقيقة. الطريق معبّد طوال المسافة،
    وإن كان ضيقاً ملتوياً بعد زستافوني. وأمام المتحف موقف مجاني. والوقود متوفر في زستافوني وتشياتورا وساتشخيره.
    وتكفي سيارة اقتصادية طوال العام.
