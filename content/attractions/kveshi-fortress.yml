ka:
  name: ქვეშის ციხე
  short: >-
    ციხე მაღალ კლდეზე, მაშავერას პირას, ბოლნისთან: შიგნით კლდეში გაჭრილი გვირაბით შედიოდნენ, ფლობდნენ
    თორელები, ბარათაშვილები და დაუდ-ხანი.
  body: >-
    **ქვეშის ციხეში მხოლოდ კლდის გავლით შეიძლებოდა მოხვედრა: მისი ერთადერთი შესასვლელი დღესაც კლდეში გაჭრილი
    გვირაბია.**


    ციხე მდინარე მაშავერას მარცხენა ნაპირზე, ველიდან ამოზიდულ, თითქმის ყოველი მხრიდან მიუვალ მაღალ კლდეზე
    დგას, სოფელ ქვეშის ჩრდილო-დასავლეთით, ბოლნისიდან შვიდ კილომეტრში. აქედან აკონტროლებდნენ გზებს, რომლებიც
    სამშვილდიდან ტაშირისა და ჯავახეთისკენ მიდიოდა. ისტორიკოსების აზრით, სწორედ ეს იყო VII საუკუნის „სომხურ
    გეოგრაფიაში“ მოხსენიებული ქვეშის ხევის ცენტრი, რომელმაც ეს როლი IX საუკუნეში დაკარგა, როცა დმანისი
    ქალაქად იქცა.


    ციხის წერილობითი ისტორია ქართული თავადობის ნუსხას ჰგავს. XII საუკუნის ბოლოს, განძაზე ლაშქრობის შემდეგ,
    თამარ მეფემ ქვეში მსახურთუხუცეს ვარდან დადიანს უბოძა, რომელმაც აქ რეზიდენცია გამართა; 1191 წელს, როცა
    დადიანი მეფის წინააღმდეგ აჯანყებას ჩაუდგა სათავეში, თამარმა ციხე ჩამოართვა და ერთგულ თორელებს გადასცა.
    1468 წელს ჯავახიშვილებმა ციხე ბაგრატ VI-ისგან გამოისყიდეს; სავაჭრო გზებზე მდგარი ქვეში საბაჟოდაც მსახურობდა.
    1486 წელს, იაყუბ ყაენის ლაშქრობისას, მის დაცვას ბარათაშვილები ედგნენ სათავეში. 1569–1578 წლებში, როცა
    სვიმონ I სპარსეთის ტყვეობაში იყო, აქ იჯდა მისი გამაჰმადიანებული ნახევარძმა დაუდ-ხანი, რომელმაც თბილისში
    ფეხი ვერ მოიკიდა. 1812 წელს ციხეში რუსული ჯარი იდგა.


    გალავნის შიგნით შემორჩა ციტადელში ჩაშენებული კოშკი, კლდეში ნაკვეთი პატარა წყალსაცავები და ეზოში, შემაღლებაზე,
    პატარა დარბაზული ეკლესია, თავისი ზომისთვის საოცრად მაღალი. შიგნით, კარის თავზე, ჩასმულია VI–VII საუკუნეების
    სტელები ბოლნური ჯვრებითა და მცენარეული რელიეფებით — გაცილებით ძველი, ვიდრე თავად ეკლესია, რომელიც
    დღევანდელი სახით XVIII საუკუნისაა.


    შესასვლელი გვირაბის თავზე, არქიტრავზე, ოდესღაც ქართული წარწერა იკითხებოდა. ის წაიშალა; დანარჩენი კლდემ
    შეინახა.
  tip: >-
    საათნახევარი საკმარისია. აქ არც საფასურია, არც დარაჯი, არც ღობე და არც საინფორმაციო დაფა. ბილიკი კლდეზე
    მოკლეა, მაგრამ ციცაბო და ქვიანი, წვიმის შემდეგ კი სრიალა — ჩაიცვით დახურული ფეხსაცმელი კარგი ძირით.
    კლდის კიდეები ციცაბოდ წყდება: ბავშვებს ხელი არ გაუშვათ და კიდეს ნუ მიუახლოვდებით. გალავნის შიგნით
    ბალახში ფხვიერი ქვები და ორმოებია. ჩრდილი არსად არის, ამიტომ ზაფხულის შუადღეს მოერიდეთ და წყალი თან
    იქონიეთ. საპირფარეშო, კაფე და ბანკომატი ბოლნისშია. საუკეთესო დროა გაზაფხული, როცა ფერდობები მწვანდება,
    და ოქტომბერი.
  route: >-
    მთელი გზა S6-ზე გადის. თბილისიდან ფონიჭალის გავლით სამხრეთით მარნეულამდე იარეთ, იქიდან დასავლეთით
    ბოლნისამდე, შემდეგ კი კაზრეთის მიმართულებით კიდევ დაახლოებით შვიდი კილომეტრი ქვეშამდე. ციხე სოფლის
    ჩრდილო-დასავლეთით, კლდეზე დგას. სულ დაახლოებით 72 კილომეტრი და საათი და ოცი წუთი: ყველგან კარგი ასფალტია,
    გარდა ბოლო მოკლე მონაკვეთისა — ვიწრო, ნაწილობრივ ხრეშიანი სოფლის გზისა, რომელსაც მშრალ ამინდში ეკონომკლასის
    მანქანაც გაივლის. საწვავი მარნეულში ან ბოლნისში ჩაასხით. მანქანა სოფელში დატოვეთ და ფეხით ახვედით.
    ბოლნისის სიონი, წუღრუღაშენი და სამშვილდე ახლოსაა და ერთ სავსე დღეში ეტევა.
en:
  name: Kveshi Fortress
  short: >-
    A crag-top fortress above the Mashavera near Bolnisi, entered through a tunnel in the rock and held
    by the Toreli, the Baratashvili and Daud Khan.
  body: >-
    **At Kveshi the only way in was through the rock itself: a tunnel cut into the crag is still the fortress's
    one entrance.**


    The fortress crowns a high rock on the left bank of the Mashavera, north-west of the village of Kveshi
    and seven kilometres from Bolnisi. From here it watched the roads running from Samshvilde towards
    Tashiri and Javakheti. Historians take it to be the centre of the Kveshi gorge named in a 7th-century
    Armenian geography, a role it lost in the 9th century, when Dmanisi grew into a town.


    Its history reads as a roll call of the Georgian nobility. Late in the 12th century, after a campaign
    against Ganja, Queen Tamar gave Kveshi to her chief steward, Vardan Dadiani, who made it his residence;
    when he led the revolt of 1191 against her, she took it back and handed it to the loyal Toreli. In
    1468 the Javakhishvili bought it from King Bagrat VI, and on its trade roads it also served as a customs
    post. In 1486 the Baratashvili led its defence against the Aq Qoyunlu army of Yaqub. From 1569 to
    1578, while King Simon I sat in a Persian prison, his Muslim half-brother Daud Khan ruled from here,
    unable to hold Tbilisi. Russian troops were quartered in the fortress in 1812.


    Inside the curtain wall stand a keep in the citadel, small cisterns cut into the rock and, on a rise
    in the courtyard, a little hall church, strikingly tall for its size. Set above its door inside are
    6th–7th-century stelae carved with Bolnisi crosses and plants, stones far older than the church, which
    in its present form dates from the 18th century.


    A Georgian inscription once ran across the lintel of the entrance tunnel. It has worn away; the rock
    has kept everything else.
  tip: >-
    Allow an hour and a half. There is no fee, no guard, no fence and no information board. The path up
    the crag is short but steep and stony, and slippery when wet, so wear closed shoes with a good grip.
    The rock falls away sheer on almost every side: hold children's hands and stay back from the edges.
    Loose stones and holes hide in the grass inside the walls. There is no shade at all, so avoid summer
    middays and carry water. Toilets, cafés and cash machines are in Bolnisi. Spring, when the slopes
    turn green, and October are the kindest months.
  route: >-
    The whole way is the S6. Leave Tbilisi south past Ponichala to Marneuli, follow the road west to Bolnisi
    and carry on towards Kazreti for about seven kilometres to Kveshi. The fortress stands on its crag
    just north-west of the village. It is about 72 km and an hour and twenty minutes, all good asphalt
    except the last short stretch of narrow, partly gravel village road, which an economy car handles
    in dry weather. Refuel in Marneuli or Bolnisi. Leave the car in the village and walk up. Bolnisi Sioni,
    Tsughrughasheni and Samshvilde are all close enough to fill a day.
ru:
  name: Крепость Квеши
  short: >-
    Крепость на скале над Машаверой близ Болниси: войти в неё можно только через тоннель в камне, а владели
    ею Торели, Бараташвили и Дауд-хан.
  body: >-
    **В Квеши входили сквозь саму скалу: вырубленный в утёсе тоннель до сих пор остаётся единственным
    входом в крепость.**


    Крепость венчает высокую скалу на левом берегу Машаверы, к северо-западу от села Квеши, в семи километрах
    от Болниси. Отсюда она следила за дорогами, что вели от Самшвилде к Таширу и Джавахети. Историки считают
    её центром Квешского ущелья, упомянутого в армянской «Географии» VII века; эту роль она утратила в
    IX веке, когда городом стал Дманиси.


    Её история читается как перекличка грузинской знати. В конце XII века, после похода на Гянджу, царица
    Тамар пожаловала Квеши своему мсахуртухуцеси — главе придворной службы — Вардану Дадиани, и тот сделал
    её своей резиденцией; когда же он возглавил мятеж 1191 года против царицы, она отобрала крепость и
    отдала её верным Торели. В 1468 году Джавахишвили купили Квеши у царя Баграта VI; стоя на торговых
    путях, крепость служила и таможенной заставой. В 1486 году оборону против войска Ак-Коюнлу под началом
    Якуба возглавили Бараташвили. С 1569 по 1578 год, пока царь Симон I томился в персидском плену, отсюда
    правил его единокровный брат-мусульманин Дауд-хан, не сумевший удержать Тбилиси. В 1812 году в крепости
    стояли русские войска.


    За крепостной стеной — донжон в цитадели, небольшие цистерны, вырубленные в скале, и на возвышении
    посреди двора маленькая зальная церковь, поразительно высокая для своих размеров. Внутри над её дверью
    вмурованы стелы VI–VII веков с резными болнисскими крестами и растительным узором — камни куда древнее
    самой церкви, которая в нынешнем виде относится к XVIII веку.


    Когда-то над входом в тоннель тянулась грузинская надпись. Она стёрлась; всё остальное скала сохранила.
  tip: >-
    Заложите полтора часа. Ни платы за вход, ни сторожа, ни ограды, ни информационного щита. Тропа на
    скалу короткая, но крутая и каменистая, а в сырость скользкая, так что нужна закрытая обувь с хорошим
    протектором. Почти со всех сторон скала обрывается отвесно: держите детей за руку и не подходите к
    краю. В траве внутри стен прячутся шаткие камни и ямы. Тени нет совсем — избегайте летнего полудня
    и берите воду. Туалеты, кафе и банкоматы — в Болниси. Самые приветливые месяцы — весна, когда склоны
    зеленеют, и октябрь.
  route: >-
    Весь путь — по S6. Из Тбилиси на юг мимо Поничалы до Марнеули, дальше на запад до Болниси и ещё около
    семи километров в сторону Казрети, до Квеши. Крепость стоит на своей скале сразу к северо-западу от
    села. Выходит около 72 км и час двадцать минут, всё по хорошему асфальту, кроме короткого последнего
    отрезка узкой, местами гравийной сельской дороги — в сухую погоду с ним справится машина эконом-класса.
    Заправляйтесь в Марнеули или Болниси. Машину оставьте в селе и поднимайтесь пешком. Болнисский Сион,
    Цугругашени и Самшвилде совсем рядом — хватит на целый день.
fa:
  name: قلعهٔ کوِشی
  short: >-
    قلعه‌ای بر ستیغ صخره‌ای بالای رود ماشاورا نزدیک بولنیسی، که تنها از تونلی در دل سنگ به آن راه است
    و تورلی‌ها، باراتاشویلی‌ها و داوودخان در آن فرمان راندند.
  body: >-
    **در کوِشی تنها راه ورود از دل خودِ صخره می‌گذشت: تونلی که در دل تخته‌سنگ کنده‌اند هنوز یگانه راه
    ورود به قلعه است.**


    قلعه بر تارک صخره‌ای بلند در کرانهٔ چپ رود ماشاورا نشسته است، در شمال غربی روستای کوِشی و هفت کیلومتری
    بولنیسی. از اینجا راه‌هایی را می‌پایید که از سامشویلده به سوی تاشیر و جاواختی می‌رفتند. تاریخ‌نگاران
    آن را مرکز درهٔ کوِشی می‌دانند که در جغرافیایی ارمنی از سدهٔ هفتم نامش آمده است؛ نقشی که در سدهٔ نهم،
    با شهر شدن دمانیسی، از دست داد.


    تاریخش به دفتر حضور و غیابِ اشراف گرجی می‌ماند. در اواخر سدهٔ دوازدهم، پس از لشکرکشی به گنجه، ملکه
    تامار کوِشی را به پیشکار بزرگ دربارش، واردان دادیانی، بخشید و او آن را اقامتگاه خود کرد؛ اما چون در
    شورش ۱۱۹۱ بر ضد ملکه سر برداشت، تامار قلعه را پس گرفت و به تورلی‌های وفادار سپرد. در سال ۱۴۶۸ خاندان
    جاواخیشویلی آن را از باگرات ششم خریدند، و قلعه که بر سر راه‌های بازرگانی بود، گمرک‌خانه نیز شد. در
    ۱۴۸۶ دفاع از آن در برابر سپاه آق‌قویونلوی یعقوب بر عهدهٔ باراتاشویلی‌ها بود. از ۱۵۶۹ تا ۱۵۷۸، هنگامی
    که سیمون یکم در زندانی در ایران به سر می‌برد، برادر ناتنیِ مسلمانش، داوودخان، که نتوانسته بود تفلیس
    را نگه دارد، از همین‌جا فرمان می‌راند. در ۱۸۱۲ سربازان روس در قلعه جای گرفتند.


    درون باروی بیرونی، برجی اصلی در ارگ، آب‌انبارهای کوچکِ کنده در سنگ و، بر بلندی‌ای در میان حیاط، کلیسای
    تالاری کوچکی ایستاده که نسبت به اندازه‌اش به‌طرز شگفتی بلند است. درون کلیسا، بالای در، لوح‌های سنگی‌ای
    از سده‌های ششم و هفتم با نقش صلیب بولنیسی و گیاهان کار گذاشته‌اند؛ سنگ‌هایی بسیار کهن‌تر از خود کلیسا،
    که شکل کنونی‌اش از سدهٔ هجدهم است.


    روزگاری کتیبه‌ای گرجی بر سردرِ تونل ورودی نقش بسته بود. آن کتیبه ساییده و محو شده است؛ باقی همه را
    صخره نگه داشته.
  tip: >-
    یک ساعت و نیم وقت بگذارید. نه ورودیه‌ای هست، نه نگهبانی، نه نرده‌ای و نه تابلوی توضیحی. راه بالا رفتن
    از صخره کوتاه اما تند و سنگلاخ است و در هوای مرطوب لغزنده، پس کفش بسته با کف محکم بپوشید. صخره تقریباً
    از هر سو عمودی فرو می‌افتد: دست کودکان را بگیرید و از لبه‌ها فاصله بگیرید. در علف‌های درون دیوارها
    سنگ لق و چاله پنهان است. هیچ سایه‌ای نیست، پس از نیمروزهای تابستان بپرهیزید و آب همراه داشته باشید.
    سرویس بهداشتی، کافه و خودپرداز در بولنیسی است. بهار، که دامنه‌ها سبز می‌شوند، و اکتبر مهربان‌ترین
    ماه‌ها هستند.
  route: >-
    سراسر راه جادهٔ S6 است. از تفلیس رو به جنوب از کنار پونیچالا تا مارنئولی بروید، سپس رو به غرب تا بولنیسی،
    و حدود هفت کیلومتر دیگر به سوی کازرتی تا کوِشی. قلعه بر صخرهٔ خود درست در شمال غربی روستاست. حدود
    ۷۲ کیلومتر و یک ساعت و بیست دقیقه راه است، همه آسفالت خوب، جز تکهٔ کوتاه پایانی که جاده‌ای روستایی،
    باریک و تا اندازه‌ای شنی است و خودروی اقتصادی در هوای خشک از پسش برمی‌آید. در مارنئولی یا بولنیسی
    سوخت بگیرید. خودرو را در روستا بگذارید و پیاده بالا بروید. سیونی بولنیسی، تسوغروغاشنی و سامشویلده
    آن‌قدر نزدیک‌اند که روزی کامل را پر کنند.
he:
  name: מבצר קוושי
  short: >-
    מבצר על ראש צוק מעל נהר משאוורה ליד בולניסי, שנכנסים אליו דרך מנהרה בסלע, ושהחזיקו בו בני טורלי, בני
    ברטשווילי ודאוד חאן.
  body: >-
    **בקוושי הדרך היחידה פנימה עברה בתוך הסלע עצמו: מנהרה חצובה בצוק היא עד היום הכניסה היחידה למבצר.**


    המבצר מכתיר סלע גבוה על הגדה השמאלית של נהר משאוורה, מצפון-מערב לכפר קוושי ושבעה קילומטרים מבולניסי.
    מכאן השגיח על הדרכים שהובילו מסמשווילדה אל טשירי ואל ג'וואחתי. היסטוריונים מזהים אותו כמרכז ערוץ קוושי,
    הנזכר בחיבור גאוגרפי ארמני מן המאה ה-7, מעמד שאיבד במאה ה-9, כשדמניסי צמחה לעיר.


    ההיסטוריה שלו נקראת כמו מסדר של האצולה הגאורגית. בסוף המאה ה-12, אחרי מסע מלחמה נגד גנג'ה, העניקה
    המלכה תמר את קוושי לממונה הראשי על חצרה, ורדן דדיאני, והוא קבע בו את מושבו; כשעמד בראש המרד של 1191
    נגדה, לקחה ממנו את המבצר ומסרה אותו לבית טורלי הנאמן. ב-1468 קנו אותו בני ג'וואחישווילי מהמלך בגרט
    השישי, ובהיותו על דרכי המסחר שימש גם תחנת מכס. ב-1486 הופקדו בני ברטשווילי על הגנתו מפני צבאו של יעקוב
    מבית אק קויונלו. בשנים 1569–1578, בעוד המלך סימון הראשון יושב בכלא פרסי, משל מכאן אחיו למחצה, המוסלמי
    דאוד חאן, שלא הצליח להחזיק בטביליסי. ב-1812 חנו במבצר כוחות רוסיים.


    בתוך חומת ההיקף עומדים מגדל עוז במצודה הפנימית, בורות מים קטנים חצובים בסלע, ועל גבעה בחצר כנסיית
    אולם קטנה, גבוהה להפליא ביחס לגודלה. מעל דלתה, מבפנים, קבועים לוחות אבן מן המאות ה-6 וה-7 המגולפים
    בצלבי בולניסי ובצמחים, אבנים עתיקות בהרבה מן הכנסייה עצמה, שצורתה הנוכחית היא מן המאה ה-18.


    פעם נמשכה כתובת גאורגית לאורך המשקוף של מנהרת הכניסה. היא נשחקה ונמחתה; את כל השאר שמר הסלע.
  tip: >-
    הקדישו שעה וחצי. אין דמי כניסה, אין שומר, אין גדר ואין שלט הסבר. השביל במעלה הצוק קצר אבל תלול ומלא
    אבנים, וחלקלק כשהוא רטוב, אז נעלו נעליים סגורות עם אחיזה טובה. הסלע צונח אנכית כמעט מכל צד: החזיקו
    את הילדים ביד והתרחקו מן השוליים. בעשב שבתוך החומות מסתתרים אבנים רופפות ובורות. אין צל בכלל, לכן
    הימנעו משעות הצהריים בקיץ וקחו מים. שירותים, בתי קפה וכספומטים יש בבולניסי. האביב, כשהמדרונות מוריקים,
    ואוקטובר הם החודשים הנעימים ביותר.
  route: >-
    כל הדרך היא כביש S6. צאו מטביליסי דרומה, על פני פוניצ'לה, עד מרנאולי, המשיכו מערבה עד בולניסי, ומשם
    עוד כשבעה קילומטרים לכיוון קזרטי, עד קוושי. המבצר עומד על הצוק שלו ממש מצפון-מערב לכפר. כ-72 ק״מ ושעה
    ועשרים דקות, כולה סלולה היטב, מלבד קטע אחרון קצר של דרך כפרית צרה, חלקה חצץ, שרכב חסכוני עובר בה במזג
    אוויר יבש. תדלקו במרנאולי או בבולניסי. השאירו את הרכב בכפר ועלו ברגל. הסיוני של בולניסי, צוגרוגאשני
    וסמשווילדה קרובים מספיק כדי למלא יום שלם.
ar:
  name: قلعة كفيشي
  short: >-
    قلعة على قمة صخرة فوق نهر ماشافيرا قرب بولنيسي، لا يُدخل إليها إلا عبر نفق في الصخر، تعاقب عليها آل
    توريلي وآل باراتاشفيلي وداود خان.
  body: >-
    **في كفيشي كان الطريق الوحيد إلى الداخل يمرّ عبر الصخر نفسه: نفق منحوت في الجرف ما زال المدخل الوحيد
    إلى القلعة.**


    تتوّج القلعة صخرة عالية على الضفة اليسرى لنهر ماشافيرا، إلى الشمال الغربي من قرية كفيشي وعلى بعد سبعة
    كيلومترات من بولنيسي. ومن هنا كانت ترقب الطرق الممتدة من سامشفيلدي نحو تاشيري وجافاخيتي. ويرى المؤرخون
    أنها كانت مركز وادي كفيشي الوارد ذكره في كتاب جغرافيا أرمني من القرن السابع، وهو دور فقدته في القرن
    التاسع حين نمت دمانيسي فصارت مدينة.


    وتاريخها أشبه بسجلّ لأسماء النبلاء الجورجيين. ففي أواخر القرن الثاني عشر، بعد حملة على كنجة، منحت
    الملكة تامار كفيشي لكبير وكلاء بلاطها فاردان دادياني، فاتخذها مقراً له؛ ولما قاد تمرّد عام 1191 عليها،
    استعادتها منه وسلّمتها إلى آل توريلي الأوفياء. وفي عام 1468 اشتراها آل جافاخيشفيلي من الملك باغرات
    السادس، ولوقوعها على طرق التجارة كانت أيضاً مركزاً للجمارك. وفي عام 1486 تولّى آل باراتاشفيلي الدفاع
    عنها في وجه جيش آق قويونلو بقيادة يعقوب. ومن 1569 إلى 1578، بينما كان الملك سيمون الأول أسيراً في
    سجن فارسي، حكم من هنا أخوه غير الشقيق المسلم داود خان، وقد عجز عن الاحتفاظ بتبليسي. وفي عام 1812 رابطت
    فيها قوات روسية.


    وداخل السور الخارجي يقوم برج رئيسي في القلعة الداخلية، وصهاريج صغيرة منحوتة في الصخر، وعلى مرتفع في
    الفناء كنيسة صغيرة ذات قاعة واحدة، عالية على نحو لافت قياساً بحجمها. وفوق بابها من الداخل ثُبّتت ألواح
    حجرية من القرنين السادس والسابع منقوشة بصلبان بولنيسي وزخارف نباتية، وهي حجارة أقدم بكثير من الكنيسة
    نفسها التي تعود هيئتها الحالية إلى القرن الثامن عشر.


    وكان نقش جورجي يمتدّ ذات يوم على العتبة العليا لنفق المدخل. لقد امّحى؛ أما كل ما عداه فقد حفظته الصخرة.
  tip: >-
    خصّص ساعة ونصفاً. لا رسوم ولا حارس ولا سياج ولا لوحة تعريفية. الدرب إلى أعلى الصخرة قصير لكنه شديد
    الانحدار كثير الحجارة، وزلِق حين يبتلّ، فالبس حذاءً مغلقاً ذا نعل متماسك. والصخرة تهوي عمودياً من
    كل الجهات تقريباً: أمسك بأيدي الأطفال وابقَ بعيداً عن الحواف. وفي العشب داخل الأسوار تختبئ حجارة متقلقلة
    وحفر. لا ظلّ على الإطلاق، فتجنّب ظهيرة الصيف واحمل الماء. دورات المياه والمقاهي وأجهزة الصرف الآلي
    في بولنيسي. والربيع، حين تخضرّ المنحدرات، وأكتوبر ألطف الشهور.
  route: >-
    الطريق كله هو S6. اخرج من تبليسي جنوباً مروراً ببونيتشالا حتى مارنئولي، ثم غرباً إلى بولنيسي، وتابع
    نحو سبعة كيلومترات أخرى باتجاه كازريتي حتى كفيشي. تقوم القلعة على صخرتها إلى الشمال الغربي من القرية
    مباشرة. المسافة نحو 72 كيلومتراً وساعة وعشرون دقيقة، كلها إسفلت جيد باستثناء مقطع أخير قصير من طريق
    قروي ضيق بعضه حصى، تجتازه سيارة اقتصادية في الطقس الجاف. تزوّد بالوقود في مارنئولي أو بولنيسي. اترك
    السيارة في القرية واصعد سيراً. وكنيسة سيوني بولنيسي وتسوغروغاشيني وسامشفيلدي قريبة بما يكفي لملء يوم
    كامل.
