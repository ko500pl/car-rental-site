ka:
  name: კვეშის ციხე
  short: >-
    შუასაუკუნეების სასაზღვრო ციხე კლდოვან ქიმზე ხრამის მდინარის ზემოთ, ბოლნისის მუნიციპალიტეტში.
  body: >-
    **კვეში ზუსტად იმ ადგილას აშენდა, სადაც ლოგიკურია.** ციხე კლდოვან ქიმზე დგას ხრამის მდინარის ზემოთ,
    სოფელ კვეშთან, და ხეობის მთელ მონაკვეთს აკონტროლებს. ქვემო ქართლი საუკუნეების განმავლობაში სასაზღვრო
    ზონა იყო — ჯერ არაბული ამირატების, შემდეგ თურქმანული და სპარსული ძალების პირისპირ — და ასეთი ციხეების
    ჯაჭვი ხეობებს კეტავდა.


    ნაგებობის ბირთვი VIII-IX საუკუნეებისაა, კედლების დიდი ნაწილი კი მოგვიანებით, შუა საუკუნეებში დაშენდა.
    შემორჩა გალავანი კოშკებით, ჭიშკრის ნაწილი, საცხოვრებელი ნაგებობების საძირკვლები და პატარა ეკლესია
    ციხის შიგნით. კლდეში ნაკვეთი გასასვლელებიც არის; ადგილობრივები ამბობენ, რომ ერთი მათგანი მდინარემდე
    ჩადიოდა და ალყის დროს წყალს იღებდნენ. ეს ტიპური ქართული ციხის მოწყობილობაა, თუმცა დღეს გასასვლელი
    ჩანგრეულია.


    ასვლა ციცაბოა, მაგრამ მოკლე — ოციოდე წუთი სოფლიდან. ზემოდან ხრამის ხეობა ღრმად ჩანს, ჩრდილოეთით კი
    ბოლნისის ველი და ვენახები.


    ეს ნახევრადმიტოვებული ძეგლია: მაჩვენებელი მცირეა, საინფორმაციო დაფა თითქმის არ არის, კონსერვაცია
    მინიმალური. სამაგიეროდ ხალხიც არავინაა. გაზაფხულზე ფერდობი ყვავილოვანია, ზაფხულში კი ქვა ცხელდება და
    ჩრდილი არ არსებობს.
  tip: >-
    საათნახევარი ასვლასთან ერთად საკმარისია. ბილიკი ქვიანი და ციცაბოა, დახურული ფეხსაცმელი აუცილებელია;
    სველ ამინდში სრიალდება. ღობე არსად არის და ქიმიდან ჩამოსავარდნი მაღალია — ბავშვებს თვალი ადევნეთ.
    ნანგრევებში ხვრელები და არამდგრადი ქვებია. წყალი წამოიღეთ, ზემოთ არაფერია. კაფე და ტუალეტი ბოლნისში,
    თხუთმეტ კილომეტრში.
  route: >-
    თბილისიდან სამხრეთით მარნეულამდე, შემდეგ დასავლეთით ბოლნისის მიმართულებით და კვეშის მაჩვენებელზე
    გაუხვევთ. სულ 72 კმ, დაახლოებით საათი და ოცი წუთი. მთავარი გზა კარგი ასფალტია; ბოლო სამი კილომეტრი
    სოფლის ვიწრო გზაა, ნაწილობრივ ხრეშიანი, მაგრამ ეკონომ-კლასის მანქანისთვის გამვლელი. საწვავი მარნეულში
    ან ბოლნისში აიღეთ. მანქანა სოფელში დატოვეთ და ფეხით აუყევით.
en:
  name: Kveshi Fortress
  short: >-
    A medieval border fortress on a rock spur above the Khrami river, in Bolnisi municipality.
  body: >-
    **Kveshi was built exactly where it makes sense.** The fortress stands on a rock spur above the
    Khrami river beside the village of Kveshi, controlling a long stretch of the valley. Kvemo Kartli was
    a frontier for centuries — facing Arab emirates, then Turkmen and Persian powers — and a chain of
    fortresses like this one closed off the river routes.


    The core of the structure dates from the 8th and 9th centuries, with most of the visible walling
    added later in the Middle Ages. What survives is a curtain wall with towers, part of the gate, the
    foundations of living quarters and a small church inside the enceinte. There are rock-cut passages
    too; local accounts say one led down to the river so that water could be drawn under siege. That is a
    standard feature of Georgian fortresses, though here the passage has collapsed.


    The climb is steep but short, around twenty minutes from the village. From the top the Khrami gorge
    drops away sharply, and to the north the Bolnisi plain and its vineyards open out.


    This is a half-abandoned monument: signage is minimal, there are almost no information boards, and
    conservation has been light. The compensation is that nobody else is there. In spring the slope is
    covered in flowers; in summer the stone heats up and there is no shade at all.
  tip: >-
    An hour and a half including the climb is enough. The path is stony and steep and closed shoes are
    essential; it becomes slippery in wet weather. Nothing is fenced and the drop from the spur is
    serious, so keep children close. There are holes and loose stones among the ruins. Carry water —
    there is nothing at the top. Cafes and toilets are in Bolnisi, fifteen kilometres away.
  route: >-
    Head south from Tbilisi to Marneuli, then west towards Bolnisi and turn off at the sign for Kveshi.
    Seventy-two kilometres in total, about an hour and twenty minutes. The main road is good asphalt; the
    last three kilometres are a narrow village road, partly gravel, but passable in an economy car.
    Refuel in Marneuli or Bolnisi. Leave the car in the village and walk up.
ru:
  name: Крепость Квеши
  short: >-
    Средневековая пограничная крепость на скальном отроге над рекой Храми, в Болнисском муниципалитете.
  body: >-
    **Квеши построили ровно там, где это логично.** Крепость стоит на скальном отроге над рекой Храми
    рядом с селом Квеши и контролирует длинный участок долины. Квемо-Картли веками была пограничьем —
    сначала перед арабскими эмиратами, затем перед туркменскими и персидскими силами, — и цепь таких
    крепостей запирала речные пути.


    Ядро постройки относится к VIII-IX векам, большая часть видимой кладки надстроена позже, в Средние
    века. Сохранились ограда с башнями, часть ворот, фундаменты жилых построек и маленькая церковь внутри
    стен. Есть и вырубленные в скале ходы; по местным рассказам один вёл вниз к реке, чтобы брать воду
    при осаде. Для грузинских крепостей это типично, хотя здесь ход обвалился.


    Подъём крутой, но короткий — минут двадцать от села. Сверху резко обрывается Храмское ущелье, а на
    севере открывается Болнисская равнина с виноградниками.


    Это наполовину заброшенный памятник: указателей мало, информационных щитов почти нет, консервация
    минимальная. Компенсация в том, что здесь никого. Весной склон в цветах; летом камень раскаляется, и
    тени нет вовсе.
  tip: >-
    Полутора часов вместе с подъёмом достаточно. Тропа каменистая и крутая, закрытая обувь обязательна; в
    сырую погоду скользко. Ограждений нет, обрыв с отрога серьёзный, детей держите рядом. Среди руин ямы
    и шаткие камни. Берите воду — наверху ничего нет. Кафе и туалеты в Болниси, в пятнадцати километрах.
  route: >-
    Из Тбилиси на юг до Марнеули, затем на запад в сторону Болниси и поворот по указателю на Квеши. Всего
    72 км, примерно час двадцать. Главная дорога — хороший асфальт; последние три километра узкая
    сельская дорога, частично гравийная, но проходимая на машине эконом-класса. Заправляйтесь в Марнеули
    или Болниси. Машину оставьте в селе и поднимайтесь пешком.
fa:
  name: قلعهٔ کوشی
  short: >-
    قلعه‌ای مرزی از سده‌های میانه بر زبانه‌ای صخره‌ای بالای رود خرامی، در شهرستان بولنیسی.
  body: >-
    **کوشی درست همان‌جا ساخته شد که باید.** قلعه بر زبانه‌ای صخره‌ای بالای رود خرامی و کنار روستای کوشی
    ایستاده و بخش درازی از درّه را زیر نظر دارد. کوهمو کارتلی قرن‌ها مرز بود — نخست رویاروی امیرنشین‌های
    عرب و سپس نیروهای ترکمان و ایرانی — و زنجیره‌ای از چنین قلعه‌هایی راه‌های رودخانه‌ای را می‌بست.


    هستهٔ بنا به سده‌های هشتم و نهم بازمی‌گردد و بیشترِ دیوارهای پیدا بعدها در سده‌های میانه افزوده شده
    است. آنچه مانده حصاری با برج‌ها، بخشی از دروازه، پی‌های ساختمان‌های مسکونی، و کلیسایی کوچک درون حصار
    است. راهروهای کنده در سنگ نیز هست؛ روایت‌های محلی می‌گویند یکی از آنها تا رود پایین می‌رفت تا در
    محاصره بتوان آب برداشت. این ویژگی در قلعه‌های گرجی معمول است، هرچند اینجا راهرو فرو ریخته است.


    بالا رفتن تند اما کوتاه است، حدود بیست دقیقه از روستا. از بالا درّهٔ خرامی به‌تندی فرو می‌افتد و در
    شمال دشت بولنیسی و تاکستان‌هایش گشوده می‌شود.


    این یادمانی نیمه‌رهاشده است: تابلوها اندک‌اند، لوح توضیحی تقریباً نیست، و مرمت کم بوده است. جبرانش آن
    است که کسی آنجا نیست. بهار دامنه پوشیده از گل است؛ تابستان سنگ داغ می‌شود و اصلاً سایه‌ای وجود ندارد.
  tip: >-
    یک ساعت‌ونیم با احتساب صعود کافی است. مسیر سنگی و تند است و کفش بسته ضروری؛ در هوای مرطوب لغزنده
    می‌شود. هیچ‌جا حفاظ نیست و سقوط از زبانه جدی است، پس کودکان را نزدیک نگه دارید. میان ویرانه‌ها چاله و
    سنگ لق هست. آب همراه ببرید — در بالا چیزی نیست. کافه و سرویس بهداشتی در بولنیسی، پانزده کیلومتر
    آن‌سوتر است.
  route: >-
    از تفلیس به جنوب تا مارنئولی، سپس به غرب به سوی بولنیسی بروید و سر تابلوی کوشی بپیچید. روی‌هم ۷۲
    کیلومتر، حدود یک ساعت و بیست دقیقه. جادهٔ اصلی آسفالت خوبی دارد؛ سه کیلومتر آخر جاده‌ای روستایی و
    باریک و تا حدی شنی است، اما با خودروی اقتصادی قابل عبور. سوخت را در مارنئولی یا بولنیسی بگیرید. خودرو
    را در روستا بگذارید و پیاده بالا بروید.
he:
  name: מבצר קווישי
  short: >-
    מבצר גבול מימי הביניים על לשון סלע מעל נהר החראמי, במחוז בולניסי.
  body: >-
    **קווישי נבנה בדיוק במקום ההגיוני.** המבצר עומד על לשון סלע מעל נהר החראמי לצד הכפר קווישי, ושולט על
    מקטע ארוך של העמק. קוומו קרתלי הייתה ספר במשך מאות שנים — מול אמירויות ערביות, אחר כך מול כוחות
    תורכמניים ופרסיים — ושרשרת מבצרים כזו סגרה את דרכי הנהרות.


    גרעין המבנה מן המאות ה-8 וה-9, ורוב הבנייה הנראית נוספה מאוחר יותר בימי הביניים. מה ששרד הוא חומת
    היקף עם מגדלים, חלק מן השער, יסודות מבני מגורים וכנסייה קטנה בתוך החומה. יש גם מעברים חצובים בסלע;
    לפי סיפורים מקומיים אחד מהם ירד אל הנהר כדי לשאוב מים בעת מצור. זו תכונה שגרתית במבצרים גאורגיים, אם
    כי כאן המעבר קרס.


    הטיפוס תלול אך קצר, כעשרים דקות מן הכפר. מלמעלה צונח ערוץ החראמי בחדות, ובצפון נפתחים מישור בולניסי
    וכרמיו.


    זהו אתר נטוש למחצה: השילוט מועט, אין כמעט לוחות הסבר, והשימור קל בלבד. הפיצוי הוא שאין שם איש. באביב
    המדרון מכוסה פרחים; בקיץ האבן מתלהטת ואין צל כלל.
  tip: >-
    שעה וחצי כולל הטיפוס מספיקה. השביל אבני ותלול ונעליים סגורות הכרחיות; במזג אוויר רטוב הוא חלקלק. שום
    דבר אינו מגודר והנפילה מן הלשון רצינית, לכן שמרו על ילדים קרוב. בין החורבות יש בורות ואבנים רופפות.
    קחו מים — למעלה אין דבר. בתי קפה ושירותים בבולניסי, חמישה-עשר קילומטרים משם.
  route: >-
    סעו מטביליסי דרומה עד מרנאולי, ואז מערבה לכיוון בולניסי ופנו בשילוט לקווישי. 72 ק״מ בסך הכול, כשעה
    ועשרים. הכביש הראשי אספלט טוב; שלושת הקילומטרים האחרונים דרך כפרית צרה, חלקה חצץ, אך עבירה ברכב
    חסכוני. תדלקו במרנאולי או בבולניסי. השאירו את הרכב בכפר ועלו ברגל.
ar:
  name: قلعة كفيشي
  short: >-
    قلعة حدودية من العصور الوسطى على نتوء صخري فوق نهر خرامي، في بلدية بولنيسي.
  body: >-
    **بُنيت كفيشي في الموضع المنطقي تماماً.** تقوم القلعة على نتوء صخري فوق نهر خرامي بجوار قرية كفيشي،
    وتتحكم في مقطع طويل من الوادي. وكانت كفيمو كارتلي ثغراً قروناً — في مواجهة الإمارات العربية أولاً ثم
    القوى التركمانية والفارسية — وكانت سلسلة من قلاع كهذه تغلق مسالك الأنهار.


    ويعود قلب البناء إلى القرنين الثامن والتاسع، وأُضيف معظم البناء الظاهر لاحقاً في العصور الوسطى. وما
    بقي سور بأبراج، وجزء من البوابة، وأساسات مساكن، وكنيسة صغيرة داخل السور. وهناك ممرات منحوتة في الصخر
    أيضاً؛ وتقول الروايات المحلية إن أحدها كان ينزل إلى النهر لسحب الماء أثناء الحصار. وهذه سمة معتادة في
    القلاع الجورجية، وإن كان الممر هنا قد انهار.


    والصعود شديد لكنه قصير، نحو عشرين دقيقة من القرية. ومن الأعلى ينحدر وادي خرامي بحدة، وينفتح في الشمال
    سهل بولنيسي وكرومه.


    هذا أثر شبه مهجور: اللافتات قليلة، ولا لوحات تعريفية تقريباً، والصيانة خفيفة. والتعويض أن لا أحد
    هناك. وفي الربيع يغطي المنحدر الزهر؛ وفي الصيف يسخن الحجر ولا ظل البتة.
  tip: >-
    ساعة ونصف مع الصعود تكفي. والدرب حجري شديد الانحدار والحذاء المغلق ضروري؛ ويصير زلقاً في الطقس الرطب.
    ولا شيء مسيّج والسقوط عن النتوء خطير، فأبقِ الأطفال قريبين. وبين الأطلال حفر وحجارة غير ثابتة. احمل
    ماءً — فلا شيء في الأعلى. والمقاهي ودورات المياه في بولنيسي على بعد خمسة عشر كيلومتراً.
  route: >-
    اتجه جنوباً من تبليسي إلى مارنئولي، ثم غرباً نحو بولنيسي وانعطف عند لافتة كفيشي. اثنان وسبعون
    كيلومتراً إجمالاً، نحو ساعة وعشرين دقيقة. الطريق الرئيسي إسفلت جيد؛ والكيلومترات الثلاثة الأخيرة طريق
    قروي ضيق، بعضه حصى، لكنه سالك بسيارة اقتصادية. تزوّد بالوقود في مارنئولي أو بولنيسي. واترك السيارة في
    القرية واصعد سيراً.
