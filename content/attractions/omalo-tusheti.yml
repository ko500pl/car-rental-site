ka:
  name: ომალო და თუშეთი
  short: >-
    კესელოს ფიქლის კოშკები ომალოს თავზე, მწყემსების სოფლები კავკასიონის წყალგამყოფის ჩრდილოეთით და ხრეშიანი
    უღელტეხილი, მხოლოდ ზაფხულში ღია.
  body: >-
    **თუშეთი წელიწადში ოთხი-ხუთი თვე ცოცხლობს: როცა თოვლი აბანოს უღელტეხილს ჩაკეტავს, მწყემსები ფარას
    კახეთის ბარში ჩარეკავენ და ომალო ქარის ამარა რჩება.**


    შესასვლელი თავად უღელტეხილია — 2826 მეტრი, კავკასიონის ერთ-ერთი უმაღლესი საავტომობილო გადასასვლელი:
    ფშაველიდან დაახლოებით სამოცდაათი კილომეტრი ვიწრო ხრეშიანი გზა, მთის კალთაში გამოჭრილი, ერთი მოაჯირის
    გარეშე. მის იქით უკვე მთავარი წყალგამყოფის ჩრდილოეთით ხართ — ჩვეული განსაზღვრებით თუშეთი გეოგრაფიულად
    ევროპაშია, ირგვლივ ქედებზე კი ჩეჩნეთი და დაღესტანია.


    ომალო თუშეთის უდიდესი სოფელია, ქვემო ომალოს თავზე კი მისი სიმბოლო, კესელოს ციხე დგას. მისი ზემოთკენ
    შევიწროებული ფიქლის კოშკები 1230-იან წლებში, მონღოლთა შემოსევისას აიგო; თავდაპირველად ცამეტი იყო და
    თარეშის დროს სოფელი სახლებს ტოვებდა და კოშკებს აფარებდა თავს. XX საუკუნისთვის უმეტესობა ჩამოშლილიყო.
    2003 წლიდან ხუთი კოშკი ძველი თუშური წესით აღადგინეს, მშენებლებმა კი ბრინჯაოს ხანის ცულები, სამკაულები
    და კლდეზე ამოკვეთილი ნიშნები იპოვეს.


    თუშები მწყემსები და მეომრები არიან. საუკუნეების განმავლობაში კაცები აპრილიდან ოქტომბრამდე ცხვართან
    ერთად აქ, ამ ხეობებში ატარებდნენ, ზამთარს კი ზემო და ქვემო ალვანში ათევდნენ — საძოვრებზე, რომლებიც
    მეფეებმა 1659 წლის ბახტრიონის აჯანყების შემდეგ უბოძეს, როცა ზეზვა გაფრინდაულის მეთაურობით თუშები სპარსელთა
    ბატონობის წინააღმდეგ აჯანყებას შეუერთდნენ. ძველი ადათით ღორი აქ უბედობის მომტანად ითვლება და ბევრი
    ოჯახი ღორს არ ინახავს; სახლის სიამაყე გუდის ყველი — ტყავის გუდაში დამწიფებული ცხვრის ყველი — და კარგი
    მატყლია.


    ომალოდან ბილიკები შენაქოსა და დიკლოსკენ, დართლოსა და ჭეშოსკენ მიდის — სოფლები ერთმანეთისგან რამდენიმე
    საათის სავალზეა და ერთად კლასიკურ ლაშქრობას ქმნის.


    როცა დღის ბოლო ჯიპი უღელტეხილიდან ძლივს ჩამოფოფხდება და გენერატორები ჩაჩუმდება, გაიგებთ იმას, რაც
    თუშეთს ყოველთვის უხვად ჰქონდა: ქარს, წყალს და ფარის ეჟვნებს.
  tip: >-
    ეს ექსპედიციაა და არა ჩვეულებრივი გასეირნება. საჭიროა ნამდვილი, მაღალი გამავლობის 4×4 და მძღოლი, რომელიც
    ღია ხრეშიან ფერდზე თავს დაჯერებულად გრძნობს; წინასწარ დარწმუნდით, რომ გაქირავების ხელშეკრულება აბანოს
    უღელტეხილს უშვებს — ბევრი მას გამორიცხავს, იხილეთ ჩვენი /terms/. დაგეგმეთ მინიმუმ ორი ღამე. თუშეთში
    ბანკომატი არსად არის, ამიტომ საკმარისი ნაღდი ფული წაიღეთ საოჯახო სასტუმროებისთვის, სადაც უმეტესად
    სახლის საჭმელსაც გთავაზობენ. აგვისტოშიც კი ღამე ცივა: თბილი ტანსაცმელი, საწვიმარი და საკუთარი წამლები
    წაიღეთ, დახმარება საათებით შორსაა. პასპორტი თან იქონიეთ — მხარე რუსეთს ესაზღვრება. მობილური კავშირი
    ხან არის, ხან — არა. ივლის-აგვისტოს შაბათ-კვირას სასტუმროები ივსება, ამიტომ წინასწარ დაჯავშნეთ.
  route: >-
    თბილისიდან გომბორის უღელტეხილით (შ38) თელავამდე იარეთ, იქიდან ახმეტამდე, შემდეგ კი ალაზანს ჩრდილოეთით
    აუყევით ფშაველამდე: დაახლოებით 150 კილომეტრი ასფალტი, ორსაათნახევარში. ავზი ახმეტაში შეავსეთ — იქიდან
    ომალომდე ბენზინგასამართი აღარ არის. ფშაველიდან ნამდვილი გზა იწყება: სამოცდაათი კილომეტრი ხრეში აბანოს
    უღელტეხილზე, რასაც რეალურად ოთხი საათი მაინც სჭირდება — წიფლნარიდან შიშველ ქედებამდე, ციცაბო კლდეების
    თავზე დაკლაკნილი მოსახვევებით. სულ დაახლოებით 220 კილომეტრი და ექვსნახევარი საათი გაჩერებების გარეშე.
    გზა ჩვეულებრივ ივნისში იხსნება და შემოდგომის პირველ დიდ თოვლამდე მოქმედებს; წვიმის შემდეგ მეწყერი
    ხშირია. მხოლოდ ოფროუდ კლასი.
en:
  name: Omalo and Tusheti
  short: >-
    The slate towers of Keselo over Omalo, shepherd villages north of the Caucasus watershed and a gravel
    pass open only in summer.
  body: >-
    **Tusheti lives for four or five months a year: when snow shuts the Abano Pass, the shepherds drive
    their flocks down to the Kakhetian plain and Omalo is left to the wind.**


    The way in is the pass itself, 2,826 metres high and one of the loftiest drivable roads in the Caucasus:
    some seventy kilometres of narrow gravel from Pshaveli, cut into the mountainside without a single
    barrier. Beyond it you are north of the main watershed, which by the usual definition puts Tusheti
    geographically in Europe, with Chechnya and Dagestan on the ridges around it.


    Omalo is the largest village, and above Lower Omalo stands its emblem, the fortress of Keselo. Its
    tapering slate towers went up in the 1230s, when the Mongols came; there were once thirteen, and in
    a raid the villagers left their houses and sheltered inside. By the 20th century most had fallen.
    From 2003, five were rebuilt by the old Tush methods, and the builders turned up Bronze Age axes,
    jewellery and rock carvings.


    The Tush are shepherds and fighters. For centuries their men spent April to October with the sheep
    in these valleys and wintered in Zemo and Kvemo Alvani, on pastures granted by the kings after the
    Bakhtrioni uprising of 1659, when Tush fighters under Zezva Gaprindauli joined the revolt against
    Persian rule. Old custom still holds pork unlucky, and many farmers keep no pigs; the pride of the
    house is guda, sheep's cheese ripened in a sheepskin sack, and good wool.


    From Omalo, paths lead to Shenako and Diklo, Dartlo and Chesho, villages a few hours apart that together
    make the classic trek.


    When the last jeep has crawled down from the pass and the generators fall quiet, you hear what Tusheti
    has always had in plenty: wind, water and the bells of the flocks.
  tip: >-
    Treat this as an expedition. You need a genuine high-clearance 4x4 and a driver at ease on exposed
    gravel, and you must confirm beforehand that your rental agreement permits the Abano Pass; many exclude
    it, so see our /terms/. Plan two nights at the very least. There is no ATM anywhere in Tusheti, so
    bring enough cash for guesthouses, most of which offer home-cooked meals. Nights are cold even in
    August; pack warm layers, rain gear and your own medicines, because help is hours away. Carry your
    passport, as the region borders Russia. Mobile coverage comes and goes. July and August weekends fill
    the guesthouses, so book ahead.
  route: >-
    From Tbilisi, cross the Gombori Pass (Sh38) to Telavi and continue to Akhmeta, then north up the Alazani
    to Pshaveli: about 150 km of asphalt in roughly two and a half hours. Fill the tank in Akhmeta, as
    there is no fuel between there and Omalo. At Pshaveli the real journey begins: seventy kilometres
    of gravel over the Abano Pass, which realistically takes four hours or more, climbing through beech
    forest to bare ridges and hairpins above sheer drops. That makes about 220 km and six and a half hours
    without stops. The road usually opens in June and closes with the first heavy snow in autumn; after
    rain, landslides are common. Offroad class only.
ru:
  name: Омало и Тушетия
  short: >-
    Сланцевые башни Кесело над Омало, пастушьи сёла к северу от Главного Кавказского водораздела и гравийный
    перевал, открытый только летом.
  body: >-
    **Тушетия живёт четыре-пять месяцев в году: когда снег закрывает перевал Абано, пастухи сгоняют отары
    вниз, на Кахетинскую равнину, и Омало остаётся во власти ветра.**


    Путь сюда — это и есть перевал: 2826 метров, одна из самых высоких автомобильных дорог Кавказа, около
    семидесяти километров узкой гравийной дороги от Пшавели, врезанной в склон без единого ограждения.
    За ним вы уже к северу от Главного водораздела, а значит, по общепринятому определению, Тушетия географически
    лежит в Европе, и вокруг, по хребтам, — Чечня и Дагестан.


    Омало — самое большое село, а над Нижним Омало стоит его символ, крепость Кесело. Её сужающиеся кверху
    сланцевые башни поднялись в 1230-х годах, когда пришли монголы; когда-то их было тринадцать, и во
    время набегов сельчане оставляли дома и укрывались внутри. К XX веку большинство башен обрушилось.
    С 2003 года пять из них восстановили старыми тушинскими приёмами, и строители нашли при этом топоры
    бронзового века, украшения и наскальные изображения.


    Тушины — пастухи и воины. Веками мужчины проводили с апреля по октябрь с овцами в этих долинах, а
    зимовали в Земо- и Квемо-Алвани, на пастбищах, пожалованных царями после Бахтрионского восстания 1659
    года, когда тушинские воины во главе с Зезвой Гаприндаули примкнули к восстанию против персидского
    владычества. По старому обычаю свинина до сих пор считается приносящей несчастье, и многие хозяева
    не держат свиней; гордость дома — гуда, овечий сыр, вызревающий в мешке из овечьей шкуры, и добрая
    шерсть.


    Из Омало тропы ведут в Шенако и Дикло, Дартло и Чешо — сёла в нескольких часах ходьбы друг от друга,
    вместе они и составляют классический треккинговый маршрут.


    Когда последний джип сползёт с перевала и затихнут генераторы, вы услышите то, чего в Тушетии всегда
    было вдоволь: ветер, воду и колокольчики отар.
  tip: >-
    Относитесь к поездке как к экспедиции. Нужен настоящий полноприводный внедорожник с высоким клиренсом
    и водитель, уверенно чувствующий себя на открытом гравии над обрывом, а заранее нужно убедиться, что
    договор аренды разрешает перевал Абано: многие его исключают, см. /terms/. Закладывайте минимум две
    ночи. Банкоматов в Тушетии нет нигде, так что возьмите достаточно наличных на гостевые дома, большинство
    из которых кормит домашней едой. Ночи холодные даже в августе: возьмите тёплую одежду, дождевик и
    свои лекарства — помощь в часах пути. Имейте при себе паспорт: регион граничит с Россией. Мобильная
    связь то есть, то нет. В июле и августе на выходные гостевые дома заполняются — бронируйте заранее.
  route: >-
    Из Тбилиси через Гомборский перевал (Sh38) в Телави, дальше в Ахмету и на север вверх по Алазани до
    Пшавели: около 150 км асфальта, примерно два с половиной часа. Заправьтесь в Ахмете — дальше до самого
    Омало топлива нет. В Пшавели начинается настоящая дорога: семьдесят километров гравия через перевал
    Абано, на которые реально уходит четыре часа и больше; путь поднимается через буковый лес к голым
    гребням и серпантинам над отвесными обрывами. Итого около 220 км и шесть с половиной часов без остановок.
    Обычно дорогу открывают в июне и закрывают с первым сильным снегом осенью; после дождей часты оползни.
    Только класс «оффроуд».
fa:
  name: اومالو و توشتی
  short: >-
    برج‌های سنگ‌لوحیِ کسلو بر فراز اومالو، روستاهای چوپانی شمال آب‌پخشان قفقاز و گردنه‌ای شنی که تنها
    تابستان‌ها باز است.
  body: >-
    **توشتی سالی چهار پنج ماه زندگی می‌کند: وقتی برف گردنهٔ آبانو را می‌بندد، چوپانان گله‌ها را به دشت
    کاختی پایین می‌برند و اومالو به باد سپرده می‌شود.**


    راه ورود خودِ گردنه است: ۲۸۲۶ متر ارتفاع، یکی از مرتفع‌ترین جاده‌های ماشین‌روی قفقاز؛ حدود هفتاد کیلومتر
    راه شنیِ باریک از پشاولی که بی هیچ نرده‌ای در دل کوه کنده شده است. پس از آن در شمال آب‌پخشان اصلی
    هستید، و این بنا بر تعریف رایج، توشتی را از نظر جغرافیایی در اروپا جای می‌دهد؛ با چچن و داغستان بر
    ستیغ‌های پیرامون.


    اومالو بزرگ‌ترین روستاست و بالای اومالوی پایین نماد آن ایستاده است: دژ کسلو. برج‌های سنگ‌لوحی‌اش که
    رو به بالا باریک می‌شوند در دههٔ ۱۲۳۰، هنگام آمدن مغولان، برپا شدند؛ روزگاری سیزده برج بود و هنگام
    یورش، روستاییان خانه‌ها را رها می‌کردند و درون آن پناه می‌گرفتند. تا سدهٔ بیستم بیشترشان فروریخته
    بودند. از ۲۰۰۳ پنج برج به شیوه‌های کهن توشی بازسازی شد و سازندگان در این کار تبرهای عصر مفرغ، زیورآلات
    و سنگ‌نگاره‌هایی یافتند.


    توش‌ها چوپان و جنگجویند. قرن‌ها مردانشان از آوریل تا اکتبر را با گوسفندان در این دره‌ها می‌گذراندند
    و زمستان را در زمو آلوانی و کومو آلوانی، بر چراگاه‌هایی که شاهان پس از قیام بختریونی در ۱۶۵۹ به آنان
    بخشیدند؛ قیامی که در آن جنگجویان توش به رهبری ززوا گاپریندائولی به شورش علیه سلطهٔ ایران پیوستند.
    رسم کهن هنوز گوشت خوک را بدیمن می‌داند و بسیاری از کشاورزان خوک نگه نمی‌دارند؛ مایهٔ مباهات هر خانه
    پنیر «گودا»ی توشی از شیر گوسفند، که در انبانی از پوست گوسفند می‌رسد، و پشم مرغوب است.


    از اومالو کوره‌راه‌هایی به شناکو و دیکلو، دارتلو و چشو می‌روند؛ روستاهایی که چند ساعت با هم فاصله
    دارند و با هم پیمایش کلاسیک توشتی را می‌سازند.


    وقتی واپسین جیپ از گردنه پایین بخزد و ژنراتورها خاموش شوند، آن‌چه را می‌شنوید که توشتی همیشه به فراوانی
    داشته است: باد، آب و زنگولهٔ گله‌ها.
  tip: >-
    این سفر را یک اکسپدیشن بدانید. به یک خودروی ۴×۴ واقعی با فاصلهٔ زیاد از زمین و راننده‌ای نیاز دارید
    که روی جادهٔ شنیِ لبهٔ پرتگاه آسوده باشد، و باید از پیش مطمئن شوید قرارداد اجاره اجازهٔ گذر از گردنهٔ
    آبانو را می‌دهد؛ بسیاری آن را مستثنا می‌کنند، پس /terms/ را ببینید. دست‌کم دو شب برنامه بریزید. در
    هیچ جای توشتی خودپرداز نیست، پس پول نقد کافی برای مهمان‌خانه‌ها همراه بیاورید؛ بیشترشان غذای خانگی
    می‌دهند. شب‌ها حتی در اوت سرد است؛ لباس گرم لایه‌لایه، بارانی و داروهای خودتان را بردارید، چون کمک
    ساعت‌ها دور است. گذرنامه همراه داشته باشید، زیرا منطقه با روسیه هم‌مرز است. آنتن موبایل می‌آید و می‌رود.
    آخر هفته‌های ژوئیه و اوت مهمان‌خانه‌ها پر می‌شوند؛ از پیش رزرو کنید.
  route: >-
    از تفلیس از گردنهٔ گومبوری (Sh38) به تلاوی بروید و تا آخمتا ادامه دهید، سپس به شمال، در امتداد رود
    آلازانی، تا پشاولی: حدود ۱۵۰ کیلومتر آسفالت در حدود دو ساعت و نیم. در آخمتا باک را پر کنید، چون از
    آن‌جا تا اومالو سوختی نیست. در پشاولی سفر واقعی آغاز می‌شود: هفتاد کیلومتر راه شنی از روی گردنهٔ آبانو
    که در عمل چهار ساعت یا بیشتر طول می‌کشد و از جنگل راش به ستیغ‌های برهنه و پیچ‌های تند بالای پرتگاه‌های
    عمودی بالا می‌رود. روی هم حدود ۲۲۰ کیلومتر و شش ساعت و نیم بدون توقف. جاده معمولاً در ژوئن باز می‌شود
    و با نخستین برف سنگینِ پاییز بسته؛ پس از باران رانش زمین رایج است. فقط کلاس آفرود.
he:
  name: אומאלו ותושטי
  short: מגדלי הצפחה של קסלו מעל אומאלו, כפרי רועים מצפון לפרשת המים של הקווקז ומעבר חצץ שנפתח רק בקיץ.
  body: >-
    **תושטי חיה ארבעה-חמישה חודשים בשנה: כשהשלג סוגר את מעבר אבאנו, הרועים מורידים את העדרים אל מישור
    קאחתי, ואומאלו נותר לרוח.**


    הדרך פנימה היא המעבר עצמו, בגובה 2,826 מטרים ואחד הכבישים הגבוהים ביותר בקווקז שאפשר לנסוע בהם: כשבעים
    קילומטרים של חצץ צר מפשאוולי, חצובים בצלע ההר בלי מעקה אחד. מעבר לו אתם מצפון לפרשת המים הראשית, וזה,
    לפי ההגדרה המקובלת, ממקם את תושטי מבחינה גאוגרפית באירופה, עם צ'צ'ניה ודגסטן על הרכסים שמסביב.


    אומאלו הוא הכפר הגדול ביותר, ומעל אומאלו התחתונה ניצב סמלו, מבצר קסלו. מגדלי הצפחה שלו, ההולכים וצרים
    כלפי מעלה, הוקמו בשנות ה-30 של המאה ה-13, כשהגיעו המונגולים; פעם היו שלושה עשר, ובעת פשיטה עזבו תושבי
    הכפר את בתיהם ומצאו בהם מחסה. עד המאה ה-20 רובם קרסו. החל מ-2003 שוקמו חמישה בשיטות הבנייה התושיות
    העתיקות, והבונים מצאו גרזינים מתקופת הברונזה, תכשיטים וחריטות סלע.


    התושים הם רועים ולוחמים. במשך מאות שנים בילו הגברים מאפריל עד אוקטובר עם הצאן בעמקים האלה, ואת החורף
    עשו בזמו אלבאני ובקבמו אלבאני, במרעים שהעניקו להם המלכים אחרי מרד בחטריוני ב-1659, כשלוחמים תושים
    בהנהגת זזבה גפרינדאולי הצטרפו למרד נגד השלטון הפרסי. לפי המנהג הישן בשר חזיר עדיין נחשב למביא מזל
    רע, וחקלאים רבים אינם מגדלים חזירים; גאוות הבית היא גבינת הגודה — גבינת כבשים המבשילה בשק עור כבש
    — וצמר משובח.


    מאומאלו יוצאים שבילים לשנקו ולדיקלו, לדרטלו ולצ'שו, כפרים שמרוחקים זה מזה כמה שעות הליכה ויחד יוצרים
    את הטרק הקלאסי.


    כשהג'יפ האחרון זוחל למטה מן המעבר והגנרטורים משתתקים, אתם שומעים את מה שבתושטי היה תמיד בשפע: רוח,
    מים ופעמוני העדרים.
  tip: >-
    התייחסו לנסיעה כאל משלחת. צריך רכב שטח 4×4 אמיתי עם מרווח גחון גבוה ונהג שמרגיש בנוח על חצץ חשוף מעל
    תהום, ויש לוודא מראש שחוזה ההשכרה מתיר את מעבר אבאנו; רבים מחריגים אותו, ראו /terms/. תכננו לפחות
    שני לילות. אין כספומט בשום מקום בתושטי, אז הביאו מספיק מזומן לבתי ההארחה, שרובם מגישים ארוחות ביתיות.
    הלילות קרים גם באוגוסט; ארזו שכבות חמות, ביגוד לגשם ותרופות משלכם, כי עזרה נמצאת במרחק שעות. קחו דרכון,
    כי האזור גובל ברוסיה. הקליטה הסלולרית באה והולכת. בסופי השבוע של יולי ואוגוסט בתי ההארחה מתמלאים,
    אז הזמינו מראש.
  route: >-
    מטביליסי חצו את מעבר גומבורי (Sh38) לטלאווי והמשיכו לאחמטה, ומשם צפונה במעלה האלאזני עד פשאוולי: כ-150
    ק"מ של אספלט, בערך שעתיים וחצי. מלאו את המכל באחמטה, כי משם ועד אומאלו אין דלק. בפשאוולי מתחיל המסע
    האמיתי: שבעים קילומטרים של חצץ דרך מעבר אבאנו, שהנסיעה בהם אורכת בפועל ארבע שעות ויותר, בטיפוס דרך
    יער אשור אל רכסים חשופים ופיתולים מעל תהומות. בסך הכול כ-220 ק"מ ושש שעות וחצי בלי עצירות. הדרך נפתחת
    בדרך כלל ביוני ונסגרת עם השלג הכבד הראשון בסתיו; אחרי גשם מפולות נפוצות. לרכבי שטח בלבד.
ar:
  name: أومالو وتوشيتي
  short: أبراج كيسيلو الأردوازية فوق أومالو، وقرى رعاة شمال خط تقسيم المياه القوقازي، وممرّ حصوي لا يُفتح
    إلا صيفاً.
  body: >-
    **تعيش توشيتي أربعة أشهر أو خمسة في السنة: فحين تغلق الثلوج ممرّ أبانو، ينزل الرعاة بقطعانهم إلى سهل
    كاخيتي، وتُترك أومالو للريح.**


    الطريق إليها هو الممرّ نفسه، على ارتفاع 2826 متراً، وهو من أعلى الطرق الصالحة للسيارات في القوقاز:
    نحو سبعين كيلومتراً من الحصى الضيق من بشافيلي، محفورة في سفح الجبل بلا حاجز واحد. وبعده تكون شمال
    خط تقسيم المياه الرئيسي، ما يضع توشيتي جغرافياً، وفق التعريف الشائع، في أوروبا، والشيشان وداغستان
    على القمم من حولها.


    أومالو أكبر القرى، وفوق أومالو السفلى يقف رمزها، قلعة كيسيلو. شُيّدت أبراجها الأردوازية المستدقة في
    ثلاثينيات القرن الثالث عشر، حين جاء المغول؛ وكانت ثلاثة عشر برجاً، وعند الغارات كان القرويون يتركون
    بيوتهم ويحتمون في داخلها. وبحلول القرن العشرين كان معظمها قد انهار. ومنذ عام 2003 أُعيد بناء خمسة
    منها بأساليب التوش القديمة، وعثر البناؤون على فؤوس من العصر البرونزي وحليّ ونقوش صخرية.


    التوش رعاة ومقاتلون. قروناً ظلّ رجالهم يقضون من أبريل إلى أكتوبر مع الأغنام في هذه الوديان، ويمضون
    الشتاء في زيمو ألفاني وكفيمو ألفاني، على مراعٍ منحهم إياها الملوك بعد انتفاضة باختريوني عام 1659،
    حين انضم مقاتلو التوش بقيادة زيزفا غابريندائولي إلى الثورة على الحكم الفارسي. وما زال العرف القديم
    يعدّ لحم الخنزير شؤماً، ولا يربّي كثير من المزارعين الخنازير؛ وفخر البيت جبن «غودا» التوشيّ من حليب
    الغنم، الذي يُعتَّق في كيس من جلد الخروف، والصوف الجيد.


    من أومالو تقود الدروب إلى شيناكو وديكلو، ودارتلو وتشيشو، وهي قرى تفصل بينها بضع ساعات مشياً، وتشكّل
    معاً مسار المشي الكلاسيكي.


    حين تزحف آخر سيارة جيب نازلة من الممرّ وتصمت المولّدات، تسمع ما كان في توشيتي دائماً بوفرة: الريح
    والماء وأجراس القطعان.
  tip: >-
    تعامل مع الرحلة كأنها بعثة استكشافية. تحتاج سيارة دفع رباعي حقيقية عالية عن الأرض، وسائقاً مرتاحاً
    على الحصى المكشوف فوق الهاوية، وعليك أن تتأكد مسبقاً من أن عقد الإيجار يسمح بممرّ أبانو؛ فكثير من
    العقود تستثنيه، راجع /terms/. خطّط لليلتين على الأقل. لا يوجد صرّاف آلي في أي مكان في توشيتي، فاحمل
    نقداً كافياً لبيوت الضيافة، ومعظمها يقدّم وجبات منزلية. الليالي باردة حتى في أغسطس؛ خذ ملابس دافئة
    وأخرى للمطر وأدويتك الخاصة، فالمساعدة على بعد ساعات. احمل جواز سفرك، فالمنطقة متاخمة لروسيا. تغطية
    الهاتف متقطعة. في عطلات نهاية الأسبوع في يوليو وأغسطس تمتلئ بيوت الضيافة، فاحجز مسبقاً.
  route: >-
    من تبليسي اعبر ممرّ غومبوري (Sh38) إلى تيلافي وتابع إلى أخميتا، ثم شمالاً صعوداً مع نهر ألازاني حتى
    بشافيلي: نحو 150 كم من الإسفلت في قرابة ساعتين ونصف. املأ الخزان في أخميتا، فلا وقود بعدها حتى أومالو.
    في بشافيلي تبدأ الرحلة الحقيقية: سبعون كيلومتراً من الحصى عبر ممرّ أبانو، تستغرق واقعياً أربع ساعات
    أو أكثر، صاعدةً عبر غابة الزان إلى قمم جرداء ومنعطفات حادة فوق هاويات عمودية. المجموع نحو 220 كم وست
    ساعات ونصف بلا توقف. يُفتح الطريق عادة في يونيو ويُغلق مع أول ثلج كثيف في الخريف؛ والانهيارات الأرضية
    شائعة بعد المطر. لسيارات الطرق الوعرة (فئة أوف رود) فقط.
