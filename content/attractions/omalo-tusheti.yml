ka:
  name: ომალო და თუშეთი
  short: >-
    საქართველოს ყველაზე იზოლირებული მთიანი კუთხე აბანოს უღელტეხილის მიღმა — მხოლოდ 4x4, მხოლოდ ივნისიდან
    ოქტომბრამდე.
  body: >-
    თუშეთი კავკასიონის მთავარი ქედის ჩრდილოეთით მდებარეობს და მასთან ერთადერთი გზა **აბანოს უღელტეხილზე**
    გადის — 2850 მეტრი, სამოცდაათი კილომეტრი გრუნტი ფშაველიდან ომალომდე, ბოლომდე ვიწრო, გამოკვეთილი ფერდობზე
    და ბარიერების გარეშე. ეს მონაკვეთი მსოფლიოს ყველაზე სახიფათო გზების ჩამონათვალებში სისტემატურად ხვდება
    და ამ რეპუტაციას სავსებით იმსახურებს.


    ომალო რეგიონის ცენტრია: ქვემო ომალო — სოფელი სასტუმროებით და მაღაზიით, ზემო ომალო — ბორცვზე ასული,
    თუშური თავდაცვითი კოშკების კომპლექსით, რომელიც აქაური ლანდშაფტის სავიზიტო ბარათია. აქედან ბილიკები
    დიკლოს, შენაქოს, დართლოსა და ჭეშოს მიმართულებით მიდის; ეს სოფლები ერთმანეთისგან რამდენიმე საათის სავალზეა
    და მრავალდღიანი ლაშქრობის კლასიკურ მარშრუტს ქმნის.


    გზა, როგორც წესი, ივნისის დასაწყისში იხსნება და ოქტომბრის მიწურულს იკეტება. ზამთარში თუშეთი პრაქტიკულად
    დაცლილია — რჩება რამდენიმე ათეული ადამიანი, კავშირი კი მხოლოდ ვერტმფრენით. ამიტომ საზაფხულო ფანჯარა
    ვიწროა და ამინდი უღელტეხილზე შეიძლება რამდენიმე საათში შეიცვალოს. ინტერნეტი და მობილური კავშირი ფრაგმენტულია,
    ბანკომატი კი არსად არის. თუშეთი დაცული ლანდშაფტის ტერიტორიაა და აქაური სოფლების ქვის არქიტექტურა თითქმის
    უცვლელად შემორჩა. სასტუმროები საოჯახოა, კვება სახლისეული, ხოლო ელექტროენერგია ბევრგან მზის პანელებზე
    და გენერატორზე მუშაობს გარკვეული საათებით.
  tip: >-
    ეს არ არის ჩვეულებრივი გასვლა: აუცილებელია მაღალი გამავლობის 4x4 გამოცდილი მძღოლით, და გაქირავების
    პირობებში წინასწარ დააზუსტეთ, დაშვებულია თუ არა აბანოს უღელტეხილი — ბევრი კომპანია ამ მონაკვეთს კრძალავს.
    იხილეთ ჩვენი /terms/. მინიმუმ ორი ღამე დაგეგმეთ, ერთდღიანი გასვლა აზრს მოკლებულია. თან იქონიეთ ნაღდი
    ფული, საწვავი მარაგში, თბილი ტანსაცმელი და მედიკამენტები — ომალოში აფთიაქიც კი შეზღუდულია.
  route: >-
    თბილისიდან ახმეტამდე და შემდეგ ფშაველამდე გზა ასფალტიანია — დაახლოებით 150 კმ, ორ საათ ნახევარში.
    ფშავლიდან იწყება მთავარი მონაკვეთი: სამოცდაათი კილომეტრი გრუნტი აბანოს უღელტეხილზე, რომელსაც რეალურად
    ოთხი საათი მაინც სჭირდება. სულ 220 კმ და ექვსნახევარი საათი, გაჩერებების გარეშე. ბოლო ბენზინგასამართი
    ახმეტაშია — ომალომდე საწვავი აღარსად არის, ამიტომ ავზი სავსე უნდა იყოს. წვიმის შემდეგ მონაკვეთი მკვეთრად
    უარესდება და ღვარცოფებიც ხშირია.
en:
  name: Omalo and Tusheti
  short: Georgia's most isolated mountain region, beyond the Abano Pass — 4x4 only, and only from June
    to October.
  body: >-
    Tusheti lies north of the main ridge of the Caucasus, and the only way in is over the **Abano Pass**
    at 2,850 metres: seventy kilometres of gravel from Pshaveli to Omalo, narrow the whole way, cut into
    the slope, with no barriers. The road appears regularly on lists of the world's most dangerous drives,
    and it earns the reputation honestly. This is the single hardest constraint of any trip in Georgia
    and it dictates everything else about the visit.


    Omalo is the regional centre. Lower Omalo is the village with guesthouses and a shop; Upper Omalo
    sits on the hill above it around a cluster of Tushetian defensive towers that has become the visual
    signature of the region. Trails run out from here to Diklo, Shenako, Dartlo and Chesho, villages a
    few hours apart on foot that form the classic multi-day trekking circuit.


    The road normally opens in early June and closes at the end of October. In winter Tusheti empties
    almost completely — a few dozen people stay, reachable only by helicopter. The summer window is therefore
    short, and weather on the pass can turn within a couple of hours. Mobile coverage and internet are
    patchy, and there is no ATM anywhere in the region.
  tip: >-
    This is not an ordinary day out. You need a genuine high-clearance 4x4 and a driver comfortable with
    exposed gravel, and you must confirm in advance whether your rental agreement permits the Abano Pass
    — many companies explicitly exclude it; see our /terms/. Plan at least two nights, since a day trip
    makes no sense. Carry cash, spare fuel, warm layers and your own medication: even the pharmacy in
    Omalo is minimal, and the nearest hospital is hours away.
  route: >-
    From Tbilisi to Akhmeta and on to Pshaveli the road is asphalt — about 150 km covered in two and a
    half hours. At Pshaveli the real section begins: seventy kilometres of gravel over the Abano Pass,
    which realistically takes four hours or more. That gives 220 km and around six and a half hours in
    total without stops. The last fuel station is in Akhmeta; there is none between there and Omalo, so
    start with a full tank. After rain the surface deteriorates sharply and landslides are common.
ru:
  name: Омало и Тушети
  short: Самый изолированный горный край Грузии за Абанским перевалом — только 4x4 и только с июня по
    октябрь.
  body: >-
    Тушети лежит к северу от главного хребта Кавказа, и единственный путь туда идёт через **Абанский перевал**
    высотой 2850 метров: семьдесят километров грунта от Пшавели до Омало, узкого на всём протяжении, вырубленного
    в склоне и без отбойников. Эта дорога регулярно попадает в списки самых опасных в мире и заслуживает
    свою репутацию честно. Именно она — главное ограничение всей поездки, и она диктует всё остальное.


    Омало — центр региона. Нижнее Омало это село с гостевыми домами и магазином, Верхнее стоит на холме
    вокруг группы тушинских оборонительных башен, ставших визуальной эмблемой края. Отсюда тропы уходят
    в Дикло, Шенако, Дартло и Чешо — сёла в нескольких часах ходьбы друг от друга, образующие классический
    многодневный трекинговый круг.


    Дорогу обычно открывают в начале июня и закрывают в конце октября. Зимой Тушети практически пустеет:
    остаётся несколько десятков человек, добраться к ним можно только вертолётом. Летнее окно поэтому
    короткое, а погода на перевале меняется за пару часов. Мобильная связь и интернет работают урывками,
    банкомата в регионе нет нигде.
  tip: >-
    Это не обычная поездка на день. Нужен настоящий внедорожник с большим клиренсом и водитель, спокойно
    чувствующий себя на открытом грунте, а в договоре аренды заранее уточните, разрешён ли Абанский перевал
    — многие компании его прямо исключают, см. наши /terms/. Планируйте минимум две ночи, однодневная
    вылазка лишена смысла. Берите наличные, запас топлива, тёплые вещи и свои лекарства: аптека в Омало
    минимальная.
  route: >-
    От Тбилиси до Ахметы и далее до Пшавели дорога асфальтовая — около 150 км, которые проходятся за два
    с половиной часа. В Пшавели начинается основной участок: семьдесят километров грунта через Абанский
    перевал, на которые реально уходит четыре часа и больше. Итого 220 км и примерно шесть с половиной
    часов без остановок. Последняя заправка — в Ахмете, между ней и Омало топлива нет, так что выезжайте
    с полным баком. После дождя покрытие резко ухудшается, часты оползни и сели.
fa:
  name: اومالو و توشتی
  short: منزوی‌ترین منطقهٔ کوهستانی گرجستان، آن‌سوی گردنهٔ آبانو — فقط با 4x4 و فقط از ژوئن تا اکتبر.
  body: >-
    توشتی شمال ستیغ اصلی قفقاز قرار دارد و تنها راه ورود به آن از **گردنهٔ آبانو** در ارتفاع 2,850 متر
    است: هفتاد کیلومتر جادهٔ شنی از پشاولی تا اومالو، در تمام طول باریک، بریده در دامنه و بدون هیچ حفاظ.
    این جاده مرتب در فهرست خطرناک‌ترین جاده‌های جهان می‌آید و این شهرت را صادقانه به دست آورده است. این
    سخت‌ترین محدودیت هر سفری در گرجستان است و هر چیز دیگری در این بازدید را تعیین می‌کند.


    اومالو مرکز منطقه است. اومالوی پایین روستایی با مهمان‌خانه و مغازه است؛ اومالوی بالا روی تپهٔ بالای
    آن و گرد مجموعه‌ای از برج‌های دفاعی توشتی نشسته که به نشانهٔ بصری منطقه بدل شده‌اند. از اینجا بیلیک‌ها
    به دیکلو، شناکو، دارتلو و چشو می‌روند، روستاهایی که چند ساعت پیاده از هم فاصله دارند و مدار کلاسیک
    پیمایش چندروزه را می‌سازند.


    جاده معمولاً اوایل ژوئن باز می‌شود و پایان اکتبر بسته. در زمستان توشتی تقریباً کاملاً خالی می‌شود
    — چند ده نفر می‌مانند که تنها با بالگرد به آن‌ها می‌توان رسید. پنجرهٔ تابستانی بنابراین کوتاه است
    و هوا روی گردنه می‌تواند در عرض دو ساعت برگردد. پوشش تلفن همراه و اینترنت ناهموار است و در سراسر منطقه
    هیچ خودپردازی وجود ندارد.
  tip: >-
    این یک گردش معمولی یک‌روزه نیست. به یک 4x4 واقعی با ارتفاع کف بالا نیاز دارید و به راننده‌ای که با
    جادهٔ شنی و بی‌حفاظ راحت باشد، و باید از پیش تأیید کنید که آیا قرارداد اجارهٔ شما گردنهٔ آبانو را
    مجاز می‌داند — بسیاری از شرکت‌ها آن را صریحاً مستثنا می‌کنند؛ /terms/ ما را ببینید. دست‌کم دو شب برنامه‌ریزی
    کنید، چون سفر یک‌روزه هیچ معنایی ندارد. پول نقد، سوخت یدکی، لایه‌های گرم و داروی خودتان را همراه ببرید:
    حتی داروخانهٔ اومالو حداقلی است و نزدیک‌ترین بیمارستان ساعت‌ها فاصله دارد.
  route: >-
    از تفلیس تا آخمتا و از آنجا تا پشاولی جاده آسفالت است — حدود 150 کیلومتر که در دو ساعت و نیم طی می‌شود.
    در پشاولی بخش اصلی آغاز می‌شود: هفتاد کیلومتر جادهٔ شنی روی گردنهٔ آبانو که واقع‌بینانه چهار ساعت
    یا بیشتر وقت می‌گیرد. روی هم 220 کیلومتر و حدود شش ساعت و نیم بدون توقف. آخرین جایگاه سوخت در آخمتا
    است؛ میان آنجا و اومالو هیچ جایگاهی نیست، پس با باک پر راه بیفتید. پس از باران سطح جاده به‌شدت بدتر
    می‌شود و رانش زمین رایج است.
he:
  name: אומאלו וטושתי
  short: אזור ההרים המבודד ביותר בגאורגיה, מעבר למעבר אבאנו — רק ברכב 4x4, ורק מיוני עד אוקטובר.
  body: >-
    טושתי שוכנת מצפון לרכס הראשי של הקווקז, והדרך היחידה להיכנס אליה עוברת ב**מעבר אבאנו** בגובה 2,850
    מטר: שבעים קילומטרים של חצץ מפשאוולי לאומאלו, צרים לכל אורכם, חצובים במדרון וללא מעקות בטיחות כלל.
    הכביש מופיע באופן קבוע ברשימות הנסיעות המסוכנות בעולם, והוא הרוויח את המוניטין הזה ביושר. זהו האילוץ
    הקשה ביותר בכל טיול בגאורגיה, והוא מכתיב את כל שאר פרטי הביקור.


    אומאלו היא מרכז האזור. אומאלו התחתונה היא הכפר שבו בתי הארחה וחנות; אומאלו העליונה יושבת על הגבעה
    שמעליה סביב אשכול של מגדלי הגנה טושתיים שהפך לסמל החזותי של האזור. מכאן יוצאים שבילים אל דיקלו, שנאקו,
    דארטלו וצ'שו, כפרים המרוחקים זה מזה כמה שעות הליכה ומרכיבים את מסלול הטרק הרב-יומי הקלאסי.


    הכביש נפתח בדרך כלל בתחילת יוני ונסגר בסוף אוקטובר. בחורף טושתי מתרוקנת כמעט לחלוטין — נשארים בה כמה
    עשרות אנשים, שאפשר להגיע אליהם רק במסוק. חלון הקיץ קצר אפוא, ומזג האוויר במעבר עלול להתהפך בתוך שעתיים.
    הקליטה הסלולרית והאינטרנט אינם אחידים, ואין באזור כולו שום כספומט.
  tip: >-
    זהו אינו טיול יום רגיל. אתם זקוקים לרכב 4x4 אמיתי עם גובה גחון גבוה ולנהג שנוח לו על חצץ חשוף, ואתם
    חייבים לוודא מראש אם הסכם ההשכרה שלכם מתיר את מעבר אבאנו — חברות רבות מחריגות אותו במפורש; ראו את
    /terms/ שלנו. תכננו לפחות שתי לינות, שכן לטיול יום אין שום היגיון. קחו מזומן, דלק רזרבי, שכבות חמות
    ותרופות משלכם: אפילו בית המרקחת באומאלו מינימלי, ובית החולים הקרוב ביותר נמצא במרחק שעות.
  route: >-
    מטביליסי לאחמטה והלאה לפשאוולי הכביש סלול — כ-150 ק"מ שנעשים בשעתיים וחצי. בפשאוולי מתחיל הקטע האמיתי:
    שבעים קילומטרים של חצץ מעל מעבר אבאנו, שלוקחים באופן מציאותי ארבע שעות ויותר. כך מתקבלים 220 ק"מ וכשש
    שעות וחצי בסך הכול בלי עצירות. תחנת הדלק האחרונה נמצאת באחמטה; בין שם לאומאלו אין אף אחת, לכן צאו
    עם מיכל מלא. אחרי גשם מצב פני הדרך מתדרדר בחדות ומפולות אדמה שכיחות.
ar:
  name: أومالو وتوشيتي
  short: أكثر مناطق جورجيا الجبلية عزلة، خلف ممر أبانو — بسيارة 4x4 وحدها، ومن يونيو إلى أكتوبر فقط.
  body: >-
    تقع توشيتي شمال السلسلة الرئيسية للقوقاز، والسبيل الوحيد إليها هو **ممر أبانو** على ارتفاع 2,850 متراً:
    سبعون كيلومتراً من الحصى بين بشافيلي وأومالو، ضيقة طوال المسافة، محفورة في المنحدر، وبلا أي حواجز
    حماية. ويظهر هذا الطريق بانتظام في قوائم أخطر طرق العالم، وهو يستحق تلك السمعة عن جدارة. وهذا أصعب
    قيد في أي رحلة داخل جورجيا، وهو يحكم كل تفصيل آخر في الزيارة.


    أومالو هي مركز الإقليم. أومالو السفلى هي القرية التي فيها بيوت الضيافة ومتجر؛ وأومالو العليا تقوم
    على التل فوقها حول مجموعة من أبراج توشيتي الدفاعية التي صارت العلامة البصرية للإقليم. ومن هنا تمتد
    الدروب إلى ديكلو وشيناكو ودارتلو وتشيشو، وهي قرى تفصل بينها بضع ساعات سيراً وتشكل حلقة الترحال الكلاسيكية
    متعددة الأيام.


    يُفتح الطريق عادة في أوائل يونيو ويُغلق في أواخر أكتوبر. وفي الشتاء تكاد توشيتي تخلو تماماً — يبقى
    فيها بضع عشرات من الناس، ولا يُوصل إليهم إلا بالمروحية. ولذلك فالنافذة الصيفية قصيرة، وقد ينقلب الطقس
    على الممر خلال ساعتين. وتغطية الهاتف والإنترنت متقطعة، ولا يوجد صراف آلي واحد في الإقليم كله.
  tip: >-
    هذه ليست نزهة يوم عادية. تحتاج إلى سيارة 4x4 حقيقية عالية الخلوص وإلى سائق مرتاح على الحصى المكشوف،
    وعليك أن تتأكد مسبقاً مما إذا كان عقد الإيجار يسمح بممر أبانو — فكثير من الشركات تستثنيه صراحة؛ راجع
    /terms/ لدينا. خطط لليلتين على الأقل، فرحلة اليوم الواحد لا معنى لها. واحمل نقداً ووقوداً احتياطياً
    وطبقات دافئة وأدويتك الخاصة: فحتى صيدلية أومالو محدودة جداً، وأقرب مستشفى على بعد ساعات.
  route: >-
    من تبليسي إلى أخميتا ثم إلى بشافيلي يكون الطريق معبّداً — نحو 150 كم تُقطع في ساعتين ونصف. وعند بشافيلي
    يبدأ المقطع الحقيقي: سبعون كيلومتراً من الحصى فوق ممر أبانو، تستغرق واقعياً أربع ساعات أو أكثر. وهذا
    يعطي 220 كم ونحو ست ساعات ونصف إجمالاً من دون توقف. وآخر محطة وقود في أخميتا؛ ولا توجد أي محطة بينها
    وبين أومالو، فانطلق بخزان ممتلئ. وبعد المطر يتدهور سطح الطريق بحدة وتكثر الانهيارات الأرضية.
