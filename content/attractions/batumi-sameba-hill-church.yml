ka:
  name: ბათუმის სამების ეკლესია
  short: >-
    1976 წელს დამწვარი და 2002 წლიდან ხელახლა აგებული ეკლესია ბათუმის თავზე — ქალაქის, ყურისა და ზღვის
    საუკეთესო ხედით მზის ჩასვლისას.
  body: >-
    **ბათუმსაც აქვს თავისი სამება — თბილისის საკათედრო ტაძარზე ბევრად მცირე და ქალაქზე ბევრად მაღლა შემდგარი:
    გორაკის თავზე ეკლესია, რომელიც დახურეს, დაიწვა და ორჯერ აღადგინეს, ყურის ყველაზე კარგი ხედი კი ისევ
    მას ეკუთვნის.**


    პირველი ეკლესია XIX საუკუნის მეორე ნახევარში ააგეს, ქალაქის აღმოსავლეთით აზიდულ გორაზე, იქ, სადაც
    მანამდე სასაფლაო იყო. საბჭოთა ხელისუფლებამ იგი დახურა და სასოფლო-სამეურნეო ინვენტარის საწყობად აქცია.
    1947 წელს ბათუმის მრავალეროვანმა მართლმადიდებლურმა თემმა ტაძარი დაიბრუნა: გრიგოლ პუხნოსა და ლუკა შევჩუკის
    მეთაურობით მრევლმა ხელმოწერები შეაგროვა და კათოლიკოს-პატრიარქ კალისტრატეს (ცინცაძეს) მიმართა. კარი
    კვლავ გაიღო. ხალხმა შინიდან ხატები და საღვთისმსახურო წიგნები მოიტანა, შევჩუკმა კი მალე ოცდაათკაციანი
    საეკლესიო გუნდი შეკრიბა.


    1976 წელს ხანძარმა ეკლესია მთლიანად გაანადგურა. ახლის მშენებლობა ძველ საძირკველზე 2002 წლის 7 სექტემბერს
    დაიწყო; ხარჯი რუსეთში მოღვაწე ქართველმა ბიზნესმენმა შალვა ბრეუსმა გაიღო. დღეს გორაზე ორი ეკლესიისგან
    შემდგარი პატარა მონასტერია, ტაძრის უკან კი დედათა სავანე დგას.


    მნახველთა უმეტესობა მაინც ხედისთვის ამოდის და ტყუილად არა. ქვემოთ მთელი ბათუმი რუკასავით იშლება: ახალი
    სანაპიროს კოშკები, ყურის რკალი, მის იქით კი — ღია შავი ზღვა. საღამოს მზე პირდაპირ თქვენს თვალწინ ჩადის
    წყალში, ქალაქში კი სათითაოდ ინთება შუქი.


    ქვა აქ ახალია. ახალი არ არის ის სიჯიუტე, რომელიც ამ გორაზე ეკლესიას ისევ და ისევ აბრუნებს.
  tip: >-
    შესვლა უფასოა. ეკლესია, როგორც წესი, დილის ათიდან საღამომდეა ღია, ლიტურგია კი შაბათობით აღევლინება.
    ეს მოქმედი მონასტერია: მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაბურავსა და ქვედაბოლოს
    შესასვლელთან ათხოვებენ. ამოდით მზის ჩასვლამდე ერთი საათით ადრე — მზე ზღვაში სწორედ თქვენს პირდაპირ
    ჩადის. ზემოთ სადგომი ცოტაა, გზისპირა ადგილისთვის ადგილობრივები ზოგჯერ ერთ-ორ ლარს ითხოვენ. კაფე აქ
    არ არის, ამიტომ წყალი თან იქონიეთ. დაღმართზე დაბალ გადაცემაზე ჩადით და მუხრუჭებს გაუფრთხილდით.
  route: >-
    თბილისიდან ს1-ით (E60) დასავლეთით იარეთ, ქუთაისის გავლით სამტრედიამდე, იქიდან ს12-ით (E692) ლანჩხუთის
    გავლით ზღვაზე, გრიგოლეთამდე, შემდეგ კი ს2-ით (E70) სამხრეთით, ქობულეთის გავლით, ბათუმამდე. ეკლესიამდე
    სულ 372 კილომეტრი და დაახლოებით 5 საათი და 40 წუთია, ბოლომდე ასფალტზე. ქალაქის აღმოსავლეთ ნაწილში,
    ბონი-გოროდოკში, სამების მიმართულებით გადაუხვიეთ და ვიწრო, ციცაბო გზით გორაზე ამოდით. იარეთ ამ გვერდის
    კოორდინატებით ან ნავიგატორში ჩაწერეთ „სამების ეკლესია, ბათუმი“; ეკლესია ქალაქის საზღვარს ოდნავ იქით,
    ხელვაჩაურის მუნიციპალიტეტის სოფელ ქვედა სამებაში დგას. საწვავი მთელ გზაზეც და ბათუმშიც უხვადაა. ეკონომ-კლასის
    მანქანა საკმარისია: აქ ერთადერთი სირთულე დაქანებაა.
en:
  name: Holy Trinity Church, Mount Sameba (Batumi)
  short: >-
    Burnt in 1976 and rebuilt from 2002, this hilltop church east of Batumi keeps the finest view over
    the city, the bay and the sea at sunset.
  body: >-
    **Batumi has a Sameba of its own: far smaller than Tbilisi's cathedral and set far higher above its
    city, a hilltop church that has been shut, burnt and brought back twice, and still holds the best
    seat over the bay.**


    The first church went up in the second half of the 19th century on a hill east of the city, on ground
    that had been a cemetery. Soviet rule closed it and turned it into a store for farm equipment. In
    1947 Batumi's mixed Orthodox community won it back: parishioners led by Grigol Pukhno and Luka Shevchuk
    gathered signatures and petitioned Catholicos-Patriarch Kalistrate Tsintsadze, and the doors opened
    again. People carried icons and service books up from their own homes, and Shevchuk soon had a choir
    of thirty.


    In 1976 fire destroyed the church completely. Work on a new one, on the old foundations, began on
    7 September 2002, paid for by Shalva Breus, a Georgian businessman based in Russia. Today two churches
    form a small monastery on the summit, with a nunnery standing behind the main church.


    Most people still climb up for the view, and it repays them. The whole of Batumi lies open below like
    a map: the towers of the new seafront, the curve of the bay and, beyond it, the open Black Sea. In
    the evening the sun goes down into the water straight ahead of you while the city's lights come on
    one by one.


    The stone here is new. The stubbornness that keeps putting a church back on this hill is not.
  tip: >-
    Entry is free. The church is generally open from about 10 am into the early evening, and the liturgy
    is served on Saturdays. This is a working monastery, so cover shoulders and knees; women are lent
    headscarves and skirts at the entrance. Come an hour before sunset, when the sun sinks into the sea
    directly in front of you. Parking at the top is scarce, and locals sometimes ask a lari or two for
    a roadside space. There is no café, so bring water. On the way down, stay in a low gear and spare
    the brakes.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, the S12 (E692) through Lanchkhuti to
    the coast at Grigoleti, and the S2 (E70) south through Kobuleti to Batumi. To the church it is 372
    km and about 5 hours 40 minutes, asphalt all the way. On the eastern side of the city, in the Boni-Gorodok
    district, turn off towards Sameba and climb the narrow, steep lane up the hill. Navigate by the coordinates
    on this page, or type 'Sameba Church, Batumi'; the church stands just over the city line, in the village
    of Kveda Sameba (Khelvachauri municipality). Fuel is plentiful along the route and in Batumi. An economy
    car is enough: the only difficulty is the gradient.
ru:
  name: Церковь Святой Троицы на горе Самеба (Батуми)
  short: >-
    Сгоревшая в 1976 году и заново отстроенная после 2002 года, эта церковь на холме к востоку от Батуми
    хранит лучший вид на город, бухту и закатное море.
  body: >-
    **У Батуми есть своя Самеба: куда скромнее тбилисского собора и куда выше вознесённая над своим городом.
    Эту церковь на вершине холма закрывали, она сгорела, дважды её возвращали к жизни — и она по-прежнему
    занимает лучшее место над бухтой.**


    Первая церковь появилась во второй половине XIX века на холме к востоку от города, на месте бывшего
    кладбища. Советская власть закрыла её и превратила в склад сельхозтехники. В 1947 году православная
    община Батуми, пёстрая по составу, добилась её возвращения: прихожане во главе с Григолом Пухно и
    Лукой Шевчуком собрали подписи и обратились к Католикосу-Патриарху Каллистрату Цинцадзе, и двери храма
    открылись вновь. Люди несли наверх иконы и богослужебные книги из собственных домов, а Шевчук вскоре
    собрал хор из тридцати человек.


    В 1976 году пожар уничтожил церковь дотла. Строительство новой, на старом фундаменте, началось 7 сентября
    2002 года на средства Шалвы Бреуса, грузинского бизнесмена, живущего в России. Сегодня две церкви
    образуют на вершине небольшой монастырь, а за главным храмом стоит женская обитель.


    Большинство по-прежнему поднимается сюда ради вида — и не зря. Весь Батуми лежит внизу, как на карте:
    башни новой набережной, изгиб бухты, а за ней — открытое Чёрное море. Вечером солнце опускается в
    воду прямо перед вами, а в городе один за другим зажигаются огни.


    Камень здесь новый. Упрямство, которое снова и снова возвращает на этот холм церковь, — нет.
  tip: >-
    Вход свободный. Церковь обычно открыта примерно с 10 утра до раннего вечера, литургию служат по субботам.
    Это действующий монастырь, поэтому плечи и колени должны быть закрыты; женщинам у входа выдают платки
    и юбки. Приезжайте за час до заката, когда солнце садится в море прямо перед вами. Парковки наверху
    мало, и местные иногда просят лари-другой за место у обочины. Кафе нет, так что возьмите с собой воду.
    На спуске держите пониженную передачу и берегите тормоза.
  route: >-
    Из Тбилиси — по S1 (E60) на запад мимо Кутаиси до Самтредиа, по S12 (E692) через Ланчхути к побережью
    у Григолети и по S2 (E70) на юг через Кобулети до Батуми. До церкви 372 км, около 5 часов 40 минут,
    всё время по асфальту. В восточной части города, в районе Бони-Городок, сверните к Самебе и поднимайтесь
    на холм по узкому крутому переулку. Ориентируйтесь по координатам на этой странице или вбейте в навигатор
    «Sameba Church, Batumi»; церковь стоит сразу за городской чертой, в селе Кведа-Самеба (Хелвачаурский
    муниципалитет). Заправок по дороге и в Батуми много. Хватит и машины эконом-класса: единственная трудность
    — крутизна подъёма.
fa:
  name: کلیسای تثلیث مقدس، کوه سامه‌با (باتومی)
  short: >-
    این کلیسای بالای تپه در شرق باتومی، که در ۱۹۷۶ سوخت و از ۲۰۰۲ از نو ساخته شد، بهترین منظرهٔ شهر، خلیج
    و دریا را در غروب پیش چشم می‌گذارد.
  body: >-
    **باتومی سامه‌بای خودش را دارد: بسیار کوچک‌تر از کلیسای جامع تفلیس و بسیار بلندتر بر فراز شهرش. کلیسایی
    بر ستیغ تپه که بسته شد، سوخت و دو بار دوباره جان گرفت، و هنوز بهترین جایگاه تماشای خلیج از آنِ اوست.**


    نخستین کلیسا در نیمهٔ دوم سدهٔ نوزدهم بر تپه‌ای در شرق شهر ساخته شد، بر زمینی که پیش‌تر گورستان بود.
    حکومت شوروی آن را بست و به انبار ماشین‌آلات کشاورزی بدل کرد. در سال ۱۹۴۷ جامعهٔ ارتدوکس باتومی، که
    از قوم‌های گوناگون فراهم آمده بود، آن را پس گرفت: مؤمنان به رهبری گریگول پوخنو و لوکا شفچوک امضا گرد
    آوردند و به جاثلیق-پاتریارک کالیستراته تسینتسادزه عریضه نوشتند، و درها دوباره گشوده شد. مردم شمایل‌ها
    و کتاب‌های آیینی را از خانه‌های خود بالا آوردند و شفچوک به‌زودی گروه همسرایانی سی‌نفره فراهم کرد.


    در سال ۱۹۷۶ آتش کلیسا را یکسره نابود کرد. ساخت کلیسای تازه بر همان پی‌های قدیمی در ۷ سپتامبر ۲۰۰۲
    آغاز شد، با هزینهٔ شالوا برئوس، بازرگان گرجی ساکن روسیه. امروز دو کلیسا بر قله صومعه‌ای کوچک را شکل
    می‌دهند و پشت کلیسای اصلی دیری زنانه برپاست.


    بیشتر مردم هنوز برای منظره بالا می‌آیند، و منظره رنجشان را جبران می‌کند. سراسر باتومی همچون نقشه‌ای
    زیر پایتان گسترده است: برج‌های ساحل تازه‌ساز، انحنای خلیج و آن سوترش دریای سیاه بی‌کران. شامگاه خورشید
    درست روبه‌رویتان در آب فرو می‌رود و چراغ‌های شهر یکی‌یکی روشن می‌شوند.


    سنگ اینجا نو است. اما سرسختی‌ای که بارها کلیسا را به این تپه باز می‌گرداند، نو نیست.
  tip: >-
    ورود رایگان است. کلیسا معمولاً از حدود ساعت ۱۰ صبح تا اوایل شب باز است و مراسم لیتورژی (عشای ربانی)
    شنبه‌ها برگزار می‌شود. اینجا صومعه‌ای دایر است، پس شانه‌ها و زانوها را بپوشانید؛ دمِ در به بانوان
    روسری و دامن امانت می‌دهند. یک ساعت پیش از غروب بیایید، وقتی خورشید درست روبه‌رویتان در دریا فرو می‌رود.
    جای پارک در بالا کم است و گاهی اهالی برای جایی کنار جاده یکی دو لاری می‌خواهند. کافه‌ای نیست، پس آب
    همراه بیاورید. در سراشیبیِ برگشت با دندهٔ سنگین بروید و ترمزها را خسته نکنید.
  route: >-
    از تفلیس با S1 (E60) رو به غرب از کنار کوتائیسی تا سامتردیا بروید، با S12 (E692) از راه لانچخوتی تا
    ساحل در گریگولتی، و با S2 (E70) رو به جنوب از راه کوبولتی تا باتومی. تا کلیسا ۳۷۲ کیلومتر و حدود ۵
    ساعت و ۴۰ دقیقه راه است، سراسر آسفالت. در بخش شرقی شهر، در محلهٔ بونی-گورودوک، به سوی سامه‌با بپیچید
    و از کوچهٔ باریک و پرشیب از تپه بالا بروید. با مختصات همین صفحه مسیریابی کنید یا در مسیریاب عبارت
    «Sameba Church, Batumi» را بنویسید؛ کلیسا کمی آن سوی مرز شهر، در روستای کوِدا سامه‌با (شهرستان خلواچائوری)
    قرار دارد. در طول راه و در باتومی جایگاه سوخت فراوان است. خودروی اقتصادی کافی است: تنها دشواری، شیب
    است.
he:
  name: כנסיית השילוש הקדוש על הר סאמבה (בטומי)
  short: >-
    הכנסייה שעל הגבעה ממזרח לבטומי נשרפה ב-1976 ונבנתה מחדש החל מ-2002, ומחזיקה בתצפית היפה ביותר על העיר,
    המפרץ והים בשקיעה.
  body: >-
    **לבטומי יש סאמבה משלה: קטנה בהרבה מהקתדרלה של טביליסי ונישאת גבוה בהרבה מעל עירה. זו כנסייה בראש
    גבעה שנסגרה, נשרפה והוחזרה לחיים פעמיים, ועדיין מחזיקה במקום הטוב ביותר מעל המפרץ.**


    הכנסייה הראשונה נבנתה במחצית השנייה של המאה ה-19 על גבעה ממזרח לעיר, על קרקע ששימשה קודם לכן בית קברות.
    השלטון הסובייטי סגר אותה והפך אותה למחסן של ציוד חקלאי. ב-1947 הצליחה הקהילה האורתודוקסית של בטומי,
    קהילה מעורבת מבני עמים שונים, להחזיר אותה: חברי הקהילה, בהנהגת גריגול פוחנו ולוקה שבצ'וק, אספו חתימות
    ועתרו לקתוליקוס-הפטריארך קליסטרטה צינצדזה, והדלתות נפתחו מחדש. אנשים הביאו מבתיהם איקונות וספרי ליטורגיה,
    ושבצ'וק הקים עד מהרה מקהלה של שלושים זמרים.


    ב-1976 כילתה אש את הכנסייה כליל. העבודה על כנסייה חדשה, על היסודות הישנים, החלה ב-7 בספטמבר 2002,
    במימונו של שלווה ברוס, איש עסקים גאורגי שמושבו ברוסיה. כיום שתי כנסיות יוצרות בפסגה מנזר קטן, ומאחורי
    הכנסייה הראשית עומד מנזר נשים.


    רוב האנשים עדיין עולים לכאן בשביל הנוף, והוא מצדיק את הטיפוס. בטומי כולה פרושה למטה כמו מפה: מגדלי
    טיילת הים החדשה, קשת המפרץ, ומעבר לה הים השחור הפתוח. בערב השמש שוקעת אל המים ממש מולכם, ואורות העיר
    נדלקים בזה אחר זה.


    האבן כאן חדשה. העקשנות שמחזירה שוב ושוב כנסייה אל הגבעה הזאת — לא.
  tip: >-
    הכניסה חופשית. הכנסייה פתוחה בדרך כלל מסביבות 10 בבוקר ועד שעות הערב המוקדמות, והליטורגיה נערכת בשבתות.
    זהו מנזר פעיל, ולכן יש לכסות כתפיים וברכיים; בכניסה משאילים לנשים מטפחות ראש וחצאיות. הגיעו שעה לפני
    השקיעה, כשהשמש שוקעת אל הים ממש מולכם. החניה למעלה מועטה, ולפעמים מקומיים מבקשים לארי או שניים תמורת
    מקום בצד הדרך. אין בית קפה, אז הביאו מים. בירידה נסעו בהילוך נמוך וחסו על הבלמים.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה על פני קוטאיסי עד סמטרדיה, בכביש S12 (E692) דרך לנצ'חוטי אל החוף
    בגריגולטי, ובכביש S2 (E70) דרומה דרך קובולטי עד בטומי. עד הכנסייה 372 ק״מ וכ-5 שעות ו-40 דקות, כל
    הדרך על אספלט. בצד המזרחי של העיר, ברובע בוני-גורודוק, פנו לכיוון סאמבה וטפסו על הגבעה בסמטה הצרה
    והתלולה. נווטו לפי הקואורדינטות שבעמוד זה, או הקלידו 'Sameba Church, Batumi'; הכנסייה עומדת ממש מעבר
    לגבול העיר, בכפר קוודה סאמבה (מחוז חלוואצ'אורי). תחנות דלק יש בשפע לאורך הדרך ובבטומי. רכב חסכוני
    מספיק: הקושי היחיד הוא השיפוע.
ar:
  name: كنيسة الثالوث المقدس على جبل ساميبا (باتومي)
  short: >-
    احترقت عام 1976 وأُعيد بناؤها بدءاً من 2002، وتمنحك هذه الكنيسة على التلّ شرقي باتومي أجمل إطلالة
    على المدينة والخليج والبحر عند الغروب.
  body: >-
    **لباتومي «ساميبا» خاصة بها: أصغر كثيراً من كاتدرائية تبليسي وأعلى كثيراً فوق مدينتها. إنها كنيسة
    على قمة تلّ أُغلقت واحترقت وأُعيدت إلى الحياة مرتين، وما زالت تحتل أجمل موقع يطلّ على الخليج.**


    شُيّدت الكنيسة الأولى في النصف الثاني من القرن التاسع عشر على تلّ شرقي المدينة، فوق أرض كانت مقبرة.
    أغلقتها السلطة السوفييتية وحوّلتها إلى مخزن للآلات الزراعية. وفي عام 1947 استعادتها جماعة باتومي الأرثوذكسية
    المتعددة الأصول: جمع أبناء الرعية، بقيادة غريغول بوخنو ولوكا شيفتشوك، التواقيع ورفعوا التماساً إلى
    الكاثوليكوس البطريرك كاليستراتي تسينتسادزه، ففُتحت الأبواب من جديد. حمل الناس إليها الأيقونات وكتب
    الصلوات الطقسية من بيوتهم، وسرعان ما أسّس شيفتشوك جوقة من ثلاثين مرتّلاً.


    في عام 1976 أتى حريق على الكنيسة بالكامل. وبدأ العمل على كنيسة جديدة فوق الأساسات القديمة في 7 سبتمبر
    2002، بتمويل من شالفا بريوس، رجل الأعمال الجورجي المقيم في روسيا. واليوم تؤلف كنيستان على القمة ديراً
    صغيراً، ويقوم خلف الكنيسة الرئيسية دير للراهبات.


    ما زال معظم الزوار يصعدون من أجل المنظر، وهو يكافئهم على الصعود. تنبسط باتومي كلها في الأسفل كأنها
    خريطة: أبراج الواجهة البحرية الجديدة، وانحناءة الخليج، ومن ورائه البحر الأسود المفتوح. وفي المساء
    تغيب الشمس في الماء أمامك مباشرة، بينما تُضاء أنوار المدينة واحداً تلو الآخر.


    الحجر هنا جديد. أما العناد الذي يعيد الكنيسة إلى هذا التل مرة بعد مرة فليس جديداً.
  tip: >-
    الدخول مجاني. تفتح الكنيسة عادة من نحو الساعة 10 صباحاً حتى أول المساء، ويُقام القداس الإلهي أيام
    السبت. هذا دير عامر، فاستر كتفيك وركبتيك؛ وتُعار النساء عند المدخل أغطية للرأس وتنانير. تعال قبل الغروب
    بساعة، حين تغيب الشمس في البحر أمامك مباشرة. المواقف في الأعلى شحيحة، وقد يطلب بعض السكان لاري أو
    اثنين مقابل مكان على جانب الطريق. لا مقهى هنا، فأحضر معك الماء. وفي النزول ابقَ على غيار منخفض وأرِح
    المكابح.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي حتى سامترديا، ثم S12 (E692) عبر لانتشخوتي إلى
    الساحل عند غريغوليتي، ثم S2 (E70) جنوباً عبر كوبوليتي إلى باتومي. المسافة إلى الكنيسة 372 كم، نحو
    5 ساعات و40 دقيقة، على طريق معبّد طوال الوقت. في الجهة الشرقية من المدينة، في حي بوني-غورودوك، انعطف
    نحو ساميبا واصعد التل عبر الزقاق الضيق شديد الانحدار. اعتمد على الإحداثيات الواردة في هذه الصفحة،
    أو اكتب في جهاز الملاحة 'Sameba Church, Batumi'؛ فالكنيسة تقع خلف حدود المدينة بقليل، في قرية كفيدا
    ساميبا (بلدية خيلفاتشاوري). محطات الوقود كثيرة على الطريق وفي باتومي. تكفي سيارة اقتصادية: فالصعوبة
    الوحيدة هي شدة الانحدار.
