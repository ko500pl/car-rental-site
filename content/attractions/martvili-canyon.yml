ka:
  name: მარტვილის კანიონი
  short: >-
    ფირუზისფერი მდინარე კირქვის კედლებს შორის, ხის ბილიკებითა და მოკლე ნავით — სამეგრელოს ყველაზე პოპულარული
    ბუნებრივი ობიექტი.
  body: >-
    მარტვილის კანიონი მდინარე აბაშამ გამოკვეთა კირქვის ქანებში და დაახლოებით ორ კილომეტრზეა გაწოლილი.
    მისი ვიზუალური მთავარი მახასიათებელი წყლის ფერია: კირქვის მინერალები მდინარეს ტიპურ ფირუზისფერ-მოლურჯო
    ელფერს აძლევს, რომელიც განსაკუთრებით მკვეთრია მზიან დღეს, გაზაფხულის წყალდიდობის შემდეგ.


    ისტორიულად ეს ადგილი დადიანების, სამეგრელოს მთავრების, საბანაო ადგილი იყო — მათი გამოკვეთილი აუზი
    დღემდე ჩანს კლდეში. ტერიტორია დღეს დაცული ტერიტორიების სააგენტოს მართვაშია და მოწესრიგებულია: ხის
    ბილიკები კანიონის კედლებზეა მიმაგრებული, არის სახიდე გადასასვლელები და ხედის პლატფორმები. ცალკე, დამატებით
    საფასურად, ხელმისაწვდომია მოკლე გასეირნება სარეზინე ნავით — დაახლოებით 300 მეტრი კანიონის ვიწრო ნაწილში.


    რას მოიცავს ვიზიტი:


    - **ხის ბილიკი** კანიონის გასწვრივ ხედის რამდენიმე წერტილით

    - **პატარა ჩანჩქერები** გვერდითი ხეობებიდან, განსაკუთრებით სავსე გაზაფხულზე

    - **ნავით სეირნობა** — მოკლე, მაგრამ სწორედ ის აჩვენებს კანიონს ქვემოდან


    ვიზიტს ჩვეულებრივ საათნახევრიდან ორ საათამდე სჭირდება და მარშრუტი ბოლომდე მოწესრიგებულია, ამიტომ ბავშვებთან
    ერთადაც უპრობლემოდ გასავლელია. სიახლოვეს არის ბალდისა და გაჭედილის კანიონები, რომლებიც გაცილებით ნაკლებად
    ხალხმრავალია და ერთ დღეში კარგად ერწყმის მარტვილს. სამივე ერთად სამეგრელოს ტრანზიტული მონაკვეთიდან
    სრულფასოვან გაჩერებად აქცევს — და ეს ის იშვიათი შემთხვევაა, როცა ბუნებრივი ობიექტი მთელი წლის განმავლობაში
    მუშაობს და სეზონზე დამოკიდებული არაა.
  tip: >-
    მოდით დილით ან შუადღის შემდეგ: 11:00–15:00 შუალედში, განსაკუთრებით ზაფხულის შაბათ-კვირას, ნავზე რიგი
    ნახევარ საათს და მეტსაც აღწევს. ფეხსაცმელი მოცურავე ძირით აირჩიეთ — ხის ბილიკი წვიმის შემდეგ სრიალა
    ხდება. ნავში დაგასველებთ, ამიტომ ტელეფონი წყალგაუმტარ ჩანთაში ჩადეთ. შესასვლელთან არის პარკინგი, ტუალეტი
    და კაფე. გაზაფხულზე მდინარე მღვრიე და ძლიერია და ნავი ზოგჯერ საერთოდ არ მუშაობს — ეს წინასწარ გაითვალისწინეთ.
  route: >-
    თბილისიდან მარტვილამდე დაახლოებით 310 კმ და ოთხნახევარი საათია. E60-ით მიდიხართ დასავლეთისკენ გორის,
    ხაშურის, რიკოთის ახალი მაგისტრალისა და ქუთაისის გავლით, შემდეგ სამტრედიის მიმართულებით და ჩრდილოეთით
    მარტვილზე უხვევთ. მაგისტრალის მონაკვეთი მთლიანად კარგი ასფალტია, ბოლო 20 კმ კი ვიწრო, მაგრამ სრულიად
    გამართული რეგიონული გზაა. ეკონომ კლასის ავტომობილი სავსებით საკმარისია. საწვავი ქუთაისში ან სამტრედიაში
    აავსეთ; მარტვილში გასამართიც არის, მაგრამ არჩევანი მცირეა.
en:
  name: Martvili Canyon
  short: >-
    A turquoise river between limestone walls, with boardwalks and a short boat ride — Samegrelo's most
    visited natural site.
  body: >-
    Martvili Canyon was cut by the Abasha river through limestone and runs for roughly two kilometres.
    Its defining feature is the colour of the water: dissolved limestone gives the river a milky turquoise
    tone that is most intense on a sunny day once the spring flood has passed.


    Historically this was a bathing spot for the Dadiani princes of Mingrelia, and the pool they had carved
    into the rock is still visible. The site is now run by the Agency of Protected Areas and is properly
    developed: wooden walkways are fixed to the canyon walls, with footbridges and viewing platforms along
    the way. For an additional fee there is a short inflatable-boat ride, roughly 300 metres through the
    narrowest section.


    What a visit involves:


    - **A boardwalk** along the canyon with several viewpoints

    - **Small side waterfalls** dropping in from tributary gullies, fullest in spring

    - **The boat trip** — brief, but the only way to see the walls from water level


    Most people spend an hour and a half to two hours here. Nearby are the Balda and Gachedili canyons,
    both considerably quieter, which combine well with Martvili into a single day. Together they make
    Samegrelo worth a stop rather than just a stretch of road on the way to Svaneti or the coast.
  tip: >-
    Come early or after mid-afternoon: between 11:00 and 15:00, especially on summer weekends, the queue
    for the boat can reach half an hour or more. Wear shoes with grip, as the boardwalk gets slippery
    after rain. You will get wet in the boat, so put your phone in a waterproof pouch. There is parking,
    a toilet and a cafe at the entrance. In early spring the river runs high and muddy and the boats sometimes
    do not operate at all, which is worth checking before you plan around it.
  route: >-
    Martvili is about 310 km and four and a half hours from Tbilisi. Take the E60 west through Gori, Khashuri,
    the new Rikoti tunnel section and Kutaisi, continue toward Samtredia and then turn north to Martvili.
    The motorway part is good asphalt throughout, and the final 20 km is a narrow but entirely sound regional
    road. An economy car is perfectly adequate. Fill up in Kutaisi or Samtredia; there is fuel in Martvili
    town too, but the choice of stations is limited. The turn-off is signposted and easy to follow.
ru:
  name: Мартвильский каньон
  short: >-
    Бирюзовая река между известняковыми стенами, деревянные настилы и короткая прогулка на лодке — самый
    посещаемый природный объект Самегрело.
  body: >-
    Мартвильский каньон прорезан рекой Абаша в известняках и тянется примерно на два километра. Его визуальная
    особенность — цвет воды: растворённый известняк придаёт реке молочно-бирюзовый оттенок, наиболее насыщенный
    в солнечный день после спада весеннего паводка.


    Исторически здесь купались Дадиани, владетельные князья Мегрелии, и вырубленная в скале купальня сохранилась
    до сих пор. Сегодня территория находится в ведении Агентства охраняемых территорий и хорошо обустроена:
    к стенам каньона крепятся деревянные настилы, есть мостики и смотровые площадки. За отдельную плату
    предлагается короткая прогулка на надувной лодке — около 300 метров по самой узкой части.


    Из чего состоит визит:


    - **Деревянная тропа** вдоль каньона с несколькими видовыми точками

    - **Небольшие боковые водопады** из притоков, самые полноводные весной

    - **Прогулка на лодке** — короткая, но только она показывает стены с воды


    Обычно здесь проводят полтора-два часа. Рядом расположены каньоны Балда и Гачедили, куда заметно менее
    людно; вместе с Мартвили они хорошо складываются в один день и превращают Самегрело из транзитного
    отрезка в полноценную остановку.
  tip: >-
    Приезжайте утром или после трёх часов дня: в промежутке с 11:00 до 15:00, особенно в летние выходные,
    очередь на лодку доходит до получаса и больше. Обувь выбирайте с цепким протектором — настил после
    дождя становится скользким. В лодке вас забрызгает, телефон уберите в непромокаемый чехол. У входа
    есть парковка, туалет и кафе. Ранней весной река мутная и высокая, лодки иногда не работают вовсе
    — это стоит уточнить заранее.
  route: >-
    От Тбилиси до Мартвили около 310 км и четыре с половиной часа. Едете по трассе E60 на запад через
    Гори, Хашури, новый Рикотский участок и Кутаиси, дальше в сторону Самтредиа и затем поворот на север
    к Мартвили. Магистральная часть — хороший асфальт на всём протяжении, последние 20 км представляют
    собой узкую, но вполне исправную региональную дорогу. Автомобиля эконом-класса достаточно. Заправляйтесь
    в Кутаиси или Самтредиа: в самом Мартвили заправки есть, но выбор невелик.
fa:
  name: کانیون مارتویلی
  short: رودی فیروزه‌ای میان دیواره‌های آهکی، با گذرگاه چوبی و قایق‌سواری کوتاه — پربازدیدترین جاذبهٔ
    طبیعی سامگرلو.
  body: >-
    کانیون مارتویلی را رود آباشا در سنگ آهک بریده است و نزدیک به دو کیلومتر امتداد دارد. ویژگی تعیین‌کنندهٔ
    آن رنگ آب است: آهک حل‌شده به رودخانه رنگی فیروزه‌ای و شیری می‌دهد که در روزی آفتابی و پس از فروکش
    کردن سیلاب بهاری از همیشه شدیدتر است.


    از نظر تاریخی اینجا آبتنی‌گاه شاهزادگان دادیانی سامگرلو بود و حوضچه‌ای که در سنگ برایشان کنده‌اند
    هنوز پیداست. امروز این محوطه زیر نظر آژانس مناطق حفاظت‌شده اداره می‌شود و به‌درستی توسعه یافته است:
    گذرگاه‌های چوبی به دیواره‌های کانیون مهار شده‌اند و در طول مسیر پل‌های پیاده و سکوهای دید هست. با
    پرداخت جداگانه، قایق‌سواری کوتاهی با قایق بادی هم ممکن است، تقریباً 300 متر در باریک‌ترین بخش.


    بازدید سه بخش دارد: **گذرگاه چوبی** در امتداد کانیون با چند نقطهٔ دید؛ **آبشارهای کوچک جانبی** که
    از دره‌های فرعی فرو می‌ریزند و در بهار پرآب‌ترین‌اند؛ و **قایق‌سواری** که کوتاه است اما تنها راه دیدن
    دیواره‌ها از سطح آب. بیشتر مردم یک ساعت و نیم تا دو ساعت اینجا می‌مانند. در همان حوالی کانیون‌های
    بالدا و گاچدیلی قرار دارند که به‌مراتب خلوت‌ترند و به‌خوبی با مارتویلی در یک روز جمع می‌شوند. این
    سه با هم سامگرلو را از یک تکه جاده در راه سوانتی یا ساحل به توقفی ارزشمند بدل می‌کنند.
  tip: >-
    زود بیایید یا پس از اواسط بعدازظهر: میان 11:00 و 15:00، به‌ویژه در آخر هفته‌های تابستان، صف قایق به
    نیم ساعت و بیشتر می‌رسد. کفشی با ته‌گیر خوب بپوشید، چون گذرگاه چوبی پس از باران لغزنده می‌شود. در
    قایق خیس می‌شوید، پس تلفن را در کیف ضدآب بگذارید. در ورودی پارکینگ، سرویس بهداشتی و کافه هست. اوایل
    بهار رودخانه پرآب و گل‌آلود است و قایق‌ها گاهی اصلاً کار نمی‌کنند؛ ارزش دارد پیش از برنامه‌ریزی این
    را بررسی کنید.
  route: >-
    از تفلیس تا مارتویلی حدود 310 کیلومتر و چهار ساعت و نیم است. با E60 رو به غرب از گوری، خاشوری، مقطع
    جدید تونل ریکوتی و کوتایسی می‌روید، به سوی سامتردیا ادامه می‌دهید و سپس رو به شمال به مارتویلی می‌پیچید.
    بخش بزرگراهی در تمام طول آسفالت خوبی دارد و 20 کیلومتر پایانی جادهٔ منطقه‌ای باریک اما کاملاً سالمی
    است. خودروی اقتصادی کاملاً کافی است. در کوتایسی یا سامتردیا باک را پر کنید؛ در خود شهر مارتویلی هم
    سوخت هست، اما انتخاب جایگاه‌ها محدود است. انشعاب علامت‌گذاری شده و پیدا کردنش آسان است.
he:
  name: קניון מרטווילי
  short: נהר טורקיז בין קירות גיר, עם שבילי עץ ושיט קצר בסירה — האתר הטבעי המבוקר ביותר בסמגרלו.
  body: >-
    קניון מרטווילי נחתך בידי נהר אבאשה בסלע גיר והוא נמשך כשני קילומטרים. המאפיין המובהק שלו הוא צבע המים:
    הגיר המומס מעניק לנהר גוון טורקיז חלבי, שעוצמתו הגדולה ביותר ביום שמשי לאחר שגאות האביב שוככת.


    מבחינה היסטורית זה היה מקום הרחצה של נסיכי דדיאני מסמגרלו, והבריכה שחצבו להם בסלע נראית עד היום. כיום
    מנוהל האתר בידי הסוכנות לשטחים מוגנים והוא מפותח כראוי: שבילי עץ מעוגנים אל קירות הקניון, ולאורך הדרך
    גשרונים ומרפסות תצפית. בתשלום נוסף אפשר לצאת לשיט קצר בסירת גומי, כ-300 מטר דרך הקטע הצר ביותר של
    הערוץ.


    הביקור מורכב משלושה חלקים: **שביל העץ** לאורך הקניון עם כמה נקודות תצפית; **מפלים צדדיים קטנים** היורדים
    מערוצי יובלים ומלאים במיוחד באביב; ו**השיט בסירה**, שהוא קצר אך היחיד שמראה את הקירות מגובה פני המים.
    רוב האנשים מבלים כאן שעה וחצי עד שעתיים. בקרבת מקום נמצאים הקניונים בלדה וגצ'דילי, שקטים בהרבה, והם
    משתלבים היטב עם מרטווילי ליום אחד. יחד הם הופכים את סמגרלו לעצירה של ממש ולא רק לקטע כביש בדרך לסוואנטי
    או לחוף.
  tip: >-
    הגיעו מוקדם או אחרי אמצע אחר הצהריים: בין 11:00 ל-15:00, בעיקר בסופי שבוע של קיץ, התור לסירה מגיע
    לחצי שעה ויותר. נעלו נעליים עם אחיזה, כי שביל העץ נעשה חלקלק אחרי גשם. בסירה תירטבו, לכן הכניסו את
    הטלפון לנרתיק אטום למים. בכניסה יש חניה, שירותים ובית קפה. בתחילת האביב הנהר גבוה ועכור והסירות לפעמים
    אינן פועלות כלל, וכדאי לברר זאת לפני שבונים על כך תוכנית.
  route: >-
    ממרטווילי לטביליסי כ-310 ק"מ וארבע שעות וחצי. סעו בכביש E60 מערבה דרך גורי, חשורי, קטע מנהרות ריקוטי
    החדש וקוטאיסי, המשיכו לכיוון סמטרדיה ואז פנו צפונה למרטווילי. חלק הכביש המהיר הוא אספלט טוב לכל אורכו,
    ו-20 הקילומטרים האחרונים הם כביש אזורי צר אך תקין לחלוטין. רכב חסכוני מספיק בהחלט. תדלקו בקוטאיסי
    או בסמטרדיה; גם בעיירה מרטווילי יש דלק, אך מבחר התחנות מצומצם. הפנייה מסומנת בשילוט וקל לעקוב אחריה.
ar:
  name: وادي مارتفيلي
  short: نهر فيروزي بين جدران كلسية، مع ممشى خشبي ورحلة قارب قصيرة — أكثر المواقع الطبيعية زيارة في سامغريلو.
  body: >-
    حفر نهر أباشا وادي مارتفيلي في الصخر الكلسي، ويمتد الوادي نحو كيلومترين. وأبرز ما يميزه لون الماء:
    فالكلس الذائب يمنح النهر لوناً فيروزياً حليبياً يبلغ أشده في يوم مشمس بعد انحسار فيضان الربيع.


    كان هذا الموقع تاريخياً مسبحاً لأمراء دادياني في سامغريلو، وما زال الحوض الذي نُحت لهم في الصخر ظاهراً
    حتى اليوم. وتديره اليوم وكالة المناطق المحمية، وهو مجهز على النحو المطلوب: ممرات خشبية مثبتة في جدران
    الوادي، وجسور صغيرة ومنصات إطلالة على طول الطريق. وبرسم إضافي هناك رحلة قصيرة بقارب مطاطي، نحو 300
    متر عبر أضيق مقاطع الوادي.


    تتألف الزيارة من ثلاثة عناصر: **الممشى الخشبي** بمحاذاة الوادي مع عدة نقاط إطلالة؛ و**شلالات جانبية
    صغيرة** تنزل من أودية الروافد وتبلغ ذروتها في الربيع؛ و**رحلة القارب**، وهي قصيرة لكنها الوسيلة الوحيدة
    لرؤية الجدران من مستوى الماء. ويقضي معظم الزوار هنا ساعة ونصفاً إلى ساعتين. وعلى مقربة يقع واديا بالدا
    وغاتشيديلي، وهما أهدأ بكثير، ويتكاملان مع مارتفيلي في يوم واحد. وهي مجتمعة تجعل سامغريلو محطة تستحق
    التوقف لا مجرد مقطع طريق نحو سفانيتي أو الساحل.
  tip: >-
    تعال مبكراً أو بعد منتصف العصر: بين 11:00 و15:00، وخصوصاً في عطلات الصيف، يبلغ الطابور على القارب
    نصف ساعة أو أكثر. البس حذاءً جيد التشبث، فالممشى الخشبي يصبح زلقاً بعد المطر. وستبتل في القارب، لذا
    ضع هاتفك في كيس مقاوم للماء. وعند المدخل موقف سيارات ودورة مياه ومقهى. وفي أوائل الربيع يجري النهر
    عالياً وعكراً وقد تتوقف القوارب تماماً، ويستحق الأمر التحقق قبل بناء برنامجك عليه.
  route: >-
    تبعد مارتفيلي عن تبليسي نحو 310 كم وأربع ساعات ونصف. اسلك الطريق E60 غرباً عبر غوري وخاشوري ومقطع
    نفق ريكوتي الجديد وكوتايسي، ثم تابع نحو سامتريديا وانعطف شمالاً إلى مارتفيلي. مقطع الطريق السريع إسفلت
    جيد طوال المسافة، وآخر 20 كم طريق إقليمي ضيق لكنه سليم تماماً. وسيارة اقتصادية كافية تماماً. املأ
    الخزان في كوتايسي أو سامتريديا؛ وفي بلدة مارتفيلي وقود أيضاً لكن خيارات المحطات محدودة. والمنعطف مُشار
    إليه باللافتات ومن السهل تتبعه.
