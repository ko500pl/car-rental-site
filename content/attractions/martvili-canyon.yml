ka:
  name: მარტვილის კანიონი
  short: >-
    აბაშის მუქი მწვანე წყალი 70 მეტრამდე სიმაღლის კირქვის კედლებს შორის: 700-მეტრიანი ბილიკი, მოკლე ნავით
    სეირნობა და დადიანების საბანაო.
  body: >-
    **მარტვილის ჩრდილოეთით მდინარე აბაშამ კირქვა ისე ღრმად ჩაჭრა, რომ ნავიდან ცა მწვანეკიდეებიან ვიწრო
    ლენტად იქცევა.**


    ოფიციალურად ეს გაჭედილის, იგივე აბაშის კანიონის ბუნების ძეგლია, მეზობელი სოფლის სახელით; ყველასთვის
    კი — მარტვილის კანიონი. ეს ერთი და იგივე ადგილია და არა ორი მეზობელი კანიონი. მისი სიგრძე 2,4 კილომეტრია,
    სიგანე 5–7, სიღრმე კი 50–70 მეტრი; შუა ნაწილში მდინარე 12–15-მეტრიან ჩანჩქერებად ეშვება. წყალი მუქი
    მწვანეა და მთელი წლის განმავლობაში ცივი.


    სამეგრელოს მთავრები, დადიანები, აქ ბანაობდნენ და ერთ მონაკვეთს დღესაც „დადიანების აბანო“ ჰქვია. ქვედა,
    „დადიანების ბილიკზე“ დიდი კირქვის ლოდებისგან ნაგები ოცდაათსაფეხურიანი კიბე წყლისკენ ჩადის; გადმოცემით,
    ამ კიბეზე გიორგი მთაწმინდელი და დავით აღმაშენებელი დადიოდნენ. სიახლოვეს XVIII–XIX საუკუნეების ორსართულიანი
    მეგრული წისქვილის ნაშთიც შემორჩა.


    ქვა ნებისმიერ გადმოცემაზე ბევრად ძველია. 2010 წელს ილიას სახელმწიფო უნივერსიტეტის ექსპედიციამ გაჭედილსა
    და ინჩხურს შორის დინოზავრების ოციოდე ნაკვალევი იპოვა, მათთან ერთად — საშუალო ზომის ბალახისმჭამელი
    დინოზავრების ძვლის ნატეხები, ზღვის ქვეწარმავლის, მოზაზავრის ნაშთები და ამონიტები; სწორედ ამ აღმოჩენებმა
    განაპირობა კანიონის დაცვა. ერთი წლის შემდეგ ახლომახლო მღვიმეებში პრეისტორიული ადამიანის ძვლები აღმოაჩინეს,
    მღვიმის დათვისა და ბიზონის ნაშთებთან ერთად.


    ინჩხურის ვიზიტორთა ცენტრიდან 700-მეტრიანი, ქვაფენილიანი ბილიკი ორი ხიდით სამ სადამკვირვებლო მოედანზე
    გადის, 300-მეტრიანი ნავით გასეირნება კი — რომელშიც ნიჩბის მოსმა თქვენც მოგიწევთ — ყველაზე ვიწრო მონაკვეთში
    შეგიყვანთ. კიდეებს ურთხელი, რცხილა, წაბლი და მურყანი მისდგომია, წვეთიან კედლებზე კი გვიმრები ჰკიდია.


    გახსნისთანავე მოდით, ტურისტული ავტობუსების ჩამოსვლამდე, როცა მხოლოდ ნიჩბის ხმა ისმის და ჩანჩქერისა,
    რომელიც ჯერ გესმით და მერე ხედავთ.
  tip: >-
    ღიაა ყოველდღე, 10:00–18:00. წერის მომენტისთვის ბილეთი უცხოელი ზრდასრულისთვის 20 ლარი ღირს, საქართველოს
    მოქალაქეებისა და რეზიდენტებისთვის — 12 ლარი, 6-დან 18 წლამდე — 5,50 ლარი, ნავი კი დამატებით 20 ლარია;
    მიმდინარე ფასები დაცული ტერიტორიების სააგენტოს საიტზე გადაამოწმეთ. წვიმასა და თოვლში ნავი არ დადის;
    მასში ექვსი ადამიანი ეტევა, მგზავრი ერთ მეტრზე მაღალი უნდა იყოს, სამაშველო ჟილეტი კი სავალდებულოა.
    ჩაიცვით მოუცურებელძირიანი სპორტული ფეხსაცმელი. ბანაობა, შინაური ცხოველების შეყვანა და მოწევა აკრძალულია.
    შუადღის ჯგუფებს რომ აარიდოთ თავი, გახსნისას ან ნაშუადღევს მოდით.
  route: >-
    თბილისიდან E60-ით (ს1) დასავლეთით ქუთაისის მიდამოებამდე იარეთ, შემდეგ ხონისკენ გადაუხვიეთ და ბანძის
    გავლით მარტვილამდე მიდით. ვიზიტორთა ცენტრი ქალაქის ჩრდილოეთ გარეუბანში, ინჩხურშია და ნიშნებით მიგიყვანთ:
    სულ დაახლოებით 282 კმ და 4 საათი და 35 წუთი. სამტრედიის, აბაშისა და შ4-ის გავლით გზა ოდნავ გრძელია.
    გზა ბოლომდე ასფალტია, შესასვლელთან ავტოსადგომია, ამიტომ ეკონომ-კლასის ავტომობილი ნებისმიერ სეზონზე
    საკმარისია. საწვავი ქუთაისში ან მარტვილში შეავსეთ. დინების ზემოთ, დაახლოებით 6 კილომეტრში მდებარე
    ბალდის კანიონი იმავე დღეს იოლად ეტევა.
en:
  name: Martvili Canyon
  short: >-
    The Abasha river's deep green water between limestone walls up to 70 m high: a 700 m walkway, a short
    boat ride and the Dadianis' bathing place.
  body: >-
    **North of Martvili the Abasha river has cut so deep into the limestone that, from the boat, the sky
    narrows to a green-edged ribbon.**


    Officially this is the Gachedili, or Abasha, Canyon Natural Monument, named after the neighbouring
    village; everyone else calls it Martvili Canyon. They are one and the same place, not two canyons.
    It runs for 2.4 km, five to seven metres wide and 50 to 70 metres deep, and at its centre the river
    drops over waterfalls of 12 to 15 metres. The water is a deep green and cold all year round.


    The Dadiani princes of Mingrelia bathed here, and one stretch is still called Dadiani's Bath. On the
    lower Dadiani trail a stair of thirty steps, built of big limestone blocks, leads down to the water;
    legend says George the Hagiorite and King David the Builder walked it. Nearby stand the remains of
    a two-storey Mingrelian mill that worked in the eighteenth and nineteenth centuries.


    The rock is far older than any legend. In 2010 an Ilia State University expedition found about twenty
    dinosaur footprints between Gachedili and Inchkhuri, with bones of medium-sized plant-eaters, fragments
    of a marine mosasaur and ammonites; the finds led to the canyon's protection. A year later, caves
    nearby yielded prehistoric human bones alongside those of cave bear and bison.


    From the visitor centre in Inchkhuri a 700-metre stone-paved path crosses two bridges to three viewing
    platforms, and a 300-metre boat ride, in which you help to row, takes you into the narrowest stretch.
    Yew, hornbeam, chestnut and black alder crowd the rim, and ferns hang from the dripping walls.


    Come at opening time, before the coaches, when the only sounds are the paddle and a waterfall you
    hear before you see it.
  tip: >-
    Open daily, 10:00–18:00. At the time of writing tickets cost 20 GEL for foreign adults, 12 GEL for
    Georgian citizens and residents and 5.50 GEL for ages 6–18, with the boat 20 GEL extra; check the
    Agency of Protected Areas website for current prices. Boats do not run in rain or snow, take six people,
    require passengers over one metre tall, and life vests are compulsory. Wear trainers with grip. Swimming,
    pets and smoking are not allowed. To avoid midday tour groups, arrive at opening or in the late afternoon.
  route: >-
    From Tbilisi follow the E60/S1 west to the Kutaisi area, turn off towards Khoni and continue through
    Bandza to Martvili. The visitor centre is in Inchkhuri, on the town's northern outskirts, and is signposted:
    about 282 km and 4 h 35 min in all. The alternative via Samtredia, Abasha and the Sh4 is a little
    longer. It is asphalt all the way, with parking at the entrance, so an economy car is fine in any
    season. Refuel in Kutaisi or Martvili. Balda Canyon, about 6 km upstream, fits easily into the same
    day.
ru:
  name: Мартвильский каньон
  short: >-
    Густо-зелёная вода Абаши между известняковыми стенами высотой до 70 м: 700-метровая тропа, короткая
    прогулка на лодке и купальня князей Дадиани.
  body: >-
    **К северу от Мартвили река Абаша так глубоко врезалась в известняк, что из лодки небо сужается до
    ленты с зелёной каймой.**


    Официально это памятник природы «Каньон Гачедили», или Абаша, — по названию соседнего села; все остальные
    зовут его Мартвильским каньоном. Это одно и то же место, а не два разных каньона. Он тянется на 2,4
    км при ширине пять–семь метров и глубине 50–70 метров, а в середине река срывается водопадами высотой
    12–15 метров. Вода круглый год густо-зелёная и холодная.


    Здесь купались владетельные князья Мегрелии Дадиани, и один участок до сих пор называют Купальней
    Дадиани. На нижней тропе Дадиани к воде спускается лестница из тридцати ступеней, сложенная из крупных
    известняковых блоков; по преданию, по ней ходили Георгий Святогорец и царь Давид Строитель. Рядом
    сохранились остатки двухэтажной мегрельской мельницы, работавшей в XVIII–XIX веках.


    Скала куда древнее любых легенд. В 2010 году экспедиция Государственного университета Ильи нашла между
    Гачедили и Инчхури около двадцати следов динозавров, а также кости растительноядных ящеров среднего
    размера, фрагменты морского мозазавра и аммониты; эти находки и привели к охране каньона. Годом позже
    в пещерах поблизости обнаружили кости доисторического человека вместе с костями пещерного медведя
    и бизона.


    От визит-центра в Инчхури 700-метровая мощёная камнем тропа через два моста ведёт к трём смотровым
    площадкам, а 300-метровая прогулка на лодке — грести придётся помогать — заводит в самую узкую часть.
    По краю теснятся тис, граб, каштан и чёрная ольха, а с сочащихся влагой стен свисают папоротники.


    Приезжайте к открытию, раньше автобусов, когда слышны лишь плеск весла да водопад, который сначала
    слышишь и только потом видишь.
  tip: >-
    Открыто ежедневно, 10:00–18:00. На момент написания билет стоил 20 лари для иностранцев, 12 лари для
    граждан и резидентов Грузии и 5,50 лари для посетителей 6–18 лет; лодка — ещё 20 лари. Актуальные
    цены проверяйте на сайте Агентства охраняемых территорий. В дождь и снег лодки не ходят; в лодку садятся
    шесть человек, пассажиры должны быть ростом выше одного метра, спасательные жилеты обязательны. Наденьте
    кроссовки с нескользкой подошвой. Купаться, приводить животных и курить запрещено. Чтобы разминуться
    с полуденными экскурсиями, приезжайте к открытию или ближе к вечеру.
  route: >-
    Из Тбилиси по E60/S1 на запад до района Кутаиси, затем поворот на Хони и дальше через Бандзу до Мартвили.
    Визит-центр находится в Инчхури, на северной окраине города, и обозначен указателями: всего около
    282 км и 4 ч 35 мин. Альтернатива через Самтредиа, Абашу и Ш4 (Sh4) немного длиннее. Всюду асфальт,
    парковка у входа, так что в любое время года подойдёт машина эконом-класса. Заправьтесь в Кутаиси
    или Мартвили. Каньон Балда, примерно в 6 км выше по течению, легко вписывается в тот же день.
fa:
  name: کانیون مارتویلی
  short: >-
    آب سبز تیرهٔ رود آباشا میان دیواره‌های آهکی تا ۷۰ متر: مسیر پیاده‌روی ۷۰۰ متری، قایق‌سواری کوتاه و
    آب‌تنی‌گاه خاندان دادیانی.
  body: >-
    **در شمال مارتویلی، رود آباشا چنان ژرف در سنگ آهک فرو رفته که از درون قایق، آسمان به نواری با لبه‌های
    سبز بدل می‌شود.**


    نام رسمی اینجا «اثر طبیعی کانیون گاچدیلی» یا آباشاست، برگرفته از روستای همسایه؛ اما همه آن را کانیون
    مارتویلی می‌نامند. این دو یک جا هستند، نه دو کانیون جدا. کانیون ۲٫۴ کیلومتر امتداد دارد، با پهنای
    پنج تا هفت متر و ژرفای ۵۰ تا ۷۰ متر، و در میانه‌اش رود از آبشارهایی به بلندی ۱۲ تا ۱۵ متر فرو می‌ریزد.
    آب در همهٔ سال سبز تیره و سرد است.


    شاهزادگان دادیانیِ مگرلیا اینجا آب‌تنی می‌کردند و بخشی از کانیون هنوز «حمام دادیانی» نام دارد. در
    مسیر پایینیِ دادیانی، پلکانی سی‌پله از قطعه‌سنگ‌های بزرگ آهکی تا لب آب پایین می‌رود؛ به روایت افسانه،
    گیورگی آتوسی و داوود سازنده، پادشاه گرجستان، از آن گذشته‌اند. در همان نزدیکی بقایای آسیابی دوطبقه
    به سبک مگرلی مانده که در سده‌های هجدهم و نوزدهم کار می‌کرد.


    صخره بسیار کهن‌تر از هر افسانه‌ای است. در ۲۰۱۰ گروهی از دانشگاه دولتی ایلیا میان گاچدیلی و اینچخوری
    حدود بیست ردپای دایناسور یافتند، همراه با استخوان‌های گیاه‌خوارانی میان‌اندازه، پاره‌هایی از یک موزاسور
    دریایی و آمونیت‌ها؛ همین یافته‌ها به حفاظت از کانیون انجامید. یک سال بعد، در غارهای نزدیک، استخوان‌های
    انسان پیش‌ازتاریخ کنار استخوان‌های خرس غار و بیسون پیدا شد.


    از مرکز بازدیدکنندگان در اینچخوری، مسیری سنگ‌فرش به درازای ۷۰۰ متر از دو پل می‌گذرد و به سه سکوی تماشا
    می‌رسد، و قایق‌سواری ۳۰۰ متری — که در آن شما هم در پارو زدن کمک می‌کنید — به باریک‌ترین بخش کانیون
    می‌برد. سرخدار، ممرز، شاه‌بلوط و توسکای سیاه لبهٔ کانیون را پر کرده‌اند و سرخس‌ها از دیواره‌های نم‌چکان
    آویزان‌اند.


    هنگام باز شدن درها بیایید، پیش از اتوبوس‌ها، وقتی تنها صداها صدای پاروست و صدای آبشاری که پیش از دیدنش
    آن را می‌شنوید.
  tip: >-
    همه‌روزه از ۱۰:۰۰ تا ۱۸:۰۰ باز است. در زمان نگارش، بلیت برای بزرگسالان خارجی ۲۰ لاری، برای شهروندان
    و ساکنان گرجستان ۱۲ لاری و برای ۶ تا ۱۸ ساله‌ها ۵٫۵۰ لاری بود و قایق ۲۰ لاری جداگانه؛ قیمت‌های روز
    را در وبگاه آژانس مناطق حفاظت‌شده ببینید. قایق‌ها در باران یا برف کار نمی‌کنند، شش نفر جا دارند، مسافران
    باید بلندتر از یک متر باشند و جلیقهٔ نجات اجباری است. کفش ورزشی با کف چسبنده بپوشید. شنا، آوردن حیوان
    خانگی و سیگار کشیدن ممنوع است. برای پرهیز از گروه‌های تور نیمروز، هنگام بازگشایی یا اواخر بعدازظهر
    برسید.
  route: >-
    از تفلیس جادهٔ E60/S1 را به سمت غرب تا حوالی کوتائیسی بروید، به سوی خونی بپیچید و از باندزا تا مارتویلی
    ادامه دهید. مرکز بازدیدکنندگان در اینچخوری، در حاشیهٔ شمالی شهر، است و تابلو دارد: روی هم حدود ۲۸۲
    کیلومتر و ۴ ساعت و ۳۵ دقیقه. مسیر جایگزین از سامتردیا، آباشا و جادهٔ Sh4 اندکی طولانی‌تر است. همهٔ
    راه آسفالت است و پارکینگ کنار ورودی است، پس در هر فصلی خودروی اقتصادی کافی است. در کوتائیسی یا مارتویلی
    سوخت بگیرید. کانیون بالدا، حدود ۶ کیلومتر بالاتر در مسیر رود، به‌آسانی در همان روز جا می‌گیرد.
he:
  name: קניון מרטווילי
  short: >-
    המים הירוקים-כהים של נהר אבאשה בין קירות גיר שגובהם עד 70 מטר: שביל של 700 מטר, שיט קצר בסירה ומקום
    הרחצה של בני דדיאני.
  body: >-
    **מצפון למרטווילי חתר נהר אבאשה עמוק כל כך באבן הגיר, שמן הסירה השמיים מצטמצמים לסרט צר בשוליים ירוקים.**


    רשמית זהו אתר הטבע המוגן "קניון גצ'דילי", או קניון אבאשה, על שם הכפר הסמוך; כל השאר קוראים לו קניון
    מרטווילי. זה אותו מקום בדיוק, ולא שני קניונים שונים. אורכו 2.4 ק״מ, רוחבו חמישה עד שבעה מטרים ועומקו
    50 עד 70 מטר, ובמרכזו הנהר צונח במפלים שגובהם 12 עד 15 מטר. המים ירוקים כהים וקרים לאורך כל השנה.


    נסיכי בית דדיאני, שליטי מגרליה, רחצו כאן, ומקטע אחד נקרא עד היום "האמבט של דדיאני". בשביל דדיאני התחתון
    יורדות אל המים מדרגות — שלושים במספר — הבנויות מגושי גיר גדולים; לפי המסורת, גאורגי האגיוריטי (איש
    הר אתוס) והמלך דוד הבונה הלכו בהן. בסמוך עומדים שרידיה של טחנה מגרלית דו-קומתית שפעלה במאות ה-18 וה-19.


    הסלע עתיק בהרבה מכל אגדה. ב-2010 מצאה משלחת של אוניברסיטת איליה הממלכתית, בין גצ'דילי לאינצ'חורי,
    כעשרים עקבות של דינוזאורים, ולצדם עצמות של אוכלי צמחים בינוניים, שברים של מוזאזאור ימי ואמוניטים;
    הממצאים הם שהובילו להכרזה על הקניון כשטח מוגן. שנה אחר כך נמצאו במערות סמוכות עצמות של אדם פרהיסטורי
    לצד עצמות של דוב מערות וביזון.


    ממרכז המבקרים באינצ'חורי יוצא שביל מרוצף אבן באורך 700 מטר, החוצה שני גשרים אל שלוש תצפיות, ושיט של
    300 מטר בסירה — שבה גם אתם עוזרים לחתור — מוביל אל הקטע הצר ביותר. טקסוס, קרפינוס, ערמון ואלמון שחור
    מצטופפים על השפה, ושרכים משתלשלים מן הקירות המטפטפים.


    בואו בשעת הפתיחה, לפני האוטובוסים, כשהקולות היחידים הם המשוט ומפל שאתם שומעים לפני שאתם רואים אותו.
  tip: >-
    פתוח כל יום, 10:00–18:00. בעת כתיבת הדברים עלה כרטיס 20 לארי למבוגרים זרים, 12 לארי לאזרחי גאורגיה
    ולתושביה ו-5.50 לארי לבני 6–18, והסירה עולה 20 לארי נוספים; בדקו מחירים עדכניים באתר הסוכנות לשטחים
    מוגנים. הסירות אינן יוצאות בגשם או בשלג, מקבלות שישה נוסעים, הנוסעים חייבים להיות גבוהים ממטר אחד,
    ואפודות הצלה הן חובה. נעלו נעלי ספורט עם אחיזה טובה. אסור לשחות, להביא חיות מחמד ולעשן. כדי להימנע
    מהקבוצות המאורגנות של שעות הצהריים, הגיעו בשעת הפתיחה או בשעות אחר הצהריים המאוחרות.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1 עד אזור קוטאיסי, פנו לכיוון חוני והמשיכו דרך בנדזה עד מרטווילי. מרכז
    המבקרים נמצא באינצ'חורי, בשוליה הצפוניים של העיר, ויש אליו שילוט: בסך הכול כ-282 ק״מ ו-4 שעות ו-35
    דקות. החלופה דרך סמטרדיה, אבאשה וכביש Sh4 ארוכה מעט יותר. הדרך כולה סלולה ויש חניה בכניסה, כך שרכב
    חסכוני מתאים בכל עונה. תדלקו בקוטאיסי או במרטווילי. קניון באלדה, כ-6 ק״מ במעלה הזרם, משתלב בקלות באותו
    יום.
ar:
  name: أخدود مارتفيلي
  short: >-
    مياه نهر أباشا الخضراء القاتمة بين جدران كلسية يصل ارتفاعها إلى 70 مترًا: ممشى طوله 700 متر، ورحلة
    قصيرة بالقارب، ومغطس آل دادياني.
  body: >-
    **شمال مارتفيلي حفر نهر أباشا في الحجر الكلسي عميقًا حتى إن السماء تضيق، من داخل القارب، إلى شريط
    تحفّه الخضرة.**


    الاسم الرسمي للمكان «المعلم الطبيعي أخدود غاتشيديلي» أو أخدود أباشا، نسبةً إلى القرية المجاورة؛ أما
    سائر الناس فيسمّونه أخدود مارتفيلي. إنهما مكان واحد لا أخدودان. يمتد 2.4 كم بعرض خمسة إلى سبعة أمتار
    وعمق 50 إلى 70 مترًا، وفي وسطه ينحدر النهر في شلالات يبلغ ارتفاعها 12 إلى 15 مترًا. والماء أخضر قاتم
    وبارد على مدار السنة.


    كان أمراء آل دادياني حكّام ميغريليا يستحمّون هنا، ولا يزال أحد المقاطع يُعرف بـ«حمّام دادياني». وعلى
    درب دادياني السفلي ينزل إلى الماء درج من ثلاثين درجة مبني من كتل كلسية ضخمة؛ وتقول الأسطورة إن جاورجيوس
    الآثوسي والملك داود البنّاء سارا عليه. وعلى مقربة تقوم بقايا طاحونة ميغريلية من طابقين كانت تعمل في
    القرنين الثامن عشر والتاسع عشر.


    والصخر أقدم بكثير من أي أسطورة. ففي عام 2010 عثرت بعثة من جامعة إيليا الحكومية بين غاتشيديلي وإنتشخوري
    على نحو عشرين أثرًا لأقدام الديناصورات، ومعها عظام لآكلات عشب متوسطة الحجم، وشظايا من موزاصور بحري،
    وأمونيتات؛ وهذه اللُّقى هي التي أفضت إلى حماية الأخدود. وبعد عام وُجدت في كهوف قريبة عظام بشرية من
    عصور ما قبل التاريخ إلى جانب عظام دب الكهوف والبيسون.


    من مركز الزوار في إنتشخوري ينطلق ممشى مرصوف بالحجر طوله 700 متر، يعبر جسرين إلى ثلاث منصات للمشاهدة،
    وتأخذك رحلة بالقارب طولها 300 متر — تساعد فيها على التجديف — إلى أضيق مقاطع الأخدود. وتتزاحم على الحافة
    أشجار الطقسوس والشَّرد والكستناء وجار الماء الأسود، وتتدلى السراخس من الجدران التي يقطر منها الماء.


    تعالَ ساعة الافتتاح، قبل الحافلات، حين لا تسمع إلا المجداف وشلالًا يبلغ سمعَك قبل أن تراه عيناك.
  tip: >-
    مفتوح يوميًا من 10:00 إلى 18:00. عند كتابة هذه السطور كانت التذكرة بـ20 لاري للبالغين الأجانب، و12
    لاري لمواطني جورجيا والمقيمين فيها، و5.50 لاري لمن هم بين 6 و18 عامًا، والقارب بـ20 لاري إضافية؛ تحقّق
    من الأسعار الحالية على موقع وكالة المناطق المحمية. لا تعمل القوارب في المطر أو الثلج، وتتسع لستة أشخاص،
    ويُشترط أن يزيد طول الراكب على متر واحد، وسترات النجاة إلزامية. انتعل حذاءً رياضيًا بنعل لا ينزلق.
    السباحة واصطحاب الحيوانات الأليفة والتدخين ممنوعة. ولتتجنب مجموعات الجولات في منتصف النهار، احضر ساعة
    الافتتاح أو في آخر العصر.
  route: >-
    من تبليسي اتبع الطريق E60/S1 غربًا حتى منطقة كوتايسي، ثم انعطف نحو خوني وتابع عبر باندزا إلى مارتفيلي.
    يقع مركز الزوار في إنتشخوري على الطرف الشمالي للبلدة، والطريق إليه مزوّد باللافتات: نحو 282 كم و4
    ساعات و35 دقيقة إجمالًا. والبديل عبر سامتريديا وأباشا والطريق Sh4 أطول قليلًا. الطريق معبّد بالكامل،
    وموقف السيارات عند المدخل، فسيارة اقتصادية تفي بالغرض في أي فصل. تزوّد بالوقود في كوتايسي أو مارتفيلي.
    ويمكن بسهولة ضمّ أخدود بالدا، على بعد نحو 6 كم أعلى النهر، إلى اليوم نفسه.
