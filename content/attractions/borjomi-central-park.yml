ka:
  name: ბორჯომის ცენტრალური პარკი და მინერალური წყალი
  short: ისტორიული საკურორტო პარკი, სადაც უფასოდ სვამენ თბილ „ბორჯომს“ პირდაპირ წყაროდან.
  body: >
    ბორჯომი XIX საუკუნის ბოლოს რომანოვების საზაფხულო რეზიდენციად იქცა და სწორედ მაშინ ჩამოყალიბდა ის საკურორტო
    პარკი, რომელიც დღესაც ქალაქის მთავარი სივრცეა. მდინარე ბორჯომულას ვიწრო ხეობაში ჩამწკრივებული ხის
    აივნები, საკონცერტო ესტრადა, მინერალური წყლის პავილიონები და პატარა ხიდები იმპერიული ეპოქის კურორტის
    ატმოსფეროს ინარჩუნებს. ბორჯომის წყალმა სწორედ იმ პერიოდში მოიპოვა სახელი და ბოთლში ჩამოსხმა ჯერ კიდევ
    მეფის რუსეთის დროს დაიწყო.


    პარკის შესასვლელიდან ხუთ წუთში იწყება მთავარი: **მინერალური წყლის საწყისი წყარო**, სადაც ბორჯომი თბილი
    და მლაშეა — სრულიად სხვა გემო, ვიდრე ბოთლში. ჭიქა ან ცარიელი ბოთლი თან წაიღე, წყალი უფასოა და შეზღუდვის
    გარეშე შეგიძლია დაასხა.


    პარკის სიღრმეში ბილიკი მდინარის გასწვრივ მიდის და ორ-სამ კილომეტრში ღია აუზამდე მიგიყვანს გოგირდოვანი
    თერმული წყლით; იქვე იწყება ტყის ბილიკები.


    რას ნახავ:


    - ისტორიული ალეა, პავილიონები და შადრევნები

    - საწყისი მინერალური წყარო

    - საბაგირო ზედა პლატოზე, საიდანაც ხეობის პანორამაა

    - თერმული აუზი ტყეში, ცალკე გადასახადით


    ბორჯომი ასევე ბორჯომ-ხარაგაულის ეროვნული პარკის მთავარი შესასვლელია, ამიტომ ბევრი მოგზაური ქალაქს
    ერთი-ორი ღამის ბაზად იყენებს.


    თუ დრო გაქვს, პარკის ბოლოში საბაგიროთი ზედა პლატოზე ადი: იქიდან ხეობა და ქალაქის სახურავები ერთ კადრში
    ჩანს, ხოლო ზემოთ პატარა ატრაქციონები და სასეირნო ბილიკებია. ზამთარში პარკი ღიაა და თოვლში კიდევ უფრო
    ლამაზია, თუმცა თერმული აუზისკენ მიმავალი ბილიკი შეიძლება მოყინული იყოს.
  tip: >-
    წყალი პირველად თბილი და მლაშე გემოს გაგაკვირვებს — ესეც ნაწილია გამოცდილების. თან წაიღე ცარიელი ბოთლი
    და, თუ თერმულ აუზამდე მიდიხარ, საცურაო კოსტიუმი და პირსახოცი. პარკამდე ბოლო 300 მეტრი ფეხითაა — მანქანა
    ცენტრში, შესასვლელთან ახლოს დატოვე, ზაფხულში ადგილი სწრაფად ივსება. საკმარისია 2–3 საათი, თერმულ აუზთან
    ერთად — ნახევარი დღე. კაფეები, ტუალეტი და ბანკომატები ქალაქის ცენტრშივეა.
  route: >
    თბილისიდან E60-ით მიდიხარ გორისა და ხაშურის გავლით, ხაშურში სამხრეთით უხვევ და ოცდაათ კილომეტრში ბორჯომშია.
    სულ დაახლოებით ას სამოცი კილომეტრი და ორი საათი ოცი წუთი. მთელი გზა კარგი ასფალტია, ბოლო მონაკვეთი
    ხეობაშია და ზამთარშიც რეგულარულად იწმინდება. საწვავი ბევრგანაა ხაშურამდე და ბორჯომშივე, ბანკომატებიც
    ცენტრში. ეკონომ კლასი სავსებით საკმარისია; თუ იმავე დღეს ბაკურიანშიც ადიხარ, სერპანტინისთვის მაღალი
    კლირენსი უფრო კომფორტულია, განსაკუთრებით დეკემბრიდან მარტამდე. მთელი მარშრუტი დღის განმავლობაში დატვირთულია,
    ამიტომ დილით ადრე გამოსვლა ბევრად სწრაფია.
en:
  name: Borjomi Central Park and Mineral Springs
  short: The historic spa park where you drink warm Borjomi water free, straight from the source.
  body: >-
    Borjomi became a Romanov summer residence at the end of the 19th century, and the resort park laid
    out then is still the heart of the town. Wooden balconies, a bandstand and small bridges line the
    narrow gorge of the Borjomula river, and the whole place keeps the atmosphere of an imperial-era spa.


    Five minutes past the entrance you reach the point of the visit: **the original mineral spring**,
    where the water comes out warm and salty. It tastes nothing like the bottled version, and drinking
    it is free — bring a cup or an empty bottle.


    Deeper into the park a path runs along the river and, after two or three kilometres, reaches an open-air
    pool fed by warm sulphur water, with forest trails starting from the same spot.


    What you get:


    - the historic alley, pavilions and fountains

    - the source spring itself

    - a cable car to the plateau above, with a panorama of the gorge

    - the thermal pool in the forest, charged separately


    Borjomi is also the main gateway to Borjomi-Kharagauli National Park, so many visitors use the town
    as a base for a night or two.
  tip: >-
    The warm, mildly salty taste of the water surprises most first-timers; that is part of the experience.
    Bring an empty bottle, and swimwear plus a towel if you intend to walk to the thermal pool. The last
    300 metres to the gate are on foot — park in the centre near the entrance, as spaces fill quickly
    in summer. Two or three hours cover the park; add the pool and it becomes half a day. Cafes, toilets
    and ATMs are all in the town centre.
  route: >-
    From Tbilisi take the E60 past Gori to Khashuri, turn south there and cover the last 30 km into Borjomi
    — about 160 km and two hours twenty in total. The whole route is good asphalt, and the final gorge
    section is cleared through winter. Fuel is plentiful up to Khashuri and in Borjomi itself. An economy
    car is fine. If you plan to continue up to Bakuriani the same day, the mountain serpentine is more
    comfortable in something with clearance, particularly between December and March.
ru:
  name: Центральный парк Боржоми и минеральные источники
  short: Исторический курортный парк, где тёплую воду «Боржоми» бесплатно пьют прямо из источника.
  body: >
    Боржоми стал летней резиденцией Романовых в конце XIX века, и разбитый тогда курортный парк до сих
    пор остаётся главным пространством города. Деревянные балконы, эстрада, питьевые павильоны и мостики
    тянутся вдоль узкого ущелья речки Боржомула, сохраняя атмосферу дореволюционного курорта. Именно в
    те годы боржомская вода получила известность, и разливать её в бутылки начали ещё при царской России.


    В пяти минутах от входа находится то, ради чего сюда едут, — **первоисточник минеральной воды**. Она
    выходит тёплой и солоноватой и на вкус совсем не похожа на бутилированную. Вода бесплатная и без ограничений,
    нужна только своя кружка или пустая бутылка.


    Вглубь парка вдоль реки уходит дорожка: через два-три километра она приводит к открытому бассейну
    с тёплой сернистой водой, оттуда же начинаются лесные тропы.


    Что входит в прогулку:


    - историческая аллея с павильонами и фонтанами

    - сам источник

    - канатная дорога на плато с панорамой ущелья

    - термальный бассейн в лесу, оплачивается отдельно


    Боржоми служит и главными воротами в Боржоми-Харагаульский национальный парк, поэтому многие путешественники
    останавливаются здесь на одну-две ночи и выезжают на тропы уже налегке.


    Если есть время, поднимитесь канатной дорогой на верхнее плато: оттуда ущелье и крыши города попадают
    в один кадр, а наверху есть небольшие аттракционы и прогулочные дорожки. Зимой парк открыт и в снегу
    выглядит даже красивее, но тропа к термальному бассейну может обледенеть.
  tip: >-
    Тёплый солоноватый вкус воды поначалу удивляет — это нормально и входит в программу. Возьмите пустую
    бутылку, а если планируете дойти до термального бассейна, то купальник и полотенце. Последние 300
    метров до входа проходят пешком: паркуйтесь в центре ближе к воротам, летом места быстро заканчиваются.
    На парк хватит двух-трёх часов, с бассейном получается полдня. Кафе, туалеты и банкоматы — в центре
    города.
  route: >-
    Из Тбилиси по E60 мимо Гори до Хашури, там поворот на юг и последние 30 км до Боржоми — всего около
    160 км и два часа двадцать минут. Вся дорога — хороший асфальт, финальный участок по ущелью чистят
    и зимой. Заправки есть до самого Хашури и в самом Боржоми. Достаточно эконом-класса. Если в тот же
    день планируете подняться в Бакуриани, серпантин комфортнее проходить на машине с большим клиренсом,
    особенно с декабря по март.
fa:
  name: پارک مرکزی بورجومی و چشمه‌های معدنی
  short: پارک تاریخی آب‌درمانی، جایی که آب گرم بورجومی را رایگان و مستقیم از سرچشمه می‌نوشید.
  body: >-
    بورجومی در پایان سدهٔ نوزدهم اقامتگاه تابستانی رومانوف‌ها شد و پارک آسایشگاهی که همان زمان طراحی شد
    هنوز قلب شهر است. بالکن‌های چوبی، آلاچیق ارکستر و پل‌های کوچک در امتداد تنگهٔ باریک رودخانهٔ بورجومولا
    صف کشیده‌اند و کل مکان فضای یک آب‌درمانی دوران امپراتوری را حفظ کرده است.


    پنج دقیقه پس از ورودی به نقطهٔ اصلی بازدید می‌رسید: **چشمهٔ معدنی اصلی**، جایی که آب گرم و شور از
    زمین بیرون می‌آید. مزهٔ آن هیچ شباهتی به نسخهٔ بطری‌شده ندارد و نوشیدنش رایگان است — لیوان یا بطری
    خالی همراه بیاورید.


    عمیق‌تر در پارک، مسیری در امتداد رودخانه می‌رود و پس از دو تا سه کیلومتر به استخری روباز می‌رسد که
    با آب گرم گوگردی پر می‌شود و مسیرهای جنگلی از همان نقطه آغاز می‌شوند.


    آنچه به دست می‌آورید:


    - خیابان تاریخی، غرفه‌ها و فواره‌ها

    - خود چشمهٔ سرچشمه

    - تله‌کابین تا فلات بالا، با پانورامای تنگه

    - استخر گرم در جنگل، با پرداخت جداگانه


    بورجومی دروازهٔ اصلی پارک ملی بورجومی-خاراگاولی هم هست، پس بسیاری از بازدیدکنندگان شهر را پایگاه یکی
    دو شب می‌کنند.
  tip: >-
    مزهٔ گرم و اندکی شور آب بیشتر تازه‌واردان را غافلگیر می‌کند؛ همین هم بخشی از تجربه است. یک بطری خالی
    بیاورید، و اگر قصد دارید تا استخر آب گرم پیاده بروید، لباس شنا و حوله هم. 300 متر آخر تا دروازه پیاده
    است — در مرکز نزدیک ورودی پارک کنید، چون در تابستان جاها زود پر می‌شود. دو تا سه ساعت پارک را پوشش
    می‌دهد؛ با استخر نیم‌روز می‌شود. کافه، سرویس بهداشتی و خودپرداز همه در مرکز شهرند.
  route: >-
    از تفلیس E60 را از کنار گوری تا خاشوری بگیرید، آنجا به جنوب بپیچید و 30 کیلومتر آخر را تا بورجومی
    برانید — در مجموع حدود 160 کیلومتر و دو ساعت و بیست دقیقه. کل مسیر آسفالت خوبی دارد و بخش پایانی تنگه
    در زمستان پاک‌سازی می‌شود. سوخت تا خاشوری و در خود بورجومی فراوان است. خودروی اقتصادی مناسب است. اگر
    می‌خواهید همان روز تا باکوریانی بالا بروید، سرپیچ کوهستانی با خودرویی که ارتفاع کف دارد راحت‌تر است،
    به‌ویژه میان دسامبر و مارس.
he:
  name: הפארק המרכזי של בורג'ומי והמעיינות המינרליים
  short: פארק המרפא ההיסטורי שבו שותים מים חמימים של בורג'ומי בחינם, היישר מן המקור.
  body: >-
    בורג'ומי הפכה למעון קיץ של בית רומנוב בסוף המאה ה-19, ופארק המרפא שהותווה אז הוא עדיין ליבה של העיירה.
    מרפסות עץ, במת תזמורת וגשרים קטנים משתרעים לאורך הערוץ הצר של נחל בורג'ומולה, וכל המקום שומר על אווירת
    אתר מרפא מן התקופה הקיסרית.


    חמש דקות אחרי הכניסה מגיעים אל עיקר הביקור: **המעיין המינרלי המקורי**, שממנו יוצאים המים חמימים ומלוחים.
    הטעם אינו דומה כלל לגרסה המבוקבקת, והשתייה חינם — הביאו כוס או בקבוק ריק.


    עמוק יותר בפארק שביל ממשיך לאורך הנחל ואחרי שניים-שלושה קילומטרים מגיע לבריכה פתוחה שמוזנת במי גופרית
    חמימים, ומאותה נקודה יוצאים גם שבילי היער אל המדרונות שמסביב. ההליכה עצמה נוחה, כמעט ללא טיפוס, ומתאימה
    גם למי שבא עם ילדים.


    מה מקבלים:


    - השדרה ההיסטורית, הביתנים והמזרקות

    - מעיין המקור עצמו

    - רכבל אל הרמה שמעל, עם פנורמה של הערוץ

    - הבריכה התרמית ביער, בתשלום נפרד


    בורג'ומי היא גם שער הכניסה המרכזי לפארק הלאומי בורג'ומי-חראגאולי, ולכן מבקרים רבים עושים בעיירה בסיס
    ללילה או שניים.
  tip: >-
    הטעם החמים והמלוח קלות מפתיע את רוב המבקרים בפעם הראשונה; זה חלק מהחוויה. הביאו בקבוק ריק, וגם בגד
    ים ומגבת אם בכוונתכם ללכת עד הבריכה התרמית. 300 המטרים האחרונים אל השער נעשים ברגל — החנו במרכז ליד
    הכניסה, כי המקומות מתמלאים מהר בקיץ. שעתיים-שלוש מכסות את הפארק; בתוספת הבריכה זה הופך לחצי יום. בתי
    קפה, שירותים וכספומטים נמצאים כולם במרכז העיירה.
  route: >-
    מטביליסי סעו בכביש E60 מעבר לגורי עד חשורי, פנו שם דרומה וסעו את 30 הקילומטרים האחרונים אל בורג'ומי
    — כ-160 ק״מ ושעתיים ועשרים בסך הכול. כל המסלול אספלט טוב, וקטע הערוץ האחרון מפונה משלג לאורך החורף.
    דלק יש בשפע עד חשורי ובבורג'ומי עצמה. רכב חסכוני מתאים. אם בכוונתכם להמשיך באותו יום במעלה לבקוריאני,
    הסרפנטינה ההררית נוחה יותר ברכב עם גובה גחון, במיוחד בין דצמבר למרץ.
ar:
  name: حديقة بورجومي المركزية والينابيع المعدنية
  short: حديقة الاستشفاء التاريخية حيث تشرب ماء بورجومي الدافئ مجاناً من النبع مباشرة.
  body: >-
    صارت بورجومي مقر صيف لآل رومانوف في أواخر القرن التاسع عشر، وما زالت حديقة المنتجع التي خُططت آنذاك
    قلب البلدة. تصطف الشرفات الخشبية ومنصة الموسيقى والجسور الصغيرة على امتداد المضيق الضيق لنهر بورجومولا،
    ويحتفظ المكان كله بأجواء منتجع استشفائي من العهد الإمبراطوري.


    وبعد خمس دقائق من المدخل تبلغ جوهر الزيارة: **النبع المعدني الأصلي**، حيث يخرج الماء دافئاً مالحاً.
    ولا يشبه طعمه إطلاقاً النسخة المعبأة، وشربه مجاني — أحضر كوباً أو زجاجة فارغة.


    وفي عمق الحديقة يمتد درب بمحاذاة النهر ويصل بعد كيلومترين أو ثلاثة إلى حوض مكشوف يغذيه ماء كبريتي
    دافئ، ومن الموضع نفسه تبدأ مسارات الغابة نحو المنحدرات المحيطة. والمشي هنا سهل وشبه مستوٍ، ويصلح لمن
    جاء برفقة أطفال.


    ما تحصل عليه:


    - الجادة التاريخية والأجنحة والنوافير

    - النبع الأصلي نفسه

    - تلفريك إلى الهضبة في الأعلى مع بانوراما للمضيق

    - الحوض الحراري في الغابة، برسم منفصل


    وبورجومي أيضاً البوابة الرئيسية إلى منتزه بورجومي-خاراغاولي الوطني، فيتخذها كثير من الزوار قاعدة لليلة
    أو ليلتين.
  tip: >-
    يفاجئ الطعم الدافئ المائل إلى الملوحة معظم القادمين لأول مرة؛ وهذا جزء من التجربة. أحضر زجاجة فارغة،
    ومعها لباس سباحة ومنشفة إن كنت تنوي المشي إلى الحوض الحراري. أما آخر 300 متر إلى البوابة فتُقطع سيراً
    — أوقف السيارة في المركز قرب المدخل، فالأماكن تمتلئ سريعاً صيفاً. ساعتان أو ثلاث تغطي الحديقة؛ وبإضافة
    الحوض تصير نصف يوم. المقاهي ودورات المياه وأجهزة الصراف كلها في وسط البلدة.
  route: >-
    من تبليسي اسلك الطريق E60 مروراً بغوري حتى خاشوري، ثم انعطف جنوباً واقطع آخر 30 كم إلى بورجومي — نحو
    160 كم وساعتين وعشرين دقيقة إجمالاً. الطريق كله إسفلت جيد، ومقطع المضيق الأخير يُنظَّف من الثلج طوال
    الشتاء. والوقود وفير حتى خاشوري وفي بورجومي نفسها. وسيارة اقتصادية مناسبة. وإن كنت تخطط لمواصلة الصعود
    إلى باكورياني في اليوم نفسه، فالطريق الجبلي الملتوي أكثر راحة بسيارة ذات خلوص أرضي، خاصة بين ديسمبر
    ومارس.
