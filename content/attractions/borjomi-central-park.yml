ka:
  name: ბორჯომის ცენტრალური პარკი და მინერალური წყაროები
  short: >-
    XIX საუკუნის საკურორტო პარკი ვიწრო, ტყიან ხეობაში, სადაც მლაშე, ოდნავ თბილ „ბორჯომს“ საკუთარ ბოთლში
    პირდაპირ წყაროდან ასხამთ.
  body: >-
    **სანამ „ბორჯომი“ ერთი ყოფილი იმპერიის ნახევრისთვის ცნობილ ცქრიალა გემოდ იქცეოდა, ის ამ მწვანე ხეობაში
    მოჩუხჩუხე მლაშე წყარო იყო — და აქ მას დღესაც უფასოდ დალევთ.**


    რუსული ჯარი აქ XIX საუკუნის 20-იან წლებში მოვიდა, 30-იან წლებში კი პირველი აბანოები აშენდა. 1840-იანი
    წლების დასაწყისში კავკასიის მთავარმართებელმა ევგენი გოლოვინმა სამკურნალოდ ქალიშვილი ჩამოიყვანა და
    გადმოცემამ მისი სახელი — ეკატერინე — პარკის ყველაზე ცნობილ წყაროს დაარქვა. რამდენიმე წლის შემდეგ მეფისნაცვალმა
    მიხეილ ვორონცოვმა ბორჯომი საზაფხულო რეზიდენციად აქცია და ახალი პარკები გააშენა; 1871 წელს მამული დიდ
    მთავარ მიხეილ ნიკოლოზის ძეს გადაეცა, 1890 წელს კი პირველი ჩამომსხმელი ქარხანა აშენდა. მისი ძველი შენობა
    დღესაც ჭიშკრიდან მარცხნივ დგას.


    ხუთიოდე წუთის სავალზეა ის, რისთვისაც აქ ჩამოდიან: ეკატერინეს წყაროს ფანჩატური, სადაც ონკანებიდან წყალი
    ოდნავ თბილი, ცქრიალა და უტყუარად მინერალური მოედინება. მარილისა და ქვის გემო აქვს და ბოთლში ჩამოსხმულ,
    გაცივებულ „ბორჯომს“ სულაც არ ჰგავს. პირველად მოსული ჯერ სახეს მოიღრეჯს, მერე კი მეორე ჭიქისთვის ბრუნდება.


    წყაროს იქით პარკი მდინარის გასწვრივ ტყეში ვიწროვდება — სკამები, კაფეები, ბავშვთა ატრაქციონები. დაახლოებით
    ორნახევარკილომეტრიანი ბილიკი ღია გოგირდის აუზებამდე მიდის, შესასვლელთან კი საბაგირო ქალაქის თავზე,
    კლდის ხედის წერტილებზე აგიყვანთ.


    1921 წელს, წითელი არმიის შემოსვლის შემდეგ, არისტოკრატების სასახლეები სანატორიუმებად იქცა. წყარო კი
    ადგილზე დარჩა — და მასთან ერთად ცარიელი ბოთლებით მდგომთა რიგიც. ჩადექით თქვენც: ოდესღაც აქ მთავარმართებლის
    ქალიშვილიც იდგა.
  tip: >-
    თან ცარიელი ბოთლი იქონიეთ, გოგირდის აუზებისკენ თუ მიდიხართ — საცურაო კოსტიუმი და პირსახოციც; აუზებში
    შესვლა ცალკე ფასიანია. პარკის ჭიშკართან მცირე შესასვლელი საფასური იხდება. მანქანა ქალაქის ცენტრში
    დატოვეთ და ბოლო რამდენიმე ასეული მეტრი ფეხით გაიარეთ — ზაფხულის შაბათ-კვირას ადგილი მალევე ივსება.
    პარკს ორი-სამი საათი ჰყოფნის, აუზებთან ერთად — ნახევარი დღე. ყველაზე წყნარი დილაა, როცა ხეობაში ნისლი
    ჯერ არ აწეულა. ზამთარში პარკი ღიაა, აუზებისკენ მიმავალი ბილიკი კი შეიძლება მოყინული იყოს. კაფეები,
    ტუალეტები და ბანკომატები ცენტრშია.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ, გორის გავლით, ხაშურამდე დაახლოებით 130 კილომეტრია; იქ სამხრეთით,
    S8-ზე გადაუხვიეთ და ბოლო 30 კილომეტრი ბორჯომამდე გაიარეთ — სულ 160 კილომეტრი, დაახლოებით 2 საათი და
    20 წუთი. გზა მთელ სიგრძეზე კარგი ასფალტია, ხეობის მონაკვეთი ზამთარშიც იწმინდება. საწვავი ხაშურამდე
    ბევრგანაა, ბორჯომშიც. ეკონომკლასის მანქანა იდეალურია. თუ იმავე დღეს ბაკურიანშიც აპირებთ ასვლას, გაითვალისწინეთ,
    რომ Sh20 30 კილომეტრიან სერპანტინს ადის და დეკემბრიდან მარტამდე ზამთრის საბურავებს მოითხოვს.
en:
  name: Borjomi Central Park and Mineral Springs
  short: >-
    A 19th-century spa park in a narrow wooded gorge, where you fill your own bottle with salty, faintly
    warm Borjomi water straight from the spring.
  body: >-
    **Long before Borjomi became the fizzy taste of half a former empire, it was a salty trickle in this
    green gorge, and here you can still drink it for nothing.**


    The Russian army arrived in the 1820s; bathhouses followed in the 1830s. In the early 1840s Yevgeny
    Golovin, the Tsar's commander-in-chief in the Caucasus, brought his daughter here to take the cure,
    and tradition has given her name, Ekaterine, to the park's most famous spring. A few years later the
    viceroy Mikhail Vorontsov made Borjomi his summer residence and laid out new parks; in 1871 the whole
    estate passed to Grand Duke Mikhail Nikolayevich, and in 1890 the first bottling plant was built.
    Its old building still stands on your left as you walk through the gate.


    Five minutes further on is the reason for the visit: the pavilion over the Ekaterine spring, where
    the water runs out of the taps tepid, sparkling and unmistakably mineral. It tastes of salt and stone,
    and nothing like the chilled version in a bottle. First-timers usually pull a face, then come back
    for a second cup.


    Beyond the spring the park narrows into forest along the river, with benches, cafés and a children's
    fairground. A path of about two and a half kilometres leads on to open-air sulphur pools, and a cable
    car near the entrance lifts you to viewpoints on the cliff above the town.


    After the Red Army arrived in 1921, the aristocrats' mansions became sanatoria. The spring stayed
    where it was, and so did the queue of people with empty bottles. Join it: a general's daughter once
    did the same.
  tip: >-
    Bring an empty bottle, and swimwear and a towel if you are walking on to the sulphur pools, which
    charge their own fee. There is a small entrance fee at the park gate. Park in the town centre and
    walk the last few hundred metres, because spaces vanish on summer weekends. Two to three hours covers
    the park; with the pools it becomes half a day. Mornings are quietest, when mist still hangs in the
    gorge. In winter the park stays open, but the path to the pools can be icy. Cafés, toilets and cash
    machines are in the centre.
  route: >-
    From Tbilisi take the E60/S1 west past Gori to Khashuri, about 130 km, then turn south onto the S8
    for the last 30 km into Borjomi: 160 km, roughly 2 hours 20 minutes. It is good asphalt all the way,
    and the gorge section is kept clear through the winter. Fuel is easy to find up to Khashuri and in
    Borjomi itself. An economy car is ideal. If you are going on to Bakuriani the same day, the Sh20 climbs
    30 km of switchbacks that need winter tyres from December to March.
ru:
  name: Центральный парк Боржоми и минеральные источники
  short: >-
    Курортный парк XIX века в узком лесистом ущелье, где солёную, чуть тёплую боржомскую воду набирают
    в свою бутылку прямо из источника.
  body: >-
    **Задолго до того, как «Боржоми» стал шипучим вкусом половины бывшей империи, он был солёным ручейком
    в этом зелёном ущелье — и здесь его до сих пор можно пить бесплатно.**


    Русская армия пришла сюда в 1820-х годах, в 1830-х появились купальни. В начале 1840-х главноуправляющий
    на Кавказе Евгений Головин привёз сюда на лечение дочь, и предание дало её имя, Екатерина, самому
    знаменитому источнику парка. Несколько лет спустя наместник Кавказа Михаил Воронцов сделал Боржоми
    своей летней резиденцией и разбил новые парки; в 1871 году всё имение перешло к великому князю Михаилу
    Николаевичу, а в 1890-м построили первый завод по розливу. Его старое здание до сих пор стоит по левую
    руку, как только войдёте в ворота.


    Ещё пять минут — и вот ради чего сюда едут: павильон над Екатерининским источником, где вода течёт
    из кранов тепловатая, игристая и безошибочно минеральная. На вкус она отдаёт солью и камнем и совсем
    не похожа на охлаждённую воду из бутылки. Новички обычно морщатся — а потом возвращаются за второй
    кружкой.


    За источником парк сужается и уходит в лес вдоль реки: скамейки, кафе, детские аттракционы. Тропа
    длиной около двух с половиной километров ведёт дальше, к серным бассейнам под открытым небом, а канатная
    дорога у входа поднимает к смотровым площадкам на скале над городом.


    После прихода Красной армии в 1921 году аристократические особняки превратились в санатории. Источник
    остался на месте, а с ним и очередь людей с пустыми бутылками. Встаньте в неё: когда-то в ней стояла
    генеральская дочь.
  tip: >-
    Возьмите пустую бутылку, а если пойдёте дальше к серным бассейнам — купальник и полотенце: вход туда
    оплачивается отдельно. У ворот парка берут небольшую плату за вход. Машину оставьте в центре города
    и пройдите последние несколько сотен метров пешком: в летние выходные свободные места исчезают. На
    парк хватит двух-трёх часов, с бассейнами выйдет полдня. Тише всего по утрам, когда в ущелье ещё висит
    туман. Зимой парк открыт, но тропа к бассейнам бывает обледенелой. Кафе, туалеты и банкоматы — в центре.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори до Хашури — около 130 км, затем поверните на юг, на S8, и
    проезжайте последние 30 км до Боржоми: всего 160 км, примерно 2 часа 20 минут. Хороший асфальт на
    всём пути, а участок в ущелье всю зиму держат расчищенным. Заправки легко найти до Хашури и в самом
    Боржоми. Идеальный вариант — машина эконом-класса. Если в тот же день едете дальше в Бакуриани, учтите:
    Sh20 поднимается 30 км серпантином, и с декабря по март на нём нужна зимняя резина.
fa:
  name: پارک مرکزی بورجومی و چشمه‌های معدنی
  short: >-
    پارکی آب‌درمانی از قرن نوزدهم در دره‌ای تنگ و جنگلی، جایی که بطری خودتان را با آب شور و اندکی ولرم
    بورجومی، مستقیم از چشمه، پر می‌کنید.
  body: >-
    **بورجومی خیلی پیش از آنکه طعم گازدارِ نیمی از یک امپراتوری سابق شود، باریکه‌ای آب شور در همین درهٔ
    سبز بود، و اینجا هنوز می‌توانید آن را رایگان بنوشید.**


    ارتش روسیه در دههٔ ۱۸۲۰ به اینجا رسید و در دههٔ ۱۸۳۰ گرمابه‌ها از پی آن آمدند. در آغاز دههٔ ۱۸۴۰ یوگنی
    گولووین، فرماندهٔ کل روسیه در قفقاز، دخترش را برای درمان به اینجا آورد، و روایت‌ها نام او، اکاترینه،
    را به مشهورترین چشمهٔ پارک داده‌اند. چند سال بعد میخائیل ورونتسوف، نایب‌السلطنهٔ قفقاز، بورجومی را
    اقامتگاه تابستانی خود کرد و پارک‌های تازه‌ای ساخت؛ در ۱۸۷۱ کل این املاک به دوک بزرگ میخائیل نیکولایویچ
    رسید، و در ۱۸۹۰ نخستین کارخانهٔ بطری‌کردن آب معدنی ساخته شد. ساختمان قدیمی آن هنوز، همین که از دروازه
    می‌گذرید، سمت چپتان ایستاده است.


    پنج دقیقه جلوتر دلیل آمدنتان است: کوشکی بر فراز چشمهٔ اکاترینه، که آب از شیرهایش ولرم، گازدار و بی‌تردید
    معدنی بیرون می‌آید. مزهٔ نمک و سنگ می‌دهد و هیچ شباهتی به نسخهٔ خنکِ بطری‌شده ندارد. تازه‌واردها معمولاً
    اول چهره درهم می‌کشند و بعد برای لیوان دوم برمی‌گردند.


    آن سوی چشمه، پارک باریک می‌شود و در امتداد رودخانه به جنگل می‌پیوندد، با نیمکت‌ها، کافه‌ها و شهربازی
    کودکان. کوره‌راهی به طول حدود دو و نیم کیلومتر به استخرهای گوگردی روباز می‌رسد، و تله‌کابینی نزدیک
    ورودی شما را به دیدگاه‌هایی بر صخرهٔ بالای شهر می‌برد.


    پس از ورود ارتش سرخ در ۱۹۲۱، عمارت‌های اشراف به آسایشگاه‌های درمانی بدل شدند. چشمه سر جایش ماند، و
    صف آدم‌هایی با بطری‌های خالی هم. به آن صف بپیوندید: روزگاری دختر یک ژنرال هم همین کار را کرده است.
  tip: >-
    یک بطری خالی بیاورید، و اگر تا استخرهای گوگردی پیاده می‌روید، مایو و حوله هم؛ استخرها ورودیهٔ جداگانه
    دارند. دمِ دروازهٔ پارک ورودیهٔ مختصری می‌گیرند. در مرکز شهر پارک کنید و چند صد متر آخر را پیاده بروید،
    چون آخر هفته‌های تابستان جای پارک نایاب می‌شود. دو تا سه ساعت برای پارک کافی است؛ با استخرها نیم‌روز
    می‌شود. صبح‌ها از همه آرام‌تر است، وقتی مه هنوز در دره آویزان است. پارک زمستان‌ها هم باز است، اما
    راه استخرها ممکن است یخ‌زده باشد. کافه، سرویس بهداشتی و خودپرداز در مرکز شهر است.
  route: >-
    از تفلیس با E60/S1 به سمت غرب و از کنار گوری تا خاشوری بروید، حدود ۱۳۰ کیلومتر؛ سپس به جنوب و جادهٔ
    S8 بپیچید برای ۳۰ کیلومتر آخر تا بورجومی: روی هم ۱۶۰ کیلومتر و حدود ۲ ساعت و ۲۰ دقیقه. سراسر مسیر
    آسفالت خوب است و بخش دره در تمام زمستان باز نگه داشته می‌شود. تا خاشوری و در خود بورجومی سوخت به‌آسانی
    پیدا می‌شود. خودروی اقتصادی ایده‌آل است. اگر همان روز به باکوریانی می‌روید، جادهٔ Sh20 سی کیلومتر
    پیچ‌درپیچ بالا می‌رود و از دسامبر تا مارس لاستیک زمستانی می‌خواهد.
he:
  name: הפארק המרכזי של בורג'ומי והמעיינות המינרליים
  short: פארק מרפא מהמאה ה-19 בערוץ צר ומיוער, שבו ממלאים בקבוק משלכם במי בורג'ומי מלוחים ופושרים מעט,
    ישר מן המעיין.
  body: >-
    **הרבה לפני שבורג'ומי נעשה לטעם המוגז של חצי אימפריה לשעבר, הוא היה פלג מלוח ודקיק בערוץ הירוק הזה,
    וכאן אפשר עדיין לשתות אותו בחינם.**


    הצבא הרוסי הגיע לכאן בשנות ה-20 של המאה ה-19, ובשנות ה-30 באו בעקבותיו בתי המרחץ. בראשית שנות ה-40
    הביא לכאן יבגני גולובין, המפקד העליון הרוסי בקווקז, את בתו לטיפול, והמסורת העניקה את שמה, אקטרינה,
    למעיין המפורסם ביותר בפארק. כמה שנים לאחר מכן הפך מיכאיל וורונצוב, המשנה למלך בקווקז, את בורג'ומי
    למעון הקיץ שלו ונטע פארקים חדשים; ב-1871 עברה האחוזה כולה לידי הדוכס הגדול מיכאיל ניקולאייביץ', וב-1890
    נבנה מפעל הביקבוק הראשון. הבניין הישן שלו עדיין עומד משמאלכם כשאתם עוברים בשער.


    חמש דקות הלאה נמצאת הסיבה לביקור: הביתן שמעל מעיין אקטרינה, שבו המים זורמים מן הברזים פושרים, תוססים
    ומינרליים בלי שום ספק. טעמם טעם של מלח ואבן, ואין בו דבר מן הגרסה הצוננת שבבקבוק. מי שטועם בפעם הראשונה
    בדרך כלל מעווה את פניו, ואז חוזר לכוס שנייה.


    מעבר למעיין הפארק מצטמצם ליער שלאורך הנהר, עם ספסלים, בתי קפה ולונה פארק לילדים. שביל של כשניים וחצי
    קילומטרים ממשיך אל בריכות גופרית פתוחות, ורכבל ליד הכניסה מעלה אתכם לנקודות תצפית על המצוק שמעל העיר.


    אחרי שהצבא האדום הגיע ב-1921, אחוזות האריסטוקרטים הפכו לבתי הבראה. המעיין נשאר במקומו, וכך גם התור
    של אנשים עם בקבוקים ריקים. הצטרפו אליו: פעם עמדה בו בתו של גנרל.
  tip: >-
    הביאו בקבוק ריק, ואם אתם ממשיכים ברגל אל בריכות הגופרית – גם בגד ים ומגבת; הכניסה לבריכות בתשלום נפרד.
    בשער הפארק גובים דמי כניסה נמוכים. החנו במרכז העיר ולכו את מאות המטרים האחרונים ברגל, כי בסופי שבוע
    של הקיץ מקומות החניה נעלמים. שעתיים-שלוש מספיקות לפארק; עם הבריכות זה חצי יום. הבקרים הם השקטים ביותר,
    כשהערפל עוד תלוי בערוץ. בחורף הפארק פתוח, אבל השביל לבריכות עלול להיות קפוא. בתי קפה, שירותים וכספומטים
    נמצאים במרכז.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, על פני גורי, עד חשורי – כ-130 ק"מ – ואז פנו דרומה לכביש S8 ל-30 הק"מ
    האחרונים עד בורג'ומי: 160 ק"מ, כ-2 שעות ו-20 דקות. כביש סלול וטוב לכל האורך, וקטע הערוץ נשמר פתוח
    לאורך כל החורף. קל למצוא דלק עד חשורי ובבורג'ומי עצמה. רכב חסכוני הוא הבחירה האידיאלית. אם אתם ממשיכים
    באותו יום לבקוריאני, כביש Sh20 מטפס 30 ק"מ של סרפנטינות, ומדצמבר עד מרץ נדרשים בו צמיגי חורף.
ar:
  name: حديقة بورجومي المركزية والينابيع المعدنية
  short: >-
    حديقة استشفائية من القرن التاسع عشر في وادٍ ضيق تكسوه الغابات، تملأ فيها زجاجتك بمياه بورجومي المالحة
    الفاترة قليلًا مباشرة من النبع.
  body: >-
    **قبل أن تصبح بورجومي بزمن طويل الطعمَ الفوّار لنصف إمبراطورية سابقة، كانت جدولًا مالحًا رفيعًا في
    هذا الوادي الأخضر، وهنا ما زال بوسعك أن تشربها مجانًا.**


    وصل الجيش الروسي في عشرينيات القرن التاسع عشر، وتبعته الحمّامات في الثلاثينيات. وفي مطلع الأربعينيات
    جاء يفغيني غولوفين، القائد العام الروسي في القوقاز، بابنته إلى هنا للاستشفاء، وأطلقت الرواية المتوارثة
    اسمها، إكاتيريني، على أشهر ينابيع الحديقة. وبعد سنوات قليلة اتخذ نائب الملك في القوقاز ميخائيل فورونتسوف
    من بورجومي مقرًا صيفيًا له وأنشأ حدائق جديدة؛ وفي 1871 انتقلت الضيعة كلها إلى الدوق الأكبر ميخائيل
    نيكولايفيتش، وفي 1890 بُني أول مصنع لتعبئة المياه. ولا يزال مبناه القديم قائمًا على يسارك حين تعبر
    البوابة.


    وعلى بعد خمس دقائق يكمن سبب الزيارة: الجناح القائم فوق نبع إكاتيريني، حيث تنساب المياه من الصنابير
    فاترةً، فوّارةً، معدنيةً بلا أدنى لبس. طعمها طعم الملح والحجر، ولا يشبه في شيء النسخة المبرّدة في
    الزجاجة. عادةً ما يقطّب القادمون الجدد وجوههم عند الرشفة الأولى، ثم يعودون لكوب ثانٍ.


    وبعد النبع تضيق الحديقة لتصير غابة على امتداد النهر، فيها مقاعد ومقاهٍ ومدينة ألعاب للأطفال. ويقود
    درب طوله نحو كيلومترين ونصف إلى أحواض كبريتية في الهواء الطلق، بينما يرفعك تلفريك قرب المدخل إلى نقاط
    مطلّة على الجرف فوق البلدة.


    بعد وصول الجيش الأحمر عام 1921 تحوّلت قصور الأرستقراطيين إلى مصحّات. وبقي النبع في مكانه، وبقي معه
    طابور الناس حاملي الزجاجات الفارغة. انضمّ إليه: فقد وقفت فيه يومًا ابنة جنرال.
  tip: >-
    أحضر زجاجة فارغة، وملابس سباحة ومنشفة إن كنت ستواصل السير إلى الأحواض الكبريتية، التي تتقاضى رسومها
    الخاصة. عند بوابة الحديقة رسم دخول بسيط. اركن السيارة في وسط البلدة وامشِ بضع مئات الأمتار الأخيرة،
    لأن المواقف تختفي في عطلات نهاية الأسبوع صيفًا. تكفي الحديقة ساعتان إلى ثلاث؛ ومع الأحواض تصبح الزيارة
    نصف يوم. الصباح أهدأ الأوقات، حين لا يزال الضباب معلّقًا في الوادي. في الشتاء تبقى الحديقة مفتوحة،
    لكن الدرب إلى الأحواض قد يكون متجمّدًا. المقاهي ودورات المياه وأجهزة الصرف الآلي في وسط البلدة.
  route: >-
    من تبليسي خذ الطريق E60/S1 غربًا مرورًا بغوري حتى خاشوري، نحو 130 كم، ثم انعطف جنوبًا إلى الطريق S8
    لآخر 30 كم حتى بورجومي: 160 كم، ونحو ساعتين و20 دقيقة. الأسفلت جيد على طول الطريق، ويبقى مقطع الوادي
    سالكًا طوال الشتاء. الوقود متوفر بسهولة حتى خاشوري وفي بورجومي نفسها. السيارة الاقتصادية مثالية. وإن
    كنت ستتابع إلى باكورياني في اليوم نفسه، فالطريق Sh20 يصعد 30 كم من المنعطفات المتعرّجة التي تحتاج
    إلى إطارات شتوية من ديسمبر إلى مارس.
