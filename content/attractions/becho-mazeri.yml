ka:
  name: ბეჩო და მაზერი
  short: დოლრის ხეობა უშბის ძირში, შდუგრას ჩანჩქერითა და მესტიაზე ბევრად მშვიდი, ჯერ კიდევ ცოცხალი სოფლებით.
  body: >-
    **ბეჩოში იმისთვის მიდიან, რომ უშბა ახლოს ნახონ.** დოლრის ხეობა მესტიის დასავლეთით იხსნება, მთავარი
    სოფელი მაზერი დაახლოებით 1600 მეტრზეა და ხეობის თავში პირდაპირ ორთავიანი მასივი დგას.


    უშბა 4710 მეტრია და კავკასიონის ყველაზე რთულ მთებშია. ის უმაღლესი არაა, მაგრამ ორი ციცაბო კოშკის სილუეტმა
    ის სვანეთის სიმბოლოდ აქცია. მაზერიდან მასზე ყოველგვარი ასვლის გარეშე იყურები — ეს იშვიათია.


    მეორე მიზეზი შდუგრას ჩანჩქერია. ის ხეობის კედელზე გრძელი, საფეხურებიანი ნაკადით ეშვება და საქართველოში
    ერთ-ერთ ყველაზე მაღლად ითვლება. მაზერიდან ფეხით სამიდან ოთხ საათამდე გჭირდება იქით და უკან: ჯერ წიფლისა
    და არყის ტყე, შემდეგ ლოდნარი და ბოლოს ჩანჩქერის ძირი. ერთ ადგილას ადგილობრივებმა ბაგირით გადასასვლელი
    მოაწყვეს, თუმცა ფეხითაც შეიძლება შემოვლა.


    უფრო ზემოთ, დოლრის სათავეში, უშბის მყინვარი და მისი ყინულის ჩამონაქცევია. იქამდე მისვლა უკვე სრული
    დღეა და გამცილებელი სჯობს.


    ბეჩო სვანეთის სხვა ხეობებზე ნაკლებად არის ტურისტული და ეს იგრძნობა. აქ ავტობუსი არ დგება, სუვენირის
    ჯიხური არ არის და საღამოს სოფელში საქონელი ბრუნდება. ვინც სვანეთს მესტიის ცენტრალური მოედნის მიხედვით
    იცნობს, აქ სულ სხვა სურათს ნახავს.


    მაზერსა და მეზობელ უბნებში სვანური კოშკებია — ნაკლები, ვიდრე უშგულში, სამაგიეროდ ჯერ კიდევ საცხოვრებელ
    ეზოებში, და არა ღია ცის ქვეშ მუზეუმად.


    ბეჩოს უღელტეხილი ჩრდილოეთით, რუსეთის საზღვრისკენ მიდის. ეს ტურისტული მარშრუტი არ არის და მისი გავლა
    არ ღირს.


    ახლა გულახდილად ამინდზე. უშბა დროის დიდ ნაწილს ღრუბელშია. საუკეთესო შანსი დილაა, განსაკუთრებით ცივი
    ღამის შემდეგ; შუადღისთვის ხეობა ხშირად იხურება. თუ ერთ ღამეს გაათევ მაზერში, შანსი ორმაგდება.


    მაზერში სასტუმროებია — მესტიაზე მშვიდი და იაფი. საღამოს აქ თითქმის სრული სიჩუმეა, რაც მესტიაზე ზაფხულში
    ვეღარ ითქმის.


    დოლრის ხეობა ვიწროა და ციცაბო, ამიტომ მზე გვიან ამოდის და ადრე ჩადის; ზაფხულშიც კი დილა ცივია. ეს
    ჩანჩქერამდე ასვლას აადვილებს, ფოტოსთვის კი ნიშნავს, რომ ხეობის ფსკერზე შუქი მოკლე დროით არის კარგი.


    სეზონი ივნისიდან ოქტომბრის დასაწყისამდეა. მაისში ბილიკებზე ჯერ კიდევ თოვლია და მდინარეები ადიდებულია;
    ნოემბრიდან სოფელი ცარიელდება.


    ერთი სრული დღე — ჩანჩქერი, სოფელი და ხედი — ზუსტად საკმარისია.
  tip: >-
    შდუგრასთვის ექვსი საათი დაითვალე, თუმცა ბილიკი ტექნიკურად რთული არაა. მაგარი ფეხსაცმელი აუცილებელია:
    ლოდნარი და ფესვები სველია. მდინარის გადასასვლელები დღის ბოლოს უფრო წყალუხვია — ადრე გახვედი, ადრე
    დაბრუნდი. წყალი გზაზეა, საკვები არა. კავშირგაბმულობა სოფლის ზემოთ ქრება. უშბისთვის დილის შუქი საუკეთესოა.
    ღამის გასათევად მაზერი ჯობია მესტიას, თუ სიმშვიდე გინდა; ზამთარში სასტუმროების ნაწილი იკეტება, ამიტომ
    წინასწარ დარეკვა ღირს. ბანკომატი და აფთიაქი მხოლოდ მესტიაშია.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდისკენ და ჩრდილოეთით ენგურის ხეობის გზით; მესტიამდე დაახლოებით
    ოცდახუთი კილომეტრით ადრე ბეჩოს შესახვევს აიღებ და დოლრის ხეობაში ავალ. სულ დაახლოებით 455 კმ და რვა
    საათი ოცი წუთი. მთავარი გზა ასფალტია; ბეჩოდან მაზერამდე ათიოდე კილომეტრი ღორღია, ორმოებით და ორიოდე
    ღელის გადასასვლელით. მშრალ ამინდში შემაღლებული ავტომობილი გაივლის; გაზაფხულზე ან წვიმის შემდეგ ჯიპი
    სჭირდება. მანქანა სოფლის ბოლოს, ბილიკის დასაწყისთან დატოვე. საწვავი ზუგდიდში აიღე — შემდეგ საიმედო
    სადგური აღარ არის.
en:
  name: Becho and Mazeri
  short: The Dolra valley under Ushba, with the Shdugra waterfall and villages far quieter than Mestia.
  body: >-
    **People come to Becho to see Ushba from close up.** The Dolra valley opens west of Mestia, the main
    village of Mazeri sits at about 1,600 metres, and the twin-headed massif stands directly at the head
    of the valley.


    Ushba is 4,710 metres and among the hardest mountains in the Caucasus. It is not the highest, but
    the silhouette of its two steep towers made it the emblem of Svaneti. From Mazeri you look straight
    at it without climbing anything, which is rare.


    The second reason to come is the Shdugra waterfall, a long stepped cascade down the valley wall and
    one of the tallest falls in Georgia. From Mazeri the walk takes three to four hours there and back:
    beech and birch forest first, then boulder fields, then the base of the fall. At one point local people
    have rigged a rope crossing, though you can also walk around.


    Higher up, at the head of the Dolra, are the Ushba glacier and its icefall. Reaching that is a full
    day and better done with a guide.


    Mazeri and the neighbouring hamlets have Svan towers — fewer than at Ushguli, but standing in working
    yards rather than in an open-air museum.


    The Becho pass leads north towards the Russian border. It is not a visitor route and should not be
    attempted.


    Now, honestly, about the weather. Ushba is in cloud a great deal of the time. Mornings offer the best
    chance, especially after a cold night; by midday the valley often shuts down. Staying one night in
    Mazeri roughly doubles your odds.


    There are guesthouses in Mazeri, quieter and cheaper than Mestia. In the evening the silence here
    is close to total, which can no longer be said of Mestia in summer.


    The season runs from June to early October. In May snow still lies on the paths and the rivers are
    in flood; from November the village empties.


    One full day — the waterfall, the village and the view — is exactly right.
  tip: >-
    Allow six hours for Shdugra, though the path is not technically hard. Solid boots matter: the boulders
    and roots are wet. River crossings carry more water late in the day, so start early and come back
    early. There is water along the way but no food. The phone signal disappears above the village. Morning
    light is best for Ushba. For a night's stay Mazeri beats Mestia if you want quiet, though some guesthouses
    close in winter and it is worth checking before you drive up.
  route: >-
    From Tbilisi take the E60 to Senaki, then Zugdidi, then north up the Enguri valley; about twenty-five
    kilometres before Mestia take the Becho turning and climb into the Dolra valley. About 455 km in all
    and eight hours twenty. The main road is asphalt; the ten kilometres from Becho up to Mazeri are gravel,
    potholed, with a couple of stream crossings. In dry weather a raised car manages it; in spring or
    after rain you want four-wheel drive. Refuel in Zugdidi, since nothing beyond is reliable.
ru:
  name: Бечо и Мазери
  short: Долина Долры под Ушбой, с водопадом Шдугра и сёлами куда более тихими, чем Местиа.
  body: >-
    **В Бечо едут, чтобы увидеть Ушбу вблизи.** Долина Долры открывается западнее Местии, главное село
    Мазери стоит примерно на 1600 метрах, а двуглавый массив поднимается прямо в верховьях долины.


    Ушба — 4710 метров и одна из самых сложных гор Кавказа. Она не самая высокая, но силуэт двух отвесных
    башен сделал её эмблемой Сванетии. Из Мазери на неё смотришь прямо, никуда не поднимаясь, а это редкость.


    Вторая причина приехать — водопад Шдугра, длинный ступенчатый каскад по стене долины и один из самых
    высоких в Грузии. Пешком от Мазери туда и обратно уходит три-четыре часа: сначала буковый и берёзовый
    лес, потом курумник, потом подножие водопада. В одном месте местные натянули верёвочную переправу,
    хотя можно обойти и пешком.


    Выше, в верховьях Долры, находятся ледник Ушбы и его ледопад. Дойти туда — уже полный день, и лучше
    с проводником.


    Бечо туристически освоено меньше других сванских долин, и это чувствуется. Автобусы сюда не заезжают,
    сувенирных лотков нет, а вечером по селу возвращается скот. Тот, кто знает Сванетию по центральной
    площади Местии, увидит здесь совсем другую картину.


    В Мазери и соседних хуторах есть сванские башни: их меньше, чем в Ушгули, зато они стоят в живых дворах,
    а не в музее под открытым небом.


    Перевал Бечо ведёт на север, к российской границе. Это не туристический маршрут, и пытаться его пройти
    не стоит.


    Теперь честно о погоде. Ушба значительную часть времени в облаках. Лучший шанс — утро, особенно после
    холодной ночи; к полудню долина часто закрывается. Ночёвка в Мазери примерно удваивает шансы.


    В Мазери есть гостевые дома, тише и дешевле, чем в Местии. Вечером тишина здесь почти полная, чего
    о летней Местии уже не скажешь.


    Сезон — с июня по начало октября. В мае на тропах ещё лежит снег, а реки в паводке; с ноября село
    пустеет.


    Один полный день — водопад, село и вид — ровно то, что нужно.
  tip: >-
    На Шдугру закладывайте шесть часов, хотя технически тропа несложная. Нужны крепкие ботинки: камни
    и корни мокрые. Броды к вечеру полноводнее, поэтому выходите рано и рано возвращайтесь. Вода по пути
    есть, еды нет. Связь пропадает выше села. Для Ушбы лучше утренний свет. На ночёвку Мазери выигрывает
    у Местии, если нужна тишина, хотя зимой часть гостевых домов закрыта, так что стоит позвонить заранее.
    Банкомат и аптека есть только в Местии.
  route: >-
    Из Тбилиси по E60 до Сенаки, затем до Зугдиди и на север по ущелью Ингури; километрах в двадцати пяти
    не доезжая Местии сверните на Бечо и поднимайтесь в долину Долры. Всего около 455 км и восемь часов
    двадцать минут. Основная дорога асфальтированная; десять километров от Бечо до Мазери — гравий с ямами
    и парой ручьёв поперёк. В сухую погоду проходит машина с клиренсом; весной и после дождя нужен полный
    привод. Заправляйтесь в Зугдиди, дальше надёжных станций нет.
fa:
  name: بچو و مازری
  short: درهٔ دولرا زیر کوه اوشبا، با آبشار شدوگرا و روستاهایی بسیار آرام‌تر از مستیا.
  body: >-
    **مردم به بچو می‌آیند تا اوشبا را از نزدیک ببینند.** درهٔ دولرا در غرب مستیا گشوده می‌شود، روستای
    اصلی مازری در ارتفاع حدود ۱۶۰۰ متر است و تودهٔ دوقله درست در انتهای دره ایستاده است.


    اوشبا ۴۷۱۰ متر است و از دشوارترین کوه‌های قفقاز. بلندترین نیست، اما نیم‌رخ دو برج تند آن آن را نماد
    سوانتی کرده است. از مازری بی‌آنکه از جایی بالا بروید مستقیم به آن نگاه می‌کنید و این کم پیش می‌آید.


    دلیل دوم آمدن آبشار شدوگرا است، آبشاری بلند و پلکانی بر دیوارهٔ دره و از بلندترین آبشارهای گرجستان.
    پیاده‌روی از مازری رفت و برگشت سه تا چهار ساعت می‌برد: نخست جنگل راش و توس، سپس تخته‌سنگ‌ها و آنگاه
    پای آبشار. در یک نقطه اهالی گذرگاهی طنابی بسته‌اند، هرچند می‌توان پیاده دور زد.


    بالاتر، در سرچشمهٔ دولرا، یخچال اوشبا و آبشار یخی آن است. رسیدن به آنجا یک روز کامل می‌خواهد و بهتر
    است با راهنما باشد.


    در مازری و آبادی‌های همسایه برج‌های سوانی هست؛ کمتر از اوشگولی، اما ایستاده در حیاط‌هایی که هنوز زندگی
    در آنهاست، نه در موزه‌ای روباز.


    گردنهٔ بچو به شمال و به سوی مرز روسیه می‌رود. این مسیر گردشگری نیست و نباید به آن نزدیک شد.


    و اما صادقانه دربارهٔ هوا. اوشبا بخش بزرگی از وقت در ابر است. بهترین شانس صبح است، به‌ویژه پس از شبی
    سرد؛ تا ظهر دره اغلب بسته می‌شود. یک شب ماندن در مازری شانس شما را تقریباً دو برابر می‌کند.


    در مازری اقامتگاه هست، آرام‌تر و ارزان‌تر از مستیا. شب‌ها سکوت اینجا تقریباً کامل است، چیزی که دربارهٔ
    مستیای تابستان دیگر نمی‌توان گفت.


    فصل از خرداد تا اوایل مهر است. در اردیبهشت هنوز برف روی مسیرهاست و رودها طغیان دارند؛ از آبان روستا
    خالی می‌شود.


    یک روز کامل — آبشار و روستا و منظره — دقیقاً به‌اندازه است.
  tip: >-
    برای شدوگرا شش ساعت در نظر بگیرید، هرچند مسیر از نظر فنی دشوار نیست. پوتین محکم مهم است، چون سنگ‌ها
    و ریشه‌ها خیس‌اند. گذر از رودها اواخر روز پرآب‌تر است، پس زود راه بیفتید و زود برگردید. در راه آب
    هست اما خوراک نیست. آنتن بالاتر از روستا قطع می‌شود. برای اوشبا نور صبح بهترین است. برای یک شب اقامت،
    اگر آرامش می‌خواهید مازری بر مستیا می‌چربد، هرچند برخی اقامتگاه‌ها زمستان بسته‌اند.
  route: >-
    از تفلیس با E60 تا سناکی، سپس زوگدیدی و به شمال در درهٔ اینگوری؛ حدود بیست و پنج کیلومتر پیش از مستیا
    انشعاب بچو را بگیرید و به درهٔ دولرا بالا بروید. رویهم حدود ۴۵۵ کیلومتر و هشت ساعت و بیست دقیقه. جادهٔ
    اصلی آسفالت است؛ ده کیلومتر از بچو تا مازری شنی و چاله‌دار است و دو گذرِ جویبار دارد. در هوای خشک
    خودروی مرتفع از پس آن برمی‌آید؛ در بهار یا پس از باران چهارچرخ‌محرک لازم است. سوخت را در زوگدیدی بگیرید.
he:
  name: בצ׳ו ומזרי
  short: עמק הדולרה תחת הר אושבה, עם מפל שדוגרה ועם כפרים שקטים בהרבה מאשר מסטיה.
  body: >-
    **לבצ׳ו באים כדי לראות את אושבה מקרוב.** עמק הדולרה נפתח ממערב למסטיה, הכפר הראשי מזרי יושב בגובה
    כ-1,600 מטרים, והמסיב הדו-ראשי ניצב ממש בראש העמק.


    אושבה מתנשאת ל-4,710 מטרים והיא מן ההרים הקשים בקווקז. אין זה ההר הגבוה ביותר, אבל צללית שני המגדלים
    התלולים הפכה אותו לסמלה של סוונתי. ממזרי מביטים בו ישירות בלי לטפס לשום מקום, וזה נדיר.


    הסיבה השנייה לבוא היא מפל שדוגרה, מפל מדורג ארוך היורד על קיר העמק ואחד הגבוהים בגאורגיה. ההליכה ממזרי
    אורכת שלוש עד ארבע שעות הלוך ושוב: תחילה יער אשור וליבנה, אחר כך שדות סלעים, ולבסוף מרגלות המפל. בנקודה
    אחת מתחו המקומיים מעבר חבלים, אך אפשר גם לעקוף ברגל.


    גבוה יותר, בראש הדולרה, נמצאים קרחון אושבה ומפל הקרח שלו. ההגעה לשם היא יום שלם ועדיף לעשותה עם מדריך.


    בצ׳ו מפותח תיירותית פחות מעמקי סוונתי האחרים, וזה מורגש. אוטובוסים אינם מגיעים לכאן, אין דוכני מזכרות,
    ובערב חוזר העדר דרך הכפר. מי שמכיר את סוונתי לפי הכיכר המרכזית של מסטיה יראה כאן תמונה אחרת לגמרי.


    במזרי ובכפרונים הסמוכים יש מגדלים סוואניים — פחות מאשר באושגולי, אך הם עומדים בחצרות פעילות ולא במוזיאון
    פתוח.


    מעבר בצ׳ו מוביל צפונה לעבר הגבול הרוסי. זה אינו מסלול למבקרים ואין לנסות אותו.


    ועכשיו בכנות על מזג האוויר. אושבה מכוסה עננים חלק ניכר מן הזמן. הבוקר מציע את הסיכוי הטוב ביותר, בייחוד
    אחרי לילה קר; עד הצהריים העמק נסגר לא פעם. לינה אחת במזרי מכפילה בערך את הסיכויים.


    במזרי יש אכסניות, שקטות וזולות יותר מאשר במסטיה. בערב השקט כאן כמעט מוחלט, מה שכבר אי אפשר לומר על
    מסטיה בקיץ.


    עמק הדולרה צר ותלול, ולכן השמש עולה בו מאוחר ושוקעת מוקדם; גם בקיץ הבוקר קר. הדבר מקל על העלייה אל
    המפל, אך מבחינת צילום פירושו שהאור בקרקעית העמק טוב רק לפרק זמן קצר.


    העונה נמשכת מיוני ועד תחילת אוקטובר. במאי עדיין מונח שלג על השבילים והנהרות גואים; מנובמבר הכפר מתרוקן.


    יום מלא אחד — המפל, הכפר והנוף — הוא בדיוק המידה הנכונה.
  tip: >-
    הקצו שש שעות לשדוגרה, אף שהשביל אינו קשה מבחינה טכנית. נעליים חזקות חשובות: הסלעים והשורשים רטובים.
    חציות הנחלים מלאות יותר בשעות אחר הצהריים, לכן צאו מוקדם וחזרו מוקדם. יש מים בדרך אך אין אוכל. הקליטה
    נעלמת מעל הכפר. לאושבה אור הבוקר הוא הטוב ביותר. ללינה מזרי עדיפה על מסטיה אם רוצים שקט, אם כי בחורף
    חלק מן האכסניות סגורות וכדאי להתקשר מראש. כספומט ובית מרקחת יש רק במסטיה.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לזוגדידי וצפונה במעלה עמק האינגורי; כעשרים וחמישה קילומטרים לפני
    מסטיה פנו לבצ׳ו ועלו אל עמק הדולרה. כ-455 ק״מ בסך הכול ושמונה שעות ועשרים. הכביש הראשי סלול; עשרת
    הקילומטרים מבצ׳ו למזרי מחוצצים, מלאי בורות ובהם שתי חציות נחל. במזג אוויר יבש רכב מוגבה מסתדר; באביב
    או אחרי גשם דרושה הנעה כפולה. תדלקו בזוגדידי, כי הלאה אין תחנה אמינה.
ar:
  name: بيتشو ومازيري
  short: وادي دولرا تحت جبل أوشبا، بشلال شدوغرا وقرى أهدأ بكثير من مستيا.
  body: >-
    **يأتي الناس إلى بيتشو ليروا أوشبا عن قرب.** ينفتح وادي دولرا غربي مستيا، وتقع قرية مازيري الرئيسية
    على ارتفاع نحو 1600 متر، وتقف الكتلة ذات القمتين في رأس الوادي مباشرة.


    يبلغ ارتفاع أوشبا 4710 أمتار وهو من أصعب جبال القوقاز. ليس أعلاها، لكن ظل برجيه الحادين جعله شعار
    سفانيتي. ومن مازيري تنظر إليه مباشرة دون أن تتسلق شيئاً، وهذا نادر.


    والسبب الثاني للمجيء هو شلال شدوغرا، وهو انحدار طويل متدرج على جدار الوادي ومن أعلى شلالات جورجيا.
    تستغرق المسيرة من مازيري ثلاث إلى أربع ساعات ذهاباً وإياباً: غابة زان وبتولا أولاً، ثم حقول الصخور،
    ثم قاعدة الشلال. وفي موضع نصب الأهالي معبراً بالحبال، وإن كان يمكن الالتفاف سيراً.


    وأعلى من ذلك، في رأس دولرا، يقع نهر أوشبا الجليدي وشلاله الجليدي. والوصول إليه يوم كامل، والأفضل أن
    يكون بصحبة مرشد.


    بيتشو أقل تطويراً سياحياً من أودية سفانيتي الأخرى، وهذا محسوس. فالحافلات لا تصل إليها، ولا أكشاك تذكارات
    فيها، وفي المساء تعود المواشي عبر القرية. ومن يعرف سفانيتي من ساحة مستيا المركزية سيرى هنا صورة مختلفة
    تماماً.


    وفي مازيري والقرى المجاورة أبراج سفانية؛ أقل مما في أوشغولي، لكنها قائمة في أفنية عامرة لا في متحف
    مكشوف.


    ويقود ممر بيتشو شمالاً نحو الحدود الروسية. وليس مساراً للزوار ولا ينبغي محاولته.


    والآن بصراحة عن الطقس. أوشبا في الغيم معظم الوقت. والصباح يمنح أفضل فرصة، وخاصة بعد ليلة باردة؛ فبحلول
    الظهر ينغلق الوادي في الغالب. والمبيت ليلة في مازيري يضاعف حظوظك تقريباً.


    في مازيري بيوت ضيافة، أهدأ وأرخص من مستيا. وفي المساء يقارب السكون هنا التمام، وهو ما لم يعد يقال
    عن مستيا في الصيف.


    والموسم من حزيران إلى أوائل تشرين الأول. ففي أيار ما زال الثلج على الدروب والأنهار في فيضانها؛ ومن
    تشرين الثاني تفرغ القرية.


    ويوم كامل واحد — الشلال والقرية والمنظر — هو القدر المناسب تماماً.
  tip: >-
    خصص ست ساعات لشدوغرا، وإن كان الدرب غير صعب تقنياً. الحذاء المتين مهم: فالصخور والجذور مبللة. ومعابر
    الأنهار أغزر ماءً في آخر النهار، فانطلق مبكراً وعد مبكراً. الماء متوفر على الطريق أما الطعام فلا.
    والتغطية تختفي فوق القرية. ولأوشبا يكون ضوء الصباح الأفضل. وللمبيت تتفوق مازيري على مستيا إن أردت
    الهدوء، وإن كان بعض بيوت الضيافة يغلق في الشتاء، فيحسن الاتصال مسبقاً. والصراف الآلي والصيدلية لا
    توجد إلا في مستيا.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم زوغديدي، ثم شمالاً في وادي إنغوري؛ وقبل مستيا بنحو خمسة وعشرين
    كيلومتراً خذ منعطف بيتشو واصعد إلى وادي دولرا. نحو 455 كم إجمالاً وثماني ساعات وعشرين دقيقة. الطريق
    الرئيسي معبّد؛ أما العشرة كيلومترات من بيتشو إلى مازيري فحصوية مليئة بالحفر وفيها معبران لجداول. في
    الجو الجاف تتدبر المركبة المرتفعة أمرها؛ وفي الربيع أو بعد المطر تحتاج دفعاً رباعياً. تزوّد بالوقود
    في زوغديدي، فلا محطة موثوقة بعده.
