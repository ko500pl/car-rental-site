ka:
  name: ბეჩო და მაზერი
  short: >-
    დოლრის ხეობა უშბის ორი წვერის ძირში: მაზერი 1660 მეტრზე, უშბის მყინვარით ნაკვები 120-მეტრიანი ჩანჩქერი
    და სიმშვიდე, რომელიც მესტიას დიდი ხანია დაეკარგა.
  body: >-
    **მაზერიდან უშბის სანახავად არსად ასვლა არ გჭირდებათ — ის თავად ავსებს ხეობის თავს: ორი კლდოვანი ისარი,
    გვერდიგვერდ, ცაში.**


    ბეჩო ცამეტი სოფლის თემია, ენგურის მარჯვენა შენაკადის, დოლრაჭალის ხეობაში, მესტიიდან 25 კილომეტრში.
    მისი ყველაზე ცნობილი სოფელი, მაზერი, ზღვის დონიდან 1660 მეტრზე დგას. ისტორიამაც გაიარა აქ: ოდესღაც
    დადეშქელიანთა სვანეთის ნაწილი, XIX საუკუნის 50-იან წლებში, რუსეთის მმართველობის დამყარების შემდეგ,
    მაზერი სვანეთის საბოქაულოს ადმინისტრაციულ ცენტრად იქცა. დღეს აქ საქონელია, თივის ზვინები, რამდენიმე
    კოშკი ცოცხალ ეზოებში და ისეთი მყუდრო საღამოები, როგორიც მესტიას ხალხმრავლობამდე ჰქონდა.


    უშბა კავკასიონის ათ უმაღლეს მწვერვალში არ შედის, მაგრამ ბევრი ალპინისტი მას ყველაზე რთულ ასასვლელად
    მიიჩნევს. სამხრეთი წვერი 4710 მეტრია, ჩრდილოეთი — 4690; მათ შორის დაახლოებით 637 მეტრია. ჩრდილოეთი
    წვერი პირველად 1888 წელს ჯონ გარფორთ კოკინმა და ულრიხ ალმერმა დალაშქრეს, სამხრეთი კი 1903 წლის 26
    ივლისამდე უძლებდა. 1937 წელს უშბაზე სვანი ვისარიონ ხერგიანიც ავიდა — მისი ვაჟი, მიხეილი, შემდეგ საბჭოთა
    კავშირის ერთ-ერთი ყველაზე სახელოვანი ალპინისტი გახდა. სვანური გადმოცემით, უშბა ნადირობის ქალღმერთის,
    დალის სავანეა.


    მაზერიდან ბილიკი წიწვოვან ტყეში შდუგრისკენ მიდის — დაახლოებით 120-მეტრიანი ჩანჩქერისკენ, რომელსაც
    უშბის მყინვარი კვებავს და რომელიც გვიან გაზაფხულსა და ზაფხულის დასაწყისში ყველაზე წყალუხვია. ძირამდე
    დაახლოებით 3 კილომეტრია, თავამდე — კიდევ 3, მდინარის გადალახვით; ზემოთ, მყინვარის ძირში, უზარმაზარი
    ლოდებია დახვავებული.


    ჩანჩქერისთვის ჩამოხვალთ, დარჩებით კი იმ წამისთვის, როცა ღრუბელი ორ წვერს მოშორდება.
  tip: >-
    შდუგრამდე და უკან, ზედა მონაკვეთის ჩათვლით, ხუთი-ექვსი საათი დაითვალეთ. წყალი მაზერიდანვე წამოიღეთ
    — გზაზე ვერ იშოვით; წვიმის ქურთუკიც გამოგადგებათ, ჩანჩქერთან შხეფები ყველაფერს ასველებს. ბილიკზე სასაზღვრო
    პოლიციის საგუშაგოა, ამიტომ პასპორტი თან იქონიეთ. ადრე გადით: უშბა ყველაზე ხშირად დილით მოწმენდილია,
    შუადღის ღრუბელი კი ხეობას ხშირად ხურავს. სველ ლოდებზე სიარულისთვის კარგი ძირის მქონე ფეხსაცმელი ჩაიცვით.
    მაზერის სასტუმროები მესტიისაზე მშვიდია; ზოგი ზამთარში იკეტება — წინასწარ დარეკეთ. ბანკომატები და აფთიაქი
    მესტიაშია.
  route: >-
    თბილისიდან E60-ით (ს-1) დასავლეთით ზუგდიდამდე, შემდეგ შ-7-ით ჩრდილოეთით, ენგურის ხეობას აუყევით. მესტიამდე
    დაახლოებით 16 კილომეტრით ადრე შ-99-ზე, ბეჩოსკენ გადაუხვიეთ და დოლრის ხეობაში დაახლოებით 9 კილომეტრი
    აიარეთ მაზერამდე. სულ დაახლოებით 455 კმ და რვა საათი და ოცი წუთია. მთავარი გზა ასფალტია, მაზერისკენ
    მიმავალი კი უფრო უხეშია — ორმოებითა და ღელის გადასასვლელებით. მშრალ ამინდში მაღალი კლირენსის მანქანა
    გაივლის, ამიტომაც რეკომენდებულია ჯიპი; გაზაფხულზე ან ძლიერი წვიმის შემდეგ ოთხივე თვლით წამყვანი მანქანა
    უფრო საიმედოა. ავზი ზუგდიდში ან ჯვარში შეავსეთ.
en:
  name: Becho and Mazeri
  short: >-
    The Dolra valley below Ushba's twin summits: Mazeri at 1,660 m, a 120-metre waterfall fed by the Ushba
    glacier, and the quiet Mestia has lost.
  body: >-
    **From Mazeri you do not climb to see Ushba — it simply fills the head of the valley, two rock spires
    side by side against the sky.**


    Becho is a community of thirteen villages strung along the Dolrachala, a right-bank tributary of the
    Enguri, 25 km from Mestia. Its best-known village, Mazeri, sits at 1,660 metres. The place has had
    its moment in history: once part of the Svaneti ruled by the Dadeshkeliani princes, Mazeri became
    the seat of the district administration after Russian rule arrived in the 1850s. Today it is cattle,
    hay, a few towers standing in working yards, and evenings as quiet as Mestia was before the crowds.


    Ushba is not among the ten highest peaks of the Caucasus, yet many climbers call it the hardest. Its
    south summit reaches 4,710 metres and the north 4,690, about 637 metres apart. The north summit fell
    first, in 1888, to John Garforth Cockin and Ulrich Almer; the south held out until 26 July 1903. In
    1937 a Svan, Vissarion Khergiani, climbed it too, and his son Mikheil grew up to become one of the
    most celebrated Soviet climbers. Svan tradition makes the mountain the home of Dali, the goddess of
    the hunt.


    The walk from Mazeri runs through conifer forest to Shdugra, a waterfall about 120 metres high fed
    by the Ushba glacier and fullest in late spring and early summer. It is about 3 km to its foot, and
    3 km more, with a river crossing, to its top, where boulders lie heaped beneath the glacier.


    Come for the waterfall; stay for the moment the cloud lifts off the two summits.
  tip: >-
    Allow five to six hours for Shdugra and back, including the upper section. Bring all your water from
    Mazeri, as there is none along the route, and a rain jacket for the spray near the fall. The trail
    passes a border police post, so carry your passport. Start early: Ushba is most often clear in the
    morning, and the afternoon cloud frequently shuts the valley. Wear boots with grip for the wet boulders.
    Guesthouses in Mazeri are quieter than those in Mestia; some close in winter, so call ahead. The cash
    machines and pharmacy are in Mestia.
  route: >-
    From Tbilisi take the E60 (S1) west to Zugdidi, then the Sh7 north up the Enguri gorge. Some 16 km
    before Mestia, turn off on the Sh99 towards Becho and climb about 9 km into the Dolra valley to Mazeri.
    That is about 455 km and eight hours twenty in all. The main road is asphalt; the side road to Mazeri
    is rougher, with potholes and stream crossings. In dry weather a raised car copes, which is why we
    recommend an SUV; in spring or after heavy rain, four-wheel drive is the safer choice. Fill up in
    Zugdidi or Jvari.
ru:
  name: Бечо и Мазери
  short: >-
    Долина Долры под двумя вершинами Ушбы: Мазери на 1660 м, 120-метровый водопад с ушбинского ледника
    и та тишина, которую утратила Местия.
  body: >-
    **Из Мазери не нужно никуда подниматься, чтобы увидеть Ушбу: она просто заполняет верховье долины
    — две скальные башни бок о бок на фоне неба.**


    Бечо — община из тринадцати сёл, растянувшихся вдоль Долрачалы, правого притока Ингури, в 25 км от
    Местии. Самое известное из них, Мазери, стоит на высоте 1660 метров. У этого места был свой час в
    истории: когда-то оно входило в ту часть Сванетии, которой правили князья Дадешкелиани, а после прихода
    русской власти в 1850-х годах Мазери стало центром окружного управления. Сегодня здесь коровы, сено,
    несколько башен посреди рабочих дворов и вечера такие же тихие, какими были вечера в Местии до наплыва
    туристов.


    Ушба не входит в десятку высочайших вершин Кавказа, но многие альпинисты считают её самой трудной.
    Южная вершина поднимается на 4710 метров, северная — на 4690, и разделяют их около 637 метров. Северная
    сдалась первой, в 1888 году, Джону Гарфорту Кокину и Ульриху Альмеру; южная держалась до 26 июля 1903
    года. В 1937 году на Ушбу поднялся и сван Виссарион Хергиани, а его сын Михаил вырос и стал одним
    из самых прославленных советских альпинистов. По сванскому преданию, на этой горе живёт Дали, богиня
    охоты.


    Тропа из Мазери идёт хвойным лесом к Шдугре — водопаду высотой около 120 метров, который питает ушбинский
    ледник; полноводнее всего он в конце весны и в начале лета. До его подножия около 3 км, и ещё 3 км,
    с переправой через реку, — до верха, где под ледником громоздятся валуны.


    Приезжайте ради водопада — и останьтесь ради той минуты, когда облако сползает с двух вершин.
  tip: >-
    На Шдугру и обратно, вместе с верхним участком, закладывайте пять-шесть часов. Всю воду берите из
    Мазери — на маршруте её нет, — а дождевик пригодится у водопада, где висит водяная пыль. Тропа проходит
    мимо поста пограничной полиции, так что паспорт возьмите с собой. Выходите рано: чаще всего Ушба открыта
    по утрам, а после полудня облака нередко закрывают долину. Нужна обувь с цепкой подошвой — валуны
    мокрые. Гостевые дома в Мазери тише, чем в Местии; некоторые зимой закрыты, так что звоните заранее.
    Банкоматы и аптека — в Местии.
  route: >-
    Из Тбилиси по E60 (S1) на запад до Зугдиди, затем по Sh7 на север вверх по ущелью Ингури. Примерно
    за 16 км до Местии сверните на Sh99 в сторону Бечо и поднимайтесь около 9 км по долине Долры до Мазери.
    Всего выходит около 455 км и восемь часов двадцать минут. Основная трасса асфальтирована; боковая
    дорога к Мазери хуже — выбоины и броды через ручьи. В сухую погоду справится машина с приподнятой
    подвеской, поэтому мы рекомендуем внедорожник; весной и после сильных дождей надёжнее полный привод.
    Заправьтесь в Зугдиди или Джвари.
fa:
  name: بچو و مازری
  short: >-
    درهٔ دولرا زیر دو قلهٔ اوشبا: مازری در ارتفاع ۱٬۶۶۰ متر، آبشاری ۱۲۰ متری که از یخچال اوشبا سیراب می‌شود،
    و آرامشی که مستیا از دست داده است.
  body: >-
    **از مازری برای دیدن اوشبا لازم نیست جایی بالا بروید؛ کوه خود سرِ دره را پر می‌کند: دو منارهٔ سنگی
    شانه‌به‌شانه در برابر آسمان.**


    بچو جامعه‌ای از سیزده روستاست که در امتداد دولراچالا، شاخه‌ای که از کرانهٔ راست به اینگوری می‌ریزد،
    در ۲۵ کیلومتری مستیا ردیف شده‌اند. شناخته‌ترینِ آن‌ها، مازری، در ارتفاع ۱٬۶۶۰ متر قرار دارد. این‌جا
    هم روزگاری در تاریخ نقشی داشته است: زمانی بخشی از سوانتیِ زیر فرمان شاهزادگان دادشکلیانی بود و پس
    از رسیدن حکومت روسیه در دههٔ ۱۸۵۰، مازری مقر ادارهٔ ناحیه شد. امروز این‌جا گاو است و علوفه، چند برج
    که در میان حیاط‌های کار و زندگی ایستاده‌اند، و شب‌هایی به آرامیِ مستیا پیش از هجوم گردشگران.


    اوشبا در میان ده قلهٔ بلند قفقاز نیست، اما بسیاری از کوهنوردان آن را دشوارترینشان می‌دانند. قلهٔ جنوبی‌اش
    به ۴٬۷۱۰ متر و قلهٔ شمالی به ۴٬۶۹۰ متر می‌رسد و حدود ۶۳۷ متر از هم فاصله دارند. قلهٔ شمالی نخست، در
    سال ۱۸۸۸، به دست جان گارفورث کاکین و اولریش آلمر فتح شد؛ قلهٔ جنوبی تا ۲۶ ژوئیهٔ ۱۹۰۳ پایداری کرد.
    در سال ۱۹۳۷ یک سوان، ویساریون خرگیانی، نیز از آن بالا رفت، و پسرش میخئیل بعدها یکی از نام‌آورترین
    کوهنوردان شوروی شد. در سنت سوانی، این کوه خانهٔ دالی، الههٔ شکار، است.


    راه پیاده از مازری از میان جنگل سوزنی‌برگ به شدوگرا می‌رسد، آبشاری حدود ۱۲۰ متری که از یخچال اوشبا
    سیراب می‌شود و در اواخر بهار و اوایل تابستان پرآب‌تر از همیشه است. تا پای آن حدود ۳ کیلومتر راه است
    و ۳ کیلومتر دیگر، با گذر از رود، تا بالای آن، جایی که تخته‌سنگ‌ها زیر یخچال روی هم انباشته شده‌اند.


    به خاطر آبشار بیایید؛ به خاطر لحظه‌ای بمانید که ابر از روی دو قله کنار می‌رود.
  tip: >-
    برای رفت و برگشت تا شدوگرا، همراه با بخش بالایی، پنج تا شش ساعت در نظر بگیرید. همهٔ آبتان را از مازری
    بردارید، چون در مسیر آبی نیست، و بارانی هم برای ذرات آبِ نزدیک آبشار همراه داشته باشید. مسیر از کنار
    پاسگاه پلیس مرزی می‌گذرد، پس گذرنامه‌تان را بیاورید. زود راه بیفتید: اوشبا بیشتر صبح‌ها صاف است و
    ابرِ بعدازظهر اغلب دره را می‌بندد. کفشی با کف چسبنده بپوشید، چون تخته‌سنگ‌ها خیس‌اند. مهمان‌خانه‌های
    مازری آرام‌تر از مستیا هستند؛ برخی در زمستان بسته‌اند، پس از پیش تماس بگیرید. خودپرداز و داروخانه
    در مستیاست.
  route: >-
    از تفلیس از جادهٔ E60 (S1) به سوی غرب تا زوگدیدی بروید، سپس از Sh7 به سوی شمال، درهٔ اینگوری را بالا
    بروید. حدود ۱۶ کیلومتر پیش از مستیا به Sh99 به سمت بچو بپیچید و نزدیک به ۹ کیلومتر در درهٔ دولرا بالا
    بروید تا به مازری برسید. روی هم رفته حدود ۴۵۵ کیلومتر و هشت ساعت و بیست دقیقه راه است. جادهٔ اصلی
    آسفالت است؛ راه فرعی مازری ناهموارتر است، با چاله و گذر از جویبارها. در هوای خشک خودرویی با ارتفاع
    بیشتر از زمین از پس آن برمی‌آید، از این رو شاسی‌بلند را پیشنهاد می‌کنیم؛ در بهار یا پس از باران شدید،
    خودروی دودیفرانسیل گزینهٔ مطمئن‌تری است. در زوگدیدی یا جواری سوخت‌گیری کنید.
he:
  name: בצ׳ו ומזרי
  short: >-
    עמק הדולרה למרגלות שתי פסגותיו של אושבה: מזרי בגובה 1,660 מ׳, מפל בגובה 120 מטרים שניזון מקרחון אושבה,
    והשקט שמסטיה איבדה.
  body: >-
    **ממזרי אין צורך לטפס כדי לראות את אושבה: הוא פשוט ממלא את ראש העמק, שני צריחי סלע זה לצד זה על רקע
    השמיים.**


    בצ׳ו היא קהילה של שלושה-עשר כפרים הפרושים לאורך הדולראצ׳אלה, יובל של האנגורי מגדתו הימנית, 25 ק״מ
    ממסטיה. הכפר הידוע שבהם, מזרי, שוכן בגובה 1,660 מטרים. גם למקום הזה היה רגע בהיסטוריה: פעם היה חלק
    מסוואנתי שבשלטון הנסיכים לבית דדשקליאני, ואחרי שהגיע לכאן השלטון הרוסי בשנות ה-50 של המאה ה-19 הפך
    מזרי למושב הממשל המחוזי. היום יש כאן פרות, חציר, כמה מגדלים הניצבים בחצרות משק פעילות, וערבים שקטים
    כפי שהיו במסטיה לפני בוא ההמונים.


    אושבה אינו נמנה עם עשר הפסגות הגבוהות בקווקז, ובכל זאת מטפסים רבים מכנים אותו הקשה מכולן. פסגתו הדרומית
    מגיעה ל-4,710 מטרים והצפונית ל-4,690, וכ-637 מטרים מפרידים ביניהן. הפסגה הצפונית נכבשה ראשונה, ב-1888,
    בידי ג׳ון גרפורת׳ קוקין ואולריך אלמר; הדרומית עמדה בפני המטפסים עד 26 ביולי 1903. ב-1937 טיפס עליו
    גם סוואני, ויסאריון חרגיאני, ובנו מיכאיל גדל והיה לאחד המטפסים המהוללים ביותר בברית המועצות. לפי המסורת
    הסוואנית, ההר הוא משכנה של דאלי, אלת הציד.


    השביל ממזרי עובר ביער מחטניים אל שדוגרה, מפל בגובה של כ-120 מטרים שניזון מקרחון אושבה ושופע ביותר
    בסוף האביב ובתחילת הקיץ. עד רגלי המפל כ-3 ק״מ, ועוד 3 ק״מ, כולל חציית נהר, עד ראשו, שם נערמים סלעי
    ענק מתחת לקרחון.


    בואו בשביל המפל; הישארו בשביל הרגע שבו הענן מתרומם משתי הפסגות.
  tip: >-
    הקציבו חמש עד שש שעות לשדוגרה ובחזרה, כולל הקטע העליון. הביאו את כל המים ממזרי, כי לאורך המסלול אין
    מים, וגם מעיל גשם לרסס שליד המפל. השביל עובר ליד עמדה של משטרת הגבול, ולכן קחו איתכם דרכון. צאו מוקדם:
    אושבה נראה בבהירות לרוב בשעות הבוקר, ועננות אחר הצהריים סוגרת לעיתים קרובות את העמק. נעלו נעליים עם
    אחיזה טובה לסלעים הרטובים. בתי ההארחה במזרי שקטים יותר מאלה שבמסטיה; חלקם סגורים בחורף, אז התקשרו
    מראש. כספומטים ובית מרקחת יש במסטיה.
  route: >-
    מטביליסי סעו בכביש E60 (S1) מערבה עד זוגדידי, ומשם בכביש Sh7 צפונה במעלה ערוץ האנגורי. כ-16 ק״מ לפני
    מסטיה פנו לכביש Sh99 לכיוון בצ׳ו וטפסו כ-9 ק״מ אל עמק הדולרה עד מזרי. בסך הכול כ-455 ק״מ ושמונה שעות
    ועשרים דקות. הכביש הראשי סלול; הדרך הצדדית למזרי משובשת יותר, עם בורות וחציות נחלים. במזג אוויר יבש
    רכב גבוה מסתדר, ולכן אנו ממליצים על רכב שטח; באביב או אחרי גשמים כבדים, הנעה 4x4 היא הבחירה הבטוחה
    יותר. תדלקו בזוגדידי או בג׳ווארי.
ar:
  name: بيتشو ومازيري
  short: >-
    وادي دولرا تحت قمّتي أوشبا التوأمين: مازيري على ارتفاع 1,660 م، وشلال بارتفاع 120 متراً يغذّيه نهر
    أوشبا الجليدي، وسكينة فقدتها ميستيا.
  body: >-
    **من مازيري لا تحتاج إلى الصعود لترى أوشبا، فالجبل يملأ رأس الوادي من تلقاء نفسه: برجان صخريان جنباً
    إلى جنب في وجه السماء.**


    بيتشو مجموعة من ثلاث عشرة قرية تنتظم على طول نهر دولراتشالا، أحد روافد إنغوري من ضفته اليمنى، على
    بعد 25 كم من ميستيا. وأشهر قراها، مازيري، تقع على ارتفاع 1,660 متراً. وقد عرف المكان لحظته في التاريخ:
    فقد كان يوماً جزءاً من سفانيتي الخاضعة لأمراء آل داديشكلياني، ثم صارت مازيري مقرّ إدارة المقاطعة بعد
    وصول الحكم الروسي في خمسينيات القرن التاسع عشر. أما اليوم فهي أبقار وتبن، وبضعة أبراج قائمة وسط باحات
    عامرة بالعمل، وأمسيات هادئة كما كانت ميستيا قبل أن تزحف إليها الحشود.


    ليس أوشبا من بين أعلى عشر قمم في القوقاز، ومع ذلك يعدّه كثير من المتسلقين أصعبها. تبلغ قمته الجنوبية
    4,710 أمتار والشمالية 4,690 متراً، ويفصل بينهما نحو 637 متراً. سقطت القمة الشمالية أولاً، عام 1888،
    أمام جون غارفورث كوكين وأولريش ألمر، أما الجنوبية فصمدت حتى 26 يوليو 1903. وفي عام 1937 صعده أيضاً
    رجل سفاني هو فيساريون خيرغياني، وكبر ابنه ميخائيل ليصبح من أشهر متسلقي الجبال في الاتحاد السوفييتي.
    وتجعل التقاليد السفانية الجبلَ مسكناً لدالي، إلهة الصيد.


    يمضي الدرب من مازيري عبر غابة صنوبرية إلى شدوغرا، وهو شلال بارتفاع نحو 120 متراً يغذّيه نهر أوشبا
    الجليدي، ويبلغ أوج تدفّقه في أواخر الربيع وأوائل الصيف. تبلغ المسافة إلى أسفله نحو 3 كم، ثم 3 كم أخرى،
    مع عبور نهر، إلى أعلاه، حيث تتكدّس الصخور الضخمة تحت النهر الجليدي.


    تعالَ من أجل الشلال، وابقَ من أجل اللحظة التي ترتفع فيها الغيمة عن القمّتين.
  tip: >-
    خصّص خمس إلى ست ساعات للذهاب إلى شدوغرا والعودة، بما في ذلك القسم العلوي. احمل كل ما تحتاجه من ماء
    من مازيري، إذ لا ماء على الطريق، ومعطفاً واقياً من المطر لرذاذ الشلال. يمرّ الدرب بمركز لشرطة الحدود،
    فاحمل جواز سفرك. انطلق باكراً: فأوشبا يكون صافياً في الصباح غالباً، وغيوم ما بعد الظهر كثيراً ما تغلق
    الوادي. البس حذاءً ذا نعل متماسك للصخور المبتلّة. بيوت الضيافة في مازيري أهدأ من نظيراتها في ميستيا،
    وبعضها يُغلق شتاءً، فاتصل مسبقاً. أجهزة الصرف الآلي والصيدلية في ميستيا.
  route: >-
    من تبليسي اسلك الطريق E60 (S1) غرباً إلى زوغديدي، ثم الطريق Sh7 شمالاً صعوداً في مضيق إنغوري. وقبل
    ميستيا بنحو 16 كم انعطف إلى الطريق Sh99 باتجاه بيتشو واصعد نحو 9 كم في وادي دولرا حتى مازيري. المجموع
    نحو 455 كم وثماني ساعات وعشرين دقيقة. الطريق الرئيسي معبّد، أما الطريق الفرعي إلى مازيري فأكثر وعورة،
    فيه حفر ومخاضات جداول. في الطقس الجاف تكفي سيارة مرتفعة عن الأرض، ولهذا نوصي بسيارة رياضية متعددة
    الاستخدامات؛ أما في الربيع أو بعد الأمطار الغزيرة فالدفع الرباعي هو الخيار الأسلم. تزوّد بالوقود في
    زوغديدي أو جفاري.
