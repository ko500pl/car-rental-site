ka:
  name: აჭარის ხელოვნების მუზეუმი
  short: >-
    ფიროსმანი, კაკაბაძე და გუდიაშვილი გორგილაძის ქუჩის თეთრ, სტალინური ხანის სასახლეში, რომელიც 1998 წლამდე
    რევოლუციის მუზეუმი იყო.
  body: >-
    **1998 წლამდე გორგილაძის ქუჩის ეს თეთრი, სტალინური ხანის სასახლე 1917 წლის რევოლუციის მუზეუმი იყო.
    დღეს ის ფიროსმანს ინახავს.**


    შენობა 1949 წელს, სტალინური ამპირის სრული სტილით აიგო: არქიტექტორმა კახა ჯავახიშვილმა მას ღია ფერის,
    სიმეტრიული ფასადი და მაღალი თაღოვანი პორტალი მისცა, მასთან ერთად კი მოქანდაკე თამარ აბაკელია მუშაობდა.
    წლების მანძილზე აქ ბათუმის რევოლუციის მუზეუმი იყო. როცა ის დაიხურა, 1998 წელს სწორედ ამ შენობაში დაარსდა
    აჭარის ხელოვნების სახელმწიფო მუზეუმი. ასე რომ, ფართო კიბე, რომელიც ოდესღაც 1917 წლის დროშებსა და რელიქვიებთან
    მიდიოდა, დღეს ფერწერასთან მიგიყვანთ.


    კოლექციის გული ქართული ფერწერაა: ნიკო ფიროსმანი, დავით კაკაბაძე, ლადო გუდიაშვილი და ელენე ახვლედიანი,
    ოთხი მხატვარი, რომელთა ტილოებშიც თანამედროვე საქართველომ საკუთარი სახე დაინახა. მათ გვერდით უფრო გვიანდელი
    ქართველი ოსტატები და პოლონელი აკადემისტი სტეფან ბაკალოვიჩი არიან წარმოდგენილი; ქანდაკებებს შორის კი
    ე. ფანტარელის „ნიმფა და პატარა ფავნი“ მოძებნეთ. დეკორატიულ ხელოვნებას გვერდი ნუ აუარეთ: კერამიკა,
    ხის კვეთა, მინა, ჭედურობა და გობელენი.


    მუდმივი ექსპოზიცია 423 კვადრატულ მეტრს იკავებს, დროებითი გამოფენებისთვის კიდევ 383 მეტრია გამოყოფილი.
    ერთ საათში შემოსავლელად საკმარისად პატარაა, დროებითი დარბაზების წყალობით კი მეორე ვიზიტი იშვიათად
    იმეორებს პირველს. კვირაობით მუზეუმში ბავშვთა სამხატვრო სტუდია მუშაობს, აქვს ბიბლიოთეკაც.


    როცა შავი ზღვიდან წვიმა შემოიჭრება, კიბეს აუყევით. სტალინური სასახლის ბათქაშის ქვეშ, სიჩუმეში, თქვენ
    იმ მხატვრებს შეხვდებით, რომლებმაც თანამედროვე ქართული ხელოვნება შექმნეს.
  tip: >-
    დაახლოებით ერთი საათი დაუთმეთ. შესასვლელთან ფართო კიბე ადის, მუზეუმი კი ორ სართულზეა განთავსებული,
    ამიტომ თუ კიბე სირთულეს გიქმნით, წინასწარ დარეკეთ და უბარიერო შესვლის შესახებ იკითხეთ. ბილეთი რამდენიმე
    ლარი ღირს. გადაღებამდე იკითხეთ: სხვა მუზეუმებიდან დროებით გამოფენილ ნამუშევრებსა და დროებით გამოფენებზე
    წესი შეიძლება განსხვავდებოდეს. შენობაში კაფეს იმედი ნუ გექნებათ, სამაგიეროდ ირგვლივ ქუჩები კაფეებით
    სავსეა. ჭავჭავაძის ქუჩაზე მდებარე არქეოლოგიური მუზეუმი ფეხით ათიოდე წუთშია, ორივე ერთად კი წვიმიანი
    ბათუმური დღის კარგ გეგმას ქმნის.
  route: >-
    თბილისიდან ს1-ით (E60) დასავლეთით წადით, ქუთაისის გავლით სამტრედიამდე, იქიდან ს12-ით (E692) ლანჩხუთის
    გავლით გრიგოლეთამდე, შემდეგ ს2-ით (E70) სამხრეთით, ქობულეთის გავლით ბათუმამდე: 370 კილომეტრი და დაახლოებით
    ხუთნახევარი საათი, ბოლომდე კარგ მდგომარეობაში მყოფი ასფალტი. მუზეუმი ქალაქის ცენტრში, ზურაბ გორგილაძის
    ქუჩა №8-ში დგას. ცენტრში პარკირება ფასიანია და ზაფხულში ადგილი ძნელად იშოვება, ამიტომ მანქანა რამდენიმე
    კვარტალით მოშორებით დატოვეთ და ფეხით მოდით. საწვავი მთელ გზაზე ადვილად იშოვება. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია.
en:
  name: Adjara Art Museum
  short: >-
    Pirosmani, Kakabadze and Gudiashvili in a white Stalin-era palace on Gorgiladze Street, which until
    1998 was a museum of the revolution.
  body: >-
    **Until 1998 this white Stalin-era palace on Gorgiladze Street was a museum of the 1917 revolution;
    today it keeps Pirosmani.**


    The building went up in 1949 in the full Stalinist Empire manner: the architect Kakha Javakhishvili
    gave it a pale, symmetrical front and a tall arched portal, and the sculptor Tamara Abakelia worked
    beside him. For years it held Batumi's Museum of the Revolution. When that closed, the State Art Museum
    of Adjara was founded here in 1998, so the broad steps that once led to banners and relics of 1917
    now lead to paintings.


    The heart of the collection is Georgian painting: Niko Pirosmani, David Kakabadze, Lado Gudiashvili
    and Elene Akhvlediani, four artists who between them shaped how modern Georgia sees itself on canvas.
    Around them hang later Georgian painters and the Polish academic painter Stefan Bakałowicz; among
    the sculpture, look for E. Pantareli's "Nymph and Little Faun". Do not skip the decorative arts: ceramics,
    carved wood, glass, repoussé metal and tapestry.


    The permanent display fills 423 square metres, with 383 more for temporary exhibitions. It is small
    enough to see in an hour, and the temporary halls mean a second visit rarely repeats the first. On
    Sundays the museum runs an art studio for children, and it keeps a library.


    When rain sweeps in off the Black Sea, climb the steps. Under the stucco of a Stalin-era palace, the
    painters who made modern Georgian art wait in the quiet.
  tip: >-
    Allow about an hour. The entrance is up a broad flight of steps and the museum spreads over two floors,
    so if stairs are a problem, call ahead to ask about step-free access. Admission costs a few lari.
    Ask before photographing, as rules can differ for loaned works and temporary shows. There is no café
    to count on inside, but the streets around are full of them. The Archaeological Museum on Chavchavadze
    Street is about ten minutes' walk away, and together they make a good plan for a wet Batumi day.
  route: >-
    From Tbilisi take the S1 (E60) west past Kutaisi to Samtredia, the S12 (E692) through Lanchkhuti to
    the coast at Grigoleti, then the S2 (E70) south through Kobuleti into Batumi: 370 km and about five
    and a half hours, asphalt all the way and in good condition. The museum stands at 8 Zurab Gorgiladze
    Street in the city centre. Central parking is paid and fills up in summer, so leave the car a few
    blocks away and walk. Fuel is easy to find along the whole route. An economy car is all you need.
ru:
  name: Аджарский художественный музей
  short: >-
    Пиросмани, Какабадзе и Гудиашвили в белом сталинском дворце на улице Горгиладзе, который до 1998 года
    был музеем революции.
  body: >-
    **До 1998 года этот белый сталинский дворец на улице Горгиладзе был музеем революции 1917 года; сегодня
    он хранит Пиросмани.**


    Здание построено в 1949 году в духе зрелого сталинского ампира: архитектор Каха Джавахишвили дал ему
    светлый симметричный фасад и высокий арочный портал, а рядом с ним работала скульптор Тамара Абакелия.
    Много лет здесь находился Батумский музей революции. Когда он закрылся, в 1998 году именно в этом
    здании был основан Государственный художественный музей Аджарии — так что широкая лестница, некогда
    ведущая к знамёнам и реликвиям 1917 года, теперь ведёт к живописи.


    Сердце коллекции — грузинская живопись: Нико Пиросмани, Давид Какабадзе, Ладо Гудиашвили и Елена Ахвледиани,
    четыре художника, которые вместе сформировали то, как современная Грузия видит себя на холсте. Рядом
    с ними — более поздние грузинские мастера и польский академист Стефан Бакалович; среди скульптуры
    отыщите «Нимфу и маленького фавна» Э. Пантарели. Не пропустите декоративное искусство: керамику, резное
    дерево, стекло, чеканку по металлу и гобелены.


    Постоянная экспозиция занимает 423 квадратных метра, ещё 383 отведены под временные выставки. Музей
    достаточно мал, чтобы обойти его за час, а благодаря временным залам второй визит редко повторяет
    первый. По воскресеньям здесь работает детская художественная студия, есть и библиотека.


    Когда с Чёрного моря налетает дождь, поднимитесь по лестнице. Под штукатуркой сталинского дворца,
    в тишине, вас ждут художники, создавшие современное грузинское искусство.
  tip: >-
    Отведите на музей около часа. Вход — по широкой лестнице, музей занимает два этажа, так что, если
    лестницы для вас затруднительны, позвоните заранее и уточните, есть ли доступ без ступеней. Билет
    стоит несколько лари. Спрашивайте перед съёмкой: для заимствованных работ и временных выставок правила
    могут отличаться. Кафе внутри нет, но окрестные улицы ими полны. Археологический музей на улице Чавчавадзе
    — минут десять пешком, и вместе они хорошо заполняют дождливый батумский день.
  route: >-
    Из Тбилиси по S1 (E60) на запад через Кутаиси до Самтредиа, затем по S12 (E692) через Ланчхути к побережью
    у Григолети, далее по S2 (E70) на юг через Кобулети в Батуми: 370 км и около пяти с половиной часов,
    асфальт до конца и в хорошем состоянии. Музей стоит на улице Зураба Горгиладзе, 8, в центре города.
    Парковка в центре платная и летом заполняется, так что лучше оставить машину за пару кварталов и пройтись
    пешком. Заправки легко найти по всей дороге. Достаточно машины экономкласса.
fa:
  name: موزه هنر آجارا
  short: >-
    پیروسمانی، کاکابادزه و گودیاشویلی در کاخی سفید از دوران استالین در خیابان گورگیلادزه، که تا سال ۱۹۹۸
    موزه‌ی انقلاب بود.
  body: >-
    **تا سال ۱۹۹۸، این کاخ سفید از دوران استالین در خیابان گورگیلادزه موزه‌ی انقلاب ۱۹۱۷ بود؛ امروز پیروسمانی
    را در خود نگه می‌دارد.**


    این ساختمان در سال ۱۹۴۹، به سبک تمام‌عیار امپایر استالینی برپا شد: معمار کاخا جاواخیشویلی نمایی روشن
    و متقارن و درگاهی طاق‌دار بلند به آن بخشید، و در کنارش مجسمه‌ساز تامارا آباکلیا کار می‌کرد. سال‌ها
    این‌جا موزه‌ی انقلاب باتومی بود. وقتی آن موزه بسته شد، در ۱۹۹۸ موزه‌ی هنر دولتی آجارا در همین ساختمان
    بنیاد گذاشته شد؛ پس پله‌ی وسیعی که زمانی به پرچم‌ها و یادگارهای ۱۹۱۷ می‌رسید، امروز به نقاشی می‌رسد.


    قلب این مجموعه نقاشی گرجی است: نیکو پیروسمانی، داوید کاکابادزه، لادو گودیاشویلی و النه آخولدیانی،
    چهار نقاش که با هم شکل داده‌اند که گرجستان امروز چگونه خود را بر بوم می‌بیند. در کنارشان نقاشان متأخرتر
    گرجی و نقاش آکادمیک لهستانی، استفان باکالوویچ، جای دارند؛ و در میان پیکره‌ها، «پری و فان کوچک» اثر
    ا. پانتارلی را بجویید. از هنرهای تزیینی نگذرید: سرامیک، چوب‌کاری، شیشه، فلزکاری برجسته و گابلن.


    نمایشگاه دائمی ۴۲۳ متر مربع را در بر می‌گیرد، و ۳۸۳ متر دیگر به نمایشگاه‌های موقت اختصاص دارد. موزه
    آن‌قدر کوچک است که در یک ساعت دیده شود، و سالن‌های موقت باعث می‌شوند بازدید دوم به‌ندرت تکرار نخستین
    باشد. یکشنبه‌ها موزه استودیوی هنری کودکان دارد، و کتابخانه‌ای هم دارد.


    وقتی باران از دریای سیاه فرومی‌ریزد، از پله بالا بروید. زیر گچ‌کاری کاخی از دوران استالین، در سکوت،
    نقاشانی منتظرتان‌اند که هنر مدرن گرجستان را ساختند.
  tip: >-
    نزدیک به یک ساعت زمان بگذارید. ورودی از پله‌ای وسیع بالا می‌رود و موزه در دو طبقه گسترده شده، پس اگر
    پله‌ها برایتان دشوارند، پیش از آمدن تلفن بزنید و درباره‌ی دسترسی بدون پله بپرسید. ورودیه چند لاری
    است. پیش از عکاسی بپرسید: قوانین برای آثار امانی از موزه‌های دیگر و نمایشگاه‌های موقت ممکن است متفاوت
    باشد. کافه‌ای درون موزه نیست، اما خیابان‌های اطراف پر از آن‌هاست. موزه‌ی باستان‌شناسی در خیابان چاوچاوادزه
    ده دقیقه‌ای پیاده فاصله دارد، و این دو با هم روزی بارانی در باتومی را به‌خوبی پر می‌کنند.
  route: >-
    از تفلیس مسیر S1 (E60) را به سوی غرب و از کنار کوتایسی تا سامترِدیا بروید، سپس S12 (E692) را از میان
    لانچخوتی تا ساحل در گریگولتی ادامه دهید، و آن‌گاه S2 (E70) را به سوی جنوب از میان کوبولتی تا باتومی:
    ۳۷۰ کیلومتر و حدود پنج ساعت و نیم، تمام مسیر آسفالت و در وضعیت خوب. موزه در خیابان زوراب گورگیلادزه
    شماره‌ی ۸، در مرکز شهر ایستاده است. پارکینگ در مرکز شهر هزینه دارد و در تابستان جا کم‌یاب می‌شود،
    پس بهتر است ماشین را چند بلوک دورتر بگذارید و پیاده بروید. سوخت در سراسر مسیر به‌آسانی یافت می‌شود.
    خودرویی اقتصادی کافی است.
he:
  name: מוזיאון האמנות של אג'ריה
  short: פירוסמני, קקבדזה וגודיאשווילי בארמון סטליניסטי לבן ברחוב גורגילדזה, ששימש עד 1998 כמוזיאון המהפכה.
  body: >-
    **עד 1998 שימש הארמון הסטליניסטי הלבן הזה ברחוב גורגילדזה כמוזיאון מהפכת 1917; היום שמורים בו ציורי
    פירוסמני.**


    הבניין נבנה ב-1949 בסגנון האמפייר הסטליניסטי המלא: האדריכל קאחא ג'אווחישווילי נתן לו חזית בהירה וסימטרית
    ופורטל מקושת גבוה, והפסלת תמרה אבקליה עבדה לצדו. שנים ארוכות שכן בו מוזיאון המהפכה של בטומי. כשהמוזיאון
    ההוא נסגר, נוסד ב-1998 בבניין הזה עצמו המוזיאון הממלכתי לאמנות של אג'ריה, כך שהמדרגות הרחבות שהובילו
    פעם לדגלים ולשרידים משנת 1917 מובילות היום לציורים.


    לב האוסף הוא הציור הגאורגי: ניקו פירוסמני, דוד קקבדזה, לדו גודיאשווילי ואלנה אחוולדיאני, ארבעה אמנים
    שיחד עיצבו את הדרך שבה גאורגיה המודרנית רואה את עצמה על הבד. לצדם תלויים ציירים גאורגים מאוחרים יותר
    והצייר האקדמי הפולני סטפן בקלוביץ'; ובין הפסלים חפשו את "נימפה ופאון קטן" של א. פנטרלי. אל תפספסו
    את האמנות הדקורטיבית: קרמיקה, גילוף בעץ, זכוכית, ריקוע מתכת ושטיחי קיר.


    התצוגה הקבועה משתרעת על 423 מ"ר, ועוד 383 מ"ר מוקדשים לתערוכות זמניות. המוזיאון קטן מספיק כדי לראותו
    בשעה, והאולמות הזמניים דואגים לכך שביקור שני לעיתים רחוקות חוזר על הראשון. בימי ראשון מפעיל המוזיאון
    סטודיו לאמנות לילדים, ויש לו גם ספרייה.


    כשגשם נסחף מהים השחור, עלו במדרגות. מתחת לטיח של ארמון סטליניסטי, בשקט, מחכים הציירים שעיצבו את האמנות
    הגאורגית המודרנית.
  tip: >-
    הקדישו כשעה. לכניסה מובילות מדרגות רחבות, והמוזיאון משתרע על שתי קומות, כך שאם מדרגות מהוות בעיה,
    התקשרו מראש ובררו אם יש גישה ללא מדרגות. מחיר הכניסה כמה לארי. שאלו לפני צילום, כי הכללים עשויים להשתנות
    לגבי עבודות מושאלות ותערוכות זמניות. אין בית קפה בתוך המוזיאון, אבל הרחובות שמסביב מלאים בבתי קפה.
    מוזיאון הארכיאולוגיה ברחוב צ'בצ'אוודזה במרחק הליכה של כעשר דקות, ושניהם יחד מתאימים היטב ליום גשום
    בבטומי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה, דרך קוטאיסי עד סמטרדיה, אחר כך ב-S12 (E692) דרך לנצ'חוטי עד החוף
    בגריגולטי, ומשם ב-S2 (E70) דרומה דרך קובולטי לבטומי: 370 ק"מ וכחמש שעות וחצי, אספלט מתחילתו ועד סופו
    ובמצב טוב. המוזיאון עומד ברחוב זוראב גורגילדזה 8, במרכז העיר. חניה במרכז העיר בתשלום ומתמלאת בקיץ,
    אז כדאי להשאיר את הרכב כמה רחובות משם ולהמשיך ברגל. דלק קל למצוא בכל אורך המסלול. מכונית אקונומית
    מספיקה.
ar:
  name: متحف أدجارا للفنون
  short: >-
    بيروسماني وكاكابادزه وغودياشفيلي في قصر أبيض من الطراز الستاليني بشارع غورغيلادزه، كان حتى عام 1998
    متحفًا للثورة.
  body: >-
    **حتى عام 1998، كان هذا القصر الأبيض من الطراز الستاليني في شارع غورغيلادزه متحفًا لثورة 1917؛ واليوم
    يحفظ لوحات بيروسماني.**


    شُيّد المبنى في عام 1949 على الطراز الإمبراطوري الستاليني الكامل: أعطاه المهندس المعماري كاخا جافاخيشفيلي
    واجهة فاتحة متماثلة ومدخلًا مقوسًا عاليًا، وعملت إلى جانبه النحّاتة تامارا أباكيليا. لسنوات طويلة
    ضمّ المبنى متحف الثورة في باتومي. وعندما أُغلق ذلك المتحف، تأسس في هذا المبنى نفسه، عام 1998، متحف
    أدجارا الحكومي للفنون؛ فالدرج العريض الذي كان يقود يومًا إلى رايات 1917 ومقتنياتها يقود اليوم إلى
    اللوحات.


    قلب المجموعة هو الرسم الجورجي: نيكو بيروسماني، وداود كاكابادزه، ولادو غودياشفيلي، وإيلينه أخفليدياني،
    أربعة فنانين شكّلوا معًا الطريقة التي ترى بها جورجيا الحديثة نفسها على القماش. وتُعرض حولهم أعمال
    رسامين جورجيين لاحقين، إلى جانب الرسام الأكاديمي البولندي ستيفان باكالوفيتش؛ وبين المنحوتات ابحثوا
    عن "الحورية والفاون الصغير" لـ إ. بانتاريلي. لا تفوّتوا الفنون التطبيقية: الخزف والنقش على الخشب والزجاج
    والطرق على المعدن والمنسوجات.


    يشغل العرض الدائم 423 مترًا مربعًا، وثمة 383 مترًا أخرى مخصصة للمعارض المؤقتة. المتحف صغير بما يكفي
    لزيارته في ساعة واحدة، والقاعات المؤقتة تجعل الزيارة الثانية نادرًا ما تكرر الأولى. في أيام الأحد
    يشغّل المتحف استوديوًا فنيًا للأطفال، ولديه أيضًا مكتبة.


    عندما يهطل المطر من البحر الأسود، اصعدوا الدرج. تحت جصّ قصر ستاليني، في الهدوء، ينتظركم الرسامون الذين
    صنعوا الفن الجورجي الحديث.
  tip: >-
    خصّصوا نحو ساعة. يُصعد إلى المدخل بدرج عريض، والمتحف موزّع على طابقين، فإن كان الدرج عائقًا، اتصلوا
    مسبقًا واسألوا عن مدخل بلا درج. رسم الدخول بضعة لاري. اسألوا قبل التصوير، فالقواعد قد تختلف بالنسبة
    إلى الأعمال المستعارة والمعارض المؤقتة. لا يوجد مقهى داخل المتحف، لكن الشوارع المحيطة مليئة بالمقاهي.
    متحف الآثار في شارع تشافتشافادزه على بعد عشر دقائق سيرًا، ومعًا يشكّلان خطة جيدة ليوم ممطر في باتومي.
  route: >-
    من تبليسي خذوا الطريق S1 (E60) غربًا عبر كوتايسي إلى سامتريديا، ثم S12 (E692) عبر لانتشخوتي إلى الساحل
    عند غريغوليتي، ثم S2 (E70) جنوبًا عبر كوبوليتي إلى باتومي: 370 كم وحوالي خمس ساعات ونصف، طريق مُعبّد
    بالكامل وبحالة جيدة. يقف المتحف في شارع زوراب غورغيلادزه رقم 8، في وسط المدينة. مواقف السيارات في
    وسط المدينة مدفوعة وتمتلئ في الصيف، فالأفضل ترك السيارة على بعد بضعة شوارع والمشي. الوقود يسهل إيجاده
    طوال الطريق. سيارة اقتصادية تكفي.
