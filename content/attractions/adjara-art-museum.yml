ka:
  name: აჭარის ხელოვნების მუზეუმი
  short: >-
    ქართული მხატვრობის მშვიდი, კარგად შერჩეული კრებული ბათუმის ცენტრში, ფიროსმანის ჩათვლით.
  body: >-
    **ბათუმის ხელოვნების მუზეუმი ის ადგილია, სადაც ქალაქი ცოტა ხნით წყნარდება.** კრებული 1998 წელს ჩამოყალიბდა
    თბილისის სახელმწიფო ფონდებიდან გადმოცემული ნამუშევრებით და დღეს დაახლოებით ორ ათასამდე ერთეულს ითვლის.
    ექსპოზიცია მცირეა — ერთ ვიზიტზე ორმოცდაათიოდე ტილო — და სწორედ ეს არის მისი ღირსება.

    ცენტრში XX საუკუნის ქართული მხატვრობაა. აქ არის ნიკო ფიროსმანი, ლადო გუდიაშვილი, დავით კაკაბაძე,
    ელენე ახვლედიანი — ის თაობა, რომელმაც ევროპული მოდერნიზმი და ქართული ხატწერის ბრტყელი, ფრონტალური
    ტრადიცია ერთმანეთს შეახვედრა. კაკაბაძის იმერეთის პეიზაჟები აჭარულ სინათლეშიც კარგად კითხულობს:
    იგივე დაბალი ღრუბლები, იგივე ღრმა მწვანე.

    დანარჩენი დარბაზები იყოფა:

    - **ევროპული და რუსული გრაფიკა** — XIX საუკუნის ოფორტები და ლითოგრაფიები, მოკრძალებული, მაგრამ ნამდვილი

    - **აჭარელი მხატვრები** — ადგილობრივი XX საუკუნის სკოლა, რომელიც სხვაგან იშვიათად ჩანს

    - **დროებითი გამოფენები** — ხშირად თანამედროვე, ზოგჯერ ბათუმის ხელოვნების სკოლის სტუდენტების

    შენობა თავად საინტერესოა: XX საუკუნის დასაწყისის საცხოვრებელი სახლი მაღალი ჭერითა და ხის კიბით,
    შემდეგ გალერეად გადაკეთებული. განათება ბუნებრივია, ხალხი ცოტა, არავინ გაჩქარებს.

    ერთი საათი საკმარისია. ეს არაა მუზეუმი, რომლისთვისაც ბათუმში ჩამოხვალ — მაგრამ თუ უკვე აქ ხარ და
    წვიმს, ან უბრალოდ ბულვარისგან დაისვენე, ეს ქალაქის ერთ-ერთი ყველაზე კეთილგანწყობილი შენობაა.
  tip: >-
    ორმოცდაათი წუთიდან ერთ საათამდე. მუზეუმი გორგილაძის ქუჩაზეა, ბულვარიდან ათი წუთის სავალზე. შენობა
    ორსართულიანია, ლიფტი არ არის — ეტლით მოძრაობა რთულია. ეტიკეტები ქართულ-ინგლისურია. ფოტოს ჩვეულებრივ
    უშვებენ ხელჩანთის გარეშე; დიდი ჩანთა გარდერობშია დასატოვებელი. ტუალეტი აქვს. კაფე შენობაში არ არის,
    სამაგიეროდ ირგვლივ სულ კაფეებია.
  route: >-
    თბილისიდან E60-ით ქუთაისსა და სამტრედიაზე, შემდეგ სამხრეთით ზღვის გზით ლანჩხუთისა და ქობულეთის გავლით
    — 370 კმ, ხუთი საათი ნახევარი, ბოლომდე ასფალტი და ნორმალურ მდგომარეობაში. მუზეუმი ბათუმის ცენტრში,
    ზურაბ გორგილაძის ქუჩაზეა. ცენტრში პარკინგი ფასიანია და ზაფხულში დატვირთული — მანქანა ორიოდე კვარტალით
    შორს დატოვე და ფეხით მოდი. საწვავი ქუთაისში, ოზურგეთსა და ქობულეთშია. ეკონომ-კლასი საკმარისია.
en:
  name: Adjara Art Museum
  short: >-
    A quiet, well-chosen collection of Georgian painting in central Batumi, Pirosmani included.
  body: >-
    **The art museum is where Batumi goes quiet for an hour.** The collection was formed in 1998 from works
    transferred out of the state funds in Tbilisi, and now runs to roughly two thousand items. What hangs
    at any one time is small — perhaps fifty canvases — and that restraint is the point.

    The core is twentieth-century Georgian painting. Niko Pirosmani is here, along with Lado Gudiashvili,
    David Kakabadze and Elene Akhvlediani: the generation that put European modernism and the flat, frontal
    tradition of Georgian icon painting into the same frame. Kakabadze's Imeretian landscapes read particularly
    well in Adjaran light — the same low cloud, the same deep green outside the window.

    The remaining rooms divide roughly into:

    - **European and Russian graphics** — nineteenth-century etchings and lithographs, modest but genuine

    - **Adjaran painters** — a local twentieth-century school that is rarely shown anywhere else

    - **Temporary exhibitions**, often contemporary, sometimes student work from Batumi's art school

    The building deserves attention too: an early twentieth-century townhouse with high ceilings and a
    wooden staircase, later converted to galleries. The light is natural, the rooms are usually near-empty,
    and nobody hurries you.

    An hour covers it. This is not a museum you drive to Batumi for. But if you are already here, if it
    is raining, or if you simply want a break from the boulevard and the noise of the seafront, it is one
    of the most civil rooms in the city, and the Pirosmani alone justifies the walk.
  tip: >-
    Fifty minutes to an hour. The museum sits on Gorgiladze Street, a ten-minute walk in from the boulevard.
    It is on two floors with no lift, so wheelchair access is difficult. Labels are in Georgian and English.
    Photography is usually permitted; large bags go to the cloakroom. There are toilets but no cafe inside
    — the surrounding streets are full of them. Check that a temporary exhibition has not closed the upper
    floor.
  route: >-
    From Tbilisi take the E60 through Kutaisi and Samtredia, then turn south on the coast road through
    Lanchkhuti and Kobuleti — 370 km, five and a half hours, asphalt throughout and in reasonable condition.
    The museum is in central Batumi on Zurab Gorgiladze Street. Central parking is paid and busy in summer,
    so leave the car a couple of blocks out and walk. Fuel is available at Kutaisi, Ozurgeti and Kobuleti.
    An economy car is sufficient.
ru:
  name: Аджарский художественный музей
  short: >-
    Тихое, толково собранное собрание грузинской живописи в центре Батуми, включая Пиросмани.
  body: >-
    **Художественный музей — место, где Батуми на час затихает.** Собрание сложилось в 1998 году из работ,
    переданных из государственных фондов Тбилиси, и сегодня насчитывает около двух тысяч единиц. В экспозиции
    единовременно немного — полсотни холстов, — и эта сдержанность идёт ей на пользу.

    Ядро — грузинская живопись XX века. Здесь есть Нико Пиросмани, а рядом Ладо Гудиашвили, Давид Какабадзе
    и Елена Ахвледиани: поколение, соединившее европейский модернизм с плоской, фронтальной традицией
    грузинской иконы. Имеретинские пейзажи Какабадзе особенно хорошо читаются в аджарском свете — те же
    низкие облака, та же густая зелень за окном.

    Остальные залы делятся примерно так:

    - **Европейская и русская графика** — офорты и литографии XIX века, скромно, но подлинно

    - **Аджарские художники** — местная школа XX века, которую почти нигде больше не показывают

    - **Временные выставки**, часто современные, иногда студенческие работы батумской школы искусств

    Здание тоже стоит внимания: жилой дом начала XX века с высокими потолками и деревянной лестницей,
    позже переделанный под галереи. Свет естественный, залы обычно почти пусты, и никто вас не торопит.

    Часа достаточно. Ради этого музея не едут в Батуми специально. Но если вы уже здесь, если идёт дождь
    или просто хочется передышки от бульвара и шума набережной, это одна из самых спокойных комнат в городе,
    а один Пиросмани уже оправдывает прогулку.
  tip: >-
    Пятьдесят минут — час. Музей на улице Горгиладзе, десять минут пешком от бульвара. Два этажа, лифта
    нет, с креслом-коляской сложно. Подписи на грузинском и английском. Съёмка обычно разрешена, большие
    сумки сдают в гардероб. Туалет есть, кафе внутри нет — зато вокруг их множество. Стоит уточнить, не
    занят ли верхний этаж временной выставкой.
  route: >-
    Из Тбилиси по E60 через Кутаиси и Самтредиа, затем на юг по приморской дороге через Ланчхути и Кобулети
    — 370 км, пять с половиной часов, асфальт всю дорогу и в приличном состоянии. Музей в центре Батуми,
    на улице Зураба Горгиладзе. Парковка в центре платная и летом загружена, лучше оставить машину на
    пару кварталов дальше и дойти пешком. Заправки в Кутаиси, Озургети и Кобулети. Машины эконом-класса
    достаточно.
fa:
  name: موزهٔ هنر آجارا
  short: >-
    مجموعه‌ای آرام و خوش‌گزین از نقاشی گرجی در مرکز باتومی، از جمله آثار پیروسمانی.
  body: >-
    **موزهٔ هنر جایی است که باتومی یک ساعت ساکت می‌شود.** مجموعه در ۱۹۹۸ از آثاری شکل گرفت که از خزانه‌های
    دولتی تفلیس منتقل شدند و امروز نزدیک دو هزار قلم است. آنچه هر بار به نمایش درمی‌آید اندک است — شاید
    پنجاه بوم — و همین کم‌گویی امتیاز آن است.

    هستهٔ کار نقاشی گرجی سدهٔ بیستم است. نیکو پیروسمانی اینجاست، در کنار لادو گودیاشویلی، داوید کاکابادزه
    و النه آخولدیانی: نسلی که مدرنیسم اروپایی را با سنت تخت و رودررویِ شمایل‌نگاری گرجی در یک قاب نشاند.
    مناظر ایمرتی کاکابادزه در نور آجارا خوب خوانده می‌شوند؛ همان ابر کم‌ارتفاع و همان سبز تیره پشت پنجره.

    تالارهای دیگر تقریباً چنین تقسیم شده‌اند:

    - **گرافیک اروپایی و روسی** — قلم‌زنی و چاپ سنگی سدهٔ نوزدهم، ساده اما اصیل

    - **نقاشان آجارا** — مکتب محلی سدهٔ بیستم که جای دیگری کمتر دیده می‌شود

    - **نمایشگاه‌های موقت**، اغلب معاصر و گاه آثار دانشجویان هنرستان باتومی

    خود ساختمان هم ارزش دیدن دارد: خانه‌ای شهری از آغاز سدهٔ بیستم با سقف‌های بلند و پلکان چوبی که بعدها
    به گالری بدل شد. نور طبیعی است، اتاق‌ها معمولاً تقریباً خالی‌اند و کسی شما را عجله نمی‌دهد.

    یک ساعت کافی است. کسی برای این موزه به باتومی سفر نمی‌کند. اما اگر همین‌جا هستید، اگر باران می‌بارد،
    یا اگر از بلوار و همهمهٔ ساحل خسته‌اید، این یکی از متمدن‌ترین اتاق‌های شهر است و همان یک پیروسمانی
    راه‌رفتن تا اینجا را توجیه می‌کند.
  tip: >-
    پنجاه دقیقه تا یک ساعت. موزه در خیابان گورگیلادزه است، ده دقیقه پیاده از بلوار. دو طبقه دارد و آسانسور
    ندارد، پس دسترسی با ویلچر دشوار است. برچسب‌ها گرجی و انگلیسی است. عکاسی معمولاً آزاد است و کیف‌های
    بزرگ به رختکن سپرده می‌شود. سرویس بهداشتی هست اما کافه نه؛ خیابان‌های اطراف پر از کافه است. بپرسید
    نمایشگاه موقت طبقهٔ بالا را نبسته باشد.
  route: >-
    از تفلیس با E60 از کوتایسی و سامترِدیا، سپس به جنوب در جادهٔ ساحلی از لانچخوتی و کوبولتی — ۳۷۰ کیلومتر،
    پنج ساعت و نیم، سرتاسر آسفالت و در وضعیت قابل قبول. موزه در مرکز باتومی و در خیابان زوراب گورگیلادزه
    است. پارکینگ مرکز شهر پولی و در تابستان شلوغ است، پس خودرو را دو خیابان دورتر بگذارید و پیاده بیایید.
    سوخت در کوتایسی، اوزورگتی و کوبولتی. خودروی اقتصادی کافی است.
he:
  name: מוזיאון האמנות של אג׳ריה
  short: >-
    אוסף שקט ומוקפד של ציור גאורגי במרכז באטומי, ובכללו פירוסמאני.
  body: >-
    **מוזיאון האמנות הוא המקום שבו באטומי משתתקת לשעה.** האוסף נוצר ב-1998 מיצירות שהועברו מקרנות המדינה
    בטביליסי, וכיום הוא מונה כאלפיים פריטים. מה שתלוי בכל רגע נתון מועט — אולי חמישים בדים — ודווקא הצמצום
    הזה הוא היתרון.

    הליבה היא ציור גאורגי מן המאה העשרים. ניקו פירוסמאני נמצא כאן, ולצדו לאדו גודיאשווילי, דוד קאקבאדזה
    ואלנה אחוולדיאני: הדור שהושיב את המודרניזם האירופי ואת המסורת השטוחה והחזיתית של איקונות גאורגיות
    באותה מסגרת. נופי אימרתי של קאקבאדזה נקראים היטב באור של אג׳ריה — אותם עננים נמוכים, אותו ירוק עמוק
    מעבר לחלון.

    שאר החדרים מתחלקים בערך כך:

    - **גרפיקה אירופית ורוסית** — תחריטים וליתוגרפיות מן המאה ה-19, צנועים אך אמיתיים

    - **ציירי אג׳ריה** — אסכולה מקומית מן המאה העשרים שכמעט אינה מוצגת במקום אחר

    - **תערוכות מתחלפות**, לרוב עכשוויות, לעתים עבודות סטודנטים מבית הספר לאמנות של באטומי

    גם המבנה ראוי לתשומת לב: בית עירוני מראשית המאה העשרים עם תקרות גבוהות וגרם מדרגות עץ, שהוסב מאוחר
    יותר לגלריות. האור טבעי, החדרים כמעט ריקים בדרך כלל, ואיש אינו מזרז אתכם.

    שעה מכסה הכול. אין נוסעים לבאטומי בשביל המוזיאון הזה. אבל אם כבר הגעתם, אם יורד גשם, או אם פשוט נמאס
    לכם מן השדרה ומרעש קו החוף — זה אחד החדרים התרבותיים בעיר, והפירוסמאני לבדו מצדיק את ההליכה.
  tip: >-
    חמישים דקות עד שעה. המוזיאון ברחוב גורגילאדזה, עשר דקות הליכה מן השדרה. שתי קומות בלי מעלית, ולכן
    הנגישות בכיסא גלגלים קשה. השילוט בגאורגית ובאנגלית. הצילום מותר בדרך כלל, ותיקים גדולים נמסרים למלתחה.
    יש שירותים אך אין בית קפה בפנים — הרחובות מסביב מלאים בהם. כדאי לברר שתערוכה מתחלפת לא סגרה את הקומה
    העליונה.
  route: >-
    מטביליסי בכביש E60 דרך קוטאיסי וסמטרדיה, ואז דרומה בכביש החוף דרך לנצ׳חותי וקובולטי — 370 ק״מ, חמש
    שעות וחצי, סלול לכל האורך ובמצב סביר. המוזיאון במרכז באטומי ברחוב זוראב גורגילאדזה. החניה במרכז בתשלום
    ועמוסה בקיץ, אז עדיף להשאיר את הרכב שני רחובות משם וללכת ברגל. תדלוק בקוטאיסי, באוזורגטי ובקובולטי.
    רכב חסכוני מספיק.
ar:
  name: متحف أجاريا للفنون
  short: >-
    مجموعة هادئة منتقاة من الرسم الجورجي في وسط باتومي، من بينها أعمال بيروسماني.
  body: >-
    **متحف الفنون هو المكان الذي تهدأ فيه باتومي ساعةً من الزمن.** تشكلت المجموعة عام 1998 من أعمال نُقلت
    من صناديق الدولة في تبليسي، وتبلغ اليوم نحو ألفي قطعة. أما المعروض في وقت واحد فقليل، ربما خمسون لوحة،
    وهذا الاقتصاد في العرض هو ميزته.

    جوهر المجموعة الرسم الجورجي في القرن العشرين. نيكو بيروسماني حاضر هنا، وإلى جانبه لادو غودياشفيلي
    وداڤيد كاكابادزه وإيلينه أخفلديانى: الجيل الذي جمع الحداثة الأوروبية وتقليد الأيقونة الجورجية المسطح
    المواجه في إطار واحد. ومناظر إيميريتي عند كاكابادزه تُقرأ جيداً في ضوء أجاريا؛ الغيم المنخفض نفسه،
    والأخضر العميق نفسه خلف النافذة.

    وتنقسم بقية القاعات تقريباً إلى:

    - **غرافيك أوروبي وروسي** — حفر وطباعة حجرية من القرن التاسع عشر، متواضع لكنه أصيل

    - **رسامو أجاريا** — مدرسة محلية من القرن العشرين نادراً ما تُعرض في مكان آخر

    - **معارض مؤقتة**، معاصرة غالباً، وأحياناً أعمال طلبة مدرسة الفنون في باتومي

    والمبنى نفسه جدير بالانتباه: دار مدينية من مطلع القرن العشرين بأسقف عالية ودرج خشبي، حُوّلت لاحقاً
    إلى صالات عرض. الضوء طبيعي، والغرف شبه خالية عادة، ولا أحد يستعجلك.

    ساعة تكفي. لا أحد يقود إلى باتومي من أجل هذا المتحف. لكن إن كنت هنا أصلاً، أو كانت السماء تمطر، أو
    أردت راحة من الشارع البحري وضجيج الواجهة، فهذه من أهدأ غرف المدينة، وبيروسماني وحده يبرر المشي إليها.
  tip: >-
    خمسون دقيقة إلى ساعة. المتحف في شارع غورغيلادزه، على بعد عشر دقائق سيراً من الشارع البحري. طابقان
    بلا مصعد، فالوصول بكرسي متحرك صعب. البطاقات بالجورجية والإنجليزية. التصوير مسموح عادة، والحقائب الكبيرة
    تُترك في المشجب. توجد دورات مياه لكن لا مقهى بالداخل، والشوارع المحيطة مليئة بها. واسأل ألا يكون معرض
    مؤقت قد أغلق الطابق العلوي.
  route: >-
    من تبليسي على E60 عبر كوتايسي وسامتريديا، ثم جنوباً على طريق الساحل عبر لانتشخوتي وكوبوليتي — 370 كم،
    خمس ساعات ونصف، معبّد كله وبحالة معقولة. المتحف في وسط باتومي في شارع زوراب غورغيلادزه. الوقوف في
    الوسط مدفوع ومزدحم صيفاً، فاترك السيارة على بعد شارعين وامشِ. الوقود في كوتايسي وأوزورغيتي وكوبوليتي.
    وسيارة اقتصادية تكفي.
