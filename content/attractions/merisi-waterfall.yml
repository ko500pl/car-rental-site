ka:
  name: მერისის ჩანჩქერი
  short: >-
    30-მეტრიანი ჩანჩქერი შქერის ტყეში, ქედიდან 13 კილომეტრზე: ასფალტიდან ასიოდე მეტრია, ძირში კი ბუნებრივი
    აუზია ზაფხულის საბანაოდ.
  body: >-
    **ქედიდან ცამეტ კილომეტრზე, ვიწრო მთის გზის ბოლოს, ნაკადული ოცდაათიოდე მეტრიდან ეშვება ბუნებრივ აუზში,
    სადაც ზაფხულში ბანაობენ.**


    მერისის ჩანჩქერი სტუმარს ბევრს არაფერს სთხოვს. ასფალტი მისგან ასიოდე მეტრით ადრე მთავრდება, შემდეგ
    შქერის ტყით გამავალი ბილიკი ჩანჩქერის ძირამდე მიგიყვანთ, სადაც წყლის ხმაური ყველაფერს ფარავს, რაც
    ზურგს უკან დატოვეთ. იქიდან მოაჯირიანი კიბეები ზემოთ, სადამზერებისკენ ადის. ვისაც კიბეები უჭირს, პატარა
    საბაგიროდან ზემოდან გადახედავს. ახლოს ქოხები და კაფეა აჭარული კერძებით, ასე რომ, მოკლე გაჩერება ადვილად
    იქცევა ხანგრძლივ სადილად ჩრდილში.


    ჩანჩქერი სოფელ მერისის სახელს ატარებს. სოფელი დაახლოებით 700 მეტრის სიმაღლეზე დგას და საკუთარ სიმღერებს,
    ცეკვებსა და საკრავებს დღესაც ინახავს, სტუმრებს კი ფოლკლორული პროგრამებით უზიარებს. იქაური საოჯახო
    სასტუმროები აჭარულ სამზარეულოსაც ასწავლიან ყველას, ვინც სახელოს დაიკაპიწებს.


    აქ არც დიდი ისტორიაა და არც ლეგენდა, რომლის გამეორებაც ღირდეს — მხოლოდ ჩამოქანებული წყალი, მწვანე
    ჩრდილი, ცივი აუზი და სოფელი, რომელიც ჯერაც მღერის.
  tip: >-
    ჩანჩქერს საათნახევარი დაუთმეთ, თუ ბანაობთ — მეტიც. წყალი ყველაზე უხვად გაზაფხულის თოვლის დნობის შემდეგაა,
    საბანაოდ კი ივნისიდან სექტემბრამდეა ხელსაყრელი. აუზის გარშემო ქვები სრიალაა, ამიტომ არასრიალა ძირიანი
    ფეხსაცმელი ჩაიცვით, ძლიერი წვიმის შემდეგ კი, როცა ჩანჩქერი მძვინვარებს, წყალში ნუ შეხვალთ. ოფიციალური
    შესასვლელი საფასური არსად წერია, თუმცა მცირე ადგილობრივი ან პარკირების გადასახადი შესაძლებელია — ცოტა
    ნაღდი ფული იქონიეთ. საჭმელ-სასმელს კაფე და ქოხები უზრუნველყოფს. თუ მეტი გინდათ, ვიდრე მხოლოდ ჩანჩქერი,
    მერისში საოჯახო სასტუმროებში ფოლკლორული საღამოებისა და აჭარული სამზარეულოს გაკვეთილების შესახებ იკითხეთ.
  route: >-
    უმოკლესი გზა დაახლოებით 345 კილომეტრი და ექვსი საათია: ს1-ით (E60) ხაშურამდე, ს8-ით ბორჯომის გავლით
    ახალციხემდე, შემდეგ შ1-ით გოდერძის უღელტეხილზე და აჭარისწყლის ხეობაში, ხულოსა და შუახევის გავლით,
    ქედამდე. უღელტეხილი მხოლოდ უთოვლო თვეებშია გასავლელი, თხემთან რამდენიმე კილომეტრი ჯერაც გრუნტისაა,
    ზოგი ქირავნობის ხელშეკრულება კი ამ გზას კრძალავს. მთელი წლის მარშრუტი ზღვისპირეთით ბათუმზე გადის და
    ხეობას ქედამდე აუყვება: დაახლოებით 410 კილომეტრი და ექვსნახევარი საათი. ქედიდან ვიწრო მეორეხარისხოვანი
    გზა 13 კილომეტრზე მერისისკენ მიიკლაკნება, მეტწილად მოასფალტებული; მანქანა იქ დატოვეთ, სადაც ასფალტი
    მთავრდება, და ბოლო 100 მეტრი ფეხით გაიარეთ. მშრალ ამინდში ეკონომკლასის მანქანაც გაივლის. საწვავი ქედაში
    ჩაასხით.
en:
  name: Merisi Waterfall
  short: >-
    A 30-metre fall in rhododendron forest 13 km above Keda, a hundred metres from the end of the asphalt,
    with a natural pool for summer swimming.
  body: >-
    **Thirteen kilometres up a narrow mountain road from Keda, a stream drops some 30 metres into a natural
    pool where, in summer, people swim.**


    Merisi Waterfall asks very little of its visitors. The asphalt ends about a hundred metres short of
    it, and a path through rhododendron forest brings you to the foot of the fall, where the noise of
    the water drowns out everything behind you. From there, stairs with handrails climb to viewpoints
    above it. For those who would rather not take the steps, a small cable car gives a view from above.
    Huts and a café nearby serve Adjarian food, so a quick stop easily turns into a long lunch in the
    shade.


    The fall carries the name of the village of Merisi, which sits at around 700 metres and keeps its
    own songs, dances and musical instruments alive, sharing them with visitors through folklore programmes.
    Family guesthouses there also teach Adjarian cooking to anyone willing to roll up their sleeves.


    There is no long history here and no legend worth repeating: only falling water, green shade, a cold
    pool and a village that still sings.
  tip: >-
    Allow an hour and a half, more if you swim. The flow is strongest after the spring snowmelt, but the
    pool is really for June to September. Rocks around it are slippery, so wear shoes with grip, and stay
    out of the water when the fall runs hard after heavy rain. No official entry fee is published; a small
    local or parking charge is possible, so carry a little cash. The café and huts cover food and drink.
    If you want more than a waterfall, ask in Merisi village about folklore evenings or an Adjarian cooking
    class at a family guesthouse.
  route: >-
    The shortest road is about 345 km and six hours: the S1 (E60) to Khashuri, the S8 through Borjomi
    to Akhaltsikhe, then the Sh1 over the Goderdzi Pass and down the Adjaristsqali valley through Khulo
    and Shuakhevi to Keda. The pass is for the snow-free months only, a few kilometres near the top are
    still dirt, and some rental contracts exclude it. All year, go via Batumi and up the valley instead:
    about 410 km, six and a half hours. From Keda a narrow road, mostly paved, climbs 13 km towards Merisi;
    park where the asphalt ends and walk the last 100 m. An economy car manages in dry weather. Fuel up
    in Keda.
ru:
  name: Водопад Мериси
  short: >-
    30-метровый водопад в рододендроновом лесу в 13 км выше Кеды, в сотне метров от конца асфальта, с
    природной чашей для летнего купания.
  body: >-
    **В тринадцати километрах от Кеды вверх по узкой горной дороге ручей падает примерно с 30 метров в
    природную чашу, где летом купаются.**


    Водопад Мериси почти ничего не требует от гостей. Асфальт кончается примерно в сотне метров от него,
    и тропа через рододендроновый лес выводит к подножию водопада, где шум воды заглушает всё, что осталось
    за спиной. Оттуда ступени с перилами поднимаются к смотровым площадкам над ним. Кто не хочет идти
    по ступеням, может взглянуть на водопад сверху с небольшой канатной дороги. Неподалёку хижины и кафе
    с аджарской кухней, так что короткая остановка легко превращается в долгий обед в тени.


    Водопад носит имя села Мериси, которое лежит на высоте около 700 метров и бережно хранит свои песни,
    танцы и музыкальные инструменты, делясь ими с гостями в фольклорных программах. В семейных гостевых
    домах там же учат аджарской кухне каждого, кто готов засучить рукава.


    Здесь нет долгой истории и нет легенды, которую стоило бы пересказывать: только падающая вода, зелёная
    тень, холодная чаша и село, которое всё ещё поёт.
  tip: >-
    Закладывайте полтора часа, а если собираетесь купаться — больше. Мощнее всего водопад после весеннего
    таяния снегов, но купаться по-настоящему можно с июня по сентябрь. Камни вокруг скользкие, так что
    нужна обувь с цепкой подошвой, а когда после сильного дождя вода идёт бурно, в чашу не заходите. Официальная
    плата за вход не опубликована; возможен небольшой местный сбор или плата за парковку, так что возьмите
    немного наличных. Еду и напитки найдёте в кафе и хижинах. Если хочется большего, чем водопад, спросите
    в селе Мериси о фольклорных вечерах или уроке аджарской кухни в семейном гостевом доме.
  route: >-
    Кратчайший путь — около 345 км и шесть часов: по S1 (E60) до Хашури, по S8 через Боржоми до Ахалцихе,
    затем по Sh1 через перевал Годердзи и вниз по долине Аджарисцкали через Хуло и Шуахеви до Кеды. Перевал
    открыт только в бесснежные месяцы, несколько километров у вершины всё ещё грунтовые, а некоторые договоры
    проката его исключают. Круглый год лучше ехать через Батуми и вверх по долине: около 410 км, шесть
    с половиной часов. От Кеды узкая, в основном асфальтированная дорога поднимается на 13 км к Мериси;
    оставьте машину там, где кончается асфальт, и пройдите последние 100 м пешком. В сухую погоду справится
    машина эконом-класса. Заправьтесь в Кеде.
fa:
  name: آبشار مریسی
  short: >-
    آبشاری ۳۰ متری در جنگل رودودندرون، ۱۳ کیلومتر بالاتر از کدا و صد متر آن‌سوتر از پایان آسفالت، با حوضچه‌ای
    طبیعی برای شنای تابستانی.
  body: >-
    **سیزده کیلومتر بالاتر از کدا، در امتداد جاده‌ای باریک و کوهستانی، جویباری از ارتفاع حدود ۳۰ متر در
    حوضچه‌ای طبیعی فرو می‌ریزد که مردم تابستان‌ها در آن شنا می‌کنند.**


    آبشار مریسی از دیدارکنندگانش چیز زیادی نمی‌خواهد. آسفالت حدود صد متر مانده به آن تمام می‌شود و راهی
    از میان جنگل رودودندرون به پای آبشار می‌رسد، جایی که غرش آب هرچه را پشت سر گذاشته‌اید در خود فرو می‌برد.
    از آنجا پله‌هایی نرده‌دار به دیدگاه‌هایی بالای آبشار می‌روند. برای کسانی که نمی‌خواهند از پله‌ها بروند،
    تله‌کابینی کوچک منظره‌ای از بالا فراهم می‌کند. کلبه‌ها و کافه‌ای در همان نزدیکی غذای آجاری سرو می‌کنند،
    و این‌گونه توقفی کوتاه به‌آسانی به ناهاری طولانی در سایه بدل می‌شود.


    آبشار نامش را از روستای مریسی گرفته است که در ارتفاع حدود ۷۰۰ متری قرار دارد و آوازها، رقص‌ها و سازهای
    خود را زنده نگه داشته و در برنامه‌های فولکلور با مهمانان در میان می‌گذارد. مهمان‌خانه‌های خانوادگی
    آنجا به هر کس که حاضر باشد آستین بالا بزند، آشپزی آجاری هم یاد می‌دهند.


    اینجا نه تاریخی دراز هست و نه افسانه‌ای که ارزش بازگفتن داشته باشد: تنها آبِ فروریزان، سایهٔ سبز،
    حوضچه‌ای سرد و روستایی که هنوز آواز می‌خواند.
  tip: >-
    یک ساعت و نیم وقت بگذارید، و اگر شنا می‌کنید بیشتر. آب آبشار پس از ذوب برف‌های بهاری از همیشه پرتر
    است، اما فصل شنا در حوضچه از ژوئن تا سپتامبر است. سنگ‌های اطرافش لغزنده‌اند، پس کفشی با کف ضدلغزش
    بپوشید، و وقتی آبشار پس از باران شدید پرزور می‌ریزد، وارد آب نشوید. ورودیهٔ رسمی‌ای اعلام نشده است؛
    ممکن است هزینهٔ اندکی به‌عنوان عوارض محلی یا پارکینگ گرفته شود، پس کمی پول نقد همراه داشته باشید.
    کافه و کلبه‌ها خوراک و نوشیدنی را فراهم می‌کنند. اگر چیزی بیش از یک آبشار می‌خواهید، در روستای مریسی
    دربارهٔ شب‌های فولکلور یا کلاس آشپزی آجاری در مهمان‌خانه‌ای خانوادگی بپرسید.
  route: >-
    کوتاه‌ترین راه حدود ۳۴۵ کیلومتر و شش ساعت است: S1 (E60) تا خاشوری، S8 از راه بورجومی تا آخالتسیخه،
    سپس Sh1 از روی گردنهٔ گودردزی و پایین به درهٔ آجاریس‌تسکالی، از خولو و شواخوی تا کدا. گردنه تنها در
    ماه‌های بی‌برف گذرپذیر است، چند کیلومتر نزدیک قله هنوز خاکی است و برخی قراردادهای اجارهٔ خودرو آن
    را مستثنا کرده‌اند. در تمام سال، به‌جای آن از راه باتومی بروید و از دره بالا بروید: حدود ۴۱۰ کیلومتر،
    شش ساعت و نیم. از کدا جاده‌ای باریک که بیشترش آسفالت است ۱۳ کیلومتر به سوی مریسی بالا می‌رود؛ جایی
    که آسفالت تمام می‌شود پارک کنید و ۱۰۰ متر پایانی را پیاده بروید. خودروی اقتصادی در هوای خشک از پسش
    برمی‌آید. در کدا سوخت‌گیری کنید.
he:
  name: מפל מריסי
  short: מפל בגובה 30 מטרים ביער רודודנדרונים, 13 ק״מ מעל קדה ומאה מטרים מסוף האספלט, עם בריכה טבעית לשחייה
    בקיץ.
  body: >-
    **שלושה עשר קילומטרים במעלה דרך הררית צרה מקדה, נחל צונח מגובה של כ-30 מטרים אל בריכה טבעית שבה שוחים
    בקיץ.**


    מפל מריסי מבקש ממבקריו מעט מאוד. האספלט נגמר כמאה מטרים לפניו, ושביל דרך יער רודודנדרונים מוביל למרגלות
    המפל, שם רעש המים מבליע את כל מה שנשאר מאחוריכם. משם עולות מדרגות עם מעקות אל נקודות תצפית מעל המפל.
    מי שמעדיף לוותר על המדרגות יכול להשקיף על המפל מלמעלה מרכבל קטן. בקתות ובית קפה בסמוך מגישים אוכל
    אג׳רי, כך שעצירה קצרה הופכת בקלות לארוחת צהריים ארוכה בצל.


    המפל נקרא על שם הכפר מריסי, השוכן בגובה של כ-700 מטרים ומשמר את השירים, הריקודים וכלי הנגינה שלו,
    וחולק אותם עם מבקרים בתוכניות פולקלור. בבתי הארחה משפחתיים בכפר מלמדים גם בישול אג׳רי את כל מי שמוכן
    להפשיל שרוולים.


    אין כאן היסטוריה ארוכה ואין אגדה שכדאי לספר שוב: רק מים נופלים, צל ירוק, בריכה קרה וכפר שעדיין שר.
  tip: >-
    הקדישו שעה וחצי, ויותר אם אתם מתכוונים לשחות. המפל חזק במיוחד אחרי הפשרת השלגים באביב, אבל הבריכה
    מתאימה לשחייה בעיקר מיוני עד ספטמבר. הסלעים סביבה חלקלקים, לכן נעלו נעליים עם אחיזה טובה, ואל תיכנסו
    למים כשהמפל זורם בעוצמה אחרי גשם כבד. לא פורסמו דמי כניסה רשמיים; ייתכן תשלום מקומי קטן או תשלום על
    חניה, לכן הצטיידו במעט מזומן. בית הקפה והבקתות דואגים לאוכל ולשתייה. אם אתם רוצים יותר ממפל, שאלו
    בכפר מריסי על ערבי פולקלור או על שיעור בישול אג׳רי בבית הארחה משפחתי.
  route: >-
    הדרך הקצרה ביותר היא כ-345 ק״מ ושש שעות: כביש S1 (E60) עד חשורי, כביש S8 דרך בורג׳ומי עד אחלציחה,
    ואז כביש Sh1 דרך מעבר גודרדזי ובירידה לאורך עמק האג׳ריסצקאלי דרך חולו ושואחווי עד קדה. המעבר עביר
    רק בחודשים שבהם אין שלג, כמה קילומטרים ליד הפסגה עדיין אינם סלולים, וחלק מחוזי ההשכרה מחריגים אותו.
    בכל ימות השנה סעו במקום זאת דרך בטומי ובמעלה העמק: כ-410 ק״מ ושש שעות וחצי. מקדה עולה דרך צרה, סלולה
    ברובה, 13 ק״מ לכיוון מריסי; החנו במקום שבו נגמר האספלט ולכו ברגל את 100 המטרים האחרונים. במזג אוויר
    יבש רכב קטן מקטגוריית אקונומי מסתדר. תדלקו בקדה.
ar:
  name: شلال ميريسي
  short: >-
    شلال بارتفاع 30 متراً في غابة رودودندرون على بعد 13 كم فوق كيدا، وعلى مئة متر من نهاية الأسفلت، مع
    بركة طبيعية للسباحة صيفاً.
  body: >-
    **على بعد ثلاثة عشر كيلومتراً صعوداً في طريق جبلي ضيق من كيدا، يهوي جدول من ارتفاع نحو 30 متراً في
    بركة طبيعية يسبح فيها الناس صيفاً.**


    لا يطلب شلال ميريسي من زواره إلا القليل. فالأسفلت ينتهي قبله بنحو مئة متر، ويقود درب عبر غابة الرودودندرون
    إلى أسفل الشلال، حيث يطغى هدير الماء على كل ما تركته خلفك، ومن هناك تصعد درجات مزوّدة بدرابزين إلى
    نقاط مشاهدة فوقه. ومن يفضّل ألا يسلك الدرجات يجد تلفريكاً صغيراً يمنحه إطلالة من الأعلى. وفي الجوار
    أكواخ ومقهى تقدّم الطعام الأجاري، فتتحول الوقفة القصيرة بسهولة إلى غداء طويل في الظل.


    ويحمل الشلال اسم قرية ميريسي، الواقعة على ارتفاع نحو 700 متر، والتي تحافظ على أغانيها ورقصاتها وآلاتها
    الموسيقية حيّة، وتشاركها مع الزوار في برامج فولكلورية. كما تعلّم بيوت الضيافة العائلية هناك الطبخ
    الأجاري لكل من هو مستعد لأن يشمّر عن ساعديه.


    لا تاريخ طويلاً هنا ولا أسطورة تستحق أن تُروى من جديد: فقط ماء يهوي، وظل أخضر، وبركة باردة، وقرية
    لا تزال تغني.
  tip: >-
    خصّص ساعة ونصفاً، وأكثر إن كنت ستسبح. يبلغ تدفق الشلال أقصاه بعد ذوبان الثلوج في الربيع، لكن البركة
    تصلح للسباحة فعلياً من يونيو إلى سبتمبر. الصخور حولها زلقة، فانتعل حذاءً جيد القبضة، وابقَ خارج الماء
    حين يشتد تدفق الشلال بعد المطر الغزير. لا توجد رسوم دخول رسمية منشورة؛ وقد تُفرض رسوم محلية صغيرة
    أو رسوم للموقف، فاحمل قليلاً من النقود. المقهى والأكواخ تكفي للطعام والشراب. وإن أردت أكثر من شلال،
    فاسأل في قرية ميريسي عن الأمسيات الفولكلورية أو عن درس في الطبخ الأجاري في بيت ضيافة عائلي.
  route: >-
    أقصر الطرق نحو 345 كم وست ساعات: الطريق S1 (E60) إلى خاشوري، ثم S8 عبر بورجومي إلى أخالتسيخه، ثم Sh1
    عبر ممر غودردزي نزولاً في وادي أجاريستسقالي مروراً بخولو وشواخيفي حتى كيدا. الممر صالح للعبور في الأشهر
    الخالية من الثلج فقط، وبضعة كيلومترات قرب القمة لا تزال ترابية، وبعض عقود التأجير تستثنيه. وعلى مدار
    العام اسلك بدلاً منه الطريق عبر باتومي ثم صعوداً في الوادي: نحو 410 كم وست ساعات ونصف. ومن كيدا يصعد
    طريق ضيق، معبّد في معظمه، مسافة 13 كم نحو ميريسي؛ اركن حيث ينتهي الأسفلت وامشِ آخر 100 متر. تكفي سيارة
    من الفئة الاقتصادية في الطقس الجاف. تزوّد بالوقود في كيدا.
