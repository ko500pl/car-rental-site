ka:
  name: ლებაისკარი
  short: XVI–XVII საუკუნეების ხუთსართულიანი ხევსურული ციხე-სახლი დათვისჯვრის უღელტეხილს იქით, შატილის
    გზის მოდარაჯე.
  body: >-
    **დათვისჯვრის უღელტეხილს იქით, სადაც მდინარეები უკვე ჩრდილოეთისკენ მიედინება, ხუთსართულიანი ქვის კოშკი
    XVI–XVII საუკუნეებიდან დარაჯობს შატილის გზას.**


    ლებაისკარი პირიქითა ხევსურეთშია — ასე ჰქვია კავკასიონის მთავარი ქედის გადაღმა, ჩრდილოეთ კალთაზე გაშლილ
    ხევსურეთს, — ამავე სახელწოდების პატარა სოფელთან, კისტანიდან დაახლოებით ორ კილომეტრში. საქართველოს
    ტურიზმის ეროვნული ადმინისტრაცია ციხეს XVI–XVII საუკუნეებით ათარიღებს და წერს, რომ იგი ხევსურეთის ერთ-ერთ
    მთავარ გზას აკონტროლებდა და სოფლის დაცვაში მნიშვნელოვან როლს ასრულებდა.


    კოშკი მთიანეთის საცხოვრებელი ციხე-სახლის სახელმძღვანელო ნიმუშია: ოჯახი აქ ერთსა და იმავე კედლებში
    ცხოვრობდა და იბრძოდა. ქვედა სართული გომური იყო, საქონლისთვის. შიგნით სართულებს მუდმივი კიბე კი არა,
    გადასატანი ხის კიბეები აკავშირებდა. შუა სიმაღლეზე კოშკის ოთხივე კედელს თითო პატარა, აივნის მსგავსი
    სალოდე აქვს, რომლითაც კოშკის ძირს იცავდნენ. ბოლო სართული შიგნიდან შეკრული კამარითაა გადახურული, გარედან
    კი ქვის საფეხურებიანი პირამიდით სრულდება.


    წყაროები ამაზე მეტს თითქმის არაფერს გვეუბნება: არც დამაარსებელ გვარს ასახელებს, არც დათარიღებულ ალყას.
    არც ჩვენ მოვიგონებთ. კოშკი ისედაც მეტყველია: დადექით მის ძირში, ახედეთ სალოდეებს და ამ ხეობებში ცხოვრების
    კანონს მეგზური აღარ დასჭირდება.
  tip: >-
    შესვლა უფასოა და კოშკს არავინ დარაჯობს; ირგვლივ ბალახისა და ქვის მეტი არაფერია — არც კაფე, არც საპირფარეშო.
    უახლოესი სასტუმრო სახლები შატილშია, გზის გაგრძელებაზე. კედლებსა და სახურავზე ნუ აძვრებით: წყობა საუკუნეებისაა.
    2000 მეტრზე მაღლა ამინდი აგვისტოშიც სწრაფად ცივდება და წვიმად იქცევა — თბილი ტანსაცმელი თან იქონიეთ.
    საზღვრისპირა მხარეა, ამიტომ პასპორტი არ დაგავიწყდეთ. კისტანთან ერთად საათნახევარი საკმარისია; დილით
    წამოსულებს შატილამდე და მუცომდეც მიუწვდებათ ხელი.
  route: >-
    137 კმ; გაითვალისწინეთ ოთხ საათზე ცოტა მეტი. თბილისიდან ს1 მაგისტრალით მცხეთამდე იარეთ, შემდეგ ჩრდილოეთით,
    ს3-ით; ჟინვალთან შ26 გზაზე — ბარისახოსა და შატილისკენ — გადაუხვიეთ. ასფალტი ბარისახოს მიდამოებში მთავრდება;
    იქიდან ხრეშიანი მთის გზა დათვისჯვრის უღელტეხილზე (2676 მ) ადის და პირიქითა ხევსურეთში ეშვება. კოშკი
    უღელტეხილიდან რამდენიმე კილომეტრში, გზასთან ახლოს დგას. იქირავეთ მაღალი გამავლობის ოფროუდ-მანქანა:
    წვიმის შემდეგ საფარი ტალახად და ფხვიერ ქვად იქცევა. ავზი ჟინვალში შეავსეთ — ბარისახოს იქით ბენზინგასამართი
    სადგური არ არის. გზა რეალურად მხოლოდ დაახლოებით ივნისიდან სექტემბრამდეა გასავლელი.
en:
  name: Lebaiskari
  short: >-
    A five-storey Khevsur tower-house of the 16th–17th centuries, standing guard over the road to Shatili
    beyond the Datvisjvari Pass.
  body: >-
    **Beyond the Datvisjvari Pass, where the rivers already run north, a five-storey stone tower has kept
    watch over the road to Shatili since the 16th or 17th century.**


    Lebaiskari stands in Pirikita Khevsureti, the name for the part of Khevsureti that lies across the
    main Caucasus ridge on its northern slope, beside a hamlet of the same name about 2 km from Kistani.
    Georgia's National Tourism Administration dates it to the 16th–17th centuries and describes it as
    a fortress that controlled one of Khevsureti's main roads and played an important part in defending
    the village.


    It is a textbook highland tower-house, where a family lived and fought within the same walls. The
    ground floor was the byre, for cattle. Inside, the storeys were linked not by fixed stairs but by
    movable wooden ladders. Halfway up, each of the four walls carries a small balcony-like projection,
    a salode, from which the foot of the tower was defended. The top storey is vaulted inside and finished
    outside with a stepped stone pyramid.


    The written record says little more: no founding family, no dated siege, and we will not invent one.
    The tower speaks for itself. Stand at its foot, look up at the salode, and the logic of life in these
    valleys needs no guide.
  tip: >-
    Free and unguarded, with nothing around it but grass and stone: no café, toilet or ticket office.
    The nearest guesthouses are in Shatili, further down the road. Do not climb on the walls or roof;
    the masonry is centuries old. Above 2,000 metres the weather can turn cold and wet even in August,
    so pack a warm layer. This is a border district, so carry your passport. An hour and a half covers
    Lebaiskari and Kistani together; start early and you can continue to Shatili and Mutso the same day.
  route: >-
    137 km; allow a little over four hours. From Tbilisi take the S1 to Mtskheta and the S3 north; at
    Zhinvali turn off onto the Sh26 for Barisakho and Shatili. The asphalt gives out around Barisakho;
    from there a gravel mountain road climbs over the Datvisjvari Pass (2,676 m) and drops into Pirikita
    Khevsureti. The tower stands near the road a few kilometres below the pass. Rent an off-road vehicle
    with real ground clearance: after rain the surface turns to mud and loose rock. Fill the tank at Zhinvali,
    as there is no fuel station beyond Barisakho. In practice the road is passable only from about June
    to September.
ru:
  name: Лебаискари
  short: Пятиэтажная хевсурская башня-жилище XVI–XVII веков, что стережёт дорогу на Шатили за перевалом
    Датвисджвари.
  body: >-
    **За перевалом Датвисджвари, где реки уже текут на север, пятиэтажная каменная башня с XVI или XVII
    века несёт дозор над дорогой на Шатили.**


    Лебаискари стоит в Пирикита-Хевсурети — так называют ту часть Хевсурети, что лежит по ту сторону Главного
    Кавказского хребта, на его северном склоне, — рядом с одноимённой деревушкой, примерно в 2 км от Кистани.
    Национальная администрация туризма Грузии датирует башню XVI–XVII веками и описывает её как крепость,
    которая контролировала одну из главных дорог Хевсурети и играла важную роль в обороне селения.


    Это хрестоматийная горская башня-жилище: семья жила и сражалась в одних и тех же стенах. Нижний этаж
    служил хлевом для скота. Внутри этажи соединялись не постоянными лестницами, а переносными деревянными.
    На середине высоты каждая из четырёх стен несёт небольшой выступ наподобие балкона — салоде, откуда
    обороняли подножие башни. Верхний этаж изнутри перекрыт сводом, а снаружи завершается ступенчатой
    каменной пирамидой.


    Письменные источники почти ничего к этому не добавляют: ни рода-основателя, ни датированной осады
    — и выдумывать их мы не станем. Башня говорит сама за себя. Встаньте у её подножия, поднимите глаза
    на салоде — и логика жизни в этих долинах станет ясна без всякого гида.
  tip: >-
    Вход свободный, охраны нет, вокруг только трава и камень: ни кафе, ни туалета, ни кассы. Ближайшие
    гостевые дома — в Шатили, дальше по дороге. Не лазайте по стенам и крыше: кладке несколько веков.
    Выше 2000 метров даже в августе может внезапно стать холодно и сыро, так что захватите тёплую одежду.
    Это пограничный район — держите паспорт при себе. На Лебаискари и Кистани вместе хватит полутора часов;
    выехав рано, вы в тот же день успеете в Шатили и Муцо.
  route: >-
    137 км, закладывайте чуть больше четырёх часов. Из Тбилиси по S1 до Мцхеты, дальше на север по S3;
    в Жинвали сверните на Sh26 в сторону Барисахо и Шатили. Асфальт заканчивается в районе Барисахо; дальше
    гравийная горная дорога поднимается на перевал Датвисджвари (2676 м) и спускается в Пирикита-Хевсурети.
    Башня стоит у дороги, в нескольких километрах ниже перевала. Берите внедорожник с настоящим клиренсом:
    после дождя покрытие превращается в грязь и сыпучий камень. Заправьтесь в Жинвали — за Барисахо заправок
    нет. На деле дорога проходима лишь примерно с июня по сентябрь.
fa:
  name: لبائیسکاری
  short: >-
    برج‌خانه‌ای پنج‌طبقه در خوسورتی از سده‌های شانزدهم و هفدهم که آن سوی گردنهٔ داتویسجواری، راه شاتیلی
    را پاس می‌دارد.
  body: >-
    **آن سوی گردنهٔ داتویسجواری، جایی که رودها دیگر به سوی شمال روان‌اند، برجی سنگی و پنج‌طبقه از سدهٔ
    شانزدهم یا هفدهم بر راه شاتیلی دیده‌بانی می‌کند.**


    لبائیسکاری در پیریکیتا خوسورتی قرار دارد — نامی برای آن بخش از خوسورتی که آن سوی رشته‌کوه اصلی قفقاز،
    بر دامنهٔ شمالی آن، گسترده است — کنار آبادی کوچکی به همین نام، حدود ۲ کیلومتر دورتر از کیستانی. ادارهٔ
    ملی گردشگری گرجستان قدمت آن را به سده‌های شانزدهم و هفدهم می‌رساند و آن را دژی توصیف می‌کند که بر
    یکی از راه‌های اصلی خوسورتی چیره بود و در دفاع از روستا نقشی مهم داشت.


    این نمونه‌ای کلاسیک از برج‌خانه‌های کوهستانی است؛ خانواده میان همین دیوارها هم زندگی می‌کرد و هم می‌جنگید.
    طبقهٔ همکف طویله بود، برای دام‌ها. در درون، طبقه‌ها نه با پله‌های ثابت، بلکه با نردبان‌های چوبیِ جابه‌جاشدنی
    به هم راه داشتند. در میانهٔ ارتفاع، از هر یک از چهار دیوار پیش‌آمدگی کوچکی شبیه بالکن بیرون زده است
    به نام «سالوده» که از آن از پای برج دفاع می‌کردند. طبقهٔ آخر از درون طاق‌دار است و از بیرون با هرمی
    سنگی و پلکانی پایان می‌یابد.


    اسناد مکتوب چیز چندانی بر این نمی‌افزایند: نه نام خاندان بنیان‌گذار، نه محاصره‌ای تاریخ‌دار — و ما
    هم چیزی از خود نخواهیم ساخت. برج خود گویاست. پای آن بایستید، به سالوده‌ها چشم بدوزید، و منطق زندگی
    در این دره‌ها بی‌نیاز از راهنما بر شما روشن می‌شود.
  tip: >-
    رایگان و بی‌نگهبان است و گرداگردش جز علف و سنگ چیزی نیست: نه کافه، نه دست‌شویی، نه باجهٔ بلیت. نزدیک‌ترین
    مهمان‌خانه‌ها در شاتیلی‌اند، جلوتر در همین راه. از دیوارها و بام بالا نروید؛ این سنگ‌چین چند سده عمر
    دارد. بالای ۲۰۰۰ متر هوا حتی در ماه اوت می‌تواند سرد و بارانی شود، پس یک لایه لباس گرم بردارید. این‌جا
    منطقه‌ای مرزی است؛ گذرنامه همراهتان باشد. یک ساعت و نیم برای لبائیسکاری و کیستانی با هم کافی است؛
    اگر زود راه بیفتید، همان روز به شاتیلی و موتسو هم می‌رسید.
  route: >-
    ۱۳۷ کیلومتر؛ کمی بیش از چهار ساعت وقت بگذارید. از تفلیس جادهٔ S1 را تا متسختا و سپس S3 را به سوی شمال
    بگیرید؛ در ژینوالی به Sh26 به سمت باریساخو و شاتیلی بپیچید. آسفالت حوالی باریساخو تمام می‌شود؛ از
    آن‌جا جاده‌ای کوهستانی و شنی تا گردنهٔ داتویسجواری (۲۶۷۶ متر) بالا می‌رود و به پیریکیتا خوسورتی فرود
    می‌آید. برج چند کیلومتر پایین‌تر از گردنه، نزدیک جاده ایستاده است. خودروی آفرود با فاصلهٔ واقعی از
    زمین کرایه کنید: پس از باران، سطح جاده به گل و سنگ لق بدل می‌شود. باک را در ژینوالی پر کنید، چون پس
    از باریساخو پمپ‌بنزینی نیست. در عمل، جاده تنها از حدود ژوئن تا سپتامبر قابل عبور است.
he:
  name: לבאיסקארי
  short: בית-מגדל חבסורי בן חמש קומות מהמאות ה-16–17, השומר על הדרך לשאטילי בצדו הצפוני של מעבר דטוויסג'ווארי.
  body: >-
    **מצפון למעבר דטוויסג'ווארי, היכן שהנהרות כבר זורמים צפונה, מגדל אבן בן חמש קומות שומר על הדרך לשאטילי
    מאז המאה ה-16 או ה-17.**


    לבאיסקארי עומד בפיריקיטה חבסורתי — כך נקרא החלק של חבסורתי השוכן מעבר לרכס הקווקז הראשי, על מדרונו
    הצפוני — ליד כפרון הנושא אותו שם, כ-2 ק״מ מקיסטני. מינהלת התיירות הלאומית של גאורגיה מתארכת אותו למאות
    ה-16–17 ומתארת אותו כמבצר ששלט באחת הדרכים הראשיות של חבסורתי ומילא תפקיד חשוב בהגנה על הכפר.


    זהו בית-מגדל הררי קלאסי, שבו משפחה חיה ולחמה בין אותם קירות. הקומה התחתונה שימשה רפת לבקר. בפנים חוברו
    הקומות לא במדרגות קבועות אלא בסולמות עץ ניידים. באמצע גובה המגדל בולטת מכל אחד מארבעת הקירות מרפסת
    זיז קטנה, סאלודה, שממנה הגנו על בסיס המגדל. הקומה העליונה מקורה מבפנים בקמרון, ומבחוץ היא מסתיימת
    בפירמידת אבן מדורגת.


    המקורות הכתובים כמעט אינם מוסיפים דבר: לא משפחה מייסדת ולא מצור מתוארך, ואנחנו לא נמציא אותם. המגדל
    מדבר בעד עצמו. עמדו למרגלותיו, הרימו את העיניים אל הסאלודה, והיגיון החיים בעמקים האלה יתבהר לכם גם
    בלי מדריך.
  tip: >-
    הכניסה חופשית ואין שומר; מסביב רק עשב ואבן: אין בית קפה, אין שירותים ואין קופה. בתי ההארחה הקרובים
    נמצאים בשאטילי, בהמשך הדרך. אל תטפסו על הקירות או על הגג — הבנייה בת מאות שנים. מעל 2,000 מטר מזג
    האוויר עלול להפוך לקר וגשום גם באוגוסט, אז הביאו בגד חם. זהו אזור גבול, לכן שאו עמכם דרכון. שעה וחצי
    מספיקות ללבאיסקארי ולקיסטני יחד; אם תצאו מוקדם, תוכלו להמשיך באותו יום לשאטילי ולמוצו.
  route: >-
    137 ק״מ; הקצו קצת יותר מארבע שעות. מטביליסי סעו בכביש S1 עד מצחתה ומשם צפונה בכביש S3; בז'ינוואלי
    פנו לכביש Sh26 לכיוון בריסאחו ושאטילי. האספלט נגמר בסביבות בריסאחו; משם דרך הרים של חצץ מטפסת אל מעבר
    דטוויסג'ווארי (2,676 מ') ויורדת אל פיריקיטה חבסורתי. המגדל ניצב סמוך לדרך, כמה קילומטרים מתחת למעבר.
    שכרו רכב שטח עם מרווח גחון של ממש: אחרי גשם פני הדרך הופכים לבוץ ולאבנים רופפות. תדלקו בז'ינוואלי,
    כי אחרי בריסאחו אין תחנת דלק. בפועל הדרך עבירה רק מיוני עד ספטמבר בערך.
ar:
  name: ليبايسكاري
  short: >-
    برج سكني خيفسوري من خمسة طوابق يعود إلى القرنين السادس عشر والسابع عشر، يحرس الطريق إلى شاتيلي خلف
    ممر داتفيسجفاري.
  body: >-
    **خلف ممر داتفيسجفاري، حيث تجري الأنهار نحو الشمال، يقف برج حجري من خمسة طوابق حارساً على طريق شاتيلي
    منذ القرن السادس عشر أو السابع عشر.**


    يقع ليبايسكاري في بيريكيتا خيفسوريتي، وهو الاسم الذي يُطلق على جزء خيفسوريتي الممتد وراء سلسلة القوقاز
    الرئيسية على سفحها الشمالي، بجوار قرية صغيرة تحمل الاسم نفسه، على بعد نحو 2 كم من كيستاني. وتؤرّخه
    الإدارة الوطنية للسياحة في جورجيا بالقرنين السادس عشر والسابع عشر، وتصفه بأنه حصن كان يتحكم في أحد
    الطرق الرئيسية في خيفسوريتي وأدّى دوراً مهماً في الدفاع عن القرية.


    إنه نموذج مثالي للبرج السكني الجبلي، حيث كانت العائلة تعيش وتقاتل بين الجدران نفسها. كان الطابق الأرضي
    حظيرة للماشية. وفي الداخل لم تكن الطوابق موصولة بسلالم ثابتة، بل بسلالم خشبية متنقلة. وفي منتصف الارتفاع
    يبرز من كل جدار من الجدران الأربعة نتوء صغير يشبه الشرفة يُسمّى «سالودي»، كان المدافعون يحمون منه
    أسفل البرج. أما الطابق العلوي فمسقوف من الداخل بقبو، ويُختتم من الخارج بهرم حجري مدرّج.


    لا تضيف المصادر المكتوبة أكثر من ذلك: لا أسرة مؤسِّسة ولا حصار مؤرَّخ، ولن نختلق شيئاً من هذا. البرج
    يتحدث عن نفسه. قف عند قاعدته، وارفع بصرك إلى السالودي، وسيتّضح لك منطق الحياة في هذه الوديان من غير
    دليل.
  tip: >-
    الدخول مجاني ولا حراسة، ولا شيء حوله سوى العشب والحجر: لا مقهى ولا دورة مياه ولا شباك تذاكر. أقرب
    بيوت الضيافة في شاتيلي، أبعد على الطريق نفسه. لا تتسلق الجدران أو السطح؛ فعمر هذا البناء قرون. فوق
    2000 متر قد يصبح الطقس بارداً وماطراً حتى في أغسطس، فاحمل ملابس دافئة. هذه منطقة حدودية، فاحمل جواز
    سفرك. تكفي ساعة ونصف لليبايسكاري وكيستاني معاً؛ وإن انطلقت باكراً أمكنك متابعة الطريق إلى شاتيلي وموتسو
    في اليوم نفسه.
  route: >-
    137 كم؛ خصّص ما يزيد قليلاً على أربع ساعات. من تبليسي خذ الطريق S1 إلى متسخيتا ثم S3 شمالاً؛ وفي جينفالي
    انعطف إلى الطريق Sh26 باتجاه باريساخو وشاتيلي. ينتهي الإسفلت عند باريساخو تقريباً؛ ومن هناك يصعد طريق
    جبلي حصوي إلى ممر داتفيسجفاري (2676 م) ثم ينحدر إلى بيريكيتا خيفسوريتي. يقف البرج قرب الطريق على بعد
    بضعة كيلومترات أسفل الممر. استأجر سيارة للطرق الوعرة بخلوص أرضي حقيقي: فبعد المطر يتحول سطح الطريق
    إلى وحل وحجارة سائبة. املأ الخزان في جينفالي، إذ لا محطة وقود بعد باريساخو. عملياً لا يمكن سلوك الطريق
    إلا من يونيو إلى سبتمبر تقريباً.
