ka:
  name: ბათუმის მეჩეთი (ორთა ჯამე)
  short: >-
    ბათუმის ერთადერთი მოქმედი მეჩეთი, 1866 წელს მუსლიმი ქართველი დიდებულის ოჯახის დაკვეთით აგებული: ოქროსფერი
    გუმბათი და ლაზი ოსტატების მოხატული კედლები.
  body: >-
    **პარასკევს, შუადღისას, ბათუმის მეჩეთი მლოცველებს ვეღარ იტევს და ლოცვა კარიდან ძველი ქალაქის ტროტუარებზე
    გადმოდის.**


    ეს ორთა ჯამეა — „შუა მეჩეთი“. სახელი ქალაქის დაკარგული რუკის ნაფლეთია: ოდესღაც ის ორ სხვა მეჩეთს შორის
    იდგა, რომლებიც მოგვიანებით დაანგრიეს, დღეს კი ერთადერთი მოქმედი მეჩეთია ქალაქში, სადაც მრავალრიცხოვანი
    მუსლიმი თემი ცხოვრობს. მეჩეთი 1866 წელს აიგო აჭარის გამოჩენილი მუსლიმი ქართველი დიდებულის, ასლან-ბეგ
    ხიმშიაშვილის ოჯახის დაკვეთით — შეხსენება იმისა, რომ აქ ისლამი ქართველების, მათ შორის დიდგვაროვანთა,
    სარწმუნოებაც იყო.


    სტილი ოსმალურია: ოქროსფერი გუმბათი, თეთრი მინარეთი, ორ რიგად განლაგებული ფანჯრები, ხის სახურავი. შიგნით
    კედლები ლაზმა ოსტატებმა მოხატეს, რომლებსაც მეხსიერებამ მხოლოდ „ლაზი ძმების“ სახელით შემოგვინახა; შესვლა
    სწორედ მათი ფერისა და ორნამენტის სანახავად ღირს.


    საბჭოთა ათწლეულებმა მეჩეთი არ დაინდო: დახურეს და სამხედრო საწყობად აქციეს. 1990-იან წლებში აღადგინეს,
    1995 წელს კი აქ ლოცვა განახლდა. მას შემდეგ მეჩეთი კვლავ სავსეა: ხუთჯერადი ლოცვა, პარასკევის ჯუმა,
    სასწავლებელი, სადაც ბავშვები ყურანსა და მხარის ისტორიას სწავლობენ, დიდი დღესასწაულების ლოცვები, რომლებსაც
    ზოგჯერ საქართველოს მუფტიც ესწრება. ამასთან, ის აშკარად პატარაა. ათ წელზე მეტია, თემი ბათუმში მეორე
    მეჩეთის აშენებას ითხოვს, საკითხი კი სასამართლოში ჯერაც გადაუწყვეტელია.


    ქალაქში ცოტა შენობაა ასეთი მოკრძალებული და ასეთი სავსე.
  tip: >-
    შესვლა უფასოა და ლოცვის დროის გარდა სტუმრები ყოველთვის სასურველნი არიან; ნახევარი საათიც საკმარისია.
    პარასკევის შუადღეს ნუ მიხვალთ — მაშინ მეჩეთიც და ქუჩაც მლოცველებითაა სავსე; ყოველდღიური ლოცვის დროსაც
    წყნარად და შეუმჩნევლად იყავით. მოკრძალებულად ჩაიცვით, მხრები და მუხლები დაფარული გქონდეთ; ქალებმა
    თავსაფარი წაიღონ, ფეხსაცმელს კი კარებთან იხდიან. მლოცველის გადაღებამდე ნებართვა ითხოვეთ. ბაირამზე
    მთელი უბანი მლოცველებით ივსება: პატივისცემით, მოშორებიდან ამის ყურება შთამბეჭდავია, დათვალიერებისთვის
    კი ეს დრო არ არის. მეჩეთი ბულვარიდან და პიაცადან რამდენიმე წუთის სავალზეა და ახლომდებარე ღვთისმშობლის
    ტაძართან ერთად ადვილად დაათვალიერებთ.
  route: >-
    ბათუმამდე თბილისიდან დაახლოებით 370 კილომეტრი და ხუთნახევარი საათია. ს1 (E60) მაგისტრალით გაიარეთ
    გორი, ხაშური, რიკოთის გვირაბები და ქუთაისი სამტრედიამდე, შემდეგ ს12-ით ლანჩხუთის გავლით გრიგოლეთამდე,
    იქიდან კი ზღვისპირა ს2-ით (E70) სამხრეთით, ქობულეთის გავლით, ქალაქში შედით. გზა ბოლომდე ასფალტია,
    დიდწილად ოთხზოლიანი, ეკონომკლასის მანქანა სავსებით საკმარისია, საწვავიც ყველგან იშოვება. მეჩეთი ძველ
    ქალაქშია, ბულვარიდან და პიაცადან რამდენიმე წუთის სავალზე. ძველი ქალაქის ქუჩები ვიწროა და პარკირება
    ძნელი, ამიტომ მანქანა სასტუმროსთან ან ფასიან ავტოსადგომზე დატოვეთ და ფეხით გაისეირნეთ.
en:
  name: Batumi Mosque (Orta Jame)
  short: >-
    Batumi's only working mosque, built in 1866 for a Muslim Georgian noble family: a golden dome, walls
    painted by Laz masters, Friday prayers in the street.
  body: >-
    **At Friday midday the mosque of Batumi runs out of room, and the prayer spills through its doors
    onto the pavements of the old town.**


    This is Orta Jame, the 'middle mosque'. The nickname is a scrap of lost city map: the building once
    stood between two other mosques, both since demolished, and it is now the only active mosque in a
    city with a sizeable Muslim community. It was commissioned in 1866 by the family of Aslan Beg Khimshiashvili,
    a leading Muslim Georgian nobleman of Adjara, a reminder that here Islam was the faith of Georgians
    too, lords included.


    The style is Ottoman: a golden dome, a white minaret, windows set in two tiers, a timber roof. Inside,
    the walls were painted by Laz craftsmen remembered simply as 'the Laz brothers', and their colour
    and pattern are the reason to step in.


    The Soviet decades were not kind. The mosque was closed and turned into a military warehouse; it was
    restored in the 1990s and reopened for worship in 1995. Since then it has been full again: the five
    daily prayers, the Friday Jumu'ah, a school where children study the Quran and local history, and
    holiday prayers at which the Mufti of Georgia is sometimes present. It is also, plainly, too small.
    For more than a decade the community has asked for a second mosque in Batumi, and the question is
    still unresolved in the courts.


    Few buildings in the city are this modest and this full.
  tip: >-
    Entry is free and visitors are welcome outside prayer times; half an hour is plenty. Avoid Friday
    midday, when the mosque and the street outside fill with worshippers, and be discreet during the daily
    prayers. Dress modestly, with shoulders and knees covered; women should bring a headscarf, and shoes
    come off at the door. Ask before photographing anyone at prayer. At Eid the whole quarter fills: moving
    to witness from a respectful distance, but no time for sightseeing. The mosque is a few minutes' walk
    from the Boulevard and the Piazza, and makes an easy pairing with the Cathedral of the Mother of God
    nearby.
  route: >-
    Batumi is about 370 km and five and a half hours from Tbilisi. Take the S1 (E60) through Gori and
    Khashuri, through the Rikoti tunnels and past Kutaisi to Samtredia, then the S12 through Lanchkhuti
    to Grigoleti and the coastal S2 (E70) south through Kobuleti into the city. It is asphalt all the
    way, much of it four-lane, and an economy car is all you need; fuel is never far away. The mosque
    stands in the old town, a few minutes on foot from the Boulevard and the Piazza. Old-town streets
    are narrow and parking is tight, so leave the car at your hotel or in a paid car park and walk.
ru:
  name: Батумская мечеть (Орта-Джаме)
  short: >-
    Единственная действующая мечеть Батуми (1866), построенная для знатного рода грузин-мусульман: золотой
    купол, лазские росписи, пятничная молитва на улице.
  body: >-
    **В пятницу в полдень батумской мечети не хватает места, и молитва выплёскивается через двери на тротуары
    старого города.**


    Это Орта-Джаме, «средняя мечеть». Прозвище — обрывок исчезнувшей карты города: когда-то здание стояло
    между двумя другими мечетями, обе с тех пор снесены, и теперь это единственная действующая мечеть
    в городе с заметной мусульманской общиной. Её заказала в 1866 году семья Аслан-бека Химшиашвили, видного
    аджарского дворянина-мусульманина, — напоминание о том, что здесь ислам был верой и самих грузин,
    в том числе знати.


    Стиль — османский: золотой купол, белый минарет, окна в два яруса, деревянная кровля. Внутри стены
    расписали лазские мастера, которых помнят просто как «братьев-лазов», и ради их красок и узоров стоит
    зайти.


    Советские десятилетия были к мечети неласковы. Её закрыли и превратили в военный склад; в 1990-х отреставрировали
    и в 1995 году вновь открыли для молитвы. С тех пор она снова полна: пять ежедневных намазов, пятничный
    джума-намаз, школа, где дети изучают Коран и историю края, праздничные молитвы, на которых порой бывает
    муфтий Грузии. И она, откровенно говоря, слишком мала. Больше десяти лет община добивается второй
    мечети в Батуми, и вопрос до сих пор не решён в судах.


    Немногие здания в городе так скромны — и так полны.
  tip: >-
    Вход свободный, посетителей рады видеть вне времени молитвы; получаса вполне хватит. Избегайте пятничного
    полудня, когда мечеть и улица перед ней заполнены молящимися, и держитесь незаметно во время ежедневных
    намазов. Одевайтесь скромно: плечи и колени закрыты; женщинам стоит взять платок, обувь снимают у
    входа. Спрашивайте разрешения, прежде чем фотографировать молящихся. В праздник байрама весь квартал
    заполняется людьми: трогательно наблюдать с почтительного расстояния, но осматривать достопримечательности
    в это время не выйдет. До бульвара и Пьяццы — несколько минут пешком, а визит легко совместить с соседним
    собором Богородицы.
  route: >-
    Батуми — примерно в 370 км и пяти с половиной часах езды от Тбилиси. Езжайте по S1 (E60) через Гори
    и Хашури, через Рикотские тоннели и мимо Кутаиси до Самтредиа, затем по S12 через Ланчхути до Григолети
    и по прибрежной S2 (E70) на юг через Кобулети в город. Асфальт на всём пути, большая часть — четыре
    полосы, и машины эконом-класса вполне достаточно; заправки всегда недалеко. Мечеть стоит в старом
    городе, в нескольких минутах ходьбы от бульвара и Пьяццы. Улицы старого города узкие, с парковкой
    туго, так что оставьте машину у отеля или на платной стоянке и идите пешком.
fa:
  name: مسجد باتومی (اورتا جامع)
  short: >-
    تنها مسجد فعال باتومی، ساخته‌ی ۱۸۶۶ برای خاندانی از اشراف مسلمان گرجی: گنبدی زرین، دیوارهایی با نقش
    استادان لاز، و نماز جمعه‌ای که تا خیابان می‌رسد.
  body: >-
    **ظهر جمعه مسجد باتومی جا کم می‌آورد و نماز از درهایش بیرون می‌ریزد و پیاده‌روهای شهر قدیم را پر می‌کند.**


    این اورتا جامع است، «مسجد میانی». این نام تکه‌ای از نقشه‌ی از دست‌رفته‌ی شهر است: بنا روزگاری میان
    دو مسجد دیگر قرار داشت که هر دو از آن پس ویران شده‌اند، و اکنون تنها مسجد فعال شهری است که جامعه‌ی
    مسلمان چشمگیری دارد. ساخت آن را در ۱۸۶۶ خاندان اصلان‌بیگ خیمشیاشویلی، از بزرگان مسلمان گرجی آجارا،
    سفارش داد — یادآوری این‌که این‌جا اسلام دین خود گرجی‌ها هم بود، از جمله اشرافشان.


    سبک بنا عثمانی است: گنبدی زرین، مناره‌ای سفید، پنجره‌هایی در دو ردیف، و بامی چوبین. درون، دیوارها
    را استادکاران لازی نقاشی کرده‌اند که تنها با عنوان «برادران لاز» در یادها مانده‌اند، و رنگ و نقش کار
    آن‌هاست که دلیل پا گذاشتن به درون است.


    دهه‌های شوروی با مسجد مهربان نبود. آن را بستند و به انبار نظامی بدل کردند؛ در دهه‌ی ۱۹۹۰ مرمت شد و
    در ۱۹۹۵ بار دیگر به روی نمازگزاران گشوده شد. از آن پس دوباره پر است: نمازهای پنج‌گانه‌ی روزانه، نماز
    جمعه، مدرسه‌ای که کودکان در آن قرآن و تاریخ محلی می‌آموزند، و نمازهای عید که گاه مفتی گرجستان هم در
    آن حاضر است. و روشن بگوییم: بیش از اندازه کوچک است. بیش از یک دهه است که جامعه‌ی مسلمان خواستار مسجد
    دومی در باتومی است، و این مسئله هنوز در دادگاه‌ها حل‌نشده مانده است.


    کمتر بنایی در این شهر این‌قدر فروتن و این‌قدر پر است.
  tip: >-
    ورود رایگان است و بیرون از وقت نماز قدم بازدیدکنندگان گرامی است؛ نیم ساعت کاملاً کافی است. از ظهر
    جمعه دوری کنید، که مسجد و خیابان جلوی آن از نمازگزاران پر می‌شود، و هنگام نمازهای روزانه بی‌صدا و
    نامحسوس باشید. پوشیده لباس بپوشید و شانه‌ها و زانوها را بپوشانید؛ بانوان روسری همراه بیاورند و کفش‌ها
    دم در درآورده می‌شود. پیش از عکس گرفتن از نمازگزاران اجازه بخواهید. در عید تمام محله پر می‌شود: تماشایش
    از فاصله‌ای محترمانه تأثیرگذار است، اما وقت گشت‌وگذار نیست. مسجد چند دقیقه پیاده از بلوار و پیاتسا
    فاصله دارد و به‌آسانی می‌شود دیدارش را با کلیسای جامع مادر خدا در همان نزدیکی همراه کرد.
  route: >-
    باتومی حدود ۳۷۰ کیلومتر و پنج ساعت و نیم از تفلیس فاصله دارد. با S1 (E60) از گوری و خاشوری بگذرید،
    از تونل‌های ریکوتی عبور کنید و از کنار کوتایسی تا سامتردیا برانید؛ سپس با S12 از لانچخوتی به گریگولتی
    بروید و از جاده‌ی ساحلی S2 (E70) به سوی جنوب، از کوبولتی به شهر برسید. سراسر راه آسفالت است و بیشترش
    چهاربانده، و یک خودروی اکونومی همه‌ی آن چیزی است که لازم دارید؛ جایگاه سوخت هیچ‌گاه دور نیست. مسجد
    در شهر قدیم است، چند دقیقه پیاده از بلوار و پیاتسا. خیابان‌های شهر قدیم باریک‌اند و جای پارک تنگ،
    پس خودرو را در هتل یا پارکینگی پولی بگذارید و پیاده بروید.
he:
  name: המסגד של בטומי (אורטה ג'אמע)
  short: >-
    המסגד הפעיל היחיד בבטומי, שנבנה ב-1866 עבור משפחת אצולה גאורגית מוסלמית: כיפה מוזהבת, קירות שציירו
    אמנים לאזים, ותפילת יום השישי שגולשת לרחוב.
  body: >-
    **בצהרי יום שישי נגמר המקום במסגד של בטומי, והתפילה גולשת מבעד לדלתותיו אל המדרכות של העיר העתיקה.**


    זהו אורטה ג'אמע, "המסגד האמצעי". הכינוי הוא שריד של מפת עיר שאבדה: פעם עמד הבניין בין שני מסגדים אחרים,
    ששניהם נהרסו מאז, והיום זהו המסגד הפעיל היחיד בעיר שיש בה קהילה מוסלמית גדולה. את בנייתו הזמינה ב-1866
    משפחתו של אסלאן בג חימשיאשווילי, מבכירי האצולה הגאורגית המוסלמית באג'ריה — תזכורת לכך שכאן האסלאם
    היה גם דתם של גאורגים, ובהם גם בני האצולה.


    הסגנון עות'מאני: כיפה מוזהבת, צריח לבן, חלונות בשתי שורות, גג עץ. בפנים ציירו את הקירות אומנים לאזים,
    שנזכרים פשוט בכינוי "האחים הלאזים", והצבעים והדוגמאות שלהם הם הסיבה להיכנס.


    העשורים הסובייטיים לא היטיבו עם המקום. המסגד נסגר והפך למחסן צבאי; הוא שוחזר בשנות ה-90 ונפתח מחדש
    לתפילה ב-1995. מאז הוא שוב מלא: חמש התפילות היומיות, תפילת הג'ומעה של יום שישי, בית ספר שבו ילדים
    לומדים קוראן ואת תולדות המקום, ותפילות חג שבהן נוכח לעיתים המופתי של גאורגיה. והוא גם, בפשטות, קטן
    מדי. כבר יותר מעשור הקהילה מבקשת מסגד שני בבטומי, והשאלה עדיין לא הוכרעה בבתי המשפט.


    מעט בניינים בעיר צנועים כל כך ומלאים כל כך.
  tip: >-
    הכניסה חינם, ומבקרים רצויים מחוץ לזמני התפילה; חצי שעה מספיקה בהחלט. הימנעו מצהרי יום שישי, כשהמסגד
    והרחוב שמולו מתמלאים במתפללים, והיו דיסקרטיים בזמן התפילות היומיות. התלבשו בצניעות, עם כתפיים וברכיים
    מכוסות; נשים צריכות להביא מטפחת ראש, ואת הנעליים חולצים בפתח. בקשו רשות לפני שאתם מצלמים מישהו בזמן
    תפילה. בחג העיד כל השכונה מתמלאת: מרגש לצפות ממרחק של כבוד, אבל זה לא הזמן לסיורים. המסגד נמצא כמה
    דקות הליכה מהשדרה ומהפיאצה, ומשתלב בקלות עם ביקור בקתדרלת אם האלוהים הסמוכה.
  route: >-
    בטומי נמצאת כ-370 ק"מ וחמש שעות וחצי נסיעה מטביליסי. סעו בכביש S1 (E60) דרך גורי וחשורי, דרך מנהרות
    ריקוטי ועל פני קוטאיסי עד סמטרדיה; משם בכביש S12 דרך לנצ'חוטי עד גריגולטי, ובכביש החוף S2 (E70) דרומה
    דרך קובולטי אל העיר. סלול לכל אורכו, רובו בארבעה נתיבים, ורכב אקונומי הוא כל מה שצריך; תחנת דלק אף
    פעם לא רחוקה. המסגד נמצא בעיר העתיקה, כמה דקות הליכה מהשדרה ומהפיאצה. הרחובות בעיר העתיקה צרים והחנייה
    דחוקה, לכן השאירו את הרכב במלון או בחניון בתשלום והמשיכו ברגל.
ar:
  name: مسجد باتومي (أورتا جامع)
  short: >-
    المسجد العامل الوحيد في باتومي، بُني عام 1866 لأسرة نبيلة جورجية مسلمة: قبة ذهبية، وجدران زيّنها معلّمون
    لاز، وصلاة جمعة تمتد إلى الشارع.
  body: >-
    **عند ظهر الجمعة يضيق مسجد باتومي بمصلّيه، فتفيض الصلاة من أبوابه إلى أرصفة البلدة القديمة.**


    هذا هو «أورتا جامع»، أي «الجامع الأوسط». واللقب قصاصة من خريطة مدينة ضاعت: فقد كان المبنى يقوم يومًا
    بين مسجدين آخرين هُدما كلاهما منذ ذلك الحين، وهو اليوم المسجد العامل الوحيد في مدينة فيها جالية مسلمة
    كبيرة. أمرت ببنائه عام 1866 أسرة أصلان بك خيمشياشفيلي، أحد أبرز النبلاء الجورجيين المسلمين في أجاريا
    — تذكيرًا بأن الإسلام كان هنا دين الجورجيين أيضًا، بمن فيهم نبلاؤهم.


    الطراز عثماني: قبة ذهبية، ومئذنة بيضاء، ونوافذ في صفّين، وسقف خشبي. وفي الداخل رسم الجدرانَ حِرفيّون
    من اللاز لا يُذكرون إلا باسم «الإخوة اللاز»، وألوانهم وزخارفهم هي سبب الدخول.


    لم تكن العقود السوفييتية رحيمة به. أُغلق المسجد وحُوّل إلى مستودع عسكري؛ ثم رُمّم في التسعينيات وأُعيد
    فتحه للصلاة عام 1995. ومنذ ذلك الحين امتلأ من جديد: الصلوات الخمس، وصلاة الجمعة، ومدرسة يتعلّم فيها
    الأطفال القرآن وتاريخ المنطقة، وصلوات الأعياد التي يحضرها أحيانًا مفتي جورجيا. وهو، بصراحة، أصغر مما
    ينبغي. فمنذ أكثر من عقد تطالب الجالية بمسجد ثانٍ في باتومي، ولا تزال المسألة عالقة أمام المحاكم.


    قليلةٌ هي المباني في المدينة التي تجمع هذا القدر من التواضع وهذا القدر من الامتلاء.
  tip: >-
    الدخول مجاني، والزوّار مرحَّب بهم خارج أوقات الصلاة؛ ونصف ساعة تكفي تمامًا. تجنّب ظهر الجمعة، حين
    يمتلئ المسجد والشارع أمامه بالمصلّين، والتزم التحفّظ أثناء الصلوات اليومية. البس ثيابًا محتشمة تغطي
    الكتفين والركبتين؛ وعلى النساء إحضار غطاء للرأس، وتُخلع الأحذية عند الباب. استأذن قبل تصوير أي مصلٍّ.
    في العيد يمتلئ الحيّ كله: مشهد مؤثّر لمن يتابعه من مسافة لائقة، لكنه ليس وقتًا للتجوال السياحي. يقع
    المسجد على بُعد دقائق سيرًا من البوليفار والبياتسا، ويسهل الجمع بين زيارته وزيارة كاتدرائية والدة
    الإله القريبة.
  route: >-
    تبعد باتومي عن تبليسي نحو 370 كم وخمس ساعات ونصفًا. اسلك الطريق S1 ‏(E60) عبر غوري وخاشوري، ثم عبر
    أنفاق ريكوتي ومتجاوزًا كوتايسي حتى سامتريديا، ثم الطريق S12 عبر لانتشخوتي إلى غريغوليتي، ثم الطريق
    الساحلي S2 ‏(E70) جنوبًا عبر كوبوليتي إلى المدينة. الطريق معبّد بالكامل، ومعظمه بأربعة مسارات، والسيارة
    الاقتصادية هي كل ما تحتاجه؛ ومحطات الوقود ليست بعيدة أبدًا. يقع المسجد في البلدة القديمة، على بُعد
    دقائق سيرًا من البوليفار والبياتسا. شوارع البلدة القديمة ضيقة والمواقف شحيحة، فاترك السيارة في الفندق
    أو في موقف مدفوع وتابع سيرًا على الأقدام.
