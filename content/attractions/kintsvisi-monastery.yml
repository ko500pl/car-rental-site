ka:
  name: ყინწვისის მონასტერი
  short: 'ოქროს ხანის აგურის ტაძარი ტყეში, ქარელთან: ლაჟვარდისფერი ანგელოზი აქ ქრისტეს ცარიელ საფლავზე
    მიუთითებს.'
  body: >-
    **ყინწვისში, მეფეთა პორტრეტების თავზე, ანგელოზი ზის და ქრისტეს ცარიელ საფლავზე მიუთითებს — მისი თავის
    დახრა ქართული მხატვრობის ერთ-ერთ ყველაზე საყვარელ სახედ იქცა.**


    მონასტერი ძამის ხეობაში, მაღალი მთის ტყიან ფერდობზე დგას, ქარელიდან დაახლოებით 10 კილომეტრში. სამი
    ეკლესიიდან უძველესი, X–XI საუკუნეების ღვთისმშობლის ეკლესია თითქმის მთლიანად ჩამოიქცა ფერდობზე: მხოლოდ
    აფსიდი შემორჩა, ტახტზე მჯდომი ღვთისმშობლითა და მოციქულთა ზიარებით. მთავარი, წმინდა ნიკოლოზის ტაძარი
    და მის გვერდით პაწია წმინდა გიორგის ეკლესია XIII საუკუნის დასაწყისს, ოქროს ხანის მწვერვალს განეკუთვნება.


    წმინდა ნიკოლოზის ტაძარი აგურითაა ნაშენი — იმ დროისთვის იშვიათი მასალით; მის თორმეტსარკმლიან გუმბათის
    ყელს ოდესღაც სამფეროვანი კრამიტი ეხურა. მოხატულობა 1205 წლამდე დასრულდა მეფის კარის მოხელის, ანტონ
    გნოლისთავისძის დაკვეთით; თავად ის სამხრეთ კედელზეა გამოსახული, ხელში ტაძრის მოდელით. ჩრდილოეთ კედელზე
    სამი მეფე დგას: გიორგი III, მისი ასული თამარი და თამარის ძე გიორგი IV ლაშა. მათ ზემოთ ზის ანგელოზი
    — ცისფერ სამოსში, ცისფერ ფონზე. ეს ფერი ლაჟვარდისგან დაფქული ნატურალური ულტრამარინია, მაშინ იშვიათი
    და ძვირფასი, აქ კი ხელგაშლილად დახარჯული.


    ორი საუკუნის შემდეგ ადგილობრივმა მთავარმა ზაზა ფანასკერტელმა ტაძრის კარიბჭე განაახლა, მოახატვინა და
    იქვე საკუთარი პორტრეტიც დატოვა — გვიანი ხელმოწერა ოქროს ხანის ფურცელზე.


    ინტერიერს სინათლე გუმბათის ყელიდან და ჯვრის ყოველი მკლავის სარკმლიდან ეფინება, ამიტომ ფერი შესვლისთანავე
    გხვდებათ. რვა საუკუნე გავიდა, ის ლურჯი კი დღემდე მთელ ტაძარს ფლობს.
  tip: >-
    შესვლა უფასოა. ეს მოქმედი მონასტერია: მხრები და მუხლები დაფარული უნდა იყოს, ქალებს თავსაფარი დასჭირდებათ.
    თუ ტაძარი დაკეტილი დაგხვდათ, ბერების სამყოფელში იკითხეთ. ლურჯი ფერი ყველაზე კარგად მზიან დღეს, შუადღისას
    ჩანს; ფლეშს ნუ გამოიყენებთ. კაფე და მაღაზია აქ არ არის — წყალი და საჭმელი ქარელიდან წამოიღეთ. ბოლო,
    ტყიანი მონაკვეთი წვიმის შემდეგ ტალახიანდება. დაგეგმეთ საათნახევარი, ცოტა მეტიც, თუ ფერდობზე ღვთისმშობლის
    ეკლესიის ნანგრევი აფსიდის ნახვა გინდათ.
  route: >-
    თბილისიდან ს1 (E60) გზით დასავლეთისკენ, გორის გავლით, დაახლოებით 100 კმ იარეთ ქარელის გასასვლელამდე.
    ქარელი გაიარეთ და ქარელი–ყინწვისის გზას (შ134) გაჰყევით სამხრეთ-დასავლეთით, ძამის ხეობაში: მონასტერი
    ავტომაგისტრალის სამხრეთითაა და არა ჩრდილოეთით, გასასვლელიდან დაახლოებით 17 კმ-ში. სულ დაახლოებით 118
    კმ და ორი საათი. მაგისტრალი სწრაფია, ბოლო კილომეტრები კი ვიწროვდება და ტყეში აღმართს მიუყვება; საფარი
    ადგილ-ადგილ უსწორმასწოროა. გონივრული არჩევანია კროსოვერი ან მაღალი გამავლობის ჯიპი, განსაკუთრებით
    წვიმის შემდეგ; მშრალ ამინდში ფრთხილი მძღოლი ჩვეულებრივი მანქანითაც ავა. საწვავი გორში ან ქარელში ჩაასხით.
en:
  name: Kintsvisi Monastery
  short: >-
    A red-brick Golden Age church in the forest near Kareli, where an angel in lapis-lazuli blue points
    to Christ's empty tomb.
  body: >-
    **Above a row of royal portraits at Kintsvisi, a seated angel points to Christ's empty tomb, and the
    tilt of its head has become one of the best-loved images in Georgian painting.**


    The monastery stands on a forested mountain slope in the Dzama valley, about 10 km from Kareli. Of
    its three churches, the oldest, 10th–11th-century St Mary's, has almost entirely slid down the hillside;
    only its apse survives, with an enthroned Virgin and the Communion of the Apostles. The main church
    of St Nicholas and the tiny chapel of St George beside it date from the early 13th century, the height
    of Georgia's Golden Age.


    St Nicholas is built of red brick, an unusual material for its time, and its twelve-windowed drum
    once wore a roof of tiles in three colours. Its paintings, finished before 1205, were commissioned
    by Anton Gnolistavisdze, a royal minister who appears on the south wall holding a model of the church.
    On the north wall stand three rulers: Giorgi III, his daughter Queen Tamar and her son Giorgi IV Lasha.
    Above them sits the angel, blue robes on a blue ground. That blue is natural ultramarine ground from
    lapis lazuli, then rare and costly, and it was spent here without restraint.


    Two centuries later a local prince, Zaza Panaskerteli, rebuilt the narthex, had it painted and added
    his own portrait: a late signature on a Golden Age page.


    The interior is lit from the drum and from windows in every arm of the cross, so the colour meets
    you as soon as you step inside. Eight centuries on, that blue still rules the room.
  tip: >-
    Entry is free. This is a working monastery: cover shoulders and knees, and women should bring a headscarf.
    If the church is locked, ask at the monks' quarters. A bright day around midday shows the blues at
    their best; no flash. There is no café or shop, so bring water and food from Kareli. The final forest
    stretch turns muddy after rain. Allow an hour and a half, a little more if you want to find the ruined
    apse of St Mary's on the slope.
  route: >-
    From Tbilisi follow the S1 (E60) west past Gori for about 100 km to the Kareli exit. Drive through
    Kareli and take the Kareli–Kintsvisi road (Sh134) south-west into the Dzama valley: the monastery
    lies south of the motorway, not north, some 17 km from the exit. In all about 118 km and two hours.
    The motorway is fast; the last kilometres narrow and climb through forest, and the surface can be
    rough. A crossover or SUV is the sensible choice, especially after rain; in dry weather a careful
    driver can manage in an ordinary car. Fill up in Gori or Kareli.
ru:
  name: Монастырь Кинцвиси
  short: >-
    Краснокирпичная церковь золотого века в лесу у Карели, где ангел в лазуритовой синеве указывает на
    пустую гробницу Христа.
  body: >-
    **Над рядом царских портретов в Кинцвиси сидит ангел и указывает на пустую гробницу Христа, и наклон
    его головы стал одним из самых любимых образов грузинской живописи.**


    Монастырь стоит на лесистом горном склоне в долине Дзама, примерно в 10 км от Карели. Из трёх его
    церквей самая древняя, храм Богородицы X–XI веков, почти целиком сполз вниз по склону; уцелела лишь
    апсида с Богоматерью на троне и Причащением апостолов. Главная церковь Святого Николая и крошечная
    часовня Святого Георгия рядом с ней относятся к началу XIII века — к вершине грузинского золотого
    века.


    Церковь Святого Николая сложена из красного кирпича, необычного для того времени материала, а её двенадцатиоконный
    барабан когда-то покрывала черепица трёх цветов. Росписи, законченные до 1205 года, заказал царский
    сановник Антон Гнолистависдзе — он изображён на южной стене с моделью храма в руках. На северной стене
    стоят три правителя: Георгий III, его дочь царица Тамар и её сын Георгий IV Лаша. Над ними сидит ангел
    — синие одежды на синем фоне. Эта синева — натуральный ультрамарин, растёртый из лазурита, редкого
    и дорогого в ту пору камня, и здесь его не жалели.


    Два века спустя местный князь Заза Панаскертели перестроил притвор, велел его расписать и добавил
    туда собственный портрет — поздняя подпись на странице золотого века.


    Свет падает в храм из барабана и из окон во всех рукавах креста, поэтому цвет встречает вас с первого
    шага. Прошло восемь столетий, а эта синева по-прежнему правит пространством.
  tip: >-
    Вход свободный. Монастырь действующий: плечи и колени должны быть закрыты, женщинам стоит взять платок.
    Если церковь заперта, спросите в монашеском корпусе. Синие тона лучше всего видны в ясный день около
    полудня; вспышкой не пользуйтесь. Кафе и магазина нет, так что воду и еду берите в Карели. Последний
    лесной участок после дождя раскисает. Заложите полтора часа — чуть больше, если захотите отыскать
    на склоне руины апсиды церкви Богородицы.
  route: >-
    Из Тбилиси по S1 (E60) на запад мимо Гори — около 100 км до съезда на Карели. Проезжайте через Карели
    и берите дорогу Карели — Кинцвиси (Sh134) на юго-запад, в долину Дзама: монастырь лежит к югу от магистрали,
    а не к северу, примерно в 17 км от съезда. Всего около 118 км и два часа в пути. Магистраль скоростная;
    последние километры сужаются и поднимаются через лес, покрытие местами неровное. Разумный выбор —
    кроссовер или внедорожник, особенно после дождя; в сухую погоду аккуратный водитель справится и на
    обычной машине. Заправьтесь в Гори или Карели.
fa:
  name: صومعهٔ کینتسویسی
  short: >-
    کلیسایی از آجر سرخ و از عصر طلایی، در جنگلی نزدیک کارلی، جایی که فرشته‌ای در آبی لاجوردی به گور خالی
    مسیح اشاره می‌کند.
  body: >-
    **در کینتسویسی، بالای ردیفی از چهره‌های شاهانه، فرشته‌ای نشسته و به گور خالی مسیح اشاره می‌کند؛ و
    خمِ سرش به یکی از محبوب‌ترین تصویرهای نقاشی گرجی بدل شده است.**


    صومعه بر دامنهٔ جنگلی کوهی در درهٔ دزاما ایستاده، حدود ۱۰ کیلومتری کارلی. از سه کلیسای آن، کهن‌ترینشان،
    کلیسای مریم مقدس از سده‌های دهم و یازدهم، تقریباً یکسره از دامنه فرولغزیده و تنها آپسیسش مانده است،
    با نقش مریمِ بر تخت نشسته و صحنهٔ «عشای ربانیِ حواریون». کلیسای اصلی، نیکلاس قدیس، و نمازخانهٔ کوچکِ
    گئورگ قدیس در کنارش به آغاز سدهٔ سیزدهم بازمی‌گردند، به اوج عصر طلایی گرجستان.


    کلیسای نیکلاس قدیس از آجر سرخ ساخته شده، مصالحی نامعمول برای روزگار خود، و گریوِ دوازده‌پنجرهٔ گنبدش
    زمانی بامی از سفال‌های سه‌رنگ داشت. نقاشی‌های دیواری‌اش که پیش از ۱۲۰۵ به پایان رسید، سفارش آنتون
    گنولیستاویسدزه بود، از وزیران دربار، که بر دیوار جنوبی ماکتی از کلیسا در دست دارد. بر دیوار شمالی
    سه فرمانروا ایستاده‌اند: گیورگی سوم، دخترش ملکه تامار، و پسر تامار، گیورگی چهارم لاشا. بالای سرشان
    فرشته نشسته است: جامه‌ای آبی بر زمینه‌ای آبی. این آبی، لاجوردیِ طبیعی است که از سنگ لاجورد می‌ساییدند؛
    رنگی کمیاب و گران در آن روزگار، که اینجا بی‌دریغ خرجش کرده‌اند.


    دو سده بعد، شاهزاده‌ای محلی به نام زازا پاناسکرتلی دهلیز ورودی (نارتکس) را از نو ساخت، فرمان داد آن
    را نقاشی کنند و چهرهٔ خودش را هم بر آن افزود: امضایی دیرهنگام بر برگی از عصر طلایی.


    نور از گریو و از پنجره‌های همهٔ بازوهای صلیب به درون می‌ریزد، و رنگ از همان قدم نخست به پیشوازتان
    می‌آید. هشت سده گذشته و آن آبی هنوز بر این فضا فرمان می‌راند.
  tip: >-
    ورود رایگان است. صومعه فعال است: شانه‌ها و زانوها را بپوشانید و بانوان روسری همراه داشته باشند. اگر
    در کلیسا بسته بود، سراغ اقامتگاه راهبان بروید. روزی آفتابی، حوالی ظهر، آبی‌ها را در بهترین جلوه‌شان
    نشان می‌دهد؛ از فلاش استفاده نکنید. کافه و فروشگاهی در کار نیست، پس آب و خوراک را از کارلی بردارید.
    تکهٔ پایانی راه در جنگل پس از باران گِلی می‌شود. یک ساعت و نیم وقت بگذارید، و اگر می‌خواهید ویرانهٔ
    آپسیس کلیسای مریم مقدس را بر دامنه پیدا کنید، کمی بیشتر.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب بگیرید و از گوری بگذرید تا پس از حدود ۱۰۰ کیلومتر به خروجی
    کارلی برسید. از میان کارلی بگذرید و جادهٔ کارلی–کینتسویسی (Sh134) را به سوی جنوب‌غربی، به درون درهٔ
    دزاما، دنبال کنید: صومعه در جنوب بزرگراه است، نه در شمال آن، حدود ۱۷ کیلومتر از خروجی. روی‌هم حدود
    ۱۱۸ کیلومتر و دو ساعت راه. بزرگراه تندرو است؛ اما کیلومترهای آخر باریک می‌شوند و در دل جنگل بالا می‌روند
    و رویهٔ راه گاه ناهموار است. کراس‌اوور یا شاسی‌بلند انتخاب معقولی است، به‌ویژه پس از باران؛ در هوای
    خشک رانندهٔ محتاط با خودروی معمولی هم می‌رسد. در گوری یا کارلی باک را پر کنید.
he:
  name: מנזר קינצוויסי
  short: כנסיית לבנים אדומות מתור הזהב, ביער סמוך לקארלי, ובה מלאך בכחול של לאפיס לזולי מצביע על קברו
    הריק של ישו.
  body: >-
    **בקינצוויסי, מעל שורה של דיוקנאות מלכותיים, יושב מלאך ומצביע על קברו הריק של ישו, והטיית ראשו הפכה
    לאחד הדימויים האהובים ביותר בציור הגאורגי.**


    המנזר עומד על מדרון הר מיוער בעמק דזאמה, כ-10 ק"מ מקארלי. משלוש כנסיותיו, העתיקה שבהן, כנסיית מריה
    הקדושה מהמאות ה-10–11, החליקה כמעט כולה במורד המדרון; שרדה רק האפסיס שלה, ועליה הבתולה היושבת על כס
    ותמונת סעודת הקודש של השליחים. הכנסייה הראשית, של ניקולאוס הקדוש, והקפלה הזעירה של גאורגיוס הקדוש
    הסמוכה לה, מתוארכות לראשית המאה ה-13, לשיא תור הזהב של גאורגיה.


    כנסיית ניקולאוס הקדוש בנויה מלבנים אדומות, חומר לא שגרתי בזמנה, ותוף הכיפה שלה, בעל שנים-עשר החלונות,
    היה מקורה פעם ברעפים בשלושה צבעים. את ציורי הקיר, שהושלמו לפני 1205, הזמין אנטון גנוליסטאוויסדזה,
    שר בחצר המלך, והוא מופיע על הקיר הדרומי ובידיו דגם של הכנסייה. על הקיר הצפוני עומדים שלושה שליטים:
    גיאורגי השלישי, בתו המלכה תמר, ובנה של תמר, גיאורגי הרביעי לאשה. מעליהם יושב המלאך, גלימות כחולות
    על רקע כחול. הכחול הזה הוא אולטרמרין טבעי, שנטחן מאבן לאפיס לזולי, נדירה ויקרה באותם ימים, וכאן לא
    חסכו בו כלל.


    מאתיים שנה מאוחר יותר בנה נסיך מקומי, זאזא פנסקרטלי, מחדש את הנרתקס (אולם הכניסה), ציווה לעטר אותו
    בציורים והוסיף בו את דיוקנו שלו: חתימה מאוחרת על דף מתור הזהב.


    האור חודר פנימה מן התוף ומחלונות בכל אחת מזרועות הצלב, ולכן הצבע פוגש אתכם מיד עם הכניסה. שמונה מאות
    שנה חלפו, והכחול הזה עדיין שולט בחלל.
  tip: >-
    הכניסה חופשית. זהו מנזר פעיל: כסו כתפיים וברכיים, ונשים יביאו כיסוי ראש. אם הכנסייה נעולה, שאלו במגורי
    הנזירים. ביום בהיר, סביב הצהריים, הכחולים נראים במיטבם; בלי פלאש. אין בית קפה ואין חנות, לכן הביאו
    מים ואוכל מקארלי. הקטע האחרון, דרך היער, נעשה בוצי אחרי גשם. הקדישו לביקור שעה וחצי, ומעט יותר אם
    תרצו לחפש על המדרון את שרידי האפסיס של כנסיית מריה הקדושה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), עברו את גורי והמשיכו כ-100 ק"מ עד היציאה לקארלי. חצו את קארלי והמשיכו
    בכביש קארלי–קינצוויסי (Sh134) לדרום-מערב, אל עמק דזאמה: המנזר נמצא מדרום לכביש המהיר ולא מצפון לו,
    כ-17 ק"מ מן היציאה. בסך הכול כ-118 ק"מ ושעתיים נסיעה. על הכביש המהיר מתקדמים מהר; הקילומטרים האחרונים
    צרים ומטפסים דרך היער, והכביש עלול להיות משובש. קרוסאובר או רכב שטח הם הבחירה הנבונה, בייחוד אחרי
    גשם; במזג אוויר יבש נהג זהיר יסתדר גם במכונית רגילה. תדלקו בגורי או בקארלי.
ar:
  name: دير كينتسفيسي
  short: كنيسة من الآجر الأحمر من العصر الذهبي في غابة قرب كاريلي، يشير فيها ملاك بزرقة اللازورد إلى قبر
    المسيح الفارغ.
  body: >-
    **في كينتسفيسي، فوق صفٍّ من الصور الملكية، يجلس ملاك يشير إلى قبر المسيح الفارغ، وقد غدت إمالة رأسه
    من أحبّ الصور في فن الرسم الجورجي.**


    يقوم الدير على منحدر جبلي تكسوه الغابات في وادي دزاما، على بعد نحو 10 كم من كاريلي. ومن كنائسه الثلاث
    انزلقت أقدمها، كنيسة السيدة العذراء العائدة إلى القرنين العاشر والحادي عشر، كلها تقريباً إلى أسفل
    المنحدر، ولم يبقَ منها إلا الحنية، وفيها العذراء على العرش ومشهد مناولة الرسل. أما الكنيسة الرئيسية،
    كنيسة القديس نيقولاوس، والمصلّى الصغير للقديس جاورجيوس بجانبها، فيعودان إلى مطلع القرن الثالث عشر،
    ذروة العصر الذهبي في جورجيا.


    بُنيت كنيسة القديس نيقولاوس من الآجر الأحمر، وهي مادة غير مألوفة في زمنها، وكانت أسطوانة قبتها ذات
    النوافذ الاثنتي عشرة مسقوفة يوماً بقرميد من ثلاثة ألوان. أما جدارياتها التي اكتملت قبل عام 1205 فقد
    أمر بها أنطون غنوليستافيسدزه، أحد وزراء البلاط، ويظهر على الجدار الجنوبي حاملاً نموذجاً للكنيسة. وعلى
    الجدار الشمالي يقف ثلاثة حكّام: جورجي الثالث، وابنته الملكة تامار، وابنها جورجي الرابع لاشا. وفوقهم
    يجلس الملاك، أرديته زرقاء على أرضية زرقاء. هذه الزرقة ألترامارين طبيعي مسحوق من حجر اللازورد، وكان
    يومئذٍ نادراً باهظ الثمن، وقد بُذل هنا بلا تقتير.


    وبعد قرنين أعاد أمير محلي، زازا باناسكيرتيلي، بناء رواق المدخل (النارثكس)، وأمر بتزيينه بالرسوم، وأضاف
    إليه صورته: توقيع متأخر على صفحة من العصر الذهبي.


    يدخل الضوء من أسطوانة القبة ومن نوافذ في كل ذراع من أذرع الصليب، فيستقبلك اللون منذ الخطوة الأولى.
    مضت ثمانية قرون، وما زالت تلك الزرقة سيدة المكان.
  tip: >-
    الدخول مجاني. هذا دير عامر بالرهبان: غطّوا الأكتاف والركب، وعلى النساء إحضار غطاء للرأس. إن وجدتم
    الكنيسة مغلقة فاسألوا في مساكن الرهبان. يُظهر يومٌ مشمس قرابة الظهيرة درجات الأزرق في أبهى حالاتها؛
    ولا تستعملوا الفلاش. لا مقهى ولا متجر هنا، فاحملوا الماء والطعام من كاريلي. يصير المقطع الأخير عبر
    الغابة موحلاً بعد المطر. خصّصوا ساعة ونصفاً، وأكثر قليلاً إن أردتم البحث على المنحدر عن أطلال حنية
    كنيسة العذراء.
  route: >-
    من تبليسي اسلكوا الطريق S1 (E60) غرباً متجاوزين غوري، نحو 100 كم حتى مخرج كاريلي. اعبروا كاريلي ثم
    خذوا طريق كاريلي–كينتسفيسي (Sh134) باتجاه الجنوب الغربي إلى وادي دزاما: يقع الدير جنوب الطريق السريع
    لا شماله، على بعد نحو 17 كم من المخرج. المسافة كلها نحو 118 كم وساعتان. القيادة على الطريق السريع
    سريعة، أما الكيلومترات الأخيرة فتضيق وتصعد عبر الغابة، وقد يكون سطحها وعراً. سيارة كروس أوفر أو سيارة
    دفع رباعي هي الخيار المعقول، ولا سيما بعد المطر؛ وفي الطقس الجاف يستطيع سائق حذر الوصول بسيارة عادية.
    تزوّدوا بالوقود في غوري أو كاريلي.
