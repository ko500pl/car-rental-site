ka:
  name: ყინცვისის მონასტერი
  short: XIII საუკუნის მონასტერი ტყეში, სადაც „ყინცვისის ანგელოზი" — ქართული მხატვრობის ყველაზე ცნობილი
    ფრესკაა.
  body: >-
    **ყინცვისი ერთი ფრესკის გამო არსებობს ხელოვნების ისტორიაში** — და ეს ფრესკა მართლაც ღირს მოგზაურობად.
    წმინდა ნიკოლოზის ტაძრის ჩრდილოეთ კედელზე გამოსახულია ანგელოზი, რომელიც ქრისტეს აღდგომას აუწყებს მენელსაცხებლე
    დედებს. მისი სახე, ფერების რბილობა და ჟესტის სიმსუბუქე იმდენად განსხვავდება ეპოქის სტანდარტისგან,
    რომ „ყინცვისის ანგელოზი" ქართული შუასაუკუნეების მხატვრობის სიმბოლოდ იქცა.


    მონასტერი XII–XIII საუკუნეების მიჯნაზეა აშენებული, თამარ მეფის ეპოქაში — ქართული ოქროს ხანის პიკზე.
    კომპლექსში სამი ეკლესიაა, მთავარი მათგანი აგურით ნაშენი ჯვარგუმბათოვანი ტაძარია. შიგნით ასევე შემორჩა
    თამარის და გიორგი ლაშას პორტრეტები, რაც მას ისტორიულ დოკუმენტადაც აქცევს.


    ადგილი ცალკე მისაღებია: მონასტერი ხშირ, ფოთლოვან ტყეშია, ქარელის ჩრდილოეთით, პატარა ხეობის თავზე.
    შემოდგომაზე აქ განსაკუთრებით ლამაზია. ტერიტორია მოქმედი მონასტერია და ბერები აქვე ცხოვრობენ; სიჩუმე
    თითქმის სრულია და ტურისტების რაოდენობა მინიმალური.


    ყინცვისი ხშირად რჩება მარშრუტებს გარეთ, რადგან მთავარი ავტობანიდან 15 კილომეტრით არის დაშორებული —
    და სწორედ ამიტომ ხვდები აქ თითქმის მარტო.


    ფრესკების მდგომარეობა არათანაბარია: ზოგი ფრაგმენტი თითქმის სრულად შემორჩა, ზოგი კი ძლივს იკითხება.
    ბოლო წლებში ჩატარდა კონსერვაციის სამუშაოები და განათება გაუმჯობესდა, თუმცა ხელოვნური სინათლე მაინც
    მინიმალურია — ეს განზრახ კეთდება საღებავის დასაცავად. მოთმინება აქ დაგჭირდება: თვალი რამდენიმე წუთში
    ეგუება ნახევრად ბნელს და მხოლოდ ამის შემდეგ ჩნდება ის დეტალები, რომლის გამოც ჩამოხვედი.
  tip: >-
    ტაძრის კარი ყოველთვის ღია არ არის — თუ დაკეტილი დაგხვდა, სამონასტრო კორპუსში ჰკითხე. ფრესკები სუსტ
    ბუნებრივ განათებაშია, ამიტომ მოდი მზიან დღეს, შუადღისას; ფლეშით გადაღება აკრძალულია. ჩაცმის კოდი მოქმედებს,
    თავსაფრები კართან დევს. ბოლო კილომეტრები ტყეშია და წვიმის შემდეგ ილპება. ინფრასტრუქტურა არ არის: წყალი,
    საჭმელი და საწვავი ქარელში აიღე. ორი საათი სავსებით საკმარისია.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ გორზე გავლით ქარელამდე — დაახლოებით 110 კმ სწრაფი ავტობანით. ქარელში
    გადაუხვევ ჩრდილოეთით და კიდევ 12–15 კმ გაივლი სოფლების გავლით; ეს მონაკვეთი ძირითადად ასფალტია, მაგრამ
    ბოლო ორი-სამი კილომეტრი ვიწრო, ციცაბო და ადგილ-ადგილ გრუნტის გზაა ტყეში. სულ 125 კმ და დაახლოებით
    საათი და ორმოცდაათი წუთი. მშრალ ამინდში კროსოვერი კომფორტულია, სედანით შესაძლებელია მაგრამ ფრთხილად;
    წვიმის შემდეგ მაღალი კლირენსი ნამდვილად სჭირდება.
en:
  name: Kintsvisi Monastery
  short: A 13th-century monastery in the woods, home to the Angel of Kintsvisi — the best-known fresco
    in Georgian art.
  body: >-
    **Kintsvisi holds a place in art history because of one fresco,** and that fresco genuinely justifies
    the detour. On the north wall of St Nicholas church an angel announces the Resurrection to the myrrh-bearing
    women. The face, the softness of the pigment and the lightness of the gesture depart so far from the
    period standard that the Angel of Kintsvisi has become the emblem of medieval Georgian painting.


    The monastery was built around the turn of the 12th and 13th centuries, in the reign of Queen Tamar,
    at the peak of the Georgian golden age. Three churches stand in the complex, the main one a brick
    cross-domed church. Inside there are also portraits of Tamar and her son Giorgi Lasha, which makes
    the building a historical document as well as an artistic one.


    The setting matters too. The monastery sits in dense deciduous forest north of Kareli, above a small
    valley, and in autumn the colour here is remarkable. It is an active monastery with monks in residence,
    the silence is close to total, and visitor numbers are low.


    Kintsvisi is often skipped simply because it lies fifteen kilometres off the motorway — which is precisely
    why you tend to have it to yourself.
  tip: >-
    The church door is not always open; if you find it locked, ask at the monastic building. The frescoes
    are lit only by weak natural light, so come on a sunny day around midday, and flash photography is
    forbidden. The dress code applies and scarves are left by the door. The last kilometres run through
    forest and turn muddy after rain. There are no facilities at all — buy water, food and fuel in Kareli.
    Two hours is ample.
  route: >-
    From Tbilisi take the E60 west past Gori to Kareli, about 110 km of fast motorway. Turn north in Kareli
    and continue 12 to 15 km through villages. Most of that is asphalt, but the final two or three kilometres
    are narrow, steep and partly gravel through woodland. In total 125 km and roughly an hour and fifty
    minutes. In dry weather a crossover is comfortable and a sedan is possible with care; after rain you
    genuinely want ground clearance. Fill up in Gori or Kareli before turning off.
ru:
  name: Монастырь Кинцвиси
  short: Монастырь XIII века в лесу, где находится «Кинцвисский ангел» — самая известная фреска грузинской
    живописи.
  body: >-
    **Кинцвиси вошёл в историю искусства благодаря одной фреске,** и ради неё действительно стоит свернуть
    с трассы. На северной стене церкви святого Николая ангел возвещает Воскресение жёнам-мироносицам.
    Лицо, мягкость пигмента и лёгкость жеста настолько выбиваются из канона эпохи, что «Кинцвисский ангел»
    стал эмблемой средневековой грузинской живописи.


    Монастырь построен на рубеже XII и XIII веков, в правление царицы Тамар, на пике грузинского золотого
    века. В комплексе три церкви, главная из них — кирпичный крестово-купольный храм. Внутри сохранились
    и портреты Тамар с сыном Георгием Лашей, что делает здание ещё и историческим документом.


    Важна и обстановка. Монастырь стоит в густом лиственном лесу севернее Карели, над небольшой долиной,
    и осенью цвет здесь поразительный. Обитель действующая, монахи живут при ней, тишина почти абсолютная,
    посетителей мало.


    Кинцвиси часто пропускают просто потому, что он в пятнадцати километрах от трассы, — и именно поэтому
    вы, скорее всего, окажетесь здесь одни.
  tip: >-
    Дверь храма открыта не всегда; если заперто, спросите в монастырском корпусе. Фрески освещены только
    слабым дневным светом, так что приезжайте в солнечный день ближе к полудню; снимать со вспышкой запрещено.
    Действует дресс-код, платки лежат у входа. Последние километры идут через лес и после дождя раскисают.
    Инфраструктуры нет вовсе — воду, еду и топливо берите в Карели. Двух часов более чем достаточно.
  route: >-
    Из Тбилиси по E60 на запад мимо Гори до Карели — около 110 км быстрой магистрали. В Карели поворот
    на север и ещё 12–15 км через сёла. Большая часть асфальт, но последние два-три километра — узкая
    крутая, местами грунтовая дорога по лесу. Всего 125 км и примерно час пятьдесят. В сухую погоду кроссовер
    комфортен, седан проедет аккуратно; после дождя клиренс действительно нужен. Заправляйтесь в Гори
    или Карели до поворота.
fa:
  name: صومعهٔ کینتسویسی
  short: صومعه‌ای از سدهٔ سیزدهم در دل جنگل، خانهٔ فرشتهٔ کینتسویسی — شناخته‌شده‌ترین نقاشی دیواری هنر
    گرجی.
  body: >-
    **کینتسویسی جایگاهش را در تاریخ هنر مدیون یک نقاشی دیواری است،** و آن نقاشی واقعاً ارزش این انحراف
    از مسیر را دارد. روی دیوار شمالی کلیسای سنت نیکولاس، فرشته‌ای رستاخیز را به زنان مُرآور خبر می‌دهد.
    چهره، نرمی رنگدانه و سبکی حرکت چنان از معیار آن دوران فاصله می‌گیرند که فرشتهٔ کینتسویسی به نماد نقاشی
    گرجی سده‌های میانه بدل شده است.


    صومعه در گذار سده‌های دوازدهم و سیزدهم، در روزگار ملکه تامار و در اوج عصر طلایی گرجستان ساخته شد.
    سه کلیسا در مجموعه ایستاده‌اند و اصلی‌ترینشان کلیسایی آجری با نقشهٔ صلیب-گنبد است. در درون تصاویر
    تامار و پسرش گیورگی لاشا هم هست، و همین بنا را در کنار اثری هنری به سندی تاریخی بدل می‌کند.


    قرار گرفتن آن هم مهم است. صومعه در جنگلی انبوه از درختان برگ‌ریز شمال کارلی، بالای دره‌ای کوچک نشسته
    است و رنگ‌های پاییزی اینجا چشمگیرند. صومعه فعال است و راهبان در آن ساکن‌اند، سکوت تقریباً کامل است
    و شمار بازدیدکنندگان کم.


    کینتسویسی را اغلب فقط به این دلیل رد می‌کنند که پانزده کیلومتر از بزرگراه فاصله دارد — و دقیقاً به
    همین دلیل معمولاً آن را برای خودتان دارید.
  tip: >-
    در کلیسا همیشه باز نیست؛ اگر قفل بود، در ساختمان راهبان بپرسید. نقاشی‌ها را تنها نور طبیعی ضعیفی روشن
    می‌کند، پس روزی آفتابی و نزدیک ظهر بیایید، و عکاسی با فلاش ممنوع است. کد پوشش برقرار است و روسری‌ها
    کنار در گذاشته شده‌اند. کیلومترهای پایانی از دل جنگل می‌گذرند و پس از باران گِلی می‌شوند. اینجا هیچ
    امکاناتی نیست — آب، خوراک و سوخت را در کارلی بخرید. دو ساعت کاملاً کافی است.
  route: >-
    از تفلیس E60 را به سمت غرب، از کنار گوری تا کارلی بگیرید، حدود 110 کیلومتر بزرگراه پرسرعت. در کارلی
    به شمال بپیچید و 12 تا 15 کیلومتر از میان روستاها ادامه دهید. بیشتر این مسیر آسفالت است، اما دو سه
    کیلومتر پایانی باریک، تند و تا حدی شنی از دل جنگل می‌گذرد. روی‌هم 125 کیلومتر و تقریباً یک ساعت و
    پنجاه دقیقه. در هوای خشک کراس‌اوور راحت است و سدان با احتیاط ممکن؛ پس از باران واقعاً به ارتفاع کف
    نیاز دارید. پیش از انحراف، در گوری یا کارلی باک را پر کنید.
he:
  name: מנזר קינצוויסי
  short: מנזר מן המאה ה-13 בתוך היער, ביתו של מלאך קינצוויסי — ציור הקיר המפורסם ביותר באמנות הגאורגית.
  body: >-
    **קינצוויסי תופסת מקום בתולדות האמנות בזכות ציור קיר אחד,** והציור הזה באמת מצדיק את הסטייה מן הדרך.
    על הקיר הצפוני של כנסיית ניקולאס הקדוש מבשר מלאך על התחייה לנשים נושאות המור. הפנים, רכות הפיגמנט
    וקלות התנועה מתרחקות כל כך מן הסטנדרט של התקופה, עד שמלאך קינצוויסי הפך לסמלה של הציור הגאורגי בימי
    הביניים.


    המנזר נבנה סביב המעבר בין המאה ה-12 למאה ה-13, בימי המלכה תמר, בשיא תור הזהב הגאורגי. שלוש כנסיות
    עומדות במתחם, והראשית שבהן היא כנסיית לבנים בתוכנית צלב-כיפה. בפנים יש גם דיוקנאות של תמר ושל בנה
    גיורגי לאשה, מה שהופך את הבניין למסמך היסטורי ולא רק ליצירת אמנות.


    גם הסביבה חשובה. המנזר יושב ביער נשיר סבוך מצפון לקארלי, מעל עמק קטן, והצבע כאן בסתיו יוצא דופן. זהו
    מנזר פעיל ובו נזירים החיים במקום, השקט כמעט מוחלט ומספר המבקרים נמוך.


    קינצוויסי מדולגת פעמים רבות רק משום שהיא נמצאת חמישה עשר קילומטרים מן הכביש המהיר — וזו בדיוק הסיבה
    שבדרך כלל היא כולה שלכם.
  tip: >-
    דלת הכנסייה אינה תמיד פתוחה; אם מצאתם אותה נעולה, שאלו במבנה המנזר. את ציורי הקיר מאיר רק אור טבעי
    חלש, לכן הגיעו ביום שמשי סביב הצהריים, וצילום עם פלאש אסור. קוד הלבוש חל כאן וכיסויי ראש מונחים ליד
    הדלת. הקילומטרים האחרונים עוברים ביער והופכים לבוציים אחרי גשם. אין כאן שום שירותים — קנו מים, אוכל
    ודלק בקארלי. שעתיים מספיקות בהחלט.
  route: >-
    מטביליסי סעו בכביש E60 מערבה, על יד גורי, עד קארלי — כ-110 ק״מ של כביש מהיר. בקארלי פנו צפונה והמשיכו
    12 עד 15 ק״מ דרך כפרים. רוב הקטע הזה אספלט, אך שניים או שלושה הקילומטרים האחרונים צרים, תלולים וחלקית
    חצץ בתוך יער. בסך הכול 125 ק״מ וכשעה וחמישים דקות. במזג אוויר יבש קרוסאובר נוח וסדאן אפשרית בזהירות;
    אחרי גשם באמת נדרש גובה גחון. מלאו דלק בגורי או בקארלי לפני הפנייה.
ar:
  name: دير كينتسفيسي
  short: دير من القرن الثالث عشر في الغابة، موطن ملاك كينتسفيسي — أشهر رسم جداري في الفن الجورجي.
  body: >-
    **تحتل كينتسفيسي مكانها في تاريخ الفن بفضل رسم جداري واحد،** وهذا الرسم يبرر فعلاً الانحراف عن الطريق.
    فعلى الجدار الشمالي لكنيسة القديس نيقولا يبشّر ملاك النساء حاملات الطيب بالقيامة. والوجه ونعومة الصباغ
    وخفة الحركة تبتعد عن معيار العصر إلى حد جعل ملاك كينتسفيسي شعاراً للتصوير الجورجي في العصور الوسطى.


    بُني الدير عند مطلع القرن الثالث عشر ونهاية الثاني عشر، في عهد الملكة تامار، في ذروة العصر الذهبي
    الجورجي. وتقوم في المجمع ثلاث كنائس، أكبرها كنيسة آجرية بمخطط الصليب والقبة. وفي الداخل أيضاً صور
    لتامار ولابنها غيورغي لاشا، ما يجعل المبنى وثيقة تاريخية لا عملاً فنياً فحسب.


    والموقع نفسه مهم كذلك. فالدير يجلس في غابة كثيفة من الأشجار المتساقطة الأوراق شمال كاريلي، فوق واد
    صغير، وألوان الخريف هنا لافتة. وهو دير عامل يقيم فيه رهبان، والسكون يكاد يكون تاماً وأعداد الزوار
    قليلة.


    وكثيراً ما تُتجاوز كينتسفيسي لمجرد أنها تبعد خمسة عشر كيلومتراً عن الطريق السريع — وهذا بالضبط سبب
    أنك تجدها عادة لنفسك وحدك.
  tip: >-
    باب الكنيسة ليس مفتوحاً دائماً؛ فإن وجدته مغلقاً فاسأل في مبنى الرهبان. ولا يضيء الرسوم سوى ضوء طبيعي
    ضعيف، فتعال في يوم مشمس قرب الظهيرة، والتصوير بالفلاش ممنوع. وتسري قواعد اللباس هنا وأغطية الرأس متروكة
    عند الباب. والكيلومترات الأخيرة تمر في الغابة وتصير موحلة بعد المطر. ولا مرافق هنا البتة — اشترِ الماء
    والطعام والوقود في كاريلي. وساعتان تكفيان بيسر.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً بمحاذاة غوري حتى كاريلي، نحو 110 كم من الطريق السريع. وفي كاريلي انعطف
    شمالاً وتابع 12 إلى 15 كم عبر القرى. ومعظم ذلك إسفلت، لكن الكيلومترين أو الثلاثة الأخيرة ضيقة وحادة
    الانحدار وحصوية جزئياً داخل الغابة. وإجمالاً 125 كم ونحو ساعة وخمسين دقيقة. وفي الطقس الجاف تكون سيارة
    كروس أوفر مريحة وسيدان ممكنة بحذر؛ أما بعد المطر فتحتاج فعلاً إلى خلوص أرضي. املأ الخزان في غوري أو
    كاريلي قبل الانعطاف.
