ka:
  name: რუსთაველის თეატრი
  short: >-
    როკოკოს ფასადიანი უდიდესი ქართული თეატრი რუსთაველის გამზირზე — ახმეტელისა და სტურუას სცენა, სარდაფში
    გუდიაშვილისა და კაკაბაძის „ქიმერიონით“.
  body: >-
    **საქართველოს უდიდესი თეატრი მხატვართა სახლად დაიბადა, მისი ყველაზე ცნობილი ოთახი კი მიწის ქვეშაა.**
    1898 წელს ტფილისის საარტისტო საზოგადოებამ გოლოვინის პროსპექტზე — დღევანდელ რუსთაველის გამზირზე — თავისი
    სახლის საძირკველი ჩაყარა. 1901 წლის 6 თებერვალს ახალი შენობა აკურთხეს, 5 მარტს კი სცენაზე ავქსენტი
    ცაგარელის „ხანუმა“ წარმოადგინეს. მშენებლობა ნავთობმრეწველმა ალექსანდრე მანთაშევმა დააფინანსა, არქიტექტორებმა
    კორნელი ტატიშჩევმა და ალექსანდრე შიმკევიჩმა კი შენობას როკოკოს სამოსი მოარგეს, რომელიც გამზირის მკაცრ
    მეზობლებს შორის დღესაც საქორწილო ტორტივით გამოიყურება.


    ქვემოთ, სარდაფში, „ქიმერიონია“ — დარბაზი, რომლის კედლები და ჭერი ლადო გუდიაშვილმა, დავით კაკაბაძემ
    და „რუსული სეზონების“ მხატვარმა სერგეი სუდეიკინმა მოხატეს; მოგვიანებით მათ მოსე და ირაკლი თოიძეებიც
    შეუერთდნენ. საბჭოთა წლებში მოხატულობა შეათეთრეს და დღემდე მხოლოდ ნაწილია აღდგენილი.


    შოთა რუსთაველის სახელი თეატრს 1921 წლის 25 ნოემბერს ეწოდა და მომდევნო საუკუნე ქართული რეჟისურის მატიანესავით
    იკითხება. კოტე მარჯანიშვილმა აქ „ცხვრის წყარო“ (1922) და „ჰამლეტი“ (1925) დადგა; სანდრო ახმეტელმა
    დასს მოსკოვში აღიარება მოუტანა და 1930-იანი წლების რეპრესიებს შეეწირა; რობერტ სტურუას „კავკასიურმა
    ცარცის წრემ“ (1975) და „რიჩარდ III-მ“ (1979) რუსთაველის თეატრის სახელი ედინბურგამდე, ავინიონამდე და
    ადელაიდამდე მიიტანა.


    დღეს თეატრს სამი სცენა აქვს: დიდი, დაახლოებით 800 ადგილით, მცირე — 283 ადგილით და „შავი ყუთი“ — 182
    ადგილით. უცხოელი სტუმარიც თამამად წამოიყვანეთ: ეს სცენა ყოველთვის სიტყვაზე არანაკლებ სახეებით მეტყველებდა.
    თუ სპექტაკლის დღეები არ დაგემთხვათ, თეატრის მუზეუმი ექსკურსიებს აწყობს — მთელ შენობაში, „ქიმერიონის“
    ჩათვლით.
  tip: >-
    აფიშა და ბილეთები rustavelitheatre.ge-სა და tkt.ge-ზეა; პოპულარული სპექტაკლები სწრაფად იყიდება, ამიტომ
    რამდენიმე დღით ადრე დაჯავშნეთ. უცხოელი სტუმრებისთვის სალაროში იკითხეთ, რომელ სპექტაკლს აქვს სუბტიტრები.
    დაწყებამდე 20 წუთით ადრე მიდით: დაგვიანებულს შეიძლება ანტრაქტამდე მოუწიოს ლოდინი. ჩაცმულობა — მოწესრიგებული,
    ოფიციალურობის გარეშე. თეატრის მუზეუმი შენობასა და „ქიმერიონში“ ექსკურსიებს ატარებს; ჩასაწერად დარეკეთ
    ნომერზე +995 322 98 40 51.
  route: >-
    თეატრი რუსთაველის გამზირის 17 ნომერშია, თავისუფლების მოედნიდან დაახლოებით 1 კილომეტრში — მანქანით
    ხუთი წუთი, მაგრამ აქ მანქანა პრობლემაა და არა გამოსავალი: გამზირზე გაჩერება არ შეიძლება. ფასიანი მუნიციპალური
    ადგილები უკანა ქუჩებში მოძებნეთ და წრეების დასარტყმელად დრო გაითვალისწინეთ, ან მანქანა სასტუმროსთან
    დატოვეთ. მეტროთი ყველაფერი მარტივია: თავისუფლების მოედნისა და რუსთაველის სადგურებიდან თეატრამდე ათიოდე
    წუთის სავალია. საღამოს სპექტაკლის შემდეგ ტაქსი გამზირზე სწრაფად და იაფად იშოვება. თუ მაინც მანქანით
    მოდიხართ, ეკონომკლასის პატარა მანქანის გაჩერება ყველაზე ადვილია.
en:
  name: Rustaveli Theatre
  short: >-
    Georgia's largest theatre, a Rococo wedding cake on Rustaveli Avenue — stage of Akhmeteli and Sturua,
    with a basement painted by Gudiashvili and Kakabadze.
  body: >-
    **Georgia's biggest theatre was born as a house for artists, and its most famous room is underground.**
    In 1898 the Tiflis Artistic Society laid the foundations of its new home on Golovin Prospect — today's
    Rustaveli Avenue. On 6 February 1901 the building was blessed, and on 5 March the stage opened with
    Avksenti Tsagareli's comedy Khanuma. The oil magnate Alexander Mantashev paid for the construction,
    and the architects Korneli Tatishchev and Aleksander Szymkiewicz dressed it in a Rococo façade that
    still looks like a wedding cake among the avenue's sterner neighbours.


    Downstairs lies Kimerioni, a basement whose walls and ceilings were painted by Lado Gudiashvili, David
    Kakabadze and Sergei Sudeikin, the Ballets Russes designer, later joined by Mose and Irakli Toidze.
    Soviet whitewash covered the paintings, and only part has been brought back.


    The theatre took the name of the poet Shota Rustaveli on 25 November 1921, and the century that followed
    reads like a chronicle of Georgian directing. Kote Marjanishvili staged Fuenteovejuna (1922) and Hamlet
    (1925) here; Sandro Akhmeteli made the company famous in Moscow and perished in the purges of the
    1930s; Robert Sturua's The Caucasian Chalk Circle (1975) and Richard III (1979) carried the Rustaveli
    name to Edinburgh, Avignon and Adelaide.


    Today there are three stages: the main house with about 800 seats, a small stage with 283 and a black
    box with 182. Go even if you have no Georgian — this stage has always spoken in images as much as
    in words. And if the dates don't match, the theatre museum runs guided tours through the building,
    down to Kimerioni itself.
  tip: >-
    Programmes and tickets are on rustavelitheatre.ge and tkt.ge; popular productions sell out, so book
    a few days ahead. Most performances are in Georgian — ask the box office which ones carry surtitles.
    Arrive 20 minutes early: latecomers may have to wait for the interval. Dress is smart-casual. The
    theatre museum runs guided tours of the building and the Kimerioni frescoes; call +995 322 98 40 51
    to arrange one.
  route: >-
    The theatre stands at 17 Rustaveli Avenue, about 1 km from Freedom Square — five minutes by car, but
    here the car is the problem, not the solution: there is no stopping on the avenue. Look for paid municipal
    bays in the side streets behind it and allow time to circle, or leave the car at your hotel. By metro
    it is easy: Liberty Square and Rustaveli stations are each about ten minutes' walk away. After an
    evening show, taxis are quick and cheap to find on the avenue. If you do drive in, a small economy
    car is by far the easiest to park.
ru:
  name: Театр имени Руставели
  short: >-
    Крупнейший театр Грузии, рококо-«свадебный торт» на проспекте Руставели: сцена Ахметели и Стуруа и
    подвал, расписанный Гудиашвили и Какабадзе.
  body: >-
    **Самый большой театр Грузии родился как дом для художников, а самый знаменитый его зал находится
    под землёй.** В 1898 году Тифлисское артистическое общество заложило фундамент своего нового дома
    на Головинском проспекте — нынешнем проспекте Руставели. 6 февраля 1901 года здание освятили, а 5
    марта сцена открылась комедией Авксентия Цагарели «Ханума». Строительство оплатил нефтепромышленник
    Александр Манташев, а архитекторы Корнелий Татищев и Александр Шимкевич дали зданию фасад в стиле
    рококо, который и сегодня похож на свадебный торт среди более строгих соседей по проспекту.


    Внизу скрывается «Химерион» — подвал, стены и своды которого расписали Ладо Гудиашвили, Давид Какабадзе
    и Сергей Судейкин, художник «Русских сезонов», а позднее к ним присоединились Мосе и Ираклий Тоидзе.
    Советская побелка скрыла росписи, и вернуть удалось лишь часть.


    Имя поэта Шота Руставели театр получил 25 ноября 1921 года, и следующее столетие читается как хроника
    грузинской режиссуры. Котэ Марджанишвили поставил здесь «Овечий источник» (1922) и «Гамлета» (1925);
    Сандро Ахметели прославил труппу в Москве и погиб в репрессиях 1930-х; «Кавказский меловой круг» (1975)
    и «Ричард III» (1979) Роберта Стуруа пронесли имя Руставели по Эдинбургу, Авиньону и Аделаиде.


    Сегодня у театра три сцены: основная примерно на 800 мест, малая на 283 и «чёрный зал» на 182. Идите,
    даже если не знаете грузинского: эта сцена всегда говорила образами не меньше, чем словами. А если
    даты не совпали, театральный музей водит экскурсии по зданию — вплоть до самого «Химериона».
  tip: >-
    Афиша и билеты — на rustavelitheatre.ge и tkt.ge; популярные спектакли раскупают, так что бронируйте
    за несколько дней. Большинство постановок идут на грузинском — спросите в кассе, на каких есть субтитры.
    Приходите за 20 минут: опоздавшим, возможно, придётся ждать антракта. Одежда — опрятная, но без официоза.
    Театральный музей проводит экскурсии по зданию и к росписям «Химериона»; записаться можно по телефону
    +995 322 98 40 51.
  route: >-
    Театр стоит на проспекте Руставели, 17, примерно в 1 км от площади Свободы — пять минут на машине,
    но здесь машина не решение, а проблема: останавливаться на проспекте нельзя. Ищите платные муниципальные
    места на боковых улицах за театром и закладывайте время на круги по кварталу — или оставьте машину
    у отеля. На метро всё просто: от станций «Площадь Свободы» и «Руставели» примерно по десять минут
    пешком. После вечернего спектакля такси на проспекте ловится быстро и недорого. Если всё-таки едете
    сами, проще всего припарковать маленькую машину эконом-класса.
fa:
  name: تئاتر روستاولی
  short: >-
    بزرگ‌ترین تئاتر گرجستان، کیک عروسیِ روکوکویی در خیابان روستاولی؛ صحنهٔ آخمتلی و ستوروآ، با زیرزمینی
    که گودیاشویلی و کاکابادزه نقاشی‌اش کردند.
  body: >-
    **بزرگ‌ترین تئاتر گرجستان به‌عنوان خانه‌ای برای هنرمندان زاده شد و مشهورترین تالارش زیر زمین است.**
    در سال ۱۸۹۸ انجمن هنری تفلیس شالودهٔ خانهٔ تازه‌اش را در پروسپکت گولووین، خیابان روستاولیِ امروز،
    ریخت. در ۶ فوریهٔ ۱۹۰۱ ساختمان تبرک شد و در ۵ مارس صحنه با کمدی «خانوما» اثر آوکسنتی تساگارلی گشوده
    شد. هزینهٔ ساخت را الکساندر مانتاشف، سرمایه‌دار نفتی، پرداخت و معماران، کورنلی تاتیشچف و آلکساندر
    شیمکویچ، نمایی روکوکو بر آن پوشاندند که هنوز در میان همسایه‌های جدی‌ترِ خیابان به کیک عروسی می‌ماند.


    در طبقهٔ پایین «کیمریونی» است، زیرزمینی که دیوارها و سقف‌هایش را لادو گودیاشویلی، داوید کاکابادزه
    و سرگئی سودیکین، طراح «باله‌های روسی»، نقاشی کردند و بعدها موسه و ایراکلی تویدزه نیز به آنان پیوستند.
    دوغاب آهکِ دوران شوروی نقاشی‌ها را پوشاند و تنها بخشی از آن‌ها بازگردانده شده است.


    تئاتر در ۲۵ نوامبر ۱۹۲۱ نام شوتا روستاولی، شاعر، را گرفت و سدهٔ پس از آن به وقایع‌نامهٔ کارگردانی
    گرجی می‌ماند. کوته مارجانیشویلی «فوئنته اوبخونا» (۱۹۲۲) و «هملت» (۱۹۲۵) را اینجا به صحنه برد؛ ساندرو
    آخمتلی گروه را در مسکو پرآوازه کرد و در تصفیه‌های دههٔ ۱۹۳۰ جان باخت؛ «دایرهٔ گچی قفقازی» (۱۹۷۵) و
    «ریچارد سوم» (۱۹۷۹) به کارگردانی روبرت ستوروآ نام روستاولی را به ادینبرو، آوینیون و آدلاید بردند.


    امروز سه صحنه دارد: تالار اصلی با حدود ۸۰۰ صندلی، صحنهٔ کوچک با ۲۸۳ و یک بلک‌باکس با ۱۸۲ صندلی. حتی
    اگر گرجی نمی‌دانید بروید؛ این صحنه همیشه به همان اندازه که با واژه‌ها، با تصویرها هم سخن گفته است.
    و اگر تاریخ‌ها جور نشد، موزهٔ تئاتر تورهای راهنمادار در ساختمان برگزار می‌کند، تا خودِ کیمریونی.
  tip: >-
    برنامه و بلیت در rustavelitheatre.ge و tkt.ge است؛ اجراهای پرطرفدار زود تمام می‌شوند، پس چند روز زودتر
    رزرو کنید. بیشتر اجراها به زبان گرجی‌اند؛ از گیشه بپرسید کدام‌ها زیرنویس دارند. ۲۰ دقیقه زودتر برسید:
    دیررسیدگان شاید مجبور شوند تا آنتراکت منتظر بمانند. پوشش نیمه‌رسمی مناسب است. موزهٔ تئاتر تورهای راهنمادار
    در ساختمان و نقاشی‌های کیمریونی برگزار می‌کند؛ برای هماهنگی با ‎+۹۹۵ ۳۲۲ ۹۸ ۴۰ ۵۱‎ تماس بگیرید.
  route: >-
    تئاتر در شمارهٔ ۱۷ خیابان روستاولی است، حدود ۱ کیلومتر از میدان آزادی؛ پنج دقیقه با ماشین، اما اینجا
    ماشین مشکل است نه راه‌حل: توقف در این خیابان ممنوع است. در خیابان‌های فرعی پشت آن دنبال جای پارک پولی
    شهرداری بگردید و برای چرخیدن وقت بگذارید، یا ماشین را در هتل بگذارید. با مترو کار ساده است: ایستگاه‌های
    «میدان آزادی» و «روستاولی» هر کدام حدود ده دقیقه پیاده فاصله دارند. پس از اجرای شبانه، تاکسی در همین
    خیابان زود و ارزان پیدا می‌شود. اگر هم با ماشین آمدید، پارک کردن یک خودروی کوچک کلاس اکونومی از همه
    آسان‌تر است.
he:
  name: תיאטרון רוסתאוולי
  short: >-
    התיאטרון הגדול בגאורגיה, עוגת חתונה בסגנון רוקוקו בשדרות רוסתאוולי — במתם של אחמטלי וסטורואה, ומרתף
    שציירו גודיאשווילי וקקבדזה.
  body: >-
    **התיאטרון הגדול ביותר בגאורגיה נולד כבית לאמנים, והחדר המפורסם ביותר שלו נמצא מתחת לאדמה.** ב-1898
    הניחה האגודה האמנותית של טיפליס את היסודות לביתה החדש בפרוספקט גולובין — שדרות רוסתאוולי של היום.
    ב-6 בפברואר 1901 נערך טקס ברכה לבניין, וב-5 במרץ נפתחה הבמה בקומדיה "חנומה" של אבקסנטי צגרלי. איל
    הנפט אלכסנדר מנטשב מימן את הבנייה, והאדריכלים קורנלי טטישצ'ב ואלכסנדר שימקביץ' הלבישו את הבניין בחזית
    רוקוקו שנראית עד היום כמו עוגת חתונה בין שכניה המאופקים יותר בשדרה.


    למטה נמצא קימריוני, מרתף שאת קירותיו ותקרותיו ציירו לאדו גודיאשווילי, דוד קקבדזה וסרגיי סודייקין,
    מעצב "הבלט הרוסי", ואליהם הצטרפו מאוחר יותר מוסה ואירקלי טואידזה. הסיד הסובייטי כיסה את הציורים, ורק
    חלק מהם הוחזר לאור.


    התיאטרון קיבל את שמו של המשורר שותא רוסתאוולי ב-25 בנובמבר 1921, והמאה שבאה אחר כך נקראת כמו כרוניקה
    של הבימוי הגאורגי. קוטה מרג'נישווילי העלה כאן את "פואנטה אובחונה" (1922) ואת "המלט" (1925); סנדרו
    אחמטלי הביא ללהקה תהילה במוסקבה ונספה בטיהורים של שנות ה-30; "מעגל הגיר הקווקזי" (1975) ו"ריצ'רד השלישי"
    (1979) של רוברט סטורואה נשאו את שם רוסתאוולי לאדינבורו, לאביניון ולאדלייד.


    היום יש בו שלוש במות: האולם הראשי עם כ-800 מושבים, במה קטנה עם 283 וקופסה שחורה עם 182. לכו גם אם
    אינכם יודעים גאורגית — הבמה הזאת תמיד דיברה בתמונות לא פחות מאשר במילים. ואם התאריכים לא מסתדרים,
    מוזיאון התיאטרון עורך סיורים מודרכים בבניין, עד לקימריוני עצמו.
  tip: >-
    תוכניות וכרטיסים באתרים rustavelitheatre.ge ו-tkt.ge; הצגות פופולריות נמכרות עד תום, לכן הזמינו כמה
    ימים מראש. רוב ההצגות בגאורגית — שאלו בקופה באילו יש כתוביות. הגיעו 20 דקות מוקדם: ייתכן שמאחרים ייאלצו
    להמתין עד ההפסקה. הלבוש: מסודר אך לא רשמי. מוזיאון התיאטרון עורך סיורים מודרכים בבניין ובציורי הקיר
    של קימריוני; לתיאום התקשרו ל-‎+995 322 98 40 51‎.
  route: >-
    התיאטרון נמצא בשדרות רוסתאוולי 17, כ-1 ק"מ מכיכר החירות — חמש דקות נסיעה, אבל כאן הרכב הוא הבעיה ולא
    הפתרון: אסור לעצור בשדרה. חפשו מקומות חניה עירוניים בתשלום ברחובות הצדדיים שמאחוריו והקצו זמן לסיבובים,
    או השאירו את הרכב במלון. ברכבת התחתית זה פשוט: מהתחנות "כיכר החירות" ו"רוסתאוולי" יש כעשר דקות הליכה
    מכל אחת. אחרי הצגת ערב קל למצוא מוניות בשדרה, מהר ובזול. אם בכל זאת נוסעים, הכי קל להחנות רכב קטן
    מקטגוריית אקונומי.
ar:
  name: مسرح روستافيلي
  short: >-
    أكبر مسارح جورجيا، كعكة عرس على طراز الروكوكو في جادة روستافيلي: خشبة أخميتيلي وستوروا، وقبو رسمه
    غودياشفيلي وكاكابادزه.
  body: >-
    **وُلد أكبر مسارح جورجيا بيتاً للفنانين، وأشهر قاعاته تحت الأرض.** في عام 1898 وضعت الجمعية الفنية
    في تفليس أساس مقرّها الجديد في جادة غولوفين، جادة روستافيلي اليوم. وفي 6 فبراير 1901 بورك المبنى،
    وفي 5 مارس افتُتحت الخشبة بكوميديا «خانوما» لأفكسينتي تساغاريلي. موّل البناءَ قطب النفط ألكسندر مانتاشيف،
    وألبسه المعماريان كورنيلي تاتيشتشيف وألكسندر شيمكيفيتش واجهة على طراز الروكوكو ما زالت تبدو ككعكة
    عرس بين جيرانها الأكثر صرامة في الجادة.


    وفي الأسفل يقع «كيميريوني»، قبو رسم جدرانه وسقوفه لادو غودياشفيلي وداويت كاكابادزه وسيرغي سوديكين،
    مصمّم «الباليه الروسي»، ثم انضم إليهم لاحقاً موسى وإيراكلي تويدزه. غطّى الطلاء الجيري السوفييتي الرسوم،
    ولم يُستعد منها إلا جزء.


    حمل المسرح اسم الشاعر شوتا روستافيلي في 25 نوفمبر 1921، ويُقرأ القرن الذي تلاه كسجلّ للإخراج الجورجي.
    فقد قدّم كوتي مارجانيشفيلي هنا «فوينتي أوبيخونا» (1922) و«هاملت» (1925)؛ وأكسب ساندرو أخميتيلي الفرقة
    شهرتها في موسكو، ثم لقي حتفه في حملات التطهير في ثلاثينيات القرن العشرين؛ وحملت «دائرة الطباشير القوقازية»
    (1975) و«ريتشارد الثالث» (1979) لروبرت ستوروا اسم روستافيلي إلى إدنبرة وأفينيون وأديلايد.


    له اليوم ثلاث خشبات: القاعة الرئيسية بنحو 800 مقعد، وخشبة صغيرة بـ283 مقعداً، وقاعة «الصندوق الأسود»
    بـ182 مقعداً. اذهب حتى لو كنت لا تعرف الجورجية، فهذه الخشبة تكلّمت دائماً بالصور بقدر ما تكلّمت بالكلمات.
    وإن لم تناسبك المواعيد، فمتحف المسرح ينظّم جولات مصحوبة بمرشد في أرجاء المبنى، نزولاً إلى كيميريوني
    نفسه.
  tip: >-
    البرامج والتذاكر على rustavelitheatre.ge وtkt.ge؛ وتنفد تذاكر العروض الرائجة، فاحجز قبل أيام. معظم
    العروض بالجورجية، فاسأل شبّاك التذاكر عن العروض المصحوبة بترجمة مكتوبة. احضر قبل الموعد بـ20 دقيقة:
    فقد يضطر المتأخرون إلى انتظار الاستراحة. اللباس أنيق غير رسمي. ينظّم متحف المسرح جولات مع مرشد في
    المبنى وإلى رسوم كيميريوني؛ اتصل على ‎+995 322 98 40 51‎ للترتيب.
  route: >-
    يقع المسرح في الرقم 17 بجادة روستافيلي، على بُعد نحو 1 كم من ساحة الحرية: خمس دقائق بالسيارة، لكن
    السيارة هنا هي المشكلة لا الحل، إذ يُمنع التوقّف على الجادة. ابحث عن أماكن الوقوف البلدية المدفوعة
    في الشوارع الجانبية خلفه وخصِّص وقتاً للدوران، أو اترك السيارة في الفندق. أما بالمترو فالأمر سهل:
    من محطتي «ساحة الحرية» و«روستافيلي» نحو عشر دقائق سيراً من كلٍّ منهما. وبعد العرض المسائي تجد سيارات
    الأجرة في الجادة بسرعة وبثمن زهيد. وإن قُدتَ إليه فالسيارة الاقتصادية الصغيرة أسهل ما يكون ركنه.
