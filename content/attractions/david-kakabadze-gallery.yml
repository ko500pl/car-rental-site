ka:
  name: დავით კაკაბაძის სახელობის ქუთაისის სახვითი ხელოვნების გალერეა
  short: >-
    ქუთაისის სახვითი ხელოვნების გალერეა ყოფილ სასტუმრო „დე ფრანსში“: დაახლოებით 3000 ქართული ნახატი და
    კაკაბაძის სიბრტყეებად დაშლილი იმერეთი.
  body: >-
    **1923 წელს პარიზში დავით კაკაბაძემ კინოკამერა ააგო, რომელიც ეკრანზე სიღრმის ილუზიას ქმნიდა; რამდენიმე
    წლის შემდეგ კი საქართველოში დაბრუნებული კვლავ ჭრელ, ნაჭრებით შეკერილ საბანივით ხატავდა იმერეთის მინდვრებს.**


    კაკაბაძე (1889–1952) ხონთან ახლოს, ღარიბ გლეხურ ოჯახში დაიბადა და პეტერბურგის უნივერსიტეტში საბუნებისმეტყველო
    მეცნიერებები შეისწავლა. 1919–1927 წლებში პარიზში ცხოვრობდა, დამოუკიდებელ მხატვართა საზოგადოების გამოფენებში
    მონაწილეობდა და საღებავის ნაცვლად ლითონს, სარკის მინასა და ფერად შუშას იყენებდა. საქართველოში დაბრუნებულმა
    ქუთაისში კოტე მარჯანიშვილის თეატრის სპექტაკლები გააფორმა და თბილისის სამხატვრო აკადემიაში ასწავლიდა,
    სანამ 1948 წელს საბჭოთა ხელისუფლებამ, „ფორმალიზმზე“ უარი რომ არ თქვა, აკადემიიდან არ დაითხოვა.


    ქუთაისის სახვითი ხელოვნების გალერეა 1974 წელს დაარსდა და მის სახელს ატარებს. ის რუსთაველის გამზირზე,
    ოპერის თეატრის გვერდით, ყოფილი სასტუმრო „დე ფრანსის“ შენობაშია. აქ ქართველ მხატვართა დაახლოებით 3000
    ნახატი ინახება, მათ შორის ნიკო ფიროსმანის ნამუშევრები. მოძებნეთ თავად კაკაბაძის იმერული პეიზაჟები:
    სიბრტყეებად დაშლილი ბორცვები და ნაკვეთები — გეომეტრია, რომელიც იმერეთში პარიზამდე აღმოაჩინა და პარიზის
    შემდეგაც მას დაუბრუნდა.


    მერე უკანა ეზოში გადით. იქ საბჭოთა ხანის დაზიანებული ქანდაკებები დგას, სტუმრებივით, რომლებიც შინ არავინ
    გაისტუმრა. ესეც თავისებური გამოფენაა, რომელიც არც ერთ კურატორს არ დაუგეგმავს: რაც ერთმა ეპოქამ აღმართა,
    მეორემ წვიმაში დატოვა.
  tip: >-
    დათვალიერებას დაახლოებით ერთი საათი დაუთმეთ. სამუშაო საათები და ბილეთის ფასი ჩვენი შემოწმებისას სანდოდ
    გამოქვეყნებული არ იყო, ამიტომ წასვლამდე ადგილზე დააზუსტეთ. გალერეა ქუთაისის ცენტრშია — ისტორიული მუზეუმიდან
    დაახლოებით 300 მეტრში, ფალიაშვილის სახლ-მუზეუმიდან 600 მეტრში, ბაგრატის ტაძრამდე კი დაახლოებით 1,4
    კილომეტრია, ასე რომ, ფეხით სასეირნო დილას იოლად ერგება: მანქანა ერთხელ დააყენეთ და ფეხით იარეთ. იკითხეთ,
    ხომ არ მიმდინარეობს დროებითი გამოფენა, და უკანა ეზოს ქანდაკებები არ გამოგრჩეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთით გაუყევით — გორისა და ხაშურის გავლით, რიკოთის გვირაბებით,
    ზესტაფონის გვერდის ავლით; ბენზინგასამართი სადგურები მთელ გზაზეა. ქუთაისის გადასახვევზე მაგისტრალიდან
    გადაუხვიეთ და ცენტრის მიმართულების ნიშნებს მიჰყევით. გალერეა რუსთაველის გამზირის 8 ნომერში, ოპერისა
    და ბალეტის თეატრის გვერდითაა. მთელი გზა დაახლოებით 230 კილომეტრია და გაჩერებების გარეშე დაახლოებით
    3 საათი და 20 წუთი სჭირდება; ბოლომდე ასფალტია, ამიტომ ეკონომ კლასის მანქანაც საკმარისია. მანქანა თეატრის
    მიმდებარე ქუჩებში დააყენეთ და ცენტრი ფეხით დაათვალიერეთ.
en:
  name: David Kakabadze Art Gallery
  short: >-
    Kutaisi's fine-art gallery in the former Hotel de France: some 3,000 Georgian paintings and David
    Kakabadze's Imereti broken into Cubist planes.
  body: >-
    **In Paris in 1923 David Kakabadze built a film camera that gave the screen an illusion of depth;
    a few years later he was back in Georgia, painting Imereti's fields as a patchwork quilt once again.**


    Kakabadze (1889–1952) was born into a poor peasant family near Khoni and studied natural sciences
    in St Petersburg. From 1919 to 1927 he lived in Paris, showed with the Société des Artistes Indépendants
    and tried metal, mirror glass and stained glass in place of paint. Back in Georgia he designed sets
    for Kote Marjanishvili's theatre in Kutaisi and taught at the Tbilisi Academy of Arts, until in 1948
    the Soviet authorities dismissed him for refusing to renounce "formalism".


    Kutaisi's fine-art gallery, founded in 1974, bears his name. It occupies the former Hotel de France
    on Rustaveli Avenue, beside the Opera Theatre, and holds about 3,000 paintings by Georgian artists,
    among them works by Niko Pirosmani. Seek out Kakabadze's own Imeretian landscapes: hills and plots
    of land split into planes, a geometry he found in Imereti before Paris and came back to after it.


    Then go out to the courtyard at the back, where damaged Soviet-era sculptures stand about like guests
    nobody ever sent home. It is an exhibition of its own that no curator planned: what one era raised,
    the next left out in the rain.
  tip: >-
    Allow about an hour. Opening hours and ticket prices were not reliably published when we checked,
    so confirm them locally before you set off. The gallery sits in the centre of Kutaisi, some 300 metres
    from the Kutaisi Historical Museum and 600 metres from the Paliashvili House Museum, with Bagrati
    Cathedral about 1.4 km away, so it fits neatly into a morning on foot: park once and walk. Ask whether
    a temporary exhibition is on, and do not leave without seeing the sculptures in the back courtyard.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori and Khashuri, through the Rikoti tunnels and on past
    Zestaponi; there are fuel stations all along the highway. Leave it at the Kutaisi turn-off and follow
    signs for the centre. The gallery is at 8 Rustaveli Avenue, next to the Opera and Ballet Theatre.
    The whole journey is about 230 km and around 3 hours 20 minutes without stops, on asphalt all the
    way, so an economy car does the job. Look for a parking space in the streets around the theatre and
    explore the centre on foot.
ru:
  name: Художественная галерея имени Давида Какабадзе
  short: >-
    Кутаисская картинная галерея в бывшем отеле «Де Франс»: около 3000 грузинских полотен и Имерети Давида
    Какабадзе, разложенная на кубистские плоскости.
  body: >-
    **В 1923 году в Париже Давид Какабадзе сконструировал киноаппарат, создававший на экране иллюзию глубины,
    а несколько лет спустя, вернувшись в Грузию, снова писал поля Имерети, похожие на лоскутное одеяло.**


    Какабадзе (1889–1952) родился в бедной крестьянской семье близ Хони и изучал естественные науки в
    Санкт-Петербурге. С 1919 по 1927 год он жил в Париже, выставлялся в Обществе независимых художников
    и пробовал металл, зеркальное стекло и витраж вместо краски. Вернувшись в Грузию, он оформлял спектакли
    театра Котэ Марджанишвили в Кутаиси и преподавал в Тбилисской академии художеств, пока в 1948 году
    советские власти не уволили его за отказ отречься от «формализма».


    Кутаисская картинная галерея, основанная в 1974 году, носит его имя. Она занимает здание бывшего отеля
    «Де Франс» на проспекте Руставели, рядом с оперным театром, и хранит около 3000 полотен грузинских
    художников, среди них работы Нико Пиросмани. Разыщите имеретинские пейзажи самого Какабадзе: холмы
    и наделы, расколотые на плоскости, — геометрия, которую он нашёл в Имерети ещё до Парижа и к которой
    вернулся после.


    Потом выйдите во внутренний двор за зданием: там стоят повреждённые скульптуры советской эпохи — как
    гости, которых так никто и не отправил домой. Это отдельная выставка, которую не задумывал ни один
    куратор: то, что воздвигла одна эпоха, следующая оставила под дождём.
  tip: >-
    Закладывайте около часа. Часы работы и цены билетов на момент нашей проверки надёжно опубликованы
    не были, поэтому уточните их на месте, прежде чем ехать. Галерея находится в центре Кутаиси, примерно
    в 300 метрах от Кутаисского исторического музея и в 600 метрах от Дома-музея Палиашвили, а до собора
    Баграти около 1,4 км, так что всё это удобно складывается в утреннюю пешую прогулку: припаркуйтесь
    один раз и ходите пешком. Спросите, не идёт ли временная выставка, и не уходите, не увидев скульптуры
    во внутреннем дворе.
  route: >-
    Из Тбилиси двигайтесь по S1 (E60) на запад мимо Гори и Хашури, через Рикотские тоннели и дальше мимо
    Зестафони; заправки есть по всей трассе. Сверните на съезд к Кутаиси и следуйте указателям на центр.
    Галерея находится по адресу: проспект Руставели, 8, рядом с Театром оперы и балета. Весь путь — около
    230 км и примерно 3 ч 20 мин без остановок, по асфальту на всём протяжении, так что справится и машина
    эконом-класса. Ищите место для парковки на улицах вокруг театра, а центр осматривайте пешком.
fa:
  name: نگارخانهٔ هنری داوید کاکابادزه
  short: >-
    نگارخانهٔ هنرهای زیبای کوتایسی در هتل دو فرانس سابق: حدود ۳۰۰۰ نقاشی گرجی و ایمرتیِ داوید کاکابادزه
    که به صفحه‌های کوبیستی شکسته شده است.
  body: >-
    **داوید کاکابادزه در ۱۹۲۳ در پاریس دوربین فیلم‌برداری‌ای ساخت که بر پرده توهم عمق می‌آفرید؛ چند سال
    بعد، پس از بازگشت به گرجستان، دوباره کشتزارهای ایمرتی را همچون لحافی چهل‌تکه نقاشی می‌کرد.**


    کاکابادزه (۱۸۸۹–۱۹۵۲) در خانواده‌ای روستایی و تهیدست در نزدیکی خونی زاده شد و در سن پترزبورگ علوم
    طبیعی خواند. از ۱۹۱۹ تا ۱۹۲۷ در پاریس زیست، در نمایشگاه‌های انجمن هنرمندان مستقل شرکت کرد و فلز، شیشهٔ
    آینه‌ای و شیشهٔ رنگی (ویترای) را به جای رنگ آزمود. پس از بازگشت به گرجستان، صحنه‌آرایی تئاتر کوته
    مارجانیشویلی در کوتایسی را بر عهده گرفت و در آکادمی هنرهای تفلیس درس داد، تا آنکه در ۱۹۴۸ مقامات شوروی
    او را به سبب سر باز زدن از انکار «فرمالیسم» برکنار کردند.


    نگارخانهٔ هنرهای زیبای کوتایسی، که در ۱۹۷۴ بنیاد نهاده شد، نام او را بر خود دارد. این نگارخانه در
    هتل دو فرانس سابق در خیابان روستاولی، کنار تئاتر اپرا، جای دارد و حدود ۳۰۰۰ نقاشی از هنرمندان گرجی
    را نگه می‌دارد، از جمله آثاری از نیکو پیروسمانی. منظره‌های ایمرتیِ خود کاکابادزه را بجویید: تپه‌ها
    و قطعه‌زمین‌هایی که به صفحه‌ها شکسته شده‌اند — هندسه‌ای که پیش از پاریس در ایمرتی یافته بود و پس از
    پاریس هم به آن بازگشت.


    سپس به حیاط پشتی بروید، جایی که پیکره‌های آسیب‌دیدهٔ دوران شوروی همچون مهمانانی ایستاده‌اند که هیچ‌کس
    روانهٔ خانه‌شان نکرد. این خود نمایشگاهی است که هیچ کیوریتوری برنامه‌اش را نریخته بود: آنچه یک دوران
    برافراشت، دوران بعد زیر باران رها کرد.
  tip: >-
    حدود یک ساعت وقت بگذارید. هنگام بررسی ما، ساعات کار و بهای بلیت به‌طور قابل‌اعتمادی منتشر نشده بود؛
    پس پیش از حرکت آن‌ها را در محل جویا شوید. نگارخانه در مرکز کوتایسی است، حدود ۳۰۰ متر از موزهٔ تاریخی
    کوتایسی و ۶۰۰ متر از خانه‌موزهٔ پالیاشویلی، و کلیسای جامع باگراتی حدود ۱٫۴ کیلومتر فاصله دارد؛ بنابراین
    همه به‌خوبی در یک صبحِ پیاده‌روی می‌گنجند: یک بار پارک کنید و پیاده بگردید. بپرسید آیا نمایشگاه موقتی
    برپاست، و بی‌آنکه پیکره‌های حیاط پشتی را ببینید بیرون نروید.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب بروید، از کنار گوری و خاشوری بگذرید، از تونل‌های ریکوتی عبور کنید
    و از کنار زستافونی ادامه دهید؛ در سراسر بزرگراه پمپ بنزین هست. در خروجی کوتایسی از بزرگراه خارج شوید
    و تابلوهای مرکز شهر را دنبال کنید. نگارخانه در شمارهٔ ۸ خیابان روستاولی، کنار تئاتر اپرا و باله است.
    کل مسیر حدود ۲۳۰ کیلومتر و بی‌توقف حدود ۳ ساعت و ۲۰ دقیقه است، سراسر آسفالت، پس یک خودروی اقتصادی
    از پس آن برمی‌آید. در خیابان‌های اطراف تئاتر جای پارک بیابید و مرکز شهر را پیاده بگردید.
he:
  name: גלריית האמנות על שם דוד קקבדזה
  short: >-
    גלריית האמנות של קוטאיסי בבניין מלון "דה פראנס" לשעבר: כ-3,000 ציורים גאורגיים, ואימרתי של דוד קקבדזה
    מפורקת למישורים קוביסטיים.
  body: >-
    **בפריז של 1923 בנה דוד קקבדזה מצלמת קולנוע שהעניקה למסך אשליה של עומק; כעבור כמה שנים, בחזרה בגאורגיה,
    צייר שוב את שדות אימרתי כמו שמיכת טלאים.**


    קקבדזה (1889–1952) נולד למשפחת איכרים עניה סמוך לחוני ולמד מדעי הטבע בסנקט פטרבורג. מ-1919 עד 1927
    חי בפריז, הציג עם אגודת האמנים העצמאיים והתנסה במתכת, בזכוכית מראה ובוויטראז' במקום בצבע. כשחזר לגאורגיה
    עיצב תפאורות לתיאטרון של קוטה מרג'נישווילי בקוטאיסי ולימד באקדמיה לאמנויות בטביליסי, עד שב-1948 פיטרו
    אותו השלטונות הסובייטיים משום שסירב להתנער מ"פורמליזם".


    גלריית האמנות של קוטאיסי, שנוסדה ב-1974, נושאת את שמו. היא שוכנת בבניין מלון "דה פראנס" לשעבר בשדרות
    רוסתאוולי, סמוך לתיאטרון האופרה, ומחזיקה כ-3,000 ציורים של אמנים גאורגים, ביניהם עבודות של ניקו פירוסמני.
    חפשו את נופי אימרתי של קקבדזה עצמו: גבעות וחלקות אדמה המפוצלות למישורים — גאומטריה שמצא באימרתי עוד
    לפני פריז ושב אליה אחריה.


    אחר כך צאו לחצר האחורית, שם עומדים פסלים פגועים מהתקופה הסובייטית כמו אורחים שאיש מעולם לא שלח הביתה.
    זו תערוכה בפני עצמה, שאף אוצר לא תכנן: מה שתקופה אחת הקימה, הבאה אחריה השאירה בגשם.
  tip: >-
    הקדישו כשעה. שעות הפתיחה ומחירי הכרטיסים לא פורסמו באופן אמין כשבדקנו, לכן ודאו אותם במקום לפני שאתם
    יוצאים. הגלריה נמצאת במרכז קוטאיסי, כ-300 מטרים מהמוזיאון ההיסטורי של קוטאיסי ו-600 מטרים מבית־המוזיאון
    של פליאשווילי, וקתדרלת בגרטי במרחק כ-1.4 ק״מ, כך שכל אלה משתלבים יפה בבוקר אחד ברגל: חנו פעם אחת והמשיכו
    בהליכה. שאלו אם מוצגת תערוכה מתחלפת, ואל תצאו בלי לראות את הפסלים שבחצר האחורית.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), עברו את גורי ואת חשורי, עברו במנהרות ריקוטי והמשיכו מעבר לזסטפוני;
    תחנות דלק יש לאורך כל הכביש המהיר. צאו ממנו במחלף קוטאיסי ועקבו אחר השלטים למרכז. הגלריה נמצאת בשדרות
    רוסתאוולי 8, ליד תיאטרון האופרה והבלט. הדרך כולה היא כ-230 ק״מ ובערך 3 שעות ו-20 דקות בלי עצירות,
    על אספלט לכל אורכה, כך שרכב מקטגוריית אקונומי עושה את העבודה. חפשו חנייה ברחובות שסביב התיאטרון וסיירו
    במרכז ברגל.
ar:
  name: صالة داويت كاكابادزه للفنون
  short: >-
    صالة الفنون الجميلة في كوتايسي داخل فندق «أوتيل دو فرانس» السابق: نحو 3000 لوحة جورجية، وإيميريتي
    كما رآها داويت كاكابادزه مفكّكةً إلى مستويات تكعيبية.
  body: >-
    **في باريس عام 1923 صنع داويت كاكابادزه كاميرا سينمائية تمنح الشاشة إيهامًا بالعمق؛ وبعد بضع سنوات
    عاد إلى جورجيا يرسم من جديد حقول إيميريتي كأنها لحاف مرقّع.**


    وُلد كاكابادزه (1889–1952) لأسرة فلاحية فقيرة قرب خوني، ودرس العلوم الطبيعية في سانت بطرسبرغ. ومن
    1919 إلى 1927 عاش في باريس، وعرض أعماله مع جمعية الفنانين المستقلين، وجرّب المعدن وزجاج المرايا والزجاج
    المعشّق بدلًا من الألوان. وبعد عودته إلى جورجيا صمّم ديكورات لمسرح كوتيه مارجانيشفيلي في كوتايسي،
    ودرّس في أكاديمية تبليسي للفنون، إلى أن فصلته السلطات السوفييتية عام 1948 لرفضه التبرؤ من «الشكلانية».


    تحمل اسمَه صالةُ الفنون الجميلة في كوتايسي، التي تأسست عام 1974. وتشغل فندق «أوتيل دو فرانس» السابق
    في جادة روستافيلي، بجوار مسرح الأوبرا، وتضم نحو 3000 لوحة لفنانين جورجيين، منها أعمال لنيكو بيروسماني.
    ابحث عن مناظر إيميريتي التي رسمها كاكابادزه نفسه: تلال وقطع أرض مشطورة إلى مستويات — هندسة اكتشفها
    في إيميريتي قبل باريس وعاد إليها بعدها.


    ثم اخرج إلى الفناء الخلفي، حيث تقف منحوتات متضررة من الحقبة السوفييتية كضيوف لم يصرفهم أحد إلى بيوتهم
    قط. إنه معرض قائم بذاته لم يخطط له أي أمين متحف: ما شيّدته حقبة، تركته التالية تحت المطر.
  tip: >-
    خصّص نحو ساعة. لم تكن مواعيد الافتتاح وأسعار التذاكر منشورة على نحو موثوق حين تحققنا، فتأكد منها محليًا
    قبل أن تنطلق. تقع الصالة في وسط كوتايسي، على بعد نحو 300 متر من متحف كوتايسي التاريخي و600 متر من
    متحف بيت بالياشفيلي، وكاتدرائية باغراتي على بعد نحو 1.4 كم، فتنتظم كلها بسهولة في صباح واحد سيرًا
    على الأقدام: اركن مرة واحدة وامشِ. اسأل إن كان ثمة معرض مؤقت، ولا تغادر قبل أن ترى المنحوتات في الفناء
    الخلفي.
  route: >-
    من تبليسي اتبع الطريق S1 (E60) غربًا مرورًا بغوري وخاشوري، ثم عبر أنفاق ريكوتي ومرورًا بزستافوني؛
    محطات الوقود منتشرة على طول الطريق السريع. اخرج عند مخرج كوتايسي واتبع اللافتات إلى المركز. تقع الصالة
    في جادة روستافيلي رقم 8، بجوار مسرح الأوبرا والباليه. تبلغ الرحلة كلها نحو 230 كم ونحو 3 ساعات و20
    دقيقة دون توقف، على الأسفلت طوال الطريق، فتفي سيارة اقتصادية بالغرض. ابحث عن مكان للوقوف في الشوارع
    المحيطة بالمسرح، وتجوّل في المركز سيرًا.
