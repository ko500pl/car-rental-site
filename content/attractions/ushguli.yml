ka:
  name: უშგული
  short: >-
    ხუთი კოშკოვანი სოფელი ენგურის სათავეში, 2100 მეტრზე, შხარის ძირში — ევროპის ერთ-ერთი უმაღლესი მუდმივი
    დასახლება, დღესაც ცოცხალი და მშრომელი.
  body: >-
    **უშგული იქ დგას, სადაც ენგურს ხეობა უთავდება: ხუთი სოფელი ქვის კოშკებით, მათ იქით კი მხოლოდ შხარის
    ყინულის კედელი.**


    ჩაჟაში, ჩვიბიანი, ჟიბიანი, მურყმელი და ლამჯურიში ზღვის დონიდან 2060–2200 მეტრზე გაშენებულა; 2014 წლის
    აღწერით აქ 228 კაცი ცხოვრობდა. წლის ნახევარი სოფლები თოვლის ქვეშაა, მესტიის გზა კი ხშირად გაუვალია.
    ათწლეულების განმავლობაში უშგულს ევროპის ყველაზე მაღალ მუდმივ დასახლებად მიიჩნევდნენ; მკაცრად თუ ვიტყვით,
    ეს ტიტული 2014 წელს თუშეთის ბოჭორნას გადაეცა, როცა აღწერამ იქ ერთი მუდმივი მცხოვრები დააფიქსირა. კოშკებს
    ეს, როგორც ჩანს, დიდად არ ადარდებთ. 1996 წლიდან სოფელი იუნესკოს მსოფლიო მემკვიდრეობის ძეგლის — „ზემო
    სვანეთის“ — ნაწილია: დაცულია არა ერთი ნაგებობა, არამედ მთელი ცხოვრების წესი, კოშკებით, რომელთა უმეტესობა
    IX–XII საუკუნეებში აიგო.


    ჟიბიანის ზემოთ, ბორცვზე, ლამარიაა — ღვთისმშობლის ეკლესია, რომელსაც არქიტექტურის მიხედვით IX–X საუკუნეებით
    ათარიღებენ. სვანებმა ღვთისმშობელს ლამარია უწოდეს — ნაყოფიერების უფრო ძველი ქალღმერთის სახელი. შიგნით
    მოხატულობის ორი გაცრეცილი ფენაა, X და XIII საუკუნეებისა; გარეთ XI საუკუნის წარწერა შემომწირველ ქალს,
    გურანდუხტს იხსენიებს, დასავლეთიდან კი ეკლესიას სვანური კოშკი იცავს.


    გადმოცემით, სწორედ აქ მოკლეს ფუთა დადეშქელიანი, რომელსაც XVII საუკუნეში თავისუფალი უშგულის დამორჩილება
    სურდა. თოფის სასხლეტზე მიბმულ თოკს მთელმა სოფელმა ერთად მოსწია — რომ ცოდვა ყველას თანაბრად გაენაწილებინა.


    1930 წელს მიხეილ კალატოზიშვილმა აქ გადაიღო „მარილი სვანეთს“ და უშგული ქვეყნიერებას მოწყვეტილ ადგილად
    აჩვენა. წლის ნახევარი ის დღესაც მოწყვეტილია — და სწორედ ამან შემოუნახა მთლიანობა.
  tip: >-
    მესტიიდან 09:00-მდე გადით: ერთი მხარე დაახლოებით ორი საათია და ხრეშიან გზაზე სიბნელეში დაბრუნება არ
    გინდათ. უკეთესია, უშგულში გაათიოთ ღამე და შხარა დილის სიცხადეში ნახოთ, სანამ შუადღის ღრუბელი ჩამოწვება.
    სოფლების მოსავლელად ორი-სამი საათი დაითვალეთ, ლამარიამდე ასასვლელად — ორმოცი წუთი. ეკლესიაში მხრები
    და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარს სთხოვენ. მანქანა სოფლის შესასვლელთან დატოვეთ და
    ფეხით იარეთ: შუკები ვიწროა და გზა საქონელს ეკუთვნის. ბანკომატი არ არის — სასტუმროს, კაფესა და პატარა
    მუზეუმისთვის ნაღდი ფული წამოიღეთ.
  route: >-
    უშგული თბილისიდან დაახლოებით 515 კმ-ითაა დაშორებული — რეალურად ორდღიანი გზაა, მესტიაში ღამისთევით.
    E60-ით (ს1) ზუგდიდამდე, შემდეგ შ7-ით მესტიამდე (დაახლოებით 470 კმ, მთლიანად ასფალტი). მესტიიდან 45
    კმ და დაახლოებით ორი საათია: ჯერ ასფალტი, მერე ვიწრო, ქვიან-ხრეშიანი გზა რამდენიმე ღელის გადასასვლელით,
    რომელიც წვიმის შემდეგ მკვეთრად უარესდება. ამიტომაა ეს მარშრუტი ოფროუდის კატეგორიაში: მაღალკლირენსიანი
    4x4 აიღეთ — დაბალი მანქანით აქ არც უსაფრთხოა და არც დაზღვევა ფარავს. ავზი მესტიაში შეავსეთ, უშგულში
    საწვავი არ არის. ზაფხულში უკან ზაგარის უღელტეხილით, ლენტეხის გავლითაც შეგიძლიათ დაბრუნება.
en:
  name: Ushguli
  short: >-
    Five tower villages at the head of the Enguri, 2,100 m up under Shkhara — one of Europe's highest
    year-round communities, and still a working one.
  body: >-
    **Ushguli stands where the Enguri runs out of valley: five villages of stone towers, and beyond them
    only the ice wall of Shkhara.**


    Chazhashi, Chvibiani, Zhibiani, Murqmeli and Lamjurishi lie between 2,060 and 2,200 metres, and together
    they held 228 people at the 2014 census. Snow covers them for half the year, and the road to Mestia
    is often impassable. For decades Ushguli was called Europe's highest permanently inhabited settlement;
    strictly, the title passed to Bochorna in Tusheti when the 2014 census found one year-round resident
    there. The towers do not seem to mind. Since 1996 it has been part of the Upper Svaneti World Heritage
    Site, protected not as a single monument but as a whole way of living, with towers built mostly between
    the 9th and 12th centuries.


    Climb the hill above Zhibiani to Lamaria, the church of the Mother of God, dated by its architecture
    to the 9th or 10th century. Svans gave Mary the name of Lamaria, an older goddess of fertility. Inside
    are two faded layers of frescoes, of the 10th and 13th centuries; outside, an 11th-century inscription
    names a woman donor, Gurandukht, and a Svan tower guards the west end.


    Legend says a prince, Puta Dadeshkeliani, who tried to rule free Ushguli in the 17th century, was
    shot here. The whole village pulled the cord tied to the musket's trigger, so that the guilt would
    be shared equally.


    In 1930 Mikhail Kalatozov filmed *Salt for Svanetia* here and showed Ushguli as a place cut off from
    the world. For half of every year it still is, and that is exactly what has kept it whole.
  tip: >-
    Leave Mestia before 09:00: it is about two hours each way, and you do not want the gravel in the dark.
    Better still, sleep in Ushguli and see Shkhara in the clear morning, before the afternoon cloud. Allow
    two to three hours for the villages and forty minutes for the climb to Lamaria. Cover shoulders and
    knees in church; women are expected to wear a headscarf. Park at the village entrance and walk, since
    the lanes are narrow and cattle have right of way. There is no ATM, so bring cash for guesthouses,
    cafés and the small museum.
  route: >-
    Ushguli is about 515 km from Tbilisi, realistically a two-day trip with a night in Mestia. Take the
    E60 (S1) to Zugdidi and the Sh7 to Mestia (about 470 km, all asphalt). From Mestia it is 45 km and
    roughly two hours: asphalt at first, then a narrow gravel-and-stone road with several stream crossings,
    which deteriorates sharply after rain. That is why we class it as offroad: take a high-clearance 4x4,
    because a low car is neither safe nor insured here. Fill the tank in Mestia, as there is no fuel in
    Ushguli. In summer you can also return over the Zagari Pass to Lentekhi.
ru:
  name: Ушгули
  short: >-
    Пять башенных сёл в верховьях Ингури, на высоте 2100 м под Шхарой, — одна из самых высокогорных круглогодичных
    общин Европы, и по-прежнему живая.
  body: >-
    **Ушгули стоит там, где у Ингури кончается долина: пять сёл каменных башен, а за ними — только ледяная
    стена Шхары.**


    Чажаши, Чвибиани, Жибиани, Муркмели и Ламджуриши лежат на высоте от 2060 до 2200 метров, и по переписи
    2014 года в них вместе жили 228 человек. Полгода их покрывает снег, и дорога в Местиа часто непроезжая.
    Десятилетиями Ушгули называли самым высокогорным постоянно обитаемым поселением Европы; строго говоря,
    титул перешёл к Бочорне в Тушетии, когда перепись 2014 года нашла там одного круглогодичного жителя.
    Башни, кажется, не возражают. С 1996 года Ушгули входит в объект Всемирного наследия «Верхняя Сванетия»
    и охраняется не как отдельный памятник, а как целый уклад жизни; башни здесь строили в основном между
    IX и XII веками.


    Поднимитесь на холм над Жибиани к Ламарии — церкви Богородицы, которую по архитектуре датируют IX
    или X веком. Сваны дали Марии имя Ламарии, более древней богини плодородия. Внутри — два поблёкших
    слоя фресок, X и XIII веков; снаружи надпись XI века называет жертвовательницу, женщину по имени Гурандухт,
    а западный край охраняет сванская башня.


    Легенда рассказывает, что здесь застрелили князя Путу Дадешкелиани, пытавшегося в XVII веке править
    вольным Ушгули. Шнур, привязанный к спусковому крючку ружья, тянуло всё село разом, чтобы вина легла
    на всех поровну.


    В 1930 году Михаил Калатозов снял здесь «Соль Сванетии» и показал Ушгули местом, отрезанным от мира.
    Полгода в году так оно и есть — и именно это сохранило его целым.
  tip: >-
    Выезжайте из Местиа до 09:00: в одну сторону около двух часов, и оказаться на гравии в темноте вам
    не захочется. А ещё лучше — заночуйте в Ушгули и увидьте Шхару ясным утром, до того как после полудня
    набегут облака. На сёла отведите два-три часа и сорок минут на подъём к Ламарии. В церкви закрывайте
    плечи и колени; от женщин ждут платка. Оставьте машину у въезда в село и идите пешком: переулки узкие,
    а у скота преимущество. Банкомата нет, так что везите наличные для гостевых домов, кафе и маленького
    музея.
  route: >-
    Ушгули — примерно в 515 км от Тбилиси, реально это поездка на два дня с ночёвкой в Местиа. Езжайте
    по E60 (S1) до Зугдиди и по Sh7 до Местиа (около 470 км, весь путь по асфальту). От Местиа — 45 км
    и примерно два часа: сначала асфальт, затем узкая гравийно-каменистая дорога с несколькими бродами
    через ручьи, которая после дождя резко портится. Поэтому мы относим её к бездорожью: берите полноприводную
    машину с высоким клиренсом — на низкой здесь и небезопасно, и страховка не действует. Заправьтесь
    в Местиа, в Ушгули топлива нет. Летом можно вернуться и через перевал Загари в Лентехи.
fa:
  name: اوشگولی
  short: >-
    پنج روستای برج‌دار در سرچشمهٔ انگوری، در ارتفاع ۲,۱۰۰ متر زیر شخارا؛ یکی از بلندترین اجتماع‌های همیشه‌مسکون
    اروپا که هنوز زنده و پرکار است.
  body: >-
    **اوشگولی آنجاست که درهٔ انگوری به پایان می‌رسد: پنج روستای برج‌های سنگی، و پشت سرشان تنها دیوار یخی
    شخارا.**


    چاژاشی، چوبیانی، ژیبیانی، مورقملی و لامجوریشی میان ۲,۰۶۰ تا ۲,۲۰۰ متر ارتفاع قرار دارند و در سرشماری
    ۲۰۱۴ روی هم ۲۲۸ نفر در آن‌ها می‌زیستند. نیمی از سال برف آن‌ها را می‌پوشاند و جادهٔ مستیا اغلب بسته
    است. دهه‌ها اوشگولی را بلندترین سکونتگاه همیشه‌مسکون اروپا می‌خواندند؛ اما به‌دقت، این عنوان به بوچورنا
    در توشتی رسید، وقتی سرشماری ۲۰۱۴ در آنجا یک ساکن همیشگی یافت. برج‌ها ظاهراً اهمیتی نمی‌دهند. اوشگولی
    از ۱۹۹۶ بخشی از محوطهٔ میراث جهانی سوانتی علیاست و نه به‌عنوان یک بنای یادبود، بلکه به‌عنوان یک شیوهٔ
    کامل زندگی حفاظت می‌شود؛ برج‌هایش بیشتر میان سده‌های نهم و دوازدهم ساخته شده‌اند.


    از تپهٔ بالای ژیبیانی به لاماریا بروید، کلیسای مادر خدا که بر پایهٔ معماری‌اش به سدهٔ نهم یا دهم نسبت
    داده می‌شود. سوان‌ها بر مریم نام لاماریا را نهادند، الههٔ کهن‌تر باروری. درون کلیسا دو لایهٔ رنگ‌باختهٔ
    نقاشی دیواری از سده‌های دهم و سیزدهم هست؛ بیرون، کتیبه‌ای از سدهٔ یازدهم از بانویی نیکوکار به نام
    گوراندخت یاد می‌کند، و برجی سوانی از سوی غربی نگهبان آن است.


    افسانه می‌گوید شاهزاده‌ای به نام پوتا دادشکلیانی که در سدهٔ هفدهم کوشید بر اوشگولیِ آزاد فرمان براند،
    در همین‌جا تیر خورد. همهٔ روستا با هم ریسمانی را کشیدند که به ماشهٔ تفنگ بسته بود، تا گناه به‌تساوی
    میان همه قسمت شود.


    در ۱۹۳۰ میخائیل کالاتوزوف فیلم *نمک برای سوانتی* را در اینجا ساخت و اوشگولی را جایی بریده از جهان
    نشان داد. نیمی از هر سال هنوز همین است، و درست همین آن را دست‌نخورده نگه داشته است.
  tip: >-
    پیش از ساعت ۰۹:۰۰ از مستیا راه بیفتید: هر مسیر حدود دو ساعت است و نمی‌خواهید در تاریکی روی شن‌ها باشید.
    بهتر از آن، شب را در اوشگولی بمانید و شخارا را در صبح صاف، پیش از ابرهای بعدازظهر، ببینید. برای روستاها
    دو تا سه ساعت و برای بالا رفتن تا لاماریا چهل دقیقه وقت بگذارید. در کلیسا شانه‌ها و زانوها را بپوشانید؛
    از بانوان انتظار می‌رود روسری بر سر کنند. خودرو را در ورودی روستا پارک کنید و پیاده بروید، چون کوچه‌ها
    باریک‌اند و حق تقدم با گاوهاست. خودپرداز نیست، پس برای مهمان‌خانه‌ها، کافه‌ها و موزهٔ کوچک پول نقد
    بیاورید.
  route: >-
    اوشگولی حدود ۵۱۵ کیلومتر با تفلیس فاصله دارد و در عمل سفری دوروزه با یک شب ماندن در مستیاست. با E60
    (S1) تا زوگدیدی و با Sh7 تا مستیا بروید (حدود ۴۷۰ کیلومتر، تمام آسفالت). از مستیا ۴۵ کیلومتر و تقریباً
    دو ساعت راه است: اول آسفالت، سپس جاده‌ای باریک از شن و سنگ با چند گذر از جویبار، که پس از باران به‌شدت
    خراب می‌شود. برای همین آن را آفرود به شمار می‌آوریم: خودروی دودیفرانسیل با ارتفاع زیاد از زمین بردارید،
    چون خودروی کوتاه اینجا نه ایمن است و نه بیمه پوششش می‌دهد. باک را در مستیا پر کنید، چون در اوشگولی
    سوخت نیست. در تابستان می‌توانید از راه گردنهٔ زاگاری به لنتخی هم بازگردید.
he:
  name: אושגולי
  short: >-
    חמישה כפרי מגדלים בראש האנגורי, בגובה 2,100 מטר למרגלות שחרה – אחת הקהילות הגבוהות באירופה המאוכלסות
    כל השנה, ועדיין חיה ופועמת.
  body: >-
    **אושגולי עומדת במקום שבו לאנגורי נגמר העמק: חמישה כפרים של מגדלי אבן, ומעבר להם רק חומת הקרח של שחרה.**


    צ'אז'אשי, צ'וויביאני, ז'יביאני, מורקמלי ולמג'ורישי שוכנים בגובה של בין 2,060 ל-2,200 מטר, ובמפקד 2014
    חיו בהם יחד 228 איש. השלג מכסה אותם חצי שנה, והכביש למסטיה לעתים קרובות אינו עביר. במשך עשרות שנים
    כונתה אושגולי היישוב המאוכלס דרך קבע הגבוה באירופה; למען הדיוק, התואר עבר לבוצ'ורנה שבתושתי כשמפקד
    2014 מצא בה תושב אחד לכל השנה. נראה שלמגדלים זה לא אכפת. מאז 1996 היא חלק מאתר המורשת העולמית סוואנטי
    העילית, ומוגנת לא כמונומנט יחיד אלא כאורח חיים שלם; המגדלים נבנו ברובם בין המאה ה-9 למאה ה-12.


    טפסו על הגבעה שמעל ז'יביאני אל לאמריה, כנסיית אם האלוהים, שלפי האדריכלות שלה מתוארכת למאה ה-9 או ה-10.
    הסוואנים העניקו למרים, אם ישו, את השם לאמריה – שמה של אלת פריון עתיקה יותר. בפנים שתי שכבות דהויות
    של ציורי קיר, מן המאה ה-10 ומן המאה ה-13; בחוץ, כתובת מן המאה ה-11 מזכירה תורמת בשם גורנדוכת, ומגדל
    סוואני שומר על הקצה המערבי.


    האגדה מספרת שנסיך בשם פוטה דדשקליאני, שניסה במאה ה-17 למשול באושגולי החופשית, נורה כאן. כל הכפר משך
    יחד בחבל שנקשר להדק המוסקט, כדי שהאשמה תתחלק שווה בשווה.


    ב-1930 צילם כאן מיכאיל קלטוזוב את "מלח לסוואנטי" והציג את אושגולי כמקום מנותק מן העולם. חצי שנה בכל
    שנה היא עדיין כזאת – ובדיוק זה מה ששמר עליה שלמה.
  tip: >-
    צאו ממסטיה לפני 09:00: הדרך לוקחת כשעתיים לכל כיוון, ואתם לא רוצים להיות על החצץ בחושך. עדיף עוד יותר
    ללון באושגולי ולראות את שחרה בבוקר הצלול, לפני העננים של אחר הצהריים. הקדישו שעתיים-שלוש לכפרים וארבעים
    דקות לעלייה ללאמריה. בכנסייה כסו כתפיים וברכיים; מנשים מצופה לחבוש כיסוי ראש. חנו בכניסה לכפר והמשיכו
    ברגל, כי הסמטאות צרות ולבהמות יש זכות קדימה. אין כספומט, לכן הביאו מזומנים לבתי ההארחה, לבתי הקפה
    ולמוזיאון הקטן.
  route: >-
    אושגולי נמצאת כ-515 ק"מ מטביליסי, ובפועל זו נסיעה של יומיים עם לילה במסטיה. סעו בכביש E60 (S1) עד
    זוגדידי ובכביש Sh7 עד מסטיה (כ-470 ק"מ, הכול סלול). ממסטיה 45 ק"מ וכשעתיים: תחילה אספלט, ואחר כך דרך
    צרה של חצץ ואבנים עם כמה חציות נחלים, שמידרדרת בחדות אחרי גשם. לכן אנחנו מסווגים אותה כדרך שטח: קחו
    רכב 4x4 עם מרווח גחון גבוה, כי רכב נמוך אינו בטוח כאן וגם אינו מבוטח. תדלקו במסטיה, כי באושגולי אין
    דלק. בקיץ אפשר גם לחזור דרך מעבר זגרי ללנטחי.
ar:
  name: أوشغولي
  short: >-
    خمس قرى ذات أبراج عند منابع إنغوري، على ارتفاع 2100 م تحت شخارا: من أعلى المجتمعات المأهولة طوال العام
    في أوروبا، وما زالت حيّة عاملة.
  body: >-
    **تقوم أوشغولي حيث ينتهي وادي إنغوري: خمس قرى من الأبراج الحجرية، ولا شيء وراءها إلا جدار شخارا الجليدي.**


    تقع تشاجاشي وتشفيبياني وجيبياني ومورقميلي ولامجوريشي بين 2060 و2200 متر، وقد ضمّت معاً 228 نسمة في
    تعداد 2014. يغطيها الثلج نصف العام، وكثيراً ما يتعذّر اجتياز الطريق إلى ميستيا. ظلّت أوشغولي عقوداً
    تُسمّى أعلى تجمّع سكني مأهول بصفة دائمة في أوروبا؛ لكن اللقب انتقل، بدقيق العبارة، إلى بوتشورنا في
    توشيتي حين وجد تعداد 2014 فيها ساكناً واحداً طوال العام. ولا يبدو أن الأبراج تكترث. ومنذ 1996 صارت
    جزءاً من موقع سفانيتي العليا للتراث العالمي، محمية لا بوصفها أثراً منفرداً بل بوصفها نمط حياة كاملاً،
    وقد شُيّدت أبراجها في معظمها بين القرنين التاسع والثاني عشر.


    اصعد التلة فوق جيبياني إلى لاماريا، كنيسة والدة الإله، التي تؤرَّخ بحسب عمارتها بالقرن التاسع أو العاشر.
    وقد منح السفانيون مريمَ اسمَ لاماريا، إلهة الخصوبة الأقدم. في الداخل طبقتان باهتتان من الجداريات من
    القرنين العاشر والثالث عشر؛ وفي الخارج نقش من القرن الحادي عشر يذكر امرأة متبرّعة اسمها غوراندوخت،
    وبرج سفاني يحرس الطرف الغربي.


    وتقول الأسطورة إن أميراً يُدعى بوتا داديشكيلياني، حاول في القرن السابع عشر أن يحكم أوشغولي الحرّة،
    قُتل هنا رمياً بالرصاص. فقد شدّت القرية كلها معاً الحبل المربوط بزناد البندقية، كي يتوزّع الذنب على
    الجميع بالتساوي.


    في عام 1930 صوّر ميخائيل كالاتوزوف هنا فيلم *ملح لسفانيتي*، وأظهر أوشغولي مكاناً مقطوعاً عن العالم.
    وهي ما زالت كذلك نصف كل عام، وهذا بالضبط ما أبقاها سليمة.
  tip: >-
    غادر ميستيا قبل الساعة 09:00: فالطريق نحو ساعتين في كل اتجاه، ولن ترغب في أن يدركك الظلام على الحصى.
    والأفضل أن تبيت في أوشغولي لترى شخارا في صفاء الصباح، قبل غيوم ما بعد الظهر. خصّص ساعتين إلى ثلاث
    للقرى وأربعين دقيقة للصعود إلى لاماريا. استر كتفيك وركبتيك في الكنيسة؛ ويُنتظر من النساء غطاء رأس.
    اركن سيارتك عند مدخل القرية وتابع سيراً، فالأزقة ضيقة والأولوية للماشية. لا يوجد صرّاف آلي، فاحمل
    نقوداً لدور الضيافة والمقاهي والمتحف الصغير.
  route: >-
    تبعد أوشغولي عن تبليسي نحو 515 كم، وهي عملياً رحلة يومين مع ليلة في ميستيا. خذ الطريق E60 (S1) إلى
    زوغديدي ثم الطريق Sh7 إلى ميستيا (نحو 470 كم، كلها معبّدة). ومن ميستيا 45 كم ونحو ساعتين: إسفلت في
    البداية، ثم طريق ضيق من الحصى والحجارة يعبر عدة جداول، ويسوء بشدة بعد المطر. لذلك نصنّفه طريقاً وعراً:
    خذ سيارة دفع رباعي ذات خلوص أرضي عالٍ، فالسيارة المنخفضة هنا ليست آمنة ولا يشملها التأمين. املأ الخزان
    في ميستيا، فلا وقود في أوشغولي. وفي الصيف يمكنك أيضاً العودة عبر ممر زاغاري إلى لينتيخي.
