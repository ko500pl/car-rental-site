ka:
  name: უშგული
  short: ევროპის ერთ-ერთი უმაღლესი მუდმივად დასახლებული სოფელი 2100 მეტრზე, შხარის ძირში — იუნესკოს ძეგლი.
  body: >-
    უშგული ოთხი მჭიდროდ განლაგებული სოფლის — ჩაჟაშის, ჩვიბიანის, ჟიბიანისა და მურყმელის — საერთო სახელია.
    ისინი ენგურის სათავეში, დაახლოებით 2100 მეტრზე დგანან და ევროპის ყველაზე მაღლა მდებარე მუდმივად დასახლებულ
    პუნქტებს შორის იხსენიება. 1996 წლიდან უშგული იუნესკოს მსოფლიო მემკვიდრეობის სიაშია, როგორც „ზემო სვანეთის"
    ძეგლის ნაწილი — დაცულია არა ცალკეული შენობა, არამედ მთელი დასახლების ისტორიული სტრუქტურა კოშკებით,
    სახლებითა და საძოვრებით.


    ხეობის ბოლოში იმართება მთავარი ხედი: შხარა, საქართველოს უმაღლესი მწვერვალი 5193 მეტრზე, პირდაპირ სოფლების
    თავზე დგას. ჟიბიანის ზემოთ, ბორცვზე, დგას ლამარიის ეკლესია — XII საუკუნის პატარა ნაგებობა შემორჩენილი
    ფრესკებით და საკუთარი კოშკით. ჩაჟაშში მოქმედებს ეთნოგრაფიული მუზეუმი ხატებითა და საყოფაცხოვრებო ნივთებით.


    რაზეც წინასწარ უნდა იცოდეთ:


    - **ზამთარში სოფელი ხშირად მოწყვეტილია** — თოვლი გზას თვეობით კეტავს

    - **გზა მესტიიდან ბოლო მონაკვეთზე გრუნტოვანია** და მხოლოდ მაღალი გამავლობის ავტომობილს გაატარებს

    - **სერვისი მინიმალურია** — რამდენიმე გესთჰაუსი და პატარა კაფე, ბანკომატის გარეშე


    უშგული არ არის „მოწყობილი" ტურისტული ობიექტი და სწორედ ეს არის მისი ღირებულება: ეს ცოცხალი სოფელია,
    სადაც ადამიანები ისევ ჰყავთ საქონელი და თივას თიბავენ იმავე ფერდობებზე, სადაც ას წელზე მეტი ხნის წინ.
  tip: >-
    გამგზავრება მესტიიდან დილით, 09:00-მდე — ერთი მხარე ორ საათს ითხოვს და ბნელში დაბრუნება გრუნტზე არასასურველია.
    სოფლის დათვალიერებას ორი-სამი საათი სჭირდება, ლამარიის ეკლესიამდე აღმართი კიდევ 40 წუთი. ეკლესიაში
    მოკრძალებული ჩაცმა საჭიროა — ქალებისთვის თავსაფარი და გრძელი კალთა. მანქანა სოფლის შესასვლელთან, მოწესრიგებულ
    ადგილას დატოვეთ და შიგნით ფეხით იარეთ: ქუჩები ვიწროა და საქონელი თავისუფლად დადის. ნაღდი ფული აუცილებელია,
    ტუალეტი კაფეებშია.
  route: >-
    უშგული თბილისიდან დაახლოებით 515 კმ-ია — რეალურად ეს ორდღიანი მონაკვეთია მესტიაში ღამის გათევით. მესტიიდან
    უშგულამდე 45–47 კმ-ია და ორი საათი: ჯერ ასფალტი და შემდეგ ხრეშოვან-ქვიშოვანი გზა, რომელიც მდინარეს
    რამდენიმეჯერ კვეთს და წვიმის შემდეგ მკვეთრად უარესდება. სწორედ ამიტომ საჭიროა მაღალი გამავლობის ავტომობილი
    — დაბალი კლირენსის მანქანით მოგზაურობა აქ არც უსაფრთხოა და არც დაზღვევით დაფარული. ბოლო ბენზინგასამართი
    მესტიაშია, ბაკი წინასწარ აავსეთ.
en:
  name: Ushguli
  short: >-
    One of Europe's highest permanently inhabited settlements at 2,100 m, under Mount Shkhara — UNESCO-listed
    as part of Upper Svaneti.
  body: >-
    Ushguli is the collective name for four closely spaced villages — Chazhashi, Chvibiani, Zhibiani and
    Murqmeli — standing at the head of the Enguri valley at roughly 2,100 metres. It is regularly described
    as one of the highest permanently inhabited places in Europe. Since 1996 it has been on the UNESCO
    World Heritage list as part of the Upper Svaneti site; what is protected is not a single monument
    but the whole historic pattern of settlement, with its towers, houses and hay meadows.


    The view is the main event. Shkhara, Georgia's highest summit at 5,193 metres, rises directly behind
    the villages and closes the valley. On a low hill above Zhibiani stands Lamaria church, a small twelfth-century
    building with surviving frescoes and its own defensive tower. In Chazhashi an ethnographic museum
    displays icons, weapons and household objects.


    Things worth knowing in advance:


    - **In winter the village is often cut off** — snow can close the road for weeks at a time

    - **The final stretch from Mestia is unpaved** and genuinely needs a high-clearance vehicle

    - **Services are minimal** — a handful of guesthouses, small cafes, no ATM


    Ushguli is not a packaged attraction, and that is exactly its value. It remains a working village:
    people still keep cattle and cut hay on the same slopes their families worked more than a century
    ago, while visitors walk between the towers.
  tip: >-
    Leave Mestia in the morning, before 09:00 — it is two hours each way and you do not want to drive
    the gravel back in the dark. Walking the four villages takes two to three hours, plus about forty
    minutes for the climb to Lamaria church. Dress modestly inside the church: a headscarf and a long
    skirt for women. Park at the marked area by the village entrance and continue on foot, since the lanes
    are narrow and livestock wanders freely. Bring cash; toilets are in the cafes.
  route: >-
    Ushguli is roughly 515 km from Tbilisi, which realistically means a two-day approach with a night
    in Mestia. From Mestia it is 45–47 km and about two hours: asphalt at first, then a gravel and stone
    road that crosses the river several times and deteriorates sharply after rain. That is precisely why
    a high-clearance vehicle is required here — a low car is neither safe nor covered by rental insurance
    on this section. The last fuel is in Mestia, so fill the tank before you set off, and check the weather,
    as heavy rain can make the fords slow.
ru:
  name: Ушгули
  short: Одно из самых высокогорных постоянно обитаемых сёл Европы на 2100 м у подножия Шхары — объект
    ЮНЕСКО.
  body: >-
    Ушгули — общее название четырёх стоящих рядом сёл: Чажаши, Чвибиани, Жибиани и Мурквмели. Они расположены
    в верховьях Ингури примерно на 2100 метрах и регулярно упоминаются среди самых высокогорных постоянно
    обитаемых мест Европы. С 1996 года Ушгули входит в список Всемирного наследия ЮНЕСКО как часть объекта
    «Верхняя Сванетия»: охраняется не отдельное здание, а вся историческая структура поселения с башнями,
    домами и покосами.


    Главное здесь — вид. Шхара, высшая точка Грузии высотой 5193 метра, поднимается прямо за сёлами и
    замыкает долину. На холме над Жибиани стоит церковь Ламария XII века с сохранившимися фресками и собственной
    башней. В Чажаши работает этнографический музей с иконами, оружием и предметами быта.


    О чём стоит знать заранее:


    - **Зимой село нередко отрезано** — снег закрывает дорогу на недели

    - **Последний участок от Местиа грунтовый** и требует машины с высоким клиренсом

    - **Сервис минимальный** — несколько гостевых домов, маленькие кафе, банкомата нет


    Ушгули не превращено в упакованный аттракцион, и в этом его ценность. Это действующее село: люди по-прежнему
    держат скот и косят сено на тех же склонах, что и сто лет назад, пока гости бродят между башнями.
  tip: >-
    Выезжайте из Местиа утром, до 09:00 — два часа в одну сторону, и возвращаться по грунту в темноте
    не стоит. На обход четырёх сёл уходит два-три часа плюс минут сорок на подъём к церкви Ламария. В
    храме нужна скромная одежда: женщинам платок и длинная юбка. Машину оставьте на площадке у въезда
    и дальше идите пешком — переулки узкие, а скот ходит свободно. Наличные обязательны, туалеты есть
    при кафе.
  route: >-
    От Тбилиси до Ушгули около 515 км, и реально это двухдневный заезд с ночёвкой в Местиа. От Местиа
    — 45–47 км и примерно два часа: сначала асфальт, затем грунтово-каменная дорога, которая несколько
    раз пересекает реку и заметно портится после дождя. Именно поэтому здесь нужен автомобиль с высоким
    клиренсом: низкая машина на этом отрезке и небезопасна, и не покрывается страховкой аренды. Последняя
    заправка — в Местиа, бак заполняйте заранее и проверяйте прогноз: сильный дождь замедляет броды.
fa:
  name: اوشگولی
  short: از بلندترین سکونتگاه‌های دائمی اروپا در 2,100 متر، زیر کوه شخارا — ثبت‌شده در یونسکو در قالب
    سوانتی علیا.
  body: >-
    اوشگولی نام جمعی چهار روستای نزدیک به هم است — چاژاشی، چویبیانی، ژیبیانی و مورقملی — که در سرِ درهٔ
    انگوری در ارتفاع حدود 2,100 متر ایستاده‌اند. مرتب آن را یکی از بلندترین جاهای دائماً مسکون اروپا می‌خوانند.
    از 1996 در فهرست میراث جهانی یونسکو، در قالب محوطهٔ سوانتی علیا، ثبت شده است؛ آنچه پاس داشته می‌شود
    یک بنای تنها نیست، بلکه کل الگوی تاریخی سکونت با برج‌ها، خانه‌ها و علفزارهای علوفه است.


    منظره حرف اصلی را می‌زند. شخارا، بلندترین قلهٔ گرجستان با 5,193 متر، درست پشت روستاها برمی‌خیزد و
    دره را می‌بندد. بر تپه‌ای کوتاه بالای ژیبیانی کلیسای لاماریا ایستاده است، بنایی کوچک از سدهٔ دوازدهم
    با فرسکوهای برجامانده و برج دفاعی خودش. در چاژاشی موزه‌ای مردم‌شناختی شمایل‌ها، سلاح‌ها و اشیای خانگی
    را نمایش می‌دهد.


    چند نکته را از پیش بدانید: **در زمستان روستا اغلب قطع می‌شود** — برف می‌تواند جاده را هفته‌ها ببندد؛
    **بخش پایانی از مستیا آسفالت ندارد** و به‌راستی خودرویی با کلیرنس بالا می‌طلبد؛ **خدمات حداقلی است**
    — چند اقامتگاه، کافه‌های کوچک، بدون خودپرداز. اوشگولی جاذبه‌ای بسته‌بندی‌شده نیست و ارزشش دقیقاً همین
    است. هنوز روستایی کارکردی است: مردم همچنان گاو نگه می‌دارند و روی همان دامنه‌هایی علوفه می‌چینند که
    خانواده‌هایشان بیش از یک سده پیش کار می‌کردند، در حالی که بازدیدکنندگان میان برج‌ها قدم می‌زنند.
  tip: >-
    صبح از مستیا راه بیفتید، پیش از 09:00 — هر جهت دو ساعت است و نمی‌خواهید مسیر شنی را در تاریکی برگردید.
    پیاده‌روی در چهار روستا دو تا سه ساعت می‌برد، به‌اضافهٔ حدود چهل دقیقه برای صعود به کلیسای لاماریا.
    در کلیسا پوشیده باشید: روسری و دامن بلند برای زنان. در محوطهٔ علامت‌گذاری‌شدهٔ ورودی روستا پارک کنید
    و پیاده ادامه دهید، چون کوچه‌ها باریک‌اند و دام آزادانه می‌گردد. پول نقد بردارید؛ سرویس بهداشتی در
    کافه‌هاست.
  route: >-
    اوشگولی حدود 515 کیلومتر از تفلیس فاصله دارد، که واقع‌بینانه یعنی دو روز راه با یک شب در مستیا. از
    مستیا 45–47 کیلومتر و حدود دو ساعت است: نخست آسفالت، سپس جاده‌ای شنی و سنگی که چند بار از رود می‌گذرد
    و پس از باران به‌شدت بد می‌شود. دقیقاً به همین دلیل اینجا خودروی با کلیرنس بالا الزامی است — خودروی
    کوتاه در این بخش نه ایمن است و نه بیمهٔ اجاره پوششش می‌دهد. آخرین سوخت در مستیاست، پس پیش از حرکت
    باک را پر کنید و هوا را بررسی کنید، چون باران سنگین گدارها را کند می‌کند.
he:
  name: אושגולי
  short: >-
    מן היישובים המאוכלסים דרך קבע הגבוהים באירופה, בגובה 2,100 מ' למרגלות הר שחרה — רשום באונסקו כחלק
    מסוואנטי העילית.
  body: >-
    אושגולי הוא השם הקיבוצי לארבעה כפרים סמוכים — צ'אז'אשי, צ'ויביאני, ז'יביאני ומורקמלי — העומדים בראש
    עמק האנגורי בגובה של כ-2,100 מטר. הוא מתואר דרך קבע כאחד המקומות המאוכלסים ברציפות הגבוהים באירופה.
    מאז 1996 הוא רשום ברשימת המורשת העולמית של אונסקו כחלק מאתר סוואנטי העילית; מה שמוגן אינו מונומנט
    יחיד אלא כל דפוס ההתיישבות ההיסטורי, על מגדליו, בתיו ואחו החציר שלו.


    הנוף הוא העיקר. שחרה, הפסגה הגבוהה בגאורגיה בגובה 5,193 מטר, מתנשאת ממש מאחורי הכפרים וסוגרת את העמק.
    על גבעה נמוכה מעל ז'יביאני עומדת כנסיית למריה, מבנה קטן מן המאה ה-12 ובו ציורי קיר ששרדו ומגדל הגנה
    משלו. בצ'אז'אשי מציג מוזיאון אתנוגרפי איקונות, כלי נשק וחפצי בית.


    דברים שכדאי לדעת מראש: **בחורף הכפר מנותק לא פעם** — שלג עשוי לחסום את הדרך לשבועות; **הקטע האחרון
    ממסטיה אינו סלול** והוא מחייב באמת רכב עם גובה גחון; **השירותים מזעריים** — קומץ בתי הארחה, בתי קפה
    קטנים, בלי כספומט. אושגולי אינו אטרקציה ארוזה, וזה בדיוק ערכו. הוא נותר כפר עובד: אנשים עדיין מגדלים
    בקר וקוצרים חציר על אותם מדרונות שמשפחותיהם עיבדו לפני יותר ממאה שנה, בעוד המבקרים מהלכים בין המגדלים.
  tip: >-
    צאו ממסטיה בבוקר, לפני 09:00 — זו נסיעה של שעתיים לכל כיוון ואינכם רוצים לנהוג בחצץ בחזרה בחשכה. הליכה
    בארבעת הכפרים אורכת שעתיים עד שלוש, ועוד כארבעים דקות לטיפוס אל כנסיית למריה. התלבשו בצניעות בתוך
    הכנסייה: מטפחת ראש וחצאית ארוכה לנשים. החנו במגרש המסומן בכניסה לכפר והמשיכו ברגל, שכן הסמטאות צרות
    והבהמות מסתובבות חופשי. הביאו מזומן; השירותים נמצאים בבתי הקפה.
  route: >-
    אושגולי מרוחק כ-515 ק"מ מטביליסי, ומשמעות הדבר בפועל היא גישה בת יומיים עם לינה במסטיה. ממסטיה זה
    45–47 ק"מ וכשעתיים: אספלט בהתחלה, ואחר כך דרך חצץ ואבן החוצה את הנהר כמה פעמים ומידרדרת מאוד אחרי
    גשם. בדיוק משום כך נדרש כאן רכב עם גובה גחון — רכב נמוך אינו בטוח בקטע הזה וגם אינו מכוסה בביטוח ההשכרה.
    הדלק האחרון הוא במסטיה, אז מלאו את המיכל לפני היציאה ובדקו את מזג האוויר, שכן גשם כבד עשוי להאט את
    המעברות.
ar:
  name: أوشغولي
  short: >-
    من أعلى المستوطنات المأهولة دائماً في أوروبا على ارتفاع 2,100 م تحت جبل شخارا — مدرجة في اليونسكو
    ضمن سفانيتي العليا.
  body: >-
    أوشغولي اسم جامع لأربع قرى متجاورة — تشاجاشي وتشفيبياني وجيبياني ومورقميلي — تقوم عند رأس وادي إنغوري
    على ارتفاع نحو 2,100 متر. وكثيراً ما توصف بأنها من أعلى الأماكن المأهولة دائماً في أوروبا. ومنذ عام
    1996 وهي مدرجة على قائمة التراث العالمي لليونسكو ضمن موقع سفانيتي العليا؛ وما يُحمى ليس أثراً واحداً
    بل نمط الاستيطان التاريخي كله، بأبراجه وبيوته ومروج الحشيش فيه.


    والمنظر هو الحدث الأكبر. فشخارا، أعلى قمم جورجيا عند 5,193 متراً، ترتفع خلف القرى مباشرة وتغلق الوادي.
    وعلى تل منخفض فوق جيبياني تقف كنيسة لاماريا، وهي بناء صغير من القرن الثاني عشر بقيت فيه رسوم جدارية
    وله برج دفاعي خاص. وفي تشاجاشي يعرض متحف إثنوغرافي أيقونات وأسلحة وأدوات منزلية.


    أمور يحسن معرفتها مسبقاً: **في الشتاء تُعزل القرية غالباً** — إذ قد يغلق الثلج الطريق أسابيع متصلة؛
    و**المقطع الأخير من ميستيا غير معبّد** ويحتاج فعلاً سيارة عالية الخلوص؛ و**الخدمات في حدها الأدنى**
    — حفنة بيوت ضيافة ومقاهٍ صغيرة ولا جهاز صراف. أوشغولي ليست معلماً سياحياً مغلَّفاً، وهذه بالضبط قيمتها.
    فهي تبقى قرية عاملة: لا يزال الناس يربون الماشية ويحصدون الحشيش على المنحدرات نفسها التي عملت فيها
    عائلاتهم قبل أكثر من قرن، بينما يتمشى الزوار بين الأبراج.
  tip: >-
    غادر ميستيا صباحاً قبل 09:00 — فالمسافة ساعتان في كل اتجاه ولا تريد قيادة الطريق الحصوي عائداً في
    الظلام. يستغرق التجول في القرى الأربع ساعتين إلى ثلاث، إضافة إلى نحو أربعين دقيقة لصعود كنيسة لاماريا.
    والبس بحشمة داخل الكنيسة: غطاء رأس وتنورة طويلة للنساء. اركن في الساحة المعلَّمة عند مدخل القرية وواصل
    سيراً، فالأزقة ضيقة والمواشي تسرح بحرية. احمل نقداً؛ ودورات المياه في المقاهي.
  route: >-
    تبعد أوشغولي نحو 515 كم عن تبليسي، وهو ما يعني واقعياً وصولاً على يومين مع مبيت في ميستيا. ومن ميستيا
    المسافة 45–47 كم ونحو ساعتين: إسفلت في البداية، ثم طريق حصوي حجري يعبر النهر مرات عدة ويسوء بشدة بعد
    المطر. ولهذا بالضبط تُشترط هنا سيارة عالية الخلوص — فالسيارة المنخفضة ليست آمنة في هذا المقطع ولا
    يغطيها تأمين الإيجار. آخر وقود في ميستيا، فاملأ الخزان قبل الانطلاق وتحقق من الطقس، إذ قد يبطئ المطر
    الغزير عبور المخاضات.
