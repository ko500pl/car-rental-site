ka:
  name: თიანეთი
  short: >-
    წიწვოვანი ტყით შემოსაზღვრული მაღალმთიანი ქვაბული ივრის სათავეებთან, თბილისელების ტრადიციული საზაფხულო
    თავშესაფარი.
  body: >-
    **თიანეთი მცხეთა-მთიანეთის ის ნაწილია, რომელსაც თითქმის არცერთი ტურისტი არ ხედავს**, და მიზეზი პატიოსანია:
    აქ არ დგას ერთი ძეგლი, რომლისთვისაც ქვეყანა უნდა გადაკვეთო. სამაგიეროდ არის ფართო, წყნარი ქვაბული
    1100 მეტრზე, ფიჭვისა და წიფლის ტყით შემოვლებული, ივრის ზემო წელზე — მდინარისა, რომელიც ასობით კილომეტრში,
    კახეთის ნახევრადუდაბნოში დაასრულებს გზას.


    ქალაქი პატარაა, დაბალი და საბჭოთა გეგმარებით: ცენტრალური მოედანი, დილით მომუშავე ბაზარი და გრძელი
    მთავარი ქუჩა. თბილისურ ოჯახებს აქ თაობებია საზაფხულო სახლები აქვთ, რადგან ქვაბულში გრილი და მშრალი
    ჰაერი დგას მაშინ, როცა დედაქალაქში ოცდათხუთმეტი გრადუსია. სწორედ ეს არის მოსვლის ნამდვილი მიზეზი:
    აქ სუნთქავ, ტყეში დადიხარ და ჭამ, სანახაობებს კი არ ითვლი.


    რის გარშემოც დღის აწყობა ღირს:


    - სიონის წყალსაცავი ქალაქის სამხრეთით — ივრზე გაშლილი მწვანე წყლის ტბა, თევზაობით, უხეში სანაპირო
    გზებით და პრაქტიკულად აუთვისებელი ნაპირით


    - ფიჭვისა და წიფლის ტყეები ირგვლივ ქედებზე, სატყეო გზებით, სადაც სიარული მარტივია და სექტემბერ-ოქტომბერში
    სოკო ბევრია


    - ბოჭორმის ციხის ნანგრევები ივრის ქვემოთ, გორაზე — X საუკუნის ძეგლი, გალავანში გუმბათოვანი ეკლესიის
    ნაშთით


    - თავად გზა, რომელიც ნამდვილი ატრაქციონია: ჟინვალიდან მომავალი მარშრუტი ტყიან ქედს გრძელი მოსახვევებით
    კვეთს და თითქმის უმანქანოა


    ზამთარში თიანეთი თხელდება და ის, რაც აგვისტოში ღიაა, იკეტება. სექტემბრის ბოლო, როცა წიფელი ფერს იცვლის
    და ჰაერი მკვეთრდება, ალბათ წლის საუკეთესო კვირაა.
  tip: >-
    რეალურად ნახევარი დღეა და საუკეთესოდ გზასთან ერთად მუშაობს, და არა როგორც ცალკე დანიშნულება. მთავარ
    ქუჩაზე საოჯახო სასტუმროები და რამდენიმე კაფეა, მაგრამ აგვისტოში წინასწარ დაჯავშნე; ზაფხულის გარეთ
    არჩევანი თითქმის ნულამდე ეცემა. წყალსაცავისა და ბოჭორმის გზები მოუასფალტებელი და ღარტაფებიანია — მშრალ
    ამინდში ჩვეულებრივი მანქანით მისადგომია, წვიმის შემდეგ ცუდი. გვერდით ხეობებში მობილური კავშირი წყვეტილია.
    ნაღდი ფული თან იქონიე: ცენტრს გარეთ ბარათით გადახდა არასაიმედოა.
  route: >-
    ორი მარშრუტი მუშაობს. უფრო მარტივი თბილისიდან კახეთის გზით გადის, უჯარმასთან ჩრდილოეთით ივრის ხეობაში
    უხვევს და მდინარეს სიონის წყალსაცავზე გავლით აჰყვება — დაახლოებით 80 კმ და საათი და ორმოცი წუთი, ცვალებადი
    ხარისხის ასფალტზე. ალტერნატივა ჟინვალთან საქართველოს სამხედრო გზიდან აღმოსავლეთით ტოტდება და ტყიან
    ქედს კვეთს: მსგავსი მანძილი, მაგრამ უფრო ნელი, ვიწრო და გაცილებით ცარიელი. საწვავი წინასწარ საგარეჯოში
    ან ჟინვალში აიღე — თიანეთში სადგურები ცოტაა. მშრალ ამინდში ორივე გზას ეკონომ-კლასის მანქანა უმკლავდება.
en:
  name: Tianeti
  short: >-
    A quiet upland basin ringed by pine and beech forest on the upper Iori, a traditional summer refuge
    for Tbilisi families.
  body: >-
    **Tianeti is the part of Mtskheta-Mtianeti that almost no visitor sees,** and the reason is honest
    enough: there is no single monument here worth crossing the country for. What there is instead is
    a wide, quiet upland basin at 1,100 metres, ringed by pine and beech forest, on the upper Iori — a
    river that will end its journey hundreds of kilometres away in the semi-desert of Kakheti.


    The town is small, low and Soviet in plan: a central square, a market that runs in the mornings, and
    one long main street. Tbilisi families have kept summer houses here for generations, because the basin
    holds cool dry air while the capital sits at thirty-five degrees. That is the real reason to come
    — to breathe, walk in forest and eat, rather than to tick off sights.


    Things worth building a day around:


    - the Sioni reservoir south of the town, a long green-water lake on the Iori with fishing, rough shoreline
    tracks and almost no development


    - the pine and beech forest on the surrounding ridges, laced with logging tracks that make easy walking
    and good mushroom ground in September and October


    - the ruined fortress of Bochorma on a hill further down the Iori, a 10th-century site with the remains
    of a domed church inside its walls


    - the drive itself, which is the real attraction: the road in from Zhinvali crosses a wooded ridge
    in a long series of curves with almost no traffic on it


    Tianeti thins out in winter and much of what is open in August closes. Late September, when the beech
    turns and the air sharpens, is probably the best week of the year here.
  tip: >-
    Half a day is realistic, and it works best as part of a drive rather than as a destination on its
    own. There are guesthouses and a couple of cafés on the main street, but book ahead in August; outside
    summer the choice shrinks to almost nothing. The roads to the reservoir and to Bochorma are unsurfaced
    and rutted — fine in dry weather in a normal car, poor after rain. Mobile coverage is patchy in the
    side valleys. Bring cash, because card payment outside the town centre is unreliable.
  route: >-
    Two routes work. The simpler leaves Tbilisi on the Kakheti highway, turns north into the Iori valley
    near Ujarma and follows the river up past the Sioni reservoir — about 80 km and an hour and forty
    minutes on asphalt of varying quality. The alternative branches east off the Georgian Military Highway
    at Zhinvali and crosses a wooded ridge: a similar distance but slower, narrower and far emptier. Take
    fuel in Sagarejo or Zhinvali before you commit, as stations in Tianeti are few. An economy car handles
    either route in dry weather.
ru:
  name: Тианети
  short: >-
    Тихая горная котловина в окружении соснового и букового леса на верхнем Иори, традиционное летнее
    убежище тбилисцев.
  body: >-
    **Тианети — та часть Мцхета-Мтианети, которую почти не видит ни один турист,** и причина честная:
    здесь нет ни одного памятника, ради которого стоит пересекать страну. Зато есть широкая тихая котловина
    на высоте 1100 метров, окружённая сосновым и буковым лесом, на верхнем Иори — реке, которая закончит
    путь за сотни километров отсюда, в полупустыне Кахети.


    Городок маленький, низкий и советский по планировке: центральная площадь, рынок, работающий по утрам,
    и одна длинная главная улица. Тбилисские семьи держат здесь летние дома поколениями, потому что в
    котловине стоит прохладный сухой воздух, когда в столице тридцать пять. Это и есть настоящая причина
    приехать: дышать, ходить по лесу и есть, а не считать достопримечательности.


    Вокруг чего стоит выстроить день:


    - Сионское водохранилище к югу от города — вытянутое озеро зелёной воды на Иори, с рыбалкой, грунтовыми
    дорогами по берегу и почти без застройки


    - сосновые и буковые леса на окрестных хребтах, изрезанные лесовозными дорогами: ходить легко, а в
    сентябре и октябре здесь много грибов


    - развалины крепости Бочорма на холме ниже по Иори — памятник X века с остатками купольного храма
    внутри стен


    - сама дорога, которая и есть главный аттракцион: путь от Жинвали пересекает лесистый хребет длинной
    чередой поворотов и почти без встречных машин


    Зимой Тианети пустеет, и многое из того, что открыто в августе, закрывается. Конец сентября, когда
    бук желтеет, а воздух становится резким, — вероятно, лучшая неделя года.
  tip: >-
    Реально это полдня, и лучше всего это работает как часть маршрута, а не как самостоятельная цель.
    На главной улице есть гостевые дома и пара кафе, но в августе бронируйте заранее: вне лета выбор сжимается
    почти до нуля. Дороги к водохранилищу и к Бочорме грунтовые и разбитые — в сухую погоду проходимы
    на обычной машине, после дождя плохи. Мобильная связь в боковых ущельях прерывистая. Берите наличные:
    за пределами центра оплата картой ненадёжна.
  route: >-
    Работают два маршрута. Простой уходит из Тбилиси по кахетинской трассе, у Уджармы сворачивает на север
    в долину Иори и поднимается вдоль реки мимо Сионского водохранилища — около 80 км и час сорок по асфальту
    разного качества. Второй ответвляется на восток от Военно-Грузинской дороги у Жинвали и пересекает
    лесистый хребет: расстояние похожее, но медленнее, уже и гораздо пустыннее. Заправляйтесь в Сагареджо
    или Жинвали заранее — в Тианети колонок мало. В сухую погоду обе дороги по силам машине эконом-класса.
fa:
  name: تیانتی
  short: گودالی کوهستانی و آرام میان جنگل کاج و راش در سرچشمهٔ ایوری، پناهگاه تابستانی دیرین خانواده‌های
    تفلیسی.
  body: >-
    **تیانتی آن بخش از متسختا-متیانتی است که تقریباً هیچ گردشگری آن را نمی‌بیند،** و دلیلش هم صادقانه
    است: اینجا هیچ بنای یگانه‌ای نیست که ارزش پیمودن کشور را داشته باشد. در عوض گودالی پهن و آرام در ارتفاع
    1100 متر هست، حلقه‌زده در جنگل کاج و راش، بر سرچشمهٔ ایوری؛ رودی که سرانجام صدها کیلومتر آن‌سوتر در
    نیمه‌بیابان کاختی به پایان می‌رسد.


    شهر کوچک است و کوتاه و با طرح شوروی: میدانی مرکزی، بازاری که صبح‌ها کار می‌کند و یک خیابان اصلی دراز.
    خانواده‌های تفلیسی نسل‌هاست خانهٔ تابستانی در اینجا نگه داشته‌اند، چون در این گودال هوای خنک و خشک
    می‌ماند در حالی که پایتخت سی‌وپنج درجه است. همین دلیل واقعی آمدن است: نفس کشیدن، قدم زدن در جنگل و
    خوردن، نه شمردن دیدنی‌ها.


    آنچه می‌توان روزی را گرد آن چید:


    - آبگیر سیونی در جنوب شهر، دریاچه‌ای دراز با آب سبز بر ایوری، با ماهیگیری و راه‌های خاکی کرانه و تقریباً
    بدون ساخت‌وساز


    - جنگل کاج و راش بر یال‌های پیرامون، با راه‌های چوب‌بری که پیاده‌روی را آسان می‌کند و در مهر و آبان
    زمین خوبی برای قارچ است


    - ویرانه‌های دژ بوچورما بر تپه‌ای پایین‌تر در امتداد ایوری، محوطه‌ای از سدهٔ دهم با بازمانده‌های کلیسایی
    گنبددار درون دیوارها


    - خود جاده، که جاذبهٔ اصلی است: راه ورودی از ژینوالی یالی جنگلی را با رشته‌ای دراز از پیچ‌ها می‌برد
    و تقریباً خالی از خودرو است


    تیانتی در زمستان خلوت می‌شود و بسیاری از آنچه در مرداد باز است بسته می‌شود. اواخر شهریور، وقتی راش
    رنگ می‌گیرد و هوا تیز می‌شود، احتمالاً بهترین هفتهٔ سال اینجاست.
  tip: >-
    نیم روز واقع‌بینانه است و بهتر است بخشی از یک سفر جاده‌ای باشد تا مقصدی مستقل. در خیابان اصلی خانه‌های
    مهمان و چند کافه هست، اما در مرداد از پیش رزرو کنید؛ بیرون از تابستان گزینه‌ها تقریباً به صفر می‌رسد.
    راه‌های آبگیر و بوچورما خاکی و پرچاله است؛ در هوای خشک با خودروی معمولی می‌شود رفت و پس از باران بد
    است. آنتن‌دهی در دره‌های فرعی بریده‌بریده است. پول نقد همراه ببرید، چون بیرون از مرکز شهر پرداخت با
    کارت قابل اتکا نیست.
  route: >-
    دو مسیر کار می‌کند. ساده‌تر از تفلیس روی بزرگراه کاختی می‌رود، نزدیک اوجارما به شمال و به درهٔ ایوری
    می‌پیچد و رود را از کنار آبگیر سیونی بالا می‌رود — حدود 80 کیلومتر و یک ساعت و چهل دقیقه روی آسفالتی
    با کیفیت متغیر. مسیر دیگر نزد ژینوالی از بزرگراه نظامی گرجستان به شرق جدا می‌شود و یالی جنگلی را می‌برد:
    مسافتی مشابه اما کندتر و باریک‌تر و بسیار خلوت‌تر. پیش از راه افتادن در ساگارجو یا ژینوالی سوخت بگیرید،
    چون پمپ بنزین در تیانتی کم است. در هوای خشک خودروی اقتصادی از پس هر دو مسیر برمی‌آید.
he:
  name: טיאנטי
  short: אגן הררי שקט מוקף יער אורן ואשור על האיורי העליון, מקלט קיץ מסורתי של משפחות מטביליסי.
  body: >-
    **טיאנטי היא החלק של מצחתה-מתיאנטי שכמעט שום מבקר אינו רואה,** והסיבה הוגנת: אין כאן מונומנט אחד שכדאי
    לחצות בעבורו את המדינה. במקומו יש אגן הררי רחב ושקט בגובה 1,100 מטר, מוקף יער אורן ואשור, על האיורי
    העליון — נהר שיסיים את דרכו מאות קילומטרים משם, במדבר-למחצה של קאחתי.


    העיירה קטנה, נמוכה וסובייטית בתכנון: כיכר מרכזית, שוק שפועל בבקרים ורחוב ראשי אחד ארוך. משפחות מטביליסי
    מחזיקות כאן בתי קיץ מזה דורות, כי באגן נשמר אוויר קריר ויבש בזמן שבבירה שלושים וחמש מעלות. זו הסיבה
    האמיתית לבוא: לנשום, ללכת ביער ולאכול, ולא לסמן אתרים.


    סביב מה כדאי לבנות יום:


    - מאגר סיוני מדרום לעיירה, אגם ארוך של מים ירוקים על האיורי, עם דיג, דרכי עפר לאורך החוף וכמעט בלי
    בנייה


    - יערות האורן והאשור ברכסים שמסביב, חרושים דרכי כריתה שההליכה בהן קלה, ובספטמבר ובאוקטובר הן קרקע
    פטריות טובה


    - חורבות מצודת בוצ׳ורמה על גבעה במורד האיורי, אתר מן המאה העשירית ובו שרידי כנסייה בעלת כיפה בתוך
    החומות


    - הנסיעה עצמה, שהיא האטרקציה האמיתית: הדרך מז׳ינוואלי חוצה רכס מיוער בסדרה ארוכה של סיבובים וכמעט
    בלי תנועה


    בחורף טיאנטי מתרוקנת והרבה ממה שפתוח באוגוסט נסגר. סוף ספטמבר, כשהאשור מחליף צבע והאוויר מתחדד, הוא
    כנראה השבוע הטוב בשנה כאן.
  tip: >-
    חצי יום הוא ריאלי, וזה עובד טוב יותר כחלק ממסלול נסיעה מאשר כיעד בפני עצמו. ברחוב הראשי יש בתי הארחה
    וכמה בתי קפה, אך באוגוסט הזמינו מראש; מחוץ לקיץ המבחר מצטמצם כמעט לאפס. הדרכים אל המאגר ואל בוצ׳ורמה
    אינן סלולות ומחורצות — סבירות במזג אוויר יבש ברכב רגיל וגרועות אחרי גשם. הקליטה הסלולרית בערוצי הצד
    לא רציפה. קחו מזומן, כי מחוץ למרכז העיירה תשלום בכרטיס אינו אמין.
  route: >-
    שני מסלולים עובדים. הפשוט יוצא מטביליסי בכביש קאחתי, פונה צפונה אל עמק האיורי ליד אוג׳רמה ועולה לאורך
    הנהר על פני מאגר סיוני — כ-80 ק״מ ושעה וארבעים על אספלט באיכות משתנה. השני מסתעף מזרחה מכביש הצבא
    הגאורגי בז׳ינוואלי וחוצה רכס מיוער: מרחק דומה אך איטי, צר וריק בהרבה. תדלקו בסאגארג׳ו או בז׳ינוואלי
    מראש, שכן בטיאנטי יש מעט תחנות. במזג אוויר יבש רכב חסכוני מתמודד עם שני המסלולים.
ar:
  name: تيانيتي
  short: حوض جبلي هادئ يطوقه غاب الصنوبر والزان على أعالي نهر إيوري، ملاذ صيفي تقليدي لعائلات تبليسي.
  body: >-
    **تيانيتي هي الجزء من متسخيتا-متيانيتي الذي لا يكاد يراه زائر،** والسبب صريح: لا يوجد هنا أثر واحد
    يستحق أن تقطع البلاد من أجله. لكن فيها حوضاً جبلياً واسعاً هادئاً على ارتفاع 1100 متر، يطوقه غاب الصنوبر
    والزان، على أعالي نهر إيوري؛ وهو نهر سينتهي به المسير على بعد مئات الكيلومترات في شبه صحراء كاخيتي.


    البلدة صغيرة ومنخفضة وسوفييتية التخطيط: ساحة مركزية، وسوق يعمل صباحاً، وشارع رئيسي طويل واحد. تحتفظ
    عائلات تبليسي هنا ببيوت صيفية منذ أجيال، لأن الحوض يحبس هواءً بارداً جافاً بينما العاصمة عند خمس وثلاثين
    درجة. وهذا هو السبب الحقيقي للمجيء: أن تتنفس وتمشي في الغابة وتأكل، لا أن تعدّ المعالم.


    ما يستحق أن تبني يوماً حوله:


    - خزان سيوني جنوبي البلدة، بحيرة طويلة خضراء الماء على إيوري، فيها صيد ودروب ترابية على الضفة ولا
    عمران يُذكر


    - غابات الصنوبر والزان على السلاسل المحيطة، تتخللها طرق قطع الأخشاب فيسهل المشي فيها، وهي أرض فطر
    جيدة في أيلول وتشرين الأول


    - أطلال قلعة بوتشورما على تلة أسفل مجرى إيوري، وهو موقع من القرن العاشر فيه بقايا كنيسة مقببة داخل
    الأسوار


    - الطريق نفسه، وهو الجاذبية الحقيقية: الطريق القادم من جينفالي يقطع سلسلة مشجرة بسلسلة طويلة من المنعطفات
    وبلا حركة سير تقريباً


    تخف تيانيتي في الشتاء ويُغلق كثير مما يفتح في آب. وأواخر أيلول، حين يتغير لون الزان ويحتد الهواء،
    هو على الأرجح أفضل أسبوع في السنة هنا.
  tip: >-
    نصف يوم واقعي، ويصلح أكثر كجزء من رحلة بالسيارة لا كمقصد قائم بذاته. في الشارع الرئيسي بيوت ضيافة
    ومقهيان أو ثلاثة، لكن احجز مسبقاً في آب؛ وخارج الصيف يتقلص الخيار إلى لا شيء تقريباً. الطرق إلى الخزان
    وإلى بوتشورما ترابية ومحفرة، لا بأس بها في الجو الجاف بسيارة عادية وسيئة بعد المطر. وتغطية الهاتف
    متقطعة في الأودية الجانبية. واحمل نقداً، فالدفع بالبطاقة خارج مركز البلدة غير موثوق.
  route: >-
    يعمل مساران. الأبسط يخرج من تبليسي على طريق كاخيتي، وينعطف شمالاً إلى وادي إيوري قرب أوجارما ثم يصعد
    مع النهر بمحاذاة خزان سيوني — نحو 80 كم وساعة وأربعين دقيقة على إسفلت متفاوت الجودة. والآخر يتفرع
    شرقاً عن الطريق العسكري الجورجي عند جينفالي ويقطع سلسلة مشجرة: مسافة مشابهة لكنه أبطأ وأضيق وأخلى
    بكثير. تزود بالوقود في ساغاريجو أو جينفالي قبل الانطلاق، فمحطات تيانيتي قليلة. وفي الجو الجاف تتدبر
    سيارة اقتصادية أياً من المسارين.
