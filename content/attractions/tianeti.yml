ka:
  name: თიანეთი
  short: >-
    გრილი ქვაბული ივრის ზემო წელზე, სადაც ოდესღაც კახეთის მმართველები სახლობდნენ; ახლოს — სოფლების დამფარავი
    წყალსაცავი და ბოჭორმის ციხე.
  body: >-
    **თიანეთში თბილისი ამოსასუნთქად ამოდის.** დაბა ივრის ზემო წელზე, მდინარის მარჯვენა ნაპირას, ფართო
    ქვაბულში გაშლილა, ზღვის დონიდან 1100 მეტრზე. როცა დედაქალაქი ხვატით იწვის, აქ აგვისტოს საშუალო ტემპერატურა
    18,5 გრადუსია, ქართული საცნობარო წყაროები კი თიანეთს ადგილობრივი მნიშვნელობის კურორტად მოიხსენიებენ,
    ფილტვებისთვის სასიკეთო ჰაერით. თავად დაბა პატარა, დაბალი და წყნარია და თავის მოწონებას არავის უპირებს.


    ოდესღაც ამის ყველა საფუძველი ჰქონდა. X–XI საუკუნეებში თიანეთი ქართლიდან სომხეთ-ალბანეთისა და ჩრდილო
    კავკასიისკენ მიმავალ გზებს დარაჯობდა, ერთ ხანს კი, ბოჭორმის შემდეგ, კახეთის მმართველთა სამყოფელიც
    იყო. ბაგრატ IV-მ თიანეთი აიღო და კახთა მეფის, კვირიკე III-ის დიდებული სასახლე — „დარბაზი ბოდოჯისა“
    — გადაწვა, რის შემდეგაც კახეთის კარი თელავში გადავიდა. დაბის ჩრდილო-დასავლეთით დღესაც დგას XI საუკუნის
    ცხრაკარის სასახლის ნანგრევები.


    თიანეთის ყველაზე ნაზი ამბავიც სამეფოა. იოანე ბატონიშვილის ცნობით, როცა ლაშა გიორგის სატრფო, ველისციხელი
    გლეხის ქალი სუსნა — რომელზეც მეფეს დიდებულებმა ქორწინება არ დართეს — 1207 წლის 20 აგვისტოს გარდაიცვალა,
    მეფემ თიანეთს მიაშურა და მისი დაკრძალვა ნოკორნის ეკლესიაში ბრძანა.


    რისთვისაც ღირს აქ მთელი დღის დათმობა:


    - სიონის წყალსაცავი — 1963 წელს ექსპლუატაციაში შესული, 12,8 კვადრატული კილომეტრი მწვანე წყალი, რომელმაც
    საყარაულო, ჯიგო, უკუღმართი და სხვა სოფლები დაფარა

    - ბოჭორმის ციხე — სიონიდან 14 კილომეტრში, სამხრეთ-აღმოსავლეთით, ივრის მარცხენა ნაპირზე: პირველად X
    საუკუნის დასაწყისში იხსენიება, 1010 წელს ბაგრატ III-მ აიღო, XVIII საუკუნეში კი ერეკლე II-მ აღადგინა
    და ზარბაზნები ჩააყენა; შიდა ციხეში წმინდა გიორგის გუმბათოვანი ეკლესია დგას

    - პოეტ მირზა გელოვანის მუზეუმი დაბაში


    სექტემბრის ბოლოს ჩამოდით, როცა ქედებზე წიფელი ფერს იცვლის და პირველი ყინვიანი დილები ჰაერს ბროლივით
    წმენდს.
  tip: >-
    დაბასა და წყალსაცავს ნახევარი დღე ეყოფა, ბოჭორმასთან ერთად კი მთელი დღე დაგჭირდებათ. ციხე ცალკე გასვლაა:
    გვერდითი გზა (შ142) თიანეთის გზას წყალსაცავის სამხრეთით სცილდება და ძეგლამდე დაახლოებით 24 კილომეტრს
    გადის, დიდწილად მოუასფალტებელს, წვიმის შემდეგ კი ცუდს — ცალ მხარეს თითქმის საათი გაითვალისწინეთ. მთავარ
    ქუჩაზე საოჯახო სასტუმროები და ორიოდე კაფეა; აგვისტოში წინასწარ დაჯავშნეთ. ზამთარი მკაცრია — აქ ყინვა
    −34 გრადუსამდეც დაფიქსირებულა — და ბევრი რამ იკეტება. გვერდით ხეობებში მობილური კავშირი წყდება, ნაღდი
    ფული კი ბარათზე საიმედოა.
  route: >-
    ორი გზაა, თითოეული დაახლოებით 80 კილომეტრი. პირდაპირი, შ30, თბილისიდან გლდანის გავლით გადის, ჩრდილო-აღმოსავლეთით
    გორაკებს გადაკვეთს და სიონის წყალსაცავს გვერდით ჩაუვლის — დაახლოებით საათი და ორმოცი წუთი, სხვადასხვა
    ხარისხის ასფალტზე. მეორე საქართველოს სამხედრო გზით (ს3/E117) ჟინვალამდე მიდის, იქიდან კი აღმოსავლეთით,
    შ27-ზე უხვევს და ზარიძეების გავლით ტყიან ქედს გადადის: დრო მსგავსია, გზა — უფრო ვიწრო და ცარიელი,
    შემოდგომით კი განსაკუთრებით ლამაზი. საწვავი თბილისში ან ჟინვალში ჩაასხით — თიანეთში ბენზინგასამართი
    სადგური ცოტაა. მშრალ ამინდში ორივე გზას ეკონომკლასის მანქანა უმკლავდება; წვიმის შემდეგ ბოჭორმისთვის
    ჯიპი აჯობებს.
en:
  name: Tianeti
  short: >-
    A cool upland basin on the upper Iori where Kakhetian rulers once held court, with a reservoir over
    drowned villages and Bochorma fortress downriver.
  body: >-
    **Tianeti is where Tbilisi comes to breathe.** The town lies in a broad basin at 1,100 metres on the
    right bank of the upper Iori, and while the capital bakes, August here averages a mild 18.5°C; Georgian
    reference works list it as a local resort for the lungs. It is small, low and quiet, and makes no
    effort to impress.


    It once had every reason to. In the 10th and 11th centuries Tianeti watched the roads from Kartli
    towards Armenia and Caucasian Albania and over the mountains to the North Caucasus, and for a time,
    after Bochorma, it served the rulers of Kakheti as their seat. King Bagrat IV took the town and burned
    the palace of Kvirike III, remembered as the "Hall of Bodoji", and the Kakhetian court moved on to
    Telavi. North-west of the town the ruins of Tskhrakari, an 11th-century palace, still stand.


    The tenderest story here is a royal one. Prince Ioane Bagrationi recorded that when Susna, the peasant
    girl from Velistsikhe whom King Lasha Giorgi loved but was not allowed by his nobles to marry, died
    on 20 August 1207, the king rode to Tianeti and ordered her buried in the church of Nokorna.


    Worth building a day around:


    - the Sioni reservoir, filled in 1963 over Sakaraulo, Jigo, Ukughmarti and other villages: 12.8 km²
    of green water

    - Bochorma fortress, 14 km south-east of Sioni on the left bank of the Iori: first recorded in the
    early 10th century, taken by Bagrat III in 1010, rearmed with cannon by Erekle II; inside stands a
    domed church of St George

    - the museum of the poet Mirza Gelovani in the town


    Come in late September, when the beech on the ridges turns and the first frosty mornings rinse the
    air clear as glass.
  tip: >-
    Half a day covers the town and the reservoir; Bochorma makes it a full day. The fortress is a separate
    outing: a side road (Sh142) leaves the Tianeti road just south of the reservoir and runs about 24
    km to the site, much of it unsurfaced and poor after rain, so allow the better part of an hour each
    way. Guesthouses and a couple of cafés line the main street; book ahead in August. Winters are hard,
    with frosts recorded down to −34°C, and much closes. Mobile signal is patchy in the side valleys,
    and cash is safer than cards.
  route: >-
    Two roads, each about 80 km. The direct one, the Sh30, leaves Tbilisi through Gldani, crosses the
    hills to the north-east and skirts the Sioni reservoir before reaching town: roughly an hour and forty
    minutes on asphalt of mixed quality. The alternative follows the Georgian Military Highway (S3/E117)
    to Zhinvali, then turns east onto the Sh27 through Zaridzeebi and over a wooded ridge: similar time,
    narrower and emptier, and lovely in autumn. Fill up in Tbilisi or Zhinvali, as stations in Tianeti
    are few. An economy car handles both in dry weather; for Bochorma after rain an SUV is the kinder
    choice.
ru:
  name: Тианети
  short: >-
    Прохладная котловина на верхнем Иори, где держали двор кахетинские правители, с водохранилищем над
    затопленными сёлами и крепостью Бочорма ниже по реке.
  body: >-
    **В Тианети Тбилиси приезжает отдышаться.** Городок лежит в широкой котловине на высоте 1100 метров,
    на правом берегу верхнего Иори, и пока столица плавится от жары, средняя температура августа здесь
    — мягкие 18,5 °C; грузинские справочники числят его местным курортом для лёгочных больных. Он маленький,
    приземистый и тихий и нисколько не старается понравиться.


    А ведь когда-то было чем гордиться. В X–XI веках Тианети стерёг дороги из Картли в Армению и Кавказскую
    Албанию и через горы на Северный Кавказ, а после Бочормы какое-то время служил резиденцией кахетинских
    правителей. Царь Баграт IV взял город и сжёг дворец Квирике III, оставшийся в памяти как «Палата Бододжи»,
    и кахетинский двор перебрался в Телави. К северо-западу от города до сих пор стоят руины Цхракари
    — дворца XI века.


    Самая нежная здешняя история — царская. Царевич Иоане Багратиони записал, что когда 20 августа 1207
    года умерла Сусна — крестьянская девушка из Велисцихе, которую любил царь Лаша-Георгий, но жениться
    на которой ему не позволили вельможи, — царь приехал в Тианети и велел похоронить её в церкви Нокорна.


    Ради чего стоит выделить целый день:


    - Сионское водохранилище, заполненное в 1963 году поверх Сакарауло, Джиго, Укугмарти и других сёл:
    12,8 км² зелёной воды

    - крепость Бочорма в 14 км к юго-востоку от Сиони, на левом берегу Иори: впервые упомянута в начале
    X века, взята Багратом III в 1010 году, при Ираклии II заново вооружена пушками; внутри стоит купольная
    церковь Святого Георгия

    - музей поэта Мирзы Геловани в самом городе


    Приезжайте в конце сентября, когда бук на хребтах желтеет, а первые морозные утра промывают воздух
    до стеклянной прозрачности.
  tip: >-
    На город и водохранилище хватит полдня, с Бочормой получится целый день. Крепость — отдельная поездка:
    боковая дорога (Sh142) отходит от тианетской трассы чуть южнее водохранилища и тянется до цели около
    24 км, по большей части без асфальта и скверно после дождя, так что закладывайте почти час в каждую
    сторону. На главной улице есть гостевые дома и пара кафе; в августе бронируйте заранее. Зимы суровые
    — морозы доходили до −34 °C, — и многое закрывается. Мобильная связь в боковых долинах неустойчива,
    а наличные надёжнее карты.
  route: >-
    Две дороги, обе около 80 км. Прямая, Sh30, выходит из Тбилиси через Глдани, переваливает холмы на
    северо-восток и огибает Сионское водохранилище перед самым городом: примерно час сорок по асфальту
    переменного качества. Другой вариант — по Военно-Грузинской дороге (S3/E117) до Жинвали, затем на
    восток по Sh27 через Заридзеэби и через лесистый хребет: по времени то же самое, но дорога у́же и
    пустыннее, а осенью особенно хороша. Заправляйтесь в Тбилиси или Жинвали — в Тианети колонок мало.
    В сухую погоду обе дороги по силам машине эконом-класса; к Бочорме после дождя бережнее ехать на внедорожнике.
fa:
  name: تیانتی
  short: >-
    حوضه‌ای خنک و مرتفع بر ایوری علیا که روزگاری دربار فرمانروایان کاختی بود، با دریاچه‌ای بر روستاهای
    غرق‌شده و دژ بوچورما در پایین‌دست رود.
  body: >-
    **تیانتی جایی است که تفلیس برای نفس کشیدن به آن پناه می‌آورد.** این شهرک در حوضه‌ای پهن، در ارتفاع
    ۱۱۰۰ متری و بر کرانهٔ راست ایوری علیا گسترده است، و در حالی که پایتخت در گرما می‌سوزد، میانگین دمای
    اوت اینجا ۱۸٫۵ درجهٔ ملایم است؛ منابع مرجع گرجی آن را استراحتگاهی محلی برای بیماری‌های ریوی شمرده‌اند.
    کوچک و کم‌ارتفاع و آرام است، و هیچ کوششی برای خودنمایی نمی‌کند.


    روزگاری همهٔ دلایل خودنمایی را داشت. در سده‌های دهم و یازدهم، تیانتی راه‌های کارتلی به ارمنستان و
    آلبانیای قفقاز و گذرگاه‌های کوهستانی به قفقاز شمالی را زیر نظر داشت، و مدتی پس از بوچورما مقر فرمانروایان
    کاختی بود. باگرات چهارم، شاه گرجستان، شهر را گرفت و کاخ کویریکه سوم را که با نام «تالار بودوجی» به
    یاد مانده به آتش کشید، و دربار کاختی به تلاوی کوچید. در شمال‌غربی شهر، ویرانه‌های تسخراکاری، کاخی
    از سدهٔ یازدهم، هنوز پابرجاست.


    لطیف‌ترین داستان اینجا داستانی شاهانه است. شاهزاده یوآنه باگراتیونی نوشته است که چون سوسنا، دختر روستایی
    اهل ولیستسیخه که شاه لاشا گیورگی دلباخته‌اش بود و اشراف اجازهٔ ازدواج با او را به شاه ندادند، در ۲۰
    اوت ۱۲۰۷ درگذشت، شاه به تیانتی آمد و فرمان داد او را در کلیسای نوکورنا به خاک بسپارند.


    جاهایی که می‌ارزد روزتان را بر گردشان بچینید:


    - مخزن سیونی که در ۱۹۶۳ بر روی ساکارائولو، جیگو، اوکوغمارتی و روستاهای دیگر آبگیری شد: ۱۲٫۸ کیلومتر
    مربع آب سبز

    - دژ بوچورما، ۱۴ کیلومتری جنوب‌شرقی سیونی بر کرانهٔ چپ ایوری: نخستین بار در آغاز سدهٔ دهم از آن یاد
    شده، باگرات سوم در ۱۰۱۰ آن را گرفت و ارکله دوم دوباره به توپ مجهزش کرد؛ درونش کلیسای گنبددار گئورگی
    قدیس ایستاده است

    - موزهٔ میرزا گلوانی، شاعر، در خود شهر


    اواخر سپتامبر بیایید، وقتی راش‌های روی یال‌ها رنگ می‌گردانند و نخستین صبح‌های یخ‌زده هوا را مثل شیشه
    صاف می‌شویند.
  tip: >-
    نیم روز برای شهر و مخزن بس است؛ با بوچورما یک روز کامل می‌شود. دژ گردشی جداگانه است: جاده‌ای فرعی
    (Sh142) کمی جنوب مخزن از جادهٔ تیانتی جدا می‌شود و حدود ۲۴ کیلومتر تا دژ می‌رود، بیشترش خاکی و پس
    از باران خراب، پس برای هر طرف نزدیک یک ساعت وقت بگذارید. در خیابان اصلی چند مهمان‌خانه و یکی دو کافه
    هست؛ در اوت از پیش رزرو کنید. زمستان‌ها سخت است، یخبندان تا ۳۴ درجه زیر صفر ثبت شده، و بیشتر جاها
    تعطیل می‌شود. آنتن موبایل در دره‌های فرعی ضعیف است و پول نقد مطمئن‌تر از کارت است.
  route: >-
    دو راه هست، هر دو حدود ۸۰ کیلومتر. راه مستقیم، Sh30، از محلهٔ گلدانی از تفلیس بیرون می‌رود، تپه‌های
    شمال‌شرقی را پشت سر می‌گذارد و پیش از رسیدن به شهر از کنار مخزن سیونی می‌گذرد: حدود یک ساعت و چهل
    دقیقه روی آسفالتی با کیفیت ناهمگون. راه دوم جادهٔ نظامی گرجستان (S3/E117) را تا ژینوالی دنبال می‌کند،
    سپس به شرق، به Sh27، می‌پیچد و از زاریدزه‌ئبی و یالی جنگلی می‌گذرد: زمانی مشابه، باریک‌تر و خلوت‌تر،
    و در پاییز دل‌انگیز. در تفلیس یا ژینوالی باک را پر کنید، چون پمپ‌بنزین در تیانتی کم است. در هوای خشک
    خودروی اقتصادی از پس هر دو راه برمی‌آید؛ برای بوچورما پس از باران، شاسی‌بلند انتخاب مهربان‌تری است.
he:
  name: טיאנטי
  short: >-
    אגן הררי קריר על האיורי העליון, שבו החזיקו פעם שליטי קאחתי את חצרם, ובו מאגר מים מעל כפרים טבועים
    ומצודת בוצ׳ורמה במורד הנהר.
  body: >-
    **לטיאנטי באה טביליסי כדי לנשום.** העיירה שוכנת באגן רחב בגובה 1,100 מטר, על הגדה הימנית של האיורי
    העליון, ובזמן שהבירה נצלית בחום, הטמפרטורה הממוצעת כאן באוגוסט היא 18.5 מעלות נעימות; ספרי עיון גאורגיים
    מונים אותה כאתר נופש מקומי לחולי ריאות. היא קטנה, נמוכה ושקטה, ואינה מתאמצת להרשים.


    פעם היו לה כל הסיבות לכך. במאות ה-10 וה-11 שמרה טיאנטי על הדרכים מקרתלי לארמניה ולאלבניה הקווקזית
    ומעבר להרים אל צפון הקווקז, ולתקופה מסוימת, אחרי בוצ׳ורמה, שימשה מושב לשליטי קאחתי. המלך בגרט הרביעי
    כבש את העיירה ושרף את ארמונו של קוויריקה השלישי, שנזכר בשם ״אולם בודוג׳י״, וחצר קאחתי עברה לטלאווי.
    מצפון-מערב לעיירה עדיין עומדות חורבות צחרקרי, ארמון מן המאה ה-11.


    הסיפור העדין ביותר כאן הוא סיפור מלכותי. הנסיך יואנה בגרטיוני תיעד כי כאשר מתה סוסנה, נערה כפרית מוולסציחה
    שהמלך לשה גיורגי אהב אך אציליו לא הרשו לו לשאתה לאישה, ב-20 באוגוסט 1207, רכב המלך לטיאנטי וציווה
    לקבור אותה בכנסיית נוקורנה.


    שווה לבנות סביבם יום:


    - מאגר סיוני, שהתמלא ב-1963 מעל סקראולו, ג׳יגו, אוקוגמרטי וכפרים נוספים: 12.8 קמ״ר של מים ירוקים

    - מצודת בוצ׳ורמה, 14 ק״מ דרומית-מזרחית לסיוני על הגדה השמאלית של האיורי: נזכרת לראשונה בראשית המאה
    ה-10, נכבשה בידי בגרט השלישי ב-1010 וצוידה מחדש בתותחים בימי ארקלה השני; בתוכה עומדת כנסיית גאורגיוס
    הקדוש בעלת כיפה

    - המוזיאון של המשורר מירזה גלובאני, בעיירה עצמה


    בואו בסוף ספטמבר, כשהאשור על הרכסים מחליף צבע ובקרי הכפור הראשונים שוטפים את האוויר עד שהוא צלול כזכוכית.
  tip: >-
    חצי יום מספיק לעיירה ולמאגר; עם בוצ׳ורמה זה יום שלם. המצודה היא טיול נפרד: דרך צדדית (Sh142) יוצאת
    מכביש טיאנטי מעט דרומית למאגר ונמשכת כ-24 ק״מ עד האתר, רובה לא סלולה וגרועה אחרי גשם, לכן הקציבו כמעט
    שעה לכל כיוון. לאורך הרחוב הראשי יש בתי הארחה וכמה בתי קפה; באוגוסט הזמינו מראש. החורפים קשים, נמדד
    כאן כפור של עד מינוס 34 מעלות, והרבה נסגר. הקליטה הסלולרית בעמקי הצד מקוטעת, ומזומן בטוח יותר מכרטיס.
  route: >-
    שתי דרכים, כל אחת כ-80 ק״מ. הישירה, Sh30, יוצאת מטביליסי דרך גלדאני, חוצה את הגבעות לצפון-מזרח ועוברת
    לאורך מאגר סיוני לפני שהיא מגיעה לעיירה: בערך שעה וארבעים דקות על אספלט באיכות משתנה. החלופה הולכת
    בכביש הצבאי הגאורגי (S3/E117) עד ז׳ינוואלי, ואז פונה מזרחה לכביש Sh27 דרך זרידזאבי ומעל רכס מיוער:
    זמן דומה, צרה וריקה יותר, ויפה במיוחד בסתיו. תדלקו בטביליסי או בז׳ינוואלי, כי בטיאנטי יש מעט תחנות.
    רכב חסכוני מתמודד עם שתיהן במזג אוויר יבש; לבוצ׳ורמה אחרי גשם רכב שטח הוא הבחירה הנוחה יותר.
ar:
  name: تيانيتي
  short: >-
    حوض جبلي بارد على أعالي نهر إيوري أقام فيه حكّام كاخيتي بلاطهم يوماً، فيه بحيرة سدّ فوق قرى غارقة،
    وقلعة بوتشورما عند مجرى النهر.
  body: >-
    **إلى تيانيتي تأتي تبليسي لتتنفّس.** تقع البلدة في حوض فسيح على ارتفاع 1100 متر، على الضفة اليمنى
    لأعالي نهر إيوري، وبينما تتلظّى العاصمة بالحرّ لا يتجاوز متوسط حرارة أغسطس هنا 18.5 درجة معتدلة؛ وتعدّها
    المراجع الجورجية منتجعاً محلياً لمرضى الرئة. هي صغيرة، منخفضة البنيان، هادئة، ولا تتكلّف أي جهد لتبهر
    زائرها.


    وقد كان لديها يوماً كل ما يدعو إلى ذلك. ففي القرنين العاشر والحادي عشر كانت تيانيتي تحرس الطرق الممتدة
    من كارتلي إلى أرمينيا وألبانيا القوقازية، وعبر الجبال إلى شمال القوقاز، وصارت لبعض الوقت، بعد بوتشورما،
    مقرّاً لحكّام كاخيتي. ثم استولى الملك باغرات الرابع على البلدة وأحرق قصر كفيريكي الثالث، المعروف في
    الذاكرة باسم «قاعة بودوجي»، فانتقل بلاط كاخيتي إلى تيلافي. وإلى الشمال الغربي من البلدة لا تزال قائمة
    أطلال تسخراكاري، وهو قصر من القرن الحادي عشر.


    وأرقّ حكايات المكان حكاية ملكية. فقد دوّن الأمير يوآنه باغراتيوني أن سوسنا، الفتاة القروية من فيليستسيخي
    التي أحبّها الملك لاشا غيورغي ولم يأذن له نبلاؤه بالزواج منها، لمّا توفيت في 20 أغسطس 1207، ركب الملك
    إلى تيانيتي وأمر بدفنها في كنيسة نوكورنا.


    ما يستحق أن تبني يومك حوله:


    - بحيرة سدّ سيوني، التي مُلئت عام 1963 فوق ساكاراولو وجيغو وأوكوغمارتي وقرى أخرى: 12.8 كم² من الماء
    الأخضر

    - قلعة بوتشورما، على بعد 14 كم جنوب شرقي سيوني على الضفة اليسرى لنهر إيوري: ورد ذكرها أول مرة في مطلع
    القرن العاشر، واستولى عليها باغرات الثالث عام 1010، وأعاد إيريكله الثاني تسليحها بالمدافع؛ وفي داخلها
    كنيسة القديس جاورجيوس ذات القبة

    - متحف الشاعر ميرزا غيلوفاني في البلدة نفسها


    تعالَ في أواخر سبتمبر، حين تتلوّن أشجار الزان على السلاسل، وتغسل الصباحات الأولى الباردة الهواء حتى
    يصفو كالزجاج.
  tip: >-
    يكفي نصف يوم للبلدة والبحيرة، ومع بوتشورما يصير يوماً كاملاً. فالقلعة رحلة مستقلة: طريق فرعي (Sh142)
    يتفرّع عن طريق تيانيتي جنوب البحيرة بقليل ويمتد نحو 24 كم حتى الموقع، معظمه غير معبّد وسيّئ بعد المطر،
    فاحسب قرابة ساعة لكل اتجاه. في الشارع الرئيسي بيوت ضيافة ومقهيان أو ثلاثة؛ واحجز مسبقاً في أغسطس.
    الشتاء قاسٍ، فقد سُجّل صقيع حتى 34 درجة تحت الصفر، ويُغلق كثير من الأماكن. تغطية الهاتف متقطعة في
    الأودية الجانبية، والنقد أضمن من البطاقة.
  route: >-
    طريقان، طول كل منهما نحو 80 كم. المباشر، Sh30، يخرج من تبليسي عبر حي غلداني، ويعبر التلال نحو الشمال
    الشرقي، ويحاذي بحيرة سيوني قبل أن يبلغ البلدة: قرابة ساعة وأربعين دقيقة على أسفلت متفاوت الجودة. والبديل
    يسلك الطريق العسكري الجورجي (S3/E117) حتى جينفالي، ثم ينعطف شرقاً إلى Sh27 عبر زاريدزيئبي وفوق سلسلة
    مكسوّة بالغابات: الوقت نفسه تقريباً، لكنه أضيق وأخلى، وجميل في الخريف. املأ الخزان في تبليسي أو جينفالي،
    فمحطات الوقود في تيانيتي قليلة. تكفي سيارة اقتصادية للطريقين في الطقس الجاف؛ أما إلى بوتشورما بعد
    المطر فسيارة الدفع الرباعي أرفق بك.
