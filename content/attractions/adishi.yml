ka:
  name: ადიში
  short: სვანეთის ერთ-ერთი ყველაზე მაღალი დასახლება 2040 მეტრზე, კოშკებით, მყინვარით და ძალიან ცოტა მცხოვრებით.
  body: >-
    **ადიში სვანეთის ყველაზე მაღალ მუდმივ დასახლებებშია** — დაახლოებით 2040 მეტრზე, ადიშჭალის ხეობაში,
    მესტიისა და უშგულის შუა გზაზე. აქ დღეს სულ რამდენიმე ოჯახი ცხოვრობს მთელი წლის განმავლობაში.


    სოფელს თავისი ფორმა იმიტომ შემორჩა, რომ მისი აშენების შემდეგ თითქმის აღარაფერი აშენებულა. ათიოდე კოშკი,
    ქვის სახლები, თივის საკავებელი და ეკლესია — სხვა არაფერი. ტურისტული ინფრასტრუქტურა რამდენიმე სასტუმროთი
    ამოიწურება.


    ადიშს ქართული კულტურის ისტორიაში ცალკე ადგილი უჭირავს. სწორედ აქ, სოფლის ეკლესიაში, ინახებოდა საუკუნეების
    განმავლობაში ადიშის ოთხთავი — 897 წლის ხელნაწერი, ერთ-ერთი უძველესი დათარიღებული ქართული წიგნი. ის
    ტაო-კლარჯეთში დაიწერა და მთაში, უსაფრთხოებისთვის, მოხვდა. დღეს მესტიის მუზეუმშია, სახელი კი სოფლისგან
    აქვს.


    ადიში მესტია-უშგულის საფეხმავლო მარშრუტის კლასიკური მესამე დღეა. აქედან ბილიკი ადიშჭალას კვეთს — მყინვარულ
    მდინარეს, რომელზეც ხიდი არ არის. ადგილობრივები მოსიარულეებს ცხენით გადაჰყავთ. ეს არ არის ატრაქციონი:
    შუადღის შემდეგ ნადნობი წყალი მატულობს და გადასვლა სახიფათო ხდება. დილით გადადი.


    ხეობის სიღრმეში, სოფლიდან საათნახევარ-ორ საათში, ადიშის მყინვარია — ფართო ენა, რომელიც ტეტნულდისა
    და მეზობელი მწვერვალების ქვემოთ ეშვება. ეს ერთ-ერთი ყველაზე ხელმისაწვდომი დიდი მყინვარია სვანეთში
    და ტექნიკურ მომზადებას არ მოითხოვს, თუ ყინულზე არ ადიხარ.


    ადიშის მდებარეობა თავად ისტორიაა. სოფელი ჩიხშია: ბოლო კილომეტრები ციცაბოა და ზამთარში ზვავსაშიშია.
    სწორედ ამ იზოლაციამ შეინახა კოშკებიც და ხელნაწერიც, და ამავე იზოლაციამ დაცალა სოფელი XX საუკუნეში,
    როცა ხალხი ბარში ჩაასახლეს.


    დღეს ტურიზმი ერთადერთი მიზეზია, რის გამოც აქ საერთოდ ცხოვრობს ვინმე. ეს ორმხრივი გარიგებაა: სასტუმროები
    მარტივია და ფასი მაღალი, სამაგიეროდ ფული პირდაპირ იმ ოჯახებთან რჩება, რომლებიც სოფელს არ ტოვებენ.


    გულახდილად საყოფაცხოვრებო პირობებზე: სასტუმროები მარტივია, მაღაზია არ არის, ბანკომატი არ არის და ნაღდი
    ფული აუცილებელია. ელექტროენერგია წყდება. ინტერნეტი ხშირად საერთოდ არ მუშაობს.


    გზა ცალკე თემაა. მესტია-უშგულის გზიდან ადიშამდე შვიდიოდე კილომეტრი ღორღიანი, ღრმად დაღარული კვალია.
    ჩვეულებრივი მანქანა ვერ ავა; წვიმის შემდეგ ჯიპსაც უჭირს. ბევრი ფეხით ადის — ეს ორ საათზე ცოტა მეტია
    და გაცილებით სასიამოვნო.


    სეზონი ივნისის შუიდან სექტემბრის ბოლომდეა. ზამთარში თოვლი გზას კეტავს და დარჩენილი ოჯახებიც ხშირად
    ჩადიან ქვემოთ.


    სამი საათი სოფლისთვის საკმარისია; მყინვარისთვის მთელი დღე დაგჭირდება.
  tip: >-
    სოფლისთვის სამი საათი, მყინვარისთვის სრული დღე. ნაღდი ფული აუცილებელია — ბანკომატი და ბარათის ტერმინალი
    არ არსებობს. მაღაზია არ არის: საკვები მესტიიდან წაიღე. სასტუმროში ადგილი ზაფხულში წინასწარ უნდა დაჯავშნო,
    თუმცა კავშირი რთულია. მდინარის გადასასვლელი მხოლოდ დილით ღირს. ღამით ცივა 2040 მეტრზე ივლისშიც — თბილი
    ტანსაცმელი წაიღე. ძაღლები სოფელში ბევრია და ჯოხი გამოგადგება. ტელეფონის კავშირი ხშირად არ არსებობს,
    ამიტომ მარშრუტი და რუკა წინასწარ ჩამოტვირთე.
  route: >-
    თბილისიდან E60-ით სენაკამდე, ზუგდიდისკენ და ჩრდილოეთით მესტიამდე — შემდეგ აღმოსავლეთით უშგულის გზით.
    ადიშის შესახვევი უშგულამდე თხუთმეტიოდე კილომეტრით ადრეა; იქიდან შვიდიოდე კილომეტრი ღორღიანი კვალია
    ზემოთ. სულ დაახლოებით 505 კმ და ათი საათი თხუთმეტი წუთი. მესტიამდე ასფალტია; შემდეგ გზა უხეშდება და
    ადიშის მონაკვეთი მხოლოდ ოთხთვალა ავტომობილისთვისაა. საწვავი ზუგდიდში ან მესტიაში აიღე; ზემოთ არც სადგურია
    და არც სერვისი. თუ ჯიპი არ გაქვს, მანქანა შესახვევთან დატოვე და ორ საათში ფეხით ავედი — ეს სავსებით
    ნორმალური ვარიანტია.
en:
  name: Adishi
  short: >-
    One of the highest permanently inhabited villages in Svaneti at 2,040 m, with towers, a glacier and
    very few residents.
  body: >-
    **Adishi is among the highest permanently inhabited settlements in Svaneti,** at about 2,040 metres
    in the Adishchala valley, roughly halfway between Mestia and Ushguli. Only a handful of families live
    here all year.


    The village kept its shape because almost nothing was added after it was built: a dozen towers, stone
    houses, hay barns and a church. Tourist infrastructure amounts to a few guesthouses.


    Adishi holds a particular place in Georgian culture. It was here, in the village church, that the
    Adishi Gospels were kept for centuries: a manuscript of 897 and one of the oldest dated Georgian books,
    written in Tao-Klarjeti and sent up into the mountains for safekeeping. It is now in the Mestia museum
    but keeps the village's name.


    Adishi is the classic third day of the Mestia to Ushguli trek. From here the path crosses the Adishchala,
    a glacial river with no bridge, and local men ferry walkers across on horseback. This is not a novelty
    ride: after midday the meltwater rises and the crossing becomes genuinely dangerous. Cross in the
    morning.


    Up the valley, an hour and a half to two hours from the village, lies the Adishi glacier, a broad
    tongue descending below Tetnuldi. It is one of the most accessible large glaciers in Svaneti and needs
    no technical skill, provided you stay off the ice.


    The position of Adishi is itself the history. The village is a dead end: the last kilometres are steep
    and avalanche-prone in winter. That isolation is what preserved both the towers and the manuscript,
    and the same isolation emptied the village during the twentieth century, when families were resettled
    in the lowlands.


    Today tourism is the only reason anyone lives here at all, and it is a fair bargain both ways: the
    guesthouses are basic and not cheap, but the money stays with the households that have not left.


    Honestly about conditions: guesthouses are simple, there is no shop and no cash machine, so cash is
    essential. The power cuts out and internet often fails.


    The road deserves a paragraph. From the Mestia–Ushguli road it is about seven kilometres of deeply
    rutted gravel track. An ordinary car cannot get up, and after rain even a four-wheel drive struggles.
    Many people walk instead, a little over two hours and far more pleasant.


    The season runs from mid-June to the end of September; in winter snow closes the track and the remaining
    families often move down. Three hours covers the village, and the glacier needs a full day.
  tip: >-
    Three hours for the village, a full day for the glacier. Cash is essential, since there is no cash
    machine and no card terminal. There is no shop, so bring food from Mestia. Guesthouse beds should
    be booked ahead in summer, though getting through by phone is not always easy. Cross the river only
    in the morning. Nights are cold at 2,040 metres even in July, so pack warm clothes. There are many
    dogs in the village and a stick is useful.
  route: >-
    From Tbilisi take the E60 to Senaki, continue to Zugdidi, then north to Mestia and east on the Ushguli
    road. The Adishi turning is about fifteen kilometres before Ushguli, and from there it is roughly
    seven kilometres of gravel track uphill. About 505 km in all and ten hours fifteen. Asphalt runs to
    Mestia; beyond that the surface degrades, and the Adishi section is for four-wheel drive only. Refuel
    in Zugdidi or Mestia, as there is nothing higher up.
ru:
  name: Адиши
  short: Одно из самых высоких постоянно обитаемых сёл Сванетии на 2040 м, с башнями, ледником и горсткой
    жителей.
  body: >-
    **Адиши — одно из самых высоких постоянно обитаемых поселений Сванетии,** примерно на 2040 метрах
    в долине Адишчала, приблизительно на полпути между Местией и Ушгули. Круглый год здесь живёт лишь
    несколько семей.


    Село сохранило свою форму потому, что после постройки к нему почти ничего не прибавили. Десяток башен,
    каменные дома, сеновалы и церковь — вот и всё. Туристическая инфраструктура сводится к нескольким
    гостевым домам.


    В истории грузинской культуры у Адиши особое место. Именно здесь, в сельской церкви, веками хранилось
    Адишское Евангелие: рукопись 897 года, одна из старейших датированных грузинских книг. Её написали
    в Тао-Кларджети и отправили в горы на сохранение. Сейчас она в музее Местии, но имя носит по этому
    селу.


    Адиши — классический третий день пешего маршрута Местиа — Ушгули. Отсюда тропа пересекает Адишчалу,
    ледниковую реку без моста, и местные переправляют путников верхом. Это не аттракцион: после полудня
    талая вода прибывает и переправа становится по-настоящему опасной. Переходить надо утром.


    Выше по долине, в полутора-двух часах от села, лежит ледник Адиши — широкий язык, спускающийся под
    Тетнулди и соседними вершинами. Это один из самых доступных крупных ледников Сванетии, и техники он
    не требует, если не выходить на лёд.


    Само положение Адиши — это и есть его история. Село стоит в тупике: последние километры круты и зимой
    лавиноопасны. Именно эта изоляция сохранила и башни, и рукопись, и она же обезлюдила село в XX веке,
    когда семьи переселяли на равнину.


    Сегодня туризм — единственная причина, по которой здесь вообще кто-то живёт. Сделка честная с обеих
    сторон: гостевые дома простые и недешёвые, зато деньги остаются у тех семей, которые не уехали.


    Честно об условиях: гостевые дома простые, магазина нет, банкомата нет, наличные обязательны. Электричество
    отключается. Интернет часто не работает вовсе.


    Дорога заслуживает отдельного абзаца. От трассы Местиа — Ушгули до села около семи километров гравийной
    колеи с глубокими промоинами. Обычная машина не поднимется; после дождя тяжело и полному приводу.
    Многие идут пешком — это чуть больше двух часов и куда приятнее.


    Сезон — с середины июня до конца сентября. Зимой снег закрывает дорогу, и оставшиеся семьи часто спускаются
    вниз.


    Трёх часов хватит на село; на ледник нужен целый день.
  tip: >-
    Три часа на село, целый день на ледник. Наличные обязательны: ни банкомата, ни терминала здесь нет,
    а мобильной связи часто нет тоже. Магазина тоже нет, еду везите из Местии. Место в гостевом доме летом
    лучше бронировать заранее, хотя дозвониться удаётся не всегда. Реку переходите только утром. Ночи
    на 2040 метрах холодные даже в июле, возьмите тёплые вещи. Собак в селе много, палка не помешает.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше до Зугдиди, затем на север до Местии и на восток по дороге на
    Ушгули. Поворот на Адиши примерно за пятнадцать километров до Ушгули, оттуда около семи километров
    гравийной колеи вверх. Всего около 505 км и десять часов пятнадцать минут. До Местии асфальт; дальше
    покрытие ухудшается, а участок до Адиши проходим только на полном приводе. Заправляйтесь в Зугдиди
    или Местии — выше нет ничего.
fa:
  name: آدیشی
  short: یکی از بلندترین روستاهای دائماً مسکون سوانتی در ۲۰۴۰ متری، با برج‌ها، یخچال و ساکنانی بسیار اندک.
  body: >-
    **آدیشی از بلندترین سکونتگاه‌های دائمی سوانتی است،** در ارتفاع حدود ۲۰۴۰ متر در درهٔ آدیشچالا، تقریباً
    میانهٔ راه مستیا و اوشگولی. امروز تنها چند خانواده تمام سال اینجا زندگی می‌کنند.


    روستا شکل خود را نگه داشته چون پس از ساخته شدنش تقریباً چیزی به آن افزوده نشد. ده‌دوازده برج، خانه‌های
    سنگی، انبارهای علوفه و یک کلیسا — همین. زیرساخت گردشگری هم به چند اقامتگاه محدود می‌شود.


    آدیشی در تاریخ فرهنگ گرجی جایگاهی ویژه دارد. همین‌جا، در کلیسای روستا، انجیل آدیشی قرن‌ها نگهداری
    می‌شد: دست‌نوشته‌ای از سال ۸۹۷ و از کهن‌ترین کتاب‌های تاریخ‌دار گرجی. آن را در تائو-کلارجتی نوشتند
    و برای حفظ به کوهستان فرستادند. امروز در موزهٔ مستیا است اما نامش را از این روستا دارد.


    آدیشی روز سوم کلاسیک مسیر پیاده‌روی مستیا تا اوشگولی است. از اینجا مسیر از آدیشچالا می‌گذرد، رودی
    یخچالی که پل ندارد، و مردان محلی پیاده‌ها را با اسب از آن رد می‌کنند. این تفریح نیست: پس از ظهر آب
    ذوب بالا می‌آید و گذر واقعاً خطرناک می‌شود. صبح رد شوید.


    بالاتر در دره، یک ساعت و نیم تا دو ساعت از روستا، یخچال آدیشی است؛ زبانه‌ای پهن که زیر تتنولدی و قله‌های
    همسایه پایین می‌آید. از دسترس‌پذیرترین یخچال‌های بزرگ سوانتی است و اگر روی یخ نروید مهارت فنی نمی‌خواهد.


    صادقانه دربارهٔ شرایط: اقامتگاه‌ها ساده‌اند، مغازه‌ای نیست، خودپرداز نیست و پول نقد ضروری است. برق
    قطع می‌شود. اینترنت اغلب اصلاً کار نمی‌کند.


    جاده بند جداگانه‌ای می‌طلبد. از جادهٔ مستیا-اوشگولی تا روستا حدود هفت کیلومتر راه شنی با شیارهای عمیق
    است. خودروی معمولی بالا نمی‌رود؛ پس از باران حتی چهارچرخ‌محرک هم به زحمت می‌افتد. بسیاری پیاده می‌روند
    که کمی بیش از دو ساعت است و بسیار خوشایندتر.


    فصل از نیمهٔ خرداد تا پایان شهریور است. در زمستان برف راه را می‌بندد و خانواده‌های باقی‌مانده اغلب
    پایین می‌روند.


    سه ساعت برای روستا کافی است؛ برای یخچال یک روز کامل لازم است.
  tip: >-
    سه ساعت برای روستا و یک روز کامل برای یخچال. پول نقد ضروری است، چون نه خودپردازی هست و نه دستگاه کارت‌خوان.
    مغازه‌ای نیست، پس خوراک را از مستیا بیاورید. جای اقامتگاه را در تابستان از پیش رزرو کنید، هرچند تماس
    تلفنی همیشه برقرار نمی‌شود. از رود فقط صبح بگذرید. شب‌ها در ۲۰۴۰ متری حتی در تیر سرد است، پس لباس
    گرم بردارید. سگ در روستا فراوان است و چوب‌دستی به کار می‌آید.
  route: >-
    از تفلیس با E60 تا سناکی، سپس زوگدیدی، آنگاه به شمال تا مستیا و به شرق در جادهٔ اوشگولی. انشعاب آدیشی
    حدود پانزده کیلومتر پیش از اوشگولی است و از آنجا نزدیک هفت کیلومتر راه شنی سربالایی. رویهم حدود ۵۰۵
    کیلومتر و ده ساعت و پانزده دقیقه. تا مستیا آسفالت است؛ پس از آن سطح جاده بد می‌شود و بخش آدیشی تنها
    با چهارچرخ‌محرک رفتنی است. سوخت را در زوگدیدی یا مستیا بگیرید، چون بالاتر چیزی نیست.
he:
  name: אדישי
  short: אחד הכפרים המיושבים הגבוהים בסוונתי בגובה 2,040 מ׳, עם מגדלים, קרחון ומעט מאוד תושבים.
  body: >-
    **אדישי הוא מן היישובים המיושבים דרך קבע הגבוהים ביותר בסוונתי,** בגובה כ-2,040 מטרים בעמק האדישצ׳לה,
    בערך באמצע הדרך בין מסטיה לאושגולי. כיום חיות כאן כל השנה רק כמה משפחות.


    הכפר שמר על צורתו משום שכמעט דבר לא נוסף לו לאחר שנבנה. תריסר מגדלים, בתי אבן, אסמי חציר וכנסייה —
    וזה הכול. התשתית התיירותית מסתכמת בכמה אכסניות.


    לאדישי מקום מיוחד בתולדות התרבות הגאורגית. כאן, בכנסיית הכפר, נשמרו במשך מאות שנים בשורות אדישי: כתב
    יד משנת 897 ואחד הספרים הגאורגיים המתוארכים העתיקים ביותר. הוא נכתב בטאו-קלארג׳תי ונשלח אל ההרים לשמירה.
    כיום הוא במוזיאון מסטיה, אך שמו על שם הכפר הזה.


    אדישי הוא היום השלישי הקלאסי במסלול הרגלי ממסטיה לאושגולי. מכאן חוצה השביל את האדישצ׳לה, נהר קרחוני
    בלי גשר, ותושבים מקומיים מעבירים את ההולכים על סוסים. אין זו אטרקציה: אחרי הצהריים עולים מי ההפשרה
    והחצייה נעשית מסוכנת באמת. חצו בבוקר.


    במעלה העמק, שעה וחצי עד שעתיים מן הכפר, נמצא קרחון אדישי — לשון רחבה היורדת מתחת לטטנולדי ולשכנותיו.
    זהו אחד הקרחונים הגדולים הנגישים בסוונתי, ואין צורך במיומנות טכנית כל עוד אינכם עולים על הקרח.


    מיקומה של אדישי הוא עצמו ההיסטוריה שלה. הכפר יושב בקצה דרך ללא מוצא: הקילומטרים האחרונים תלולים ומועדים
    למפולות שלג בחורף. הבידוד הזה הוא ששימר את המגדלים ואת כתב היד, ואותו בידוד גם רוקן את הכפר במאה העשרים,
    כשמשפחות יושבו מחדש במישור.


    היום התיירות היא הסיבה היחידה שמישהו חי כאן בכלל. זו עסקה הוגנת לשני הכיוונים: האכסניות בסיסיות ואינן
    זולות, אך הכסף נשאר אצל המשפחות שלא עזבו.


    בכנות על התנאים: האכסניות פשוטות, אין חנות, אין כספומט ומזומן הוא הכרח. החשמל מתנתק. האינטרנט לרוב
    אינו עובד כלל.


    הדרך ראויה לפסקה. מכביש מסטיה–אושגולי אל הכפר יש כשבעה קילומטרים של דרך חצץ עם תלמים עמוקים. רכב רגיל
    לא יעלה; אחרי גשם גם הנעה כפולה מתקשה. רבים עולים ברגל, וזה קצת יותר משעתיים והרבה יותר נעים.


    העונה נמשכת מאמצע יוני עד סוף ספטמבר. בחורף השלג סוגר את הדרך והמשפחות שנותרו יורדות לא פעם למטה.


    שלוש שעות מכסות את הכפר; לקרחון דרוש יום שלם.
  tip: >-
    שלוש שעות לכפר, יום שלם לקרחון. מזומן הוא הכרח, כי אין כאן כספומט ואין מסוף אשראי. גם חנות אין, לכן
    הביאו אוכל ממסטיה. מיטות באכסניות כדאי להזמין מראש בקיץ, אף שלא תמיד מצליחים להשיג בטלפון. חצו את
    הנהר רק בבוקר. הלילות בגובה 2,040 מטרים קרים גם ביולי, אז ארזו בגדים חמים. יש הרבה כלבים בכפר ומקל
    מועיל. לעיתים קרובות אין קליטה סלולרית, לכן הורידו מראש את המסלול ואת המפה.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לזוגדידי, ואז צפונה למסטיה ומזרחה בכביש אושגולי. הפנייה לאדישי נמצאת
    כחמישה-עשר קילומטרים לפני אושגולי, ומשם כשבעה קילומטרים של דרך חצץ במעלה. כ-505 ק״מ בסך הכול ועשר
    שעות וחמש-עשרה. האספלט מגיע עד מסטיה; אחריו המשטח מתדרדר, וקטע אדישי מיועד להנעה כפולה בלבד. תדלקו
    בזוגדידי או במסטיה, כי מעלה אין תחנה ואין שירות. אם אין לכם רכב שטח, השאירו את הרכב בפנייה ועלו ברגל
    בכשעתיים — זו אפשרות סבירה לגמרי.
ar:
  name: أديشي
  short: من أعلى القرى المأهولة دائماً في سفانيتي على ارتفاع 2040 م، بأبراجها ونهرها الجليدي وسكانها القلائل.
  body: >-
    **أديشي من أعلى المستوطنات المأهولة على مدار السنة في سفانيتي،** على ارتفاع نحو 2040 متراً في وادي
    أديشتشالا، في منتصف الطريق تقريباً بين مستيا وأوشغولي. ولا يقيم فيها اليوم طوال العام سوى بضع أسر.


    حافظت القرية على هيئتها لأن شيئاً لم يُضَف إليها تقريباً بعد بنائها. عشرات من الأبراج وبيوت حجرية
    ومخازن تبن وكنيسة — وهذا كل شيء. أما البنية السياحية فتنحصر في بضعة بيوت ضيافة.


    ولأديشي موضع خاص في تاريخ الثقافة الجورجية. فهنا، في كنيسة القرية، حُفظ إنجيل أديشي قروناً: مخطوطة
    من سنة 897 وأحد أقدم الكتب الجورجية المؤرخة. كُتب في تاو-كلارجيتي وأُرسل إلى الجبال حفظاً له. وهو
    اليوم في متحف مستيا، لكنه يحمل اسم هذه القرية.


    وأديشي هي اليوم الثالث الكلاسيكي في مسار المشي من مستيا إلى أوشغولي. ومن هنا يعبر الدرب نهر أديشتشالا
    الجليدي الذي لا جسر عليه، وينقل الرجال المحليون المشاة على ظهور الخيل. وليس هذا نزهة: فبعد الظهر يرتفع
    ماء الذوبان ويصير العبور خطراً فعلاً. اعبر صباحاً.


    وفي أعلى الوادي، على ساعة ونصف إلى ساعتين من القرية، يقع نهر أديشي الجليدي، لسان عريض ينحدر تحت تتنولدي
    وجاراته. وهو من أيسر الأنهار الجليدية الكبرى وصولاً في سفانيتي، ولا يحتاج مهارة فنية ما دمت لا تصعد
    على الجليد.


    وموقع أديشي هو تاريخها بعينه. فالقرية في نهاية درب مسدود: الكيلومترات الأخيرة شديدة الانحدار ومعرضة
    للانهيارات الثلجية شتاءً. وهذه العزلة هي التي حفظت الأبراج والمخطوطة معاً، وهي نفسها التي أفرغت القرية
    في القرن العشرين حين نُقلت الأسر إلى السهل.


    واليوم السياحة هي السبب الوحيد لبقاء أحد هنا أصلاً. وهي مقايضة منصفة من الجهتين: بيوت الضيافة بسيطة
    وليست رخيصة، لكن المال يبقى عند الأسر التي لم ترحل.


    وبصراحة عن الأحوال: بيوت الضيافة بسيطة، ولا متجر هنا، ولا صراف آلي، والنقد ضروري. والكهرباء تنقطع.
    والإنترنت كثيراً ما لا يعمل إطلاقاً.


    والطريق يستحق فقرة. فمن طريق مستيا–أوشغولي إلى القرية نحو سبعة كيلومترات من درب حصوي عميق الأخاديد.
    السيارة العادية لا تصعده؛ وبعد المطر يتعثر حتى الدفع الرباعي. وكثيرون يصعدون سيراً، وهو ما يستغرق
    أكثر قليلاً من ساعتين وأمتع بكثير.


    والموسم من منتصف حزيران إلى نهاية أيلول. وفي الشتاء يغلق الثلج الطريق وتنزل الأسر الباقية إلى الأسفل
    غالباً.


    ثلاث ساعات تغطي القرية؛ أما النهر الجليدي فيحتاج يوماً كاملاً.
  tip: >-
    ثلاث ساعات للقرية ويوم كامل للنهر الجليدي. النقد ضروري، إذ لا صراف آلي هنا ولا جهاز بطاقات. ولا متجر
    أيضاً، فاحمل الطعام من مستيا. وأسرّة بيوت الضيافة يُستحسن حجزها مسبقاً في الصيف، وإن كان الاتصال الهاتفي
    لا ينجح دائماً. اعبر النهر صباحاً فقط. والليالي على 2040 متراً باردة حتى في تموز، فاحمل ثياباً دافئة.
    والكلاب كثيرة في القرية والعصا مفيدة.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم إلى زوغديدي، ثم شمالاً إلى مستيا وشرقاً على طريق أوشغولي.
    منعطف أديشي على نحو خمسة عشر كيلومتراً قبل أوشغولي، ومنه سبعة كيلومترات تقريباً من درب حصوي صاعد.
    نحو 505 كم إجمالاً وعشر ساعات وخمس عشرة دقيقة. الإسفلت يمتد حتى مستيا؛ وبعدها يسوء السطح، ومقطع أديشي
    للدفع الرباعي وحده. تزوّد بالوقود في زوغديدي أو مستيا، فلا شيء في الأعلى.
