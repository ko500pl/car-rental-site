ka:
  name: ადიში
  short: >-
    სვანური სოფელი 2040 მეტრზე — კოშკებით, ოთხი შუასაუკუნეობრივი ეკლესიითა და უხიდო მყინვარული მდინარით;
    საუკუნეებს აქ 897 წლის ოთხთავი ინახებოდა.
  body: >-
    **ადიშმა საუკუნეების განმავლობაში 897 წელს დაწერილი წიგნი შემოინახა — წინსვლის გზა კი აქ დღესაც უხიდო
    მყინვარულ მდინარეს აქვს გადაღობილი.**


    ეს წიგნი ადიშის ოთხთავია — ქართული სახარების უძველესი თარიღიანი ხელნაწერი, რომელმაც ჩვენამდე მოაღწია.
    ის გადამწერმა მიქაელმა კლარჯეთში, შატბერდის ლავრაში, გადაწერა; ეს მხარე დღეს თურქეთის ჩრდილო-აღმოსავლეთშია.
    გვიანდელ მინაწერში ჯუმათის ყოფილი წინამძღვარი ნიკოლაოსი მოგვითხრობს, როგორ შეკრიბა ეს და სხვა წიგნები.
    XVI საუკუნისთვის ოთხთავი უკვე სვანეთში იყო, მაგრამ ვინ ამოიტანა ან რატომ, უცნობია. სოფლელები მის ქვედა
    აშიებზე ფიცით განმტკიცებულ შეთანხმებებს წერდნენ და მოწმედ „ჰადიშის მაცხოვარს“ იხმობდნენ — ჰადიში სოფლის
    სვანური სახელია. ხელნაწერი 1916 წელს ექვთიმე თაყაიშვილმა გამოსცა; დღეს იგი მესტიის მუზეუმში ინახება.


    სოფელი ზღვის დონიდან 2040 მეტრზე, ადიშჭალის ნაპირზე დგას; 2014 წლის აღწერით აქ 44 ადამიანი ცხოვრობდა.
    ასეთი პატარა სოფლისთვის აქ ბევრი რამ დაეტია: სვანური კოშკები, თივის სხვენიანი ქვის სახლები და შუა
    საუკუნეების ოთხი ეკლესია — მაცხოვრისა (X–XI საუკუნეები), წმინდა გიორგის ორი და მთავარანგელოზისა (სამივე
    XII საუკუნისაა). საღამოობით კოშკებს შორის შეშის კვამლი იშლება და ყველაზე ხმამაღლა მხოლოდ მდინარე ხმაურობს.


    მესტია–უშგულის ოთხდღიან საფეხმავლო გზაზე ადიში მეორე ღამის გასათევია. მესამე დილა ადიშჭალასთან იწყება:
    ხიდი არ არის, ნაცრისფერი ნადნობი წყალი სწრაფად მიექანება, ადგილობრივი მხედრები კი მოლაშქრეებს საფასურით
    ცხენით გადაჰყავთ. ადრე გადადით — შუადღისთვის წყალი იმატებს. ხეობის ზემოთ, საათნახევარ-ორ საათში, ადიშის
    მყინვარი თეთნულდის ძირისკენ ეშვება.


    იზოლაციამ გადაარჩინა კოშკებიც და წიგნიც; იმავე იზოლაციის გამო სოფელი დღესაც პატარაა. დღევანდელი გარიგება
    მარტივია: საოჯახო სასტუმროს საწოლი და ვახშამი, ნაღდი ფულით გადახდილი, ფული კი იმ ოჯახებში რჩება, რომლებმაც
    სოფელი არ მიატოვეს.
  tip: >-
    ნაღდი ფული თან იქონიეთ: აქ არც ბანკომატია, არც ბარათის ტერმინალი და არც მაღაზია, ამიტომ საკვები მესტიაში
    შეიძინეთ. ივლისსა და აგვისტოში სასტუმრო წინასწარ დაჯავშნეთ, თუმცა გაითვალისწინეთ, რომ ტელეფონი ხშირად
    ვერ იჭერს — რუკა წინასწარ ჩამოტვირთეთ. ადიშჭალა მხოლოდ დილით გადალახეთ და წყალში ფეხით ნუ შეხვალთ,
    მხედრებს ენდეთ: წყალი ყინულივით ცივი და სწრაფია. 2040 მეტრზე ღამე შუა ზაფხულშიც ცივა. სოფლისა და ეკლესიებისთვის
    სამი საათი გამოყავით, მყინვარითურთ — მთელი დღე. ზამთარში თოვლი გზას კეტავს; რეალური სეზონი ივნისის
    შუა რიცხვებიდან სექტემბრის ბოლომდეა.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ იმავე S1-ით სენაკის გავლით
    ზუგდიდამდე, იქიდან კი ენგურის ხეობით მესტიამდე — დაახლოებით 470 კმ, მთლიანად ასფალტზე. საწვავი ზუგდიდში
    ან მესტიაში ჩაასხით, ზემოთ ბენზინგასამართი აღარ არის. მესტიიდან უშგულის გზით აღმოსავლეთისკენ დაახლოებით
    ოცი კილომეტრი იარეთ ბოგრეშის შესახვევამდე; იქიდან სოფლამდე ცხრაოდე კილომეტრი ღრმად დაღარული, ქვიანი
    ჯიპის გზა ადის. თბილისიდან სულ დაახლოებით 505 კმ და ათი საათი და თხუთმეტი წუთი გამოდის. ბოლო მონაკვეთი
    მხოლოდ მაღალი კლირენსის ნამდვილ ოთხწამყვანიან ჯიპს ეკუთვნის, წვიმის შემდეგ კი მასაც უჭირს. ბევრი მანქანას
    შესახვევთან ტოვებს და დაახლოებით სამ საათში ფეხით ადის, ან მესტიიდან ადგილობრივ ჯიპს ქირაობს.
en:
  name: Adishi
  short: >-
    A Svan village at 2,040 m with towers, four medieval churches and a bridgeless glacial river — for
    centuries the keeper of a Gospel book of 897.
  body: >-
    **For centuries Adishi kept safe a book written in 897; the way onward is still barred by a glacial
    river with no bridge.**


    The book is the Adishi Gospels, the oldest dated manuscript of the Georgian Gospels to survive. The
    scribe Mikael copied it at Shatberdi monastery in Klarjeti, a land now in north-eastern Turkey. A
    later note by Nikolaos, once superior of Jumati, tells how he gathered it with other books; by the
    sixteenth century it was in Svaneti, though who carried it up here, and why, nobody knows. Villagers
    used its lower margins to record sworn pledges, calling on "the Saviour of Hadishi" — the Svan form
    of the name — as witness. Ekvtime Takaishvili published the manuscript in 1916; today it lies in the
    museum in Mestia.


    The village stands at 2,040 metres above the Adishchala, and the 2014 census counted 44 residents.
    For so small a place it holds a great deal: Svan towers, stone houses with hay lofts, and four medieval
    churches — the Saviour (tenth–eleventh century), two dedicated to St George and one to the Archangel
    (all twelfth century). In the evening wood smoke drifts between the towers and the loudest sound is
    the river.


    On the four-day walk from Mestia to Ushguli, Adishi is the second night's stop. The third morning
    begins at the Adishchala: no bridge, fast grey meltwater, and local horsemen who carry walkers across
    for a fee. Go early; by afternoon the river rises. Up the valley, an hour and a half to two hours
    on foot, the Adishi glacier spills down beneath Tetnuldi.


    Isolation saved the towers and the book, and it keeps the village small. The bargain today is simple:
    a guesthouse bed and supper, paid in cash, with the money staying in the families who stayed.
  tip: >-
    Bring cash: there is no ATM, no card terminal and no shop, so buy food in Mestia. Book a guesthouse
    ahead in July and August, but expect phones to have no signal and download offline maps. Cross the
    Adishchala only in the morning and use the horsemen rather than wading — the water is icy and fast.
    Nights are cold at 2,040 m even in midsummer. Allow three hours for the village and its churches,
    a full day if you add the glacier. Snow closes the track in winter; the realistic season runs from
    mid-June to late September.
  route: >-
    From Tbilisi take the S1 (E60) past Kutaisi to Samtredia, continue on the S1 through Senaki to Zugdidi,
    then climb the Enguri gorge to Mestia — about 470 km of asphalt. Refuel in Zugdidi or Mestia; there
    is nothing higher up. From Mestia follow the Ushguli road east for about twenty kilometres to the
    turning at Bogreshi, where some nine kilometres of rutted, stony jeep track climb to the village:
    roughly 505 km and ten and a quarter hours in all. That last stretch is for a genuine high-clearance
    4x4 only, and after rain even that struggles. Many leave the car at the turning and walk up in about
    three hours, or take a jeep from Mestia.
ru:
  name: Адиши
  short: >-
    Сванское село на высоте 2040 м с башнями, четырьмя средневековыми церквями и ледниковой рекой без
    моста — веками хранившее Евангелие 897 года.
  body: >-
    **Веками Адиши берегло книгу, написанную в 897 году; а дальше путь и сегодня преграждает ледниковая
    река, через которую нет моста.**


    Эта книга — Адишское Евангелие, древнейшая из сохранившихся датированных рукописей грузинского Четвероевангелия.
    Переписал его писец Микаел в монастыре Шатберди в Кларджети — земле, которая сейчас лежит на северо-востоке
    Турции. Более поздняя запись Николаоса, бывшего настоятеля Джумати, рассказывает, как он собрал эту
    книгу вместе с другими; к XVI веку она уже была в Сванетии, но кто принёс её сюда и зачем — неизвестно.
    На нижних полях жители записывали клятвенные обязательства, призывая в свидетели «Спаса Хадиши» —
    так по-свански звучит имя села. Эквтиме Такаишвили издал рукопись в 1916 году; сегодня она хранится
    в музее в Местии.


    Село стоит на высоте 2040 метров над Адишчалой; перепись 2014 года насчитала здесь 44 жителя. Для
    такого маленького места здесь удивительно много всего: сванские башни, каменные дома с сеновалами
    и четыре средневековые церкви — Спаса (X–XI века), две во имя святого Георгия и церковь Архангела
    (все три XII века). По вечерам между башнями тянется дым очагов, и громче всего здесь шумит река.


    На четырёхдневном переходе из Местии в Ушгули Адиши — место второй ночёвки. Третье утро начинается
    у Адишчалы: моста нет, вода серая, талая, быстрая, и местные всадники за плату перевозят путников
    на другой берег. Выходите рано: к середине дня река поднимается. Выше по долине, в полутора-двух часах
    ходьбы, под Тетнульди спускается Адишский ледник.


    Изоляция сберегла и башни, и книгу — и она же не даёт селу вырасти. Сегодня уговор прост: кровать
    и ужин в гостевом доме, оплата наличными, и деньги остаются в семьях тех, кто остался.
  tip: >-
    Берите наличные: здесь нет ни банкомата, ни терминала, ни магазина, так что продукты покупайте в Местии.
    В июле и августе бронируйте гостевой дом заранее, но будьте готовы к тому, что связи не будет, и скачайте
    офлайн-карты. Адишчалу пересекайте только утром и верхом, с местными всадниками, а не вброд пешком:
    вода ледяная и быстрая. Ночи на высоте 2040 м холодные даже в разгар лета. На село и его церкви закладывайте
    три часа, на поход к леднику — целый день. Зимой дорогу закрывает снег; реальный сезон — с середины
    июня до конца сентября.
  route: >-
    Из Тбилиси по S1 (E60) мимо Кутаиси до Самтредиа, дальше по S1 через Сенаки до Зугдиди, затем вверх
    по ущелью Ингури до Местии — около 470 км асфальта. Заправьтесь в Зугдиди или Местии: выше заправок
    нет. Из Местии около двадцати километров на восток по дороге на Ушгули до поворота у Богреши, откуда
    примерно девять километров разбитой каменистой джип-дороги поднимаются к селу: всего около 505 км
    и десяти с четвертью часов. Последний участок — только для настоящего внедорожника с высоким клиренсом,
    а после дождя и он справляется с трудом. Многие оставляют машину у поворота и поднимаются пешком —
    около трёх часов — или едут из Местии на джипе.
fa:
  name: آدیشی
  short: >-
    روستایی سوانی در ارتفاع ۲,۰۴۰ متر با برج‌ها، چهار کلیسای سده‌های میانه و رودی یخچالیِ بی‌پل — قرن‌ها
    نگهبان انجیلی از سال ۸۹۷.
  body: >-
    **آدیشی قرن‌ها کتابی را که در سال ۸۹۷ نوشته شده بود در امان نگه داشت؛ و راهِ پیش رو هنوز هم با رودی
    یخچالی بسته است که هیچ پلی ندارد.**


    این کتاب انجیل آدیشی است، کهن‌ترین نسخهٔ خطیِ تاریخ‌دارِ انجیل‌های گرجی که به دست ما رسیده است. کاتبی
    به نام میکائل آن را در صومعهٔ شاتبردی در کلارجتی رونویسی کرد، سرزمینی که امروز در شمال شرقی ترکیه
    است. یادداشتی متأخر از نیکولائوس، رئیس پیشین صومعهٔ جوماتی، بازگو می‌کند که او چگونه این کتاب را همراه
    با کتاب‌های دیگر گرد آورد؛ تا سدهٔ شانزدهم کتاب در سوانتی بود، اما کسی نمی‌داند چه کسی و چرا آن را
    به این بالا آورد. روستاییان در حاشیه‌های پایینی آن پیمان‌های سوگندخورده را ثبت می‌کردند و «منجیِ هادیشی»
    را — شکل سوانیِ نام روستا — به گواهی می‌خواندند. اکوتیمه تاکائیشویلی این نسخه را در سال ۱۹۱۶ منتشر
    کرد؛ امروز در موزهٔ مستیا نگهداری می‌شود.


    روستا در ارتفاع ۲,۰۴۰ متر، بالای رود آدیشچالا، قرار دارد و سرشماری ۲۰۱۴ در آن ۴۴ ساکن شمرد. برای جایی
    چنین کوچک، چیزهای بسیاری در خود دارد: برج‌های سوانی، خانه‌های سنگی با انبار علوفه در طبقهٔ بالا، و
    چهار کلیسای سده‌های میانه — کلیسای منجی (سدهٔ دهم تا یازدهم)، دو کلیسا به نام قدیس گئورگی و یکی به
    نام فرشتهٔ مقرب (هر سه از سدهٔ دوازدهم). شامگاه دود هیزم میان برج‌ها می‌پیچد و بلندترین صدا صدای رود
    است.


    در پیاده‌روی چهارروزهٔ مستیا تا اوشگولی، آدیشی منزلگاه شب دوم است. صبح سوم در کنار آدیشچالا آغاز می‌شود:
    بی‌پل، با آبِ ذوب‌شدهٔ خاکستری و تند، و سوارکاران محلی که در برابر مزد، پیاده‌روها را به آن سو می‌برند.
    زود راه بیفتید؛ تا بعدازظهر آب رود بالا می‌آید. بالاتر در دره، یک ساعت و نیم تا دو ساعت پیاده، یخچال
    آدیشی زیر تتنولدی فرو می‌ریزد.


    انزوا برج‌ها و کتاب را نجات داد و همان انزوا روستا را کوچک نگه می‌دارد. داد و ستد امروز ساده است:
    تختی در مهمان‌خانه و شامی، که پولش نقد پرداخت می‌شود و در دست خانواده‌هایی می‌ماند که ماندند.
  tip: >-
    پول نقد بیاورید: نه خودپرداز هست، نه کارت‌خوان و نه مغازه، پس خوراک را از مستیا بخرید. در ژوئیه و
    اوت مهمان‌خانه را از پیش رزرو کنید، اما انتظار داشته باشید که تلفن آنتن ندهد و نقشه‌های آفلاین را
    دانلود کنید. از آدیشچالا فقط صبح بگذرید و به جای پیاده گذشتن از آب، از سوارکاران کمک بگیرید — آب سرد
    چون یخ و تند است. شب‌ها در ارتفاع ۲,۰۴۰ متر حتی در میانهٔ تابستان سرد است. برای روستا و کلیساهایش
    سه ساعت و اگر یخچال را هم اضافه کنید یک روز کامل در نظر بگیرید. در زمستان برف راه را می‌بندد؛ فصل
    واقعی از میانهٔ ژوئن تا اواخر سپتامبر است.
  route: >-
    از تفلیس با جادهٔ S1 (E60) از کنار کوتائیسی تا سامتردیا بروید، روی S1 از سناکی بگذرید تا زوگدیدی،
    سپس درهٔ اینگوری را تا مستیا بالا بروید — حدود ۴۷۰ کیلومتر آسفالت. در زوگدیدی یا مستیا سوخت‌گیری کنید؛
    بالاتر هیچ پمپ بنزینی نیست. از مستیا حدود بیست کیلومتر در جادهٔ اوشگولی به سوی شرق تا دوراهی بوگرشی
    بروید؛ از آن‌جا نزدیک به نه کیلومتر راه جیپ‌روِ پرشیار و سنگلاخ تا روستا بالا می‌رود: روی هم رفته
    حدود ۵۰۵ کیلومتر و ده ساعت و ربع. این بخش پایانی فقط برای یک خودروی دودیفرانسیل و شاسی‌بلند واقعی
    است و پس از باران حتی آن هم به زحمت می‌افتد. بسیاری خودرو را سر دوراهی می‌گذارند و در حدود سه ساعت
    پیاده بالا می‌روند، یا از مستیا جیپ می‌گیرند.
he:
  name: אדישי
  short: >-
    כפר סוואני בגובה 2,040 מ׳, עם מגדלים, ארבע כנסיות מימי הביניים ונהר קרחוני ללא גשר — ששמר במשך מאות
    שנים על ספר בשורות משנת 897.
  body: >-
    **במשך מאות שנים שמר אדישי על ספר שנכתב בשנת 897; את הדרך הלאה חוסם עד היום נהר קרחוני שאין עליו גשר.**


    הספר הוא ספר הבשורות של אדישי, כתב היד המתוארך הקדום ביותר של הבשורות בגאורגית שהשתמר. הסופר מיכאל
    העתיק אותו במנזר שטברדי שבקלארג׳תי, חבל ארץ השוכן כיום בצפון-מזרח טורקיה. רישום מאוחר יותר של ניקולאוס,
    לשעבר ראש מנזר ג׳ומטי, מספר כיצד אסף אותו יחד עם ספרים אחרים; עד המאה ה-16 כבר היה הספר בסוואנתי,
    אבל מי הביא אותו לכאן, ומדוע, איש אינו יודע. תושבי הכפר רשמו בשוליו התחתונים הסכמים שאושרו בשבועה,
    וקראו ל„מושיע של הדישי“ — הצורה הסוואנית של שם הכפר — להיות עד. אכוותימה תאקאישווילי פרסם את כתב היד
    ב-1916; היום הוא שמור במוזיאון במסטיה.


    הכפר שוכן בגובה 2,040 מטר מעל נהר האדישצ׳אלה, ובמפקד 2014 נמנו בו 44 תושבים. במקום קטן כל כך יש הרבה
    מאוד: מגדלים סוואניים, בתי אבן עם מתבנים לחציר, וארבע כנסיות מימי הביניים — כנסיית המושיע (המאות ה-10–11),
    שתיים המוקדשות לגאורגיוס הקדוש ואחת למלאך הראשי (שלושתן מן המאה ה-12). בערב מיתמר עשן עצים בין המגדלים,
    והקול הרם ביותר הוא קולו של הנהר.


    בטרק בן ארבעת הימים ממסטיה לאושגולי, אדישי הוא תחנת הלינה של הלילה השני. הבוקר השלישי מתחיל על גדת
    האדישצ׳אלה: אין גשר, מי הפשרה אפורים ומהירים, ורוכבי סוסים מקומיים מעבירים את המטיילים לגדה השנייה
    תמורת תשלום. צאו מוקדם; אחר הצהריים מפלס הנהר עולה. במעלה העמק, שעה וחצי עד שעתיים ברגל, נשפך קרחון
    אדישי מתחת לתתנולדי.


    הבידוד הציל את המגדלים ואת הספר, והוא גם שומר על הכפר קטן. העסקה היום פשוטה: מיטה וארוחת ערב בבית
    הארחה, בתשלום במזומן, והכסף נשאר אצל המשפחות שנשארו.
  tip: >-
    הביאו מזומן: אין כספומט, אין מסוף לכרטיסי אשראי ואין חנות, אז קנו אוכל במסטיה. ביולי ובאוגוסט הזמינו
    בית הארחה מראש, אבל היו מוכנים לכך שלא תהיה קליטה, והורידו מפות לא מקוונות. חצו את האדישצ׳אלה רק בבוקר,
    ועם הרוכבים ולא ברגל בתוך המים — המים קפואים וזורמים במהירות. הלילות בגובה 2,040 מ׳ קרים גם באמצע
    הקיץ. הקציבו שלוש שעות לכפר ולכנסיותיו, ויום שלם אם מוסיפים את הקרחון. בחורף השלג חוסם את הדרך; העונה
    המעשית נמשכת מאמצע יוני עד סוף ספטמבר.
  route: >-
    מטביליסי סעו בכביש S1 (E60) על פני כותאיסי עד סמטרדיה, המשיכו ב-S1 דרך סנקי עד זוגדידי, ומשם טפסו
    במעלה ערוץ האנגורי עד מסטיה — כ-470 ק״מ סלולים. תדלקו בזוגדידי או במסטיה; בהמשך הדרך אין תחנות דלק.
    ממסטיה סעו כעשרים קילומטרים מזרחה בדרך לאושגולי עד הפנייה בבוגרשי, ומשם עולים כתשעה קילומטרים של דרך
    ג׳יפים סלעית ומלאת תלמים אל הכפר: בסך הכול כ-505 ק״מ ועשר שעות ורבע. הקטע האחרון מתאים רק לרכב שטח
    של ממש עם הנעה כפולה ומרווח גחון גבוה, ואחרי גשם גם הוא מתקשה. רבים משאירים את הרכב בפנייה ועולים
    ברגל, כשלוש שעות, או לוקחים ג׳יפ ממסטיה.
ar:
  name: أديشي
  short: >-
    قرية سفانية على ارتفاع 2,040 م بأبراجها وأربع كنائس من العصور الوسطى ونهر جليدي بلا جسر — حارسة إنجيل
    من عام 897 طوال قرون.
  body: >-
    **حفظت أديشي على مدى قرون كتاباً كُتب عام 897، ولا يزال الطريق منها إلى ما بعدها مسدوداً بنهر جليدي
    لا جسر عليه.**


    الكتاب هو إنجيل أديشي، أقدم مخطوطة مؤرّخة باقية للأناجيل باللغة الجورجية. نسخه الناسخ ميخائيل في دير
    شاتبيردي في كلارجيتي، وهي أرض تقع اليوم في شمال شرق تركيا. وتروي حاشية لاحقة كتبها نيكولاوس، الرئيس
    السابق لدير جوماتي، كيف جمعه مع كتب أخرى؛ وبحلول القرن السادس عشر كان الكتاب في سفانيتي، أما من حمله
    إلى هنا ولماذا فلا أحد يعلم. وقد دوّن القرويون في هوامشه السفلى عهوداً موثّقة بالقسم، مستشهدين بـ"مخلّص
    هاديشي" — وهو الاسم السفاني للقرية. نشر إكفتيمي تاكايشفيلي المخطوطة عام 1916، وهي اليوم محفوظة في
    متحف ميستيا.


    تقع القرية على ارتفاع 2,040 متراً فوق نهر أديشتشالا، وقد أحصى تعداد عام 2014 فيها 44 نسمة. ومع صغرها
    تضمّ الكثير: أبراجاً سفانية، وبيوتاً حجرية فوقها مخازن للتبن، وأربع كنائس من العصور الوسطى — كنيسة
    المخلّص (القرنان العاشر والحادي عشر)، واثنتين مكرّستين للقديس جاورجيوس، وواحدة لرئيس الملائكة (والثلاث
    من القرن الثاني عشر). وفي المساء ينساب دخان الحطب بين الأبراج، ويكون أعلى صوت هو صوت النهر.


    في مسيرة الأيام الأربعة من ميستيا إلى أوشغولي، تكون أديشي محطة الليلة الثانية. ويبدأ الصباح الثالث
    عند أديشتشالا: لا جسر، ومياه ذوبان رمادية سريعة، وفرسان محليون ينقلون المشاة إلى الضفة الأخرى لقاء
    أجر. انطلق باكراً، فالنهر يرتفع بعد الظهر. وفي أعلى الوادي، على مسيرة ساعة ونصف إلى ساعتين، ينسكب
    نهر أديشي الجليدي تحت قمة تيتنولدي.


    العزلة أنقذت الأبراج والكتاب، وهي نفسها تُبقي القرية صغيرة. والصفقة اليوم بسيطة: سرير وعشاء في بيت
    ضيافة، يُدفع ثمنهما نقداً، ويبقى المال في العائلات التي بقيت.
  tip: >-
    أحضر نقوداً: لا صراف آلياً هنا ولا جهاز دفع بالبطاقات ولا متجر، فاشترِ طعامك من ميستيا. احجز بيت الضيافة
    مسبقاً في يوليو وأغسطس، لكن توقّع انقطاع شبكة الهاتف ونزّل الخرائط للاستخدام دون اتصال. لا تعبر أديشتشالا
    إلا صباحاً، واستعن بالفرسان بدلاً من الخوض — فالماء جليدي وسريع. الليالي باردة على ارتفاع 2,040 م
    حتى في منتصف الصيف. خصّص ثلاث ساعات للقرية وكنائسها، ويوماً كاملاً إن أضفت النهر الجليدي. الثلج يغلق
    الطريق شتاءً، والموسم الفعلي يمتد من منتصف يونيو إلى أواخر سبتمبر.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) مروراً بكوتايسي حتى سامتريديا، وتابع على S1 عبر سيناكي إلى زوغديدي،
    ثم اصعد مضيق إنغوري حتى ميستيا — نحو 470 كم من الطرق المعبّدة. تزوّد بالوقود في زوغديدي أو ميستيا،
    فلا محطات وقود بعدهما. ومن ميستيا اتبع طريق أوشغولي شرقاً نحو عشرين كيلومتراً حتى المنعطف عند بوغريشي،
    حيث يصعد مسلك وعر مليء بالأخاديد والحجارة، طوله نحو تسعة كيلومترات، إلى القرية: المجموع نحو 505 كم
    وعشر ساعات وربع. هذا المقطع الأخير لا يصلح إلا لسيارة دفع رباعي حقيقية عالية الخلوص عن الأرض، وبعد
    المطر تتعثّر حتى هذه. ويترك كثيرون السيارة عند المنعطف ويصعدون سيراً في نحو ثلاث ساعات، أو يستقلّون
    سيارة جيب من ميستيا.
