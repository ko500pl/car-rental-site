ka:
  name: სვანეთის ისტორიისა და ეთნოგრაფიის მუზეუმი
  short: >-
    სვანეთის საგანძური: ჭედური ხატები, მოჭედილი ხელნაწერები და 897 წლის ადიშის ოთხთავი — მუზეუმი, რომლის
    დამაარსებელიც მომდევნო წელს დახვრიტეს.
  body: >-
    **ეგნატე გაბლიანმა ეს მუზეუმი 1936 წელს დააარსა, მომდევნო წელს კი დახვრიტეს. რაც მან დაიწყო, იმ რეჟიმს
    გადაურჩა, რომელმაც ის მოკლა.**


    გაბლიანი 1881 წელს მესტიაში დაიბადა და პეტერბურგის უნივერსიტეტში აღმოსავლეთმცოდნეობა შეისწავლა. მისი
    წიგნი „თავისუფალი სვანეთი“ 1927 წელს გამოვიდა; ის 1921 წლის სვანეთის ამბოხის ერთ-ერთი მეთაური იყო
    და ზუგდიდი–მესტიის საავტომობილო გზისა და მესტიის აეროპორტის მშენებლობის ერთ-ერთი ინიციატორი — იმ გზისა,
    რომლითაც თქვენ ამოხვედით. მუზეუმის პირველი დირექტორიც თავად გახდა. 1937 წელს არალეგალური ორგანიზაციის
    წევრობის ბრალდებით დახვრიტეს. კოლექციის საფუძველი მესტიის გულში, სეტის წმინდა გიორგის ეკლესიის სიძველეებმა
    შეადგინა.


    დარბაზებში განათება განზრახ მკრთალია — ლითონსა და საღებავს სინათლე აზიანებს. თვალს ერთი წუთი აცალეთ
    და ოქრო სანთლის შუქზე ნანახივით აციმციმდება: X საუკუნის მაცხოვრის ხატი, XI საუკუნის ხატები აღსაყდრებული
    ქრისტეს გამოსახულებით, XII საუკუნის ორმოცი მოწამისა და ჯვარცმის ხატები, IX–X საუკუნეების ღვთისმშობლის
    ფერწერული ხატები, ადიშის, ლაბსყალდის, იენაშისა და მესტიის ოთხთავები მოჭედილ ყდებში. მათ გვერდით —
    საომარი აღჭურვილობა, სამკაულები, ქსოვილები, ძვ. წ. V საუკუნის მონეტები და სვანური ყოფის ნივთები.


    მთავარი მაინც ადიშის ოთხთავია: 897 წელს კლარჯეთში, შატბერდის ლავრაში, გადამწერ მიქაელის მიერ გადაწერილი,
    სახარების უძველესი თარიღიანი ქართული ხელნაწერი, რომელმაც ჩვენამდე მოაღწია. XVI საუკუნისთვის წიგნი
    უკვე მაღალმთიან ადიშში იყო, მის აშიებზე კი დღემდე იკითხება სოფლელთა ფიცით განმტკიცებული შეთანხმებები.
    ვინ ამოიტანა იგი მთაში, არავინ იცის. მთელი სვანეთის ამბავი ერთ წიგნში ჩაეტია: განძი ბარიდან მთისკენ
    მიიწევდა, ხეობები კი მას ინახავდა.


    მუზეუმიდან გამოსულს მესტიის კოშკები სხვაგვარად დაგხვდებათ — იგივე აზრი, ოღონდ ქვაში ნათქვამი: რაც
    ძვირფასია, მაღლა და მიუწვდომლად უნდა ინახებოდეს.
  tip: >-
    მესტიაში პირველი გაჩერება აქ გააკეთეთ: საათნახევარი საკმარისია, გიდთან ერთად — ორი, და ამის შემდეგ
    კოშკებიც უფრო გასაგები გახდება. შესვლა დაახლოებით 15 ლარი ღირს. წარწერები მოკლეა, ამიტომ გიდი თავის
    ფასს ამართლებს. დიდი ჩანთა შესასვლელთან დატოვეთ; გადაღების წესები დარბაზების მიხედვით განსხვავდება,
    ამიტომ ფოტოაპარატის აწევამდე იკითხეთ. ზაფხულში შუადღისას ჯგუფები მოდიან, დილა უფრო მშვიდია. გამთბარი
    დარბაზები წვიმიანი დღისთვის საუკეთესო გეგმაა, სეტის მოედნის კაფეები კი რამდენიმე წუთის სავალზეა.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ იმავე ს1-ით სენაკის გავლით
    ზუგდიდამდე, იქიდან კი ზუგდიდი–ჯვარი–მესტიის გზით ენგურის ხეობას აუყევით: სულ დაახლოებით 470 კმ და
    რვანახევარი საათი, მთელ გზაზე ასფალტი. ზუგდიდიდან ბოლო 130 კილომეტრი ვიწრო და დაუსრულებლად დაკლაკნილია,
    წვიმის შემდეგ ქვათაცვენით, ზამთარში კი მოყინული — მისთვის დაახლოებით სამი საათი გამოყავით. საწვავი
    ზუგდიდში ჩაასხით, ხეობაში სადგურები საიმედო არ არის. მუზეუმი მესტიის ცენტრშია, სეტის მოედნიდან ფეხით
    რამდენიმე წუთში. ზაფხულში ნებისმიერი მანქანა გამოდგება, ზამთარში კი ზამთრის საბურავებიანი ჯიპი ან
    კროსოვერი ჯობს.
en:
  name: Svaneti Museum of History and Ethnography
  short: >-
    Svaneti's strongroom: beaten-silver icons, Gospel books and the Adishi Gospels of 897, gathered by
    a founder who was shot a year later.
  body: >-
    **Egnate Gabliani founded this museum in 1936 and was shot the following year; what he began has outlived
    the regime that killed him.**


    Gabliani was born in Mestia in 1881 and studied oriental languages in St Petersburg. He wrote *Free
    Svaneti* (1927), was one of the leaders of the Svan uprising of 1921 against Soviet rule, and pushed
    for the road from Zugdidi and for an airfield — the same road you drove in on. He became the museum's
    first director. In 1937 he was executed on a charge of belonging to an underground organisation. The
    core of his collection came from the church of St George at Seti, in the heart of Mestia.


    Inside, light is kept low to protect metal and pigment. Give your eyes a minute and the gold begins
    to move as it would by candlelight: a tenth-century icon of the Saviour, eleventh-century images of
    Christ enthroned, a twelfth-century Forty Martyrs and a Crucifixion, painted icons of the Virgin from
    the ninth and tenth centuries, Gospel books from Adishi, Labskaldi, Ienashi and Mestia in covers of
    beaten metal. Beyond them lie weapons, jewellery, textiles, coins as old as the fifth century BC,
    and the tools of Svan daily life.


    The Adishi Gospels are the heart of it: copied in 897 by the scribe Mikael at Shatberdi in Klarjeti,
    the oldest dated Georgian Gospel manuscript to survive. By the sixteenth century the book was in the
    high village of Adishi, and its margins still carry the villagers' sworn pledges. Nobody knows who
    carried it up the mountain. That is Svaneti's whole story in one volume: treasure drifted uphill,
    and the valleys kept it.


    Walk out afterwards and the towers of Mestia read differently — the same idea in stone: keep what
    matters high and hard to reach.
  tip: >-
    Make this your first stop in Mestia: an hour and a half is enough, two if you take a guide, and the
    towers make more sense afterwards. Entry is about 15 lari. Labels are short, so a guide repays the
    cost. Large bags stay at the entrance, and photography rules differ from hall to hall — ask before
    you shoot. In summer, tour groups gather around midday, so mornings are quieter. The heated halls
    make it the natural plan for a wet day, and the cafés of Seti Square are a few minutes' walk away.
  route: >-
    From Tbilisi take the S1 (E60) past Kutaisi to Samtredia, continue on the S1 through Senaki to Zugdidi,
    then follow the Zugdidi–Jvari–Mestia road up the Enguri gorge: about 470 km and eight and a half hours,
    asphalt all the way. The last 130 km from Zugdidi are narrow and endlessly winding, with rockfall
    after rain and ice in winter — allow about three hours for them. Fill up in Zugdidi, as stations further
    up the gorge are unreliable. The museum is in the centre of Mestia, a short walk from Seti Square.
    In summer any car will do; in winter an SUV or crossover on winter tyres is the sensible choice.
ru:
  name: Сванетский музей истории и этнографии
  short: >-
    Сокровищница Сванетии: чеканные серебряные иконы, Евангелия и Адишское Евангелие 897 года — собрание
    основателя, расстрелянного через год после открытия.
  body: >-
    **Эгнате Габлиани основал этот музей в 1936 году, а на следующий год был расстрелян; начатое им пережило
    режим, который его убил.**


    Габлиани родился в Местии в 1881 году и изучал восточные языки в Петербурге. Он написал книгу *«Свободная
    Сванетия»* (1927), был одним из руководителей сванского восстания 1921 года против советской власти
    и добивался строительства дороги из Зугдиди и аэродрома — той самой дороги, по которой вы сюда приехали.
    Он стал первым директором музея. В 1937 году его казнили по обвинению в принадлежности к подпольной
    организации. Ядро его собрания составили сокровища церкви Святого Георгия в Сети, в самом сердце Местии.


    Внутри свет приглушён, чтобы сберечь металл и краски. Дайте глазам минуту — и золото оживает, как
    при свечах: икона Спаса X века, образы Христа на престоле XI века, «Сорок мучеников» и «Распятие»
    XII века, писаные иконы Богородицы IX и X веков, Евангелия из Адиши, Лабскалди, Иенаши и Местии в
    окладах чеканного металла. Дальше — оружие, украшения, ткани, монеты, самые древние из которых относятся
    к V веку до н. э., и орудия повседневного сванского быта.


    Сердце собрания — Адишское Евангелие: его переписал в 897 году писец Микаел в Шатберди, в Кларджети,
    и это древнейшая из сохранившихся датированных рукописей грузинского Евангелия. К XVI веку книга оказалась
    в высокогорном селе Адиши, и на её полях до сих пор видны клятвенные записи жителей. Кто принёс её
    в горы, неизвестно. В этом томе — вся история Сванетии: сокровища поднимались вверх, а долины их хранили.


    Выйдите потом на улицу — и башни Местии прочтутся иначе: та же мысль, воплощённая в камне, — держать
    самое ценное высоко и недоступно.
  tip: >-
    Сделайте музей первой остановкой в Местии: хватит полутора часов, двух — с гидом, и после него башни
    станут понятнее. Вход — около 15 лари. Подписи краткие, так что гид окупается. Большие сумки оставляют
    у входа, а правила фотосъёмки в разных залах разные — спрашивайте, прежде чем снимать. Летом к полудню
    собираются экскурсионные группы, утром спокойнее. Залы отапливаются, так что в дождливый день это
    естественный план, а до кафе на площади Сети — несколько минут пешком.
  route: >-
    Из Тбилиси по S1 (E60) мимо Кутаиси до Самтредиа, дальше по S1 через Сенаки до Зугдиди, затем по дороге
    Зугдиди — Джвари — Местиа вверх по ущелью Ингури: около 470 км и восьми с половиной часов, всё по
    асфальту. Последние 130 км от Зугдиди узкие и бесконечно петляют, после дождей случаются камнепады,
    зимой гололёд, — закладывайте на них около трёх часов. Заправьтесь в Зугдиди: выше по ущелью заправки
    ненадёжны. Музей находится в центре Местии, в нескольких минутах ходьбы от площади Сети. Летом подойдёт
    любая машина; зимой разумный выбор — внедорожник или кроссовер на зимней резине.
fa:
  name: موزهٔ تاریخ و مردم‌شناسی سوانتی
  short: >-
    گنجخانهٔ سوانتی: شمایل‌های نقره‌کوب، انجیل‌ها و انجیل آدیشی از سال ۸۹۷، گردآوردهٔ بنیان‌گذاری که یک
    سال بعد تیرباران شد.
  body: >-
    **اگناته گابلیانی این موزه را در سال ۱۹۳۶ بنیان گذاشت و سال بعد تیرباران شد؛ آنچه او آغاز کرد از رژیمی
    که او را کشت بیشتر عمر کرده است.**


    گابلیانی در سال ۱۸۸۱ در مستیا زاده شد و در سن‌پترزبورگ زبان‌های شرقی خواند. او کتاب *سوانتی آزاد*
    (۱۹۲۷) را نوشت، یکی از رهبران قیام سوان‌ها در سال ۱۹۲۱ بر ضد حکومت شوروی بود و برای ساختن جاده‌ای
    از زوگدیدی و یک فرودگاه کوشید — همان جاده‌ای که شما از آن به این‌جا رسیده‌اید. او نخستین مدیر موزه
    شد. در سال ۱۹۳۷ به اتهام عضویت در سازمانی زیرزمینی اعدام شد. هستهٔ مجموعهٔ او از کلیسای قدیس گئورگی
    در ستی، در دل مستیا، آمده بود.


    درون موزه نور را کم نگه می‌دارند تا فلز و رنگدانه آسیب نبینند. یک دقیقه به چشمانتان فرصت دهید تا طلا،
    چنان‌که در نور شمع، جان بگیرد: شمایلی از مسیحِ منجی از سدهٔ دهم، تصویرهایی از مسیح بر تخت از سدهٔ
    یازدهم، «چهل شهید» و «تصلیب» از سدهٔ دوازدهم، شمایل‌های نقاشی‌شدهٔ مریم باکره از سده‌های نهم و دهم،
    و انجیل‌هایی از آدیشی، لابسکالدی، یناشی و مستیا در جلدهایی از فلز کوبیده. پس از آن‌ها سلاح‌ها، زیورآلات،
    پارچه‌ها، سکه‌هایی که کهن‌ترینشان به سدهٔ پنجم پیش از میلاد می‌رسد، و ابزارهای زندگی روزمرهٔ سوان‌ها
    جای دارند.


    انجیل آدیشی قلب این مجموعه است: کاتبی به نام میکائل آن را در سال ۸۹۷ در شاتبردی در کلارجتی رونویسی
    کرد و این کهن‌ترین نسخهٔ خطیِ تاریخ‌دارِ انجیل گرجی است که بر جای مانده. تا سدهٔ شانزدهم کتاب به روستای
    بلندِ آدیشی رسیده بود و حاشیه‌هایش هنوز پیمان‌های سوگندخوردهٔ روستاییان را در خود دارد. کسی نمی‌داند
    چه کسی آن را به کوهستان برد. این همهٔ داستان سوانتی است در یک جلد: گنج‌ها رو به بالا راه یافتند و
    دره‌ها نگهشان داشتند.


    پس از آن که بیرون بیایید، برج‌های مستیا را جور دیگری خواهید خواند — همان اندیشه در قالب سنگ: آنچه
    را ارزشمند است بالا و دور از دسترس نگه دار.
  tip: >-
    این موزه را نخستین ایستگاه خود در مستیا کنید: یک ساعت و نیم کافی است، و اگر راهنما بگیرید دو ساعت؛
    پس از آن برج‌ها معنای روشن‌تری پیدا می‌کنند. ورودی حدود ۱۵ لاری است. توضیح‌های کنار آثار کوتاه‌اند،
    پس هزینهٔ راهنما می‌ارزد. کیف‌های بزرگ را دم در می‌گیرند و قواعد عکاسی از تالاری به تالار دیگر فرق
    می‌کند — پیش از عکس گرفتن بپرسید. در تابستان گروه‌های تور نزدیک ظهر جمع می‌شوند، پس صبح‌ها آرام‌تر
    است. تالارهای گرم آن را به برنامهٔ طبیعی یک روز بارانی بدل می‌کنند و کافه‌های میدان ستی چند دقیقه
    پیاده بیشتر فاصله ندارند.
  route: >-
    از تفلیس از جادهٔ S1 (E60) و از کنار کوتائیسی تا سامتردیا بروید، روی S1 از سناکی بگذرید تا زوگدیدی،
    سپس جادهٔ زوگدیدی–جواری–مستیا را در درهٔ اینگوری بالا بروید: حدود ۴۷۰ کیلومتر و هشت ساعت و نیم، سراسر
    آسفالت. ۱۳۰ کیلومتر پایانی از زوگدیدی باریک و بی‌پایان پرپیچ‌وخم است، با ریزش سنگ پس از باران و یخ
    در زمستان — برای آن حدود سه ساعت در نظر بگیرید. در زوگدیدی باک را پر کنید، چون پمپ بنزین‌های بالادست
    دره قابل اتکا نیستند. موزه در مرکز مستیا است، چند قدم پیاده از میدان ستی. در تابستان هر خودرویی کافی
    است؛ در زمستان شاسی‌بلند یا کراس‌اوور با لاستیک زمستانی انتخاب عاقلانه است.
he:
  name: מוזיאון סוואנתי להיסטוריה ולאתנוגרפיה
  short: >-
    חדר האוצרות של סוואנתי: איקונות מכסף מרוקע, ספרי בשורות ובשורות אדישי משנת 897, שאסף מייסד שהוצא להורג
    שנה אחר כך.
  body: >-
    **אגנאטה גבליאני ייסד את המוזיאון הזה ב-1936 והוצא להורג בירייה בשנה שלאחר מכן; מה שהחל בו האריך ימים
    יותר מן המשטר שהרג אותו.**


    גבליאני נולד במסטיה ב-1881 ולמד שפות המזרח בסנקט פטרבורג. הוא כתב את *סוואנתי החופשית* (1927), היה
    מראשי המרד הסוואני של 1921 נגד השלטון הסובייטי, ופעל לסלילת הכביש מזוגדידי ולהקמת שדה תעופה — אותו
    כביש שבו הגעתם לכאן. הוא היה המנהל הראשון של המוזיאון. ב-1937 הוצא להורג באשמת חברות בארגון מחתרתי.
    גרעין האוסף שלו הגיע מכנסיית גאורגיוס הקדוש בסטי, בלב מסטיה.


    בפנים התאורה עמומה, כדי להגן על המתכת ועל הצבעים. תנו לעיניים דקה, והזהב מתחיל לנוע כמו לאור נרות:
    איקונה של ישו המושיע מן המאה העשירית, דמויות של ישו היושב על כס המלכות מן המאה ה-11, „ארבעים הקדושים
    המעונים“ ו„הצליבה“ מן המאה ה-12, איקונות מצוירות של מריה הבתולה מן המאות התשיעית והעשירית, וספרי בשורות
    מאדישי, מלבסקלדי, מיינאשי וממסטיה בכריכות של מתכת מרוקעת. מעבר להם — כלי נשק, תכשיטים, אריגים, מטבעות
    שהעתיקים שבהם מן המאה החמישית לפני הספירה, וכלי חיי היומיום של הסוואנים.


    לב האוסף הוא ספר הבשורות של אדישי: הלבלר מיכאל העתיק אותו ב-897 בשטברדי שבקלארג׳תי, וזהו כתב היד המתוארך
    הקדום ביותר של הבשורות בגאורגית שהשתמר. עד המאה ה-16 הגיע הספר לכפר ההררי אדישי, ובשוליו עדיין רשומות
    התחייבויות השבועה של תושבי הכפר. איש אינו יודע מי נשא אותו במעלה ההר. זה כל סיפורה של סוואנתי בכרך
    אחד: האוצרות נסחפו במעלה ההר, והעמקים שמרו עליהם.


    צאו אחר כך החוצה, ומגדלי מסטיה נקראים אחרת — אותו רעיון עצמו, באבן: לשמור את מה שחשוב גבוה ורחוק מהישג
    יד.
  tip: >-
    עשו את המוזיאון לתחנה הראשונה שלכם במסטיה: שעה וחצי מספיקה, שעתיים עם מדריך, ואחר כך המגדלים מובנים
    יותר. הכניסה עולה כ-15 לארי. השלטים קצרים, ולכן מדריך שווה את מחירו. תיקים גדולים נשארים בכניסה, וכללי
    הצילום משתנים מאולם לאולם — שאלו לפני שאתם מצלמים. בקיץ קבוצות מאורגנות מתקבצות סביב הצהריים, ולכן
    הבקרים שקטים יותר. האולמות המחוממים הופכים אותו לתוכנית המתבקשת ליום גשום, ובתי הקפה של כיכר סטי נמצאים
    במרחק דקות הליכה.
  route: >-
    מטביליסי סעו בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה, המשיכו ב-S1 דרך סנקי עד זוגדידי, ומשם בכביש
    זוגדידי–ג׳ווארי–מסטיה במעלה ערוץ האנגורי: כ-470 ק״מ ושמונה וחצי שעות, כולו סלול. 130 הק״מ האחרונים
    מזוגדידי צרים ומתפתלים בלי סוף, עם נפילות סלעים אחרי גשם וקרח בחורף — הקציבו להם כשלוש שעות. תדלקו
    בזוגדידי, כי תחנות הדלק במעלה הערוץ אינן אמינות. המוזיאון נמצא במרכז מסטיה, הליכה קצרה מכיכר סטי.
    בקיץ כל רכב מתאים; בחורף הבחירה הנבונה היא רכב שטח או קרוסאובר עם צמיגי חורף.
ar:
  name: متحف سفانيتي للتاريخ والإثنوغرافيا
  short: >-
    خزانة كنوز سفانيتي: أيقونات من الفضة المطروقة وأناجيل وإنجيل أديشي من عام 897، جمعها مؤسس أُعدم رمياً
    بالرصاص بعد عام.
  body: >-
    **أسّس إغناتي غابلياني هذا المتحف عام 1936 وأُعدم رمياً بالرصاص في العام التالي؛ وما بدأه عاش أطول
    من النظام الذي قتله.**


    وُلد غابلياني في ميستيا عام 1881 ودرس اللغات الشرقية في سانت بطرسبورغ. ألّف كتاب *سفانيتي الحرة* (1927)،
    وكان من قادة الانتفاضة السفانية عام 1921 ضد الحكم السوفييتي، وسعى إلى شقّ الطريق من زوغديدي وإنشاء
    مطار — وهو الطريق نفسه الذي جئت منه. وصار أول مدير للمتحف. وفي عام 1937 أُعدم بتهمة الانتماء إلى منظمة
    سرية. وقد جاءت نواة مجموعته من كنيسة القديس جاورجيوس في سيتي، في قلب ميستيا.


    في الداخل تُبقى الإضاءة خافتة لحماية المعادن والأصباغ. امنح عينيك دقيقة، فيبدأ الذهب بالتلألؤ كما
    لو كان في ضوء الشموع: أيقونة للمسيح المخلّص من القرن العاشر، وصور للمسيح على العرش من القرن الحادي
    عشر، و"الشهداء الأربعون" و"الصلب" من القرن الثاني عشر، وأيقونات مرسومة للسيدة العذراء من القرنين التاسع
    والعاشر، وأناجيل من أديشي ولابسكالدي وييناشي وميستيا بأغلفة من المعدن المطروق. ووراءها أسلحة وحليّ
    ومنسوجات، وعملات يعود أقدمها إلى القرن الخامس قبل الميلاد، وأدوات الحياة اليومية السفانية.


    وقلب المجموعة إنجيل أديشي: نسخه الناسخ ميخائيل عام 897 في شاتبيردي في كلارجيتي، وهو أقدم مخطوطة مؤرّخة
    باقية للأناجيل باللغة الجورجية. وبحلول القرن السادس عشر كان الكتاب في قرية أديشي العالية، ولا تزال
    هوامشه تحمل عهود القرويين الموثّقة بالقسم. ولا أحد يعلم من حمله إلى الجبل. تلك هي قصة سفانيتي كلها
    في مجلّد واحد: كنوز انجرفت صعوداً، ووديان حفظتها.


    اخرج بعد ذلك، فتُقرأ أبراج ميستيا على نحو مختلف — الفكرة ذاتها منحوتة في الحجر: احفظ ما يهمّ عالياً
    وبعيداً عن المتناول.
  tip: >-
    اجعل المتحف محطتك الأولى في ميستيا: تكفي ساعة ونصف، وساعتان مع مرشد، وبعدها تغدو الأبراج أوضح معنى.
    رسم الدخول نحو 15 لاري. البطاقات التعريفية مقتضبة، لذا يستحق المرشد أجره. تُترك الحقائب الكبيرة عند
    المدخل، وتختلف قواعد التصوير من قاعة إلى أخرى — فاسأل قبل أن تصوّر. في الصيف تتجمّع المجموعات السياحية
    قرابة الظهر، فالصباح أهدأ. والقاعات المدفّأة تجعله الخطة الطبيعية ليوم ماطر، ومقاهي ساحة سيتي على
    بعد دقائق سيراً.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) مروراً بكوتايسي حتى سامتريديا، وتابع على S1 عبر سيناكي إلى زوغديدي،
    ثم اتبع طريق زوغديدي–جفاري–ميستيا صعوداً في مضيق إنغوري: نحو 470 كم وثماني ساعات ونصف، كلها معبّدة.
    الكيلومترات الـ130 الأخيرة من زوغديدي ضيقة ومتعرّجة بلا نهاية، تتساقط عليها الصخور بعد المطر ويغطيها
    الجليد شتاءً — فخصّص لها نحو ثلاث ساعات. تزوّد بالوقود في زوغديدي، فمحطات أعلى المضيق لا يُعتمد عليها.
    يقع المتحف في وسط ميستيا، على مسافة قصيرة سيراً من ساحة سيتي. في الصيف تفي أي سيارة بالغرض، أما في
    الشتاء فالخيار الحكيم سيارة دفع رباعي أو كروس أوفر بإطارات شتوية.
