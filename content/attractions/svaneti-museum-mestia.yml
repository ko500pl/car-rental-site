ka:
  name: სვანეთის ისტორიისა და ეთნოგრაფიის მუზეუმი
  short: მესტიის მუზეუმი შუასაუკუნეების ხატებით, ჯვრებით და 897 წლის ადიშის ოთხთავით — სვანეთის გასაღები.
  body: >-
    **თუ სვანეთში ერთადერთი შენობის ნახვის დრო გაქვს, ეს მუზეუმი უნდა იყოს.** ის ახსნის, თუ რატომ დგას
    ამ ხეობებში კოშკები და რატომ ინახებოდა აქ ისეთი ნივთები, რომელთა ადგილიც, ერთი შეხედვით, დედაქალაქებში
    იყო.


    მუზეუმი 1936 წელს დაარსდა, დღევანდელი შენობა კი 2013 წელს გაიხსნა: დაბალი, ნაწილობრივ ფერდობში ჩაშენებული,
    ბეტონისა და ქვის მოცულობა, რომელიც კოშკებს არ ეცილება.


    კოლექცია მთავარია. აქ სვანეთის სოფლის ეკლესიებიდან შეკრებილი შუასაუკუნეების ხატები და საპროცესიო ჯვრებია
    — ოქროსა და ვერცხლის ჭედური ნამუშევრები X-XIV საუკუნეებისა. ჭედურობის ხარისხი ისეთია, რომ ბევრი მათგანი
    სამეფო კარის სახელოსნოებში უნდა შექმნილიყო.


    ცალკე უნდა ითქვას ადიშის ოთხთავზე. ეს 897 წლის ხელნაწერია, ერთ-ერთი უძველესი დათარიღებული ქართული
    წიგნი; ის ტაო-კლარჯეთში, შატბერდის მონასტერში დაიწერა და მოგვიანებით სვანურ სოფელ ადიშში აღმოჩნდა.
    სწორედ ამიტომ ჰქვია.


    ასეთი განძის აქ ყოფნას მარტივი ახსნა აქვს: სვანეთი არასოდეს დაუპყრიათ. როცა დაბლობს არაბები, სელჩუკები,
    მონღოლები ან თემურ-ლენგი ანადგურებდა, ეკლესიები თავიანთ ყველაზე ძვირფას ნივთებს მთაში აგზავნიდნენ.
    ბევრი მათგანი უკან აღარ დაბრუნებულა. ხეობები ფაქტობრივად ქართული შუასაუკუნეების ხელოვნების სეიფად
    იქცა.


    კოლექციაში ასევეა ბიზანტიური და ქართული მინანქარი, ხელნაწერები, იარაღი, ქსოვილები და ეთნოგრაფიული
    ნივთები — საყოფაცხოვრებო ჭურჭლიდან სვანური ქუდისა და საკიდარის ჩათვლით.


    ცალკე დარბაზში ვიტორიო სელას 1889-1890 წლების ფოტოებია. იტალიელი მთამსვლელი და ფოტოგრაფი პირველი იყო,
    ვინც სვანეთი სისტემატურად გადაიღო; მის კადრებში კოშკები, მყინვარები და ადამიანები ისე ჩანან, როგორც
    გზის გაყვანამდე იყვნენ.


    მუზეუმის ერთი ღირსება ისიც არის, რომ ის სვანურ ხელოვნებას ცალკე ფენომენად გაჩვენებს, და არა მხოლოდ
    დაბლობიდან ამოტანილ განძად. ადგილობრივი ოსტატები საკუთარ ხატებსა და ჯვრებსაც ჭედავდნენ; მათი ნამუშევარი
    უფრო მკაცრი და გრაფიკულია, ფიგურები კი ბრტყელი. ერთ დარბაზში ორივე ტრადიცია გვერდიგვერდ დგას და განსხვავება
    ერთი შეხედვით ჩანს.


    განათება განზრახ სუსტია — ეს ჭედურობისა და პიგმენტის დაცვის მოთხოვნაა. თვალს შეგუება სჭირდება, სამაგიეროდ
    ოქრო ისე კრთის, როგორც სანთლის შუქზე.


    საათნახევარი საკმარისია, თუმცა გიდთან ერთად ვიზიტი სულ სხვაა: წარწერები ორენოვანია, მაგრამ მოკლე,
    და კონტექსტის გარეშე ბევრი რამ დახურული რჩება.
  tip: >-
    საათნახევარი დაგეგმე, გიდთან ერთად — ორი. მუზეუმი მესტიის ცენტრიდან ხუთი წუთის სავალზეა და ქალაქში
    პირველ გაჩერებად ჯობია: ამის შემდეგ კოშკები სხვანაირად გამოიყურება. დიდი ჩანთა შესასვლელთან უნდა დატოვო.
    ფოტოს გადაღების წესები დარბაზების მიხედვით განსხვავდება — ჰკითხე. შენობა თბილია და ზამთარშიც კომფორტული.
    ტუალეტი და პატარა მაღაზიაა შიგნით; კაფეები სეთის მოედანთანაა. ზაფხულში შუადღისას ჯგუფები გროვდება
    — დილა უფრო მშვიდია. ბავშვებისთვის საინტერესოა იარაღისა და ეთნოგრაფიის დარბაზები, ხატების ნაწილი კი
    ნაკლებად.
  route: >-
    თბილისიდან E60-ით სენაკამდე, შემდეგ ზუგდიდისკენ და იქიდან ჩრდილოეთით ენგურის ხეობის გზით მესტიამდე
    — დაახლოებით 470 კმ და რვანახევარი საათი. ზუგდიდიდან მესტიამდე გზა ასფალტია და საერთოდ კარგ მდგომარეობაშია,
    მაგრამ ვიწრო, სერპანტინიანი და ზამთარში მოყინული; ქვათაცვენა ხშირია. მუზეუმი მესტიის ცენტრშია, პარკინგი
    წინ. საწვავი ზუგდიდში აიღე — შემდეგი სადგური ხაიშშია და ყოველთვის არ მუშაობს. ჯიპი ან შემაღლებული
    ავტომობილი ჯობია, განსაკუთრებით ზამთარში, როცა უღელტეხილთან ჯაჭვები შეიძლება დაგჭირდეს. ზაფხულში დაბალი
    მანქანაც გაივლის, თუ ფრთხილად მიდიხარ.
en:
  name: Svaneti Museum of History and Ethnography
  short: Mestia’s museum of medieval icons, processional crosses and the Adishi Gospels of 897 — the key
    to Svaneti.
  body: >-
    **If you have time for one building in Svaneti, make it this one.** It explains why the towers stand
    in these valleys, and why objects that belong by rights in a capital city ended up here.


    The museum was founded in 1936; the present building opened in 2013, a low volume of concrete and
    stone set partly into the hillside so that it does not compete with the towers.


    The collection is the point. It holds medieval icons and processional crosses gathered from village
    churches across Svaneti — gold and silver repoussé work of the tenth to fourteenth centuries. The
    quality of the metalwork is such that much of it must have come from royal workshops.


    The Adishi Gospels deserve a paragraph of their own. This manuscript of 897 is one of the oldest dated
    Georgian books. It was written at the monastery of Shatberdi in Tao-Klarjeti and later turned up in
    the Svan village of Adishi, from which it takes its name.


    There is a simple reason why such treasure is here: Svaneti was never conquered. When the lowlands
    were being destroyed by Arabs, Seljuks, Mongols or Timur, churches sent their most valuable objects
    up into the mountains. A great many never went back down. The valleys became, in effect, the strongroom
    of medieval Georgian art.


    The collection also includes Byzantine and Georgian cloisonné enamel, manuscripts, weapons, textiles
    and ethnographic material, from household vessels to Svan hats and cradles.


    One room is given to Vittorio Sella's photographs of 1889 and 1890. The Italian climber and photographer
    was the first to record Svaneti systematically, and his plates show the towers, the glaciers and the
    people as they were before there was a road.


    One further merit of the museum is that it shows Svan work as a phenomenon in its own right, not only
    as treasure carried up from below. Local smiths made their own icons and crosses, and the results
    are harder and more graphic, with flatter figures. In one room the two traditions stand side by side,
    and the difference is visible at a glance.


    The lighting is deliberately low, which is a conservation requirement for metal and pigment. Your
    eyes need a few minutes, but the gold then glimmers as it would have by candlelight.


    An hour and a half is enough, although a guided visit is a different experience: the labels are bilingual
    but brief, and without context a good deal stays closed.
  tip: >-
    Allow an hour and a half, or two with a guide. The museum is five minutes from the centre of Mestia
    and works best as your first stop in town, because the towers look different afterwards. Large bags
    are left at the entrance. Photography rules vary from room to room, so ask. The building is heated
    and comfortable in winter. There are toilets and a small shop inside, with cafés around Seti square.
    Groups gather at midday in summer, so mornings are quieter.
  route: >-
    From Tbilisi take the E60 to Senaki, continue to Zugdidi, then head north up the Enguri valley to
    Mestia — about 470 km and eight and a half hours. The road from Zugdidi to Mestia is asphalt and generally
    in good condition, but it is narrow, endlessly winding and icy in winter, and rockfall is common.
    The museum is in the centre of Mestia with parking in front. Refuel in Zugdidi; the next station is
    at Khaishi and is not always working. A raised car or SUV is preferable, particularly in winter.
ru:
  name: Сванетский музей истории и этнографии
  short: 'Музей в Местии: средневековые иконы, процессионные кресты и Адишское Евангелие 897 года — ключ
    к Сванетии.'
  body: >-
    **Если в Сванетии у вас есть время на одно здание, пусть это будет оно.** Музей объясняет, почему
    в этих ущельях стоят башни и почему вещи, которым по-хорошему место в столице, оказались здесь.


    Музей основан в 1936 году; нынешнее здание открылось в 2013-м — низкий объём из бетона и камня, частично
    врезанный в склон, чтобы не соперничать с башнями.


    Главное здесь — коллекция. В ней средневековые иконы и процессионные кресты, собранные из сельских
    церквей по всей Сванетии: золотая и серебряная чеканка X–XIV веков. Качество металла таково, что многое
    наверняка вышло из царских мастерских.


    Адишское Евангелие заслуживает отдельного абзаца. Эта рукопись 897 года — одна из старейших датированных
    грузинских книг. Её написали в монастыре Шатберди в Тао-Кларджети, а позже она обнаружилась в сванском
    селе Адиши, от которого и получила имя.


    Причина, по которой такое сокровище оказалось здесь, проста: Сванетию никогда не завоёвывали. Когда
    низину разоряли арабы, сельджуки, монголы или Тимур, церкви отправляли самое ценное в горы. Очень
    многое так и не вернулось вниз. Ущелья фактически стали хранилищем средневекового грузинского искусства.


    В собрании есть также византийская и грузинская перегородчатая эмаль, рукописи, оружие, ткани и этнографические
    предметы — от домашней утвари до сванских шапок и колыбелей.


    Отдельный зал отдан фотографиям Витторио Селлы 1889 и 1890 годов. Итальянский альпинист и фотограф
    первым систематически снял Сванетию, и на его пластинах башни, ледники и люди выглядят так, как выглядели
    до появления дороги.


    Ещё одно достоинство музея в том, что он показывает сванскую работу как самостоятельное явление, а
    не только как сокровище, поднятое снизу. Местные мастера делали собственные иконы и кресты, и получалось
    жёстче и графичнее, с более плоскими фигурами. В одном зале обе традиции стоят рядом, и разница видна
    с первого взгляда.


    Освещение намеренно приглушено — это требование сохранности металла и пигмента. Глазам нужно несколько
    минут, зато золото потом мерцает так, как мерцало бы при свечах.


    Полутора часов достаточно, хотя визит с гидом — совсем другой опыт: подписи двуязычные, но короткие,
    и без контекста многое остаётся закрытым.
  tip: >-
    Закладывайте полтора часа, с гидом — два. Музей в пяти минутах от центра Местии и лучше всего работает
    как первая остановка в городе: после него башни выглядят иначе. Большие рюкзаки оставляют у входа.
    Правила съёмки различаются по залам, поэтому спрашивайте. Здание отапливается и зимой комфортно. Внутри
    туалет и небольшой магазин, кафе — вокруг площади Сети. Летом в полдень собираются группы, так что
    утро спокойнее.
  route: >-
    Из Тбилиси по E60 до Сенаки, дальше до Зугдиди, затем на север по ущелью Ингури до Местии — около
    470 км и восемь с половиной часов. Дорога от Зугдиди до Местии асфальтированная и в целом в хорошем
    состоянии, но узкая, бесконечно извилистая и зимой обледенелая; камнепады не редкость. Музей в центре
    Местии, парковка перед ним. Заправляйтесь в Зугдиди: следующая станция в Хаиши и работает не всегда.
    Машина с клиренсом или внедорожник предпочтительнее, особенно зимой.
fa:
  name: موزهٔ تاریخ و مردم‌شناسی سوانتی
  short: موزهٔ مستیا با شمایل‌ها و صلیب‌های سده‌های میانه و انجیل آدیشی سال ۸۹۷ — کلید شناخت سوانتی.
  body: >-
    **اگر در سوانتی تنها برای یک ساختمان وقت دارید، همین باشد.** این موزه توضیح می‌دهد چرا در این دره‌ها
    برج ایستاده و چرا اشیایی که جایشان به‌حق در پایتخت بود سر از اینجا درآوردند.


    موزه در ۱۹۳۶ بنیاد گرفت و ساختمان کنونی در ۲۰۱۳ گشوده شد: حجمی کوتاه از بتن و سنگ که تا حدی در دامنه
    فرو رفته تا با برج‌ها رقابت نکند.


    مجموعه اصل ماجراست. در آن شمایل‌ها و صلیب‌های تشریفاتی سده‌های میانه هست که از کلیساهای روستایی سراسر
    سوانتی گرد آمده‌اند: کار برجسته‌کاری زر و سیم از سدهٔ دهم تا چهاردهم. کیفیت فلزکاری چنان است که بسیاری
    از آنها باید از کارگاه‌های دربار بیرون آمده باشند.


    انجیل آدیشی بندی جداگانه می‌طلبد. این دست‌نوشتهٔ سال ۸۹۷ یکی از کهن‌ترین کتاب‌های تاریخ‌دار گرجی است.
    در صومعهٔ شاتبردی در تائو-کلارجتی نوشته شد و بعدها در روستای سوانی آدیشی پیدا شد و نامش را از همان‌جا
    گرفت.


    دلیل حضور چنین گنجی در اینجا ساده است: سوانتی هرگز فتح نشد. هرگاه جلگه به دست اعراب و سلجوقیان و مغولان
    و تیمور ویران می‌شد، کلیساها گرانبهاترین اشیایشان را به کوه می‌فرستادند. بسیاری از آنها هرگز پایین
    بازنگشتند. دره‌ها عملاً به گاوصندوق هنر گرجی سده‌های میانه بدل شدند.


    در مجموعه مینای بیزانسی و گرجی، دست‌نوشته‌ها، سلاح، پارچه و اشیای مردم‌شناختی نیز هست، از ظرف‌های
    خانگی تا کلاه و گهوارهٔ سوانی.


    یک تالار به عکس‌های ویتوریو سلا در ۱۸۸۹ و ۱۸۹۰ اختصاص دارد. این کوهنورد و عکاس ایتالیایی نخستین کسی
    بود که سوانتی را منظم ثبت کرد، و در صفحات او برج‌ها و یخچال‌ها و مردم چنان دیده می‌شوند که پیش از
    ساخته شدن جاده بودند.


    امتیاز دیگر این موزه آن است که کار سوانی را پدیده‌ای مستقل نشان می‌دهد، نه صرفاً گنجی که از پایین
    بالا آورده شده. زرگران محلی شمایل و صلیب خودشان را می‌ساختند و نتیجه سخت‌تر و گرافیکی‌تر است و پیکرها
    تخت‌ترند. در یک تالار هر دو سنت کنار هم ایستاده‌اند و تفاوت در نگاه نخست دیده می‌شود.


    نور به‌عمد کم است و این الزام حفاظت از فلز و رنگدانه است. چشم چند دقیقه زمان می‌خواهد، اما آنگاه زر
    چنان می‌درخشد که گویی در نور شمع است.


    یک ساعت و نیم بس است، هرچند بازدید با راهنما تجربه‌ای دیگر است: برچسب‌ها دوزبانه اما کوتاه‌اند و بدون
    زمینه بسیاری چیزها بسته می‌ماند.
  tip: >-
    یک ساعت و نیم در نظر بگیرید و با راهنما دو ساعت. موزه پنج دقیقه از مرکز مستیا فاصله دارد و بهتر است
    نخستین توقف شما در شهر باشد، چون پس از آن برج‌ها جور دیگری دیده می‌شوند. کوله‌های بزرگ را کنار ورودی
    می‌گذارند. قواعد عکاسی از تالاری به تالار دیگر فرق می‌کند، پس بپرسید. ساختمان گرم است و در زمستان
    راحت. سرویس بهداشتی و فروشگاهی کوچک در داخل هست و کافه‌ها گرد میدان ستی. تابستان ظهرها گروه‌ها جمع
    می‌شوند، پس صبح آرام‌تر است.
  route: >-
    از تفلیس با E60 تا سناکی، سپس تا زوگدیدی و از آنجا به شمال در درهٔ اینگوری تا مستیا — حدود ۴۷۰ کیلومتر
    و هشت ساعت و نیم. جادهٔ زوگدیدی تا مستیا آسفالت و روی‌هم‌رفته در وضعیت خوبی است، اما باریک و پرپیچ‌وخم
    است و در زمستان یخ می‌بندد و ریزش سنگ در آن معمول است. موزه در مرکز مستیا است و روبه‌رویش پارکینگ
    دارد. سوخت را در زوگدیدی بگیرید؛ پمپ بعدی در خایشی است و همیشه کار نمی‌کند. خودروی مرتفع یا شاسی‌بلند
    بهتر است، به‌ویژه در زمستان.
he:
  name: מוזיאון סוונתי להיסטוריה ואתנוגרפיה
  short: 'המוזיאון של מסטיה: אייקונים וצלבי תהלוכה מימי הביניים ובשורות אדישי משנת 897 — המפתח לסוונתי.'
  body: >-
    **אם יש לכם זמן למבנה אחד בסוונתי, שיהיה זה.** המוזיאון מסביר מדוע עומדים המגדלים בעמקים האלה, ומדוע
    חפצים ששייכים לפי כל היגיון לעיר בירה הגיעו דווקא לכאן.


    המוזיאון נוסד ב-1936; המבנה הנוכחי נפתח ב-2013 — נפח נמוך של בטון ואבן, שקוע חלקית במדרון כדי שלא
    יתחרה במגדלים.


    העיקר הוא האוסף. יש בו אייקונים וצלבי תהלוכה מימי הביניים שנאספו מכנסיות כפריות ברחבי סוונתי: עבודות
    הקשה בזהב ובכסף מן המאות העשירית עד הארבע-עשרה. איכות עבודת המתכת כזאת שרבים מהם ודאי יצאו מסדנאות
    המלוכה.


    בשורות אדישי ראויות לפסקה משלהן. כתב היד הזה משנת 897 הוא מן הספרים הגאורגיים המתוארכים העתיקים ביותר.
    הוא נכתב במנזר שאתברדי בטאו-קלארג׳תי, ולימים נמצא בכפר הסוואני אדישי, וממנו קיבל את שמו.


    הסיבה לכך שאוצר כזה נמצא כאן פשוטה: סוונתי מעולם לא נכבשה. כשהמישור הוחרב בידי הערבים, הסלג׳וקים,
    המונגולים או תימור, שלחו הכנסיות את חפציהן היקרים ביותר אל ההרים. רבים מהם לא חזרו מעולם. העמקים הפכו
    למעשה לכספת של אמנות גאורגיה של ימי הביניים.


    באוסף יש גם אמייל תאי ביזנטי וגאורגי, כתבי יד, כלי נשק, טקסטיל וחומר אתנוגרפי, מכלי בית ועד כובעים
    וערישות סוואניים.


    אולם אחד מוקדש לצילומיו של ויטוריו סלה משנות 1889 ו-1890. המטפס והצלם האיטלקי היה הראשון שתיעד את
    סוונתי באופן שיטתי, ובלוחות שלו נראים המגדלים, הקרחונים והאנשים כפי שהיו לפני שנסללה דרך.


    מעלה נוספת של המוזיאון היא שהוא מציג את העבודה הסוואנית כתופעה בפני עצמה, ולא רק כאוצר שהועלה מלמטה.
    צורפים מקומיים יצרו אייקונים וצלבים משלהם, והתוצאה קשה וגרפית יותר, עם דמויות שטוחות. באולם אחד עומדות
    שתי המסורות זו לצד זו, וההבדל נראה במבט ראשון.


    התאורה עמומה בכוונה, וזו דרישת שימור למתכת ולפיגמנט. העיניים זקוקות לכמה דקות, אך אז הזהב מנצנץ כפי
    שהיה מנצנץ לאור נרות.


    שעה וחצי מספיקה, אף שביקור עם מדריך הוא חוויה אחרת: התוויות דו-לשוניות אך קצרות, ובלי הקשר הרבה נשאר
    סגור.
  tip: >-
    הקצו שעה וחצי, ועם מדריך שעתיים. המוזיאון במרחק חמש דקות ממרכז מסטיה, והוא עובד הכי טוב כתחנה הראשונה
    בעיירה, כי אחריו המגדלים נראים אחרת. תיקים גדולים משאירים בכניסה. כללי הצילום משתנים מאולם לאולם,
    אז שאלו. המבנה מחומם ונוח גם בחורף. יש בפנים שירותים וחנות קטנה, ובתי קפה סביב כיכר סטי. בקיץ מתקבצות
    קבוצות בצהריים, ולכן הבוקר שקט יותר. אולמות הנשק והאתנוגרפיה מעניינים ילדים, ואילו חלק מאולמות האייקונים
    פחות.
  route: >-
    מטביליסי בכביש E60 עד סנאקי, משם לזוגדידי, ואז צפונה במעלה עמק האינגורי עד מסטיה — כ-470 ק״מ ושמונה
    שעות וחצי. הכביש מזוגדידי למסטיה סלול ובדרך כלל במצב טוב, אך צר, מתפתל בלי סוף וקפוא בחורף, ומפולות
    אבנים שכיחות. המוזיאון במרכז מסטיה עם חניה מלפנים. תדלקו בזוגדידי; התחנה הבאה בחאישי ואינה פועלת תמיד.
    עדיף רכב מוגבה או רכב שטח, בעיקר בחורף.
ar:
  name: متحف سفانيتي للتاريخ والإثنوغرافيا
  short: متحف مستيا بأيقوناته وصلبانه الموكبية الوسيطة وإنجيل أديشي من سنة 897 — مفتاح فهم سفانيتي.
  body: >-
    **إن كان لديك وقت لمبنى واحد في سفانيتي فليكن هذا.** فهو يشرح لماذا تقوم الأبراج في هذه الأودية، ولماذا
    انتهت إلى هنا قطع كان مكانها الطبيعي عاصمة من العواصم.


    تأسس المتحف عام 1936، وافتُتح مبناه الحالي عام 2013: كتلة واطئة من الخرسانة والحجر غائرة جزئياً في
    المنحدر كي لا تنافس الأبراج.


    المجموعة هي جوهر الأمر. فيها أيقونات وصلبان موكبية من العصور الوسطى جُمعت من كنائس القرى في أنحاء
    سفانيتي: أعمال ذهب وفضة مطروقة من القرن العاشر إلى الرابع عشر. وجودة الشغل المعدني بحيث لا بد أن كثيراً
    منها خرج من ورش البلاط الملكي.


    ويستحق إنجيل أديشي فقرة خاصة. هذه المخطوطة من سنة 897 من أقدم الكتب الجورجية المؤرخة. كُتبت في دير
    شاتبردي في تاو-كلارجيتي، ثم ظهرت لاحقاً في قرية أديشي السفانية التي أخذت عنها اسمها.


    وسبب وجود هذا الكنز هنا بسيط: لم تُفتح سفانيتي قط. فحين كانت السهول تُدمَّر على أيدي العرب والسلاجقة
    والمغول وتيمور، كانت الكنائس ترسل أثمن ما لديها إلى الجبال. وكثير منها لم يعد إلى الأسفل أبداً. وهكذا
    صارت الأودية عملياً خزانة الفن الجورجي الوسيط.


    وتضم المجموعة أيضاً المينا المقسمة البيزنطية والجورجية، والمخطوطات، والأسلحة، والمنسوجات، والمواد
    الإثنوغرافية، من أواني البيوت إلى القبعات والمهود السفانية.


    وتُخصَّص قاعة لصور فيتوريو سيلا من عامي 1889 و1890. كان هذا المتسلق والمصور الإيطالي أول من وثّق سفانيتي
    توثيقاً منهجياً، وفي ألواحه تظهر الأبراج والأنهار الجليدية والناس كما كانوا قبل أن يوجد طريق.


    ومن مزايا المتحف الأخرى أنه يعرض الصنعة السفانية بوصفها ظاهرة قائمة بذاتها، لا مجرد كنز حُمل من الأسفل.
    فقد صنع الصاغة المحليون أيقوناتهم وصلبانهم، وجاءت أقسى وأكثر خطية، بأشكال أشد استواءً. وفي قاعة واحدة
    يقف التقليدان جنباً إلى جنب، والفرق يُرى من النظرة الأولى.


    الإضاءة خافتة عن قصد، وهذا مطلب حفظ للمعدن والصباغ. تحتاج العين دقائق، لكن الذهب بعدها يلمع كما كان
    يلمع على ضوء الشمع.


    ساعة ونصف تكفي، وإن كانت الزيارة مع مرشد تجربة أخرى: فالبطاقات ثنائية اللغة لكنها مقتضبة، وبغير سياق
    يبقى كثير مغلقاً.
  tip: >-
    خصص ساعة ونصفاً، وساعتين مع مرشد. المتحف على بعد خمس دقائق من وسط مستيا، وأفضل ما يكون محطتك الأولى
    في البلدة، لأن الأبراج تبدو بعده مختلفة. الحقائب الكبيرة تُترك عند المدخل. وقواعد التصوير تختلف من
    قاعة إلى أخرى، فاسأل. المبنى مدفأ ومريح في الشتاء. في الداخل دورات مياه ومتجر صغير، والمقاهي حول ساحة
    سيتي. وفي الصيف تتجمع المجموعات ظهراً، فالصباح أهدأ.
  route: >-
    من تبليسي على الطريق E60 حتى سيناكي، ثم إلى زوغديدي، ثم شمالاً في وادي إنغوري حتى مستيا — نحو 470
    كم وثماني ساعات ونصف. الطريق من زوغديدي إلى مستيا معبّد وبحالة جيدة عموماً، لكنه ضيق دائم الالتواء
    ويتجمد في الشتاء، وسقوط الصخور شائع فيه. المتحف في وسط مستيا وأمامه موقف. تزوّد بالوقود في زوغديدي؛
    فالمحطة التالية في خايشي وهي لا تعمل دائماً. ويُفضل مركبة مرتفعة أو دفع رباعي، وخاصة في الشتاء.
