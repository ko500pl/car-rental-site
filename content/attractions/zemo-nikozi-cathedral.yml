ka:
  name: ზემო ნიქოზის ღვთაების საკათედრო ტაძარი
  short: >-
    საეპისკოპოსო ტაძარი საოკუპაციო ხაზის პირას — გადმოცემით მოწამის საფლავზე აგებული, 2008 წლის აგვისტოს
    დაბომბვის კვალით.
  body: >-
    **საუკუნეების განმავლობაში ნიქოზელი ეპისკოპოსები ჩრდილოეთის მთიელთა მწყემსები იყვნენ; 2008 წლის 10
    აგვისტოს კი მათი ტაძარი ფრონტის ხაზზე აღმოჩნდა.**


    დაახლოებით 800 წელს მემატიანე ჯუანშერი წერს, რომ V საუკუნეში ვახტანგ გორგასალმა ნიქოზის ეკლესია ცეცხლის
    ტაძრის ადგილას ააგო და ეპისკოპოსი იქ დასვა, სადაც ვახტანგის ომში სპარსელთაგან წამებული წმინდა რაჟდენი
    იყო დაკრძალული. ნიქოზში სისტემური გათხრები არასოდეს ჩატარებულა, არც ცეცხლის ტაძარი და არც მოწამის
    სამარხი ჯერ არ უპოვიათ, ამიტომ მეფის მიერ დაარსება გადმოცემად მიიჩნიეთ. XVIII საუკუნის 40-იან წლებში
    ვახუშტი ბატონიშვილი წერს, რომ მის დროსაც აქ ეპისკოპოსი იჯდა — კავკასიელთა, დვალთა და ოსეთის მწყემსი.
    დღეს ტაძარი ნიქოზისა და ცხინვალის ეპარქიის კათედრაა.


    ტაძარი, რომელსაც დღეს ხედავთ, კომპაქტური ჩახაზული ჯვრის ტიპის ნაგებობაა, 16,7 × 11,5 მეტრი, თლილი
    ქვით მოპირკეთებული. სამხრეთ ფასადზე სამსტრიქონიანი ასომთავრული წარწერა მშენებლად ეპისკოპოს მიქაელს
    ასახელებს და X საუკუნით თარიღდება, თუმცა შენობის უდიდესი ნაწილი XIV–XVI საუკუნეების გადაკეთებაა. ზემოთ
    აიხედეთ: ოთხივე ფრონტონის ქიმზე ქვის ვერძის თავი ზის, ვერძები კი ეზოს ჩრდილო-დასავლეთ კუთხეში მდგარი
    XVI–XVII საუკუნეების სამრეკლოდანაც იყურებიან.


    XIII საუკუნის მემატიანე აქ უფრო სევდიან სტუმარსაც იხსენებს: ოსთა მეფეების ერთ-ერთი ძე, თამარ მეფის
    ხელის იმედგაცრუებული მაძიებელი, ნიქოზში გარდაიცვალა და წმინდა რაჟდენის ეკლესიაში დაკრძალეს.


    2008 წლის აგვისტოში რუსულმა საჰაერო თავდასხმებმა კომპლექსს ცეცხლი მოუკიდა. IX–XI საუკუნეების ეპისკოპოსის
    სასახლეს, ახლახან შეკეთებულს, სახურავი, იატაკი და ხის აივნები დაეწვა; ბერების სენაკები, ეპისკოპოსის
    სახლი და სატრაპეზო მთლიანად განადგურდა. ევროპის საბჭოს ინიციატივით ჩატარებულმა სასწრაფო სამუშაოებმა
    გადარჩენილი ნაგებობები გაამაგრა. ნიქოზში უძველესი ფენა გადმოცემაა, უახლესი — ნახანძრალი ქვა.
  tip: >-
    შესვლა უფასოა. ეს მოქმედი ტაძარია: მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარი დასჭირდებათ,
    მსახურების დროს ხმადაბლა ილაპარაკეთ. მოძებნეთ ეპისკოპოს მიქაელის წარწერა სამხრეთ ფასადზე და ვერძის
    თავები ფრონტონებზე, შემდეგ კი 100 მეტრით სამხრეთით, X საუკუნის პატარა გუმბათიან მთავარანგელოზის ეკლესიამდე
    გაისეირნეთ. და ყველაზე მთავარი: საოკუპაციო ხაზი სოფლის იქით, სულ ახლოს გადის. წასვლამდე მოგზაურობის
    მიმდინარე რეკომენდაციები გადაამოწმეთ, ტაძრის ეზოსა და სოფლის ქუჩებს არ გასცდეთ, ჩრდილოეთით მინდვრებში
    არ შეხვიდეთ და დრონი არ აუშვათ. ერთი საათი საკმარისია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ გორამდე დაახლოებით 80 კილომეტრია. გორთან მაგისტრალიდან
    გადაუხვიეთ და შ24-ს — გორი–ვარიანი–ცხინვალის გზას — გაჰყევით ჩრდილოეთით, დიდი ლიახვის ხეობის აღმა,
    ბოლო 24 კილომეტრი ზემო ნიქოზამდე. სულ დაახლოებით 110 კილომეტრი და 1 საათი და 40 წუთი, მთელ გზაზე ასფალტით;
    ეკონომკლასის ნებისმიერი მანქანა ნებისმიერ სეზონზე გამოდგება. საგზაო ნიშნები ცხინვალისკენ მიუთითებს,
    მაგრამ საოკუპაციო ხაზი სოფლის სიახლოვეს გადის: ტაძარი თქვენი მარშრუტის ბოლო წერტილია. საწვავი გორში
    ჩაასხით.
en:
  name: Zemo Nikozi Cathedral of the Deity (Ghvtaeba)
  short: >-
    A bishop's cathedral at the edge of occupied Tskhinvali region, founded by tradition on a martyr's
    grave and burned by air attacks in August 2008.
  body: >-
    **For centuries the bishops of Nikozi were pastors to the mountain peoples to the north; on 10 August
    2008 their cathedral found itself on the front line.**


    Writing around 800, the chronicler Juansher says that King Vakhtang Gorgasali, in the 5th century,
    built the church of Nikozi on the hearth of a fire temple and installed a bishop where St Razhden,
    martyred by the Persians in Vakhtang's wars, lay buried. Nikozi has never been systematically excavated
    and neither the fire altar nor the martyr's shrine has been found, so treat the royal founding as
    tradition. In the 1740s Prince Vakhushti wrote that a bishop still lived here, shepherd to the Caucasians,
    the Dvals and Ossetia. Today the cathedral is the seat of the Eparchy of Nikozi and Tskhinvali.


    The church you see is a compact cross-in-square, 16.7 by 11.5 metres, faced with hewn stone. On the
    south façade a three-line inscription in Asomtavruli, the old Georgian capitals, names Bishop Michael
    as builder and dates from the 10th century, although most of the fabric is a rebuilding of the 14th–16th.
    Look up: a stone ram's head crowns each of the four gables, and more rams keep watch from the 16th–17th-century
    bell tower in the north-west corner.


    A 13th-century chronicle remembers a sadder visitor. One of the sons of the Ossetian kings, a disappointed
    suitor for the hand of Queen Tamar, died at Nikozi and was buried in its church of St Razhden.


    In August 2008 Russian air attacks set the complex on fire. The 9th–11th-century episcopal palace,
    freshly repaired, lost its roof, floor and wooden balconies; the monks' cells, the bishop's house
    and the refectory were destroyed outright. A Council of Europe emergency project stabilised what survived.
    At Nikozi the oldest layer is a legend, and the newest is scorched stone.
  tip: >-
    Entry is free. This is a working cathedral: cover shoulders and knees, women will need a headscarf,
    and keep your voice down during services. Find Bishop Michael's inscription on the south façade and
    the rams' heads on the gables, then walk 100 metres south to the small domed Church of the Archangel,
    from the 10th century. Above all, mind where you are: the administrative boundary line with the Russian-occupied
    Tskhinvali region runs just beyond the village. Check current travel advice before you go, stay within
    the church grounds and village streets, do not walk into the fields to the north and do not fly a
    drone. An hour is enough.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi to Gori, about 80 km. Leave the motorway at Gori and
    follow the Sh24, the Gori–Variani–Tskhinvali road, north up the Greater Liakhvi valley for the last
    24 km to Zemo Nikozi. That is about 110 km and 1 hour 40 minutes, asphalt all the way; any economy
    car will do, in any season. The road signs still point to Tskhinvali, but the boundary line lies just
    beyond the village, so the cathedral is as far as you go. Fill up in Gori.
ru:
  name: Собор Божества (Гвтаеба) в Земо-Никози
  short: >-
    Епископский собор у самой границы оккупированного Цхинвальского региона: по преданию, основан на могиле
    мученика, а в августе 2008 года сожжён авиаударами.
  body: >-
    **Веками епископы Никози были пастырями горных народов, живших к северу; 10 августа 2008 года их собор
    оказался на линии фронта.**


    Летописец Джуаншер, писавший около 800 года, сообщает, что царь Вахтанг Горгасали в V веке построил
    никозскую церковь на месте храма огня и поставил епископа там, где был погребён святой Ражден, замученный
    персами в войнах Вахтанга. Никози никогда не раскапывали систематически, и ни алтарь огня, ни гробница
    мученика не найдены, так что царское основание стоит считать преданием. В 1740-х годах царевич Вахушти
    писал, что здесь по-прежнему живёт епископ — пастырь кавказцев, двалов и Осетии. Сегодня собор — кафедра
    Никозской и Цхинвальской епархии.


    Храм, который вы видите, — компактная постройка типа «вписанный крест» размером 16,7 на 11,5 метра,
    облицованная тёсаным камнем. На южном фасаде трёхстрочная надпись асомтаврули — старинными грузинскими
    заглавными буквами — называет строителем епископа Михаила и датируется X веком, хотя бо́льшая часть
    кладки — перестройка XIV–XVI веков. Поднимите глаза: каменная баранья голова венчает каждый из четырёх
    фронтонов, а ещё несколько баранов несут дозор на колокольне XVI–XVII веков в северо-западном углу.


    Летопись XIII века помнит и более печального гостя. Один из сыновей осетинских царей, неудачливый
    претендент на руку царицы Тамары, умер в Никози и был похоронен в здешней церкви Святого Раждена.


    В августе 2008 года российские авиаудары вызвали в комплексе пожар. Епископский дворец IX–XI веков,
    только что отреставрированный, лишился крыши, пола и деревянных балконов; кельи монахов, дом епископа
    и трапезная были разрушены полностью. Экстренный проект Совета Европы укрепил то, что уцелело. В Никози
    самый древний слой — легенда, а самый новый — опалённый камень.
  tip: >-
    Вход бесплатный. Это действующий собор: закройте плечи и колени, женщинам понадобится платок, во время
    службы говорите тихо. Найдите надпись епископа Михаила на южном фасаде и бараньи головы на фронтонах,
    а затем пройдите 100 метров на юг к маленькой купольной церкви Архангела X века. А главное — помните,
    где вы находитесь: административная разграничительная линия с оккупированным Россией Цхинвальским
    регионом проходит сразу за селом. Перед поездкой проверьте актуальные рекомендации для путешественников,
    оставайтесь в пределах церковной ограды и сельских улиц, не уходите в поля к северу и не запускайте
    дрон. Часа вполне достаточно.
  route: >-
    Поезжайте из Тбилиси на запад по автомагистрали S1 (E60) до Гори, около 80 км. У Гори съезжайте с
    магистрали и следуйте по Sh24, дороге Гори — Вариани — Цхинвали, на север вверх по долине Большой
    Лиахви последние 24 км до Земо-Никози. Всего около 110 км и 1 час 40 минут, всё по асфальту; подойдёт
    любая машина эконом-класса в любое время года. Дорожные указатели по-прежнему ведут на Цхинвали, но
    разграничительная линия проходит сразу за селом, так что собор — конечная точка пути. Заправьтесь
    в Гори.
fa:
  name: کلیسای جامع الوهیت (غوتائبا) در زمو نیکوزی
  short: >-
    کلیسای جامع اسقفی در لبهٔ منطقهٔ اشغالی تسخینوالی که بنا بر روایت سنتی بر گور یک شهید بنا شد و در
    اوت ۲۰۰۸ در حملات هوایی به آتش کشیده شد.
  body: >-
    **سده‌ها اسقفان نیکوزی شبانان مردمان کوهستانیِ شمال بودند؛ در ۱۰ اوت ۲۰۰۸ کلیسای جامعشان خود را بر
    خط مقدم جبهه یافت.**


    جوانشیر، وقایع‌نگاری که حدود سال ۸۰۰ می‌نوشت، می‌گوید شاه واختانگ گورگاسالی در سدهٔ پنجم کلیسای نیکوزی
    را بر جای آتشگاهِ یک آتشکده ساخت و اسقفی را در همان جایی گماشت که راژدن قدیس — که در جنگ‌های واختانگ
    به دست ایرانیان به شهادت رسیده بود — به خاک سپرده شده بود. نیکوزی هرگز به‌طور نظام‌مند کاوش نشده و
    نه آتشدان پیدا شده و نه آرامگاه شهید؛ پس بنیان‌گذاری شاهانه را روایتی سنتی بدانید. در دههٔ ۱۷۴۰ شاهزاده
    واخوشتی نوشت که هنوز اسقفی در اینجا زندگی می‌کند که شبان قفقازیان، دوال‌ها و اوستیاست. امروز این کلیسای
    جامع مقر اسقف‌نشین نیکوزی و تسخینوالی است.


    بنایی که می‌بینید، کلیسایی جمع‌وجور با طرح «صلیب در مربع» است، به ابعاد ۱۶٫۷ در ۱۱٫۵ متر، با روکش
    سنگ تراشیده. بر نمای جنوبی، کتیبه‌ای سه‌سطری به خط آسومتاورولی — حروف بزرگ کهن گرجی — اسقف میخائیل
    را سازندهٔ بنا معرفی می‌کند و به سدهٔ دهم بازمی‌گردد، هرچند بیشتر پیکرهٔ بنا بازسازیِ سده‌های چهاردهم
    تا شانزدهم است. سر بلند کنید: سر سنگی یک قوچ بر فراز هر یک از چهار سنتوری نشسته و قوچ‌های دیگری هم
    از برج ناقوسِ سده‌های شانزدهم و هفدهم در گوشهٔ شمال‌غربی نگهبانی می‌دهند.


    وقایع‌نامه‌ای از سدهٔ سیزدهم از مهمانی اندوهگین‌تر یاد می‌کند: یکی از پسران شاهان اوست، خواستگار ناکام
    ملکه تامار، در نیکوزی درگذشت و در کلیسای راژدن قدیسِ همان‌جا به خاک سپرده شد.


    در اوت ۲۰۰۸ حملات هوایی روسیه مجموعه را به آتش کشید. کاخ اسقفیِ سده‌های نهم تا یازدهم که تازه مرمت
    شده بود، سقف، کف و بالکن‌های چوبی‌اش را از دست داد؛ حجره‌های راهبان، خانهٔ اسقف و تالار غذاخوری به‌کلی
    ویران شدند. طرحی اضطراری از سوی شورای اروپا آنچه را باقی مانده بود استوار کرد. در نیکوزی کهن‌ترین
    لایه افسانه است و تازه‌ترین لایه سنگ سوخته.
  tip: >-
    ورود رایگان است. این یک کلیسای جامع فعال است: شانه‌ها و زانوها را بپوشانید، بانوان به روسری نیاز دارند
    و هنگام مراسم آهسته سخن بگویید. کتیبهٔ اسقف میخائیل را بر نمای جنوبی و سرهای قوچ را بر سنتوری‌ها بیابید،
    سپس ۱۰۰ متر به سمت جنوب تا کلیسای کوچک و گنبددار فرشتهٔ مقرب، از سدهٔ دهم، قدم بزنید. مهم‌تر از همه،
    به یاد داشته باشید کجا هستید: خط مرز اداری با منطقهٔ تسخینوالی، که در اشغال روسیه است، درست پس از
    روستا می‌گذرد. پیش از سفر آخرین توصیه‌های سفر را بررسی کنید، در محوطهٔ کلیسا و کوچه‌های روستا بمانید،
    به مزارع شمال نروید و پهپاد پرواز ندهید. یک ساعت کافی است.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب تا گوری بگیرید، حدود ۸۰ کیلومتر. در گوری از بزرگراه خارج شوید
    و جادهٔ Sh24، یعنی جادهٔ گوری–واریانی–تسخینوالی، را به سمت شمال در درهٔ لیاخوی بزرگ دنبال کنید و ۲۴
    کیلومتر پایانی را تا زمو نیکوزی بپیمایید. روی هم حدود ۱۱۰ کیلومتر و ۱ ساعت و ۴۰ دقیقه، همه آسفالت؛
    هر خودروی اقتصادی در هر فصلی از پسش برمی‌آید. تابلوهای راه هنوز تسخینوالی را نشان می‌دهند، اما خط
    مرزی درست پس از روستاست، پس کلیسای جامع پایان راه شماست. در گوری سوخت بگیرید.
he:
  name: קתדרלת האלוהות (ע'בתאבה) בזמו ניקוזי
  short: >-
    קתדרלה בישופית בשולי אזור צחינוואלי הכבוש, שלפי המסורת נוסדה על קברו של קדוש מעונה ועלתה באש בהתקפות
    אוויריות באוגוסט 2008.
  body: >-
    **במשך מאות שנים היו הבישופים של ניקוזי רועיהם של עמי ההרים שמצפון; ב-10 באוגוסט 2008 מצאה עצמה הקתדרלה
    שלהם על קו החזית.**


    הכרוניקן ג'ואנשר, שכתב סביב שנת 800, מספר כי המלך ואחטנג גורגסלי בנה במאה החמישית את כנסיית ניקוזי
    על מוקד האש של מקדש אש, והציב בישוף במקום שבו נקבר ראז'דן הקדוש, שמת מות קדושים בידי הפרסים במלחמותיו
    של ואחטנג. ניקוזי מעולם לא נחפרה באופן שיטתי, ולא מזבח האש ולא קבר הקדוש נמצאו, ולכן יש להתייחס לייסוד
    המלכותי כאל מסורת. בשנות ה-40 של המאה ה-18 כתב הנסיך וחושטי שעדיין מתגורר כאן בישוף, רועה לקווקזים,
    לדוואלים ולאוסטיה. כיום הקתדרלה היא מושב הבישופות (האפרכיה) של ניקוזי וצחינוואלי.


    הכנסייה שלפניכם היא מבנה קומפקטי בתוכנית "צלב בתוך ריבוע", 16.7 על 11.5 מטרים, מצופה באבן מסותתת.
    על החזית הדרומית כתובת בת שלוש שורות באסומתאוורולי, האותיות הגאורגיות הגדולות העתיקות, נוקבת בשמו
    של הבישוף מיכאל כבונה ומתוארכת למאה העשירית, אף שרוב המבנה הוא בנייה מחודשת מהמאות ה-14 עד ה-16. הרימו
    את העיניים: ראש איל מאבן מעטר כל אחד מארבעת הגמלונים, ואילים נוספים משקיפים ממגדל הפעמונים מהמאות
    ה-16–17 שבפינה הצפון-מערבית.


    כרוניקה מן המאה ה-13 זוכרת אורח עצוב יותר. אחד מבני מלכי האוסטים, שביקש לשווא את ידה של המלכה תמר,
    מת בניקוזי ונקבר בכנסיית ראז'דן הקדוש שבמקום.


    באוגוסט 2008 הציתו התקפות אוויריות רוסיות את המתחם. ארמון הבישוף מהמאות ה-9 עד ה-11, ששוקם זה עתה,
    איבד את גגו, את רצפתו ואת מרפסות העץ שלו; תאי הנזירים, בית הבישוף וחדר האוכל נהרסו כליל. מיזם חירום
    של מועצת אירופה ייצב את מה ששרד. בניקוזי השכבה העתיקה ביותר היא אגדה, והחדשה ביותר היא אבן חרוכה.
  tip: >-
    הכניסה חינם. זוהי קתדרלה פעילה: כסו כתפיים וברכיים, נשים יזדקקו למטפחת ראש, ובזמן התפילה דברו בשקט.
    חפשו את כתובת הבישוף מיכאל על החזית הדרומית ואת ראשי האילים על הגמלונים, ואז לכו 100 מטרים דרומה אל
    כנסיית המלאך הראשי הקטנה בעלת הכיפה, מהמאה העשירית. ומעל הכול, זכרו היכן אתם נמצאים: קו הגבול המנהלי
    עם אזור צחינוואלי, שנמצא תחת כיבוש רוסי, עובר ממש מעבר לכפר. בדקו את הנחיות הנסיעה העדכניות לפני היציאה,
    הישארו בתחום חצר הכנסייה וברחובות הכפר, אל תלכו אל השדות שמצפון ואל תטיסו רחפן. שעה אחת מספיקה.
  route: >-
    סעו מטביליסי מערבה בכביש המהיר S1 (E60) עד גורי, כ-80 ק"מ. צאו מהכביש המהיר בגורי והמשיכו בכביש Sh24,
    דרך גורי–ואריאני–צחינוואלי, צפונה במעלה עמק ליאחווי הגדול, 24 הק"מ האחרונים עד זמו ניקוזי. בסך הכול
    כ-110 ק"מ ושעה ו-40 דקות, כולם סלולים; כל רכב מקטגוריית אקונומי יתאים, בכל עונה. השלטים עדיין מכוונים
    לצחינוואלי, אבל קו הגבול עובר ממש מעבר לכפר, כך שהקתדרלה היא סוף הדרך. תדלקו בגורי.
ar:
  name: كاتدرائية الألوهة (غفتايبا) في زيمو نيكوزي
  short: >-
    كاتدرائية أسقفية على حافة منطقة تسخينفالي المحتلة، يقول التقليد إنها أُسست على قبر شهيد، والتهمتها
    النيران إثر غارات جوية في أغسطس 2008.
  body: >-
    **ظل أساقفة نيكوزي قرونًا رعاةً لشعوب الجبال في الشمال؛ وفي 10 أغسطس 2008 وجدت كاتدرائيتهم نفسها على
    خط الجبهة.**


    يروي المؤرخ جوانشير، الذي كتب نحو عام 800، أن الملك فاختانغ غورغاسالي بنى في القرن الخامس كنيسة نيكوزي
    فوق موقد معبد للنار، ونصّب أسقفًا حيث دُفن القديس راجدن الذي استشهد على أيدي الفرس في حروب فاختانغ.
    لم تُنقَّب نيكوزي قط تنقيبًا منهجيًا، ولم يُعثر لا على مذبح النار ولا على ضريح الشهيد، لذا تعامَل
    مع التأسيس الملكي بوصفه تقليدًا متوارثًا. وفي أربعينيات القرن الثامن عشر كتب الأمير فاخوشتي أن أسقفًا
    ما زال يقيم هنا، راعيًا للقوقازيين والدفال وأوسيتيا. واليوم الكاتدرائية مقرّ أبرشية نيكوزي وتسخينفالي.


    الكنيسة التي تراها مبنى صغير مدمج على مخطط "الصليب داخل المربع"، أبعاده 16.7 × 11.5 مترًا، مكسوّ بالحجر
    المنحوت. وعلى الواجهة الجنوبية نقش من ثلاثة أسطر بخط الأسومتافرولي، أي الحروف الجورجية الكبيرة القديمة،
    يذكر الأسقف ميخائيل بانيًا للكنيسة، ويعود إلى القرن العاشر، وإن كان معظم البناء إعادةَ تشييد من القرون
    الرابع عشر إلى السادس عشر. ارفع بصرك: رأس كبش حجري يتوّج كلًا من الجملونات الأربعة، وكباش أخرى تحرس
    من برج الأجراس العائد إلى القرنين السادس عشر والسابع عشر في الركن الشمالي الغربي.


    وتذكر حولية من القرن الثالث عشر زائرًا أكثر حزنًا: فأحد أبناء ملوك الأوسيتيين، وقد خاب مسعاه في طلب
    يد الملكة تامار، مات في نيكوزي ودُفن في كنيسة القديس راجدن فيها.


    وفي أغسطس 2008 أشعلت الغارات الجوية الروسية النار في المجمّع. فقد القصر الأسقفي العائد إلى القرون
    من التاسع إلى الحادي عشر، والذي كان قد رُمّم للتو، سقفه وأرضيته وشرفاته الخشبية؛ أما قلالي الرهبان
    وبيت الأسقف وقاعة الطعام فدُمّرت تمامًا. وثبّت مشروع طوارئ أطلقه مجلس أوروبا ما نجا. في نيكوزي أقدم
    الطبقات أسطورة، وأحدثها حجر محترق.
  tip: >-
    الدخول مجاني. هذه كاتدرائية عاملة: غطِّ الكتفين والركبتين، وتحتاج النساء إلى غطاء للرأس، واخفض صوتك
    أثناء القداس. ابحث عن نقش الأسقف ميخائيل على الواجهة الجنوبية وعن رؤوس الكباش على الجملونات، ثم امشِ
    100 متر جنوبًا إلى كنيسة رئيس الملائكة الصغيرة ذات القبة، العائدة إلى القرن العاشر. وقبل كل شيء، تذكّر
    أين أنت: خط الحدود الإدارية مع منطقة تسخينفالي التي تحتلها روسيا يمر مباشرة خلف القرية. راجع إرشادات
    السفر الحالية قبل الذهاب، والتزم حدود ساحة الكنيسة وشوارع القرية، ولا تمشِ في الحقول شمالًا، ولا تُطلق
    طائرة مسيّرة. تكفي ساعة واحدة.
  route: >-
    اسلك من تبليسي الطريق السريع S1 (E60) غربًا حتى غوري، نحو 80 كم. اخرج من الطريق السريع عند غوري واتبع
    الطريق Sh24، طريق غوري–فارياني–تسخينفالي، شمالًا صعودًا في وادي نهر لياخفي الكبير لمسافة الكيلومترات
    الـ24 الأخيرة حتى زيمو نيكوزي. المجموع نحو 110 كم وساعة و40 دقيقة، والطريق معبّد بالكامل؛ وتفي بالغرض
    أي سيارة اقتصادية في أي فصل. ما زالت لافتات الطريق تشير إلى تسخينفالي، لكن خط الحدود يقع مباشرة خلف
    القرية، فالكاتدرائية هي نهاية طريقك. تزوّد بالوقود في غوري.
