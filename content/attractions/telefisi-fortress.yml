ka:
  name: ტელეფისის ციხე (ტოლები)
  short: >-
    VI საუკუნის ციხის ნამსხვრევი კედელი ციცაბო გორაზე რიონის ვაკის თავზე — ტელეფისი, სადაც ბიზანტია და
    ირანი ეგრისისთვის ებრძოდნენ ერთმანეთს.
  body: >-
    **VI საუკუნის 50-იან წლებში სპარსელმა სარდალმა, ისე მოხუცმა და კოჭლმა, რომ ლაშქარში საკაცით დაატარებდნენ,
    ამ გორიდან ბიზანტიელთა უფრო მრავალრიცხოვანი ლაშქარი განდევნა — და რიონზე მთელმა ბიზანტიურმა ფრონტმა
    უკან დაიხია.**


    ეს ეგრისის დიდი ომი იყო — ბიზანტიისა და სასანიანური ირანის ხანგრძლივი ბრძოლა დასავლეთ საქართველოზე
    ბატონობისთვის; ორ იმპერიას შორის საზღვარი სწორედ ამ ციხესთან გადიოდა. ტელეფისი, როგორც მას ბერძენი
    ისტორიკოსები უწოდებენ, ბიზანტიელთა ყველაზე წინ წამოწეული სიმაგრე იყო. ხმა დაირხა, სპარსელი სარდალი
    მიჰრ-მიჰროე, ბერძნებისთვის მერმეროესი, სასიკვდილოდ ავადააო; მან კი მოულოდნელად შეუტია და ეშმაკობით
    ბიზანტიელ-ლაზთა ჯარი ტელეფისიდან და მეზობელი ოლარიიდან განდევნა და ფასისის, დღევანდელი რიონის, გაყოლებით
    უკან დაახევინა. ციხეს პროკოპი კესარიელიც ახსენებს და აგათია სქოლასტიკოსიც; ბრძოლის წელს სხვადასხვა
    წყარო 553-ით, 554-ით ან 555-ით ათარიღებს. მიჰრ-მიჰროე მალევე, მცხეთაში, სენით გარდაიცვალა.


    დიდხანს უცნობი იყო, სად იდგა ტელეფისი. მარი ბროსე და ივანე ჯავახიშვილი მას ზემო იმერეთის სოფელ ტელეფასთან
    აიგივებდნენ; 1935 წელს სიმონ ყაუხჩიშვილის ექსპედიციამ, აკაკი შანიძის დახმარებით, დაადგინა, რომ ციხე
    აქ, ისტორიულ გურიაში, სოფელ ტოლებში, ხევისწყლის ნაპირას მდგარ მაღალ გორაზეა. გვიან შუა საუკუნეებში
    ციხე ჯერ ჭილაძეების სათავადოს ეკუთვნოდა, შემდეგ — საჯავახოს.


    გორა ციცაბოა და ზემოთ ასვლა მხოლოდ სამხრეთ-აღმოსავლეთიდან შეიძლება; ჩრდილოეთის ფერდი კლდოვანი და ნაპრალიანია.
    გალავანი დაახლოებით ორ ჰექტარს მოიცავდა: ქვედა წყობა თლილი ოთხკუთხა ქვისაა, ზედა — რიყის ქვის; სამხრეთ-დასავლეთ
    კედელს ყრუ კოშკი ეკვროდა, დასავლეთით კი, 3,6 მეტრის სისქის კედელზე, დუღაბით შეკრული კვადრატული აგურის
    თერთმეტი რიგი შემორჩა. დღეს ერთი მაღალი, დაკბილული ნატეხი და გვიმრაში ჩაკარგული დაბალი ნაშთები დაგხვდებათ.


    მის გვერდით დადექით და რიონის დაბლობს გადახედეთ: ვინც ამ გორას ფლობდა, მდინარის გზას ზედ დაჰყურებდა.
  tip: >-
    დაახლოებით ერთი საათი საკმარისია. ადგილზე არც კეთილმოწყობაა და არც საინფორმაციო დაფები, ამიტომ წინასწარ
    წაიკითხეთ და წყალი თან წაიღეთ. ასასვლელი მოკლეა, მაგრამ ციცაბო; მაყვლისგან თავის დასაცავად გრძელი
    შარვალი ჩაიცვით, თბილ თვეებში კი შემდეგ ტკიპებიც შეამოწმეთ. წვიმის შემდეგ თიხიანი ბილიკი სრიალებს.
    შემორჩენილ კედელზე ნუ აძვრებით — ნატეხი გადახრილია, დუღაბი კი იფშვნება. ახლომახლო გამოჩინებულის ზანდოს
    მონასტერი და ჯიხეთის სამების მონასტერიც მოინახულეთ. გვიან ნაშუადღევს ნანგრევი ცის ფონზე ყველაზე მკვეთრად
    იკვეთება.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, გორის, ხაშურის, ზესტაფონისა და ქუთაისის გავლით, სამტრედიის
    წრიულ გზაჯვარედინამდე იარეთ — დაახლოებით 247 კმ. იქიდან ს12-ით, ლანჩხუთის მიმართულებით, სამხრეთ-დასავლეთისკენ
    ათიოდე კილომეტრი გაიარეთ; ვაზისუბნის შემდეგ მარცხნივ, ტოლებისა და ქვემო ნოღის გზაზე გადაუხვიეთ და
    კიდევ სამიოდე კილომეტრი იარეთ — სულ დაახლოებით 263 კმ და ოთხ საათზე ცოტა ნაკლები. ციხე ზემო ტოლების
    ჩრდილო-აღმოსავლეთ კიდეზე, გორაზე დგას; ბოლო მონაკვეთი ფეხით, სამხრეთ-აღმოსავლეთიდან უნდა აიაროთ. სოფლის
    გზები ვიწროა და წვიმის შემდეგ ტალახიანი, ამიტომ ჯიპი უფრო კომფორტულია. საწვავი სამტრედიაში ჩაასხით.
en:
  name: Telefisi Fortress (Tolebi)
  short: >-
    A broken 6th-century wall on a steep hill above the Rioni plain — the Telephis where Byzantium and
    Persia fought for western Georgia.
  body: >-
    **In the 550s a Persian general so old and lame that he had to be carried among his troops on a litter
    drove a stronger Byzantine army off this hill, and the whole Byzantine front on the Rioni fell back.**


    This was the Lazic War, the long struggle between Byzantium and Sasanian Persia for Lazica, the kingdom
    of western Georgia; the frontier between the two empires ran past this fortress. Telephis, as the
    Greek historians call it, was the Byzantines' most forward stronghold. Word had gone round that the
    Persian commander Mihr-Mihroe — Mermeroes to the Greeks — was gravely ill; instead he struck, and
    by a stratagem forced the Byzantine and Lazic troops out of Telephis and neighbouring Ollaria and
    into retreat down the Phasis, today's Rioni. Procopius and Agathias both mention the fortress; the
    year is given variously as 553, 554 or 555. Mihr-Mihroe died of illness at Mtskheta soon after.


    For centuries nobody was sure where Telephis stood. Marie Brosset and Ivane Javakhishvili placed it
    at Telepa in Upper Imereti; in 1935 an expedition led by Simon Qaukhchishvili, with the help of Akaki
    Shanidze, found it here, on a hill above the Khevistskali stream in Tolebi, in historic Guria. In
    later centuries the fort belonged to the Chiladze princes and then to the district of Sajavakho.


    The hill is steep and can be climbed only from the south-east; its northern face is broken rock. The
    walls once enclosed about two hectares: dressed square blocks below, river cobbles above, a blind
    tower against the south-western wall, and on the west eleven courses of square brick set in mortar
    over a wall 3.6 metres thick. Today expect one tall, jagged fragment and low stumps half-lost in bracken.


    Stand beside it and look over the Rioni lowland: whoever held this hill watched the river road.
  tip: >-
    Allow about an hour. There are no facilities and little or no interpretation on site, so read up before
    you go and bring water. The climb is short but steep; wear long trousers against brambles and, in
    the warm months, check for ticks afterwards. After rain the clay path turns slick. Stay off the surviving
    wall — the fragment leans and the mortar is crumbling. Combine it with Zando monastery at Gamochinebuli
    or the Sameba monastery at Jikheti nearby. Late afternoon gives the ruin the most shape against the
    sky.
  route: >-
    From Tbilisi take the S1 (E60) west past Gori, Khashuri, Zestaponi and Kutaisi to the Samtredia roundabout,
    about 247 km. Turn onto the S12 towards Lanchkhuti and drive about ten kilometres south-west; beyond
    Vazisubani turn left onto the local road for Tolebi and Kvemo Nogha, some three kilometres more —
    about 263 km and just under four hours in all. The fortress stands on a hill at the north-eastern
    edge of Zemo Tolebi; the final approach is on foot, from the south-east. Village lanes are narrow
    and muddy after rain, so an SUV is the comfortable choice. Refuel in Samtredia.
ru:
  name: Крепость Телефиси (Толеби)
  short: >-
    Разрушенная стена VI века на крутом холме над Рионской равниной — Телефис, где Византия и Персия боролись
    за Западную Грузию.
  body: >-
    **В 550-х годах персидский полководец, настолько старый и хромой, что его носили среди войск на носилках,
    выбил с этого холма более сильную византийскую армию — и весь византийский фронт на Рионе отступил.**


    Это была Лазская война — долгая борьба Византии и сасанидской Персии за Лазику, царство Западной Грузии;
    граница между двумя империями проходила именно у этой крепости. Телефис, как называли крепость греческие
    историки, был самым передовым оплотом византийцев. Разнёсся слух, что персидский командующий Михр-Михроэ
    — у греков Мермероес — тяжело болен; вместо этого он ударил первым и хитростью выбил византийские
    и лазские войска из Телефиса и соседней Олларии, заставив их отступать вниз по Фасису, нынешнему Риони.
    О крепости упоминают и Прокопий Кесарийский, и Агафий Миринейский; год битвы называют то 553-м, то
    554-м, то 555-м. Михр-Михроэ вскоре умер от болезни в Мцхете.


    Веками никто не знал, где стоял Телефис. Мари Броссе и Иван Джавахишвили помещали его у села Телепа
    в Верхней Имерети; в 1935 году экспедиция под руководством Симона Каухчишвили, с помощью Акакия Шанидзе,
    установила, что крепость стоит здесь, в исторической Гурии, в селе Толеби, на высоком холме над речкой
    Хевисцкали. В позднейшие века крепость принадлежала князьям Чиладзе, а затем округу Саджавахо.


    Холм крутой, подняться можно только с юго-востока; северный склон — сплошной обломанный камень. Стены
    когда-то охватывали около двух гектаров: нижняя кладка — из тёсаного квадратного камня, верхняя —
    из речной гальки; к юго-западной стене примыкала глухая башня, а на западе, на стене толщиной 3,6
    метра, сохранилось одиннадцать рядов квадратного кирпича на растворе. Сегодня вас встретят один высокий,
    зазубренный фрагмент и низкие остатки, наполовину затерянные в папоротнике.


    Встаньте рядом и посмотрите на Рионскую низменность: кто владел этим холмом, тот следил за речной
    дорогой.
  tip: >-
    Хватит примерно часа. Никаких удобств здесь нет, и информационных табличек почти или совсем нет, так
    что почитайте заранее и возьмите воду. Подъём короткий, но крутой; наденьте длинные брюки от ежевики
    и в тёплые месяцы проверьте себя на клещей после прогулки. После дождя глинистая тропа становится
    скользкой. Не забирайтесь на сохранившуюся стену — фрагмент накренился, а раствор рассыпается. Совместите
    поездку с монастырём Зандо в Гамочинебули или с монастырём Самеба в Джихети неподалёку. Позднее послеполуденное
    солнце придаёт руинам наибольшую выразительность на фоне неба.
  route: >-
    Из Тбилиси по S1 (E60) на запад, через Гори, Хашури, Зестафони и Кутаиси, до кольца у Самтредиа —
    около 247 км. Поверните на S12 в сторону Ланчхути и проедьте около десяти километров на юго-запад;
    за Вазисубани поверните налево на местную дорогу к Толеби и Квемо-Ногха, ещё около трёх километров
    — всего около 263 км и чуть меньше четырёх часов. Крепость стоит на холме у северо-восточной окраины
    Земо-Толеби; последний участок проходится пешком, с юго-востока. Сельские дороги узкие и грязные после
    дождя, так что внедорожник — самый удобный выбор. Заправьтесь в Самтредиа.
fa:
  name: قلعه‌ی تلفیسی (تولبی)
  short: >-
    دیواری شکسته از سده‌ی ششم بر تپه‌ای پرشیب بالای دشت ریونی — تلفیس، جایی که بیزانس و ایران بر غرب گرجستان
    جنگیدند.
  body: >-
    **در دهه‌ی ۵۵۰ میلادی، سرداری ایرانی چنان پیر و لَنگ که او را در میان سپاهش بر تخت‌روان می‌بردند،
    سپاهی بیزانسی نیرومندتر را از این تپه بیرون راند — و کل جبهه‌ی بیزانس بر ریونی پس نشست.**


    این جنگ لازیکا بود — نبرد درازآهنگ بیزانس و ایران ساسانی بر لازیکا، پادشاهی غرب گرجستان؛ مرز میان
    دو امپراتوری از کنار همین قلعه می‌گذشت. تلفیس، چنان‌که تاریخ‌نگاران یونانی می‌نامیدندش، پیشروترین
    دژ بیزانسیان بود. شایع شده بود که فرمانده ایرانی، مهرمهرویه — که یونانیان مرمروئس می‌خواندندش — به‌سختی
    بیمار است؛ او اما ضربه زد و با نیرنگ سپاهیان بیزانسی-لازی را از تلفیس و اولاریای همسایه بیرون راند
    و به عقب‌نشینی در امتداد فاسیس، ریونی امروزی، وادار کرد. پروکوپیوس قیصریه‌ای و آگاتیاس هر دو از قلعه
    یاد کرده‌اند؛ سال نبرد را منابع گاه ۵۵۳، گاه ۵۵۴ و گاه ۵۵۵ می‌دانند. مهرمهرویه اندکی بعد در متسختا
    از بیماری درگذشت.


    سده‌ها هیچ‌کس نمی‌دانست تلفیس کجا بوده است. ماری بروسه و ایوانه جاواخیشویلی آن را با روستای تلپا در
    ایمرتی علیا یکی می‌دانستند؛ در سال ۱۹۳۵ هیئتی به سرپرستی سیمون قائوخچیشویلی، با یاری آکاکی شانیدزه،
    دریافت که قلعه همین‌جاست، در گوریای تاریخی، در روستای تولبی، بر تپه‌ای بلند در کنار نهر خویستسکالی.
    در سده‌های بعد قلعه از آن شاهزادگان چیلادزه بود و سپس از آن ناحیه‌ی ساجاواخو.


    تپه پرشیب است و تنها از جنوب شرقی می‌توان بالا رفت؛ دامنه‌ی شمالی سنگی و شکافته است. دیوارها زمانی
    نزدیک به دو هکتار را در بر می‌گرفت: چینه‌ی زیرین از بلوک‌های مربع تراش‌خورده، چینه‌ی بالایی از سنگ‌های
    رودخانه‌ای؛ برجی کور به دیوار جنوب غربی پیوسته بود، و در غرب، بر دیواری به‌ضخامت ۳٫۶ متر، یازده ردیف
    آجر مربعی با ملاط بازمانده است. امروز یک تکه‌ی بلند و دندانه‌دار و پی‌هایی کوتاه که در سرخس گم شده‌اند،
    در انتظارتان است.


    کنار آن بایستید و به دشت ریونی چشم بدوزید: هر که این تپه را داشت، بر راه رودخانه چشم داشت.
  tip: >-
    نزدیک به یک ساعت کافی است. در محل هیچ امکاناتی و تقریباً هیچ توضیحی نیست، پس پیش از رفتن مطالعه کنید
    و آب همراه ببرید. صعود کوتاه اما پرشیب است؛ برای دوری از خارها شلواری بلند بپوشید، و در ماه‌های گرم
    پس از بازگشت کنه‌ها را بررسی کنید. پس از باران مسیر گِلی لغزنده می‌شود. روی دیوار باقی‌مانده نروید
    — این تکه کج شده و ملاطش در حال فروریختن است. آن را با صومعه‌ی زاندو در گاموچینه‌بولی یا صومعه‌ی سامه‌با
    در جیختی نزدیک یکجا کنید. در نور اواخر بعدازظهر، ویرانه در برابر آسمان از همیشه نمایان‌تر است.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب، از گوری، خاشوری، زستافونی و کوتائیسی، تا میدان سامتردیا برانید —
    حدود ۲۴۷ کیلومتر. به S12 به‌سوی لانچخوتی بپیوندید و نزدیک به ده کیلومتر رو به جنوب غربی برانید؛ پس
    از وازیسوبانی به چپ، به راه محلی سوی تولبی و کوئمو نوغا بپیچید، نزدیک به سه کیلومتر دیگر — در مجموع
    نزدیک به ۲۶۳ کیلومتر و اندکی کمتر از چهار ساعت. قلعه بر تپه‌ای در کناره‌ی شمال‌شرقی زمو تولبی برپاست؛
    بخش پایانی راه را باید پیاده و از جنوب شرقی پیمود. کوچه‌های روستایی تنگ و پس از باران گِل‌آلودند،
    پس خودرویی شاسی‌بلند گزینه‌ی راحت‌تری است. در سامتردیا سوخت‌گیری کنید.
he:
  name: מצודת טלפיסי (טולבי)
  short: קיר שבור מהמאה השישית על גבעה תלולה מעל מישור ריוני — טלפיס, שם נלחמו ביזנטיון ופרס על מערב גאורגיה.
  body: >-
    **בשנות ה-550 גירש מפקד פרסי, כה זקן ונכה עד שנשאוהו על אלונקה בין חייליו, מגבעה זו צבא ביזנטי חזק
    יותר — וכל החזית הביזנטית על נהר הריוני נסוגה.**


    זו הייתה מלחמת לאזיקה, המאבק הארוך בין ביזנטיון לפרס הסאסאנית על לאזיקה, ממלכת מערב גאורגיה; הגבול
    בין שתי האימפריות עבר סמוך למצודה זו. טלפיס, כפי שמכנים אותה ההיסטוריונים היוונים, הייתה המעוז הקדמי
    ביותר של הביזנטים. עברה שמועה שהמצביא הפרסי מיהר-מיהרואה — מרמרואס בפי היוונים — חולה במחלה קשה; הוא
    הקדים ותקף, ובתחבולה גירש את הכוחות הביזנטיים והלאזיים מטלפיס ומאולריה השכנה, והכריח אותם לסגת במורד
    הפאסיס, הריוני של היום. גם פרוקופיוס מקיסריה וגם אגתיאס מזכירים את המצודה; שנת הקרב מדווחת כ-553,
    554 או 555. מיהר-מיהרואה מת ממחלה זמן קצר לאחר מכן במצחתה.


    במשך מאות שנים לא ידע איש היכן עמדה טלפיס. מארי ברוסה ואיוואנה ג'אווחישווילי מיקמו אותה בטלפה שבאימרתי
    העילית; ב-1935 קבעה משלחת בראשות סימון קאוחצ'ישווילי, בעזרתו של אקאקי שאנידזה, שהמצודה נמצאת כאן,
    בגוריה ההיסטורית, בכפר טולבי, על גבעה גבוהה מעל נחל חוויסצקלי. בתקופות מאוחרות יותר השתייכה המצודה
    לנסיכי צ'ילדזה, ולאחר מכן למחוז סאג'אווחו.


    הגבעה תלולה, וניתן לעלות אליה רק מדרום-מזרח; המדרון הצפוני הוא סלע שבור. החומות הקיפו בעבר כשני הקטרים:
    השורה התחתונה מבלוקים מרובעים מסותתים, העליונה מחלוקי נחל; מגדל עיוור נשען על החומה הדרום-מערבית,
    ובמערב, על חומה בעובי 3.6 מטרים, שרדו אחת-עשרה שורות של לבנים מרובעות בטיט. כיום ימתין לכם שריד גבוה
    ומשונן אחד וגדמים נמוכים שנעלמים למחצה בין השרכים.


    עמדו לצידו והביטו על מישור ריוני: מי שהחזיק בגבעה הזו השקיף על דרך הנהר.
  tip: >-
    שעה בערך מספיקה. אין שום תשתית במקום, ואין כלל או כמעט אין הסברה, אז קראו מראש והביאו מים. העלייה
    קצרה אך תלולה; לבשו מכנסיים ארוכים מפני הקוצים, ובחודשים החמים בדקו קרציות אחרי הביקור. אחרי גשם השביל
    החרסיתי מחליק. אל תטפסו על החומה ששרדה — השריד נוטה והטיט מתפורר. שלבו זאת עם מנזר זנדו בגמוצ'ינבולי
    או מנזר סמבה בג'יחתי הקרוב. באור של שעות אחר הצהריים המאוחרות בולטת החורבה על רקע השמיים יותר מתמיד.
  route: >-
    מטביליסי קחו את S1 (E60) מערבה, דרך גורי, חשורי, זסטפוני וקוטאיסי, עד מעגל התנועה של סמטרדיה — כ-247
    ק"מ. פנו ל-S12 לכיוון לנצ'חוטי ונסעו כעשרה קילומטרים דרום-מערבה; מעבר לוואזיסובני פנו שמאלה לדרך המקומית
    לטולבי וקוומו נוגה, עוד כשלושה קילומטרים — כ-263 ק"מ בסך הכול ומעט פחות מארבע שעות. המצודה עומדת על
    גבעה בקצה הצפון-מזרחי של זמו טולבי; הגישה האחרונה היא ברגל, מדרום-מזרח. דרכי הכפר צרות ובוציות אחרי
    גשם, אז רכב שטח הוא הבחירה הנוחה. תדלקו בסמטרדיה.
ar:
  name: قلعة تليفيسي (توليبي)
  short: >-
    جدار مكسور من القرن السادس على تلة شديدة الانحدار فوق سهل ريوني — تليفيس، حيث تحاربت بيزنطة وفارس
    على غرب جورجيا.
  body: >-
    **في خمسينيات القرن السادس، طرد من هذه التلة قائدٌ فارسي بلغ من الشيخوخة والعرج أن كان يُحمَل بين
    قواته على نقّالة جيشًا بيزنطيًا أقوى منه — فتقهقرت الجبهة البيزنطية كلها على نهر ريوني.**


    كانت هذه حرب لازيكا، الصراع الطويل بين بيزنطة وفارس الساسانية على لازيكا، مملكة غرب جورجيا؛ وكانت
    الحدود بين الإمبراطوريتين تمر قرب هذه القلعة. تليفيس، كما يسمّيها المؤرخون اليونانيون، كانت أقصى معقل
    بيزنطي تقدّمًا. انتشرت شائعة بأن القائد الفارسي مهر-مهروي — مرميروس عند اليونانيين — مريض مرضًا خطيرًا؛
    فبادر بالهجوم بدلًا من ذلك، وبحيلة أخرج القوات البيزنطية-اللازية من تليفيس وأولاريا المجاورة، ودفعها
    إلى التقهقر مع مجرى نهر فاسيس، ريوني اليوم. ويذكر القلعة كلٌّ من بروكوبيوس القيصري وأغاثياس؛ وتؤرّخ
    المصادر المعركة بعام 553 أو 554 أو 555. توفي مهر-مهروي بعد ذلك بقليل بسبب المرض في متسخيتا.


    لقرون لم يعرف أحد أين كانت تليفيس. وضعها ماري بروسيه وإيفانه جافاخيشفيلي عند تيليبا في إيميريتي العليا؛
    وفي عام 1935 حدّدت بعثة بقيادة سيمون كاوختشيشفيلي، بمساعدة أكاكي شانيدزه، أنها هنا، في غوريا التاريخية،
    في قرية توليبي، على تلة عالية فوق جدول خيفيستسكالي. وفي القرون اللاحقة كانت القلعة ملكًا لأمراء تشيلادزه،
    ثم لمنطقة ساجافاخو.


    التلة شديدة الانحدار ولا يمكن تسلّقها إلا من الجنوب الشرقي؛ وواجهتها الشمالية صخر مكسور. كانت الأسوار
    تحيط بنحو هكتارين: الطبقة السفلى من كتل مربعة منحوتة، والعلوية من حصى النهر؛ وبرج أعمى يلاصق الجدار
    الجنوبي الغربي، وفي الغرب، على جدار سماكته 3.6 متر، بقيت إحدى عشرة طبقة من الآجر المربع في مونة. اليوم
    ينتظرك جزء واحد عالٍ ومسنّن وبقايا منخفضة ضائعة نصفها بين نبات السرخس.


    قف إلى جانبها وانظر إلى سهل ريوني المنخفض: من امتلك هذه التلة كان يراقب طريق النهر.
  tip: >-
    تكفي نحو ساعة. لا توجد مرافق ولا يوجد أي شرح تقريبًا في الموقع، فاقرأ قبل الذهاب واحمل الماء. الصعود
    قصير لكنه شديد الانحدار؛ ارتدِ بنطالًا طويلًا للحماية من الأشواك، وفي الشهور الحارة افحص جسمك بحثًا
    عن القراد بعد الزيارة. بعد المطر يصبح المسار الطيني زلقًا. لا تتسلّق الجدار المتبقي — فالقطعة مائلة
    والمونة متفتتة. اجمع الزيارة مع دير زاندو في غاموتشينيبولي أو دير ساميبا في جيخيتي القريب. ويمنح ضوءُ
    العصر المتأخر الخرائبَ أوضحَ ملامحها على صفحة السماء.
  route: >-
    من تبليسي خذ S1 (E60) غربًا عبر غوري وخاشوري وزيستافوني وكوتايسي إلى دوّار سمتريديا — نحو 247 كم.
    اتجه على S12 نحو لانتشخوتي وسر نحو عشرة كيلومترات جنوب غربًا؛ بعد فازيسوباني انعطف يسارًا إلى الطريق
    المحلي نحو توليبي وكفيمو نوغا، نحو ثلاثة كيلومترات إضافية — نحو 263 كم إجمالًا وأقل بقليل من أربع
    ساعات. تقف القلعة على تلة في الحافة الشمالية الشرقية لزيمو توليبي؛ والاقتراب الأخير يكون سيرًا، من
    الجنوب الشرقي. طرق القرية ضيقة وموحلة بعد المطر، فسيارة الدفع الرباعي هي الخيار الأنسب. تزوّد بالوقود
    في سمتريديا.
