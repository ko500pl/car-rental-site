ka:
  name: აჭის მონასტერი
  short: >-
    დარბაზული ეკლესია ოზურგეთის სამხრეთით: XIII საუკუნის მიწურულის პალეოლოგოსური მოხატულობა, წმ. გიორგის
    ცხოვრების იშვიათი ციკლი და ტრაპიზონელი მხატვრის სახელი.
  body: >-
    **დაახლოებით შვიდასი წლის წინ ტრაპიზონელმა ონისიმემ გურიის სოფლის ეკლესიის კედელზე ბერძნულად დატოვა
    თავისი სახელი, სავარაუდოდ კი — მის ირგვლივ გაშლილი მხატვრობაც.**


    აჭის ეკლესია XIII საუკუნის ბოლოს ან XIV საუკუნის დასაწყისში თლილი ქვით აუგიათ: ეს ერთნავიანი დარბაზია,
    მოგვიანებით განახლებული და გალავნით შემოზღუდული. იშვიათი შემთხვევაა, როცა შენობის შემქმნელთა სახელები
    ასე ზუსტად ვიცით. აღმოსავლეთ ფასადზე ასომთავრული წარწერა მოსახსენიებლად ასახელებს უფალთ — საღირს,
    რატსა და უშანიანს, აჭელ ნიკოლოზს და ქვითხუროებს, მიქელსა და მხეციძეს: იმ ხალხს, ვინც ეს ქვები დააწყო.


    შიგნით კედლები პალეოლოგოსურ სტილშია მოხატული — გვიანბიზანტიური, დახვეწილი მანერით; სტილის მიხედვით
    მოხატულობა XIII საუკუნის ბოლოთი თარიღდება. მასში — როგორც წმინდა გიორგის სახელობის ეკლესიას შეჰფერის
    — მისი ცხოვრების ციკლია: საქართველოს მფარველი წმინდანი აქ ისეთ სცენებშია წარმოდგენილი, რომლებიც იკონოგრაფიულ
    იშვიათობად ითვლება. ბერძნული წარწერა, რომელიც „ტრაპიზონელ“ ონისიმეს ასახელებს, გურიის ამ სოფელს შავი
    ზღვის სანაპიროს გაყოლებით მდებარე ტრაპიზონის იმპერიასთან აკავშირებს.


    XVII საუკუნეში ეკლესია გურიის მთავრებმა აიყვანეს მფარველობაში: მას სიმონ II და ქაიხოსრო I გურიელები
    სწყალობდნენ, ქაიხოსრომ კი აჭი შემოქმედის საეპისკოპოსოს მეტოქად აქცია. ეკლესიაში ინახებოდა მოოქროვილი
    ვერცხლის ჯვარი ქართული წარწერით, რომელშიც თამარ მეფე მოიხსენიება; ის ექვთიმე თაყაიშვილმა აღმოაჩინა.
    საბჭოთა ათწლეულებში ჯვარს სალუქვაძეების ოჯახი ინახავდა, 2015 წელს კი ის აჭს დაუბრუნდა. თავად ეკლესია
    მორწმუნეებს 1991 წელს დაუბრუნდა; დღეს იგი ეროვნული მნიშვნელობის ძეგლია.


    ჯვარმა იმოგზაურა და შინ დაბრუნდა. ფრესკები არსად წასულან — ისინი უბრალოდ ელოდნენ.
  tip: >-
    შესვლა უფასოა. აჭი მოქმედი ეკლესიაა, ამიტომ მამაკაცებს გრძელი შარვალი სჭირდებათ, ქალებს — კაბა და
    თავსაფარი; კვირა დილა წირვას ეკუთვნის. ფრესკები მოთმინებას ითხოვს: რამდენიმე წუთი აცალეთ თვალს, რომ
    ნახევრად ბნელ ნავს შეეჩვიოს, გადაღებამდე ნებართვა ითხოვეთ და ფლეში არასოდეს გამოიყენოთ. გარეთ აღმოსავლეთ
    ფასადსაც შემოუარეთ — ასომთავრული წარწერის სანახავად. ერთი საათი გამოყავით. ეკლესიასთან არაფერია; კაფე,
    ბანკომატი და ბენზინგასამართი ოზურგეთშია, 9 კილომეტრით ჩრდილოეთით. შემოქმედის მონასტერი იმავე ნაშუადღევს
    მეორე გაჩერებად იოლად ჯდება.
  route: >-
    თბილისიდან დაახლოებით 311 კილომეტრია, ოთხი საათი და ორმოცი წუთი. ს1-ით (E60) დასავლეთით, ხაშურის გავლით,
    რიკოთის გვირაბებში და ქუთაისის გვერდით სამტრედიამდე იარეთ, შემდეგ ს12-ით ლანჩხუთისკენ, იქიდან კი სოფლის
    გზებით ოზურგეთამდე. ოზურგეთის ცენტრიდან ლიხაურისკენ მიმავალ გზას სამხრეთით დაადექით; აჭი ქალაქიდან
    9 კილომეტრითაა სამხრეთით. გზა თითქმის ბოლომდე ასფალტიანია, მოკლე მოხრეშილი მონაკვეთით, ეკლესიამდე
    კი ცოტა ფეხით უნდა გაიაროთ. ეკონომკლასის მანქანა ნებისმიერ სეზონზე სავსებით საკმარისია. საწვავი ოზურგეთში
    ჩაასხით.
en:
  name: Achi Monastery
  short: >-
    A small hall church south of Ozurgeti with late-13th-century Palaeologan frescoes, a rare cycle of
    St George and the Greek name of a painter from Trebizond.
  body: >-
    **Some seven hundred years ago a man called Onesimos, from Trebizond, left his name in Greek on the
    wall of a village church in Guria, and probably the paintings around it too.**


    Achi was built of hewn stone at the end of the 13th century or early in the 14th: a single-nave hall,
    later renovated and ringed with defensive walls. It is rare to know so exactly who made a building.
    An inscription in asomtavruli, the old Georgian capitals, on the east façade asks remembrance for
    the lords Saghir, Rati and Ushanian, for Nikoloz of Achi, and for the stonemasons Mikel and Mkhetsidze,
    the men who laid these stones.


    Inside, the walls are painted in the Palaeologan manner, the refined style of late Byzantium, and
    the murals are dated on stylistic grounds to the late 13th century. Among them, fittingly for a church
    dedicated to St George, is a cycle of his life: Georgia's patron saint, shown here in scenes that
    are iconographic rarities. The Greek inscription naming Onesimos, “a Trapezuntine”, ties this Gurian
    village to the Empire of Trebizond, further down the Black Sea coast.


    In the 17th century the princes of Guria took the church under their wing. Simon II and Kaikhosro
    I Gurieli favoured it, and Kaikhosro made Achi a dependency of the bishopric of Shemokmedi. The church
    also held a gilded silver cross with a Georgian inscription mentioning Queen Tamar, brought to light
    by the scholar Ekvtime Takaishvili. Through the Soviet decades the Salukvadze family kept it safe,
    and in 2015 it came back to Achi. The church itself had been returned to worship in 1991; today it
    is a monument of national significance.


    The cross travelled and came home. The frescoes never left; they simply waited.
  tip: >-
    Entry is free. Achi is a working church, so men should wear long trousers and women a skirt and headscarf;
    Sunday mornings belong to the liturgy. The frescoes reward patience: give your eyes a few minutes
    to adjust to the dim nave, and ask before taking photographs, never with flash. Outside, walk round
    to the east façade for the asomtavruli inscription. Allow an hour. There are no facilities at the
    church; Ozurgeti, 9 km to the north, has cafés, ATMs and fuel. Shemokmedi Monastery makes an easy
    second stop on the same afternoon.
  route: >-
    From Tbilisi it is about 311 km, some four hours forty minutes. Take the S1 (E60) west past Khashuri,
    through the Rikoti tunnels and past Kutaisi to Samtredia, then the S12 towards Lanchkhuti and on by
    country road to Ozurgeti. From the centre of Ozurgeti head south on the road towards Likhauri; Achi
    lies 9 km south of the town. The road is asphalt almost to the end, with a short graded stretch, and
    a brief walk brings you to the church. An economy car is entirely sufficient in any season. Fill up
    in Ozurgeti.
ru:
  name: Монастырь Ачи
  short: >-
    Небольшая зальная церковь к югу от Озургети: палеологовские фрески конца XIII века, редкий цикл жития
    святого Георгия и греческое имя художника из Трапезунда.
  body: >-
    **Около семисот лет назад человек по имени Онесим, родом из Трапезунда, оставил своё имя по-гречески
    на стене деревенской церкви в Гурии — и, по всей видимости, также росписи вокруг него.**


    Ачи сложена из тёсаного камня в конце XIII или в начале XIV века: однонефный зал, позднее перестроенный
    и обнесённый оборонительной стеной. Редко о здании известно так точно, кто его возвёл. Надпись асомтаврули
    — древними грузинскими заглавными буквами — на восточном фасаде просит помянуть господ Сагира, Рати
    и Ушаниана, Николоза Ачского и каменотёсов Микела и Мхецидзе, тех самых людей, что уложили эти камни.


    Внутри стены расписаны в палеологовской манере — утончённом стиле поздней Византии; по стилистическим
    признакам росписи датируют концом XIII века. Среди них — как и подобает церкви, освящённой во имя
    святого Георгия, — цикл его жития: покровитель Грузии показан здесь в сценах, которые считаются иконографической
    редкостью. Греческая надпись, называющая Онесима «трапезундцем», связывает эту гурийскую деревню с
    Трапезундской империей, лежавшей дальше по черноморскому берегу.


    В XVII веке церковь взяли под своё крыло владетели Гурии. Ей благоволили Симон II и Кайхосро I Гуриели,
    а Кайхосро приписал Ачи к Шемокмедской епархии. Здесь же хранился позолоченный серебряный крест с
    грузинской надписью, в которой упоминается царица Тамара; его открыл для науки учёный Эквтиме Такаишвили.
    Все советские десятилетия крест берегла семья Салуквадзе, и в 2015 году он вернулся в Ачи. Саму церковь
    вернули верующим в 1991 году; сегодня это памятник национального значения.


    Крест странствовал — и вернулся домой. Фрески никуда не уходили: они просто ждали.
  tip: >-
    Вход свободный. Ачи — действующая церковь: мужчинам нужны длинные брюки, женщинам — юбка и платок;
    воскресное утро принадлежит литургии. Фрески вознаграждают терпение: дайте глазам несколько минут
    привыкнуть к полумраку нефа и, прежде чем фотографировать, спросите разрешения — и никогда не снимайте
    со вспышкой. Снаружи обойдите храм к восточному фасаду, чтобы увидеть надпись асомтаврули. Закладывайте
    час. У церкви нет никакой инфраструктуры; в Озургети, в 9 км к северу, есть кафе, банкоматы и заправки.
    Монастырь Шемокмеди легко сделать второй остановкой в тот же день.
  route: >-
    От Тбилиси около 311 км, примерно четыре часа сорок минут. Езжайте по S1 (E60) на запад мимо Хашури,
    через Рикотские тоннели и мимо Кутаиси до Самтредиа, затем по S12 в сторону Ланчхути и дальше местной
    дорогой до Озургети. Из центра Озургети держите на юг, по дороге на Лихаури; Ачи лежит в 9 км к югу
    от города. Асфальт почти до самого конца, лишь короткий участок укатанной грунтовки, а к церкви ведёт
    недолгая пешая прогулка. Машины эконом-класса вполне хватит в любое время года. Заправьтесь в Озургети.
fa:
  name: صومعهٔ آچی
  short: >-
    کلیسای تالاری کوچکی در جنوب اوزورگتی با دیوارنگاره‌های پالئولوگی اواخر سدهٔ سیزدهم، چرخهٔ کمیابی از
    زندگی قدیس گئورگی و نام یونانی نقاشی از ترابوزان.
  body: >-
    **حدود هفتصد سال پیش، مردی به نام اونسیموس از ترابوزان نامش را به یونانی بر دیوار کلیسای روستایی در
    گوریا نوشت — و احتمالاً، نقاشی‌های پیرامون آن نام هم کار خود او بود.**


    آچی در پایان سدهٔ سیزدهم یا آغاز سدهٔ چهاردهم از سنگ تراشیده ساخته شد: تالاری تک‌شبستانی که بعدها
    بازسازی شد و دیوارهای دفاعی گرداگردش کشیدند. کمتر پیش می‌آید که این‌قدر دقیق بدانیم چه کسانی بنایی
    را ساخته‌اند. کتیبه‌ای به خط آسومتاورولی — حروف بزرگ کهن گرجی — بر نمای شرقی، یادِ اربابان ساغیر و
    راتی و اوشانیان، یادِ نیکولوزِ آچی، و یادِ سنگ‌تراشان میکل و مختسیدزه را طلب می‌کند؛ همان مردانی که
    این سنگ‌ها را روی هم چیدند.


    درون کلیسا، دیوارها به شیوهٔ پالئولوگی — سبک ظریف واپسین روزگار بیزانس — نقاشی شده‌اند و این دیوارنگاره‌ها
    را بر پایهٔ ویژگی‌های سبکی به اواخر سدهٔ سیزدهم نسبت می‌دهند. در میان آن‌ها — چنان‌که برازندهٔ کلیسایی
    به نام قدیس گئورگی است — چرخه‌ای از زندگی او هست: قدیس حامی گرجستان، که این‌جا در صحنه‌هایی تصویر
    شده که از نظر شمایل‌نگاری کمیاب‌اند. کتیبهٔ یونانی‌ای که اونسیموس را «ترابوزانی» می‌خواند، این روستای
    گوریایی را به امپراتوری ترابوزان، در دوردست‌های کرانهٔ دریای سیاه، پیوند می‌زند.


    در سدهٔ هفدهم، فرمانروایان گوریا کلیسا را زیر بال خود گرفتند. سیمون دوم و کیخسرو یکم گوریلی به آن
    عنایت داشتند و کیخسرو آچی را تابع اسقف‌نشین شموکمدی کرد. در کلیسا صلیبی از نقرهٔ زراندود نیز نگهداری
    می‌شد با کتیبه‌ای گرجی که در آن از ملکه تامار یاد شده است؛ این صلیب را پژوهشگر، اکوتیمه تاکایشویلی،
    به جهان علم شناساند. در دهه‌های شوروی خانوادهٔ سالوکوادزه از آن محافظت کرد و در سال ۲۰۱۵ صلیب به آچی
    بازگشت. خود کلیسا در سال ۱۹۹۱ دوباره به روی عبادت گشوده شد و امروز اثری با اهمیت ملی است.


    صلیب سفر کرد و به خانه بازگشت. دیوارنگاره‌ها هرگز جایی نرفتند؛ فقط منتظر ماندند.
  tip: >-
    ورود رایگان است. آچی کلیسایی فعال است؛ مردان شلوار بلند بپوشند و زنان دامن و روسری. صبح‌های یکشنبه
    از آنِ آیین عشای ربانی است. دیوارنگاره‌ها صبر را پاداش می‌دهند: چند دقیقه به چشمانتان فرصت دهید تا
    به نیمه‌تاریکی شبستان خو بگیرند و پیش از عکاسی اجازه بگیرید — و هرگز با فلاش. بیرون، کلیسا را دور
    بزنید و به نمای شرقی بروید تا کتیبهٔ آسومتاورولی را ببینید. یک ساعت وقت بگذارید. کنار کلیسا هیچ امکاناتی
    نیست؛ اوزورگتی، ۹ کیلومتر به سمت شمال، کافه، خودپرداز و پمپ بنزین دارد. صومعهٔ شموکمدی توقف دوم آسانی
    برای همان بعدازظهر است.
  route: >-
    از تفلیس حدود ۳۱۱ کیلومتر راه است، نزدیک به چهار ساعت و چهل دقیقه. از جادهٔ S1 (E60) رو به غرب بروید:
    از کنار خاشوری، از تونل‌های ریکوتی و از کنار کوتایسی بگذرید تا به سامتردیا برسید؛ سپس از S12 به سوی
    لانچخوتی بروید و از آن‌جا با جاده‌ای روستایی تا اوزورگتی ادامه دهید. از مرکز اوزورگتی در جادهٔ لیخائوری
    رو به جنوب برانید؛ آچی ۹ کیلومتر جنوب شهر است. جاده تقریباً تا انتها آسفالت است و فقط تکهٔ کوتاهی
    خاکیِ تسطیح‌شده دارد؛ پیاده‌روی کوتاهی هم شما را به کلیسا می‌رساند. یک خودروی اقتصادی در هر فصلی کاملاً
    کافی است. در اوزورگتی باک را پر کنید.
he:
  name: מנזר אצ׳י
  short: >-
    כנסיית אולם קטנה מדרום לאוזורגטי, ובה ציורי קיר פלאולוגיים מסוף המאה ה־13, מחזור נדיר מחיי גאורגיוס
    הקדוש ושמו היווני של צייר מטרפזונט.
  body: >-
    **לפני כשבע מאות שנה הותיר אדם בשם אונסימוס, בן טרפזונט, את שמו ביוונית על קיר של כנסייה כפרית בגוריה
    — וככל הנראה גם את הציורים שסביבו.**


    אצ׳י נבנתה מאבן מסותתת בסוף המאה ה־13 או בראשית המאה ה־14: כנסיית אולם בעלת ספינה אחת, ששופצה בהמשך
    והוקפה חומות מגן. רק לעיתים רחוקות יודעים בדיוק רב כל כך מי הקים מבנה. כתובת באסומטאברולי — האותיות
    הגדולות של הכתב הגאורגי העתיק — על החזית המזרחית מבקשת להעלות את זכרם של האדונים סגיר, רטי ואושניאן,
    של ניקולוז מאצ׳י ושל הסתתים מיקל ומחצידזה, האנשים שהניחו את האבנים האלה זו על זו.


    בפנים מצוירים הקירות בסגנון הפלאולוגי, הסגנון המעודן של ביזנטיון המאוחרת, ועל פי סגנונם מתוארכים ציורי
    הקיר לסוף המאה ה־13. ביניהם — כיאה לכנסייה המוקדשת לגאורגיוס הקדוש — מחזור מחייו של הקדוש, הפטרון
    של גאורגיה, המוצג כאן בסצנות שהן נדירות איקונוגרפיות של ממש. הכתובת היוונית שמכנה את אונסימוס "טרפזונטי"
    קושרת את הכפר הגורי הזה לקיסרות טרפזונט, הרחק יותר לאורך חוף הים השחור.


    במאה ה־17 פרשו שליטי גוריה את חסותם על הכנסייה. סימון השני וקייחוסרו הראשון גוריאלי העניקו לה את חסדם,
    וקייחוסרו הכפיף את אצ׳י לבישופות שמוקמדי. בכנסייה נשמר גם צלב כסף מוזהב ועליו כתובת גאורגית המזכירה
    את המלכה תמר; את הצלב הביא לידיעת המחקר החוקר אקבתימה תקאישווילי. לאורך העשורים הסובייטיים שמרה עליו
    משפחת סלוקוואדזה, ובשנת 2015 חזר לאצ׳י. הכנסייה עצמה הוחזרה לפולחן ב־1991, וכיום היא אתר מורשת בעל
    חשיבות לאומית.


    הצלב נדד וחזר הביתה. ציורי הקיר מעולם לא עזבו; הם פשוט חיכו.
  tip: >-
    הכניסה חינם. אצ׳י היא כנסייה פעילה, ולכן על גברים ללבוש מכנסיים ארוכים ועל נשים חצאית וכיסוי ראש;
    בבוקר יום ראשון מתקיימת הליטורגיה. ציורי הקיר מתגמלים סבלנות: תנו לעיניים כמה דקות להתרגל לאפלולית
    של האולם, ובקשו רשות לפני שאתם מצלמים — ולעולם לא בפלאש. בחוץ הקיפו את הכנסייה אל החזית המזרחית כדי
    לראות את כתובת האסומטאברולי. הקדישו לביקור שעה. ליד הכנסייה אין שום מתקנים; באוזורגטי, 9 ק"מ צפונה,
    יש בתי קפה, כספומטים ותחנות דלק. מנזר שמוקמדי הוא תחנה שנייה נוחה באותו אחר צהריים.
  route: >-
    מטביליסי כ־311 ק"מ, כארבע שעות וארבעים דקות. סעו בכביש S1 (E60) מערבה, על פני חשורי, דרך מנהרות ריקוטי
    ועל פני קוטאיסי עד סמטרדיה, ומשם בכביש S12 לכיוון לנצ׳חותי והלאה בכביש כפרי עד אוזורגטי. ממרכז אוזורגטי
    פנו דרומה בכביש לליחאורי; אצ׳י שוכנת 9 ק"מ דרומית לעיר. הדרך סלולה כמעט עד הסוף, עם קטע קצר של דרך
    עפר מיושרת, והליכה קצרה מביאה אתכם אל הכנסייה. רכב חסכוני מספיק בהחלט בכל עונה. תדלקו באוזורגטי.
ar:
  name: دير أتشي
  short: >-
    كنيسة قاعة صغيرة جنوب أوزورغيتي، فيها جداريات باليولوجية من أواخر القرن الثالث عشر، ودورة نادرة من
    سيرة القديس جاورجيوس، واسم يوناني لرسّام من طرابزون.
  body: >-
    **قبل نحو سبعمئة عام، ترك رجلٌ يُدعى أونيسيموس، من أهل طرابزون، اسمَه باليونانية على جدار كنيسة قروية
    في غوريا — والأرجح أنه ترك معه الرسوم المحيطة به أيضًا.**


    بُنيت أتشي من الحجر المنحوت في أواخر القرن الثالث عشر أو مطلع الرابع عشر: قاعة ذات صحن واحد، جُدّدت
    لاحقًا وأُحيطت بأسوار دفاعية. ونادرًا ما نعرف بهذه الدقة مَن شيّد مبنًى ما. فعلى الواجهة الشرقية نقشٌ
    بالأسومتافرولي، أي الحروف الجورجية الكبيرة القديمة، يدعو بالذكر الحسن للسادة ساغير وراتي وأوشانيان،
    ولنيكولوز الأتشي، وللبنّاءَين ميكيل ومخيتسيدزه، الرجلين اللذين رصّا هذه الحجارة بأيديهما.


    وفي الداخل زُيّنت الجدران بالأسلوب الباليولوجي، الطراز الرفيع لبيزنطة المتأخرة، وتؤرَّخ الجداريات
    استنادًا إلى أسلوبها بأواخر القرن الثالث عشر. ومن بينها — كما يليق بكنيسة مكرّسة للقديس جاورجيوس —
    دورة من سيرته: شفيع جورجيا، وقد صُوِّر هنا في مشاهد تُعدّ من النوادر الأيقونية. أما النقش اليوناني
    الذي يصف أونيسيموس بـ«الطرابزوني» فيربط هذه القرية الغورية بإمبراطورية طرابزون، الواقعة أبعد على ساحل
    البحر الأسود.


    وفي القرن السابع عشر بسط حكّام غوريا رعايتهم على الكنيسة؛ فقد حظيت بعناية سيمون الثاني وكايخوسرو الأول
    غورييلي، وجعل كايخوسرو أتشي تابعةً لأسقفية شيموكميدي. وكانت الكنيسة تحفظ كذلك صليبًا من الفضة المذهّبة
    عليه نقش جورجي يَرِد فيه ذكر الملكة تامار، وقد عرّف به العالمُ إكفتيمي تاكايشفيلي. وطوال العقود السوفييتية
    حفظته عائلة سالوكفادزه، حتى عاد إلى أتشي عام 2015. أما الكنيسة نفسها فقد أُعيدت إلى العبادة عام 1991،
    وهي اليوم معلم ذو أهمية وطنية.


    سافر الصليب ثم عاد إلى بيته. أما الجداريات فلم تغادر قط؛ كانت تنتظر فحسب.
  tip: >-
    الدخول مجاني. أتشي كنيسة عاملة، لذا يُستحسن أن يرتدي الرجال سراويل طويلة، والنساء تنورة وغطاء رأس؛
    وصباح الأحد مخصص للقداس. الجداريات تكافئ الصبر: امنح عينيك بضع دقائق لتعتادا عتمة الصحن، واستأذن قبل
    التصوير، ولا تستخدم الفلاش أبدًا. في الخارج، دُر حول الكنيسة إلى الواجهة الشرقية لترى نقش الأسومتافرولي.
    خصّص ساعة للزيارة. لا توجد أي مرافق عند الكنيسة؛ أما أوزورغيتي، على بعد 9 كم شمالًا، ففيها مقاهٍ وصرّافات
    آلية ومحطات وقود. ودير شيموكميدي محطة ثانية سهلة بعد الظهر في اليوم نفسه.
  route: >-
    تبعد أتشي عن تبليسي نحو 311 كم، أي قرابة أربع ساعات وأربعين دقيقة. اسلك الطريق S1 (E60) غربًا مرورًا
    بخاشوري، ثم عبر أنفاق ريكوتي، فمتجاوزًا كوتايسي حتى سامتريديا، ثم الطريق S12 باتجاه لانتشخوتي، ومنها
    طريقًا ريفيًا إلى أوزورغيتي. من وسط أوزورغيتي اتجه جنوبًا على الطريق المؤدي إلى ليخاوري؛ تقع أتشي
    على بعد 9 كم جنوب المدينة. الطريق معبّد حتى النهاية تقريبًا، باستثناء مقطع قصير ترابي مسوّى، ثم يوصلك
    مشي قصير إلى الكنيسة. تكفي سيارة اقتصادية تمامًا في أي فصل. املأ خزان الوقود في أوزورغيتي.
