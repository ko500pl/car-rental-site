ka:
  name: დედაენის ბაღი
  short: სანაპირო პარკი მშრალ ხიდთან — დედაენის ძეგლი, სკეიტპარკი და თბილისის ახალგაზრდული ბარების ეპიცენტრი.
  body: >-
    **დედაენის ბაღი ის ადგილია, სადაც თბილისის ისტორია და მისი ყველაზე ახალგაზრდული სცენა ერთ სანაპიროზე
    ხვდებიან** — მტკვრის მარჯვენა ნაპირზე, მშრალ ხიდსა და ბარათაშვილის ხიდს შორის.


    ბაღის სახელი შემთხვევითი არაა: 1978 წლის 14 აპრილს ათიათასობით ადამიანი გამოვიდა ქუჩაში, როცა საბჭოთა
    ხელისუფლებამ ქართული ენისთვის სახელმწიფო სტატუსის ჩამორთმევა სცადა — და მოსკოვმა უკან დაიხია. ამ გამარჯვების
    ხსოვნას 1983 წელს დადგმული დედაენის ძეგლი ინახავს (ავტორები: ელგუჯა ამაშუკელი და ნოდარ მგალობლიშვილი),
    ხოლო 14 აპრილი დღემდე დედაენის დღედ აღინიშნება.


    დღეს ბაღი სულ სხვა რიტმში ცხოვრობს:


    - საერთაშორისო სტანდარტის ბეტონის სკეიტპარკი — რეგიონში ერთადერთი ასეთი

    - სანაპიროს ბარები, მათ შორის ცნობილი Dedaena Bar

    - მშრალი ხიდის ბლშ-ბაზრობა პირდაპირ ბაღის თავზე

    - ფესტივალები და ღია ცის ქვეშ კონცერტები თბილ სეზონზე


    შაბათ-კვირას აქ ერთდროულად ნახავ სკეიტერებს, ანტიკვარიატით მოვაჭრეებს და საღამოს კოქტეილზე გამოსულ
    ხალხს — თბილისი თავის მრავალფეროვნებაში.
  tip: >-
    ბაღი ღიაა მუდმივად და უფასოა. მშრალი ხიდის ბაზრობა დღისითაა (ცუდ ამინდში ვაჭრები ადრე იშლებიან), ბარები
    კი მზის ჩასვლის მერე ცოცხლდება — შუადღიდან საღამომდე ვიზიტი ორივეს მოასწრებს. სკეიტპარკში ინვენტარს
    არ აქირავებენ, საკუთარი მოიტანე. ტუალეტი ბარებშია. ბავშვებთან ერთად სანაპიროს მოაჯირებთან ფრთხილად
    — ზოგან დაბალია.
  route: >-
    ცენტრიდან ბაღამდე 2 კმ-ია — ბარათაშვილის ხიდისკენ ჩადი და მარჯვენა სანაპიროზე დარჩი, სულ ათიოდე წუთია.
    პარკინგი ამ მონაკვეთზე პრობლემურია: სანაპიროზე გაჩერება შეზღუდულია, ამიტომ მანქანა დატოვე ზაარბრიუკენის
    მოედნის მიმდებარე ქუჩებზე ზონალურ ფასიან ადგილებზე (Tbilisi Parking-ის აპი) და ხიდით ფეხით გადმოდი.
    საღამოს ბარებში მისვლისას მანქანა საერთოდ დატოვე სახლში — ტაქსი იაფია. ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Dedaena Park
  short: >-
    A riverside park by the Dry Bridge — the Mother Tongue monument, a skatepark and the epicentre of
    Tbilisi's young bar scene.
  body: >-
    **Dedaena Park is where Tbilisi's history and its youngest scene share one riverbank** — on the right
    bank of the Mtkvari, between the Dry Bridge and Baratashvili Bridge.


    The name is no accident. On 14 April 1978, tens of thousands took to the streets here when the Soviet
    authorities tried to strip Georgian of its status as the state language — and Moscow backed down.
    The Deda Ena (Mother Tongue) monument, erected in 1983 by Elguja Amashukeli and Nodar Mgaloblishvili,
    keeps the memory of that victory, and 14 April is still marked as Mother Language Day.


    Today the park runs to a different rhythm:


    - A concrete skatepark built to international standard — the only one of its kind in the region

    - Riverside bars, including the well-known Dedaena Bar

    - The Dry Bridge flea market directly above the park

    - Festivals and open-air concerts through the warm season


    On a weekend you'll see skaters, antique dealers and the evening cocktail crowd all at once — Tbilisi
    in all its variety on a few hundred metres of embankment.
  tip: >-
    The park is always open and free. The Dry Bridge market runs in daytime (traders pack up early in
    bad weather), while the bars wake up after sunset — an afternoon-into-evening visit catches both.
    The skatepark has no rental gear, so bring your own. Toilets are in the bars. With children, mind
    the embankment railings — they are low in places.
  route: >-
    From the centre it's 2 km — head for Baratashvili Bridge and stay on the right bank, ten minutes at
    most. Parking is the weak point here: stopping on the embankment is restricted, so leave the car in
    the zonal paid spaces on the streets around Saarbrücken Square (Tbilisi Parking app) and walk across
    the bridge. If you're coming for the bars in the evening, leave the car at your hotel altogether —
    taxis are cheap. An economy car is entirely sufficient.
ru:
  name: Парк Дэда Эна
  short: Прибрежный парк у Сухого моста — монумент родному языку, скейтпарк и эпицентр молодой барной
    сцены Тбилиси.
  body: >-
    **Парк Дэда Эна — место, где история Тбилиси и его самая молодая сцена делят одну набережную** — на
    правом берегу Куры, между Сухим мостом и мостом Бараташвили.


    Название не случайно. 14 апреля 1978 года десятки тысяч людей вышли здесь на улицы, когда советские
    власти попытались лишить грузинский язык государственного статуса, — и Москва отступила. Память о
    той победе хранит монумент «Дэда эна» («Родной язык»), установленный в 1983 году скульпторами Элгуджей
    Амашукели и Нодаром Мгалоблишвили, а 14 апреля до сих пор отмечается как День родного языка.


    Сегодня парк живёт в другом ритме:


    - Бетонный скейтпарк международного стандарта — единственный такой в регионе

    - Бары у воды, включая известный Dedaena Bar

    - Блошиный рынок Сухого моста прямо над парком

    - Фестивали и концерты под открытым небом в тёплый сезон


    В выходной здесь одновременно увидите скейтеров, торговцев антиквариатом и публику, вышедшую на вечерний
    коктейль, — весь Тбилиси на нескольких сотнях метров набережной.
  tip: >-
    Парк открыт всегда и бесплатен. Блошиный рынок работает днём (в плохую погоду торговцы сворачиваются
    рано), бары просыпаются после заката — визит с середины дня до вечера охватит и то и другое. Проката
    снаряжения в скейтпарке нет, привозите своё. Туалеты — в барах. С детьми будьте внимательны у ограждений
    набережной: местами они низкие.
  route: >-
    От центра сюда 2 км: держите путь к мосту Бараташвили и оставайтесь на правом берегу, максимум десять
    минут. Парковка — слабое место: остановка на набережной ограничена, поэтому оставьте машину в зональных
    платных карманах на улицах у площади Саарбрюкен (приложение Tbilisi Parking) и перейдите мост пешком.
    Если едете вечером по барам — оставьте машину у отеля вовсе: такси дёшево. Эконом-класса вполне достаточно.
fa:
  name: پارک ددا انا
  short: پارکی کنار رود نزدیک پل خشک — یادمان زبان مادری، اسکیت‌پارک و کانون بارهای جوان تفلیس.
  body: >-
    **پارک ددا انا جایی است که تاریخ تفلیس و جوان‌ترین صحنهٔ آن یک ساحل را قسمت می‌کنند** — در کرانهٔ
    راست رود متکواری، میان پل خشک و پل باراتاشویلی.


    نامش بی‌سبب نیست. در ۱۴ آوریل ۱۹۷۸ ده‌ها هزار نفر اینجا به خیابان آمدند، وقتی مقامات شوروی می‌خواستند
    جایگاه رسمی زبان گرجی را بگیرند — و مسکو عقب نشست. یادمان «ددا انا» (زبان مادری)، ساختهٔ الگوجا آماشوکلی
    و نودار مگالوبلیشویلی در ۱۹۸۳، خاطرهٔ آن پیروزی را نگه می‌دارد و ۱۴ آوریل هنوز روز زبان مادری است.


    امروز پارک با آهنگی دیگر می‌گردد:


    - اسکیت‌پارک بتنی با استاندارد بین‌المللی — یگانه در منطقه

    - بارهای کنار آب، از جمله «ددا انا بار» مشهور

    - بازار دست‌دوم پل خشک درست بالای پارک

    - جشنواره‌ها و کنسرت‌های روباز در فصل گرم


    آخر هفته اینجا هم‌زمان اسکیت‌بازها، عتیقه‌فروش‌ها و جماعتِ کوکتل عصرگاهی را می‌بینید — تفلیس با همهٔ
    تنوعش در چند صد متر ساحل.
  tip: >-
    پارک همیشه باز و رایگان است. بازار پل خشک روزها برپاست (در هوای بد فروشندگان زود جمع می‌کنند) و بارها
    پس از غروب بیدار می‌شوند — بازدیدی از بعدازظهر تا شب به هر دو می‌رسد. اسکیت‌پارک وسیله کرایه نمی‌دهد،
    وسایل خودتان را بیاورید. سرویس بهداشتی در بارهاست. با کودکان کنار نردهٔ ساحل محتاط باشید — جاهایی
    کوتاه است.
  route: >-
    از مرکز شهر ۲ کیلومتر است: به سوی پل باراتاشویلی برانید و در کرانهٔ راست بمانید، حداکثر ده دقیقه.
    پارکینگ نقطه‌ضعف اینجاست: توقف در ساحل محدود است، پس خودرو را در جاهای پولی منطقه‌ای خیابان‌های اطراف
    میدان زاربروکن بگذارید (اپلیکیشن Tbilisi Parking) و از پل پیاده بگذرید. اگر شب برای بارها می‌آیید،
    خودرو را کلاً در هتل بگذارید — تاکسی ارزان است. خودروی اقتصادی کاملاً کافی است.
he:
  name: פארק דדה אנה
  short: פארק על גדת הנהר ליד הגשר היבש — אנדרטת שפת האם, סקייטפארק ומוקד סצנת הברים הצעירה של טביליסי.
  body: >-
    **פארק דדה אנה הוא המקום שבו ההיסטוריה של טביליסי והסצנה הצעירה ביותר שלה חולקות גדה אחת** — על הגדה
    הימנית של המטקווארי, בין הגשר היבש לגשר ברטאשווילי.


    השם אינו מקרי. ב-14 באפריל 1978 יצאו לכאן עשרות אלפים לרחובות, כשהשלטונות הסובייטיים ניסו לשלול מהשפה
    הגאורגית את מעמדה כשפת המדינה — ומוסקבה נסוגה. אנדרטת «דדה אנה» (שפת האם), שהוקמה ב-1983 בידי אלגוג'ה
    אמאשוקלי ונודר מגלובלישווילי, משמרת את זכר הניצחון ההוא, וה-14 באפריל מצוין עד היום כיום שפת האם.


    היום הפארק חי בקצב אחר:


    - סקייטפארק בטון בתקן בינלאומי — היחיד מסוגו באזור

    - ברים על המים, ובהם ה-Dedaena Bar המוכר

    - שוק הפשפשים של הגשר היבש ממש מעל הפארק

    - פסטיבלים והופעות תחת כיפת השמיים בעונה החמה


    בסוף שבוע תראו כאן בעת ובעונה אחת סקייטרים, סוחרי עתיקות וקהל של קוקטייל ערב — טביליסי על כל גווניה
    בכמה מאות מטרים של טיילת.
  tip: >-
    הפארק פתוח תמיד והכניסה חינם. שוק הפשפשים פועל ביום (במזג אוויר רע הסוחרים מתקפלים מוקדם), והברים
    מתעוררים אחרי השקיעה — ביקור מאחר הצהריים אל הערב תופס את שניהם. בסקייטפארק אין השכרת ציוד, הביאו
    משלכם. שירותים יש בברים. עם ילדים היזהרו ליד מעקות הטיילת — במקומות מסוימים הם נמוכים.
  route: >-
    מהמרכז 2 ק״מ: סעו לכיוון גשר ברטאשווילי והישארו בגדה הימנית, עשר דקות לכל היותר. החניה היא נקודת התורפה:
    עצירה על הטיילת מוגבלת, לכן השאירו את הרכב במקומות החניה האזוריים בתשלום ברחובות סביב כיכר זארבריקן
    (אפליקציית Tbilisi Parking) וחצו את הגשר ברגל. אם באים בערב לברים — עדיף להשאיר את הרכב במלון: מוניות
    זולות. רכב חסכוני מספיק בהחלט.
ar:
  name: حديقة ديدا إنا
  short: حديقة على ضفة النهر قرب الجسر الجاف — نصب اللغة الأم ومضمار تزلج وقلب مشهد الحانات الشابة في
    تبليسي.
  body: >-
    **حديقة ديدا إنا هي المكان الذي يتقاسم فيه تاريخ تبليسي ومشهدها الأكثر شباباً ضفة واحدة** — على الضفة
    اليمنى لنهر متكفاري، بين الجسر الجاف وجسر باراتاشفيلي.


    الاسم ليس مصادفة. ففي 14 أبريل 1978 خرج هنا عشرات الآلاف إلى الشوارع حين حاولت السلطات السوفيتية تجريد
    اللغة الجورجية من صفتها لغةً للدولة — فتراجعت موسكو. ويحفظ ذكرى ذلك الانتصار نصب «ديدا إنا» (اللغة
    الأم) الذي أقامه عام 1983 النحاتان إلغوجا أماشوكيلي ونودار مغالوبليشفيلي، وما زال 14 أبريل يُحتفل
    به يوماً للغة الأم.


    اليوم تعيش الحديقة على إيقاع آخر:


    - مضمار تزلج خرساني بمعايير دولية — الوحيد من نوعه في المنطقة

    - حانات على الماء، منها Dedaena Bar الشهير

    - سوق الجسر الجاف للمقتنيات القديمة فوق الحديقة مباشرة

    - مهرجانات وحفلات في الهواء الطلق طوال الموسم الدافئ


    في عطلة نهاية الأسبوع ترى المتزلجين وباعة التحف وروّاد كوكتيل المساء معاً — تبليسي بكل تنوعها على
    بضع مئات من أمتار الكورنيش.
  tip: >-
    الحديقة مفتوحة دائماً ومجانية. سوق الجسر الجاف نهاري (في الطقس السيئ يجمع الباعة بضاعتهم باكراً)،
    والحانات تصحو بعد الغروب — زيارة من بعد الظهر إلى المساء تدرك الاثنين. لا تأجير معدات في مضمار التزلج،
    فأحضر عدّتك. دورات المياه في الحانات. مع الأطفال انتبه عند درابزين الكورنيش — فهو منخفض في بعض المواضع.
  route: >-
    من المركز كيلومتران: اتجه نحو جسر باراتاشفيلي وابقَ على الضفة اليمنى، عشر دقائق على الأكثر. الركن
    هو نقطة الضعف هنا: التوقف على الكورنيش مقيّد، فاترك السيارة في المواقف المدفوعة بالمناطق في الشوارع
    حول ساحة زاربروكن (تطبيق Tbilisi Parking) واعبر الجسر ماشياً. وإن كنت قادماً مساءً إلى الحانات فاترك
    السيارة عند الفندق أصلاً — فالتاكسي رخيص. سيارة اقتصادية تكفي تماماً.
rating: 3.5
