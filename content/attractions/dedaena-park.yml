ka:
  name: დედაენის ბაღი
  short: >-
    სანაპირო ბაღი, სადაც 1978 წელს ქართული ენა დაიცვეს: ბრინჯაოს ძეგლი, სკეიტპარკი და მშრალი ხიდის ბაზრობა
    ორ ნაბიჯზე.
  body: >-
    **1978 წლის 14 აპრილს მტკვრის მარჯვენა სანაპიროს ეს მონაკვეთი იმათ ეკუთვნოდა, ვინც მშობლიურ ენას არ
    თმობდა — და მოსკოვმა, იშვიათი გამონაკლისის სახით, უკან დაიხია.**


    საბჭოთა საქართველოს ახალი კონსტიტუციიდან უნდა ამოეღოთ მუხლი, რომელიც ქართულს რესპუბლიკის ერთადერთ
    სახელმწიფო ენად აცხადებდა. ქუჩაში ათასობით ადამიანი გამოვიდა, უმეტესად სტუდენტები, და მასობრივი აქცია
    სწორედ აქ გაიმართა. კომპარტიის პირველმა მდივანმა ედუარდ შევარდნაძემ მოსკოვთან მოლაპარაკებით ძველი
    ფორმულირების შენარჩუნებას მიაღწია; იგივე ცვლილება მერე ჩუმად მოხსნეს სომხეთისა და აზერბაიჯანისთვისაც.
    1990 წლიდან 14 აპრილი დედაენის დღედ აღინიშნება.


    1983 წელს მოქანდაკეებმა ელგუჯა ამაშუკელმა და ნოდარ მგალობლიშვილმა აქ დედაენის მაღალი ბრინჯაოს ძეგლი
    აღმართეს.


    დღეს ბაღი ახალგაზრდულ რიტმში ცხოვრობს. ქვის მოაჯირს ჭადრების ხეივანი მიუყვება, მდინარის გაღმა, ცის
    კიდეზე, სამების ტაძარი მოჩანს. ბეტონის სკეიტპარკი რეგიონში ერთადერთია, რომელიც საერთაშორისო სტანდარტებს
    აკმაყოფილებს, დაბნელების შემდეგ კი კაფე-ბარები ივსება. ბაღის გვერდით მშრალი ხიდია, თავისი ბაზრობით,
    სადაც ნებისმიერ სუვენირსა და ანტიკვარიატს იპოვით. ხიდის სახელსაც თავისი ამბავი აქვს: 1930-იან წლებამდე
    მის ქვეშ მტკვრის ტოტი მიედინებოდა; ტოტი დაშრა, ქვის თაღი კი ცარიელი კალაპოტის თავზე დარჩა. ხიდის პარაპეტზე
    დაფაა, რომელიც ქართულად და იტალიურად იხსენიებს მის არქიტექტორს, ჯოვანი სკუდიერს.


    სკეიტბორდების რახრახი ბრინჯაოდან რამდენიმე მეტრში ძეგლს სულაც არ შეურაცხყოფს. სწორედ ამას იცავდნენ
    1978 წლის სტუდენტები: ქალაქს, სადაც ახალგაზრდები ქართულად ლაპარაკობენ, ყვირიან და კამათობენ.
  tip: >-
    ბაღი უფასოა და მუდამ ღიაა. მშრალი ხიდის ბაზრობა დღისით მუშაობს (ცუდ ამინდში ვაჭრები ადრე იშლებიან),
    ბარები კი მზის ჩასვლის შემდეგ ცოცხლდება — შუადღიდან საღამომდე გაწელილი ვიზიტი ორივეს მოგასწრებს. ძეგლის
    მშვიდად სანახავად დილა სჯობს. სკეიტპარკში ინვენტარს არ აქირავებენ — სკეიტბორდი თან იქონიეთ. ტუალეტი
    კაფეებსა და ბარებშია. პატარა ბავშვებს მდინარის მოაჯირთან ხელიდან ნუ გაუშვებთ.
  route: >-
    დედაენის ბაღი თავისუფლების მოედნიდან დაახლოებით 2 კილომეტრშია, მტკვრის მარჯვენა სანაპიროზე, ბარათაშვილის
    ხიდსა და მშრალ ხიდს შორის — მანქანით ათიოდე წუთი. ბაღთან სანაპიროზე გაჩერება შეზღუდულია, ამიტომ ყველაზე
    იოლია, მარცხენა სანაპიროზე გადახვიდეთ, მანქანა საარბრიუკენის მოედნის მიმდებარე ზონალურ ფასიან ადგილებზე
    დატოვოთ (Tbilisi Parking-ის აპლიკაცია) და მდინარე ფეხით გადმოკვეთოთ. თუ საღამოს ბარებში მიდიხართ,
    მანქანა სასტუმროსთან დატოვეთ: თბილისში ტაქსი იაფია, სანაპიროზე მოძრაობა კი საღამოობით ნელია. გზა მთლიანად
    ასფალტიანია, ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Dedaena Park
  short: >-
    The riverside park where Georgians defended their language in 1978: a bronze monument, a skatepark
    and the Dry Bridge flea market next door.
  body: >-
    **On 14 April 1978 this stretch of the Mtkvari's right bank belonged to people who would not give
    up their language, and Moscow, for once, gave way.**


    A new constitution for Soviet Georgia was about to drop the clause that made Georgian the republic's
    sole state language. Thousands came out, most of them students, and a mass rally was held right here.
    The Communist Party chief, Eduard Shevardnadze, negotiated with Moscow and won permission to keep
    the old wording; the same change was then quietly dropped for Armenia and Azerbaijan too. Since 1990,
    14 April has been marked as the Day of the Georgian Language.


    In 1983 the sculptors Elguja Amashukeli and Nodar Mgaloblishvili raised the Deda Ena, or "Mother Tongue",
    monument here, a tall work in bronze.


    Today the park keeps a younger rhythm. A promenade of plane trees follows the stone parapet, with
    Sameba Cathedral on the skyline across the river. The concrete skatepark is the only one in the region
    built to international standards, and after dark the café-bars fill up. Right beside the park is the
    Dry Bridge, whose flea market sells every souvenir and antique imaginable. The bridge's name tells
    its own story: until the 1930s a branch of the Mtkvari ran beneath it, and when the branch dried up,
    the stone arch was left spanning an empty bed. A plaque on its parapet, in Georgian and Italian, remembers
    its architect, Giovanni Scudieri.


    The clatter of skateboards a few metres from the bronze is no insult to it. It is exactly what the
    students of 1978 were defending: a city where the young talk, shout and argue in Georgian.
  tip: >-
    The park is free and always open. The Dry Bridge market is a daytime affair (traders pack up early
    in bad weather), while the bars wake after sunset, so an afternoon drifting into evening catches both.
    For the monument without company, come in the morning. The skatepark has no gear for hire, so bring
    your own board. Toilets are in the cafés and bars. With small children, keep a hand on them along
    the river parapet.
  route: >-
    Dedaena Park is about 2 km from Freedom Square, on the right-bank embankment between Baratashvili
    Bridge and the Dry Bridge: ten minutes' drive. Stopping on the embankment by the park is restricted,
    so the easy move is to cross to the left bank, park in the zonal paid spaces around Saarbrücken Square
    (Tbilisi Parking app) and walk back over the river. If you are coming for the bars in the evening,
    leave the car at your hotel: taxis in Tbilisi are cheap and embankment traffic is slow after dark.
    Asphalt all the way; an economy car is plenty.
ru:
  name: Парк Дедаэна
  short: >-
    Прибрежный парк, где в 1978 году грузины отстояли свой язык: бронзовый памятник, скейтпарк и блошиный
    рынок у Сухого моста по соседству.
  body: >-
    **14 апреля 1978 года этот отрезок правого берега Мтквари принадлежал людям, которые не пожелали отдать
    свой язык, и Москва — случай редкий — уступила.**


    Новая конституция Советской Грузии должна была лишиться статьи, закреплявшей грузинский как единственный
    государственный язык республики. На улицы вышли тысячи людей, в основном студенты, и массовый митинг
    прошёл именно здесь. Глава Компартии Грузии Эдуард Шеварднадзе договорился с Москвой и добился сохранения
    прежней формулировки; вслед за этим ту же поправку тихо отменили и для Армении с Азербайджаном. С
    1990 года 14 апреля отмечается как День грузинского языка.


    В 1983 году скульпторы Элгуджа Амашукели и Нодар Мгалоблишвили поставили здесь высокий бронзовый памятник
    «Дедаэна», то есть «Родной язык».


    Сегодня у парка ритм помоложе. Вдоль каменного парапета тянется аллея платанов, а за рекой на горизонте
    высится собор Цминда Самеба. Бетонный скейтпарк здесь единственный в регионе, построенный по международным
    стандартам, а с наступлением темноты наполняются кафе-бары. Прямо рядом с парком — Сухой мост, на
    блошином рынке которого продаётся любой сувенир и любой антиквариат, какой только можно вообразить.
    Название моста само по себе рассказ: до 1930-х годов под ним текла протока Мтквари, а когда она пересохла,
    каменная арка осталась висеть над пустым руслом. Табличка на его парапете, на грузинском и итальянском,
    хранит имя архитектора, Джованни Скудиери.


    Стук скейтбордов в нескольких метрах от бронзы её вовсе не оскорбляет. Именно это и защищали студенты
    1978 года: город, где молодые разговаривают, кричат и спорят по-грузински.
  tip: >-
    Парк бесплатный и открыт всегда. Рынок на Сухом мосту — дело дневное (в непогоду торговцы рано сворачиваются),
    а бары просыпаются после заката, так что день, плавно перетекающий в вечер, захватит и то и другое.
    Чтобы побыть у памятника без компании, приходите утром. Прокатного снаряжения в скейтпарке нет, берите
    свою доску. Туалеты — в кафе и барах. Маленьких детей у речного парапета держите за руку.
  route: >-
    Парк Дедаэна находится примерно в 2 км от площади Свободы, на правобережной набережной между мостом
    Бараташвили и Сухим мостом: десять минут езды. Остановка на набережной у парка ограничена, поэтому
    проще всего переехать на левый берег, припарковаться в платной зоне у Саарбрюккенской площади (приложение
    Tbilisi Parking) и вернуться пешком через реку. Если едете вечером в бары, оставьте машину у гостиницы:
    такси в Тбилиси дешёвое, а движение по набережной после темноты медленное. Асфальт на всём пути, машины
    эконом-класса вполне достаточно.
fa:
  name: پارک دداینا
  short: >-
    پارکی کنار رود که گرجی‌ها در ۱۹۷۸ در آن از زبانشان دفاع کردند: یادمانی مفرغی، یک اسکیت‌پارک و بازار
    کهنه‌فروشان پل خشک در همسایگی.
  body: >-
    **در ۱۴ آوریل ۱۹۷۸ این تکه از کرانهٔ راست متکواری از آنِ مردمی بود که حاضر نبودند زبانشان را واگذارند،
    و مسکو، این بار، کوتاه آمد.**


    قرار بود قانون اساسی تازهٔ گرجستان شوروی بندی را کنار بگذارد که گرجی را تنها زبان رسمی جمهوری می‌شناخت.
    هزاران نفر، بیشترشان دانشجو، به خیابان آمدند و گردهمایی بزرگی درست همین‌جا برپا شد. ادوارد شواردنادزه،
    رهبر حزب کمونیست، با مسکو مذاکره کرد و اجازه گرفت که متن پیشین بماند؛ پس از آن همان تغییر برای ارمنستان
    و آذربایجان هم بی‌سروصدا کنار گذاشته شد. از ۱۹۹۰، روز ۱۴ آوریل روز زبان گرجی است.


    در ۱۹۸۳ پیکرتراشان الگوجا اماشوکلی و نودار مگالوبلیشویلی یادمان بلند مفرغیِ «دِدا اِنا»، یعنی «زبان
    مادری»، را این‌جا برپا کردند.


    امروز پارک ضرباهنگی جوان‌تر دارد. گردشگاهی از درختان چنار در امتداد جان‌پناه سنگی کشیده شده و آن سوی
    رود کلیسای جامع سامه‌با (تثلیث مقدس) بر خط آسمان پیداست. اسکیت‌پارک بتنی‌اش تنها اسکیت‌پارک منطقه
    است که با استانداردهای بین‌المللی ساخته شده، و پس از تاریکی کافه‌بارها پر می‌شوند. درست کنار پارک
    پل خشک است که در بازار کهنه‌فروشانش هر سوغات و عتیقه‌ای که تصورش را بکنید پیدا می‌شود. نام پل خودش
    داستانی دارد: تا دههٔ ۱۹۳۰ شاخه‌ای از متکواری از زیرش می‌گذشت، و وقتی آن شاخه خشکید، طاق سنگی بر بستری
    خالی ماند. لوحی بر جان‌پناهش، به گرجی و ایتالیایی، نام معمارش، جووانی اسکودیری، را زنده نگه داشته
    است.


    صدای تق‌تق اسکیت‌بردها چند متر آن‌طرف‌تر از مفرغ هیچ توهینی به آن نیست. این دقیقاً همان چیزی است که
    دانشجویان ۱۹۷۸ از آن دفاع می‌کردند: شهری که جوان‌هایش به گرجی حرف می‌زنند، فریاد می‌کشند و بحث می‌کنند.
  tip: >-
    پارک رایگان است و همیشه باز. بازار پل خشک کاری روزانه است (در هوای بد فروشندگان زود بساط جمع می‌کنند)
    و بارها پس از غروب بیدار می‌شوند، پس بعدازظهری که آرام‌آرام به شب می‌رسد هر دو را در بر می‌گیرد. برای
    تماشای بی‌مزاحمِ یادمان، صبح بیایید. اسکیت‌پارک وسایل کرایه‌ای ندارد، پس تختهٔ خودتان را بیاورید.
    سرویس بهداشتی در کافه‌ها و بارهاست. با کودکان خردسال، کنار جان‌پناه رودخانه دستشان را رها نکنید.
  route: >-
    پارک دداینا حدود ۲ کیلومتر با میدان آزادی فاصله دارد، روی خیابان ساحلیِ کرانهٔ راست میان پل باراتاشویلی
    و پل خشک: ده دقیقه رانندگی. توقف در خیابان ساحلیِ کنار پارک محدود است، پس ساده‌ترین کار این است که
    به کرانهٔ چپ بروید، در جاهای پارک پولیِ منطقه‌ای اطراف میدان زاربروکن پارک کنید (اپلیکیشن Tbilisi
    Parking) و پیاده از روی رود بازگردید. اگر شب برای بارها می‌آیید، خودرو را در هتل بگذارید: تاکسی در
    تفلیس ارزان است و ترافیک خیابان ساحلی پس از تاریکی کُند. سراسر مسیر آسفالت است و خودروی اکونومی کاملاً
    کافی است.
he:
  name: פארק דדאנה
  short: >-
    הפארק שעל גדת הנהר, שבו הגנו הגאורגים על שפתם ב-1978: אנדרטת ברונזה, סקייטפארק ושוק הפשפשים של הגשר
    היבש בשכנות.
  body: >-
    **ב-14 באפריל 1978 השתייך קטע זה של הגדה הימנית של המטקווארי לאנשים שסירבו לוותר על שפתם, ומוסקבה,
    לשם שינוי, נסוגה.**


    חוקה חדשה לגאורגיה הסובייטית עמדה להשמיט את הסעיף שקבע את הגאורגית כשפה הרשמית היחידה של הרפובליקה.
    אלפים יצאו לרחובות, רובם סטודנטים, והפגנת ענק נערכה ממש כאן. ראש המפלגה הקומוניסטית, אדוארד שוורדנדזה,
    ניהל משא ומתן עם מוסקבה והשיג רשות להשאיר את הנוסח הקודם; בעקבות זאת בוטל בשקט אותו שינוי גם בארמניה
    ובאזרבייג'ן. מאז 1990 מציינים את 14 באפריל כיום השפה הגאורגית.


    ב-1983 הקימו כאן הפסלים אלגוג'ה אמשוקלי ונודר מגלובלישווילי את אנדרטת הברונזה הגבוהה "דדה אנה", כלומר
    "שפת האם".


    היום הפארק חי בקצב צעיר יותר. טיילת של עצי דולב נמשכת לאורך מעקה האבן, ומעבר לנהר נראית על קו הרקיע
    קתדרלת השילוש הקדוש (סאמבה). הסקייטפארק מבטון הוא היחיד באזור שנבנה לפי תקנים בינלאומיים, ואחרי רדת
    החשכה מתמלאים בתי הקפה והברים. ממש ליד הפארק נמצא הגשר היבש, ששוק הפשפשים שלו מוכר כל מזכרת וכל עתיקה
    שאפשר להעלות על הדעת. שמו של הגשר מספר סיפור משלו: עד שנות ה-30 של המאה ה-20 זרמה מתחתיו זרוע של המטקווארי,
    וכשהזרוע יבשה, נותרה קשת האבן נטויה מעל ערוץ ריק. לוח על המעקה שלו, בגאורגית ובאיטלקית, מנציח את האדריכל,
    ג'ובאני סקודיירי.


    נקישות הסקייטבורדים במרחק מטרים ספורים מן הברונזה אינן עלבון לה. זה בדיוק מה שהסטודנטים של 1978 הגנו
    עליו: עיר שבה הצעירים מדברים, צועקים ומתווכחים בגאורגית.
  tip: >-
    הפארק פתוח תמיד והכניסה חינם. שוק הגשר היבש הוא עניין של שעות היום (בימי מזג אוויר רע הסוחרים מתקפלים
    מוקדם), והברים מתעוררים אחרי השקיעה, כך שאחר צהריים שגולש לערב תופס את שניהם. כדי להיות לבד עם האנדרטה,
    בואו בבוקר. בסקייטפארק אין השכרת ציוד, אז הביאו סקייטבורד משלכם. שירותים יש בבתי הקפה ובברים. עם ילדים
    קטנים, החזיקו אותם ביד לאורך מעקה הנהר.
  route: >-
    פארק דדאנה נמצא כ-2 ק"מ מכיכר החירות, על טיילת הגדה הימנית בין גשר בראטאשווילי לגשר היבש: עשר דקות
    נסיעה. העצירה על הטיילת ליד הפארק מוגבלת, ולכן הפתרון הפשוט הוא לחצות לגדה השמאלית, לחנות בחניה האזורית
    בתשלום סביב כיכר זארבריקן (אפליקציית Tbilisi Parking) ולחזור ברגל מעל הנהר. אם אתם באים בערב בשביל
    הברים, השאירו את הרכב במלון: מוניות בטביליסי זולות, והתנועה על הטיילת איטית אחרי החשכה. אספלט לכל
    אורך הדרך; רכב חסכוני מספיק ויותר.
ar:
  name: حديقة ديداينا
  short: >-
    الحديقة النهرية التي دافع فيها الجورجيون عن لغتهم عام 1978: نصب برونزي، وحديقة تزلج، وسوق الجسر الجاف
    للأغراض المستعملة بجوارها.
  body: >-
    **في 14 أبريل 1978 كان هذا المقطع من الضفة اليمنى لنهر متكفاري ملكاً لأناس رفضوا التخلي عن لغتهم،
    وتراجعت موسكو، على غير عادتها.**


    كان دستور جديد لجورجيا السوفييتية على وشك أن يُسقط المادة التي جعلت الجورجية اللغة الرسمية الوحيدة
    للجمهورية. فخرج الآلاف، معظمهم من الطلاب، وأُقيم تجمع حاشد هنا بالذات. وتفاوض زعيم الحزب الشيوعي،
    إدوارد شيفاردنادزه، مع موسكو ونال الإذن بالإبقاء على الصيغة القديمة؛ ثم أُسقط التعديل نفسه بهدوء في
    أرمينيا وأذربيجان أيضاً. ومنذ عام 1990 يُحتفل بيوم 14 أبريل يوماً للغة الجورجية.


    وفي عام 1983 أقام النحاتان إلغوجا أماشوكيلي ونودار مغالوبليشفيلي هنا نصبَ "ديدا إينا" البرونزيَّ الشاهق،
    ومعناه "اللغة الأم".


    أما اليوم فللحديقة إيقاع أكثر شباباً. يمتد ممشى من أشجار الدُّلب على طول الحاجز الحجري، وعلى الأفق
    عبر النهر تبدو كاتدرائية ساميبا (الثالوث المقدس). وحديقة التزلج الخرسانية هي الوحيدة في المنطقة المبنية
    وفق المعايير الدولية، وبعد حلول الظلام تمتلئ المقاهي والحانات. وبجوار الحديقة مباشرة يقع الجسر الجاف،
    حيث يبيع سوق الأغراض المستعملة كل تذكار وكل تحفة قديمة يمكن تخيلها. واسم الجسر حكاية في ذاته: فحتى
    ثلاثينيات القرن العشرين كان فرع من نهر متكفاري يجري تحته، ولما جفّ ذلك الفرع بقي القوس الحجري ممدوداً
    فوق مجرى فارغ. ولوحة على حاجزه، بالجورجية والإيطالية، تحفظ اسم مهندسه جوفاني سكوديري.


    ليس في قرقعة ألواح التزلج على بعد أمتار من البرونز أي إهانة له. فهذا بالضبط ما كان يدافع عنه طلاب
    1978: مدينة يتحدث فيها الشباب ويصرخون ويتجادلون بالجورجية.
  tip: >-
    الحديقة مجانية ومفتوحة دائماً. سوق الجسر الجاف شأن نهاري (يلمّ الباعة بضاعتهم مبكراً إذا ساء الطقس)،
    والحانات تستيقظ بعد الغروب، فعصرٌ ينساب إلى المساء يجمع لك الاثنين. ولتنفرد بالنصب تعالَ صباحاً. لا
    تأجير للمعدات في حديقة التزلج، فأحضر لوحك. دورات المياه في المقاهي والحانات. ومع الأطفال الصغار أمسك
    بأيديهم على طول حاجز النهر.
  route: >-
    تقع حديقة ديداينا على بعد نحو 2 كم من ساحة الحرية، على كورنيش الضفة اليمنى بين جسر باراتاشفيلي والجسر
    الجاف: عشر دقائق بالسيارة. التوقف على الكورنيش بجوار الحديقة مقيّد، لذا فأسهل حل أن تعبر إلى الضفة
    اليسرى، وتركن في مواقف المنطقة المدفوعة حول ساحة زاربروكن (تطبيق Tbilisi Parking)، ثم تعود مشياً عبر
    النهر. وإن جئت مساءً من أجل الحانات فاترك السيارة في الفندق: سيارات الأجرة في تبليسي رخيصة، والسير
    على الكورنيش بطيء بعد الظلام. الطريق مسفلت كله، وتكفي السيارة الاقتصادية تماماً.
