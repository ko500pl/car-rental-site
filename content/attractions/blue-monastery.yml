ka:
  name: ლურჯი მონასტერი
  short: >-
    1180-იანი წლების ტაძარი, რომელსაც სახელი ოდესღაც ლურჯად მოჭიქულმა კრამიტმა დაარქვა — ვერის სახლებს
    შორის, რუსთაველიდან რამდენიმე წუთში.
  body: >-
    **თამარის დროინდელი თბილისი თითქმის აღარ არსებობს — მაგრამ მისი ერთი ნატეხი ჯერ კიდევ დგას ვერის კორპუსებს
    შორის.** ანდრია პირველწოდებულის ეკლესია 1180-იან წლებში, თამარის მეფობის დასაწყისში, ჯვარ-გუმბათოვან
    ტაძრად აშენდა. სახურავი ოდესღაც ლურჯი მოჭიქული კრამიტით ყოფილა დაფარული; მისი ნატეხები დღემდეა შემორჩენილი,
    ფერმა კი მონასტერს სახელიც დაარქვა — ლურჯი.


    ცოტა შენობა თუ ატარებს ქალაქის ისტორიას ასე აშკარად. საუკუნეების მანძილზე დაზიანებული ტაძარი XVII
    საუკუნეში უგუმბათო, სამნავიან ბაზილიკად გადააკეთეს. 1873 წელს, რუსეთის მმართველობისას, მას ქართული
    ხუროთმოძღვრებისთვის სრულიად უცხო მრგვალი გუმბათი დაადგეს, 1898–1901 წლებში კი, როცა კავკასიას თავადი
    გრიგორი გოლიცინი განაგებდა, გვერდით იოანე ღვთისმეტყველის წითელაგურიანი რუსული ეკლესია აღიმართა — სწორედ
    მას ამჩნევს სტუმარი პირველად. საბჭოთა ხელისუფლება ძველ ტაძარს ხან ფაბრიკად იყენებდა, ხან საწყობად,
    ხანაც საქართველოს მედიცინის მუზეუმად. 1990 წელს იგი ეკლესიას დაუბრუნდა, 1995 წელს კი უცხო გუმბათი
    ქართული კონუსური გუმბათით შეიცვალა.


    XII საუკუნის ტაძრიდან მხოლოდ ფრაგმენტებია შემორჩენილი — უპირველესად აფსიდი ორნამენტული სარკმლებით
    და ძველი კედლების მონაკვეთები. კარგად დააკვირდით და დაინახავთ, სად გადადის ძველი წყობა გვიანდელ აღდგენაში:
    შენობა ეტრატს ჰგავს, რომელიც არაერთხელ გადაფხიკეს და ხელახლა გადაწერეს.


    ეზო პატარა და ჩრდილიანია, რუსთაველის გუგუნი კი, ხუთიოდე წუთის სავალზე რომაა, აქამდე თითქოს ვერ აღწევს.
    მოდით შუადღისას, როცა ეზო თითქმის ცარიელია, და შეიძლება რვა საუკუნე მხოლოდ თქვენთვის დარჩეს.
  tip: >-
    ეს მოქმედი ეკლესიაა და არა მუზეუმი. შესვლა უფასოა; ქალები თავს იბურავენ, მამაკაცებს გრძელი შარვალი
    აცვიათ, მხრები კი ყველას დაფარული უნდა ჰქონდეს — თავსაფრები, როგორც წესი, კართან აწყვია. წირვა დილით
    და საღამოს აღევლინება: ამ დროს ნუ გადაიღებთ და ხმადაბლა ილაპარაკეთ. ყველაზე მშვიდი დრო შუადღეა. ეკლესიასთან
    საყიდელი არაფერია, მაგრამ ვერის კაფეები და საცხობები ორიოდე ქუჩაშია, გასეირნება კი თავისთავად გრძელდება
    — რუსთაველისკენ ან ვერის ძველ ქუჩებში.
  route: >-
    ეკლესია ვერაშია, ვერის ბაღის თავზე — თავისუფლების მოედნიდან გზით დაახლოებით 3 კმ: რუსთაველის გამზირიდან
    თავისუფალ გზაზე მანქანით ხუთიოდე წუთი, ფეხით — ათი. ბოლო მონაკვეთი მანქანით მოუხერხებელია: ვერის ვიწრო,
    ცალმხრივი ქუჩები ერთმანეთში იხლართება და ნავიგატორი ზოგჯერ შემოვლით გატარებთ. მანქანა კიაჩელის ან
    ნიკოლაძის ქუჩაზე, ფასიან ზონაში დატოვეთ, სადაც ადგილს იპოვით, და ბოლო ასიოდე მეტრი ფეხით გაიარეთ.
    ეკონომ-კლასის მანქანა საკმარისზე მეტია — თუმცა, თუ ცენტრში ხართ გაჩერებული, გულახდილად გეტყვით: ფეხით
    წამოდით.
en:
  name: Blue Monastery (Lurji Monastery)
  short: >-
    A church of the 1180s, named for its long-lost blue-glazed roof tiles, standing quietly among the
    houses of Vera a few minutes from Rustaveli.
  body: >-
    **Queen Tamar's Tbilisi has all but vanished, yet one piece of it still stands among the apartment
    blocks of Vera.** The church of St Andrew the First-Called was built in the 1180s, early in Tamar's
    reign, as a domed cross-in-square church. Its roof was once covered with glazed blue tiles; fragments
    of them survive, and the colour gave the monastery its name: Lurji, "blue".


    Few buildings wear the city's history so openly. Damaged over the centuries, the church was rebuilt
    in the 17th century as a domeless, three-nave basilica. In 1873, under Russian rule, it was crowned
    with a round dome quite foreign to Georgian architecture, and in 1898–1901, while Prince Grigory Golitsyn
    governed the Caucasus, the red-brick Russian church of St John the Theologian rose beside it. That
    is the building most visitors notice first. Soviet power used the old church by turns as a factory,
    a warehouse and the Museum of Georgian Medicine. It went back to the Church in 1990, and in 1995 the
    alien dome gave way to a Georgian conical one.


    Of the 12th-century church only fragments remain, above all the apse with its ornamental windows and
    stretches of the old walls. Look closely and you can see where the old masonry gives way to later
    rebuilding: the building reads like a parchment scraped clean and written over again and again.


    The courtyard is small and shaded, and the roar of Rustaveli, five minutes away, somehow never reaches
    it. Come at midday, when it is almost empty, and you may have eight centuries to yourself.
  tip: >-
    This is a working church, not a museum. Entry is free; women cover their heads, men wear long trousers,
    and shoulders stay covered. Scarves are usually left by the door for anyone who needs one. Services
    are held in the morning and evening: don't photograph during them, and keep your voice low. Midday
    is the quietest time. There is nothing to buy at the church itself, but Vera's cafés and bakeries
    are a couple of streets away, and the walk carries on naturally down to Rustaveli Avenue or up into
    Vera's old streets.
  route: >-
    The church stands in Vera, just above Vera Park, about 3 km by road from Freedom Square: five minutes'
    drive from Rustaveli Avenue in light traffic, or a ten-minute walk. The last stretch is fiddly by
    car. Vera's narrow one-way streets knot into one another, and the satnav sometimes sends you the long
    way round. Leave the car in the paid zone on Kiacheli or Nikoladze Street, wherever a space appears,
    and walk the final hundred metres. An economy car is more than enough, and if you are staying in the
    centre, honestly, walk.
ru:
  name: Голубой монастырь (Лурджи)
  short: >-
    Храм 1180-х годов, названный по давно утраченной голубой глазурованной черепице, тихо стоит среди
    домов Веры в нескольких минутах от Руставели.
  body: >-
    **Тбилиси царицы Тамар почти исчез, но один его осколок до сих пор стоит среди многоэтажек Веры.**
    Церковь святого Андрея Первозванного построили в 1180-х годах, в начале правления Тамар, как крестово-купольный
    храм. Когда-то её кровлю покрывала глазурованная голубая черепица; её фрагменты сохранились, а цвет
    дал монастырю имя: «лурджи» по-грузински значит «голубой».


    Мало какое здание так открыто носит на себе историю города. За века храм не раз страдал, и в XVII
    веке его перестроили в бескупольную трёхнефную базилику. В 1873 году, уже под российской властью,
    его увенчали круглым куполом, совершенно чуждым грузинской архитектуре, а в 1898–1901 годах, когда
    Кавказом управлял князь Григорий Голицын, рядом выросла краснокирпичная русская церковь Иоанна Богослова.
    Именно её большинство приезжих замечает первой. Советская власть превращала старый храм то в фабрику,
    то в склад, то в Музей грузинской медицины. В 1990 году его вернули Церкви, а в 1995-м чужой купол
    уступил место грузинскому коническому.


    От храма XII века остались лишь фрагменты, прежде всего апсида с орнаментированными окнами и участки
    древних стен. Присмотритесь, и вы увидите, где старая кладка переходит в позднейшие перестройки: здание
    читается как палимпсест, пергамент, который снова и снова соскабливали и исписывали заново.


    Дворик маленький и тенистый, и гул Руставели, до которого пять минут, сюда почему-то не долетает.
    Приходите в полдень, когда здесь почти пусто, и восемь веков, возможно, достанутся вам одному.
  tip: >-
    Это действующий храм, а не музей. Вход свободный; женщины покрывают голову, мужчины приходят в длинных
    брюках, плечи закрыты у всех. У двери обычно лежат платки для тех, кому они нужны. Службы идут утром
    и вечером: во время них не фотографируйте и говорите вполголоса. Тише всего в полдень. При самой церкви
    купить нечего, но кафе и пекарни Веры в паре улиц отсюда, а прогулка сама собой продолжается вниз,
    к проспекту Руставели, или вверх, в старые улочки Веры.
  route: >-
    Церковь стоит в районе Вера, прямо над парком Вера, примерно в 3 км по дороге от площади Свободы:
    пять минут езды от проспекта Руставели, если нет пробок, или десять минут пешком. Последний отрезок
    на машине муторный. Узкие улицы Веры с односторонним движением сплетаются в узлы, и навигатор порой
    ведёт в объезд. Оставьте машину в платной зоне на улице Киачели или Николадзе, где найдётся место,
    и пройдите последние сто метров пешком. Машины эконом-класса более чем достаточно, а если вы живёте
    в центре, честное слово, идите пешком.
fa:
  name: صومعهٔ آبی (لورجی)
  short: >-
    کلیسایی از دههٔ ۱۱۸۰ که نامش را از کاشی‌های لعابی آبیِ دیرزمانی ازدست‌رفته‌اش گرفته و آرام میان خانه‌های
    محلهٔ ورا، در چند دقیقه‌ای روستاولی، ایستاده است.
  body: >-
    **تفلیسِ روزگار ملکه تامار تقریباً یکسره از میان رفته، اما تکه‌ای از آن هنوز میان آپارتمان‌های محلهٔ
    ورا ایستاده است.** کلیسای قدیس آندریاس، «نخستین فراخوانده»، در دههٔ ۱۱۸۰، در آغاز پادشاهی تامار، به
    شکل کلیسایی گنبددار با نقشهٔ صلیبِ محاط در مربع ساخته شد. بامش روزگاری با کاشی‌های لعابی آبی پوشیده
    بود؛ تکه‌هایی از آن کاشی‌ها به جا مانده و همین رنگ نام صومعه را ساخته است: «لورجی» در گرجی یعنی «آبی».


    کمتر بنایی تاریخ شهر را این‌چنین آشکارا بر تن دارد. کلیسا در طول قرن‌ها آسیب دید و در سدهٔ هفدهم به
    شکل باسیلیکایی سه‌شبستانی و بی‌گنبد بازسازی شد. در ۱۸۷۳، در دوران حکومت روسیه، گنبدی گرد بر آن نشاندند
    که با معماری گرجی هیچ نسبتی نداشت، و در سال‌های ۱۸۹۸–۱۹۰۱، زمانی که شاهزاده گریگوری گالیتسین بر قفقاز
    فرمان می‌راند، کلیسای روسیِ قدیس یوحنای الهی‌دان، از آجر سرخ، در کنارش سر برآورد. بیشتر بازدیدکنندگان
    اول همین بنا را می‌بینند. حکومت شوروی کلیسای کهن را به نوبت کارخانه، انبار و موزهٔ پزشکی گرجستان کرد.
    در ۱۹۹۰ بنا به کلیسا بازگشت و در ۱۹۹۵ آن گنبد بیگانه جای خود را به گنبدی مخروطی و گرجی داد.


    از کلیسای سدهٔ دوازدهم تنها پاره‌هایی مانده است، بیش از همه آپسید با پنجره‌های تزئینی‌اش و بخش‌هایی
    از دیوارهای کهن. با دقت نگاه کنید تا ببینید سنگ‌چینِ کهن کجا جای خود را به بازسازی‌های بعدی می‌دهد:
    بنا مثل پوست‌نوشته‌ای است که بارها تراشیده و از نو بر آن نوشته‌اند.


    حیاط کوچک و سایه‌دار است و غرش خیابان روستاولی، که تنها پنج دقیقه فاصله دارد، به‌طرز عجیبی به آن نمی‌رسد.
    ظهر بیایید که حیاط تقریباً خالی است؛ شاید هشت قرن را تنها برای خودتان داشته باشید.
  tip: >-
    این‌جا کلیسایی فعال است، نه موزه. ورود رایگان است؛ زنان سر خود را می‌پوشانند، مردان شلوار بلند می‌پوشند
    و شانه‌ها برای همه پوشیده می‌ماند. معمولاً کنار در روسری‌هایی برای کسانی که لازم دارند گذاشته‌اند.
    مراسم دعا صبح و عصر برگزار می‌شود: در این اوقات عکس نگیرید و آهسته صحبت کنید. ظهر آرام‌ترین وقت است.
    در خود کلیسا چیزی برای خرید نیست، اما کافه‌ها و نانوایی‌های ورا دو خیابان آن‌طرف‌ترند و پیاده‌روی
    به‌طور طبیعی به پایین، تا خیابان روستاولی، یا به بالا، به کوچه‌های قدیمی ورا ادامه پیدا می‌کند.
  route: >-
    کلیسا در محلهٔ ورا، درست بالای پارک ورا، و حدود ۳ کیلومتر از میدان آزادی (از راه خودرو) قرار دارد:
    در ترافیک سبک پنج دقیقه رانندگی از خیابان روستاولی، یا ده دقیقه پیاده. تکهٔ آخر با خودرو دردسر دارد.
    خیابان‌های باریک و یک‌طرفهٔ ورا در هم گره می‌خورند و مسیریاب گاهی شما را از راه دور می‌برد. خودرو
    را هر جا جایی پیدا شد، در منطقهٔ پارک پولیِ خیابان کیاچلی یا نیکولادزه بگذارید و صد متر آخر را پیاده
    بروید. یک خودروی اکونومی بیش از کافی است، و اگر در مرکز شهر اقامت دارید، راستش را بخواهید، پیاده بروید.
he:
  name: המנזר הכחול (לורג'י)
  short: >-
    כנסייה משנות ה-80 של המאה ה-12, שנקראה על שם הרעפים המזוגגים הכחולים שאבדו מזמן, עומדת בשקט בין בתי
    שכונת ורה, דקות ספורות משדרת רוסתוולי.
  body: >-
    **טביליסי של המלכה תמר כמעט נעלמה, אבל פיסה אחת ממנה עדיין עומדת בין בנייני הדירות של שכונת ורה.**
    כנסיית אנדראס הקדוש, "הנקרא ראשון", נבנתה בשנות ה-80 של המאה ה-12, בתחילת מלכותה של תמר, ככנסיית כיפה
    בתכנית של צלב בתוך ריבוע. גגה היה מכוסה פעם ברעפים מזוגגים בצבע כחול; שברים מהם שרדו, והצבע הוא שנתן
    למנזר את שמו: "לורג'י" בגאורגית פירושו "כחול".


    מעט בניינים נושאים את תולדות העיר בגלוי כל כך. הכנסייה ניזוקה במרוצת הדורות, ובמאה ה-17 נבנתה מחדש
    כבזיליקה בת שלוש ספינות, ללא כיפה. ב-1873, תחת השלטון הרוסי, הוצבה עליה כיפה עגולה, זרה לחלוטין לאדריכלות
    הגאורגית, ובשנים 1898–1901, כשהנסיך גריגורי גוליצין משל בקווקז, קמה לצדה כנסיית יוחנן התאולוג הרוסית,
    בנויה לבנים אדומות. זה הבניין שרוב המבקרים מבחינים בו ראשון. השלטון הסובייטי השתמש בכנסייה העתיקה
    לסירוגין כמפעל, כמחסן וכמוזיאון לרפואה הגאורגית. ב-1990 היא הוחזרה לכנסייה, וב-1995 פינתה הכיפה הזרה
    את מקומה לכיפה חרוטית גאורגית.


    מן הכנסייה של המאה ה-12 נותרו רק שרידים, ובראשם האפסיס עם חלונותיו המעוטרים וקטעים מן הקירות הקדומים.
    הביטו מקרוב ותראו היכן הבנייה העתיקה מפנה את מקומה לשיפוצים מאוחרים יותר: הבניין נקרא כמו פלימפססט,
    קלף שנמחק ונכתב מחדש שוב ושוב.


    החצר קטנה ומוצלת, ושאון שדרת רוסתוולי, במרחק חמש דקות, איכשהו אינו מגיע אליה. בואו בצהריים, כשהיא
    כמעט ריקה, ואולי יהיו שמונה מאות שנה רק שלכם.
  tip: >-
    זו כנסייה פעילה, לא מוזיאון. הכניסה חינם; נשים מכסות את ראשן, גברים לובשים מכנסיים ארוכים, והכתפיים
    מכוסות אצל כולם. ליד הדלת מונחות בדרך כלל מטפחות למי שצריך. התפילות מתקיימות בבוקר ובערב: אל תצלמו
    בזמנן ודברו בשקט. הצהריים הם השעה השקטה ביותר. בכנסייה עצמה אין מה לקנות, אבל בתי הקפה והמאפיות של
    ורה נמצאים במרחק רחוב או שניים, וההליכה נמשכת מאליה במורד, אל שדרת רוסתוולי, או במעלה, אל הרחובות
    הישנים של ורה.
  route: >-
    הכנסייה נמצאת בשכונת ורה, ממש מעל פארק ורה, כ-3 ק"מ בכביש מכיכר החירות: חמש דקות נסיעה משדרת רוסתוולי
    כשהתנועה דלילה, או עשר דקות הליכה. הקטע האחרון ברכב מסורבל. הרחובות הצרים והחד-סטריים של ורה מסתבכים
    זה בזה, והניווט שולח לפעמים בדרך עוקפת. השאירו את הרכב באזור החניה בתשלום ברחוב קיאצ'לי או ברחוב ניקולדזה,
    היכן שיתפנה מקום, ולכו ברגל את מאת המטרים האחרונים. רכב חסכוני מספיק בהחלט, ואם אתם לנים במרכז, בכנות,
    לכו ברגל.
ar:
  name: الدير الأزرق (لورجي)
  short: >-
    كنيسة من ثمانينيات القرن الثاني عشر، سُمّيت بقرميدها الأزرق المزجج الذي ضاع منذ زمن بعيد، تقف بهدوء
    بين بيوت حي فيرا على بعد دقائق من روستافيلي.
  body: >-
    **لم يبقَ من تبليسي الملكة تامار شيء يُذكر، لكن قطعة منها ما زالت قائمة بين العمارات السكنية في حي
    فيرا.** بُنيت كنيسة القديس أندراوس، "المدعو أولاً"، في ثمانينيات القرن الثاني عشر، في مطلع عهد تامار،
    كنيسةً ذات قبة على مخطط الصليب المندرج في مربع. وكان سقفها مكسواً يوماً بقرميد مزجج أزرق اللون؛ وقد
    بقيت منه شظايا، ومن هذا اللون أخذ الدير اسمه: "لورجي" تعني بالجورجية "أزرق".


    قليلة هي المباني التي تحمل تاريخ المدينة على هذا النحو المكشوف. تضررت الكنيسة على مر القرون، فأُعيد
    بناؤها في القرن السابع عشر بازيليكا بلا قبة ذات ثلاثة أروقة. وفي عام 1873، تحت الحكم الروسي، تُوّجت
    بقبة مستديرة غريبة تماماً عن العمارة الجورجية، وفي الأعوام 1898–1901، حين كان الأمير غريغوري غوليتسين
    يحكم القوقاز، ارتفعت إلى جوارها كنيسة القديس يوحنا اللاهوتي الروسية المبنية بالآجر الأحمر. وهي المبنى
    الذي يلحظه معظم الزوار أولاً. أما السلطة السوفييتية فاستعملت الكنيسة القديمة مرة مصنعاً ومرة مستودعاً
    ومرة متحفاً للطب الجورجي. وفي عام 1990 أُعيدت إلى الكنيسة، وفي 1995 أخلت القبة الدخيلة مكانها لقبة
    جورجية مخروطية.


    لم يبقَ من كنيسة القرن الثاني عشر سوى أجزاء، أبرزها الحنية بنوافذها المزخرفة وامتدادات من الجدران
    القديمة. أمعن النظر وسترى أين يسلّم البناء القديم مكانه لإعادات البناء اللاحقة: المبنى يُقرأ كرَقٍّ
    كُشط وكُتب عليه من جديد مرة بعد مرة.


    الفناء صغير ظليل، وهدير جادة روستافيلي، على بعد خمس دقائق، لا يبلغه لسبب ما. تعالَ عند الظهيرة حين
    يكاد يخلو، وقد تنفرد بثمانية قرون وحدك.
  tip: >-
    هذه كنيسة تُقام فيها الصلوات، لا متحف. الدخول مجاني؛ تغطي النساء رؤوسهن، ويرتدي الرجال سراويل طويلة،
    وتبقى الأكتاف مغطاة للجميع. وعادةً تُترك أوشحة عند الباب لمن يحتاج إليها. تُقام الصلوات صباحاً ومساءً:
    لا تصوّر أثناءها واخفض صوتك. أهدأ الأوقات منتصف النهار. لا شيء يُشترى عند الكنيسة نفسها، لكن مقاهي
    فيرا ومخابزها على بعد شارع أو اثنين، وتتواصل النزهة من تلقاء نفسها نزولاً إلى جادة روستافيلي أو صعوداً
    إلى شوارع فيرا القديمة.
  route: >-
    تقوم الكنيسة في حي فيرا، فوق حديقة فيرا مباشرة، على بعد نحو 3 كم بالطريق من ساحة الحرية: خمس دقائق
    بالسيارة من جادة روستافيلي حين تكون الحركة خفيفة، أو عشر دقائق مشياً. المقطع الأخير بالسيارة مزعج.
    فشوارع فيرا الضيقة ذات الاتجاه الواحد تتعقد بعضها في بعض، وقد يأخذك الملاح أحياناً في طريق التفافي
    طويل. اترك السيارة في منطقة الوقوف المدفوع في شارع كياتشيلي أو نيكولادزه حيثما وجدت مكاناً، وامشِ
    المئة متر الأخيرة. السيارة الاقتصادية أكثر من كافية، وإن كنت تقيم في وسط المدينة فالمشي، بصراحة، هو
    الخيار الأفضل.
