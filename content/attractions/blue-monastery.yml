ka:
  name: ლურჯი მონასტერი
  short: XII საუკუნის ანდრია პირველწოდებულის ტაძარი ვერის ბაღთან — თბილისის ერთ-ერთი უძველესი შემორჩენილი
    ეკლესია.
  body: >-
    **თბილისში თამარ მეფის ეპოქის ნაგებობა ცოტაა — ერთ-ერთი კი ვერის საცხოვრებელ კორპუსებს შორისაა ჩამალული.**
    ლურჯი მონასტერი 1180-იან წლებში აშენდა, თამარის მეფობისას, და ანდრია პირველწოდებულის სახელს ატარებს.
    სახელი მოჭიქული ლურჯი კრამიტისგან მოდის, რომლითაც სახურავი იყო დაფარული — მისი ფრაგმენტები დღემდე
    შემორჩა.


    შენობის ბიოგრაფია მთელი ქალაქის ისტორიაა მინიატურაში: XVII საუკუნეში დაზიანებული ტაძარი უგუმბათო ბაზილიკად
    გადააშენეს; 1873 წელს რუსულმა ადმინისტრაციამ ქართული ხუროთმოძღვრებისთვის უცხო მრგვალი გუმბათი დაადგა;
    გვერდით 1898–1901 წლებში იოანე ღვთისმეტყველის წითელაგურიანი რუსული ეკლესია აშენდა, რომელსაც შორიდან
    პირველად ამჩნევ. საბჭოთა პერიოდში შენობა საწყობად და მედიცინის მუზეუმადაც კი გამოიყენებოდა; 1990 წელს
    ეკლესიას დაუბრუნდა, 1995-ში კი გუმბათი ისევ ქართული კონუსური ფორმით შეიცვალა.


    სანახავი ნახევარ საათში ეტევა: ძველი ქვის კედლები, ჩუქურთმიანი ფრაგმენტები, მყუდრო ეზო ხეებით. ტურისტული
    მარშრუტებიდან ეს ადგილი ამოვარდნილია, ამიტომ აქ თბილისური სიჩუმეა — რუსთაველიდან ხუთი წუთის სავალზე.
  tip: >-
    მოქმედი ეკლესიაა და არა მუზეუმი: შესვლა უფასოა, მაგრამ ჩაცმულობის წესები მოქმედებს — ქალებისთვის თავსაბურავი,
    მამაკაცებისთვის გრძელი შარვალი; თავსაფრები შესასვლელთან დევს. წირვის დროს (დილით და საღამოს) ფოტოგრაფირებას
    მოერიდე. საუკეთესო დროა შუადღე, როცა ეზო თითქმის ცარიელია. კომბინირება ადვილია ვერის უბნის კაფეებთან
    ან რუსთაველის გასეირნებასთან.
  route: >-
    მონასტერი ვერის ბაღის ზემოთაა, ნიკო ნიკოლაძის ქუჩაზე — რუსთაველის გამზირიდან მანქანით ხუთი წუთი, ფეხით
    ათი. მანქანით მისვლა ცოტა უხერხულია: ვერის ვიწრო, ცალმხრივი ქუჩები ერთმანეთში იხლართება, ნავიგატორი
    კი ზოგჯერ შემოვლით გზას გირჩევს. გააჩერე ფასიან ზონაში კიაჩელის ან ნიკოლაძის ქუჩაზე, სადაც ადგილს
    იპოვი, და ბოლო ასი მეტრი ფეხით გაიარე. ეკონომ-კლასის მანქანა საკმარისზე მეტია; გულახდილად რომ ვთქვათ,
    ცენტრში მცხოვრებთათვის ეს საერთოდ საფეხმავლო წერტილია.
en:
  name: Blue Monastery (Lurji Monastery)
  short: >-
    A 12th-century church of St Andrew hidden by Vera Park — one of the oldest buildings still standing
    in Tbilisi.
  body: >-
    **Very little in Tbilisi survives from Queen Tamar's golden age — one piece of it hides between the
    apartment blocks of Vera.** The Blue Monastery was built in the 1180s, during Tamar's reign, and is
    dedicated to St Andrew the First-Called. The name comes from the glazed blue roof tiles that once
    covered it, fragments of which survive.


    The building's biography is the city's history in miniature. In the 17th century the damaged church
    was rebuilt as a domeless basilica; in 1873 the Russian administration added a round dome alien to
    Georgian architecture; next door, in 1898–1901, rose the red-brick Russian church of St John the Theologian
    — the one you notice first from a distance. Under the Soviets the old church served as a warehouse
    and even as the Museum of Georgian Medicine; in 1990 it was returned to the Georgian Orthodox Church,
    and in 1995 the dome was replaced again with a traditional Georgian cone.


    Half an hour covers it: ancient stone walls, carved fragments, a hushed courtyard under the trees.
    The place sits outside every standard tourist route, so what you get is genuine Tbilisi quiet — five
    minutes' walk from Rustaveli Avenue.
  tip: >-
    This is a working church, not a museum: entry is free, but dress rules apply — headscarves for women,
    long trousers for men; scarves are provided at the entrance. Avoid photographing during morning and
    evening services. Midday is the quietest time, with the courtyard nearly empty. It combines easily
    with the cafés of Vera or a walk down Rustaveli.
  route: >-
    The monastery stands above Vera Park on Niko Nikoladze Street — five minutes by car from Rustaveli
    Avenue, ten on foot. Driving in is slightly awkward: Vera's narrow one-way streets tangle into each
    other and the navigator sometimes sends you the long way round. Park in the paid zone on Kiacheli
    or Nikoladze Street wherever you find a space and walk the last hundred metres. An economy car is
    more than enough; frankly, if you are staying centrally, this is a walking destination.
ru:
  name: Синий монастырь (Лурджи)
  short: Церковь святого Андрея XII века у парка Вера — одно из старейших сохранившихся зданий Тбилиси.
  body: >-
    **От золотого века царицы Тамары в Тбилиси уцелело совсем немного — один из фрагментов прячется между
    жилыми домами района Вера.** Синий монастырь построен в 1180-х годах, в правление Тамары, и освящён
    во имя апостола Андрея Первозванного. Название пошло от глазурованной синей черепицы, которой была
    покрыта крыша, — её фрагменты сохранились до сих пор.


    Биография здания — история города в миниатюре. В XVII веке повреждённый храм перестроили в бескупольную
    базилику; в 1873-м русская администрация водрузила круглый купол, чуждый грузинскому зодчеству; рядом
    в 1898–1901 годах выросла краснокирпичная русская церковь Иоанна Богослова — именно её первой замечаешь
    издалека. При Советах старый храм побывал складом и даже Музеем истории грузинской медицины; в 1990
    году его вернули Грузинской православной церкви, а в 1995-м купол снова заменили традиционным грузинским
    конусом.


    На осмотр хватает получаса: древние каменные стены, резные фрагменты, притихший двор под деревьями.
    Место выпадает из всех стандартных маршрутов, поэтому здесь настоящая тбилисская тишина — в пяти минутах
    ходьбы от проспекта Руставели.
  tip: >-
    Это действующий храм, а не музей: вход свободный, но действует дресс-код — платок для женщин, длинные
    брюки для мужчин; платки лежат у входа. Во время утренних и вечерних служб фотографировать не стоит.
    Тише всего в середине дня, когда двор почти пуст. Легко совместить с кафе района Вера или прогулкой
    по Руставели.
  route: >-
    Монастырь стоит над парком Вера, на улице Нико Николадзе — пять минут на машине от проспекта Руставели,
    десять пешком. Подъезд слегка неудобный: узкие односторонние улицы Веры путаются между собой, и навигатор
    порой ведёт в объезд. Оставьте машину в платной зоне на Киачели или Николадзе, где найдётся место,
    и пройдите последние сто метров пешком. Машины эконом-класса более чем достаточно; честно говоря,
    если вы живёте в центре, сюда проще дойти пешком.
fa:
  name: صومعهٔ آبی (لورجی)
  short: کلیسای سدهٔ دوازدهمی آندریاس قدیس کنار پارک ورا — از کهن‌ترین بناهای برجای‌ماندهٔ تفلیس.
  body: >-
    **از عصر طلایی ملکه تامار چیز چندانی در تفلیس نمانده — یکی از تکه‌هایش میان بلوک‌های مسکونی محلهٔ
    ورا پنهان است.** صومعهٔ آبی در دههٔ ۱۱۸۰ میلادی، در روزگار پادشاهی تامار، ساخته شد و به نام آندریاس
    قدیس (نخستین‌خوانده) است. نامش از سفال‌های لعاب‌دار آبی بام می‌آید که پاره‌هایی از آن هنوز باقی است.


    سرگذشت این بنا، تاریخ شهر در مقیاسی کوچک است. در سدهٔ هفدهم کلیسای آسیب‌دیده را به بازیلیکایی بی‌گنبد
    بازساختند؛ در ۱۸۷۳ حکومت روسی گنبدی گرد و بیگانه با معماری گرجی بر آن نشاند؛ و در همسایگی‌اش طی ۱۸۹۸
    تا ۱۹۰۱ کلیسای آجرقرمز روسی یوحنای الهی‌دان بالا رفت — همان که از دور اول به چشم می‌آید. در دورهٔ
    شوروی بنای کهن انبار و حتی موزهٔ تاریخ پزشکی گرجستان شد؛ در ۱۹۹۰ به کلیسای ارتدوکس گرجستان بازگشت
    و در ۱۹۹۵ گنبد دوباره با مخروط سنتی گرجی جایگزین شد.


    نیم ساعت برای دیدن کافی است: دیوارهای سنگی کهن، قطعه‌های کنده‌کاری، و حیاطی خاموش زیر درختان. اینجا
    از همهٔ مسیرهای متعارف گردشگری بیرون است؛ آنچه نصیبتان می‌شود سکوت راستین تفلیس است — پنج دقیقه پیاده
    از خیابان روستاولی.
  tip: >-
    اینجا کلیسایی فعال است، نه موزه: ورود رایگان است اما قواعد پوشش برقرار است — روسری برای زنان و شلوار
    بلند برای مردان؛ روسری کنار در هست. هنگام مراسم صبح و شام از عکاسی بپرهیزید. آرام‌ترین وقت میانهٔ
    روز است که حیاط تقریباً خالی است. به‌سادگی با کافه‌های محلهٔ ورا یا قدم زدن در روستاولی ترکیب می‌شود.
  route: >-
    صومعه بالای پارک ورا، در خیابان نیکو نیکولادزه است — با خودرو پنج دقیقه از خیابان روستاولی و پیاده
    ده دقیقه. رسیدن با ماشین کمی دست‌وپاگیر است: خیابان‌های باریک و یک‌طرفهٔ ورا در هم می‌پیچند و مسیریاب
    گاهی از راه دورتر می‌برد. خودرو را در محدودهٔ پولی خیابان کیاچلی یا نیکولادزه هر جا جا بود بگذارید
    و صد متر آخر را پیاده بروید. خودروی اقتصادی بیش از کافی است؛ راستش اگر اقامتتان مرکزی است، این مقصدی
    پیاده‌روی است.
he:
  name: המנזר הכחול (לורג'י)
  short: כנסיית אנדראס הקדוש מהמאה ה-12 ליד פארק ורה — מהמבנים העתיקים ביותר ששרדו בטביליסי.
  body: >-
    **מעט מאוד שרד בטביליסי מתור הזהב של המלכה תמר — אחד השרידים מסתתר בין בנייני המגורים של שכונת ורה.**
    המנזר הכחול נבנה בשנות ה-80 של המאה ה-12, בימי מלכותה של תמר, והוא מוקדש לאנדראס הקדוש. השם בא מרעפי
    הזיגוג הכחולים שכיסו פעם את הגג — שברים מהם שרדו עד היום.


    הביוגרפיה של הבניין היא תולדות העיר בזעיר אנפין. במאה ה-17 שוקמה הכנסייה הפגועה כבזיליקה ללא כיפה;
    ב-1873 הוסיף השלטון הרוסי כיפה עגולה זרה לאדריכלות הגאורגית; ובסמוך, בשנים 1901–1898, קמה כנסיית יוחנן
    התאולוג הרוסית מלבנים אדומות — היא זו שמבחינים בה ראשונה מרחוק. תחת הסובייטים שימשה הכנסייה העתיקה
    מחסן ואפילו מוזיאון לתולדות הרפואה הגאורגית; ב-1990 הוחזרה לכנסייה האורתודוקסית הגאורגית, וב-1995
    הוחלפה הכיפה שוב בחרוט גאורגי מסורתי.


    חצי שעה מספיקה: קירות אבן עתיקים, שברי גילוף, חצר שקטה תחת העצים. המקום נמצא מחוץ לכל מסלול תיירותי
    מקובל, ולכן מקבלים כאן שקט טביליסאי אמיתי — חמש דקות הליכה משדרת רוסתוולי.
  tip: >-
    זו כנסייה פעילה, לא מוזיאון: הכניסה חופשית אך חלים כללי לבוש — כיסוי ראש לנשים ומכנסיים ארוכים לגברים;
    מטפחות מונחות בכניסה. הימנעו מצילום בזמן תפילות הבוקר והערב. השעה השקטה ביותר היא הצהריים, כשהחצר
    כמעט ריקה. משתלב בקלות עם בתי הקפה של ורה או טיול ברוסתוולי.
  route: >-
    המנזר עומד מעל פארק ורה, ברחוב ניקו ניקולדזה — חמש דקות נסיעה משדרת רוסתוולי, עשר ברגל. ההגעה ברכב
    מעט מסורבלת: הרחובות הצרים והחד-סטריים של ורה מסתבכים זה בזה, והניווט שולח לפעמים בדרך עוקפת. חנו
    באזור בתשלום ברחוב קיאצ'לי או ניקולדזה היכן שתמצאו מקום, ולכו את מאה המטרים האחרונים ברגל. רכב חסכוני
    מספיק ויותר; למען האמת, אם אתם גרים במרכז — זה יעד הליכה.
ar:
  name: الدير الأزرق (لورجي)
  short: كنيسة القديس أندراوس من القرن الثاني عشر قرب حديقة فيرا — من أقدم المباني الباقية في تبليسي.
  body: >-
    **لم يبقَ في تبليسي من العصر الذهبي للملكة تامار إلا القليل — وإحدى قطعه تختبئ بين عمارات حي فيرا
    السكنية.** بُني الدير الأزرق في ثمانينيات القرن الثاني عشر، في عهد تامار، وهو مكرس للقديس أندراوس
    أول المدعوين. والاسم من قرميد السقف الأزرق المزجج الذي كان يغطيه، وما زالت شظايا منه باقية.


    سيرة المبنى هي تاريخ المدينة مصغراً. في القرن السابع عشر أعيد بناء الكنيسة المتضررة بازيليكا بلا قبة؛
    وفي 1873 أضافت الإدارة الروسية قبة مستديرة غريبة عن العمارة الجورجية؛ وبجوارها بين 1898 و1901 ارتفعت
    كنيسة يوحنا اللاهوتي الروسية بآجرها الأحمر — وهي التي تلحظها أولاً من بعيد. في الحقبة السوفييتية صارت
    الكنيسة القديمة مخزناً بل ومتحفاً لتاريخ الطب الجورجي؛ وفي 1990 أعيدت إلى الكنيسة الأرثوذكسية الجورجية،
    وفي 1995 استُبدلت القبة مجدداً بمخروط جورجي تقليدي.


    نصف ساعة تكفي للزيارة: جدران حجرية عتيقة، وقطع منحوتة، وفناء ساكن تحت الأشجار. المكان خارج كل المسارات
    السياحية المعتادة، فما تناله هو هدوء تبليسي الحقيقي — على بعد خمس دقائق مشياً من جادة روستافيلي.
  tip: >-
    هذه كنيسة عاملة لا متحف: الدخول مجاني لكن قواعد اللباس سارية — غطاء رأس للنساء وسروال طويل للرجال؛
    والأغطية موضوعة عند المدخل. تجنب التصوير أثناء صلوات الصباح والمساء. أهدأ وقت هو منتصف النهار حين
    يكاد الفناء يخلو. تسهل إضافتها إلى مقاهي حي فيرا أو نزهة على روستافيلي.
  route: >-
    يقوم الدير فوق حديقة فيرا في شارع نيكو نيكولادزه — خمس دقائق بالسيارة من جادة روستافيلي وعشر مشياً.
    الوصول بالسيارة فيه بعض العناء: شوارع فيرا الضيقة ذات الاتجاه الواحد تتشابك، والملاح يسلك بك أحياناً
    طريقاً التفافية. أوقف السيارة في المنطقة المدفوعة بشارع كياتشيلي أو نيكولادزه حيثما وجدت مكاناً وامشِ
    المئة متر الأخيرة. سيارة اقتصادية أكثر من كافية؛ وبصراحة، إن كان سكنك وسط المدينة فهذا مقصد يُبلغ
    سيراً على الأقدام.
