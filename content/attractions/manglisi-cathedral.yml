ka:
  name: მანგლისის საკათედრო ტაძარი
  short: >-
    ერთ-ერთი უძველესი ქრისტიანული ადგილი საქართველოში, ფიჭვნარში 1200 მეტრზე, საზაფხულო კურორტ მანგლისში.
  body: >-
    **მანგლისს ორმაგი ისტორია აქვს: ძალიან ძველი ეკლესია და ძალიან მე-19 საუკუნის კურორტი.** დაბა
    ტრიალეთის ქედზე, 1200 მეტრზე, ფიჭვნარშია და თბილისიდან საათზე ნაკლებია — რაც მას ზაფხულში დედაქალაქის
    ერთ-ერთ ყველაზე ხელმისაწვდომ გამოსასვლელად აქცევს.


    ტრადიციით ტაძარი IV საუკუნეშია დაარსებული, ქართლის გაქრისტიანებიდან მალევე, და უძველესთა შორისაა
    ქვეყანაში. თუმცა დღევანდელი ნაგებობა ძირითადად XI საუკუნისაა — გუმბათოვანი, ტეტრაკონქის გეგმით, ანუ
    ოთხივე მხარეს ნახევარწრიული აფსიდებით. XIX საუკუნეში ტაძარი მნიშვნელოვნად შეაკეთეს და ინტერიერი
    გადაათეთრეს, ამიტომ ძველი მოხატულობა თითქმის აღარაა. გარედან შემორჩენილია ორნამენტული კვეთა გუმბათის
    ყელსა და სარკმლებზე.


    დაბის მეორე ფენა რუსული იმპერიისაა. XIX საუკუნეში მანგლისში სამხედრო გარნიზონი იდგა და ოფიცრები
    ოჯახებს ზაფხულობით აქ აყვანდნენ; ჰაერი, ფიჭვი და სიგრილე რეპუტაციად იქცა. საბჭოთა პერიოდში
    დასასვენებელი სახლები დაემატა. დღეს ნაწილი მიტოვებულია, ნაწილი კვლავ მუშაობს, და ზაფხულის
    შაბათ-კვირას აქ თბილისელი ოჯახებია.


    მანგლისი ამავე დროს კვანძია: აქედან გზა დასავლეთით წალკისა და ტრიალეთის ზეგანისკენ მიდის, ჩრდილოეთით
    კი ალგეთის ხეობაში ეშვება. ამიტომ ის უფრო გრძელი დღის პირველ გაჩერებად უკეთ მუშაობს, ვიდრე ცალკე
    დანიშნულებად. კომბინაცია უცნაურია და სწორედ ეს ხდის ადგილს საინტერესოს: ათასწლოვანი ტაძარი,
    ჩამონგრეული სანატორიუმები და ფიჭვნარი ერთ დაბაზე.
  tip: >-
    საათნახევარი ტაძრისა და მოკლე სეირნობისთვის საკმარისია. ტაძარი მოქმედია, ჩაცმის წესები მოქმედებს.
    დაბაში რამდენიმე კაფე და პატარა მაღაზიაა, ზამთარში ნაწილი დაკეტილია. 1200 მეტრზე ზაფხულშიც გრილა
    საღამოს — თხელი ქურთუკი წამოიღეთ. ფიჭვნარში სასეირნო ბილიკებია, ფეხსაცმელი გამოგადგებათ. ზამთარში გზა
    თოვლდება, თუმცა ჩვეულებრივ იწმინდება.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით, კოდაზე გავლით მანგლისის გზით — 56 კმ, დაახლოებით საათი და ათი წუთი.
    გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, თუმცა ბოლო ოცი კილომეტრი მთაში აღმართზე მიდის ხშირი
    სერპანტინებით. ზამთარში ეს მონაკვეთი ყინულდება — ფრთხილად. საწვავი კოდაში აიღეთ. მანგლისში ტაძრის
    გვერდით პარკინგი უფასოა. ეკონომ-კლასის ავტომობილი წლის უმეტეს პერიოდში საკმარისია.
en:
  name: Manglisi Cathedral
  short: >-
    One of the oldest Christian sites in Georgia, standing in pine forest at 1,200 metres in the summer
    resort of Manglisi.
  body: >-
    **Manglisi carries two histories: a very old church and a very 19th-century resort.** The town sits
    on the Trialeti range at 1,200 metres among pines, less than an hour from Tbilisi, which makes it one
    of the capital's most accessible summer escapes.


    Tradition places the foundation of the cathedral in the 4th century, soon after the conversion of
    Kartli, which would put it among the earliest Christian sites in the country. The building you see,
    however, is largely 11th century: a domed church on a tetraconch plan, with semicircular apses on all
    four sides. It was substantially repaired in the 19th century and the interior whitewashed, so little
    old painting remains. Outside, ornamental carving survives on the drum and around the windows.


    The town's second layer is Russian imperial. A military garrison was stationed at Manglisi in the
    19th century and officers brought their families up for the summer; the air, the pines and the cool
    became a reputation. Soviet rest houses were added later. Some now stand abandoned, others still
    work, and on summer weekends the place fills with Tbilisi families.


    Manglisi is also a junction. The road on from here runs west to Tsalka and the Trialeti plateau and
    north down into the Algeti valley, so it works better as the first stop of a longer day than as a
    destination on its own. The combination is odd, and that is what makes Manglisi worth the drive: a
    thousand-year-old cathedral, collapsing sanatoria and pine forest sharing one small town.
  tip: >-
    An hour and a half covers the cathedral and a short walk. The church is in use and dress rules apply.
    The town has a few cafes and small shops, some closed in winter. At 1,200 metres the evenings are
    cool even in July, so bring a light jacket. There are walking paths through the pines and proper
    shoes help. In winter the road ices up, though it is normally cleared.
  route: >-
    Head southwest from Tbilisi via Koda on the Manglisi road — 56 km, about an hour and ten minutes. The
    road is asphalt throughout and in good condition, though the final twenty kilometres climb into the
    hills with frequent switchbacks. In winter this section freezes, so drive with care. Refuel in Koda.
    Parking beside the cathedral in Manglisi is free. An economy car is sufficient for most of the year.
ru:
  name: Манглисский собор
  short: >-
    Один из древнейших христианских памятников Грузии, стоящий в сосновом лесу на высоте 1200 метров в
    дачном посёлке Манглиси.
  body: >-
    **У Манглиси две истории: очень древняя церковь и очень имперский курорт.** Посёлок стоит на
    Триалетском хребте на высоте 1200 метров среди сосен, меньше часа от Тбилиси, что делает его одним из
    самых доступных летних выездов столицы.


    Предание относит основание собора к IV веку, вскоре после крещения Картли, что поставило бы его в ряд
    древнейших христианских мест страны. Однако здание, которое вы видите, в основном XI века: купольный
    храм тетраконхового плана, с полукруглыми апсидами со всех четырёх сторон. В XIX веке его существенно
    чинили, а интерьер побелили, поэтому старой росписи почти не осталось. Снаружи сохранилась
    орнаментальная резьба на барабане и вокруг окон.


    Второй слой посёлка — русский имперский. В XIX веке в Манглиси стоял военный гарнизон, офицеры
    привозили сюда семьи на лето; воздух, сосны и прохлада стали репутацией. Позже добавились советские
    дома отдыха. Часть их заброшена, часть работает, а летом по выходным здесь тбилисские семьи.


    Манглиси при этом ещё и развилка. Дорога отсюда идёт на запад к Цалке и Триалетскому плато и на север
    вниз в Алгетскую долину, поэтому посёлок лучше работает как первая остановка длинного дня, чем как
    самостоятельная цель. Сочетание странное, и именно оно оправдывает поездку: тысячелетний собор,
    оседающие санатории и сосновый лес в одном небольшом посёлке.
  tip: >-
    Полутора часов хватит на собор и короткую прогулку. Храм действующий, правила одежды действуют. В
    посёлке несколько кафе и маленькие магазины, зимой часть закрыта. На 1200 метрах вечера прохладны
    даже в июле, возьмите лёгкую куртку. По сосняку идут прогулочные тропы, пригодится нормальная обувь.
    Зимой дорога обледеневает, хотя обычно её чистят.
  route: >-
    Из Тбилиси на юго-запад через Кода по манглисской дороге — 56 км, примерно час десять. Дорога
    асфальтированная и в хорошем состоянии, но последние двадцать километров поднимаются в горы частым
    серпантином. Зимой этот участок замерзает, ведите аккуратно. Заправляйтесь в Кода. Парковка у собора
    в Манглиси бесплатная. Машины эконом-класса достаточно большую часть года.
fa:
  name: کلیسای جامع مانگلیسی
  short: >-
    یکی از کهن‌ترین مکان‌های مسیحی گرجستان، در جنگل کاج و در ارتفاع ۱۲۰۰ متری در ییلاق مانگلیسی.
  body: >-
    **مانگلیسی دو تاریخ را با هم دارد: کلیسایی بسیار کهن و ییلاقی بسیار سدهٔ نوزدهمی.** شهرک بر رشتهٔ
    تریالتی در ارتفاع ۱۲۰۰ متری میان کاج‌ها نشسته و کمتر از یک ساعت با تفلیس فاصله دارد، و همین آن را به
    یکی از دسترس‌ترین گریزگاه‌های تابستانی پایتخت بدل کرده است.


    سنت، بنیاد کلیسای جامع را به سدهٔ چهارم و اندکی پس از گرویدن کارتلی به مسیحیت نسبت می‌دهد، که آن را
    در شمار کهن‌ترین مکان‌های مسیحی کشور می‌گذارد. اما بنایی که می‌بینید عمدتاً از سدهٔ یازدهم است:
    کلیسایی گنبددار با نقشهٔ چهارمحرابی، با نیم‌دایره‌هایی در هر چهار سو. در سدهٔ نوزدهم به‌طور گسترده
    مرمت شد و درونش سفیدکاری گردید، پس نقاشی کهن اندکی مانده است. در بیرون، کنده‌کاری تزیینی بر گردن گنبد
    و گرد پنجره‌ها برجاست.


    لایهٔ دوم شهرک، روسیِ عصر امپراتوری است. در سدهٔ نوزدهم پادگانی نظامی در مانگلیسی مستقر بود و افسران
    خانواده‌هایشان را برای تابستان به اینجا می‌آوردند؛ هوا و کاج و خنکی به شهرت آن بدل شد. بعدها
    آسایشگاه‌های شوروی افزوده شد. برخی امروز متروک‌اند و برخی هنوز کار می‌کنند، و آخر هفته‌های تابستان
    اینجا از خانواده‌های تفلیسی پر می‌شود.


    مانگلیسی در ضمن یک دوراهی است. جاده از اینجا به غرب به سوی تسالکا و فلات تریالتی می‌رود و به شمال به
    درّهٔ آلگتی سرازیر می‌شود، پس بهتر است آن را نخستین توقف یک روز بلند بدانید تا مقصدی مستقل. این ترکیب
    عجیب است و همین سفر را ارزشمند می‌کند: کلیسایی هزارساله، آسایشگاه‌هایی در حال فروریختن، و جنگل کاج،
    همه در یک شهرک کوچک.
  tip: >-
    یک ساعت‌ونیم برای کلیسا و گشتی کوتاه کافی است. کلیسا فعال است و قواعد پوشش برقرار. شهرک چند کافه و
    مغازهٔ کوچک دارد که برخی در زمستان بسته‌اند. در ارتفاع ۱۲۰۰ متری عصرها حتی در تیر خنک است، پس کاپشن
    نازک همراه ببرید. میان کاج‌ها مسیرهای پیاده‌روی هست و کفش مناسب کمک می‌کند. زمستان جاده یخ می‌زند،
    هرچند معمولاً پاک‌سازی می‌شود.
  route: >-
    از تفلیس به جنوب‌غرب از کودا روی جادهٔ مانگلیسی — ۵۶ کیلومتر، حدود یک ساعت و ده دقیقه. جاده تا انتها
    آسفالت و در وضعیت خوبی است، هرچند بیست کیلومتر پایانی با پیچ‌های پیاپی به کوه بالا می‌رود. زمستان این
    بخش یخ می‌بندد، پس با احتیاط برانید. سوخت را در کودا بگیرید. پارکینگ کنار کلیسا در مانگلیسی رایگان
    است. خودروی اقتصادی در بیشتر سال کافی است.
he:
  name: קתדרלת מאנגליסי
  short: >-
    אחד האתרים הנוצריים העתיקים בגאורגיה, ביער אורנים בגובה 1,200 מטר בעיירת הנופש מאנגליסי.
  body: >-
    **למאנגליסי שתי היסטוריות: כנסייה עתיקה מאוד ואתר נופש מאוד מן המאה ה-19.** העיירה יושבת על רכס
    טריאלטי בגובה 1,200 מטר בין אורנים, פחות משעה מטביליסי, וזה הופך אותה לאחת מבריחות הקיץ הנגישות ביותר
    של הבירה.


    המסורת מייחסת את ייסוד הקתדרלה למאה ה-4, זמן קצר אחרי התנצרות קרתלי, מה שהיה מציב אותה בין האתרים
    הנוצריים המוקדמים במדינה. אך המבנה שרואים הוא ברובו מן המאה ה-11: כנסייה מכופפת בתוכנית טטרקונכית, עם
    אפסיסים חצי-עגולים בארבעת הצדדים. במאה ה-19 היא תוקנה במידה ניכרת והפנים סויד, ולכן שרד מעט ציור
    עתיק. בחוץ נותר גילוף עיטורי על התוף וסביב החלונות.


    השכבה השנייה של העיירה היא רוסית-אימפריאלית. במאה ה-19 חנה במאנגליסי חיל מצב, והקצינים הביאו לכאן את
    משפחותיהם לקיץ; האוויר, האורנים והקרירות הפכו למוניטין. אחר כך נוספו בתי הבראה סובייטיים. חלקם נטושים
    כיום, אחרים עדיין פועלים, ובסופי שבוע של קיץ מתמלא המקום במשפחות מטביליסי.


    מאנגליסי היא גם צומת. הדרך מכאן ממשיכה מערבה לצאלקה ולרמת טריאלטי וצפונה במורד אל עמק אלגטי, ולכן היא
    עובדת טוב יותר כתחנה ראשונה של יום ארוך מאשר כיעד בפני עצמו. השילוב מוזר, וזה בדיוק מה שמצדיק את
    הנסיעה: קתדרלה בת אלף שנה, בתי הבראה מתפוררים ויער אורנים בעיירה קטנה אחת.
  tip: >-
    שעה וחצי מכסה את הקתדרלה והליכה קצרה. הכנסייה פעילה וכללי לבוש חלים. בעיירה כמה בתי קפה וחנויות
    קטנות, וחלקן סגורות בחורף. בגובה 1,200 מטר הערבים קרירים גם ביולי, לכן קחו מעיל קל. בין האורנים יש
    שבילי הליכה ונעליים מתאימות עוזרות. בחורף הכביש מתקרח, אם כי בדרך כלל מפנים אותו.
  route: >-
    צאו מטביליסי דרום-מערבה דרך קודה בכביש למאנגליסי — 56 ק״מ, כשעה ועשר דקות. הכביש סלול לכל אורכו ובמצב
    טוב, אך עשרים הקילומטרים האחרונים מטפסים אל ההרים בסרפנטינות תכופות. בחורף הקטע הזה קופא, לכן סעו
    בזהירות. תדלקו בקודה. החניה ליד הקתדרלה במאנגליסי חינם. רכב חסכוני מספיק ברוב ימות השנה.
ar:
  name: كاتدرائية مانغليسي
  short: >-
    من أقدم المواقع المسيحية في جورجيا، تقوم في غابة صنوبر على ارتفاع 1200 متر في مصيف مانغليسي.
  body: >-
    **تحمل مانغليسي تاريخين: كنيسة موغلة في القدم ومصيفاً من القرن التاسع عشر بامتياز.** تجلس البلدة على
    سلسلة تريالتي على ارتفاع 1200 متر بين أشجار الصنوبر، على بعد أقل من ساعة من تبليسي، وهذا يجعلها من
    أيسر متنفسات العاصمة صيفاً.


    ينسب التقليد تأسيس الكاتدرائية إلى القرن الرابع، بُعيد تنصّر كارتلي، وهو ما يضعها بين أقدم المواقع
    المسيحية في البلاد. غير أن البناء الذي تراه يعود في معظمه إلى القرن الحادي عشر: كنيسة مقببة على مخطط
    رباعي الحنايا، بحنايا نصف دائرية في الجهات الأربع. وقد رُمّمت على نطاق واسع في القرن التاسع عشر
    وبُيّض داخلها، فلم يبقَ من التصوير القديم إلا القليل. وفي الخارج بقي نقش زخرفي على رقبة القبة وحول
    النوافذ.


    والطبقة الثانية للبلدة روسية إمبراطورية. ففي القرن التاسع عشر رابطت حامية عسكرية في مانغليسي، وكان
    الضباط يجلبون عائلاتهم إليها في الصيف؛ فصار الهواء والصنوبر والبرودة سمعةً لها. ثم أُضيفت دور استجمام
    سوفييتية. بعضها مهجور اليوم وبعضها ما زال يعمل، وفي عطلات الصيف يمتلئ المكان بعائلات من تبليسي.


    ومانغليسي كذلك مفترق. فالطريق من هنا يمضي غرباً إلى تسالكا وهضبة تريالتي، وشمالاً هابطاً إلى وادي
    ألغيتي، ولذلك تصلح محطةً أولى ليوم طويل أكثر مما تصلح مقصداً قائماً بذاته. والتركيب غريب، وهذا بالضبط
    ما يجعل الرحلة مجدية: كاتدرائية عمرها ألف سنة، ومصحّات متداعية، وغابة صنوبر، في بلدة صغيرة واحدة.
  tip: >-
    ساعة ونصف تغطي الكاتدرائية ونزهة قصيرة. الكنيسة عاملة وقواعد اللباس سارية. وفي البلدة بضعة مقاهٍ
    ومتاجر صغيرة، بعضها مغلق شتاءً. وعلى ارتفاع 1200 متر تبرد الأمسيات حتى في تموز، فخذ سترة خفيفة. وبين
    أشجار الصنوبر مسارات للمشي، والحذاء المناسب يساعد. وفي الشتاء يتجمد الطريق، وإن كان يُنظَّف عادة.
  route: >-
    اتجه جنوب غرب من تبليسي عبر كودا على طريق مانغليسي — 56 كم، نحو ساعة وعشر دقائق. الطريق معبّد بكامله
    وبحالة جيدة، غير أن العشرين كيلومتراً الأخيرة تصعد إلى التلال بمنعطفات متتابعة. وفي الشتاء يتجمد هذا
    المقطع، فقد بحذر. تزوّد بالوقود في كودا. والوقوف بجانب الكاتدرائية في مانغليسي مجاني. وسيارة اقتصادية
    تكفي في معظم أيام السنة.
