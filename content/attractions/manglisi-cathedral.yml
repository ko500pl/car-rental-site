ka:
  name: მანგლისის საკათედრო ტაძარი
  short: >-
    ადრეული შუა საუკუნეების ტაძარი ფიჭვნარში, 1200 მეტრზე: გადმოცემით IV საუკუნეში დაარსებული, XI საუკუნეში
    გადაკეთებული, ძველ საგარნიზონო კურორტზე.
  body: >-
    **მანგლისის სიონი იმ ადგილთაგანია, სადაც, მატიანეს თუ დავუჯერებთ, ქართული ქრისტიანობა დაიწყო — და
    მას შემდეგ თითქმის ყველამ, ვინც აქ გაიარა, ცოტ-ცოტა გადააკეთა.**


    ლეონტი მროველის თხრობით, IV საუკუნის 30-იან წლებში კონსტანტინე დიდმა ახლად მოქცეულ მირიან მეფესთან
    ეპისკოპოსი იოანე გამოგზავნა. მცხეთამდე მისვლამდე იოანე მანგლისში შეჩერდა, ეკლესიის შენება დაიწყო და
    აქ ქრისტეს ჯვრის ნაწილი დატოვა. სიწმინდეები აქ სამუდამოდ არ დარჩენილა: VII საუკუნეში, სპარსეთთან ომის
    დროს, ბიზანტიის იმპერატორმა ჰერაკლემ ისინი თან წაიღო.


    ტაძარი ქვაში ჩაწერილი მატიანეა. მისი ბირთვი ტეტრაკონქია — ოთხაფსიდიანი ნაგებობა, გარედან რვაწახნაგა
    მოხაზულობაში ჩასმული; მეცნიერები მას V–VII საუკუნეებით ათარიღებენ და საქართველოში ამ ტიპის უადრეს
    ნიმუშად მიიჩნევენ. XI საუკუნის დასაწყისში შენობა ძირფესვიანად გადააკეთეს: წინ წამოწიეს საკურთხევლის
    აფსიდი, მიაშენეს კარიბჭეები, დაადგეს ახალი გუმბათი და მთელი ნაგებობა ახალ, მოჩუქურთმებულ ქვის პერანგში
    ჩასვეს. დააკვირდით აღმოსავლეთ ფასადს, სადაც ორი ღრმა ნიში დიდ ჩუქურთმიან სარკმელს შუაში იქცევს, და
    წითელი კრამიტით გადახურულ თორმეტწახნაგა გუმბათს. სამხრეთ კარის თავზე ორთავიანი არწივი XIX საუკუნის
    დანამატია.


    ეს არწივი დაბის მეორე ისტორიას ეკუთვნის. 1823 წელს გენერალმა ერმოლოვმა დაცარიელებულ სოფელში პოლკი
    ჩააყენა, რომელიც მოგვიანებით ერევნის გრენადერთა პოლკის სახელით გახდა ცნობილი. 1851–1857 წლებში ტაძარი
    აღადგინეს, XIX საუკუნის ბოლოსთვის კი ტფილისელები მანგლისში ზაფხულის სიცხეს გაურბოდნენ. რესტავრაციამ
    შუა საუკუნეების მხატვრობა თითქმის მთლიანად შეიწირა — XI საუკუნის ფრესკა, ჯვრის ამაღლების კომპოზიცია,
    მხოლოდ გუმბათშია შემორჩენილი.


    გადმოცემა ხსნის, რატომ გადარჩა ტაძარი გაუკაცრიელების საუკუნეებში. ვახუშტი ბატონიშვილი წერს, რომ მაჰმადიანმა
    მომხდურებმა ის ხელუხლებლად დატოვეს, რადგან ლომზე ამხედრებული წმინდანის ფრესკა მუჰამადის გამოსახულება
    ეგონათ. სინამდვილეში ეს წმინდა მამაი კესარიელი იყო, რომელსაც ტრადიციულად ლომზე ამხედრებულს გამოსახავენ.


    ფიჭვები დღესაც აქ არის. სიგრილეც.
  tip: >-
    ტაძრისთვის ერთი საათი საკმარისია, ფიჭვნარში სეირნობასთან ერთად კი მსუბუქი ნახევარი დღე გამოვა. ტაძარი
    მოქმედია: მხრები და მუხლები დაფარული უნდა გქონდეთ, ქალებს თავსაფარი დასჭირდებათ, წირვის დროს კი სიჩუმე
    დაიცავით. გუმბათის ყელისა და აღმოსავლეთის სარკმლის ჩუქურთმისთვის ბინოკლი ან ზუმიანი ობიექტივი გამოგადგებათ.
    მანგლისში მაღაზიები და რამდენიმე კაფეა, ნაწილი არასეზონზე დაკეტილია. 1200 მეტრზე ივლისშიც გრილი საღამოებია
    — თბილი ტანსაცმელი წამოიღეთ. დიდგორის ველი, სადაც 1121 წელს დავით აღმაშენებელმა სელჩუკები დაამარცხა,
    მანგლისიდან შორს არ არის.
  route: >-
    უმოკლესი გზა Sh36-ია: თბილისიდან წყნეთისა და კოჯრის გავლით ამოდით და ვიწრო, კლაკნილ ასფალტს მანგლისამდე
    მიჰყევით. დაახლოებით 56 კილომეტრი და საათი და ათი წუთი, ბოლომდე მოასფალტებული; კოჯრის შემდეგ ბევრი
    მკვეთრი მოსახვევია, რომლებიც ზამთარში იყინება. ეკონომ-კლასის მანქანა მთელი წლის განმავლობაში გაივლის,
    ზამთარში — ზამთრის საბურავებით. საწვავი აღმართამდე, თბილისში ჩაასხით. ალტერნატივა — S6-ით სამხრეთით
    და Sh31-ით კოდის გავლით — უფრო გრძელია, მაგრამ უფრო მშვიდი. ნავიგატორში თავად ტაძარი მონიშნეთ და არა
    დაბის ცენტრი. პარკინგი ტაძრის გვერდითაა.
en:
  name: Manglisi Cathedral
  short: >-
    An early-medieval cathedral among pines at 1,200 m, founded by tradition in the 4th century and rebuilt
    in the 11th, in an old garrison resort.
  body: >-
    **Manglisi Sioni is one of the places where Georgian Christianity began, if the chronicles are to
    be believed, and almost everyone who has passed through since has rebuilt a little of it.**


    The 11th-century chronicler Leonti Mroveli tells how, in the 330s, Emperor Constantine sent Bishop
    John to the newly converted King Mirian. Before reaching Mtskheta, John stopped here, began a church
    and left a piece of the True Cross. The relics did not stay: in the 7th century the Byzantine emperor
    Heraclius, at war with Persia, carried them off.


    The building is a chronicle in stone. Its core is a tetraconch, four apses wrapped in an octagon,
    dated by scholars to between the 5th and 7th centuries and among the earliest of its type in Georgia.
    Early in the 11th century it was remade: a new altar apse, porches, a new dome and a new skin of carved
    stone. Look at the east façade, where two deep niches flank a large carved window, and up at the twelve-sided
    dome under its red tiles. Over the south door, a double-headed eagle is a 19th-century addition.


    That eagle belongs to the town's other story. In 1823 General Yermolov quartered a regiment in the
    depopulated village, later famous as the Erivan Grenadiers; the cathedral was restored between 1851
    and 1857, and by the 1890s Tiflis families came up to escape the summer heat. The restoration cost
    almost all the medieval painting: only the dome keeps its 11th-century Exaltation of the Cross.


    A legend explains how the church survived its empty centuries. Prince Vakhushti wrote that Muslim
    raiders left it alone because they took a fresco of a saint riding a lion for Muhammad. It was St
    Mammes, who is traditionally shown riding one.


    The pines are still here. So is the cool.
  tip: >-
    An hour covers the cathedral; add a walk in the pines and it becomes an easy half day. This is a working
    church: shoulders and knees covered, a headscarf for women, and quiet during services. Binoculars
    or a zoom lens help with the carving on the dome drum and the east window. Manglisi has shops and
    a few cafés, some closed out of season. At 1,200 metres evenings are cool even in July, so pack a
    warm layer. The field of Didgori, where David the Builder defeated the Seljuks in 1121, lies not far
    from Manglisi.
  route: >-
    The shortest way is the Sh36: climb out of Tbilisi through Tskneti and Kojori, then follow the narrow,
    winding asphalt on to Manglisi. It is about 56 km and an hour and ten minutes, paved all the way,
    with plenty of tight bends after Kojori that ice over in winter. An economy car copes all year, with
    winter tyres in the cold months. Fill up in Tbilisi before the climb. The alternative, south on the
    S6 and then west on the Sh31 through Koda, is longer but gentler. Set your navigator to the cathedral
    itself rather than the town centre; there is parking beside the church.
ru:
  name: Манглисский собор
  short: >-
    Раннесредневековый собор среди сосен на высоте 1200 м: по преданию основан в IV веке, перестроен в
    XI-м, стоит в бывшем гарнизонном курорте.
  body: >-
    **Если верить летописям, Манглисский Сион — одно из мест, откуда пошло грузинское христианство, и
    почти каждый, кто бывал здесь с тех пор, что-нибудь в нём перестраивал.**


    Летописец XI века Леонтий Мровели рассказывает, как в 330-х годах император Константин послал епископа
    Иоанна к недавно обращённому царю Мириану. Не доходя до Мцхеты, Иоанн остановился здесь, заложил церковь
    и оставил частицу Животворящего Креста. Реликвии здесь не задержались: в VII веке их увёз византийский
    император Ираклий, воевавший тогда с Персией.


    Само здание — летопись в камне. Его ядро — тетраконх, четыре апсиды, заключённые в восьмигранник;
    учёные датируют его временем между V и VII веками, и это одна из самых ранних построек такого типа
    в Грузии. В начале XI века храм переделали: новая алтарная апсида, притворы, новый купол и новая «кожа»
    из резного камня. Взгляните на восточный фасад, где две глубокие ниши обрамляют большое резное окно,
    и поднимите глаза к двенадцатигранному куполу под красной черепицей. Двуглавый орёл над южной дверью
    — добавление XIX века.


    Этот орёл принадлежит другой истории городка. В 1823 году генерал Ермолов поставил в обезлюдевшем
    селе полк, прославившийся потом как Эриванский гренадерский; собор реставрировали в 1851–1857 годах,
    а к 1890-м тифлисские семьи приезжали сюда спасаться от летней жары. Реставрация стоила храму почти
    всей средневековой росписи: лишь в куполе уцелело «Воздвижение Креста» XI века.


    Как церковь пережила пустые века, объясняет легенда. Царевич Вахушти писал, что мусульманские налётчики
    не тронули её, приняв фреску со святым верхом на льве за изображение Мухаммеда. Это был святой Мамант,
    которого по традиции и пишут верхом на льве.


    Сосны по-прежнему здесь. И прохлада тоже.
  tip: >-
    На собор хватит часа; добавьте прогулку по сосняку — и получатся неспешные полдня. Храм действующий:
    плечи и колени закрыты, женщинам — платок, во время службы — тишина. Бинокль или длинный объектив
    пригодятся, чтобы разглядеть резьбу на барабане купола и вокруг восточного окна. В Манглиси есть магазины
    и несколько кафе, часть из них вне сезона закрыта. На высоте 1200 метров вечера прохладны даже в июле,
    так что захватите тёплую кофту. Недалеко от Манглиси лежит Дидгорское поле, где в 1121 году Давид
    Строитель разбил сельджуков.
  route: >-
    Кратчайший путь — по Sh36: из Тбилиси вверх через Цхнети и Коджори, а дальше по узкому извилистому
    асфальту до Манглиси. Это около 56 км и час десять минут, асфальт на всём протяжении, но после Коджори
    много крутых поворотов, которые зимой обледеневают. Машина эконом-класса справится круглый год, в
    холодные месяцы — на зимней резине. Заправьтесь в Тбилиси перед подъёмом. Запасной вариант — на юг
    по S6, а затем на запад по Sh31 через Коду — длиннее, зато спокойнее. Ставьте в навигаторе сам собор,
    а не центр посёлка; рядом с церковью есть парковка.
fa:
  name: کلیسای جامع مانگلیسی
  short: >-
    کلیسای جامعی از آغاز سده‌های میانه میان کاج‌ها در ارتفاع ۱۲۰۰ متری؛ به روایت سنت از سدهٔ چهارم، بازسازی‌شده
    در سدهٔ یازدهم، در ییلاقی که روزگاری پادگان بود.
  body: >-
    **اگر وقایع‌نامه‌ها را باور کنیم، سیونی مانگلیسی یکی از جاهایی است که مسیحیت گرجی از آن آغاز شد، و
    تقریباً هر کس که از آن پس از اینجا گذشته، تکه‌ای از آن را از نو ساخته است.**


    لئونتی مروولی، وقایع‌نگار سدهٔ یازدهم، روایت می‌کند که در دههٔ ۳۳۰ امپراتور کنستانتین اسقفی به نام
    یوحنا را نزد میریان، پادشاهی که تازه مسیحی شده بود، فرستاد. یوحنا پیش از رسیدن به متسختا در اینجا
    درنگ کرد، بنای کلیسایی را آغاز کرد و پاره‌ای از صلیب راستین را بر جای گذاشت. این یادگارهای مقدس ماندگار
    نشدند: در سدهٔ هفتم هراکلیوس، امپراتور بیزانس، که با ایران در جنگ بود، آنها را با خود برد.


    خودِ بنا وقایع‌نامه‌ای از سنگ است. هستهٔ آن چهارکُنخی است، یعنی چهار آپسید نیم‌دایره که در دل یک هشت‌ضلعی
    جای گرفته‌اند؛ پژوهشگران آن را به بازهٔ میان سده‌های پنجم تا هفتم نسبت می‌دهند و از نخستین بناهای
    این گونه در گرجستان می‌شمارند. در آغاز سدهٔ یازدهم بنا از نو ساخته شد: آپسید محرابی تازه، ایوان‌ها،
    گنبدی نو و پوسته‌ای تازه از سنگ کنده‌کاری‌شده. به نمای شرقی نگاه کنید، جایی که دو طاقچهٔ ژرف پنجره‌ای
    بزرگ و کنده‌کاری‌شده را در میان گرفته‌اند، و سر بالا کنید به گنبد دوازده‌ضلعی زیر سفال‌های سرخ. عقاب
    دوسرِ بالای در جنوبی افزوده‌ای از سدهٔ نوزدهم است.


    این عقاب به داستان دیگر شهرک تعلق دارد. در سال ۱۸۲۳ ژنرال یرمولوف هنگی را در این روستای خالی‌ازسکنه
    جای داد که بعدها با نام گرنادیرهای ایروان آوازه یافت؛ کلیسا میان سال‌های ۱۸۵۱ و ۱۸۵۷ مرمت شد، و تا
    دههٔ ۱۸۹۰ خانواده‌های تفلیسی برای گریز از گرمای تابستان به اینجا می‌آمدند. بهای این مرمت تقریباً همهٔ
    نقاشی‌های دیواری سده‌های میانه بود: تنها گنبد، نگارهٔ «برافراشتن صلیب» از سدهٔ یازدهم را نگه داشته
    است.


    افسانه‌ای توضیح می‌دهد که کلیسا چگونه سده‌های خالی را از سر گذراند. شاهزاده واخوشتی نوشته است که مهاجمان
    مسلمان به آن دست نزدند، زیرا نقش قدیسی سوار بر شیر را تصویر محمد پنداشتند. آن قدیس، مامِس مقدس بود
    که بنا به سنت، او را سوار بر شیر می‌نگارند.


    کاج‌ها هنوز همین‌جا هستند. خنکا هم.
  tip: >-
    برای کلیسا یک ساعت کافی است؛ گشتی در کاج‌زار به آن بیفزایید تا نیم‌روزی آسوده شود. این کلیسا فعال
    است: شانه‌ها و زانوها پوشیده، روسری برای بانوان، و سکوت در هنگام نیایش. دوربین دوچشمی یا لنز زوم برای
    دیدن کنده‌کاری‌های گردن گنبد و پنجرهٔ شرقی به کار می‌آید. مانگلیسی چند مغازه و چند کافه دارد که برخی
    بیرون از فصل بسته‌اند. در ارتفاع ۱۲۰۰ متری شب‌ها حتی در ژوئیه هم خنک است، پس لباس گرمی همراه بردارید.
    میدان دیدگوری، جایی که داوید سازنده در سال ۱۱۲۱ سلجوقیان را شکست داد، از مانگلیسی چندان دور نیست.
  route: >-
    کوتاه‌ترین راه جادهٔ Sh36 است: از تفلیس از راه تسکنتی و کوجوری بالا بروید و سپس آسفالت باریک و پرپیچ‌وخم
    را تا مانگلیسی دنبال کنید. حدود ۵۶ کیلومتر و یک ساعت و ده دقیقه راه است، سراسر آسفالت، اما پس از کوجوری
    پر از پیچ‌های تند که در زمستان یخ می‌بندند. خودروی اقتصادی در همهٔ فصل‌ها از پس آن برمی‌آید، و در
    ماه‌های سرد با لاستیک زمستانی. پیش از سربالایی در تفلیس سوخت بگیرید. راه دیگر، رو به جنوب با S6 و
    سپس رو به غرب با Sh31 از راه کودا، درازتر اما آرام‌تر است. مسیریاب را روی خودِ کلیسا تنظیم کنید، نه
    مرکز شهرک؛ کنار کلیسا جای پارک هست.
he:
  name: קתדרלת מאנגליסי
  short: >-
    קתדרלה מראשית ימי הביניים בין אורנים בגובה 1,200 מ', שלפי המסורת נוסדה במאה ה-4 ונבנתה מחדש במאה ה-11,
    בעיירת נופש שהייתה פעם עיר חיל מצב.
  body: >-
    **אם להאמין לכרוניקות, מאנגליסי סיוני הוא אחד המקומות שמהם החלה הנצרות הגאורגית, וכמעט כל מי שעבר
    כאן מאז בנה בו מחדש משהו.**


    הכרוניקן לאונטי מרוולי, בן המאה ה-11, מספר כיצד בשנות ה-330 שלח הקיסר קונסטנטינוס את הבישוף יוחנן
    אל המלך מיריאן, שהתנצר זה מקרוב. עוד לפני שהגיע למצחתה עצר יוחנן כאן, החל לבנות כנסייה והשאיר בה חלק
    מן הצלב האמיתי. השרידים הקדושים לא נשארו: במאה ה-7 לקח אותם עמו הקיסר הביזנטי הרקליוס, שנלחם אז בפרס.


    הבניין עצמו הוא כרוניקה באבן. גרעינו הוא טטרקונכוס, ארבע אפסידות העטופות במתומן, שהחוקרים מתארכים
    לתקופה שבין המאה ה-5 למאה ה-7, והוא מן המבנים המוקדמים מסוגו בגאורגיה. בראשית המאה ה-11 עוצב מחדש:
    אפסידת מזבח חדשה, אכסדראות כניסה, כיפה חדשה ו"עור" חדש של אבן מגולפת. הביטו בחזית המזרחית, שבה שתי
    גומחות עמוקות מאגפות חלון מגולף גדול, והרימו עיניים אל הכיפה בת שתים-עשרה הצלעות תחת רעפיה האדומים.
    הנשר הדו-ראשי מעל הדלת הדרומית הוא תוספת מן המאה ה-19.


    הנשר הזה שייך לסיפור האחר של העיירה. ב-1823 שיכן הגנרל ירמולוב בכפר שהתרוקן מיושביו רגימנט, שהתפרסם
    לימים בשם רגימנט הגרנדירים של אריוואן; הקתדרלה שוחזרה בשנים 1851–1857, ובשנות ה-90 של המאה ה-19 כבר
    עלו לכאן משפחות מטיפליס כדי לברוח מחום הקיץ. השחזור עלה כמעט בכל ציורי הקיר מימי הביניים: רק הכיפה
    שמרה על "הרמת הצלב" מן המאה ה-11.


    אגדה מסבירה כיצד שרדה הכנסייה את מאות השנים שבהן עמדה נטושה. הנסיך וחושטי כתב שפושטים מוסלמים הניחו
    לה, משום שסברו שציור קיר של קדוש הרוכב על אריה מתאר את מוחמד. זה היה הקדוש מאמאס, שעל פי המסורת מתואר
    רוכב על אריה.


    האורנים עדיין כאן. וגם הקרירות.
  tip: >-
    שעה מספיקה לקתדרלה; הוסיפו טיול בין האורנים, ותקבלו חצי יום נינוח. זו כנסייה פעילה: כתפיים וברכיים
    מכוסות, כיסוי ראש לנשים ושקט בזמן התפילות. משקפת או עדשת זום יעזרו לראות את הגילופים בתוף הכיפה ובחלון
    המזרחי. במאנגליסי יש חנויות וכמה בתי קפה, שחלקם סגורים מחוץ לעונה. בגובה 1,200 מטרים הערבים קרירים
    גם ביולי, אז קחו שכבה חמה. שדה דידגורי, שבו הביס דוד הבונה את הסלג'וקים ב-1121, נמצא לא הרחק ממאנגליסי.
  route: >-
    הדרך הקצרה ביותר היא כביש Sh36: מטפסים מטביליסי דרך צקנטי וקוג'ורי, ומשם ממשיכים באספלט הצר והמתפתל
    עד מאנגליסי. כ-56 ק״מ ושעה ועשר דקות, סלול לכל אורכו, אבל אחרי קוג'ורי יש הרבה עיקולים חדים שמתכסים
    קרח בחורף. רכב אקונומי מסתדר כל השנה, עם צמיגי חורף בחודשים הקרים. תדלקו בטביליסי לפני העלייה. החלופה,
    דרומה בכביש S6 ואז מערבה בכביש Sh31 דרך קודה, ארוכה יותר אך נוחה יותר. כוונו את הניווט אל הקתדרלה
    עצמה ולא אל מרכז העיירה; ליד הכנסייה יש חניה.
ar:
  name: كاتدرائية مانغليسي
  short: >-
    كاتدرائية من مطلع العصور الوسطى بين أشجار الصنوبر على ارتفاع 1200 م، أُسست بحسب الرواية في القرن الرابع
    وأُعيد بناؤها في الحادي عشر، في بلدة كانت حامية ومصيفاً.
  body: >-
    **إن صدّقنا الحوليات، فسيوني مانغليسي من الأماكن التي بدأت منها المسيحية الجورجية، وما من أحد تقريباً
    ممن مرّوا به منذ ذلك الحين إلا وأعاد بناء شيء منه.**


    يروي المؤرخ ليونتي مروفيلي، من القرن الحادي عشر، أن الإمبراطور قسطنطين أرسل في ثلاثينيات القرن الرابع
    الأسقف يوحنا إلى الملك ميريان الذي اعتنق المسيحية حديثاً. وقبل أن يبلغ يوحنا متسخيتا توقف هنا، وشرع
    في بناء كنيسة، وترك قطعة من خشبة الصليب المقدس. لكن الذخائر لم تبقَ: ففي القرن السابع حملها معه الإمبراطور
    البيزنطي هرقل، وكان يومئذ في حرب مع فارس.


    أما المبنى نفسه فحولية من حجر. نواته مخطط رباعي الحنيات (تتراكونخ): أربع حنيات يضمّها مثمّن، يؤرخها
    الباحثون بين القرنين الخامس والسابع، وهي من أقدم المباني من هذا الطراز في جورجيا. وفي مطلع القرن الحادي
    عشر أُعيدت صياغته: حنية مذبح جديدة، وأروقة مداخل، وقبة جديدة، وكسوة جديدة من الحجر المنحوت. تأمّل
    الواجهة الشرقية، حيث تحفّ كوّتان عميقتان بنافذة كبيرة منحوتة، وارفع بصرك إلى القبة ذات الأضلاع الاثني
    عشر تحت قرميدها الأحمر. أما النسر ذو الرأسين فوق الباب الجنوبي فإضافة من القرن التاسع عشر.


    وهذا النسر ينتمي إلى حكاية البلدة الأخرى. ففي عام 1823 أنزل الجنرال يرمولوف في القرية المقفرة فوجاً
    اشتهر لاحقاً باسم فوج غرينادير إيريفان؛ ورُمّمت الكاتدرائية بين 1851 و1857، وبحلول تسعينيات القرن
    التاسع عشر كانت عائلات تفليس تصعد إلى هنا هرباً من حرّ الصيف. وقد كلّف الترميمُ الكنيسةَ جلَّ رسومها
    الجدارية من العصور الوسطى: فلم تحتفظ إلا القبة بمشهد «رفع الصليب» من القرن الحادي عشر.


    وتفسّر أسطورةٌ كيف نجت الكنيسة في قرونها المهجورة. فقد كتب الأمير فاخوشتي أن غزاة مسلمين تركوها وشأنها
    لأنهم ظنوا رسماً جدارياً لقديس يمتطي أسداً صورةً للنبي محمد. وكان ذلك القديس مامَس، الذي جرى التقليد
    على تصويره راكباً أسداً.


    ما زال الصنوبر هنا، وما زالت البرودة.
  tip: >-
    تكفي ساعة للكاتدرائية؛ أضِف إليها نزهة بين الصنوبر فتصبح نصف يوم هادئاً. الكنيسة تُقام فيها الصلوات،
    فالمطلوب ستر الكتفين والركبتين، وغطاء للرأس للنساء، والهدوء أثناء الصلوات. سيفيدك منظار أو عدسة تقريب
    لرؤية النقوش على رقبة القبة وحول النافذة الشرقية. في مانغليسي متاجر وبضعة مقاهٍ، يُغلق بعضها خارج
    الموسم. وعلى ارتفاع 1200 متر تبرد الأمسيات حتى في يوليو، فاحمل طبقة دافئة. وغير بعيد عن مانغليسي يقع
    ميدان ديدغوري، حيث هزم داود البنّاء السلاجقة عام 1121.
  route: >-
    أقصر الطرق هو Sh36: اصعد من تبليسي عبر تسكنيتي وكوجوري، ثم تابع الإسفلت الضيق المتعرج حتى مانغليسي.
    المسافة نحو 56 كيلومتراً وساعة وعشر دقائق، والطريق معبّد كله، لكن بعد كوجوري منعطفات حادة كثيرة يكسوها
    الجليد شتاءً. تكفي سيارة اقتصادية طوال العام، مع إطارات شتوية في الأشهر الباردة. تزوّد بالوقود في
    تبليسي قبل الصعود. أما البديل، جنوباً على S6 ثم غرباً على Sh31 عبر كودا، فأطول لكنه أهدأ. اضبط الملاحة
    على الكاتدرائية نفسها لا على وسط البلدة؛ وبجوار الكنيسة موقف للسيارات.
