ka:
  name: ფიტარეთის მონასტერი
  short: >-
    XIII საუკუნის მდიდრულად მოჩუქურთმებული ტაძარი მუხნარ ტყეში ხრამის ხეობის თავზე, ციხე-გალავნით.
  body: >-
    **ფიტარეთი ორმაგად დაცული ადგილია: ჯერ ტყით, მერე კედლებით.** მონასტერი თეთრიწყაროს მუნიციპალიტეტში,
    ხრამის კანიონის ზემოთ, მუხნარ ტყეშია და უკანასკნელი კილომეტრები ხრეშის გზაზე მოდის — სწორედ ამიტომ აქ
    ხალხი ცოტაა.


    ტაძარი 1213-1222 წლებში აშენდა კავთარ კაჭიბაძემ, რომელიც სამეფო კარის დიდებული იყო; ეს იგივე
    ათწლეულებია, როცა წუღრუღაშენი აშენდა და ორივე ერთსა და იმავე ესთეტიკას ეკუთვნის. აღმოსავლეთი ფასადი
    და გუმბათის ყელი ორნამენტით არის დაფარული: გეომეტრიული წნული, ვაზის რტოები, სტილიზებული ცხოველები,
    კვეთილი ჯვრები. ქვის ხარისხი და კვეთის სიღრმე იმ დონისაა, რომ დეტალები რვა საუკუნის შემდეგაც
    მკვეთრია.


    გარშემო XVII-XVIII საუკუნეების ციხე-გალავანია კოშკებით და ჭიშკრით. ეს გვიანდელი დამატებაა, როცა
    მონასტერი ლეკიანობის დროს თავდაცვას საჭიროებდა. კედლებზე ასვლა შესაძლებელია და ზემოდან ხეობა კარგად
    ჩანს.


    ტაძრის შიგნით მოხატულობა თითქმის აღარაა, სივრცე კი მაღალი და ცივია. მონასტერი მოქმედია, თუმცა ძმობა
    მცირერიცხოვანია. ტყე ზაფხულში ჩრდილიან და გრილ გარემოს ქმნის, ოქტომბერში კი მუხა და რცხილა ყვითლდება
    — ეს საუკეთესო დროა. ზამთარში გზა ხშირად გაუვალია თოვლისა და ლაფის გამო.
  tip: >-
    ორი საათი გამოყავით, გზის ჩათვლით. ბოლო თხუთმეტი კილომეტრი ხრეშია და ღრმა ღარებით; მშრალ ამინდში SUV
    საკმარისია, წვიმის შემდეგ ჭაობდება. მობილურის კავშირი წყდება. მაღაზია და კაფე გზაზე არ არის — წყალი
    და საკვები წამოიღეთ. მონასტერში ჩაცმის წესები მოქმედებს. ზამთარში მისვლა არ დაგეგმოთ, თუ ჯიპი და
    შესაბამისი საბურავები არ გაქვთ.
  route: >-
    თბილისიდან სამხრეთ-დასავლეთით კოდისა და თეთრიწყაროს გავლით, შემდეგ სამხრეთით ფიტარეთის მიმართულებით.
    სულ 88 კმ, დაახლოებით საათი და ორმოცდაათი წუთი. პირველი 70 კმ ასფალტია და კარგ მდგომარეობაშია; ბოლო
    18 კმ ხრეშის სატყეო გზაა, ვიწრო და ღრმაღარებიანი — SUV ან მაღალი კლირენსი აუცილებელია. საწვავი
    თეთრიწყაროში აიღეთ. მანქანა ჭიშკრის წინ რჩება.
en:
  name: Pitareti Monastery
  short: >-
    A richly carved 13th-century church in oak forest above the Khrami gorge, enclosed by a later
    fortified wall.
  body: >-
    **Pitareti is protected twice over: first by forest, then by walls.** The monastery stands in
    Tetritskaro municipality above the Khrami canyon, in oak woodland, and the last stretch of road is
    gravel — which is precisely why so few people are here.


    The church was built between 1213 and 1222 by Kavtar Kachibadze, a noble of the royal court. These
    are the same decades that produced Tsughrughasheni, and both belong to a single aesthetic. The east
    facade and the drum are covered in ornament: geometric interlace, vine scrolls, stylised animals and
    carved crosses. The stone is good and the cutting deep enough that details remain crisp after eight
    centuries.


    Around the church runs a fortified enclosure of the 17th and 18th centuries, with towers and a gate.
    That is a late addition, from the period when raiding from the North Caucasus made monasteries defend
    themselves. You can walk sections of the wall, and the gorge shows well from the top.


    Inside the church almost no painting survives, and the space is tall and cold. The monastery is
    active but the community is small. In summer the forest keeps the site shaded and cool; in October
    the oak and hornbeam turn and this is the best time to come. In winter the road is often impassable
    through snow and mud.
  tip: >-
    Allow two hours including the drive in. The last fifteen kilometres are gravel with deep ruts; in dry
    weather an SUV is enough, but after rain the surface turns to mud. Mobile signal drops out. There is
    no shop or cafe along the way, so bring water and food. Dress rules apply at the monastery. Do not
    plan a winter visit without a four-wheel drive and proper tyres.
  route: >-
    Head southwest from Tbilisi through Koda and Tetritskaro, then south towards Pitareti. Eighty-eight
    kilometres in total, about an hour and fifty minutes. The first 70 km are asphalt in good condition;
    the last 18 km are a gravel forest road, narrow and deeply rutted, so an SUV or high clearance is
    necessary. Refuel in Tetritskaro. Cars are left in front of the gate.
ru:
  name: Монастырь Питарети
  short: >-
    Богато украшенный резьбой храм XIII века в дубовом лесу над Храмским ущельем, окружённый поздней
    крепостной оградой.
  body: >-
    **Питарети защищён дважды: сначала лесом, потом стенами.** Монастырь стоит в Тетрицкаройском
    муниципалитете над каньоном Храми, в дубраве, и последний участок дороги — гравий, потому людей здесь
    так мало.


    Храм построен между 1213 и 1222 годами Кавтаром Качибадзе, вельможей царского двора. Это те же
    десятилетия, что дали Цугругашени, и обе постройки принадлежат одной эстетике. Восточный фасад и
    барабан покрыты орнаментом: геометрическое плетение, виноградные побеги, стилизованные животные,
    резные кресты. Камень хорош, а резьба достаточно глубока, чтобы детали оставались чёткими и восемь
    столетий спустя.


    Вокруг храма идёт крепостная ограда XVII-XVIII веков с башнями и воротами. Это позднее добавление —
    времени, когда набеги с Северного Кавказа заставили монастыри обороняться. По участкам стены можно
    пройти, сверху хорошо видно ущелье.


    Внутри росписи почти не осталось, пространство высокое и холодное. Монастырь действующий, но братия
    малочисленна. Летом лес держит тень и прохладу; в октябре дуб и граб желтеют, и это лучшее время.
    Зимой дорога часто непроходима из-за снега и грязи.
  tip: >-
    Заложите два часа вместе с дорогой. Последние пятнадцать километров — гравий с глубокой колеёй; в
    сухую погоду хватит внедорожника, после дождя покрытие превращается в грязь. Связь пропадает. Ни
    магазина, ни кафе по пути нет — берите воду и еду. В монастыре действуют правила одежды. Зимой не
    планируйте поездку без полного привода и подходящей резины.
  route: >-
    Из Тбилиси на юго-запад через Кода и Тетрицкаро, затем на юг в сторону Питарети. Всего 88 км,
    примерно час пятьдесят. Первые 70 км — асфальт в хорошем состоянии; последние 18 км — гравийная
    лесная дорога, узкая и с глубокими колеями, нужен внедорожник или высокий клиренс. Заправляйтесь в
    Тетрицкаро. Машины оставляют перед воротами.
fa:
  name: صومعهٔ پیتارتی
  short: >-
    کلیسایی از سدهٔ سیزدهم با کنده‌کاری پرکار در جنگل بلوط بالای درّهٔ خرامی، درون حصاری متأخر.
  body: >-
    **پیتارتی دو بار محافظت شده است: نخست با جنگل و سپس با دیوار.** صومعه در شهرستان تتریتسکارو بالای
    درّهٔ خرامی و در جنگل بلوط ایستاده، و آخرین بخش جاده شنی است — و دقیقاً به همین سبب مردم اینجا
    اندک‌اند.


    کلیسا میان ۱۲۱۳ و ۱۲۲۲ به دست کاوتار کاچیبادزه، از بزرگان دربار، ساخته شد. اینها همان دهه‌هایی‌اند که
    تسوغروغاشنی را پدید آوردند و هر دو به یک زیبایی‌شناسی تعلق دارند. نمای شرقی و گردن گنبد پوشیده از
    تزیین است: گره هندسی، پیچک تاک، جانوران سبک‌شده و صلیب‌های کنده‌کاری‌شده. سنگ مرغوب است و کنده‌کاری
    چنان ژرف که جزئیات پس از هشت سده هنوز تیز مانده‌اند.


    گرد کلیسا حصاری مستحکم از سده‌های هفدهم و هجدهم با برج‌ها و دروازه کشیده شده است. این افزوده‌ای متأخر
    است، از روزگاری که تاخت‌وتاز از شمال قفقاز صومعه‌ها را وادار به دفاع از خود کرد. می‌توان روی بخش‌هایی
    از دیوار راه رفت، و درّه از بالا خوب دیده می‌شود.


    درون کلیسا نقاشی چندانی نمانده و فضا بلند و سرد است. صومعه فعال است اما جماعت آن کوچک. تابستان جنگل
    محوطه را سایه‌دار و خنک نگه می‌دارد؛ در مهر بلوط و ممرز زرد می‌شوند و این بهترین زمان آمدن است.
    زمستان جاده اغلب از برف و گِل بسته است.
  tip: >-
    دو ساعت با احتساب راه در نظر بگیرید. پانزده کیلومتر پایانی شنی با شیارهای عمیق است؛ در هوای خشک
    شاسی‌بلند کافی است، اما پس از باران سطح جاده گِل می‌شود. آنتن تلفن قطع می‌شود. در راه مغازه و کافه‌ای
    نیست، پس آب و خوراک همراه ببرید. در صومعه قواعد پوشش برقرار است. سفر زمستانی را بدون چهارچرخ‌محرک و
    لاستیک مناسب برنامه‌ریزی نکنید.
  route: >-
    از تفلیس به جنوب‌غرب از کودا و تتریتسکارو بروید، سپس به جنوب به سوی پیتارتی. روی‌هم ۸۸ کیلومتر، حدود
    یک ساعت و پنجاه دقیقه. هفتاد کیلومتر نخست آسفالت و در وضعیت خوبی است؛ هجده کیلومتر پایانی جادهٔ جنگلی
    شنی، باریک و پر از شیار عمیق است، پس شاسی‌بلند یا ارتفاع زیاد از زمین لازم است. سوخت را در تتریتسکارو
    بگیرید. خودروها پیش از دروازه گذاشته می‌شوند.
he:
  name: מנזר פיטארתי
  short: >-
    כנסייה מגולפת בעושר מן המאה ה-13 ביער אלונים מעל ערוץ החראמי, מוקפת חומת מבצר מאוחרת.
  body: >-
    **פיטארתי מוגן פעמיים: תחילה ביער ואחר כך בחומות.** המנזר עומד במחוז תטריצקארו מעל קניון החראמי,
    בחורש אלונים, והקטע האחרון של הדרך הוא חצץ — ובדיוק משום כך מעטים כאן.


    הכנסייה נבנתה בין 1213 ל-1222 בידי קאווטאר קאצ'יבאדזה, אציל בחצר המלוכה. אלה אותם עשורים שהולידו את
    צוגרוגאשני, ושתיהן שייכות לאותה אסתטיקה. החזית המזרחית והתוף מכוסים עיטור: שזירה גיאומטרית, שריגי
    גפן, חיות מסוגננות וצלבים מגולפים. האבן טובה והגילוף עמוק דיו כדי שהפרטים יישארו חדים אחרי שמונה מאות
    שנים.


    סביב הכנסייה עוברת חומת מבצר מן המאות ה-17 וה-18, עם מגדלים ושער. זו תוספת מאוחרת, מן התקופה שבה
    פשיטות מצפון הקווקז אילצו מנזרים להגן על עצמם. אפשר ללכת על קטעי החומה, והערוץ נראה היטב מלמעלה.


    בתוך הכנסייה כמעט לא שרד ציור, והחלל גבוה וקר. המנזר פעיל אך הקהילה קטנה. בקיץ היער שומר על צל
    וקרירות; באוקטובר האלון והגרניט מצהיבים וזה הזמן הטוב ביותר לבוא. בחורף הדרך לרוב אינה עבירה בגלל שלג
    ובוץ.
  tip: >-
    הקצו שעתיים כולל הנסיעה פנימה. חמישה-עשר הקילומטרים האחרונים הם חצץ עם תלמים עמוקים; במזג אוויר יבש
    רכב שטח מספיק, אך אחרי גשם המשטח הופך לבוץ. הקליטה נעלמת. אין חנות או בית קפה בדרך, לכן הביאו מים
    ואוכל. במנזר חלים כללי לבוש. אל תתכננו ביקור בחורף בלי הנעה כפולה וצמיגים מתאימים.
  route: >-
    צאו מטביליסי דרום-מערבה דרך קודה ותטריצקארו, ואז דרומה לכיוון פיטארתי. 88 ק״מ בסך הכול, כשעה וחמישים.
    שבעים הקילומטרים הראשונים סלולים ובמצב טוב; שמונה-עשר הקילומטרים האחרונים הם דרך יער חצץ, צרה ומלאת
    תלמים, ולכן נדרש רכב שטח או מרווח גחון גבוה. תדלקו בתטריצקארו. את הרכב משאירים לפני השער.
ar:
  name: دير بيتاريتي
  short: >-
    كنيسة من القرن الثالث عشر غنية النقش في غابة بلوط فوق وادي خرامي، يحيط بها سور محصّن متأخر.
  body: >-
    **بيتاريتي محميّ مرتين: بالغابة أولاً ثم بالأسوار.** يقوم الدير في بلدية تيتريتسكارو فوق وادي خرامي
    في غابة بلوط، والمقطع الأخير من الطريق حصى — ولهذا بالذات يقلّ الناس هنا.


    بُنيت الكنيسة بين 1213 و1222 على يد كافتار كاتشيبادزه، وهو من نبلاء البلاط الملكي. وهذه العقود نفسها
    أنتجت تسوغروغاشيني، وكلتاهما تنتمي إلى ذوق واحد. والواجهة الشرقية ورقبة القبة مغطاتان بالزخرفة: تضفير
    هندسي، وأغصان كرمة، وحيوانات مُسلوبة، وصلبان منقوشة. والحجر جيد والنحت عميق بما يكفي لتبقى التفاصيل
    حادة بعد ثمانية قرون.


    ويمتد حول الكنيسة سور محصّن من القرنين السابع عشر والثامن عشر بأبراج وبوابة. وهذا إضافة متأخرة، من
    زمن أجبرت فيه الغارات من شمال القوقاز الأديرة على الدفاع عن نفسها. ويمكن السير على مقاطع من السور،
    ويظهر الوادي جيداً من الأعلى.


    وداخل الكنيسة لم يبقَ من التصوير شيء يُذكر، والفراغ مرتفع بارد. والدير عامل لكن جماعته صغيرة. وفي
    الصيف تُبقي الغابة الموقع مظللاً بارداً؛ وفي تشرين الأول يصفرّ البلوط والغرب وهذا أفضل وقت للمجيء.
    وفي الشتاء يتعذر سلوك الطريق غالباً بسبب الثلج والوحل.
  tip: >-
    خصّص ساعتين مع طريق الدخول. والكيلومترات الخمسة عشر الأخيرة حصى بأخاديد عميقة؛ في الجو الجاف تكفي
    سيارة دفع رباعي، لكن بعد المطر يتحول السطح إلى طين. وتنقطع تغطية الهاتف. ولا متجر ولا مقهى على
    الطريق، فاحمل الماء والطعام. وتُطبق قواعد اللباس في الدير. ولا تخطط لزيارة شتوية بلا دفع رباعي
    وإطارات مناسبة.
  route: >-
    اتجه جنوب غرب من تبليسي عبر كودا وتيتريتسكارو، ثم جنوباً نحو بيتاريتي. ثمانية وثمانون كيلومتراً
    إجمالاً، نحو ساعة وخمسين دقيقة. السبعون كيلومتراً الأولى إسفلت بحالة جيدة؛ والثمانية عشر الأخيرة طريق
    غابة حصوي ضيق كثير الأخاديد، فيلزم دفع رباعي أو ارتفاع عالٍ عن الأرض. تزوّد بالوقود في تيتريتسكارو.
    وتُترك السيارات أمام البوابة.
