ka:
  name: ფიტარეთის მონასტერი
  short: >-
    XIII საუკუნის მოჩუქურთმებული ღვთისმშობლის ტაძარი ხრამის ხეობის ღრმა, ტყიან წიაღში, ორმაგი გალავნით
    და ძნელად სავალი სატყეო გზით.
  body: >-
    **ფიტარეთმა ლეკთა თარეშს, ხანგრძლივ გაუკაცრიელებას და ახალი მფლობელის მოურავსაც გაუძლო, რომელიც ტაძრის
    დანგრევას იფიცებოდა.**


    მონასტერი თეთრიწყაროს მუნიციპალიტეტში, ხრამის ხეობის ღრმა ნაპრალში დგას, მაღალი, ტყით დაფარული მთებით
    გარშემორტყმული. მისი ღვთისმშობლის სახელობის ტაძარი 1213–1222 წლებით, ლაშა-გიორგის მეფობის ხანით თარიღდება.
    დიდხანს მეცნიერები მას XIV საუკუნეს მიაკუთვნებდნენ — კარიბჭის წარწერაში მოხსენიებული გიორგი მეფის
    გამო, — სანამ ხელოვნებათმცოდნე გიორგი ჩუბინაშვილმა სტილის ანალიზით არ დაასაბუთა, რომ ის XII–XIII საუკუნეთა
    მიჯნას ეკუთვნის, ბეთანიის, ქვათახევისა და მისი უმცროსი ნათესავის, წუღრუღაშენის, გვერდით.


    გეგმა თითქმის კვადრატულია, კარიბჭე სამხრეთიდანაა; ფასადებს ნიშები, სარკმლები და ნაკვეთი საპირეები
    აცოცხლებს. ინტერიერი ოდესღაც მთლიანად მოხატული იყო, დღეს კი მხოლოდ დაზიანებული ფრაგმენტებია შემორჩენილი.
    კომპლექსს ორი გალავანი აკრავს: ძველი, XII–XIII საუკუნეებისა, დიდწილად დანგრეულია, ახალი, სათოფურებიანი,
    XVII–XVIII საუკუნეებით თარიღდება — იმ ხანით, როცა მონასტერს ციხედაც უნდა ემსახურა.


    XIV საუკუნეში კომპლექსი გიორგი ბრწყინვალის ამირეჯიბმა, ბარათაშვილთა წინაპარმა ქავთარ ქაჯიფაისძემ აღადგინა;
    შემდეგ საუკუნეებში ფიტარეთი ბარათაშვილთა და მათი შტოს, ორბელიშვილების, საკუთრება და საძვალე იყო. 1696
    წელს, როგორც წარწერა მოწმობს, წინამძღვარმა იობმა, ვახტანგ VI-ისა და სულხან-საბა ორბელიანის დაახლოებულმა
    პირმა, ააგო მარანი, რომელიც საცხოვრებლადაც და თავდაცვისთვისაც გამოიყენებოდა. აქ XVII საუკუნეში გადაწერილი
    ძლისპირების კრებული ნევმებს — ძველ ქართულ სანოტო ნიშნებს — ინახავს. 1752 წელს, ლეკების თარეშის შემდეგ,
    ბერებმა მონასტერი დატოვეს. XX საუკუნის დასაწყისში მღვდელი ზაქარია გულისაშვილი წერდა, რომ მამული რუსისთვის
    300 თუმნად მიეყიდათ, მას კი ის ვინმე თაიროვისთვის გადაეყიდა, რომლის მოურავიც ტაძრის დანგრევით იმუქრებოდა.
    ეს მუქარა არ აღსრულდა.


    მამულის ყველა მფლობელი წავიდა — ჩუქურთმა კი აქვეა.
  tip: >-
    მონასტერში ორი საათი გამოყავით, გზაში დახარჯული დროის გარდა. მონასტერი მოქმედია: ჩაიცვით მოკრძალებულად,
    ქალებს თავსაფარი დასჭირდებათ, ხმამაღლა ნუ ილაპარაკებთ. მისასვლელ გზაზე არც მაღაზიაა და არც კაფე, ხეობაში
    კი მობილური კავშირი ქრება, ამიტომ წყალი და საკვები თან იქონიეთ და ვინმეს გააგებინეთ, სად მიდიხართ.
    გარე გალავანს შემოუარეთ სათოფურების სანახავად, ფასადებს კი დილის შუქზე დაუთმეთ დრო. წვიმის შემდეგ
    სატყეო გზა ლაფიანდება. ზამთარში ოთხწამყვანიანი მანქანისა და შესაბამისი საბურავების გარეშე ნუ გარისკავთ
    — რეალურად ეს გვიანი გაზაფხულიდან შემოდგომამდე სამოგზაურო ადგილია.
  route: >-
    თბილისიდან ს6-ით სამხრეთით, მარნეულისა და ბოლნისის გავლით, კაზრეთის მიმართულებით იარეთ. ქვეშთან შ155-ზე,
    ძეძვნარიანისა და ტანძიისკენ გადაუხვიეთ; ტანძიის შემდეგ გზა ვიწრო, ღრმაღარებიან სატყეო გზად იქცევა
    და ბოლო დაახლოებით თორმეტი კილომეტრი ხეობაში ასე ჩადის. სულ დაახლოებით 88 კმ-ია, საათი და ორმოცდაათი
    წუთი; პირველი 70-ზე მეტი კილომეტრი კარგი ასფალტია. ბოლო მონაკვეთისთვის ჯიპი ან, სულ მცირე, მაღალი
    კლირენსის კროსოვერი აუცილებელია. საწვავი მარნეულში ან ბოლნისში ჩაასხით. მანქანა ჭიშკართან დატოვეთ.
    დაბრუნებისას გასახვევის ახლოს მდგარ ქვეშის ციხესაც შეგიძლიათ შეუაროთ.
en:
  name: Pitareti Monastery
  short: >-
    A carved 13th-century church of the Virgin in a deep, wooded fold of the Khrami valley, ringed by
    two walls and reached by a rough forest road.
  body: >-
    **Pitareti has outlived Dagestani raiders, long years of emptiness and a new owner's steward who swore
    he would pull it down.**


    The monastery lies in a deep gorge of the Khrami valley in Tetritskaro municipality, ringed by high,
    wooded mountains. Its church of the Mother of God dates from 1213–1222, the reign of George IV Lasha.
    Scholars long placed it in the 14th century, misled by a King George named in the porch inscription,
    until the art historian Giorgi Chubinashvili showed from its style that it belongs with Betania, Kvatakhevi
    and its smaller cousin Tsughrughasheni, at the turn of the 12th and 13th centuries.


    The plan is almost square, the porch on the south; niches, windows and carved frames animate the facades.
    The interior was once painted throughout, but only damaged fragments survive. Two walls surround the
    complex: the older, of the 12th–13th centuries, is largely ruined; the newer, pierced with gun-loops,
    dates from the 17th–18th, when a monastery had to be a fort.


    In the 14th century the complex was restored by Kavtar Kajipaisdze, royal chamberlain to George V
    the Brilliant and ancestor of the Baratashvili princes; for centuries afterwards Pitareti was the
    property and burial ground of the Baratashvili and their Orbelishvili branch. In 1696, as its inscription
    records, the abbot Iob, close to King Vakhtang VI and Sulkhan-Saba Orbeliani, built the wine cellar,
    which doubled as house and stronghold. A hymnal copied here in the 17th century preserves neumes,
    the signs of Georgia's old musical notation. In 1752, after a raid from Dagestan, the monks left.
    Early in the 20th century the priest Zakaria Gulisashvili recorded that the estate had been sold to
    a Russian for 300 tumans, then resold to one Tairov, whose steward vowed to demolish the church. He
    never did.


    Every owner who held the deed is gone; the carving is still here.
  tip: >-
    Allow two hours at the monastery on top of the slow drive in. This is an active monastery: modest
    dress, a head covering for women, quiet voices. There is no shop or café on the approach and the mobile
    signal fades in the gorge, so bring water and food and tell someone your plans. Walk round the outer
    wall to see the gun-loops, and give the facades time in the morning light. After rain the forest road
    turns to mud. In winter do not attempt it without four-wheel drive and proper tyres; realistically
    this is a late-spring-to-autumn trip.
  route: >-
    Take the S6 south from Tbilisi through Marneuli and Bolnisi and continue towards Kazreti. At Kveshi
    turn onto the Sh155 towards Dzedzvnariani and Tandzia; beyond Tandzia the road becomes a narrow, rutted
    forest track for roughly the last twelve kilometres into the gorge. About 88 km and an hour and fifty
    minutes in all, the first 70-odd on good asphalt. An SUV, or at least a high-clearance crossover,
    is essential for the final stretch. Refuel in Marneuli or Bolnisi. Leave the car in front of the gate.
    Kveshi Fortress, near the turn-off, makes a good stop on the way back.
ru:
  name: Монастырь Питарети
  short: >-
    Резной храм Богородицы XIII века в глубокой лесистой складке долины Храми, за двумя стенами, в конце
    разбитой лесной дороги.
  body: >-
    **Питарети пережил набеги из Дагестана, долгие годы запустения и управляющего нового хозяина, который
    клялся его снести.**


    Монастырь стоит в глубоком ущелье долины Храми в Тетрицкаройском муниципалитете, в кольце высоких
    лесистых гор. Его церковь Богородицы датируется 1213–1222 годами, царствованием Георгия IV Лаши. Учёные
    долго относили её к XIV веку, введённые в заблуждение упомянутым в надписи на притворе царём Георгием,
    пока искусствовед Георгий Чубинашвили не показал по стилю, что она принадлежит рубежу XII–XIII веков
    и стоит в одном ряду с Бетанией, Кватахеви и своей младшей родственницей Цугругашени.


    План почти квадратный, притвор — с юга; фасады оживлены нишами, окнами и резными обрамлениями. Когда-то
    интерьер был расписан целиком, но уцелели лишь повреждённые фрагменты. Комплекс окружают две стены:
    старшая, XII–XIII веков, в основном разрушена; младшая, с бойницами, относится к XVII–XVIII векам,
    когда монастырю приходилось быть и крепостью.


    В XIV веке комплекс восстановил Кавтар Каджипаисдзе, царский постельничий (амирэджиби) Георгия V Блистательного
    и предок князей Бараташвили; на протяжении веков Питарети оставался владением и усыпальницей Бараташвили
    и их ветви Орбелишвили. В 1696 году, как гласит надпись, игумен Иов, приближённый царя Вахтанга VI
    и Сулхан-Сабы Орбелиани, построил марани — винный погреб, служивший заодно жилищем и укреплением.
    Переписанный здесь в XVII веке сборник песнопений сохранил невмы — знаки древней грузинской нотной
    записи. В 1752 году, после набега из Дагестана, монахи ушли. В начале XX века священник Закария Гулисашвили
    записал, что имение продали одному русскому за 300 туманов, а затем перепродали некоему Таирову, чей
    управляющий поклялся снести церковь. Он так этого и не сделал.


    Все, кто держал в руках купчую, ушли; резьба по-прежнему здесь.
  tip: >-
    Закладывайте два часа на сам монастырь, не считая медленной дороги туда. Это действующий монастырь:
    скромная одежда, платок для женщин, негромкие голоса. На подъезде нет ни магазина, ни кафе, а в ущелье
    пропадает мобильная связь, так что возьмите воду и еду и предупредите кого-нибудь о своих планах.
    Обойдите внешнюю стену, чтобы увидеть бойницы, а фасады рассмотрите не торопясь, в утреннем свете.
    После дождя лесная дорога превращается в грязь. Зимой без полного привода и подходящей резины не рискуйте;
    по сути, это поездка с конца весны до осени.
  route: >-
    Из Тбилиси езжайте на юг по S6 через Марнеули и Болниси и дальше в сторону Казрети. В Квеши сверните
    на Sh155 к Дзедзвнариани и Тандзии; за Тандзией асфальт сменяется узкой, изрытой колеями лесной дорогой
    — так выглядят примерно последние двенадцать километров до ущелья. Всего около 88 км и час пятьдесят
    минут, из них первые 70 с небольшим — по хорошему асфальту. Для последнего участка обязателен внедорожник
    или хотя бы кроссовер с высоким клиренсом. Заправьтесь в Марнеули или Болниси. Машину оставьте перед
    воротами. Крепость Квеши у поворота — хорошая остановка на обратном пути.
fa:
  name: صومعهٔ پیتارتی
  short: >-
    کلیسای کنده‌کاری‌شدهٔ مادر خدا از سدهٔ سیزدهم در چینی ژرف و جنگلی از درّهٔ خرامی، در میان دو بارو،
    در انتهای جاده‌ای جنگلی و ناهموار.
  body: >-
    **پیتارتی از یورش‌های داغستانی‌ها، سال‌های دراز متروک‌ماندن و مباشر مالکی تازه که سوگند خورده بود
    ویرانش کند، جان به در برده است.**


    صومعه در درّه‌ای ژرف از وادی خرامی در شهرستان تتری‌تسقارو جای دارد، در حلقهٔ کوه‌هایی بلند و جنگلی.
    کلیسای مادر خدای آن به سال‌های ۱۲۱۳ تا ۱۲۲۲، دوران فرمانروایی گیورگی چهارم لاشا، بازمی‌گردد. پژوهشگران
    مدت‌ها آن را به سدهٔ چهاردهم نسبت می‌دادند، چون نام پادشاهی به نام گیورگی در کتیبهٔ رواق گمراهشان
    کرده بود، تا آنکه گیورگی چوبیناشویلی، تاریخ‌نگار هنر، از روی سبک نشان داد که کلیسا به مرز سده‌های
    دوازدهم و سیزدهم تعلق دارد، در کنار بتانیا، کواتاخوی و خویشاوند کوچک‌ترش، تسوغروغاشنی.


    نقشه تقریباً مربع است و رواق در جنوب؛ طاقچه‌ها، پنجره‌ها و قاب‌های کنده‌کاری‌شده به نماها جان می‌بخشند.
    درون کلیسا روزگاری سراسر نقاشی شده بود، اما جز پاره‌هایی آسیب‌دیده چیزی از آن نمانده است. دو بارو
    مجموعه را در بر گرفته‌اند: باروی کهن‌تر، از سده‌های دوازدهم و سیزدهم، بیشترش ویران است؛ باروی تازه‌تر،
    با مزغل‌هایش، از سده‌های هفدهم و هجدهم است، روزگاری که صومعه ناگزیر دژ هم بود.


    در سدهٔ چهاردهم، کاوتار کاجیپایسدزه، پرده‌دار شاهی (امیرجیبی) گیورگی پنجم درخشان و نیای شاهزادگان
    باراتاشویلی، مجموعه را مرمت کرد؛ از آن پس، سده‌ها پیتارتی ملک و آرامگاه خاندان باراتاشویلی و شاخهٔ
    آنان، اوربلیشویلی‌ها، بود. مارانی، یعنی سرداب شراب، که هم خانه بود و هم پناهگاه، به گواهی کتیبه‌اش
    در سال ۱۶۹۶ به دست ایوب، رئیس صومعه و از نزدیکان واختانگ ششم و سولخان‌سابا اوربلیانی، ساخته شد. سرودنامه‌ای
    که در سدهٔ هفدهم اینجا رونویسی شد، نئوم‌ها، یعنی نشانه‌های نت‌نویسی کهن گرجی، را نگه داشته است. در
    ۱۷۵۲، پس از یورشی از داغستان، راهبان صومعه را ترک کردند. در آغاز سدهٔ بیستم، کشیش زاکاریا گولیساشویلی
    ثبت کرد که ملک به مردی روس به ۳۰۰ تومان فروخته شد و سپس به شخصی به نام تایروف رسید که مباشرش سوگند
    خورده بود کلیسا را ویران کند. او هرگز چنین نکرد.


    هر مالکی که سند را در دست داشت رفته است؛ کنده‌کاری‌ها هنوز اینجاست.
  tip: >-
    افزون بر رانندگی کُند تا اینجا، دو ساعت هم برای خود صومعه در نظر بگیرید. این صومعه‌ای فعال است: پوشش
    ساده و پوشیده، روسری برای بانوان، صدای آرام. سر راه نه فروشگاهی هست نه کافه‌ای و آنتن تلفن همراه در
    دره ضعیف می‌شود، پس آب و خوراک همراه بیاورید و برنامه‌تان را به کسی بگویید. دور باروی بیرونی قدم بزنید
    تا مزغل‌ها را ببینید، و به نماها در نور صبح فرصت بدهید. پس از باران جادهٔ جنگلی گل‌آلود می‌شود. در
    زمستان بی خودروی چهارچرخ‌محرک و لاستیک مناسب راهی نشوید؛ در واقع این سفری است برای اواخر بهار تا پاییز.
  route: >-
    از تفلیس با S6 به جنوب بروید، از مارنئولی و بولنیسی بگذرید و به سوی کازرتی ادامه دهید. در کوِشی به
    جادهٔ Sh155 به سمت دزدزوناریانی و تاندزیا بپیچید؛ پس از تاندزیا، جاده در حدود دوازده کیلومتر پایانی
    تا دره به راهی جنگلی، باریک و پر از چاله و شیار بدل می‌شود. در مجموع حدود ۸۸ کیلومتر و یک ساعت و پنجاه
    دقیقه، که هفتاد و چند کیلومتر نخستش آسفالت خوب است. برای بخش پایانی خودروی شاسی‌بلند یا دست‌کم کراس‌اوور
    با فاصلهٔ زیاد از زمین ضروری است. در مارنئولی یا بولنیسی سوخت‌گیری کنید. خودرو را جلوی دروازه بگذارید.
    دژ کوِشی، نزدیک دوراهی، توقفگاه خوبی در راه بازگشت است.
he:
  name: מנזר פיטארתי
  short: >-
    כנסיית אם האלוהים מגולפת מן המאה ה-13 בקפל עמוק ומיוער של עמק החראמי, מוקפת שתי חומות, ואליה מובילה
    דרך יער משובשת.
  body: >-
    **פיטארתי שרד את פשיטות הדאגסטנים, את שנות השממה הארוכות ואת סוכנו של בעלים חדש שנשבע להרוס אותו.**


    המנזר שוכן בערוץ עמוק של עמק החראמי שבמחוז טטריצקארו, מוקף הרים גבוהים ומיוערים. כנסיית אם האלוהים
    שבו מתוארכת לשנים 1213–1222, ימי מלכותו של גיאורגי הרביעי לשה. זמן רב תיארכו אותה החוקרים למאה ה-14,
    משום שהוטעו במלך בשם גיאורגי הנזכר בכתובת שבמבואה, עד שחוקר האמנות גיאורגי צ'ובינאשווילי הראה על פי
    הסגנון שמקומה בתפר שבין המאה ה-12 למאה ה-13, לצד בטניה, קוואטחבי וקרובתה הקטנה צוגרוגאשני.


    התוכנית כמעט ריבועית, והמבואה בדרום; גומחות, חלונות ומסגרות מגולפות מחיות את החזיתות. הפנים היה פעם
    מצויר כולו, אך נותרו ממנו רק שברים פגועים. שתי חומות מקיפות את המתחם: הישנה, מן המאות ה-12–13, הרוסה
    ברובה; החדשה, המנוקבת בחרכי ירי, היא מן המאות ה-17–18, כשמנזר נאלץ להיות גם מבצר.


    במאה ה-14 שיקם את המתחם קבטר קג'יפאיסדזה, החצרן המלכותי (אמירג'יבי) של גיאורגי החמישי המזהיר ואבי
    שושלת נסיכי ברטשווילי; במשך מאות שנים לאחר מכן היה פיטארתי רכושם ומקום קבורתם של בני ברטשווילי ושל
    ענפם, האורבלישווילי. ב-1696, כפי שמעידה הכתובת שעליו, בנה אב המנזר איוב, מקורבם של המלך וחטנג השישי
    ושל סולחן־סבא אורבליאני, את המראני — מרתף היין ששימש גם כבית מגורים וגם כמעוז. ספר מזמורים שהועתק
    כאן במאה ה-17 משמר נוימות, סימני הכתב המוזיקלי הגאורגי העתיק. ב-1752, אחרי פשיטה מדאגסטן, עזבו הנזירים.
    בראשית המאה ה-20 רשם הכומר זכריה גוליסשווילי שהאחוזה נמכרה לאדם רוסי תמורת 300 טומאן, ואחר כך נמכרה
    שוב לאדם בשם טאירוב, שסוכנו נשבע להרוס את הכנסייה. הוא מעולם לא עשה זאת.


    כל מי שהחזיק בשטר הקניין איננו עוד; הגילופים עדיין כאן.
  tip: >-
    הקצו שעתיים למנזר עצמו, מעבר לנסיעה האיטית אליו. זהו מנזר פעיל: לבוש צנוע, כיסוי ראש לנשים, קולות
    שקטים. בדרך אין חנות או בית קפה, והקליטה הסלולרית נעלמת בערוץ, לכן הביאו מים ואוכל וספרו למישהו על
    תוכניותיכם. הקיפו את החומה החיצונית כדי לראות את חרכי הירי, ותנו לחזיתות זמן באור הבוקר. אחרי גשם
    דרך היער הופכת לבוץ. בחורף אל תנסו להגיע בלי הנעה כפולה וצמיגים מתאימים; באופן מציאותי זהו טיול מסוף
    האביב ועד הסתיו.
  route: >-
    סעו מטביליסי דרומה בכביש S6 דרך מרנאולי ובולניסי והמשיכו לכיוון קזרתי. בקוושי פנו לכביש Sh155 לכיוון
    דזדזבנריאני וטנדזיה; אחרי טנדזיה הכביש הופך לדרך יער צרה ומשובשת בתלמים, לאורך כשנים עשר הקילומטרים
    האחרונים אל תוך הערוץ. בסך הכול כ-88 ק"מ ושעה וחמישים דקות, מהם יותר מ-70 ק"מ ראשונים על אספלט טוב.
    לקטע האחרון נחוץ רכב שטח, או לכל הפחות קרוסאובר עם מרווח גחון גבוה. תדלקו במרנאולי או בבולניסי. השאירו
    את הרכב מול השער. מבצר קוושי, סמוך לפנייה, הוא עצירה טובה בדרך חזרה.
ar:
  name: دير بيتاريتي
  short: >-
    كنيسة منقوشة لوالدة الإله من القرن الثالث عشر في ثنية عميقة مشجرة من وادي خرامي، يحيط بها سوران، ويبلغها
    طريق حرجي وعر.
  body: >-
    **صمد بيتاريتي أمام غارات الداغستانيين، وسنوات طويلة من الهجران، ووكيل مالك جديد أقسم أن يهدمه.**


    يقع الدير في وهدة عميقة من وادي خرامي ضمن بلدية تيتريتسكارو، تطوّقه جبال عالية مكسوّة بالغابات. تعود
    كنيسته المكرّسة لوالدة الإله إلى الأعوام 1213–1222، في عهد جيورجي الرابع لاشا. وقد نسبها الباحثون
    طويلاً إلى القرن الرابع عشر، مضلَّلين بملكٍ يُدعى جيورجي ذُكر في نقش الرواق، إلى أن بيّن مؤرخ الفن
    جيورجي تشوبيناشفيلي من أسلوبها أنها تنتمي إلى الحدّ الفاصل بين القرنين الثاني عشر والثالث عشر، إلى
    جانب بيتانيا وكفاتاخيفي وقريبتها الأصغر تسوغروغاشيني.


    المخطط يكاد يكون مربعاً، والرواق من جهة الجنوب؛ وتُحيي الواجهاتِ محاريبُ ونوافذ وأطرٌ منقوشة. كان
    الداخل مرسوماً بالكامل ذات يوم، لكن لم يبق منه سوى شذرات متضررة. ويحيط بالمجمّع سوران: الأقدم، من
    القرنين الثاني عشر والثالث عشر، متهدّم في معظمه؛ والأحدث، المثقوب بالمزاغل، من القرنين السابع عشر
    والثامن عشر، حين كان على الدير أن يكون حصناً أيضاً.


    في القرن الرابع عشر رمّم المجمّعَ كافتار كاجيبايسدزه، حاجب الملك (الأميرجيبي) جيورجي الخامس اللامع
    وجدّ أمراء باراتاشفيلي؛ وظل بيتاريتي لقرون بعد ذلك ملكاً ومدفناً لآل باراتاشفيلي وفرعهم أوربيليشفيلي.
    وفي عام 1696، كما يشهد نقشه، بنى رئيس الدير أيوب، المقرّب من الملك فاختانغ السادس ومن سولخان سابا
    أوربيلياني، قبو النبيذ (الماراني) الذي كان مسكناً وحصناً في آن. ويحفظ كتاب تراتيل نُسخ هنا في القرن
    السابع عشر النيومات، أي علامات التدوين الموسيقي الجورجي القديم. وفي عام 1752، بعد غارة من داغستان،
    غادر الرهبان. وفي مطلع القرن العشرين دوّن الكاهن زكريا غوليساشفيلي أن الضيعة بيعت لرجل روسي بـ300
    تومان، ثم أعيد بيعها لشخص يُدعى تايروف، أقسم وكيله أن يهدم الكنيسة. لكنه لم يفعل قط.


    رحل كل من حمل صكّ الملكية؛ والنقوش ما زالت هنا.
  tip: >-
    خصّص ساعتين للدير نفسه، فضلاً عن الطريق البطيء إليه. هذا دير عامر بالرهبان: لباس محتشم، وغطاء رأس
    للنساء، وأصوات خافتة. لا متجر ولا مقهى على الطريق، وتنقطع إشارة الهاتف في الوادي، فاحمل الماء والطعام
    وأخبر أحداً بخططك. طُف حول السور الخارجي لترى المزاغل، وامنح الواجهات وقتها في ضوء الصباح. بعد المطر
    يتحول الطريق الحرجي إلى وحل. في الشتاء لا تحاول الوصول من دون دفع رباعي وإطارات مناسبة؛ واقعياً هذه
    رحلة من أواخر الربيع حتى الخريف.
  route: >-
    اتجه جنوباً من تبليسي على S6 عبر مارنيولي وبولنيسي وتابع نحو كازريتي. في كفيشي انعطف إلى Sh155 باتجاه
    دزيدزفنارياني وتاندزيا؛ بعد تاندزيا يتحول الطريق إلى مسلك حرجي ضيق تحفره الأخاديد، على امتداد الكيلومترات
    الاثني عشر الأخيرة تقريباً حتى الوادي. المجموع نحو 88 كم وساعة وخمسون دقيقة، منها السبعون ونيّف الأولى
    على أسفلت جيد. للمقطع الأخير لا بد من سيارة دفع رباعي، أو على الأقل سيارة كروس أوفر مرتفعة عن الأرض.
    تزوّد بالوقود في مارنيولي أو بولنيسي. اترك السيارة أمام البوابة. وقلعة كفيشي، قرب المنعطف، محطة جيدة
    في طريق العودة.
