ka:
  name: ფანტიშარის კანიონი
  short: >-
    ვაშლოვნის ეროვნული პარკის მშრალი კანიონი, ორი მილიონიოდე წლის წინ ძველ ზღვის ფსკერში გაჭრილი — მის
    კედლებში ნიჟარები და მარჯნები დღესაც ჩანს.
  body: >-
    **ეს კედლები ოდესღაც ზღვის ფსკერი იყო. ხეობა მათში დაახლოებით ორი მილიონი წლის წინ გაიჭრა; დღეს მას
    ჯიპით მიუყვებით და კედლებიდან ნიჟარები და მარჯნები გიყურებენ.**


    ფანტიშარა მშრალი კანიონია ვაშლოვნის ეროვნულ პარკში, საქართველოს უკიდურეს სამხრეთ-აღმოსავლეთში, აზერბაიჯანის
    საზღვართან ახლოს, და პარკის ოფიციალურ, მონიშნულ მარშრუტებს შორისაა. პარკში შესვლას ჭიშკარი არ გაუწყებთ:
    პირველი ნიშანი რეინჯერების სადგურია — კოტეჯები, საინფორმაციო დაფები და გადასახედი, საიდანაც პარკის
    სიღრმე, წყალსაცავი და შორს საზღვარი მოჩანს. აქედან 500-მეტრიანი „უხუცესი ხის ბილიკი“ ვაშლოვნის სახელმწიფო
    ნაკრძალის კიდეზე შედის, საკმლის ხეებს — ველურ ფსტას — შორის; ზოგიერთი მათგანი დაახლოებით 400 წლისაა.


    მეორე გადასახედის შემდეგ მიწა უფრო ქვიშიანი და მშრალი ხდება, ტალღოვანი ბორცვები ქართული ხრიოკების
    დაკბილულ კლდეებად იქცევა და გზა კანიონში ეშვება. აქ მგზავრობა უმდინარო კალაპოტის მიყოლას ჰგავს: ჯერ
    ქვები, მერე წებოვანი თიხა, ღია ფერის კედლები კი ხან ვიწროვდება, ხან ისევ იშლება.


    მანქანიდან გადმოდით და კლდეს ახლოდან დააკვირდით. ფენებში ზღვის ნალექია — მარჯნები, ნიჟარები და გაქვავებული
    კიბოსნაირები, რომლებიც ზღვის დახევისას აქ დარჩა. ეს ალესილების ზღვიური ნალექებია; აქ გადაშენებული
    სამხრეთის სპილოს ძვლებიც აღმოაჩინეს — ცხოველისა, რომლის სიმაღლე დაახლოებით ოთხ მეტრს აღწევდა.


    ფეხით სასეირნოდ მონიშნული წრიული ბილიკი „ფანტიშარა — დათვისხევი“ დაახლოებით 2,5 კილომეტრია და ორიოდე
    საათი სჭირდება.


    შუადღისას, დამსკდარ თიხასა და სიცხეში, წყალი აქ წარმოუდგენელი გეჩვენებათ. მერე კი ხელის გვერდით, კედელში
    ნიჟარას შენიშნავთ.
  tip: >-
    ნებართვა ყველას სჭირდება. გააფორმეთ დედოფლისწყაროში, ვაშლოვნის დაცული ტერიტორიების ადმინისტრაციაში:
    შესასვლელი საფასური ნაღდი ფულით იხდება, წარადგენთ პასპორტს, მანქანის სარეგისტრაციო მოწმობას და დაგეგმილ
    მარშრუტს; პასპორტი პარკშიც თან იქონიეთ, მესაზღვრეების შემოწმებისთვის. მანქანის დაქირავებამდე წერილობით
    დააზუსტეთ, უშვებს თუ არა კომპანია მანქანას ვაშლოვანში — ზოგი ამას კრძალავს. წვიმის შემდეგ ნუ შეხვალთ:
    თიხა სულ რაღაც ერთ საათში გაუვალი ხდება. თითო ადამიანზე სულ მცირე სამი ლიტრი წყალი, ქუდი და კოჭის
    დამფარავი ფეხსაცმელი წაიღეთ — გველგესლა აქ ხშირია; მობილური კავშირის იმედი ნუ გექნებათ. გაზაფხული
    და ოქტომბერი ყველაზე ხელსაყრელია; შუა ზაფხულში სიცხე 40°C-ს სცდება.
  route: >-
    თბილისიდან ს5-ით აღმოსავლეთით, საგარეჯოს გავლით იარეთ, შემდეგ შ40-ით სიღნაღისკენ, შ41-ით ბოდბის გავლით
    შ39-მდე და დედოფლისწყარომდე: დაახლოებით 130–140 კილომეტრი ასფალტი და ორ საათზე ცოტა მეტი. აქ დარეგისტრირდით,
    გადაიხადეთ და ავზი შეავსეთ — ქალაქს იქით არც ბენზინგასამართია, არც მაღაზია, არც სახელოსნო. დედოფლისწყაროს
    სამხრეთით ასფალტს ხრეში ცვლის, შემდეგ კი თიხაში ამოღრმავებული ორი ნაკვალევი; ფანტიშარის ხეობამდე კიდევ
    40–50 კილომეტრი და ორიდან ორნახევარ საათამდეა. სულ დაახლოებით 190 კილომეტრი და 4 საათი და 45 წუთი.
    ოფროუდ კლასის მანქანა აუცილებელია — ნამდვილი, მაღალი გამავლობის ჯიპი კარგი საბურავებით და არა რბილი
    კროსოვერი.
en:
  name: Pantishara Canyon
  short: >-
    A dry canyon in Vashlovani National Park, cut some two million years ago through an ancient seabed
    that still shows its shells and corals.
  body: >-
    **These walls were once the floor of a sea; the gorge was cut through them some two million years
    ago, and today you drive along it in a 4x4 while shells and corals look out at you.**


    Pantishara is a dry canyon in Vashlovani National Park, in the far south-eastern corner of Georgia
    near the Azerbaijani border, and one of the park's official marked routes. No gate tells you that
    you have arrived. The first sign is the rangers' station, with cottages, information boards and a
    viewpoint looking into the park, towards the reservoir and the distant border. From here the 500-metre
    Eldest Tree Trail leads into the edge of the Vashlovani Strict Nature Reserve, among wild pistachio
    trees, some of them around 400 years old.


    Beyond a second viewpoint the land turns sandier and drier, the rolling hills sharpen into the serrated
    cliffs of the Georgian badlands, and the track drops into the canyon. Driving it is like following
    a riverbed without a river: stones, then sticky clay, the pale walls closing in and opening out again.


    Get out and look closely at the rock. The strata hold marine sediment — corals, shells and fossilised
    crustaceans left behind when the sea withdrew. These are the Alesilebi seabeds, and they have yielded
    the bones of an extinct southern elephant some four metres tall.


    On foot, the marked Pantishara–Bear Gorge (Datviskhevi) loop runs for about 2.5 km and takes roughly
    two hours.


    At midday, among the cracked clay and the heat, water seems impossible here. Then you notice the shell
    in the wall beside your hand.
  tip: >-
    Everyone needs a permit. Arrange it at the Vashlovani Protected Areas administration in Dedoplistskaro,
    where you pay the entrance fee in cash and show your passport, the car's registration papers and a
    planned route; keep the passport with you for border-police checks inside the park. Before you hire,
    confirm in writing that the rental company allows its car into Vashlovani, as some forbid it. Never
    go in after rain: the clay turns impassable within the hour. Carry at least three litres of water
    per person, a hat and ankle-high boots, since vipers are common, and expect no mobile signal. Spring
    and October are kindest; midsummer passes 40°C.
  route: >-
    From Tbilisi take the S5 east past Sagarejo, the Sh40 towards Sighnaghi and the Sh41 via Bodbe to
    the Sh39 and Dedoplistskaro: about 130–140 km of asphalt and a little over two hours. Register, pay
    and fill the tank here, as there is no fuel, shop or workshop beyond the town. South of Dedoplistskaro
    the asphalt gives way to gravel and then to twin clay ruts; it is another 40–50 km and two to two
    and a half hours to the Pantishara valley. Allow about 190 km and 4 hours 45 minutes in all. This
    needs an offroad-class vehicle: a genuine high-clearance 4x4 with proper tyres, not a soft crossover.
ru:
  name: Каньон Пантишара
  short: >-
    Сухой каньон в парке Вашловани, прорезанный около двух миллионов лет назад в древнем морском дне:
    в стенах до сих пор видны ракушки и кораллы.
  body: >-
    **Эти стены когда-то были дном моря; ущелье прорезало их около двух миллионов лет назад, и сегодня
    вы едете по нему на внедорожнике, а из стен на вас смотрят ракушки и кораллы.**


    Пантишара — сухой каньон в национальном парке Вашловани, в дальнем юго-восточном углу Грузии у границы
    с Азербайджаном, и один из официальных маркированных маршрутов парка. Никаких ворот, которые возвестили
    бы о прибытии, здесь нет. Первый знак — кордон рейнджеров с домиками, информационными щитами и смотровой
    площадкой, откуда видно парк, водохранилище и далёкую границу. Отсюда 500-метровая Тропа старейшего
    дерева уводит на край Вашлованского строгого заповедника, к диким фисташковым деревьям, некоторым
    из которых около 400 лет.


    За второй смотровой площадкой земля становится песчанее и суше, пологие холмы заостряются в зубчатые
    обрывы грузинских бедлендов, и колея спускается в каньон. Ехать по нему — всё равно что следовать
    руслу без реки: камни, потом липкая глина, а бледные стены то сходятся, то расступаются вновь.


    Выйдите из машины и присмотритесь к камню. В пластах — морские отложения: кораллы, раковины и окаменевшие
    ракообразные, оставленные отступившим морем. Это древнее морское дно Алесилеби, и в нём нашли кости
    вымершего южного слона ростом около четырёх метров.


    Пешком маркированная петля Пантишара — Медвежье ущелье (Датвисхеви) тянется примерно на 2,5 км и занимает
    около двух часов.


    В полдень, среди растрескавшейся глины и зноя, вода здесь кажется невозможной. А потом вы замечаете
    раковину в стене рядом со своей ладонью.
  tip: >-
    Разрешение нужно всем. Оформите его в администрации охраняемых территорий Вашловани в Дедоплисцкаро:
    там вход оплачивают наличными и предъявляют паспорт, регистрационные документы на машину и планируемый
    маршрут; внутри парка держите паспорт при себе — его проверяет пограничная полиция. Прежде чем брать
    машину в прокат, получите от компании письменное подтверждение, что она разрешает въезд в Вашловани:
    некоторые это запрещают. Никогда не въезжайте после дождя: глина становится непроезжей в течение часа.
    Берите не меньше трёх литров воды на человека, шляпу и ботинки, закрывающие щиколотку, — гадюки здесь
    обычное дело; мобильной связи не ждите. Мягче всего весна и октябрь; в разгар лета бывает за 40°C.
  route: >-
    Из Тбилиси поезжайте на восток по S5 мимо Сагареджо, затем по Sh40 к Сигнахи и по Sh41 через Бодбе
    на Sh39 до Дедоплисцкаро: около 130–140 км асфальта и чуть больше двух часов. Здесь зарегистрируйтесь,
    заплатите и заправьтесь: за городом нет ни топлива, ни магазинов, ни мастерских. К югу от Дедоплисцкаро
    асфальт сменяется гравием, а затем двумя глинистыми колеями; до долины Пантишары ещё 40–50 км и два–два
    с половиной часа. Всего закладывайте около 190 км и 4 часа 45 минут. Нужна машина внедорожного класса:
    настоящий полноприводный внедорожник с высоким клиренсом и подходящей резиной, а не мягкий кроссовер.
fa:
  name: تنگهٔ پانتیشارا
  short: >-
    تنگه‌ای خشک در پارک ملی واشلووانی که حدود دو میلیون سال پیش در بستر دریایی کهن کنده شد؛ صدف‌ها و مرجان‌ها
    هنوز در دیواره‌هایش پیدایند.
  body: >-
    **این دیواره‌ها روزگاری کف دریا بودند؛ تنگه حدود دو میلیون سال پیش در دل آن‌ها کنده شد، و امروز با
    خودروی چهارچرخ‌محرک در آن می‌رانید و صدف‌ها و مرجان‌ها از دیواره‌ها به شما نگاه می‌کنند.**


    پانتیشارا تنگه‌ای خشک در پارک ملی واشلووانی است، در دورافتاده‌ترین گوشهٔ جنوب‌شرقی گرجستان نزدیک مرز
    آذربایجان، و یکی از مسیرهای رسمیِ نشانه‌گذاری‌شدهٔ پارک. هیچ دروازه‌ای به شما نمی‌گوید که رسیده‌اید.
    نخستین نشانه ایستگاه محیط‌بانان است، با کلبه‌ها، تابلوهای اطلاع‌رسانی و دیدگاهی رو به پارک، به سوی
    مخزن آب و مرز دوردست. از اینجا «مسیر کهن‌ترین درخت» به طول ۵۰۰ متر به حاشیهٔ ذخیره‌گاه طبیعیِ حفاظت‌شدهٔ
    مطلق واشلووانی می‌رود، میان درختان پستهٔ وحشی که برخی‌شان حدود ۴۰۰ سال دارند.


    پس از دیدگاه دوم، زمین شنی‌تر و خشک‌تر می‌شود، تپه‌های نرم و موج‌وار به صخره‌های دندانه‌دار هزاردره‌های
    گرجستان تیز می‌شوند، و راه به درون تنگه سرازیر می‌شود. راندن در آن مثل دنبال کردن بستر رودی است بی
    رود: سنگ، سپس رس چسبنده، و دیواره‌های رنگ‌پریده که تنگ می‌شوند و دوباره باز.


    پیاده شوید و از نزدیک به سنگ نگاه کنید. لایه‌ها رسوبات دریایی در دل دارند — مرجان‌ها، صدف‌ها و سخت‌پوستان
    سنگواره‌شده‌ای که با عقب‌نشینی دریا به جا مانده‌اند. این‌ها بسترهای دریایی آلسیلبی‌اند، و از دلشان
    استخوان‌های فیل جنوبیِ منقرض‌شده‌ای با حدود چهار متر بلندی بیرون آمده است.


    حلقهٔ پیاده‌روی نشانه‌گذاری‌شدهٔ پانتیشارا–درهٔ خرس (داتویسخوی) حدود ۲٫۵ کیلومتر است و نزدیک دو ساعت
    طول می‌کشد.


    در نیمروز، میان رسِ ترک‌خورده و گرما، آب اینجا ناممکن به نظر می‌رسد. آنگاه صدفی را در دیواره، کنار
    دستتان، می‌بینید.
  tip: >-
    همه به مجوز نیاز دارند. آن را در ادارهٔ مناطق حفاظت‌شدهٔ واشلووانی در ددوپلیستسکارو بگیرید؛ آنجا ورودیه
    را نقد می‌پردازید و گذرنامه، مدارک ثبت خودرو و مسیر برنامه‌ریزی‌شده را نشان می‌دهید. گذرنامه را درون
    پارک همراه داشته باشید، چون پلیس مرزی بازرسی می‌کند. پیش از کرایهٔ خودرو، کتباً از شرکت اجاره تأیید
    بگیرید که اجازهٔ ورود خودرو به واشلووانی را می‌دهد؛ برخی شرکت‌ها آن را ممنوع کرده‌اند. هرگز پس از
    باران وارد نشوید: رس در عرض یک ساعت غیرقابل‌عبور می‌شود. دست‌کم سه لیتر آب برای هر نفر، کلاه و پوتینی
    که مچ پا را بپوشاند همراه ببرید، چون افعی فراوان است، و انتظار آنتن موبایل نداشته باشید. بهار و اکتبر
    ملایم‌ترین فصل‌هایند؛ در چلهٔ تابستان دما از ۴۰°C می‌گذرد.
  route: >-
    از تفلیس مسیر S5 را به سوی شرق، از کنار ساگارجو، بگیرید، سپس Sh40 را به سوی سیغناغی و Sh41 را از راه
    بودبه تا Sh39 و ددوپلیستسکارو: حدود ۱۳۰–۱۴۰ کیلومتر آسفالت و کمی بیش از دو ساعت. همین‌جا ثبت‌نام کنید،
    هزینه را بپردازید و باک را پر کنید، چون پس از شهر نه سوختی هست، نه فروشگاهی، نه تعمیرگاهی. جنوبِ ددوپلیستسکارو
    آسفالت جای خود را به شن‌ریزه و سپس به دو شیار رسی می‌دهد؛ تا درهٔ پانتیشارا ۴۰–۵۰ کیلومتر و دو تا
    دو ساعت و نیم دیگر راه است. روی هم حدود ۱۹۰ کیلومتر و ۴ ساعت و ۴۵ دقیقه در نظر بگیرید. این مسیر خودروی
    ردهٔ آفرود می‌خواهد: یک خودروی چهارچرخ‌محرک واقعی با فاصلهٔ زیاد از زمین و لاستیک مناسب، نه یک کراس‌اوور
    نرم.
he:
  name: קניון פנטישרה
  short: >-
    קניון יבש בגן הלאומי ואשלובני, שנחצב לפני כשני מיליון שנה בקרקעית ים עתיקה; צדפים ואלמוגים עדיין נראים
    בקירותיו.
  body: >-
    **הקירות האלה היו פעם קרקעית ים; הערוץ נחצב בהם לפני כשני מיליון שנה, והיום נוסעים בו ברכב שטח, וצדפים
    ואלמוגים מביטים בכם מן הקירות.**


    פנטישרה הוא קניון יבש בגן הלאומי ואשלובני, בפינה הדרום-מזרחית הנידחת של גאורגיה סמוך לגבול אזרבייג'ן,
    ואחד המסלולים המסומנים הרשמיים של הפארק. אין שער שיבשר לכם שהגעתם. הסימן הראשון הוא תחנת הפקחים, עם
    בקתות, שלטי מידע ונקודת תצפית הפונה אל הפארק, אל המאגר ואל הגבול הרחוק. מכאן מוביל "שביל העץ הזקן
    ביותר", באורך 500 מטר, אל שולי שמורת הטבע המוגנת בקפדנות של ואשלובני, בין עצי פיסטוק בר, שחלקם בני
    כ-400 שנה.


    מעבר לנקודת תצפית שנייה הקרקע נעשית חולית ויבשה יותר, הגבעות המעוגלות מתחדדות לצוקים המשוננים של הבתרונות
    הגאורגיים, והדרך יורדת אל הקניון. הנסיעה בו דומה למעקב אחר אפיק נהר בלי נהר: אבנים, אחר כך חרסית דביקה,
    והקירות החיוורים נסגרים ונפתחים שוב.


    רדו מהרכב והתבוננו מקרוב בסלע. השכבות אוצרות משקע ימי — אלמוגים, צדפים וסרטנאים מאובנים שנותרו כשהים
    נסוג. אלה קרקעיות הים של אלסילבי, ונמצאו בהן עצמותיו של פיל דרומי נכחד שגובהו כארבעה מטרים.


    ברגל, המסלול המעגלי המסומן פנטישרה–ערוץ הדוב (דטוויסחווי) נמשך כ-2.5 ק"מ ואורך כשעתיים.


    בצהריים, בין החרסית הסדוקה לחום, נדמה שמים לא ייתכנו כאן. ואז אתם מבחינים בצדף בקיר, ממש ליד כף ידכם.
  tip: >-
    כל אחד צריך היתר. הסדירו אותו במנהלת האזורים המוגנים של ואשלובני בדדופליסצקרו, שם משלמים את דמי הכניסה
    במזומן ומציגים דרכון, תעודת רישום של הרכב ומסלול מתוכנן; החזיקו את הדרכון עליכם בתוך הפארק, לבדיקות
    של משטרת הגבולות. לפני שאתם שוכרים רכב, קבלו אישור בכתב שחברת ההשכרה מתירה להכניס אותו לוואשלובני,
    כי יש חברות שאוסרות זאת. לעולם אל תיכנסו אחרי גשם: החרסית הופכת לבלתי עבירה בתוך שעה. קחו לפחות שלושה
    ליטרים מים לאדם, כובע ונעליים גבוהות המכסות את הקרסול, כי צפעים נפוצים כאן, ואל תצפו לקליטה סלולרית.
    האביב ואוקטובר הם העונות הנוחות ביותר; באמצע הקיץ החום עולה על 40°C.
  route: >-
    מטביליסי קחו את כביש S5 מזרחה מעבר לסגרג'ו, את Sh40 לכיוון סיגנאגי ואת Sh41 דרך בודבה אל Sh39 ודדופליסצקרו:
    כ-130–140 ק"מ של אספלט ומעט יותר משעתיים. כאן נרשמים, משלמים ומתדלקים, כי מעבר לעיר אין דלק, חנות
    או מוסך. מדרום לדדופליסצקרו האספלט מתחלף בחצץ ואחר כך בשני תלמים של חרסית; עוד 40–50 ק"מ ושעתיים עד
    שעתיים וחצי עד עמק פנטישרה. בסך הכול הקצו כ-190 ק"מ ו-4 שעות ו-45 דקות. נדרש רכב מקטגוריית שטח: רכב
    אמיתי בעל הנעה כפולה עם מרווח גחון גבוה וצמיגים מתאימים, לא קרוסאובר רך.
ar:
  name: أخدود بانتيشارا
  short: >-
    أخدود جاف في منتزه فاشلوفاني الوطني، شُقّ قبل نحو مليونَي عام في قاع بحر قديم، ولا تزال أصدافه ومرجانه
    تطلّ من جدرانه.
  body: >-
    **كانت هذه الجدران يومًا قاعَ بحر؛ وقد شُقّ الأخدود فيها قبل نحو مليونَي عام، واليوم تقود فيه بسيارة
    دفع رباعي، وتطلّ عليك الأصداف والمرجان من الجدران.**


    بانتيشارا أخدود جاف في منتزه فاشلوفاني الوطني، في أقصى الركن الجنوبي الشرقي من جورجيا قرب الحدود الأذربيجانية،
    وأحد المسارات الرسمية المعلَّمة في المنتزه. لا بوابة تخبرك بأنك وصلت. أول علامة هي مركز الحرّاس، بأكواخه
    ولوحاته الإرشادية ومنصة مشاهدة تطل على المنتزه، نحو الخزان المائي والحدود البعيدة. من هنا يقود «درب
    أقدم شجرة»، وطوله 500 متر، إلى طرف محمية فاشلوفاني الطبيعية الصارمة، بين أشجار الفستق البري، وبعضها
    يبلغ من العمر نحو 400 عام.


    بعد منصة مشاهدة ثانية تصير الأرض أكثر رملًا وجفافًا، وتحتدّ التلال المتموجة إلى منحدرات مسنّنة من
    الأراضي الوعرة الجورجية (البادلاندز)، وينحدر المسار إلى الأخدود. قيادة السيارة فيه أشبه باتباع مجرى
    نهر بلا نهر: حجارة، ثم طين لزج، والجدران الشاحبة تنغلق ثم تنفرج من جديد.


    انزل وتأمّل الصخر عن قرب. تحفظ الطبقات رواسب بحرية — مرجانًا وأصدافًا وقشريات متحجرة خلّفها البحر
    حين انحسر. هذه هي قيعان أليسيليبي البحرية، وقد عُثر فيها على عظام فيل جنوبي منقرض كان ارتفاعه نحو
    أربعة أمتار.


    سيرًا على الأقدام، تمتد الحلقة المعلَّمة بانتيشارا–وادي الدب (داتفيسخيفي) نحو 2.5 كم وتستغرق قرابة
    ساعتين.


    عند الظهيرة، بين الطين المتشقق والحر، يبدو الماء هنا مستحيلًا. ثم تلمح صدفة في الجدار بجوار يدك.
  tip: >-
    الجميع بحاجة إلى تصريح. استخرجه من إدارة مناطق فاشلوفاني المحمية في ديدوبليستسكارو، حيث تدفع رسم الدخول
    نقدًا وتُبرز جواز سفرك ووثائق تسجيل السيارة ومسارًا مخططًا؛ واحتفظ بجوازك معك داخل المنتزه لنقاط تفتيش
    شرطة الحدود. قبل الاستئجار، احصل على تأكيد مكتوب من شركة التأجير بأنها تسمح بدخول سيارتها إلى فاشلوفاني،
    فبعض الشركات يمنع ذلك. لا تدخل أبدًا بعد المطر: يصير الطين غير سالك في غضون ساعة. احمل ثلاثة لترات
    من الماء على الأقل لكل شخص، وقبعة، وحذاءً يغطي الكاحل، فالأفاعي شائعة هنا، ولا تتوقع تغطية للهاتف
    المحمول. الربيع وأكتوبر ألطف الأوقات؛ أما منتصف الصيف فتتجاوز فيه الحرارة 40°C.
  route: >-
    من تبليسي خذ الطريق S5 شرقًا متجاوزًا ساغاريجو، ثم Sh40 نحو سيغناغي وSh41 عبر بودبي إلى Sh39 وديدوبليستسكارو:
    نحو 130–140 كم من الأسفلت وما يزيد قليلًا على ساعتين. سجّل هنا وادفع واملأ الخزان، إذ لا وقود ولا
    متجر ولا ورشة بعد البلدة. جنوب ديدوبليستسكارو يُفسح الأسفلت المجال للحصى ثم لأثرين متوازيين محفورين
    في الطين؛ وتبقى 40–50 كم أخرى وساعتان إلى ساعتين ونصف حتى وادي بانتيشارا. خصّص نحو 190 كم و4 ساعات
    و45 دقيقة إجمالًا. يتطلب هذا مركبة من فئة الطرق الوعرة: سيارة دفع رباعي حقيقية بخلوص أرضي مرتفع وإطارات
    مناسبة، لا سيارة كروس أوفر ناعمة.
