ka:
  name: ანანურის ციხე-კომპლექსი
  short: XVII საუკუნის ციხე ჟინვალის წყალსაცავის ნაპირზე — საქართველოს სამხედრო გზის ყველაზე ფოტოგენური
    გაჩერება.
  body: >-
    **ანანური ის ადგილია, სადაც ყველა ჩერდება ყაზბეგისკენ მიმავალ გზაზე** — და სამართლიანად. ციხე ჟინვალის
    წყალსაცავის ზემოთ, კლდოვან კონცხზე დგას, ქვედა კედლები პირდაპირ ფირუზისფერ წყალში ეშვება და შედეგი
    ისეთია, თითქოს დეკორაცია იყოს.


    კომპლექსი XIII საუკუნიდან ვითარდებოდა, დღევანდელი სახე კი ძირითადად XVII საუკუნისაა. ის არაგვის ერისთავების
    რეზიდენცია და თავდაცვის კვანძი იყო — აქედან კონტროლდებოდა არაგვის ხეობა, ანუ ჩრდილოეთისკენ მიმავალი
    ერთადერთი გზა. 1739 წელს ქსნის ერისთავმა ციხე ალყაში მოაქცია და დაწვა; ხანძრის კვალი კოშკის კედლებზე
    დღემდე ჩანს.


    გალავანში სამი ძირითადი ნაგებობაა:


    - **ღვთისმშობლის ეკლესია** (1689) — მდიდრული ქვის კვეთით სამხრეთ ფასადზე, ვაზის ჯვრით და ორი ლომით

    - **ხიდიკარის ეკლესია** — უფრო ძველი და მარტივი, ფრესკების ნაშთებით

    - **შეუპოვარი კოშკი** — კიბით ასასვლელი, ზემოდან წყალსაცავის სრული ხედით


    ეკლესიის კედლის კვეთა ცალკე მისახედია: ეს ქართული გვიანი შუასაუკუნეების დეკორის საუკეთესო მაგალითებშია.
    ზაფხულის ბოლოს წყალსაცავის დონე ეცემა და ციხე უფრო მაღლა რჩება; გაზაფხულზე კი წყალი კედლებთან ახლოს
    ადის.
  tip: >-
    დაახლოებით ერთი საათი საკმარისია. კოშკზე ასვლა ვიწრო, ციცაბო ქვის კიბით ხდება, მოაჯირის გარეშე — სველ
    ამინდში ან ბავშვთან ერთად ფრთხილად. ეკლესიაში შესვლისას ჩაცმის წესები მოქმედებს, თავსაფრები კართან
    დევს. პარკინგი გზის პირას უფასოა, იქვე ჯიხურებია ჩურჩხელით, თაფლით და ყავით, ტუალეტიც არის. ზამთარში
    ქარი ძლიერია და კედლებზე ყინულია — ჩექმა გამოგადგება.
  route: >-
    თბილისიდან გახვალ საქართველოს სამხედრო გზით (E117) მცხეთაზე გავლით, შემდეგ ჟინვალის მიმართულებით.
    70 კმ, დაახლოებით საათი და ოცი წუთი. გზა ბოლომდე ასფალტია და კარგ მდგომარეობაშია, თუმცა ჟინვალის შემდეგ
    ხდება ვიწრო და კლდეში ჩაჭრილი — გამოსწრება ფრთხილად. ციხე პირდაპირ გზის მარჯვენა მხარესაა, ნიშანი
    და დიდი პარკინგი მკაფიოდ ჩანს. საწვავი ნატახტარსა და ჟინვალში აიღე. ეკონომ-კლასის ავტომობილი სავსებით
    საკმარისია მთელი წლის განმავლობაში.
en:
  name: Ananuri Fortress
  short: >-
    A 17th-century castle on the shore of the Zhinvali reservoir — the most photogenic stop on the Georgian
    Military Highway.
  body: >-
    **Ananuri is where everyone stops on the way to Kazbegi,** and deservedly so. The fortress stands
    on a rocky spur above the Zhinvali reservoir, its lower walls dropping straight into turquoise water,
    and the whole composition looks almost staged.


    The site developed from the 13th century onwards, but what stands today is largely 17th century. It
    was the seat of the Dukes of Aragvi and a defensive knot controlling the Aragvi valley — in other
    words, the only road north. In 1739 the rival Duke of Ksani besieged and burned it; scorch marks are
    still visible on the tower walls.


    Three main structures sit inside the curtain wall:


    - The **Church of the Assumption** (1689), with lavish stone carving on its south facade, a vine cross
    and two lions

    - The older, plainer **Church of the Virgin**, with fragments of fresco surviving inside

    - The square **keep**, climbable by internal stairs, with a full view over the reservoir from the
    top


    The carving on the Assumption facade deserves a slow look; it is among the best examples of late medieval
    Georgian decoration anywhere. Water levels change through the year: in spring the reservoir laps close
    to the walls, while by late summer it drops and leaves a wide band of exposed shoreline.
  tip: >-
    An hour covers the site comfortably. The climb up the keep is a narrow, steep stone stair with no
    handrail, so take care in wet weather or with children. Dress rules apply inside the churches, and
    scarves are left by the door. Parking beside the road is free, and there are stalls selling churchkhela,
    honey and coffee, plus toilets. In winter the wind is fierce and the walls ice over, so proper boots
    make a difference.
  route: >-
    Head north from Tbilisi on the Georgian Military Highway (E117) past Mtskheta and on towards Zhinvali
    — 70 km, about an hour and twenty minutes. The road is asphalt throughout and in good condition, though
    beyond Zhinvali it narrows and is cut into the cliff, so overtake with care. The fortress is directly
    on the right-hand side with a clear sign and a large car park. Fuel is available at Natakhtari and
    Zhinvali. An economy car is entirely sufficient all year round.
ru:
  name: Крепость Ананури
  short: Замок XVII века на берегу Жинвальского водохранилища — самая фотогеничная остановка Военно-Грузинской
    дороги.
  body: >-
    **У Ананури останавливаются все, кто едет в Казбеги,** и вполне заслуженно. Крепость стоит на скалистом
    мысу над Жинвальским водохранилищем, нижние стены уходят прямо в бирюзовую воду, и вся композиция
    выглядит почти постановочной.


    Комплекс развивался с XIII века, но то, что стоит сегодня, — в основном XVII век. Это была резиденция
    арагвских эриставов и оборонительный узел, контролировавший Арагвское ущелье, то есть единственную
    дорогу на север. В 1739 году ксанский эристав осадил и сжёг крепость; следы пожара на стенах башни
    видны до сих пор.


    Внутри ограды три основных сооружения:


    - **Церковь Успения** (1689) с богатой каменной резьбой на южном фасаде, виноградным крестом и двумя
    львами

    - Более древняя и простая **церковь Богородицы** с фрагментами фресок

    - Квадратный **донжон** с внутренней лестницей и полным видом на водохранилище сверху


    Резьбу на фасаде Успенской церкви стоит рассмотреть неспешно: это один из лучших образцов позднесредневекового
    грузинского декора. Уровень воды меняется в течение года: весной водохранилище подходит к самым стенам,
    а к концу лета опускается, обнажая широкую полосу берега.
  tip: >-
    Часа на осмотр достаточно. Подъём на башню — узкая крутая каменная лестница без перил, в дождь и с
    детьми будьте осторожны. В церквях действуют правила одежды, платки лежат у входа. Парковка вдоль
    дороги бесплатная, рядом киоски с чурчхелой, мёдом и кофе, есть туалет. Зимой здесь резкий ветер,
    а стены обледеневают, так что нормальная обувь заметно помогает.
  route: >-
    Из Тбилиси на север по Военно-Грузинской дороге (E117) мимо Мцхеты в сторону Жинвали — 70 км, примерно
    час двадцать. Дорога асфальтированная и в хорошем состоянии, но после Жинвали сужается и врезается
    в скалу, так что обгонять надо аккуратно. Крепость стоит прямо справа от дороги, указатель и большая
    парковка хорошо видны. Заправиться можно в Натахтари и Жинвали. Машины эконом-класса достаточно круглый
    год.
fa:
  name: قلعهٔ آنانوری
  short: قلعه‌ای از سدهٔ هفدهم بر کرانهٔ آبگیر ژینوالی — فوتوژنیک‌ترین توقف بزرگراه نظامی گرجستان.
  body: >-
    **آنانوری جایی است که همه در راه کازبگی توقف می‌کنند،** و به‌حق. قلعه بر زبانه‌ای صخره‌ای بالای آبگیر
    ژینوالی ایستاده، دیوارهای پایینی‌اش مستقیم در آب فیروزه‌ای فرو می‌روند و کل ترکیب چنان است که انگار
    صحنه‌آرایی شده باشد.


    مجموعه از سدهٔ سیزدهم به بعد شکل گرفت، اما آنچه امروز برپاست عمدتاً به سدهٔ هفدهم بازمی‌گردد. اینجا
    مقر دوک‌های آراگوی و گره‌ای دفاعی بود که درهٔ آراگوی را کنترل می‌کرد — یعنی تنها راه شمال. در 1739
    دوک رقیبِ کسانی آن را محاصره کرد و سوزاند؛ رد آتش هنوز روی دیوارهای برج پیداست.


    درون حصار سه بنای اصلی قرار دارد:


    - **کلیسای خوابیدگی مریم** (1689) با کنده‌کاری سنگی پرکار روی نمای جنوبی، صلیبی از تاک و دو شیر

    - **کلیسای مریم مقدس**، کهن‌تر و ساده‌تر، با پاره‌هایی از فرسک که در داخل مانده است

    - **برج نگهبانی مربع**، با پلکان داخلی قابل صعود و منظرهٔ کامل آبگیر از بالا


    کنده‌کاری نمای کلیسای خوابیدگی ارزش نگاه آهسته دارد؛ از بهترین نمونه‌های تزیین گرجی اواخر سده‌های
    میانه در هر کجاست. سطح آب در طول سال تغییر می‌کند: در بهار آبگیر تا نزدیک دیوارها بالا می‌آید و تا
    اواخر تابستان پایین می‌رود و نواری پهن از ساحل عریان به جا می‌گذارد.
  tip: >-
    یک ساعت به‌راحتی کل محوطه را پوشش می‌دهد. بالا رفتن از برج با پلکان سنگی باریک و تند و بدون نرده است،
    پس در هوای بارانی یا همراه کودک مراقب باشید. در کلیساها قواعد پوشش برقرار است و شال‌ها کنار در گذاشته
    شده‌اند. پارکینگ کنار جاده رایگان است و دکه‌هایی با چورچخلا، عسل و قهوه و نیز سرویس بهداشتی هست. در
    زمستان باد تند است و دیوارها یخ می‌زنند، پس کفش مناسب واقعاً فرق می‌کند.
  route: >-
    از تفلیس به شمال روی بزرگراه نظامی گرجستان (E117) از کنار متسختا و به سوی ژینوالی بروید — 70 کیلومتر،
    حدود یک ساعت و بیست دقیقه. جاده تا انتها آسفالت و در وضعیت خوبی است، هرچند پس از ژینوالی باریک می‌شود
    و در دل صخره بریده شده، پس با احتیاط سبقت بگیرید. قلعه درست سمت راست جاده با تابلوی روشن و پارکینگ
    بزرگ قرار دارد. سوخت در ناتاختاری و ژینوالی موجود است. خودروی اقتصادی در تمام سال کاملاً کافی است.
he:
  name: מבצר אנאנורי
  short: טירה מן המאה ה-17 על גדת מאגר ז'ינוואלי — העצירה הפוטוגנית ביותר בכביש הצבא הגאורגי.
  body: >-
    **באנאנורי עוצרים כולם בדרך לקזבגי,** ובצדק. המבצר עומד על לשון סלע מעל מאגר ז'ינוואלי, החומות התחתונות
    שלו יורדות היישר אל המים הטורקיז, וכל ההרכב נראה כמעט מבוים.


    האתר התפתח מן המאה ה-13 ואילך, אבל מה שעומד היום הוא ברובו מן המאה ה-17. זה היה מושבם של דוכסי האראגווי
    וצומת הגנה ששלט בעמק האראגווי — כלומר בדרך היחידה צפונה. ב-1739 צר עליו דוכס קסני היריב ושרף אותו;
    סימני הפיח נראים עד היום על חומות המגדל.


    בתוך חומת ההיקף עומדים שלושה מבנים עיקריים:


    - **כנסיית ההירדמות** (1689), עם גילוף אבן עשיר בחזית הדרומית, צלב גפן ושני אריות

    - **כנסיית הבתולה**, עתיקה ופשוטה יותר, ובתוכה שרידי ציורי קיר

    - **המגדל המרובע**, שאפשר לטפס בו במדרגות פנימיות ולראות מלמעלה את המאגר כולו


    הגילוף בחזית כנסיית ההירדמות ראוי להתבוננות איטית; הוא בין הדוגמאות הטובות ביותר לעיטור גאורגי מסוף
    ימי הביניים בכל מקום. מפלס המים משתנה במהלך השנה: באביב המאגר מלקק את החומות, ולקראת סוף הקיץ הוא
    יורד ומותיר רצועת חוף חשופה ורחבה.
  tip: >-
    שעה מכסה את האתר בנוחות. הטיפוס במגדל הוא במדרגות אבן צרות ותלולות בלי מעקה, לכן היזהרו במזג אוויר
    רטוב או עם ילדים. בכנסיות חלים כללי לבוש, ומטפחות מונחות ליד הדלת. החניה לצד הכביש חינם, ויש דוכנים
    שמוכרים צ'ורצ'חלה, דבש וקפה, וגם שירותים. בחורף הרוח עזה והחומות מתכסות קרח, ולכן נעליים טובות עושות
    הבדל.
  route: >-
    צאו צפונה מטביליסי בכביש הצבא הגאורגי (E117) דרך מצחתה והלאה לכיוון ז'ינוואלי — 70 ק״מ, כשעה ועשרים.
    הכביש סלול לכל אורכו ובמצב טוב, אך מעבר לז'ינוואלי הוא מצטמצם וחצוב בצוק, לכן עקפו בזהירות. המבצר
    נמצא ישירות בצד ימין, עם שילוט ברור וחניון גדול. דלק אפשר למצוא בנטאחטארי ובז'ינוואלי. רכב חסכוני
    מספיק לחלוטין בכל ימות השנה.
ar:
  name: قلعة أنانوري
  short: قلعة من القرن السابع عشر على ضفة خزان جينفالي — أكثر محطات الطريق العسكري الجورجي إثارة للتصوير.
  body: >-
    **عند أنانوري يتوقف الجميع في الطريق إلى كازبيغي،** وعن جدارة. تقوم القلعة على نتوء صخري فوق خزان
    جينفالي، وتنزل أسوارها السفلى مباشرة في الماء الفيروزي، ويبدو المشهد كله كأنه مُعدّ للتصوير.


    تطور الموقع منذ القرن الثالث عشر فصاعداً، لكن ما يقف اليوم يعود في معظمه إلى القرن السابع عشر. كان
    مقراً لدوقات أراغفي وعقدة دفاعية تتحكم في وادي أراغفي، أي في الطريق الوحيد نحو الشمال. وفي عام 1739
    حاصرها دوق كساني المنافس وأحرقها؛ وما زالت آثار الحريق ظاهرة على جدران البرج.


    وداخل السور ثلاثة مبانٍ رئيسية:


    - **كنيسة رقاد العذراء** (1689)، بنقش حجري غني على واجهتها الجنوبية، وصليب من الكرمة وأسدان

    - **كنيسة العذراء**، وهي أقدم وأبسط، وفي داخلها بقايا رسوم جدارية

    - **البرج المربع**، يُصعد إليه بدرج داخلي وتُرى منه مساحة الخزان كاملة


    ويستحق النقش على واجهة كنيسة الرقاد نظرة متأنية؛ فهو من أفضل نماذج الزخرفة الجورجية في أواخر العصور
    الوسطى في أي مكان. ويتغير منسوب الماء على مدار السنة: ففي الربيع يلامس الخزان الأسوار، ومع أواخر الصيف
    ينحسر تاركاً شريطاً عريضاً من الشاطئ المكشوف.
  tip: >-
    ساعة واحدة تغطي الموقع براحة. والصعود إلى البرج يتم على درج حجري ضيق وحاد بلا درابزين، فانتبه في الطقس
    الرطب أو مع الأطفال. وتُطبق قواعد اللباس داخل الكنيستين، والأغطية موضوعة عند الباب. الوقوف بجانب الطريق
    مجاني، وهناك أكشاك تبيع التشورتشخيلا والعسل والقهوة، ودورات مياه أيضاً. وفي الشتاء تشتد الريح ويتجمد
    الجليد على الأسوار، فالحذاء المناسب يحدث فرقاً.
  route: >-
    اتجه شمالاً من تبليسي على الطريق العسكري الجورجي (E117) مروراً بمتسخيتا نحو جينفالي — 70 كم، نحو ساعة
    وعشرين دقيقة. الطريق معبّد على امتداده وبحالة جيدة، غير أنه بعد جينفالي يضيق ويصبح محفوراً في الجرف،
    فتجاوز بحذر. القلعة على يمين الطريق مباشرة، بلافتة واضحة وموقف كبير. والوقود متوفر في ناتاختاري وجينفالي.
    وسيارة اقتصادية تكفي تماماً على مدار السنة.
