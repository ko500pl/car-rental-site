ka:
  name: ანანურის ციხე-კომპლექსი
  short: >-
    ორი ციხე, ორი ეკლესია და საზარელი წარსულის მქონე კოშკი ჟინვალის წყალსაცავის თავზე — პირველი დიდი გაჩერება
    ყაზბეგისკენ მიმავალ გზაზე.
  body: >-
    **გზიდან ანანური ღია ბარათს ჰგავს — გუმბათები და ქონგურები ჟინვალის ცისფერ-მომწვანო წყალსაცავზე, —
    სანამ არ გაიგებთ, რა მოხდა მის უმაღლეს კოშკში.**


    ციხე არაგვის ერისთავთა სიმაგრე იყო და არაგვის ხეობას — კავკასიონის უღელტეხილებისკენ მიმავალ გზას —
    დარაჯობდა. რაც დღეს დგას, ძირითადად XVI-XVIII საუკუნეებისაა: კოშკებიანი გალავნით შემოზღუდული ზედა
    ციხე და ქვედა ციხის ნანგრევები. უძველესი ნაგებობა შუაში მდგარი წვრილი „ხევსურული კოშკია“, XIV-XV საუკუნეებისა,
    საფეხურებიანი ქვის პირამიდით დაგვირგვინებული.


    1739 წელს, როგორც მემატიანე პაპუნა ორბელიანი მოგვითხრობს, ქსნის ერისთავი შანშე არაგვის ერისთავებზე
    შურის საძიებლად მოვიდა — მათ მისი ძმის ცოლი შეურაცხყვეს. დაქირავებული ლეკების შემწეობით ანანურს ალყა
    შემოარტყა და წყალსადენი გადაუჭრა. ზაფხული იდგა; ციხეში გამაგრებულები სიცოცხლის შენარჩუნების ფიცის
    სანაცვლოდ დანებდნენ. ფიცი გატეხეს: ერისთავი ბარძიმი მოკლეს, „შეუპოვარ“ კოშკს კი, სადაც მისი შვილი
    იყო გამაგრებული, შიგ მყოფებიანად ცეცხლი წაუკიდეს. არაგველებმა კოშკი ამოქოლეს და სამარხად აქციეს. არქეოლოგებმა
    ის 1939 წელს გახსნეს და შიგ მოზრდილთა და ბავშვთა დამწვარი ძვლები იპოვეს.


    მთავარი, ღვთისმშობლის ეკლესია 1689 წელს აიგო — სამხრეთ კედელზე ამოკვეთილი წარწერის თანახმად, ერთ-ერთი
    მდივანბეგის, უზენაესი მსაჯულის, დაკვეთით. სწორედ ეს სამხრეთის ფასადია გვიანი შუა საუკუნეების საქართველოს
    ერთ-ერთი უმდიდრესი: კუდებგადახლართულ ორ ვეშაპზე აღმართული დიდი ჯვარი, მთავარანგელოზთა ფიგურებზე დაყრდნობილი,
    მტევნებით დახუნძლული ვაზი, რტოებზე შემომსხდარი მტრედები, ზემოთ ქერუბიმები, სარკმლების თავზე კი ჯაჭვით
    დაბმული ლომები. უფრო ძველ და მარტივ ღვთაების ეკლესიაში ქვის ბალდახინი დგას, რომელიც 1674 წელს ანა-ხანუმ
    აბაშიძის ასულმა ააგო ნაადრევად გარდაცვლილი მეუღლის, ედიშერ ერისთავისთვის.


    წასვლამდე სამხრეთის ფასადს კიდევ ერთხელ შემოუარეთ: მტრედები ისევ ვაზზე სხედან — ხანძრამდე ორმოცდაათი
    წლით ადრე გამოკვეთილნი.
  tip: >-
    ციხის სანახავად ერთი საათი საკმარისია, ორი — თუ „შეუპოვარზე“ ახვალთ და დაყოვნდებით. კოშკის კიბე ვიწრო,
    ციცაბო და ბნელია, მოაჯირის გარეშე — სველ ამინდში ან ბავშვებთან ერთად ფრთხილად იყავით. თავსაფრები და
    მოსასხამები ჩვეულებრივ ეკლესიის კართან აწყვია. გზისპირა სადგომი უფასოა, ჯიხურებში ჩურჩხელას, თაფლსა
    და ყავას ყიდიან, ტუალეტიც არის. ყაზბეგისკენ მიმავალი ავტობუსები შუადღისკენ მოდიან, ამიტომ დილით ადრე
    ან ნაშუადღევს ჩამოდით. ზაფხულის ბოლოს წყალსაცავის დონე იკლებს და ფართო, შიშველ ნაპირს ტოვებს; ზამთარში
    წყლიდან მომავალი ქარი მჭრელია, საფეხურები კი იყინება.
  route: >-
    თბილისიდან S1 (E60) ავტომაგისტრალით გახვალთ და მცხეთის გავლისთანავე მარჯვნივ, S3-ზე — საქართველოს
    სამხედრო გზაზე (E117) — გადადით, სტეფანწმინდის მიმართულებით. ჩრდილოეთით ჟინვალის გავლით იარეთ; ქალაქის
    იქით გზა წყალსაცავს მიუყვება და ციხე მარჯვნივ, უშუალოდ გზის პირას დგას. სულ დაახლოებით 70 კმ და საათი
    და ოცი წუთია, ბოლომდე ასფალტზე — ეკონომ-კლასის მანქანა მთელი წელი საკმარისია. S3 რუსეთის საზღვრისკენ
    მიმავალი სატვირთოების მთავარი გზაა, ამიტომ წყალსაცავის ვიწრო მონაკვეთზე მოთმინებით გაუსწარით. გზაზე
    საწვავის სადგურები გვხვდება, ციხესთან კი სადგომი უფასოა.
en:
  name: Ananuri Fortress
  short: >-
    Two castles, two churches and a tower with a terrible past above the Zhinvali reservoir — the first
    great stop on the road to Kazbegi.
  body: >-
    **From the road Ananuri looks like a postcard — domes and battlements above the blue-green Zhinvali
    reservoir — until you learn what happened in its tallest tower.**


    The castle guarded the Aragvi valley, the road to the Caucasus passes, for the dukes of Aragvi. Most
    of it dates from the 16th–18th centuries: an upper citadel ringed by towered walls, and the ruins
    of a lower castle. The oldest building, the slender 14th–15th-century "Khevsur tower" at its heart,
    wears a stepped stone pyramid for a roof.


    In 1739, the chronicler Papuna Orbeliani tells, Shanshe, Duke of Ksani, came to avenge an outrage
    the Aragvi dukes had done to his brother's wife. With hired Lezgin fighters he besieged Ananuri and
    cut its water conduit. In the summer heat the defenders surrendered on a sworn promise of their lives.
    The oath was broken, Duke Bardzim was killed, and the great keep, Sheupovari — "the Indomitable" —
    where his son had held out, was set on fire with those inside. The Aragvians walled the tower up as
    a tomb. Archaeologists opened it in 1939 and found the burned bones of adults and children.


    The main Church of the Mother of God was built in 1689 for a mdivanbeg, a high judge, according to
    the inscription on its south wall. Its south front is among the richest in late medieval Georgia:
    a great cross rising from two dragons with twined tails, grapevines heavy with clusters resting on
    archangels, doves in the branches, cherubim above and chained lions over the windows. The older, plainer
    Church of the Godhead hides a stone canopy raised in 1674 by Ana-Khanum Abashidze for her husband
    Edisher Eristavi, who died too young.


    Walk round to the south front once more before you leave: the doves are still in the vine, carved
    fifty years before the fire.
  tip: >-
    An hour covers the site, two if you climb Sheupovari and linger. The tower's stairs are narrow, steep
    and dim, with no handrail, so take care in the wet or with children. Headscarves and wraps are usually
    left by the church doors. Roadside parking is free, and there are stalls selling churchkhela, honey
    and coffee, plus toilets. Coaches bound for Kazbegi crowd the site from late morning, so come early
    or late in the afternoon. By late summer the reservoir drops and leaves a wide band of bare shore;
    in winter the wind off the water is raw and the steps ice over.
  route: >-
    Leave Tbilisi on the S1 motorway (E60) and, just past Mtskheta, branch right onto the S3 — the Georgian
    Military Highway (E117), signed for Stepantsminda. Follow it north through Zhinvali; beyond the town
    the road runs along the reservoir, and the fortress stands directly beside it on the right. That is
    about 70 km and an hour and twenty minutes, asphalt all the way and fine for an economy car all year.
    The S3 is the main lorry route to the Russian border, so overtake with patience on the narrower reservoir
    stretch. There are filling stations along the way, and free parking at the fortress.
ru:
  name: Крепость Ананури
  short: >-
    Два замка, две церкви и башня со страшным прошлым над Жинвальским водохранилищем — первая большая
    остановка на пути в Казбеги.
  body: >-
    **С дороги Ананури похож на открытку — купола и зубчатые стены над сине-зелёной гладью Жинвальского
    водохранилища, — пока не узнаете, что случилось в его самой высокой башне.**


    Крепость стерегла для арагвских эриставов ущелье Арагви — путь к перевалам Кавказа. Большая её часть
    относится к XVI–XVIII векам: верхняя цитадель, опоясанная стенами с башнями, и руины нижнего замка.
    Древнейшая постройка — стройная «Хевсурская башня» XIV–XV веков в самом сердце крепости, увенчанная
    ступенчатой каменной пирамидой.


    В 1739 году, как рассказывает летописец Папуна Орбелиани, ксанский эристав Шанше пришёл отомстить
    за бесчестье, которое арагвские эриставы причинили жене его брата. С наёмными лезгинами он осадил
    Ананури и перерезал крепостной водовод. Изнемогая от летнего зноя, защитники сдались под клятву сохранить
    им жизнь. Клятву нарушили, эристав Бардзим был убит, а главную башню, Шеуповари — «Непокорную», где
    держался его сын, подожгли вместе с теми, кто был внутри. Арагвинцы замуровали башню, превратив её
    в гробницу. Археологи вскрыли её в 1939 году и нашли обгоревшие кости взрослых и детей.


    Главная церковь Богородицы построена в 1689 году для мдиванбега — верховного судьи, — как сообщает
    надпись на её южной стене. Её южный фасад — один из богатейших в позднесредневековой Грузии: огромный
    крест вырастает из двух драконов с переплетёнными хвостами, виноградные лозы, отяжелевшие от гроздьев,
    покоятся на архангелах, в ветвях сидят голуби, выше — херувимы, а над окнами — львы на цепях. Более
    старая и простая церковь Гвтаеба (Божества) скрывает каменный балдахин, который в 1674 году воздвигла
    Ана-Ханум Абашидзе для своего мужа Эдишера Эристави, умершего слишком молодым.


    Перед отъездом ещё раз обойдите церковь к южному фасаду: голуби по-прежнему сидят в лозе, вырезанные
    за пятьдесят лет до пожара.
  tip: >-
    На осмотр хватит часа, двух — если подниматься на Шеуповари и не спешить. Лестницы башни узкие, крутые
    и тёмные, без перил, так что будьте осторожны в сырость и с детьми. Платки и накидки обычно лежат
    у дверей церквей. Парковка у дороги бесплатная, есть лотки с чурчхелой, мёдом и кофе, а также туалеты.
    С позднего утра крепость заполняют автобусы, идущие в Казбеги, так что приезжайте рано или ближе к
    вечеру. К концу лета вода в водохранилище спадает, обнажая широкую полосу голого берега; зимой ветер
    с воды пронизывает насквозь, а ступени обледеневают.
  route: >-
    Выезжайте из Тбилиси по автомагистрали S1 (E60) и сразу за Мцхетой уходите направо на S3 — Военно-Грузинскую
    дорогу (E117), по указателям на Степанцминду. Езжайте по ней на север через Жинвали; за посёлком дорога
    идёт вдоль водохранилища, и крепость стоит прямо у неё, справа. Это около 70 км и час двадцать, асфальт
    на всём пути, машина эконом-класса подойдёт круглый год. S3 — главный грузовой путь к российской границе,
    так что на узком участке вдоль водохранилища обгоняйте терпеливо. Заправки есть по пути, парковка
    у крепости бесплатная.
fa:
  name: قلعهٔ آنانوری
  short: دو دژ، دو کلیسا و برجی با گذشته‌ای هولناک بر فراز آبگیر ژینوالی — نخستین توقف بزرگ در راه کازبگی.
  body: >-
    **آنانوری از جاده به کارت‌پستالی می‌ماند — گنبدها و کنگره‌ها بالای آب سبزآبی آبگیر ژینوالی — تا وقتی
    بدانید در بلندترین برجش چه گذشت.**


    این دژ درهٔ آراگوی، راه گردنه‌های قفقاز، را برای دوک‌های آراگوی (اریستاوها) پاس می‌داشت. بیشتر آن
    از سده‌های شانزدهم تا هجدهم است: ارگی بالایی در حلقهٔ باروهای برج‌دار، و ویرانه‌های دژی پایینی. کهن‌ترین
    بنا، «برج خِوسوری» باریک و بلند از سده‌های چهاردهم تا پانزدهم در دل مجموعه، بامی به شکل هرم سنگی پلکانی
    بر سر دارد.


    در ۱۷۳۹، به روایت وقایع‌نگار پاپونا اوربلیانی، شانشه، دوک کسانی، آمد تا انتقام بی‌حرمتی‌ای را بگیرد
    که دوک‌های آراگوی به همسر برادرش روا داشته بودند. او با جنگجویان مزدور لزگی آنانوری را محاصره کرد
    و آبراههٔ دژ را برید. در گرمای تابستان، مدافعان با این پیمان سوگندخورده که جانشان در امان بماند تسلیم
    شدند. سوگند شکسته شد، دوک باردزیم کشته شد، و برج بزرگ، شئوپواری — «سرکش» — که پسرش در آن پایداری کرده
    بود، با همهٔ کسانی که درونش بودند به آتش کشیده شد. مردم آراگوی برج را دیوارچین کردند و آرامگاهش ساختند.
    باستان‌شناسان در ۱۹۳۹ آن را گشودند و استخوان‌های سوختهٔ بزرگسالان و کودکان را یافتند.


    کلیسای اصلی مادر خدا، به گواهی نبشتهٔ دیوار جنوبی‌اش، در ۱۶۸۹ برای یک مدیوان‌بیگ (دیوان‌بیگی)، یعنی
    داوری بلندپایه، ساخته شد. نمای جنوبی آن از پرنقش‌ترین نماهای گرجستان در واپسین سده‌های میانه است:
    صلیبی بزرگ که از میان دو اژدها با دم‌های درهم‌پیچیده برمی‌خیزد، تاک‌هایی سنگین از خوشه که بر فرشتگان
    مقرب تکیه دارند، کبوترانی در میان شاخه‌ها، کروبیانی در بالا و شیرانی در زنجیر بر فراز پنجره‌ها. کلیسای
    کهن‌تر و ساده‌ترِ «الوهیت» سایبانی سنگی را در خود پنهان دارد که آنا-خانم آباشیدزه در ۱۶۷۴ برای شوهرش
    ادیشر اریستاوی که جوان‌مرگ شد، برافراشت.


    پیش از رفتن یک بار دیگر به سوی نمای جنوبی بروید: کبوترها هنوز در تاک نشسته‌اند، کنده‌کاری‌شده پنجاه
    سال پیش از آتش‌سوزی.
  tip: >-
    یک ساعت برای دیدن محوطه بس است، و دو ساعت اگر از شئوپواری بالا بروید و درنگ کنید. پلکان برج باریک،
    تند و کم‌نور است و نرده ندارد، پس در هوای خیس یا همراه کودکان احتیاط کنید. روسری و پارچهٔ پوششی معمولاً
    کنار درِ کلیساها گذاشته شده است. پارکینگ کنار جاده رایگان است و دکه‌هایی چورچخلا، عسل و قهوه می‌فروشند؛
    سرویس بهداشتی هم هست. از اواخر صبح اتوبوس‌های راهی کازبگی محوطه را پر می‌کنند، پس زود یا اواخر بعدازظهر
    بیایید. در اواخر تابستان آب آبگیر پایین می‌رود و نوار پهنی از ساحل برهنه به جا می‌گذارد؛ در زمستان
    باد روی آب گزنده است و پله‌ها یخ می‌بندند.
  route: >-
    از تفلیس با بزرگراه S1 (E60) بیرون بروید و درست پس از متسختا به راست، به S3 — جادهٔ نظامی گرجستان
    (E117) — با تابلوی استپانتسمیندا بپیچید. آن را به سوی شمال و از میان ژینوالی دنبال کنید؛ پس از این
    شهرک، جاده در کنار آبگیر پیش می‌رود و دژ درست کنار آن، سمت راست، ایستاده است. حدود ۷۰ کیلومتر و یک
    ساعت و بیست دقیقه راه است، سراسر آسفالت و در تمام سال مناسب خودروی اقتصادی. S3 مسیر اصلی کامیون‌ها
    به مرز روسیه است، پس در بخش باریک‌تر کنار آبگیر با حوصله سبقت بگیرید. در طول راه پمپ‌بنزین هست و پارکینگ
    دژ رایگان است.
he:
  name: מבצר אנאנורי
  short: שתי טירות, שתי כנסיות ומגדל בעל עבר נורא מעל מאגר ז'ינוואלי — העצירה הגדולה הראשונה בדרך לקזבגי.
  body: >-
    **מן הכביש אנאנורי נראה כמו גלויה — כיפות וחומות משוננות מעל המים הכחולים-ירקרקים של מאגר ז'ינוואלי
    — עד שאתם שומעים מה קרה במגדל הגבוה ביותר שלו.**


    המבצר שמר בשביל דוכסי אראגווי על עמק האראגווי, הדרך אל מעברי הקווקז. רובו מן המאות ה-16 עד ה-18: מצודה
    עליונה המוקפת חומות ומגדלים, ושרידיה של טירה תחתונה. הבניין העתיק ביותר, "המגדל החבסורי" התמיר מן
    המאות ה-14–15 שבלב המתחם, חבוש בגג בצורת פירמידת אבן מדורגת.


    ב-1739, כך מספר הכרוניקן פפונה אורבליאני, בא שנשה, דוכס קסני, לנקום חרפה שדוכסי אראגווי עוללו לאשת
    אחיו. בעזרת לוחמים לזגינים שכירים הוא צר על אנאנורי וניתק את אמת המים שלו. בחום הקיץ נכנעו המגינים
    תמורת הבטחה בשבועה שחייהם יינצלו. השבועה הופרה, הדוכס בארדזים נהרג, והמגדל הגדול, שאופווארי — "הבלתי-נכנע"
    — שבו התבצר בנו, הוצת עם כל מי שהיה בתוכו. אנשי אראגווי אטמו את המגדל והפכו אותו לקבר. ארכאולוגים
    פתחו אותו ב-1939 ומצאו עצמות שרופות של מבוגרים ושל ילדים.


    כנסיית אם האלוהים הראשית נבנתה ב-1689 עבור מדיוונבג, שופט עליון, כך לפי הכתובת שעל קירה הדרומי. החזית
    הדרומית שלה היא מן העשירות בגאורגיה של שלהי ימי הביניים: צלב גדול עולה מתוך שני דרקונים שזנבותיהם
    שלובים, גפנים כבדות אשכולות נשענות על ארכי-מלאכים, יונים בין הענפים, כרובים מעליהם, ואריות כבולים
    בשלשלאות מעל החלונות. כנסיית האלוהות, העתיקה והפשוטה יותר, מסתירה חופה מאבן שהקימה ב-1674 אנה-חאנום
    אבאשידזה לבעלה אדישר אריסטאווי, שמת צעיר מדי.


    לפני שאתם עוזבים, הקיפו שוב אל החזית הדרומית: היונים עדיין בגפן, מגולפות חמישים שנה לפני השריפה.
  tip: >-
    שעה מספיקה לאתר, שעתיים אם תטפסו על שאופווארי ותתעכבו. המדרגות במגדל צרות, תלולות ואפלוליות, בלי מעקה,
    לכן היזהרו כשרטוב או כשיש איתכם ילדים. כיסויי ראש ובדי כיסוי מונחים בדרך כלל ליד דלתות הכנסיות. החניה
    לצד הכביש חינם, ויש דוכנים שמוכרים צ'ורצ'חלה, דבש וקפה, וגם שירותים. מסוף הבוקר ממלאים את האתר אוטובוסים
    בדרכם לקזבגי, לכן בואו מוקדם או מאוחר אחר הצהריים. לקראת סוף הקיץ מפלס המאגר יורד ומשאיר רצועה רחבה
    של חוף חשוף; בחורף הרוח מעל המים חודרת עד העצמות, והמדרגות מתכסות קרח.
  route: >-
    צאו מטביליסי בכביש המהיר S1 (E60), ומיד אחרי מצחתה פנו ימינה אל כביש S3 — הדרך הצבאית הגאורגית (E117),
    המשולט לסטפנצמינדה. המשיכו בו צפונה דרך ז'ינוואלי; מעבר לעיירה הכביש עובר לאורך המאגר, והמבצר עומד
    ממש לצידו, מימין. בסך הכול כ-70 ק"מ ושעה ועשרים דקות, כביש סלול לכל אורכו ומתאים לרכב מקטגוריית אקונומי
    בכל ימות השנה. ה-S3 הוא נתיב המשאיות הראשי לגבול רוסיה, אז עקפו בסבלנות בקטע הצר יותר לאורך המאגר.
    יש תחנות דלק לאורך הדרך, והחניה במבצר חינם.
ar:
  name: قلعة أنانوري
  short: قلعتان وكنيستان وبرج ذو ماضٍ رهيب فوق خزان جينفالي، وهي أول محطة كبرى على الطريق إلى كازبيغي.
  body: >-
    **من الطريق تبدو أنانوري كبطاقة بريدية: قباب وشرفات مسنّنة فوق مياه خزان جينفالي الزرقاء المخضرّة،
    إلى أن تعرف ما جرى في أعلى أبراجها.**


    كانت القلعة تحرس وادي أراغفي، طريق ممرات القوقاز، لحساب دوقات أراغفي. يعود معظمها إلى القرون من السادس
    عشر إلى الثامن عشر: قلعة عليا تطوّقها أسوار ذات أبراج، وأطلال قلعة سفلى. وأقدم مبانيها «البرج الخيفسوري»
    الرشيق من القرنين الرابع عشر والخامس عشر في قلبها، ويعلوه سقف على هيئة هرم حجري متدرّج.


    وفي عام 1739، كما يروي المؤرخ بابونا أوربلياني، جاء شانشه، دوق كساني، ليثأر لإهانة ألحقها دوقات أراغفي
    بزوجة أخيه. فحاصر أنانوري بمقاتلين ليزغيين مأجورين، وقطع قناة مائها. وفي قيظ الصيف استسلم المدافعون
    بعد أن أُعطوا وعداً مقروناً بالقسم بأن تُحفظ أرواحهم. لكن القسم نُقض، وقُتل الدوق باردزيم، وأُضرمت
    النار في البرج الكبير شيوبوفاري، أي «الذي لا يُقهر»، حيث صمد ابنه، بمن كان فيه. فسدّ أهل أراغفي البرج
    وجعلوه قبراً. وفتحه الأثريون عام 1939 فوجدوا عظاماً محترقة لبالغين وأطفال.


    بُنيت كنيسة والدة الإله الرئيسية عام 1689 لمديوانبِغ، أي قاضٍ رفيع، بحسب النقش على جدارها الجنوبي.
    وواجهتها الجنوبية من أغنى الواجهات في جورجيا أواخر العصور الوسطى: صليب كبير ينبثق من تنّينين تتشابك
    ذيولهما، وكروم مثقلة بالعناقيد تستند إلى رؤساء الملائكة، وحمائم بين الأغصان، وكروبيم في الأعلى، وأسود
    مقيّدة بالسلاسل فوق النوافذ. أما كنيسة اللاهوت، الأقدم والأبسط، فتخفي مظلّة حجرية أقامتها آنا-خانم
    أباشيدزه عام 1674 لزوجها إديشر إريستافي، الذي رحل في ريعان شبابه.


    وقبل أن تغادر، دُر مرة أخرى إلى الواجهة الجنوبية: ما زالت الحمائم في الكرمة، منحوتة قبل الحريق بخمسين
    عاماً.
  tip: >-
    تكفي ساعة للموقع، وساعتان إن صعدت شيوبوفاري وتمهّلت. درجات البرج ضيقة وشديدة الانحدار وخافتة الإضاءة،
    بلا درابزين، فاحترس في الطقس الرطب أو مع الأطفال. تُترك أغطية الرأس والأوشحة عادةً عند أبواب الكنيستين.
    الوقوف على جانب الطريق مجاني، وهناك أكشاك تبيع التشورتشخيلا والعسل والقهوة، ودورات مياه. تزدحم الحافلات
    المتجهة إلى كازبيغي في الموقع منذ أواخر الصباح، فتعالَ باكراً أو في آخر العصر. وفي أواخر الصيف ينخفض
    منسوب الخزان تاركاً شريطاً عريضاً من الشاطئ العاري؛ وفي الشتاء تكون الريح الهابّة من الماء قارسة،
    وتتجمّد الدرجات.
  route: >-
    اخرج من تبليسي على الطريق السريع S1 (E60)، وبعد متسخيتا مباشرة انعطف يميناً إلى الطريق S3، أي الطريق
    العسكري الجورجي (E117)، المشار إليه نحو ستيبانتسميندا. اتبعه شمالاً عبر جينفالي؛ وبعد البلدة يسير
    الطريق بمحاذاة الخزان، وتقف القلعة بجانبه مباشرة إلى اليمين. المسافة نحو 70 كم وساعة وعشرون دقيقة،
    والطريق معبّد بالكامل ومناسب للسيارة الاقتصادية طوال العام. الطريق S3 هو المسار الرئيسي للشاحنات نحو
    الحدود الروسية، فتحلَّ بالصبر عند التجاوز في المقطع الأضيق بمحاذاة الخزان. توجد محطات وقود على الطريق،
    والوقوف عند القلعة مجاني.
