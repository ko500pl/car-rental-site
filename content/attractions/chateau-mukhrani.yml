ka:
  name: შატო მუხრანი
  short: ბაგრატიონ-მუხრანბატონების XIX საუკუნის სასახლე და მოქმედი მარანი მუხრანის ველზე, მცხეთის დასავლეთით.
  body: >-
    **შატო მუხრანი ერთადერთი ქართული მეღვინეობაა, რომელიც განზრახ ფრანგულად აშენდა — და დღემდე ასე გამოიყურება.**
    მანსარდიანი ორსართულიანი სასახლე ხეივნის ბოლოს, მუხრანის ველზე დგას, მცხეთიდან ოცი წუთის სავალზე,
    ვენახები კი ქსნისკენ მიდის.


    მამული მუხრანბატონებს, ბაგრატიონთა სამეფო სახლის შტოს ეკუთვნოდა, რომელიც XVI საუკუნიდან ფლობდა მუხრანის
    სამთავროს. 1870-იან წლებში თავადმა ივანე მუხრანბატონმა სასახლე ააგო, პარკი გაშალა და უფრო უჩვეულო
    რამეც გააკეთა: ქართულ ჯიშებთან ერთად ფრანგული ვაზი დარგო, ფრანგული სამარნე ტექნიკა შემოიტანა და მამულზე
    სამრეწველო მასშტაბის ღვინის ქარხანა ააშენა. მისი ბოთლები 1880-იან წლებში ევროპულ გამოფენებზე იყო წარდგენილი
    — იმ დროს, როცა ქართული ღვინო თითქმის არსად მოგზაურობდა.


    1921 წელს მამული საბჭოთა სახელმწიფომ ჩამოართვა. სასახლემ სახურავიც დაკარგა და ინტერიერიც, პარკი გაველურდა
    და შვიდი ათწლეულის განმავლობაში შენობები მხოლოდ კარკასად იდგა. აღდგენა 2002 წელს დაიწყო, მარანი 2007
    წელს გაიხსნა, თავად სასახლე კი მოგვიანებით დასრულდა.


    რას ნახავ ვიზიტისას:


    - აღდგენილი სასახლე, მოწყობილი ეპოქის სტილში და არა ორიგინალური ავეჯით


    - XIX საუკუნის გვირაბ-მარანი, აგურის კამარებით, ნებისმიერ ამინდში გრილი და დღემდე დაძველებისთვის გამოყენებული


    - ქვევრის მარანი, სადაც ტრადიციული, კანთან კონტაქტით დაყენებული თეთრი ღვინოები კეთდება


    - პარკი, ფრანგული რეგულარული გეგმით და გრძელი ალეით, უკან კი მოქმედი ვენახები


    ღვინოა საფერავი, რქაწითელი, გორული მწვანე, შავკაპიტო და თავკვერი, დაყენებული როგორც ევროპულად, ისე
    ქვევრში. ყველაზე საინტერესო ერთი და იმავე ჯიშის ორივე ვერსიის შედარებაა. სექტემბერი და ოქტომბრის დასაწყისი,
    რთველის დროს, ყველაზე ცოცხალი კვირებია; იანვარში პარკი შიშველია და ვიზიტი ძირითადად შენობებში გადის.
  tip: >-
    ორი საათი ტურსა და დეგუსტაციას სავსებით ჰყოფნის. რთველის სეზონზე და შაბათ-კვირას წინასწარ დაჯავშნე
    — ტერიტორიის ნაწილს ხშირად ქორწილები იკავებენ. ბილეთი პარკსა და სასახლეს მოიცავს, დეგუსტაცია ცალკე
    ფასდება და მაგიდასთან სხდებიან, ამიტომ მძღოლი ფხიზელი გყავდეს: თბილისისკენ დასაბრუნებელ გზაზე პატრული
    დგას. მარანში მუდმივად თოთხმეტი გრადუსია — აგვისტოშიც წაიღე ზედა ტანსაცმელი. ბილიკები ხრეშისაა და
    ბრტყელი, ადგილზე რესტორანია, რაც გამოსადეგია, რადგან სოფელში სხვა თითქმის არაფერია.
  route: >-
    თბილისიდან E60-ით დასავლეთისკენ, მცხეთის გავლით და მუხრანის/ქსნის გასახვევზე მაგისტრალიდან ჩამოდიხარ,
    შემდეგ ადგილობრივი გზით ჩრდილოეთით სოფელში — დაახლოებით 42 კმ და 50 წუთი, ბოლომდე ასფალტი და ნებისმიერი
    მანქანისთვის მარტივი. მამულის ჭიშკარი სოფლის კიდეზეა, ნიშნით, შიგნით კი დიდი უფასო პარკინგია. საწვავი
    ნატახტარში ან მცხეთაში აიღე, სოფელში სადგურები ცოტაა. იმავე გზით შეგიძლია სამთავისისკენ განაგრძო,
    თუ ორივეს გაერთიანება გინდა.
en:
  name: Château Mukhrani
  short: >-
    The 19th-century palace and working cellar of the Bagration-Mukhrani princes on the Mukhrani plain
    west of Mtskheta.
  body: >-
    **Château Mukhrani is the one Georgian winery that was deliberately built to look French, and it still
    does.** A two-storey palace with a mansard roof stands at the end of a tree-lined avenue on the Mukhrani
    plain, twenty minutes west of Mtskheta, with vineyards running out towards the Ksani.


    The estate belonged to the Mukhranbatoni, a branch of the Bagrationi royal house that held the principality
    of Mukhrani from the 16th century. In the 1870s Prince Ivane Mukhranbatoni built the palace, laid
    out a park, and did something more unusual: he planted French vines alongside Georgian ones, imported
    French cellar practice, and put up an industrial-scale winery on the estate. His bottles were shown
    at European exhibitions in the 1880s, at a time when Georgian wine barely travelled at all.


    The Soviet state took the property in 1921. The palace lost its roof and its interiors, the park ran
    wild, and for seventy years the buildings stood as a shell. Restoration began in 2002, the winery
    reopened in 2007, and the palace itself was finished later.


    What you actually see on a visit:


    - the restored palace, furnished in period style rather than with original pieces


    - the 19th-century tunnel cellar, brick-vaulted, cool in any weather and still used for ageing


    - a marani of buried qvevri, where the traditional skin-contact whites are made


    - the park, a formal French layout with a long allée, and the working vineyards behind it


    The wines are Saperavi, Rkatsiteli, Goruli Mtsvane, Shavkapito and Tavkveri, made in both European
    and qvevri styles. The interesting thing is to taste the same grape done both ways. September and
    early October, during the harvest, are the liveliest weeks; in January the park is bare and the visit
    is mostly indoors.
  tip: >-
    Two hours covers a tour and a tasting. Book ahead during harvest and at weekends, when wedding parties
    take over parts of the grounds. The entry ticket covers the park and palace; tastings cost extra and
    are poured seated, so bring a driver who is not drinking — the road back to Tbilisi is patrolled.
    The cellar sits at a steady fourteen degrees, so carry a layer even in August. Paths are flat gravel,
    and there is a restaurant on site, which matters because the village offers little else.
  route: >-
    From Tbilisi take the E60 west past Mtskheta and leave the highway at the Mukhrani and Ksani turning,
    then follow the local road north into the village — about 42 km and 50 minutes, asphalt the whole
    way and easy in any car. The estate gate is signposted on the edge of the village, with a large free
    car park inside. Fill up at Natakhtari or Mtskheta, as filling stations in the village are few. The
    same road carries on towards Samtavisi if you want to combine the two in one afternoon.
ru:
  name: Шато Мухрани
  short: Дворец XIX века и действующая винодельня князей Багратион-Мухранских на Мухранской равнине к
    западу от Мцхеты.
  body: >-
    **Шато Мухрани — единственная грузинская винодельня, которую намеренно строили «под Францию», и она
    до сих пор так выглядит.** Двухэтажный дворец с мансардной крышей стоит в конце обсаженной деревьями
    аллеи на Мухранской равнине, в двадцати минутах к западу от Мцхеты, а виноградники уходят в сторону
    Ксани.


    Имение принадлежало Мухранбатони — ветви царского дома Багратиони, владевшей Мухранским княжеством
    с XVI века. В 1870-х князь Иване Мухранбатони построил дворец, разбил парк и сделал кое-что необычнее:
    посадил рядом с грузинскими французские лозы, перенёс сюда французскую технологию погреба и возвёл
    в имении винодельню промышленного масштаба. Его бутылки показывали на европейских выставках в 1880-х,
    когда грузинское вино почти никуда не вывозили.


    В 1921 году имение отошло советскому государству. Дворец лишился крыши и интерьеров, парк одичал,
    и семьдесят лет здания стояли коробками. Реставрация началась в 2002-м, винодельня открылась в 2007-м,
    а сам дворец достроили позже.


    Что видно на экскурсии:


    - восстановленный дворец, обставленный в духе эпохи, а не подлинными вещами


    - туннельный погреб XIX века с кирпичными сводами, прохладный в любую погоду и до сих пор используемый
    для выдержки


    - марани с вкопанными квеври, где делают традиционные белые вина на мезге


    - парк регулярной французской планировки с длинной аллеей, а за ним рабочие виноградники


    Вина — саперави, ркацители, горули мцване, шавкапито и тавквери, в европейском стиле и в квеври. Самое
    интересное — попробовать один и тот же сорт в двух версиях. Сентябрь и начало октября, время сбора,
    самые живые недели; в январе парк голый и осмотр в основном проходит внутри.
  tip: >-
    Двух часов хватает на экскурсию с дегустацией. В сезон сбора и по выходным бронируйте заранее: часть
    территории нередко занимают свадьбы. Входной билет включает парк и дворец, дегустации оплачиваются
    отдельно и проходят за столом, так что водителю пить нельзя — дорогу назад в Тбилиси патрулируют.
    В погребе постоянно около четырнадцати градусов, возьмите кофту даже в августе. Дорожки гравийные
    и ровные, на территории есть ресторан, и это важно: в селе больше почти ничего нет.
  route: >-
    Из Тбилиси по трассе E60 на запад мимо Мцхеты, съезд на повороте к Мухрани и Ксани, затем по местной
    дороге на север в село — около 42 км и 50 минут, асфальт на всём протяжении, доступно любой машине.
    Ворота имения обозначены указателем на краю села, внутри большая бесплатная парковка. Заправляйтесь
    в Натахтари или Мцхете, в самом селе колонок мало. Та же дорога ведёт дальше к Самтависи, если хочется
    соединить две точки за один день.
fa:
  name: شاتو موخرانی
  short: کاخ سدهٔ نوزدهم و کارگاه شراب فعال شاهزادگان باگراتیون-موخرانی در دشت موخرانی، غرب متسختا.
  body: >-
    **شاتو موخرانی تنها کارگاه شراب گرجستان است که آگاهانه فرانسوی ساخته شد و هنوز هم چنین می‌نماید.**
    کاخی دوطبقه با بام شیب‌دار در انتهای خیابانی درخت‌کاری‌شده در دشت موخرانی ایستاده، بیست دقیقه غرب
    متسختا، و تاکستان‌ها از پشت آن تا سوی کسانی کشیده می‌شود.


    این ملک از آنِ موخران‌باتونی بود، شاخه‌ای از خاندان شاهی باگراتیونی که از سدهٔ شانزدهم امیرنشین موخرانی
    را در دست داشت. در دههٔ 1870 شاهزاده ایوانه موخران‌باتونی کاخ را ساخت، باغی آراست و کاری نامعمول‌تر
    هم کرد: در کنار رقم‌های گرجی، تاک فرانسوی کاشت، شیوهٔ سردابداری فرانسوی را آورد و کارگاهی در مقیاس
    صنعتی در ملک برپا کرد. بطری‌های او در دههٔ 1880 در نمایشگاه‌های اروپایی عرضه شد، در روزگاری که شراب
    گرجی تقریباً هیچ‌جا نمی‌رفت.


    در 1921 دولت شوروی ملک را گرفت. کاخ بام و درون خود را از دست داد، باغ وحشی شد و هفتاد سال بناها پوسته‌ای
    بی‌جان ماندند. مرمت در 2002 آغاز شد، کارگاه در 2007 بازگشایی شد و خود کاخ دیرتر به پایان رسید.


    آنچه در بازدید می‌بینید:


    - کاخ مرمت‌شده، مبله به سبک دوره و نه با اشیای اصل


    - سرداب تونلی سدهٔ نوزدهم با طاق‌های آجری، خنک در هر هوایی و هنوز در کار کهنه‌سازی


    - سردابی از خم‌های گلی مدفون که سفیدهای سنتی با تماس پوسته در آن ساخته می‌شود


    - باغ با طرح منظم فرانسوی و خیابانی دراز، و پشت آن تاکستان‌های در کار


    شراب‌ها ساپراوی، رکاتسیتلی، گورولی متسوانه، شاوکاپیتو و تاوکوری است، هم به سبک اروپایی و هم در خم.
    جالب‌ترین کار چشیدن یک رقم به هر دو شیوه است. شهریور و اوایل مهر، هنگام برداشت، پرجنب‌وجوش‌ترین هفته‌هاست؛
    در دی باغ برهنه است و بازدید بیشتر در فضای بسته می‌گذرد.
  tip: >-
    دو ساعت برای گشت و چشیدن کافی است. در فصل برداشت و آخر هفته‌ها از پیش رزرو کنید، چون بخش‌هایی از محوطه
    را مجالس عروسی می‌گیرند. بلیت ورودی شامل باغ و کاخ است؛ چشیدن هزینهٔ جداگانه دارد و نشسته سرو می‌شود،
    پس راننده‌ای همراه ببرید که نمی‌نوشد، زیرا راه بازگشت به تفلیس گشت پلیس دارد. دمای سرداب همیشه نزدیک
    چهارده درجه است، پس حتی در مرداد لباس گرم بردارید. مسیرها شنی و هموار است و رستورانی در محل هست، که
    اهمیت دارد چون روستا چیز دیگری ندارد.
  route: >-
    از تفلیس روی E60 به غرب و از کنار متسختا بروید و در انشعاب موخرانی و کسانی از بزرگراه خارج شوید، سپس
    جادهٔ محلی را به شمال تا درون روستا دنبال کنید — حدود 42 کیلومتر و 50 دقیقه، سراسر آسفالت و آسان برای
    هر خودرویی. دروازهٔ ملک در کنارهٔ روستا تابلو دارد و پارکینگ بزرگ و رایگان درون آن است. در ناتاختاری
    یا متسختا سوخت بگیرید، چون پمپ بنزین در روستا کم است. همین جاده به سامتاویسی ادامه می‌یابد اگر بخواهید
    هر دو را در یک بعدازظهر ببینید.
he:
  name: שאטו מוחרני
  short: ארמון מן המאה ה-19 ויקב פעיל של נסיכי באגרטיון-מוחרני במישור מוחרני, ממערב למצחתה.
  body: >-
    **שאטו מוחרני הוא היקב הגאורגי היחיד שנבנה במתכוון כדי להיראות צרפתי, והוא עדיין נראה כך.** ארמון
    בן שתי קומות עם גג מנסרד עומד בקצה שדרת עצים במישור מוחרני, עשרים דקות ממערב למצחתה, והכרמים נמתחים
    ממנו לכיוון הקסאני.


    האחוזה הייתה של בית מוחרנבטוני, ענף של בית המלוכה באגרטיוני שהחזיק בנסיכות מוחרני מן המאה ה-16. בשנות
    ה-70 של המאה ה-19 בנה הנסיך איוואנה מוחרנבטוני את הארמון, תכנן פארק ועשה דבר חריג יותר: הוא נטע גפנים
    צרפתיות לצד הגאורגיות, הביא שיטות מרתף צרפתיות והקים באחוזה יקב בקנה מידה תעשייתי. בקבוקיו הוצגו בתערוכות
    אירופיות בשנות ה-80 של אותה מאה, בזמן שיין גאורגי כמעט לא יצא לשום מקום.


    ב-1921 נטלה המדינה הסובייטית את הרכוש. הארמון איבד את גגו ואת פנימו, הפארק פרא, ושבעים שנה עמדו המבנים
    כשלד. השיקום החל ב-2002, היקב נפתח מחדש ב-2007, והארמון עצמו הושלם מאוחר יותר.


    מה רואים בביקור:


    - הארמון המשוחזר, מרוהט בסגנון התקופה ולא בפריטים מקוריים


    - מרתף המנהרה מן המאה ה-19, מקומר בלבנים, קריר בכל מזג אוויר ועדיין משמש להתיישנות


    - מרתף כדי חרס קבורים, שבו נעשים היינות הלבנים המסורתיים במגע עם הקליפות


    - הפארק בתכנון צרפתי סימטרי עם שדרה ארוכה, ומאחוריו הכרמים העובדים


    היינות הם ספראווי, רקאציטלי, גורולי מצוואנה, שאווקאפיטו וטאווקווארי, בשתי הגרסאות: אירופית ובכדי חרס.
    המעניין הוא לטעום את אותו זן בשתי הדרכים. ספטמבר ותחילת אוקטובר, בעונת הבציר, הם השבועות החיים ביותר;
    בינואר הפארק חשוף והביקור מתנהל בעיקר בפנים.
  tip: >-
    שעתיים מספיקות לסיור ולטעימה. בעונת הבציר ובסופי שבוע כדאי להזמין מראש, כי חלקים מן השטח נתפסים לאירועי
    חתונה. כרטיס הכניסה כולל את הפארק והארמון; טעימות בתשלום נפרד ומוגשות בישיבה, לכן קחו נהג שאינו שותה
    — הכביש חזרה לטביליסי מפוקח. במרתף שוררת טמפרטורה קבועה של כארבע עשרה מעלות, אז קחו שכבה גם באוגוסט.
    השבילים חצץ ומישוריים, ובשטח יש מסעדה, וזה חשוב כי בכפר כמעט אין דבר אחר.
  route: >-
    מטביליסי בכביש E60 מערבה על פני מצחתה, יורדים בפנייה למוחרני ולקסאני וממשיכים בדרך המקומית צפונה אל
    תוך הכפר — כ-42 ק״מ וכ-50 דקות, אספלט לכל האורך ונוח לכל רכב. שער האחוזה משולט בקצה הכפר, ובפנים חניון
    גדול בחינם. תדלקו בנטאחטארי או במצחתה, שכן בכפר עצמו יש מעט תחנות. אותה דרך ממשיכה לכיוון סמטאוויסי
    אם תרצו לחבר את השניים לאותו אחר צהריים.
ar:
  name: شاتو موخراني
  short: قصر من القرن التاسع عشر ومعمل نبيذ عامل لأمراء باغراتيون-موخراني في سهل موخراني غربي متسخيتا.
  body: >-
    **شاتو موخراني هو معمل النبيذ الجورجي الوحيد الذي بُني عن قصد ليبدو فرنسياً، وما زال كذلك.** يقوم
    قصر من طابقين بسقف مائل في نهاية جادة مشجرة في سهل موخراني، على مسافة عشرين دقيقة غربي متسخيتا، وتمتد
    الكروم خلفه نحو نهر كساني.


    كانت الضيعة لآل موخران‌باتوني، وهو فرع من البيت الملكي الباغراتيوني حكم إمارة موخراني منذ القرن السادس
    عشر. وفي سبعينيات القرن التاسع عشر بنى الأمير إيفانه موخران‌باتوني القصر وخطط الحديقة وفعل ما هو أغرب:
    غرس كروماً فرنسية إلى جانب الجورجية، ونقل أساليب الأقبية الفرنسية، وأقام في الضيعة معملاً بحجم صناعي.
    وعُرضت زجاجاته في معارض أوروبية في ثمانينيات ذلك القرن، في زمن كان النبيذ الجورجي لا يكاد يسافر.


    استولت الدولة السوفييتية على الملك عام 1921. ففقد القصر سقفه وأثاثه الداخلي، وتوحشت الحديقة، وبقيت
    المباني هيكلاً فارغاً سبعين عاماً. بدأ الترميم عام 2002، وأعيد افتتاح المعمل عام 2007، وأُنجز القصر
    نفسه لاحقاً.


    ما تراه في الزيارة فعلاً:


    - القصر المرمم، مفروش على طراز الحقبة لا بقطع أصلية


    - قبو النفق من القرن التاسع عشر، معقود بالآجر وبارد في كل طقس وما زال يُستعمل للتعتيق


    - قبو بجرار كفيفري مدفونة تُصنع فيه البيض التقليدية بملامسة القشور


    - الحديقة بتخطيط فرنسي منتظم وجادة طويلة، وخلفها الكروم العاملة


    النبيذ هنا ساپيرافي ورکاتسيتيلي وغورولي متسفانه وشافكابيتو وتافكفيري، بالأسلوبين الأوروبي والجرار
    الفخارية. والأمتع أن تتذوق العنب نفسه بالطريقتين. أيلول وأوائل تشرين الأول، في موسم القطاف، أكثر الأسابيع
    حيوية؛ وفي كانون الثاني تكون الحديقة عارية وتجري الزيارة في الداخل غالباً.
  tip: >-
    ساعتان تكفيان لجولة وتذوق. احجز مسبقاً في موسم القطاف وفي عطلة نهاية الأسبوع، إذ تحتل حفلات الأعراس
    أجزاء من المكان. وتذكرة الدخول تشمل الحديقة والقصر؛ أما التذوق فبكلفة إضافية ويُقدَّم جلوساً، فاصطحب
    سائقاً لا يشرب، لأن طريق العودة إلى تبليسي تُراقَب. حرارة القبو ثابتة عند نحو أربع عشرة درجة، فخذ
    معك طبقة إضافية حتى في آب. الممرات حصوية ومستوية، وفي الموقع مطعم، وهذا مهم لأن القرية لا تقدم غير
    ذلك.
  route: >-
    من تبليسي اسلك الطريق E60 غرباً بمحاذاة متسخيتا واترك الطريق السريع عند مفرق موخراني وكساني، ثم اتبع
    الطريق المحلي شمالاً إلى داخل القرية — نحو 42 كم و50 دقيقة، معبّد بالكامل وسهل لأي سيارة. بوابة الضيعة
    عليها لافتة عند طرف القرية، وفي الداخل موقف كبير مجاني. تزود بالوقود في ناتاختاري أو متسخيتا، فمحطات
    القرية قليلة. وتتابع الطريق نفسها نحو سامتافيسي إن أردت الجمع بين الموقعين في أصيل واحد.
