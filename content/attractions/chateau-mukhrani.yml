ka:
  name: შატო მუხრანი
  short: >-
    ივანე მუხრანბატონის XIX საუკუნის სასახლე და მარანი მუხრანის ველზე — ევროპული წესით დაყენებულმა მისმა
    ღვინომ 1889 წელს პარიზში ოქრო მოიპოვა.
  body: >-
    **1889 წელს, როცა პარიზმა ეიფელის კოშკი გახსნა, იმავე მსოფლიო გამოფენაზე მუხრანის ველზე დაყენებულმა
    ქართველი თავადის ღვინომ ოქროს მედალი დაიმსახურა.**


    მუხრანი 1512 წლიდან ბაგრატიონთა სამეფო სახლის შტოს, მუხრანბატონებს, ეკუთვნოდა, რომლებიც მას, როგორც
    ავტონომიურ სათავადოს, 1801 წლამდე, რუსეთის მიერ აღმოსავლეთ საქართველოს შეერთებამდე, განაგებდნენ. XIX
    საუკუნეში გვარის მემკვიდრე ივანე მუხრანბატონი რუსეთის არმიის ოფიცრად შამილის წინააღმდეგ და ყირიმის
    ომში იბრძოდა, 1881 წელს გენერალ-ლეიტენანტის ჩინით გადადგა და მთელი ენერგია მეურნეობას მიუძღვნა. 1876
    წელს საფრანგეთიდან მეღვინეობის სპეციალისტები მოიწვია და ქართველ მეღვინე ზაქარია ჯორჯაძესთან ერთად
    დაახლოებით 1,2 მილიონი ლიტრის ტევადობის ქარხანა ააგო, სადაც ღვინოს ევროპული წესით აყენებდნენ. 1882
    წელს ამ ღვინომ მოსკოვის გამოფენაზე უმაღლესი ჯილდო მიიღო, შემდეგ კი — პარიზის ოქრო.


    სასახლე ქარხანაზე ადრე ჩაიფიქრეს. 1873 წელს ფრანგმა არქიტექტორებმა დააპროექტეს, მშენებლობას თორმეტი
    წელი დასჭირდა, მებაღე კი, როგორც ამბობენ, ვერსალიდან ჩამოიყვანეს. ეს არ არის ის მანსარდიანი „შატო“,
    სახელის გაგონებისას რომ წარმოიდგენთ: შელესილი აგურის შენობა მაღალ ცოკოლზე დგას, ორსართულიან კორპუსს
    ქონგურებიანი პარაპეტი ასრულებს, აღმოსავლეთ კიდეზე სამსართულიანი კოშკი აღმართულა, სამეჯლისო დარბაზი
    კი ნახევარწრიული აფსიდით მთავრდება, სადაც ოდესღაც სცენა იყო მოწყობილი. სასახლეს ქარხანასთან გვირაბი
    აკავშირებდა. ბელ ეპოკის ქართველი ელიტისთვის ეს კულტურისა და პოლიტიკის სალონი იყო.


    XX საუკუნემ მამული არ დაინდო. 2006 წელს სასახლეს ეროვნული მნიშვნელობის ძეგლის სტატუსი მიენიჭა, 2012
    წელს აღადგინეს, კომპანია „შატო მუხრანი“ კი აქ კვლავ ივანეს სახელით აყენებს ღვინოს.


    ადგილზე დალეული ჭიქა ივანეს 1876 წლის ნიძლავზე გაცემული პასუხია: ევროპული წესით დამუშავებული ქართული
    ყურძენი პარიზშიც არავის დაუთმობდა.
  tip: >-
    ვიზიტს მამული აწყობს — გიდით ტური და დეგუსტაცია; ფორმატი და ფასები იცვლება, ამიტომ შატო მუხრანის ვებგვერდზე
    წინასწარ გადაამოწმეთ და დაჯავშნეთ, განსაკუთრებით შაბათ-კვირას და სექტემბერ-ოქტომბრის რთველზე, როცა
    ტერიტორიის ნაწილს ღონისძიებები და ქორწილები იკავებს. თუ ვინმე ღვინოს დააგემოვნებს, საჭესთან სხვა დაჯდეს
    — თბილისისკენ ჩქაროსნული მაგისტრალია. სასახლის პარკი სწორია და სასიარულოდ მარტივი. ტურსა და დეგუსტაციას
    ორი საათი ჰყოფნის; მამულს საკუთარი რესტორანიც აქვს, რაც მნიშვნელოვანია — სოფელში სხვა თითქმის არაფერია.
  route: >-
    თბილისიდან ჩრდილო-დასავლეთით S1 (E60) ავტომაგისტრალით მცხეთის გავლით წადით, მცხეთის გასასვლელიდან
    კიდევ დაახლოებით 20 კმ იარეთ და მუხრანის გასასვლელზე (შ28) ჩადით. დაახლოებით 3 კმ-ში წრიული გზაჯვარედინი
    შ151-ზე გადაგიყვანთ, რომელიც სოფელში შედის; მამული მის კიდეზეა, მიმანიშნებლით, ჭიშკრის შიგნით კი უფასო
    სადგომია. თბილისის ცენტრიდან დაახლოებით 45 კმ და 50 წუთია, ბოლომდე ასფალტზე — ნებისმიერი მანქანისთვის
    მარტივი. საწვავის სადგურები S1-ის გასწვრივაა. დაბრუნებისას შიომღვიმესა და სვეტიცხოველზე შევლა ბუნებრივად
    ერწყმის გზას.
en:
  name: Château Mukhrani
  short: >-
    The 19th-century palace and winery of Prince Ivane Mukhranbatoni, whose European-style wine won gold
    in Paris in 1889, working again on the Mukhrani plain.
  body: >-
    **In 1889, the year Paris opened the Eiffel Tower, a wine from a Georgian prince's estate on the Mukhrani
    plain took a gold medal at the same Exposition Universelle.**


    The Mukhrani lands had passed in 1512 to a branch of the Bagrationi royal house, the Mukhranbatoni,
    who ruled them as an autonomous principality until the Russian annexation of 1801. Their 19th-century
    heir, Ivane Mukhranbatoni, fought in the Caucasus and Crimean wars as an officer of the Russian army,
    retired a lieutenant-general in 1881 and turned his energy to farming. In 1876 he invited wine specialists
    from France and, with the Georgian winemaker Zakaria Jorjadze, built a winery of about 1.2 million
    litres, making wine by European methods. It won the highest award at the Moscow exhibition of 1882,
    then the gold in Paris.


    The palace was begun first. Designed in 1873 by French architects, it took twelve years to build,
    and a gardener is said to have been brought from Versailles. It is not the mansard-roofed château
    the name suggests: rendered brick on a high plinth, a two-storey main block with crenellated parapets,
    a three-storey tower at the east end and a ballroom closing in a semicircular apse that once held
    a stage. A tunnel linked the house to the winery. For the Georgian elite of the Belle Époque, this
    was a salon of culture and politics.


    The 20th century was unkind to the estate. The palace was declared a monument of national importance
    in 2006 and restored in 2012, and the Château Mukhrani company now makes wine here again under Ivane's
    name.


    Taste a glass on the estate and you are drinking the answer to a wager Ivane made in 1876: that Georgian
    grapes, handled the European way, could hold their own in Paris.
  tip: >-
    Visits are run by the estate as guided tours with tastings; formats and prices change, so check and
    book on the Château Mukhrani website, especially at weekends and during the September–October harvest,
    when events and weddings can take over parts of the grounds. If anyone in your party tastes, someone
    else drives — the road back to Tbilisi is a fast motorway. The palace park is flat and easy underfoot.
    Two hours covers a tour and a tasting, and the estate has its own restaurant, which matters because
    the village offers little else.
  route: >-
    Take the S1 motorway (E60) north-west from Tbilisi past Mtskheta, and keep on it for about 20 km beyond
    the Mtskheta exit before leaving at the junction for Mukhrani (road Sh28). About 3 km later a roundabout
    sends you onto the Sh151 into the village; the estate is signposted on its edge, with a free car park
    inside the gates. That is about 45 km and 50 minutes from central Tbilisi, asphalt all the way and
    easy in any car. Fuel stations line the S1. On the way back, Shio-Mgvime and Svetitskhoveli make natural
    stops.
ru:
  name: Шато Мухрани
  short: >-
    Дворец и винодельня XIX века князя Иване Мухранбатони, чьё вино европейского склада взяло золото в
    Париже в 1889 году, — снова в деле на Мухранской равнине.
  body: >-
    **В 1889 году, когда Париж открыл Эйфелеву башню, вино из имения грузинского князя на Мухранской равнине
    получило золотую медаль на той же Всемирной выставке.**


    Мухранские земли в 1512 году перешли к ветви царского дома Багратиони — Мухранбатони, которые правили
    ими как автономным княжеством вплоть до российской аннексии 1801 года. Их наследник в XIX веке, Иване
    Мухранбатони, воевал на Кавказе и в Крымскую войну офицером русской армии, в 1881 году вышел в отставку
    генерал-лейтенантом и направил энергию на хозяйство. В 1876 году он пригласил винных специалистов
    из Франции и вместе с грузинским виноделом Захарием Джорджадзе построил винодельню примерно на 1,2
    миллиона литров, где вино делали по европейским методам. Оно получило высшую награду на Московской
    выставке 1882 года, а затем и золото в Париже.


    Дворец задумали раньше. Его спроектировали в 1873 году французские архитекторы, строили двенадцать
    лет, а садовника, говорят, выписали из Версаля. Это вовсе не шато с мансардной крышей, какое рисует
    воображение при этом слове: оштукатуренный кирпич на высоком цоколе, двухэтажный главный корпус с
    зубчатыми парапетами, трёхэтажная башня у восточного торца и бальный зал, завершённый полукруглой
    апсидой, где когда-то стояла сцена. Туннель соединял дом с винодельней. Для грузинской элиты Прекрасной
    эпохи здесь был салон культуры и политики.


    XX век обошёлся с имением немилосердно. В 2006 году дворец объявили памятником национального значения,
    в 2012-м отреставрировали, и компания «Шато Мухрани» снова делает здесь вино под именем Иване.


    Поднимите бокал в имении — и вы пьёте ответ на ставку, которую Иване сделал в 1876 году: грузинский
    виноград, если обращаться с ним по-европейски, сможет постоять за себя в Париже.
  tip: >-
    Визиты организует само имение — это экскурсии с гидом и дегустацией; форматы и цены меняются, поэтому
    уточняйте и бронируйте на сайте «Шато Мухрани», особенно на выходные и в сезон сбора винограда в сентябре–октябре,
    когда часть территории могут занять мероприятия и свадьбы. Если кто-то в вашей компании дегустирует,
    за руль садится другой — обратно в Тбилиси ведёт скоростная магистраль. Парк у дворца ровный, ходить
    по нему легко. Экскурсия с дегустацией займёт около двух часов; в имении есть собственный ресторан,
    и это важно, потому что в селе больше почти ничего нет.
  route: >-
    Выезжайте из Тбилиси на северо-запад по автомагистрали S1 (E60) мимо Мцхеты и после съезда на Мцхету
    проедьте ещё около 20 км, прежде чем свернуть на развязке на Мухрани (дорога Sh28). Примерно через
    3 км кольцо выведет вас на дорогу Sh151 в село; имение обозначено указателем на его окраине, за воротами
    — бесплатная парковка. Всего около 45 км и 50 минут от центра Тбилиси, асфальт на всём пути, легко
    проехать на любой машине. Заправки стоят вдоль S1. На обратном пути естественно заехать в Шиомгвиме
    и Светицховели.
fa:
  name: شاتو موخرانی
  short: >-
    کاخ و شراب‌سازی سدهٔ نوزدهمی شاهزاده ایوانه موخرانباتونی، که شراب اروپایی‌شیوه‌اش در ۱۸۸۹ در پاریس
    طلا گرفت و اکنون دوباره در دشت موخرانی به کار افتاده است.
  body: >-
    **در ۱۸۸۹، همان سالی که پاریس برج ایفل را گشود، شرابی از املاک شاهزاده‌ای گرجی در دشت موخرانی در همان
    نمایشگاه جهانی مدال طلا گرفت.**


    سرزمین‌های موخرانی در ۱۵۱۲ به شاخه‌ای از خاندان سلطنتی باگراتیونی، یعنی موخرانباتونی‌ها، رسید که تا
    الحاق روسیه در ۱۸۰۱ چون امیرنشینی خودمختار بر آن فرمان راندند. وارث سدهٔ نوزدهمی این خاندان، ایوانه
    موخرانباتونی، در جنگ‌های قفقاز و جنگ کریمه در مقام افسر ارتش روسیه جنگید، در ۱۸۸۱ با درجهٔ سپهبدی
    بازنشسته شد و توان خود را صرف کشاورزی کرد. در ۱۸۷۶ کارشناسان شراب را از فرانسه فراخواند و همراه شراب‌ساز
    گرجی، زکریا جورجادزه، شراب‌سازی‌ای با گنجایش حدود ۱٫۲ میلیون لیتر ساخت که شراب را به روش‌های اروپایی
    تولید می‌کرد. این شراب در نمایشگاه ۱۸۸۲ مسکو بالاترین جایزه را گرفت و سپس طلای پاریس را.


    کار کاخ زودتر آغاز شد. معماران فرانسوی آن را در ۱۸۷۳ طراحی کردند، ساختش دوازده سال طول کشید و می‌گویند
    باغبانی از ورسای آوردند. این بنا آن شاتوی بام‌منسارد که نامش به ذهن می‌آورد نیست: آجر اندودشده بر
    ازاره‌ای بلند، بدنهٔ اصلی دوطبقه با جان‌پناه‌های کنگره‌دار، برجی سه‌طبقه در سر شرقی و تالار رقصی که
    به شاه‌نشینی نیم‌دایره ختم می‌شود و روزگاری صحنه‌ای در خود داشت. تونلی خانه را به شراب‌سازی می‌پیوست.
    برای نخبگان گرجی در «دوران خوش» (بل‌اِپوک)، اینجا محفلی برای فرهنگ و سیاست بود.


    سدهٔ بیستم با این ملک نامهربان بود. کاخ در ۲۰۰۶ بنای تاریخی دارای اهمیت ملی شناخته شد و در ۲۰۱۲ مرمت
    گردید، و شرکت «شاتو موخرانی» اکنون دوباره به نام ایوانه در اینجا شراب می‌سازد.


    جامی در همین ملک بنوشید تا پاسخ شرطی را بچشید که ایوانه در ۱۸۷۶ بست: اینکه انگور گرجی، اگر به شیوهٔ
    اروپایی پرورده شود، در پاریس هم سربلند می‌ایستد.
  tip: >-
    بازدیدها را خود ملک به صورت تور همراه با راهنما و چشیدن شراب برگزار می‌کند؛ شکل برنامه‌ها و قیمت‌ها
    تغییر می‌کند، پس در وب‌سایت شاتو موخرانی بررسی و رزرو کنید، به‌ویژه آخر هفته‌ها و در فصل انگورچینی
    در سپتامبر و اکتبر، که مراسم و عروسی‌ها ممکن است بخش‌هایی از محوطه را بگیرند. اگر کسی در جمع شما شراب
    می‌چشد، دیگری پشت فرمان بنشیند — راه بازگشت به تفلیس بزرگراهی تندرو است. پارک کاخ هموار است و راه
    رفتن در آن آسان. دو ساعت برای تور و چشیدن شراب کافی است و ملک رستوران خودش را دارد، که اهمیت دارد،
    چون روستا چیز چندانی ندارد.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سوی شمال‌غرب بگیرید، از کنار متسختا بگذرید و پس از خروجی متسختا حدود
    ۲۰ کیلومتر دیگر روی آن بمانید، سپس در تقاطع موخرانی (جادهٔ Sh28) خارج شوید. حدود ۳ کیلومتر بعد، یک
    میدان شما را به جادهٔ Sh151 و درون روستا می‌فرستد؛ ملک در حاشیهٔ روستا تابلو دارد و درون دروازه‌ها
    پارکینگ رایگان هست. از مرکز تفلیس حدود ۴۵ کیلومتر و ۵۰ دقیقه راه است، سراسر آسفالت و آسان برای هر
    خودرویی. در طول S1 پمپ‌بنزین فراوان است. در راه بازگشت، شیومگویمه و سوتیتسخولی توقف‌هایی طبیعی‌اند.
he:
  name: שאטו מוכראני
  short: >-
    הארמון והיקב מהמאה ה-19 של הנסיך איוואנה מוכרנבטוני, שיינו בסגנון אירופי זכה בזהב בפריז ב-1889 — ושוב
    פועלים במישור מוכראני.
  body: >-
    **ב-1889, השנה שבה חנכה פריז את מגדל אייפל, זכה יין מאחוזתו של נסיך גאורגי במישור מוכראני במדליית
    זהב באותה תערוכה עולמית.**


    אדמות מוכראני עברו ב-1512 לענף של בית המלוכה בגרטיוני, בני משפחת מוכרנבטוני, ששלטו בהן כנסיכות אוטונומית
    עד לסיפוח הרוסי ב-1801. יורשם במאה ה-19, איוואנה מוכרנבטוני, לחם במלחמות הקווקז ובמלחמת קרים כקצין
    בצבא הרוסי, פרש ב-1881 בדרגת גנרל-לויטננט והפנה את מרצו לחקלאות. ב-1876 הזמין מומחי יין מצרפת, ויחד
    עם היינן הגאורגי זקריה ג'ורג'דזה הקים יקב בנפח של כ-1.2 מיליון ליטר, שייצר יין בשיטות אירופיות. היין
    זכה בפרס הגבוה ביותר בתערוכת מוסקבה של 1882, ואחר כך בזהב בפריז.


    את הארמון החלו לבנות לפני היקב. אדריכלים צרפתים תכננו אותו ב-1873, בנייתו נמשכה שתים-עשרה שנה, ולפי
    המסופר הובא גנן מוורסאי. אין זה השאטו בעל גג המנסרדה שהשם מעלה בדמיון: לבנים מטויחות על מסד גבוה,
    אגף מרכזי בן שתי קומות עם מעקות משוננים, מגדל בן שלוש קומות בקצה המזרחי, ואולם נשפים שמסתיים באפסיס
    חצי-עגול, שבו עמדה פעם במה. מנהרה חיברה את הבית ליקב. עבור האליטה הגאורגית של הבל אפוק, זה היה סלון
    של תרבות ופוליטיקה.


    המאה ה-20 לא היטיבה עם האחוזה. ב-2006 הוכרז הארמון כאתר מורשת בעל חשיבות לאומית, ב-2012 שוחזר, וחברת
    שאטו מוכראני מייצרת כאן שוב יין הנושא את שמו של איוואנה.


    לגמו כוס באחוזה, ואתם שותים את התשובה להימור שעשה איוואנה ב-1876: שענבים גאורגיים, בטיפול אירופי,
    יוכלו לעמוד בכבוד בפריז.
  tip: >-
    הביקורים מתנהלים בידי האחוזה עצמה, כסיורים מודרכים עם טעימות; המתכונות והמחירים משתנים, לכן בדקו והזמינו
    באתר של שאטו מוכראני, במיוחד בסופי שבוע ובעונת הבציר בספטמבר–אוקטובר, כשאירועים וחתונות עשויים לתפוס
    חלקים מהשטח. אם מישהו בחבורה טועם, מישהו אחר נוהג — הדרך חזרה לטביליסי עוברת בכביש מהיר. גן הארמון
    שטוח ונוח להליכה. שעתיים מספיקות לסיור ולטעימה, ולאחוזה יש מסעדה משלה — וזה חשוב, כי בכפר אין כמעט
    שום דבר אחר.
  route: >-
    צאו מטביליסי צפון-מערבה בכביש המהיר S1 (E60), עברו על פני מצחתה, והמשיכו בו כ-20 ק"מ נוספים אחרי מחלף
    מצחתה לפני שתרדו במחלף למוכראני (כביש Sh28). כ-3 ק"מ אחר כך תשלח אתכם כיכר אל כביש Sh151, אל תוך הכפר;
    האחוזה מסומנת בשלט בשולי הכפר, ובתוך השערים יש חניון חינם. בסך הכול כ-45 ק"מ ו-50 דקות ממרכז טביליסי,
    כביש סלול לכל אורכו וקל לכל רכב. תחנות דלק פזורות לאורך ה-S1. בדרך חזרה, שיו-מגווימה וסבטיצחובלי הן
    עצירות טבעיות.
ar:
  name: شاتو موخراني
  short: >-
    قصر الأمير إيفاني موخرانباتوني ومصنع نبيذه من القرن التاسع عشر، نال نبيذه الأوروبي الطراز الذهب في
    باريس عام 1889، ويعمل اليوم من جديد في سهل موخراني.
  body: >-
    **في عام 1889، العام الذي افتتحت فيه باريس برج إيفل، نال نبيذٌ من ضيعة أمير جورجي في سهل موخراني ميدالية
    ذهبية في المعرض العالمي نفسه.**


    انتقلت أراضي موخراني عام 1512 إلى فرع من الأسرة الملكية الباغراتيونية، هم آل موخرانباتوني، الذين حكموها
    إمارةً ذاتية الحكم حتى الضمّ الروسي عام 1801. أما وريثهم في القرن التاسع عشر، إيفاني موخرانباتوني،
    فقد قاتل في حروب القوقاز وحرب القرم ضابطاً في الجيش الروسي، وتقاعد برتبة فريق عام 1881، ثم صرف همّته
    إلى الزراعة. في عام 1876 دعا خبراء نبيذ من فرنسا، وأنشأ مع صانع النبيذ الجورجي زكريا جورجادزه مصنعاً
    للنبيذ بسعة نحو 1.2 مليون لتر، يصنع النبيذ بالطرق الأوروبية. فنال نبيذه أرفع جائزة في معرض موسكو عام
    1882، ثم ذهبية باريس.


    بُدئ بالقصر أولاً. صمّمه معماريون فرنسيون عام 1873، واستغرق بناؤه اثني عشر عاماً، ويُقال إن بستانياً
    جُلب من فرساي. وهو ليس الشاتو ذا السقف المنساردي الذي يوحي به الاسم: آجر مكسوّ بالجص على قاعدة عالية،
    وكتلة رئيسية من طابقين تعلوها حواجز مسنّنة، وبرج من ثلاثة طوابق في الطرف الشرقي، وقاعة رقص تنتهي بحنية
    نصف دائرية كانت تضم يوماً خشبة مسرح. وكان نفق يصل البيت بمصنع النبيذ. وبالنسبة إلى النخبة الجورجية
    في «الحقبة الجميلة»، كان المكان صالوناً للثقافة والسياسة.


    لم يرأف القرن العشرون بالضيعة. أُعلن القصر معلماً ذا أهمية وطنية عام 2006 ورُمّم عام 2012، وتنتج شركة
    «شاتو موخراني» النبيذ هنا من جديد باسم إيفاني.


    ارفع كأساً في الضيعة، فأنت تتذوّق الجواب عن رهانٍ عقده إيفاني عام 1876: أن العنب الجورجي، إذا عولج
    على الطريقة الأوروبية، قادر على أن يثبت جدارته في باريس.
  tip: >-
    تنظّم الضيعة الزيارات بنفسها في جولات بصحبة مرشد مع تذوّق؛ تتغيّر الصيغ والأسعار، فتحقق واحجز عبر
    موقع شاتو موخراني، خصوصاً في عطلات نهاية الأسبوع وموسم القطاف في سبتمبر وأكتوبر، حين قد تشغل الفعاليات
    وحفلات الأعراس أجزاءً من المكان. إن كان أحد في مجموعتك سيتذوّق، فليتولَّ غيره القيادة، فطريق العودة
    إلى تبليسي طريق سريع. حديقة القصر مستوية وسهلة المشي. تكفي ساعتان لجولة وتذوّق، وللضيعة مطعمها الخاص،
    وهذا مهم لأن القرية لا تقدّم سوى القليل.
  route: >-
    اسلك الطريق السريع S1 (E60) باتجاه الشمال الغربي من تبليسي متجاوزاً متسخيتا، وابقَ عليه نحو 20 كم
    بعد مخرج متسخيتا قبل أن تخرج عند تقاطع موخراني (الطريق Sh28). بعد نحو 3 كم يوجّهك دوّار إلى الطريق
    Sh151 نحو داخل القرية؛ والضيعة مشار إليها بلافتة على طرف القرية، وفيها موقف مجاني داخل البوابات. المسافة
    نحو 45 كم و50 دقيقة من وسط تبليسي، والطريق معبّد بالكامل وسهل لأي سيارة. تنتشر محطات الوقود على طول
    S1. وفي طريق العودة، يشكّل دير شيومغفيمي وكاتدرائية سفيتيتسخوفيلي محطتين طبيعيتين.
