ka:
  name: კუმურდოს ტაძარი
  short: >-
    964 წლის უგუმბათო ტაძარი ჯავახეთის ზეგანზე, ხუროთმოძღვარ საკოცრის წარწერით და დედოფლის, ლომის, არწივისა
    და ანგელოზის რელიეფებით.
  body: >-
    **ქართული ეკლესიები იშვიათად გვეუბნება, ვინ ააგო ისინი; კუმურდო კი თავის კედლებზე ამოკვეთილი ასოებით
    ასახელებს წელს, მეფეს, ეპისკოპოსსა და ოსტატს.**


    ასომთავრული წარწერები მოგვითხრობს, რომ 964 წელს, აფხაზთა მეფის ლეონ III-ის დროს, იოანე ეპისკოპოსმა
    ტაძრის საძირკველი ჩაყარა, ხუროთმოძღვარი კი საკუთარ სტრიქონს უმატებს: „...ხელითა ჩემ ცოდვილისა საკოცრისაითა“.
    საუბარი საუკუნეების მანძილზე გრძელდება: XI საუკუნეში ზოსიმე კუმურდოელმა ჩაწერა, როგორ შემოსა საკურთხეველი,
    ბარძიმ-ფეშხუმი და ჯვარი, XVI საუკუნის დასაწყისში კი ტაძრის „მეორედ აღმაშენებელმა“ ელისბალმა თავი დედასთან,
    ქრისტინესთან, და მეუღლესთან, მარეხთან, ერთად მოიხსენია — და ქვის ოსტატი მიქაელიც არ დაივიწყა.


    გეგმა თავსატეხია. გარედან ტაძარი ჯვრისებრია, შიგნით კი ხუთი ნახევარწრიული აფსიდია: ერთი აღმოსავლეთით,
    ორ-ორი ჩრდილოეთითა და სამხრეთით — წყვილ-წყვილად და პარალელურად, და არა რადიალურად, როგორც ექვსაფსიდიან
    ეკლესიებში; დასავლეთის მკლავი კი სწორკუთხაა. საქართველოში ზუსტად ასეთი მეორე არ არის. გუმბათი და კამარების
    დიდი ნაწილი ჩამოქცეულია, ამიტომ ცა პირდაპირ თავზე გადაგეშლებათ.


    ახლა ჩუქურთმას დაუთმეთ დრო. გარედან საკურთხევლის სარკმელს მახარებელთა სიმბოლოები — ანგელოზი, ლომი,
    არწივი და ხარი — ახლავს. შიგნით, დაკარგული გუმბათის ქვეშ, აფრაზე ბაგრატ III-ის, გაერთიანებული საქართველოს
    პირველი მეფის, დედა, გურანდუხტ დედოფალი, ხელებს იწვდის სამეფო სამოსით შემოსილი მამაკაცისკენ, რომელსაც
    მის ძმად, ლეონ მეფედ მიიჩნევენ — სწორედ იმ ლეონად, ვისაც აგების წარწერა ასახელებს. აღმოსავლეთ ფასადზე
    კი კაშკაშა წითელი ჯვარი კედლის მოვარდისფრო სიბრტყეზე ანთია.


    რესტავრატორები აქ 1930 წელს და 1970–1980 წლებში მოვიდნენ, ყოველთვის არა ფრთხილად — მთელი დასავლეთი
    მხარე დამახინჯებულადაა აღდგენილი, — 2015 წელს კი სრული რეკონსტრუქციის პროექტი შემუშავდა. მანამდე კუმურდო
    უგუმბათოდ დგას ზეგანზე, დაახლოებით 1750 მეტრზე, და მას მხოლოდ ქარი ავსებს.
  tip: >-
    ერთი საათი საკმარისია, თუ ჩუქურთმამ არ დაგაყოვნათ. ბინოკლი ან ზუმიანი ობიექტივი წამოიღეთ: საუკეთესო
    რელიეფები მაღლა, აფრებზე და აღმოსავლეთ სარკმლის ირგვლივაა. დილის შუქი აღმოსავლეთ ფასადსა და წითელ
    ჯვარს ეცემა. ტაძარს გუმბათი არ აქვს, ამიტომ მის შუაგულში წვიმისა და თითქმის მუდმივი ქარისგან თავს
    ვერ შეაფარებთ — ქარგაუმტარი ქურთუკი ზაფხულშიც გამოგადგებათ. კაფე, ტუალეტი და წყალი ადგილზე არ არის,
    ყველაფერი ახალქალაქში იყიდეთ. სარესტავრაციო ღობე ზოგჯერ ინტერიერის ნაწილს კეტავს. ეს ნაკურთხი ტაძარია,
    ამიტომ თავშეკავებულად ჩაიცვით; შესვლა უფასოა.
  route: >-
    თბილისიდან შ36-ით, კოჯრისა და მანგლისის გავლით, შემდეგ შ31-ით წალკამდე იარეთ, იქიდან კი ზეგნის გადაღმა,
    ფარავნის ტბისა და ნინოწმინდის გავლით, ახალქალაქამდე. კუმურდო ქალაქიდან დაახლოებით 12 კილომეტრზეა სამხრეთ-დასავლეთით,
    სოფლის გზით. სულ დაახლოებით 200 კილომეტრი და ოთხ საათზე ცოტა ნაკლები: ზეგნის ასფალტი არათანაბარია
    და სვლა ნელია. ბოლო კილომეტრები ნაწილობრივ ხრეშიანია. საწვავი წალკასა და ახალქალაქში ჩაასხით — მათ
    შორის ბენზინგასამართი სადგური ცოტაა. აიღეთ ჯიპი: სოფლის გზაზე კლირენსი გამოგადგებათ, ნოემბრიდან აპრილამდე
    კი თოვლი და ქარი ზეგანზე მგზავრობას სერიოზულ საქმედ აქცევს.
en:
  name: Kumurdo Cathedral
  short: >-
    A domeless cathedral of 964 on the Javakheti plateau, signed by its architect Sakotsari and carved
    with a queen, lions, eagles and angels.
  body: >-
    **Georgian churches seldom tell you who built them; Kumurdo names the year, the king, the bishop and
    the mason, cut into its own walls.**


    The asomtavruli inscriptions record that in 964, in the reign of Leon III, King of the Abkhazians,
    Bishop Ioane laid the foundations — and the architect adds a line of his own: 'by my hand, the sinful
    Sakotsari'. The conversation runs on for centuries. In the 11th century Bishop Zosime of Kumurdo recorded
    how he clad the altar, the chalice and paten and the cross; in the early 16th century Elisbal, 'second
    builder' of the church, named himself with his mother Kristine and his wife Marekh — and did not forget
    the mason, Mikael.


    The plan is a puzzle. Outside the church is a cross; inside there are five semicircular apses — one
    to the east, two each to the north and south, set in parallel pairs rather than radiating as in Georgia's
    six-apse churches — while the western arm is rectangular. Georgia has no other church quite like it.
    The dome and most of the vaults have fallen, so the sky opens straight above you.


    Now give the carving time. Outside, the altar window is framed by the symbols of the Evangelists:
    angel, lion, eagle and bull. Inside, beneath the missing dome, Queen Gurandukht, mother of Bagrat
    III, the first king of a united Georgia, reaches out from a squinch towards a man in royal robes identified
    as her brother, King Leon — the same Leon named in the founding inscription. On the east façade a
    bright red cross burns against the pinkish wall.


    Restorers came in 1930 and again in 1970–1980, not always gently — the whole west side was rebuilt
    in a distorted form — and in 2015 a project for full reconstruction was drawn up. Until then Kumurdo
    stands open to the sky on the plateau at about 1,750 m, and only the wind fills it.
  tip: >-
    An hour is enough, unless the carving holds you. Bring binoculars or a zoom lens: the best reliefs
    sit high on the squinches and around the east window, and morning light falls on the east façade and
    its red cross. The dome is gone, so the centre is open to rain and the near-constant wind; carry a
    windproof jacket even in summer. There is no café, toilet or water on site, so buy everything in Akhalkalaki.
    Restoration fencing sometimes closes part of the interior. It is a consecrated church, so dress modestly;
    entry is free.
  route: >-
    From Tbilisi take the Sh36 through Kojori and Manglisi and the Sh31 to Tsalka, then cross the plateau
    past Lake Paravani and Ninotsminda to Akhalkalaki. Kumurdo lies about 12 km south-west of the town
    by a village road. Reckon on about 200 km and just under four hours: the plateau asphalt is uneven
    and slow. The last few kilometres are partly gravel. Fill up in Tsalka and Akhalkalaki, as there are
    few stations between. Take an SUV: clearance helps on the village road, and from November to April
    snow and wind make the plateau serious driving.
ru:
  name: Кумурдойский собор
  short: >-
    Собор 964 года без купола на Джавахетском нагорье, подписанный зодчим Сакоцари, с резными царицей,
    львами, орлами и ангелами.
  body: >-
    **Грузинские храмы редко сообщают, кто их построил; Кумурдо называет год, царя, епископа и мастера
    — прямо на собственных стенах.**


    Надписи асомтаврули свидетельствуют, что в 964 году, в царствование Леона III, царя абхазов, епископ
    Иоане заложил основание храма, — а зодчий добавляет строку от себя: «рукою моею, грешного Сакоцари».
    Этот разговор тянется веками. В XI веке кумурдойский епископ Зосиме записал, как оковал престол, потир
    с дискосом и крест; в начале XVI века Элисбал, «второй строитель» церкви, назвал себя вместе с матерью
    Кристине и женой Марех — и не забыл каменщика Микаэла.


    План храма — загадка. Снаружи это крест, внутри же пять полукруглых апсид: одна на востоке, по две
    на севере и юге, причём попарно параллельных, а не расходящихся лучами, как в грузинских шестиапсидных
    храмах; западный рукав прямоугольный. Другой такой церкви в Грузии нет. Купол и большая часть сводов
    обрушились, и небо открывается прямо над головой.


    Теперь дайте время резьбе. Снаружи алтарное окно обрамляют символы евангелистов: ангел, лев, орёл
    и телец. Внутри, под исчезнувшим куполом, царица Гурандухт, мать Баграта III, первого царя объединённой
    Грузии, протягивает руку с тромпа к мужчине в царских одеждах, в котором узнают её брата, царя Леона,
    — того самого Леона, что назван в строительной надписи. На восточном фасаде ярко-красный крест горит
    на розоватой стене.


    Реставраторы приходили в 1930 году и снова в 1970–1980 годах, и не всегда бережно: всю западную часть
    перестроили в искажённом виде. В 2015 году был составлен проект полного восстановления. А пока Кумурдо
    стоит без купола на нагорье, на высоте около 1750 м, и заполняет его только ветер.
  tip: >-
    Хватит часа — если только резьба вас не задержит. Возьмите бинокль или зум-объектив: лучшие рельефы
    расположены высоко на тромпах и вокруг восточного окна, а утренний свет падает на восточный фасад
    с его красным крестом. Купола нет, так что в центре храма от дождя и почти непрерывного ветра не укрыться;
    ветровка нужна даже летом. Кафе, туалета и воды на месте нет — всё покупайте в Ахалкалаки. Реставрационное
    ограждение иногда перекрывает часть интерьера. Храм освящён, поэтому одевайтесь скромно; вход свободный.
  route: >-
    Из Тбилиси по Sh36 через Коджори и Манглиси, затем по Sh31 до Цалки, дальше через нагорье мимо озера
    Паравани и Ниноцминды до Ахалкалаки. Кумурдо лежит примерно в 12 км к юго-западу от города, по сельской
    дороге. Закладывайте около 200 км и чуть меньше четырёх часов: асфальт на нагорье неровный, быстро
    не поедешь. Последние несколько километров — местами гравий. Заправляйтесь в Цалке и Ахалкалаки: между
    ними заправок мало. Берите внедорожник: на сельской дороге клиренс пригодится, а с ноября по апрель
    снег и ветер делают езду по нагорью делом серьёзным.
fa:
  name: کلیسای جامع کوموردو
  short: >-
    کلیسای جامعی بی‌گنبد از سال ۹۶۴ بر فلات جاواختی، با امضای معمارش ساکوتساری و نقش‌برجسته‌هایی از ملکه،
    شیر، عقاب و فرشته.
  body: >-
    **کلیساهای گرجی کمتر می‌گویند چه کسی آن‌ها را ساخته است؛ اما کوموردو سال، شاه، اسقف و استادکار را
    بر دیوارهای خودش حک کرده است.**


    کتیبه‌های آسومتاورولی (قدیمی‌ترین خط گرجی) گواهی می‌دهند که در سال ۹۶۴، در روزگار لئون سوم، پادشاه
    آبخازها، اسقف یوآنه پی کلیسا را افکند، و معمار سطری از خود می‌افزاید: «به دست من، ساکوتساریِ گناهکار».
    این گفت‌وگو قرن‌ها ادامه می‌یابد. در سدهٔ یازدهم، زوسیمه، اسقف کوموردو، نوشت که چگونه محراب، جام و
    بشقاب مقدس و صلیب را روکش کرد؛ و در آغاز سدهٔ شانزدهم، الیسبال، «سازندهٔ دوم» کلیسا، نام خود را همراه
    با مادرش کریستینه و همسرش مارخ ثبت کرد، و استادکار سنگ‌تراش، میکائل، را هم از یاد نبرد.


    نقشهٔ کلیسا معمایی است. از بیرون صلیبی است، اما در درون پنج آپسیس نیم‌دایره دارد: یکی در شرق و دوتا
    در شمال و دوتا در جنوب، که جفت‌جفت موازی‌اند و نه پرتوی‌وار، آن‌گونه که در کلیساهای شش‌آپسیسی گرجستان
    دیده می‌شود؛ و بازوی غربی مستطیل است. در گرجستان کلیسای دیگری درست مانند آن نیست. گنبد و بیشتر طاق‌ها
    فرو ریخته‌اند و آسمان درست بالای سرتان گشوده است.


    حالا به کنده‌کاری‌ها فرصت دهید. در بیرون، پنجرهٔ محراب را نمادهای انجیل‌نویسان قاب گرفته‌اند: فرشته،
    شیر، عقاب و گاو نر. در درون، زیر گنبدِ از دست‌رفته، ملکه گوراندوخت، مادر باگرات سوم، نخستین پادشاه
    گرجستان یکپارچه، از روی یک سکنج دست به سوی مردی در جامهٔ شاهانه دراز کرده که او را برادرش، شاه لئون،
    دانسته‌اند؛ همان لئونی که در کتیبهٔ بنیاد نامش آمده است. بر نمای شرقی، صلیبی سرخ و درخشان بر دیواری
    صورتی‌فام می‌سوزد.


    مرمت‌گران در ۱۹۳۰ و بار دیگر در ۱۹۷۰–۱۹۸۰ آمدند، و همیشه با ملایمت رفتار نکردند: تمام بخش غربی به
    شکلی تحریف‌شده از نو ساخته شد. در ۲۰۱۵ طرحی برای بازسازی کامل تهیه شد. تا آن زمان، کوموردو بی‌گنبد
    بر فلات ایستاده است، در ارتفاع حدود ۱۷۵۰ متر، و تنها باد آن را پر می‌کند.
  tip: >-
    یک ساعت کافی است، مگر آنکه کنده‌کاری‌ها شما را نگه دارند. دوربین دوچشمی یا لنز زوم بیاورید: بهترین
    نقش‌برجسته‌ها بالا، روی سکنج‌ها و گرداگرد پنجرهٔ شرقی‌اند، و نور صبح بر نمای شرقی و صلیب سرخش می‌تابد.
    کلیسا گنبد ندارد، پس میانهٔ آن در برابر باران و باد تقریباً همیشگی بی‌پناه است؛ حتی در تابستان بادگیر
    همراه داشته باشید. در محل نه کافه‌ای هست، نه سرویس بهداشتی و نه آب؛ همه‌چیز را از آخالکالاکی بخرید.
    گاهی حصار مرمت بخشی از فضای درون را می‌بندد. این کلیسا تقدیس‌شده است، پس لباس پوشیده بپوشید؛ ورود
    رایگان است.
  route: >-
    از تفلیس جادهٔ Sh36 را از راه کوجوری و مانگلیسی بگیرید و سپس Sh31 را تا تسالکا، و بعد از فلات بگذرید،
    از کنار دریاچهٔ پاراوانی و نینوتسمیندا، تا آخالکالاکی. کوموردو حدود ۱۲ کیلومتر در جنوب‌غربی شهر است،
    از راه یک جادهٔ روستایی. حدود ۲۰۰ کیلومتر و کمی کمتر از چهار ساعت حساب کنید: آسفالت فلات ناهموار و
    کُند است. چند کیلومتر آخر تا حدی شنی است. در تسالکا و آخالکالاکی سوخت بگیرید، چون میانشان پمپ‌بنزین
    اندک است. شاسی‌بلند بگیرید: در جادهٔ روستایی ارتفاع از زمین به کار می‌آید، و از نوامبر تا آوریل برف
    و باد رانندگی بر فلات را کاری جدی می‌کنند.
he:
  name: קתדרלת קומורדו
  short: >-
    קתדרלה ללא כיפה משנת 964 ברמת ג'אוואחטי, חתומה בידי האדריכל סקוצארי ומגולפת בדמויות של מלכה, אריות,
    נשרים ומלאכים.
  body: >-
    **כנסיות גאורגיות ממעטות לספר מי בנה אותן; קומורדו מציינת את השנה, את המלך, את הבישוף ואת הבנאי, חקוקים
    בקירותיה שלה.**


    הכתובות בכתב אסומתאוורולי מתעדות שבשנת 964, בימי לאון השלישי, מלך האבחזים, הניח הבישוף יואנה את היסודות
    – והאדריכל מוסיף שורה משלו: «בידי, סקוצארי החוטא». השיחה הזאת נמשכת לאורך מאות שנים. במאה ה-11 רשם
    זוסימה, בישוף קומורדו, כיצד ציפה את המזבח, את הגביע והדיסקוס ואת הצלב; ובראשית המאה ה-16 הזכיר אליסבל,
    «הבונה השני» של הכנסייה, את שמו יחד עם אמו קריסטינה ורעייתו מארך – ולא שכח את הסתת, מיכאל.


    התוכנית היא חידה. מבחוץ הכנסייה היא צלב; מבפנים יש בה חמש אפסידות חצי-עגולות – אחת במזרח, שתיים בצפון
    ושתיים בדרום, ערוכות בזוגות מקבילים ולא כקרניים היוצאות ממרכז כמו בכנסיות שש-האפסידות של גאורגיה –
    ואילו הזרוע המערבית מלבנית. אין בגאורגיה כנסייה אחרת שדומה לה ממש. הכיפה ורוב הקמרונות קרסו, והשמיים
    נפתחים ישירות מעל ראשכם.


    עכשיו הקדישו זמן לגילופים. מבחוץ ממסגרים את חלון המזבח סמלי האוונגליסטים: מלאך, אריה, נשר ושור. בפנים,
    מתחת לכיפה החסרה, המלכה גורנדוכט, אמו של בגרט השלישי, המלך הראשון של גאורגיה המאוחדת, מושיטה יד מתוך
    טרומפ (קשת פינתית) אל גבר בבגדי מלכות, שזוהה כאחיה, המלך לאון – אותו לאון הנזכר בכתובת הייסוד. על
    החזית המזרחית בוער צלב אדום עז על רקע הקיר הוורדרד.


    משקמים הגיעו ב-1930 ושוב ב-1970–1980, ולא תמיד בעדינות: כל הצד המערבי נבנה מחדש בצורה מעוותת. ב-2015
    הוכנה תוכנית לשחזור מלא. עד אז עומדת קומורדו ללא כיפה על הרמה, בגובה של כ-1,750 מטר, ורק הרוח ממלאת
    אותה.
  tip: >-
    שעה מספיקה, אלא אם הגילופים יעצרו אתכם. הביאו משקפת או עדשת זום: התבליטים הטובים ביותר נמצאים גבוה
    על הטרומפים וסביב החלון המזרחי, ואור הבוקר נופל על החזית המזרחית ועל הצלב האדום שבה. לכנסייה אין כיפה,
    כך שבמרכזה אין מחסה מפני גשם ומפני הרוח שכמעט אינה פוסקת; קחו מעיל רוח גם בקיץ. אין במקום בית קפה,
    שירותים או מים, לכן קנו הכול באחלקלקי. גדר שיקום סוגרת לעיתים חלק מן הפנים. זוהי כנסייה מקודשת, לכן
    התלבשו בצניעות; הכניסה חופשית.
  route: >-
    מטביליסי סעו בכביש Sh36 דרך קוג'ורי ומנגליסי, ואחר כך בכביש Sh31 עד צאלקה; משם חצו את הרמה, על פני
    אגם פרוואני ונינוצמינדה, עד אחלקלקי. קומורדו נמצאת כ-12 ק"מ מדרום-מערב לעיר, בדרך כפרית. חשבו על כ-200
    ק"מ וקצת פחות מארבע שעות נסיעה: האספלט ברמה משובש ואיטי. הקילומטרים האחרונים הם בחלקם חצץ. תדלקו בצאלקה
    ובאחלקלקי, כי ביניהן יש מעט תחנות. קחו רכב שטח: מרווח גחון עוזר בדרך הכפרית, ומנובמבר עד אפריל השלג
    והרוח הופכים את הנהיגה ברמה לעניין רציני.
ar:
  name: كاتدرائية كومردو
  short: >-
    كاتدرائية بلا قبة من عام 964 على هضبة جافاخيتي، وقّعها معمارها ساكوتساري، ونُحتت عليها ملكة وأسود
    ونسور وملائكة.
  body: >-
    **قلّما تخبركم الكنائس الجورجية بمن بناها؛ أما كومردو فتذكر السنة والملك والأسقف والبنّاء، محفورة
    على جدرانها نفسها.**


    تسجّل النقوش المكتوبة بخط الأسومتافرولي أنه في عام 964، في عهد ليون الثالث ملك الأبخاز، وضع الأسقف
    يوانه الأساسات، ثم يضيف المعمار سطراً من عنده: «بيدي أنا، ساكوتساري الخاطئ». ويمتد هذا الحوار قروناً.
    ففي القرن الحادي عشر دوّن زوسيمه، أسقف كومردو، كيف كسا المذبح والكأس والصينية والصليب؛ وفي مطلع القرن
    السادس عشر ذكر إليسبال، «الباني الثاني» للكنيسة، اسمه مع أمه كريستينه وزوجته ماريخ، ولم ينسَ البنّاء
    ميكائيل.


    المخطط لغز. من الخارج تبدو الكنيسة صليباً، أما في الداخل فخمس حنايا نصف دائرية: واحدة في الشرق، واثنتان
    في كلٍّ من الشمال والجنوب، مصفوفة أزواجاً متوازية لا متشعبة كالأشعة كما في الكنائس الجورجية ذات الحنايا
    الست، أما الذراع الغربية فمستطيلة. ليس في جورجيا كنيسة أخرى تشبهها تماماً. سقطت القبة ومعظم الأقبية،
    فالسماء مفتوحة فوقكم مباشرة.


    والآن امنحوا النحت وقته. في الخارج تؤطّر نافذةَ المذبح رموزُ الإنجيليين: الملاك والأسد والنسر والثور.
    وفي الداخل، تحت القبة الغائبة، تمدّ الملكة غوراندوخت، أمّ باغرات الثالث أول ملوك جورجيا الموحدة، يدها
    من حنية ركنية نحو رجل في ثياب ملكية يُعرَّف بأنه أخوها الملك ليون، وهو ليون نفسه المذكور في نقش التأسيس.
    وعلى الواجهة الشرقية يتّقد صليب أحمر ساطع على الجدار الوردي.


    جاء المرمّمون عام 1930، ثم مرة أخرى في 1970–1980، ولم يكونوا رفيقين دائماً: فقد أُعيد بناء الجهة الغربية
    كلها بصورة مشوّهة. وفي عام 2015 أُعدّ مشروع لإعادة البناء الكاملة. وإلى أن يحين ذلك تقف كومردو بلا
    قبة على الهضبة، على ارتفاع نحو 1750 متراً، ولا يملؤها إلا الريح.
  tip: >-
    تكفي ساعة، ما لم يستوقفكم النحت. أحضروا منظاراً أو عدسة تقريب: أجمل النقوش البارزة تقع عالياً على
    الحنايا الركنية وحول النافذة الشرقية، وضوء الصباح يسقط على الواجهة الشرقية وصليبها الأحمر. الكنيسة
    بلا قبة، فلا ملجأ في وسطها من المطر أو من الريح التي تكاد لا تهدأ؛ خذوا سترة واقية من الريح حتى في
    الصيف. لا مقهى ولا دورة مياه ولا ماء في الموقع، فاشتروا كل شيء من أخالكالاكي. قد يغلق سياج الترميم
    جزءاً من الداخل أحياناً. إنها كنيسة مكرّسة، فالبسوا ملابس محتشمة؛ والدخول مجاني.
  route: >-
    من تبليسي خذوا الطريق Sh36 عبر كوجوري ومانغليسي، ثم Sh31 إلى تسالكا، وبعدها اعبروا الهضبة مروراً ببحيرة
    بارافاني ونينوتسميندا حتى أخالكالاكي. تقع كومردو على بعد نحو 12 كم جنوب غربي المدينة عبر طريق قروي.
    احسبوا نحو 200 كم وأقل بقليل من أربع ساعات: الأسفلت على الهضبة متموّج وبطيء. بعض الكيلومترات الأخيرة
    حصوية جزئياً. تزوّدوا بالوقود في تسالكا وأخالكالاكي، فالمحطات بينهما قليلة. اختاروا سيارة دفع رباعي:
    فالخلوص الأرضي يفيد على الطريق القروي، ومن نوفمبر إلى أبريل تجعل الثلوج والرياح القيادة على الهضبة
    أمراً جدياً.
