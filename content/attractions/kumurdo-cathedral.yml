ka:
  name: კუმურდოს ტაძარი
  short: 964 წლით ზუსტად დათარიღებული ტაძარი ჯავახეთის ზეგანზე, ახალქალაქთან, იშვიათი ექვსაფსიდიანი გეგმით.
  body: >-
    **კუმურდო იმ იშვიათ ქართულ ძეგლთა შორისაა, რომლის აგების წელი ზუსტად ვიცით.** ჩრდილოეთ აფსიდაზე შემორჩენილი
    ასომთავრული წარწერა ამბობს, რომ ტაძარი 964 წელს აშენდა მეფე ლეონის დროს, ეპისკოპოს იოანეს ზრუნვით,
    ხოლო ხუროთმოძღვარი საკოცარი იყო. შუა საუკუნეების ქართველი არქიტექტორის სახელი მხოლოდ რამდენიმე შემთხვევაშია
    ცნობილი — ეს ერთ-ერთია.


    გეგმა უცნაურია და ქართულ ხუროთმოძღვრებაში თითქმის უნიკალური: ცენტრალური სივრცე ექვსკუთხაა, გარშემო
    ექვსი აფსიდით, ანუ არა ჩვეულებრივი ჯვრული, არამედ ცენტრული კომპოზიცია. გუმბათი დიდი ხნის წინ ჩამოინგრა
    და დღეს არ არსებობს, ამიტომ შიგნით შესვლისას ცა პირდაპირ თავზე გაქვს.


    ქვის კვეთა ცალკე მისახედია: სვეტისთავები, სარკმლების ჩარჩოები და აფსიდის დეტალები X საუკუნის საუკეთესო
    ნიმუშებია, გეომეტრიული და მცენარეული ორნამენტით. მასალა ადგილობრივი ვულკანური ქვაა — მოშავო-რუხი,
    რომელიც ჯავახეთის ზეგანის ფერს იმეორებს.


    ისმის კითხვა, რატომ დგას ამ მასშტაბის ნაგებობა ცარიელ მინდორში. პასუხი ისაა, რომ კუმურდო საეპისკოპოსო
    ცენტრი იყო და ჯავახეთის სამწყსოს მთავარი ტაძარი; მაშინდელი დასახლება მის გარშემო გაცილებით დიდი იყო.
    XX და XXI საუკუნეებში კედლების ნაწილი გამაგრდა და აღდგა — ახალი წყობა ძველისგან ფერითა და დამუშავებით
    მკაფიოდ განსხვავდება.


    ადგილი მკაცრია. კუმურდო ახალქალაქიდან დაახლოებით ათ კილომეტრში, უტყეო ზეგანზე, 1750 მეტრზე დგას; გარშემო
    მინდვრები და ქვის ღობეებია, ხე თითქმის არ ჩანს, ქარი კი თითქმის ყოველთვის ქრის. ზაფხულის საღამოს,
    როცა შუქი დაბლა მოდის, ტაძრის მოშავო ქვა თბილ ტონს იღებს — სწორედ მაშინაა აქ ყველაზე კარგი.


    ზამთარში სიტუაცია სხვაა: ნოემბრიდან აპრილამდე ზეგანი თოვლშია, ღამის ტემპერატურა მინუს ოცამდე ეშვება
    და ქარი თოვლს გზაზე ანაწილებს. მთავარი გზები იწმინდება, სოფლის შესახვევები — არა ყოველთვის.
  tip: >-
    ერთი საათი საკმარისია, თუმცა კვეთის დათვალიერებას მეტიც შეიძლება მოუნდე. ტაძარი უგუმბათოა და შიგნით
    ღიაა — წვიმაში თავშესაფარი არ არსებობს. ქარი მუდმივია, ზაფხულშიც ქარსაცავი ჯემპერი გამოგადგება. ტერიტორიაზე
    არც კაფეა, არც ტუალეტი, არც წყალი; ყველაფერი ახალქალაქში იყიდე. სარესტავრაციო სამუშაოების გამო ზოგჯერ
    ნაწილი შემოღობილია. ჩაცმის ჩვეულებრივი წესები მოქმედებს, თუმცა მუდმივი მღვდელი აქ არაა.
  route: >-
    თბილისიდან წალკისა და ფარავნის გავლით ახალქალაქამდე — დაახლოებით 215 კმ, შემდეგ სამხრეთ-დასავლეთით
    კიდევ ათი კილომეტრი კუმურდოს სოფლისკენ. სულ 228 კმ, ოთხ საათამდე. მთავარი გზა ასფალტია, თუმცა ზეგანზე
    მისი ხარისხი ცვალებადია და მოგზაურობა ნელია; ბოლო კილომეტრები სოფლის გზაა, ნაწილობრივ მოხრეშილი. საწვავი
    წალკასა და ახალქალაქში აიღე — შუალედში სადგურები იშვიათია. კლირენსიანი ავტომობილი სასურველია.
en:
  name: Kumurdo Cathedral
  short: >-
    A cathedral precisely dated to 964, standing on the Javakheti plateau near Akhalkalaki on a rare six-apse
    plan.
  body: >-
    **Kumurdo is one of the few Georgian monuments whose exact year of construction is known.** An inscription
    in asomtavruli script surviving on the north apse states that the church was built in 964, in the
    reign of King Leon, under the care of Bishop Ioane, and that the architect was Sakotsari. The names
    of medieval Georgian architects are recorded in only a handful of cases; this is one of them.


    The plan is strange and close to unique in Georgia: the central space is a hexagon surrounded by six
    apses, a centralised composition rather than the usual cross. The dome collapsed long ago and is gone,
    so standing inside you have open sky above you.


    The carving deserves a slow look. The capitals, window surrounds and apse details are among the best
    10th-century work in the country, geometric and vegetal at once. The material is the local volcanic
    stone, a dark grey that repeats the colour of the plateau itself.


    It is fair to ask why a building of this scale stands in an empty field. The answer is that Kumurdo
    was an episcopal seat, the principal church of the Javakheti diocese, and the settlement around it
    was once far larger. During the 20th and 21st centuries parts of the walls were consolidated and rebuilt;
    the new masonry is easy to tell from the old by both colour and finish.


    The setting is severe. Kumurdo stands about ten kilometres from Akhalkalaki on treeless upland at
    1,750 metres, surrounded by fields and dry-stone walls, with hardly a tree in sight and wind blowing
    almost constantly. On a summer evening, when the light drops low, the dark stone warms and the place
    is at its best.


    Winter is a different proposition. From November to April the plateau is under snow, night temperatures
    fall to around minus twenty, and wind redistributes the snow across the roads. Main roads are cleared;
    village turnings are not always.
  tip: >-
    An hour covers it, though the carving can hold you longer. The church has no dome and is open to the
    sky, so there is no shelter if it rains. The wind is constant and a windproof layer is useful even
    in summer. There is no cafe, no toilet and no water on site, so buy everything in Akhalkalaki. Restoration
    work occasionally fences off part of the building. Normal church dress rules apply, although no priest
    is permanently based here.
  route: >-
    From Tbilisi drive via Tsalka and Lake Paravani to Akhalkalaki, roughly 215 km, then continue about
    ten kilometres south-west towards Kumurdo village. The total is 228 km and close to four hours. The
    main road is asphalt, but its quality varies once you are on the plateau and progress is slow; the
    last few kilometres are a village road, partly gravel. Fill up in Tsalka and Akhalkalaki, since stations
    in between are scarce. A car with decent ground clearance is preferable.
ru:
  name: Собор Кумурдо
  short: Собор, точно датированный 964 годом, на Джавахетском плато у Ахалкалаки, с редким шестиапсидным
    планом.
  body: >-
    **Кумурдо — один из немногих грузинских памятников, для которых известен точный год постройки.** Надпись
    асомтаврули, сохранившаяся на северной апсиде, сообщает, что храм возведён в 964 году, в царствование
    Леона, попечением епископа Иоанэ, а зодчим был Сакоцари. Имена средневековых грузинских архитекторов
    известны буквально в единичных случаях, и это один из них.


    План странный и для Грузии почти уникальный: центральное пространство представляет собой шестиугольник,
    окружённый шестью апсидами, то есть композицию центрическую, а не привычную крестовую. Купол обрушился
    давно и не восстановлен, так что, стоя внутри, вы видите над собой открытое небо.


    Резьбу стоит рассматривать неторопливо. Капители, обрамления окон и детали апсид относятся к лучшему,
    что было сделано в X веке: геометрический и растительный орнамент одновременно. Материал — местный
    вулканический камень, тёмно-серый, повторяющий цвет самого плато.


    Резонно спросить, почему здание такого масштаба стоит в пустом поле. Ответ в том, что Кумурдо был
    епископской кафедрой, главным храмом джавахетской епархии, а поселение вокруг него когда-то было гораздо
    больше. В XX и XXI веках часть стен укрепили и восстановили; новая кладка легко отличима от старой
    и по цвету, и по обработке.


    Место суровое. Кумурдо стоит примерно в десяти километрах от Ахалкалаки, на безлесном нагорье высотой
    1750 метров, среди полей и каменных изгородей, деревьев почти нет, а ветер дует почти всегда. Летним
    вечером, когда свет ложится низко, тёмный камень теплеет — тогда здесь лучше всего.


    Зима — совсем другая история. С ноября по апрель плато под снегом, ночью до минус двадцати, а ветер
    переносит снег на дороги. Магистрали чистят, съезды к сёлам — далеко не всегда.
  tip: >-
    Часа достаточно, хотя резьба может задержать дольше. У храма нет купола, он открыт небу, так что укрыться
    от дождя негде. Ветер постоянный, ветрозащитный слой пригодится даже летом. На месте нет ни кафе,
    ни туалета, ни воды — покупайте всё в Ахалкалаки. Из-за реставрационных работ часть здания иногда
    огорожена. Действуют обычные правила одежды для храма, хотя постоянного священника здесь нет.
  route: >-
    Из Тбилиси через Цалку и озеро Паравани до Ахалкалаки, примерно 215 км, затем ещё около десяти километров
    на юго-запад к селу Кумурдо. Всего 228 км, около четырёх часов. Основная дорога асфальтированная,
    но на плато её качество меняется и ехать приходится медленно; последние километры — сельская дорога,
    частично гравийная. Заправляйтесь в Цалке и Ахалкалаки, между ними станции редки. Желателен автомобиль
    с нормальным клиренсом.
fa:
  name: کلیسای جامع کومردو
  short: کلیسایی با تاریخ دقیق ۹۶۴ میلادی بر فلات جاواخِتی نزدیک آخالکالاکی، با طرح کمیاب شش‌محرابی.
  body: >-
    **کومردو از معدود یادمان‌های گرجستان است که سال ساختش را دقیق می‌دانیم.** کتیبه‌ای به خط آسومتاورولی
    که بر محراب شمالی مانده می‌گوید این کلیسا در سال ۹۶۴ و در روزگار پادشاه لئون و به همت اسقف یوانه ساخته
    شد و معمارش ساکوتساری بود. نام معماران گرجی سده‌های میانه تنها در چند مورد ثبت شده و این یکی از آنهاست.


    طرح بنا عجیب و در گرجستان تقریباً بی‌مانند است: فضای مرکزی شش‌ضلعی است و شش محراب گرد آن نشسته، یعنی
    ترکیبی مرکزگرا به جای نقشهٔ صلیبی معمول. گنبد سال‌ها پیش فرو ریخته و بازسازی نشده، پس وقتی درون بایستید
    آسمان باز بالای سرتان است.


    کنده‌کاری‌ها را باید آهسته دید. سرستون‌ها، قاب پنجره‌ها و جزئیات محراب از بهترین کارهای سدهٔ دهم در
    کشورند، هم‌زمان هندسی و گیاهی. مصالح، سنگ آتشفشانی محلی است؛ خاکستری تیره‌ای که رنگ خود فلات را تکرار
    می‌کند.


    به‌جاست بپرسیم چرا بنایی به این بزرگی در مزرعه‌ای خالی ایستاده است. پاسخ آن است که کومردو کرسی اسقفی
    و کلیسای اصلی اسقف‌نشین جاواخِتی بود، و آبادی پیرامونش روزگاری بسیار بزرگ‌تر بود. در سده‌های بیستم
    و بیست‌ویکم بخشی از دیوارها تحکیم و بازسازی شد؛ و بنّایی تازه را هم از رنگ و هم از پرداخت می‌توان
    از کهنه بازشناخت.


    محیط سخت‌گیر است. کومردو حدود ده کیلومتر از آخالکالاکی دور است، بر بلندی بی‌درخت و در ارتفاع ۱۷۵۰
    متر، میان کشتزارها و دیوارهای سنگ‌چین، بی هیچ درختی و با بادی که تقریباً همیشه می‌وزد. عصر تابستان،
    وقتی نور کم‌ارتفاع می‌تابد، سنگ تیره گرم می‌شود و بهترین حالت اینجاست.


    زمستان داستانی دیگر است. از نوامبر تا آوریل فلات زیر برف است، دمای شب تا حدود منفی بیست می‌رسد و باد
    برف را روی جاده‌ها می‌ریزد. راه‌های اصلی برف‌روبی می‌شود، انحراف‌های روستایی همیشه نه.
  tip: >-
    یک ساعت کافی است، هرچند کنده‌کاری‌ها ممکن است بیشتر نگهتان دارند. کلیسا گنبد ندارد و رو به آسمان باز
    است، پس در باران پناهی نیست. باد پیوسته است و لایهٔ بادگیر حتی در تابستان به کار می‌آید. در محوطه
    نه کافه هست نه سرویس بهداشتی نه آب؛ همه‌چیز را در آخالکالاکی بخرید. گاهی به سبب مرمت بخشی از بنا حصار
    می‌شود. قواعد معمول پوشش کلیسا برقرار است، هرچند کشیش ثابتی اینجا مستقر نیست.
  route: >-
    از تفلیس از راه تسالکا و دریاچهٔ پاراوانی تا آخالکالاکی، حدود ۲۱۵ کیلومتر، و سپس ده کیلومتر دیگر به
    جنوب‌غرب به سوی روستای کومردو. مجموع ۲۲۸ کیلومتر و نزدیک چهار ساعت. جادهٔ اصلی آسفالت است اما کیفیتش
    روی فلات تغییر می‌کند و پیشروی کند است؛ چند کیلومتر پایانی راه روستایی و تا حدی شنی است. در تسالکا
    و آخالکالاکی سوخت بگیرید، چون پمپ‌ها در میانه کم‌اند. خودرویی با ارتفاع کف مناسب بهتر است.
he:
  name: קתדרלת קומורדו
  short: קתדרלה שתאריכה המדויק 964 לספירה, על רמת ג'וואחתי ליד אחלכלאקי, בתוכנית נדירה של שש אפסידות.
  body: >-
    **קומורדו היא אחד המונומנטים הבודדים בגאורגיה שנת בנייתם המדויקת ידועה.** כתובת בכתב אסומתאורולי ששרדה
    על האפסידה הצפונית מספרת שהכנסייה נבנתה בשנת 964, בימי המלך לאון, בהשגחת הבישוף יואנה, ושהאדריכל היה
    סקוצארי. שמותיהם של אדריכלים גאורגים מימי הביניים נרשמו רק במקרים בודדים, וזה אחד מהם.


    התוכנית מוזרה וכמעט חסרת תקדים בגאורגיה: החלל המרכזי הוא משושה שסביבו שש אפסידות, כלומר הרכב מרכזי
    ולא צלב רגיל. הכיפה קרסה מזמן ואינה קיימת, ולכן העומד בפנים רואה מעליו שמיים פתוחים.


    את הגילוף כדאי לבחון לאט. הכותרות, מסגרות החלונות ופרטי האפסידות הם מן העבודות הטובות ביותר של המאה
    ה-10 בארץ, גיאומטריות וצמחיות בעת ובעונה אחת. החומר הוא אבן געשית מקומית, אפורה כהה החוזרת על צבע
    הרמה עצמה.


    מתבקש לשאול מדוע מבנה בקנה מידה כזה עומד בשדה ריק. התשובה היא שקומורדו הייתה מושב בישוף, הכנסייה הראשית
    של דיוקסיית ג'וואחתי, והיישוב סביבה היה בעבר גדול בהרבה. במאה ה-20 ובמאה ה-21 חוזקו ונבנו מחדש חלקים
    מן החומות; את הבנייה החדשה קל להבחין מן הישנה גם בצבע וגם בגימור.


    הסביבה קשוחה. קומורדו עומדת כעשרה קילומטרים מאחלכלאקי, על רמה חשופה מעצים בגובה 1,750 מטר, בין שדות
    וגדרות אבן, כמעט בלי עץ אחד, ורוח נושבת כמעט תמיד. בערב קיץ, כשהאור נופל נמוך, האבן הכהה מתחממת וזה
    הרגע היפה ביותר כאן.


    החורף הוא עניין אחר לגמרי. מנובמבר עד אפריל הרמה מכוסה שלג, הטמפרטורה בלילה יורדת לסביבות מינוס עשרים,
    והרוח מפזרת שלג על הכבישים. הכבישים הראשיים מפונים; הפניות אל הכפרים לא תמיד.
  tip: >-
    שעה מכסה את המקום, אם כי הגילוף עשוי להחזיק אתכם יותר. לכנסייה אין כיפה והיא פתוחה לשמיים, ולכן אין
    מחסה אם יורד גשם. הרוח קבועה ושכבה אוטמת רוח מועילה גם בקיץ. אין באתר בית קפה, שירותים או מים, אז
    קנו הכול באחלכלאקי. עבודות שימור חוסמות מדי פעם חלק מן המבנה. חלים כללי לבוש רגילים של כנסייה, אף
    שאין כאן כומר קבוע.
  route: >-
    מטביליסי דרך צלקה ואגם פרוואני עד אחלכלאקי, כ-215 ק״מ, ומשם עוד כעשרה קילומטרים דרומה-מערבה לכפר קומורדו.
    בסך הכול 228 ק״מ, קרוב לארבע שעות. הדרך הראשית סלולה, אך איכותה משתנה על הרמה והנסיעה איטית; הקילומטרים
    האחרונים הם דרך כפרית וחלקה חצץ. תדלקו בצלקה ובאחלכלאקי, שכן בין השתיים תחנות מעטות. עדיף רכב עם מרווח
    גחון סביר.
ar:
  name: كاتدرائية كومردو
  short: كاتدرائية مؤرخة بدقة بعام 964 على هضبة جاواخيتي قرب أخالكالاكي، بمخطط نادر من ست حنيات.
  body: >-
    **كومردو من الآثار القليلة في جورجيا التي نعرف سنة بنائها بدقة.** فنقش بخط الأسومتافرولي بقي على الحنية
    الشمالية يقول إن الكنيسة بُنيت عام 964 في عهد الملك ليون وبرعاية الأسقف يوانه، وإن معمارها ساكوتساري.
    ولم تُسجل أسماء المعماريين الجورجيين في العصور الوسطى إلا في حالات معدودة، وهذه إحداها.


    والمخطط غريب ويكاد يكون فريداً في جورجيا: الفضاء المركزي مسدس تحيط به ست حنيات، أي تكوين مركزي لا
    صليبي كالمعتاد. أما القبة فانهارت منذ زمن بعيد ولم تُعَد، فمن يقف في الداخل ترتفع فوقه سماء مفتوحة.


    ويستحق النقش نظرة متأنية. فالتيجان وأطر النوافذ وتفاصيل الحنيات من أجود أعمال القرن العاشر في البلاد،
    هندسية ونباتية في آن. والمادة حجر بركاني محلي رمادي داكن يعيد لون الهضبة نفسها.


    ومن حق المرء أن يسأل لماذا يقوم بناء بهذا الحجم في حقل خالٍ. والجواب أن كومردو كانت كرسياً أسقفياً
    وكنيسة أبرشية جاواخيتي الأولى، وأن العمران حولها كان يوماً أوسع بكثير. وفي القرنين العشرين والحادي
    والعشرين دُعّمت أجزاء من الأسوار وأُعيد بناؤها؛ ويسهل تمييز البناء الجديد من القديم لوناً وصنعة.


    والمحيط قاسٍ. تقوم كومردو على نحو عشرة كيلومترات من أخالكالاكي فوق نجد بلا شجر على ارتفاع 1750 متراً،
    بين حقول وأسوار حجر جاف، لا تكاد ترى شجرة، والريح تهب على الدوام تقريباً. وفي مساء صيفي، حين ينخفض
    الضوء، يدفأ الحجر الداكن ويكون المكان في أحسن أحواله.


    أما الشتاء فشأن آخر. من نوفمبر إلى أبريل تكون الهضبة تحت الثلج، وتهبط حرارة الليل إلى نحو عشرين تحت
    الصفر، وتنقل الريح الثلج إلى الطرق. الطرق الرئيسية تُكسح، أما مداخل القرى فليس دائماً.
  tip: >-
    ساعة تكفي، وإن كان النقش قد يحتجزك أطول. لا قبة للكنيسة وهي مفتوحة على السماء، فلا ملجأ إن هطل المطر.
    والريح دائمة وطبقة صادّة للريح مفيدة حتى صيفاً. ولا مقهى ولا دورة مياه ولا ماء في الموقع، فاشترِ كل
    شيء في أخالكالاكي. وأعمال الترميم تسيّج أحياناً جزءاً من البناء. وتُطبق قواعد اللباس المعتادة للكنيسة
    وإن لم يكن هنا كاهن مقيم.
  route: >-
    من تبليسي عبر تسالكا وبحيرة بارافاني إلى أخالكالاكي، نحو 215 كم، ثم عشرة كيلومترات أخرى جنوباً غرباً
    نحو قرية كومردو. المجموع 228 كم ونحو أربع ساعات. الطريق الرئيسي معبّد لكن جودته تتفاوت فوق الهضبة
    والسير بطيء؛ والكيلومترات الأخيرة طريق قروي بعضه حصوي. تزوّد بالوقود في تسالكا وأخالكالاكي، فالمحطات
    بينهما نادرة. ويفضل مركبة بارتفاع هيكل معقول.
