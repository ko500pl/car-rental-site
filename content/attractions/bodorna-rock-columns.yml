ka:
  name: ბოდორნის სვეტები
  short: >-
    15-მეტრიანი ბუნებრივი სვეტი არაგვის ხეობის ფერდობზე, ძირში გამოკვეთილი სენაკით — კაცხის სვეტის ნაკლებად
    ცნობილი მოძმე სამხედრო გზის პირას.
  body: >-
    **საქართველოს სამხედრო გზიდან სულ 70–80 მეტრში, არაგვის ხეობის ფერდობზე, 15-მეტრიანი ქვის სვეტი დგას
    — და მძღოლების უმეტესობა მას ვერც კი ამჩნევს.**


    ადგილობრივები მას „წოწოლა კლდეს“ ეძახიან, და სახელი ზუსტია: ოთხმეტრიანი ძირიდან სვეტი თანდათან ვიწროვდება,
    თხემზე კი ბუჩქები ამოსდის. დგას ბოდორნის XVII საუკუნის ღვთისმშობლის ეკლესიიდან სამხრეთ-აღმოსავლეთით,
    დაახლოებით 150 მეტრზე, არაგვის მარჯვენა ნაპირის ციცაბო, ტყიან ფერდობზე. გეოგრაფები მას დენუდაციურ
    მოწმედ მიიჩნევენ — ნეოგენური კონგლომერატის, ანუ ბუნებრივად შეცემენტებული რიყნარის ნარჩენად, რომელიც
    ფერდობის ჩამორეცხვის შემდეგ მარტო დარჩა. მისი ზუსტი წარმოშობა და ისიც, შეეხო თუ არა მის წესიერ მოყვანილობას
    ადამიანის ხელი, დღემდე ღია კითხვაა.


    ის კი ცხადია, რომ ადამიანებმა ეს კლდე საცხოვრისად აქციეს. სვეტის ძირში, აღმოსავლეთიდან, პატარა გამოქვაბულია
    გამოკვეთილი, კედლებში თახჩებით; მის ზემოთ მეორე „ოთახის“ გამოჭრა დაუწყიათ, მაგრამ ბოლომდე აღარ მიუყვანიათ.
    მკვლევართა ვარაუდით, წარმართულ ხანაში კლდე შესაძლოა ნაყოფიერების სიმბოლო ყოფილიყო, V–VI საუკუნეებში
    კი — მესვეტე ბერის სადგომი, ისევე როგორც იმერეთში, კაცხის სვეტზე. მეზობელ ფერდობებზეც ბევრი ხელოვნური
    მღვიმეა მიმოფანტული.


    სვეტს უფრო მძიმე ამბავიც ახლავს. ქართულ მატიანეებს მიწერილი ცნობის თანახმად, თემურ-ლენგის შემოსევისას
    მისი მშვილდოსნები თოკებით ჩამოეშვნენ სვეტზე და ხალხით გაჭედილ გამოქვაბულს ისრები დაუშინეს.


    1979 წელს სვეტი ვახუშტი ბაგრატიონის სახელობის გეოგრაფიის ინსტიტუტის ექსპედიციამ, ლევან მარუაშვილის
    ხელმძღვანელობით, შეისწავლა, 2013 წლიდან კი ბუნების ძეგლია. გზის პირიდან კარგად დააკვირდით: მოყვანილობითა
    და სიდიდით ის კავკასიონის მთიანეთის სადარაჯო კოშკებს ჰგავს — ოღონდ ეს კოშკი არავის აუშენებია.
  tip: >-
    შესვლა უფასოა; არც მცველია, არც რაიმე მომსახურება. სვეტი გზასთან ახლოსაა, მაგრამ ციცაბო, ტყიან ფერდობზე
    დგას — საუკეთესო ხედი დაახლოებით 150 მეტრში მდგარი ღვთისმშობლის ეკლესიის მხრიდან იშლება. სვეტზე ასვლას
    ან გამოქვაბულში შეძრომას ნუ ეცდებით: შეცემენტებული რიყნარი საცოცი კლდე არ არის. ფერდობი აღმოსავლეთისკენაა
    მიქცეული, ამიტომ დილის შუქი მას ყველაზე უხდება. მანქანა მხოლოდ იქ გააჩერეთ, სადაც გზისპირი საკმარისად
    ფართოა — ს3-ზე მძიმე სატვირთოები დადიან. ათიდან ოცდაათ წუთამდე სავსებით საკმარისია; გზად ბაზალეთის
    ტბა ჩაურთეთ, სადილი კი დუშეთში მიირთვით.
  route: >-
    48 კმ, დაახლოებით 55 წუთი, მთელ გზაზე ასფალტია. თბილისიდან მტკვრის სანაპიროებითა და დავით აღმაშენებლის
    ხეივნით ს1 მაგისტრალზე გადით, მცხეთასთან კი ჩრდილოეთით, ს3-ზე — საქართველოს სამხედრო გზაზე გადაუხვიეთ.
    ს3-ით დაახლოებით 20 კილომეტრის შემდეგ სოფელ ბოდორნასთან ხართ: სვეტი არაგვის მარჯვენა ნაპირზე, გზიდან
    70–80 მეტრში, სოფლის ეკლესიის სიახლოვეს დგას — ფერდობს თვალი ადევნეთ. მანქანა იქ გააჩერეთ, სადაც გზისპირი
    ამის საშუალებას იძლევა. ნებისმიერ სეზონზე ეკონომ-კლასის მანქანა სავსებით საკმარისია. ბენზინგასამართი
    სადგურები ს1-ზე და დუშეთში ბევრია.
en:
  name: Bodorna Rock Columns Natural Monument
  short: >-
    A 15-metre natural pillar above the Aragvi with a hermit's cave cut into its foot: the roadside cousin
    of Imereti's Katskhi Pillar.
  body: >-
    **Just 70–80 metres from the Georgian Military Highway, a 15-metre finger of stone stands on the slope
    above the Aragvi, and most drivers never notice it.**


    Locals call it Tsotsola Rock, tsotsola meaning tall and tapering, and the name fits. The column rises
    from a base four metres across and narrows towards a crown of shrubs, about 150 metres south-east
    of Bodorna's 17th-century Church of the Virgin, on a steep, wooded slope of the Aragvi's right bank.
    Geographers read it as a denudation remnant: a pillar of Neogene conglomerate, river cobbles cemented
    by nature, left standing as the slope around it wore away. Its exact origin, and whether human hands
    helped to square off its regular outline, remain open questions.


    What is certain is that people made it a home. At its foot, on the east side, a small cave has been
    cut, with niches in its walls; above it someone began a second chamber and never finished. Georgian
    scholars suggest the rock may have been a fertility symbol in pagan times and, in the 5th–6th centuries,
    the cell of a stylite monk, as on the Katskhi Pillar in Imereti. The surrounding slopes are pocked
    with more man-made caves.


    A darker story clings to it. According to an account attributed to the Georgian chronicles, during
    Timur's invasions his archers let themselves down the column on ropes and loosed their arrows into
    a cave packed with people.


    In 1979 an expedition of the Vakhushti Bagrationi Institute of Geography, led by Levan Maruashvili,
    studied the pillar; since 2013 it has been a protected Natural Monument. Look at it from the road:
    in outline and size it is uncannily like the watchtowers of the high Caucasus, except that nobody
    built this one.
  tip: >-
    Free, unstaffed and without facilities. The pillar is close to the road but stands on a steep, wooded
    bank; the best view is from near the Church of the Virgin, about 150 metres away. Do not try to climb
    the column or crawl into the cave: cemented river cobbles are not climbing rock. The slope faces east,
    so morning light suits it best. Park only where the verge is wide, because this stretch of the S3
    carries heavy lorry traffic. Ten to thirty minutes is plenty; add Bazaleti Lake on the way and have
    lunch in Dusheti.
  route: >-
    48 km, about 55 minutes, paved all the way. Leave Tbilisi along the Mtkvari embankments and Aghmashenebeli
    Alley onto the S1, then turn north at Mtskheta onto the S3, the Georgian Military Highway. Roughly
    20 km up the S3 you reach Bodorna village: the pillar stands on the Aragvi's right bank, 70–80 metres
    from the road near the village church, so keep an eye on the slope. Pull off where the verge allows.
    An economy car is all you need, in any season. Fuel stations are plentiful on the S1 and in Dusheti.
ru:
  name: Памятник природы «Бодорнские скальные столбы»
  short: >-
    Пятнадцатиметровый природный столб над Арагви с кельей, вырубленной у подножия: придорожный родственник
    Кацхийского столпа в Имеретии.
  body: >-
    **Всего в 70–80 метрах от Военно-Грузинской дороги на склоне над Арагви стоит пятнадцатиметровый каменный
    палец — и большинство водителей его даже не замечает.**


    Местные зовут его скалой Цоцола — «цоцола» значит высокая и заострённая, — и имя подходит. Столб поднимается
    от основания шириной четыре метра и сужается к макушке, поросшей кустарником; стоит он примерно в
    150 метрах к юго-востоку от бодорнской церкви Богородицы XVII века, на крутом лесистом склоне правого
    берега Арагви. Географы считают его денудационным останцом: столбом неогенового конгломерата — речной
    гальки, сцементированной природой, — уцелевшим, пока склон вокруг размывался. Его точное происхождение,
    как и то, не помогли ли человеческие руки выровнять его правильные очертания, остаётся открытым вопросом.


    Несомненно одно: люди сделали его жильём. У подножия, с восточной стороны, вырублена небольшая пещера
    с нишами в стенах; над ней кто-то начал вырубать вторую камеру, но так и не закончил. Грузинские исследователи
    полагают, что в языческие времена скала могла быть символом плодородия, а в V–VI веках — кельей монаха-столпника,
    как на Кацхийском столпе в Имеретии. Окрестные склоны изрыты и другими рукотворными пещерами.


    За столбом тянется и более мрачная история. Согласно рассказу, который приписывают грузинским летописям,
    во время нашествий Тимура его лучники спускались по столбу на верёвках и осыпали стрелами пещеру,
    набитую людьми.


    В 1979 году столб изучала экспедиция Института географии имени Вахушти Багратиони под руководством
    Левана Маруашвили; с 2013 года это охраняемый памятник природы. Взгляните на него с дороги: очертаниями
    и размером он поразительно похож на сторожевые башни высокогорного Кавказа — только эту башню никто
    не строил.
  tip: >-
    Бесплатно, без смотрителя и без каких-либо удобств. Столб близко к дороге, но стоит на крутом лесистом
    склоне; лучший вид открывается от церкви Богородицы, примерно в 150 метрах. Не пытайтесь забраться
    на столб или пролезть в пещеру: сцементированная галька — не скала для лазания. Склон обращён на восток,
    поэтому лучше всего его освещает утреннее солнце. Паркуйтесь только там, где обочина широкая: по этому
    участку S3 идёт плотный поток фур. От десяти до тридцати минут вполне достаточно; по пути загляните
    на озеро Базалети и пообедайте в Душети.
  route: >-
    48 км, около 55 минут, всю дорогу по асфальту. Выезжайте из Тбилиси по набережным Куры и аллее Агмашенебели
    на S1, затем у Мцхеты сверните на север на S3 — Военно-Грузинскую дорогу. Примерно через 20 км по
    S3 вы окажетесь у села Бодорна: столб стоит на правом берегу Арагви, в 70–80 метрах от дороги, рядом
    с сельской церковью, так что следите за склоном. Остановитесь там, где позволяет обочина. В любое
    время года хватит машины эконом-класса. Заправок на S1 и в Душети много.
fa:
  name: ستون‌های سنگی بودورنا (اثر طبیعی حفاظت‌شده)
  short: >-
    ستونی طبیعی به بلندی ۱۵ متر بر فراز آراگوی، با غاری کنده‌شده در پای آن: خویشاوندِ کنار جاده‌ای ستون
    کاتسخی در ایمرتی.
  body: >-
    **تنها ۷۰ تا ۸۰ متر دورتر از جادهٔ نظامی گرجستان، انگشتی سنگی به بلندی ۱۵ متر بر شیب بالای آراگوی
    ایستاده است — و بیشتر رانندگان هرگز متوجهش نمی‌شوند.**


    اهالی آن را صخرهٔ «تسوتسولا» می‌نامند — تسوتسولا یعنی بلند و نوک‌تیز — و نام برازندهٔ آن است. ستون
    از پایه‌ای به پهنای چهار متر برمی‌خیزد و به‌سوی تاجی از بوته‌ها باریک می‌شود؛ حدود ۱۵۰ متر در جنوب‌شرقیِ
    کلیسای مریم مقدسِ سدهٔ هفدهمِ بودورنا، بر شیبی تند و جنگلی در کرانهٔ راست آراگوی. جغرافی‌دانان آن
    را بازماندهٔ فرسایش می‌دانند: ستونی از کنگلومرای دورهٔ نئوژن — قلوه‌سنگ‌های رودخانه‌ای که طبیعت به
    هم سیمان کرده — که با فرسودن شیبِ پیرامونش تنها بر جا مانده است. خاستگاه دقیق آن، و این‌که آیا دست
    انسان در صاف‌کردن قامتِ منظمش نقشی داشته یا نه، هنوز پرسشی باز است.


    آنچه قطعی است این است که انسان‌ها آن را خانهٔ خود کردند. در پای ستون، در سمت شرق، غاری کوچک با طاقچه‌هایی
    در دیوارهایش کنده شده؛ بالاتر از آن کسی کندن اتاقکی دوم را آغاز کرده و هرگز به پایان نبرده است. پژوهشگران
    گرجی احتمال می‌دهند این صخره در روزگار بت‌پرستی نماد باروری بوده و در سده‌های پنجم و ششم حجرهٔ راهبی
    ستون‌نشین، همچون ستون کاتسخی در ایمرتی. شیب‌های پیرامون نیز پر از غارهای دست‌کند دیگر است.


    داستانی تیره‌تر نیز با این ستون همراه است. بنا بر روایتی که به وقایع‌نامه‌های گرجی نسبت داده می‌شود،
    در یورش‌های تیمور، کمانداران او با طناب از ستون پایین آمدند و غاری را که پر از مردم بود به تیر بستند.


    در سال ۱۹۷۹ گروهی از مؤسسهٔ جغرافیای واخوشتی باگراتیونی به سرپرستی لوان ماروآشویلی این ستون را بررسی
    کردند؛ از سال ۲۰۱۳ نیز اثر طبیعی حفاظت‌شده است. از جاده به آن نگاه کنید: از نظر شکل و اندازه به‌طرز
    شگفتی به برج‌های دیده‌بانی قفقازِ بلند می‌ماند — با این تفاوت که این یکی را کسی نساخته است.
  tip: >-
    رایگان، بی‌نگهبان و بی‌هیچ امکاناتی. ستون به جاده نزدیک است اما بر کناره‌ای تند و جنگلی قرار دارد؛
    بهترین منظره از نزدیکی کلیسای مریم مقدس، حدود ۱۵۰ متر دورتر، است. نکوشید از ستون بالا بروید یا به
    درون غار بخزید: قلوه‌سنگ‌های سیمان‌شده سنگی برای صخره‌نوردی نیستند. شیب رو به شرق است؛ پس نور صبح
    بیش از همه به آن می‌آید. فقط جایی پارک کنید که شانهٔ جاده پهن است، چون در این بخش از S3 کامیون‌های
    سنگین بسیاری تردد می‌کنند. ده تا سی دقیقه کاملاً کافی است؛ در مسیر دریاچهٔ بازالتی را هم ببینید و
    ناهار را در دوشتی بخورید.
  route: >-
    ۴۸ کیلومتر، حدود ۵۵ دقیقه، و تمام راه آسفالت. از تفلیس از راه خیابان‌های ساحلی کورا و خیابان آغماشنبلی
    به S1 بروید، سپس در متسختا به سمت شمال وارد S3، جادهٔ نظامی گرجستان، شوید. پس از حدود ۲۰ کیلومتر در
    S3 به روستای بودورنا می‌رسید: ستون در کرانهٔ راست آراگوی، ۷۰ تا ۸۰ متر دورتر از جاده و نزدیک کلیسای
    روستا ایستاده است؛ پس چشمتان به شیب باشد. هر جا شانهٔ جاده اجازه داد، کنار بزنید. در هر فصلی یک خودروی
    سواری معمولی کافی است. جایگاه سوخت در S1 و در دوشتی فراوان است.
he:
  name: עמודי הסלע של בודורנה – מונומנט טבע
  short: 'עמוד טבעי בגובה 15 מטר מעל הארגווי, ומערה חצובה למרגלותיו: אחיו הצנוע של עמוד קצחי באימרטי,
    ממש לצד הכביש.'
  body: >-
    **במרחק 70–80 מטר בלבד מהדרך הצבאית הגאורגית, אצבע אבן בגובה 15 מטר מזדקרת על המדרון שמעל הארגווי,
    ורוב הנהגים לא מבחינים בה בכלל.**


    המקומיים קוראים לעמוד סלע צוצולה — "צוצולה" פירושו גבוה ומחודד — והשם הולם אותו. העמוד מתרומם מבסיס
    ברוחב ארבעה מטרים והולך ומצטמצם לעבר פסגה עטורת שיחים. הוא עומד כ-150 מטר מדרום-מזרח לכנסיית מריה
    הבתולה של בודורנה מהמאה ה-17, על מדרון תלול ומיוער בגדה הימנית של הארגווי. גאוגרפים רואים בו שריד
    של בליה וסחיפה: עמוד של קונגלומרט מתקופת הניאוגן — אבני נחל שהטבע מלט זו לזו — שנותר עומד כשהמדרון
    סביבו נשחק. מקורו המדויק, והשאלה אם ידי אדם עזרו ליישר את קווי המתאר הסדירים שלו, עדיין פתוחים.


    דבר אחד ודאי: בני אדם עשו אותו לבית. למרגלותיו, בצד המזרחי, נחצבה מערה קטנה ובקירותיה גומחות; מעליה
    מישהו התחיל לחצוב חדר שני ולא סיים. חוקרים גאורגים מעלים את האפשרות שבימי האלילות היה הסלע סמל פריון,
    ובמאות ה-5–6 תאו של נזיר עמודאי, כמו על עמוד קצחי באימרטי. המדרונות שמסביב מנוקבים במערות נוספות מעשה
    ידי אדם.


    סיפור אפל יותר דבק בו. לפי תיאור המיוחס לכרוניקות הגאורגיות, בזמן פלישות טימור השתלשלו קשתיו בחבלים
    לאורך העמוד וירו חצים אל מערה שהייתה דחוסה באנשים.


    ב-1979 חקרה את העמוד משלחת של המכון לגאוגרפיה על שם וחושטי בגרטיוני בראשות לבן מרואשווילי; מאז 2013
    הוא מונומנט טבע מוגן. הביטו בו מהכביש: בצורתו ובגודלו הוא דומה להפליא למגדלי השמירה של הקווקז הגבוה
    — אלא שאת המגדל הזה איש לא בנה.
  tip: >-
    חינם, בלי צוות ובלי שירותים. העמוד קרוב לכביש אבל עומד על גדה תלולה ומיוערת; התצפית הטובה ביותר היא
    מסביבת כנסיית מריה הבתולה, כ-150 מטר משם. אל תנסו לטפס על העמוד או לזחול לתוך המערה: אבני נחל מלוכדות
    אינן סלע טיפוס. המדרון פונה מזרחה, ולכן אור הבוקר מחמיא לו ביותר. חנו רק במקום שבו השוליים רחבים,
    כי בקטע הזה של S3 נוסעות משאיות כבדות רבות. עשר עד שלושים דקות מספיקות בהחלט; שלבו בדרך את אגם בזלטי
    ואכלו צהריים בדושטי.
  route: >-
    48 ק״מ, כ-55 דקות, סלול לכל אורכו. צאו מטביליסי לאורך הסוללות של נהר המטקווארי ובשדרת אגמשנבלי אל
    כביש S1, ובמצחתה פנו צפונה אל S3, הדרך הצבאית הגאורגית. אחרי כ-20 ק״מ על S3 תגיעו לכפר בודורנה: העמוד
    עומד בגדה הימנית של הארגווי, 70–80 מטר מהכביש ליד כנסיית הכפר, אז שימו עין על המדרון. עצרו בצד היכן
    שהשוליים מאפשרים. רכב פרטי רגיל הוא כל מה שצריך, בכל עונה. תחנות דלק יש בשפע על S1 ובדושטי.
ar:
  name: أعمدة بودورنا الصخرية (معلم طبيعي محمي)
  short: >-
    عمود طبيعي بارتفاع 15 مترًا فوق نهر أراغفي، في أسفله كهف منحوت: قريبُ عمود كاتسخي في إيميريتي، لكن
    على حافة الطريق.
  body: >-
    **على بعد 70–80 مترًا فقط من الطريق العسكري الجورجي، ينتصب إصبع من الحجر بارتفاع 15 مترًا على المنحدر
    فوق نهر أراغفي، ولا يكاد معظم السائقين يلحظونه.**


    يسمّيه أهل المنطقة صخرة «تسوتسولا»، أي الطويلة المستدقّة، والاسم في محلّه. يرتفع العمود من قاعدة عرضها
    أربعة أمتار ويضيق نحو قمة تكسوها الشجيرات، على بعد نحو 150 مترًا جنوب شرق كنيسة السيدة العذراء في
    بودورنا، العائدة إلى القرن السابع عشر، على منحدر شديد مكسوّ بالغابات على الضفة اليمنى لأراغفي. ويرى
    الجغرافيون فيه بقيةً من بقايا التعرية: عمودًا من الكونغلوميرات النيوجيني — حصى أنهار ربطتها الطبيعة
    بعضها ببعض — ظلّ قائمًا بينما تآكل المنحدر من حوله. أما أصله الدقيق، وهل أسهمت يد الإنسان في تسوية
    خطوطه المنتظمة، فما زالا سؤالين مفتوحين.


    المؤكد أن الناس اتخذوه مسكنًا. ففي أسفله، من الجهة الشرقية، نُحت كهف صغير في جدرانه كوى؛ وفوقه بدأ
    أحدهم نحت حجرة ثانية ولم يُتمّها. ويرجّح باحثون جورجيون أن الصخرة ربما كانت رمزًا للخصب في العصور
    الوثنية، ثم صارت في القرنين الخامس والسادس صومعةً لراهب عمودي، كما على عمود كاتسخي في إيميريتي. والمنحدرات
    المحيطة مثقوبة بمزيد من الكهوف التي صنعها الإنسان.


    وتلتصق بالعمود حكاية أشد قتامة. فبحسب رواية تُنسب إلى الحوليات الجورجية، تدلّى رماة تيمور أثناء غزواته
    بالحبال على العمود وأمطروا بالسهام كهفًا مكتظًا بالناس.


    في عام 1979 درست العمودَ بعثةٌ من معهد فاخوشتي باغراتيوني للجغرافيا بقيادة ليفان مارواشفيلي، ومنذ
    2013 صار معلمًا طبيعيًا محميًا. انظر إليه من الطريق: فهو في هيئته وحجمه يشبه على نحو مدهش أبراج المراقبة
    في أعالي القوقاز، سوى أن هذا البرج لم يبنه أحد.
  tip: >-
    مجاني، بلا حارس ولا مرافق. العمود قريب من الطريق لكنه قائم على ضفة شديدة الانحدار تكسوها الأشجار؛
    وأفضل مشهد له من قرب كنيسة السيدة العذراء، على بعد نحو 150 مترًا. لا تحاول تسلّق العمود أو الزحف إلى
    الكهف: فالحصى المتلاحم ليس صخرًا صالحًا للتسلق. المنحدر يواجه الشرق، لذا يناسبه ضوء الصباح أكثر من
    غيره. لا تركن إلا حيث يتسع جانب الطريق، فهذا المقطع من الطريق S3 تعبره شاحنات ثقيلة كثيرة. من عشر
    دقائق إلى نصف ساعة تكفي؛ أضف إلى طريقك بحيرة بازاليتي وتناول الغداء في دوشيتي.
  route: >-
    48 كم، نحو 55 دقيقة، والطريق معبّد كله. اخرج من تبليسي عبر كورنيشات نهر كورا وجادة أغماشينيبيلي إلى
    الطريق S1، ثم انعطف شمالًا عند متسخيتا إلى الطريق S3، أي الطريق العسكري الجورجي. وبعد نحو 20 كم على
    S3 تصل إلى قرية بودورنا: يقف العمود على الضفة اليمنى لنهر أراغفي، على بعد 70–80 مترًا من الطريق قرب
    كنيسة القرية، فأبقِ عينك على المنحدر. توقّف حيث يسمح جانب الطريق. تكفي سيارة عادية في أي فصل. محطات
    الوقود كثيرة على S1 وفي دوشيتي.
