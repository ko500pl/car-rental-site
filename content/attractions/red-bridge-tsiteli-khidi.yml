ka:
  name: წითელი ხიდი
  short: >-
    ქართლის მეფე როსტომის 175-მეტრიანი აგურის ხიდი ხრამზე — ძველი განჯის გზის ნაწილი, დღეს საქართველოსა
    და აზერბაიჯანს შორის, ნეიტრალურ ზოლში.
  body: >-
    **სამნახევარი საუკუნის მანძილზე ყველა, ვინც თბილისიდან განჯისკენ ხმელეთით მიემართებოდა, ხრამს სწორედ
    ამ წითელი აგურის თაღებზე გადადიოდა — ვაჭარიც, ქარავანიც და, სულ მცირე, ორი ლაშქარიც.**


    ხიდი ქართლის მეფე როსტომმა XVII საუკუნის შუა წლებში ააგო. მისი სიგრძე 175 მეტრია, სიგანე შუა წელში
    — სულ 4,3 მეტრი, სიმაღლე — 10–12 მეტრი. ბურჯებში პატარა სათავსოებია ჩატანებული: შესაძლოა, აქ მებაჟეები
    ისხდნენ, მცველები დარაჯობდნენ ან ქარავნები ისვენებდნენ — დანამდვილებით არავინ იცის. „წითელი“ მას მოგვიანებით,
    მეფის რუსეთის დროს, აგურის ფერის გამო შეარქვეს; აზერბაიჯანულად „ყირმიზი ქორფუ“ ჰქვია, რაც იმავეს ნიშნავს.


    ხალხი მას „გატეხილ ხიდსაც“ ეძახის, თუმცა როსტომის ხიდი აშენების დღიდან არც დანგრეულა და არც ჩატეხილა.
    სახელი უფრო ძველ ხიდს ეკუთვნის: მისგან 95 მეტრის მოშორებით, ხრამის ორივე ნაპირზე, მხოლოდ საყრდენი
    ბურჯებიღაა შემორჩენილი.


    ისტორიამ ეს გადასასვლელი არაერთხელ გამოსცადა. 1795 წლის 7 სექტემბერს, როცა აღა-მაჰმად-ხანის ლაშქარი
    თბილისისკენ მოიწევდა, ხიდის დასაცავად ერეკლე II-ის 200 მეომარი დატოვეს; მრავალათასიან ჯარს ვერ გაუძლეს
    და დიდი დანაკარგით დაიხიეს. 1921 წლის თებერვალში აქ საქართველოს დემოკრატიული რესპუბლიკის მებრძოლები
    წითელ არმიას დაუპირისპირდნენ; ბოლშევიკებმა ხიდი აიღეს და თბილისს შეუტიეს.


    ყოველდღიური მიმოსვლა ხიდზე 1998 წლამდე გრძელდებოდა, სანამ TRACECA-ს (ევროპა–კავკასია–აზია) პროექტით
    აგებულმა ახალმა, გაცილებით დიდმა ხიდმა არ შეცვალა. 1990-იან წლებში სასაზღვრო პოსტებს შორის ზოლში უზარმაზარი
    სტიქიური ბაზარი იმართებოდა, რომელსაც ძირითადად მარნეულის მხარის აზერბაიჯანელები უძღვებოდნენ; 2006
    წლის გაზაფხულზე, კონტრაბანდასთან ბრძოლის ფარგლებში, ბაზარი დახურეს. 2012 წლიდან ხიდი ეროვნული მნიშვნელობის
    ძეგლია.


    სატვირთოები ახლა ახალ ხიდზე გადადიან. როსტომის თაღებს, სამ საუკუნეზე მეტი ხნის სამსახურის შემდეგ,
    ერთადერთი საქმეღა დარჩათ: იდგნენ მდინარის თავზე და წითლად ღვიოდნენ.
  tip: >-
    ძველი ხიდი სასაზღვრო ზონაშია, ქართულ და აზერბაიჯანულ გამშვებ პუნქტებს შორის, ამიტომ რამდენად ახლოს
    მიხვალთ, იმ დღის მესაზღვრეებზეა დამოკიდებული. მანქანა რიგიდან მოშორებით გააჩერეთ, ქართულ პოსტთან მიდით
    და ჯერ იკითხეთ — სანამ ხიდს მიუახლოვდებით ან კამერას მოიმარჯვებთ. პასპორტი თან იქონიეთ, მაშინაც კი,
    თუ საზღვრის გადაკვეთას არ აპირებთ. შესვლა უფასოა. ხრამის ხეობა აქ დაახლოებით 270 მეტრზეა და ივლისში
    ხურს — წყალი და ქუდი არ დაგავიწყდეთ. ნახევარი საათი საკმარისია; გზად რუსთავი ან 9 კილომეტრში მდებარე
    გარდაბნის აღკვეთილი შეუთავსეთ. ვინც აზერბაიჯანში გადადის, ხიდს ნეიტრალური ზოლის გავლისას ნახავს.
  route: >-
    თბილისის ცენტრიდან რუსთავის გზატკეცილით სამხრეთ-აღმოსავლეთით გადით და S4 (E60) მაგისტრალს დაადექით
    — აზერბაიჯანის საზღვრისკენ მიმავალ გზას. ის რუსთავს ჩაუვლის, ქვემო ქართლის მშრალ ვაკეს გადაკვეთს და
    პირდაპირ წითელი ხიდის გამშვებ პუნქტთან მთავრდება: დაახლოებით 60 კილომეტრი და ერთი საათი, სატვირთოებისა
    და ბოლო, ნელი მონაკვეთის გათვალისწინებით. გზა ბოლომდე ასფალტიანია, ამიტომ ეკონომკლასის მანქანაც სრულიად
    საკმარისია. საწვავი რუსთავში ან მაგისტრალის გასწვრივ ჩაასხით — შემდეგ მხოლოდ საზღვარია. პოსტთან სატვირთოების
    რიგს ფრთხილად ჩაუარეთ და მასში ნუ ჩადგებით, თუ საზღვარს არ კვეთთ.
en:
  name: Red Bridge (Tsiteli Khidi)
  short: >-
    King Rostom's 17th-century brick bridge over the Khrami, 175 metres long, stranded in the neutral
    strip between Georgia and Azerbaijan.
  body: >-
    **For three and a half centuries, anyone travelling overland from Tbilisi to Ganja crossed the Khrami
    on these arches of red brick — merchants, caravans and at least two armies.**


    King Rostom of Kartli built the bridge in the middle of the 17th century. It is 175 metres long, only
    4.3 metres wide at its centre and 10–12 metres high, and its piers hide small chambers that may have
    held customs men, guards or caravans resting for the night; nobody knows which. The name, taken from
    the colour of the brick, came later, in Tsarist times. Azerbaijanis call it Qırmızı Körpü, which means
    the same.


    Georgians also call it the "Broken Bridge", though Rostom's bridge has never fallen. The name belongs
    to an older crossing 95 metres away, of which only the piers survive on either bank.


    History tested this crossing hard. On 7 September 1795, as Agha Mohammad Khan's army marched on Tbilisi,
    200 of King Erekle II's men were left to hold the bridge; they could not stop an army many thousands
    strong and fell back with heavy losses. In February 1921 troops of the Democratic Republic of Georgia
    fought the Red Army here; the Bolsheviks took the bridge and pressed on towards the capital.


    Daily traffic crossed it until 1998, when a far larger bridge built for the TRACECA corridor took
    over. Through the 1990s the strip between the border posts held a sprawling informal market, run largely
    by Azerbaijanis from the Marneuli area, until it was shut in spring 2006 in an anti-smuggling drive.
    Since 2012 the bridge has been a monument of national significance.


    The lorries use the new bridge now. Rostom's arches, off duty after more than three centuries, have
    only one job left: to stand over the river and glow red.
  tip: >-
    The old bridge lies inside the border zone, between the Georgian and Azerbaijani checkpoints, so how
    close you get depends on the guards on duty. Park well clear of the queue, walk up to the Georgian
    post and ask before you approach the bridge or raise a camera. Carry your passport even if you have
    no plan to cross. There is no fee. The Khrami valley here sits at about 270 metres and bakes in July,
    so bring water and a hat. Half an hour is enough; pair it with Rustavi or the Gardabani Managed Reserve,
    9 km away. Travellers crossing into Azerbaijan pass it in the neutral strip.
  route: >-
    From central Tbilisi take the Rustavi road south-east and join the S4 (E60), the highway to the Azerbaijani
    border. It skirts Rustavi, crosses the dry plain of Kvemo Kartli and ends, quite literally, at the
    Red Bridge checkpoint: about 60 km and roughly an hour, allowing for lorries and the slow final approach.
    It is asphalt all the way, so an economy car is all you need. Fill up in Rustavi or at the stations
    along the highway; after that there is only the border. Near the post, pass the lorry queue with care
    and do not join it unless you are crossing.
ru:
  name: Красный мост (Цители-Хиди)
  short: >-
    Кирпичный мост царя Ростома через Храми: XVII век, 175 метров — и теперь нейтральная полоса между
    Грузией и Азербайджаном.
  body: >-
    **Три с половиной века каждый, кто ехал по суше из Тбилиси в Гянджу, переходил Храми по этим аркам
    из красного кирпича — купцы, караваны и по меньшей мере две армии.**


    Мост построил в середине XVII века картлийский царь Ростом. Его длина — 175 метров, ширина в центре
    — всего 4,3 метра, высота — 10–12 метров, а в опорах спрятаны небольшие помещения, где, возможно,
    размещались таможенники, стража или караваны, остановившиеся на ночлег; какая из версий верна, никто
    не знает. Название, данное по цвету кирпича, появилось позже, уже при российских царях. Азербайджанцы
    называют мост Гырмызы Кёрпю (Qırmızı Körpü), что значит то же самое.


    Грузины зовут его ещё и «Сломанным мостом», хотя мост Ростома никогда не рушился. Это имя принадлежит
    более старой переправе в 95 метрах отсюда, от которой на обоих берегах уцелели лишь опоры.


    История испытывала эту переправу всерьёз. 7 сентября 1795 года, когда войско Ага Мохаммед-хана шло
    на Тбилиси, мост оставили удерживать 200 воинов царя Ираклия II; остановить армию в много тысяч человек
    они не смогли и отступили с тяжёлыми потерями. В феврале 1921 года здесь сражались с Красной армией
    войска Демократической Республики Грузия; большевики взяли мост и двинулись дальше, к столице.


    Повседневное движение шло по нему до 1998 года, когда его сменил куда более крупный мост, построенный
    для коридора TRACECA. Все 1990-е на полосе между пограничными постами шумел огромный стихийный рынок,
    которым заправляли в основном азербайджанцы из окрестностей Марнеули, пока весной 2006 года его не
    закрыли в ходе кампании против контрабанды. С 2012 года мост — памятник национального значения.


    Теперь фуры идут по новому мосту. У арок Ростома, отслуживших больше трёх веков, осталась лишь одна
    обязанность: стоять над рекой и светиться красным.
  tip: >-
    Старый мост находится в пограничной зоне, между грузинским и азербайджанским КПП, поэтому насколько
    близко вас подпустят, зависит от дежурных пограничников. Припаркуйтесь подальше от очереди, дойдите
    пешком до грузинского поста и спросите разрешения, прежде чем подходить к мосту или поднимать камеру.
    Возьмите паспорт, даже если не собираетесь пересекать границу. Платы за вход нет. Долина Храми лежит
    здесь на высоте около 270 метров и в июле раскаляется, так что возьмите воду и головной убор. Получаса
    достаточно; совместите визит с Рустави или Гардабанским заказником в 9 км отсюда. Те, кто едет в Азербайджан,
    проезжают мимо моста по нейтральной полосе.
  route: >-
    Из центра Тбилиси выезжайте на юго-восток по дороге на Рустави и выходите на S4 (E60) — трассу к азербайджанской
    границе. Она огибает Рустави, пересекает сухую равнину Квемо-Картли и буквально упирается в КПП «Красный
    мост»: около 60 км и примерно час с учётом фур и медленного подъезда в самом конце. Асфальт на всём
    пути, так что машины эконом-класса вполне хватит. Заправьтесь в Рустави или на заправках вдоль трассы:
    дальше только граница. У поста аккуратно объезжайте очередь фур и не вставайте в неё, если не собираетесь
    пересекать границу.
fa:
  name: پل سرخ (تسیتلی خیدی)
  short: >-
    پل آجری سدهٔ هفدهمِ شاه رستم بر رود خرامی، به درازای ۱۷۵ متر، که در نوار بی‌طرف میان گرجستان و جمهوری
    آذربایجان جا مانده است.
  body: >-
    **سه قرن و نیم، هر که از راه خشکی از تفلیس به گنجه می‌رفت، از روی همین طاق‌های آجر سرخ از خرامی می‌گذشت
    — بازرگانان، کاروان‌ها و دست‌کم دو لشکر.**


    رستم، پادشاه کارتلی، این پل را در میانهٔ سدهٔ هفدهم ساخت. درازای آن ۱۷۵ متر است، پهنایش در میانه تنها
    ۴٫۳ متر و بلندی‌اش ۱۰ تا ۱۲ متر، و در دل پایه‌هایش اتاقک‌هایی کوچک پنهان است که شاید جای مأموران گمرک،
    نگهبانان یا کاروان‌هایی بوده که شب را در آن می‌گذراندند؛ کسی نمی‌داند کدام. نامش، که از رنگ آجرها
    گرفته شده، بعدها و در دوران تزاری پدید آمد. آذربایجانی‌ها آن را قیرمیزی کؤرپو (Qırmızı Körpü) می‌نامند
    که همان معنا را دارد.


    گرجی‌ها آن را «پل شکسته» هم می‌خوانند، هرچند پل رستم هرگز فرو نریخته است. این نام از آنِ گذرگاهی کهن‌تر
    در ۹۵ متری است که از آن تنها پایه‌هایی در دو سوی رود بر جا مانده است.


    تاریخ این گذرگاه را سخت آزمود. در ۷ سپتامبر ۱۷۹۵، هنگامی که سپاه آقامحمدخان به سوی تفلیس پیش می‌رفت،
    ۲۰۰ تن از مردان شاه ارکلی دوم برای نگه‌داشتن پل بر جای گذاشته شدند؛ آنان نتوانستند سپاهی چندهزارنفری
    را متوقف کنند و با تلفات سنگین عقب نشستند. در فوریهٔ ۱۹۲۱ نیروهای جمهوری دموکراتیک گرجستان در اینجا
    با ارتش سرخ جنگیدند؛ بلشویک‌ها پل را گرفتند و به سوی پایتخت پیش راندند.


    رفت‌وآمد روزانه تا سال ۱۹۹۸ از روی آن می‌گذشت؛ در آن سال پلی بسیار بزرگ‌تر که برای کریدور تراسکا (TRACECA)
    ساخته شده بود جای آن را گرفت. در سراسر دههٔ ۱۹۹۰ نوار میان دو پاسگاه مرزی بازاری پهناور و غیررسمی
    را در خود جا داده بود که بیشتر آذربایجانی‌های ناحیهٔ مارنئولی آن را می‌گرداندند، تا آنکه در بهار ۲۰۰۶
    در جریان کارزاری علیه قاچاق بسته شد. از سال ۲۰۱۲ این پل یادمانی با اهمیت ملی است.


    اکنون کامیون‌ها از پل نو می‌گذرند. برای طاق‌های رستم، که پس از بیش از سه قرن از خدمت معاف شده‌اند،
    تنها یک کار مانده است: بر فراز رود بایستند و سرخ بدرخشند.
  tip: >-
    پل قدیمی در منطقهٔ مرزی، میان پاسگاه‌های گرجستان و جمهوری آذربایجان، قرار دارد؛ پس اینکه تا کجا بتوانید
    نزدیک شوید به مرزبانان کشیک بستگی دارد. خودرو را دور از صف پارک کنید، پیاده تا پاسگاه گرجی بروید و
    پیش از نزدیک شدن به پل یا بالا بردن دوربین اجازه بگیرید. حتی اگر قصد عبور ندارید، گذرنامه همراه داشته
    باشید. ورودیه‌ای در کار نیست. درهٔ خرامی در اینجا در ارتفاع حدود ۲۷۰ متری است و در ژوئیه می‌گدازد؛
    پس آب و کلاه بیاورید. نیم ساعت کافی است؛ دیدار را با روستاوی یا منطقهٔ حفاظت‌شدهٔ گاردابانی، در ۹
    کیلومتری، همراه کنید. مسافرانی که به جمهوری آذربایجان می‌روند، در نوار بی‌طرف از کنارش می‌گذرند.
  route: >-
    از مرکز تفلیس از جادهٔ روستاوی به سمت جنوب‌شرقی بروید و وارد S4 (E60)، بزرگراهی که به مرز جمهوری آذربایجان
    می‌رسد، شوید. این بزرگراه از کنار روستاوی می‌گذرد، از دشت خشک کوِمو کارتلی عبور می‌کند و به معنای
    واقعی کلمه در پاسگاه پل سرخ به پایان می‌رسد: حدود ۶۰ کیلومتر و نزدیک به یک ساعت، با احتساب کامیون‌ها
    و نزدیک شدن کُند در انتهای راه. سراسر راه آسفالت است، پس خودروی اقتصادی کافی است. در روستاوی یا جایگاه‌های
    سوخت کنار بزرگراه باک را پر کنید؛ پس از آن فقط مرز است. نزدیک پاسگاه با احتیاط از کنار صف کامیون‌ها
    بگذرید و اگر قصد عبور ندارید در صف نایستید.
he:
  name: הגשר האדום (ציטלי חידי)
  short: >-
    גשר הלבנים של המלך רוסטום מהמאה ה-17 מעל החראמי, באורך 175 מטר, שנותר תקוע ברצועה הניטרלית בין גאורגיה
    לאזרבייג'ן.
  body: >-
    **במשך שלוש מאות וחמישים שנה, כל מי שנסע ביבשה מטביליסי לגנג'ה חצה את החראמי על קשתות הלבנים האדומות
    האלה — סוחרים, שיירות ולפחות שני צבאות.**


    המלך רוסטום מקרתלי בנה את הגשר באמצע המאה ה-17. אורכו 175 מטר, רוחבו במרכז 4.3 מטר בלבד וגובהו 10–12
    מטר, ובתוך עמודיו מסתתרים חדרונים קטנים שאולי שימשו פקידי מכס, שומרים או שיירות שעצרו ללינה; איש אינו
    יודע מי מהם. השם, שנגזר מצבע הלבנים, הגיע מאוחר יותר, בתקופת הצארים. האזרבייג'נים קוראים לו קירמיזי
    קורפו (Qırmızı Körpü), ופירושו זהה.


    הגאורגים קוראים לו גם "הגשר השבור", אף שגשרו של רוסטום מעולם לא קרס. השם שייך למעבר ישן יותר, 95 מטר
    משם, שממנו שרדו רק העמודים בשתי הגדות.


    ההיסטוריה העמידה את המעבר הזה במבחנים קשים. ב-7 בספטמבר 1795, כשצבאו של אגא מוחמד ח'אן צעד על טביליסי,
    הושארו 200 מאנשי המלך ארקלה השני להחזיק בגשר; הם לא יכלו לעצור צבא של אלפים רבים ונסוגו באבדות כבדות.
    בפברואר 1921 נלחמו כאן כוחות הרפובליקה הדמוקרטית של גאורגיה בצבא האדום; הבולשביקים כבשו את הגשר והמשיכו
    להתקדם לעבר הבירה.


    התנועה היומיומית עברה עליו עד 1998, אז תפס את מקומו גשר גדול בהרבה שנבנה עבור מסדרון TRACECA. לאורך
    שנות ה-90 שכן ברצועה שבין עמדות הגבול שוק לא רשמי ומתפשט, שהופעל ברובו בידי אזרבייג'נים מאזור מרנאולי,
    עד שנסגר באביב 2006 במסגרת מבצע נגד הברחות. מאז 2012 הגשר הוא אתר מורשת בעל חשיבות לאומית.


    המשאיות נוסעות עכשיו על הגשר החדש. לקשתות של רוסטום, שיצאו לגמלאות אחרי יותר משלוש מאות שנה, נותר
    תפקיד אחד בלבד: לעמוד מעל הנהר ולזהור באדום.
  tip: >-
    הגשר הישן נמצא בתוך אזור הגבול, בין המחסום הגאורגי למחסום האזרבייג'ני, כך שהמרחק שתוכלו להתקרב תלוי
    בשומרים שבמשמרת. חנו הרחק מן התור, לכו ברגל עד העמדה הגאורגית ובקשו רשות לפני שאתם ניגשים לגשר או
    מרימים מצלמה. קחו דרכון גם אם אין לכם כוונה לחצות. אין דמי כניסה. עמק החראמי כאן נמצא בגובה של כ-270
    מטר ולוהט ביולי, אז הביאו מים וכובע. חצי שעה מספיקה; שלבו את הביקור עם רוסתאווי או עם שמורת גרדבאני
    המנוהלת, במרחק 9 ק״מ. מטיילים שחוצים לאזרבייג'ן עוברים לידו ברצועה הניטרלית.
  route: >-
    ממרכז טביליסי צאו בדרך לרוסתאווי דרומה-מזרחה והצטרפו לכביש S4 (E60), הכביש המהיר לגבול אזרבייג'ן.
    הוא עוקף את רוסתאווי, חוצה את המישור היבש של קוומו קרתלי ומסתיים, פשוטו כמשמעו, במחסום הגשר האדום:
    כ-60 ק״מ וכשעה, כולל המשאיות והגישה האיטית בסוף. אספלט לכל אורך הדרך, כך שרכב חסכוני מספיק. תדלקו
    ברוסתאווי או בתחנות שלאורך הכביש המהיר; אחריהן יש רק גבול. ליד העמדה עקפו בזהירות את תור המשאיות ואל
    תצטרפו אליו אלא אם אתם חוצים את הגבול.
ar:
  name: الجسر الأحمر (تسيتيلي خيدي)
  short: >-
    جسر الملك روستوم الآجرّي من القرن السابع عشر فوق نهر خرامي، بطول 175 متراً، عالق في الشريط المحايد
    بين جورجيا وأذربيجان.
  body: >-
    **طوال ثلاثة قرون ونصف، كان كل من يسافر براً من تبليسي إلى كنجة يعبر نهر خرامي على هذه القناطر من
    الآجر الأحمر — تجّار وقوافل وجيشان على الأقل.**


    بنى روستوم، ملك كارتلي، الجسر في منتصف القرن السابع عشر. يبلغ طوله 175 متراً، وعرضه عند منتصفه 4.3
    متر فقط، وارتفاعه 10–12 متراً، وتخفي دعاماته غرفاً صغيرة ربما أقام فيها رجال الجمارك أو الحراس أو
    قوافل تستريح ليلاً؛ ولا أحد يعرف أيّها. أما الاسم، المأخوذ من لون الآجر، فجاء لاحقاً في العهد القيصري.
    ويسمّيه الأذربيجانيون قرمزي كوربو (Qırmızı Körpü)، وهو يعني الشيء نفسه.


    ويسمّيه الجورجيون أيضاً «الجسر المكسور»، مع أن جسر روستوم لم ينهر قط. فهذا الاسم يعود إلى معبر أقدم
    على بعد 95 متراً، لم يبقَ منه سوى الدعامات على الضفتين.


    امتحن التاريخ هذا المعبر امتحاناً عسيراً. ففي 7 سبتمبر 1795، بينما كان جيش آغا محمد خان يزحف على تبليسي،
    تُرك 200 من رجال الملك إريكلي الثاني للدفاع عن الجسر؛ فلم يستطيعوا صدّ جيش يُعدّ بآلاف كثيرة، وتراجعوا
    بخسائر فادحة. وفي فبراير 1921 قاتلت قوات جمهورية جورجيا الديمقراطية الجيش الأحمر هنا؛ فاستولى البلاشفة
    على الجسر وواصلوا زحفهم نحو العاصمة.


    وظلت حركة المرور اليومية تعبره حتى عام 1998، حين حلّ محلّه جسر أكبر بكثير بُني لممر TRACECA (تراسيكا).
    وطوال التسعينيات احتضن الشريط الواقع بين مركزي الحدود سوقاً غير رسمية مترامية، أدارها في الغالب أذربيجانيون
    من منطقة مارنيولي، إلى أن أُغلقت في ربيع 2006 ضمن حملة لمكافحة التهريب. ومنذ عام 2012 صار الجسر معلماً
    ذا أهمية وطنية.


    تسلك الشاحنات الجسر الجديد الآن. أما قناطر روستوم، وقد أُعفيت من الخدمة بعد أكثر من ثلاثة قرون، فلم
    يبقَ لها سوى مهمة واحدة: أن تقف فوق النهر وتتوهّج بالحمرة.
  tip: >-
    يقع الجسر القديم داخل المنطقة الحدودية، بين نقطتي التفتيش الجورجية والأذربيجانية، لذا فإن مدى اقترابك
    منه يتوقف على الحراس المناوبين. اركن سيارتك بعيداً عن الطابور، وامشِ إلى المركز الجورجي واستأذن قبل
    الاقتراب من الجسر أو رفع الكاميرا. احمل جواز سفرك حتى لو لم تكن تنوي العبور. لا رسوم دخول. يقع وادي
    خرامي هنا على ارتفاع نحو 270 متراً ويلتهب حراً في يوليو، فاحمل الماء وقبعة. تكفي نصف ساعة؛ واجمع الزيارة
    مع روستافي أو محمية غارداباني المُدارة على بعد 9 كم. ويمرّ به المسافرون العابرون إلى أذربيجان في الشريط
    المحايد.
  route: >-
    من وسط تبليسي اسلك طريق روستافي نحو الجنوب الشرقي والتحق بالطريق S4 (E60)، الطريق السريع المؤدي إلى
    الحدود الأذربيجانية. يلتفّ حول روستافي، ويعبر السهل الجاف في كفيمو كارتلي، وينتهي، بالمعنى الحرفي،
    عند نقطة تفتيش الجسر الأحمر: نحو 60 كم وقرابة ساعة، مع احتساب الشاحنات والاقتراب البطيء في النهاية.
    الطريق معبّد طوال المسافة، فتكفي سيارة اقتصادية. تزوّد بالوقود في روستافي أو في المحطات على امتداد
    الطريق السريع؛ فبعدها لا شيء سوى الحدود. وقرب المركز تجاوز طابور الشاحنات بحذر ولا تنضم إليه ما لم
    تكن عابراً.
