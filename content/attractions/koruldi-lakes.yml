ka:
  name: ქორულდის ტბები
  short: >-
    მცირე ალპური ტბები 2740 მეტრზე, მესტიის თავზე, სადაც ცას უშბის ორი რქა ავსებს — ამოდიან ჯიპით, ცხენით
    ან გრძელი აღმართით.
  body: >-
    **ქორულდიდან უშბას პირისპირ უყურებთ — ორთავიან მწვერვალს, რომელიც ქართულ მითოლოგიაში ნადირობის ქალღმერთის,
    დალის, სავანედ ითვლებოდა, მთამსვლელები კი მას კავკასიონის მატერჰორნს ეძახიან.**


    თავად ტბები მოკრძალებულია: რამდენიმე თხელი წყალსატევი მაღალმთის საძოვარზე, დაახლოებით 2740 მეტრზე.
    ივნისში, თოვლის დნობისას, ყველაზე სავსეა, აგვისტოს ბოლოსთვის კი ხშირად მცირდება. აქ წყლისთვის არავინ
    ამოდის. ამოდიან იმისთვის, რაც მშვიდ დილას წყალში ირეკლება: ჩრდილო-დასავლეთით — უშბა, რომლის სამხრეთი
    მწვერვალი 4710 მეტრს აღწევს; აღმოსავლეთით — თეთნულდის თეთრი პირამიდა; ღრმად ქვემოთ კი მესტიის ხეობა
    და კოშკები, ჭადრაკის ფიგურებივით პაწია.


    ეს ჰორიზონტი სიმამაცის მატიანეა. ინგლისელმა ჯონ კოკინმა და ულრიხ ალმერმა უშბის ჩრდილოეთ მწვერვალს
    1888 წელს, მეოთხე ცდაზე მიაღწიეს; სამხრეთი მწვერვალი 1903 წლამდე დაუმორჩილებელი რჩებოდა. 1934 წელს
    ალექსანდრა ჯაფარიძე უშბაზე ასული პირველი ქალი გახდა. 1937 წელს კი ხუთმა სვანმა — გაბრიელ, ბექნუ და
    ბესარიონ ხერგიანებმა, ჭიჭიკო ჩართოლანმა და მაქსიმე გვარლიანმა — სამხრეთ უშბაზე პირველად მისი ურთულესი
    სამხრეთი კედლით აიარეს. ტბებიდან ამ კედელს თვალით აუყვებით.


    ასასვლელი გზა ქალაქის თავზე, ქედზე აღმართულ დიდ ჯვარს ჩაუვლის და შემდეგ ღია საძოვრებზე ციცაბო, ქვიანი
    კლაკნილებით ადის. ჯიპით დაახლოებით საათნახევარი სჭირდება, ფეხით — ოთხიდან ხუთ საათამდე; ცხენის დაქირავებაც
    მესტიაშივე შეიძლება.


    ამოდით მოწმენდილ დილას ან საერთოდ ნუ ამოხვალთ. როცა ღრუბელი დაბლაა, უშბა უბრალოდ არ არსებობს და ტბებიც
    მხოლოდ წყალია მთის ფერდზე. როცა იფანტება, მთელი ზემო სვანეთი ფეხქვეშ გეშლებათ.
  tip: >-
    ამინდის პროგნოზი წინა საღამოს შეამოწმეთ და ზემოთ ადრე ამოდით: დაახლოებით თერთმეტი საათისთვის ღრუბელი
    უშბას ჩვეულებრივ ფარავს. ზემოთ ქარია და მესტიაზე შესამჩნევად ცივა, ამიტომ ქურთუკი და ქუდი აგვისტოშიც
    წამოიღეთ. აქ არც კეთილმოწყობაა, არც ჩრდილი და არც საყიდელი რამ — წყალი და საჭმელი თან იქონიეთ. ფეხით
    ასვლას კარგი ფეხსაცმელი და ოთხ-ხუთი საათი სჭირდება; ცხენსა და ადგილობრივ ჯიპს მესტიაში მოძებნით. თოვლი
    ხშირად ივნისის შუა რიცხვებამდე დევს, სექტემბრის ბოლოდან კი ბრუნდება.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ქუთაისის გავლით სამტრედიამდე იარეთ, შემდეგ იმავე ს1-ით სენაკის გავლით
    ზუგდიდამდე, იქიდან კი ენგურის ხეობით მესტიამდე — დაახლოებით 470 კმ ასფალტი და რვანახევარი საათი. საწვავი
    მესტიაში ჩაასხით: ქალაქის ზემოთ სადგური არ არის. ტბები მესტიიდან სულ რაღაც 10 კილომეტრშია, მაგრამ
    მთელი გზა ციცაბო, დაღარული და ქვიანი სამთო გრუნტზე გადის — ჯვრის გავლით და ღია საძოვრებზე; ცალ მხარეს
    დაახლოებით საათნახევარი (თბილისიდან სულ დაახლოებით 480 კმ და ცხრანახევარი საათი). აქ მხოლოდ დაბალი
    გადაცემის მქონე, მაღალი კლირენსის ნამდვილი ოთხივე წამყვანთვლიანი ჯიპი ვარგა; წვიმის შემდეგ ღარები
    სრიალა ხდება. სხვა შემთხვევაში მესტიის ცენტრში ადგილობრივი ჯიპი დაიქირავეთ.
en:
  name: Koruldi Lakes
  short: >-
    Shallow tarns at 2,740 m on the ridge above Mestia, where Ushba's twin horns fill the sky — reached
    by 4x4, on horseback or by a long climb.
  body: >-
    **From Koruldi you look Ushba in the face — the double-horned peak that Georgian myth gave to Dali,
    goddess of the hunt, and that climbers call the Matterhorn of the Caucasus.**


    The lakes themselves are modest: a few shallow tarns on a high pasture at about 2,740 metres, fullest
    in June while the snow melts, often shrunk by late August. Nobody climbs up here for the water. You
    come for what stands in it on a still morning — Ushba to the north-west, its south summit at 4,710
    metres; Tetnuldi's white pyramid to the east; far below, the Mestia valley with its towers, small
    as chessmen.


    The skyline is a history of nerve. The Englishman John Cockin and Ulrich Almer reached Ushba's north
    summit in 1888, at their fourth attempt; the south summit held out until 1903. In 1934 Aleksandra
    Japaridze became the first woman to stand on Ushba. And in 1937 five Svans — Gabriel, Beknu and Besarion
    Khergiani, Chichiko Chartolani and Maksime Gvarliani — made the first ascent of the south summit by
    its forbidding south wall. From the lakes you can trace that wall with your eyes.


    The way up passes the big cross on the ridge above town and then zigzags across open pasture, stony
    and steep. By jeep it takes about an hour and a half; on foot, four to five hours; horses can be hired
    in Mestia.


    Come on a clear morning or not at all. When the cloud is down, Ushba simply is not there, and the
    lakes are only water on a hill. When it lifts, the whole of Upper Svaneti lies open at your feet.
  tip: >-
    Check the forecast the night before and aim to be at the top early: cloud usually closes over Ushba
    by around eleven. It is windy and markedly colder than in Mestia, so bring a jacket and hat even in
    August. There are no facilities, no shade and nothing to buy — carry water and food. On foot you need
    good boots and four to five hours for the climb; horses and local jeeps can be arranged in Mestia.
    Snow often lingers until mid-June and returns from late September.
  route: >-
    From Tbilisi take the S1 (E60) past Kutaisi to Samtredia, continue on the S1 through Senaki to Zugdidi,
    then climb the Enguri gorge to Mestia — about 470 km of asphalt and eight and a half hours. Fill up
    in Mestia: there is no fuel above town. The lakes are only about 10 km from Mestia, but it is a steep,
    rutted, stony mountain track past the cross and over open pasture, around an hour and a half each
    way (some 480 km and nine and a half hours from Tbilisi in all). Only a genuine high-clearance 4x4
    with low range belongs here; after rain the ruts turn greasy. Otherwise hire a local jeep in central
    Mestia.
ru:
  name: Озёра Корульди
  short: >-
    Мелкие озерца на высоте 2740 м на хребте над Местией, где двурогая Ушба заслоняет полнеба, — на джипе,
    верхом или долгим подъёмом пешком.
  body: >-
    **С Корульди вы смотрите Ушбе прямо в лицо — двурогой вершине, которую грузинский миф отдал Дали,
    богине охоты, а альпинисты зовут Маттерхорном Кавказа.**


    Сами озёра скромны: несколько мелких водоёмов на высокогорном пастбище на высоте около 2740 метров,
    полноводных в июне, пока тает снег, и нередко обмелевших к концу августа. Ради воды сюда никто не
    поднимается. Приходят ради того, что отражается в ней тихим утром: Ушба на северо-западе, её южная
    вершина — 4710 метров; белая пирамида Тетнульди на востоке; далеко внизу — долина Местии с башнями,
    маленькими, как шахматные фигуры.


    Линия гор здесь — летопись отваги. Англичанин Джон Кокин и Ульрих Альмер поднялись на северную вершину
    Ушбы в 1888 году с четвёртой попытки; южная держалась до 1903-го. В 1934 году Александра Джапаридзе
    стала первой женщиной, стоявшей на Ушбе. А в 1937 году пятеро сванов — Габриэл, Бекну и Бесарион Хергиани,
    Чичико Чартолани и Максиме Гварлиани — впервые поднялись на южную вершину по её грозной южной стене.
    От озёр эту стену можно проследить взглядом.


    Путь наверх идёт мимо большого креста на хребте над городом, а затем зигзагами по открытому пастбищу,
    каменистому и крутому. На джипе он занимает около полутора часов, пешком — четыре-пять; лошадей можно
    нанять в Местии.


    Поднимайтесь ясным утром — или не поднимайтесь вовсе. Когда облака лежат низко, Ушбы просто нет, и
    озёра — всего лишь вода на склоне. Когда облака поднимаются, у ваших ног открывается вся Верхняя Сванетия.
  tip: >-
    Проверьте прогноз накануне и постарайтесь быть наверху рано: к одиннадцати часам Ушбу обычно затягивает
    облаком. Здесь ветрено и заметно холоднее, чем в Местии, так что куртка и шапка нужны даже в августе.
    Никаких удобств, тени и магазинов нет — берите воду и еду с собой. Пешком нужны хорошие ботинки и
    четыре-пять часов на подъём; о лошадях и местных джипах можно договориться в Местии. Снег часто лежит
    до середины июня и возвращается с конца сентября.
  route: >-
    Из Тбилиси по S1 (E60) мимо Кутаиси до Самтредиа, дальше по S1 через Сенаки до Зугдиди, затем вверх
    по ущелью Ингури до Местии — около 470 км асфальта и восемь с половиной часов. Заправьтесь в Местии:
    выше города топлива нет. До озёр от Местии всего около 10 км, но это крутая, разбитая, каменистая
    горная дорога мимо креста и по открытому пастбищу — примерно полтора часа в одну сторону (всего от
    Тбилиси около 480 км и девять с половиной часов). Здесь место только настоящему внедорожнику с высоким
    клиренсом и понижающей передачей; после дождя колея становится скользкой. Иначе наймите местный джип
    в центре Местии.
fa:
  name: دریاچه‌های کورولدی
  short: >-
    آبگیرهایی کم‌ژرفا در ارتفاع ۲۷۴۰ متر بر ستیغ بالای مستیا، جایی که دو شاخ اوشبا آسمان را پر می‌کنند
    — با دودیفرانسیل، اسب یا صعودی طولانی.
  body: >-
    **از کورولدی رودررو به اوشبا نگاه می‌کنید — قلهٔ دوشاخی که اسطورهٔ گرجی آن را به دالی، الههٔ شکار،
    سپرد و کوهنوردان آن را ماترهورنِ قفقاز می‌نامند.**


    خود دریاچه‌ها فروتن‌اند: چند آبگیر کم‌ژرفا بر چراگاهی بلند در ارتفاع حدود ۲۷۴۰ متر، که در ژوئن، هنگام
    آب شدن برف، از همیشه پرآب‌ترند و اغلب تا اواخر اوت کوچک می‌شوند. هیچ‌کس به خاطر آب به این بالا نمی‌آید.
    می‌آیند برای آنچه در صبحی آرام در آن نقش می‌بندد: اوشبا در شمال‌غرب، با قلهٔ جنوبی‌اش به بلندی ۴۷۱۰
    متر؛ هرم سپید تتنولدی در شرق؛ و بسیار پایین‌تر، درهٔ مستیا با برج‌هایش، کوچک چون مهره‌های شطرنج.


    خط افق این‌جا تاریخچهٔ جسارت است. جان کاکینِ انگلیسی و اولریش آلمر در سال ۱۸۸۸، در چهارمین تلاششان،
    به قلهٔ شمالی اوشبا رسیدند؛ قلهٔ جنوبی تا ۱۹۰۳ پایداری کرد. در سال ۱۹۳۴ الکساندرا جاپاریدزه نخستین
    زنی شد که بر اوشبا ایستاد. و در سال ۱۹۳۷ پنج مرد سوانی — گابریل، بکنو و بساریون خرگیانی، چیچیکو چارتولانی
    و ماکسیمه گوارلیانی — نخستین صعود به قلهٔ جنوبی را از دیوارهٔ هولناک جنوبی‌اش انجام دادند. از کنار
    دریاچه‌ها می‌توانید آن دیواره را با چشم دنبال کنید.


    راه بالا از کنار صلیب بزرگ روی ستیغ بالای شهر می‌گذرد و سپس به‌صورت مارپیچ از چراگاهی باز، سنگلاخ
    و پرشیب بالا می‌رود. با جیپ حدود یک ساعت و نیم طول می‌کشد و پیاده چهار تا پنج ساعت؛ در مستیا می‌توان
    اسب کرایه کرد.


    در صبحی صاف بیایید، یا اصلاً نیایید. وقتی ابر پایین است، اوشبا به‌سادگی وجود ندارد و دریاچه‌ها تنها
    آبی بر دامنهٔ یک تپه‌اند. وقتی ابر کنار می‌رود، سراسر سوانتی علیا زیر پایتان گشوده می‌شود.
  tip: >-
    شب پیش پیش‌بینی هوا را ببینید و بکوشید زود به بالا برسید: ابر معمولاً تا حدود ساعت یازده روی اوشبا
    را می‌پوشاند. باد می‌وزد و هوا به‌مراتب سردتر از مستیاست، پس حتی در اوت کاپشن و کلاه بیاورید. هیچ
    امکاناتی، سایه‌ای یا چیزی برای خرید نیست — آب و خوراک همراه داشته باشید. برای پیاده‌روی کفش خوب و
    چهار تا پنج ساعت برای صعود لازم است؛ اسب و جیپ‌های محلی را می‌توان در مستیا ترتیب داد. برف اغلب تا
    میانهٔ ژوئن می‌ماند و از اواخر سپتامبر بازمی‌گردد.
  route: >-
    از تفلیس از جادهٔ S1 (E60) و از کنار کوتائیسی تا سامتردیا بروید، روی S1 از سناکی بگذرید تا زوگدیدی،
    سپس درهٔ اینگوری را تا مستیا بالا بروید — حدود ۴۷۰ کیلومتر آسفالت و هشت ساعت و نیم. در مستیا سوخت‌گیری
    کنید: بالاتر از شهر سوختی نیست. دریاچه‌ها تنها حدود ۱۰ کیلومتر از مستیا فاصله دارند، اما راه، کوهستانی
    و پرشیب و پرشیار و سنگلاخ است و از کنار صلیب و از میان چراگاه باز می‌گذرد؛ حدود یک ساعت و نیم برای
    هر طرف (روی هم رفته حدود ۴۸۰ کیلومتر و نه ساعت و نیم از تفلیس). این‌جا فقط جای یک خودروی دودیفرانسیل
    واقعی با فاصلهٔ زیاد از زمین و دندهٔ کمکی است؛ پس از باران شیارها لغزنده می‌شوند. در غیر این صورت
    در مرکز مستیا جیپ محلی کرایه کنید.
he:
  name: אגמי קורולדי
  short: >-
    אגמונים רדודים בגובה 2,740 מ׳ על הרכס שמעל מסטיה, ששתי קרני אושבה ממלאות מעליהם את השמיים — ברכב שטח,
    על גב סוס או בטיפוס ארוך.
  body: >-
    **מקורולדי מביטים באושבה פנים אל פנים — הפסגה בעלת שתי הקרניים שהמיתולוגיה הגאורגית הקדישה לדאלי,
    אלת הציד, ושהמטפסים מכנים „המטרהורן של הקווקז“.**


    האגמים עצמם צנועים: כמה אגמונים רדודים על כר מרעה גבוה בגובה של כ-2,740 מטרים, מלאים ביותר ביוני בזמן
    הפשרת השלג, ולעיתים קרובות מצטמקים עד סוף אוגוסט. איש אינו מטפס לכאן בשביל המים. באים בשביל מה שעומד
    בהם בבוקר שקט: אושבה בצפון-מערב, שפסגתו הדרומית מגיעה ל-4,710 מטרים; הפירמידה הלבנה של תתנולדי במזרח;
    והרחק למטה עמק מסטיה ומגדליו, קטנים ככלי שחמט.


    קו הרכסים כאן הוא היסטוריה של אומץ. האנגלי ג׳ון קוקין ואולריך אלמר הגיעו לפסגה הצפונית של אושבה ב-1888,
    בניסיונם הרביעי; הדרומית עמדה בפני המטפסים עד 1903. ב-1934 הייתה אלכסנדרה ג׳פרידזה האישה הראשונה שעמדה
    על אושבה. וב-1937 חמישה סוואנים — גבריאל, בקנו ובסאריון חרגיאני, צ׳יצ׳יקו צ׳רטולני ומקסימה גוורליאני
    — טיפסו לראשונה אל הפסגה הדרומית דרך קירה הדרומי המאיים. מן האגמים אפשר לעקוב אחר הקיר הזה בעיניים.


    הדרך למעלה חולפת על פני הצלב הגדול שעל הרכס מעל העיר, ואחר כך מתפתלת בזיגזגים על פני מרעה פתוח, סלעי
    ותלול. בג׳יפ זה לוקח כשעה וחצי; ברגל ארבע עד חמש שעות; סוסים אפשר לשכור במסטיה.


    בואו בבוקר בהיר, או אל תבואו בכלל. כשהעננים נמוכים, אושבה פשוט איננו, והאגמים הם רק מים על גבעה. כשהם
    מתרוממים, כל סוואנתי העילית נפרשת לרגליכם.
  tip: >-
    בדקו את התחזית בערב הקודם ושאפו להגיע למעלה מוקדם: העננים סוגרים בדרך כלל על אושבה עד שעה אחת-עשרה
    בערך. נושבת כאן רוח, וקר בהרבה מאשר במסטיה, אז הביאו מעיל וכובע גם באוגוסט. אין כאן שום מתקנים, אין
    צל ואין מה לקנות — קחו מים ואוכל. ברגל תזדקקו לנעליים טובות ולארבע עד חמש שעות לעלייה; סוסים וג׳יפים
    מקומיים אפשר לארגן במסטיה. השלג נשאר לעיתים קרובות עד אמצע יוני וחוזר מסוף ספטמבר.
  route: >-
    מטביליסי סעו בכביש S1 (E60) על פני קוטאיסי עד סמטרדיה, המשיכו ב-S1 דרך סנקי עד זוגדידי, ומשם טפסו
    במעלה ערוץ האנגורי עד מסטיה — כ-470 ק״מ סלולים ושמונה וחצי שעות. תדלקו במסטיה: מעל העיר אין דלק. האגמים
    נמצאים רק כ-10 ק״מ ממסטיה, אבל זו דרך הררית תלולה, מלאת תלמים וסלעית, על פני הצלב ודרך מרעה פתוח —
    כשעה וחצי לכל כיוון (בסך הכול כ-480 ק״מ ותשע וחצי שעות מטביליסי). מקומו כאן של רכב שטח אמיתי בלבד,
    בהנעה כפולה, עם מרווח גחון גבוה והילוך כוח; אחרי גשם התלמים נעשים חלקלקים. אחרת, שכרו ג׳יפ מקומי במרכז
    מסטיה.
ar:
  name: بحيرات كورولدي
  short: >-
    برك ضحلة على ارتفاع 2,740 م فوق ميستيا، حيث يملأ قرنا أوشبا السماء — يُبلغها بسيارة دفع رباعي أو على
    ظهور الخيل أو بصعود طويل.
  body: >-
    **من كورولدي تنظر إلى أوشبا وجهاً لوجه — القمة ذات القرنين التي منحتها الأسطورة الجورجية لدالي، إلهة
    الصيد، ويسمّيها المتسلقون ماترهورن القوقاز.**


    البحيرات نفسها متواضعة: بضع برك ضحلة على مرعى مرتفع على نحو 2,740 متراً، تبلغ أقصى امتلائها في حزيران
    مع ذوبان الثلج، وكثيراً ما تنكمش بحلول أواخر آب. لا أحد يصعد إلى هنا من أجل الماء. بل يأتون من أجل
    ما ينعكس فيه في صباح ساكن: أوشبا في الشمال الغربي بقمته الجنوبية البالغة 4,710 أمتار، وهرم تيتنولدي
    الأبيض في الشرق، وفي الأسفل البعيد وادي ميستيا بأبراجه، صغيرة كقطع الشطرنج.


    خطّ الأفق هنا سجلّ للجسارة. بلغ الإنجليزي جون كوكين وأولريش ألمر قمة أوشبا الشمالية عام 1888 في محاولتهما
    الرابعة، وصمدت القمة الجنوبية حتى عام 1903. وفي عام 1934 صارت ألكسندرا جاباريدزه أول امرأة تقف على
    أوشبا. وفي عام 1937 حقّق خمسة من السفان — غابرييل وبيكنو وبيساريون خيرغياني، وتشيتشيكو تشارتولاني،
    وماكسيمي غفارلياني — أول صعود إلى القمة الجنوبية عبر جدارها الجنوبي المهيب. ومن البحيرات يمكنك أن
    تتتبّع ذلك الجدار بعينيك.


    يمرّ الطريق صعوداً بالصليب الكبير على السلسلة فوق البلدة، ثم يتعرّج عبر مرعى مكشوف، حجريّ وشديد الانحدار.
    يستغرق نحو ساعة ونصف بسيارة الجيب، وأربع إلى خمس ساعات سيراً على الأقدام؛ ويمكن استئجار الخيول في
    ميستيا.


    تعالَ في صباح صافٍ أو لا تأتِ أبداً. حين ينخفض الغيم، لا يكون أوشبا موجوداً ببساطة، وتصبح البحيرات
    مجرّد ماء على تلّة. وحين يرتفع، تنبسط سفانيتي العليا كلها عند قدميك.
  tip: >-
    راجع النشرة الجوية في الليلة السابقة واحرص على بلوغ القمة باكراً: فالغيم عادة ما يطبق على أوشبا نحو
    الحادية عشرة. المكان عاصف وأبرد بكثير من ميستيا، فاحمل سترة وقبعة حتى في آب. لا مرافق هنا ولا ظلّ
    ولا شيء يُشترى — احمل الماء والطعام. سيراً على الأقدام تحتاج إلى حذاء جيد وأربع إلى خمس ساعات للصعود،
    ويمكن ترتيب الخيول وسيارات الجيب المحلية في ميستيا. كثيراً ما يبقى الثلج حتى منتصف حزيران ويعود بدءاً
    من أواخر أيلول.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) مروراً بكوتايسي حتى سامتريديا، وتابع على S1 عبر سيناكي إلى زوغديدي،
    ثم اصعد مضيق إنغوري حتى ميستيا — نحو 470 كم من الطرق المعبّدة وثماني ساعات ونصف. تزوّد بالوقود في
    ميستيا، فلا وقود فوق البلدة. لا تبعد البحيرات عن ميستيا سوى نحو 10 كم، لكنها مسلك جبلي شديد الانحدار
    ومليء بالأخاديد والحجارة، يمرّ بالصليب ويعبر المرعى المكشوف، ويستغرق نحو ساعة ونصف في كل اتجاه (المجموع
    نحو 480 كم وتسع ساعات ونصف من تبليسي). لا مكان هنا إلا لسيارة دفع رباعي حقيقية عالية الخلوص عن الأرض
    ومزوّدة بناقل سرعات منخفض؛ وبعد المطر تصير الأخاديد زلقة. وإلا فاستأجر سيارة جيب محلية من وسط ميستيا.
