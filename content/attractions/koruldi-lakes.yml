ka:
  name: კორულდის ტბები
  short: მცირე ალპური ტბები 2740 მეტრზე მესტიის ზემოთ, უშბის პირისპირ — ასვლა მხოლოდ 4x4-ით ან ფეხით.
  body: >-
    კორულდის ტბები რამდენიმე პატარა, ზოგჯერ თითქმის დროებითი ალპური წყალსატევია მესტიის ზემოთ, დაახლოებით
    2740 მეტრის სიმაღლეზე. თავად ტბები მოკრძალებულია — ისინი ივნისში ყველაზე სავსეა და აგვისტოს ბოლოსთვის
    შეიძლება მკვეთრად შემცირდეს. მთელი აზრი ხედშია: ჩრდილოეთით უშბის ორთავიანი კოშკი 4710 მეტრზე, აღმოსავლეთით
    თეთნულდი, ქვემოთ კი მთელი მესტიის ხეობა და მისი კოშკები ერთ კადრში ჯდება.


    ასვლა იწყება მესტიის ჯვრის ხედის გავლით: ჯერ ციცაბო გრუნტოვანი გზა, შემდეგ ქვიანი ბილიკი, რომელიც
    სამთო საძოვრებზე გადის. ფეხით ერთი მხარე ოთხიდან ხუთ საათამდე გრძელდება, ამიტომ ვიზიტორთა უმეტესობა
    ადგილობრივ 4x4-ს იქირავებს — მარშრუტი მაშინ დაახლოებით საათნახევარია ერთ მხარეს.


    რას უნდა ელოდოთ:


    - **გზა არ არის საერთო დანიშნულების** — ეს ღრმა ღარებიანი, ქვიანი სამთო ტრასაა

    - **სეზონი მოკლეა** — თოვლი ივნისის შუა რიცხვებამდე და სექტემბრის ბოლოდან იწყება

    - **ხედი ამინდზეა დამოკიდებული** — ღრუბლიან დღეს უშბა საერთოდ არ ჩანს


    თუ ამინდი ღია არაა, ასვლა აზრს კარგავს. სამაგიეროდ, სუფთა დილას ეს სვანეთის ყველაზე შთამბეჭდავი პანორამაა,
    რომელსაც სპეციალური მომზადება არ სჭირდება.
  tip: >-
    ამინდი წინა საღამოს შეამოწმეთ და დილით ადრე ავიდეთ — 11:00-ის შემდეგ ღრუბელი ჩვეულებრივ ხურავს უშბას.
    თუ საკუთარი მანქანით ადიხართ, მხოლოდ სრულფასოვანი, მაღალი კლირენსის 4x4 გამოდგება; ჩვეულებრივი კროსოვერით
    აქ ასვლა არც ღირს და არც დაზღვევით იფარება. ალტერნატივა მარტივია — მესტიის ცენტრში ადგილობრივი მძღოლები
    დღეში რამდენჯერმე ადიან. ზემოთ ქარია და ტემპერატურა ქალაქზე 8–10 გრადუსით დაბალია, ამიტომ ქურთუკი
    და ქუდი აუცილებელია. სერვისი ზემოთ არ არის.
  route: >-
    თბილისიდან ჯერ მესტიაში ხვდებით — 470 კმ და დაახლოებით ცხრა საათი ზუგდიდის გავლით. კორულდის ტბებამდე
    მესტიიდან მხოლოდ 10–12 კმ-ია, მაგრამ ეს მთლიანად ციცაბო გრუნტოვანი სამთო გზაა, რომელიც ჯვრის ხედს
    გასცდება და საძოვრებზე ადის: საათნახევარი ერთ მხარეს. საჭიროა მაღალი გამავლობის 4x4 დაბლოკვით; წვიმის
    შემდეგ მონაკვეთი კიდევ უფრო რთულდება. საწვავი მესტიაშია, ზემოთ არაფერი. თუ თქვენი ავტომობილის კატეგორია
    ამას არ იტანს, უმჯობესია ადგილობრივი ჯიპის დაქირავება.
en:
  name: Koruldi Lakes
  short: Small alpine pools at 2,740 m above Mestia, facing Mount Ushba — reachable only by 4x4 or on
    foot.
  body: >-
    The Koruldi lakes are a cluster of small, sometimes almost seasonal alpine pools on the ridge above
    Mestia, at around 2,740 metres. The lakes themselves are modest: they are fullest in June and can
    shrink dramatically by late August. The point of coming here is the view. To the north the twin towers
    of Ushba rise to 4,710 metres, Tetnuldi closes the eastern skyline, and the whole Mestia valley with
    its tower houses sits in the frame below.


    The ascent begins past the Cross viewpoint above town: first a steep dirt track, then a stony path
    across high summer pastures. On foot it takes four to five hours each way, which is why most visitors
    hire a local 4x4 and make it a ninety-minute drive instead.


    What to expect:


    - **This is not a general-purpose road** — it is a deeply rutted, rocky mountain track

    - **The season is short** — snow lingers into mid-June and returns from late September

    - **The view depends entirely on weather** — on a cloudy day Ushba simply is not there


    If the sky is not clear, the trip loses most of its purpose and is worth postponing a day. On a clean
    morning, though, this is the most striking panorama in Svaneti, and it requires no technical skill
    to reach.
  tip: >-
    Check the forecast the evening before and go early: after about 11:00 cloud usually closes over Ushba.
    If you drive yourself, only a genuine high-clearance 4x4 will do — an ordinary crossover has no business
    on this track and would not be covered by insurance. The simple alternative is to take one of the
    local drivers who run up from Mestia centre several times a day. It is windy at the top and eight
    to ten degrees colder than in town, so bring a jacket and a hat. There are no facilities up there.
  route: >-
    From Tbilisi you first reach Mestia — 470 km and around nine hours via Zugdidi. From Mestia the lakes
    are only 10–12 km away, but the entire distance is a steep dirt mountain track that passes the Cross
    viewpoint and climbs onto open pasture, taking about ninety minutes each way. A high-clearance 4x4
    with low range is the right tool; after rain the ruts get considerably worse and the surface turns
    greasy. Fuel is available in Mestia and nowhere above it. If your rental category does not cover this
    kind of surface, hiring a local jeep is the sensible choice.
ru:
  name: Озёра Корульди
  short: Небольшие альпийские озёра на 2740 м над Местиа, напротив Ушбы — подъём только на 4x4 или пешком.
  body: >-
    Озёра Корульди — группа маленьких, местами почти сезонных альпийских водоёмов на хребте над Местиа,
    примерно на 2740 метрах. Сами озёра скромные: полнее всего они в июне и к концу августа могут заметно
    усохнуть. Смысл подъёма — в панораме. На севере поднимаются двуглавые башни Ушбы высотой 4710 метров,
    восточный горизонт замыкает Тетнулди, а внизу в кадр целиком помещается Местийская долина с башенными
    домами.


    Подъём начинается за смотровой у креста над посёлком: сначала крутая грунтовая колея, затем каменистая
    тропа по высокогорным пастбищам. Пешком это четыре-пять часов в одну сторону, поэтому большинство
    гостей нанимают местный внедорожник и превращают дорогу в полуторачасовую поездку.


    Чего ожидать:


    - **Это не дорога общего пользования** — глубокая колея и камни на всём подъёме

    - **Сезон короткий** — снег лежит до середины июня и возвращается с конца сентября

    - **Вид полностью зависит от погоды** — в облачный день Ушбы попросту не видно


    Если небо затянуто, поездка теряет смысл, и её лучше отложить на день. Зато ясным утром это самая
    впечатляющая панорама Сванетии, причём без всякой технической подготовки.
  tip: >-
    Проверьте прогноз накануне вечером и поднимайтесь рано: примерно после 11:00 облака обычно закрывают
    Ушбу. Если едете сами, годится только настоящий внедорожник с высоким клиренсом — обычному кроссоверу
    здесь делать нечего, и страховка такой случай не покроет. Простая альтернатива: местные водители поднимаются
    из центра Местиа по нескольку раз в день. Наверху ветрено и на восемь-десять градусов холоднее, чем
    в посёлке, нужны куртка и шапка. Никакой инфраструктуры там нет.
  route: >-
    Из Тбилиси сначала добираетесь до Местиа — 470 км и около девяти часов через Зугдиди. От Местиа до
    озёр всего 10–12 км, но весь путь — крутая грунтовая горная колея мимо смотровой у креста и дальше
    по открытым пастбищам, около полутора часов в одну сторону. Нужен внедорожник с высоким клиренсом
    и понижающей передачей; после дождя колея становится заметно хуже, а грунт скользким. Топливо есть
    в Местиа и больше нигде выше. Если категория вашей аренды такое покрытие не допускает, разумнее нанять
    местный джип.
fa:
  name: دریاچه‌های کورولدی
  short: آبگیرهای کوچک آلپی در ارتفاع 2,740 متر بالای مستیا، رو به کوه اوشبا — تنها با 4x4 یا پیاده در
    دسترس.
  body: >-
    دریاچه‌های کورولدی مجموعه‌ای از آبگیرهای کوچک و گاه تقریباً فصلی آلپی روی ستیغ بالای مستیا در حدود
    2,740 متر هستند. خود دریاچه‌ها متواضع‌اند: در ژوئن پرآب‌ترین حالت را دارند و تا اواخر اوت ممکن است
    به‌شدت کوچک شوند. دلیل آمدن به اینجا منظره است. در شمال، برج‌های دوقلوی اوشبا تا 4,710 متر بالا می‌روند،
    تتنولدی افق شرقی را می‌بندد، و تمام درهٔ مستیا با خانه-برج‌هایش پایین در قاب می‌نشیند.


    صعود پس از نقطهٔ دید صلیب بالای شهر آغاز می‌شود: نخست کوره‌راهی خاکی و تند، سپس مسیری سنگلاخ از میان
    چراگاه‌های بلند تابستانی. پیاده چهار تا پنج ساعت در هر جهت طول می‌کشد و به همین دلیل بیشتر بازدیدکنندگان
    4x4 محلی می‌گیرند و آن را به سفری نودقیقه‌ای بدل می‌کنند.


    چه انتظاری داشته باشید:


    - **این جادهٔ عمومی نیست** — کوره‌راهی کوهستانی با شیارهای عمیق و سنگلاخ است

    - **فصل کوتاه است** — برف تا میانهٔ ژوئن می‌ماند و از اواخر سپتامبر برمی‌گردد

    - **منظره کاملاً به هوا بستگی دارد** — در روزی ابری اوشبا اصلاً آنجا نیست


    اگر آسمان صاف نباشد، سفر بیشتر معنایش را از دست می‌دهد و بهتر است یک روز عقب بیفتد. اما در صبحی پاک،
    این چشمگیرترین پانورامای سوانتی است و رسیدن به آن هیچ مهارت فنی نمی‌خواهد.
  tip: >-
    پیش‌بینی هوا را شب قبل بررسی کنید و زود راه بیفتید: بعد از حدود 11:00 ابر معمولاً روی اوشبا بسته می‌شود.
    اگر خودتان می‌رانید، تنها یک 4x4 واقعی با ارتفاع کف بالا به کار می‌آید — کراس‌اوور معمولی در این کوره‌راه
    جایی ندارد و بیمه هم پوششش نمی‌دهد. راه ساده این است که یکی از رانندگان محلی را بگیرید که روزی چند
    بار از مرکز مستیا بالا می‌روند. بالا باد می‌آید و هشت تا ده درجه از شهر سردتر است، پس ژاکت و کلاه
    بیاورید. آن بالا هیچ امکاناتی نیست.
  route: >-
    از تفلیس نخست به مستیا می‌رسید — 470 کیلومتر و حدود نه ساعت از راه زوگدیدی. از مستیا دریاچه‌ها تنها
    10 تا 12 کیلومتر فاصله دارند، اما تمام این فاصله کوره‌راهی خاکی و تند کوهستانی است که از نقطهٔ دید
    صلیب می‌گذرد و به چراگاه باز بالا می‌رود و در هر جهت حدود نود دقیقه طول می‌کشد. یک 4x4 با ارتفاع کف
    بالا و دندهٔ سنگین ابزار درست کار است؛ پس از باران شیارها به‌مراتب بدتر می‌شوند و سطح لیز. سوخت در
    مستیا هست و بالاتر از آن هیچ‌جا. اگر ردهٔ اجاره‌ای شما چنین سطحی را پوشش نمی‌دهد، گرفتن جیپ محلی انتخاب
    معقولی است.
he:
  name: אגמי קורולדי
  short: בריכות אלפיניות קטנות בגובה 2,740 מ' מעל מסטיה, מול הר אושבה — נגישות רק ברכב 4x4 או ברגל.
  body: >-
    אגמי קורולדי הם אשכול של בריכות אלפיניות קטנות, לעיתים כמעט עונתיות, על הרכס שמעל מסטיה, בגובה של
    כ-2,740 מטר. האגמים עצמם צנועים: הם מלאים ביותר ביוני ועשויים להצטמק מאוד עד סוף אוגוסט. הטעם לבוא
    לכאן הוא הנוף. בצפון מתנשאים מגדליו התאומים של אושבה לגובה 4,710 מטר, טטנולדי סוגר את קו הרקיע המזרחי,
    וכל עמק מסטיה עם בתי המגדל שלו יושב בתוך המסגרת למטה.


    העלייה מתחילה אחרי נקודת התצפית של הצלב שמעל העיירה: תחילה דרך עפר תלולה, ואחר כך שביל אבנים על פני
    מרעה גבוה של קיץ. ברגל זה לוקח ארבע עד חמש שעות לכל כיוון, ולכן רוב המבקרים שוכרים רכב 4x4 מקומי והופכים
    את הדרך לנסיעה של שעה וחצי.


    למה לצפות:


    - **זו אינה דרך לשימוש כללי** — זו דרך הרים סלעית עם תלמים עמוקים

    - **העונה קצרה** — שלג נותר עד אמצע יוני וחוזר מסוף ספטמבר

    - **הנוף תלוי לחלוטין במזג האוויר** — ביום מעונן אושבה פשוט אינה שם


    אם השמיים אינם בהירים, הנסיעה מאבדת את רוב טעמה וכדאי לדחות אותה ביום אחד. אבל בבוקר צלול זו הפנורמה
    המרשימה ביותר בסוואנטי, וההגעה אליה אינה דורשת שום מיומנות טכנית.
  tip: >-
    בדקו את התחזית בערב שלפני וצאו מוקדם: אחרי השעה 11:00 בערך העננים בדרך כלל נסגרים על אושבה. אם אתם
    נוהגים בעצמכם, רק רכב 4x4 אמיתי עם גובה גחון גבוה יתאים — לקרוסאובר רגיל אין מה לחפש בדרך הזאת והביטוח
    לא יכסה אותו. החלופה הפשוטה היא לקחת אחד הנהגים המקומיים שעולים ממרכז מסטיה כמה פעמים ביום. למעלה
    נושבת רוח וקר בשמונה עד עשר מעלות מאשר בעיירה, לכן הביאו מעיל וכובע. אין שם שום מתקנים.
  route: >-
    מטביליסי מגיעים קודם כול למסטיה — 470 ק״מ וכתשע שעות דרך זוגדידי. ממסטיה האגמים רחוקים רק 10–12 ק״מ,
    אך כל המרחק הזה הוא דרך עפר הררית ותלולה שעוברת בנקודת התצפית של הצלב ומטפסת אל מרעה פתוח, ואורכת
    כשעה וחצי לכל כיוון. רכב 4x4 עם גובה גחון והילוך כוח הוא הכלי הנכון; אחרי גשם התלמים מחמירים מאוד
    והמשטח נעשה חלקלק. דלק יש במסטיה ובשום מקום מעליה. אם קטגוריית ההשכרה שלכם אינה מכסה משטח כזה, שכירת
    ג'יפ מקומי היא הבחירה ההגיונית.
ar:
  name: بحيرات كورولدي
  short: برك ألبية صغيرة على ارتفاع 2,740 م فوق ميستيا، تواجه جبل أوشبا — لا يُوصل إليها إلا بسيارة 4x4
    أو سيراً.
  body: >-
    بحيرات كورولدي مجموعة من البرك الألبية الصغيرة، وبعضها شبه موسمي، على الحافة فوق ميستيا على ارتفاع
    نحو 2,740 متراً. والبحيرات نفسها متواضعة: تمتلئ أكثر ما تمتلئ في يونيو وقد تنكمش بشدة مع أواخر أغسطس.
    والغاية من المجيء إلى هنا هي المنظر. ففي الشمال يرتفع برجا أوشبا التوأمان إلى 4,710 أمتار، وتغلق تيتنولدي
    الأفق الشرقي، ويجلس وادي ميستيا كله ببيوته البرجية في الإطار أسفلك.


    يبدأ الصعود بعد مطل الصليب فوق البلدة: أولاً درب ترابي حاد، ثم ممر حجري عبر مراعٍ صيفية عالية. ويستغرق
    ذلك سيراً أربع إلى خمس ساعات في كل اتجاه، ولهذا يستأجر معظم الزوار سيارة 4x4 محلية فتصير الرحلة قيادة
    مدتها تسعون دقيقة.


    ما ينبغي توقعه:


    - **هذا ليس طريقاً للاستعمال العام** — إنه درب جبلي صخري بأخاديد عميقة

    - **الموسم قصير** — يبقى الثلج حتى منتصف يونيو ويعود من أواخر سبتمبر

    - **المنظر يتوقف كلياً على الطقس** — ففي يوم غائم لا وجود لأوشبا ببساطة


    وإن لم تكن السماء صافية فقدت الرحلة معظم غايتها ويستحسن تأجيلها يوماً واحداً. أما في صباح نقي فهذه
    أبهر بانوراما في سفانيتي، والوصول إليها لا يتطلب أي مهارة فنية.
  tip: >-
    تحقق من نشرة الطقس في المساء السابق وانطلق مبكراً: فبعد الساعة 11:00 تقريباً تنغلق الغيوم عادة على
    أوشبا. وإن قدت بنفسك فلن تفي بالغرض إلا سيارة 4x4 حقيقية بخلوص أرضي عالٍ — فالكروس أوفر العادية لا
    شأن لها بهذا الدرب ولن يغطيها التأمين. والبديل البسيط هو الاستعانة بأحد السائقين المحليين الذين يصعدون
    من وسط ميستيا عدة مرات يومياً. والجو في الأعلى عاصف وأبرد من البلدة بثماني إلى عشر درجات، فاحمل سترة
    وقبعة. ولا مرافق هناك البتة.
  route: >-
    من تبليسي تصل أولاً إلى ميستيا — 470 كم ونحو تسع ساعات عبر زوغديدي. ومن ميستيا لا تبعد البحيرات سوى
    10–12 كم، لكن المسافة كلها درب جبلي ترابي حاد يمر بمطل الصليب ويصعد إلى مرعى مفتوح، ويستغرق نحو تسعين
    دقيقة في كل اتجاه. وسيارة 4x4 بخلوص أرضي عالٍ وناقل تخفيض هي الأداة الصحيحة؛ وبعد المطر تسوء الأخاديد
    كثيراً ويصير السطح زلقاً. والوقود متوفر في ميستيا ولا شيء فوقها. وإن كانت فئة سيارتك المستأجرة لا
    تغطي مثل هذا السطح، فاستئجار جيب محلي هو الخيار المعقول.
