ka:
  name: შროშა
  short: >-
    იმერული სოფელი, რომელიც თიხით ცხოვრობს: გზისპირა დახლებზე დოქები, ჯამები და ქვევრები, თაობიდან თაობას
    გადაცემული ხელობის ნაყოფი.
  body: >-
    **შროშაში თიხა გზისპირას დგას: დოქები, ჯამები და ქვევრები რიგებად ჩაუმწკრივებიათ და ჯერაც იმ მიწის
    ფერი შერჩენიათ, რომლისგანაც გამოძერწეს.**


    სოფელი ზესტაფონის მუნიციპალიტეტშია, ძველ გზატკეცილზე, რიკოთის უღელტეხილსა და შორაპანს შორის. აქაური
    თიხა მეთუნეობისთვის კარგია და შროშა თაობებია, რაც მისით ცხოვრობს: ოჯახების უმეტესობა ასე თუ ისე ამ
    ხელობასთანაა დაკავშირებული, გზისპირა დახლები კი მხოლოდ მისი ვიტრინაა — დოქები, სამზარეულოს ჭურჭელი,
    დეკორატიული ნივთები, გვერდით კი წნული კალათები და სხვა ხელნაკეთი ნაწარმი.


    წვრილმანს გადახედეთ და ყველაზე დიდ ჭურჭელს დააკვირდით. ეს ქვევრია — თიხის დიდი ჭური, რომელშიც ქართული
    ღვინო თიხასთან უშუალო შეხებით დუღს და მწიფდება. ქვევრში ღვინის დაყენების ეს წესი დღეს იუნესკოს არამატერიალური
    კულტურული მემკვიდრეობის სიაშია. ერთი ცნობით, შროშა საქართველოს იმ ხუთ სოფელს შორისაა, სადაც ქვევრს
    ჯერაც ძველებური წესით აკეთებენ.


    ეს ნელი, მომთმენი შრომაა. ბოჟაძეების სახელოსნოში, სადაც მექვევრეთა მეხუთე თაობის წარმომადგენელი სერგო
    მამასთან, ზალიკოსთან ერთად მუშაობს, ნედლ თიხას, სერგოს თქმით, დაახლოებით 30 კილომეტრიდან ეზიდებიან
    და ორი სხვადასხვა ჯიშის თიხას წყალთან ერთად ხელის შეგრძნებით ზელენ — ზუსტი რეცეპტი აქ არ არსებობს.
    კედელი თიხის ზონრებით, ფენა-ფენა იზრდება, დღეში დაახლოებით 15–20 სანტიმეტრით; დიდ ქვევრს დაახლოებით
    90 დღე სჭირდება. შემდეგ მას ხუთ-ექვს დღეს დაახლოებით 900 გრადუსზე გამოწვავენ, შიგნიდან ფუტკრის ცვილით
    დაფარავენ, გარედან კი კირის ხსნარით შელესავენ. მათი ქვევრები ქართველ მეღვინეებთან ერთად იაპონიაში,
    სამხრეთ აფრიკაში, ინდოეთსა და იტალიაშიც მიდის.


    თუ ქვევრი საბარგულში არ ეტევა, დოქი წაიღეთ. ისიც ასევე დაიბადა: სველი მიწისგან და აუჩქარებელი ხელებისგან.
  tip: >-
    დახლების დათვალიერება უფასოა და ისინი მთელი წელი მუშაობს; თუ მეთუნეებთან საუბარი გინდათ, დაახლოებით
    ერთი საათი გამოყავით. გაჩერებამდე მანქანა სავალი ნაწილიდან ბოლომდე გაიყვანეთ — ამ გზაზე ადგილობრივი
    სატვირთოები ახლაც დადის. ფასი ნივთის შეყვარებამდე იკითხეთ, თან ნაღდი ფული იქონიეთ და მსხვრევადი ნივთის
    კარგად შეფუთვა სთხოვეთ გამყიდველს; საბარგულში დაკეცილი საბანი ბევრ გულისტკივილს აგარიდებთ. თუ გაყიდვის
    ნაცვლად დამზადება გაინტერესებთ, დახლთან იკითხეთ, მუშაობს თუ არა იმ დღეს რომელიმე სახელოსნო და შეიძლება
    თუ არა შეხედვა. საჭმელი და საწვავი ყველაზე მარტივად ზესტაფონშია, დაახლოებით 10 კილომეტრში.
  route: >-
    შროშა თბილისიდან დაახლოებით 172 კილომეტრშია, გზა 2 საათსა და 25 წუთს გრძელდება. დასავლეთით ს1 (E60)
    გზატკეცილით წადით მცხეთის, გორისა და ხაშურის გავლით რიკოთისა და იმერეთისკენ — დატვირთული, მთლიანად
    მოასფალტებული მაგისტრალია, ბენზინგასამართი ყველა ქალაქშია. ს1-ის ახალი მონაკვეთი სოფელზე აღარ გადის:
    ბოლო დაახლოებით ხუთი კილომეტრი შ213-ით, ძველი ხევი–ვერტყვიჭალა–შორაპნის გზით უნდა გაიაროთ, დახლებიც
    სწორედ აქ, გზისპირას დაგხვდებათ. ასფალტი ბოლომდეა, ამიტომ ეკონომკლასის მანქანაც სავსებით საკმარისია.
    შროშა ბუნებრივი შესვენებაა თბილისიდან ქუთაისისა თუ ბათუმისკენ მიმავალ ნებისმიერ გზაზე, ახლოს კი, რამდენიმე
    კილომეტრში დასავლეთით, შორაპნის ციხეა.
en:
  name: Shrosha Pottery Village
  short: >-
    An Imeretian village that lives by its clay: roadside rows of jugs, bowls and qvevri wine jars, made
    by families who have worked this craft for generations.
  body: >-
    **In Shrosha the clay stands by the roadside: jugs, bowls and wine jars lined up in rows, still the
    colour of the earth they came from.**


    The village lies in Zestaponi municipality, on the old highway between the Rikoti Pass and Shorapani.
    Its clay is good for pottery, and Shrosha has lived by it for generations: most families here are
    tied to the trade in one way or another, and the open-air stalls are simply its shop window — jugs,
    cookware and decorative pieces, with woven baskets and other handcrafts beside them.


    Look past the small things to the biggest vessels. These are qvevri, the earthenware jars in which
    Georgian wine ferments and ages in contact with clay — a method now on UNESCO's list of intangible
    cultural heritage. By one count, Shrosha is one of only five villages in Georgia where qvevri are
    still made the traditional way.


    It is slow, patient work. In the Bozhadze workshop, where Sergo, the fifth generation of qvevri-makers,
    works alongside his father Zaliko, the raw clay, Sergo says, is brought from about 30 km away and
    two kinds are blended with water by feel rather than by recipe. The walls rise coil by coil, some
    15–20 cm a day; a large jar takes about 90 days. It is then fired at around 900°C for five or six
    days, sealed inside with beeswax and rendered outside with lime. Their vessels go to Georgian winemakers
    and as far as Japan, South Africa, India and Italy.


    If a qvevri will not fit in the boot, take a jug. It began the same way: wet earth and a pair of unhurried
    hands.
  tip: >-
    Browsing is free and the stalls are open all year; allow up to an hour if you want to talk to the
    potters. Pull fully off the carriageway before you stop — local lorries still use this road. Ask the
    price before you fall for a piece, carry cash, and ask the seller to wrap anything fragile well; a
    folded blanket in the boot saves a lot of heartbreak. If you want to see the making rather than the
    selling, ask at the stalls whether a workshop is at work that day and whether you may look in. Food
    and fuel are easiest in Zestaponi, about 10 km on.
  route: >-
    Shrosha is about 172 km from Tbilisi, roughly 2 hours 25 minutes. Take the S1 (E60) west past Mtskheta,
    Gori and Khashuri towards the Rikoti Pass and Imereti — a busy, fully paved trunk road, with fuel
    in every town along the way. The new S1 alignment no longer runs through the village: for the last
    five kilometres or so you leave it for the Sh213, the old Khevi–Vertkvichala–Shorapani highway, and
    the stalls appear along the verge. Asphalt all the way, so an economy car is perfectly adequate. Shrosha
    makes a natural pause on any drive between Tbilisi and Kutaisi or Batumi, and pairs well with Shorapani
    Fortress a few kilometres west.
ru:
  name: Шроша — село гончаров
  short: >-
    Имеретинское село, которое живёт своей глиной: вдоль дороги ряды кувшинов, мисок и винных квеври от
    семей, из поколения в поколение хранящих ремесло.
  body: >-
    **В Шроше глина стоит у обочины: кувшины, миски и винные сосуды выстроены рядами и всё ещё хранят
    цвет земли, из которой вышли.**


    Село лежит в Зестафонском муниципалитете, на старом шоссе между Рикотским перевалом и Шорапани. Здешняя
    глина хороша для гончарного дела, и Шроша живёт ею из поколения в поколение: большинство семей так
    или иначе связаны с ремеслом, а придорожные прилавки под открытым небом — просто его витрина. Здесь
    кувшины, кухонная посуда и декоративные вещи, а рядом — плетёные корзины и другие изделия ручной работы.


    Переведите взгляд с мелочей на самые большие сосуды. Это квеври — глиняные кувшины, в которых грузинское
    вино бродит и выдерживается в соприкосновении с глиной; сегодня этот метод внесён в список нематериального
    культурного наследия ЮНЕСКО. По одним данным, Шроша — одно из всего пяти сёл Грузии, где квеври до
    сих пор делают по-старому.


    Это медленная, терпеливая работа. В мастерской Божадзе, где Серго, мастер квеври в пятом поколении,
    трудится вместе с отцом Залико, сырую глину, по словам Серго, привозят примерно за 30 км, а два её
    сорта смешивают с водой на ощупь, а не по рецепту. Стенки растут жгут за жгутом, на 15–20 см в день;
    большой сосуд требует около 90 дней. Затем его обжигают при температуре около 900 °C пять-шесть дней,
    изнутри покрывают пчелиным воском, а снаружи обмазывают известью. Их квеври уходят к грузинским виноделам
    и дальше — в Японию, ЮАР, Индию и Италию.


    Если квеври не помещается в багажник, возьмите кувшин. Он начинался так же: с сырой земли и пары неторопливых
    рук.
  tip: >-
    Смотреть можно бесплатно, прилавки открыты круглый год; если хотите поговорить с гончарами, заложите
    до часа. Прежде чем остановиться, полностью съезжайте с проезжей части — по этой дороге до сих пор
    ездят местные грузовики. Спрашивайте цену до того, как влюбитесь в вещь, держите при себе наличные
    и просите продавца хорошо упаковать всё хрупкое; сложенное одеяло в багажнике избавит от многих огорчений.
    Если хотите увидеть не торговлю, а само изготовление, спросите у прилавков, работает ли сегодня какая-нибудь
    мастерская и можно ли туда заглянуть. Поесть и заправиться проще всего в Зестафони, примерно в 10
    км дальше по дороге.
  route: >-
    Шроша примерно в 172 км от Тбилиси, около 2 часов 25 минут пути. Езжайте по S1 (E60) на запад мимо
    Мцхеты, Гори и Хашури к Рикотскому перевалу и в Имеретию — это оживлённая магистраль, асфальтированная
    на всём протяжении, с заправками в каждом городе по пути. Новая трасса S1 больше не проходит через
    село: примерно за пять километров до цели вы сворачиваете с неё на Sh213 — старое шоссе Хеви–Вертквичала–Шорапани,
    и вдоль обочины появляются прилавки. Асфальт на всём пути, так что машины эконом-класса вполне достаточно.
    Шроша — естественная остановка по дороге из Тбилиси в Кутаиси или Батуми, и её удобно совместить с
    крепостью Шорапани в нескольких километрах к западу.
fa:
  name: شروشا، روستای سفالگران
  short: >-
    روستایی در ایمرتی که با گِلش زنده است: ردیف کوزه‌ها، کاسه‌ها و خمره‌های شراب کوِوری کنار جاده، ساختهٔ
    خانواده‌هایی که نسل‌ها این پیشه را داشته‌اند.
  body: >-
    **در شروشا گِل کنار جاده ایستاده است: کوزه‌ها، کاسه‌ها و خمره‌های شراب ردیف‌به‌ردیف چیده شده‌اند و
    هنوز رنگ خاکی را دارند که از آن برآمده‌اند.**


    این روستا در شهرستان زستافونی، بر جادهٔ قدیمی میان گردنهٔ ریکوتی و شوراپانی قرار دارد. خاک رس اینجا
    برای سفالگری مرغوب است و شروشا نسل‌هاست که از آن روزی می‌خورد: بیشتر خانواده‌ها به نوعی با این پیشه
    پیوند دارند و بساط‌های روباز کنار جاده تنها ویترین آن است — کوزه، ظروف آشپزی و اشیای تزئینی، و در
    کنارشان سبدهای بافته و دیگر دست‌ساخته‌ها.


    از چیزهای کوچک بگذرید و به بزرگ‌ترین ظرف‌ها نگاه کنید. این‌ها کوِوری‌اند، خمره‌های سفالی‌ای که شراب
    گرجی در آن‌ها در تماس با گل تخمیر می‌شود و جا می‌افتد — روشی که امروز در فهرست میراث فرهنگی ناملموس
    یونسکو ثبت شده است. به گفتهٔ یک منبع، شروشا یکی از تنها پنج روستای گرجستان است که هنوز کوِوری را در
    آن به شیوهٔ سنتی می‌سازند.


    کاری است آهسته و پرحوصله. در کارگاه بوژادزه، جایی که سرگو، نسل پنجم کوِوری‌سازان، در کنار پدرش زالیکو
    کار می‌کند، به گفتهٔ سرگو، گل خام را از حدود ۳۰ کیلومتر دورتر می‌آورند و دو نوع آن را نه با دستورِ
    ثابت، بلکه به حسّ دست با آب درمی‌آمیزند. دیواره‌ها فتیله به فتیله بالا می‌آیند، روزی ۱۵ تا ۲۰ سانتی‌متر؛
    ساختن یک خمرهٔ بزرگ حدود ۹۰ روز طول می‌کشد. سپس آن را پنج یا شش روز در دمای حدود ۹۰۰ درجه می‌پزند،
    درونش را با موم زنبور عسل آب‌بندی می‌کنند و بیرونش را با آهک اندود می‌کنند. خمره‌های آنان به دست شراب‌سازان
    گرجی می‌رسد و تا ژاپن، آفریقای جنوبی، هند و ایتالیا هم می‌رود.


    اگر کوِوری در صندوق عقب جا نمی‌شود، کوزه‌ای بردارید. آن هم همین‌گونه آغاز شد: با خاکی خیس و دو دستِ
    بی‌شتاب.
  tip: >-
    تماشا رایگان است و بساط‌ها تمام سال برپاست؛ اگر می‌خواهید با سفالگران گپ بزنید، تا یک ساعت وقت بگذارید.
    پیش از توقف کاملاً از سواره‌رو بیرون بروید — کامیون‌های محلی هنوز از این جاده رفت‌وآمد می‌کنند. پیش
    از آنکه دل به چیزی ببندید قیمتش را بپرسید، پول نقد همراه داشته باشید و از فروشنده بخواهید اشیای شکستنی
    را خوب بپیچد؛ یک پتوی تاشده در صندوق عقب جلوی بسیاری از دل‌شکستگی‌ها را می‌گیرد. اگر به جای فروش،
    ساختن را می‌خواهید ببینید، از فروشندگان بپرسید آیا آن روز کارگاهی مشغول کار است و آیا می‌توانید سری
    به آن بزنید. غذا و سوخت را از همه آسان‌تر در زستافونی، حدود ۱۰ کیلومتر جلوتر، پیدا می‌کنید.
  route: >-
    شروشا حدود ۱۷۲ کیلومتر از تفلیس فاصله دارد، تقریباً ۲ ساعت و ۲۵ دقیقه. جادهٔ S1 (E60) را رو به غرب،
    از کنار متسختا، گوری و خاشوری، به سوی گردنهٔ ریکوتی و ایمرتی بروید؛ شاهراهی شلوغ و سراسر آسفالت، با
    جایگاه سوخت در هر شهر سر راه. مسیر جدید S1 دیگر از روستا نمی‌گذرد: در حدود پنج کیلومتر پایانی آن را
    ترک می‌کنید و وارد Sh213، یعنی جادهٔ قدیمی خه‌وی–ورتکویچالا–شوراپانی، می‌شوید و بساط‌ها کنار جاده
    پیدا می‌شوند. تمام راه آسفالت است، پس خودروی اقتصادی کاملاً کافی است. شروشا توقفگاهی طبیعی در هر سفری
    میان تفلیس و کوتایسی یا باتومی است و با قلعهٔ شوراپانی، چند کیلومتر به سمت غرب، به‌خوبی جور درمی‌آید.
he:
  name: שרושה, כפר הקדרים
  short: >-
    כפר באימרתי שחי מהחימר שלו: שורות של כדים, קערות וכדי יין (קווברי) לצד הדרך, מעשה ידי משפחות שעוסקות
    במלאכה הזאת דורות.
  body: >-
    **בשרושה החימר עומד בצד הדרך: כדים, קערות וכדי יין מסודרים בשורות, ועדיין בצבע האדמה שממנה באו.**


    הכפר שוכן במוניציפליטת זסטפוני, על הכביש הישן שבין מעבר ריקוטי לשוראפאני. החימר המקומי טוב לקדרות,
    ושרושה מתפרנסת ממנו כבר דורות: רוב המשפחות כאן קשורות למלאכה בדרך זו או אחרת, והדוכנים הפתוחים לצד
    הדרך הם בסך הכול חלון הראווה שלה — כדים, כלי בישול ופריטי נוי, ולצדם סלים קלועים ועבודות יד אחרות.


    הסיטו את המבט מהפריטים הקטנים אל הכלים הגדולים ביותר. אלה הם הקווברי, כדי החרס שבהם היין הגאורגי תוסס
    ומתיישן במגע עם החימר — שיטה שנכללת כיום ברשימת המורשת התרבותית הבלתי מוחשית של אונסק״ו. לפי אחת הספירות,
    שרושה היא אחד מחמישה כפרים בלבד בגאורגיה שבהם עדיין מייצרים קווברי בדרך המסורתית.


    זו עבודה איטית וסבלנית. בסדנת בוז׳אדזה, שבה עובד סרגו, הדור החמישי של יוצרי קווברי, לצד אביו זליקו,
    מביאים, לדברי סרגו, את החימר הגולמי ממרחק של כ-30 ק״מ, ושני סוגי חימר מעורבבים במים לפי תחושת היד
    ולא לפי מתכון. הדפנות נבנות חבל חימר אחר חבל, 15–20 ס״מ ביום; כד גדול דורש כ-90 יום. אחר כך הוא נשרף
    בכבשן בכ-900 מעלות במשך חמישה או שישה ימים, נאטם מבפנים בשעוות דבורים ומטויח מבחוץ בסיד. הכדים שלהם
    מגיעים ליינני גאורגיה, ואף ליפן, לדרום אפריקה, להודו ולאיטליה.


    אם הקווברי לא נכנס לתא המטען, קחו כד. גם הוא התחיל כך: אדמה רטובה וזוג ידיים שאינן ממהרות.
  tip: >-
    ההסתכלות חינם והדוכנים פתוחים כל השנה; אם תרצו לשוחח עם הקדרים, הקדישו לכך עד שעה. לפני שעוצרים, ירדו
    לגמרי מנתיב הנסיעה — משאיות מקומיות עדיין נוסעות בכביש הזה. שאלו מה המחיר לפני שאתם מתאהבים בפריט,
    החזיקו מזומן ובקשו מהמוכר לעטוף היטב כל דבר שביר; שמיכה מקופלת בתא המטען חוסכת לא מעט עוגמת נפש. אם
    אתם רוצים לראות את הייצור ולא רק את המכירה, שאלו בדוכנים אם יש סדנה שעובדת באותו יום ואם אפשר להציץ
    פנימה. אוכל ודלק הכי קל למצוא בזסטפוני, כ-10 ק״מ בהמשך הדרך.
  route: >-
    שרושה נמצאת כ-172 ק״מ מטביליסי, כשעתיים ו-25 דקות נסיעה. סעו מערבה בכביש S1 (E60) על פני מצחתה, גורי
    וחשורי לכיוון מעבר ריקוטי ואימרתי — כביש ראשי עמוס, סלול לכל אורכו, עם תחנות דלק בכל עיר בדרך. התוואי
    החדש של S1 כבר אינו עובר בכפר: כחמישה קילומטרים לפני היעד יורדים ממנו אל Sh213, הכביש הישן חבי–ורטקוויצ׳לה–שוראפאני,
    והדוכנים מופיעים לאורך השוליים. אספלט לכל אורך הדרך, כך שרכב קטן מקטגוריית אקונומי מספיק בהחלט. שרושה
    היא עצירה טבעית בכל נסיעה בין טביליסי לקוטאיסי או לבטומי, והיא משתלבת היטב עם מבצר שוראפאני, כמה קילומטרים
    מערבה.
ar:
  name: شروشا، قرية الفخّارين
  short: >-
    قرية إيميريتية تعيش من طينها: صفوف من الجرار والأوعية وخوابي النبيذ «كفيفري» على جانب الطريق، تصنعها
    عائلات توارثت الحرفة جيلاً بعد جيل.
  body: >-
    **في شروشا يقف الطين على جانب الطريق: جرار وأوعية وخوابي نبيذ مصفوفة صفوفاً، لا تزال بلون التراب الذي
    خرجت منه.**


    تقع القرية في بلدية زيستافوني، على الطريق السريع القديم بين ممر ريكوتي وشوراباني. وطينها صالح لصناعة
    الفخار، وقد عاشت منه شروشا أجيالاً: فمعظم العائلات هنا مرتبطة بالحرفة بشكل أو بآخر، والبسطات المكشوفة
    على جانب الطريق ليست سوى واجهة عرضها — جرار وأوانٍ للطبخ وقطع للزينة، وإلى جانبها سلال مجدولة ومصنوعات
    يدوية أخرى.


    تجاوز القطع الصغيرة بنظرك إلى أكبر الأوعية. هذه هي الكفيفري، الخوابي الفخارية التي يتخمّر فيها النبيذ
    الجورجي ويعتّق ملامساً للطين — وهي طريقة مدرجة اليوم على قائمة اليونسكو للتراث الثقافي غير المادي.
    وبحسب أحد التقديرات، شروشا واحدة من خمس قرى فقط في جورجيا لا تزال تُصنع فيها الكفيفري بالطريقة التقليدية.


    إنه عمل بطيء يتطلب صبراً. ففي ورشة بوجادزه، حيث يعمل سيرغو، الجيل الخامس من صانعي الكفيفري، إلى جانب
    أبيه زاليكو، يُجلب الطين الخام، كما يقول سيرغو، من مسافة نحو 30 كم، ويُمزج نوعان منه بالماء بالإحساس
    لا بالوصفة. ترتفع الجدران لفّةً فوق لفّة، بمعدل 15–20 سم في اليوم؛ وتحتاج الخابية الكبيرة إلى نحو
    90 يوماً. ثم تُحرق في نحو 900 درجة مئوية لخمسة أيام أو ستة، وتُعزل من الداخل بشمع النحل وتُطلى من
    الخارج بالجير. وتذهب خوابيهم إلى صانعي النبيذ الجورجيين، بل تصل إلى اليابان وجنوب أفريقيا والهند وإيطاليا.


    وإن لم يتسع صندوق السيارة لخابية، فخذ جرّة. فقد بدأت هي أيضاً على النحو نفسه: تراب مبلول ويدان لا
    تعرفان العجلة.
  tip: >-
    التفرّج مجاني والبسطات مفتوحة طوال العام؛ خصّص ما يصل إلى ساعة إن أردت الحديث مع الفخّارين. وقبل أن
    تتوقف، اخرج تماماً عن مسار السير — فالشاحنات المحلية لا تزال تستخدم هذا الطريق. اسأل عن السعر قبل
    أن تتعلق بقطعة ما، واحمل نقوداً، واطلب من البائع أن يلفّ جيداً كل ما هو قابل للكسر؛ فبطانية مطوية
    في صندوق السيارة توفّر عليك كثيراً من الحسرة. وإن أردت أن ترى الصنع لا البيع، فاسأل عند البسطات إن
    كانت هناك ورشة تعمل ذلك اليوم وهل يمكنك إلقاء نظرة. الطعام والوقود أيسر ما يكونان في زيستافوني، على
    بعد نحو 10 كم.
  route: >-
    تبعد شروشا نحو 172 كم عن تبليسي، أي قرابة ساعتين و25 دقيقة. اسلك الطريق S1 (E60) غرباً مروراً بمتسخيتا
    وغوري وخاشوري نحو ممر ريكوتي وإيميريتي — وهو طريق رئيسي مزدحم ومعبّد بالكامل، وفي كل بلدة على الطريق
    محطة وقود. لم يعد المسار الجديد للطريق S1 يمر بالقرية: ففي الكيلومترات الخمسة الأخيرة تقريباً تتركه
    إلى الطريق Sh213، أي طريق خيفي–فيرتكفيتشالا–شوراباني القديم، فتظهر البسطات على جانبه. الأسفلت يمتد
    طوال الطريق، لذا تكفي سيارة من الفئة الاقتصادية تماماً. وشروشا محطة توقف طبيعية في أي رحلة بين تبليسي
    وكوتايسي أو باتومي، ويحسن الجمع بينها وبين قلعة شوراباني على بعد بضعة كيلومترات إلى الغرب.
