ka:
  name: აბრეშუმის სახელმწიფო მუზეუმი
  short: >-
    1887 წელს დაარსებული მუზეუმი, რომელიც თითქმის უცვლელად შემორჩა — ვიტრინები, წარწერები და კოლექცია
    XIX საუკუნისაა.
  body: >-
    **ეს არა იმდენად მუზეუმი აბრეშუმზე, რამდენადაც XIX საუკუნის მუზეუმის ცოცხალი ეგზემპლარია.** ის 1887
    წელს დაარსდა კავკასიის მეაბრეშუმეობის სადგურთან, ნიკოლაი შავროვის ინიციატივით, შენობა კი 1892 წელს
    დაასრულეს არქიტექტორ ალექსანდრე შიმკევიჩის პროექტით — იმავე ავტორისა, ვისაც რუსთაველის თეატრის შენობა
    ეკუთვნის.


    მიზანი პრაქტიკული იყო: იმპერიის მთელ სამხრეთში გლეხებს უნდა ესწავლათ აბრეშუმის ჭიის მოშენება, დაავადებების
    ამოცნობა და პარკის სწორად დამუშავება. ამიტომ ეს სასწავლო კოლექციაა და არა სამკაულების გამოფენა.


    განსაკუთრებული ისაა, რომ თითქმის არაფერი შეცვლილა. დარბაზებში დგას ორიგინალი მუხის და მინის ვიტრინები,
    მათში კი:


    - მსოფლიოს სხვადასხვა ქვეყნიდან ჩამოტანილი პარკები, ასობით ჯიშად დახარისხებული


    - გამომშრალი პეპლები და ჭიის განვითარების ყველა სტადია


    - შეღებილი აბრეშუმის ნიმუშები, საღებავები და ქსოვილები


    - ხელით დაწერილი, გამქრალი მელნით შესრულებული ეტიკეტები რუსულ და ფრანგულ ენებზე


    - მუზეუმის საკუთარი ბიბლიოთეკა და ფოტოარქივი


    კოლექცია იმ დროს საერთაშორისო გამოფენებისთვის მზადდებოდა და მედლებიც მოიპოვა. დღეს დარბაზები ხშირად
    ცარიელია; თანამშრომლები ჩვეულებრივ თავად გატარებენ და უამბობენ. ვისაც ძველი ვიტრინები, კალიგრაფია
    და მეცნიერების ისტორია აინტერესებს, ეს თბილისში ერთ-ერთი ყველაზე უჩვეულო საათია.


    აბრეშუმის მოშენება საქართველოში მუზეუმზე ბევრად ძველია: აღმოსავლეთ და დასავლეთ საქართველოში აბრეშუმის
    ჭიას საუკუნეების განმავლობაში აშენებდნენ, საბჭოთა პერიოდში კი ეს დარგი ცალკე ინდუსტრიად იქცა. 1990-იან
    წლებში ის თითქმის მთლიანად გაქრა. მუზეუმი, შესაბამისად, არა მხოლოდ კოლექციაა, არამედ იმ ეკონომიკის
    უკანასკნელი შემორჩენილი კვალი, რომელიც ქვეყანას ას წელზე მეტ ხანს კვებავდა.
  tip: >-
    ერთი საათი საკმარისია. მუზეუმი პატარაა და მშვიდი; ჯგუფები არ არიან. განათება მკრთალია — ფოტოსთვის
    შუადღე სჯობს. ორშაბათს დაკეტილია, ტექნიკური სამუშაოების გამო ზოგჯერ ცალკეული დარბაზიც. ინგლისურენოვანი
    ახსნა შეზღუდულია, თუმცა თანამშრომლები დახმარებას ცდილობენ. შენობაში ლიფტი არ არის და შესასვლელთან
    საფეხურებია. ტუალეტი შიგნით არის; კაფე — არა, უახლოესი აღმაშენებლის გამზირზეა.
  route: >-
    ცენტრიდან აღმაშენებლის ან წერეთლის გამზირით სადგურის მოედნის მიმართულებით — 5 კმ, 15 წუთი. მუზეუმი
    გიორგი წაბაძის ქუჩაზეა, მშვიდ სამეზობლოში, ოდნავ განზე მთავარი მაგისტრალიდან. ქუჩაში უფასო ადგილები
    ჩვეულებრივ მოიძებნება დილით, თუმცა ვიწროა და ორმხრივი; შუადღისას სჯობს სავაჭრო ცენტრ „თბილისი ცენტრალის"
    ანაზღაურებადი პარკინგი და 8-10 წუთის სიარული. მარჯანიშვილის მეტროსადგურიდან 10-12 წუთია ფეხით. ეკონომკლასის
    მანქანა საკმარისია.
en:
  name: State Silk Museum
  short: A museum founded in 1887 that has barely changed — the cases, the labels and the collection are
    all original.
  body: >-
    **This is less a museum about silk than a surviving specimen of a nineteenth-century museum.** It
    was founded in 1887 alongside the Caucasian Sericulture Station on the initiative of Nikolai Shavrov,
    and the building was completed in 1892 to a design by Alexander Szymkiewicz, the architect who also
    gave Tbilisi the Rustaveli Theatre.


    The purpose was practical. Peasants across the southern provinces of the empire had to be taught how
    to raise silkworms, recognise their diseases and handle cocoons properly. So this is a teaching collection,
    not a display of finished luxury.


    What makes it remarkable is that almost nothing has been modernised. The halls still hold their original
    oak-and-glass cases, and inside them:


    - cocoons gathered from silk-producing countries around the world, sorted into hundreds of varieties


    - dried moths and every stage of the worm's life cycle


    - dyed silk samples, pigments and woven fabrics


    - handwritten labels in faded ink, in Russian and French


    - the station's own library and photographic archive


    Much of the collection was prepared for the international exhibitions of the period and won medals
    at them. Today the rooms are often empty and the staff will usually walk you round themselves and
    explain what you are looking at. For anyone interested in old display cases, copperplate handwriting
    or the history of science, this is one of the more unusual hours available in Tbilisi.


    Silk in Georgia is far older than the museum. Silkworms were raised for centuries in both the east
    and the west of the country, and under Soviet rule the trade was scaled up into an industry with its
    own factories and research institutes. In the 1990s it collapsed almost entirely. The museum is therefore
    not only a collection but the last coherent trace of an economy that fed parts of the country for
    well over a century, and the staff are quite clear-eyed about that.
  tip: >-
    An hour is enough. The museum is small and quiet, and coach groups do not come here. The lighting
    is dim, so midday is better for photographs. It closes on Mondays, and individual rooms are sometimes
    shut for conservation work. English labelling is limited, though the staff make an effort. There is
    no lift and there are steps at the entrance. Toilets are inside; there is no cafe, and the nearest
    are on Agmashenebeli Avenue.
  route: >-
    From the centre take Agmashenebeli or Tsereteli Avenue towards Station Square — 5 km, about fifteen
    minutes. The museum is on Giorgi Tsabadze Street, in a quiet neighbourhood slightly off the main road.
    Free street spaces can usually be found in the morning, though the street is narrow and two-way; later
    in the day it is better to use the paid car park at the Tbilisi Central complex and walk eight to
    ten minutes. Marjanishvili metro station is ten to twelve minutes away on foot. An economy car is
    enough.
ru:
  name: Государственный музей шёлка
  short: 'Музей, основанный в 1887 году и почти не изменившийся: витрины, этикетки и коллекция подлинные.'
  body: >-
    **Это не столько музей о шёлке, сколько уцелевший образец музея XIX века.** Он основан в 1887 году
    при Кавказской шелководственной станции по инициативе Николая Шаврова, а здание завершено в 1892-м
    по проекту Александра Шимкевича — того же архитектора, которому Тбилиси обязан зданием театра Руставели.


    Задача была прикладной: крестьян южных губерний империи надо было научить разводить шелкопряда, распознавать
    его болезни и правильно обрабатывать коконы. Поэтому здесь учебное собрание, а не выставка готовой
    роскоши.


    Замечательно то, что почти ничего не осовременили. В залах стоят подлинные витрины из дуба и стекла,
    а в них:


    - коконы, привезённые из шелководческих стран всего мира и разложенные по сотням разновидностей


    - высушенные бабочки и все стадии развития гусеницы


    - образцы крашеного шёлка, красители и ткани


    - рукописные этикетки выцветшими чернилами, по-русски и по-французски


    - собственная библиотека станции и фотоархив


    Значительная часть коллекции готовилась для международных выставок того времени и получала на них
    медали. Сегодня залы часто пусты, и сотрудники обычно сами проводят вас и объясняют, на что вы смотрите.
    Для тех, кому интересны старые витрины, каллиграфия и история науки, это один из самых необычных часов
    в Тбилиси.


    Шелководство в Грузии намного старше музея. Шелкопряда веками разводили и на востоке, и на западе
    страны, а в советское время ремесло развернули в отрасль с собственными фабриками и институтами. В
    1990-х она рухнула почти полностью. Поэтому музей — не только собрание, но и последний связный след
    экономики, кормившей целые районы больше века, и сотрудники говорят об этом без иллюзий.
  tip: >-
    Часа достаточно. Музей маленький и тихий, автобусные группы сюда не заезжают. Освещение приглушённое,
    для фотографий лучше середина дня. По понедельникам закрыт, отдельные залы иногда закрывают на реставрационные
    работы. Английских подписей мало, но сотрудники стараются помочь. Лифта нет, у входа ступени. Туалет
    внутри есть, кафе нет — ближайшие на проспекте Агмашенебели.
  route: >-
    Из центра по проспекту Агмашенебели или Церетели в сторону Привокзальной площади — 5 км, около пятнадцати
    минут. Музей на улице Гиорги Цабадзе, в тихом квартале чуть в стороне от магистрали. Утром на улице
    обычно находятся бесплатные места, хотя она узкая и двусторонняя; днём лучше встать на платной парковке
    комплекса «Тбилиси Централь» и пройти восемь-десять минут. От станции метро «Марджанишвили» идти десять-двенадцать
    минут. Достаточно машины эконом-класса.
fa:
  name: موزهٔ دولتی ابریشم
  short: موزه‌ای بنیادگذاشته در ۱۸۸۷ که تقریباً دست‌نخورده مانده؛ ویترین‌ها و برچسب‌ها و مجموعه همه اصل‌اند.
  body: >-
    **این کمتر موزه‌ای دربارهٔ ابریشم است و بیشتر نمونه‌ای بازمانده از یک موزهٔ سدهٔ نوزدهم.** در ۱۸۸۷
    در کنار ایستگاه نوغانداری قفقاز و به ابتکار نیکلای شاوروف بنیاد گرفت، و ساختمان در ۱۸۹۲ به طرح الکساندر
    شیمکیویچ کامل شد؛ همان معماری که تئاتر روستاولی را نیز به تفلیس داد.


    هدف کاربردی بود. کشاورزان استان‌های جنوبی امپراتوری باید می‌آموختند چگونه کرم ابریشم پرورش دهند، بیماری‌هایش
    را بشناسند و پیله را درست عمل آورند. پس این مجموعه‌ای آموزشی است نه نمایش کالای تجملی.


    آنچه این جا را کم‌نظیر می‌کند آن است که تقریباً هیچ‌چیز نوسازی نشده. تالارها هنوز ویترین‌های اصلی
    از چوب بلوط و شیشه را در خود دارند و درونشان:


    - پیله‌هایی گردآمده از کشورهای ابریشم‌خیز جهان، در صدها گونه دسته‌بندی شده


    - پروانه‌های خشک‌شده و همهٔ مرحله‌های زندگی کرم


    - نمونه‌های ابریشم رنگ‌شده، رنگدانه‌ها و پارچه‌های بافته


    - برچسب‌های دست‌نویس با مرکب رنگ‌پریده، به روسی و فرانسه


    - کتابخانه و آرشیو عکس خود ایستگاه


    بخش بزرگی از مجموعه برای نمایشگاه‌های بین‌المللی آن دوره آماده شد و در آنها مدال گرفت. امروز تالارها
    اغلب خالی‌اند و کارکنان معمولاً خودشان شما را می‌گردانند و توضیح می‌دهند. برای هر کس که به ویترین‌های
    کهنه، خط زیبا یا تاریخ علم علاقه دارد، این یکی از غیرمعمول‌ترین ساعت‌های تفلیس است.


    ابریشم در گرجستان بسیار کهن‌تر از این موزه است. کرم ابریشم قرن‌ها در شرق و غرب کشور پرورش داده می‌شد
    و در دورهٔ شوروی این پیشه به صنعتی با کارخانه‌ها و پژوهشکده‌های خود بدل شد. در دههٔ ۱۹۹۰ این صنعت
    تقریباً یکسره فروپاشید. پس موزه تنها یک مجموعه نیست، بلکه آخرین نشانهٔ منسجم از اقتصادی است که بیش
    از یک قرن بخش‌هایی از کشور را سیر کرد، و کارکنان دربارهٔ این نکته کاملاً روشن سخن می‌گویند.
  tip: >-
    یک ساعت کافی است. موزه کوچک و آرام است و گروه‌های اتوبوسی به آن نمی‌آیند. نور کم است، پس نیمروز برای
    عکاسی بهتر است. دوشنبه‌ها تعطیل است و گاهی تالاری برای کار مرمت بسته می‌شود. توضیح انگلیسی محدود است،
    هرچند کارکنان تلاش می‌کنند. آسانسور ندارد و ورودی چند پله دارد. سرویس بهداشتی در داخل هست؛ کافه نه،
    و نزدیک‌ترین آنها در خیابان آغماشنبلی است.
  route: >-
    از مرکز شهر خیابان آغماشنبلی یا تسرتلی را به سوی میدان ایستگاه بگیرید؛ ۵ کیلومتر، حدود پانزده دقیقه.
    موزه در خیابان گیورگی تسابادزه است، در محله‌ای آرام کمی دورتر از مسیر اصلی. صبح‌ها معمولاً جای رایگان
    در خیابان پیدا می‌شود، هرچند کوچه باریک و دوطرفه است؛ بعدازظهر بهتر است در پارکینگ پولی مجتمع تفلیس
    سنترال بگذارید و هشت تا ده دقیقه پیاده بیایید. از ایستگاه مترو مارجانیشویلی ده تا دوازده دقیقه پیاده
    است. خودروی اقتصادی کافی است.
he:
  name: מוזיאון המשי הממלכתי
  short: מוזיאון שנוסד ב-1887 וכמעט לא השתנה — הוויטרינות, התוויות והאוסף כולם מקוריים.
  body: >-
    **זהו פחות מוזיאון על משי ויותר דגם ששרד של מוזיאון מן המאה ה-19.** הוא נוסד ב-1887 לצד תחנת גידול
    המשי הקווקזית ביוזמת ניקולאי שברוב, והבניין הושלם ב-1892 לפי תכנון אלכסנדר שימקייביץ', האדריכל שהעניק
    לטביליסי גם את בניין תיאטרון רוסתאוולי.


    המטרה הייתה מעשית. איכרים ברחבי המחוזות הדרומיים של האימפריה היו צריכים ללמוד לגדל תולעי משי, לזהות
    את מחלותיהן ולטפל בפקעות כראוי. לכן זהו אוסף לימודי ולא תצוגה של מותרות מוגמרים.


    מה שהופך אותו יוצא דופן הוא שכמעט דבר לא עודכן. באולמות עומדות עדיין הוויטרינות המקוריות מעץ אלון
    וזכוכית, ובתוכן:


    - פקעות שנאספו ממדינות המשי בכל העולם, ממוינות למאות זנים


    - פרפרים מיובשים וכל שלבי חייה של התולעת


    - דגימות משי צבוע, פיגמנטים ובדים ארוגים


    - תוויות בכתב יד בדיו דהויה, ברוסית ובצרפתית


    - הספרייה של התחנה וארכיון התצלומים שלה


    חלק גדול מן האוסף הוכן לתערוכות הבינלאומיות של התקופה וזכה בהן במדליות. היום החדרים ריקים לעתים קרובות,
    והצוות בדרך כלל מלווה אתכם בעצמו ומסביר על מה אתם מסתכלים. למי שמתעניין בוויטרינות ישנות, בכתב יד
    מהוקצע או בתולדות המדע, זו אחת השעות היוצאות דופן בטביליסי.


    המשי בגאורגיה עתיק בהרבה מן המוזיאון. תולעי משי גודלו במשך מאות שנים גם במזרח הארץ וגם במערבה, ובתקופה
    הסובייטית הורחבה המלאכה לתעשייה שלמה עם מפעלים ומכוני מחקר משלה. בשנות ה-90 היא קרסה כמעט לחלוטין.
    המוזיאון אינו רק אוסף אלא העקבה המסודרת האחרונה של כלכלה שפרנסה חלקים מן הארץ יותר ממאה שנים, והצוות
    מדבר על כך בלי אשליות.
  tip: >-
    שעה מספיקה. המוזיאון קטן ושקט, וקבוצות אוטובוס אינן מגיעות אליו. התאורה עמומה, ולכן שעות הצהריים טובות
    יותר לצילום. הוא סגור בימי שני, ולעתים נסגר חדר בודד לעבודות שימור. השילוט באנגלית מוגבל, אף שהצוות
    משתדל. אין מעלית ויש מדרגות בכניסה. יש שירותים בפנים; אין בית קפה, והקרובים ביותר בשדרות אגמשנבלי.
  route: >-
    מן המרכז סעו בשדרות אגמשנבלי או צרטלי לכיוון כיכר התחנה — 5 ק״מ, כחמש-עשרה דקות. המוזיאון ברחוב גיאורגי
    צאבאדזה, בשכונה שקטה מעט מן הצד של הכביש הראשי. בבוקר אפשר בדרך כלל למצוא מקומות חינם ברחוב, אף שהוא
    צר ודו-סטרי; מאוחר יותר עדיף להשתמש בחניון בתשלום במתחם טביליסי סנטרל וללכת שמונה עד עשר דקות. תחנת
    הרכבת התחתית מרג'נישווילי במרחק עשר עד שתים-עשרה דקות הליכה. רכב חסכוני מספיק.
ar:
  name: متحف الحرير الحكومي
  short: متحف أُسس عام 1887 ولم يكد يتغير؛ الخزائن والبطاقات والمجموعة كلها أصلية.
  body: >-
    **هذا ليس متحفاً عن الحرير بقدر ما هو نموذج باقٍ لمتحف من القرن التاسع عشر.** أُسس عام 1887 إلى جانب
    محطة تربية دود القز القوقازية بمبادرة من نيكولاي شافروف، واكتمل المبنى عام 1892 بتصميم ألكسندر شيمكيفيتش،
    المعماري نفسه الذي أعطى تبليسي مبنى مسرح روستافيلي.


    وكان الغرض عملياً. فقد لزم تعليم الفلاحين في الولايات الجنوبية من الإمبراطورية كيف يربّون دود القز
    ويميّزون أمراضه ويعالجون الشرانق على الوجه الصحيح. فهذه إذاً مجموعة تعليمية لا عرضاً لبضاعة فاخرة.


    والمدهش أن شيئاً لم يُحدّث تقريباً. فما زالت القاعات تحتفظ بخزائنها الأصلية من خشب البلوط والزجاج،
    وفيها:


    - شرانق جُمعت من بلدان الحرير في العالم كله، مصنّفة في مئات الأصناف


    - فراشات مجففة وكل أطوار حياة الدودة


    - عينات من الحرير المصبوغ والأصبغة والأقمشة المنسوجة


    - بطاقات مكتوبة باليد بحبر باهت، بالروسية والفرنسية


    - مكتبة المحطة نفسها وأرشيفها المصور


    وقد أُعدّ جزء كبير من المجموعة لمعارض تلك الحقبة الدولية ونال فيها ميداليات. واليوم تكون القاعات خالية
    غالباً، ويصحبك العاملون بأنفسهم ويشرحون لك ما تنظر إليه. ولمن يعنيه الخزائن القديمة والخط المتقن وتاريخ
    العلم، فهذه من أغرب ساعات تبليسي وأمتعها.


    الحرير في جورجيا أقدم بكثير من المتحف. فقد رُبّي دود القز قروناً في شرق البلاد وغربها، وفي العهد السوفييتي
    توسعت الحرفة إلى صناعة لها مصانعها ومعاهدها البحثية. وفي التسعينيات انهارت هذه الصناعة انهياراً شبه
    تام. ولذلك ليس المتحف مجرد مجموعة، بل آخر أثر متماسك لاقتصاد أطعم مناطق من البلاد أكثر من قرن، والعاملون
    فيه يتحدثون عن ذلك بلا أوهام.
  tip: >-
    ساعة تكفي. المتحف صغير هادئ ولا تصله مجموعات الحافلات. والإضاءة خافتة، فالظهيرة أفضل للتصوير. ويغلق
    يوم الاثنين، وتُغلق أحياناً قاعة بعينها لأعمال الصيانة. والشرح بالإنجليزية محدود وإن كان العاملون
    يبذلون جهدهم. ولا مصعد في المبنى وفي المدخل درجات. ودورات المياه في الداخل، ولا مقهى فيه، وأقربها
    في جادة أغماشينيبيلي.
  route: >-
    من وسط المدينة اسلك جادة أغماشينيبيلي أو تسيريتيلي نحو ميدان المحطة؛ 5 كم ونحو خمس عشرة دقيقة. والمتحف
    في شارع غيورغي تسابادزه، في حي هادئ منزوٍ قليلاً عن الطريق الرئيسي. وتُوجد أماكن مجانية في الشارع
    صباحاً عادة، وإن كان ضيقاً وباتجاهين؛ وبعد ذلك يُستحسن استخدام الموقف المدفوع في مجمع تبليسي سنترال
    والمشي ثماني إلى عشر دقائق. ومحطة مترو مارجانيشفيلي على بعد عشر إلى اثنتي عشرة دقيقة سيراً. وسيارة
    اقتصادية تكفي.
