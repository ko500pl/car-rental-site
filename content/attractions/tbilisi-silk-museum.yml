ka:
  name: აბრეშუმის სახელმწიფო მუზეუმი
  short: >-
    1887 წელს დაარსებული მუზეუმი: პარკების ათასობით ჯიში 1890-იანი წლების ვიტრინებში, აგურის შენობაში,
    რომლის კედლებზეც ჭია და პეპლებია ამოკვეთილი.
  body: >-
    **ამ აგურის შენობის ვესტიბიულში აბრეშუმის ჭია თავად არქიტექტურაშია ამოკვეთილი: პეპლებთან და თუთის
    ფოთლებთან ერთად კედლებს, თაღებსა და კაპიტელებს მიცოცავს.**


    აქ კავკასიის მეაბრეშუმეობის სადგურის გული ძგერდა. სადგური 1887 წელს ბიოლოგმა ნიკოლაი შავროვმა ევროპული
    ნიმუშით დააარსა, მისი საქმე კი სავსებით პრაქტიკული გახლდათ: ლუი პასტერის მეთოდით აბრეშუმის ჭიის თესლის
    ჯანმრთელობა შეემოწმებინა და მეაბრეშუმეობა და მეფუტკრეობა მთელ კავკასიაში გაევრცელებინა. მუშტაიდის
    ბაღში სადგურს ოცდასამი შენობა ჰქონდა; დღემდე ორმა მოაღწია და ეს მათ შორის მთავარია. ის 1890–1892 წლებში
    ააგეს ალექსანდრ შიმკევიჩის პროექტით — პოლონური წარმოშობის თბილისელი არქიტექტორისა, რომელმაც რუსთაველის
    თეატრის შენობაც დააპროექტა და ამ მუზეუმის ვიტრინებიც თავად დახაზა.


    ეს ვიტრინები დღესაც ადგილზეა, მუზეუმი და ბიბლიოთეკაც არსებითად უცვლელად შემორჩა. მათში ინახება პარკის
    ხუთ ათასამდე სახეობა და ჯიში, ჭიის განვითარების ყველა სტადია, XIX საუკუნის ბუნებრივი და ქიმიური საღებავები,
    ძაფის კონები, ქსოვილები, თესლის გადასატანი 250 მუყაოს ყუთი და მინის ფირფიტებზე აღბეჭდილი ფოტოები —
    სულ დაახლოებით 40 000 ნივთი ორმოცდაათი ქვეყნიდან.


    მუზეუმი კინაღამ გაქრა. 1981 წელს შენობა მეზობელ „დინამოს“ სტადიონს გადასცეს და კოლექციის ბედი ბეწვზე
    ეკიდა, სანამ 1986–88 წლებში ირინე ჩოთორლიშვილის მეთაურობით წამოწყებულმა ბრძოლამ ის არ გადაარჩინა;
    2006 წელს დაწესებულებამ სახელმწიფო მუზეუმის სტატუსი მიიღო. 2020 წელს დაწყებულმა ოთხწლიანმა რესტავრაციამ
    შენობა გაამაგრა, ლიფტი დაამატა, მივიწყებული ნახევარსარდაფი კვლავ აამოქმედა და კედლისა და ჭერის მხატვრობა
    გამოავლინა.


    ცოტა მუზეუმი თუ ცხოვრობს დღემდე იმავე დარბაზებსა და ვიტრინებში, რომლებიც მისთვის 1890-იან წლებში შეიქმნა.
    ეს სწორედ ასეთია — და პარკებს შორის გატარებული ერთი საათის შემდეგ თავად შენობას აღიქვამთ მის საუკეთესო
    ექსპონატად.
  tip: >-
    ღიაა სამშაბათიდან შაბათამდე, 11:00–18:00; კვირას და ორშაბათს დაკეტილია. ბილეთი 12 ლარი ღირს, სტუდენტებისა
    და პენსიონერებისთვის — 5 ლარი, ყოველი თვის პირველ ოთხშაბათს კი შესვლა ყველასთვის უფასოა. გიდის მომსახურება
    ბილეთის გარდა 40 ლარია და ქართულ, ინგლისურ, რუსულ ან ფრანგულ ენებზეა ხელმისაწვდომი — დაჯავშნეთ სულ
    მცირე ორი დღით ადრე (+995 322 340 963). მუზეუმი ეტლით მოსარგებლეთათვის ადაპტირებულია, შენობის უკანა
    მხარეს ლიფტია. ერთი საათი საკმარისია; მერე გვერდით, მუშტაიდის ბაღში გაისეირნეთ — იქ ძელქვის ხეივანია
    და 1935 წელს გახსნილი, მსოფლიოში ერთ-ერთი პირველი საბავშვო რკინიგზა.
  route: >-
    თავისუფლების მოედნიდან მუზეუმამდე დაახლოებით 5 კილომეტრი და თხუთმეტი წუთია. გადადით მტკვრის მარცხენა
    სანაპიროზე, აღმაშენებლის გამზირით ჩრდილოეთისკენ წადით და წერეთლის გამზირზე გააგრძელეთ; მუზეუმი გიორგი
    წაბაძის ქუჩის №6-შია, „დინამო არენასა“ და მუშტაიდის ბაღს შორის. გვერდითი ქუჩა მშვიდია, მაგრამ ვიწრო
    — დილით ადგილს ჩვეულებრივ იპოვით, მოგვიანებით კი მიმდებარე ქუჩებში მოძებნეთ. საფეხბურთო მატჩისა თუ
    კონცერტის დღეს „დინამო არენის“ მიდამოებში მანქანით ნუ წახვალთ: წერეთლის მეტროსადგური ათი წუთის სავალზეა.
    გზა მთლიანად ასფალტიანია, ეკონომკლასიც საკმარისია.
en:
  name: State Silk Museum
  short: >-
    Founded in 1887: thousands of cocoon varieties in their original 1890s cases, inside a red-brick hall
    carved with silkworms and moths.
  body: >-
    **In the entrance hall of this red-brick building the silkworm is carved into the architecture itself,
    crawling with moths and mulberry leaves across walls, arches and capitals.**


    This was the heart of the Caucasian Sericulture Station, founded in 1887 by the biologist Nikolay
    Shavrov on a European model. Its work was practical: to check silkworm eggs for disease by Louis Pasteur's
    method and to spread silk-raising and bee-keeping across the Caucasus. The station once had twenty-three
    buildings in Mushtaid Garden; only two survive, and this is the one that matters. It went up in 1890–1892
    to designs by Aleksander Szymkiewicz, the Tbilisi architect of Polish descent who also designed the
    Rustaveli Theatre, and who drew the display cases too.


    Those cases still stand, and the museum and its library have come down essentially unchanged. Inside
    lie up to five thousand species and varieties of cocoon, every stage of the worm's life cycle, nineteenth-century
    natural and chemical dyes, skeins, textiles, 250 cardboard boxes once used to carry silkworm eggs,
    and photographs on glass plates: some 40,000 objects from fifty countries.


    It very nearly vanished. In 1981 the building was handed to the Dinamo stadium next door, and the
    collection's survival hung in the balance until Irine Chotorlishvili led the fight to save it in 1986–88;
    in 2006 it became a state museum. A four-year restoration begun in 2020 reinforced the structure,
    added a lift, brought a forgotten semi-basement back into use and uncovered wall and ceiling paintings.


    Few museums still live in the rooms and cases made for them in the 1890s. This one does, and after
    an hour among the cocoons you begin to read the building as its finest exhibit.
  tip: >-
    Open Tuesday to Saturday, 11:00–18:00; closed on Sunday and Monday. Tickets cost 12 GEL, or 5 GEL
    for students and pensioners, and entry is free for everyone on the first Wednesday of each month.
    A guided tour costs 40 GEL on top of the ticket and runs in Georgian, English, Russian or French;
    book at least two days ahead (+995 322 340 963). The museum is wheelchair accessible, with a lift
    at the back. Allow an hour, then walk into Mushtaid Garden next door, with its alley of zelkova trees
    and one of the world's first children's railways, opened in 1935.
  route: >-
    From Freedom Square the museum is about 5 km and fifteen minutes by car. Cross to the left bank, follow
    Aghmashenebeli Avenue north and carry on along Tsereteli Avenue; the museum stands at 6 Giorgi Tsabadze
    Street, between Dinamo Arena and Mushtaid Garden. The side street is quiet but narrow: in the morning
    you can usually find a space, later in the day try the surrounding streets. On match or concert days
    at Dinamo Arena, leave the car behind; Tsereteli metro station is a ten-minute walk away. Asphalt
    throughout, and an economy car is plenty.
ru:
  name: Государственный музей шёлка
  short: >-
    Основан в 1887 году: тысячи разновидностей коконов в подлинных витринах 1890-х, в краснокирпичном
    зале с резными шелкопрядами и бабочками.
  body: >-
    **В вестибюле этого краснокирпичного здания шелкопряд вплетён в саму архитектуру: вместе с бабочками
    и листьями шелковицы он ползёт по стенам, аркам и капителям.**


    Здесь было сердце Кавказской шелководственной станции, основанной в 1887 году биологом Николаем Шавровым
    по европейскому образцу. Её работа была сугубо практической: проверять грену — яйца шелкопряда — на
    болезни по методу Луи Пастера и распространять шелководство и пчеловодство по всему Кавказу. Когда-то
    станции принадлежали двадцать три здания в саду Муштаид; уцелели лишь два, и это — главное из них.
    Его возвели в 1890–1892 годах по проекту Александра Шимкевича, тбилисского архитектора польского происхождения,
    автора и театра Руставели; витрины он тоже спроектировал сам.


    Эти витрины стоят до сих пор, а музей и его библиотека дошли до нас почти без изменений. Внутри —
    до пяти тысяч видов и разновидностей коконов, все стадии жизненного цикла шелкопряда, натуральные
    и химические красители XIX века, мотки нити, ткани, 250 картонных коробок, в которых когда-то перевозили
    грену, и фотографии на стеклянных пластинах — около 40 000 предметов из пятидесяти стран.


    Музей едва не исчез. В 1981 году здание передали соседнему стадиону «Динамо», и судьба коллекции висела
    на волоске, пока Ирине Чоторлишвили не возглавила борьбу за её спасение в 1986–1988 годах; в 2006-м
    музей стал государственным. Четырёхлетняя реставрация, начатая в 2020 году, укрепила конструкции,
    добавила лифт, вернула к жизни забытый полуподвал и открыла настенные и потолочные росписи.


    Немногие музеи и сегодня живут в залах и витринах, созданных для них в 1890-х. Этот — живёт, и после
    часа среди коконов начинаешь понимать, что лучший его экспонат — само здание.
  tip: >-
    Открыт со вторника по субботу, 11:00–18:00; в воскресенье и понедельник закрыт. Билет стоит 12 лари,
    для студентов и пенсионеров — 5 лари, а в первую среду каждого месяца вход для всех бесплатный. Экскурсия
    обойдётся в 40 лари сверх билета и проводится на грузинском, английском, русском или французском;
    записывайтесь минимум за два дня (+995 322 340 963). Музей доступен для инвалидных колясок, лифт —
    в задней части здания. Заложите час, а потом загляните в соседний сад Муштаид с его аллеей дзельквы
    и одной из первых в мире детских железных дорог, открытой в 1935 году.
  route: >-
    От площади Свободы до музея около 5 км, пятнадцать минут на машине. Переезжайте на левый берег, поезжайте
    на север по проспекту Агмашенебели и дальше по проспекту Церетели; музей стоит на улице Гиорги Цабадзе,
    6, между «Динамо Ареной» и садом Муштаид. Переулок тихий, но узкий: утром место обычно находится,
    позже попробуйте соседние улицы. В дни матчей и концертов на «Динамо Арене» машину лучше оставить:
    станция метро «Церетели» в десяти минутах пешком. Асфальт на всём пути, машины эконом-класса вполне
    достаточно.
fa:
  name: موزهٔ دولتی ابریشم
  short: >-
    بنیادشده در ۱۸۸۷: هزاران گونهٔ پیله در ویترین‌های اصلی دههٔ ۱۸۹۰، درون تالاری از آجر سرخ که کرم ابریشم
    و پروانه بر آن کنده‌کاری شده است.
  body: >-
    **در سرسرای ورودی این بنای آجری سرخ، کرم ابریشم در خودِ معماری کنده شده است: همراه با پروانه‌ها و
    برگ‌های توت، بر دیوارها و طاق‌ها و سرستون‌ها می‌خزد.**


    این‌جا قلب ایستگاه نوغان‌داری قفقاز بود که نیکولای شاوروفِ زیست‌شناس در ۱۸۸۷ به الگوی اروپایی بنیاد
    نهاد. کارش عملی بود: تخم کرم ابریشم را به روش لویی پاستور از نظر بیماری بیازماید و پرورش ابریشم و
    زنبورداری را در سراسر قفقاز بگستراند. این ایستگاه روزگاری بیست‌وسه ساختمان در باغ موشتائید داشت؛ تنها
    دو تا مانده‌اند و این یکی همان است که اهمیت دارد. در سال‌های ۱۸۹۰ تا ۱۸۹۲ به طرح الکساندر شیمکیه‌ویچ
    ساخته شد، معمار لهستانی‌تبار تفلیسی که تئاتر روستاولی را هم طراحی کرد و طرح ویترین‌ها را نیز خودش
    کشید.


    آن ویترین‌ها هنوز سر پا هستند، و موزه و کتابخانه‌اش تقریباً بی‌تغییر به ما رسیده‌اند. درونشان تا پنج
    هزار گونه و رقم پیله نگه‌داری می‌شود، همهٔ مراحل چرخهٔ زندگی کرم، رنگ‌های طبیعی و شیمیایی سدهٔ نوزدهم،
    کلاف‌ها، پارچه‌ها، ۲۵۰ جعبهٔ مقوایی که زمانی تخم کرم ابریشم را در آن‌ها جابه‌جا می‌کردند، و عکس‌هایی
    بر صفحه‌های شیشه‌ای: روی‌هم حدود ۴۰ هزار شیء از پنجاه کشور.


    چیزی نمانده بود که از میان برود. در ۱۹۸۱ ساختمان به ورزشگاه دینامو در همسایگی‌اش واگذار شد و بقای
    مجموعه به مویی بند بود، تا آنکه ایرینه چوتورلیشویلی در سال‌های ۱۹۸۶ تا ۱۹۸۸ مبارزه برای نجاتش را رهبری
    کرد؛ در ۲۰۰۶ به موزه‌ای دولتی بدل شد. مرمتی چهارساله که در ۲۰۲۰ آغاز شد سازه را استوار کرد، آسانسوری
    افزود، نیم‌زیرزمینی فراموش‌شده را دوباره به کار گرفت و نقاشی‌های دیواری و سقفی را آشکار کرد.


    کمتر موزه‌ای هنوز در همان تالارها و ویترین‌هایی زندگی می‌کند که در دههٔ ۱۸۹۰ برایش ساخته شدند. این
    یکی زندگی می‌کند، و پس از یک ساعت در میان پیله‌ها، کم‌کم خود بنا را زیباترین شیء گنجینه‌اش می‌بینید.
  tip: >-
    سه‌شنبه تا شنبه، ساعت ۱۱:۰۰ تا ۱۸:۰۰ باز است؛ یکشنبه و دوشنبه تعطیل است. بلیت ۱۲ لاری است و برای دانشجویان
    و بازنشستگان ۵ لاری، و نخستین چهارشنبهٔ هر ماه ورود برای همه رایگان است. تور راهنمادار ۴۰ لاری افزون
    بر بلیت هزینه دارد و به زبان‌های گرجی، انگلیسی، روسی یا فرانسوی برگزار می‌شود؛ دست‌کم دو روز پیش‌تر
    رزرو کنید (‎+۹۹۵ ۳۲۲ ۳۴۰ ۹۶۳). موزه برای ویلچر دسترس‌پذیر است و آسانسور در پشت ساختمان قرار دارد.
    یک ساعت وقت بگذارید، سپس به باغ موشتائید در همسایگی بروید، با خیابان درختان آزاد (زلکوا) و یکی از
    نخستین راه‌آهن‌های کودکان در جهان که در ۱۹۳۵ گشایش یافت.
  route: >-
    موزه حدود ۵ کیلومتر و پانزده دقیقه رانندگی با میدان آزادی فاصله دارد. به کرانهٔ چپ بروید، خیابان آغماشنبلی
    را به سوی شمال دنبال کنید و در امتداد خیابان تسرتلی ادامه دهید؛ موزه در شمارهٔ ۶ خیابان گیورگی تسابادزه،
    میان دینامو آرنا و باغ موشتائید است. این خیابان فرعی آرام اما باریک است: صبح‌ها معمولاً جایی پیدا
    می‌شود؛ دیرتر در طول روز خیابان‌های اطراف را امتحان کنید. در روزهای مسابقه یا کنسرت در دینامو آرنا
    خودرو را کنار بگذارید؛ ایستگاه متروی تسرتلی ده دقیقه پیاده فاصله دارد. تمام مسیر آسفالت است و خودروی
    اقتصادی کاملاً کافی است.
he:
  name: מוזיאון המשי הממלכתי
  short: >-
    נוסד ב-1887: אלפי זנים של פקעות משי בוויטרינות המקוריות משנות ה-90 של המאה ה-19, באולם לבנים אדומות
    מגולף בתולעי משי ובעשים.
  body: >-
    **באולם הכניסה של בניין הלבנים האדומות הזה, תולעת המשי מגולפת לתוך האדריכלות עצמה: יחד עם עשים ועלי
    תות היא זוחלת על הקירות, הקשתות וכותרות העמודים.**


    כאן היה לבה של תחנת גידול המשי הקווקזית, שייסד ב-1887 הביולוג ניקולאי שברוב על פי מודל אירופי. עבודתה
    הייתה מעשית: לבדוק את ביצי תולעי המשי למחלות בשיטתו של לואי פסטר, ולהפיץ את גידול המשי ואת הכוורנות
    ברחבי הקווקז. פעם היו לתחנה עשרים ושלושה מבנים בגן מושטאיד; רק שניים שרדו, וזה החשוב שבהם. הוא הוקם
    ב-1890–1892 לפי תכנונו של אלכסנדר שימקביץ', אדריכל טביליסאי ממוצא פולני שתכנן גם את תיאטרון רוסתוולי,
    ושרטט במו ידיו גם את הוויטרינות.


    הוויטרינות האלה עומדות עד היום, והמוזיאון וספרייתו הגיעו אלינו כמעט ללא שינוי. בפנים שמורים עד חמשת
    אלפים מינים וזנים של פקעות, כל שלבי מחזור החיים של התולעת, צבעים טבעיים וכימיים מן המאה ה-19, גלילי
    חוט, אריגים, 250 קופסות קרטון ששימשו פעם להובלת ביצי תולעי משי, ותצלומים על לוחות זכוכית: כ-40,000
    פריטים מחמישים ארצות.


    הוא כמעט נעלם. ב-1981 נמסר הבניין לאצטדיון דינמו הסמוך, וגורל האוסף היה מונח על כף המאזניים עד שאירינה
    צ'וטורלישווילי הובילה את המאבק להצלתו ב-1986–1988; ב-2006 הוא הפך למוזיאון ממלכתי. שיקום בן ארבע שנים
    שהחל ב-2020 חיזק את המבנה, הוסיף מעלית, החזיר לשימוש קומת מרתף-למחצה שנשכחה, וחשף ציורי קיר ותקרה.


    מעטים המוזיאונים שעדיין חיים באולמות ובוויטרינות שנבנו עבורם בשנות ה-90 של המאה ה-19. זה עדיין חי
    בהם, ואחרי שעה בין הפקעות מתחילים לראות בבניין עצמו את המוצג היפה ביותר שלו.
  tip: >-
    פתוח משלישי עד שבת, 11:00–18:00; סגור בימי ראשון ושני. כרטיס עולה 12 לארי, או 5 לארי לסטודנטים ולפנסיונרים,
    וביום רביעי הראשון של כל חודש הכניסה חופשית לכולם. סיור מודרך עולה 40 לארי נוסף על הכרטיס ומתקיים
    בגאורגית, באנגלית, ברוסית או בצרפתית; הזמינו לפחות יומיים מראש (‎+995 322 340 963). המוזיאון נגיש
    לכיסאות גלגלים, עם מעלית בצדו האחורי. הקציבו שעה, ואחר כך צאו אל גן מושטאיד השכן, עם שדרת עצי הזלקובה
    שלו ואחת ממסילות הרכבת לילדים הראשונות בעולם, שנפתחה ב-1935.
  route: >-
    המוזיאון נמצא כ-5 ק״מ ורבע שעה נסיעה מכיכר החירות. עברו לגדה השמאלית, סעו צפונה בשדרת אגמשנבלי והמשיכו
    בשדרת צרתלי; המוזיאון נמצא ברחוב גיורגי צבדזה 6, בין דינמו ארנה לגן מושטאיד. רחוב הצד שקט אבל צר:
    בבוקר בדרך כלל מוצאים מקום, ומאוחר יותר ביום נסו ברחובות הסמוכים. בימי משחקים או הופעות בדינמו ארנה
    השאירו את הרכב מאחור; תחנת המטרו צרתלי במרחק עשר דקות הליכה. אספלט כל הדרך, ורכב חסכוני מספיק בהחלט.
ar:
  name: متحف الحرير الحكومي
  short: >-
    تأسس عام 1887: آلاف الأصناف من الشرانق في خزائن عرضها الأصلية من تسعينيات القرن التاسع عشر، داخل قاعة
    من الآجر الأحمر نُحتت عليها ديدان القز وفراشاتها.
  body: >-
    **في بهو مدخل هذا المبنى المشيّد من الآجر الأحمر، نُحتت دودة القز في صلب العمارة نفسها، فهي تزحف مع
    الفراشات وأوراق التوت على الجدران والأقواس وتيجان الأعمدة.**


    كان هذا قلب محطة القوقاز لتربية دودة القز، التي أسسها عالم الأحياء نيكولاي شافروف عام 1887 على نموذج
    أوروبي. وكان عملها عملياً: فحص بيوض دودة القز بحثاً عن الأمراض بطريقة لويس باستور، ونشر تربية القز
    وتربية النحل في أرجاء القوقاز. وكان للمحطة يوماً ثلاثة وعشرون مبنى في حديقة موشتائيد؛ لم يبقَ منها
    سوى اثنين، وهذا أهمهما. شُيّد بين عامي 1890 و1892 بتصميم ألكسندر شيمكيفيتش، المعماري التبليسي البولندي
    الأصل الذي صمم أيضاً مسرح روستافيلي، ورسم خزائن العرض بنفسه كذلك.


    وما زالت تلك الخزائن قائمة، وقد وصل المتحف ومكتبته إلينا دون تغيير يُذكر. وفي داخله ما يصل إلى خمسة
    آلاف نوع وصنف من الشرانق، وكل أطوار حياة الدودة، وأصباغ طبيعية وكيميائية من القرن التاسع عشر، وشِلل
    من الخيوط، ومنسوجات، و250 علبة من الورق المقوّى كانت تُنقل فيها بيوض دودة القز، وصور على ألواح زجاجية:
    نحو 40,000 قطعة من خمسين بلداً.


    وقد كاد يختفي. ففي عام 1981 سُلّم المبنى إلى ملعب دينامو المجاور، وظل مصير المجموعة معلقاً حتى قادت
    إيريني تشوتورليشفيلي معركة إنقاذها بين عامي 1986 و1988؛ وفي عام 2006 صار متحفاً حكومياً. وقد عزّز
    ترميمٌ استمر أربع سنوات وبدأ عام 2020 البنيةَ الإنشائية، وأضاف مصعداً، وأعاد إلى الاستخدام طابقاً
    شبه سفلي منسياً، وكشف عن رسوم جدارية وسقفية.


    قليلة هي المتاحف التي لا تزال تعيش في القاعات والخزائن التي صُنعت لها في تسعينيات القرن التاسع عشر.
    وهذا واحد منها، وبعد ساعة بين الشرانق تبدأ في رؤية المبنى نفسه أجملَ معروضاته.
  tip: >-
    يفتح من الثلاثاء إلى السبت، من 11:00 إلى 18:00، ويغلق يومي الأحد والاثنين. سعر التذكرة 12 لاري، و5
    لاري للطلاب والمتقاعدين، والدخول مجاني للجميع في أول أربعاء من كل شهر. وتكلف الجولة المصحوبة بمرشد
    40 لاري إضافة إلى التذكرة، وتُقدَّم بالجورجية أو الإنجليزية أو الروسية أو الفرنسية؛ احجز قبل يومين
    على الأقل (‎+995 322 340 963). والمتحف مهيأ للكراسي المتحركة، مع مصعد في الجهة الخلفية. خصّص ساعة،
    ثم ادخل حديقة موشتائيد المجاورة بممرها المظلل بأشجار الزلكوفا وبواحدة من أولى سكك حديد الأطفال في
    العالم، افتُتحت عام 1935.
  route: >-
    يبعد المتحف عن ميدان الحرية نحو 5 كم، أي خمس عشرة دقيقة بالسيارة. اعبر إلى الضفة اليسرى، واتبع جادة
    أغماشينيبيلي شمالاً، ثم تابع على جادة تسيريتيلي؛ يقع المتحف في 6 شارع غيورغي تسابادزه، بين دينامو
    أرينا وحديقة موشتائيد. الشارع الجانبي هادئ لكنه ضيق: في الصباح تجد مكاناً عادة، وفي وقت لاحق من النهار
    جرّب الشوارع المحيطة. وفي أيام المباريات أو الحفلات في دينامو أرينا اترك السيارة جانباً، فمحطة مترو
    تسيريتيلي على بعد عشر دقائق سيراً. الطريق مرصوف بالإسفلت كله، والسيارة الاقتصادية تكفي تماماً.
