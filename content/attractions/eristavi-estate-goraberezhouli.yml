ka:
  name: გორაბერეჟოულის ერისთავების სასახლე
  short: >-
    ოთხმეტრიანი რიყის ქვის გალავნის მიღმა — ერისთავების სახლი, იშვიათი ხეების პარკი და ქართული ჩაის ისტორიის
    ერთ-ერთი პირველი ფურცელი.
  body: >-
    **1864 წელს, სუფსის პირას, ამ გალავნიან მამულში, მიხეილ ერისთავმა საქართველოში პირველმა დაამუშავა
    ჩაი — პრიმიტიული წესით, მაგრამ ისეთი შედეგით, რომ ნაწარმი თბილისისა და პეტერბურგის სასოფლო-სამეურნეო
    გამოფენებზე გაიტანა.**


    ეს ამბავი 1840-იან წლებში დაიწყო, როცა აქ ოზურგეთიდან, მამია V გურიელის ბაღიდან ჩამოტანილი ჩაის ნერგები
    დარგეს. მიხეილის გარდაცვალების შემდეგ მეურნეობას მისი ვაჟი, ანდრია, ჩაუდგა სათავეში.


    გორაბერეჟოული გურიის ერისთავების საერისთაოს გული იყო; მათი მამულები მდინარე გუბაზეულიდან საწაბლიოს
    სერამდე იჭიმებოდა. ადგილობრივი გადმოცემით, ეს შტო XVII საუკუნის მიწურულიდან იწყება, როცა გურიის მთავარმა
    მამია III გურიელმა ერისთავობა და მიწები თავის სიძეს, გიორგი შარვაშიძეს, უბოძა. აქ ყველაზე ძველი სწორედ
    იმ ხანის ციხე-გალავანია: რიყის ქვით ნაგები, დაახლოებით ოთხი მეტრი სიმაღლისა და ჯამში 25 მეტრი სიგრძისა,
    სათოფურებით დაჭრილი კედლებით. შესასვლელი სამხრეთ-დასავლეთიდან იყო, ალაყაფის მარჯვნივ კი ღია ცის ქვეშ
    მოწყობილი მარანია.


    ეზოს ბოლოში ერისთავების სახლი დგას, რომელსაც ენციკლოპედია XIX საუკუნით ათარიღებს: თლილი ქვის საძირკველი,
    რიყის ქვის კედლები, სასტუმრო ოთახში ამოშენებული ბუხარი და მეორე სართულზე ხის ფართო აივანი, რომელსაც
    გვიანდელმა შეკეთებებმა პირვანდელი იერი დაუკარგა. შიგნით ჭადრაკის დაფიანი მასიური ხის მაგიდა და იშვიათი
    ვერცხლის სარკე დაგხვდებათ. მეგზურები სიამოვნებით მოგიყვებიან, რომ ბუხრის კვამლი საკვამურით კი არა,
    კედლებში დატანებული არხებით გადიოდა, რათა ომიანობისას კვამლის სვეტს სახლში სიცოცხლე არ გაეცა.


    სახლის ირგვლივ ერთჰექტრიანი დენდროლოგიური პარკია: გინკო, მარადმწვანე სეკვოია, წითელი ღვია და ხეები,
    რომლებსაც აქ „კანფეტის ხესა“ და „იაპონურ მარწყვის ხეს“ ეძახიან. ბაღი ნელა მოიარეთ. გალავანი მტრის
    შესაჩერებლად აიგო, ხეები თვალის გასახარად დარგეს, ჩაი კი, რომელიც აქ დაიწყო, მერე დასავლეთ საქართველოს
    მთა-გორებს მოედო.
  tip: >-
    პარკი, როგორც ამბობენ, ყოველდღე დაახლოებით 10:00-დან 18:00-მდეა ღია და შესვლა უფასოა; სახლს შემოწირულობის
    სანაცვლოდ გაჩვენებენ, ამიტომ შორი გზის გავლამდე წინასწარ გადაამოწმეთ. ადგილზე არც კაფეა, არც ტუალეტი:
    ისადილეთ ჩოხატაურში, რამდენიმე კილომეტრში. საღამოს დახრილი მზე რიყის ქვის გალავანს თბილ, ოქროსფერ
    ელფერს აძლევს. საუკეთესო დრო გაზაფხული და შემოდგომაა, გურიის ზაფხული კი ცხელი და ნოტიოა. ერთ მსუბუქ
    დღეში დაბლაციხის ნიკო მარის სახლ-მუზეუმიც ჩართეთ და სუფსის ზემო წელზე, გურის ტბაზე, ბანაობაც.
  route: >-
    თბილისიდან E60/S1-ით დასავლეთისკენ იარეთ: გორი, ხაშური, რიკოთის უღელტეხილი, ზესტაფონი, ქუთაისი და
    სამტრედია. სამტრედიაში S12-ზე გადადით ლანჩხუთის მიმართულებით; დაახლოებით 7 კილომეტრის შემდეგ, საჯავახოსთან,
    სამხრეთით, შ2-ზე გადაუხვიეთ, საიდანაც ჩოხატაურამდე დაახლოებით 18 კილომეტრია. გორაბერეჟოული ქალაქის
    ცენტრიდან რამდენიმე კილომეტრშია, სოფლის გზაზე. ჭიშკრამდე ბოლო მონაკვეთი შესაძლოა ხრეშიანი იყოს: მშრალ
    ამინდში ეკონომკლასის მანქანაც იოლად გაივლის, წვიმის შემდეგ კი შეიძლება ტალახიანი დაგხვდეთ. სულ დაახლოებით
    278 კმ და 4 საათი და 30 წუთი. საწვავი სამტრედიაში ან ჩოხატაურში ჩაასხით.
en:
  name: Eristavi Estate (Goraberezhouli)
  short: >-
    Behind a four-metre river-stone wall: the Eristavi family house, an arboretum of rare trees, and one
    of the first chapters of Georgian tea.
  body: >-
    **In 1864, on this walled estate above the Supsa, Mikheil Eristavi became the first in Georgia to
    process tea, by a primitive method but well enough to show it at exhibitions in Tbilisi and St Petersburg.**


    It had begun in the 1840s, when tea seedlings from Prince Mamia V Gurieli's garden in Ozurgeti were
    planted here. After Mikheil's death his son Andria took over the estate.


    Goraberezhouli was the heart of the Saeristavo, the domain of Guria's Eristavi family, which ran from
    the Gubazeuli river to the Satsablio ridge. Local accounts trace this branch to the end of the seventeenth
    century, when Mamia III Gurieli, ruler of Guria, granted the title and the land to his son-in-law
    Giorgi Sharvashidze. The oldest structure is the enclosure from those years: a wall of river cobbles
    some four metres high and 25 metres long in all, pierced with musket loopholes. The gate faced south-west,
    and just inside it, on the right, is a wine cellar open to the sky.


    At the back of the yard stands the family house, which the Georgian encyclopaedia dates to the nineteenth
    century. It has dressed-stone footings, river-stone walls, a fireplace in the guest room, and a broad
    wooden balcony upstairs, robbed of its charm by later repairs. Inside are a massive wooden table with
    a chequerboard and a rare silver mirror. Guides like to tell you that the hearth smoke escaped through
    channels in the walls, not a chimney, so no plume betrayed the house in wartime.


    Around the house lies a one-hectare arboretum of ginkgo, evergreen sequoia, red juniper and trees
    the locals call the "candy tree" and the "Japanese strawberry tree". Walk it slowly. The wall was
    raised against raiders, the trees were planted to please the eye, and the tea that began here went
    on to cover the hills of western Georgia.
  tip: >-
    The park is reported to open daily from about 10:00 to 18:00 and is free; the house is shown for a
    donation, so confirm before you make a long detour. There is no café or toilet on site: eat in Chokhatauri,
    a few kilometres away. Late-afternoon light turns the river-stone wall warm and gold. Spring and autumn
    are the kindest seasons here, while a Gurian summer is humid and hot. Combine it in one easy day with
    the Niko Marr house-museum in Dablatsikhe and a swim at Guris Tba further up the Supsa.
  route: >-
    From Tbilisi follow the E60/S1 west past Gori and Khashuri, through the Rikoti Pass and on past Zestaponi
    and Kutaisi to Samtredia. There switch to the S12 towards Lanchkhuti; after about 7 km, at Sajavakho,
    turn south onto the Sh2, which runs some 18 km to Chokhatauri. Goraberezhouli lies a few kilometres
    from the town centre on a village road. The last stretch to the gate may be gravel: fine for an economy
    car in dry weather, possibly muddy after rain. Allow about 278 km and 4 hours 30 minutes. Refuel in
    Samtredia or Chokhatauri.
ru:
  name: Усадьба Эристави (Горабережоули)
  short: >-
    За четырёхметровой стеной из речного булыжника — дом Эристави, дендропарк с редкими деревьями и одна
    из первых глав в истории грузинского чая.
  body: >-
    **В 1864 году в этой обнесённой стеной усадьбе над Супсой Михаил Эристави первым в Грузии переработал
    чай — кустарным способом, но настолько удачно, что показал его на выставках в Тбилиси и Петербурге.**


    Началось всё в 1840-х годах, когда здесь посадили чайные саженцы из сада князя Мамии V Гуриели в Озургети.
    После смерти Михаила хозяйство перешло к его сыну Андрии.


    Горабережоули было сердцем Саэриставо — владений гурийских Эристави, простиравшихся от реки Губазеули
    до хребта Сацаблио. По местным преданиям, эта ветвь восходит к концу XVII века, когда правитель Гурии
    Мамия III Гуриели пожаловал титул и земли своему зятю Георгию Шервашидзе. Старейшее сооружение усадьбы
    — ограда тех лет: стена из речного булыжника высотой около четырёх метров и общей длиной 25 метров,
    прорезанная ружейными бойницами. Ворота смотрели на юго-запад, а сразу за ними, справа, находится
    марани — винный погреб под открытым небом.


    В глубине двора стоит господский дом, который грузинская энциклопедия датирует XIX веком. У него фундамент
    из тёсаного камня, стены из речного камня, камин в гостевой комнате и широкий деревянный балкон на
    втором этаже, утративший былое очарование после поздних ремонтов. Внутри — массивный деревянный стол
    с шахматной доской и редкое серебряное зеркало. Гиды охотно рассказывают, что дым очага уходил не
    через трубу, а по каналам в толще стен, чтобы во время войны ни один дымок не выдал, что в доме живут.


    Вокруг дома раскинулся гектарный дендропарк: гинкго, вечнозелёная секвойя, красный можжевельник и
    деревья, которые местные зовут «конфетным деревом» и «японским земляничным деревом». Обходите его
    не спеша. Стену возвели против набегов, деревья посадили для радости глаз, а чай, начавшийся здесь,
    со временем покрыл холмы всей Западной Грузии.
  tip: >-
    Парк, по имеющимся сведениям, открыт ежедневно примерно с 10:00 до 18:00, вход свободный; дом показывают
    за пожертвование, так что уточните всё заранее, прежде чем делать большой крюк. Кафе и туалета на
    месте нет: поесть можно в Чохатаури, в нескольких километрах. Под вечер низкое солнце делает стену
    из речного камня тёплой и золотистой. Самые приятные сезоны здесь — весна и осень, а гурийское лето
    влажное и жаркое. Легко уложить в один неспешный день вместе с домом-музеем Нико Марра в Даблацихе
    и купанием в Гурис-Тба выше по Супсе.
  route: >-
    Из Тбилиси по E60/S1 на запад мимо Гори и Хашури, через Рикотский перевал и дальше мимо Зестафони
    и Кутаиси до Самтредиа. Там переходите на S12 в сторону Ланчхути; примерно через 7 км, у Саджавахо,
    сверните на юг на Sh2, которая через 18 км приводит в Чохатаури. Горабережоули — в нескольких километрах
    от центра городка по сельской дороге. Последний отрезок до ворот может оказаться гравийным: в сухую
    погоду машине эконом-класса он по силам, после дождя там бывает грязно. Рассчитывайте примерно на
    278 км и 4 часа 30 минут. Заправиться можно в Самтредиа или Чохатаури.
fa:
  name: عمارت اریستاوی (گورابرژوولی)
  short: >-
    پشت دیواری چهارمتری از قلوه‌سنگ رودخانه: خانهٔ خاندان اریستاوی، باغ درختانی کمیاب، و یکی از نخستین
    فصل‌های تاریخ چای گرجستان.
  body: >-
    **در سال ۱۸۶۴، در این ملکِ حصاردار بالای رود سوپسا، میخئیل اریستاوی نخستین کسی در گرجستان بود که چای
    را فرآوری کرد؛ به روشی ابتدایی، اما چنان خوب که آن را در نمایشگاه‌های تفلیس و سن‌پترزبورگ عرضه کرد.**


    ماجرا در دههٔ ۱۸۴۰ آغاز شده بود، هنگامی که نهال‌های چای از باغ شاهزاده مامیا پنجم گوریلی در اوزورگتی
    را اینجا کاشتند. پس از مرگ میخئیل، پسرش آندریا ادارهٔ ملک را به دست گرفت.


    گورابرژوولی قلب «سااریستاوو» بود، قلمرو خاندان اریستاوی گوریا که از رود گوبازئولی تا رشته‌کوه ساتسابلیو
    امتداد داشت. بنا بر روایت‌های محلی، این شاخه به اواخر سدهٔ هفدهم بازمی‌گردد، هنگامی که مامیا سوم گوریلی،
    فرمانروای گوریا، این عنوان و زمین‌ها را به دامادش گیورگی شارواشیدزه بخشید. کهن‌ترین بنای ملک، حصار
    همان سال‌هاست: دیواری از قلوه‌سنگ رودخانه به بلندی حدود چهار متر و درازای کلی ۲۵ متر، با مزغل‌هایی
    برای تفنگ. دروازه رو به جنوب‌غربی بود و درست پشت آن، سمت راست، انبار شرابی (مارانی) بی‌سقف و رو به
    آسمان قرار دارد.


    در انتهای حیاط خانهٔ خانوادگی ایستاده است که دانشنامهٔ گرجی آن را به سدهٔ نوزدهم نسبت می‌دهد. پی‌اش
    از سنگ تراشیده است و دیوارهایش از سنگ رودخانه؛ در اتاق مهمان بخاری دیواری دارد و در طبقهٔ بالا ایوان
    چوبی پهنی که مرمت‌های بعدی جلوه‌اش را از آن گرفته‌اند. درون خانه میزی چوبی و سنگین با صفحهٔ شطرنج
    و آینه‌ای نقره‌ای و کمیاب هست. راهنماها دوست دارند بگویند که دود اجاق نه از دودکش، بلکه از مجراهایی
    درون دیوارها بیرون می‌رفت تا در روزگار جنگ هیچ ستون دودی حضور ساکنان خانه را لو ندهد.


    گرداگرد خانه باغ درختانی به وسعت یک هکتار گسترده است: جینکو، سکویای همیشه‌سبز، سرو کوهی سرخ و درختانی
    که اهالی «درخت آب‌نبات» و «درخت توت‌فرنگی ژاپنی» می‌نامندشان. آهسته در آن قدم بزنید. دیوار برای دفع
    مهاجمان برپا شد، درختان برای شادی چشم کاشته شدند، و چایی که از اینجا آغاز شد سرانجام تپه‌های غرب گرجستان
    را پوشاند.
  tip: >-
    گفته می‌شود پارک هر روز از حدود ساعت ۱۰:۰۰ تا ۱۸:۰۰ باز است و ورودش رایگان؛ خانه را در ازای کمک مالی
    نشان می‌دهند، پس پیش از آنکه راهی دراز را برایش بپیمایید، از این موضوع اطمینان حاصل کنید. در محل نه
    کافه‌ای هست و نه سرویس بهداشتی: در چوخاتائوری، چند کیلومتر آن‌طرف‌تر، غذا بخورید. نور اواخر بعدازظهر
    دیوار قلوه‌سنگی را گرم و طلایی می‌کند. بهار و پاییز دلپذیرترین فصل‌های اینجاست، و تابستان گوریا شرجی
    و داغ. آن را به‌آسانی در یک روز با خانه‌موزهٔ نیکو مار در دابلاتسیخه و شنا در گوریس تبا، بالاتر در
    امتداد سوپسا، ترکیب کنید.
  route: >-
    از تفلیس جادهٔ E60/S1 را رو به غرب بروید؛ از کنار گوری و خاشوری بگذرید، از گردنهٔ ریکوتی عبور کنید
    و از کنار زستافونی و کوتایسی تا سامترِدیا پیش بروید. آنجا به S12 به سوی لانچخوتی بپیچید؛ پس از حدود
    ۷ کیلومتر، در ساجاواخو، به جنوب و به جادهٔ Sh2 بپیچید که حدود ۱۸ کیلومتر تا چوخاتائوری ادامه دارد.
    گورابرژوولی چند کیلومتر از مرکز شهر فاصله دارد و با جاده‌ای روستایی به آن می‌رسید. آخرین تکهٔ راه
    تا دروازه ممکن است شنی باشد: در هوای خشک برای خودروی اقتصادی مشکلی ندارد، اما پس از باران ممکن است
    گل‌آلود شود. حدود ۲۷۸ کیلومتر و ۴ ساعت و ۳۰ دقیقه در نظر بگیرید. در سامترِدیا یا چوخاتائوری سوخت بزنید.
he:
  name: אחוזת אריסטאווי (גורברז'ואולי)
  short: >-
    מאחורי חומה בגובה ארבעה מטרים מאבני נהר: בית משפחת אריסטאווי, גן עצים נדירים ואחד הפרקים הראשונים
    בתולדות התה הגאורגי.
  body: >-
    **ב-1864, באחוזה המוקפת חומה הזאת שמעל נהר סופסה, היה מיחאיל אריסטאווי הראשון בגאורגיה שעיבד תה –
    בשיטה פרימיטיבית, אבל היטב מספיק כדי להציג אותו בתערוכות בטביליסי ובסנקט פטרבורג.**


    הסיפור התחיל עוד בשנות ה-40 של המאה ה-19, כששתילי תה מגנו של הנסיך מאמיה החמישי גוריאלי באוזורגטי
    ניטעו כאן. אחרי מותו של מיחאיל עבר ניהול האחוזה לבנו אנדריה.


    גורברז'ואולי הייתה לבו של הסאריסטאבו, נחלתה של משפחת אריסטאווי של גוריה, שהשתרעה מנהר גובזאולי ועד
    רכס סצבליו. לפי מסורות מקומיות, הענף הזה ראשיתו בסוף המאה ה-17, כשמאמיה השלישי גוריאלי, שליט גוריה,
    העניק את התואר ואת האדמות לחתנו גיורגי שרוושידזה. המבנה העתיק ביותר באחוזה הוא החומה מאותן שנים: קיר
    מאבני נהר מעוגלות בגובה של כארבעה מטרים ובאורך כולל של 25 מטר, ובו חרכי ירי לרובים. השער פנה לדרום-מערב,
    ומיד מאחוריו, מימין, נמצא מרתף יין (מרני) פתוח לשמיים.


    בקצה החצר עומד בית המשפחה, שהאנציקלופדיה הגאורגית מתארכת למאה ה-19. יש לו יסודות מאבן מסותתת, קירות
    מאבני נהר, אח בחדר האורחים ומרפסת עץ רחבה בקומה העליונה, שתיקונים מאוחרים גזלו ממנה את קסמה. בפנים
    עומד שולחן עץ מסיבי ועליו לוח שחמט, וגם מראת כסף נדירה. המדריכים אוהבים לספר שעשן האח יצא דרך תעלות
    בתוך הקירות ולא דרך ארובה, כדי שבימי מלחמה שום עמוד עשן לא יסגיר את הבית.


    סביב הבית משתרע גן עצים (ארבורטום) בשטח של הקטר אחד: גינקו, סקויה ירוקת-עד, ערער אדום ועצים שהמקומיים
    מכנים "עץ הסוכריות" ו"עץ התות היפני". הסתובבו בו לאט. החומה הוקמה נגד פושטים, העצים ניטעו לשמחת העין,
    והתה שהתחיל כאן כיסה בהמשך את גבעות מערב גאורגיה.
  tip: >-
    לפי הדיווחים הפארק פתוח מדי יום בערך מ-10:00 עד 18:00 והכניסה חופשית; את הבית מראים תמורת תרומה, לכן
    ודאו מראש לפני שאתם עושים עיקוף ארוך. אין במקום בית קפה או שירותים: אכלו בצ׳וחאטאורי, כמה קילומטרים
    משם. אור אחר הצהריים המאוחר צובע את חומת אבני הנהר בזהב חמים. האביב והסתיו הן העונות הנעימות ביותר
    כאן, ואילו הקיץ בגוריה לח וחם. אפשר לשלב את המקום בקלות ביום אחד נינוח עם בית-המוזיאון של ניקו מאר
    בדבלציחה ורחצה בגוריס טבה, במעלה הסופסה.
  route: >-
    מטביליסי סעו מערבה בכביש E60/S1, על פני גורי וחשורי, דרך מעבר ריקוטי והלאה על פני זסטפוני וקוטאיסי
    עד סמטרדיה. שם עברו לכביש S12 לכיוון לנצ׳חותי; אחרי כ-7 ק״מ, בסג'אווחו, פנו דרומה לכביש Sh2, שמוביל
    כ-18 ק״מ עד צ׳וחאטאורי. גורברז'ואולי נמצאת כמה קילומטרים ממרכז העיירה, בדרך כפרית. הקטע האחרון עד
    השער עשוי להיות דרך חצץ: בסדר גמור לרכב אקונומי במזג אוויר יבש, ועלול להיות בוצי אחרי גשם. חשבו על
    כ-278 ק״מ ו-4 שעות ו-30 דקות. תדלקו בסמטרדיה או בצ׳וחאטאורי.
ar:
  name: ضيعة إريستافي (غورابيريجوولي)
  short: >-
    خلف سور من حصى النهر بارتفاع أربعة أمتار: بيت آل إريستافي، وحديقة أشجار نادرة، وأحد أول فصول حكاية
    الشاي الجورجي.
  body: >-
    **في عام 1864، في هذه الضيعة المسوّرة فوق نهر سوبسا، كان ميخائيل إريستافي أول من صنّع الشاي في جورجيا،
    بطريقة بدائية، لكن بإتقان كافٍ لعرضه في معارض تبليسي وسانت بطرسبورغ.**


    وكانت الحكاية قد بدأت في أربعينيات القرن التاسع عشر، حين غُرست هنا شتلات شاي من حديقة الأمير مامية
    الخامس غورييلي في أوزورغيتي. وبعد وفاة ميخائيل تولّى ابنه أندريا إدارة الضيعة.


    كانت غورابيريجوولي قلب «الساإريستافو»، أي إقطاعية آل إريستافي في غوريا، الممتدة من نهر غوبازيولي إلى
    سلسلة ساتسابليو. وتعيد الروايات المحلية هذا الفرع إلى أواخر القرن السابع عشر، حين منح مامية الثالث
    غورييلي، حاكم غوريا، اللقب والأرض لصهره غيورغي شارفاشيدزه. وأقدم ما في الضيعة هو السور الذي يعود إلى
    تلك السنوات: جدار من حصى النهر بارتفاع نحو أربعة أمتار وطول إجمالي يبلغ 25 متراً، تتخلله مزاغل للبنادق.
    كانت البوابة تواجه الجنوب الغربي، وخلفها مباشرة، إلى اليمين، قبو نبيذ (ماراني) مكشوف للسماء.


    في صدر الفناء يقوم بيت العائلة، الذي تؤرخه الموسوعة الجورجية بالقرن التاسع عشر. له أساسات من الحجر
    المنحوت، وجدران من حجارة النهر، ومدفأة في غرفة الضيوف، وشرفة خشبية عريضة في الطابق العلوي أفقدتها
    الترميمات اللاحقة سحرها. وفي الداخل طاولة خشبية ضخمة عليها رقعة شطرنج، ومرآة فضية نادرة. ويحب الأدلّاء
    أن يرووا أن دخان الموقد كان يخرج عبر قنوات داخل الجدران لا من مدخنة، كي لا يفضح عمود الدخان البيت
    في زمن الحرب.


    وحول البيت تمتد حديقة أشجار مساحتها هكتار واحد: الجنكة، والسيكويا دائمة الخضرة، والعرعر الأحمر، وأشجار
    يسميها الأهالي «شجرة الحلوى» و«شجرة الفراولة اليابانية». تجوّل فيها على مهل. فالسور شُيّد في وجه الغزاة،
    والأشجار غُرست لبهجة العين، أما الشاي الذي بدأ هنا فقد كسا لاحقاً تلال غرب جورجيا.
  tip: >-
    يُقال إن الحديقة تفتح يومياً من نحو الساعة 10:00 حتى 18:00 والدخول مجاني؛ ويُعرض البيت مقابل تبرّع،
    فتأكّد مسبقاً قبل أن تقطع مسافة طويلة من أجله. لا مقهى ولا دورة مياه في المكان: تناول طعامك في تشوخاتاوري
    على بُعد بضعة كيلومترات. ضوء آخر العصر يمنح سور حجارة النهر دفئاً ذهبياً. الربيع والخريف ألطف الفصول
    هنا، أما صيف غوريا فرطب وحار. يمكنك أن تجمعها بسهولة في يوم واحد مع البيت-المتحف لنيكو مار في دابلاتسيخه،
    وسباحة في «غوريس تبا» إلى الأعلى على نهر سوبسا.
  route: >-
    من تبليسي اسلك E60/S1 غرباً مروراً بغوري وخاشوري، ثم عبر ممر ريكوتي، ومنه مروراً بزيستافوني وكوتايسي
    حتى سامتريديا. هناك انتقل إلى S12 باتجاه لانتشخوتي؛ وبعد نحو 7 كم، عند ساجافاخو، انعطف جنوباً إلى
    Sh2 التي تمتد نحو 18 كم حتى تشوخاتاوري. تقع غورابيريجوولي على بُعد بضعة كيلومترات من مركز البلدة عبر
    طريق قروي. قد يكون المقطع الأخير حتى البوابة من الحصى: مناسب لسيارة اقتصادية في الطقس الجاف، وقد يوحل
    بعد المطر. احسب نحو 278 كم و4 ساعات و30 دقيقة. تزوّد بالوقود في سامتريديا أو تشوخاتاوري.
