ka:
  name: მოდინახის ციხე
  short: წერეთლების ციხე საჩხერის თავზე, რომლის სახელიც სიტყვასიტყვით „მოდი, ნახე“-ს ნიშნავს.
  body: >-
    **მოდინახე საჩხერეს ზემოთ, ციცაბო მთის თხემზე დგას და ქალაქის თითქმის ყველა ქუჩიდან ჩანს.** ციხის
    აშენების ზუსტი თარიღი უცნობია, თუმცა ის დიდი ხნის განმავლობაში წერეთელთა სათავადოს მთავარი რეზიდენცია
    იყო — ზემო იმერეთის ერთ-ერთი ყველაზე ძლიერი საგვარეულოსი.


    სახელი ახსნას მოითხოვს: „მოდი-ნახე“ ზუსტად იმას ნიშნავს, რასაც ჟღერს. ეს მტრისადმი მიმართული დაცინვაა
    — მოდი და შეხედე, თუ შეგიძლია აიღო. მდებარეობა მართლაც ისეთია, რომ ალყა თითქმის უაზრო ხდებოდა: სამი
    მხრიდან ფერდობი ციცაბოა, წყალი კი ციხეს შიგნით ჰქონდა.


    ისტორია 1810 წელს დასრულდა, როცა კავკასიის დაპყრობის დროს ციხე რუსულმა ჯარმა აიღო. ამის შემდეგ ის
    მიატოვეს. 1991 წლის მიწისძვრამ საბოლოო დარტყმა მიაყენა: კედლების დიდი ნაწილი ჩამოინგრა და ქვის ლოდები
    ფერდობზე ქვემოთ დაიშალა — დღემდე ისე დევს, როგორც ჩამოვარდა.


    რას ნახავ: გალავნის მონაკვეთები, კოშკის ფუძე, ცისტერნის ნაშთი და ბალახში გაფანტული ქვა. მთავარი მაინც
    ხედია — ყვირილას ხეობა, საჩხერე ქვემოთ, ჩრდილოეთით რაჭის ქედი, აღმოსავლეთით კი ისეთი დღეები, როცა
    ლიხის ქედიც მოჩანს.


    ეს ერთსაათიანი გაჩერებაა და არა დამოუკიდებელი მიზანი. ლოგიკურად ის სხვიტორთან — აკაკი წერეთლის სახლ-მუზეუმთან
    — ერთად იკითხება: ერთი და იმავე ოჯახის ორი ბოლო, ერთმანეთისგან ოცდაათიოდე წუთის სავალზე.


    წერეთლები ცალკე აბზაცს იმსახურებენ. მათ ზემო იმერეთი ნახევრად დამოუკიდებელ სამთავროდ ეპყრათ, იმერეთის
    მეფეებს ისევე ხშირად ედავებოდნენ, როგორც ემსახურებოდნენ, XIX საუკუნეში კი სწორედ ამ გვარმა მისცა ქვეყანას
    პოეტი აკაკი წერეთელი, რომელიც აქედან რამდენიმე კილომეტრში, სხვიტორში დაიბადა. როცა რუსეთის იმპერიამ
    რეგიონი შეიერთა, ოჯახმა ტიტულები შეინარჩუნა, ციხე კი დაკარგა — ეს ორი რამ ერთი თაობის მანძილზე მოხდა.
  tip: >-
    ერთი საათი, ასვლის ჩათვლით. ბოლო მონაკვეთი ფეხითაა — თხემამდე ციცაბო ბილიკი ათი-თხუთმეტი წუთია, ტყეში
    და ქვებზე. სველ ამინდში თიხა სრიალდება, ზამთარში კი ბილიკი ხშირად ყინულშია. ჩრდილი ზემოთ არ არის.
    კედლებზე ასვლა არ ღირს: ქვა ფხვიერია და 1991 წლის შემდეგ არაფერი გამაგრებულა. არც ტუალეტი და არც წყალია
    — წყალი თან წაიღე. საჩხერეში კაფე და მაღაზია ხუთ წუთშია.
  route: >-
    თბილისიდან E60-ით ზესტაფონამდე, შემდეგ ჩრდილოეთით ჭიათურაზე გავლით საჩხერისკენ — სულ დაახლოებით 240
    კმ და სამი საათნახევარი. ზესტაფონის შემდეგ გზა ვიწრო და კლაკნილია, მაგრამ ასფალტიანი. საჩხერეში ციხის
    მიმართულებით ქუჩა მაღლა მიდის და ბოლო ორი კილომეტრი მოხრეშილი და ციცაბოა — მშრალ ამინდში კროსოვერი
    ავა, წვიმის ან თოვლის შემდეგ ჯობია ქვემოთ დატოვო მანქანა და ფეხით ახვიდე. საწვავი ზესტაფონსა და ჭიათურაშია.
en:
  name: Modinakhe Fortress
  short: The Tsereteli family's fortress above Sachkhere, whose name means, literally, "come and see".
  body: >-
    **Modinakhe stands on a steep ridge above Sachkhere and is visible from almost every street in the
    town.** The date of building is not known, but for a long period it was the principal residence of
    the Tsereteli princes, one of the strongest families of Upper Imereti.


    The name needs explaining. Modi-nakhe means exactly what it sounds like: come and look. It is a taunt
    aimed at a besieger — come and see whether you can take it. The position bears the boast out. On three
    sides the slope falls away steeply, and the fortress had its own water supply inside the walls.


    Its history ended in 1810, when the Russian army took the castle during the conquest of the Caucasus.
    After that it was abandoned. The earthquake of 1991 delivered the final blow: much of the walling
    collapsed and blocks of masonry slid down the hillside, where they still lie as they fell.


    What you find on top: stretches of curtain wall, the base of a tower, the remains of a cistern and
    stone scattered in the grass. The reason to climb is the view — the Kvirila valley, Sachkhere directly
    below, the Racha range to the north, and on clear days the Likhi ridge away to the east.


    Treat it as an hour's stop rather than a destination in itself. It pairs naturally with Skhvitori
    and the Akaki Tsereteli house-museum half an hour away: two ends of the same family story.


    The Tseretelis deserve a paragraph of their own. They held Upper Imereti as a half-independent principality,
    quarrelled with the kings of Imereti about as often as they served them, and in the 19th century produced
    the poet Akaki Tsereteli, born a few kilometres from here at Skhvitori. When the Russian empire absorbed
    the region the family kept its titles but lost the fortress, and the two things happened within a
    single generation.
  tip: >-
    An hour, including the climb. The last section is on foot: ten to fifteen minutes of steep path through
    trees and over loose stone. In wet weather the clay is slippery, and in winter the path is often iced.
    There is no shade at the top. Do not climb on the walls; the masonry is loose and nothing has been
    consolidated since 1991. There is no toilet and no water, so bring your own. Cafes and shops are five
    minutes away in Sachkhere.
  route: >-
    Take the E60 west from Tbilisi to Zestaponi, then head north through Chiatura to Sachkhere — about
    240 km in all, three and a half hours. Beyond Zestaponi the road is narrow and winding but paved.
    In Sachkhere a street climbs towards the fortress, and the last two kilometres are steep gravel: a
    crossover manages in dry weather, but after rain or snow it is better to leave the car lower down
    and walk. Fuel is available in Zestaponi and Chiatura.
ru:
  name: Крепость Модинахе
  short: Крепость князей Церетели над Сачхере, название которой буквально значит «приди и посмотри».
  body: >-
    **Модинахе стоит на крутом гребне над Сачхере и видна почти с любой улицы города.** Точная дата постройки
    неизвестна, но долгое время это была главная резиденция князей Церетели — одного из сильнейших родов
    Верхней Имеретии.


    Название требует пояснения. «Моди-нахе» означает ровно то, как звучит: приди и посмотри. Это насмешка
    в адрес осаждающего — подойди и убедись, сможешь ли взять. Положение оправдывает браваду: с трёх сторон
    склон обрывается круто, а вода у крепости была внутри стен.


    История закончилась в 1810 году, когда во время завоевания Кавказа крепость взяла русская армия. После
    этого её оставили. Землетрясение 1991 года нанесло последний удар: значительная часть кладки обрушилась,
    и каменные глыбы сползли по склону, где лежат до сих пор так, как упали.


    Что вы найдёте наверху: участки ограды, основание башни, остатки цистерны и камень, разбросанный в
    траве. Подниматься стоит ради вида — долина Квирилы, Сачхере прямо внизу, Рачинский хребет к северу,
    а в ясные дни и Лихский хребет далеко на востоке.


    Воспринимайте это как часовую остановку, а не самостоятельную цель. Модинахе естественно сочетается
    со Схвитори и домом-музеем Акакия Церетели в получасе езды: два конца одной семейной истории.


    Церетели заслуживают отдельного абзаца. Они держали Верхнюю Имеретию как полунезависимое княжество,
    ссорились с имеретинскими царями примерно так же часто, как служили им, а в XIX веке дали стране поэта
    Акакия Церетели, родившегося в нескольких километрах отсюда, в Схвитори. Когда Российская империя
    присоединила край, семья сохранила титулы, но потеряла крепость, и обе эти вещи уместились в одно
    поколение.
  tip: >-
    Час вместе с подъёмом. Последний участок пешком: десять-пятнадцать минут крутой тропы через лес и
    по осыпи. В сырость глина скользит, зимой тропа часто обледеневает. Тени наверху нет. На стены лезть
    не стоит: кладка рыхлая, с 1991 года ничего не укрепляли. Ни туалета, ни воды здесь нет — берите с
    собой. Кафе и магазины в Сачхере, в пяти минутах.
  route: >-
    Из Тбилиси по E60 до Зестафони, затем на север через Чиатуру в Сачхере — всего около 240 км, три с
    половиной часа. После Зестафони дорога узкая и извилистая, но асфальтированная. В Сачхере улица поднимается
    к крепости, последние два километра — крутой гравий: в сухую погоду кроссовер справится, после дождя
    или снега лучше оставить машину ниже и подняться пешком. Заправки есть в Зестафони и Чиатуре.
fa:
  name: قلعهٔ موديناخه
  short: قلعهٔ خاندان تسرِتِلی بالای ساچخره، که نامش تحت‌اللفظی یعنی «بیا و ببین».
  body: >-
    **موديناخه بر یالی تند بالای ساچخره ایستاده و از تقریباً هر خیابان شهر دیده می‌شود.** تاریخ دقیق ساختش
    دانسته نیست، اما مدتی دراز اقامتگاه اصلی شاهزادگان تسرِتِلی بود، از نیرومندترین خاندان‌های ایمرتی
    بالا.


    نام آن توضیح می‌خواهد. «مودی‑ناخه» دقیقاً همان است که به گوش می‌آید: بیا و ببین. طعنه‌ای است به محاصره‌کننده
    — بیا و ببین می‌توانی بگیری یا نه. موقعیت هم این لاف را تأیید می‌کند: از سه سو شیب به‌تندی می‌افتد
    و آب قلعه درون دیوارها بود.


    تاریخ آن در ۱۸۱۰ پایان یافت، وقتی ارتش روسیه در جریان فتح قفقاز قلعه را گرفت. پس از آن رها شد. زلزلهٔ
    ۱۹۹۱ ضربهٔ آخر را زد: بخش بزرگی از دیوارها فرو ریخت و تخته‌سنگ‌های تراشیده از دامنه سُر خوردند و همان‌جا
    که افتادند مانده‌اند.


    آنچه بالا می‌یابید: پاره‌هایی از حصار، پای یک برج، بازماندهٔ آب‌انبار و سنگ‌های پراکنده در علف. اما
    دلیل صعود منظره است: درهٔ کویریلا، ساچخره درست پایین، رشته‌کوه راچا در شمال، و در روزهای صاف یال لیخی
    دورتر در شرق.


    آن را توقفی یک‌ساعته بدانید نه مقصدی مستقل. با سخویتوری و خانه‌موزهٔ آکاکی تسرِتِلی در نیم‌ساعتی،
    به‌طور طبیعی جفت می‌شود: دو سر یک داستان خانوادگی.


    خاندان تسرِتِلی یک بند جداگانه می‌طلبد. آنان ایمرتی بالا را همچون امیرنشینی نیمه‌مستقل در دست داشتند،
    با پادشاهان ایمرتی تقریباً به همان اندازه که خدمتشان می‌کردند در ستیز بودند، و در سدهٔ نوزدهم شاعر
    آکاکی تسرِتِلی را به کشور دادند که چند کیلومتر آن‌سوتر در سخویتوری زاده شد. وقتی امپراتوری روسیه منطقه
    را بلعید، خانواده عنوان‌هایش را نگه داشت اما قلعه را از دست داد، و هر دو در فاصلهٔ یک نسل رخ داد.
  tip: >-
    یک ساعت با احتساب صعود. بخش آخر پیاده است: ده تا پانزده دقیقه مسیر تند از میان درختان و روی سنگ‌های
    شل. در هوای مرطوب خاک رس لیز می‌خورد و زمستان مسیر اغلب یخ‌زده است. بالا سایه‌ای نیست. از دیوارها
    بالا نروید؛ بنایی سست است و از ۱۹۹۱ چیزی مقاوم‌سازی نشده. سرویس بهداشتی و آب وجود ندارد، پس آب همراه
    ببرید. کافه و مغازه در ساچخره و پنج دقیقه آن‌سوترند.
  route: >-
    از تفلیس با E60 تا زستافونی و سپس شمال از راه چیاتورا به ساچخره — روی‌هم حدود ۲۴۰ کیلومتر و سه ساعت
    و نیم. پس از زستافونی جاده باریک و پرپیچ اما آسفالته است. در ساچخره خیابانی به سوی قلعه بالا می‌رود
    و دو کیلومتر آخر شنی و تند است: در هوای خشک کراس‌اوور از پسش برمی‌آید، اما پس از باران یا برف بهتر
    است خودرو را پایین‌تر بگذارید و پیاده بالا بروید. سوخت در زستافونی و چیاتورا هست.
he:
  name: מבצר מודינאחה
  short: מבצר משפחת צרתלי מעל סחחרה, ששמו פירושו המילולי "בוא וראה".
  body: >-
    **מודינאחה עומד על רכס תלול מעל סחחרה ונראה כמעט מכל רחוב בעיירה.** תאריך הבנייה אינו ידוע, אך במשך
    תקופה ארוכה זה היה מושבם הראשי של נסיכי צרתלי, מן המשפחות החזקות באימרתי העילית.


    השם דורש הסבר. "מודי־נאחה" פירושו בדיוק כפי שהוא נשמע: בוא וראה. זו לגלוג המופנה אל הצר — בוא וראה
    אם תוכל לכבוש. המיקום מצדיק את הרהב: משלושה כיוונים המדרון צונח בתלילות, ומקור המים של המבצר היה בתוך
    החומות.


    ההיסטוריה שלו הסתיימה ב-1810, כשהצבא הרוסי כבש את המבצר במהלך כיבוש הקווקז. אחר כך ננטש. רעידת האדמה
    של 1991 הנחיתה את המכה האחרונה: חלק ניכר מן החומות התמוטט וגושי אבן גלשו במורד המדרון, ושם הם מונחים
    עד היום כפי שנפלו.


    מה מוצאים למעלה: קטעי חומת היקף, בסיס מגדל, שרידי בור מים ואבנים פזורות בעשב. הסיבה לעלות היא הנוף
    — עמק הקווירילה, סחחרה ממש למטה, רכס ראצ'ה בצפון, ובימים בהירים גם רכס ליחי הרחוק במזרח.


    התייחסו לזה כאל עצירה של שעה ולא כאל יעד בפני עצמו. הוא משתלב באופן טבעי עם סחוויטורי ובית־המוזיאון
    של אקאקי צרתלי במרחק חצי שעה: שני קצותיו של אותו סיפור משפחתי.


    בני צרתלי ראויים לפסקה משלהם. הם החזיקו באימרתי העילית כנסיכות חצי עצמאית, רבו עם מלכי אימרתי בערך
    באותה תדירות שבה שירתו אותם, ובמאה ה-19 העמידו את המשורר אקאקי צרתלי, שנולד כמה קילומטרים מכאן בסחוויטורי.
    כשסיפחה האימפריה הרוסית את האזור שמרה המשפחה על תאריה אך איבדה את המבצר, ושני הדברים קרו בתוך דור
    אחד.
  tip: >-
    שעה כולל הטיפוס. המקטע האחרון ברגל: עשר עד חמש־עשרה דקות של שביל תלול בין עצים ועל אבנים רופפות. ברטיבות
    החרסית מחליקה, ובחורף השביל מכוסה קרח לא פעם. אין צל למעלה. אל תטפסו על החומות: הבנייה רופפת ודבר
    לא יוצב מאז 1991. אין שירותים ואין מים, אז קחו איתכם. בתי קפה וחנויות בסחחרה, חמש דקות משם.
  route: >-
    מטביליסי בכביש E60 עד זסטפוני, ואז צפונה דרך צ'יאטורה לסחחרה — כ-240 ק״מ בסך הכול, שלוש שעות וחצי.
    אחרי זסטפוני הכביש צר ומתפתל אך סלול. בסחחרה רחוב מטפס לכיוון המבצר, ושני הקילומטרים האחרונים חצץ
    תלול: ברכב פנאי־שטח קל אפשר בימים יבשים, אך אחרי גשם או שלג עדיף להשאיר את הרכב למטה ולעלות ברגל.
    דלק יש בזסטפוני ובצ'יאטורה.
ar:
  name: قلعة موديناخه
  short: قلعة أسرة تسيريتيلي فوق ساتشخيره، واسمها يعني حرفياً «تعال وانظر».
  body: >-
    **تقوم موديناخه على حرف جبلي شديد الانحدار فوق ساتشخيره وتُرى من كل شارع في البلدة تقريباً.** تاريخ
    بنائها غير معروف، لكنها ظلت زمناً طويلاً المقر الرئيسي لأمراء تسيريتيلي، وهم من أقوى أسر إيميريتي
    العليا.


    الاسم يحتاج إلى شرح. «مودي‑ناخه» تعني تماماً ما توحي به: تعال وانظر. إنها سخرية موجّهة إلى المحاصِر
    — تعال وانظر أتقدر على أخذها. والموقع يصدّق هذا التبجح: فمن ثلاث جهات يهوي المنحدر بحدة، وكان للقلعة
    ماؤها داخل الأسوار.


    انتهى تاريخها عام 1810 حين استولى عليها الجيش الروسي أثناء فتح القوقاز. ثم هُجرت بعد ذلك. وجاء زلزال
    1991 بالضربة الأخيرة: انهار جزء كبير من الأسوار وانزلقت كتل الحجارة على السفح، وما زالت راقدة كما
    سقطت.


    ما تجده في الأعلى: مقاطع من سور الحماية، وقاعدة برج، وبقايا صهريج، وحجارة متناثرة في العشب. لكن سبب
    الصعود هو المنظر: وادي كفيريلا، وساتشخيره تحتك مباشرة، وسلسلة راتشا شمالاً، وفي الأيام الصافية حرف
    ليخي بعيداً في الشرق.


    اعتبرها محطة ساعة واحدة لا وجهة قائمة بذاتها. وهي تقترن طبيعياً بسخفيتوري وبيت‑متحف أكاكي تسيريتيلي
    على بعد نصف ساعة: طرفان من حكاية أسرة واحدة.


    تستحق أسرة تسيريتيلي فقرة خاصة بها. أمسكت بإيميريتي العليا بوصفها إمارة شبه مستقلة، وخاصمت ملوك إيميريتي
    بقدر ما خدمتهم تقريباً، وأنجبت في القرن التاسع عشر الشاعر أكاكي تسيريتيلي المولود على بعد كيلومترات
    قليلة من هنا في سخفيتوري. وحين ضمّت الإمبراطورية الروسية الإقليم احتفظت الأسرة بألقابها وفقدت القلعة،
    وحدث الأمران في مدى جيل واحد.
  tip: >-
    ساعة تشمل الصعود. المقطع الأخير سيراً: عشر إلى خمس عشرة دقيقة من درب حاد بين الأشجار وفوق حجارة سائبة.
    في الجو الرطب يزلق الطين، وفي الشتاء كثيراً ما يتجمد الدرب. ولا ظل في الأعلى. لا تتسلق الأسوار؛ فالبناء
    مفكك ولم يُدعَّم شيء منذ 1991. لا دورة مياه ولا ماء، فاحمل ماءك. والمقاهي والمتاجر في ساتشخيره على
    بعد خمس دقائق.
  route: >-
    من تبليسي على الطريق E60 حتى زستافوني، ثم شمالاً عبر تشياتورا إلى ساتشخيره — نحو 240 كم إجمالاً وثلاث
    ساعات ونصف. بعد زستافوني يضيق الطريق ويتلوّى لكنه معبّد. وفي ساتشخيره يصعد شارع نحو القلعة، والكيلومتران
    الأخيران حصى شديد الانحدار: تكفي سيارة مرتفعة في الجو الجاف، أما بعد المطر أو الثلج فالأفضل ترك السيارة
    أسفل والصعود سيراً. الوقود متوفر في زستافوني وتشياتورا.
