ka:
  name: მოდინახის ციხე
  short: 'წერეთლების XVIII საუკუნის ციხე საჩხერის თავზე, კირქვის ვიწრო ქედზე — სახელიც კი გამოწვევაა:
    მოდი და ნახე.'
  body: >-
    **მოდინახე დავის მოსაგებად აშენდა და მისი სახელი ამ დავის ბოლო სიტყვაა.** გადმოცემით, პაპუნა წერეთელმა
    დავით აბაშიძეს ქალიშვილი სთხოვა ცოლად, მაგრამ უარი მიიღო — ციხე არა გაქვსო. პაპუნამ საჩხერის თავზე,
    კირქვის ციცაბო ქედზე ციხე ააშენა და მომავალ სიმამრს შეუთვალა: „მოდი, ნახე“. ქართული წყაროები ციხის
    აგებას XVIII საუკუნის 30-იან წლებს მიაკუთვნებენ, თავად ადგილი კი ბევრად ძველია: 1967–1975 წლების გათხრებმა
    აქ ადრებრინჯაოს ხანის ნამოსახლარი გამოავლინა, ანტიკური და ელინისტური ხანის სამარხებში კი ოქროსა და
    ვერცხლის ნივთები, კოლხური და რომაული მონეტები აღმოჩნდა.


    ციხემ სახელი გაამართლა. 1735 წელს იმერეთის მეფე ალექსანდრე V-ის წინააღმდეგ აჯანყებული პაპუნა სწორედ
    აქ გამაგრდა; მეფემ ციხის აღება რამდენჯერმე სცადა, მაგრამ ამაოდ. 1766 წელს, ოსმალთა ლაშქრობისას, მოდინახეს
    კედლებს მეფე სოლომონ I შეეფარა. ციხე მხოლოდ ერთხელ დაეცა — 1810 წლის მარტში, როცა რუსულმა ჯარმა ის
    იმერელ აჯანყებულებს წაართვა. ამბობენ, მაშინაც მხოლოდ იმიტომ, რომ მეციხოვნეებს სურსათი გამოელიათ და
    შიგნით გამცემი გამოერია.


    1991 წლის მიწისძვრამ კედლების დიდი ნაწილი ფერდობზე ჩამოაქცია. 2018–2019 წლებში ორივე კოშკს მოპირკეთება
    შესაფერისი ქვით აღუდგინეს, გალავანი ნაწილობრივ ამოაშენეს, ქედზე კი ასფალტიანი გზა აიყვანეს. რესტავრაციის
    ხარისხზე აზრი იყოფა, სილუეტი კი კვლავ მთლიანია.


    გალავანს შემოვლებულ კიბეებს აუყევით და სახელის აზრს თვალით დაინახავთ: ღია ფერის კლდე სამ მხარეს ციცაბოდ
    ეშვება, ღრმად ქვემოთ საჩხერის სახურავები ყრია, ყვირილა სამხრეთ-დასავლეთით, ჭიათურისკენ მიიკლაკნება,
    ჩრდილოეთით კი რაჭის ქედები ერთმანეთს ეფარება. ოქტომბრის ბოლოს ამოდით, როცა ფერდობის ტყე სპილენძისფრად
    ანთია.


    პაპუნამ ციხე სანახავად ააშენა. დღესაც ჩანს — საჩხერის თითქმის ყველა ქუჩიდან.
  tip: >-
    ერთი საათი საკმარისია. 2018–2019 წლების სამუშაოების შემდეგ ციხის ძირამდე, ავტოსადგომამდე ასფალტიანი
    გზა ადის; იქიდან ბილიკი და კიბეები ათიოდე წუთში გალავნის გარშემო შემოგატარებთ. წვიმის შემდეგ ქვის
    საფეხურები სრიალებს, ზამთარში შეიძლება მოყინულიც დაგხვდეთ. ზემოთ ჩრდილი ცოტაა — ზაფხულში წყალი და
    ქუდი არ დაგავიწყდეთ. ბილეთი არ იყიდება, კაფე და ტუალეტი ადგილზე არ არის; საჩხერის ბაზართან კაფეები
    მანქანით ხუთ წუთშია. ბავშვებს ქონგურებთან ახლოს ნუ მიუშვებთ. ქალაქს საუკეთესო შუქი ნაშუადღევს ადგება.
  route: >-
    ყველაზე მოკლე გზა ზესტაფონზე არ გადის. თბილისიდან E60-ით (ს1) დასავლეთისკენ, გორსა და ქარელს გასცდით
    და აგარასთან, დაახლოებით 115-ე კილომეტრზე, შ22-ზე გადაუხვიეთ — ეს გზა გომზე გავლით ბორცვებს გადაივლის
    და საჩხერემდე მიგიყვანთ. გზა მთავარი და ასფალტიანია, თუმცა კლაკნილი. სულ დაახლოებით 176 კმ, შესვენების
    ჩათვლით სამიოდე საათი. საჩხერეში ქალაქის ჩრდილო-დასავლეთ კიდისკენ აიღეთ გეზი, საიდანაც ქედზე ციცაბო
    ასფალტიანი გზა კედლების ქვემოთ, ავტოსადგომამდე ადის. საწვავი ქარელსა და საჩხერეში ჩაასხით. მშრალ ამინდში
    ეკონომ-კლასის ნებისმიერი მანქანა ავა; თოვლში ბოლო აღმართი ფეხით ჯობია.
en:
  name: Modinakhe Fortress
  short: >-
    An 18th-century Tsereteli stronghold strung along a limestone crest above Sachkhere, named for a dare:
    “come and see”.
  body: >-
    **Modinakhe was built to win an argument, and its name is the last word.** Tradition says that when
    Papuna Tsereteli asked David Abashidze for his daughter’s hand, he was turned down: a man without
    a castle was no match. So Papuna raised one on the limestone crest above Sachkhere and sent his future
    father-in-law two words: “Come and see.” Georgian sources date the walls to the 1730s, but the hill
    is far older. Excavations in 1967–75 found an Early Bronze Age settlement here, and graves of the
    Classical and Hellenistic periods holding gold and silver jewellery and vessels, and Colchian and
    Roman coins.


    The castle lived up to its name. In 1735 Papuna shut himself in here in revolt against King Alexander
    V of Imereti, who tried several times to take it and failed. In 1766 King Solomon I sheltered behind
    these walls from an Ottoman campaign. Modinakhe fell only once, in March 1810, when the Russian army
    took it from Imeretian rebels — and even then, the story goes, only because the garrison had run out
    of food and a traitor was found inside.


    The 1991 earthquake threw much of the masonry down the slope. In 2018–19 both towers were refaced
    in matching stone, the curtain walls were partly rebuilt and a paved road was laid up the ridge. Opinions
    on the finish differ; the silhouette, at least, is whole again.


    Climb the stairs along the ramparts and the name becomes physical: pale rock falls away on three sides,
    Sachkhere’s roofs lie far below, the Kvirila slips south-west towards Chiatura, and the ridges of
    Racha stack up to the north. Come in late October, when the woods on the slope turn copper.


    Papuna built his castle to be seen. It still is, from almost every street in town.
  tip: >-
    Allow an hour. Since the 2018–19 works a paved road climbs to a car park below the fortress; from
    there a footpath and stairs take you round the ramparts in about ten minutes. The stone steps are
    slick after rain and can ice over in winter, and there is little shade on top, so bring water and
    a hat in summer. There is no ticket office, café or toilet at the site; the cafés by Sachkhere’s market
    are five minutes’ drive below. Keep children back from the parapets. The light on the town is best
    in the late afternoon.
  route: >-
    The quickest way is not through Zestaponi. Take the E60 (S1) west from Tbilisi past Gori and Kareli
    and turn off at Agara, about 115 km out, onto the Sh22, which winds through Gomi and over the hills
    to Sachkhere — a paved main road, but a twisting one. That makes about 176 km in all, roughly three
    hours with a stop. In Sachkhere head for the north-western edge of town, where a steep paved road
    climbs the ridge to the car park below the walls. Fuel up in Kareli or Sachkhere. Any economy car
    manages in dry weather; in snow, walk the final climb.
ru:
  name: Крепость Модинахе
  short: >-
    Крепость Церетели XVIII века, вытянутая по известняковому гребню над Сачхере; её имя — вызов: «приди
    и посмотри».
  body: >-
    **Модинахе построили, чтобы выиграть спор, и её имя — последнее слово в этом споре.** Предание говорит,
    что когда Папуна Церетели попросил руки дочери Давида Абашидзе, ему отказали: человек без замка —
    не пара. Тогда Папуна возвёл замок на известняковом гребне над Сачхере и отправил будущему тестю два
    слова: «Приди и посмотри». Грузинские источники датируют стены 1730-ми годами, но сам холм гораздо
    древнее. Раскопки 1967–1975 годов обнаружили здесь поселение раннего бронзового века и погребения
    классической и эллинистической эпох с золотыми и серебряными украшениями и сосудами, колхидскими и
    римскими монетами.


    Крепость оправдала своё имя. В 1735 году Папуна затворился здесь, восстав против царя Имерети Александра
    V, который несколько раз пытался взять её и терпел неудачу. В 1766 году царь Соломон I укрывался за
    этими стенами от османского похода. Модинахе пала лишь однажды, в марте 1810 года, когда российские
    войска взяли её у имеретинских повстанцев — и, по преданию, лишь потому, что у гарнизона закончилась
    еда и внутри нашёлся предатель.


    Землетрясение 1991 года сбросило значительную часть каменной кладки вниз по склону. В 2018–2019 годах
    обе башни облицевали подобранным камнем, частично восстановили крепостные стены и провели асфальтированную
    дорогу на гребень. Мнения об этой реставрации расходятся; но силуэт, по крайней мере, снова целен.


    Поднимитесь по ступеням вдоль крепостных стен, и имя обретает буквальный смысл: с трёх сторон вниз
    уходит светлая скала, далеко под ногами лежат крыши Сачхере, Квирила скользит на юго-запад к Чиатуре,
    а на севере вздымаются хребты Рачи. Приезжайте в конце октября, когда лес на склоне становится медным.


    Папуна построил свой замок так, чтобы его видели. Его и сегодня видно почти с любой улицы города.
  tip: >-
    Отведите час. После работ 2018–2019 годов асфальтированная дорога поднимается к автостоянке под крепостью;
    оттуда пешеходная тропа и лестница ведут вокруг стен за десять минут. Каменные ступени скользкие после
    дождя и могут покрываться льдом зимой, а тени наверху почти нет, так что летом берите воду и шляпу.
    На месте нет кассы, кафе или туалета; кафе у рынка Сачхере — в пяти минутах езды вниз. Не подпускайте
    детей к краю стен. Свет на город лучше всего в конце дня.
  route: >-
    Самый быстрый путь — не через Зестафони. Двигайтесь по трассе E60 (S1) на запад от Тбилиси, минуя
    Гори и Карели, и через примерно 115 км сверните у Агары на дорогу Ш22, которая через Гоми и холмы
    выведет к Сачхере — асфальтированная главная дорога, но извилистая. Всего получается около 176 км,
    примерно три часа с остановкой. В Сачхере направляйтесь к северо-западной окраине города, откуда крутая
    асфальтированная дорога поднимается по гребню к автостоянке под стенами. Заправляйтесь в Карели или
    Сачхере. В сухую погоду подойдёт любой автомобиль эконом-класса; в снег последний подъём лучше пройти
    пешком.
fa:
  name: دژ مودیناخه
  short: >-
    دژی از خانواده تسرتلی، ساخته‌شده در سده هجدهم، که بر فراز تیغه آهکی بالای ساچخره کشیده شده است؛ نامش
    برخاسته از یک چالش: «بیا و ببین».
  body: >-
    **مودیناخه برای بردن یک مجادله ساخته شد، و نامش واپسین کلام همان مجادله است.** روایت می‌گوید هنگامی
    که پاپونا تسرتلی دختر داوید آباشیدزه را از پدرش خواستگاری کرد، پاسخ رد شنید: مردی بدون قلعه همتای
    شایسته‌ای نبود. پس پاپونا بر فراز تیغه آهکی بالای ساچخره قلعه‌ای برافراشت و برای پدرزنِ آینده‌اش دو
    کلمه فرستاد: «بیا و ببین». منابع گرجی دیوارها را به دهه ۱۷۳۰ نسبت می‌دهند، اما خودِ تپه بسیار کهن‌تر
    است. کاوش‌های سال‌های ۱۹۶۷ تا ۱۹۷۵ سکونتگاهی از عصر برنز آغازین را در این‌جا آشکار کرد، در کنار گورهایی
    از دوران کلاسیک و هلنیستی که زیورآلات و ظروف زرین و سیمین و نیز سکه‌های کولخیسی و رومی در بر داشتند.


    این دژ به نام خود وفادار ماند. در سال ۱۷۳۵ پاپونا که بر شاه الکساندر پنجم ایمرتی شوریده بود، در این‌جا
    سنگر گرفت؛ و شاه چند بار برای گشودن دژ کوشید و ناکام ماند. در سال ۱۷۶۶ شاه سولومون یکم در پس این دیوارها
    از یک لشکرکشی عثمانی پناه گرفت. مودیناخه تنها یک بار، در مارس ۱۸۱۰، سقوط کرد، آن‌گاه که سپاه روسیه
    آن را از دست شورشیان ایمرتی بیرون کشید — و آن هم، بنا به روایت، تنها از آن رو که خوراک پادگان به پایان
    رسیده بود و خیانتکاری در درون یافت شد.


    زمین‌لرزه سال ۱۹۹۱ بخش بزرگی از سنگ‌چینی را به دامنه فروریخت. در سال‌های ۲۰۱۸ تا ۲۰۱۹ هر دو برج با
    سنگ همسان روکش شد، دیوارهای پیرامونی تا اندازه‌ای بازساخته شد و راهی آسفالته تا تیغه کوه کشیده شد.
    دیدگاه‌ها درباره نتیجه این کار متفاوت است؛ اما دست‌کم پیکره کلی دژ دوباره یکپارچه شده است.


    از پله‌های کنار باروها بالا بروید تا نام دژ ملموس شود: از سه سو صخره‌ای روشن به پایین می‌ریزد، بام‌های
    ساچخره دوردست در زیر پا می‌مانند، رود کویریلا به سوی جنوب‌غربی، به‌سمت چیاتورا، می‌خزد، و در شمال،
    تیغه‌های راچا رده‌به‌رده بالا می‌آیند. در اواخر اکتبر بیایید، هنگامی که جنگل‌های دامنه به رنگ مس درمی‌آیند.


    پاپونا دژ خود را برای دیده‌شدن ساخت. هنوز هم، تقریباً از هر خیابان شهر، دیده می‌شود.
  tip: >-
    یک ساعت زمان کافی است. از زمان کارهای ۲۰۱۸-۲۰۱۹، راهی آسفالته تا پارکینگی زیر دژ بالا می‌رود؛ از آن‌جا
    مسیری پیاده و پله‌هایی در حدود ده دقیقه شما را گرداگرد باروها می‌برد. پله‌های سنگی پس از باران لیز
    می‌شوند و ممکن است در زمستان یخ بزنند، و در بالا سایه‌ای اندک است، پس در تابستان آب و کلاه همراه داشته
    باشید. در محل هیچ باجه بلیت، کافه یا سرویس بهداشتی نیست؛ کافه‌های کنار بازار ساچخره پنج دقیقه رانندگی
    پایین‌تر قرار دارند. کودکان را از کنگره‌ها دور نگه دارید. بهترین نور بر شهر در اواخر بعدازظهر است.
  route: >-
    سریع‌ترین راه از میان زستافونی نمی‌گذرد. از تفلیس بر جاده E60 (S1) به سوی غرب حرکت کنید، از گوری و
    کارلی بگذرید و در حدود ۱۱۵ کیلومتری، در آگارا، به جاده Sh22 بپیچید که از میان گومی و بر فراز تپه‌ها
    تا ساچخره پیچ‌وتاب می‌خورد — جاده‌ای اصلی و آسفالته، اما پرپیچ. در مجموع حدود ۱۷۶ کیلومتر می‌شود،
    تقریباً سه ساعت با یک توقف. در ساچخره به سوی کناره شمال‌غربی شهر بروید، جایی که راهی آسفالته و پرشیب
    از تیغه کوه تا پارکینگ زیر دیوارها بالا می‌رود. در کارلی یا ساچخره سوخت‌گیری کنید. در هوای خشک هر
    خودروی اقتصادی از پس این راه برمی‌آید؛ در برف، بهتر است بخش پایانی صعود را پیاده بروید.
he:
  name: מבצר מודינאחה
  short: 'מצודת בית צרתלי מהמאה ה-18, המשתרעת על רכס גיר מעל סאצחרה, שנקראה בשם שהוא אתגר: ''בוא וראה''.'
  body: >-
    **מודינאחה נבנתה כדי לנצח בוויכוח, ושמה הוא המילה האחרונה בו.** המסורת מספרת שכאשר פאפונה צרתלי ביקש
    את ידה של בתו של דוד אבשידזה, הוא נדחה: אדם בלי מצודה לא היה שידוך הולם. אז פאפונה הקים מצודה על רכס
    הגיר שמעל סאצחרה, ושלח לחותנו העתידי שתי מילים: 'בוא וראה'. מקורות גאורגיים מתארכים את החומות לשנות
    ה-1730, אך הגבעה עצמה עתיקה בהרבה. חפירות בשנים 1967–1975 חשפו כאן יישוב מתקופת הברונזה הקדומה, וקברים
    מהתקופה הקלאסית וההלניסטית שהכילו תכשיטים וכלים מזהב ומכסף, ומטבעות קולכיים ורומיים.


    המצודה עמדה בשמה. ב-1735 פאפונה התבצר בה נגד המלך אלכסנדר החמישי של אימרתי, שניסה כמה פעמים לכבוש
    אותה ונכשל. ב-1766 מצא המלך סולומון הראשון מחסה בין חומותיה מפני מסע עות'מאני. מודינאחה נכבשה רק פעם
    אחת, במרץ 1810, כאשר צבא רוסי כבש אותה מידי מורדים אימרתיים — ולפי המסורת, רק משום שלחיל המצב אזל
    המזון ונמצא בוגד מבפנים.


    רעידת האדמה של 1991 השליכה חלק גדול מאבני הבנייה במורד המדרון. בשנים 2018–2019 חופו שני המגדלים באבן
    תואמת, חומות ההיקף נבנו מחדש בחלקן, ונסלל כביש עד לרכס. הדעות על תוצאת השיפוץ חלוקות; אך צללית המצודה,
    לפחות, שלמה שוב.


    עלו במדרגות לאורך החומות, והשם הופך למוחשי: מכל שלושת הצדדים סלע בהיר צונח, גגות סאצחרה שוכנים עמוק
    מתחת, נהר קווירילה זורם לדרום-מערב, לעבר צ'יאטורה, ורכסי ראצ'ה נערמים זה מעל זה בצפון. הגיעו בסוף
    אוקטובר, כשהיערות במדרון מתלבשים בגוון נחושת.


    פאפונה בנה את מצודתו כדי שתיראה. היא עדיין נראית, כמעט מכל רחוב בעיר.
  tip: >-
    הקדישו שעה. מאז העבודות של 2018–2019 מוביל כביש סלול לחניון מתחת למצודה; משם שביל ומדרגות מקיפים את
    החומות בכעשר דקות. מדרגות האבן חלקלקות אחרי גשם ועלולות לקפוא בחורף, ובראש אין הרבה צל, אז הביאו מים
    וכובע בקיץ. אין באתר קופה, בית קפה או שירותים; בתי הקפה שבשוק סאצחרה הם חמש דקות נסיעה למטה. הרחיקו
    ילדים משולי החומות. האור על העיר יפה ביותר בשעות אחר הצהריים המאוחרות.
  route: >-
    הדרך המהירה ביותר אינה עוברת בזסטפוני. נסעו בכביש E60 (S1) מטביליסי מערבה, חלפו על פני גורי וקארלי,
    ואחרי כ-115 ק"מ פנו באגארה לכביש Sh22, המתפתל דרך גומי ועל פני הגבעות עד סאצחרה — כביש ראשי סלול אך
    מתפתל. בסך הכול כ-176 ק"מ, כשלוש שעות עם עצירה. בסאצחרה פנו לקצה הצפון-מערבי של העיר, שם כביש סלול
    תלול עולה על הרכס עד לחניון מתחת לחומות. תדלקו בקארלי או בסאצחרה. במזג אוויר יבש כל רכב אקונומי יסתדר;
    בשלג, כדאי לעלות את הקטע האחרון ברגל.
ar:
  name: قلعة موديناخه
  short: >-
    معقل من بيت تسيريتيلي بُني في القرن الثامن عشر، يمتد على حافة كلسية تعلو ساتشخيري، وسُمّي على سبيل
    التحدي: «تعالَ وانظر».
  body: >-
    **بُنيت موديناخه لكسب مجادلة، واسمها هو الكلمة الأخيرة فيها.** يقول التراث إن بابونا تسيريتيلي حين
    طلب يد ابنة داويد أباشيدزه رُفض طلبه: فرجلٌ بلا قلعة ليس كفؤًا لها. فشيّد بابونا قلعة على الحافة الكلسية
    التي تعلو ساتشخيري، وأرسل إلى حميه المرتقب كلمتين: «تعالَ وانظر». تُؤرّخ المصادر الجورجية الأسوار
    إلى عقد الثلاثينيات من القرن الثامن عشر، لكن التل نفسه أقدم بكثير. وقد كشفت حفريات 1967–1975 عن مستوطنة
    من العصر البرونزي المبكر، وقبور من العصرين الكلاسيكي والهلنستي تحوي حُليًّا وأواني من الذهب والفضة،
    وعملات كولخية ورومانية.


    وقد أثبتت القلعة اسمها. في عام 1735 تحصّن بابونا فيها ثائرًا على الملك ألكسندر الخامس ملك إيميريتي،
    الذي حاول عدة مرات الاستيلاء عليها فباء بالفشل. وفي عام 1766 لجأ الملك سولومون الأول خلف هذه الأسوار
    من حملة عثمانية. ولم تسقط موديناخه إلا مرة واحدة، في مارس 1810، حين استولى عليها الجيش الروسي من الثوار
    الإيميريتيين — وحتى تلك المرة، على ما تقول الرواية، لم يكن ذلك إلا لأن الحامية نفدت أقواتها وعُثر
    على خائن في داخلها.


    وقد قذف زلزال عام 1991 جزءًا كبيرًا من حجارتها إلى أسفل المنحدر. وفي عامي 2018–2019 كُسي البرجان بحجر
    مماثل، وأُعيد بناء بعض الأسوار المحيطة، ومُدّ طريق مُعبَّد يصل إلى قمة الحافة. وتتفاوت الآراء في نتيجة
    هذا الترميم؛ لكن هيئة القلعة، على الأقل، اكتملت من جديد.


    اصعد الدرج المحاذي للأسوار، فيتجسّد الاسم أمامك: تنحدر الصخرة الفاتحة من ثلاث جهات، وتلوح أسطح ساتشخيري
    بعيدًا في الأسفل، ويتلوى نهر كفيريلا نحو الجنوب الغربي باتجاه تشياتورا، وتتراكم سلاسل راتشا في الشمال.
    تعالَ في أواخر أكتوبر، حين تكتسي غابات المنحدر لونًا نحاسيًا.


    بنى بابونا قلعته لتُرى. وهي لا تزال تُرى، من كل شارع في المدينة تقريبًا.
  tip: >-
    خصّص ساعة واحدة. منذ أعمال 2018–2019، يصعد طريق مُعبَّد إلى موقف سيارات تحت القلعة؛ ومن هناك يقودك
    ممرّ ودرج حول الأسوار في نحو عشر دقائق. تصبح الدرجات الحجرية زلقة بعد المطر وقد تتجمّد في الشتاء،
    وفي القمة ظلٌّ قليل، فاحمل ماءً وقبعة في الصيف. لا يوجد في الموقع شبّاك تذاكر أو مقهى أو مرحاض؛ توجد
    المقاهي قرب سوق ساتشخيري على خمس دقائق بالسيارة أسفل التل. احرص على إبقاء الأطفال بعيدين عن حواف الأسوار.
    الضوء على المدينة أجمل في أواخر بعد الظهر.
  route: >-
    أسرع طريق لا يمرّ عبر زيستافوني. اتبع الطريق E60 (S1) غربًا من تبليسي متجاوزًا غوري وكاريلي، وانحرف
    عند أغارا، على مسافة نحو 115 كم، إلى طريق Sh22، الذي يتعرّج عبر غومي وفوق التلال حتى ساتشخيري — طريق
    رئيسي معبّد لكنه متعرّج. فيكون المجموع نحو 176 كم، أي نحو ثلاث ساعات مع وقفة. في ساتشخيري اتجه إلى
    الحافة الشمالية الغربية من المدينة، حيث يصعد طريق معبّد شديد الانحدار على التلّ حتى موقف السيارات
    تحت الأسوار. تزوّد بالوقود في كاريلي أو ساتشخيري. تكفي سيارة اقتصادية عادية في الطقس الجاف؛ وفي الثلج،
    من الأفضل السير على القدمين في المرتقى الأخير.
