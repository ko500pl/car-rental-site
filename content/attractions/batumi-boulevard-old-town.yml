ka:
  name: ბათუმის ბულვარი და ძველი ქალაქი
  short: >-
    ზღვისპირა ბულვარი, 1881 წელს შიშველ ქვიშაზე გაშენებული, და ნავთობის ფულით ნაშენი ძველი ქალაქი რკინის
    აივნებითა და ნეოგოთიკური ტაძრით.
  body: >-
    **1881 წელს აქ მხოლოდ მსხვილი ზღვის ქვიშა იყო — ბათუმის ბულვარის ყოველი ხე ორმოში დაირგო, რომელიც
    ქალაქგარედან ჩამოზიდული მიწით ავსეს.**


    პირველი ხეივნები გერმანელმა მებაღეებმა, რესლერმა და რეიერმა გააშენეს. მათ ფრანგი მიშელ დალფონსი მოჰყვა,
    რომელიც საფრანგეთიდან გემებით ეზიდებოდა ხეებს — ბევრი მათგანი საქართველოში მანამდე არასოდეს ხარობდა.
    1888 წელს აქ იმპერატორი ალექსანდრე III ოჯახით სეირნობდა; უფლისწულმა ნიკოლოზმა ხეები თავად დარგო და
    ბულვარს მისი სახელიც დაერქვა. 1934 წელს კოლონადები აშენდა — პროექტი ბათუმელმა ექიმმა ივანე მჭედლიძემ
    სორენტოდან ჩამოიტანა. 2004 წლიდან ესპანელმა არქიტექტორმა ალბერტო დომინგო კაბომ ბულვარი ჩრდილოეთით
    გააგრძელა და დღეს იგი დაახლოებით შვიდი კილომეტრია — შავი ზღვის სანაპიროზე ყველაზე გრძელი სასეირნო
    ბულვარი.


    ნელა თუ გაივლით, ფენები თავისით გამოჩნდება: ასწლოვანი მაგნოლიები და ფიჭვები; 1882 წლის შუქურა, რომელიც
    ყოველ ექვს წამში წითლად ციმციმებს; 1975 წლის „კაფე ფანტაზია“ — მოზაიკით მოჭედილი „რვაფეხა“; და თამარ
    კვესიტაძის „ალი და ნინო“ — ორი ფოლადის ფიგურა, რომლებიც საღამოს შვიდი საათიდან ნელა უახლოვდებიან ერთმანეთს,
    ერთმანეთში გადიან და ისევ შორდებიან. 1930-იან წლებში ხეივნებში ოცამდე იტალიური მარმარილოს ქანდაკება
    იდგა; ომის დროს ჯარისკაცები მათზე სროლაში ვარჯიშობდნენ, გადარჩენილები კი უკვალოდ გაქრნენ.


    ძველი ქალაქი, ბულვარიდან რამდენიმე კვარტალში, ხანმოკლე პორტო-ფრანკომ (1878–1886) კი არა, ნავთობმა
    ააშენა. როცა 1883 წელს ბაქო-ბათუმის რკინიგზა გაიყვანეს, ბათუმი იმპერიის ნავთობის მთავარ კარიბჭედ იქცა;
    1892 წელს აქ ნავთით დატვირთული „მურექსი“ სუეცის არხზე გასული პირველი ტანკერი გახდა. ეს ფული დღესაც
    ჩანს ჩუქურთმიან კარებსა და რკინის ნაჭედ მოაჯირებში, ზუბალაშვილების ხარჯით აგებულ ნეოგოთიკურ ღვთისმშობლის
    ტაძარში (1898–1903). პიაცა და ასტრონომიული საათი კი 2010 წლის დანამატებია — სასიამოვნო, მაგრამ ისტორიად
    ჯერ ადრეა.


    აჭარა საქართველოს ყველაზე წვიმიანი კუთხეა — და ხშირად სწორედ თავსხმა გიტოვებთ ბულვარს მარტო თქვენთვის.
  tip: >-
    ზაფხულში ცენტრში მანქანით სიარული ტყუილად დაკარგული დროა: მანქანა სასტუმროსთან დატოვეთ, ბულვარი კი
    ფეხით ან ქირავნული ველოსიპედით გაიარეთ. ქუჩის პარკინგი ფასიანია და საფასური უმეტესად მობილური აპლიკაციით
    ან SMS-ით იხდება — ეს პირველად მოსულს ფასზე მეტად აბნევს, ამიტომ ჯობია სასტუმროში წინასწარ გაარკვიოთ.
    საუკეთესო დროა საღამო: სიცხე ცხრება, „ალი და ნინო“ შვიდიდან მოძრაობს, შუქურასთან კი მზე ზღვაში ჩადის.
    ქოლგა ან თხელი წვიმის ქურთუკი ჩანთაში გქონდეთ და არა საბარგულში. ბანკომატები, აფთიაქები და კაფეები
    ყოველ ნაბიჯზეა, ბარათით გადახდა ცენტრში პრობლემა არ არის.
  route: >-
    თბილისიდან ბათუმამდე 370 კილომეტრი და დაახლოებით ხუთნახევარი საათია — ქვეყნის ერთ-ერთი საუკეთესო გზა.
    E60-ით გორის, ხაშურის, რიკოთის გვირაბების, ქუთაისისა და სამტრედიის გავლით მიდიხართ, სამტრედიიდან S12-ით
    ლანჩხუთის გავლით ზღვაზე, გრიგოლეთთან, გადიხართ და სანაპიროს გაყოლებით, ქობულეთის გავლით, ბათუმში შედიხართ.
    გზა ბოლომდე ასფალტია, დიდი ნაწილი ოთხზოლიანი, ამიტომ ეკონომ-კლასის მანქანა სავსებით საკმარისია. ბენზინგასამართი
    სადგურები მთელ გზაზეა, ხაშურსა და ქუთაისში — მით უმეტეს. ზაფხულის შაბათ-კვირას ადრე გამოდით: სანაპიროზე
    საცობები გვიანი დილიდანვე იწყება.
en:
  name: Batumi Boulevard and Old Town
  short: >-
    A seafront promenade planted on bare sand in 1881, and an old town built on oil money, with iron balconies
    and a Gothic Revival cathedral.
  body: >-
    **In 1881 there was nothing here but coarse sea sand: every tree on Batumi Boulevard began as a pit
    filled with soil carted in from beyond the town.**


    The German gardeners Rössler and Reier planted the first alleys. After them came the Frenchman Michel
    d'Alfonse, who shipped trees in from France, many of them species Georgia had never grown. In 1888
    Alexander III came with his family; the heir, Nicholas, planted trees himself, and the promenade took
    his name. The colonnades followed in 1934, built to a design a Batumi doctor, Ivane Mchedlidze, had
    brought back from Sorrento. Since 2004 the Spanish architect Alberto Domingo Cabo has pushed the boulevard
    north to about seven kilometres, the longest promenade on the Black Sea.


    Walk it slowly and the layers show: century-old magnolias and pines; the 1882 lighthouse, flashing
    red every six seconds; Café Fantasy, the mosaic-clad "Octopus" of 1975; and Tamar Kvesitadze's Ali
    and Nino, two steel figures who from 7 pm glide towards each other, pass through one another and part.
    In the 1930s some twenty Italian marble statues lined these alleys. In the war soldiers used them
    for target practice; the survivors vanished.


    The old town, a few blocks inland, was built less by the brief free port (1878–1886) than by oil.
    Once the Baku–Batumi railway arrived in 1883, Batumi became the empire's great oil gateway; in 1892
    the Murex loaded kerosene here and became the first tanker through the Suez Canal. That money survives
    in carved doors, wrought-iron balconies and the Gothic Revival Cathedral of the Mother of God (1898–1903),
    paid for by the Zubalashvili brothers. The Piazza and the astronomical clock are 2010 additions: pleasant,
    but not yet history.


    Adjara is Georgia's wettest corner, and a downpour is often what leaves you the boulevard to yourself.
  tip: >-
    In summer a car in the centre is wasted time: leave it at the hotel and do the boulevard on foot or
    by hired bicycle. Street parking is paid, mostly through a phone app or SMS, which confuses first-time
    drivers more than the price does, so ask your hotel how it works before you set out. Evening is the
    best hour: the heat eases, Ali and Nino start moving at 7 pm and the sun drops into the sea by the
    lighthouse. Keep an umbrella or a light shell in your bag, not the boot. ATMs, pharmacies and cafés
    are everywhere, and cards are accepted throughout the centre.
  route: >-
    Tbilisi to Batumi is 370 km, about five and a half hours on one of the country's best roads. Take
    the E60 west past Gori and Khashuri, through the Rikoti tunnels and on via Kutaisi to Samtredia, then
    the S12 through Lanchkhuti to the coast at Grigoleti, and south through Kobuleti into Batumi. It is
    asphalt all the way and largely dual carriageway, so an economy car is entirely sufficient. Fuel is
    never far off, with plenty of stations at Khashuri and Kutaisi. On summer weekends set off early,
    as coastal traffic starts to jam from late morning.
ru:
  name: Батумский бульвар и Старый город
  short: >-
    Приморский бульвар, разбитый на голом песке в 1881 году, и старый город, выросший на нефтяные деньги,
    — с чугунными балконами и неоготическим собором.
  body: >-
    **В 1881 году здесь был только грубый морской песок: каждое дерево на Батумском бульваре начиналось
    с ямы, засыпанной землёй, привезённой из-за города.**


    Первые аллеи разбили немецкие садовники Рёсслер и Рейер. После них пришёл француз Мишель д'Альфонс,
    который завозил деревья прямо из Франции — многие виды в Грузии до тех пор никогда не росли. В 1888
    году сюда приезжал с семьёй Александр III; наследник Николай сам посадил несколько деревьев, и бульвар
    назвали в его честь. В 1934 году появились колоннады — по проекту, который батумский врач Иване Мчедлидзе
    привёз из Сорренто. С 2004 года испанский архитектор Альберто Доминго Кабо продлил бульвар на север
    примерно до семи километров — это самая длинная набережная на Чёрном море.


    Пройдите его медленно, и слои проступят сами: столетние магнолии и сосны; маяк 1882 года, вспыхивающий
    красным каждые шесть секунд; «Кафе Фантазия» — облицованный мозаикой «осьминог» 1975 года; и «Али
    и Нино» Тамары Квеситадзе — две стальные фигуры, которые с семи вечера медленно движутся друг к другу,
    проходят одна через другую и снова расходятся. В 1930-х годах эти аллеи украшали около двадцати итальянских
    мраморных статуй. В войну солдаты стреляли по ним для тренировки, и уцелевшие исчезли без следа.


    Старый город, в нескольких кварталах от моря, обязан своим обликом не короткому порто-франко (1878–1886),
    а нефти. Когда в 1883 году протянули железную дорогу Баку–Батуми, город стал главными нефтяными воротами
    империи; в 1892 году именно здесь загрузился керосином танкер «Мурекс» — первый, прошедший через Суэцкий
    канал. Эти деньги видны и сегодня — в резных дверях, кованых балконах и неоготическом соборе Богородицы
    (1898–1903), построенном на средства братьев Зубалашвили. Пьяцца и астрономические часы — добавления
    2010 года: приятные, но пока не история.


    Аджария — самый дождливый край Грузии, и часто именно ливень оставляет бульвар в полное ваше распоряжение.
  tip: >-
    Летом машина в центре — потерянное время: оставьте её у отеля и пройдите бульвар пешком или на арендованном
    велосипеде. Уличная парковка платная, оплата обычно через мобильное приложение или SMS — это путает
    приезжих сильнее, чем сама цена, так что уточните в отеле заранее, как это работает. Лучший час —
    вечер: жара отступает, «Али и Нино» начинают двигаться в семь, а солнце садится в море у маяка. Держите
    зонт или лёгкую ветровку в сумке, а не в багажнике. Банкоматы, аптеки и кафе — на каждом шагу, карты
    принимают повсюду в центре.
  route: >-
    От Тбилиси до Батуми 370 км — около пяти с половиной часов по одной из лучших дорог страны. Двигайтесь
    на запад по трассе E60 через Гори, Хашури, Рикотские тоннели, Кутаиси и Самтредиа, затем по S12 через
    Ланчхути к побережью у Григолети, и далее на юг через Кобулети в Батуми. Дорога заасфальтирована целиком
    и в основном имеет по две полосы в каждую сторону, так что достаточно машины экономкласса. Заправки
    встречаются часто, особенно в Хашури и Кутаиси. В летние выходные выезжайте пораньше: прибрежные пробки
    начинаются уже с позднего утра.
fa:
  name: بلوار باتومی و شهر قدیم
  short: >-
    تفرجگاهی ساحلی که در سال ۱۸۸۱ بر شنِ برهنه کاشته شد، و شهر قدیمی که با پول نفت بنا شده، با بالکن‌های
    آهنی و کلیسای جامع نئوگوتیک.
  body: >-
    **در سال ۱۸۸۱ در این‌جا چیزی جز شن درشت ساحلی نبود: هر درخت بلوار باتومی از گودالی آغاز شد که با خاکی
    از بیرون شهر پر شده بود.**


    باغبانان آلمانی، رسلر و رایر، نخستین کوچه‌باغ‌ها را کاشتند. پس از آن‌ها میشل دالفونس فرانسوی از راه
    رسید که درختانی از فرانسه با کشتی می‌آورد؛ بسیاری از آن گونه‌ها پیش‌تر هرگز در گرجستان نروییده بودند.
    در سال ۱۸۸۸ الکساندر سوم به همراه خانواده‌اش به این‌جا آمد؛ ولیعهد، نیکلای، خود چند درخت کاشت و بلوار
    به نام او خوانده شد. ردیف‌ستون‌ها در سال ۱۹۳۴ ساخته شدند، بر پایهٔ طرحی که پزشکی باتومی‌نشین، ایوانه
    مچدلیدزه، از سورنتو با خود آورده بود. از سال ۲۰۰۴ معمار اسپانیایی، آلبرتو دومینگو کابو، بلوار را به
    سوی شمال تا حدود هفت کیلومتر گسترش داده است؛ طولانی‌ترین تفرجگاه ساحلی دریای سیاه.


    اگر آرام قدم بزنید، لایه‌ها خود را نشان می‌دهند: ماگنولیا و کاج‌های صدساله؛ فانوس دریایی سال ۱۸۸۲
    که هر شش ثانیه یک‌بار قرمز چشمک می‌زند؛ کافه فانتزی، «هشت‌پای» موزاییک‌کاری‌شده سال ۱۹۷۵؛ و «علی و
    نینو»ی تامار کوِسیتادزه، دو پیکرهٔ فولادی که از ساعت هفت شب به‌آرامی به هم نزدیک می‌شوند، از میان
    هم می‌گذرند و باز از هم دور می‌شوند. در دههٔ ۱۹۳۰ نزدیک به بیست مجسمهٔ مرمر ایتالیایی این کوچه‌باغ‌ها
    را می‌آراست. در جنگ، سربازان آن‌ها را برای تیراندازی تمرینی هدف گرفتند و بازماندگان‌شان بی‌آنکه ردی
    بماند ناپدید شدند.


    شهر قدیم، چند بلوک دورتر از دریا، بیش از آن‌که به بندر آزاد کوتاه‌مدت (۱۸۷۸–۱۸۸۶) وابسته باشد، ساختهٔ
    نفت است. با رسیدن خط‌آهن باکو-باتومی در سال ۱۸۸۳، باتومی به دروازهٔ بزرگ نفتی امپراتوری بدل شد؛ در
    سال ۱۸۹۲ نفت‌کش «مورکس» در همین‌جا نفت سفید بار زد و نخستین نفت‌کشی شد که از کانال سوئز گذشت. آن پول
    هنوز در درهای منبت‌کاری‌شده، بالکن‌های فرفورژه و کلیسای جامع نئوگوتیک مادر خدا (۱۸۹۸–۱۹۰۳) که برادران
    زوبالاشویلی هزینه‌اش را پرداختند، دیده می‌شود. میدان پیاتزا و ساعت نجومی از افزوده‌های سال ۲۰۱۰ هستند:
    خوشایند، اما هنوز تاریخ نیستند.


    آجارا پرباران‌ترین گوشهٔ گرجستان است، و غالباً همین رگبار است که بلوار را تنها برای شما باقی می‌گذارد.
  tip: >-
    در تابستان، ماشین در مرکز شهر وقت تلف‌کردن است: آن را کنار هتل بگذارید و بلوار را پیاده یا با دوچرخهٔ
    کرایه‌ای بگردید. پارکینگ خیابانی پولی است و معمولاً از طریق اپلیکیشن یا پیامک پرداخت می‌شود؛ همین
    شیوهٔ پرداخت، بیش از خودِ قیمت، تازه‌واردها را گیج می‌کند، پس پیش از حرکت از هتل‌تان بپرسید که چگونه
    کار می‌کند. بهترین ساعت، عصر است: گرما فرو می‌نشیند، «علی و نینو» از ساعت هفت به حرکت درمی‌آیند و
    خورشید کنار فانوس دریایی در دریا فرومی‌رود. چتر یا بارانی‌ای نازک در کیف‌تان بگذارید، نه در صندوق
    ماشین. دستگاه خودپرداز، داروخانه و کافه همه‌جا هست و کارت‌ها در سطح مرکز شهر همه‌جا پذیرفته می‌شوند.
  route: >-
    از تفلیس تا باتومی ۳۷۰ کیلومتر است، حدود پنج ساعت و نیم روی یکی از بهترین جاده‌های کشور. از جادهٔ
    E60 به‌سوی غرب حرکت کنید، از گوری، خاشوری، تونل‌های ریکوتی، کوتایسی تا سامترِدیا، سپس از S12 از میان
    لانچخوتی به ساحل در گریگولتی برسید و سپس به‌سوی جنوب، از میان کوبولتی، به باتومی وارد شوید. جاده تا
    انتها آسفالته و بیشتر دوبانده است، پس یک خودروی اقتصادی کاملاً کافی است. پمپ‌بنزین همه‌جا نزدیک است،
    به‌ویژه در خاشوری و کوتایسی. در تعطیلات آخر هفتهٔ تابستان زود حرکت کنید، چون ترافیک ساحلی از اواخر
    صبح شروع می‌شود.
he:
  name: הטיילת של בטומי והעיר העתיקה
  short: טיילת חוף שנשתלה על חול חשוף בשנת 1881, ועיר עתיקה שנבנתה בכספי הנפט, עם מרפסות ברזל וקתדרלה
    ניאו-גותית.
  body: >-
    **ב-1881 לא היה כאן דבר מלבד חול ים גס: כל עץ בטיילת בטומי החל את דרכו כגומה שמולאה באדמה שהובאה מחוץ
    לעיר.**


    הגננים הגרמנים רסלר ורייאר שתלו את השדרות הראשונות. אחריהם הגיע הצרפתי מישל ד'אלפונס, שהביא עצים באונייה
    מצרפת, רבים מהם ממינים שמעולם לא צמחו בגאורגיה. ב-1888 הגיע אלכסנדר השלישי עם משפחתו; יורש העצר, ניקולאי,
    שתל עצים בעצמו, והטיילת נקראה על שמו. הקולונדות הוקמו ב-1934, לפי תכנון שרופא מבטומי, איוואנה מצ'דלידזה,
    הביא מסורנטו. מאז 2004 הרחיב האדריכל הספרדי אלברטו דומינגו קאבו את הטיילת צפונה לכשבעה קילומטרים -
    הטיילת הארוכה ביותר על שפת הים השחור.


    טיילו בה לאט והשכבות יתגלו מעצמן: מגנוליות ואורנים בני מאה שנה; המגדלור מ-1882, המהבהב באדום כל שש
    שניות; קפה פנטזיה, ה"תמנון" המרוצף פסיפס משנת 1975; ו"עלי ונינו" של תמר קווסיטדזה - שתי דמויות פלדה
    הנעות זו לעבר זו מ-19:00, עוברות זו דרך זו ונפרדות מחדש. בשנות ה-30 עמדו בשדרות כעשרים פסלי שיש איטלקיים.
    במלחמה השתמשו בהם חיילים לאימוני קליעה, והפסלים ששרדו נעלמו בלי עקבות.


    העיר העתיקה, כמה רחובות מהחוף, נבנתה פחות בזכות הנמל החופשי הקצר (1878-1886) ויותר בזכות הנפט. משהגיעה
    מסילת הרכבת באקו-בטומי ב-1883, הפכה בטומי לשער הנפט הגדול של האימפריה; ב-1892 העמיסה כאן האונייה "מורקס"
    נפט למנורות והפכה למכלית הראשונה שחצתה את תעלת סואץ. הכסף הזה עדיין נראה בדלתות המגולפות, במרפסות
    הברזל המחושל ובקתדרלת אם האלוהים הניאו-גותית (1898-1903), שמימנו האחים זובלשווילי. הפיאצה והשעון האסטרונומי
    הם תוספות מ-2010: נעימים, אך עדיין לא היסטוריה.


    אג'ריה היא האזור הגשום ביותר בגאורגיה, ולעיתים קרובות דווקא גשם זלעפות הוא שמשאיר לכם את הטיילת לעצמכם.
  tip: >-
    בקיץ מכונית במרכז העיר היא זמן מבוזבז: השאירו אותה במלון וסיירו בטיילת ברגל או על אופניים מושכרים.
    חניית רחוב בתשלום, בדרך כלל דרך אפליקציה או SMS - ושיטת התשלום מבלבלת את מי שנוהג כאן בפעם הראשונה
    יותר מהמחיר עצמו, ולכן כדאי לשאול במלון איך זה עובד לפני שיוצאים. הערב הוא השעה הטובה ביותר: החום
    נחלש, "עלי ונינו" מתחילים לזוז בשבע בערב והשמש שוקעת בים לצד המגדלור. שמרו מטריה או מעיל גשם קל בתיק,
    לא בתא המטען. כספומטים, בתי מרקחת ובתי קפה נמצאים בכל מקום, וכרטיסי אשראי מתקבלים בכל מרכז העיר.
  route: >-
    מטביליסי לבטומי המרחק הוא 370 ק"מ, כחמש שעות וחצי באחד הכבישים הטובים במדינה. סעו מערבה בכביש E60
    דרך גורי, חשורי, מנהרות ריקוטי וקוטאיסי עד סמטרדיה, ואז ב-S12 דרך לנצ'חוטי לחוף בגריגולטי, ומשם דרומה
    דרך קובולטי לתוך בטומי. הכביש סלול לכל אורכו ורובו כביש כפול, כך שרכב אקונומי מספיק בהחלט. תדלוק זמין
    כל הדרך, עם תחנות רבות בחשורי ובקוטאיסי. בסופי שבוע בקיץ צאו מוקדם, כי פקקי החוף מתחילים כבר בשעות
    הבוקר המאוחרות.
ar:
  name: بولفار باتومي والمدينة القديمة
  short: >-
    كورنيش بحري زُرع على رمالٍ جرداء عام 1881، ومدينة قديمة شُيّدت بأموال النفط، بشرفاتٍ حديدية وكاتدرائية
    قوطية جديدة.
  body: >-
    **في عام 1881 لم يكن هنا سوى رمل بحري خشن: فكل شجرة على بولفار باتومي بدأت حياتها في حفرة مُلئت بتراب
    أُتي به من خارج المدينة.**


    غرس البستانيان الألمانيان روسلر وراير أول الممرات. ثم جاء بعدهما الفرنسي ميشيل دالفونس، الذي كان يستورد
    الأشجار بحرًا من فرنسا، وكثير منها أنواع لم تنبت في جورجيا من قبل. في عام 1888 زار ألكسندر الثالث
    المكان مع أسرته؛ وغرس ولي العهد نيقولا بيده بعض الأشجار، فحمل الكورنيش اسمه. تلت ذلك الأروقة ذات الأعمدة
    في عام 1934، بتصميم أحضره طبيب من باتومي، إيفانه متشيدليدزه، من سورينتو. ومنذ عام 2004 مدّ المعماري
    الإسباني ألبرتو دومينغو كابو الكورنيش شمالًا حتى بلغ نحو سبعة كيلومترات، فصار أطول ممشى على البحر
    الأسود.


    سِرْ فيه ببطء فتتكشّف الطبقات وحدها: أشجار الماغنوليا والصنوبر المعمِّرة قرنًا؛ والمنارة المبنية عام
    1882 التي تومض أحمر كل ست ثوانٍ؛ ومقهى "فانتازيا"، "الأخطبوط" المكسوّ بالفسيفساء من عام 1975؛ وتمثالا
    "علي ونينو" لتمار كفيسيتادزه، وهما شخصيتان فولاذيتان تتقاربان ببطء منذ السابعة مساءً، وتعبر كل منهما
    الأخرى ثم تفترقان. في ثلاثينيات القرن الماضي كان يقف على هذه الممرات نحو عشرين تمثالًا من المرمر الإيطالي؛
    وفي الحرب استخدمها الجنود للتدريب على الرماية، فاختفت التماثيل الناجية دون أثر.


    المدينة القديمة، على بُعد بضعة شوارع من الشاطئ، شيّدها النفط أكثر مما شيّدها الميناء الحر القصير العمر
    (1878-1886). فمع وصول خط سكة حديد باكو-باتومي عام 1883، أصبحت باتومي بوابة النفط الكبرى للإمبراطورية؛
    وفي عام 1892 حمّلت الناقلة "موركس" الكيروسين من هنا وأصبحت أول ناقلة تعبر قناة السويس. وما زال ذلك
    المال حاضرًا في الأبواب المنحوتة والشرفات الحديدية المطروقة وكاتدرائية والدة الإله القوطية الجديدة
    (1898-1903) التي بناها الإخوة زوبالاشفيلي على حسابهم. أما الساحة (البياتزا) والساعة الفلكية فإضافتان
    من عام 2010: جميلتان، لكنهما لم تصبحا تاريخًا بعد.


    أدجارا أكثر أقاليم جورجيا مطرًا، وكثيرًا ما يكون الوابل هو ما يترك لك الكورنيش وحدك.
  tip: >-
    في الصيف تكون السيارة في وسط المدينة وقتًا ضائعًا: اتركها عند الفندق وتجوّل على الكورنيش سيرًا أو
    بدراجة مستأجرة. مواقف الشوارع مدفوعة، وتُسدَّد غالبًا عبر تطبيق هاتفي أو رسالة نصية، وهذا ما يُحيّر
    الزائر أول مرة أكثر من السعر نفسه، فاسأل فندقك كيف يعمل النظام قبل أن تخرج. المساء أفضل وقت: يخفّ
    الحرّ، ويبدأ "علي ونينو" بالحركة من السابعة مساءً، وتغرب الشمس في البحر عند المنارة. ضع مظلة أو معطفًا
    خفيفًا واقيًا من المطر في حقيبتك، لا في صندوق السيارة. أجهزة الصراف الآلي والصيدليات والمقاهي في كل
    مكان، والبطاقات مقبولة في وسط المدينة كله.
  route: >-
    تبعد باتومي عن تبليسي 370 كم، أي نحو خمس ساعات ونصف على أحد أفضل طرق البلاد. اتجه غربًا على الطريق
    E60 عبر غوري وخاشوري وأنفاق ريكوتي وكوتايسي إلى سامتريديا، ثم على الطريق S12 عبر لانتشخوتي إلى الساحل
    عند غريغوليتي، ثم جنوبًا عبر كوبوليتي إلى باتومي. الطريق مُعبّد بالكامل ومعظمه بمسارين في كل اتجاه،
    فتكفي سيارة اقتصادية تمامًا. محطات الوقود قريبة دائمًا، وتكثر في خاشوري وكوتايسي. في عطلات نهاية الأسبوع
    الصيفية انطلق مبكرًا، فازدحام الساحل يبدأ من أواخر الصباح.
