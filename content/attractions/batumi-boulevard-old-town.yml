ka:
  name: ბათუმის ბულვარი და ძველი ქალაქი
  short: შვიდკილომეტრიანი სანაპირო ბულვარი, XIX საუკუნის ძველი უბანი და თანამედროვე მაღლივები ერთ ქალაქში.
  body: >-
    ბათუმი აჭარის დედაქალაქი და შავი ზღვის ქართული სანაპიროს მთავარი ქალაქია. მისი დათვალიერება ორ ნაწილად
    იყოფა, რომლებიც ერთმანეთისგან სულ ათი წუთის სავალზეა.


    პირველი — ბულვარი. ის 1880-იან წლებში დაარსდა და დღეს შვიდ კილომეტრზე მეტს ითვლის: კენჭოვანი პლაჟი
    ერთ მხარეს, ალეები, ველობილიკები, ფონტანები და ქანდაკებები მეორეზე. ბულვარის ყველაზე ცნობილი ობიექტი
    მოძრავი ქანდაკება „ალი და ნინოა", რომელიც ყოველ საღამოს ორ ფიგურას ერთმანეთში ატარებს. აქვეა ანბანის
    კოშკი და თანამედროვე მაღლივი შენობების ჯგუფი, რომელმაც ქალაქის სილუეტი ბოლო ორ ათწლეულში მთლიანად
    შეცვალა.


    მეორე — ძველი ქალაქი. XIX საუკუნის ბოლოს ბათუმი პორტი და თავისუფალი ვაჭრობის ცენტრი იყო, ამიტომ აქაური
    არქიტექტურა ევროპულია: ორ-სამსართულიანი სახლები აივნებით, პიაცის მოედანი, ასტრონომიული საათი და ვიწრო
    ქუჩები კაფეებით.


    რაზეც უნდა იცოდეთ წინასწარ: **აჭარა საქართველოს ყველაზე ნოტიო რეგიონია.** ბათუმში წელიწადში დაახლოებით
    ორნახევარი ათასი მილიმეტრი ნალექი მოდის და წვიმა ზაფხულშიც სავსებით შესაძლებელია — რამდენიმე დღიანი
    ვიზიტი ერთი ცუდი დღით ხშირად წყდება. ეს არ არის გარანტირებული მზის კურორტი და ამის ცოდნა უმჯობესია
    წინასწარ.
  tip: >-
    ქალაქის ცენტრში მანქანით სიარული ზაფხულში არაეფექტურია — პარკინგი ძვირია და ხშირად სავსე. სასტუმროსთან
    დატოვეთ ავტომობილი და ბულვარზე ველოსიპედით ან ფეხით იმოძრავეთ. ბულვარის საუკეთესო დროა საღამო, როცა
    ცხელა ნაკლებად და ფონტანები მუშაობს. წვიმის ალბათობა მაღალია მთელი წლის განმავლობაში, ამიტომ ქოლგა
    ან წვიმის ქურთუკი ჩანთაში გქონდეთ. ბანკომატები, აფთიაქები და კაფეები ყველგანაა; ბარათით გადახდა ცენტრში
    პრობლემა არაა.
  route: >-
    თბილისიდან ბათუმამდე 370 კმ და დაახლოებით ხუთნახევარი საათია — ეს ქვეყნის ყველაზე კარგი გზაა. E60-ით
    მიდიხართ გორის, ხაშურის, რიკოთის ახალი მაგისტრალის, ქუთაისისა და სამტრედიის გავლით, შემდეგ სანაპიროზე
    ჩადიხართ და ქობულეთის გავლით ბათუმში შედიხართ. მთელი მარშრუტი ასფალტია, დიდი ნაწილი ავტობანი — ეკონომ
    კლასის ავტომობილიც სავსებით საკმარისია. საწვავის აღება ყველგან შეიძლება. ზაფხულის შაბათ-კვირას ადრე
    გამგზავრება ჯობია, სანაპიროზე საცობები ჩვეულებრივია.
en:
  name: Batumi Boulevard and Old Town
  short: A seven-kilometre seafront promenade, a nineteenth-century old quarter and modern towers in one
    compact city.
  body: >-
    Batumi is the capital of Adjara and the main city on Georgia's Black Sea coast. Seeing it divides
    neatly into two parts that lie about ten minutes' walk apart.


    The first is the Boulevard. Laid out in the 1880s, it now runs for more than seven kilometres: pebble
    beach on one side, avenues, cycle paths, fountains and sculptures on the other. Its most famous fixture
    is the moving sculpture Ali and Nino, whose two figures pass through each other every evening. Nearby
    stand the Alphabet Tower and the cluster of modern high-rises that has completely rewritten the city
    skyline over the past two decades.


    The second is the old town. In the late nineteenth century Batumi was a port and a free-trade centre,
    and the architecture reflects that: two- and three-storey buildings with deep balconies, the Piazza
    square, an astronomical clock and narrow streets full of cafes.


    One thing to know in advance: **Adjara is the wettest region in Georgia.** Batumi receives roughly
    two and a half thousand millimetres of rain a year, and downpours are entirely possible in July and
    August. A three-day visit is often interrupted by one wet day. This is not a guaranteed-sunshine resort,
    and it is better to plan around that than be surprised by it.
  tip: >-
    Driving in the centre in summer is inefficient: parking is expensive and often full. Leave the car
    at your hotel and use the boulevard on foot or by rented bicycle. Evening is the best time on the
    promenade, when the heat drops and the fountains run. Rain is likely in any month, so keep an umbrella
    or a light shell in your bag rather than in the boot. ATMs, pharmacies and cafes are everywhere, and
    card payment is not a problem in the centre.
  route: >-
    Tbilisi to Batumi is 370 km and about five and a half hours on the best road in the country. Follow
    the E60 through Gori, Khashuri, the new Rikoti tunnel section, Kutaisi and Samtredia, then drop down
    to the coast and enter Batumi past Kobuleti. The whole route is paved and much of it is dual carriageway,
    so an economy car is entirely sufficient. Fuel is available everywhere along the way. On summer weekends
    set off early, as coastal traffic backs up from mid-morning onward.
ru:
  name: Батумский бульвар и старый город
  short: Семикилометровая набережная, квартал XIX века и современные высотки в одном компактном городе.
  body: >-
    Батуми — столица Аджарии и главный город грузинского черноморского побережья. Осмотр делится на две
    части, которые разделяют минут десять пешком.


    Первая — Бульвар. Заложенный в 1880-х, сегодня он тянется больше чем на семь километров: галечный
    пляж с одной стороны, аллеи, велодорожки, фонтаны и скульптуры с другой. Самый известный его объект
    — движущаяся скульптура «Али и Нино», две фигуры которой каждый вечер проходят друг сквозь друга.
    Рядом стоят Башня алфавита и группа современных высоток, полностью переписавших силуэт города за последние
    два десятилетия.


    Вторая — старый город. В конце XIX века Батуми был портом и центром свободной торговли, и архитектура
    это отражает: двух- и трёхэтажные дома с глубокими балконами, площадь Пьяцца, астрономические часы
    и узкие улицы с кафе.


    О чём стоит знать заранее: **Аджария — самый влажный регион Грузии.** В Батуми выпадает около двух
    с половиной тысяч миллиметров осадков в год, и ливни вполне возможны в июле и августе. Трёхдневный
    визит часто прерывается одним дождливым днём. Это не курорт с гарантированным солнцем, и лучше планировать
    поездку с учётом этого.
  tip: >-
    Ездить по центру летом неэффективно: парковка дорогая и часто занята. Оставьте машину у отеля и передвигайтесь
    по бульвару пешком или на прокатном велосипеде. Лучшее время на набережной — вечер, когда спадает
    жара и работают фонтаны. Дождь вероятен в любой месяц, поэтому зонт или лёгкая куртка должны быть
    в сумке, а не в багажнике. Банкоматы, аптеки и кафе есть повсюду, оплата картой в центре не проблема.
  route: >-
    От Тбилиси до Батуми 370 км и около пяти с половиной часов по лучшей дороге страны. По трассе E60
    через Гори, Хашури, новый Рикотский тоннельный участок, Кутаиси и Самтредиа, затем спуск к побережью
    и въезд в Батуми мимо Кобулети. Весь маршрут асфальтированный, значительная часть — скоростная дорога,
    машины эконом-класса вполне достаточно. Заправки есть на всём пути. В летние выходные выезжайте рано:
    движение по побережью плотнеет уже с середины утра.
fa:
  name: گردشگاه باتومی و شهر قدیم
  short: گردشگاهی هفت‌کیلومتری کنار دریا، محله‌ای قدیمی از سدهٔ نوزدهم و برج‌های مدرن در یک شهر جمع‌وجور.
  body: >-
    باتومی مرکز آجارا و شهر اصلی ساحل دریای سیاه گرجستان است. دیدن آن به‌روشنی به دو بخش تقسیم می‌شود
    که حدود ده دقیقه پیاده از هم فاصله دارند.


    بخش نخست گردشگاه است. طرح آن به دههٔ 1880 برمی‌گردد و امروز بیش از هفت کیلومتر امتداد دارد: ساحل سنگریزه‌ای
    در یک سو، خیابان‌های درختی، مسیر دوچرخه، فواره و مجسمه در سوی دیگر. مشهورترین عنصر آن مجسمهٔ متحرک
    «علی و نینو» است که دو پیکرش هر عصر از میان یکدیگر می‌گذرند. نزدیک آن برج الفبا و مجموعهٔ برج‌های
    مدرن ایستاده‌اند که در دو دههٔ گذشته خط آسمان شهر را کاملاً از نو نوشته‌اند.


    بخش دوم شهر قدیم است. در اواخر سدهٔ نوزدهم باتومی بندر و مرکز تجارت آزاد بود و معماری همین را بازتاب
    می‌دهد: ساختمان‌های دو و سه‌طبقه با بالکن‌های عمیق، میدان پیاتزا، یک ساعت نجومی و کوچه‌های باریک پر
    از کافه.


    یک نکته را از پیش بدانید: **آجارا مرطوب‌ترین منطقهٔ گرجستان است.** باتومی سالانه حدود دو هزار و پانصد
    میلی‌متر باران دریافت می‌کند و رگبار در ژوئیه و اوت هم کاملاً ممکن است. سفری سه‌روزه اغلب با یک روز
    بارانی قطع می‌شود. اینجا آفتاب تضمین‌شده نیست و بهتر است از ابتدا با همین فرض برنامه بریزید تا اینکه
    غافلگیر شوید.
  tip: >-
    رانندگی در مرکز شهر در تابستان بی‌فایده است: پارکینگ گران و اغلب پر است. خودرو را در هتل بگذارید و
    گردشگاه را پیاده یا با دوچرخهٔ کرایه‌ای بگردید. عصر بهترین وقت گردشگاه است، وقتی گرما می‌شکند و فواره‌ها
    کار می‌کنند. باران در هر ماهی محتمل است، پس چتر یا بارانی سبک را در کیف نگه دارید نه در صندوق عقب.
    خودپرداز، داروخانه و کافه همه‌جا هست و پرداخت با کارت در مرکز مشکلی ندارد.
  route: >-
    تفلیس تا باتومی 370 کیلومتر و حدود پنج ساعت و نیم روی بهترین جادهٔ کشور است. E60 را از گوری، خاشوری،
    مقطع تازهٔ تونل ریکوتی، کوتایسی و سامتردیا دنبال کنید، سپس به ساحل پایین بروید و از کنار کوبولتی وارد
    باتومی شوید. کل مسیر آسفالت است و بخش بزرگی از آن دوبانده جداشده، پس خودروی اقتصادی کاملاً کافی است.
    سوخت در تمام طول راه موجود است. آخر هفته‌های تابستان زود راه بیفتید، چون ترافیک ساحلی از اواسط صبح
    به بعد سنگین می‌شود.
he:
  name: טיילת בטומי והעיר העתיקה
  short: טיילת ים באורך שבעה קילומטרים, רובע ישן מן המאה ה-19 ומגדלים מודרניים בעיר קומפקטית אחת.
  body: >-
    בטומי היא בירת אג'ריה והעיר המרכזית בחוף הים השחור של גאורגיה. הביקור בה מתחלק בבירור לשני חלקים המרוחקים
    כעשר דקות הליכה זה מזה.


    הראשון הוא הטיילת. היא הותוותה בשנות ה-1880 ונמתחת היום ליותר משבעה קילומטרים: חוף חלוקים בצד אחד,
    שדרות, שבילי אופניים, מזרקות ופסלים בצד השני. המתקן המפורסם ביותר שלה הוא הפסל הנע "עלי ונינו", ששתי
    דמויותיו עוברות זו דרך זו מדי ערב. בסמוך ניצבים מגדל האלפבית ואשכול רבי הקומות המודרניים ששכתב לחלוטין
    את קו הרקיע של העיר בשני העשורים האחרונים.


    השני הוא העיר העתיקה. בסוף המאה ה-19 הייתה בטומי נמל ומרכז סחר חופשי, והאדריכלות משקפת זאת: מבנים
    בני שתיים ושלוש קומות עם מרפסות עמוקות, כיכר הפיאצה, שעון אסטרונומי וסמטאות מלאות בתי קפה.


    דבר אחד כדאי לדעת מראש: **אג'ריה היא האזור הגשום ביותר בגאורגיה.** בטומי מקבלת כאלפיים וחמש מאות מילימטר
    גשם בשנה, וממטרים עזים אפשריים לחלוטין גם ביולי ובאוגוסט. ביקור בן שלושה ימים נקטע לא פעם ביום רטוב
    אחד. זה אינו אתר נופש עם שמש מובטחת, ועדיף לתכנן סביב זה מאשר להיות מופתעים.
  tip: >-
    נהיגה במרכז בקיץ אינה יעילה: החניה יקרה ולעיתים קרובות מלאה. השאירו את הרכב במלון והסתובבו על הטיילת
    ברגל או באופניים שכורים. הערב הוא הזמן הטוב ביותר על הטיילת, כשהחום יורד והמזרקות פועלות. גשם סביר
    בכל חודש, אז החזיקו מטרייה או מעיל קל בתיק ולא בתא המטען. כספומטים, בתי מרקחת ובתי קפה יש בכל מקום,
    ותשלום בכרטיס אינו בעיה במרכז.
  route: >-
    מטביליסי לבטומי 370 ק״מ וכחמש שעות וחצי על הכביש הטוב ביותר במדינה. עקבו אחרי E60 דרך גורי, חשורי,
    קטע מנהרות ריקוטי החדש, קוטאיסי וסמטרדיה, ואז רדו אל החוף והיכנסו לבטומי אחרי קובולטי. כל המסלול סלול
    וחלק ניכר ממנו דו-מסלולי, ולכן רכב חסכוני מספיק לחלוטין. דלק זמין לכל אורך הדרך. בסופי שבוע של קיץ
    צאו מוקדם, כי התנועה בחוף נערמת מאמצע הבוקר ואילך.
ar:
  name: كورنيش باتومي والمدينة القديمة
  short: كورنيش بحري بطول سبعة كيلومترات وحي قديم من القرن التاسع عشر وأبراج حديثة في مدينة واحدة صغيرة.
  body: >-
    باتومي عاصمة أدجارا والمدينة الرئيسية على ساحل جورجيا المطل على البحر الأسود. وزيارتها تنقسم بوضوح
    إلى شطرين يفصل بينهما نحو عشر دقائق سيراً.


    الأول هو الكورنيش. خُطط في عقد 1880، وهو يمتد اليوم أكثر من سبعة كيلومترات: شاطئ حصوي في جهة، وجادات
    وممرات دراجات ونوافير ومنحوتات في الجهة الأخرى. وأشهر معالمه المنحوتة المتحركة «علي ونينو»، التي يمر
    تمثالاها أحدهما عبر الآخر كل مساء. وإلى جوارها يقف برج الأبجدية ومجموعة الأبراج الحديثة التي أعادت
    كتابة أفق المدينة تماماً خلال العقدين الماضيين.


    والثاني هو المدينة القديمة. كانت باتومي في أواخر القرن التاسع عشر ميناءً ومركزاً للتجارة الحرة، والعمارة
    تعكس ذلك: مبانٍ من طابقين وثلاثة بشرفات عميقة، وساحة بياتزا، وساعة فلكية، وشوارع ضيقة تعج بالمقاهي.


    وثمة أمر ينبغي معرفته سلفاً: **أدجارا أكثر مناطق جورجيا مطراً.** تتلقى باتومي نحو ألفين وخمسمئة مليمتر
    من المطر سنوياً، والزخات الغزيرة ممكنة تماماً في يوليو وأغسطس. وكثيراً ما تتخلل زيارة من ثلاثة أيام
    يوم ممطر واحد. فهذا ليس منتجع شمس مضمونة، والأفضل أن تخطط على هذا الأساس بدل أن تفاجأ به.
  tip: >-
    القيادة في المركز صيفاً غير مجدية: فالمواقف غالية وممتلئة في الغالب. اترك السيارة في الفندق وتجول
    على الكورنيش سيراً أو بدراجة مستأجرة. والمساء أفضل الأوقات على الممشى، حين تخف الحرارة وتعمل النوافير.
    والمطر وارد في أي شهر، فاحتفظ بمظلة أو معطف خفيف في حقيبتك لا في صندوق السيارة. أجهزة الصراف والصيدليات
    والمقاهي في كل مكان، والدفع بالبطاقة ليس مشكلة في المركز.
  route: >-
    من تبليسي إلى باتومي 370 كم ونحو خمس ساعات ونصف على أفضل طريق في البلاد. اتبع الطريق E60 عبر غوري
    وخاشوري ومقطع أنفاق ريكوتي الجديد وكوتايسي وسامتريديا، ثم انزل إلى الساحل وادخل باتومي بعد كوبوليتي.
    الطريق كله معبّد وجزء كبير منه مزدوج، فسيارة اقتصادية تكفي تماماً. والوقود متوفر على طول الطريق. وفي
    عطلات نهاية الأسبوع الصيفية انطلق مبكراً، إذ تتراكم حركة الساحل من منتصف الصباح فصاعداً.
