ka:
  name: პეტრას ციხე (ციხისძირი)
  short: >-
    იუსტინიანეს VI საუკუნის ციხე-ქალაქი ციხისძირში, ზღვისპირა კლდოვან ბორცვებზე, ეგრისის ომის ერთ-ერთი
    მთავარი ასპარეზი.
  body: >-
    **541 წელს სასანიანთა მეფე ხოსრო I-მა პეტრა კედლებზე გადასვლით კი არა, მიწის ქვეშიდან აიღო: ფარულად
    გათხრილი გვირაბით.**


    ციხე-ქალაქი მაშინ ჯერ კიდევ ახალი იყო. იუსტინიანეს ერთ-ერთ კანონში ის 535 წელს იხსენიება; იმპერატორის
    პატივსაცემად მას „პეტრა პია იუსტინიანა“ უწოდეს. ციხე რომაელი მოხელის, იოანე ციბოსის, თაოსნობით აშენდა,
    რომელმაც შემდეგ ლაზიკაში (ეგრისში) შემოტანილი საქონელი, მათ შორის მარილი, ხელში ჩაიგდო. ბერძნული სახელი,
    „კლდე“, ადგილს ზედგამოჭრილად შეეფერებოდა: ყოველი მხრიდან ზღვა და კლდე, ერთადერთი ვიწრო მისასვლელი
    კი ორკოშკიანი კედლით იყო ჩაკეტილი.


    ციბოსის მონოპოლიამ ლაზები რომს გადაკიდა და მათმა მეფე გუბაზ II-მ ფარულად ირანს სთხოვა შემწეობა. გვირაბის
    შემდეგ სპარსელებმა პეტრა 548–549 წლების რომაულ-ლაზური ალყის დროსაც შეინარჩუნეს. 551 წელს სარდალ ბესას
    მეთაურობით ახალი რომაულ-ლაზური ლაშქარი მოვიდა; წელიწადზე მეტი ხნის ალყის შემდეგ ქალაქი დაეცა და ბესამ
    მისი ციხე მიწასთან გაასწორა, რომ ირანს იგი აღარასოდეს გამოეყენებინა. არქეოლოგია უფრო მშვიდ გაგრძელებას
    მოგვითხრობს: კედლებს აღადგენდნენ და იყენებდნენ VII საუკუნეშიც და მის შემდეგაც.


    დღეს აქ ციხისძირი-პეტრას არქეოლოგიურ-არქიტექტურული მუზეუმ-ნაკრძალია: ორ კლდოვან ზღვისპირა ბორცვზე
    გაშლილი ციტადელი, დაახლოებით 200 მეტრი სიგრძისა და 100 მეტრი სიგანისა. დააკვირდით:

    - VI საუკუნის დიდი სამნავიანი ბაზილიკის საძირკველს, კარიბჭითა და მოზაიკური იატაკით, სავარაუდოდ საეპისკოპოსო
    ტაძარს

    - აბანოსა და წყლის რეზერვუარს

    - ახლომახლო სამაროვანს, სადაც სამასზე მეტი სამარხია


    მკვლევართა უმრავლესობა, 1670-იან წლებში იერუსალიმის პატრიარქ დოსითეოსიდან 1949 წლის სიმონ ჯანაშიამდე,
    ამ ნანგრევებს პროკოპი კესარიელის პეტრასთან აიგივებს; ზოგიერთ მეცნიერს ამაში დღესაც ეჭვი ეპარება.


    დღის ბოლოს ზედა ბორცვზე ადით: ქვემოთ ზღვაა, სანაპიროს ბათუმის გზა მიუყვება, ფეხქვეშ კი ქალაქია, რომელიც
    იმპერატორმა ააშენა, მტრის მეფემ მიწის ქვეშიდან აიღო, საკუთარმა ჯარმა კი დაანგრია.
  tip: >-
    პეტრა ბილეთიანი მუზეუმ-ნაკრძალია და 10:00–18:00 საათებში მუშაობს: უცხო ქვეყნის მოქალაქისთვის შესვლა
    15 ლარია, საქართველოს ზრდასრული მოქალაქისთვის 10 ლარი, უცხოენოვანი ექსკურსია კი 35 ლარი ღირს. ერთი
    საათი საკმარისია. კლდეზე ბილიკები ქვიანი და ადგილ-ადგილ ციცაბოა, წვიმის შემდეგ კი სრიალა, ამიტომ დახურული
    ფეხსაცმელი ჩაიცვით. ჩრდილი ცოტაა: ზაფხულის შუადღეს მოერიდეთ და საღამოსკენ ჩამოდით, როცა ზღვაზე საუკეთესო
    სინათლეა. მანქანა მაგისტრალის პირას, მონიშნულ ადგილზე დატოვეთ. კაფეები ქობულეთისკენ მიმავალ გზაზეა,
    უახლოესი ბანკომატები კი ქობულეთში, ათიოდე წუთის სავალზე.
  route: >-
    თბილისიდან დაახლოებით 355 კმ და ხუთი საათი და ოცი წუთია. ს1 (E60) მაგისტრალით გაიარეთ გორი, ხაშური,
    რიკოთის უღელტეხილი და ქუთაისი სამტრედიამდე, შემდეგ ს12-ით ლანჩხუთის გავლით გრიგოლეთამდე და ს2-ით სამხრეთით,
    ზღვის გაყოლებით, ქობულეთის გავლით. ციხისძირი პირდაპირ ს2-ზე, ქობულეთსა და ბათუმს შორისაა, ბათუმამდე
    დაახლოებით 17 კმ-ით ადრე, ამიტომ გადახვევა არ დაგჭირდებათ. გზა ბოლომდე ასფალტიანია და ეკონომკლასის
    ავტომობილიც სავსებით საკმარისია. საწვავი ქობულეთში ან მაგისტრალის ახლომდებარე სადგურზე ჩაასხით.
en:
  name: Petra Fortress, Tsikhisdziri
  short: >-
    Justinian's 6th-century fortress-city on two rocky hills above the sea at Tsikhisdziri, fought over
    through the whole of the Lazic War.
  body: >-
    **In 541 the Persian king Khosrow I took Petra not over its walls but from beneath them, through a
    tunnel his men had dug in secret.**


    The fortress-city was still new. A law of Justinian mentions it in 535; it was named Petra Pia Justiniana
    in the emperor's honour and built through the efforts of John Tzibus, a Roman official who then took
    control of Lazica's imports, salt among them. Its Greek name, ‘rock’, fitted the site: sea and cliffs
    on every side, and a single narrow approach closed by a wall with two towers.


    Tzibus's monopoly turned the Lazi against Rome, and their king Gubazes secretly called in Persia.
    After the tunnel, the Persians held Petra against a Roman–Lazi siege in 548–549. In 551 a new Roman–Lazi
    army came under the general Bessas; after more than a year the city fell, and he razed its fortress
    so that Persia could never use it again. Archaeology adds a quieter sequel: the walls were repaired
    and kept in use into the 7th century and beyond.


    Today the site is the Tsikhisdziri–Petra archaeological museum-reserve, a citadel roughly 200 by 100
    metres spread over two rocky hills by the sea. Look for:

    - the foundations of a large 6th-century three-aisled basilica with a narthex and mosaic floor, probably
    a bishop's church

    - a bath house and a water cistern

    - a cemetery of more than 300 graves nearby


    Most scholars, from Patriarch Dositheos of Jerusalem in the 1670s to Simon Janashia in 1949, identify
    these ruins with the Petra of Procopius; a few still doubt it.


    Climb the upper hill late in the day: the sea below, the Batumi road threading the shore, and underfoot
    a city that an emperor built, a king took from below and its own army pulled down.
  tip: >-
    Petra is a ticketed museum-reserve, open 10:00–18:00: 15 GEL for foreign visitors, 10 GEL for Georgian
    adults, and 35 GEL for a guided tour in a foreign language. An hour is enough. The paths over the
    rock are stony, steep in places and slick after rain, so wear closed shoes. There is little shade;
    avoid summer middays and come in the late afternoon, when the light over the sea is best. Park in
    the marked area beside the main road. Cafés line the road towards Kobuleti, and the nearest cash machines
    are in Kobuleti, ten minutes away.
  route: >-
    About 355 km and five hours twenty from Tbilisi. Take the S1 (E60) past Gori and Khashuri, over the
    Rikoti Pass and past Kutaisi to Samtredia, then the S12 through Lanchkhuti to Grigoleti and the S2
    south along the coast through Kobuleti. Tsikhisdziri lies right on the S2 between Kobuleti and Batumi,
    about 17 km short of Batumi, so there is no detour. It is asphalt all the way, and an economy car
    is all you need. Fuel up in Kobuleti or at the station on the main road nearby.
ru:
  name: Крепость Петра, Цихисдзири
  short: >-
    Крепость-город Юстиниана VI века на двух скалистых холмах над морем в Цихисдзири, за который шла борьба
    всю Лазскую войну.
  body: >-
    **В 541 году персидский царь Хосров I взял Петру не штурмом стен, а из-под них — по тоннелю, который
    его люди тайно прокопали.**


    Крепость-город была тогда совсем новой. Закон Юстиниана упоминает её в 535 году; она получила имя
    Петра Пия Юстиниана в честь императора и была построена благодаря усилиям Иоанна Цибуса, римского
    чиновника, который затем взял под контроль ввоз товаров в Лазику, в том числе соли. Греческое имя
    — «скала» — точно описывало место: со всех сторон море и обрывы, а единственный узкий подход был закрыт
    стеной с двумя башнями.


    Монополия Цибуса обратила лазов против Рима, и их царь Губаз тайно призвал Персию. Взяв город подкопом,
    персы удержали Петру и во время римско-лазской осады 548–549 годов. В 551 году сюда пришло новое римско-лазское
    войско во главе с полководцем Бессой; спустя больше года город пал, и Бесса срыл его крепость, чтобы
    Персия не смогла воспользоваться ею вновь. Археология добавляет более тихое продолжение: стены восстанавливали
    и использовали и в VII веке, и позже.


    Сегодня здесь музей-заповедник Цихисдзири–Петра, цитадель площадью примерно 200 на 100 метров на двух
    скалистых холмах у моря. Обратите внимание на:

    - фундамент большой трёхнефной базилики VI века с нартексом и мозаичным полом — вероятно, епископского
    храма

    - баню и водную цистерну

    - неподалёку — некрополь, где более 300 могил


    Большинство учёных, от иерусалимского патриарха Досифея в 1670-х до Симона Джанашиа в 1949 году, отождествляют
    эти руины с Петрой Прокопия; лишь немногие до сих пор сомневаются.


    Поднимитесь на верхний холм в конце дня: море внизу, батумская дорога, вьющаяся вдоль берега, а под
    ногами — город, который построил император, взял снизу царь и разрушила его собственная армия.
  tip: >-
    Петра — платный музей-заповедник, открыт с 10:00 до 18:00: 15 лари для иностранных гостей, 10 лари
    для взрослых граждан Грузии и 35 лари за экскурсию на иностранном языке. Часа достаточно. Тропы по
    скале каменистые, местами крутые и скользкие после дождя, поэтому нужна закрытая обувь. Тени мало;
    избегайте летнего полудня и приезжайте под вечер, когда свет над морем особенно хорош. Машину оставляйте
    на обозначенной площадке у главной дороги. Кафе тянутся вдоль дороги к Кобулети, а ближайшие банкоматы
    — в Кобулети, десять минут езды.
  route: >-
    От Тбилиси около 355 км, примерно 5 часов 20 минут езды. Езжайте по S1 (E60) через Гори и Хашури,
    через Рикотский перевал и Кутаиси до Самтредиа, затем по S12 через Ланчхути до Григолети и по S2 на
    юг вдоль побережья через Кобулети. Цихисдзири лежит прямо на S2 между Кобулети и Батуми, всего в 17
    км от Батуми, так что крюк не нужен. Дорога асфальтирована на всём протяжении, автомобиля экономкласса
    вполне достаточно. Заправляйтесь в Кобулети или на станции у главной дороги рядом.
fa:
  name: قلعهٔ پترا، تسیخیسدزیری
  short: >-
    شهر-قلعهٔ ژوستینیانوس از سدهٔ ششم بر دو تپهٔ صخره‌ای بالای دریا در تسیخیسدزیری، که در سراسر جنگ لازیکا
    بر سر آن نبرد شد.
  body: >-
    **در سال ۵۴۱ میلادی، خسرو یکم، شاه ایران، پترا را نه از بالای دیوارهایش که از زیر آن‌ها گشود، از راه
    تونلی که مردانش پنهانی کنده بودند.**


    آن شهر-قلعه هنوز نوپا بود. قانونی از ژوستینیانوس در سال ۵۳۵ نام آن را می‌آورد؛ به افتخار امپراتور
    «پترا پیا ژوستینیانا» نامیده شد و به کوشش یوحنا تسیبوس بنا شد، کارگزار رومی‌ای که سپس واردات لازیکا،
    از جمله نمک، را در دست گرفت. نام یونانی آن، به معنای «صخره»، دقیقاً با جای آن می‌خواند: از هر سو دریا
    و صخره، و تنها یک راه دسترسی باریک که با دیواری و دو برج بسته می‌شد.


    انحصار تسیبوس لازها را علیه روم برانگیخت، و پادشاهشان گوبازس پنهانی از ایران یاری خواست. پس از حفر
    تونل، ایرانیان پترا را در برابر محاصرهٔ مشترک رومی‌ها و لازها در سال‌های ۵۴۸–۵۴۹ نگاه داشتند. در سال
    ۵۵۱ سپاهی تازه از رومیان و لازها به فرماندهی ژنرال بساس فرا رسید؛ پس از بیش از یک سال شهر سقوط کرد
    و او قلعهٔ آن را ویران کرد تا دیگر هرگز در دست ایران نیفتد. باستان‌شناسی دنباله‌ای آرام‌تر افزوده
    است: دیوارها بازسازی و تا سدهٔ هفتم و پس از آن همچنان به کار گرفته شدند.


    امروز این محل موزه-ذخیره‌گاه باستانی تسیخیسدزیری–پترا است، ارگی به‌گستردگی تقریبی ۲۰۰ در ۱۰۰ متر بر
    دو تپهٔ صخره‌ای کنار دریا. این‌ها را ببینید:

    - پی‌های یک بازیلیکای بزرگ سه‌شبستانی از سدهٔ ششم با دهلیز ورودی و کف موزاییکی، احتمالاً کلیسایی اسقفی

    - یک گرمابه و یک آب‌انبار

    - گورستانی با بیش از ۳۰۰ آرامگاه در نزدیکی


    بیشتر پژوهشگران، از پاتریارک دوسیتئوس اورشلیم در دههٔ ۱۶۷۰ تا سیمون جانشیا در سال ۱۹۴۹، این ویرانه‌ها
    را همان پترای پروکوپیوس می‌دانند؛ تنها معدودی هنوز در تردیدند.


    در پایان روز به تپهٔ بالایی بروید: دریا در زیر، راه باتومی که کنار ساحل می‌پیچد، و زیر پا شهری که
    یک امپراتور ساخت، یک پادشاه از زیرش گشود و سپاه خودش ویرانش کرد.
  tip: >-
    پترا موزه-ذخیره‌گاهی با بلیت ورودی است و از ساعت ۱۰ تا ۱۸ باز است: ۱۵ لاری برای بازدیدکنندگان خارجی،
    ۱۰ لاری برای بزرگسالان گرجی، و ۳۵ لاری برای تور راهنما به زبانی خارجی. یک ساعت کافی است. مسیرهای روی
    صخره سنگلاخ‌اند، جاهایی شیب‌دار و پس از باران لزج؛ پس کفشی بسته بپوشید. سایه اندک است؛ از ظهرهای تابستان
    بپرهیزید و اواخر بعدازظهر بیایید، وقتی نور بالای دریا بهترین حالت را دارد. ماشین را در محوطهٔ نشان‌دار
    کنار جادهٔ اصلی پارک کنید. کافه‌ها در امتداد راه به‌سوی کوبولتی ردیف شده‌اند، و نزدیک‌ترین دستگاه‌های
    خودپرداز در کوبولتی است، ده دقیقه آن‌سوتر.
  route: >-
    حدود ۳۵۵ کیلومتر و پنج ساعت و بیست دقیقه از تفلیس. مسیر S1 (E60) را از کنار گوری و خاشوری بگیرید،
    از گذرگاه ریکوتی و کنار کوتایسی تا سامتردیا بروید، سپس S12 را از لانچخوتی تا گریگولتی و S2 را رو به
    جنوب در امتداد ساحل تا کوبولتی. تسیخیسدزیری درست بر مسیر S2 میان کوبولتی و باتومی قرار دارد، تنها
    ۱۷ کیلومتر پیش از باتومی، پس نیازی به انحراف نیست. تمام راه آسفالت است و خودروی اقتصادی کافی است.
    باک را در کوبولتی یا در ایستگاه سوخت کنار جادهٔ اصلی، همان نزدیکی، پر کنید.
he:
  name: מבצר פטרה, ציחיסדזירי
  short: עיר-מבצר מהמאה ה-6 של יוסטיניאנוס על שתי גבעות סלעיות מעל הים בציחיסדזירי, שעליה נלחמו במשך כל
    מלחמת לאזיקה.
  body: >-
    **בשנת 541 לכד המלך הפרסי כוסרו הראשון את פטרה לא מעל החומות אלא מתחתן, דרך מנהרה שאנשיו כרו בסתר.**


    עיר-המבצר הייתה עדיין חדשה. חוק של יוסטיניאנוס מזכיר אותה ב-535; היא נקראה פטרה פיה יוסטיניאנה לכבוד
    הקיסר ונבנתה במאמציו של יוחנן ציבוס, פקיד רומי שלאחר מכן נטל לידיו את השליטה בייבוא ללאזיקה, כולל
    המלח. שמה היווני, 'סלע', התאים למקום: ים ומצוקים מכל עבר, וגישה יחידה וצרה שנחסמה בחומה עם שני מגדלים.


    המונופול של ציבוס הפך את הלאזים לאויבי רומא, ומלכם גובזס קרא בסתר לפרסים לעזרה. לאחר שכבשו אותה דרך
    המנהרה, החזיקו הפרסים בפטרה גם מול מצור רומי-לאזי בשנים 548–549. ב-551 הגיע צבא רומי-לאזי חדש בפיקוד
    המצביא בסאס; אחרי יותר משנה נכבשה העיר, והוא החריב את המצודה עד היסוד כדי שפרס לא תוכל להשתמש בה עוד.
    הארכיאולוגיה מוסיפה המשך שקט יותר: החומות תוקנו והמשיכו לשמש עד המאה ה-7 ואף אחריה.


    כיום זהו שמורה-מוזיאון ארכיאולוגית ציחיסדזירי–פטרה, מצודה בגודל של כ-200 על 100 מטר, המשתרעת על שתי
    גבעות סלעיות סמוך לים. שימו לב ל:

    - יסודות של בזיליקה גדולה בת שלוש ספינות מהמאה ה-6, עם פרוזדור וריצוף פסיפס, ככל הנראה כנסיית בישוף

    - מרחץ ובור מים

    - בית קברות של יותר מ-300 קברים בקרבת מקום


    רוב החוקרים, מהפטריארך דוסיתאוס של ירושלים בשנות ה-1670 ועד סימון ג'אנשיה ב-1949, מזהים את החורבות
    הללו עם פטרה של פרוקופיוס; מיעוט עדיין מטיל ספק.


    עלו לגבעה העליונה בשלהי היום: הים למרגלותיכם, כביש בטומי המשתרך על החוף, ומתחת לרגליכם עיר שקיסר בנה,
    מלך כבש מתחתיה וצבאו שלו הרס אותה.
  tip: >-
    פטרה היא מוזיאון-שמורה בתשלום, פתוחה בין 10:00 ל-18:00: 15 לארי לתייר זר, 10 לארי למבוגר גאורגי, ו-35
    לארי לסיור מודרך בשפה זרה. שעה אחת מספיקה. השבילים על הסלע טרשיים, במקומות תלולים וחלקלקים אחרי גשם,
    אז חשוב לנעול נעליים סגורות. הצל מצומצם; הימנעו מצהרי הקיץ ובואו לפנות ערב, כשהאור מעל הים הכי יפה.
    חנו בשטח המסומן לצד הכביש הראשי. בתי קפה פזורים לאורך הכביש לכיוון קובולטי, והכספומטים הקרובים ביותר
    נמצאים בקובולטי, כעשר דקות משם.
  route: >-
    כ-355 ק"מ וחמש שעות ו-20 דקות מטביליסי. סעו בכביש S1 (E60) דרך גורי וחשורי, דרך מעבר ריקוטי ולצד קוטאיסי
    עד סמטרדיה, ואז ב-S12 דרך לנצ'חוטי עד גריגולטי וב-S2 דרומה לאורך החוף עד קובולטי. ציחיסדזירי שוכנת
    ממש על ה-S2 בין קובולטי לבטומי, רק כ-17 ק"מ לפני בטומי, כך שאין צורך בסטייה. הכביש אספלט לכל אורכו,
    ורכב אקונומי מספיק. תדלקו בקובולטי או בתחנה שעל הכביש הראשי בקרבת מקום.
ar:
  name: قلعة بيترا، تسيخيسدزيري
  short: >-
    مدينة-قلعة يوستينيانية من القرن السادس على تلّتين صخريتين فوق البحر في تسيخيسدزيري، تنازع عليها الطرفان
    طوال حرب لازيقا.
  body: >-
    **في عام 541 استولى الملك الفارسي خسرو الأول على بيترا لا من فوق أسوارها بل من تحتها، عبر نفق حفره
    جنوده سرًا.**


    كانت المدينة القلعة يومها حديثة العهد. يذكرها قانون ليوستينيانوس عام 535؛ وسُمّيت بيترا بيا يوستينيانا
    تكريمًا للإمبراطور، وبُنيت بجهود يوحنا تسيبوس، الموظف الروماني الذي سيطر بعدها على واردات لازيقا،
    والملح من بينها. اسمها اليوناني، «الصخرة»، لاءم الموقع: بحر وجروف من كل جانب، ومدخل ضيق وحيد يسدّه
    سور بين برجين.


    أثار احتكار تسيبوس اللازَ على روما، فاستدعى ملكهم غوبازيس الفرس سرًا. وبعد النفق، صمد الفرس في بيترا
    أمام حصار روماني-لازي بين عامي 548 و549. وفي عام 551 جاء جيش روماني-لازي جديد بقيادة القائد بيساس؛
    وبعد أكثر من عام سقطت المدينة، فهدم بيساس قلعتها كي لا تعود فارس لاستخدامها. ويضيف علم الآثار خاتمة
    أهدأ: أُعيد ترميم الأسوار وظلت مستخدمة حتى القرن السابع وما بعده.


    اليوم الموقع محمية-متحف تسيخيسدزيري–بيترا، قلعة بمساحة نحو 200 في 100 متر تمتد على تلّتين صخريتين
    قرب البحر. تأمّل فيها:

    - أساسات كنيسة بازيليكية كبيرة من القرن السادس ذات ثلاثة أروقة، بدهليز وأرضية فسيفسائية، ربما كنيسة
    أسقفية

    - حمّامًا وصهريج ماء

    - مقبرة تضم أكثر من 300 قبر قريبة منها


    يرى معظم الباحثين، من البطريرك دوسيثيوس الأورشليمي في السبعينيات من القرن السابع عشر إلى سيمون جاناشيا
    عام 1949، أن هذه الآثار هي بيترا التي وصفها بروكوبيوس؛ وقلة قليلة لا تزال تشكّ في ذلك.


    اصعد إلى التلة العليا في أواخر النهار: البحر تحتك، وطريق باتومي يتلوى على طول الساحل، وتحت قدميك مدينة
    بناها إمبراطور، واستولى عليها ملك من تحتها، وهدمها جيشها نفسه.
  tip: >-
    بيترا محمية-متحف بتذكرة دخول، تفتح من 10:00 إلى 18:00: 15 لاري للزوار الأجانب، 10 لاري للبالغين الجورجيين،
    و35 لاري لجولة مرشدة بلغة أجنبية. تكفي ساعة واحدة. المسارات على الصخر حجرية، ومنحدرة في بعض الأماكن
    وزلقة بعد المطر، فاحرص على حذاء مغلق. الظل قليل؛ تجنّب ظهيرة الصيف وتعال في أواخر النهار حين يكون
    الضوء فوق البحر في أبهى حالاته. اترك السيارة في المساحة المخصّصة قرب الطريق الرئيسي. تنتشر المقاهي
    على الطريق نحو كوبوليتي، وأقرب أجهزة صرف آلي في كوبوليتي، على بعد عشر دقائق.
  route: >-
    نحو 355 كم وخمس ساعات وعشرين دقيقة من تبليسي. خذ الطريق S1 (E60) عبر غوري وخاشوري، مرورًا بممر ريكوتي
    وقرب كوتايسي إلى سامتريديا، ثم S12 عبر لانتشخوتي إلى غريغوليتي، ثم S2 جنوبًا على امتداد الساحل عبر
    كوبوليتي. تقع تسيخيسدزيري مباشرة على الطريق S2 بين كوبوليتي وباتومي، على بعد نحو 17 كم فقط من باتومي،
    فلا حاجة إلى انحراف عن الطريق. الطريق مُعبّد بالكامل، وسيارة اقتصادية كافية تمامًا. عبّئ الوقود في
    كوبوليتي أو في المحطة القريبة على الطريق الرئيسي.
