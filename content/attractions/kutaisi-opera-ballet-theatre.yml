ka:
  name: მელიტონ ბალანჩივაძის სახელობის ქუთაისის ოპერისა და ბალეტის თეატრი
  short: >-
    453-ადგილიანი ოპერა რუსთაველის გამზირზე, ჯორჯ ბალანჩინის მამის, კომპოზიტორ მელიტონ ბალანჩივაძის სახელს
    რომ ატარებს; სახურავზე ცამეტი რომაული ფიგურა დგას.
  body: >-
    **ქუთაისის ოპერა იმ კომპოზიტორის სახელს ატარებს, რომელსაც მსოფლიო უპირველესად მამად იცნობს: მელიტონ
    ბალანჩივაძის ვაჟი გიორგი, ჯორჯ ბალანჩინის სახელით, XX საუკუნის ბალეტის ერთ-ერთი უდიდესი სახელი გახდა,
    მეორე ვაჟი, ანდრია, კი — საქართველოს ერთ-ერთი წამყვანი კომპოზიტორი.**


    ბალანჩივაძემ (1862–1937), ქუთაისის მხარის შვილმა, პირველი ორიგინალური ქართული ოპერა დაწერა, 1919 წელს
    კი ქალაქის პირველი მუსიკალური სასწავლებლის დაარსებაში მიიღო მონაწილეობა — იმ თეატრის შენობაში, რომელიც
    მაშინ აქ იდგა.


    თეატრი ამ ადგილას კიდევ უფრო ძველია. ქუთაისში ქართულენოვანი წარმოდგენები 1861 წლიდან იმართებოდა —
    იმ წლის 3 მარტს სცენისმოყვარეებმა გიორგი ერისთავის კომედია „გაყრა“ დადგეს. 1879 წლის შემოდგომაზე თეატრის
    მოყვარულებმა მუდმივი დასი შექმნეს, 1879 წლის სექტემბრიდან 1880 წლამდე კი მათთვის ქალაქისგან იჯარით
    აღებულ მიწაზე შენობა აშენდა — ხარაზოვის თეატრი, მეცენატ სტეფანე ხარაზიშვილის სახელით. დრამატული დასი
    აქ 1955 წლის 6 ნოემბრამდე თამაშობდა.


    1946 წელს შენობა დაიწვა. მის ადგილას თითქმის სრულიად ახალი ნაგებობა აღიმართა; ძველი თეატრიდან მხოლოდ
    რუსთაველის გამზირის მხარეს მდგარი კედელი გადარჩა. 1968 წელს ხელისუფლებამ ქუთაისისთვის საკუთარი ოპერის
    თეატრის შექმნა გადაწყვიტა, 1969 წლის 27 დეკემბერს კი 453-ადგილიან დარბაზში ფარდა ზაქარია ფალიაშვილის
    „აბესალომ და ეთერით“ გაიხსნა.


    დღევანდელი იერი 2010 წლის რეკონსტრუქციას ეკუთვნის: თეატრს ახალი შესასვლელი და სვეტები შეემატა, სახურავის
    კიდეზე კი ცამეტი რომაული სტილის ფიგურა დადგა — ისინი საღამოს ცის ფონზე, გამზირის მოპირდაპირე მხრიდან
    ჩანს ყველაზე კარგად.


    ახალი სვეტების მიღმა ერთმა ძველმა კედელმა ყველაფერი გაიგონა: მოყვარულთა საღამოები, ხანძარი და „აბესალომ
    და ეთერის“ პირველი აკორდები.
  tip: >-
    დღისით დათვალიერების რეგულარული საათები არ არის: შიგნით შესვლის გზა სპექტაკლის ბილეთია, ამიტომ საღამოს
    დაგეგმვამდე რეპერტუარი სალაროში ან kutaisi.travel-ზე გადაამოწმეთ. ფასადის ნახვა უფასოა და ნებისმიერ
    საათზე ღირს — მოდით შებინდებისას, როცა სახურავის ფიგურები სილუეტებად იქცევა. სპექტაკლზე მოწესრიგებული,
    ნახევრად ოფიციალური ჩაცმულობა შეეფერება. ახლომახლო ქუჩაში პარკირება ჩვეულებრივ უფასოა, კოლხეთის შადრევანი,
    დრამატული თეატრი და თეთრი ხიდი კი ფეხით რამდენიმე წუთის სავალზეა. საღამოს სპექტაკლის შემდეგ ქუთაისში
    დარჩით და სამ საათზე მეტ გზას თბილისისკენ სიბნელეში ნუ დაადგებით.
  route: >-
    ქუთაისი თბილისიდან დაახლოებით 230 კილომეტრშია, გზა დაახლოებით 3 საათსა და 20 წუთს გრძელდება. დასავლეთით
    ს1 (E60) გზატკეცილს მიჰყევით მცხეთის, გორისა და ხაშურის გავლით, რიკოთის მონაკვეთსა და ზესტაფონს იქით,
    ქუთაისამდე — გზა მთლიანად მოასფალტებულია, ბენზინგასამართი ყველა ქალაქშია. ქალაქში ცენტრის მიმართულებას
    მიჰყევით; თეატრი რუსთაველის გამზირზე დგას, ცენტრალური მოედნიდან რამდენიმე წუთის სავალზე. ახლომახლო
    ქუჩებში პარკირება ჩვეულებრივ თავისუფალია, ეკონომკლასის მანქანაც სავსებით საკმარისია — მთელი გზა კარგი
    ასფალტია.
en:
  name: Kutaisi Meliton Balanchivadze Opera and Ballet Theatre
  short: >-
    A 453-seat opera house on Rustaveli Avenue, named after the composer who fathered George Balanchine,
    with thirteen Roman-style figures on its roof.
  body: >-
    **Kutaisi's opera house carries the name of a composer the wider world knows mostly as a father: Meliton
    Balanchivadze, whose son George, as Balanchine, became one of the great names of twentieth-century
    ballet, and whose son Andria became one of Georgia's leading composers.**


    Balanchivadze (1862–1937), a son of the Kutaisi region, wrote the first original Georgian opera, and
    in 1919 he helped found the city's first music school inside the theatre that then stood here.


    The theatre on this spot is older still. Georgian-language performances were being staged in Kutaisi
    from 1861, beginning on 3 March with amateurs playing Giorgi Eristavi's comedy *The Division*. In
    the autumn of 1879 the enthusiasts became a permanent troupe, and between September 1879 and 1880
    a house was built for them on land leased from the city — the Kharazov theatre, after its patron Stepane
    Kharazishvili. The drama company played here until 6 November 1955.


    In 1946 the building burned. What rose in its place was almost entirely new; only the wall along Rustaveli
    Avenue survived from the old theatre. In 1968 the authorities decided Kutaisi should have an opera
    house of its own, and on 27 December 1969 the curtain went up on Zakaria Paliashvili's *Abesalom and
    Eteri* in a hall of 453 seats.


    The face you see today comes from a 2010 renovation, which added a new entrance and columns and set
    thirteen Roman-style figures along the roofline; they read best against the evening sky from across
    the avenue.


    Behind the new columns, one old wall has heard all of it: the amateur nights, the fire, and the first
    bars of *Abesalom and Eteri*.
  tip: >-
    There are no regular daytime visiting hours: the way inside is a ticket to a performance, so check
    the programme at the box office or on kutaisi.travel before you plan an evening around it. The façade
    costs nothing and is worth a look at any hour — come at dusk, when the roofline figures turn to silhouettes.
    Smart-casual dress is right for a performance. Street parking nearby is usually free, and the Colchis
    Fountain, the drama theatre and the White Bridge are all a short walk away. After an evening show,
    stay the night in Kutaisi rather than driving more than three hours back to Tbilisi in the dark.
  route: >-
    Kutaisi is about 230 km from Tbilisi, roughly 3 hours 20 minutes. Take the S1 (E60) west past Mtskheta,
    Gori and Khashuri, over the Rikoti section and past Zestaponi into Kutaisi — four-lane in long stretches,
    asphalt throughout, with fuel in every town. In the city follow signs for the centre; the theatre
    stands on Rustaveli Avenue, a few minutes' walk from the central square. Street parking is generally
    available nearby, and an economy car is all you need — the whole journey is on good asphalt.
ru:
  name: Кутаисский театр оперы и балета имени Мелитона Баланчивадзе
  short: >-
    Оперный театр на 453 места на проспекте Руставели, названный в честь композитора — отца Джорджа Баланчина,
    с тринадцатью фигурами в римском духе на крыше.
  body: >-
    **Кутаисская опера носит имя композитора, которого большой мир знает прежде всего как отца: Мелитон
    Баланчивадзе, чей сын Георгий под именем Джордж Баланчин стал одним из великих имён балета XX века,
    а другой сын, Андрей, — одним из ведущих композиторов Грузии.**


    Баланчивадзе (1862–1937), уроженец Кутаисского края, написал первую самобытную грузинскую оперу, а
    в 1919 году помог основать первую в городе музыкальную школу — в здании театра, стоявшем тогда на
    этом месте.


    Театр на этом месте ещё старше. Спектакли на грузинском языке шли в Кутаиси с 1861 года: 3 марта любители
    сыграли комедию Георгия Эристави «Раздел». Осенью 1879 года энтузиасты стали постоянной труппой, и
    с сентября 1879-го по 1880 год для них на арендованной у города земле выстроили здание — театр Харазова,
    по имени мецената Степане Харазишвили. Драматическая труппа играла здесь до 6 ноября 1955 года.


    В 1946 году здание сгорело. То, что поднялось на его месте, было почти целиком новым: от старого театра
    уцелела лишь стена вдоль проспекта Руставели. В 1968 году власти решили, что Кутаиси нужен собственный
    оперный театр, и 27 декабря 1969 года в зале на 453 места поднялся занавес — давали *«Абесалом и Этери»*
    Захария Палиашвили.


    Нынешний облик театру дала реконструкция 2010 года: появились новый вход и колонны, а вдоль карниза
    крыши встали тринадцать фигур в римском духе. Лучше всего они смотрятся с другой стороны проспекта,
    на фоне вечернего неба.


    За новыми колоннами одна старая стена слышала всё: любительские вечера, пожар и первые такты *«Абесалома
    и Этери»*.
  tip: >-
    Регулярных дневных часов посещения нет: попасть внутрь можно только по билету на спектакль, поэтому
    сверьтесь с афишей в кассе или на kutaisi.travel, прежде чем планировать вечер. Фасадом можно любоваться
    бесплатно и в любое время — приходите в сумерках, когда фигуры на крыше превращаются в силуэты. Для
    спектакля уместен смарт-кэжуал. Парковка на улицах рядом обычно бесплатная, а фонтан «Колхида», драматический
    театр и Белый мост — в нескольких минутах ходьбы. После вечернего спектакля переночуйте в Кутаиси,
    а не возвращайтесь в Тбилиси больше трёх часов по темноте.
  route: >-
    До Кутаиси от Тбилиси около 230 км, примерно 3 часа 20 минут. Двигайтесь по S1 (E60) на запад мимо
    Мцхеты, Гори и Хашури, через участок Рикоти и мимо Зестафони в Кутаиси — на длинных отрезках дорога
    четырёхполосная, асфальт на всём пути, заправки в каждом городе. В городе следуйте указателям на центр;
    театр стоит на проспекте Руставели, в нескольких минутах ходьбы от центральной площади. Место для
    парковки на улицах поблизости обычно находится, а машины эконом-класса вполне достаточно — весь путь
    идёт по хорошему асфальту.
fa:
  name: تئاتر اپرا و بالهٔ کوتایسی به نام ملیتون بالانچیوادزه
  short: >-
    اپرایی ۴۵۳ نفره در خیابان روستاولی که نام آهنگسازی را بر خود دارد که پدر جورج بالانشین بود، با سیزده
    پیکرهٔ رومی‌وار بر بام.
  body: >-
    **اپرای کوتایسی نام آهنگسازی را بر خود دارد که جهان بیشتر او را در مقام یک پدر می‌شناسد: ملیتون بالانچیوادزه،
    که پسرش گئورگی با نام جورج بالانشین به یکی از بزرگ‌ترین نام‌های باله در سدهٔ بیستم بدل شد، و پسر دیگرش،
    آندریا، از آهنگسازان برجستهٔ گرجستان شد.**


    بالانچیوادزه (۱۸۶۲–۱۹۳۷)، فرزند سرزمین کوتایسی، نخستین اپرای اصیل گرجی را نوشت و در ۱۹۱۹ در بنیان
    نهادن نخستین مدرسهٔ موسیقی شهر، در ساختمان تئاتری که آن زمان این‌جا برپا بود، سهم داشت.


    پیشینهٔ تئاتر در این نقطه از این هم کهن‌تر است. از ۱۸۶۱ در کوتایسی نمایش‌هایی به زبان گرجی روی صحنه
    می‌رفت؛ نخستینش در ۳ مارس همان سال کمدی «تقسیم» اثر گیورگی اریستاوی بود که علاقه‌مندان اجرا کردند.
    در پاییز ۱۸۷۹ این علاقه‌مندان به گروهی دائمی بدل شدند و از سپتامبر ۱۸۷۹ تا ۱۸۸۰ تالاری برایشان بر
    زمینی که از شهر اجاره شده بود ساخته شد — تئاتر خارازوف، به نام حامی‌اش استپانه خارازیشویلی. گروه درام
    تا ۶ نوامبر ۱۹۵۵ در اینجا اجرا می‌کرد.


    در ۱۹۴۶ ساختمان در آتش سوخت. آنچه به جایش برخاست تقریباً سراسر نو بود؛ از تئاتر قدیم تنها دیوار کنار
    خیابان روستاولی بر جای ماند. در ۱۹۶۸ مقامات تصمیم گرفتند که کوتایسی باید اپرای خودش را داشته باشد،
    و در ۲۷ دسامبر ۱۹۶۹ پرده در تالاری ۴۵۳ نفره با *«آبسالوم و اتری»* اثر زاکاریا پالیاشویلی بالا رفت.


    چهرهٔ امروزی ساختمان حاصل بازسازی ۲۰۱۰ است که ورودی و ستون‌هایی تازه افزود و سیزده پیکرهٔ رومی‌وار
    را در امتداد لبهٔ بام نشاند؛ این پیکره‌ها از آن سوی خیابان و بر زمینهٔ آسمان شامگاهی از همه جا زیباترند.


    در پس ستون‌های نو، یک دیوار کهنه همه چیز را شنیده است: شب‌های نمایش آماتورها، آتش‌سوزی، و نخستین میزان‌های
    *«آبسالوم و اتری»*.
  tip: >-
    ساعات بازدید روزانهٔ منظمی وجود ندارد: راه ورود بلیت یک اجراست، پس پیش از آنکه شبی را بر پایهٔ آن
    برنامه‌ریزی کنید، برنامهٔ اجراها را از گیشه یا در kutaisi.travel بررسی کنید. تماشای نما رایگان است
    و در هر ساعتی می‌ارزد — هنگام غروب بیایید، وقتی پیکره‌های لبهٔ بام به سایه‌نما بدل می‌شوند. برای اجرا
    پوشش نیمه‌رسمی (اسمارت‌کژوال) مناسب است. پارک در خیابان‌های نزدیک معمولاً رایگان است، و فوارهٔ کلخیس،
    تئاتر درام و پل سفید همه در چند قدمی‌اند. پس از اجرای شبانه، به جای بیش از سه ساعت رانندگی در تاریکی
    تا تفلیس، شب را در کوتایسی بمانید.
  route: >-
    کوتایسی حدود ۲۳۰ کیلومتر از تفلیس فاصله دارد، نزدیک به ۳ ساعت و ۲۰ دقیقه. از S1 (E60) به سوی غرب بروید،
    از کنار متسختا، گوری و خاشوری بگذرید، از بخش ریکوتی عبور کنید و پس از زستافونی وارد کوتایسی شوید —
    در بخش‌های طولانی چهارخطه، سراسر آسفالت، با پمپ بنزین در هر شهر. در شهر تابلوهای مرکز را دنبال کنید؛
    تئاتر در خیابان روستاولی است، چند دقیقه پیاده تا میدان مرکزی. جای پارک در خیابان‌های نزدیک معمولاً
    پیدا می‌شود و یک خودروی اقتصادی کاملاً کافی است — تمام مسیر آسفالت خوب است.
he:
  name: תיאטרון האופרה והבלט של קוטאיסי על שם מליטון בלנצ'יבדזה
  short: >-
    בית אופרה בן 453 מושבים בשדרות רוסתאוולי, הקרוי על שם המלחין שהיה אביו של ג'ורג' בלנשין, ועל גגו שלושה־עשר
    פסלים בסגנון רומי.
  body: >-
    **בית האופרה של קוטאיסי נושא את שמו של מלחין שהעולם הרחב מכיר בעיקר כאב: מליטון בלנצ'יבדזה, שבנו גאורגי,
    בשם ג'ורג' בלנשין, נעשה לאחד השמות הגדולים בבלט של המאה העשרים, ובנו האחר, אנדריה, לאחד המלחינים הבולטים
    של גאורגיה.**


    בלנצ'יבדזה (1862–1937), בן חבל קוטאיסי, כתב את האופרה הגאורגית המקורית הראשונה, וב-1919 סייע לייסד
    את בית הספר הראשון למוזיקה בעיר — בתוך התיאטרון שעמד אז במקום הזה.


    התיאטרון במקום הזה ותיק עוד יותר. הצגות בגאורגית הועלו בקוטאיסי כבר מ-1861: ב-3 במרץ באותה שנה העלו
    חובבים את הקומדיה "החלוקה" של גיורגי אריסטאווי. בסתיו 1879 הפכו החובבים ללהקה קבועה, ובין ספטמבר 1879
    ל-1880 נבנה עבורם בית על קרקע שחכרו מהעירייה — תיאטרון חרזוב, על שם הפטרון סטפנה חרזישווילי. להקת
    הדרמה הופיעה כאן עד 6 בנובמבר 1955.


    ב-1946 עלה הבניין באש. מה שקם במקומו היה חדש כמעט לגמרי; מהתיאטרון הישן שרד רק הקיר שלאורך שדרות רוסתאוולי.
    ב-1968 החליטו השלטונות שלקוטאיסי צריך להיות בית אופרה משלה, וב-27 בדצמבר 1969 עלה המסך על *אבסלום
    ואתרי* של זכריה פליאשווילי, באולם בן 453 מושבים.


    החזית שאתם רואים היום היא פרי שיפוץ מ-2010, שהוסיף כניסה חדשה ועמודים והציב לאורך קו הגג שלושה־עשר
    פסלים בסגנון רומי; הם נראים במיטבם על רקע שמי הערב, מהצד השני של השדרה.


    מאחורי העמודים החדשים, קיר ישן אחד שמע הכול: את ערבי החובבים, את השריפה ואת התיבות הראשונות של *אבסלום
    ואתרי*.
  tip: >-
    אין שעות ביקור קבועות במהלך היום: הדרך פנימה היא כרטיס להופעה, אז בדקו את התוכנייה בקופה או באתר kutaisi.travel
    לפני שאתם בונים עליה תוכנית לערב. החזית אינה עולה דבר ושווה מבט בכל שעה — בואו בשעת בין ערביים, כשהפסלים
    על הגג הופכים לצלליות. לבוש אלגנטי־יומיומי (סמארט קז'ואל) מתאים להופעה. החנייה ברחובות הסמוכים בדרך
    כלל חינם, ומזרקת קולכיס, תיאטרון הדרמה והגשר הלבן נמצאים כולם במרחק הליכה קצר. אחרי הופעת ערב הישארו
    ללון בקוטאיסי במקום לנהוג יותר משלוש שעות בחושך חזרה לטביליסי.
  route: >-
    קוטאיסי נמצאת כ-230 ק״מ מטביליסי, בערך 3 שעות ו-20 דקות נסיעה. סעו מערבה בכביש S1 (E60), עברו את מצחתה,
    גורי וחשורי, את קטע ריקוטי ואת זסטפוני, והיכנסו לקוטאיסי — בקטעים ארוכים הכביש בן ארבעה נתיבים, אספלט
    לכל אורכו ותחנות דלק בכל עיר. בעיר עקבו אחר השלטים למרכז; התיאטרון עומד בשדרות רוסתאוולי, כמה דקות
    הליכה מהכיכר המרכזית. בדרך כלל אפשר למצוא חנייה ברחובות הסמוכים, ורכב מקטגוריית אקונומי מספיק לגמרי
    — כל הדרך על אספלט טוב.
ar:
  name: مسرح ميليتون بالانتشيفادزه للأوبرا والباليه في كوتايسي
  short: >-
    دار أوبرا تتسع لـ453 مقعدًا في جادة روستافيلي، تحمل اسم المؤلف الموسيقي الذي أنجب جورج بالانشين، ويعلو
    سطحها ثلاثة عشر تمثالًا على الطراز الروماني.
  body: >-
    **تحمل دار الأوبرا في كوتايسي اسم مؤلف موسيقي يعرفه العالم الأوسع قبل كل شيء بوصفه أبًا: ميليتون بالانتشيفادزه،
    الذي صار ابنه غيورغي، باسم جورج بالانشين، أحد أعظم أسماء الباليه في القرن العشرين، وصار ابنه الآخر
    أندريا من أبرز المؤلفين الموسيقيين في جورجيا.**


    كتب بالانتشيفادزه (1862–1937)، ابن منطقة كوتايسي، أول أوبرا جورجية أصيلة، وأسهم عام 1919 في تأسيس
    أول مدرسة موسيقى في المدينة، داخل المسرح الذي كان قائمًا هنا آنذاك.


    والمسرح في هذا الموقع أقدم من ذلك. فمنذ عام 1861 كانت العروض باللغة الجورجية تُقدَّم في كوتايسي، إذ
    قدّم هواة في 3 مارس من ذلك العام كوميديا «القسمة» لغيورغي إريستافي. وفي خريف 1879 تحوّل الهواة إلى
    فرقة دائمة، وبين سبتمبر 1879 و1880 شُيّدت لهم دار على أرض مستأجرة من البلدية — مسرح خارازوف، نسبةً
    إلى راعيه ستيبانه خارازيشفيلي. وظلت فرقة الدراما تقدم عروضها هنا حتى 6 نوفمبر 1955.


    في عام 1946 احترق المبنى. وما قام مكانه كان جديدًا بالكامل تقريبًا؛ فلم يبقَ من المسرح القديم سوى
    الجدار الممتد على جادة روستافيلي. وفي 1968 قررت السلطات أن تكون لكوتايسي دار أوبرا خاصة بها، وفي 27
    ديسمبر 1969 رُفعت الستارة عن *أبيسالوم وإيتيري* لزكريا بالياشفيلي في قاعة من 453 مقعدًا.


    أما الواجهة التي تراها اليوم فتعود إلى ترميم عام 2010، الذي أضاف مدخلًا جديدًا وأعمدة، ونصب على امتداد
    خط السطح ثلاثة عشر تمثالًا على الطراز الروماني؛ وأجمل ما تبدو عليه حين تُرى على صفحة سماء المساء من
    الجهة المقابلة للجادة.


    خلف الأعمدة الجديدة، جدارٌ قديم واحد سمع كل شيء: أمسيات الهواة، والحريق، والمقاطع الأولى من *أبيسالوم
    وإيتيري*.
  tip: >-
    لا توجد ساعات زيارة نهارية منتظمة: الطريق إلى الداخل تذكرة لعرض ما، فراجع البرنامج في شباك التذاكر
    أو على kutaisi.travel قبل أن تبني أمسيتك حوله. أما الواجهة فلا تكلف شيئًا وتستحق النظر في أي ساعة
    — تعالَ عند الغسق، حين تتحول تماثيل السطح إلى ظلال. اللباس الأنيق غير الرسمي مناسب للعرض. الوقوف في
    الشوارع المجاورة مجاني عادةً، ونافورة كولخيس ومسرح الدراما والجسر الأبيض كلها على مسافة قصيرة سيرًا.
    وبعد عرض مسائي، بِتْ ليلتك في كوتايسي بدل أن تقود أكثر من ثلاث ساعات في الظلام عائدًا إلى تبليسي.
  route: >-
    تبعد كوتايسي عن تبليسي نحو 230 كم، أي قرابة 3 ساعات و20 دقيقة. اتبع الطريق S1 (E60) غربًا مرورًا بمتسخيتا
    وغوري وخاشوري، ثم عبر مقطع ريكوتي ومرورًا بزستافوني حتى كوتايسي — الطريق بأربعة مسارات في مقاطع طويلة،
    معبّد طوال المسافة، ومحطات الوقود في كل بلدة. في المدينة اتبع اللافتات إلى المركز؛ يقع المسرح في جادة
    روستافيلي، على بعد دقائق سيرًا من الساحة المركزية. تتوفر عادةً أماكن للوقوف في الشوارع القريبة، وتكفي
    سيارة اقتصادية تمامًا — فالرحلة كلها على أسفلت جيد.
