ka:
  name: ბეშუმი
  short: >-
    თუნუქგადახურული ხის სახლების საზაფხულო სოფელი გოდერძის უღელტეხილთან: ივნისიდან სექტემბრამდე ცოცხალი,
    დანარჩენ დროს თოვლში ჩაფლული.
  body: >-
    **ყოველ ივნისს ბარის აჭარლები ზაფხულს მთაში ამოაბარგებენ და ბეშუმი, წლის დანარჩენ დროს დარაბებჩაკეტილი
    და თოვლში ჩაფლული, იღვიძებს.**


    ის არსიანის ქედზე, ზღვის დონიდან დაახლოებით 1850–1900 მეტრზე მდებარეობს, გოდერძის უღელტეხილიდან ასფალტის
    განშტოებით 7 კილომეტრში და ხულოდან 30 კილომეტრში. ზღვისპირეთის სიცხეს აქ თაობების განმავლობაში გაურბოდნენ,
    კურორტად კი ბეშუმი 1937 წლიდან მუშაობს. 1977 წლის „ქართული საბჭოთა ენციკლოპედია“ მას კლიმატურ კურორტად
    მოიხსენიებს, სადაც სასუნთქი ორგანოების არატუბერკულოზურ დაავადებებს, სისხლნაკლებობასა და ბავშვთა ქრონიკულ
    დაავადებებს მკურნალობენ. ზაფხულის სტუმრების უმეტესობა დღესაც ბათუმიდან და ახალციხიდან ჩამოდის.


    სოფელი ფერდობებზე მიმოფანტული ასობით ხის სახლია: ციცაბო სახურავები, რომ თოვლი არ ჩაიკიდოს, ფართო აივნები
    გრძელი საღამოებისთვის, გახუნებული ფიცრითა და თუნუქით დაკერებული კედლები, ბევრი მათგანი ჭრელად შეღებილი.
    ნაძვებს შორის ჰამაკები ირწევა, აივნებიდან გვიან ღამემდე ნარდის კაკუნი ისმის, დილით კი მოვაჭრეები ტყის
    მარწყვსა და კაიმაღს გაჰყვირიან.


    ირგვლივ იაილებია, მწყემსების საზაფხულო სადგომები, სადაც ოჯახები მთელ სეზონს ძროხებთან ერთად ატარებენ.
    გზის საკითხავადაც რომ შეიაროთ, დიდი ალბათობით ყავას შემოგთავაზებენ და საკუთარ ნაწარმსაც გაგასინჯებენ:
    სქელ კაიმაღს, რბილ ნადუღს და მლაშე ხურუთს, რძეში მოხარშულ და მოზელილ ხაჭოს, რომელსაც ხელით აძლევენ
    ფორმას და სახლის ყავრის სახურავზე აშრობენ.


    აგვისტოს პირველ შაბათ-კვირას ბეშუმი თავის ზაფხულის დღესასწაულს, „შუამთობას“ მართავს: დოღით, ჭიდაობითა
    და ხელნაკეთი ნივთების ბაზრობით.


    სექტემბრის ბოლოს უკანასკნელი ოჯახებიც ბარად ეშვებიან, დარაბები იხურება და სახლები თვეობით თოვლს რჩება.
  tip: >-
    სეზონი ივნისის შუა რიცხვებიდან სექტემბრამდეა; სხვა დროს სოფელი ცარიელია, გზა კი თოვლის ქვეშ. სახლი
    წინასწარ დაჯავშნეთ, განსაკუთრებით „შუამთობისთვის“: დიდი სასტუმროები აქ არ არის, მხოლოდ საოჯახო გასაქირავებელი
    სახლები. ღამე ივლისშიც ცივა, ამიტომ თბილი სამოსი წაიღეთ. ნაღდი ფული თან იქონიეთ, ოთახის ქირისა და
    მწყემსებისგან ნაყიდი რძის ნაწარმისთვის. გზაზე გოდერძის ალპური ბაღი შეგხვდებათ (ღიაა 15 მაისიდან 15
    ოქტომბრამდე, შესვლა უფასოა), საიდანაც მოკლე ბილიკები შქერნალის ტბამდე მიდის; მწვანე ტბა დაახლოებით
    6 კილომეტრშია.
  route: >-
    თბილისიდან დაახლოებით 265 კმ-ია; გაითვალისწინეთ ხუთნახევარი საათი. ს1 (E60) მაგისტრალით ხაშურამდე
    იარეთ, ს8-ით ბორჯომის გავლით ახალციხემდე, შემდეგ კი ბათუმი-ახალციხის გზით დასავლეთით, ადიგენისა და
    ზარზმის გავლით, გოდერძის უღელტეხილამდე (2025 მ). 2026 წლის ივნისის მდგომარეობით ეს მხარე მოასფალტებული
    იყო, უღელტეხილთან რამდენიმე მოკლე ხრეშიანი მონაკვეთის გარდა. თხემიდან ასფალტის განშტოება ალპური ბაღის
    გავლით ბეშუმში ჩადის. კროსოვერი ან მაღალი გამავლობის ავტომობილი კომფორტულია, ზაფხულში ჯიპი აღარ არის
    აუცილებელი. ზამთარში უღელტეხილი თოვლშია, ბევრი გამქირავებელი კი მასზე გადასვლას კრძალავს, ამიტომ ხელშეკრულება
    გადაამოწმეთ. საწვავი ახალციხეში ან ადიგენში ჩაასხით.
en:
  name: Beshumi
  short: >-
    A summer village of wooden, tin-roofed cottages near the Goderdzi Pass, alive from June to September
    and snowbound the rest of the year.
  body: >-
    **Every June the families of lowland Adjara carry their summer up the mountain, and Beshumi, shuttered
    and snowbound for the rest of the year, wakes up.**


    It lies on the Arsiani range at about 1,850–1,900 metres, some 7 km from the Goderdzi Pass along an
    asphalt spur and 30 km from Khulo. People have climbed here to escape the coastal heat for generations,
    and Beshumi has worked as a resort since 1937. The Georgian Soviet Encyclopedia of 1977 lists it as
    a climatic resort for non-tuberculous respiratory illness, anaemia and chronic childhood complaints.
    Most summer guests still come from Batumi and Akhaltsikhe.


    The village is hundreds of wooden cottages scattered down the slopes: steep gables to shed the snow,
    deep verandahs for long evenings, walls patched with weathered planks and corrugated tin, many painted
    in bright colours. Hammocks swing between the spruces, backgammon clatters on the balconies late into
    the night, and in the morning hawkers call out wild strawberries and kaimaghi.


    Around it lie the iailebi, herders' summer camps where families spend the season with their cows.
    Stop to ask the way and you may well be offered coffee, and a taste of what they make: kaimaghi, a
    thick clotted cream; nadughi, a soft whey cheese; and salty khuruti, curd boiled and kneaded in milk,
    shaped by hand and dried on the wooden shingles of the roof.


    On the first weekend of August Beshumi holds Shuamtoba, its summer festival, with horse racing, wrestling
    and a handicrafts fair.


    By the end of September the last families head back down to the lowlands, the shutters close, and
    for months the cottages belong to the snow.
  tip: >-
    The season runs from mid-June to September; outside it the village is empty and the road is under
    snow. Book a cottage well ahead, especially for Shuamtoba: there are no big hotels, only family rentals.
    Nights are cold even in July, so pack a warm layer. Bring cash for your room and for dairy bought
    straight from the herders. On the way in, the Goderdzi Alpine Garden (open 15 May–15 October, free)
    has short paths to Shkernali lake, and the Green Lake is about 6 km away.
  route: >-
    About 265 km from Tbilisi; allow around five and a half hours. Take the S1 (E60) to Khashuri, the
    S8 through Borjomi to Akhaltsikhe, then the Batumi–Akhaltsikhe road west through Adigeni and Zarzma
    up to the Goderdzi Pass (2,025 m). As of June 2026 this side was sealed apart from very short gravel
    patches near the pass. At the top, an asphalt spur leads down past the alpine garden to Beshumi. A
    crossover or SUV is comfortable; in summer a 4x4 is no longer essential. The pass is snowbound in
    winter, and many rental firms ban it, so check your contract. Refuel in Akhaltsikhe or Adigeni.
ru:
  name: Бешуми
  short: >-
    Летнее село деревянных домиков с жестяными крышами у перевала Годердзи, живое с июня по сентябрь и
    заснеженное всё остальное время.
  body: >-
    **Каждый июнь семьи из низинной Аджарии поднимают своё лето в горы, и Бешуми, закрытое и заснеженное
    весь остальной год, просыпается.**


    Оно лежит на Арсианском хребте, на высоте около 1850–1900 метров, примерно в 7 км от перевала Годердзи
    по асфальтовой дороге и в 30 км от Хуло. Люди поднимаются сюда от прибрежной жары уже не первое поколение,
    а Бешуми работает как курорт с 1937 года. Грузинская советская энциклопедия 1977 года называет его
    климатическим курортом для нетуберкулёзных болезней дыхания, малокровия и хронических детских недомоганий.
    Большинство летних гостей до сих пор приезжают из Батуми и Ахалцихе.


    Село — это сотни деревянных домиков, разбросанных по склонам: крутые фронтоны, чтобы сбрасывать снег,
    глубокие веранды для долгих вечеров, стены, залатанные потемневшими досками и рифлёной жестью, многие
    ярко окрашены. Между елями качаются гамаки, на балконах до глубокой ночи стучат нарды, а по утрам
    разносчики зазывают: земляника, каймахи.


    Вокруг лежат яйлы — летние стоянки пастухов, где семьи проводят сезон со своими коровами. Спросите
    дорогу — и вам вполне могут предложить кофе и попробовать то, что здесь готовят: каймахи, густые топлёные
    сливки; надуги, мягкий сырок из сыворотки; и солоноватый хурути, отваренный и вымешанный в молоке
    творог, сформованный руками и подсушенный на деревянной гонте крыши.


    В первые выходные августа Бешуми проводит Шуамтобу, свой летний праздник с конными скачками, борьбой
    и ярмаркой ремёсел.


    К концу сентября последние семьи спускаются в низины, ставни закрываются, и на долгие месяцы домики
    достаются снегу.
  tip: >-
    Сезон длится с середины июня до сентября; вне его село пустеет, а дорога уходит под снег. Домик стоит
    бронировать заранее, особенно на время Шуамтобы: больших гостиниц здесь нет, только семейная аренда.
    Ночи холодны даже в июле, возьмите тёплую вещь. Берите наличные — за жильё и за молочное, купленное
    прямо у пастухов. По дороге сюда стоит заглянуть в альпийский сад Годердзи (открыт с 15 мая по 15
    октября, вход бесплатный) с короткими тропами к озеру Шкернали, а Зелёное озеро — примерно в 6 км.
  route: >-
    Около 265 км от Тбилиси; закладывайте около пяти с половиной часов. Поезжайте по S1 (E60) до Хашури,
    по S8 через Боржоми до Ахалцихе, затем по дороге Батуми–Ахалцихе на запад через Адигени и Зарзму вверх
    к перевалу Годердзи (2025 м). По состоянию на июнь 2026 года эта сторона заасфальтирована, если не
    считать совсем коротких гравийных участков у самого перевала. На вершине асфальтовая дорога спускается
    мимо альпийского сада к Бешуми. Кроссовер или внедорожник — удобный выбор; летом полноценный 4х4 уже
    не обязателен. Зимой перевал заносит снегом, и многие прокатные фирмы запрещают выезд на него — проверьте
    договор. Заправляйтесь в Ахалцихе или Адигени.
fa:
  name: بشومی
  short: >-
    روستای تابستانی از خانه‌های چوبی با بام‌های فلزی نزدیک گذرگاه گودردزی، زنده از ژوئن تا سپتامبر و برف‌گیر
    در باقی سال.
  body: >-
    **هر ژوئن، خانواده‌های آجارای پایین‌دست تابستانشان را به کوه می‌برند، و بشومی، که باقی سال بسته و
    در برف فرورفته است، بیدار می‌شود.**


    این روستا بر رشته‌کوه آرسیانی، در ارتفاع تقریبی ۱۸۵۰ تا ۱۹۰۰ متری، حدود ۷ کیلومتر از گذرگاه گودردزی
    از راهی آسفالته و ۳۰ کیلومتر از خولو قرار دارد. مردم نسل‌هاست برای گریز از گرمای ساحل به این‌جا می‌آیند،
    و بشومی از سال ۱۹۳۷ به‌عنوان استراحتگاه کار می‌کند. دایرةالمعارف شوروی گرجستان در سال ۱۹۷۷ آن را استراحتگاهی
    اقلیمی برای بیماری‌های تنفسی غیرسِلی، کم‌خونی و ناخوشی‌های مزمن کودکان معرفی می‌کند. بیشتر مهمانان
    تابستانی هنوز از باتومی و آخالتسیخه می‌آیند.


    روستا صدها کلبهٔ چوبی است که در دامنه پراکنده‌اند: شیروانی‌های تیز برای ریزش برف، ایوان‌های عمیق برای
    شب‌های طولانی، دیوارهایی وصله‌شده با تخته‌های کهنه و ورق‌های فلزی موج‌دار، بسیاری به رنگ‌های روشن.
    ننوها میان درختان نوئل تاب می‌خورند، تخته‌نرد تا پاسی از شب روی بالکن‌ها به صدا می‌آید، و صبح‌ها دستفروش‌ها
    توت‌فرنگی وحشی و کایماغی صدا می‌زنند.


    پیرامون روستا ییلاق‌ها (ایالبی) است، اردوگاه‌های تابستانی چوپانان که خانواده‌ها فصل را با گاوهای خود
    در آن می‌گذرانند. اگر برای پرسیدن راه توقف کنید، احتمالاً به شما قهوه و طعمی از آنچه می‌سازند تعارف
    می‌شود: کایماغی، خامهٔ سفت‌شده؛ نادوقی، پنیر نرم آب‌پنیر؛ و خوروتی نمکین، دلمه‌ای که در شیر پخته و
    ورز داده شده، با دست شکل گرفته و بر روی تخته‌های سقف خشک شده است.


    در آخر هفتهٔ اول اوت، بشومی جشن تابستانی شوآمتوبا را برگزار می‌کند، با اسب‌دوانی، کشتی و نمایشگاه
    صنایع دستی.


    تا پایان سپتامبر آخرین خانواده‌ها به دشت باز می‌گردند، کرکره‌ها بسته می‌شوند، و برای ماه‌ها کلبه‌ها
    از آن برف می‌شوند.
  tip: >-
    فصل از میانهٔ ژوئن تا سپتامبر است؛ خارج از آن روستا خالی و راه زیر برف است. کلبه‌ای را زودتر رزرو
    کنید، به‌ویژه برای شوآمتوبا: هتل بزرگی اینجا نیست، فقط اجاره‌های خانوادگی. شب‌ها حتی در ژوئیه سرد
    است، لایه‌ای گرم همراه ببرید. پول نقد همراه داشته باشید، برای اتاق و برای لبنیاتی که مستقیم از چوپانان
    می‌خرید. در راه ورود، باغ آلپی گودردزی (باز از ۱۵ مه تا ۱۵ اکتبر، رایگان) مسیرهای کوتاهی به دریاچهٔ
    شکرنالی دارد، و دریاچهٔ سبز حدود ۶ کیلومتر آن‌سوتر است.
  route: >-
    حدود ۲۶۵ کیلومتر از تفلیس؛ نزدیک پنج ساعت و نیم در نظر بگیرید. مسیر S1 (E60) را تا خاشوری بروید، سپس
    S8 را از میان بورجومی تا آخالتسیخه، و از آن‌جا در جادهٔ باتومی–آخالتسیخه رو به غرب از آدیگنی و زارزما
    تا گذرگاه گودردزی (۲۰۲۵ متر) بروید. تا ژوئن ۲۰۲۶ این سمت آسفالت بود، جز چند تکه بسیار کوتاه شنی نزدیک
    گذرگاه. در بالای گذرگاه، راهی آسفالته از کنار باغ آلپی پایین به بشومی می‌رود. خودروی کراس‌آور یا شاسی‌بلند
    راحت است؛ در تابستان دیگر ۴×۴ ضرورتی ندارد. گذرگاه در زمستان زیر برف است و بسیاری از شرکت‌های اجاره
    عبور از آن را ممنوع می‌کنند؛ قرارداد را بررسی کنید. سوخت را در آخالتسیخه یا آدیگنی بزنید.
he:
  name: בשומי
  short: כפר קיץ של בקתות עץ עם גגות פח סמוך למעבר גודרדזי, חי מיוני עד ספטמבר ומכוסה שלג בשאר השנה.
  body: >-
    **בכל יוני נושאות משפחות משפלת אג'ריה את הקיץ שלהן במעלה ההר, ובשומי, המסוגרת והמושלגת בשאר השנה,
    מתעוררת.**


    היא שוכנת על רכס ארסיאני, בגובה של כ-1,850–1,900 מטרים, כ-7 ק"מ ממעבר גודרדזי בכביש אספלט וכ-30 ק"מ
    מחולו. אנשים עולים לכאן כדי לברוח מהחום החופי כבר דורות, ובשומי פועלת כאתר נופש מאז 1937. האנציקלופדיה
    הסובייטית הגאורגית משנת 1977 מונה אותה כאתר מרפא אקלימי למחלות נשימה שאינן שחפת, אנמיה ותחלואי ילדים
    כרוניים. רוב אורחי הקיץ עדיין מגיעים מבטומי ומאחלציחה.


    הכפר הוא מאות בקתות עץ מפוזרות במדרונות: גמלונים תלולים לפינוי שלג, מרפסות עמוקות לערבים ארוכים, קירות
    מטולאים בקרשים דהויים ובפח מגולוון, רבים מהם צבועים בצבעים עזים. ערסלים נעים בין עצי האשוח, שש-בש
    נוקש במרפסות עד שעה מאוחרת בלילה, ובבוקר קוראים הרוכלים: תותי בר וקאימאגי.


    מסביב שוכנות ה'איילבי' — מאהלי קיץ של רועים שבהם משפחות מבלות את העונה עם פרותיהן. עצרו לשאול דרך,
    ויש סיכוי טוב שיוגש לכם קפה, וטעם ממה שהם מכינים: קאימאגי, שמנת מעובה עשירה; נדוגי, גבינת מי גבינה
    רכה; וחורוטי המלוח, גבינה טרייה שמבשלים ולשים בחלב, מעצבים ביד ומייבשים על רעפי העץ של הגג.


    בסוף השבוע הראשון של אוגוסט חוגגת בשומי את שואמטובה, פסטיבל הקיץ שלה, עם מרוצי סוסים, היאבקות ושוק
    מלאכת יד.


    עד סוף ספטמבר יורדות המשפחות האחרונות למישור, התריסים נסגרים, ולחודשים ארוכים שייכות הבקתות לשלג.
  tip: >-
    העונה נמשכת מאמצע יוני עד ספטמבר; מחוצה לה הכפר ריק והכביש מכוסה שלג. הזמינו בקתה מראש, בייחוד לשואמטובה:
    אין כאן מלונות גדולים, רק שכירות משפחתית. הלילות קרים אפילו ביולי, קחו שכבה חמה. הביאו מזומן, לחדר
    ולמוצרי חלב שנקנים ישירות מהרועים. בדרך לכאן, בגן האלפיני של גודרדזי (פתוח מ-15 במאי עד 15 באוקטובר,
    כניסה חינם) יש שבילים קצרים לאגם שקרנאלי, והאגם הירוק במרחק כ-6 ק"מ.
  route: >-
    כ-265 ק"מ מטביליסי; הקצו כחמש שעות וחצי. סעו בכביש S1 (E60) עד חשורי, ב-S8 דרך בורג'ומי עד אחלציחה,
    ואז בכביש בטומי–אחלציחה מערבה דרך אדיגני וזרזמה ועד מעבר גודרדזי (2,025 מ'). נכון ליוני 2026 הצד הזה
    היה סלול, מלבד קטעי חצץ קצרים מאוד סמוך למעבר. בפסגה כביש אספלט יורד לצד הגן האלפיני עד בשומי. רכב
    קרוסאובר או רכב שטח נוחים; בקיץ הנעה 4×4 מלאה כבר אינה הכרחית. המעבר מושלג בחורף, וחברות השכרה רבות
    אוסרות לחצות אותו, אז בדקו את החוזה. תדלקו באחלציחה או באדיגני.
ar:
  name: بشومي
  short: >-
    قرية صيفية من بيوت خشبية بأسطح صفيح قرب ممر غودردزي، تنبض بالحياة من يونيو إلى سبتمبر وتغطيها الثلوج
    بقية العام.
  body: >-
    **كل يونيو تحمل عائلات سهول أدجارا صيفها إلى الجبل، وتصحو بشومي، المغلقة والمغطاة بالثلوج بقية العام.**


    تقع على سلسلة أرسياني، على ارتفاع نحو 1850–1900 مترًا، على مسافة نحو 7 كم من ممر غودردزي عبر طريق
    فرعي مُعبّد، و30 كم من خولو. يصعد الناس إلى هنا هربًا من حرّ الساحل منذ أجيال، وتعمل بشومي منتجعًا
    منذ عام 1937. تُدرجها الموسوعة السوفيتية الجورجية لعام 1977 كمنتجع مناخي لأمراض الجهاز التنفسي غير
    السلّية وفقر الدم واعتلالات الطفولة المزمنة. ولا يزال معظم ضيوف الصيف يأتون من باتومي وأخالتسيخه.


    القرية مئات من البيوت الخشبية المتناثرة على المنحدرات: جملونات حادة لتصريف الثلج، شرفات عميقة للسهرات
    الطويلة، جدران مرقّعة بألواح باهتة وصفيح مضلّع، كثير منها مطليّ بألوان زاهية. تتمايل الأرجوحات بين
    أشجار التنّوب، ويُسمع صوت الطاولة (الزهر) على البلكونات حتى ساعة متأخرة من الليل، وفي الصباح ينادي
    الباعة المتجولون على الفراولة البرية والكايماغي.


    حولها تنتشر «الإيالبي»، مخيمات الرعاة الصيفية حيث تقضي العائلات الموسم مع أبقارها. توقّف لتسأل عن
    الطريق، وقد تُعرض عليك القهوة، وشيء مما يصنعونه: الكايماغي، قشدة كثيفة متخثرة؛ والنادوغي، جبن مصل
    رخو؛ والخوروتي المالح، جبن رائب يُطبخ ويُعجن في الحليب، يُشكَّل باليد ويُجفَّف على ألواح خشب السقف.


    في عطلة نهاية الأسبوع الأولى من أغسطس تحتفل بشومي بمهرجانها الصيفي شوآمتوبا، بسباقات الخيل والمصارعة
    وسوق للحرف اليدوية.


    ومع نهاية سبتمبر تنزل آخر العائلات إلى السهول، وتُغلق المصاريع، ولأشهر طويلة تصبح البيوت ملكًا للثلج.
  tip: >-
    يمتد الموسم من منتصف يونيو إلى سبتمبر؛ وخارجه تكون القرية خالية والطريق مغطاة بالثلج. احجز بيتًا مسبقًا،
    وبخاصة في مهرجان شوآمتوبا: لا فنادق كبيرة هنا، بل تأجير عائلي فقط. الليالي باردة حتى في يوليو، فاحمل
    طبقة ملابس دافئة. احمل نقودًا للغرفة ولمنتجات الحليب التي تُشترى مباشرة من الرعاة. في الطريق إلى هناك،
    تضمّ حديقة غودردزي الألبية (مفتوحة من 15 مايو إلى 15 أكتوبر، دخول مجاني) مسارات قصيرة إلى بحيرة شكرنالي،
    والبحيرة الخضراء على مسافة نحو 6 كم.
  route: >-
    نحو 265 كم من تبليسي؛ خصّص نحو خمس ساعات ونصف. خذ الطريق S1 (E60) إلى خاشوري، ثم S8 عبر بورجومي إلى
    أخالتسيخه، ثم طريق باتومي–أخالتسيخه غربًا عبر أديغني وزارزما صعودًا إلى ممر غودردزي (2025 مترًا).
    وحتى يونيو 2026 كان هذا الجانب مُعبّدًا باستثناء مقاطع حصوية قصيرة جدًا قرب الممر. عند القمة ينحدر
    طريق مُعبّد قرب الحديقة الألبية نزولًا إلى بشومي. سيارة كروس أوفر أو رباعية الدفع خيار مريح؛ وفي الصيف
    لم يعد الدفع الرباعي الكامل ضروريًا. يُغلق الممر بالثلوج شتاءً، وتمنع شركات تأجير كثيرة عبوره، فتحقّق
    من عقدك. عبّئ الوقود في أخالتسيخه أو أديغني.
