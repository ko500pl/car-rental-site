ka:
  name: ბეშუმი
  short: ხის სახლების ალპური დასახლება 1830 მეტრზე, რომელიც მხოლოდ ზაფხულის სამი თვე ცხოვრობს.
  body: >-
    **ბეშუმი ზაფხულის დასახლებაა და მთელი წლის კურორტი არასდროს ყოფილა.** ის გოდერძის უღელტეხილიდან დასავლეთით,
    დაახლოებით 1830 მეტრზეა და ივნისის შუიდან სექტემბრის დასაწყისამდე ცოცხლობს; დანარჩენ დროს სახლები
    დაკეტილია და გზა თოვლის ქვეშ.

    ლოგიკა ძველია. ზემო აჭარის სოფლებში ზაფხულის სიცხე და ტენი ძნელი ასატანია, ამიტომ ოჯახები პირუტყვთან
    ერთად მაღლა, საძოვრებზე ადიოდნენ. ის, რაც დროებითი სადგომებით დაიწყო, ხის სახლების მთელ დასახლებად
    იქცა. სახლები მსუბუქია — ფიცრის კედლები, აივანი, თუნუქის სახურავი — და ზუსტად ისეთი, როგორიც სამი
    თვისთვის უნდა იყოს.

    რას აკეთებენ აქ:

    - **ალპურ მდელოებზე სეირნობა** — ივნის-ივლისში ყვავილი მუხლამდეა

    - **შერიგების დღესასწაული** ("შუამთობა") აგვისტოს ბოლოს — ზემო აჭარის მთავარი ზაფხულის შეკრება ცხენოსნებით,
    ჭიდაობითა და მუსიკით

    - **მაწონი, ყველი, თაფლი** პირდაპირ სახლებში, ხშირად უფასოდ დაგაგემოვნებენ

    - ტყისა და მდელოს საზღვარზე გასეირნება, სადაც სოჭის ტყე უცებ წყდება

    ჰაერი მშრალია და ეს არაა შემთხვევითი: ბეშუმს საბჭოთა დროიდან სასუნთქი გზების პრობლემების მქონე ადამიანებს
    ურჩევდნენ. ვინც ჩამოსული სასტუმროებით განებივრებულია, გაუკვირდება — აქ სერვისი მინიმალურია, ცხელი
    წყალი ყოველთვის არაა და საღამოს ცივა ივლისშიც.

    გოდერძის უღელტეხილი ათიოდე კილომეტრზეა, მწვანე ტბა — ცოტა უფრო შორს.
  tip: >-
    ნახევარი დღე ან ღამის გათევა. სეზონი ივნისის შუიდან სექტემბრის დასაწყისამდეა — მის გარეთ დასახლება
    ცარიელია. ღამით თერმომეტრი ივლისშიც ხუთ გრადუსამდე ეშვება: თბილი ტანსაცმელი აუცილებელია. ბინა წინასწარ
    შეათანხმე, ადგილზე ცოტაა. ბანკომატი და აფთიაქი არაა, ნაღდი ფული თან იქონიე. მობილური კავშირი ზოგან
    წყდება.
  route: >-
    ყველაზე მოკლე გზა თბილისიდან ხაშურზე, ახალციხესა და ადიგენზე გადის, შემდეგ გოდერძის უღელტეხილზე და
    დასავლეთით ჩამოსვლით — ჯამში 312 კმ, დაახლოებით შვიდი საათი. ბოლო სამოცი კილომეტრი ხრეშია, ვიწრო და
    ციცაბო; ჯიპი აუცილებელია. ალტერნატივა ბათუმის მხრიდან ხულოზე გავლითაა, დაახლოებით 475 კმ. საწვავი
    ადიგენში ან ხულოში აიღე — ბეშუმში საწვავი არაა.
en:
  name: Beshumi
  short: An alpine settlement of wooden houses at 1,830 metres that lives for three months of the year.
  body: >-
    **Beshumi is a summer settlement and has never been a year-round resort.** It sits west of Goderdzi
    Pass at about 1,830 metres and comes to life from mid-June to early September; the rest of the year
    the houses are shuttered and the road is under snow.

    The logic behind it is old. Summer heat and humidity are hard to bear in the villages of upper Adjara,
    so families moved up to the pastures with their cattle. What began as temporary shelters grew into
    a whole settlement of timber houses. They are light buildings — plank walls, a balcony, a tin roof
    — exactly what you build for three months.

    What people do here:

    - **Walk the alpine meadows** — in June and July the flowers are knee-deep

    - Attend **Shuamtoba**, the reconciliation festival at the end of August: the main summer gathering
    of upper Adjara, with horsemen, wrestling and music

    - Eat **matsoni, cheese and honey** straight from the houses, usually offered before you can ask

    - Walk the line where the fir forest stops dead against open pasture

    The air is dry, and that is not incidental: since Soviet times Beshumi was recommended to people with
    respiratory problems. Anyone used to coastal hotels will find it plain — service is minimal, hot water
    is not guaranteed, and evenings are cold even in July.

    Goderdzi Pass is about ten kilometres away; the Green Lake is a little further.
  tip: >-
    Half a day, or stay the night. The season runs from mid-June to early September, and outside it the
    place is empty. Night temperatures drop towards five degrees even in July, so warm clothes are essential.
    Arrange a room in advance — there are not many. There is no cash machine and no pharmacy, so bring
    cash. Mobile coverage drops out in places.
  route: >-
    The shortest route from Tbilisi goes via Khashuri, Akhaltsikhe and Adigeni, over Goderdzi Pass and
    down the western side — 312 km in total, about seven hours. The last sixty kilometres are gravel,
    narrow and steep, and a four-wheel drive is necessary. The alternative is from Batumi through Khulo,
    roughly 475 km. Refuel at Adigeni or Khulo; there is no fuel at Beshumi itself.
ru:
  name: Бешуми
  short: Альпийское поселение деревянных домов на 1830 метрах, живущее три месяца в году.
  body: >-
    **Бешуми — летнее поселение, а не круглогодичный курорт, и никогда им не было.** Оно лежит западнее
    перевала Годердзи, примерно на 1830 метрах, и оживает с середины июня до начала сентября; остальное
    время дома заколочены, а дорога под снегом.

    Логика у этого старая. В сёлах верхней Аджарии летняя жара и влажность тяжелы, поэтому семьи поднимались
    со скотом на пастбища. То, что начиналось как временные балаганы, выросло в целое поселение деревянных
    домов. Постройки лёгкие — дощатые стены, балкон, жестяная крыша, — ровно такие, какие строят на три
    месяца.

    Чем здесь занимаются:

    - **Гуляют по альпийским лугам** — в июне и июле цветы по колено

    - Приезжают на **Шуамтобу**, праздник примирения в конце августа: главный летний сбор верхней Аджарии,
    с всадниками, борьбой и музыкой

    - Едят **мацони, сыр и мёд** прямо из домов, обычно предложат раньше, чем спросите

    - Ходят по линии, где пихтовый лес резко обрывается о луг

    Воздух сухой, и это не случайность: ещё с советских времён Бешуми рекомендовали людям с болезнями
    дыхательных путей. Тем, кто привык к приморским гостиницам, здесь покажется бедно: сервис минимальный,
    горячая вода не гарантирована, вечера холодные даже в июле.

    До перевала Годердзи около десяти километров, до Зелёного озера чуть дальше.
  tip: >-
    Полдня или ночёвка. Сезон с середины июня до начала сентября, вне его посёлок пуст. Ночью и в июле
    бывает около пяти градусов, тёплые вещи обязательны. Комнату лучше договорить заранее, их немного.
    Банкомата и аптеки нет, наличные берите с собой. Мобильная связь местами пропадает.
  route: >-
    Кратчайший путь из Тбилиси идёт через Хашури, Ахалцихе и Адигени, затем через перевал Годердзи и вниз
    по западной стороне — всего 312 км, около семи часов. Последние шестьдесят километров гравийные, узкие
    и крутые, полный привод необходим. Альтернатива — со стороны Батуми через Хуло, примерно 475 км. Заправляйтесь
    в Адигени или Хуло, в самом Бешуми топлива нет.
fa:
  name: بشومی
  short: آبادی کوهستانی از خانه‌های چوبی در ۱۸۳۰ متری که تنها سه ماه از سال زنده است.
  body: >-
    **بشومی آبادی تابستانی است و هرگز تفرجگاه تمام‌سال نبوده.** غرب گردنهٔ گودردزی و در حدود ۱۸۳۰ متری
    قرار دارد و از نیمهٔ خرداد تا آغاز شهریور جان می‌گیرد؛ باقی سال خانه‌ها بسته‌اند و جاده زیر برف است.

    منطق آن کهن است. گرما و رطوبت تابستان در روستاهای آجارای بالا سنگین است، پس خانواده‌ها با دام خود
    به چراگاه‌ها بالا می‌رفتند. آنچه با پناهگاه‌های موقت آغاز شد به آبادی کاملی از خانه‌های چوبی بدل گشت.
    بناها سبک‌اند — دیوار تخته‌ای، ایوان، بام حلبی — درست همان‌گونه که برای سه ماه می‌سازند.

    مردم اینجا چه می‌کنند:

    - **در چمنزارهای کوهستانی راه می‌روند** — خرداد و تیر گل‌ها تا زانوست

    - در **شوامتوبا** شرکت می‌کنند، جشن آشتی در پایان مرداد: بزرگ‌ترین گردهمایی تابستانی آجارای بالا با
    اسب‌سواران و کشتی و موسیقی

    - **ماست و پنیر و عسل** را همان‌جا از خانه‌ها می‌خورند، که معمولاً پیش از پرسیدن تعارف می‌شود

    - در مرزی راه می‌روند که جنگل نوئل ناگهان به چمنزار می‌رسد و می‌ایستد

    هوا خشک است و این اتفاقی نیست: از دوران شوروی بشومی را به کسانی که مشکل تنفسی داشتند توصیه می‌کردند.
    هر کس به هتل‌های ساحلی خو کرده اینجا را ساده خواهد یافت؛ خدمات کمینه است، آب گرم تضمینی نیست و شب‌ها
    حتی در تیر سرد است.

    گردنهٔ گودردزی حدود ده کیلومتر فاصله دارد و دریاچهٔ سبز کمی دورتر است.
  tip: >-
    نیم روز، یا یک شب اقامت. فصل از نیمهٔ خرداد تا آغاز شهریور است و بیرون از آن اینجا خالی است. دمای
    شب حتی در تیر به پنج درجه می‌رسد، پس لباس گرم ضروری است. اتاق را از پیش هماهنگ کنید؛ تعدادشان کم است.
    خودپرداز و داروخانه نیست، پس پول نقد همراه ببرید. آنتن تلفن جاهایی قطع می‌شود.
  route: >-
    کوتاه‌ترین راه از تفلیس از خاشوری، آخالتسیخه و آدیگنی می‌گذرد، سپس از گردنهٔ گودردزی و پایین در سوی
    غربی — روی‌هم ۳۱۲ کیلومتر، حدود هفت ساعت. شصت کیلومتر آخر شنی و باریک و تند است و دیفرانسیل چهار چرخ
    لازم. راه جایگزین از سمت باتومی و از خولو است، نزدیک ۴۷۵ کیلومتر. در آدیگنی یا خولو سوخت بگیرید؛ در
    خود بشومی سوخت نیست.
he:
  name: בשומי
  short: יישוב אלפיני של בתי עץ בגובה 1,830 מטר, החי שלושה חודשים בשנה.
  body: >-
    **בשומי הוא יישוב קיץ ומעולם לא היה אתר נופש לכל השנה.** הוא שוכן ממערב למעבר גודרדזי בגובה כ-1,830
    מטר וקם לתחייה מאמצע יוני עד תחילת ספטמבר; בשאר השנה הבתים סגורים והדרך מתחת לשלג.

    ההיגיון שמאחוריו עתיק. החום והלחות של הקיץ קשים בכפרי אג׳ריה העילית, ולכן משפחות עלו עם הבקר אל המרעה.
    מה שהתחיל כמחסות זמניים גדל ליישוב שלם של בתי עץ. אלה מבנים קלים — קירות קרשים, מרפסת, גג פח — בדיוק
    מה שבונים לשלושה חודשים.

    מה עושים כאן:

    - **מטיילים באחו האלפיני** — ביוני וביולי הפרחים עד הברכיים

    - מגיעים ל**שואמטובה**, חג הפיוס בסוף אוגוסט: ההתכנסות הקיצית המרכזית של אג׳ריה העילית, עם פרשים,
    היאבקות ומוזיקה

    - אוכלים **מצוני, גבינה ודבש** ישר מן הבתים, בדרך כלל מציעים לפני שתספיקו לבקש

    - הולכים לאורך הקו שבו יער האשוח נעצר בבת אחת מול המרעה

    האוויר יבש, וזה לא במקרה: עוד מן התקופה הסובייטית המליצו על בשומי לסובלים ממחלות דרכי נשימה. מי שרגיל
    למלונות החוף ימצא כאן פשטות: השירות מינימלי, מים חמים אינם מובטחים, והערבים קרים גם ביולי.

    מעבר גודרדזי במרחק כעשרה קילומטרים, והאגם הירוק מעט מעבר לו.
  tip: >-
    חצי יום, או לינה. העונה נמשכת מאמצע יוני עד תחילת ספטמבר, ומחוצה לה המקום ריק. הטמפרטורות בלילה יורדות
    לכחמש מעלות גם ביולי, ולכן בגדים חמים הכרחיים. הזמינו חדר מראש — אין רבים. אין כספומט ואין בית מרקחת,
    אז קחו מזומן. הקליטה הסלולרית נעלמת במקומות.
  route: >-
    הדרך הקצרה מטביליסי עוברת דרך חשורי, אחלציחה ואדיגני, מעל מעבר גודרדזי ומטה בצד המערבי — 312 ק״מ בסך
    הכול, כשבע שעות. ששים הקילומטרים האחרונים בחצץ, צרים ותלולים, והנעה כפולה הכרחית. החלופה היא מצד באטומי
    דרך חולו, כ-475 ק״מ. תדלקו באדיגני או בחולו; בבשומי עצמה אין דלק.
ar:
  name: بيشومي
  short: مستوطنة جبلية من بيوت خشبية على 1830 متراً تعيش ثلاثة أشهر في السنة.
  body: >-
    **بيشومي مستوطنة صيفية ولم تكن يوماً منتجعاً على مدار العام.** تقع غرب ممر غودردزي على نحو 1830 متراً
    وتدب فيها الحياة من منتصف يونيو إلى مطلع سبتمبر؛ وبقية السنة تكون البيوت مغلقة والطريق تحت الثلج.

    منطقها قديم. حرارة الصيف ورطوبته ثقيلتان في قرى أجاريا العليا، فكانت العائلات تصعد بمواشيها إلى المراعي.
    وما بدأ مآوي مؤقتة صار مستوطنة كاملة من بيوت الخشب. مبانٍ خفيفة — جدران ألواح وشرفة وسقف صفيح — تماماً
    ما يُبنى لثلاثة أشهر.

    ما يفعله الناس هنا:

    - **المشي في المروج الجبلية** — في يونيو ويوليو يبلغ الزهر الركبتين

    - حضور **شواميتوبا**، عيد المصالحة في أواخر أغسطس: أكبر تجمع صيفي في أجاريا العليا، بالفرسان والمصارعة
    والموسيقى

    - تناول **الماتسوني والجبن والعسل** من البيوت مباشرة، ويُعرض عليك غالباً قبل أن تسأل

    - السير على الخط الذي تتوقف عنده غابة التنوب فجأة أمام المرعى

    الهواء جاف، وليس هذا عرضياً: فمنذ العهد السوفيتي كانت بيشومي تُنصح لمن يعانون أمراض الجهاز التنفسي.
    ومن اعتاد فنادق الساحل سيجدها بسيطة؛ الخدمة في حدها الأدنى، والماء الساخن غير مضمون، والأمسيات باردة
    حتى في يوليو.

    ممر غودردزي على بعد نحو عشرة كيلومترات، والبحيرة الخضراء أبعد قليلاً.
  tip: >-
    نصف يوم، أو مبيت ليلة. الموسم من منتصف يونيو إلى مطلع سبتمبر، وخارجه المكان خالٍ. تنزل حرارة الليل
    نحو خمس درجات حتى في يوليو، فالملابس الدافئة ضرورية. رتب غرفة مسبقاً؛ فالغرف قليلة. لا صراف آلي ولا
    صيدلية، فاحمل نقداً. وتغطية الهاتف تنقطع في مواضع.
  route: >-
    أقصر طريق من تبليسي يمر بخاشوري وأخالتسيخه وأديغيني، ثم فوق ممر غودردزي ونزولاً في الجانب الغربي —
    312 كم إجمالاً، نحو سبع ساعات. آخر ستين كيلومتراً حصوية ضيقة وحادة، والدفع الرباعي ضروري. والبديل
    من جهة باتومي عبر خولو، نحو 475 كم. تزود بالوقود في أديغيني أو خولو؛ فلا وقود في بيشومي نفسها.
