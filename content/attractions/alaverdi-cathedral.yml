ka:
  name: ალავერდის საკათედრო ტაძარი
  short: >-
    კვირიკე III-ის XI საუკუნის ტაძარი, ორმოცდაათ მეტრზე მაღალი, ალაზნის ველზე მარტო მდგარი — თითქმის ათას
    წელს საქართველოს უმაღლესი ეკლესია.
  body: >-
    **თითქმის ათასი წლის განმავლობაში საქართველოში ალავერდზე მაღალი ტაძარი არ მდგარა, ალაზნის ბრტყელ ველზე
    კი ის შორიდანვე ჩანს — ბევრად ადრე, ვიდრე მიუახლოვდებით.**


    იოსებ ალავერდელი, ერთ-ერთი ასურელი მამა, VI საუკუნეში ანტიოქიიდან მოვიდა და მონასტერი პატარა სოფელში
    დააარსა, რომელიც მანამდე მთვარის წარმართული სალოცავი ყოფილა. XI საუკუნის დასაწყისში კახთა მეფე კვირიკე
    III-მ წმინდა გიორგის პატარა ეკლესიის ადგილას ის ტაძარი ააგო, რომელიც დღეს დგას: 41,7 × 26,4 მეტრი,
    ორმოცდაათ მეტრზე მაღალი, გუმბათში თექვსმეტი სარკმლით. სიმაღლით მას მხოლოდ 2004 წელს კურთხეულმა თბილისის
    სამების ტაძარმა აჯობა.


    ტაძარი თავის ისტორიას არ მალავს. 1614 წელს შაჰ-აბასმა იგი ციხესიმაგრედ აქცია და შიგ ირანელთა გარნიზონი
    ჩააყენა, განჯის მმართველმა ფეიქარ-ხანმა კი გალავნის შიგნით აგურის სასახლე აიშენა. 1742 წლის მიწისძვრის
    შემდეგ აღდგენა დედოფალმა თამარმა 1750 წელს დაიწყო და ერეკლე II-მ დაასრულა — აგურით, ამიტომაც განახლებული
    ნაწილები შირიმის თავდაპირველ პირკეთზე უფრო თბილი ფერისაა. XIX საუკუნის ბოლოს ინტერიერი მთლიანად შეათეთრეს;
    1966 წელს კედლები გაწმინდეს და მხატვრობის ფენები გამოჩნდა: XI საუკუნის ფრაგმენტები, XV–XVI საუკუნეების
    ფრესკები სამხრეთ მკლავში, XVI–XVII საუკუნეებისა — დასავლეთ და ჩრდილოეთ კედლებზე. აქ განისვენებს იოსებ
    ალავერდელი, აგრეთვე წმინდა ქეთევან დედოფალი და მეფე თეიმურაზ I.


    XVII–XVIII საუკუნეების გალავნის შიგნით დგას სამსართულიანი პალატი, რომლის კამაროვანი ქვედა დარბაზი
    ოდესღაც სატრაპეზო იყო, აბანო, სამრეკლო და X–XII საუკუნეებით დათარიღებული მარანი, სადაც ბერები დღესაც
    ქვევრში აყენებენ ღვინოს.


    ძველად ალავერდობა 29 სექტემბერს იწყებოდა და სამ კვირას გრძელდებოდა: ღამის სათევად მლოცველები ქიზიყიდან,
    ერწო-თიანეთიდან, ფშავ-ხევსურეთიდან მოდიოდნენ, მეზობელი ქისტები და დაღესტნელებიც ჩამოდიოდნენ. რთველი
    დღესაც ამ კართან სრულდება.
  tip: >-
    ჩაცმის წესი კართანვე მოწმდება: ქალებს — გრძელი კაბა და თავსაფარი, მამაკაცებს — გრძელი შარვალი; შორტებით
    არ შეგიშვებენ. გადასაფარებლები, როგორც წესი, შესასვლელთან ჰკიდია. მოდით დილით, ტურისტულ ჯგუფებამდე,
    როცა აღმოსავლეთის სარკმლები ნათდება; თუ წირვაა, დარჩით და გალობას ამ გუმბათქვეშ მოუსმინეთ. მანქანა
    გალავნის გარეთ დგება, საათი კი სავსებით საკმარისია. სექტემბრის ბოლოს, ალავერდობისა და რთველის დროს,
    ეზოში ხალხმრავლობაა, გზებზე კი ყურძნით დატვირთული ტრაქტორები დადიან. იყალთო და გრემი სრული დღისთვის
    ბუნებრივი თანამგზავრებია.
  route: >-
    იარეთ გომბორის გზით: თბილისიდან ს5-ით, ვაზიანიდან შ38-ით უღელტეხილზე გადასვლით და თელავის განაპირამდე
    დაშვებით — დაახლოებით 89 კმ. იქ შ42-ზე გადადით და ახმეტის მიმართულებით, ჩრდილო-დასავლეთით, დაახლოებით
    7 კილომეტრი იარეთ, შემდეგ მარჯვნივ შ184-ზე გადაუხვიეთ — ის ვენახებიან ველზე დაახლოებით 9 კილომეტრში
    ტაძრამდე მიგიყვანთ. სულ დაახლოებით 110 კმ და ორი საათია. ველის გზები კარგადაა მოასფალტებული, ეკონომ-კლასის
    მანქანა სავსებით საკმარისია. საწვავი თელავში ჩაასხით. თუ გომბორი თოვლით ჩაკეტილია, ს5-ითა და შ42-ით,
    საგარეჯოსა და გურჯაანის გავლით შემოიარეთ — დაახლოებით 170 კმ, გაითვალისწინეთ სამი საათი.
en:
  name: Alaverdi Cathedral
  short: >-
    Kvirike III's 11th-century cathedral, over fifty metres tall and alone on the Alazani plain — for
    nearly a thousand years Georgia's tallest church.
  body: >-
    **For almost a thousand years no church in Georgia stood taller than Alaverdi, and on the flat Alazani
    plain you see it long before you reach it.**


    Joseph of Alaverdi, one of the Assyrian Fathers, came from Antioch in the 6th century and founded
    a monastery in a small village that had been a pagan centre of the Moon. Early in the 11th century
    King Kvirike III of Kakheti replaced its little church of St George with the cathedral that stands
    today: 41.7 by 26.4 metres, more than fifty metres high, its dome pierced by sixteen windows. Only
    Tbilisi's Sameba Cathedral, consecrated in 2004, rose higher.


    The building wears its history openly. In 1614 Shah Abbas turned it into a fortress with a Persian
    garrison, and Peikar Khan, governor of Ganja, built himself a brick palace inside the walls. After
    the earthquake of 1742 Queen Tamar began repairs in 1750 and Erekle II finished them — in brick, which
    is why the mended parts look warmer than the original shirimi stone. Whitewashed in the late 19th
    century, the interior was cleaned in 1966 and gave back its layers: 11th-century fragments, 15th–16th-century
    painting in the south arm, 16th–17th-century scenes on the west and north walls. Joseph lies here,
    and so do Queen Ketevan the Martyr and King Teimuraz I.


    Within the 17th–18th-century wall stand a three-storey palace whose vaulted lower hall was once the
    refectory, a bathhouse, a bell tower and a wine cellar dated to the 10th–12th centuries, where monks
    still make wine in qvevri.


    The old Alaverdoba began on 29 September and ran for three weeks; pilgrims came to keep vigil through
    the night from Kiziki, Tianeti and the mountains of Pshavi and Khevsureti, and Kist and Dagestani
    neighbours came too. The harvest still ends at this door.
  tip: >-
    The dress code is enforced at the gate: a long skirt and headscarf for women, long trousers for men
    — shorts will not get you in. Wraps usually hang by the entrance. Come in the morning, before the
    tour groups, when the eastern windows are lit; if a service is on, stay for the singing under that
    dome. Parking is outside the wall and an hour is enough. In late September, with Alaverdoba and the
    grape harvest, expect crowds in the grounds and grape-laden tractors on the lanes. Ikalto and Gremi
    make natural companions for a full day.
  route: >-
    Take the Gombori road: the S5 out of Tbilisi, then the Sh38 from Vaziani over the pass and down to
    the edge of Telavi, about 89 km. There join the Sh42 north-west towards Akhmeta for some 7 km, then
    turn right onto the Sh184, which runs about 9 km across the vineyard plain to the cathedral. In all
    it is about 110 km and two hours. The roads on the plain are well surfaced and an economy car is plenty.
    Fill up in Telavi. If Gombori is shut by snow, go round on the S5 and Sh42 via Sagarejo and Gurjaani
    — about 170 km; allow three hours.
ru:
  name: Алавердский собор
  short: >-
    Собор Квирике III XI века, высотой более пятидесяти метров, одиноко стоящий на Алазанской равнине
    — почти тысячу лет самый высокий храм Грузии.
  body: >-
    **Почти тысячу лет ни один храм Грузии не был выше Алаверди, и на плоской Алазанской равнине его видно
    задолго до того, как вы к нему подъедете.**


    Иосиф Алавердский, один из Тринадцати ассирийских отцов, пришёл из Антиохии в VI веке и основал монастырь
    в небольшом селении, бывшем некогда языческим центром культа Луны. В начале XI века царь Кахетии Квирике
    III заменил его маленькую церковь Святого Георгия собором, который стоит и сегодня: 41,7 на 26,4 метра,
    высотой более пятидесяти метров, купол прорезан шестнадцатью окнами. Выше него поднялся только тбилисский
    собор Самеба, освящённый в 2004 году.


    Здание не скрывает своей истории. В 1614 году шах Аббас превратил его в крепость с персидским гарнизоном,
    а Пейкар-хан, правитель Гянджи, построил себе внутри стен кирпичный дворец. После землетрясения 1742
    года царица Тамар начала восстановление в 1750 году, а Ираклий II завершил его — кирпичом, поэтому
    отремонтированные части выглядят теплее первоначального камня ширими. Интерьер, побелённый в конце
    XIX века, расчистили в 1966 году, и он открыл свои слои: фрагменты XI века, живопись XV–XVI веков
    в южном рукаве, сцены XVI–XVII веков на западной и северной стенах. Здесь покоятся Иосиф, а также
    царица Кетеван Мученица и царь Теймураз I.


    В ограде XVII–XVIII веков стоят трёхэтажный дворец, чей сводчатый нижний зал некогда служил трапезной,
    баня, колокольня и винный погреб X–XII веков, где монахи до сих пор делают вино в квеври.


    Старая Алавердоба начиналась 29 сентября и длилась три недели; на всенощное бдение сходились паломники
    из Кизики, Тианети и горных краёв Пшави и Хевсурети, приходили и соседи-кистинцы и дагестанцы. Сбор
    винограда и сегодня завершается у этих дверей.
  tip: >-
    Дресс-код строго проверяют у ворот: длинная юбка и платок для женщин, длинные брюки для мужчин — в
    шортах не пропустят. Накидки обычно висят у входа. Приезжайте утром, до туристических групп, когда
    солнце светит в восточные окна; если идёт служба, останьтесь послушать пение под этим куполом. Парковка
    — за оградой; часа достаточно. В конце сентября, во время Алавердобы и сбора винограда, ждите толп
    во дворе и тракторов с виноградом на дорогах. Вместе с Икалто и Греми получится насыщенный день.
  route: >-
    Езжайте по гомборской дороге: S5 из Тбилиси, затем Sh38 от Вазиани через перевал и вниз к окраине
    Телави — около 89 км. Там сверните на Sh42 на северо-запад в сторону Ахметы примерно на 7 км, затем
    поверните направо на Sh184, которая идёт около 9 км через виноградную равнину к собору. Всего около
    110 км и два часа. Дороги на равнине хорошо покрыты асфальтом, и машины эконом-класса вполне достаточно.
    Заправьтесь в Телави. Если Гомбори закрыт снегом, поезжайте в обход по S5 и Sh42 через Сагареджо и
    Гурджаани — около 170 км; заложите три часа.
fa:
  name: کلیسای جامع آلاوردی
  short: >-
    کلیسای جامعِ سده‌ی یازدهمِ کویریکه سوم، به بلندای بیش از پنجاه متر و تنها بر دشتِ آلازانی — نزدیک
    به هزار سال بلندترین کلیسای گرجستان.
  body: >-
    **نزدیک به هزار سال هیچ کلیسایی در گرجستان از آلاوردی بلندتر نبود، و در دشتِ هموارِ آلازانی آن را
    مدت‌ها پیش از رسیدن می‌بینید.**


    یوسفِ آلاوردی، یکی از پدرانِ سیزده‌گانه‌ی آسوری، در سده‌ی ششم از انطاکیه به این‌جا آمد و صومعه‌ای
    در روستایی کوچک بنیاد نهاد که زمانی کانونِ آیینِ بت‌پرستانه‌ی ماه بود. در آغازِ سده‌ی یازدهم، کویریکه
    سوم، پادشاه کاختی، کلیسای کوچکِ گئورگیوس قدیسِ آن‌جا را با کلیسای جامعی جایگزین کرد که امروز نیز برپاست:
    به ابعاد ۴۱٫۷ در ۲۶٫۴ متر، به بلندای بیش از پنجاه متر، و گنبدی که شانزده پنجره در آن گشوده شده است.
    تنها کلیسای جامعِ سامه‌بای تفلیس، که در سال ۲۰۰۴ تقدیس شد، از آن بلندتر برخاست.


    بنا تاریخ خود را پنهان نمی‌کند. در سال ۱۶۱۴ شاه‌عباس آن را به دژی با پادگان ایرانی بدل کرد، و پیکرخان،
    بیگلربیگی گنجه، کاخی آجری برای خود درون دیوارهایش برپا ساخت. پس از زمین‌لرزه‌ی ۱۷۴۲، ملکه تامار در
    سال ۱۷۵۰ بازسازی را آغاز کرد و ارکله دوم آن را به پایان رساند — با آجر، و از همین‌رو بخش‌های تعمیرشده
    گرم‌تر از سنگ شیریمیِ نخستین می‌نمایند. درونِ بنا، که در پایانِ سده‌ی نوزدهم سفیدکاری شده بود، در
    سال ۱۹۶۶ پاک‌سازی شد و لایه‌هایش دوباره پدیدار شد: پاره‌های سده‌ی یازدهم، نگارگری سده‌های پانزدهم
    و شانزدهم در بازوی جنوبی، صحنه‌های سده‌های شانزدهم و هفدهم بر دیوارهای باختری و شمالی. یوسف در این‌جا
    آرمیده، و نیز ملکه کتوانِ شهید و پادشاه تیموراز یکم.


    درونِ دیوارِ سده‌های هفدهم و هجدهم این بناها برپاست: کاخی سه‌طبقه که تالار طاق‌دارِ زیرینش زمانی سفره‌خانه‌ی
    راهبان بود، حمامی، برجِ ناقوسی، و انباری از شراب که به سده‌های دهم تا دوازدهم برمی‌گردد و راهبان هنوز
    در آن در کووِری (خمره‌های سفالی) شراب می‌سازند.


    آلاوردوبای کهن در ۲۹ سپتامبر آغاز می‌شد و سه هفته می‌پایید؛ زائران از کیزیکی، تیانتی، و کوهستان‌های
    پشاوی و خِوسورتی می‌آمدند تا سراسر شب را بیدار بمانند، و همسایگانِ کیست و داغستانی نیز می‌آمدند. برداشت
    انگور هنوز هم بر آستانه‌ی همین در به پایان می‌رسد.
  tip: >-
    آیین‌نامه‌ی پوشش دمِ دروازه جدی گرفته می‌شود: دامنی بلند و روسری برای زنان، شلوار بلند برای مردان
    — با شلوارک راهتان نمی‌دهند. روپوش‌ها معمولاً کنارِ در آویخته‌اند. صبح، پیش از گروه‌های تور، بیایید،
    وقتی آفتاب از پنجره‌های خاوری می‌تابد؛ اگر عبادتی برپاست، برای شنیدنِ سرود زیر آن گنبد بمانید. پارکینگ
    بیرونِ دیوار است، و یک ساعت کافی است. در اواخر سپتامبر، هنگامِ آلاوردوبا و برداشت انگور، انتظارِ ازدحام
    در حیاط و تراکتورهای پر از انگور در راه‌ها را داشته باشید. با افزودن ایکالتو و گِرمی، روزی کامل خواهید
    داشت.
  route: >-
    از راهِ گومبوری بروید: S5 از تفلیس، سپس Sh38 از وازیانی از روی گذرگاه تا کنارِ تلاوی، حدود ۸۹ کیلومتر.
    آن‌جا به Sh42 بپیوندید و حدود ۷ کیلومتر به‌سوی شمال‌باختر، در جهت آخمِتا، بروید، سپس به راست بر Sh184
    بپیچید که حدود ۹ کیلومتر از دشتِ تاکستان‌ها می‌گذرد تا کلیسای جامع. در کل حدود ۱۱۰ کیلومتر و دو ساعت.
    راه‌های دشت به‌خوبی آسفالته‌اند و خودروی اقتصادی کافی است. در تلاوی باک را پر کنید. اگر گومبوری با
    برف بسته باشد، از راه S5 و Sh42 از میان ساگارجو و گورجانی دور بزنید — حدود ۱۷۰ کیلومتر؛ سه ساعت زمان
    بگذارید.
he:
  name: קתדרלת אלוורדי
  short: >-
    קתדרלת קווירקה השלישי מהמאה ה-11, בגובה של יותר מחמישים מטר, ניצבת בודדה במישור האלאזני — כמעט אלף
    שנה הכנסייה הגבוהה ביותר בגאורגיה.
  body: >-
    **כמעט אלף שנה שום כנסייה בגאורגיה לא הייתה גבוהה מאלוורדי, ובמישור האלאזני השטוח רואים אותה הרבה
    לפני שמגיעים אליה.**


    יוסף האלוורדי, אחד משלושה-עשר האבות האשוריים, הגיע מאנטיוכיה במאה השישית והקים מנזר בכפר קטן ששימש
    בעבר מרכז פגאני לפולחן הירח. בתחילת המאה ה-11 המלך קווירקה השלישי מקאחתי החליף את כנסיית גאורגיוס
    הקדוש הקטנה בקתדרלה העומדת כאן היום: 41.7 על 26.4 מטר, בגובה של יותר מחמישים מטר, וכיפתה מנוקבת בשישה-עשר
    חלונות. רק קתדרלת סמבה בטביליסי, שנחנכה ב-2004, התנשאה גבוה יותר.


    הבניין אינו מסתיר את ההיסטוריה שלו. ב-1614 הפך אותו שאה עבאס למצודה עם חיל מצב פרסי, ופייקאר-ח'אן,
    מושל גנג'ה, בנה לעצמו ארמון לבנים בתוך החומות. אחרי רעידת האדמה של 1742 החלה המלכה תמר בשיפוצים ב-1750
    וארקלה השני סיים אותם — בלבנים, ומשום כך החלקים המשוקמים נראים חמים יותר מאבן השירימי המקורית. פנים
    הכנסייה, שסויד בלבן בסוף המאה ה-19, נוקה ב-1966 וחשף את שכבותיו: שרידים מהמאה ה-11, ציור מהמאות ה-15-16
    בזרוע הדרומית, סצנות מהמאות ה-16-17 על הקירות המערביים והצפוניים. כאן קבור יוסף, וכן המלכה הקדושה
    קטבאן המעונה והמלך טימוראז הראשון.


    בתוך החומה מהמאות ה-17-18 עומדים ארמון בן שלוש קומות שהאולם התחתון המקומר שלו שימש כחדר האוכל של הנזירים,
    בית מרחץ, מגדל פעמונים ומרתף יין מהמאות ה-10-12, שבו הנזירים עדיין מייצרים יין בכדי חרס מסורתיים (קווברי).


    האלוורדובה הישנה נפתחה ב-29 בספטמבר ונמשכה שלושה שבועות; עולי רגל הגיעו למשמרת תפילה של לילה שלם מקיזיקי,
    מטיאנטי ומהרי פשאווי וחווסורתי, ובאו גם שכנים קיסטים ודגסטנים. והבציר מסתיים עד היום בפתח הזה.
  tip: >-
    קוד הלבוש נשמר בקפדנות בשער: חצאית ארוכה וכיסוי ראש לנשים, מכנסיים ארוכים לגברים — במכנסיים קצרים
    לא תיכנסו. בגדי כיסוי תלויים בדרך כלל בכניסה. הגיעו בבוקר, לפני קבוצות התיירים, כשהשמש חודרת בחלונות
    המזרחיים; אם מתקיימת תפילה, הישארו לשמוע את השירה מתחת לכיפה. החניה מחוץ לחומה, ושעה אחת מספיקה. בסוף
    ספטמבר, בעת האלוורדובה ובציר הענבים, צפו לקהל רב בחצר ולטרקטורים עמוסי ענבים בדרכים. איקלטו וגרמי
    משלימים את הביקור באופן טבעי ליום מלא.
  route: >-
    סעו בדרך גומבורי: S5 מטביליסי, ואז Sh38 מוואזיאני דרך המעבר ובירידה עד שולי טלאווי, כ-89 ק"מ. משם
    הצטרפו ל-Sh42 צפון-מערבה לכיוון אחמטה לכ-7 ק"מ, ואז פנו ימינה ל-Sh184, שחוצה כ-9 ק"מ במישור הכרמים
    אל הקתדרלה. בסך הכל כ-110 ק"מ ושעתיים. הדרכים במישור סלולות היטב ורכב חסכוני מספיק בהחלט. תדלקו בטלאווי.
    אם מעבר גומבורי סגור בשל שלג, סעו במסלול עוקף על S5 ו-Sh42 דרך סאגארג'ו וגורג'אני — כ-170 ק"מ; הקצו
    שלוש שעות.
ar:
  name: كاتدرائية ألافردي
  short: >-
    كاتدرائية كفيريكه الثالث من القرن الحادي عشر، بارتفاع يزيد على خمسين مترًا ومنفردة في سهل ألازاني
    — أطول كنيسة في جورجيا لقرابة ألف عام.
  body: >-
    **لقرابة ألف عام لم تكن أي كنيسة في جورجيا أطول من ألافردي، وفي سهل ألازاني المستوي تراها قبل أن تبلغها
    بزمن طويل.**


    قدِم يوسف الألافردي، أحد الآباء الآشوريين الثلاثة عشر، من أنطاكية في القرن السادس، وأسس دَيرًا في
    قرية صغيرة كانت مركزًا وثنيًا لعبادة القمر. وفي أوائل القرن الحادي عشر، استبدل الملك كفيريكه الثالث،
    ملك كاختي، كنيستها الصغيرة، كنيسة القديس جورجيوس، بالكاتدرائية القائمة اليوم: بأبعاد 41.7 في 26.4
    مترًا، وارتفاع يزيد على خمسين مترًا، وقبة تخترقها ست عشرة نافذة. ولم تعلُ عليها إلا كاتدرائية سامِبا
    في تبليسي، التي كُرِّست عام 2004.


    لا يخفي البناء تاريخه. في عام 1614 حوّله الشاه عباس إلى قلعة بحامية فارسية، وشيّد بيكار خان، حاكم
    غانجا، لنفسه قصرًا من الآجر داخل الأسوار. وبعد زلزال 1742 بدأت الملكة تامار أعمال الترميم عام 1750
    وأتمّها إيريكله الثاني — بالآجر، ولهذا تبدو الأجزاء المُرمَّمة أدفأ من حجر الشيريمي الأصلي. وكان الداخل
    قد طُلي بالجير في أواخر القرن التاسع عشر، ثم نُظّف عام 1966 فتكشّفت طبقاته: شذرات من القرن الحادي
    عشر، ورسوم من القرنين الخامس عشر والسادس عشر في الجناح الجنوبي، ومشاهد من القرنين السادس عشر والسابع
    عشر على الجدارين الغربي والشمالي. هنا يرقد يوسف، وكذلك الملكة كيتيفان الشهيدة والملك تيموراز الأول.


    وداخل السور من القرنين السابع عشر والثامن عشر يقوم قصر من ثلاث طبقات كانت قاعته السفلى المقنطرة قاعةَ
    طعامٍ للرهبان في وقتٍ ما، وحمّام، وبرج جرس، وقبو نبيذ يعود إلى القرنين العاشر والثاني عشر، ما زال
    الرهبان يصنعون فيه النبيذ في جرار الكفيفري.


    كان الألافردوبا القديم يبدأ في 29 سبتمبر ويستمر ثلاثة أسابيع؛ وكان الحجّاج يأتون للسهر الليل كله من
    كيزيكي وتيانتي وجبال بشافي وخفسوريتي، كما كان يأتي الجيران الكيست والداغستانيون. وما زال قطاف العنب
    ينتهي عند هذا الباب.
  tip: >-
    يُطبَّق قانون اللباس بصرامة عند البوابة: تنورة طويلة وغطاء رأس للنساء، وسروال طويل للرجال — لن يُسمح
    لك بالدخول بالسروال القصير. تتوفر عادة أوشحة عند المدخل. تعال في الصباح، قبل مجموعات الجولات، حين
    تنفذ الشمس من النوافذ الشرقية؛ وإذا كان هناك قداس، فابقَ لسماع الترتيل تحت تلك القبة. الموقف خارج
    السور، وتكفي ساعة واحدة. في أواخر سبتمبر، وقت الألافردوبا وحصاد العنب، توقّع ازدحامًا في الساحة وجرارات
    محمّلة بالعنب على الطرق. وتشكّل إيكالتو وغريمي رفيقتين طبيعيتين لها في يوم كامل.
  route: >-
    اسلك طريق غومبوري: S5 من تبليسي، ثم Sh38 من فازياني عبر الممر ونزولًا إلى حافة تيلافي، نحو 89 كم.
    من هناك انتقل إلى طريق Sh42 شمال غربًا نحو أخميتا لنحو 7 كم، ثم انحرف يمينًا إلى Sh184، الذي يمتد
    نحو 9 كم عبر سهل الكروم إلى الكاتدرائية. المسافة الإجمالية نحو 110 كم وساعتان. الطرق في السهل معبّدة
    جيدًا وتكفيها سيارة اقتصادية. عبّئ الوقود في تيلافي. إذا كان غومبوري مغلقًا بالثلوج، فالتفّ عبر S5
    وSh42 مرورًا بساغاريجو وغورجاني — نحو 170 كم؛ خصص ثلاث ساعات.
