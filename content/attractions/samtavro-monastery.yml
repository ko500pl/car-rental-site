ka:
  name: სამთავროს მონასტერი
  short: >-
    მცხეთის იუნესკოს ანსამბლის წყნარი ნახევარი — მოქმედი დედათა მონასტერი, სადაც ქართლის პირველი ქრისტიანი
    მეფე და დედოფალი განისვენებენ.
  body: >-
    **სამთავრო მცხეთის იუნესკოს ანსამბლის უფრო წყნარი ნახევარია** — სვეტიცხოვლიდან ხუთი წუთის სავალზე,
    აღმართში, და ტურისტული ავტობუსების უმეტესობა აქამდე არ ადის. ეს მოქმედი ქალთა მონასტერია, ამიტომ ეზოში
    სალარო კი არა, ვარდები, გარეცხილი სამოსი და კატებია.


    ისტორია 330-იანი წლებიდან იწყება. როცა ნინო, ქალი რომელმაც ქართლი გააქრისტიანა, მცხეთაში მოვიდა, სამეფო
    ბაღის კიდეზე მაყვლოვანში დასახლდა. მირიან III-მ, ქართლის პირველმა ქრისტიანმა მეფემ, ამ ადგილას ეკლესია
    ააგო. ეზოს ჩრდილო-აღმოსავლეთ კუთხეში მდგარი პატარა ქვის ეკლესია, წმინდა ნინოს სახელობისა, გვიანდელია,
    მაგრამ სწორედ იმ ადგილს აღნიშნავს; გვერდით ამოსული მაყვალი კი პირვანდელის შთამომავლად ითვლება.


    მის გვერდით მდგარი დიდი ჯვარგუმბათოვანი ტაძარი, ფერისცვალების ეკლესია, XI საუკუნისაა და გიორგი I-ის
    დროს აშენდა, მას შემდეგ რაც მიწისძვრებმა ძველი ნაგებობა დაანგრია. შიგნით, ჩრდილოეთ კედელთან, ორი დაბალი
    ქვის საფლავია: მირიან მეფისა და ნანა დედოფლისა. კედლებზე XVII საუკუნის მოხატულობის ფრაგმენტები შემორჩა,
    ეზოში კი XV-XVI საუკუნეების დაბალი სამრეკლო ცალკე დგას.


    ეზო ჩვეულებრივ სულ სხვა მიზეზით არის ხალხმრავალი. გაბრიელ ურგებაძე, ბერი, რომელსაც ქრისტესთვის სულელად
    მიიჩნევდნენ და რომელმაც 1965 წელს საჯაროდ დაწვა ლენინის პორტრეტი, აქ გარდაიცვალა 1995 წელს და ეზოშივეა
    დაკრძალული. 2012 წელს ის წმინდანად შერაცხეს, და მის საფლავთან, დაბალ, მოაჯირშემოვლებულ ბორცვთან ფარდულის
    ქვეშ, მთელი საქართველოდან მოსული მლოცველების რიგი დგას.


    გალავნის უკან მდებარე ფერდობი ქვეყნის ერთ-ერთი უმნიშვნელოვანესი არქეოლოგიური ძეგლიცაა: სამთავროს სამაროვანმა,
    რომლის თხრაც 1870-იან წლებში დაიწყო, გვიანი ბრინჯაოს ხანიდან ადრექრისტიანულ საუკუნეებამდე ათასობით
    სამარხი მოგვცა. დღეს მისგან არაფერი ჩანს, ნაპოვნი ნივთები კი თბილისის ეროვნული მუზეუმის რამდენიმე
    დარბაზს ავსებს.
  tip: >-
    ორმოციდან სამოც წუთამდე საკმარისია, თუ წირვა არ მიმდინარეობს. ეს მოქმედი დედათა მონასტერია: ქალებს
    გრძელი კაბა ან შემოსახვევი და თავსაფარი სჭირდებათ, მამაკაცებს — გრძელი შარვალი; მონაზვნების ფოტოს
    გადაღება არ შეიძლება. შემოსახვევები კარიბჭესთან ჰკიდია. მამა გაბრიელის საფლავთან რიგი კვირაობით და
    2 ნოემბერს, მისი ხსენების დღეს, ოც წუთსაც გრძელდება. ეზო ბრტყელია და მარტივი, თუმცა ტაძრის იატაკი
    არათანაბარი ქვაა. ტუალეტი შიგნით არ არის — ისარგებლე ქვემოთ, მთავარ ქუჩაზე არსებული კაფეებით. პარკინგი
    ქუჩაშია და შუადღისთვის ივსება.
  route: >-
    თბილისიდან ჩრდილოეთით გახვალ E60-ით გორის მიმართულებით და 20 კმ-ის შემდეგ მცხეთის გასასვლელს აიღებ;
    ალტერნატივაა ძველი სამხედრო გზა ნატახტარზე. ორივე ასფალტია: 26 კმ, დაახლოებით 35 წუთი. მცხეთაში მთავარ
    ქუჩას სვეტიცხოვლის გვერდით გაჰყევი და კიდევ 400 მეტრი ჩრდილოეთით იარე — სამთავრო მარჯვნივ, ქვის გალავნის
    უკან დგას, სამხედრო გზის გასაყარამდე ცოტა ადრე. დააპარკინგე ქუჩაში ან სვეტიცხოვლის დიდ ფასიან სადგომზე
    და ფეხით ამოდი. ეკონომ-კლასის მანქანა მთელი წელი საკმარისია; საწვავი თბილისში აიღე.
en:
  name: Samtavro Monastery
  short: >-
    The quieter half of Mtskheta's UNESCO ensemble — a working nunnery holding the graves of Georgia's
    first Christian king and queen.
  body: >-
    **Samtavro is the quieter half of Mtskheta's UNESCO ensemble** — five minutes uphill from Svetitskhoveli,
    and most coach groups never make the walk. It is a working nunnery, so the courtyard has roses, washing
    lines and cats rather than ticket desks.


    The story starts in the 330s. When Nino, the woman who converted Kartli to Christianity, arrived in
    Mtskheta she lived in a bramble thicket at the edge of the royal garden. King Mirian III, the first
    Christian ruler of Iberia, built a church over the spot. The small stone chapel in the north-east
    corner of the yard, dedicated to St Nino, is a later replacement, but it marks the place; the blackberry
    bush growing beside it is treated as a descendant of the original.


    The large cruciform church next to it, the Church of the Transfiguration, is 11th century, put up
    under King George I after earthquakes brought down the earlier building. Inside, against the north
    wall, two low stone tombs hold King Mirian and Queen Nana — about as close as Georgia comes to a national
    founding grave. Fragments of 17th-century painting survive on the walls, and a squat bell tower of
    the 15th or 16th century stands separately in the yard.


    The crowd in the courtyard, though, is usually there for something else entirely. Gabriel Urgebadze,
    a monk regarded as a holy fool, who publicly burned a portrait of Lenin in 1965, died here in 1995
    and was buried in the grounds. He was canonised in 2012, and his grave — a low railed mound under
    a canopy — draws a steady queue of pilgrims from all over the country.


    The slope behind the walls is also one of Georgia's most important archaeological sites. The Samtavro
    cemetery, dug from the 1870s onwards, produced thousands of burials running from the Late Bronze Age
    to the early Christian centuries. Nothing of it shows on the surface now, but the finds fill several
    rooms of the National Museum in Tbilisi.
  tip: >-
    Forty minutes to an hour is enough unless a service is under way. This is an active convent: women
    need a long skirt or a wrap and a headscarf, men long trousers, and the nuns are not to be photographed.
    Wraps hang by the gate. The queue at Father Gabriel's grave can run to twenty minutes on Sundays and
    on 2 November, his feast day. The ground is flat and easy, though the church floor is uneven stone.
    There are no toilets inside the walls; use the cafés on the main street below. Street parking fills
    up by mid-morning.
  route: >-
    Leave Tbilisi northbound on the E60 towards Gori and take the Mtskheta exit after about 20 km; the
    older Military Highway through Natakhtari is an alternative. Both are asphalt: 26 km, roughly 35 minutes.
    In Mtskheta follow the main street past Svetitskhoveli and continue north for another 400 metres —
    Samtavro is on the right behind a stone wall, just short of the Military Highway junction. Park on
    the street or in the large paid lot beside Svetitskhoveli and walk up. An economy car is fine all
    year, and fuel is easier to find in Tbilisi than in Mtskheta.
ru:
  name: Монастырь Самтавро
  short: >-
    Тихая половина мцхетского ансамбля ЮНЕСКО — действующий женский монастырь с гробницами первого христианского
    царя и царицы Грузии.
  body: >-
    **Самтавро — тихая половина мцхетского ансамбля ЮНЕСКО:** пять минут в гору от Светицховели, и туда
    почти не доходят автобусные группы. Это действующий женский монастырь, так что во дворе не кассы,
    а розы, бельевые верёвки и кошки.


    История начинается в 330-х годах. Когда Нино, обратившая Картли в христианство, пришла в Мцхету, она
    поселилась в ежевичнике на краю царского сада. Мириан III, первый христианский царь Иберии, построил
    на этом месте церковь. Маленький каменный храм в северо-восточном углу двора, освящённый во имя святой
    Нино, — постройка более поздняя, но он отмечает ту самую точку; растущий рядом куст ежевики считают
    потомком первоначального.


    Стоящий рядом крупный крестово-купольный храм Преображения относится к XI веку: его возвели при царе
    Георгии I после того, как землетрясения разрушили прежнее здание. Внутри, у северной стены, две низкие
    каменные гробницы — царя Мириана и царицы Наны. На стенах уцелели фрагменты росписи XVII века, а во
    дворе отдельно стоит приземистая колокольня XV-XVI веков.


    Впрочем, людно во дворе обычно совсем по другой причине. Габриэль Ургебадзе, монах, которого считали
    юродивым и который в 1965 году публично сжёг портрет Ленина, умер здесь в 1995 году и похоронен в
    ограде. В 2012 году его канонизировали, и к его могиле — невысокому холмику за оградкой под навесом
    — тянется постоянная очередь паломников со всей страны.


    Склон за монастырской стеной — ещё и один из важнейших археологических памятников Грузии. Самтаврский
    могильник, который начали копать в 1870-х, дал тысячи погребений от позднего бронзового века до раннехристианских
    столетий. На поверхности сегодня не видно ничего, зато находки занимают несколько залов Национального
    музея в Тбилиси.
  tip: >-
    Сорока минут — часа хватает, если нет службы. Монастырь действующий: женщинам нужна длинная юбка или
    платок на пояс и косынка, мужчинам — длинные брюки; монахинь не фотографируют. Накидки висят у ворот.
    К могиле отца Габриэля по воскресеньям и 2 ноября, в день его памяти, очередь занимает минут двадцать.
    Двор ровный, ходить легко, но пол в храме — неровный камень. Туалета на территории нет, ближайшие
    в кафе на главной улице внизу. Парковка уличная и к середине дня заполняется.
  route: >-
    Из Тбилиси на север по трассе E60 в сторону Гори, через 20 км съезд на Мцхету; альтернатива — старая
    Военно-Грузинская дорога через Натахтари. Обе асфальтированные: 26 км, около 35 минут. В Мцхете езжайте
    по главной улице мимо Светицховели и дальше на север ещё 400 метров — Самтавро справа, за каменной
    оградой, чуть не доезжая развязки Военно-Грузинской дороги. Машину оставляют на улице или на большой
    платной стоянке у Светицховели. Эконом-класса достаточно круглый год, а заправляться удобнее в Тбилиси.
fa:
  name: صومعهٔ سامتاورو
  short: نیمهٔ آرام مجموعهٔ یونسکوی متسختا؛ صومعه‌ای فعال که گور نخستین شاه و ملکهٔ مسیحی گرجستان در آن
    است.
  body: >-
    **سامتاورو نیمهٔ آرام مجموعهٔ یونسکوی متسختاست** — پنج دقیقه سربالایی از سوتیتسخوولی، و بیشتر گروه‌های
    اتوبوسی هرگز این راه را نمی‌روند. صومعه‌ای زنانه و فعال است، پس در حیاطش گل سرخ و بند رخت و گربه می‌بینید،
    نه باجهٔ بلیت.


    داستان از دههٔ 330 میلادی آغاز می‌شود. وقتی نینو، زنی که کارتلی را مسیحی کرد، به متسختا رسید، در بوته‌زار
    تمشکی بر کنارهٔ باغ شاهی ساکن شد. میریان سوم، نخستین فرمانروای مسیحی ایبری، بر همان نقطه کلیسایی ساخت.
    کلیسای سنگی کوچکی که در گوشهٔ شمال شرقی حیاط ایستاده و به نام نینوی قدیس است، ساختی متأخرتر است اما
    همان جا را نشان می‌دهد؛ بوتهٔ تمشکی که کنارش روییده را بازماندهٔ بوتهٔ نخستین می‌شمارند.


    کلیسای بزرگ چلیپایی کنار آن، کلیسای تجلی، از سدهٔ یازدهم است و در روزگار گیورگی یکم برپا شد، پس از
    آنکه زمین‌لرزه‌ها بنای پیشین را فرو ریخت. درون آن، کنار دیوار شمالی، دو گور سنگی کوتاه است: شاه میریان
    و ملکه نانا؛ نزدیک‌ترین چیزی که گرجستان به گور بنیان‌گذاران ملی خود دارد. بر دیوارها پاره‌هایی از
    نقاشی سدهٔ هفدهم مانده و در حیاط برج ناقوس کوتاهی از سدهٔ پانزدهم یا شانزدهم جدا ایستاده است.


    با این همه، شلوغی حیاط معمولاً دلیل دیگری دارد. گابریل اورگبادزه، راهبی که او را دیوانهٔ مقدس می‌شمردند
    و در 1965 تصویر لنین را در ملأ عام سوزاند، در 1995 همین‌جا درگذشت و در محوطه به خاک سپرده شد. در 2012
    قدیس شناخته شد و بر سر گورش، پشته‌ای کوتاه با نرده و سایبان، صفی پیوسته از زائران سراسر کشور می‌ایستد.


    دامنهٔ پشت دیوارها یکی از مهم‌ترین محوطه‌های باستانی گرجستان نیز هست. گورستان سامتاورو که کاوش آن
    از دههٔ 1870 آغاز شد، هزاران گور از اواخر عصر برنز تا سده‌های نخست مسیحی به دست داد. امروز چیزی از
    آن بر سطح زمین پیدا نیست، اما یافته‌هایش چند تالار موزهٔ ملی تفلیس را پر کرده است.
  tip: >-
    چهل دقیقه تا یک ساعت کافی است، مگر مراسمی برپا باشد. اینجا صومعه‌ای فعال است: زنان به دامن بلند یا
    شال کمر و روسری نیاز دارند و مردان به شلوار بلند، و از راهبه‌ها عکس نگیرید. شال‌ها کنار دروازه آویزان
    است. صف گور پدر گابریل یکشنبه‌ها و در 2 نوامبر، روز یادبود او، گاه به بیست دقیقه می‌رسد. حیاط هموار
    است و راه رفتن آسان، اما کف کلیسا سنگ ناهموار است. درون حصار سرویس بهداشتی نیست؛ از کافه‌های خیابان
    اصلی پایین استفاده کنید. پارکینگ خیابانی است و تا میانهٔ روز پر می‌شود.
  route: >-
    از تفلیس به شمال روی بزرگراه E60 به سوی گوری بروید و پس از حدود 20 کیلومتر خروجی متسختا را بگیرید؛
    گزینهٔ دیگر جادهٔ قدیمی نظامی از ناتاختاری است. هر دو آسفالت‌اند: 26 کیلومتر و نزدیک 35 دقیقه. در
    متسختا خیابان اصلی را از کنار سوتیتسخوولی ادامه دهید و 400 متر دیگر به شمال بروید؛ سامتاورو سمت راست،
    پشت دیواری سنگی و اندکی پیش از تقاطع بزرگراه نظامی است. خودرو را در خیابان یا در پارکینگ بزرگ و پولی
    سوتیتسخوولی بگذارید و پیاده بالا بروید. خودروی اقتصادی در همهٔ فصل‌ها کافی است و سوخت را در تفلیس
    بگیرید.
he:
  name: מנזר סמטברו
  short: המחצית השקטה של מכלול אונסק״ו במצחתה — מנזר נזירות פעיל ובו קברי המלך והמלכה הנוצריים הראשונים
    של גאורגיה.
  body: >-
    **סמטברו הוא המחצית השקטה של מכלול אונסק״ו במצחתה** — חמש דקות במעלה הרחוב מסווטיצחוולי, ורוב קבוצות
    האוטובוסים אינן טורחות לעלות. זהו מנזר נזירות פעיל, ולכן בחצר יש ורדים, חבלי כביסה וחתולים ולא דוכני
    כרטיסים.


    הסיפור מתחיל בשנות ה-330. כשנינו, האישה שהמירה את קרתלי לנצרות, הגיעה למצחתה, היא התיישבה בסבך פטל
    בקצה גן המלוכה. מיריאן השלישי, השליט הנוצרי הראשון של איבריה, בנה כנסייה על אותה נקודה. הכנסייה הקטנה
    שבפינה הצפונית-מזרחית של החצר, על שם נינו הקדושה, היא בנייה מאוחרת יותר אך היא מסמנת את המקום; שיח
    הפטל הצומח לצדה נחשב צאצא של השיח המקורי.


    הכנסייה הצלבית הגדולה שלצדה, כנסיית ההשתנות, היא מן המאה ה-11 והוקמה בימי המלך גיאורגי הראשון לאחר
    שרעידות אדמה הפילו את המבנה הקודם. בתוכה, אל מול הקיר הצפוני, שני קברי אבן נמוכים: של המלך מיריאן
    ושל המלכה נאנה, הקרוב ביותר שיש בגאורגיה לקבר מייסדים לאומי. על הקירות שרדו קטעי ציור מן המאה ה-17,
    ובחצר עומד בנפרד מגדל פעמונים נמוך מן המאה ה-15 או ה-16.


    ואולם הקהל בחצר מגיע בדרך כלל בשל דבר אחר לגמרי. גבריאל אורגבאדזה, נזיר שנחשב שוטה קדוש ואשר שרף בפומבי
    ב-1965 דיוקן של לנין, מת כאן ב-1995 ונקבר בשטח המנזר. ב-2012 הוכרז קדוש, ואל קברו — תלולית נמוכה מגודרת
    תחת גגון — נמשך תור קבוע של עולי רגל מכל רחבי המדינה.


    המדרון שמאחורי החומות הוא גם אחד האתרים הארכיאולוגיים החשובים בגאורגיה. בית הקברות של סמטברו, שנחפר
    מאז שנות השבעים של המאה ה-19, הניב אלפי קברים מסוף תקופת הברונזה ועד המאות הנוצריות המוקדמות. על פני
    השטח לא נראה ממנו דבר, אך הממצאים ממלאים כמה אולמות במוזיאון הלאומי בטביליסי.
  tip: >-
    ארבעים דקות עד שעה מספיקות, אלא אם מתקיימת תפילה. זהו מנזר פעיל: נשים זקוקות לחצאית ארוכה או לכיסוי
    מותניים ולמטפחת ראש, גברים למכנסיים ארוכים, ואין לצלם את הנזירות. כיסויים תלויים ליד השער. התור לקברו
    של האב גבריאל מגיע לעשרים דקות בימי ראשון וב-2 בנובמבר, יום זכרו. השטח מישורי והליכה בו קלה, אך רצפת
    הכנסייה עשויה אבן לא אחידה. אין שירותים בתחומי החומה; השתמשו בבתי הקפה שברחוב הראשי למטה. החניה ברחוב
    מתמלאת עד אמצע היום.
  route: >-
    צאו מטביליסי צפונה בכביש E60 לכיוון גורי ורדו ביציאה למצחתה לאחר כ-20 ק״מ; חלופה היא כביש הצבא הישן
    דרך נטאחטארי. שניהם סלולים: 26 ק״מ, כ-35 דקות. במצחתה סעו ברחוב הראשי על פני סווטיצחוולי והמשיכו צפונה
    עוד 400 מטר — סמטברו מימין, מאחורי חומת אבן, מעט לפני צומת כביש הצבא. אפשר להחנות ברחוב או בחניון
    הגדול בתשלום שליד סווטיצחוולי ולעלות ברגל. רכב חסכוני מספיק בכל ימות השנה, ותדלוק נוח יותר בטביליסי.
ar:
  name: دير سامتافرو
  short: النصف الهادئ من مجموعة متسخيتا المدرجة في اليونسكو — دير راهبات عامل يضم قبري أول ملك وملكة مسيحيين
    في جورجيا.
  body: >-
    **سامتافرو هو النصف الهادئ من مجموعة متسخيتا المدرجة في اليونسكو** — خمس دقائق صعوداً من سفيتيتسخوفيلي،
    ونادراً ما تتكبد حافلات الرحلات هذا الصعود. وهو دير راهبات عامل، فترى في فنائه الورد وحبال الغسيل
    والقطط لا شبابيك التذاكر.


    تبدأ الحكاية في ثلاثينيات القرن الرابع. حين وصلت نينو، المرأة التي أدخلت المسيحية إلى كارتلي، إلى
    متسخيتا، أقامت في أجمة عليق على طرف حديقة الملك. فبنى ميريان الثالث، أول حاكم مسيحي لإيبيريا، كنيسة
    في الموضع نفسه. والكنيسة الحجرية الصغيرة القائمة في الركن الشمالي الشرقي من الفناء، وهي على اسم القديسة
    نينو، بناء متأخر لكنه يعلّم المكان؛ وشجيرة العليق النابتة إلى جانبها تُعدّ سليلة الشجيرة الأولى.


    أما الكنيسة الصليبية الكبيرة المجاورة، كنيسة التجلي، فتعود إلى القرن الحادي عشر وأقيمت في عهد الملك
    غيورغي الأول بعد أن هدمت الزلازل البناء السابق. وفي داخلها، إلى جوار الجدار الشمالي، قبران حجريان
    منخفضان: للملك ميريان وللملكة نانا، وهما أقرب ما لدى جورجيا من قبر تأسيسي وطني. وعلى الجدران بقايا
    تصوير من القرن السابع عشر، وفي الفناء برج أجراس قصير قائم بذاته من القرن الخامس عشر أو السادس عشر.


    غير أن ازدحام الفناء سببه في العادة شيء آخر تماماً. فغابرييل أورغيبادزه، وهو راهب عُدّ من مجانين المسيح
    وأحرق علناً صورة لينين عام 1965، توفي هنا عام 1995 ودُفن داخل الحرم. وقد أُعلن قديساً عام 2012، ويقف
    عند قبره، وهو ربوة منخفضة محاطة بسياج تحت مظلة، طابور متصل من الحجاج من أنحاء البلاد.


    والمنحدر خلف الأسوار من أهم المواقع الأثرية في جورجيا أيضاً. فمقبرة سامتافرو، التي بدأ التنقيب فيها
    في سبعينيات القرن التاسع عشر، كشفت آلاف القبور من أواخر العصر البرونزي حتى القرون المسيحية الأولى.
    لا يظهر منها على السطح شيء اليوم، لكن مكتشفاتها تملأ عدة قاعات في المتحف الوطني بتبليسي.
  tip: >-
    أربعون دقيقة إلى ساعة تكفي ما لم تكن هناك صلاة. المكان دير عامل: تحتاج النساء إلى تنورة طويلة أو غطاء
    للخصر وإلى غطاء للرأس، ويحتاج الرجال إلى بنطال طويل، ولا تُصوَّر الراهبات. والأغطية معلقة عند البوابة.
    وقد يمتد الطابور عند قبر الأب غابرييل عشرين دقيقة أيام الأحد وفي 2 نوفمبر، يوم ذكراه. الأرض مستوية
    والمشي سهل، لكن أرضية الكنيسة حجر غير منتظم. لا دورات مياه داخل السور؛ استعن بمقاهي الشارع الرئيسي
    في الأسفل. والوقوف في الشارع يمتلئ بحلول منتصف النهار.
  route: >-
    اخرج من تبليسي شمالاً على الطريق E60 باتجاه غوري وخذ مخرج متسخيتا بعد نحو 20 كم، أو اسلك الطريق العسكري
    القديم عبر ناتاختاري. كلاهما معبّد: 26 كم ونحو 35 دقيقة. وفي متسخيتا سر في الشارع الرئيسي بمحاذاة
    سفيتيتسخوفيلي ثم تابع شمالاً 400 متر؛ سامتافرو على اليمين خلف سور حجري، قبيل تقاطع الطريق العسكري.
    أوقف السيارة في الشارع أو في الموقف الكبير المدفوع قرب سفيتيتسخوفيلي وامشِ صعوداً. وسيارة اقتصادية
    تكفي طوال العام، والتزود بالوقود أسهل في تبليسي.
