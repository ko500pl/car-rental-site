ka:
  name: სამთავროს მონასტერი
  short: >-
    სადაც ნინო მაყვლოვანში ცხოვრობდა და ქართლის პირველი ქრისტიანი მეფე განისვენებს — მოქმედი დედათა მონასტერი
    სვეტიცხოვლიდან ხუთი წუთის სავალზე.
  body: >-
    **ძველი მემატიანეები სვეტიცხოველს „ქვემო ეკლესიას“ უწოდებდნენ, სამთავროს — „ზემო ეკლესიას“. ზემო ეკლესია
    დღესაც მცხეთის ამბის უფრო მშვიდ და უფრო იდუმალ ნახევარს ინახავს.**


    გადმოცემით, IV საუკუნეში მცხეთაში მოსული ნინო სწორედ აქ, სამეფო ბაღის პირას, მაყვლოვანში დაემკვიდრა,
    ქართლის პირველმა ქრისტიანმა მეფემ მირიან III-მ კი ამ ადგილას ეკლესია ააგო. ამ ხსოვნას დიდი ტაძრის
    აღმოსავლეთით მდგარი წმინდა ნინოს პაწია გუმბათოვანი ეკლესია ინახავს — ადრეული შუა საუკუნეების ნაგებობა,
    სიგრძით ექვს მეტრსაც ძლივს რომ აღწევს.


    მთავარი, ფერისცვალების ტაძარი XI საუკუნის პირველ ნახევარს განეკუთვნება — გიორგი I-ისა და კათოლიკოს
    მელქისედეკ I-ის ხანას. კედლები მოყვითალო-მოყავისფრო თლილი ქვით არის ნაგები; ყველაზე ნატიფად სამხრეთის
    ფასადია მოჩუქურთმებული. 1283 წლის მიწისძვრამ გუმბათი ჩამოაქცია — დღევანდელი ყელი XIII-XIV საუკუნეთა
    მიჯნაზეა აღდგენილი. შიგნით, სამხრეთ-დასავლეთ კუთხეში, მირიან მეფე და ნანა დედოფალი განისვენებენ. მათი
    საფლავის ქვები მხოლოდ XIX საუკუნეში გამოკვეთეს — გვიანდელი ხელმოწერა უძველეს გადმოცემაზე.


    ეზოში შეკრებილთა უმრავლესობა კი XX საუკუნის წმინდანთან მოდის. მამა გაბრიელ ურგებაძემ 1965 წლის პირველმაისულ
    დემონსტრაციაზე ლენინის პორტრეტს ცეცხლი წაუკიდა, რასაც ცემა, დაპატიმრება და ფსიქიატრიულ საავადმყოფოში
    გატარებული თვეები მოჰყვა. 1971 წლიდან აქ მსახურობდა, სიცოცხლის ბოლო წლები მონასტრის ძველ კოშკში გაატარა
    და 1995 წელს გარდაიცვალა. 2012 წელს წმინდანად შერაცხეს; 2014 წლიდან მისი ნეშტი მონასტრის აკლდამაში
    განისვენებს და მლოცველთა რიგი აქ იშვიათად წყდება.


    გალავნის ჩრდილოეთით სამთავროს სამაროვანია, სადაც ძვ. წ. III ათასწლეულის შუა ხანიდან ახ. წ. X საუკუნემდე
    კრძალავდნენ. აქ ნაპოვნ IV-V საუკუნეთა მიჯნის საფლავის ქვაზე ბერძნული ეპიტაფია მცხეთის მთავარ ხუროთმოძღვარსა
    და მხატვარს, ავრელიუს აქოლისს იხსენიებს. ოსტატის სახელი ქვამ შემოინახა — ზემოთ მდგარი ტაძრის კალატოზებისა
    კი დიდი ხანია დავიწყებას მიეცა.
  tip: >-
    ორმოცდახუთი წუთიდან ერთ საათამდე საკმარისია, წირვის დროს — მეტი. ეს მოქმედი დედათა მონასტერია: ქალებს
    გრძელი ქვედაბოლო და თავსაფარი სჭირდებათ, მამაკაცებს — გრძელი შარვალი; მოსასხამები ჩვეულებრივ ჭიშკართან
    აწყვია. მონაზვნებს ნუ გადაუღებთ, მამა გაბრიელის აკლდამასთან კი ხმადაბლა ილაპარაკეთ — კვირაობით და
    2 ნოემბრის, მისი გარდაცვალების დღის, მახლობლად რიგი საკმაოდ გრძელია. გალავნის შიგნით კაფე არ არის;
    მცხეთის მთავარ ქუჩაზე, რამდენიმე წუთში, არჩევანი ბევრია. ყველაზე წყნარი დილაა, მოჩუქურთმებული სამხრეთის
    ფასადი კი შუადღისას საუკეთესოდ ჩანს.
  route: >-
    თბილისიდან ჩრდილო-დასავლეთით ს1 (E60) ავტომაგისტრალით გახვალთ და დაახლოებით 20 კმ-ში მცხეთის მონიშნულ
    გასასვლელზე გადაუხვევთ; ძველი გზა მტკვარს გადაკვეთს და ქალაქში შეგიყვანთ. სვეტიცხოვლის დასავლეთის
    ჭიშკრიდან მთავარ ქუჩას ჩრდილოეთით გაჰყევით: სამთავრო დაახლოებით 400 მეტრში, საქართველოს სამხედრო გზის
    გასაყარამდე ცოტა ადრე დგას. სულ 26 კმ და დაახლოებით 35 წუთია, მთლიანად ასფალტზე. მანქანა ქუჩაში ან
    სვეტიცხოვლის მახლობლად ფასიან სადგომზე დატოვეთ და ფეხით ამოდით. ეკონომკლასის ავტომობილი ნებისმიერ
    სეზონზე საკმარისია, საწვავი კი ს1-ის გასწვრივ ყველგან იშოვება.
en:
  name: Samtavro Monastery
  short: >-
    Where Nino lived among the brambles and Georgia's first Christian king lies buried: a working convent
    five minutes up the street from Svetitskhoveli.
  body: >-
    **Mtskheta's medieval chroniclers called Svetitskhoveli the "lower church" and Samtavro the "upper"
    one — and the upper church still keeps the quieter, stranger half of the town's story.**


    Tradition says Nino lived here in the 4th century, in a bramble thicket at the edge of the royal garden,
    and that King Mirian III, Kartli's first Christian ruler, built a church over the spot. The tiny early
    medieval chapel of St Nino, barely six metres long, keeps that memory east of the main church.


    The main Church of the Transfiguration dates from the first half of the 11th century, the age of King
    George I and Catholicos Melchizedek I. Its walls are dressed blocks of yellow and brown stone, carved
    most finely on the south front. An earthquake brought the dome down in 1283; the drum you see is its
    replacement from around 1300. Inside, in the south-west corner, lie King Mirian and Queen Nana — their
    slabs carved only in the 19th century, a late signature on a very old tradition.


    Most people in the courtyard, though, have come for a 20th-century saint. Father Gabriel Urgebadze
    set fire to a portrait of Lenin at the May Day parade of 1965 and paid with a beating, arrest and
    months in a psychiatric hospital. He served here from 1971, lived out his days in the old tower and
    died in 1995. Canonised in 2012, he has rested since 2014 in a crypt within the monastery, and the
    line of pilgrims seldom thins.


    North of the walls lies a necropolis used from the mid-3rd millennium BC to the 10th century AD. One
    gravestone of around 400 bears a Greek epitaph for Aurelius Acholis, chief architect and painter of
    Mtskheta: the stone kept his name, while the masons of the church above are long forgotten.
  tip: >-
    Forty-five minutes to an hour is enough, longer if a service is under way. This is a working convent:
    women need a long skirt and a headscarf, men long trousers, and wraps are usually available at the
    gate. Do not photograph the nuns, and keep your voice low at Father Gabriel's crypt, where the queue
    can be long on Sundays and around 2 November, the anniversary of his death. There is no café inside
    the walls; Mtskheta's main street, a few minutes downhill, has plenty. Mornings are quietest, and
    the carved south facade is best lit around midday.
  route: >-
    Leave Tbilisi north-west on the S1 motorway (E60) and take the signed Mtskheta exit after about 20
    km; the old road crosses the Mtkvari into town. From the west gate of Svetitskhoveli follow the main
    street north: Samtavro stands about 400 metres further on, just short of the junction with the Georgian
    Military Highway. That is 26 km and roughly 35 minutes, asphalt throughout. Leave the car on the street
    or in one of the paid lots near Svetitskhoveli and walk up. An economy car is all you need, in any
    season, and there is fuel all along the S1.
ru:
  name: Монастырь Самтавро
  short: >-
    Здесь Нино жила в ежевичных зарослях, здесь похоронен первый христианский царь Грузии: действующий
    женский монастырь в пяти минутах вверх от Светицховели.
  body: >-
    **Средневековые летописцы Мцхеты называли Светицховели «нижней церковью», а Самтавро — «верхней»,
    и верхняя до сих пор хранит более тихую и странную половину истории города.**


    Предание гласит, что в IV веке Нино жила здесь, в ежевичных зарослях на краю царского сада, и что
    царь Мириан III, первый христианский правитель Картли, построил над этим местом церковь. Эту память
    хранит крошечная раннесредневековая церковь святой Нино длиной едва шесть метров — она стоит к востоку
    от главного храма.


    Главная церковь, Преображенская, построена в первой половине XI века, в эпоху царя Георгия I и католикоса
    Мелхиседека I. Её стены сложены из тёсаных блоков жёлтого и бурого камня; тоньше всего резьба на южном
    фасаде. В 1283 году землетрясение обрушило купол; барабан, который вы видите, поставили ему на смену
    около 1300 года. Внутри, в юго-западном углу, покоятся царь Мириан и царица Нана — надгробные плиты
    им вырезали лишь в XIX веке: поздняя подпись под очень древним преданием.


    Но большинство людей во дворе пришли к святому XX века. Отец Гавриил Ургебадзе поджёг портрет Ленина
    на первомайской демонстрации 1965 года и поплатился избиением, арестом и месяцами в психиатрической
    больнице. С 1971 года он служил здесь, доживал век в старой башне и умер в 1995 году. Канонизированный
    в 2012 году, с 2014-го он покоится в крипте на территории монастыря, и очередь паломников редко редеет.


    К северу от стен лежит некрополь, где хоронили с середины III тысячелетия до н. э. до X века н. э.
    На одном надгробии около 400 года — греческая эпитафия Аврелию Ахолису, главному архитектору и живописцу
    Мцхеты: камень сохранил его имя, тогда как мастера, строившие церковь наверху, давно забыты.
  tip: >-
    Сорока пяти минут — часа достаточно, больше, если идёт служба. Это действующий женский монастырь:
    женщинам нужны длинная юбка и платок, мужчинам — длинные брюки; накидки обычно дают у ворот. Не фотографируйте
    монахинь и говорите вполголоса у крипты отца Гавриила: по воскресеньям и около 2 ноября, в годовщину
    его смерти, очередь бывает длинной. Внутри монастырских стен кафе нет, зато на главной улице Мцхеты,
    в нескольких минутах вниз, их хватает. Тише всего по утрам, а резной южный фасад лучше всего освещён
    около полудня.
  route: >-
    Выезжайте из Тбилиси на северо-запад по автомагистрали S1 (E60) и примерно через 20 км сверните на
    обозначенный съезд на Мцхету; старая дорога пересекает Мтквари и входит в город. От западных ворот
    Светицховели следуйте по главной улице на север: Самтавро стоит примерно в 400 метрах дальше, чуть
    не доезжая развязки с Военно-Грузинской дорогой. Это 26 км и около 35 минут, асфальт на всём пути.
    Оставьте машину на улице или на одной из платных стоянок у Светицховели и поднимитесь пешком. Хватит
    машины эконом-класса в любое время года, а заправки есть по всей S1.
fa:
  name: صومعهٔ سامتاورو
  short: >-
    جایی که نینو میان بوته‌های تمشک می‌زیست و نخستین شاه مسیحی گرجستان در خاک آرمیده است: صومعهٔ زنانه‌ای
    فعال، پنج دقیقه بالاتر از سوتیتسخاولی.
  body: >-
    **وقایع‌نگاران سده‌های میانهٔ متسختا سوتیتسخاولی را «کلیسای پایین» و سامتاورو را «کلیسای بالا» می‌نامیدند
    — و کلیسای بالا هنوز نیمهٔ آرام‌تر و غریب‌ترِ داستان شهر را در خود نگه داشته است.**


    روایت است که نینو در سدهٔ چهارم در این‌جا، در بیشه‌ای از تمشک در کنارهٔ باغ شاهی، زندگی می‌کرد و شاه
    میریان سوم، نخستین فرمانروای مسیحی کارتلی، بر همان نقطه کلیسایی ساخت. نمازخانهٔ کوچکِ قدیسه نینو از
    اوایل سده‌های میانه، که به‌زحمت شش متر درازا دارد، این یاد را در شرق کلیسای اصلی زنده نگه می‌دارد.


    کلیسای اصلی، کلیسای تبدیل هیئت، از نیمهٔ نخست سدهٔ یازدهم است، روزگار شاه گیورگی یکم و کاتولیکوس ملکیصدق
    یکم. دیوارهایش از قطعه‌سنگ‌های تراشیدهٔ زرد و قهوه‌ای است و ظریف‌ترین کنده‌کاری‌ها بر نمای جنوبی است.
    زمین‌لرزه‌ای در ۱۲۸۳ گنبد را فرو ریخت؛ ساقهٔ گنبدی (گریو) که امروز می‌بینید جانشین آن از حدود سال
    ۱۳۰۰ است. درون کلیسا، در گوشهٔ جنوب‌غربی، شاه میریان و ملکه نانا آرمیده‌اند — سنگ‌های گورشان تنها
    در سدهٔ نوزدهم تراشیده شد، امضایی دیرهنگام پای سنتی بسیار کهن.


    با این همه، بیشتر کسانی که در حیاط‌اند برای قدیسی از سدهٔ بیستم آمده‌اند. پدر گابریل اورگه‌بادزه در
    رژهٔ روز کارگر در ۱۹۶۵ تصویر لنین را به آتش کشید و بهایش را با کتک، بازداشت و ماه‌ها بستری در بیمارستان
    روانی پرداخت. او از ۱۹۷۱ این‌جا خدمت کرد، باقی عمرش را در برج کهن گذراند و در ۱۹۹۵ درگذشت. او که در
    ۲۰۱۲ در شمار قدیسان درآمد، از ۲۰۱۴ در سردابه‌ای درون صومعه آرمیده است، و صف زائران به‌ندرت کوتاه می‌شود.


    در شمال دیوارها گورستانی باستانی گسترده است که از میانهٔ هزارهٔ سوم پیش از میلاد تا سدهٔ دهم میلادی
    به کار می‌رفت. بر یکی از سنگ‌قبرها، از حدود سال ۴۰۰، سنگ‌نبشته‌ای یونانی برای آئورلیوس آخولیس، سرمعمار
    و نقاش متسختا، نقش بسته است: سنگ نام او را نگه داشت، حال آنکه بنّایان کلیسای بالادست دیرزمانی است
    که از یاد رفته‌اند.
  tip: >-
    چهل‌وپنج دقیقه تا یک ساعت کافی است، و اگر مراسم نیایش برپا باشد بیشتر. این‌جا صومعهٔ زنانه‌ای فعال
    است: بانوان به دامن بلند و روسری نیاز دارند و آقایان به شلوار بلند؛ معمولاً دمِ در پارچهٔ پوششی هست.
    از راهبه‌ها عکس نگیرید و کنار سردابهٔ پدر گابریل آهسته سخن بگویید؛ یکشنبه‌ها و حوالی ۲ نوامبر، سالگرد
    درگذشت او، صف ممکن است طولانی باشد. درون دیوارها کافه‌ای نیست؛ در خیابان اصلی متسختا، چند دقیقه سرپایینی،
    کافه فراوان است. صبح‌ها از همه وقت آرام‌تر است و نمای جنوبیِ کنده‌کاری‌شده حوالی ظهر بهترین نور را
    دارد.
  route: >-
    از تفلیس به سوی شمال‌غرب، آزادراه S1 (E60) را بگیرید و پس از حدود ۲۰ کیلومتر از خروجیِ تابلودارِ متسختا
    بیرون بروید؛ جادهٔ قدیمی از رود مْتکواری می‌گذرد و به شهر می‌رسد. از دروازهٔ غربی سوتیتسخاولی خیابان
    اصلی را به سوی شمال دنبال کنید: سامتاورو حدود ۴۰۰ متر جلوتر است، اندکی پیش از تقاطع با جادهٔ نظامی
    گرجستان. روی هم ۲۶ کیلومتر و حدود ۳۵ دقیقه، سراسر آسفالت. خودرو را در خیابان یا در یکی از پارکینگ‌های
    پولیِ نزدیک سوتیتسخاولی بگذارید و پیاده بالا بروید. خودروی کلاس اکونومی در هر فصلی کافی است و در سراسر
    S1 پمپ بنزین هست.
he:
  name: מנזר סמטברו
  short: >-
    כאן חיה נינו בין שיחי הפטל וכאן קבור המלך הנוצרי הראשון של גאורגיה: מנזר נשים פעיל, חמש דקות הליכה
    במעלה הרחוב מסבטיצחובלי.
  body: >-
    **כרוניקנים בני ימי הביניים במצחתה כינו את סבטיצחובלי "הכנסייה התחתונה" ואת סמטברו "העליונה" — והכנסייה
    העליונה עדיין שומרת את המחצית השקטה והמוזרה יותר של סיפור העיר.**


    לפי המסורת, במאה ה־4 חיה כאן נינו, בסבך של שיחי פטל בשולי הגן המלכותי, והמלך מיריאן השלישי, השליט
    הנוצרי הראשון של קרתלי, בנה כנסייה מעל המקום. הקפלה הזעירה של נינו הקדושה, מראשית ימי הביניים, שאורכה
    בקושי שישה מטרים, משמרת את הזיכרון הזה ממזרח לכנסייה הראשית.


    הכנסייה הראשית, כנסיית ההשתנות (הטרנספיגורציה), נבנתה במחצית הראשונה של המאה ה־11, בימי המלך גיורגי
    הראשון והקתוליקוס מלכיצדק הראשון. קירותיה עשויים גושי אבן מסותתים צהובים וחומים, והגילוף העדין ביותר
    נמצא בחזית הדרומית. רעידת אדמה הפילה את הכיפה ב־1283; צוואר הכיפה (התוף) שרואים היום הוא זה שהחליף
    אותה בסביבות 1300. בפנים, בפינה הדרומית־מערבית, קבורים המלך מיריאן והמלכה ננה — לוחות הקבר שלהם נחצבו
    רק במאה ה־19, חתימה מאוחרת על מסורת עתיקה מאוד.


    אבל רוב האנשים בחצר באו בשביל קדוש מן המאה ה־20. האב גבריאל אורגבדזה הצית דיוקן של לנין במצעד האחד
    במאי של 1965, ושילם על כך במכות, במעצר ובחודשים בבית חולים פסיכיאטרי. מ־1971 שירת כאן, חי את שארית
    ימיו במגדל הישן ומת ב־1995. הוא הוכרז קדוש ב־2012, ומאז 2014 הוא טמון בקריפטה בתוך המנזר, ותור עולי
    הרגל כמעט אינו מתקצר.


    מצפון לחומות משתרע בית קברות עתיק (נקרופוליס) שהיה בשימוש מאמצע האלף ה־3 לפני הספירה ועד המאה ה־10
    לספירה. על אחת המצבות, מסביבות שנת 400, חקוקה כתובת זיכרון ביוונית לאורליוס אכוליס, האדריכל והצייר
    הראשי של מצחתה: האבן שמרה את שמו, ואילו הבנאים של הכנסייה שלמעלה נשכחו מזמן.
  tip: >-
    ארבעים וחמש דקות עד שעה מספיקות, ויותר אם מתקיים טקס תפילה. זהו מנזר נשים פעיל: נשים צריכות חצאית
    ארוכה וכיסוי ראש, גברים מכנסיים ארוכים, ובדרך כלל אפשר לקבל בשער בדים לעטיפה. אל תצלמו את הנזירות,
    ודברו בשקט ליד הקריפטה של האב גבריאל, שבה התור עלול להיות ארוך בימי ראשון ובסביבות 2 בנובמבר, יום
    השנה למותו. בין חומות המנזר אין בית קפה; ברחוב הראשי של מצחתה, כמה דקות במורד, יש בתי קפה רבים. הבקרים
    הם השקטים ביותר, והחזית הדרומית המגולפת מוארת במיטבה בסביבות הצהריים.
  route: >-
    צאו מטביליסי צפון־מערבה בכביש המהיר S1 (E60), ואחרי כ־20 ק"מ רדו ביציאה המשולטת למצחתה; הכביש הישן
    חוצה את המטקוורי ונכנס לעיר. מהשער המערבי של סבטיצחובלי המשיכו ברחוב הראשי צפונה: סמטברו עומד כ־400
    מטר הלאה, מעט לפני הצומת עם הדרך הצבאית הגאורגית. בסך הכול 26 ק"מ וכ־35 דקות, באספלט לכל אורך הדרך.
    השאירו את הרכב ברחוב או באחד החניונים בתשלום ליד סבטיצחובלי, ועלו ברגל. רכב בקטגוריית אקונומי מספיק
    בכל עונה, ויש תחנות דלק לכל אורך S1.
ar:
  name: دير سامتافرو
  short: >-
    هنا عاشت نينو بين شجيرات العُلّيق، وهنا دُفن أول ملك مسيحي لجورجيا: دير عامر للراهبات على بُعد خمس
    دقائق صعوداً في الشارع نفسه من سفيتيتسخوفيلي.
  body: >-
    **كان مؤرخو متسخيتا في العصور الوسطى يسمّون سفيتيتسخوفيلي "الكنيسة السفلى" وسامتافرو "الكنيسة العليا"
    — وما زالت الكنيسة العليا تحفظ النصف الأهدأ والأغرب من حكاية المدينة.**


    يروي التقليد أن نينو عاشت هنا في القرن الرابع، في أجمة من العُلّيق على طرف الحديقة الملكية، وأن الملك
    ميريان الثالث، أول حاكم مسيحي لكارتلي، بنى كنيسة فوق ذلك الموضع. وتحفظ هذه الذكرى كنيسةُ القديسة نينو
    الصغيرة من أوائل العصور الوسطى، التي لا يكاد طولها يبلغ ستة أمتار، شرقيَّ الكنيسة الرئيسية.


    أما الكنيسة الرئيسية، كنيسة التجلّي، فتعود إلى النصف الأول من القرن الحادي عشر، عهد الملك غيورغي الأول
    والكاثوليكوس ملكيصادق الأول. جدرانها من كتل منحوتة من الحجر الأصفر والبني، وأدقّ نقوشها على الواجهة
    الجنوبية. أسقط زلزالٌ القبةَ عام 1283، ورقبة القبة التي تراها اليوم هي البديل الذي أُقيم نحو عام 1300.
    وفي الداخل، في الزاوية الجنوبية الغربية، يرقد الملك ميريان والملكة نانا — ولم تُنحت بلاطتا قبريهما
    إلا في القرن التاسع عشر، توقيعاً متأخراً على تقليد موغل في القدم.


    غير أن معظم من في الفناء جاؤوا من أجل قدّيس من القرن العشرين. فقد أضرم الأب غبرييل أورغيبادزه النار
    في صورة للينين خلال استعراض عيد العمال عام 1965، ودفع ثمن ذلك ضرباً واعتقالاً وشهوراً في مستشفى للأمراض
    النفسية. خدم هنا منذ عام 1971، وقضى بقية أيامه في البرج القديم، وتوفي عام 1995. أُعلنت قداسته عام
    2012، ويرقد منذ عام 2014 في سرداب داخل الدير، ونادراً ما يقصر طابور الحجاج.


    إلى الشمال من الأسوار تمتد مقبرة قديمة استُخدمت من منتصف الألف الثالث قبل الميلاد حتى القرن العاشر
    الميلادي. وتحمل إحدى شواهدها، من نحو عام 400، نقشاً جنائزياً يونانياً لأوريليوس أخوليس، كبير معماريي
    متسخيتا ورسّاميها: حفظ الحجر اسمه، بينما طوى النسيان منذ زمن بعيد البنّائين الذين شيّدوا الكنيسة في
    الأعلى.
  tip: >-
    تكفي خمس وأربعون دقيقة إلى ساعة، وأكثر إن كان قدّاس قائماً. هذا دير عامر للراهبات: على النساء ارتداء
    تنورة طويلة وغطاء رأس، وعلى الرجال سراويل طويلة، وتتوفر عادةً أغطية عند البوابة. لا تصوّر الراهبات،
    واخفض صوتك عند سرداب الأب غبرييل، حيث قد يطول الطابور أيام الأحد ونحو 2 نوفمبر، ذكرى وفاته. لا مقهى
    داخل الأسوار؛ لكن الشارع الرئيسي في متسخيتا، على بُعد دقائق نزولاً، يعجّ بالمقاهي. الصباحات أهدأ الأوقات،
    وتبلغ الواجهة الجنوبية المنحوتة أفضل إضاءتها نحو الظهيرة.
  route: >-
    اخرج من تبليسي باتجاه الشمال الغربي على الطريق السريع S1 (E60)، وبعد نحو 20 كم خذ المخرج المشار إليه
    إلى متسخيتا؛ يعبر الطريق القديم نهر متكفاري إلى المدينة. ومن البوابة الغربية لسفيتيتسخوفيلي اتبع الشارع
    الرئيسي شمالاً: يقع سامتافرو على بُعد نحو 400 متر إلى الأمام، قُبيل التقاطع مع الطريق العسكري الجورجي.
    المسافة 26 كم ونحو 35 دقيقة، والطريق معبّد كله. اترك السيارة في الشارع أو في أحد المواقف المدفوعة
    قرب سفيتيتسخوفيلي واصعد سيراً. تكفيك سيارة اقتصادية في أي فصل، ومحطات الوقود منتشرة على طول S1.
