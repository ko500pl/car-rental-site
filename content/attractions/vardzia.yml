ka:
  name: ვარძია
  short: XII საუკუნის კლდეში ნაკვეთი ქალაქ-მონასტერი მტკვრის ხეობაში — თამარ მეფის ეპოქის მთავარი ძეგლი.
  body: >-
    ვარძია მტკვრის მარცხენა ნაპირზე, ტუფის ციცაბო კედელშია გამოკვეთილი და თითქმის ერთი კილომეტრის სიგრძეზე
    გადაჭიმულია. კომპლექსის მშენებლობა გიორგი III-ის დროს დაიწყო და თამარ მეფის ეპოქაში დასრულდა. ეს იყო
    არა უბრალოდ მონასტერი, არამედ სამხრეთის საზღვრის დამცავი გამაგრებული ქალაქი, სადაც სამალავები, სატრაპეზოები,
    წყალსადენი, საწნახლები, სამკურნალო სენაკები და საცხოვრებელი ოთახები ერთ, თაფლის სკის მსგავს სისტემად
    იყო შეკრული. ისტორიკოსების შეფასებით, აქ ერთდროულად რამდენიმე ათასი ადამიანის დაბინავება შეიძლებოდა.


    თავდაპირველად გამოქვაბულები კლდის სიღრმეში იმალებოდა და ხეობიდან თითქმის უხილავი იყო — შესვლა მხოლოდ
    ფარულ გვირაბებში იყო შესაძლებელი. XIII საუკუნის ძლიერმა მიწისძვრამ კლდის გარე ფენა ჩამოაქცია და კომპლექსი
    გაშიშვლდა. სწორედ ამან მისცა ვარძიას ის გახსნილი, კვეთის მსგავსი სახე, რომელსაც დღეს ვხედავთ, და სამუდამოდ
    დაასუსტა მისი თავდაცვითი ფუნქცია.


    მთავარი სანახავი მიძინების ეკლესიაა: აქ **XII საუკუნის ორიგინალური ფრესკებია**, მათ შორის თამარ მეფისა
    და გიორგი III-ის პორტრეტები. თამარი სიცოცხლეშივეა გამოსახული, რაც ამ მოხატულობას შუა საუკუნეების იშვიათ
    პირდაპირ წყაროდ აქცევს.


    მარშრუტი კომპლექსში ასეთია:


    - ბილიკები და კიბეები იარუსებს შორის, ადგილ-ადგილ ვიწრო გვირაბებით

    - მიძინების ეკლესია ფრესკებით და სამრეკლო

    - ზედა დონეების ხედი მთელ მტკვრის ხეობაზე


    მონასტერი მოქმედია — რამდენიმე ბერი დღესაც ცხოვრობს კომპლექსის ნაწილში, ამიტომ ხმაური და დრონები აქ
    მიუღებელია.
  tip: >-
    მოდი დილით ან 16:00-ის შემდეგ: შუადღისას ხეობა ცხელია და ჯგუფებიც სწორედ მაშინ ჩამოდიან. მანქანა ქვედა
    პარკინგზე დატოვე — შესასვლელამდე მცირე შატლი დადის, ფეხითაც შეიძლება, დაახლოებით 15 წუთი აღმართით.
    საჭიროა მაგარლანჩხიანი ფეხსაცმელი: ქვა პრიალაა, კიბეები ციცაბოა. აიღე წყალი და ქუდი — ჩრდილი თითქმის
    არაა. ეკლესიაში ქალებისთვის თავსაფარი და გრძელი კაბაა საჭირო. კაფე და ტუალეტი შესასვლელთანაა, ბანკომატი
    — მხოლოდ ასპინძაში.
  route: >-
    თბილისიდან გადი E60-ით მცხეთისა და გორის გავლით ხაშურამდე, იქ გადაუხვიე სამხრეთით ბორჯომზე. შემდეგ
    ახალციხის გზაა ვიწრო, ტყიანი ხეობით; ახალციხიდან კი ასპინძის მიმართულებით მტკვრის კალაპოტს გაჰყვები
    ხერთვისის ციხემდე და შემდეგ ვარძიამდე. ასფალტი ბოლომდე კარგია, თუმცა ბოლო ოცდაათი კილომეტრი ვიწროა,
    მოხვევებიანი და ზაფხულში ტურისტული ავტობუსებით დატვირთული. საწვავი აუცილებლად აავსე ხაშურში ან ახალციხეში
    — ასპინძის შემდეგ გასამართი პრაქტიკულად აღარაა, ბანკომატიც. ეკონომ კლასი სავსებით საკმარისია; ზამთარში
    მაღალი კლირენსი და ზამთრის საბურავები ჯობია.
en:
  name: Vardzia
  short: A 12th-century cave city and monastery cut into the Mtkvari gorge, the flagship monument of Queen
    Tamar's era.
  body: >-
    Vardzia is carved into a sheer tufa cliff on the left bank of the Mtkvari, stretching for the better
    part of a kilometre. Work began under George III and was completed in the reign of Queen Tamar. It
    was never only a monastery: this was a fortified frontier town, with refectories, a water supply system,
    wine presses, storerooms and hundreds of living cells linked into one honeycombed structure that could
    shelter an army.


    Originally the halls sat deep inside the rock and were almost invisible from the valley floor. A powerful
    earthquake in the 13th century sheared away the outer face of the cliff and exposed the interior —
    which is exactly why the site looks the way it does today, sliced open like a cross-section drawing.


    The centrepiece is the Church of the Dormition, which holds **original 12th-century frescoes**, including
    portraits of Queen Tamar and George III. Tamar is shown during her own lifetime, which makes the painting
    an unusually direct piece of medieval evidence.


    What you actually walk through:


    - terraced paths and stairways between levels, with short tunnels in places

    - the frescoed main church

    - the bell tower and upper galleries, with the full sweep of the gorge below


    Part of the complex is still an active monastery, and a small community of monks lives on site.
  tip: >-
    Come early morning or after 16:00 — the gorge bakes at midday and tour groups arrive in the middle
    of the day. Leave the car at the lower parking area; a small shuttle runs up to the entrance, or you
    can walk it in about fifteen minutes uphill. Wear shoes with grip: the stone is polished and the stairs
    are steep. Bring water and a hat, since there is almost no shade. Women need a headscarf and skirt
    for the church. Cafe and toilets sit by the entrance; the nearest ATM is in Aspindza.
  route: >-
    Take the E60 west from Tbilisi past Mtskheta and Gori to Khashuri, then turn south for Borjomi. From
    Borjomi the road climbs through forested gorge to Akhaltsikhe, where you turn towards Aspindza and
    follow the Mtkvari upstream past Khertvisi fortress to Vardzia. The asphalt is good the whole way,
    but the last 30 km are narrow with blind bends. Fill up in Khashuri or Akhaltsikhe — fuel stations
    essentially stop after Aspindza. An economy car handles this fine; in winter extra ground clearance
    is welcome.
ru:
  name: Вардзиа
  short: Пещерный город-монастырь XII века в ущелье Куры — главный памятник эпохи царицы Тамар.
  body: >-
    Вардзиа вырублена в отвесной туфовой скале на левом берегу Куры и тянется почти на километр. Строительство
    началось при Георгии III и завершилось в царствование Тамар. Это был не просто монастырь, а укреплённый
    пограничный город: трапезные, водопровод, давильни для вина, аптечные кельи, кладовые и сотни жилых
    комнат соединялись в единую многоярусную систему, напоминающую пчелиные соты. По оценкам историков,
    комплекс мог одновременно вместить несколько тысяч человек.


    Изначально залы уходили вглубь скалы и снизу были почти незаметны: попасть внутрь можно было только
    по скрытым тоннелям. Сильное землетрясение XIII века обрушило внешний слой породы и обнажило комплекс.
    Именно поэтому сегодня он выглядит как разрез в скале, а не как потайное убежище, и именно тогда крепость
    навсегда потеряла оборонное значение.


    Главное, ради чего сюда едут, — церковь Успения с **подлинными фресками XII века**, среди которых
    портреты царицы Тамар и Георгия III. Тамар изображена ещё при жизни, что делает роспись редким прямым
    свидетельством эпохи.


    Что вы увидите на маршруте:


    - террасные тропы и лестницы между ярусами, местами короткие тоннели

    - расписанную главную церковь и колокольню

    - верхние галереи с видом на всё ущелье Куры


    Часть комплекса действующая: здесь по-прежнему живёт небольшая монашеская община, поэтому шум и дроны
    здесь неуместны.
  tip: >-
    Приезжайте утром или после 16:00: в полдень в ущелье жарко, и именно тогда прибывают автобусные группы.
    Машину оставьте на нижней парковке — до входа ходит небольшой шаттл, пешком это минут пятнадцать в
    гору. Нужна обувь с хорошей подошвой: камень отполирован, лестницы крутые. Возьмите воду и головной
    убор, тени почти нет. Женщинам для церкви понадобится платок и юбка. Кафе и туалеты есть у входа,
    ближайший банкомат — в Аспиндзе.
  route: >-
    Из Тбилиси идите по трассе E60 мимо Мцхеты и Гори до Хашури, там поворот на юг, на Боржоми. Дальше
    дорога поднимается лесистым ущельем к Ахалцихе, оттуда — на Аспиндзу и вдоль Куры мимо крепости Хертвиси
    до Вардзии. Асфальт хороший на всём протяжении, но последние 30 км узкие, с закрытыми поворотами.
    Заправляйтесь в Хашури или Ахалцихе: после Аспиндзы заправок практически нет. Достаточно машины эконом-класса,
    зимой предпочтительнее клиренс повыше.
fa:
  name: واردزیا
  short: شهر-صومعهٔ کلده‌کَن سدهٔ دوازدهم در تنگهٔ متکواری، ستون اصلی دوران ملکه تامار.
  body: >-
    واردزیا در دیوارهٔ عمودی توفی بر کرانهٔ چپ متکواری کنده شده و نزدیک به یک کیلومتر کشیده است. کار در
    روزگار گیورگی سوم آغاز شد و در پادشاهی ملکه تامار به پایان رسید. این هرگز فقط صومعه نبود: شهری مرزی
    و مستحکم بود، با سفره‌خانه‌ها، شبکهٔ آب‌رسانی، شراب‌فشارها، انبارها و صدها حجرهٔ مسکونی که در یک ساختار
    کندومانند به هم پیوسته بودند و می‌توانستند لشکری را پناه دهند.


    در آغاز تالارها در ژرفای صخره می‌نشستند و از کف دره تقریباً نادیدنی بودند. زمین‌لرزهٔ نیرومندی در
    سدهٔ سیزدهم لایهٔ بیرونی صخره را فرو ریخت و درون آن را برهنه کرد — و دقیقاً به همین دلیل محوطه امروز
    چنان می‌نماید که گویی مانند نقشهٔ برش‌خورده باز شده است.


    نگین مجموعه کلیسای خوابیدگی مریم است که **فرسکوهای اصیل سدهٔ دوازدهم** را نگه داشته، از جمله تصاویر
    ملکه تامار و گیورگی سوم. تامار در زمان حیات خودش نگاشته شده و همین نقاشی را به سندی به‌طور غیرعادی
    مستقیم از سده‌های میانه بدل می‌کند. آنچه واقعاً می‌پیمایید این است: مسیرها و پلکان‌های مصطبه‌ای میان
    طبقات با گذرهای کوتاه در جاهایی، کلیسای اصلی فرسکودار، و برج ناقوس و ایوان‌های بالایی با تمام گسترهٔ
    تنگه در زیر. بخشی از مجموعه هنوز صومعه‌ای فعال است و جماعت کوچکی از راهبان در محل زندگی می‌کنند.
  tip: >-
    صبح زود یا پس از 16:00 بیایید — تنگه در نیمروز می‌سوزد و گروه‌های تور هم درست میان روز می‌رسند. خودرو
    را در پارکینگ پایینی بگذارید؛ شاتل کوچکی تا ورودی بالا می‌رود، یا می‌توانید در حدود پانزده دقیقه سربالایی
    را پیاده بروید. کفشی با چنگ خوب بپوشید: سنگ صیقلی است و پله‌ها تند. آب و کلاه بردارید، چون تقریباً
    هیچ سایه‌ای نیست. زنان برای کلیسا به روسری و دامن نیاز دارند. کافه و سرویس بهداشتی کنار ورودی است؛
    نزدیک‌ترین خودپرداز در اسپیندزا.
  route: >-
    از تفلیس E60 را رو به غرب از متسختا و گوری تا خاشوری بگیرید و سپس به سوی جنوب به بورجومی بپیچید. از
    بورجومی جاده از تنگه‌ای جنگلی تا آخالتسیخه بالا می‌رود؛ آنجا به سوی اسپیندزا می‌پیچید و متکواری را
    رو به بالادست از کنار دژ خرتویسی تا واردزیا دنبال می‌کنید. آسفالت تمام مسیر خوب است، اما 30 کیلومتر
    آخر باریک و پر از پیچ‌های کور است. در خاشوری یا آخالتسیخه باک را پر کنید — پمپ بنزین پس از اسپیندزا
    عملاً تمام می‌شود. خودروی اقتصادی از پس این مسیر برمی‌آید؛ در زمستان کلیرنس بیشتر خوشایند است.
he:
  name: ורדזיה
  short: עיר מערות ומנזר מן המאה ה-12 שנחצבה בערוץ המטקווארי, המונומנט המרכזי של תקופת המלכה תמר.
  body: >-
    ורדזיה חצובה בצוק טוף תלול על הגדה השמאלית של המטקווארי ומשתרעת לאורך קרוב לקילומטר. העבודה החלה בימי
    גיאורגי השלישי והושלמה במלכות תמר. זה מעולם לא היה רק מנזר: זו הייתה עיר גבול מבוצרת, עם חדרי אוכל,
    מערכת אספקת מים, בתי בד ליין, מחסנים ומאות תאי מגורים המחוברים למבנה אחד דמוי כוורת שיכול היה להסתיר
    צבא שלם.


    בתחילה ישבו האולמות עמוק בתוך הסלע והיו כמעט בלתי נראים מקרקעית העמק. רעידת אדמה עזה במאה ה-13 גרפה
    את פני הצוק החיצוניים וחשפה את הפנים — וזו בדיוק הסיבה שהאתר נראה כיום כפי שהוא נראה, חתוך ופתוח כמו
    שרטוט חתך.


    לב האתר הוא כנסיית ההירדמות, ובה **ציורי קיר מקוריים מן המאה ה-12**, ובכללם דיוקנאות של המלכה תמר
    ושל גיאורגי השלישי. תמר מוצגת עוד בחייה, מה שהופך את הציור לעדות ימי-ביניימית ישירה בצורה חריגה. מה
    שעוברים בפועל: שבילים מדורגים ומדרגות בין הקומות, עם מנהרות קצרות במקומות; הכנסייה הראשית המצוירת;
    ומגדל הפעמונים והגלריות העליונות, שמתחתן נפרס כל הערוץ. חלק מהמתחם עודנו מנזר פעיל, וקהילה קטנה של
    נזירים חיה במקום.
  tip: >-
    בואו מוקדם בבוקר או אחרי 16:00 — הערוץ נאפה בצהריים וקבוצות התיירים מגיעות באמצע היום. השאירו את הרכב
    בחניון התחתון; שאטל קטן עולה אל הכניסה, או שאפשר לצעוד את הדרך בכחמש עשרה דקות במעלה. נעלו נעליים
    עם אחיזה: האבן מלוטשת והמדרגות תלולות. הביאו מים וכובע, שכן אין כמעט צל. נשים זקוקות למטפחת ראש ולחצאית
    לכניסה לכנסייה. בית קפה ושירותים נמצאים ליד הכניסה; הכספומט הקרוב ביותר הוא באספינדזה.
  route: >-
    צאו מטביליסי מערבה בכביש E60 דרך מצחתה וגורי עד חשורי, ואז פנו דרומה לבורג'ומי. מבורג'ומי הכביש מטפס
    בערוץ מיוער עד אחאלציחה, שם פונים לכיוון אספינדזה ועוקבים אחר המטקווארי במעלה הזרם, על פני מבצר חרתוויסי,
    עד ורדזיה. האספלט טוב לכל האורך, אבל 30 הקילומטרים האחרונים צרים ובהם פניות עיוורות. תדלקו בחשורי
    או באחאלציחה — תחנות הדלק נגמרות למעשה אחרי אספינדזה. רכב חסכוני מתמודד עם זה היטב; בחורף גובה גחון
    נוסף מתקבל בברכה.
ar:
  name: فاردزيا
  short: مدينة كهوف ودير من القرن الثاني عشر نُحتت في مضيق متكفاري، وأبرز معالم عهد الملكة تامار.
  body: >-
    نُحتت فاردزيا في جرف من صخر التوف شديد الانحدار على الضفة اليسرى لمتكفاري، وتمتد قرابة كيلومتر كامل.
    بدأ العمل في عهد جيورجي الثالث واكتمل في حكم الملكة تامار. ولم تكن ديراً فحسب: كانت مدينة حدودية محصنة،
    فيها قاعات طعام ونظام لإمداد المياه ومعاصر نبيذ ومخازن ومئات الحجرات السكنية، مترابطة في بنية واحدة
    تشبه خلية النحل وتتسع لجيش بأكمله.


    في الأصل كانت القاعات تقع في عمق الصخر ولا تكاد تُرى من قاع الوادي. ثم اقتلع زلزال عنيف في القرن الثالث
    عشر الوجه الخارجي للجرف وكشف الداخل — وهذا بالضبط سبب مظهر الموقع اليوم، مشقوقاً ومفتوحاً كأنه رسم
    مقطعي.


    وقلب الموقع كنيسة رقاد العذراء، وفيها **رسوم جدارية أصلية من القرن الثاني عشر**، منها صورتا الملكة
    تامار وجيورجي الثالث. وتظهر تامار في حياتها، ما يجعل الرسم شهادة وسيطة مباشرة على نحو غير مألوف. وما
    تسير فيه فعلاً: ممرات مدرجة وسلالم بين الطوابق تتخللها أنفاق قصيرة في مواضع؛ والكنيسة الرئيسية المزينة
    بالرسوم؛ وبرج الأجراس والأروقة العليا التي ينبسط تحتها المضيق بكامله. ولا يزال جزء من المجمع ديراً
    عاملاً تعيش فيه جماعة صغيرة من الرهبان.
  tip: >-
    تعال في الصباح الباكر أو بعد 16:00 — فالمضيق يشتد حره ظهراً وتصل المجموعات السياحية في منتصف النهار.
    اترك السيارة في الموقف السفلي؛ فهناك حافلة صغيرة تصعد إلى المدخل، أو يمكنك المشي صعوداً في نحو خمس
    عشرة دقيقة. البس حذاءً ذا قبضة: فالحجر مصقول والدرجات حادة. خذ ماءً وقبعة، إذ لا ظل يكاد يُذكر. وتحتاج
    النساء غطاء رأس وتنورة لدخول الكنيسة. المقهى ودورات المياه عند المدخل؛ وأقرب جهاز صراف في أسبيندزا.
  route: >-
    اخرج من تبليسي غرباً على طريق E60 مروراً بمتسخيتا وغوري حتى خاشوري، ثم انعطف جنوباً نحو بورجومي. ومن
    بورجومي يصعد الطريق عبر مضيق مشجر إلى أخالتسيخي، حيث تتجه نحو أسبيندزا وتتبع متكفاري نحو المنبع مروراً
    بحصن خيرتفيسي حتى فاردزيا. الإسفلت جيد طوال المسافة، لكن آخر 30 كم ضيقة وفيها منعطفات عمياء. تزود
    بالوقود في خاشوري أو أخالتسيخي — فمحطات الوقود تنقطع عملياً بعد أسبيندزا. السيارة الاقتصادية تتدبر
    هذا الطريق جيداً؛ وفي الشتاء يُرحَّب بخلوص أرضي إضافي.
