ka:
  name: ვარძია
  short: >-
    თამარ მეფის კლდის მონასტერი მტკვრის ხეობაში: ხუთასიოდე მეტრზე გადაჭიმული, ცხრამეტამდე იარუსი და ეკლესია,
    რომელშიც თამარი სიცოცხლეშივეა დახატული.
  body: >-
    **ვარძია უხილავი უნდა ყოფილიყო: კლდის სიღრმეში დამალული ქალაქ-მონასტერი, სანამ 1283 წლის მიწისძვრამ
    კლდის პირი არ ჩამოაქცია და მისი წიაღი ხეობას არ გადაუშალა.**


    მშენებლობა გიორგი III-მ (1156–1184) დაიწყო მტკვრის მარცხენა ნაპირზე, ერუშეთის მთის ფერდში, საქმე კი
    მისმა ასულმა, თამარმა გააგრძელა. 1184–1186 წლებში მიძინების ეკლესია გამოკვეთეს და მოხატეს, ბასიანის
    ბრძოლამდე (დაახლ. 1203) კი ახალი სენაკები, თავდაცვითი ნაგებობები, ზედა ვარძიიდან მომავალი 3,5-კილომეტრიანი
    წყალსადენი და სარწყავი ქსელი მოეწყო. გამოქვაბულები კლდეს დაახლოებით 500 მეტრზე, ცხრამეტამდე იარუსად
    გასდევს — სულ ხუთასიოდე.


    სახელს ხალხური თქმულება ხსნის: გამოქვაბულებში გზააბნეულ პატარა თამარს თითქოს შეუძახია: „აქ ვარ, ძია!“
    ენათმეცნიერს ეს არ დააჯერებს, მაგრამ ამ ამბავს ყველა გიდი მოგიყვებათ.


    კომპლექსის გული კლდეში ნაკვეთი, 14,5 მეტრი სიგრძის ეკლესიაა. ჩრდილოეთ კედელზე გიორგი III და თამარი
    ბიზანტიური სამეფო სამოსით ეკლესიის მოდელს უჭირავთ. თამარს გათხოვილი ქალის ლენტი არ აქვს, წარწერა მას
    დღეგრძელობას უსურვებს, მამამისს კი — აღარა: ასე თარიღდება მხატვრობა 1184–1186 წლებით. თამარის შემორჩენილ
    პორტრეტთაგან ეს უადრესია. იქვე ქართლის ერისთავი რატი სურამელია გამოსახული, რომელმაც მოხატვა დააფინანსა,
    მხატვარმა გიორგიმ კი სახელი საკურთხეველში დატოვა. მხატვრობა ფრესკა კი არა, სეკოა — მშრალ ბათქაშზე
    შესრულებული.


    აღმოსავლეთ ნაწილში იატაკში ჩადგმულ 185 ქვევრს დაუკვირდით, დასავლეთში — სატრაპეზოსა და საცხობს, XIII–XIV
    საუკუნეთა მიჯნის სამრეკლოსაც. 1551 წელს ვარძია სპარსელებმა აიკლეს, 1578 წელს, ოსმალთა მოსვლის შემდეგ,
    კი ბერებმა მიატოვეს. 1857–1928 წლებში აქ კვლავ მოქმედებდა მამათა მონასტერი, საბჭოთა ხელისუფლების დასრულების
    შემდეგ კი ბერები ისევ დაბრუნდნენ — და თამარის კლდეში დამალული ქალაქი ისევ ვიღაცის სახლია.
  tip: >-
    მოდით გახსნისთანავე, დაახლოებით 10:00-ზე, ან 16:00-ის შემდეგ: შუადღით კლდე ხურდება და ტურისტული ავტობუსებიც
    სწორედ მაშინ ჩამოდიან. ბილეთი დაახლოებით 15 ₾ ღირს, ქვედა პარკინგიდან შესასვლელამდე მიკროავტობუსი
    კიდევ დაახლოებით 3 ₾-ად ადის, ფეხით კი აღმართს თხუთმეტიოდე წუთი სჭირდება. ფეხსაცმელი მოუცურავი ძირით
    ჩაიცვით: საფეხურები გაპრიალებულია, ზოგი გვირაბი დაბალი და ციცაბო. ჩრდილი თითქმის არ არის — წყალი და
    ქუდი წაიღეთ. ეკლესიაში ქალებს გრძელი ქვედაბოლო და თავსაფარი, კაცებს გრძელი შარვალი სჭირდებათ. აქ ბერები
    ცხოვრობენ: ხმამაღლა ნუ ილაპარაკებთ და დრონს ნუ აუშვებთ. კაფე და ტუალეტი შესასვლელთანაა, უახლოესი ბანკომატი
    — ასპინძაში.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ხაშურამდე იარეთ, იქიდან ს8-ით ბორჯომის ხეობის გავლით ახალციხემდე,
    შემდეგ ს11-ით ასპინძის გავლით ხერთვისამდე, სადაც 16-კილომეტრიანი გზა მტკვარს აჰყვება ვარძიამდე. სულ
    დაახლოებით 265 კილომეტრი და ოთხი საათი და ოცი წუთია გაუჩერებლად; ყავისა და საწვავის შესვენებით ხუთ
    საათს ვარაუდობდეთ. ასფალტი ბოლომდეა, მაგრამ ბოლო ოცდაათი კილომეტრი ვიწროა, ბრმა მოსახვევებით, ზაფხულში
    კი ტურისტული ავტობუსებითაც. საწვავი ხაშურში, ბორჯომში ან ახალციხეში ჩაასხით — ასპინძის შემდეგ გასამართი
    იშვიათია. ეკონომ-კლასის მანქანა საკმარისია, ზამთარში — ზამთრის საბურავებით. ორ კილომეტრში ვანის ქვაბებია,
    ღირს გაჩერება.
en:
  name: Vardzia
  short: >-
    Queen Tamar's cave monastery above the Mtkvari: some 500 m of cliff in up to nineteen tiers, and a
    church where Tamar was painted in her lifetime.
  body: >-
    **Vardzia was meant to be invisible, a monastery-city hidden inside the rock, until the earthquake
    of 1283 tore away the cliff face and laid its insides open to the valley.**


    Work began under George III (r. 1156–1184) on the left bank of the Mtkvari, in the flank of Mount
    Erusheti, and his daughter Tamar carried it on. The Church of the Dormition was carved and painted
    between 1184 and 1186; in the years up to the Battle of Basiani, around 1203, came more dwellings,
    defences, a 3.5 km water channel from Zeda Vardzia and irrigation. The caves run along some 500 metres
    of cliff in up to nineteen tiers, about 500 of them in all.


    A folk tale explains the name. The child Tamar, lost in the caves, is said to have called out "Ak
    var, dzia!", "I'm here, uncle!" No linguist believes it; every guide tells it.


    The heart is the church, a rock-cut hall 14.5 metres long. On its north wall George III and Tamar,
    in Byzantine regalia, hold its model. Tamar wears no married woman's ribbon, and her inscription wishes
    her long life while her father's does not: the painting therefore dates from 1184–1186, the earliest
    of her surviving portraits. Beside them stands Rati Surameli, eristavi of Kartli, who paid for the
    decoration; the painter Giorgi signed in the sanctuary. Strictly, it is secco, not fresco.


    In the eastern section, look for 185 wine jars sunk into the floor; in the western, the refectory
    and bakery, and the bell tower of around 1300. The Persians sacked Vardzia in 1551, and after the
    Ottomans arrived in 1578 the monks left. A monastery lived here again from 1857 to 1928, and since
    Soviet rule ended monks have returned, so the city Tamar hid in the rock is once more somebody's home.
  tip: >-
    Arrive at opening, around 10:00, or after 16:00: the cliff bakes at midday, which is also when the
    tour buses come. Tickets are about 15 ₾, plus about 3 ₾ for the minibus from the lower car park, or
    walk the fifteen minutes uphill. Wear shoes with grip; the steps are polished and some tunnels are
    low and steep. Shade is scarce, so bring water and a hat. For the church, women need a long skirt
    and headscarf, men long trousers. Monks live here: keep your voice down and leave the drone packed.
    Café and toilets are by the entrance; the nearest ATM is in Aspindza.
  route: >-
    From Tbilisi take the S1 (E60) west to Khashuri, the S8 south through the Borjomi gorge to Akhaltsikhe,
    then the S11 via Aspindza to Khertvisi, where a 16 km road follows the Mtkvari up to Vardzia. It is
    about 265 km, four hours twenty without stops; with a coffee and fuel break reckon on nearer five.
    Asphalt all the way, but the last 30 km are narrow, with blind bends and, in summer, tour buses. Fill
    up in Khashuri, Borjomi or Akhaltsikhe, as stations thin out after Aspindza. An economy car is fine;
    in winter fit winter tyres. Vanis Kvabebi, 2 km away, is worth the stop.
ru:
  name: Вардзия
  short: >-
    Пещерный монастырь царицы Тамар над Курой: около 500 м скалы, до девятнадцати ярусов и храм, где Тамар
    написали ещё при жизни.
  body: >-
    **Вардзия задумывалась невидимой — монастырь-город, спрятанный внутри скалы, — пока землетрясение
    1283 года не сорвало скальную стену и не раскрыло её нутро перед всей долиной.**


    Работы начались при Георгии III (правил в 1156–1184 годах) на левом берегу Куры, на склоне горы Эрушети,
    а продолжила их его дочь Тамар. Церковь Успения высекли и расписали в 1184–1186 годах; в годы, предшествовавшие
    битве при Басиани (около 1203 года), появились новые жилища, укрепления, 3,5-километровый водовод
    от Зеда-Вардзии и оросительная система. Пещеры тянутся вдоль скалы примерно на 500 метров, до девятнадцати
    ярусов, — всего около пятисот.


    Название объясняет народная легенда. Маленькая Тамар, заблудившись в пещерах, будто бы крикнула: «Ак
    вар, дзиа!» — «Я здесь, дядя!» Ни один лингвист в это не верит; каждый гид это рассказывает.


    Сердце комплекса — церковь, высеченный в скале зал длиной 14,5 метра. На её северной стене Георгий
    III и Тамар в византийском царском облачении держат модель храма. На Тамар нет ленты замужней женщины,
    а надпись при её портрете желает ей долгих лет, тогда как надпись при отце — нет; значит, роспись
    выполнена в 1184–1186 годах, и это самый ранний из сохранившихся портретов царицы. Рядом стоит Рати
    Сурамели, эристав Картли, оплативший роспись; художник Гиорги оставил подпись в алтаре. Строго говоря,
    это не фреска, а секко.


    В восточной части ищите 185 винных кувшинов, вкопанных в пол; в западной — трапезную и пекарню, а
    также колокольню около 1300 года. В 1551 году Вардзию разграбили персы, а после прихода османов в
    1578 году монахи её покинули. С 1857 по 1928 год здесь снова жил монастырь, а после конца советской
    власти монахи вернулись — и город, который Тамар спрятала в скале, снова стал чьим-то домом.
  tip: >-
    Приезжайте к открытию, около 10:00, или после 16:00: в полдень скала раскаляется, и в это же время
    подъезжают туристические автобусы. Билет стоит около 15 ₾, плюс около 3 ₾ за микроавтобус от нижней
    парковки — или пятнадцать минут пешком в гору. Нужна обувь с цепкой подошвой: ступени отполированы,
    некоторые туннели низкие и крутые. Тени мало, так что возьмите воду и шляпу. Для входа в церковь женщинам
    нужны длинная юбка и платок, мужчинам — длинные брюки. Здесь живут монахи: говорите тише и не доставайте
    дрон. Кафе и туалеты у входа; ближайший банкомат — в Аспиндзе.
  route: >-
    Из Тбилиси поезжайте на запад по S1 (E60) до Хашури, затем по S8 на юг через Боржомское ущелье до
    Ахалцихе, дальше по S11 через Аспиндзу до Хертвиси, откуда 16-километровая дорога поднимается вдоль
    Куры к Вардзии. Это около 265 км и четыре часа двадцать минут без остановок; с перерывом на кофе и
    заправку рассчитывайте ближе к пяти. Асфальт на всём пути, но последние 30 км узкие, с поворотами
    без обзора, а летом — с туристическими автобусами. Заправьтесь в Хашури, Боржоми или Ахалцихе: после
    Аспиндзы заправок становится мало. Машины эконом-класса достаточно; зимой ставьте зимнюю резину. В
    2 км отсюда — Ванис Квабеби, ради которых стоит остановиться.
fa:
  name: واردزیا
  short: >-
    صومعهٔ غاری ملکه تامار بر فراز متکواری: حدود ۵۰۰ متر صخره در حداکثر نوزده طبقه، و کلیسایی که چهرهٔ
    تامار را در زمان حیاتش بر دیوارش نگاشتند.
  body: >-
    **واردزیا قرار بود دیده نشود، شهری‌صومعه‌ای پنهان در دل سنگ، تا آنکه زلزلهٔ ۱۲۸۳ نمای صخره را کند
    و درونش را پیش چشم دره گشود.**


    کار در دوران گیورگی سوم (سلطنت ۱۱۵۶–۱۱۸۴) بر کرانهٔ چپ متکواری، در دامنهٔ کوه اروشتی، آغاز شد و دخترش
    تامار آن را ادامه داد. کلیسای خفتن مریم مقدس در سال‌های ۱۱۸۴ تا ۱۱۸۶ در سنگ کنده و نقاشی شد؛ در سال‌های
    پیش از نبرد باسیانی، حدود ۱۲۰۳، خانه‌ها و استحکامات تازه، آبراهی ۳٫۵ کیلومتری از زدا واردزیا و شبکهٔ
    آبیاری افزوده شد. غارها در امتداد حدود ۵۰۰ متر از صخره و در حداکثر نوزده طبقه ردیف شده‌اند؛ روی‌هم
    حدود پانصد غار.


    افسانه‌ای عامیانه نام را توضیح می‌دهد. می‌گویند تامار کودک در غارها گم شد و فریاد زد: «آک وار، دزیا!»،
    یعنی «اینجام، عمو!» هیچ زبان‌شناسی باورش ندارد؛ همهٔ راهنماها تعریفش می‌کنند.


    قلب مجموعه کلیساست، تالاری کنده‌شده در سنگ به درازای ۱۴٫۵ متر. بر دیوار شمالی‌اش گیورگی سوم و تامار
    با جامه‌های شاهانهٔ بیزانسی ماکت کلیسا را در دست دارند. تامار نوار زنان شوهردار را بر سر ندارد و کتیبه‌اش
    برای او عمر دراز آرزو می‌کند، حال آنکه کتیبهٔ پدرش چنین نمی‌کند؛ پس این نقاشی از ۱۱۸۴–۱۱۸۶ است و کهن‌ترین
    چهرهٔ بازماندهٔ تامار. کنار آنان رتی سورامِلی، اریستاو (فرمانروای) کارتلی، ایستاده که هزینهٔ نقاشی
    را پرداخت؛ نقاش، گیورگی، در محراب امضا گذاشته است. به بیان دقیق، این نقاشی سکو است، نه فرسکو.


    در بخش شرقی به دنبال ۱۸۵ خمرهٔ شراب بگردید که در کف زمین فرو برده‌اند؛ در بخش غربی سفره‌خانه و نانوایی،
    و برج ناقوسی از حدود ۱۳۰۰. ایرانیان در ۱۵۵۱ واردزیا را غارت کردند، و پس از رسیدن عثمانی‌ها در ۱۵۷۸
    راهبان آنجا را ترک گفتند. از ۱۸۵۷ تا ۱۹۲۸ باز صومعه‌ای در اینجا برپا بود، و از پایان حکومت شوروی راهبان
    بازگشته‌اند؛ چنان‌که شهری که تامار در سنگ پنهان کرد، بار دیگر خانهٔ کسی شده است.
  tip: >-
    هنگام گشایش، حدود ساعت ۱۰:۰۰، یا پس از ۱۶:۰۰ برسید: نیمروز صخره داغ می‌شود و اتوبوس‌های گردشگری هم
    همان وقت می‌رسند. بلیت حدود ۱۵ لاری است، به‌اضافهٔ حدود ۳ لاری برای مینی‌بوس از پارکینگ پایین؛ یا
    پانزده دقیقه سربالایی را پیاده بروید. کفش با کف پرچسب بپوشید؛ پله‌ها صیقلی‌اند و برخی تونل‌ها کوتاه
    و پرشیب. سایه کم است، پس آب و کلاه بیاورید. برای ورود به کلیسا بانوان به دامن بلند و روسری و آقایان
    به شلوار بلند نیاز دارند. راهبان اینجا زندگی می‌کنند: آهسته سخن بگویید و پهپاد را در کیف نگه دارید.
    کافه و سرویس بهداشتی کنار ورودی است؛ نزدیک‌ترین خودپرداز در آسپیندزاست.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب تا خاشوری بگیرید، سپس از راه S8 به جنوب و از میان تنگهٔ بورجومی
    تا آخالتسیخه بروید، و بعد از S11 و از راه آسپیندزا تا خرتویسی؛ از آنجا جاده‌ای ۱۶ کیلومتری در امتداد
    متکواری تا واردزیا بالا می‌رود. حدود ۲۶۵ کیلومتر و چهار ساعت و بیست دقیقه بی‌توقف است؛ با توقفی برای
    قهوه و سوخت، نزدیک پنج ساعت حساب کنید. همهٔ راه آسفالت است، اما ۳۰ کیلومتر پایانی باریک است، با پیچ‌های
    کور و در تابستان اتوبوس‌های گردشگری. در خاشوری، بورجومی یا آخالتسیخه باک را پر کنید، چون پس از آسپیندزا
    جایگاه سوخت کم می‌شود. خودروی اقتصادی کافی است؛ در زمستان لاستیک زمستانی بگذارید. وانیس کوابِبی، ۲
    کیلومتر آن‌سوتر، ارزش توقف دارد.
he:
  name: ורדזיה
  short: >-
    מנזר המערות של המלכה תמר מעל המטקווארי: כ-500 מטרים של צוק, עד תשע-עשרה קומות, וכנסייה שבה צוירה תמר
    עוד בחייה.
  body: >-
    **ורדזיה נועדה להיות בלתי נראית – עיר-מנזר חבויה בתוך הסלע – עד שרעידת האדמה של 1283 תלשה את חזית
    הצוק וחשפה את קרביה אל העמק.**


    העבודות החלו בימי גיורגי השלישי (מלך בשנים 1156–1184) על הגדה השמאלית של המטקווארי, בצלע הר ארושטי,
    ובתו תמר המשיכה אותן. כנסיית ההירדמות (הדורמיציון) נחצבה וצוירה בין 1184 ל-1186; בשנים שעד קרב בסיאני,
    בסביבות 1203, נוספו עוד מגורים, ביצורים, תעלת מים באורך 3.5 ק״מ מזדה ורדזיה ומערכת השקיה. המערות נמשכות
    לאורך כ-500 מטרים של צוק, בגובה של עד תשע-עשרה קומות, וכחמש מאות מערות בסך הכול.


    אגדה עממית מסבירה את השם. תמר הילדה, שתעתה במערות, קראה כביכול "אק ואר, דזיה!" – "אני כאן, דוד!" אף
    בלשן אינו מאמין בזה; כל מדריך מספר את זה.


    לב המקום הוא הכנסייה, אולם חצוב בסלע באורך 14.5 מטרים. על הקיר הצפוני שלה מחזיקים גיורגי השלישי ותמר,
    בלבוש מלכותי ביזנטי, את דגם הכנסייה. תמר אינה עונדת את הסרט של אישה נשואה, והכתובת שלצדה מאחלת לה
    אריכות ימים, ואילו הכתובת של אביה אינה עושה זאת; לכן הציור מתוארך ל-1184–1186, והוא המוקדם מבין דיוקנאותיה
    ששרדו. לצדם עומד ראטי סוראמלי, אריסטאווי (מושל) קרתלי, שמימן את העיטור; הצייר גיורגי חתם באזור המזבח.
    למען הדיוק, זהו ציור סקו ולא פרסקו.


    בחלק המזרחי חפשו 185 כדי יין השקועים ברצפה; בחלק המערבי – את חדר האוכל ואת המאפייה, ואת מגדל הפעמונים
    מסביבות 1300. הפרסים בזזו את ורדזיה ב-1551, ואחרי הגעת העות׳מאנים ב-1578 עזבו אותה הנזירים. מ-1857
    עד 1928 פעל כאן שוב מנזר, ומאז תום השלטון הסובייטי חזרו אליה נזירים, כך שהעיר שתמר הסתירה בסלע היא
    שוב ביתו של מישהו.
  tip: >-
    הגיעו עם הפתיחה, בסביבות 10:00, או אחרי 16:00: בצהריים הצוק לוהט, ובאותה שעה מגיעים גם אוטובוסי התיירים.
    הכרטיס כ-15 ₾, ועוד כ-3 ₾ למיניבוס מן החניון התחתון – או רבע שעה הליכה במעלה הגבעה. נעלו נעליים עם
    אחיזה טובה; המדרגות שחוקות וחלקות, וחלק מן המנהרות נמוכות ותלולות. צל כמעט אין, לכן קחו מים וכובע.
    לכניסה לכנסייה נשים צריכות חצאית ארוכה וכיסוי ראש, וגברים מכנסיים ארוכים. נזירים חיים כאן: דברו בשקט
    והשאירו את הרחפן בתיק. בית קפה ושירותים ליד הכניסה; הכספומט הקרוב ביותר באספינדזה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד חשורי, משם בכביש S8 דרומה דרך ערוץ בורג׳ומי עד אחלציחה, ואז בכביש
    S11 דרך אספינדזה עד חרטוויסי, שממנה עולה דרך באורך 16 ק״מ לאורך המטקווארי עד ורדזיה. בסך הכול כ-265
    ק״מ וארבע שעות ועשרים דקות בלי עצירות; עם הפסקה לקפה ולדלק חשבו על קרוב לחמש. הדרך סלולה לכל אורכה,
    אבל 30 הק״מ האחרונים צרים, עם עיקולים עיוורים ובקיץ גם אוטובוסי תיירים. תדלקו בחשורי, בבורג׳ומי או
    באחלציחה, כי אחרי אספינדזה תחנות הדלק מתמעטות. רכב חסכוני מספיק; בחורף התקינו צמיגי חורף. ואניס קוואבבי,
    במרחק 2 ק״מ, שווה עצירה.
ar:
  name: فاردزيا
  short: >-
    دير الملكة تامار المنحوت في الصخر فوق نهر متكفاري: نحو 500 متر من الجرف في ما يصل إلى تسعة عشر طابقاً،
    وكنيسة رُسمت فيها تامار في حياتها.
  body: >-
    **أُريد لفاردزيا أن تكون خفية، مدينة-ديراً مخبّأة في جوف الصخر، إلى أن انتزع زلزال 1283 واجهة الجرف
    وكشف أحشاءها للوادي.**


    بدأ العمل في عهد جورج الثالث (حكم 1156–1184) على الضفة اليسرى لنهر متكفاري، في سفح جبل إيروشيتي، وتابعته
    ابنته تامار. نُحتت كنيسة رقاد السيدة العذراء وزُيّنت بالرسوم بين 1184 و1186؛ وفي السنوات السابقة لمعركة
    باسياني، نحو 1203، أُضيفت مساكن وتحصينات جديدة، وقناة ماء طولها 3.5 كم من زيدا فاردزيا، وشبكة ريّ.
    تمتدّ الكهوف على نحو 500 متر من الجرف في ما يصل إلى تسعة عشر طابقاً، ويبلغ عددها نحو خمسمئة.


    وتشرح حكاية شعبية الاسم: يُقال إن تامار الطفلة ضلّت طريقها في الكهوف فنادت: «آك فار، دزيا!»، أي «أنا
    هنا يا عمّي!». لا يصدّق ذلك لغوي واحد، ولا يغفل عنه دليل واحد.


    قلب المكان هو الكنيسة، قاعة منحوتة في الصخر طولها 14.5 متراً. على جدارها الشمالي يحمل جورج الثالث
    وتامار، بالحلل الملكية البيزنطية، نموذج الكنيسة. لا تضع تامار شريط المرأة المتزوجة، ونقشها يدعو لها
    بطول العمر في حين لا يفعل نقش أبيها ذلك؛ ولهذا تعود الصورة إلى 1184–1186، وهي أقدم صورها الباقية.
    وإلى جانبهما يقف راتي سوراميلي، إريستافي (حاكم) كارتلي، الذي موّل الزخرفة؛ ووقّع الرسام غيورغي اسمه
    في الهيكل. وعلى وجه الدقة، هذا رسم جاف (سيكّو) لا فريسكو.


    في القسم الشرقي ابحث عن 185 جرة نبيذ مغروسة في الأرضية؛ وفي الغربي عن قاعة الطعام والمخبز، وعن برج
    الأجراس الذي يعود إلى نحو 1300. نهب الفرس فاردزيا عام 1551، وبعد وصول العثمانيين عام 1578 رحل عنها
    الرهبان. ومن 1857 إلى 1928 قام فيها دير من جديد، ومنذ نهاية الحكم السوفيتي عاد إليها الرهبان، فصارت
    المدينة التي خبّأتها تامار في الصخر بيتاً لأحدهم مرة أخرى.
  tip: >-
    احضر عند الافتتاح، نحو 10:00، أو بعد 16:00: فالجرف يلتهب عند الظهيرة، وهو أيضاً موعد وصول الحافلات
    السياحية. التذكرة نحو 15 ₾، إضافة إلى نحو 3 ₾ للحافلة الصغيرة من الموقف السفلي، أو خمس عشرة دقيقة
    سيراً صعوداً. البس حذاءً ذا نعل متماسك؛ فالدرجات مصقولة وبعض الأنفاق منخفضة وشديدة الانحدار. الظل
    شحيح، فاحمل ماءً وقبعة. لدخول الكنيسة تحتاج النساء إلى تنورة طويلة وغطاء للرأس، والرجال إلى سروال
    طويل. يعيش هنا رهبان: اخفض صوتك وأبقِ الطائرة المسيّرة في حقيبتها. المقهى ودورات المياه عند المدخل؛
    وأقرب صرّاف آلي في أسبيندزا.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً حتى خاشوري، ثم الطريق S8 جنوباً عبر مضيق بورجومي إلى أخالتسيخي،
    ثم الطريق S11 مروراً بأسبيندزا حتى خيرتفيسي، حيث يصعد طريق طوله 16 كم بمحاذاة متكفاري إلى فاردزيا.
    المسافة نحو 265 كم وأربع ساعات وعشرون دقيقة من دون توقف؛ ومع استراحة للقهوة والوقود احسبها أقرب إلى
    خمس. الطريق معبّد كله، لكن آخر 30 كم ضيقة، فيها منعطفات عمياء، وحافلات سياحية في الصيف. تزوّد بالوقود
    في خاشوري أو بورجومي أو أخالتسيخي، إذ تقلّ المحطات بعد أسبيندزا. تكفي سيارة اقتصادية؛ وفي الشتاء ركّب
    إطارات شتوية. وتستحق فانيس كفابيبي، على بعد 2 كم، التوقف عندها.
