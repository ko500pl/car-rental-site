ka:
  name: სამთავისის საკათედრო ტაძარი
  short: 1030 წლის ტაძარი კასპთან — ქართული ფასადის დეკორის ეტალონი, რომელსაც საუკუნეების განმავლობაში
    იმეორებდნენ.
  body: >-
    **სამთავისი ის შენობაა, რომელმაც ქართული ეკლესიის ფასადს სახე მისცა.** ტაძარი 1030 წელს ააგო ეპისკოპოსმა
    ილარიონ სამთავნელმა და მისი აღმოსავლეთი ფასადი — დიდი ქვის ჯვრით, რომბებით და ორნამენტული თაღებით
    — გახდა მოდელი, რომელსაც შემდეგი ორასი წლის განმავლობაში ქართლისა და კახეთის ათეულობით ეკლესია იმეორებდა.


    მთავარი აქ სწორედ დეკორია. მოჩუქურთმებული ჯვარი ფასადის ცენტრში, მის გვერდებზე რომბები, ქვევით ბრმა
    თაღების რიგი — კომპოზიცია იმდენად გაწონასწორებულია, რომ ხელოვნებათმცოდნეები მას ქართული შუასაუკუნეების
    არქიტექტურის საკვანძო ძეგლად მიიჩნევენ. შიგნით ტაძარი უფრო თავშეკავებულია: ფრესკების ფრაგმენტები XV–XVII
    საუკუნეებისაა.


    კომპლექსში ასევე შედის:


    - გალავანი კოშკებით, ნაწილობრივ დანგრეული, ჩრდილოეთ მხარეს

    - სამრეკლო და საეპისკოპოსო სასახლის ნაშთები

    - ძველი სასაფლაო ტაძრის გარშემო, ქვის ჯვრებით


    გუმბათი XV საუკუნეში მიწისძვრის შემდეგ ხელახლა აშენდა და ორიგინალისგან ოდნავ განსხვავდება — ეს დეტალი
    გვერდიდან ნათლად ჩანს.


    სამთავისი მთავარი გზიდან ხუთი კილომეტრითაა დაშორებული და ხშირად ცარიელია, თუმცა თბილისიდან საათზე
    ნაკლებია — ეს მას იდეალურ პირველ გაჩერებად აქცევს დასავლეთის მარშრუტზე.
  tip: >-
    ერთი საათი სავსებით საკმარისია. ტაძარი ჩვეულებრივ ღიაა დღის განმავლობაში, თუმცა მღვდელი ყოველთვის
    ადგილზე არ არის; ჩაცმის წესები მოქმედებს და თავსაფრები კართან დევს. ფასადის ფოტოსთვის საუკეთესო დროა
    დილა, როცა მზე პირდაპირ აღმოსავლეთ კედელზე ეცემა და კვეთა რელიეფურად გამოიყურება. ინფრასტრუქტურა სოფელში
    მინიმალურია: კაფე, ტუალეტი და საწვავი აიღე კასპში ან ავტობანზე.
  route: >-
    თბილისიდან E60 ავტობანით დასავლეთისკენ კასპის მიმართულებით — დაახლოებით 55 კმ. კასპამდე ცოტა ადრე
    გადაუხვევ სამთავისის ნიშანზე ჩრდილოეთისკენ და კიდევ 5–6 კმ გაივლი სოფლის ასფალტირებულ გზაზე. სულ 62
    კმ და დაახლოებით ერთი საათი. ტაძარი სოფლის ცენტრშივეა და გალავანი შორიდან ჩანს; პარკინგი ჭიშკართან
    უფასოა. გზა მთელ მონაკვეთზე ასფალტია და ეკონომ-კლასის მანქანა სავსებით საკმარისია. საწვავი ავტობანზე
    ან კასპში აიღე.
en:
  name: Samtavisi Cathedral
  short: >-
    A cathedral of 1030 near Kaspi — the benchmark of Georgian facade decoration, copied for two centuries
    afterwards.
  body: >-
    **Samtavisi is the building that gave the Georgian church facade its face.** It was built in 1030
    by Bishop Ilarion Samtavneli, and its eastern front — a large carved cross flanked by rhombuses above
    a row of decorative arches — became the model that dozens of churches across Kartli and Kakheti reproduced
    over the next two hundred years.


    The decoration is the point here. The composition on that eastern wall is so precisely balanced that
    art historians treat it as a key monument of medieval Georgian architecture, and it repays standing
    still for a while. Inside the church is far more restrained, with fresco fragments dating from the
    15th to the 17th century.


    The complex also includes:


    - A curtain wall with towers, partly ruined, on the northern side

    - A bell tower and the remains of the bishop's palace

    - An old graveyard around the church, with carved stone crosses


    The dome was rebuilt after an earthquake in the 15th century and differs slightly in proportion from
    the original, a detail that is obvious once you look at the church from the side.


    Samtavisi lies five kilometres off the main highway and is often empty, yet it is under an hour from
    Tbilisi — which makes it an ideal first stop on any westward route.
  tip: >-
    An hour covers it comfortably. The church is normally open during the day, though a priest is not
    always present; dress rules apply and scarves are kept by the door. Morning is the best time to photograph
    the facade, when the sun falls directly on the eastern wall and the carving stands out in relief.
    Facilities in the village are minimal, so take care of cafés, toilets and fuel in Kaspi or on the
    motorway.
  route: >-
    Take the E60 motorway west from Tbilisi towards Kaspi, about 55 km. Shortly before Kaspi turn north
    at the Samtavisi sign and follow an asphalted village road for a further five or six kilometres. In
    total 62 km and roughly an hour. The cathedral stands in the middle of the village and its walls are
    visible from a distance; parking at the gate is free. The route is asphalt throughout and an economy
    car is entirely sufficient. Fuel is available on the motorway or in Kaspi.
ru:
  name: Собор Самтависи
  short: Собор 1030 года близ Каспи — эталон грузинского фасадного декора, который копировали два столетия.
  body: >-
    **Самтависи — здание, которое задало облик грузинского церковного фасада.** Собор построен в 1030
    году епископом Иларионом Самтавнели, и его восточный фасад — большой резной крест с ромбами по сторонам
    над рядом декоративных арок — стал образцом, который десятки церквей Картли и Кахетии повторяли следующие
    двести лет.


    Главное здесь именно декор. Композиция восточной стены выстроена настолько точно, что искусствоведы
    считают её ключевым памятником средневековой грузинской архитектуры, и перед ней стоит постоять подольше.
    Внутри храм гораздо сдержаннее: фрагменты фресок относятся к XV–XVII векам.


    В комплекс также входят:


    - Ограда с башнями, частично разрушенная, с северной стороны

    - Колокольня и остатки епископского дворца

    - Старое кладбище вокруг храма с резными каменными крестами


    Купол перестроили после землетрясения в XV веке, и по пропорциям он немного отличается от исходного
    — сбоку это заметно сразу.


    Самтависи стоит в пяти километрах от трассы и часто пустует, при этом от Тбилиси до него меньше часа,
    что делает его идеальной первой остановкой на любом западном маршруте.
  tip: >-
    Часа на осмотр достаточно. Храм обычно открыт днём, хотя священник бывает не всегда; действуют правила
    одежды, платки лежат у входа. Фасад лучше снимать утром, когда солнце падает прямо на восточную стену
    и резьба читается рельефно. Инфраструктуры в селе почти нет, поэтому кафе, туалеты и заправку планируйте
    в Каспи или на трассе.
  route: >-
    По автомагистрали E60 из Тбилиси на запад в сторону Каспи, около 55 км. Незадолго до Каспи сворачиваете
    на север по указателю на Самтависи и едете ещё пять-шесть километров по асфальтированной сельской
    дороге. Всего 62 км и примерно час. Собор стоит в центре села, ограда видна издалека; парковка у ворот
    бесплатная. Асфальт на всём протяжении, машины эконом-класса вполне достаточно. Заправиться можно
    на трассе или в Каспи.
fa:
  name: کلیسای جامع سامتاویسی
  short: کلیسای جامعی از 1030 نزدیک کاسپی — معیار تزیین نمای گرجی که دو سده پس از آن تقلید شد.
  body: >-
    **سامتاویسی همان بنایی است که به نمای کلیسای گرجی چهره بخشید.** آن را در 1030 ایلاریون سامتاونلیِ
    اسقف ساخت، و جبههٔ شرقی‌اش — صلیبی بزرگ و کنده‌کاری‌شده با لوزی‌هایی در دو سو، بالای ردیفی از طاق‌های
    تزیینی — الگویی شد که ده‌ها کلیسا در سراسر کارتلی و کاختی طی دویست سال بعد آن را بازتولید کردند.


    نکتهٔ اصلی همین تزیین است. ترکیب‌بندی آن دیوار شرقی چنان دقیق متوازن است که تاریخ‌نگاران هنر آن را
    بنایی کلیدی در معماری گرجی سده‌های میانه می‌دانند، و ارزش دارد مدتی بی‌حرکت روبه‌رویش بایستید. درون
    کلیسا به‌مراتب ساده‌تر است، با تکه‌هایی از نقاشی دیواری از سدهٔ پانزدهم تا هفدهم.


    مجموعه شامل حصاری با برج‌ها در سمت شمالی است که بخشی از آن ویران شده، یک برج ناقوس و بازمانده‌های
    کاخ اسقف، و گورستانی کهن گرد کلیسا با صلیب‌های سنگی کنده‌کاری‌شده. گنبد پس از زلزله‌ای در سدهٔ پانزدهم
    بازسازی شد و تناسب آن اندکی با گنبد اصلی فرق دارد؛ همین جزئیات وقتی کلیسا را از پهلو نگاه کنید آشکار
    می‌شود. سامتاویسی پنج کیلومتر دورتر از بزرگراه اصلی است و اغلب خلوت، و در عین حال کمتر از یک ساعت
    با تفلیس فاصله دارد — و همین آن را به نخستین توقف ایده‌آل هر مسیر رو به غرب بدل می‌کند.
  tip: >-
    یک ساعت به‌راحتی کافی است. کلیسا معمولاً در طول روز باز است، هرچند همیشه کشیشی حضور ندارد؛ قواعد پوشش
    برقرار است و روسری‌ها کنار در نگهداری می‌شوند. صبح بهترین زمان برای عکاسی از نما است، وقتی آفتاب مستقیم
    روی دیوار شرقی می‌افتد و کنده‌کاری برجسته می‌شود. امکانات روستا حداقلی است، پس کار کافه، سرویس بهداشتی
    و سوخت را در کاسپی یا روی بزرگراه حل کنید.
  route: >-
    از تفلیس بزرگراه E60 را رو به غرب و به سوی کاسپی بگیرید، حدود 55 کیلومتر. کمی پیش از کاسپی سر تابلوی
    سامتاویسی به شمال بپیچید و پنج تا شش کیلومتر دیگر جادهٔ آسفالتهٔ روستایی را دنبال کنید. روی هم 62
    کیلومتر و تقریباً یک ساعت. کلیسای جامع در میانهٔ روستا ایستاده و دیوارهایش از دور پیدا است؛ پارک کنار
    دروازه رایگان است. مسیر یکسره آسفالت است و خودروی اقتصادی کاملاً کافی. سوخت روی بزرگراه یا در کاسپی
    موجود است.
he:
  name: קתדרלת סמתאוויסי
  short: קתדרלה משנת 1030 ליד קספי — אמת המידה לעיטור החזית הגאורגי, שחוקתה במשך מאתיים שנה.
  body: >-
    **סמתאוויסי הוא המבנה שנתן לחזית הכנסייה הגאורגית את פניה.** היא נבנתה בשנת 1030 בידי הבישוף אילריון
    סמתאוונלי, והחזית המזרחית שלה — צלב מגולף גדול ולצידיו מעוינים, מעל שורה של קשתות דקורטיביות — הפכה
    לדגם שעשרות כנסיות ברחבי קרתלי וקחתי שחזרו במאתיים השנים שאחר כך.


    העיטור הוא כל העניין כאן. הקומפוזיציה על אותו קיר מזרחי מאוזנת בדיוק כזה שהיסטוריוני אמנות רואים בה
    מונומנט מפתח של האדריכלות הגאורגית של ימי הביניים, והיא מצדיקה עמידה ממושכת מולה. בפנים הכנסייה מאופקת
    הרבה יותר, עם שברי ציורי קיר מן המאה ה-15 עד ה-17.


    המכלול כולל גם חומת מגן עם מגדלים בצד הצפוני, הרוסה בחלקה, מגדל פעמונים ושרידי ארמון הבישוף, ובית
    קברות עתיק סביב הכנסייה ובו צלבי אבן מגולפים. הכיפה נבנתה מחדש אחרי רעידת אדמה במאה ה-15 והיא שונה
    מעט בפרופורציות מן המקורית — פרט שנעשה ברור מיד כשמסתכלים על הכנסייה מן הצד. סמתאוויסי שוכנת חמישה
    קילומטרים מן הכביש הראשי ולרוב ריקה מאדם, ובכל זאת פחות משעה מטביליסי — ולכן היא העצירה הראשונה האידיאלית
    בכל מסלול מערבה.
  tip: >-
    שעה מכסה אותה בנחת. הכנסייה פתוחה בדרך כלל במהלך היום, אם כי כומר אינו נוכח תמיד; כללי הלבוש תקפים
    ומטפחות ראש מונחות ליד הדלת. הבוקר הוא הזמן הטוב לצלם את החזית, כשהשמש נופלת ישירות על הקיר המזרחי
    והגילוף בולט בתבליט. השירותים בכפר מינימליים, לכן סדרו בית קפה, שירותים ודלק בקספי או על הכביש המהיר.
  route: >-
    צאו מטביליסי מערבה על הכביש המהיר E60 לכיוון קספי, כ-55 ק״מ. מעט לפני קספי פנו צפונה בשילוט לסמתאוויסי
    והמשיכו בכביש כפרי סלול עוד חמישה או שישה קילומטרים. בסך הכול 62 ק״מ וכשעה נסיעה. הקתדרלה עומדת במרכז
    הכפר וחומותיה נראות מרחוק; החניה בשער חינם. המסלול סלול לכל אורכו ורכב חסכוני מספיק לחלוטין. דלק זמין
    על הכביש המהיר או בקספי.
ar:
  name: كاتدرائية سامتافيسي
  short: كاتدرائية من عام 1030 قرب كاسبي — معيار زخرفة الواجهة الجورجية الذي قُلّد قرنين بعدها.
  body: >-
    **سامتافيسي هي البناء الذي منح واجهة الكنيسة الجورجية ملامحها.** شيّدها عام 1030 الأسقف إيلاريون سامتافنيلي،
    وصارت واجهتها الشرقية — صليب منقوش كبير يحفّه معينان فوق صف من العقود الزخرفية — النموذج الذي استنسخته
    عشرات الكنائس في أنحاء كارتلي وكاخيتي على مدى المئتي سنة التالية.


    الزخرفة هي جوهر المكان. فتكوين ذلك الجدار الشرقي متوازن بدقة تجعل مؤرخي الفن يعدّونه معلماً مفتاحياً
    في العمارة الجورجية الوسيطة، وهو يستحق أن تقف أمامه طويلاً. أما داخل الكنيسة فأشد تقشفاً بكثير، وفيه
    شذرات من رسوم جدارية تعود إلى ما بين القرنين الخامس عشر والسابع عشر.


    ويضم المجمع أيضاً سوراً بأبراج في الجهة الشمالية خرب جزء منه، وبرج أجراس وبقايا قصر الأسقف، ومقبرة
    قديمة حول الكنيسة بصلبان حجرية منقوشة. وقد أُعيد بناء القبة بعد زلزال في القرن الخامس عشر، فاختلفت
    نسبها قليلاً عن الأصلية — وهي تفصيلة تتضح فور النظر إلى الكنيسة من الجانب. وتقع سامتافيسي على بعد
    خمسة كيلومترات من الطريق السريع وكثيراً ما تكون خالية، ومع ذلك فهي على أقل من ساعة من تبليسي — وهذا
    ما يجعلها المحطة الأولى المثالية في أي مسار نحو الغرب.
  tip: >-
    ساعة تغطيها براحة. الكنيسة مفتوحة عادة خلال النهار، وإن لم يكن الكاهن حاضراً دائماً؛ وقواعد اللباس
    مطبقة وأغطية الرأس متاحة عند الباب. الصباح أفضل وقت لتصوير الواجهة، حين تسقط الشمس مباشرة على الجدار
    الشرقي فيبرز النقش بارزاً. خدمات القرية بسيطة جداً، فدبّر أمر المقهى ودورة المياه والوقود في كاسبي
    أو على الطريق السريع.
  route: >-
    اسلك الطريق السريع E60 غرباً من تبليسي نحو كاسبي، أي نحو 55 كم. وقبل كاسبي بقليل انعطف شمالاً عند
    لافتة سامتافيسي واتبع طريقاً قروياً معبّداً خمسة أو ستة كيلومترات إضافية. المجموع 62 كم ونحو ساعة.
    تقف الكاتدرائية في وسط القرية وتُرى أسوارها من بعيد؛ والوقوف عند البوابة مجاني. المسار معبّد بالكامل
    وسيارة اقتصادية تكفي تماماً. والوقود متوفر على الطريق السريع أو في كاسبي.
