ka:
  name: სამთავისის საკათედრო ტაძარი
  short: >-
    1030 წლის ტაძარი იგოეთთან, რომლის აღმოსავლეთ ფასადის ჯვარსა და ორ რომბს ქართველი ოსტატები თაობიდან
    თაობამდე იმეორებდნენ.
  body: >-
    **სამთავისის აღმოსავლეთ ფასადის წინ რომ დადგებით, იმ კედელს უყურებთ, რომელმაც ქართველ ოსტატებს ეკლესიის
    შემკობა ასწავლა.**


    დასავლეთის კარის თავზე ამოკვეთილი წარწერა ამშენებელსაც ასახელებდა და თარიღსაც: „ილარიონ სამთავნელმან
    აღაშენა ტაძარი ესე“. ქვა დღეს დაკარგულია, ტექსტი კი თავის დროზე გამოქვეყნდა. მეორე წარწერა მას ეპისკოპოს
    ილარიონს, ვაჩე ყანჩაველის ძეს უწოდებს — იმას, ვინც 1050 წელს ტაძარს მარანი და საწნახელიც აუშენა. ის
    ტაძარი, რომელიც 1030 წელს დაასრულა, დღესაც დგას. გადმოცემა უფრო შორს მიდის: ერთი ცნობით, პირველი მონასტერი
    აქ 572 წელს ცამეტ ასურელ მამათაგან ერთ-ერთმა, ისიდორემ დააარსა, მეორით — ეკლესია ვახტანგ გორგასალმა
    ააგო. ადრინდელი ბაზილიკისგან მხოლოდ საძირკველი შემორჩა, რომელიც 2000-იან წლებში გათხრებისას აღმოაჩინეს.


    აღმოსავლეთ ფასადი ხუთ ბრმა თაღზეა აგებული. საკურთხევლის მთავარი სარკმლის თავზე უზარმაზარი მოჩუქურთმებული
    ჯვარი აღმართულა, სარკმლის ქვეშ კი ჩუქურთმით ამოვსებული, კუთხით დაყენებული ორი კვადრატი — ის ორმაგი
    რომბი, რომელსაც შემდგომი ხუროთმოძღვრები არაერთხელ მიბაძავდნენ, განსაკუთრებით XII საუკუნის მეორე ნახევარში.
    მარჯვენა თაღის სიღრმეში გრიფონის რელიეფი მოკუნტულა; ოდესღაც მას წყვილი ჰყავდა, რომელიც 1847 წელს,
    არქიტექტორ რიპარდის რესტავრაციისას დაიკარგა.


    XV საუკუნის მიწისძვრებმა გუმბათი, დასავლეთის კედელი და ბურჯები ჩამოანგრია. XV–XVI საუკუნეების მიჯნაზე
    ისინი გაიანე ამილახვარმა და მისმა ძემ სიაოშმა აღადგინეს — ამას დასავლეთ ფასადზე მათივე წარწერა გვამცნობს.
    1679 წელს გივი ამილახვარმა და მისმა მეუღლე თამარმა გუმბათი და აფსიდი ხელახლა მოახატვინეს; მხატვარი
    მელიტონ სამთავნელი იყო. გუმბათიდან ყოვლისმპყრობელი და ექვსფრთიანი სერაფიმები იყურებიან, საკურთხევლის
    კონქში კი ვედრებაა.


    2007 წლიდან სამთავისი იუნესკოს მსოფლიო მემკვიდრეობის წინასწარ სიაშია, ავტომაგისტრალიდან სულ ორიოდე
    კილომეტრითაა მოშორებული და მაინც იშვიათად არის ხალხმრავალი. საქართველოში ცოტა შედევრი ითხოვს მოგზაურისგან
    ასე ცოტას.
  tip: >-
    შესვლა უფასოა; ტაძარი დღისით ჩვეულებრივ ღიაა, თუმცა მღვდელი ყოველთვის ადგილზე არ არის. ჩაიცვით თავშეკავებულად,
    ქალებმა თავი დაიფარონ. დილით მოდით, როცა მზე აღმოსავლეთ ფასადს პირდაპირ ეცემა და საჭრეთლის ყოველი
    კვალი ამოიწევს; ნაშუადღევს ჩუქურთმა ბრტყელდება. გალავანსაც შემოუარეთ: ჩრდილოეთ კედელში ჩაშენებულ სამსართულიან
    სამრეკლოს ქვემოთ ჭიშკარი ჰქონდა, შუაში მცველთა სათავსი, ზემოთ კი ზარები. ადგილზე კაფე და ტუალეტი არ
    არის — ორი კილომეტრის მოშორებით, იგოეთში გზისპირა გაჩერებებს იპოვით. ერთი საათი საკმარისია.
  route: >-
    თბილისიდან ს1 (E60) გზით დასავლეთისკენ, გორის მიმართულებით იარეთ. ქალაქის ცენტრიდან დაახლოებით 55
    კმ-ში იგოეთთან გადაუხვიეთ — და არა კასპთან, როგორც ძველ აღწერილობებშია — და ჩრდილოეთით წადით. მოკლე
    ადგილობრივი გზა დაახლოებით 2 კმ-ში სოფელ სამთავისში მიგიყვანთ, სადაც ტაძარი მდინარე ლეხურის მარცხენა
    ნაპირზე, გალავნის შიგნით დგას. სულ დაახლოებით 59 კმ და დაახლოებით ერთი საათი — იმის მიხედვით, რამდენად
    სწრაფად დააღწევთ თავს ქალაქს. გზა მთლიანად ასფალტიანია, ეკონომკლასის მანქანა იდეალურია. მანქანა ჭიშკართან
    დატოვეთ; საწვავი მაგისტრალზე ადვილად იშოვება.
en:
  name: Samtavisi Cathedral
  short: >-
    A cathedral of 1030 near Igoeti; its carved east front, a great cross over two stone diamonds, was
    copied by Georgian masons for generations.
  body: >-
    **Stand at the east end of Samtavisi and you are looking at the wall that taught Georgian masons how
    to dress a church.**


    An inscription over the west door recorded the builder and the year: "Ilarion Samtavneli built this
    church." The stone is now lost, but its text was published before it vanished, and a second inscription
    names him as Bishop Ilarion, son of Vache Kanchaeli, the man who in 1050 also gave the cathedral a
    wine cellar and a wine press. The church he finished in 1030 is what you see. Tradition reaches further
    back: one account credits a first monastery here to Isidore, one of the Thirteen Assyrian Fathers,
    in 572; another names King Vakhtang Gorgasali. Only foundations of an earlier basilica, found by excavation
    in the 2000s, remain.


    The east façade is built on five blind arches. Above the main window rises a huge carved cross; below
    it, two squares set on their points and filled with interlace form the double diamond that later builders
    borrowed again and again, above all in the later 12th century. High in the right-hand arch crouches
    a carved gryphon. It once had a partner, lost during the 1847 restoration by the architect Rippard.


    Earthquakes in the 15th century brought down the dome, the west wall and the piers. Around 1500 Gaiane
    Amilakhvari and her son Siaosh rebuilt them, as their inscription on the west front records. In 1679
    Givi Amilakhvari and his wife Tamar had the dome and apse repainted by Meliton Samtavneli: Christ
    Pantocrator with six-winged seraphim above, the Deesis in the apse.


    Samtavisi has been on UNESCO's tentative World Heritage list since 2007, yet it sits two kilometres
    off the motorway and is rarely busy. Few masterpieces in Georgia ask so little of the traveller.
  tip: >-
    Entry is free, and the cathedral is normally open by day, though a priest is not always there. Dress
    modestly; women should cover their heads. Come in the morning, when the sun strikes the east façade
    head-on and every chisel cut stands out; by afternoon the carving flattens. Walk the circuit of the
    walls, too: the three-storey bell tower in the north wall had a gate below, a guardroom in the middle
    and bells on top. There are no cafés or toilets on site; Igoeti, two kilometres away, has roadside
    stops. An hour is enough.
  route: >-
    Take the S1 (E60) west from Tbilisi towards Gori. Some 55 km from the city centre, leave at Igoeti,
    not at Kaspi as older directions say, and turn north. A short local road leads about 2 km to Samtavisi
    village, where the cathedral stands in its walled enclosure on the left bank of the Lekhura. In all
    roughly 59 km and about an hour, depending on how quickly you get out of the city. It is asphalt all
    the way and an economy car is ideal. Park by the gate; fuel is easy to find along the motorway.
ru:
  name: Собор Самтависи
  short: >-
    Собор 1030 года близ Игоэти, чей резной восточный фасад — огромный крест над двумя каменными ромбами
    — грузинские мастера повторяли поколениями.
  body: >-
    **Встаньте у восточной стены Самтависи: перед вами стена, по которой грузинские каменщики учились
    наряжать храм.**


    Надпись над западным входом называла строителя и год: «Иларион Самтавнели построил эту церковь». Сам
    камень утрачен, но текст успели опубликовать до его исчезновения, а вторая надпись называет строителя
    епископом Иларионом, сыном Ваче Канчаэли, — тем самым, кто в 1050 году подарил собору ещё и винный
    погреб с давильней. Церковь, которую он закончил в 1030 году, — это та, что стоит перед вами. Предание
    уходит глубже: по одной версии, первый монастырь здесь основал в 572 году Исидор, один из Тринадцати
    сирийских (ассирийских) отцов; по другой — царь Вахтанг Горгасали. От более ранней базилики сохранился
    лишь фундамент, открытый при раскопках 2000-х годов.


    Восточный фасад выстроен на пяти глухих арках. Над главным окном поднимается огромный резной крест;
    под ним два квадрата, поставленные на угол и заполненные плетёнкой, складываются в тот самый двойной
    ромб, который позднейшие зодчие заимствовали снова и снова, прежде всего во второй половине XII века.
    Высоко в правой арке притаился резной грифон. Когда-то у него была пара — её утратили при реставрации
    1847 года, которую вёл архитектор Риппард.


    Землетрясения XV века обрушили купол, западную стену и столбы. Около 1500 года Гаиане Амилахвари и
    её сын Сиаош отстроили их заново, о чём говорит их надпись на западном фасаде. В 1679 году Гиви Амилахвари
    и его жена Тамар поручили Мелитону Самтавнели заново расписать купол и апсиду: наверху — Христос Вседержитель
    с шестикрылыми серафимами, в апсиде — Деисус.


    С 2007 года Самтависи входит в предварительный список Всемирного наследия ЮНЕСКО, и всё же стоит он
    в двух километрах от автомагистрали, а людно здесь бывает редко. Немногие шедевры Грузии требуют от
    путешественника так мало.
  tip: >-
    Вход свободный; днём собор обычно открыт, хотя священник на месте бывает не всегда. Одевайтесь скромно,
    женщинам нужно покрыть голову. Приезжайте утром, когда солнце бьёт прямо в восточный фасад и проступает
    каждый след резца; после полудня резьба становится плоской. Обойдите и ограду: трёхъярусная колокольня
    в северной стене внизу служила воротами, посередине — караульней, а наверху держала колокола. Кафе
    и туалетов на месте нет; придорожные остановки — в Игоэти, в двух километрах. Часа вполне достаточно.
  route: >-
    Выезжайте из Тбилиси на запад по трассе S1 (E60) в сторону Гори. Примерно в 55 км от центра города
    сверните на съезд у Игоэти — не у Каспи, как пишут в старых описаниях, — и берите на север. Короткая
    местная дорога ведёт около 2 км до села Самтависи, где на левом берегу Лехуры в обнесённой стеной
    ограде стоит собор. Всего около 59 км и примерно час — смотря как быстро удастся выбраться из города.
    Асфальт на всём пути, и машина эконом-класса подходит идеально. Парковка у ворот; заправок вдоль трассы
    хватает.
fa:
  name: کلیسای جامع سامتاویسی
  short: >-
    کلیسای جامعی از سال ۱۰۳۰ نزدیک ایگوئتی که نمای شرقیِ کنده‌کاری‌شده‌اش — صلیبی بزرگ بر فراز دو لوزی
    سنگی — را سنگ‌تراشان گرجی نسل‌ها تقلید کردند.
  body: >-
    **کنار دیوار شرقی سامتاویسی که بایستید، روبه‌روی دیواری هستید که به سنگ‌تراشان گرجی آموخت چگونه کلیسا
    را بیارایند.**


    کتیبه‌ای بر فراز درِ غربی نام سازنده و سال ساخت را ثبت کرده بود: «ایلاریون سامتاونلی این کلیسا را
    ساخت.» آن سنگ اکنون از دست رفته، اما متنش پیش از ناپدید شدن منتشر شده بود، و کتیبهٔ دیگری او را اسقف
    ایلاریون، پسر واچه کانچائلی، می‌نامد؛ همان کسی که در سال ۱۰۵۰ انبار شراب و چرخُشتی هم به کلیسای جامع
    بخشید. کلیسایی که او در ۱۰۳۰ به پایان رساند همین است که می‌بینید. روایت‌ها از این هم دورتر می‌روند:
    به گفتهٔ یکی، نخستین صومعهٔ این‌جا را در سال ۵۷۲ ایزیدور، یکی از سیزده پدر آشوری، بنیان نهاد؛ روایتی
    دیگر از شاه وختانگ گورگاسالی نام می‌برد. از بازیلیکایی کهن‌تر تنها پی‌هایش بر جا مانده که در کاوش‌های
    دههٔ ۲۰۰۰ از زیر خاک بیرون آمد.


    نمای شرقی بر پنج طاق‌نمای کور استوار است. بالای پنجرهٔ اصلی صلیبی عظیم و کنده‌کاری‌شده قد برافراشته؛
    زیر آن، دو مربع که بر رأس خود ایستاده‌اند و با نقش‌های درهم‌بافته پر شده‌اند، همان لوزی دوگانه‌ای
    را می‌سازند که معماران بعدی بارها و بارها از آن وام گرفتند، به‌ویژه در نیمهٔ دوم سدهٔ دوازدهم. بالای
    طاق‌نمای سمت راست، شیردالی سنگی کز کرده است. روزگاری جفتی داشت که در مرمت سال ۱۸۴۷ به دست معماری به
    نام ریپارد از میان رفت.


    زلزله‌های سدهٔ پانزدهم گنبد، دیوار غربی و جرزها را فرو ریختند. حدود سال ۱۵۰۰ گایانه آمیلاخواری و پسرش
    سیائوش آن‌ها را از نو ساختند، چنان‌که کتیبهٔ خودشان بر نمای غربی گواهی می‌دهد. در سال ۱۶۷۹ گیوی آمیلاخواری
    و همسرش تامار نقاشی گنبد و محراب را به ملیتون سامتاونلی سپردند: در بالا مسیح پانتوکراتور (فرمانروای
    کل) با سرافیم‌های شش‌بال، و در محراب صحنهٔ دِئیسیس، یعنی مسیح میان مریم و یحیای تعمیددهنده.


    سامتاویسی از سال ۲۰۰۷ در فهرست موقت میراث جهانی یونسکو جای دارد، با این حال فقط دو کیلومتر از بزرگراه
    فاصله دارد و به‌ندرت شلوغ می‌شود. کمتر شاهکاری در گرجستان این‌قدر اندک از مسافر طلب می‌کند.
  tip: >-
    ورود رایگان است و کلیسای جامع معمولاً در طول روز باز است، هرچند کشیش همیشه حضور ندارد. پوشش مناسب
    داشته باشید؛ بانوان باید سر خود را بپوشانند. صبح بیایید، وقتی آفتاب مستقیم بر نمای شرقی می‌تابد و
    جای تک‌تک ضربه‌های قلم پیداست؛ بعدازظهر کنده‌کاری‌ها تخت و کم‌رمق می‌شوند. دور دیوارهای حصار هم قدم
    بزنید: برج ناقوس سه‌طبقه در دیوار شمالی، در پایین دروازه داشت، در میانه اتاق نگهبانی و در بالا ناقوس‌ها.
    در محل کافه یا سرویس بهداشتی نیست؛ ایگوئتی، دو کیلومتر آن‌طرف‌تر، توقفگاه‌های کنار جاده دارد. یک ساعت
    کافی است.
  route: >-
    از تفلیس جادهٔ S1 (E60) را رو به غرب و به سوی گوری بگیرید. حدود ۵۵ کیلومتر از مرکز شهر، در ایگوئتی
    از بزرگراه خارج شوید — نه در کاسپی، آن‌طور که راهنماهای قدیمی می‌گویند — و به شمال بپیچید. جاده‌ای
    محلی و کوتاه حدود ۲ کیلومتر تا روستای سامتاویسی می‌رود، جایی که کلیسای جامع در محوطهٔ حصاردارش بر
    کرانهٔ چپ رود لخورا ایستاده است. روی هم حدود ۵۹ کیلومتر و نزدیک یک ساعت، بسته به این‌که چقدر زود از
    شهر بیرون بزنید. تمام راه آسفالت است و خودروی کلاس اکونومی بهترین انتخاب است. کنار دروازه پارک کنید؛
    پیدا کردن سوخت در طول بزرگراه آسان است.
he:
  name: קתדרלת סמתאוויסי
  short: >-
    קתדרלה משנת 1030 ליד איגואטי, שאת חזיתה המזרחית המגולפת – צלב ענק מעל שני מעוינים מאבן – העתיקו בוני
    אבן גאורגים במשך דורות.
  body: >-
    **עמדו מול הקיר המזרחי של סמתאוויסי, ולפניכם הקיר שלימד את בוני האבן הגאורגים איך לעטר כנסייה.**


    כתובת מעל הפתח המערבי תיעדה את הבונה ואת השנה: "אילריון סמתאוונלי בנה כנסייה זו." האבן עצמה אבדה,
    אך נוסחה פורסם לפני שנעלמה, וכתובת שנייה מכנה אותו הבישוף אילריון, בנו של ואצ'ה קנצ'אאלי – האיש שבשנת
    1050 העניק לקתדרלה גם מרתף יין וגת. הכנסייה שהשלים בשנת 1030 היא זו שעומדת לפניכם. המסורת מרחיקה עוד
    יותר: לפי גרסה אחת ייסד כאן את המנזר הראשון, בשנת 572, איסידורוס, אחד משלושה-עשר האבות האשוריים; גרסה
    אחרת מייחסת אותו למלך וחטנג גורגסלי. מבזיליקה קדומה יותר שרדו רק יסודות, שנחשפו בחפירות בשנות ה-2000.


    החזית המזרחית בנויה על חמש קשתות עיוורות. מעל החלון הראשי מתנשא צלב מגולף עצום; מתחתיו, שני ריבועים
    העומדים על קודקודם וממולאים בעיטורי שזירה יוצרים את המעוין הכפול, שבונים מאוחרים יותר שאלו שוב ושוב,
    ובעיקר במחצית השנייה של המאה ה-12. גבוה בקשת הימנית רובץ גריפון מגולף. פעם היה לו בן זוג, שאבד בשיפוץ
    של שנת 1847 בידי האדריכל ריפארד.


    רעידות אדמה במאה ה-15 הפילו את הכיפה, את הקיר המערבי ואת העמודים הנושאים. בסביבות שנת 1500 בנו אותם
    מחדש גאיאנה אמילחווארי ובנה סיאוש, כפי שמתעדת הכתובת שלהם על החזית המערבית. בשנת 1679 הזמינו גיווי
    אמילחווארי ורעייתו תמר מן הצייר מליטון סמתאוונלי ציור חדש לכיפה ולאפסיס: למעלה, בכיפה, ישו הפנטוקרטור
    (שליט כול) ועמו שרפים בעלי שש כנפיים; באפסיס – הדאסיס, ישו בין מרים ליוחנן המטביל.


    מאז 2007 רשומה סמתאוויסי ברשימה המקדמית של אתרי המורשת העולמית של אונסק״ו, ובכל זאת היא שוכנת שני
    קילומטרים בלבד מן הכביש המהיר ולעיתים רחוקות יש בה עומס. מעטות יצירות המופת בגאורגיה שמבקשות מן המטייל
    מאמץ קטן כל כך.
  tip: >-
    הכניסה חינם, ובשעות היום הקתדרלה פתוחה בדרך כלל, אף שלא תמיד נמצא בה כומר. התלבשו בצניעות; נשים נדרשות
    לכסות את הראש. בואו בבוקר, כשהשמש מכה ישירות בחזית המזרחית וכל מכת אזמל בולטת; אחר הצהריים הגילוף
    נראה שטוח. הקיפו גם את החומות: מגדל הפעמונים בן שלוש הקומות שבחומה הצפונית שימש בתחתיתו שער, באמצעו
    חדר משמר ובראשו מקום לפעמונים. אין במקום בית קפה או שירותים; באיגואטי, שני קילומטרים משם, יש עצירות
    דרך. שעה מספיקה.
  route: >-
    צאו מטביליסי מערבה בכביש S1 (E60) לכיוון גורי. כ-55 ק״מ ממרכז העיר רדו ביציאה לאיגואטי – לא בקספי,
    כפי שמורות הוראות ישנות – ופנו צפונה. דרך מקומית קצרה מובילה כ-2 ק״מ אל הכפר סמתאוויסי, שם עומדת הקתדרלה
    במתחם מוקף חומה על הגדה השמאלית של נהר הלחורה. בסך הכול כ-59 ק״מ וכשעת נסיעה, תלוי כמה מהר תצאו מהעיר.
    הדרך סלולה לכל אורכה ורכב מקטגוריית אקונומי אידיאלי. חנו ליד השער; תחנות דלק יש בשפע לאורך הכביש המהיר.
ar:
  name: كاتدرائية سامتافيسي
  short: >-
    كاتدرائية من عام 1030 قرب إيغوئيتي، ظلّ البنّاؤون الجورجيون ينسخون واجهتها الشرقية المنحوتة — صليب
    عظيم فوق معيّنين حجريين — جيلاً بعد جيل.
  body: >-
    **قف عند الطرف الشرقي لسامتافيسي، فأمامك الجدار الذي علّم البنّائين الجورجيين كيف يُلبسون الكنيسة
    حُلّتها.**


    كانت كتابة فوق الباب الغربي تسجّل اسم الباني والسنة: «إيلاريون سامتافنيلي بنى هذه الكنيسة». ضاع الحجر
    اليوم، لكن نصّه نُشر قبل أن يختفي، وتسمّيه كتابة ثانية الأسقفَ إيلاريون بن فاتشي كانتشائيلي، وهو الرجل
    الذي وهب الكاتدرائية عام 1050 قبواً للنبيذ ومعصرة أيضاً. والكنيسة التي أتمّها عام 1030 هي التي تراها.
    أما التقليد فيعود أبعد من ذلك: تنسب إحدى الروايات أول دير هنا إلى إيسيدور، أحد الآباء الآشوريين الثلاثة
    عشر، عام 572، وتذكر رواية أخرى الملك فاختانغ غورغاسالي. ولم يبقَ من بازيليكا أقدم سوى أساساتها التي
    كُشف عنها في حفريات أُجريت في العقد الأول من هذا القرن.


    تقوم الواجهة الشرقية على خمسة عقود صمّاء. فوق النافذة الرئيسية يرتفع صليب منحوت هائل، وتحته مربّعان
    قائمان على رأسيهما ومملوءان بزخارف مضفورة يشكّلان المعيّن المزدوج الذي استعاره البنّاؤون اللاحقون
    مرة بعد مرة، ولا سيما في النصف الثاني من القرن الثاني عشر. وفي أعلى العقد الأيمن يربض غريفين منحوت،
    وكان له رفيق فُقد خلال ترميم عام 1847 على يد المعماري ريبارد.


    أسقطت زلازل القرن الخامس عشر القبة والجدار الغربي والدعامات. ونحو عام 1500 أعادت غايانه أميلاخفاري
    وابنها سياوش بناءها، كما تسجّل كتابتهما على الواجهة الغربية. وفي عام 1679 عهد غيفي أميلاخفاري وزوجته
    تمار إلى ميليتون سامتافنيلي بإعادة رسم جداريات القبة والحنية: في الأعلى المسيح ضابط الكل (البانتوكراتور)
    يحفّ به السيرافيم ذوو الأجنحة الستة، وفي الحنية مشهد الديسيس، أي المسيح بين العذراء ويوحنا المعمدان.


    سامتافيسي مدرجة منذ 2007 على القائمة التمهيدية للتراث العالمي لدى اليونسكو، ومع ذلك فهي على بعد كيلومترين
    فقط من الطريق السريع ونادراً ما تزدحم. قلّما تطلب روائع جورجيا من المسافر جهداً يسيراً كهذا.
  tip: >-
    الدخول مجاني، والكاتدرائية مفتوحة عادة في النهار، وإن لم يكن الكاهن حاضراً دائماً. ارتدِ ملابس محتشمة،
    وعلى النساء تغطية الرأس. تعالَ صباحاً حين تضرب الشمس الواجهة الشرقية مباشرة فيبرز كل أثر للإزميل؛
    أما بعد الظهر فيبهت النقش ويتسطّح. وطُف حول الأسوار أيضاً: برج الأجراس ذو الطوابق الثلاثة في السور
    الشمالي كانت فيه بوابة في الأسفل وغرفة للحرس في الوسط والأجراس في الأعلى. لا مقاهي ولا دورات مياه
    في الموقع؛ وفي إيغوئيتي، على بعد كيلومترين، استراحات على الطريق. تكفي ساعة واحدة.
  route: >-
    اسلك الطريق S1 (E60) غرباً من تبليسي باتجاه غوري. وعلى بعد نحو 55 كم من وسط المدينة اخرج عند إيغوئيتي
    — لا عند كاسبي كما تقول الإرشادات القديمة — وانعطف شمالاً. يقودك طريق محلي قصير نحو 2 كم إلى قرية
    سامتافيسي، حيث تقوم الكاتدرائية داخل سورها على الضفة اليسرى لنهر ليخورا. المسافة الإجمالية نحو 59
    كم وقرابة ساعة، بحسب سرعة خروجك من المدينة. الطريق معبّد بالكامل والسيارة الاقتصادية مثالية. اركن
    عند البوابة؛ والوقود متوفر بسهولة على الطريق السريع.
