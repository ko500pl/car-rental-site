ka:
  name: ილიას ტბა
  short: >-
    პატარა ტყით გარშემორტყმული ტბა ყვარლის გარეუბანში, კახეთის ერთ-ერთი მთავარი საზაფხულო საბანაო ადგილი.
  body: >-
    **ილიას ტბა კახეთის ვაკის იმ იშვიათი ადგილთაგანია, სადაც ზაფხულში ცივი წყალია.** ის ყვარლიდან ორიოდე კილომეტრში, კავკასიონის ფერდობის ძირშია, ტყით შემორტყმული და ისეთი ზომის, რომ ნაპირის შემოვლა ნახევარ საათში შეიძლება.


    სახელი ილია ჭავჭავაძეს ეკუთვნის — მწერალი და საზოგადო მოღვაწე ყვარელში დაიბადა 1837 წელს, და მისი სახლ-მუზეუმი ქალაქის ცენტრშია, ტბიდან ხუთი წუთის სავალზე. ბევრი ვიზიტორი ორივეს ერთად ათვალიერებს.


    ტბა ბანაობისთვის მოწყობილია: ხის ბაქნები, ჩასასვლელი კიბეები, ნავები და კატამარანები, სანაპიროზე კაფეები. ივლის-აგვისტოში წყალი 22-24 გრადუსამდე თბება, ხოლო ნაპირზე ჩრდილი ტყის ხარჯზეა — ეს კახეთის სიცხეში მნიშვნელოვანია.


    რაზეც წინასწარ უნდა იცოდე: ეს არ არის ველური, უკაცრიელი ტბა. აგვისტოს შაბათ-კვირას აქ ხალხმრავლობაა, მუსიკა ისმის და ადგილს იკავებენ. თუ სიმშვიდე გინდა, სამუშაო დღეს ან დილით ადრე მიდი — ცხრა საათამდე ხშირად თითქმის ცარიელია და წყალი სარკესავითაა.


    შემოდგომაზე ტბა სხვა დანიშნულებას იძენს: ბანაობა აღარ ხდება, სამაგიეროდ ტყე ფერს იცვლის და შემოვლითი ბილიკი გასეირნებისთვის კარგია. ზამთარში ადგილი ღიაა, მაგრამ ცარიელი და ინფრასტრუქტურა არ მუშაობს.
  tip: >-
    ორი საათი ბანაობისა და გასეირნებისთვის საკმარისია. სანაპიროზე შესვლა ჩვეულებრივ ფასიანია, თანხა მცირეა და შეზლონგი ცალკე ჯდება. საშხაპე და გამოსაცვლელი კაბინები არის, თუმცა ხარისხი ცვალებადია. ტბაში ჩასვლა ბაქნებიდან ჯობია — ნაპირი ადგილ-ადგილ ტალახიანია. მაისსა და ივნისში კოღოები აქტიურია საღამოს. ალკოჰოლი ბევრ კაფეშია, ამიტომ დაბრუნების მძღოლი წინასწარ განსაზღვრე.
  route: >-
    თბილისიდან კახეთის ავტომაგისტრალით გურჯაანისა და ბაკურციხის გავლით ყვარლისკენ — 145 კმ ასფალტი. ყვარელში სამხრეთ-აღმოსავლეთით მოუხვიე და ორ კილომეტრში ტბასთან ხარ; ნიშანი და პარკინგი მკაფიოა. სულ 150 კმ, დაახლოებით ორი საათი და ოცდათხუთმეტი წუთი. ალტერნატივა თელავისა და გომბორის უღელტეხილის გავლით მსგავსი ხანგრძლივობისაა და უფრო საინტერესო. საწვავი ყვარელში. ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Ilia Lake
  short: >-
    A small forest-ringed lake on the edge of Kvareli, the main summer swimming spot in the Alazani valley.
  body: >-
    **Ilia Lake is one of the few places on the Kakhetian plain where the water is cold in August.** It lies two kilometres from Kvareli at the foot of the Caucasus slope, ringed by forest and small enough to walk around in half an hour.


    The name belongs to Ilia Chavchavadze, the writer and public figure who was born in Kvareli in 1837 and remains one of the central figures of modern Georgian identity. His house museum stands in the middle of the town, five minutes away, and many visitors do both in one stop.


    The lake is set up for swimming: wooden decks, ladders down into the water, pedal boats and rowing boats for hire, and cafes along the near shore. In July and August the water reaches 22 to 24°C, and the shade on the bank comes from real forest rather than planted umbrellas — which matters when the valley is at 35°C.


    Know in advance what this is not. It is not a wild, empty mountain lake. On an August weekend it is busy, music plays from the cafes and the good spots are taken by ten in the morning. If you want quiet, come on a weekday or early: before nine the surface is usually flat and there is almost nobody there.


    In autumn the lake changes purpose. Nobody swims, but the forest turns and the path around the shore makes an easy hour's walk with the mountains behind it. In winter the place stays open and completely empty, with nothing running.


    There is a second, larger and newer lake on the other side of Kvareli, built as part of a resort development, and the two are easy to confuse when following signs. Ilia Lake is the older, smaller and more wooded of the pair, on the south-eastern side of the town.
  tip: >-
    Two hours covers a swim and a walk round. Access to the beach area is normally charged, the sum is small, and sunloungers cost extra. Showers and changing cabins exist, though standards vary through the season. Get into the water from the decks rather than the bank, which is muddy in places. Mosquitoes are active at dusk in May and June. Several cafes serve alcohol, so decide who is driving back before you sit down.
  route: >-
    Take the Kakheti highway from Tbilisi through Gurjaani and Bakurtsikhe towards Kvareli — 145 km of asphalt. In Kvareli turn south-east and the lake is two kilometres on, with clear signs and a car park. Total 150 km, about two hours thirty-five. The alternative over the Gombori Pass through Telavi takes about the same time and is a more interesting drive. Fuel is available in Kvareli. An economy car is sufficient, and the road is fine in any season.
ru:
  name: Озеро Илии
  short: >-
    Небольшое озеро в лесу на окраине Кварели — главное место летнего купания в Алазанской долине.
  body: >-
    **Озеро Илии — одно из немногих мест на кахетинской равнине, где в августе вода холодная.** Оно лежит в двух километрах от Кварели, у подножия кавказского склона, окружено лесом и настолько невелико, что обойти его берегом можно за полчаса.


    Название связано с Ильёй Чавчавадзе, писателем и общественным деятелем, родившимся в Кварели в 1837 году и остающимся одной из центральных фигур грузинского самосознания. Его дом-музей стоит в центре города, в пяти минутах отсюда, и многие осматривают оба места за одну поездку.


    Озеро оборудовано для купания: деревянные помосты, лестницы в воду, катамараны и лодки напрокат, кафе вдоль ближнего берега. В июле и августе вода прогревается до 22-24 градусов, а тень на берегу даёт настоящий лес, а не зонтики, — при тридцати пяти в долине это существенно.


    Стоит заранее понимать, чем это место не является. Это не дикое пустое горное озеро. В августовские выходные здесь людно, из кафе играет музыка, а хорошие места заняты к десяти утра. Ради тишины приезжайте в будний день или рано: до девяти поверхность обычно зеркальная и почти никого нет.


    Осенью у озера другое назначение. Купаться уже не купаются, зато лес меняет цвет, и тропа по берегу превращается в спокойную часовую прогулку с горами на заднем плане. Зимой здесь открыто и совершенно пусто, инфраструктура не работает.
  tip: >-
    Двух часов хватает на купание и круг по берегу. Вход в пляжную зону обычно платный, сумма небольшая, лежаки оплачиваются отдельно. Душевые и кабинки для переодевания есть, хотя качество меняется по сезону. Заходить в воду лучше с помостов: берег местами илистый. В мае и июне на закате активны комары. В нескольких кафе наливают, так что определитесь с водителем заранее.
  route: >-
    Из Тбилиси по кахетинской трассе через Гурджаани и Бакурцихе в сторону Кварели — 145 км асфальта. В Кварели поверните на юго-восток, через два километра будет озеро, указатели и парковка заметные. Всего 150 км, около двух часов тридцати пяти минут. Вариант через Гомборский перевал и Телави занимает примерно столько же и интереснее для водителя. Заправка есть в Кварели. Машины эконом-класса достаточно в любой сезон.
fa:
  name: دریاچهٔ ایلیا
  short: >-
    دریاچه‌ای کوچک میان جنگل در حاشیهٔ کوارلی، اصلی‌ترین جای شنای تابستانی درّهٔ آلازانی.
  body: >-
    **دریاچهٔ ایلیا از معدود جاهای دشت کاختی است که آبش در مرداد سرد است.** دو کیلومتری کوارلی و در پای دامنهٔ قفقاز قرار دارد، جنگل گرداگردش را گرفته و آن‌قدر کوچک است که در نیم ساعت می‌توان دورش را پیاده پیمود.


    نام آن از ایلیا چاوچاوادزه گرفته شده، نویسنده و کنشگر اجتماعی که در 1837 در کوارلی به دنیا آمد و همچنان از چهره‌های محوری هویت نوین گرجی است. خانه‌موزه‌اش در میانهٔ شهر و در پنج دقیقه‌ای اینجاست، و بسیاری هر دو را در یک توقف می‌بینند.


    دریاچه برای شنا آماده شده است: سکوهای چوبی، نردبان‌هایی برای ورود به آب، قایق پارویی و پایی برای کرایه، و کافه‌هایی در کرانهٔ نزدیک. در تیر و مرداد دمای آب به 22 تا 24 درجه می‌رسد و سایهٔ ساحل از جنگلی واقعی است نه از چتر، و این وقتی درّه سی و پنج درجه است اهمیت دارد.


    از پیش بدانید اینجا چه نیست. دریاچه‌ای وحشی و خلوت در دل کوه نیست. آخر هفتهٔ مرداد شلوغ است، از کافه‌ها موسیقی می‌آید و جاهای خوب تا ساعت ده گرفته شده است. اگر آرامش می‌خواهید روز کاری یا صبح زود بیایید؛ پیش از نه، سطح آب معمولاً آینه است و تقریباً کسی نیست.


    در پاییز کارکرد دریاچه عوض می‌شود. کسی شنا نمی‌کند، اما جنگل رنگ می‌گیرد و مسیر دور کرانه پیاده‌روی آرام یک‌ساعته‌ای می‌شود با کوه‌ها در پس‌زمینه. در زمستان اینجا باز اما کاملاً خالی است و هیچ خدماتی کار نمی‌کند.
  tip: >-
    دو ساعت برای شنا و یک دور کامل کافی است. ورود به محوطهٔ ساحلی معمولاً هزینه دارد، مبلغ اندک است و تخت ساحلی جداگانه حساب می‌شود. دوش و رختکن هست، هرچند کیفیتش در طول فصل تغییر می‌کند. بهتر است از سکوها وارد آب شوید نه از ساحل که جاهایی گِلی است. در اردیبهشت و خرداد پشه‌ها هنگام غروب فعال‌اند. چند کافه مشروب سرو می‌کنند، پس پیش از نشستن تکلیف رانندهٔ بازگشت را روشن کنید.
  route: >-
    از تفلیس بزرگراه کاختی را از گورجانی و باکورتسیخه به سوی کوارلی بگیرید؛ 145 کیلومتر آسفالت. در کوارلی به جنوب شرق بپیچید و دو کیلومتر جلوتر به دریاچه می‌رسید، با تابلو و پارکینگ روشن. جمعاً 150 کیلومتر و حدود دو ساعت و سی و پنج دقیقه. مسیر جایگزین از گردنهٔ گومبوری و تلاوی تقریباً همین‌قدر طول می‌کشد و رانندگی جالب‌تری دارد. سوخت در کوارلی هست. خودروی اقتصادی در هر فصلی کافی است.
he:
  name: אגם איליה
  short: >-
    אגם קטן מוקף יער בשולי קוורלי, מקום הרחצה הקיצי המרכזי בעמק האלאזני.
  body: >-
    **אגם איליה הוא אחד המקומות הבודדים במישור קחתי שבהם המים קרים באוגוסט.** הוא שוכן שני קילומטרים מקוורלי למרגלות מדרון הקווקז, מוקף יער וקטן דיו כדי להקיפו ברגל בחצי שעה.


    השם שייך לאיליה צ'אבצ'אבדזה, הסופר ואיש הציבור שנולד בקוורלי ב-1837 ונותר אחת הדמויות המרכזיות בזהות הגאורגית המודרנית. בית המוזיאון שלו עומד במרכז העיירה, חמש דקות מכאן, ורבים משלבים את שני המקומות בעצירה אחת.


    האגם מותאם לרחצה: רציפי עץ, סולמות אל המים, סירות משוט ודוושה להשכרה, ובתי קפה לאורך החוף הקרוב. ביולי ובאוגוסט המים מגיעים ל-22 עד 24 מעלות, והצל בגדה מגיע מיער אמיתי ולא משמשיות — וזה משנה כשבעמק שלושים וחמש.


    כדאי לדעת מראש מה זה לא. זה אינו אגם הררי פראי וריק. בסוף שבוע באוגוסט המקום עמוס, מוזיקה מתנגנת מבתי הקפה, והמקומות הטובים תפוסים עד עשר בבוקר. אם אתם רוצים שקט, בואו ביום חול או מוקדם: לפני תשע פני המים חלקים ואין כמעט איש.


    בסתיו האגם משנה ייעוד. איש אינו שוחה, אבל היער מחליף צבע והשביל סביב הגדה הופך לטיול נינוח של שעה עם ההרים ברקע. בחורף המקום פתוח וריק לגמרי, ושום שירות אינו פועל.
  tip: >-
    שעתיים מכסות שחייה והקפה של הגדה. הכניסה לאזור החוף בתשלום בדרך כלל, הסכום קטן, ומיטות שיזוף עולות בנפרד. יש מקלחות ותאי הלבשה, אם כי הרמה משתנה במהלך העונה. עדיף להיכנס למים מהרציפים ולא מהגדה, שבמקומות בוצית. במאי וביוני היתושים פעילים עם רדת החשכה. כמה בתי קפה מגישים אלכוהול, אז החליטו מי נוהג חזרה לפני שאתם מתיישבים.
  route: >-
    סעו מטביליסי בכביש קחתי דרך גורג'אני ובקורצחה לכיוון קוורלי — 145 ק״מ אספלט. בקוורלי פנו דרומה-מזרחה, וכעבור שני קילומטרים תגיעו לאגם, עם שילוט ברור וחניון. בסך הכול 150 ק״מ, כשעתיים ושלושים וחמש דקות. החלופה דרך מעבר גומבורי וטלאווי אורכת בערך אותו זמן והנהיגה בה מעניינת יותר. דלק יש בקוורלי. רכב חסכוני מספיק בכל עונה.
ar:
  name: بحيرة إيليا
  short: >-
    بحيرة صغيرة تحيط بها الغابة على أطراف كفارلي، وهي أهم موضع سباحة صيفي في وادي ألازاني.
  body: >-
    **بحيرة إيليا من الأماكن القليلة في سهل كاخيتي التي يبقى ماؤها بارداً في آب.** تقع على بعد كيلومترين من كفارلي عند سفح منحدر القوقاز، تحيط بها الغابة وهي صغيرة بما يكفي للدوران حولها سيراً في نصف ساعة.


    والاسم لإيليا تشافتشافادزه، الكاتب والشخصية العامة الذي وُلد في كفارلي عام 1837 وما زال من الوجوه المركزية في الهوية الجورجية الحديثة. ومتحف بيته في وسط البلدة على بعد خمس دقائق، وكثيرون يجمعون الموقعين في وقفة واحدة.


    والبحيرة مهيأة للسباحة: أرصفة خشبية وسلالم تنزل إلى الماء وقوارب تجديف ودواسة للإيجار ومقاهٍ على الضفة القريبة. وفي تموز وآب يبلغ الماء 22 إلى 24 درجة، والظل على الضفة من غابة حقيقية لا من مظلات، وهذا مهم حين يكون السهل عند خمس وثلاثين.


    واعرف مسبقاً ما ليست هي. ليست بحيرة جبلية برية خالية. ففي عطلة نهاية أسبوع في آب تكون مزدحمة، والموسيقى تنبعث من المقاهي، والمواضع الجيدة محجوزة قبل العاشرة صباحاً. وإن أردت الهدوء فتعال في يوم عمل أو باكراً: قبل التاسعة يكون سطح الماء أملس ولا يكاد يوجد أحد.


    وفي الخريف يتبدل دور البحيرة. لا أحد يسبح، لكن الغابة تتلون ويصير الدرب حول الضفة نزهة هادئة في ساعة والجبال في الخلفية. وفي الشتاء يبقى المكان مفتوحاً وخالياً تماماً ولا تعمل فيه أي خدمة.
  tip: >-
    ساعتان تكفيان لسباحة ولفة حول الضفة. ودخول منطقة الشاطئ برسم عادةً، والمبلغ زهيد، وكراسي الاستلقاء تُحسب على حدة. وتوجد دشات وغرف تبديل ملابس، وإن تفاوتت جودتها خلال الموسم. وادخل الماء من الأرصفة لا من الضفة التي تكون طينية في مواضع. والبعوض نشط عند الغسق في أيار وحزيران. وبعض المقاهي تقدم الكحول، فحدد من سيقود عند العودة قبل أن تجلس.
  route: >-
    اسلك من تبليسي طريق كاخيتي عبر غورجاني وباكورتسيخه نحو كفارلي، 145 كم من الإسفلت. وفي كفارلي انعطف جنوباً شرقاً وبعد كيلومترين تبلغ البحيرة، واللافتات والموقف واضحة. المجموع 150 كم ونحو ساعتين وخمس وثلاثين دقيقة. والبديل عبر ممر غومبوري وتيلافي يستغرق الوقت نفسه تقريباً وقيادته أطرف. والوقود متوفر في كفارلي. سيارة اقتصادية تكفي في أي موسم.
