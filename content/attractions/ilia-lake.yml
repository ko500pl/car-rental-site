ka:
  name: ილიას ტბა
  short: >-
    ყვარლის დასავლეთ კიდეზე, ტყიან ნაპირებსა და კავკასიონის კედელს შორის — კახეთის სიცხეში საბანაო ტბა,
    ილიას სახლ-მუზეუმიდან ორიოდე კილომეტრში.
  body: >-
    **ყვარლის დასავლეთ კიდეზე, სადაც ვენახები კავკასიონის პირველ ტყიან ფერდობებს ებჯინება, პატარა ტბა
    ალაზნის ველის ზაფხულის სიცხეში გრილ წყალს გთავაზობთ.**


    ილიას ტბა დიდი არ არის — სიგრძე-სიგანით ნახევარ კილომეტრს ოდნავ აჭარბებს და მას ერთ საათზე ნაკლებში
    შემოუვლით. არც ველურია: საბანაო ზონა მოწყობილია, ნაპირზე კაფეები და სასტუმრო დგას. ღირსება მისი სხვაა
    — გარემო. ტყე პირდაპირ წყლამდე ჩამოდის, მის მიღმა კი დიდი კავკასიონი კედელივით აღმართულა: დილით მკვეთრი
    და ნათელი, შუადღისთვის ლურჯ ბურუსში გახვეული.


    სახელი ყვარლის ყველაზე სახელოვან შვილს მიანიშნებს. ილია ჭავჭავაძე აქ 1837 წელს დაიბადა — მწერალი,
    პუბლიცისტი, XIX საუკუნის ეროვნული მოძრაობის სინდისი, რომელმაც ქართველებს „ენა, მამული, სარწმუნოება“
    დაუტოვა. 1907 წელს ის მოკლეს, 1987 წელს კი საქართველოს მართლმადიდებელმა ეკლესიამ წმინდანად შერაცხა
    — წმინდა ილია მართალი. მისი მშობლიური სახლი, დღეს მუზეუმი, ქალაქშია, ტბიდან ორიოდე კილომეტრში. ეს
    ორი ადგილი ერთმანეთს ავსებს: ერთი საათი — ილიასთან, ერთიც — წყალში.


    ზაფხულის შაბათ-კვირას ნაპირი შუადღემდე ივსება და კაფეების მუსიკა წყალზე დაცურავს. სამუშაო დღეს მოდით,
    ან ცხრა საათამდე, როცა ზედაპირი ისე უძრავია, რომ მთებს თავდაყირა ირეკლავს. შემოდგომაზე აღარავინ ბანაობს,
    სამაგიეროდ ტყე სპილენძისფრად იფერება და ნაპირის ბილიკი თავად ხდება მოსვლის მიზეზი.


    პატარა ტბაა დიდი მეზობლით — და მოწმენდილ დილას სწორედ ეს მეზობელია მთავარი.
  tip: >-
    ნავიგატორში „ილიას ტბა“ ჩაწერეთ — ტბა ქალაქის დასავლეთ ნაწილშია და მასთან ილიას ტბის ქუჩა მიდის; ნუ
    აურევთ ქალაქის სამხრეთ-აღმოსავლეთით მდებარე კურორტ „ყვარლის ტბაში“. ბანაობისთვის და ნაპირის შემოსავლელად
    ორი საათი საკმარისია. საბანაო ზონაში შესვლა ჩვეულებრივ მცირე საფასურით ხდება, შეზლონგი ცალკე ჯდება
    — თანხა სეზონის მიხედვით იცვლება, ამიტომ ნაღდი ფული იქონიეთ. მაის-ივნისში, შებინდებისას, კოღო აქტიურია.
    კაფეებში ღვინოც ისხმება: ვინ დაჯდება საჭესთან, სუფრამდე გადაწყვიტეთ. თუ მუზეუმსაც აპირებთ, დილით ჯერ
    ილიას სახლი ნახეთ, შუადღის სიცხე კი ტბაზე გაატარეთ.
  route: >-
    თბილისიდან კახეთის გზატკეცილით (ს5) ბაკურციხემდე, შემდეგ გურჯაანის გავლით ჩრდილოეთით, ალაზნის გადაღმა,
    ყვარლამდე — დაახლოებით 145 კმ ასფალტი. ყვარელში დასავლეთისკენ, ილიას ტბის ქუჩას გაუყევით; ტბასთან
    სადგომია. სულ დაახლოებით 150 კმ და ორნახევარი საათი. ალტერნატივა გომბორის უღელტეხილია (შ38) თელავის
    გავლით, იქიდან კი ყვარლის გზით, გრემის გვერდით — დროში თითქმის იგივეა, ხედებით კი უფრო მდიდარი, თუმცა
    ზამთარში გომბორზე შეიძლება თოვლი იდოს. საწვავი ყვარელშია. ეკონომ-კლასის მანქანა სავსებით საკმარისია
    — გზა ბოლომდე ასფალტიანია და მთელი წლის განმავლობაში გასავლელი.
en:
  name: Ilia Lake
  short: >-
    A small wooded lake on Kvareli's western edge, with the Caucasus as its backdrop: Kakheti's summer
    swim, two kilometres from Ilia Chavchavadze's birthplace.
  body: >-
    **On the western edge of Kvareli, where the vineyards run up against the first wooded slopes of the
    Caucasus, a small lake gives the summer heat of the Alazani valley somewhere to swim.**


    Ilia Lake is modest, a little over half a kilometre across and easily walked round in under an hour.
    Nor is it wild: there is an organised bathing area, and cafés and a hotel stand along the shore. Its
    real virtue is the setting. Forest comes right down to the water, and behind it the Greater Caucasus
    rises like a wall, sharp and bright in the early light, blue with haze by early afternoon.


    The name points to Kvareli's most famous son. Ilia Chavchavadze was born here in 1837: writer, publisher
    and the conscience of Georgia's nineteenth-century national revival, the man who gave his country
    the watchword "Language, Homeland, Faith". He was assassinated in 1907, and in 1987 the Georgian Orthodox
    Church canonised him as Saint Ilia the Righteous. His family house, now a museum, stands in town a
    couple of kilometres away. The two belong together: an hour with Ilia, an hour in the water.


    On summer weekends the shore is full by late morning and café music drifts across the water. Come
    on a weekday, or before nine, when the surface lies still enough to hold the mountains upside down.
    In autumn nobody swims, but the woods turn copper and the path round the shore becomes reason enough
    to come.


    It is a small lake with a very large neighbour, and on a clear morning the neighbour steals the show.
  tip: >-
    Set your navigation to "Ilia Lake": it lies on the western side of town, reached by Ilia Lake Street;
    do not confuse it with the Kvareli Lake resort on the town's south-eastern side. Two hours is enough
    for a swim and a walk round. Expect a small charge for the bathing area, with sunbeds extra; prices
    change with the season, so carry cash. Mosquitoes come out at dusk in May and June. The cafés pour
    wine, so settle who is driving before you sit down. If you also want the museum, see Ilia's house
    in the cool of the morning and spend the midday heat at the lake.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) to Bakurtsikhe, then head north through Gurjaani and across
    the Alazani to Kvareli: about 145 km of asphalt. In Kvareli turn west onto Ilia Lake Street; there
    is parking by the water. Allow about 150 km and two and a half hours in all. The alternative is the
    Gombori Pass (Sh38) to Telavi and then the Kvareli road past Gremi: much the same time and the finer
    drive, though Gombori can hold snow in winter. Fuel up in Kvareli. An economy car is entirely adequate,
    as it is asphalt all the way and open all year.
ru:
  name: Озеро Илии
  short: >-
    Небольшое лесное озеро на западной окраине Кварели, с Кавказом на фоне: летний пляж Кахетии, в двух
    километрах от места рождения Илии Чавчавадзе.
  body: >-
    **На западной окраине Кварели, где виноградники подступают к первым лесистым склонам Кавказа, небольшое
    озеро спасает от летнего зноя Алазанской долины.**


    Озеро Илии скромное — чуть больше полкилометра в поперечнике, его легко обойти пешком менее чем за
    час. И оно не дикое: здесь есть организованный пляж, а на берегу стоят кафе и отель. Его настоящее
    достоинство — окружение. Лес подступает прямо к воде, а за ним встаёт стеной Большой Кавказ, резкий
    и яркий в раннем свете, синеющий от дымки к полудню.


    Название указывает на самого знаменитого сына Кварели. Илия Чавчавадзе родился здесь в 1837 году:
    писатель, издатель и совесть грузинского национального возрождения XIX века, человек, подаривший своей
    стране девиз «Язык, Родина, Вера». Его убили в 1907 году, а в 1987 году Грузинская православная церковь
    причислила его к лику святых как святого Илию Праведного. Его родовой дом, ныне музей, стоит в городе,
    в паре километров отсюда. Эти два места дополняют друг друга: час с Илией, час в воде.


    В летние выходные к позднему утру берег заполняется, а над водой плывёт музыка из кафе. Приезжайте
    в будни или до девяти, когда вода так неподвижна, что в ней отражаются перевёрнутые горы. Осенью здесь
    никто не купается, но леса становятся медными, и тропа вокруг берега сама становится поводом приехать.


    Это маленькое озеро с очень большим соседом, и в ясное утро сосед перетягивает всё внимание на себя.
  tip: >-
    Задайте в навигаторе «Ilia Lake»: озеро лежит на западной стороне города, к нему ведёт улица Озера
    Илии; не путайте его с курортом «Кварельское озеро» на юго-восточной стороне города. Двух часов достаточно
    для купания и прогулки вокруг. За пляжную зону обычно берут небольшую плату, шезлонги — отдельно;
    цены меняются по сезону, так что возьмите наличные. В мае и июне на закате появляются комары. В кафе
    подают вино, так что решите, кто за рулём, ещё до того, как сядете за стол. Если хотите ещё и музей,
    посмотрите дом Илии утром в прохладе, а дневную жару переждите у озера.
  route: >-
    Из Тбилиси по Кахетинской трассе (S5) до Бакурцихе, затем на север через Гурджаани и через Алазани
    к Кварели: около 145 км асфальта. В Кварели поверните на запад, на улицу, ведущую к озеру; у воды
    есть парковка. Всего около 150 км и два с половиной часа. Альтернатива — Гомборский перевал (Sh38)
    до Телави и затем дорога на Кварели через Греми: время примерно то же, а вид красивее, хотя зимой
    на Гомбори бывает снег. Заправьтесь в Кварели. Машины эконом-класса вполне хватит — дорога асфальтирована
    и открыта весь год.
fa:
  name: دریاچهٔ ایلیا
  short: >-
    دریاچه‌ای کوچک و جنگلی در حاشیهٔ غربی کوارلی، با قفقاز به‌عنوان پس‌زمینه: محل شنای تابستانی کاختی،
    دو کیلومتر دورتر از محل تولد ایلیا چاوچاوادزه.
  body: >-
    **در حاشیهٔ غربی کوارلی، جایی که تاکستان‌ها به نخستین شیب‌های جنگلی قفقاز می‌رسند، دریاچه‌ای کوچک
    در گرمای تابستانِ درهٔ آلازانی جایی برای شنا فراهم می‌کند.**


    دریاچهٔ ایلیا کوچک و بی‌ادعاست؛ اندکی بیش از نیم‌کیلومتر عرض دارد و در کمتر از یک ساعت به‌آسانی می‌توان
    پیاده دور آن گشت. طبیعی و دست‌نخورده هم نیست: محوطهٔ شنای منظمی دارد، و کافه‌ها و هتلی در کنار ساحل
    ایستاده‌اند. ارزش واقعی آن در چشم‌انداز است. جنگل تا کنار آب پیش می‌آید، و پس‌پشتش قفقاز بزرگ چون
    دیواری برمی‌خیزد، در نور بامدادی تیز و روشن، و در اوایل بعدازظهر آبی‌رنگ در مه.


    نام آن به مشهورترین فرزند کوارلی اشاره دارد. ایلیا چاوچاوادزه در سال ۱۸۳۷ در همین‌جا زاده شد: نویسنده،
    ناشر و وجدان نوزایی ملی گرجستان در سدهٔ نوزدهم، مردی که شعار «زبان، سرزمین، ایمان» را به کشورش هدیه
    داد. او در سال ۱۹۰۷ به قتل رسید، و در سال ۱۹۸۷ کلیسای ارتدکس گرجستان او را با نام قدیس ایلیای پارسا
    در شمار قدیسان درآورد. خانهٔ خانوادگی‌اش، که اکنون موزه است، در شهر، حدود دو کیلومتر آن‌سوتر، برپاست.
    این دو با هم معنا می‌یابند: یک ساعت با ایلیا، یک ساعت در آب.


    در روزهای تعطیل تابستان، ساحل تا اواخر صبح پر می‌شود و صدای موسیقی کافه‌ها بر آب می‌گذرد. روز کاری
    بیایید، یا پیش از ساعت نه، وقتی سطح آب چنان آرام است که کوه‌ها را وارونه در خود نگه می‌دارد. در پاییز
    کسی شنا نمی‌کند، اما جنگل‌ها رنگ مس می‌گیرند و مسیر دور ساحل خود دلیلی برای آمدن می‌شود.


    این دریاچه‌ای کوچک با همسایه‌ای بسیار بزرگ است، و در صبحی صاف، همسایه صحنه را از آن خود می‌کند.
  tip: >-
    در ناوبری «Ilia Lake» را جست‌وجو کنید: در سمت غربی شهر قرار دارد و از خیابان دریاچهٔ ایلیا به آن می‌رسید؛
    آن را با تفرجگاه «دریاچهٔ کوارلی» در جنوب‌شرقی شهر اشتباه نگیرید. دو ساعت برای شنا و گشتی دور دریاچه
    کافی است. برای محوطهٔ شنا هزینه‌ای کوچک در نظر بگیرید، و صندلی‌های ساحلی جدا حساب می‌شوند؛ قیمت‌ها
    با فصل تغییر می‌کند، پس نقد همراه داشته باشید. در ماه‌های می و ژوئن هنگام غروب پشه پیدا می‌شود. کافه‌ها
    شراب می‌ریزند، پس پیش از نشستن مشخص کنید چه کسی رانندگی می‌کند. اگر موزه را هم می‌خواهید، خانهٔ ایلیا
    را در خنکای صبح ببینید و گرمای نیم‌روز را برای دریاچه بگذارید.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را تا باکورتسیخه بگیرید، سپس به‌سوی شمال از گورجانی بگذرید و از آلازانی
    عبور کنید تا کوارلی: حدود ۱۴۵ کیلومتر آسفالت. در کوارلی به سمت غرب به خیابان دریاچهٔ ایلیا بپیچید؛
    کنار آب پارکینگ هست. مجموعاً حدود ۱۵۰ کیلومتر و دو ساعت و نیم زمان بگذارید. راه دیگر گذرگاه گومبوری
    (Sh38) تا تلاوی و سپس راه کوارلی از کنار گرمی است: زمان تقریباً همان است و مسیر زیباتر، اگرچه گومبوری
    زمستان ممکن است برفی باشد. در کوارلی سوخت‌گیری کنید. خودروی معمولی کاملاً کافی است، چرا که مسیر تا
    انتها آسفالته و در تمام سال باز است.
he:
  name: אגם איליה
  short: >-
    אגם קטן ומיוער בקצה המערבי של קוורלי, עם הקווקז ברקע: מקום השחייה הקיצי של קאחתי, שני קילומטרים ממקום
    הולדתו של איליה צ'בצ'בדזה.
  body: >-
    **בקצה המערבי של קוורלי, שם הכרמים נוגעים במדרונות המיוערים הראשונים של הקווקז, אגם קטן מציע מקום
    לשחות בו בחום הקיץ של עמק האלאזני.**


    אגם איליה צנוע, קוטרו מעט יותר מחצי קילומטר, וקל להקיף אותו ברגל בפחות משעה. הוא גם לא פראי: יש בו
    אזור רחצה מאורגן, ובתי קפה ומלון עומדים על גדותיו. יתרונו האמיתי הוא הנוף. היער יורד עד המים, ומאחוריו
    מתנשא הקווקז הגדול כחומה, חד ובוהק באור הבוקר, כחול מאובך אחר הצהריים.


    השם מפנה אל הבן המפורסם ביותר של קוורלי. איליה צ'בצ'בדזה נולד כאן ב-1837: סופר, מוציא לאור ומצפונה
    של התחייה הלאומית הגאורגית במאה התשע־עשרה, האיש שנתן לארצו את הסיסמה "שפה, מולדת, אמונה". הוא נרצח
    ב-1907, וב-1987 הכנסייה האורתודוקסית הגאורגית הכריזה עליו כקדוש איליה הצדיק. בית משפחתו, שהוא כיום
    מוזיאון, עומד בעיר, כשני קילומטרים משם. שני המקומות שייכים זה לזה: שעה עם איליה, שעה במים.


    בסופי שבוע בקיץ החוף מתמלא עד סוף הבוקר, ומוזיקת בתי הקפה נודדת על המים. בואו ביום חול, או לפני תשע,
    כשפני המים שקטים כל כך שההרים משתקפים בהם הפוכים. בסתיו איש לא שוחה, אך היערות מקבלים גוון נחושת ושביל
    ההיקף עצמו הופך לסיבה מספקת לבוא.


    זהו אגם קטן עם שכן ענק, ובבוקר צלול השכן גונב את ההצגה.
  tip: >-
    כוונו את הניווט ל-"Ilia Lake": הוא שוכן בצד המערבי של העיר, מגיעים אליו ברחוב אגם איליה; אל תבלבלו
    אותו עם אתר הנופש "אגם קוורלי" בצדה הדרום-מזרחי של העיר. שעתיים מספיקות לשחייה ולהקיפו ברגל. צפו לתשלום
    קטן על אזור הרחצה, עם כיסאות שמש בתשלום נפרד; המחירים משתנים לפי העונה, אז הביאו מזומן. יתושים מגיעים
    בשעת בין־ערביים במאי וביוני. בתי הקפה מוזגים יין, אז החליטו מי נוהג לפני שאתם מתיישבים. אם אתם רוצים
    גם את המוזיאון, בקרו בבית איליה בקרירות הבוקר והשאירו את חום הצהריים לאגם.
  route: >-
    מטביליסי סעו בכביש הראשי של קאחתי (S5) עד בקורציחה, ואז המשיכו צפונה דרך גורג'אני וחצו את האלאזני
    לעבר קוורלי: כ-145 ק"מ אספלט. בקוורלי פנו מערבה לרחוב אגם איליה; יש חניה סמוך למים. הקצו בסך הכול
    כ-150 ק"מ ושעתיים וחצי. החלופה היא מעבר גומבורי (Sh38) לטלאווי ואז כביש קוורלי, על פני גרמי: זמן דומה
    ונסיעה יפה יותר, אף שבחורף גומבורי עלול להיות מושלג. תדלקו בקוורלי. מכונית רגילה מספיקה בהחלט, כי
    הדרך אספלט לכל אורכה ופתוחה כל השנה.
ar:
  name: بحيرة إيليا
  short: >-
    بحيرة صغيرة وسط الغابات على الحافة الغربية لكفاريلي، والقوقاز خلفية لها: مكان السباحة الصيفي في كاختي،
    على بعد كيلومترين من مسقط رأس إيليا تشافتشافادزه.
  body: >-
    **على الحافة الغربية لكفاريلي، حيث تصل الكروم إلى أولى سفوح القوقاز الحرجية، تمنح بحيرة صغيرة مكانًا
    للسباحة في قيظ صيف وادي ألازاني.**


    بحيرة إيليا متواضعة، يزيد قطرها قليلًا على نصف كيلومتر، ويمكن السير حولها بسهولة في أقل من ساعة. وهي
    ليست برّية أيضًا: فيها منطقة سباحة منظمة، وتقف على ضفتها مقاهٍ وفندق. ميزتها الحقيقية هي المشهد. تنزل
    الغابة حتى الماء، وخلفها تنتصب سلسلة القوقاز الكبرى كالجدار، حادّةً وساطعة في ضوء الصباح الباكر، زرقاءَ
    بالضباب بعد الظهر.


    يشير الاسم إلى أشهر أبناء كفاريلي. وُلد إيليا تشافتشافادزه هنا عام 1837: كاتب وناشر وضمير النهضة القومية
    الجورجية في القرن التاسع عشر، الرجل الذي أعطى بلاده شعار «اللغة، الوطن، الإيمان». اغتيل عام 1907،
    وفي عام 1987 أعلنته الكنيسة الأرثوذكسية الجورجية قديسًا باسم إيليا الصالح. يقع بيت عائلته، وهو اليوم
    متحف، في المدينة على بعد كيلومترين تقريبًا. يكمّل المكانان أحدهما الآخر: ساعة مع إيليا، وساعة في الماء.


    في عطلات نهاية أسبوع الصيف يمتلئ الشاطئ مع أواخر الصباح، وتنتقل موسيقى المقاهي عبر الماء. تعال في
    يوم عمل، أو قبل التاسعة، حين يسكن الماء حتى تنعكس فيه الجبال مقلوبة. في الخريف لا يسبح أحد، لكن الغابات
    تكتسي لون النحاس ويصبح المسار المحيط بالضفة سببًا كافيًا للزيارة بمفرده.


    إنها بحيرة صغيرة بجارٍ كبير جدًا، وفي صباح صافٍ يسرق الجار الأضواء كلها.
  tip: >-
    اضبط نظام تحديد المواقع على "Ilia Lake": تقع في الجانب الغربي من المدينة، ويُوصَل إليها عبر شارع بحيرة
    إيليا؛ ولا تخلط بينها وبين منتجع «بحيرة كفاريلي» في الجهة الجنوبية الشرقية من المدينة. ساعتان كافيتان
    للسباحة والتجول حول البحيرة. توقع رسمًا صغيرًا لمنطقة السباحة، مع كراسي الاستلقاء بأجر إضافي؛ تتغير
    الأسعار مع الموسم، فاحمل نقدًا. يظهر البعوض عند الغسق في مايو ويونيو. تقدّم المقاهي النبيذ، فحدّد
    من سيقود قبل الجلوس. إذا أردت زيارة المتحف أيضًا، فشاهد بيت إيليا في برودة الصباح واترك حرارة الظهيرة
    للبحيرة.
  route: >-
    من تبليسي، خذ طريق كاختي السريع (S5) إلى باكورتسيخه، ثم توجّه شمالًا عبر غورجاني وعبر ألازاني إلى
    كفاريلي: نحو 145 كم من الأسفلت. في كفاريلي، انحرف غربًا إلى شارع بحيرة إيليا؛ يوجد موقف سيارات قرب
    الماء. احسب نحو 150 كم وساعتين ونصفًا إجمالًا. البديل هو ممر غومبوري (Sh38) إلى تيلافي ثم طريق كفاريلي
    عبر غريمي: زمن مماثل تقريبًا وقيادة أجمل، مع أن الثلوج قد تغطي غومبوري شتاءً. تزوّد بالوقود في كفاريلي.
    سيارة اقتصادية كافية تمامًا، فالطريق مُعبَّد بالكامل ومفتوح طوال السنة.
