ka:
  name: საროს მეგალითები
  short: >-
    უზარმაზარი, უდუღაბოდ ნაწყობი ლოდები ჯავახეთის ზეგნის კიდეზე, ხერთვისის თავზე — სიმაგრე, რომელიც შესაძლოა
    სამი ათასი წლისაა.
  body: >-
    **საროს მშენებლებს დუღაბი არ სჭირდებოდათ: ლოდებს ისე არჩევდნენ, რომ კედელს მათივე სიმძიმე ამაგრებდა.**


    სარო ქვის სახლების სოფელია ზღვის დონიდან დაახლოებით 1480 მეტრზე, ჯავახეთის ზეგნის ქვედა საფეხურზე,
    მტკვრის ხეობის თავზე, ასპინძიდან 17 კილომეტრში. სოფლის გარშემო ციხესიმაგრეთა კომპლექსის ნაშთებია,
    რომელსაც მკვლევრები ზოგადად ძვ. წ. II ან I ათასწლეულით ათარიღებენ — ზუსტი თარიღი უცნობია. ნაგებობა
    ე.წ. ციკლოპური წყობისაა: 2,5 მეტრამდე სიგრძის ლოდები მშრალად, ყოველგვარი შემკვრელის გარეშე, ერთმანეთზეა
    მორგებული.


    კომპლექსი ერთი ნაგებობა არასოდეს ყოფილა. აქ სამი ცალკე სიმაგრე იდგა და თითოეულს დამოუკიდებლად შეეძლო
    თავის დაცვა: „ქვეუბნის ციხე“ სოფლის დასავლეთ ბოლოში, „ზედა“, ანუ „საყდრის ციხე“, მთავარანგელოზის ეკლესიასთან
    და „ახალი ციხე“ — კოშკი საყდრის ციხის ჩრდილო-დასავლეთით. კედლები დღეს 2,5–3 მეტრის სიმაღლეზეა შემორჩენილი.
    ხანგრძლივი არსებობისას სიმაგრე არაერთხელ გადააკეთეს, მის გვერდით მდებარე ნასახლარზე კი არქეოლოგებმა
    ადრეული და გვიანი ბრინჯაოს ხანის ნივთები და შუა საუკუნეების კერამიკა აღმოაჩინეს. ამ რაფაზე ადამიანი,
    წყვეტილად, სულ ცოტა სამი ათასი წელია ცხოვრობს.


    სარო ჯავახეთის ზეგნის გამაგრებულ დასახლებათა ოჯახს ეკუთვნის — ქართველი მკვლევრები მას აბულისა და შაორის
    უძველეს სიმაგრეებთან ერთად განიხილავენ. ოღონდ, აბულისგან განსხვავებით, საროში ჩვეულებრივი მანქანითაც
    ამოხვალთ.


    ნაშუადღევს ამოდით: დაბალი მზე ლოდებს გვერდიდან ეცემა, ყოველი ნაკერი გამოიკვეთება და ხედავთ, რა სიზუსტით
    უსადაგებდნენ ოსტატები ქვას ქვას.
  tip: >-
    ბილეთს, დარაჯს ან ღობეს აქ ვერ ნახავთ, მანიშნებელიც იშვიათია: სოფელში იკითხეთ, ციხე სად არის, და გზას
    მოგასწავლიან. ლოდები უხეშია, ზოგი მორყეულიც, ამიტომ კედლებს შორიდან უმზირეთ და ზედ ნუ აძვრებით. მყარი
    ფეხსაცმელი, წყალი და ქუდი წამოიღეთ — ზეგანზე ჩრდილი ცოტაა. ნანგრევები სახლებსა და საძოვრებს შორისაა:
    ჭიშკარი უკან მიხურეთ და ეზოებში ნუ შეხვალთ. სოფელში კაფე არ არის — ისადილეთ ასპინძაში ან ვარძიასთან.
    სარო ხერთვისთან, თმოგვთან და ვარძიასთან ერთად ერთ დღეში იოლად ეტევა.
  route: >-
    ყველაზე მოკლე გზა (დაახლოებით 215 კმ, 4 საათი) ჯავახეთზე გადის: შ-36-ით მანგლისამდე, შ-31-ით წალკაზე
    ნინოწმინდისკენ, შემდეგ ს-11-ით ახალქალაქზე და ფარავნის კანიონით ხერთვისამდე. ხერთვისიდან ს-11-ით ასპინძისკენ
    დაახლოებით 3 კილომეტრი გაიარეთ და მარჯვნივ, სოფლის ვიწრო გზაზე გადაუხვიეთ, რომელიც დაახლოებით 4 კილომეტრზე
    საროსკენ აღმართს მიუყვება. ბორჯომის, ახალციხისა და ასპინძის გავლით დაახლოებით 255 კმ-ია: ასპინძიდან
    ს-11-ით სამხრეთით დაახლოებით 10 კილომეტრი გაიარეთ და მარცხნივ გადაუხვიეთ. მაისი–ოქტომბრის მიღმა წალკის
    ზეგანზე თოვლისა და ნისლის გამო ბორჯომის გზა შეიძლება უფრო უსაფრთხო არჩევანი აღმოჩნდეს. მშრალ ამინდში
    ეკონომ-კლასის მანქანაც ავა; წვიმის შემდეგ აღმართი ნელა აიარეთ. საწვავი ახალქალაქში ან ასპინძაში ჩაასხით.
en:
  name: Saro Megaliths
  short: >-
    Walls of huge unmortared boulders on the edge of the Javakheti plateau above Khertvisi: a stronghold
    perhaps three thousand years old.
  body: >-
    **Saro's builders had no use for mortar: they chose boulders heavy enough that their own weight would
    hold the wall.**


    Saro is a village of stone houses at about 1,480 metres, on the lower step of the Javakheti plateau
    above the Mtkvari gorge, 17 km from Aspindza. Around it lie the remains of a fortress complex that
    scholars date broadly to the 2nd or 1st millennium BC; the exact date is unknown. It is built in the
    so-called cyclopean manner, with dry-laid blocks up to 2.5 metres long fitted against one another
    and nothing else to bind them.


    It was never a single building. There were three separate strongholds, each able to hold out on its
    own: the Kveubani castle at the western end of the village, the Upper or Church castle beside the
    Archangel church, and the New castle, a tower to the north-west of it. Their walls now stand 2.5 to
    3 metres high. The fortress was rebuilt more than once during its long life, and excavations at the
    settlement beside it have produced early and late Bronze Age finds as well as medieval pottery. People
    have lived on this ledge, on and off, for at least three thousand years.


    Saro belongs to a family of fortified settlements on the plateau; Georgian scholars set it beside
    the ancient strongholds of Abuli and Shaori. Unlike Abuli, it can be reached in an ordinary car.


    Come in the late afternoon. The low sun rakes across the boulders, every joint shows, and you can
    see how closely the builders matched stone to stone.
  tip: >-
    There is no ticket, guard or fence, and signs are scarce: ask in the village for the tsikhe (fortress)
    and someone will point the way. The blocks are rough and some are loose, so admire the walls rather
    than climbing them. Bring sturdy shoes, water and a hat, as the plateau has little shade. The ruins
    sit among houses and pastures, so close any gate behind you and keep out of yards. There is no café
    in the village: eat in Aspindza or at Vardzia. Saro fits easily into a day with Khertvisi, Tmogvi
    and Vardzia.
  route: >-
    The shortest way (about 215 km, 4 hours) crosses Javakheti: the Sh36 to Manglisi, the Sh31 through
    Tsalka towards Ninotsminda, then the S11 through Akhalkalaki and down the Paravani canyon to Khertvisi.
    From Khertvisi drive about 3 km north on the S11 towards Aspindza and turn right onto a narrow village
    road that climbs about 4 km to Saro. Via Borjomi, Akhaltsikhe and Aspindza it is about 255 km: from
    Aspindza follow the S11 south for about 10 km and turn left. Outside May–October, snow and fog on
    the Tsalka plateau can make the Borjomi route the safer choice. In dry weather an economy car manages;
    after rain, take the climb slowly. Fill up in Akhalkalaki or Aspindza.
ru:
  name: Мегалиты Саро
  short: >-
    Стены из огромных валунов без раствора на краю Джавахетского плато над Хертвиси — твердыня, которой,
    возможно, три тысячи лет.
  body: >-
    **Строителям Саро раствор был ни к чему: они выбирали валуны настолько тяжёлые, что стену держал их
    собственный вес.**


    Саро — село каменных домов на высоте около 1480 метров, на нижней ступени Джавахетского плато над
    ущельем Куры, в 17 км от Аспиндзы. Вокруг него лежат остатки крепостного комплекса, который учёные
    в общих чертах относят ко II или I тысячелетию до н. э.; точная дата неизвестна. Он сложен так называемой
    циклопической кладкой: блоки длиной до 2,5 метра уложены насухо, подогнаны друг к другу — и больше
    их ничто не связывает.


    Это никогда не было единым зданием. Здесь стояли три отдельные твердыни, каждая из которых могла держать
    оборону сама по себе: крепость Квеубани на западном краю села, Верхняя, или Церковная, крепость рядом
    с церковью Архангела и Новая крепость — башня к северо-западу от неё. Сегодня их стены поднимаются
    на 2,5–3 метра. За свою долгую жизнь крепость не раз перестраивали, а раскопки соседнего поселения
    дали находки раннего и позднего бронзового века и средневековую керамику. Люди жили на этом уступе
    — то уходя, то возвращаясь — по меньшей мере три тысячи лет.


    Саро входит в группу укреплённых поселений плато; грузинские исследователи ставят его в один ряд с
    древними твердынями Абули и Шаори. Но в отличие от Абули сюда можно доехать на обычной машине.


    Приезжайте ближе к вечеру. Низкое солнце скользит по валунам, проступает каждый шов, и видно, как
    тщательно строители подбирали камень к камню.
  tip: >-
    Ни билетов, ни сторожа, ни ограды здесь нет, а указателей мало: спросите в селе, где цихе (крепость),
    — и вам покажут дорогу. Блоки грубые, некоторые шатаются, так что любуйтесь стенами, а не лазайте
    по ним. Возьмите крепкую обувь, воду и шляпу: тени на плато почти нет. Руины стоят среди домов и пастбищ,
    поэтому закрывайте за собой калитки и не заходите во дворы. Кафе в селе нет — поесть можно в Аспиндзе
    или у Вардзии. Саро легко вписывается в один день с Хертвиси, Тмогви и Вардзией.
  route: >-
    Кратчайший путь (около 215 км, 4 часа) идёт через Джавахети: по Sh36 до Манглиси, по Sh31 через Цалку
    в сторону Ниноцминды, затем по S11 через Ахалкалаки и вниз по каньону Паравани до Хертвиси. От Хертвиси
    проезжайте около 3 км на север по S11 в сторону Аспиндзы и сворачивайте направо на узкую сельскую
    дорогу, которая около 4 км поднимается к Саро. Через Боржоми, Ахалцихе и Аспиндзу — около 255 км:
    от Аспиндзы по S11 на юг примерно 10 км и поворот налево. С ноября по апрель из-за снега и тумана
    на Цалкском плато надёжнее может оказаться путь через Боржоми. В сухую погоду машина эконом-класса
    справится; после дождя подъём проходите не спеша. Заправьтесь в Ахалкалаки или Аспиндзе.
fa:
  name: مگالیت‌های سارو
  short: >-
    دیوارهایی از تخته‌سنگ‌های غول‌آسا و بی‌ملات بر لبهٔ فلات جاواختی، بالای خرتویسی: دژی که شاید سه هزار
    سال عمر دارد.
  body: >-
    **سازندگان سارو نیازی به ملات نداشتند: تخته‌سنگ‌هایی برمی‌گزیدند چنان سنگین که وزن خودشان دیوار را
    سر پا نگه دارد.**


    سارو روستایی با خانه‌های سنگی است در ارتفاع حدود ۱۴۸۰ متری، بر پلهٔ پایینی فلات جاواختی و بالای تنگهٔ
    کورا (متکواری)، ۱۷ کیلومتر دورتر از آسپیندزا. گرداگرد آن بقایای مجموعه‌ای از استحکامات پراکنده است
    که پژوهشگران به‌طور کلی به هزارهٔ دوم یا یکم پیش از میلاد نسبت می‌دهند؛ تاریخ دقیقش روشن نیست. این
    مجموعه به شیوهٔ موسوم به «سیکلوپی» ساخته شده است: قطعه‌سنگ‌هایی به درازای تا ۲٫۵ متر، خشکه‌چین و تنگ
    در کنار هم نشانده شده‌اند و هیچ چیز دیگری آن‌ها را به هم نمی‌بندد.


    این‌جا هرگز یک بنای یکپارچه نبود. سه دژ جداگانه وجود داشت که هر کدام می‌توانست به‌تنهایی پایداری کند:
    قلعهٔ کوئِوبانی در انتهای غربی روستا، قلعهٔ بالا یا قلعهٔ کلیسا در کنار کلیسای فرشتهٔ مقرب، و قلعهٔ
    نو، برجی در شمال غربی آن. دیوارهایشان امروز ۲٫۵ تا ۳ متر بلندی دارند. این دژ در عمر درازش بیش از یک
    بار بازسازی شد، و کاوش‌ها در سکونتگاه کنار آن یافته‌هایی از عصر مفرغ متقدم و متأخر و نیز سفالینه‌های
    سده‌های میانه به دست داده است. مردم دست‌کم سه هزار سال، گاه ماندگار و گاه گذرا، بر این پشته زیسته‌اند.


    سارو یکی از سکونتگاه‌های مستحکم این فلات است؛ پژوهشگران گرجی آن را هم‌ردیف دژهای کهن آبولی و شائوری
    می‌دانند. اما برخلاف آبولی، با خودرویی معمولی می‌توان به آن رسید.


    عصر بیایید. آفتاب کم‌ارتفاع بر تخته‌سنگ‌ها مورب می‌تابد، تک‌تک درزها نمایان می‌شود و می‌بینید سازندگان
    با چه دقتی سنگ را با سنگ جفت کرده‌اند.
  tip: >-
    نه بلیتی هست، نه نگهبانی و نه نرده‌ای، و تابلو هم کم است: در روستا سراغ «تسیخه» (قلعه) را بگیرید تا
    کسی راه را نشانتان دهد. قطعه‌سنگ‌ها زمخت‌اند و برخی لق، پس دیوارها را تماشا کنید، نه این‌که از آن‌ها
    بالا بروید. کفش محکم، آب و کلاه بیاورید، چون فلات سایهٔ چندانی ندارد. ویرانه‌ها میان خانه‌ها و چراگاه‌ها
    قرار دارند؛ پس هر دری را که باز کردید پشت سرتان ببندید و وارد حیاط‌ها نشوید. روستا کافه ندارد: در
    آسپیندزا یا کنار واردزیا غذا بخورید. سارو به‌آسانی با خرتویسی، تموگوی و واردزیا در یک روز جا می‌گیرد.
  route: >-
    کوتاه‌ترین راه (حدود ۲۱۵ کیلومتر، ۴ ساعت) از جاواختی می‌گذرد: جادهٔ Sh36 تا مانگلیسی، Sh31 از راه
    تسالکا به سوی نینوتسمیندا، سپس S11 از آخالکالاکی و پایین در امتداد درهٔ پاراوانی تا خرتویسی. از خرتویسی
    حدود ۳ کیلومتر روی S11 به سمت شمال و آسپیندزا بروید و به راست، به جادهٔ باریک روستایی‌ای بپیچید که
    حدود ۴ کیلومتر تا سارو بالا می‌رود. از راه بورجومی، آخالتسیخه و آسپیندزا حدود ۲۵۵ کیلومتر است: از
    آسپیندزا حدود ۱۰ کیلومتر روی S11 به جنوب بروید و به چپ بپیچید. از نوامبر تا آوریل، برف و مِه غلیظ
    روی فلات تسالکا ممکن است راه بورجومی را گزینهٔ امن‌تری کند. در هوای خشک خودروی اقتصادی از پسش برمی‌آید؛
    پس از باران، سربالایی را آهسته طی کنید. در آخالکالاکی یا آسپیندزا سوخت بزنید.
he:
  name: המגליתים של סארו
  short: 'חומות של סלעי ענק ללא טיט בשולי רמת ג''ווחתי מעל חרטוויסי: מעוז שגילו אולי שלושת אלפים שנה.'
  body: >-
    **בוני סארו לא נזקקו לטיט: הם בחרו סלעים כבדים כל כך, שמשקלם שלהם החזיק את החומה.**


    סארו הוא כפר של בתי אבן בגובה של כ-1,480 מטרים, על המדרגה התחתונה של רמת ג'ווחתי מעל ערוץ המטקווארי
    (הכורה), 17 ק״מ מאספינדזה. סביבו פזורים שרידי מכלול ביצורים שחוקרים מתארכים באופן כללי לאלף השני או
    הראשון לפני הספירה; התאריך המדויק אינו ידוע. הוא בנוי בשיטה המכונה "קיקלופית": גושים שאורכם עד 2.5
    מטרים הונחו ללא טיט, הותאמו זה לזה – ודבר מלבד זאת אינו מחבר ביניהם.


    זה מעולם לא היה מבנה אחד. היו כאן שלושה מעוזים נפרדים, שכל אחד מהם יכול היה להחזיק מעמד בכוחות עצמו:
    מבצר קווובאני בקצה המערבי של הכפר, המבצר העליון, או מבצר הכנסייה, ליד כנסיית המלאך הראשי (הארכנגל),
    והמבצר החדש, מגדל מצפון-מערב לו. חומותיהם מתנשאות כיום לגובה 2.5 עד 3 מטרים. במהלך חייו הארוכים נבנה
    המבצר מחדש יותר מפעם אחת, ובחפירות ביישוב הסמוך לו נמצאו ממצאים מתקופת הברונזה הקדומה והמאוחרת וכן
    כלי חרס מימי הביניים. אנשים חיו על המדף הזה, לסירוגין, לפחות שלושת אלפים שנה.


    סארו הוא אחד מקבוצת יישובים מבוצרים ברמה; חוקרים גאורגים מציבים אותו לצד המעוזים העתיקים אבולי ושאורי.
    אבל בניגוד לאבולי, אפשר להגיע אליו במכונית רגילה.


    בואו אחר הצהריים המאוחרים. השמש הנמוכה מחליקה על פני הסלעים, כל מישק נחשף, ורואים עד כמה בקפידה התאימו
    הבונים אבן לאבן.
  tip: >-
    אין כרטיס, שומר או גדר, וגם שלטים כמעט אין: שאלו בכפר על ה"ציחה" (המבצר) ומישהו יכוון אתכם. הגושים
    מחוספסים וחלקם רופפים, לכן התפעלו מן החומות ואל תטפסו עליהן. הביאו נעליים יציבות, מים וכובע, כי ברמה
    אין כמעט צל. החורבות שוכנות בין בתים ומרעה, לכן סגרו אחריכם כל שער ואל תיכנסו לחצרות. בכפר אין בית
    קפה: אכלו באספינדזה או בוורדזיה. את סארו קל לשלב ביום אחד עם חרטוויסי, תמוגווי וורדזיה.
  route: >-
    הדרך הקצרה ביותר (כ-215 ק״מ, 4 שעות) חוצה את ג'ווחתי: כביש Sh36 עד מנגליסי, Sh31 דרך צלקה לכיוון נינוצמינדה,
    ואחר כך S11 דרך אחלקלקי ובמורד קניון פרוואני עד חרטוויסי. מחרטוויסי סעו כ-3 ק״מ צפונה בכביש S11 לכיוון
    אספינדזה ופנו ימינה לדרך כפרית צרה המטפסת כ-4 ק״מ עד סארו. דרך בורג'ומי, אחלציחה ואספינדזה המרחק כ-255
    ק״מ: מאספינדזה סעו בכביש S11 דרומה כ-10 ק״מ ופנו שמאלה. מחוץ לחודשים מאי–אוקטובר, שלג וערפל ברמת צלקה
    עשויים להפוך את הדרך דרך בורג'ומי לבחירה הבטוחה יותר. במזג אוויר יבש רכב אקונומי יסתדר; אחרי גשם עלו
    את העלייה לאט. תדלקו באחלקלקי או באספינדזה.
ar:
  name: ميغاليثات سارو
  short: 'أسوار من صخور ضخمة بلا ملاط على حافة هضبة جافاخيتي فوق خيرتفيسي: حصن ربما يبلغ عمره ثلاثة آلاف
    عام.'
  body: >-
    **لم يحتج بنّاؤو سارو إلى الملاط: كانوا يختارون صخوراً بلغت من الثقل حداً يكفي وزنها وحده لتثبيت الجدار.**


    سارو قرية بيوت حجرية على ارتفاع نحو 1480 متراً، على الدرجة الدنيا من هضبة جافاخيتي فوق مضيق نهر كورا
    (متكفاري)، وعلى بعد 17 كم من أسبيندزا. تحيط بها بقايا مجمّع محصّن يؤرّخه الباحثون على وجه التقريب
    بالألفية الثانية أو الأولى قبل الميلاد، أما التاريخ الدقيق فمجهول. وقد شُيّد بالطريقة المسماة «السيكلوبية»:
    كتل يصل طولها إلى 2.5 متر رُصفت جافةً وأُحكم تلاصقها، ولا شيء غير ذلك يربط بينها.


    لم يكن المكان يوماً بناءً واحداً. كانت هنا ثلاثة حصون منفصلة، يستطيع كل منها الصمود وحده: قلعة كفيوباني
    عند الطرف الغربي للقرية، والقلعة العليا أو قلعة الكنيسة بجوار كنيسة رئيس الملائكة، والقلعة الجديدة،
    وهي برج إلى الشمال الغربي منها. وترتفع أسوارها اليوم ما بين 2.5 و3 أمتار. وقد أُعيد بناء الحصن أكثر
    من مرة خلال عمره الطويل، وكشفت الحفريات في المستوطنة المجاورة عن لقى من العصرين البرونزيين المبكر
    والمتأخر، إلى جانب فخار من العصور الوسطى. لقد عاش الناس على هذه الحافة، بين انقطاع وعودة، ثلاثة آلاف
    عام على الأقل.


    تنتمي سارو إلى مجموعة من المستوطنات المحصّنة على الهضبة، ويضعها الباحثون الجورجيون إلى جانب حصني أبولي
    وشاوري القديمين. لكنها، على خلاف أبولي، في متناول السيارة العادية.


    تعالَ في أواخر العصر. تنساب أشعة الشمس المنخفضة على الصخور فيظهر كل مفصل، وترى بأي دقة طابق البنّاؤون
    الحجر بالحجر.
  tip: >-
    لا تذاكر ولا حارس ولا سياج، واللافتات قليلة: اسأل في القرية عن «التسيخه» (القلعة) وسيدلّك أحدهم على
    الطريق. الكتل خشنة وبعضها غير ثابت، فتأمّل الأسوار ولا تتسلقها. احمل حذاءً متيناً وماءً وقبعة، فالظل
    شحيح على الهضبة. تقع الأطلال بين البيوت والمراعي، فأغلق كل بوابة خلفك ولا تدخل الأفنية. لا مقهى في
    القرية: تناول طعامك في أسبيندزا أو عند فاردزيا. ويسهل الجمع بين سارو وخيرتفيسي وتموغفي وفاردزيا في
    يوم واحد.
  route: >-
    أقصر الطرق (نحو 215 كم، 4 ساعات) يعبر جافاخيتي: الطريق Sh36 إلى مانغليسي، ثم Sh31 عبر تسالكا باتجاه
    نينوتسميندا، ثم S11 عبر أخالكالاكي ونزولاً في وادي بارافاني حتى خيرتفيسي. من خيرتفيسي سِر نحو 3 كم
    شمالاً على S11 باتجاه أسبيندزا، ثم انعطف يميناً إلى طريق قروي ضيق يصعد نحو 4 كم حتى سارو. وعبر بورجومي
    وأخالتسيخي وأسبيندزا تبلغ المسافة نحو 255 كم: من أسبيندزا اتبع S11 جنوباً نحو 10 كم وانعطف يساراً.
    وخارج الفترة من مايو إلى أكتوبر، قد يجعل الثلج والضباب على هضبة تسالكا طريقَ بورجومي الخيارَ الأكثر
    أماناً. في الطقس الجاف تكفي سيارة اقتصادية؛ وبعد المطر اصعد المنحدر على مهل. املأ خزانك في أخالكالاكي
    أو أسبيندزا.
