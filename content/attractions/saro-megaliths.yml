ka:
  name: საროს მეგალითები
  short: >-
    ბრინჯაოს ხანის „ციკლოპური" ციხის ნანგრევები და ტერასები მტკვრის კანიონის თავზე, ასპინძასთან — ჯავახეთის
    ერთ-ერთი უძველესი ნაგებობა.
  body: >-
    **საროში ისეთ კედლებს ეხები, რომლებიც ეგვიპტის პირამიდების ტოლია ასაკით.** სოფლის ზემოთ, მტკვრის კანიონის
    კიდეზე, მეგალითური ციხის ნანგრევებია — ე.წ. „ციკლოპური" ნაგებობა, რომელიც ძვ.წ. II-I ათასწლეულით თარიღდება.
    ლოდები, ზოგი 2,5 მეტრამდე სიგრძის, მშრალი წყობითაა ერთმანეთზე დადებული, ყოველგვარი დუღაბის გარეშე
    — და სამი ათასი წელია დგას.


    კომპლექსი სამი ცალკე მდგომი თავდაცვითი ნაგებობისგან შედგებოდა; დღეს კედლების 2,5-3 მეტრი სიმაღლის
    ნაშთებია შემორჩენილი. აქვე აღმოჩენილია ადრეული და გვიანი ბრინჯაოს ხანის არტეფაქტები და შუა საუკუნეების
    კერამიკა — ადგილი ათასწლეულების განმავლობაში დაუსახლებელი არასდროს ყოფილა.


    რატომ ღირს ასვლა:


    - ციკლოპური კედლები — ჯავახეთის მეგალითური კულტურის ხელმისაწვდომი ნიმუში (აბულისგან განსხვავებით,
    ჯიპი არ გჭირდება)

    - მტკვრის კანიონის თავბრუდამხვევი ხედები ციხის კიდიდან

    - თავად სოფელი სარო — ქვის ძველი სახლებით და მდელოებით


    ტურისტი აქ ჯერ კიდევ იშვიათია: დიდი შანსია, ძეგლთან მარტო დარჩე. საუკეთესო შუქი საღამოსაა, როცა კანიონი
    ჩრდილებით ივსება.
  tip: >-
    შესვლა უფასოა, დაცვა და ინფრასტრუქტურა არ არის — ეს ველური ძეგლია. ნანგრევებამდე სოფლიდან ფეხით მოკლე
    გასეირნებაა; ადგილობრივს ჰკითხე მიმართულება, მაჩვენებლები მწირია. კანიონის კიდესთან ფრთხილად, მოაჯირები
    არსად არის. მზისგან დამცავი და წყალი წამოიღე — პლატოზე ჩრდილი თითქმის არაა. მაღაზია სოფელშია, სასაუზმე
    — ასპინძაში. ვარძიასთან ერთ დღეში კარგად ჯდება.
  route: >-
    თბილისიდან E60 მაგისტრალით ხაშურამდე, შემდეგ ბორჯომის ხეობით ახალციხისკენ (E691/S8) და ასპინძამდე
    — სულ დაახლოებით 230 კმ ასფალტი. ასპინძიდან საროსკენ მისასვლელი დაახლოებით 8 კმ-ია: გზა პლატოზე ადის,
    ძირითადად მოასფალტებულია, ბოლო მონაკვეთი სოფლის გზაა — მშრალ ამინდში ეკონომ-კლასიც ივლის, წვიმაში
    ფრთხილად. საწვავი ახალციხეში ან ასპინძაში აიღე, უფრო წინ ბენზინგასამართი აღარ შეგხვდება. სულ თბილისიდან
    დაახლოებით 4 საათი გამოდის.
en:
  name: Saro Megaliths
  short: >-
    Bronze Age "cyclopean" fortress ruins and terraces above the Mtkvari canyon near Aspindza — one of
    the oldest structures in Javakheti.
  body: >-
    **At Saro you touch walls roughly as old as the Egyptian pyramids.** Above the village, on the rim
    of the Mtkvari canyon, lie the ruins of a megalithic fortress — a so-called "cyclopean" structure
    dated to the 2nd-1st millennium BCE. Boulders up to 2.5 metres across are stacked in dry masonry,
    with no mortar of any kind — and they have stood for some three thousand years.


    The complex originally consisted of three separate defensive structures; today wall remnants 2.5-3
    metres high survive. Excavations have turned up early and late Bronze Age artefacts and medieval pottery
    — the site has hardly ever been uninhabited across the millennia.


    Why the climb is worth it:


    - The cyclopean walls — the most accessible showcase of Javakheti's megalithic culture (unlike Abuli,
    you do not need a 4x4)

    - Dizzying views over the Mtkvari canyon from the fortress edge

    - The village of Saro itself, all old stone houses and meadows


    Tourists are still rare here: chances are good you will have the monument to yourself. The best light
    comes in the evening, when the canyon fills with shadow.
  tip: >-
    Entry is free; there are no wardens and no infrastructure — this is a wild site. The ruins are a short
    walk from the village; ask a local for directions, as signage is minimal. Be careful along the canyon
    rim — there are no railings anywhere. Bring sun protection and water: the plateau has almost no shade.
    The village has a small shop; the nearest cafes are in Aspindza. It combines well with Vardzia in
    a single day.
  route: >-
    From Tbilisi take the E60 to Khashuri, then the Borjomi gorge road (E691/S8) towards Akhaltsikhe and
    on to Aspindza — about 230 km of asphalt in total. From Aspindza the side road to Saro is roughly
    8 km: it climbs onto the plateau, mostly surfaced, with a final village-road stretch — an economy
    car manages in dry weather; take care after rain. Refuel in Akhaltsikhe or Aspindza, as there are
    no stations beyond. Count on about 4 hours from Tbilisi in total.
ru:
  name: Мегалиты Саро
  short: >-
    Руины «циклопической» крепости бронзового века и террасы над каньоном Куры у Аспиндзы — одно из древнейших
    сооружений Джавахети.
  body: >-
    **В Саро вы прикасаетесь к стенам, ровесницам египетских пирамид.** Над селом, на кромке каньона Куры,
    лежат руины мегалитической крепости — так называемой «циклопической» постройки, датируемой II-I тысячелетиями
    до н.э. Валуны, иные до 2,5 метра в поперечнике, уложены сухой кладкой, без какого-либо раствора —
    и стоят так уже около трёх тысяч лет.


    Комплекс изначально состоял из трёх отдельно стоящих оборонительных сооружений; сегодня сохранились
    остатки стен высотой 2,5-3 метра. Раскопки дали артефакты ранней и поздней бронзы и средневековую
    керамику — за тысячелетия это место почти никогда не пустовало.


    Ради чего подниматься:


    - Циклопические стены — самый доступный образец мегалитической культуры Джавахети (в отличие от Абули,
    внедорожник не нужен)

    - Головокружительные виды на каньон Куры с кромки крепости

    - Само село Саро — старые каменные дома и луга


    Туристы здесь пока редкость: велик шанс остаться с памятником наедине. Лучший свет — вечером, когда
    каньон заполняется тенями.
  tip: >-
    Вход свободный; смотрителей и инфраструктуры нет — это дикий памятник. От села до руин короткая прогулка
    пешком; спросите дорогу у местных, указателей почти нет. У кромки каньона осторожно — перил нигде
    нет. Возьмите защиту от солнца и воду: на плато почти нет тени. В селе есть маленький магазин, ближайшие
    кафе — в Аспиндзе. Хорошо сочетается с Вардзией в один день.
  route: >-
    Из Тбилиси — по E60 до Хашури, дальше по Боржомскому ущелью (E691/S8) в сторону Ахалцихе и до Аспиндзы
    — всего около 230 км асфальта. От Аспиндзы боковая дорога на Саро — примерно 8 км: она поднимается
    на плато, в основном с покрытием, финальный отрезок — сельская дорога; в сухую погоду проходима на
    эконом-классе, после дождя аккуратнее. Заправьтесь в Ахалцихе или Аспиндзе — дальше заправок нет.
    Всего от Тбилиси выходит около 4 часов.
fa:
  name: مگالیت‌های سارو
  short: ویرانه‌های دژ «سیکلوپی» عصر مفرغ و تراس‌ها بر فراز درهٔ متکواری نزدیک آسپیندزا — از کهن‌ترین
    سازه‌های جاواختی.
  body: >-
    **در سارو به دیوارهایی دست می‌زنید که تقریباً هم‌سن اهرام مصرند.** بالای روستا، بر لبهٔ درهٔ عمیق
    متکواری، ویرانه‌های دژی مگالیتی قرار دارد — سازه‌ای «سیکلوپی» که به هزارهٔ دوم تا اول پیش از میلاد
    تاریخ‌گذاری می‌شود. تخته‌سنگ‌هایی گاه تا 2/5 متر، با چیدمان خشکه و بی‌هیچ ملاتی روی هم نشسته‌اند —
    و حدود سه هزار سال است که برپا هستند.


    مجموعه در اصل از سه سازهٔ دفاعی جداگانه تشکیل می‌شد؛ امروز بقایای دیوارهایی به بلندی 2/5 تا 3 متر
    مانده است. کاوش‌ها یافته‌های عصر مفرغ آغازین و پایانی و سفال قرون‌وسطایی به دست داده‌اند — این مکان
    در طول هزاره‌ها تقریباً هیچ‌گاه خالی از سکنه نبوده است.


    چرا بالا رفتن می‌ارزد:


    - دیوارهای سیکلوپی — دسترس‌پذیرترین نمونهٔ فرهنگ مگالیتی جاواختی (برخلاف آبولی، به خودروی شاسی‌بلند
    نیاز ندارید)

    - چشم‌اندازهای سرگیجه‌آور درهٔ متکواری از لبهٔ دژ

    - خود روستای سارو با خانه‌های سنگی کهن و علفزارها


    گردشگر اینجا هنوز کمیاب است: به احتمال زیاد با بنا تنها خواهید بود. بهترین نور غروب است، وقتی دره
    از سایه پر می‌شود.
  tip: >-
    ورود رایگان است؛ نه نگهبانی هست و نه زیرساختی — این یک اثر بکر است. ویرانه‌ها از روستا پیاده‌روی کوتاهی
    فاصله دارند؛ مسیر را از اهالی بپرسید، تابلو بسیار کم است. لب دره احتیاط کنید — هیچ‌جا نرده نیست. ضدآفتاب
    و آب همراه ببرید: فلات تقریباً سایه ندارد. در روستا مغازهٔ کوچکی هست و نزدیک‌ترین کافه‌ها در آسپیندزاست.
    با واردزیا در یک روز خوب جمع می‌شود.
  route: >-
    از تفلیس با E60 تا خاشوری، سپس از درهٔ بورجومی (E691/S8) به سمت آخالتسیخه و تا آسپیندزا — روی‌هم‌رفته
    حدود 230 کیلومتر آسفالت. از آسپیندزا جادهٔ فرعی سارو حدود 8 کیلومتر است: به فلات بالا می‌رود، بیشترش
    روکش‌دار است و تکهٔ پایانی راه روستایی — در هوای خشک خودروی اقتصادی هم می‌رود، بعد از باران محتاط
    باشید. بنزین را در آخالتسیخه یا آسپیندزا بزنید؛ جلوتر پمپ‌بنزینی نیست. از تفلیس روی‌هم حدود 4 ساعت
    راه است.
he:
  name: המגליתים של סארו
  short: חורבות מבצר "קיקלופי" מתקופת הברונזה וטרסות מעל קניון המטקווארי ליד אספינדזה — מהמבנים העתיקים
    ביותר בג'ווחתי.
  body: >-
    **בסארו נוגעים בחומות שגילן כגיל הפירמידות של מצרים.** מעל הכפר, על שפת קניון המטקווארי (הקורה), שוכנות
    חורבות מבצר מגליתי — מבנה "קיקלופי" המתוארך לאלף השני-הראשון לפני הספירה. סלעים, חלקם באורך של עד
    2.5 מטר, מונחים זה על זה בבנייה יבשה, בלי שום טיט — וכך הם עומדים כשלושת אלפים שנה.


    המכלול כלל במקור שלושה מבנים ביצוריים נפרדים; היום שרדו קטעי חומה בגובה 2.5-3 מטרים. בחפירות נמצאו
    ממצאים מתקופות הברונזה הקדומה והמאוחרת וחרסים מימי הביניים — לאורך אלפי שנים המקום כמעט שלא עמד ריק.


    בשביל מה שווה לטפס:


    - החומות הקיקלופיות — הדוגמה הנגישה ביותר לתרבות המגליתית של ג'ווחתי (בניגוד לאבולי, לא צריך רכב שטח)

    - נופים מסחררים של קניון המטקווארי משפת המבצר

    - הכפר סארו עצמו — בתי אבן ישנים ואחו


    תיירים כאן עדיין נדירים: יש סיכוי טוב שתישארו לבד עם האתר. האור הטוב ביותר בערב, כשהקניון מתמלא צללים.
  tip: >-
    הכניסה חופשית; אין שומרים ואין תשתיות — זהו אתר פראי. מהכפר אל החורבות הליכה קצרה; שאלו מקומי לכיוון,
    השילוט דל. היזהרו לאורך שפת הקניון — אין מעקות בשום מקום. קחו הגנה מהשמש ומים: על הרמה כמעט אין צל.
    בכפר חנות קטנה; בתי הקפה הקרובים באספינדזה. משתלב היטב עם ורדזיה ביום אחד.
  route: >-
    מטביליסי נוסעים ב-E60 עד חשורי, ואז בכביש ערוץ בורג'ומי (E691/S8) לכיוון אחלציחה והלאה לאספינדזה —
    בסך הכול כ-230 ק"מ אספלט. מאספינדזה הדרך הצדדית לסארו היא כ-8 ק"מ: היא מטפסת אל הרמה, סלולה ברובה,
    עם קטע סיום של דרך כפרית — רכב חסכוני מסתדר במזג אוויר יבש; אחרי גשם היזהרו. תדלקו באחלציחה או באספינדזה
    — הלאה אין תחנות. מטביליסי צאו מנקודת הנחה של כ-4 שעות.
ar:
  name: ميغاليثات سارو
  short: أطلال قلعة «سيكلوبية» من العصر البرونزي ومدرجات فوق وادي متكفاري قرب أسبيندزا — من أقدم المنشآت
    في جافاخيتي.
  body: >-
    **في سارو تلمس جدراناً تعادل أهرامات مصر عمراً.** فوق القرية، على حافة وادي متكفاري (الكورا) العميق،
    تقوم أطلال قلعة ميغاليثية — منشأة «سيكلوبية» تؤرخ بالألفيتين الثانية والأولى قبل الميلاد. صخور يبلغ
    بعضها 2.5 متر طولاً مرصوصة بعضها فوق بعض بالبناء الجاف، من غير ملاط البتة — وما زالت قائمة منذ نحو
    ثلاثة آلاف سنة.


    كان المجمع في الأصل ثلاث منشآت دفاعية منفصلة؛ واليوم بقيت من الجدران أجزاء بارتفاع 2.5-3 أمتار. وقد
    كشفت الحفريات عن لقى من العصر البرونزي المبكر والمتأخر وخزف من القرون الوسطى — فالمكان لم يكد يخلو
    من السكان عبر آلاف السنين.


    لماذا يستحق الصعود:


    - الجدران السيكلوبية — أيسر نماذج ثقافة جافاخيتي الميغاليثية وصولاً (بخلاف أبولي، لا تحتاج سيارة دفع
    رباعي)

    - إطلالات مذهلة على وادي متكفاري من حافة القلعة

    - قرية سارو نفسها ببيوتها الحجرية القديمة ومروجها


    ما زال السياح هنا قلة: فالأرجح أن تخلو بالأثر وحدك. أجمل ضوء في المساء حين يمتلئ الوادي بالظلال.
  tip: >-
    الدخول مجاني؛ لا حراس ولا مرافق — هذا موقع بكر. الأطلال على مسافة مشي قصيرة من القرية؛ اسأل أحد الأهالي
    عن الاتجاه فاللافتات شحيحة. احذر على حافة الوادي — لا سياج في أي مكان. خذ واقياً من الشمس وماءً: الهضبة
    تكاد تخلو من الظل. في القرية دكان صغير، وأقرب المقاهي في أسبيندزا. يجتمع جيداً مع فاردزيا في يوم واحد.
  route: >-
    من تبليسي عبر E60 حتى خاشوري، ثم بطريق وادي بورجومي (E691/S8) نحو أخالتسيخه فأسبيندزا — نحو 230 كم
    من الأسفلت إجمالاً. من أسبيندزا يمتد الطريق الجانبي إلى سارو نحو 8 كم: يصعد إلى الهضبة، معبّد في معظمه
    مع مقطع أخير من طريق قروي — سيارة اقتصادية تجتازه في الطقس الجاف، وتوخَّ الحذر بعد المطر. تزود بالوقود
    في أخالتسيخه أو أسبيندزا فلا محطات بعدهما. احسب من تبليسي نحو 4 ساعات إجمالاً.
