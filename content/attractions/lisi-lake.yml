ka:
  name: ლისის ტბა
  short: 'მომლაშო ტბა საბურთალოს თავზე, პლატოზე: ირგვლივ სარბენი ბილიკი, ჰორიზონტზე კავკასიონი, ზურგს
    უკან დედაქალაქი.'
  body: >-
    **სანამ 1950-იან წლებში თბილისის ზღვას აავსებდნენ, ქალაქის შემოგარენში ყველაზე დიდი წყალსატევი ლისი
    იყო და მას ზოგჯერ „თბილისის ზღვასაც“ ეძახდნენ.** დღეს მისი პრეტენზია უფრო მოკრძალებულია: 47 ჰექტარი
    თავთხელი, ოდნავ მლაშე წყალი, ყველაზე ღრმა ადგილას ოთხი მეტრი. ტბა ქალაქის ჩრდილო-დასავლეთით, პლატოზე,
    ზღვის დონიდან 624 მეტრზე წევს, ძველ თბილისზე ორასიოდე მეტრით მაღლა.


    XX საუკუნის 30-იან წლებამდე მის წყალს ახლომახლო სოფლები მხოლოდ ნათესების მოსარწყავად იყენებდნენ, ფერდობებზე
    კი საქონელს აძოვებდნენ. 1936 წელს ტბაზე პირველი ნავები გამოჩნდა, 1937 წლიდან კი ნაპირზე 1400-მდე ხე
    და ბუჩქი დარგეს, და უწყლო ქვაბული ქალაქის სასეირნოდ იქცა. ახალი თავი 2007 წელს დაიწყო, როცა ტბის მიმდებარე
    მიწები ბანკირ მამუკა ხაზარაძის ჯგუფმა შეიძინა. 2011 წელს ახალი საცხოვრებელი უბნის პირველი ეტაპი გაიხსნა,
    შემდეგ კი ტბას სარბენი და საველოსიპედო ბილიკები, სპორტული მოედნები და პლაჟი შემოემატა. 2016 წელს მერიამ
    ტბის გარშემო განათებული საფეხმავლო ბილიკი მოაწყო, ყოველ 500 მეტრში მანძილის აღმნიშვნელი ბოძით.


    მთავარი მაინც ბილიკია. თითქმის სამკილომეტრიანი წრე განთიადსა და დაისზე მორბენლებით, ველოსიპედისტებით,
    ბავშვის ეტლებითა და ძაღლებით ივსება. ნაპირთან წყლის ფრინველები ფუსფუსებენ, ზაფხულში კუები გახურებულ
    ქვებზე ამოცოცდებიან, უკან, მშრალ ბორცვებზე, მელია და კურდღელი ბინადრობს, და, როგორც ადგილობრივები
    გაგაფრთხილებენ, გველიც ბევრია.


    ტბა წვიმის, თოვლისა და მიწისქვეშა წყლით საზრდოობს: გაზაფხულზე ყველაზე სავსეა, მთელი ზაფხული კი იკლებს,
    ასე რომ, შემოდგომისთვის წყალს გამხმარი ლამის მკრთალი ზოლი არტყია. სწორედ მაშინ იწმინდება ჰაერიც. ცივ,
    მზიან დღეს ჩრდილოეთის ჰორიზონტზე შეიძლება კავკასიონის თეთრი კედელი აიმართოს, ზურგს უკან კი თბილისი
    თავის ქვაბულშია გადაშლილი: ერთ მხარეს მთები, მეორეზე დედაქალაქი, შუაში კი ტბა.
  tip: >-
    სრული წრისა და ერთი ფინჯანი ყავისთვის ორი საათი გამოყავით. ბილიკი სწორი და მყარია, ბავშვის ეტლითაც
    და სავარძელ-ეტლითაც ადვილად გაივლით. ჩრდილი თითქმის არ არის, ივლისის შუადღით კი სიცხე 37 გრადუსს აღწევს,
    ამიტომ ზაფხულში ათ საათამდე ან ექვსის შემდეგ მოდით და წყალი თან იქონიეთ. ქარი ქალაქზე ძლიერია და ზამთარში
    ძვალსა და რბილში ატანს; ამ დროს ნაპირთან ყინულიც ხშირად ჩნდება. პლაჟი მზის აბაზანისთვისაა, წყალი კი
    თავთხელი, მომლაშო და წყალმცენარეებით სავსეა. ბორცვებზე ნაკვალევ ბილიკს ნუ გადაუხვევთ: მაღალ ბალახში
    გველი ხშირია. ტუალეტი კაფეებშია. შაბათ-კვირას შუადღიდან ხალხმრავლობაა.
  route: >-
    ცენტრიდან ვაჟა-ფშაველას გამზირით ჩრდილო-დასავლეთისკენ, საბურთალოს გავლით, გამზირის ზედა ბოლომდე იარეთ
    და იქიდან პლატოზე ამავალ გზას გაჰყევით; ალტერნატიული გზა ნუცუბიძის პლატოზე გადის. სულ დაახლოებით 12
    კილომეტრია, პიკის საათებს გარეთ ოციდან ოცდახუთ წუთამდე. ასფალტი ბოლომდეა; ბოლო კილომეტრები მოსახვევებით
    ადის, მაგრამ სირთულეს არ ქმნის. მთავარი უფასო სადგომი სამხრეთ შესასვლელთანაა: დილით ცარიელია, შაბათ-კვირას
    შუადღისთვის სავსე; მეორე, უფრო პატარა, აღმოსავლეთ მხარესაა. საწვავი ქვემოთ, ვაჟა-ფშაველაზე ჩაასხით,
    პლატოზე ბენზინგასამართი სადგური არ არის. ეკონომკლასის მანქანა სავსებით საკმარისია.
en:
  name: Lisi Lake
  short: >-
    A brackish lake on the plateau behind Saburtalo, ringed by a running path: the Caucasus on the horizon,
    the capital at your back.
  body: >-
    **Before the Tbilisi Sea reservoir was flooded in the 1950s, Lisi was the largest body of water around
    the city, and people sometimes called it the Tbilisi Sea.** Today it makes a humbler claim: 47 hectares
    of shallow, slightly salty water, four metres at the deepest point, lying at 624 metres on a plateau
    north-west of the centre, some two hundred metres above the Old Town.


    Until the 1930s the villages nearby used it only to water their fields, and grazed their animals on
    the slopes. Boats appeared in 1936; from 1937 some 1,400 trees and shrubs were planted round the shore,
    and an arid basin became a place where the city came to walk. The newest chapter began in 2007, when
    a group led by the banker Mamuka Khazaradze acquired the land around the lake. The first phase of
    the Green Lisi Town development opened in 2011, and running and cycling paths, sports grounds and
    a beach followed. In 2016 the city laid a lit footpath around the lake, with a distance post every
    500 metres.


    The path is the point. Close to three kilometres round, it fills at dawn and dusk with runners, cyclists,
    pushchairs and dogs. Water birds work the shallows, in summer turtles haul themselves onto the warm
    stones, and the dry hills behind are fox and hare country, and, as locals will warn you, snake country
    too.


    Fed by rain, snow and springs, the lake is highest in spring and sinks through the summer, so by autumn
    a pale margin of dried mud rings the water. That is also when the air clears. On a cold, bright day
    the white wall of the Greater Caucasus can rise along the northern horizon while Tbilisi sprawls in
    its bowl behind you: mountains on one side, a capital on the other, and a lake in between.
  tip: >-
    Allow two hours for a full circuit and a coffee. The path is flat and firm, fine for pushchairs and
    wheelchairs. There is almost no shade, and July afternoons can touch 37°C, so in summer come before
    ten or after six and carry water. The wind is stronger than in town and bites in winter, when ice
    often forms along the edges. The beach is for sunbathing; the water itself is shallow, brackish and
    weedy. On the hills keep to trodden paths, because snakes are common in the long grass. Toilets are
    in the cafés. Weekends are busy from late morning.
  route: >-
    From the centre take Vazha-Pshavela Avenue north-west through Saburtalo to its upper end, then follow
    the road that climbs onto the plateau; the Nutsubidze plateau road is the alternative approach. It
    is about 12 km, twenty to twenty-five minutes outside rush hour. Asphalt all the way; the last kilometres
    wind uphill but pose no difficulty. The main free car park is at the southern entrance: empty in the
    morning, full by midday at weekends, with a smaller one on the eastern side. Fill up down on Vazha-Pshavela,
    as there is no fuel station on the plateau. An economy car is plenty.
ru:
  name: Озеро Лиси
  short: 'Солоноватое озеро на плато за Сабуртало с беговой дорожкой по берегу: на горизонте Кавказ, за
    спиной столица.'
  body: >-
    **Пока в 1950-х годах не заполнили Тбилисское море, Лиси было самым большим водоёмом в окрестностях
    города, и его порой так и называли — Тбилисским морем.** Сегодня его притязания скромнее: 47 гектаров
    мелкой, слегка солёной воды глубиной не более четырёх метров, на высоте 624 метра, на плато к северо-западу
    от центра, метров на двести выше Старого города.


    До 1930-х годов окрестные сёла использовали озеро только для полива, а на склонах пасли скот. В 1936
    году появились лодки; с 1937 года по берегам высадили около 1400 деревьев и кустарников, и засушливая
    котловина превратилась в место, куда город приходил гулять. Новейшая глава началась в 2007 году, когда
    группа во главе с банкиром Мамукой Хазарадзе приобрела земли вокруг озера. Первая очередь застройки
    «Грин Лиси Таун» открылась в 2011 году, а за ней появились беговые и велосипедные дорожки, спортивные
    площадки и пляж. В 2016 году город проложил вокруг озера освещённую пешеходную дорожку со столбиками-указателями
    через каждые 500 метров.


    Главное здесь — дорожка. Почти три километра по кругу, и на рассвете и в сумерках она заполняется
    бегунами, велосипедистами, колясками и собаками. На мелководье хлопочут водоплавающие птицы, летом
    на тёплые камни выбираются черепахи, а сухие холмы позади — царство лис и зайцев и, как предупредят
    местные, змей тоже.


    Озеро питается дождями, снегом и подземными водами: выше всего оно стоит весной, а за лето мелеет,
    так что к осени воду окаймляет светлая полоса высохшего ила. Тогда же проясняется воздух. В холодный
    ясный день по северному горизонту может встать белая стена Большого Кавказа, а за спиной раскинется
    в своей чаше Тбилиси: с одной стороны горы, с другой — столица, а между ними озеро.
  tip: >-
    Заложите два часа на полный круг и кофе. Дорожка ровная и плотная, подходит для колясок и инвалидных
    кресел. Тени почти нет, а в июле днём бывает до 37°C, поэтому летом приходите до десяти или после
    шести и берите воду. Ветер здесь сильнее, чем в городе, а зимой пронизывает, и у берегов часто встаёт
    лёд. Пляж — для загара: вода мелкая, солоноватая и заросшая водорослями. На холмах держитесь нахоженных
    троп, потому что в высокой траве много змей. Туалеты — в кафе. По выходным людно с позднего утра.
  route: >-
    Из центра поезжайте по проспекту Важа-Пшавела на северо-запад через Сабуртало до его верхнего конца,
    затем по дороге, поднимающейся на плато; другой вариант подъезда — дорога через плато Нуцубидзе. Около
    12 км, двадцать–двадцать пять минут вне часа пик. Асфальт на всём пути; последние километры петляют
    в гору, но трудностей не представляют. Главная бесплатная парковка — у южного входа: утром пустая,
    в выходные к полудню заполнена; есть и парковка поменьше с восточной стороны. Заправьтесь внизу, на
    Важа-Пшавела: на плато заправок нет. Машины эконом-класса вполне достаточно.
fa:
  name: دریاچهٔ لیسی
  short: 'دریاچه‌ای لب‌شور بر فلاتی پشت سابورتالو، با مسیر دویدنی گرداگردش: قفقاز در افق، و پایتخت پشت
    سرتان.'
  body: >-
    **پیش از آنکه در دههٔ ۱۹۵۰ مخزن «دریای تفلیس» آبگیری شود، لیسی بزرگ‌ترین پهنهٔ آبی پیرامون شهر بود
    و گاه آن را «دریای تفلیس» می‌خواندند.** امروز ادعایش فروتنانه‌تر است: ۴۷ هکتار آب کم‌ژرفا و اندکی
    شور، که در ژرف‌ترین نقطه چهار متر است، در ارتفاع ۶۲۴ متری بر فلاتی در شمال‌غربی مرکز شهر، حدود دویست
    متر بالاتر از شهر قدیم.


    تا دههٔ ۱۹۳۰، روستاهای نزدیک از آن تنها برای آبیاری کشتزارهایشان بهره می‌بردند و دام‌هایشان را بر
    دامنه‌ها می‌چراندند. قایق‌ها در ۱۹۳۶ پیدا شدند؛ از ۱۹۳۷ حدود ۱۴۰۰ درخت و درختچه گرداگرد کرانه کاشتند
    و حوضه‌ای خشک به جایی بدل شد که شهر برای گردش به آن می‌آمد. تازه‌ترین فصل در ۲۰۰۷ آغاز شد، هنگامی
    که گروهی به سرکردگی مامُوکا خازارادزه، بانکدار، زمین‌های پیرامون دریاچه را خرید. نخستین فاز شهرک مسکونی
    «گرین لیسی تاون» در ۲۰۱۱ گشوده شد و پس از آن مسیرهای دویدن و دوچرخه‌سواری، زمین‌های ورزشی و یک پلاژ
    ساخته شدند. در ۲۰۱۶ شهرداری گرداگرد دریاچه مسیری پیاده با چراغ‌های روشنایی ساخت که هر ۵۰۰ متر تیرکی
    نشان‌دهندهٔ مسافت دارد.


    اصلِ ماجرا همین مسیر است. نزدیک به سه کیلومتر دور دریاچه، که سپیده‌دم و شامگاه از دوندگان، دوچرخه‌سواران،
    کالسکه‌های بچه و سگ‌ها پر می‌شود. پرندگان آبزی در آب‌های کم‌عمق در جست‌وجوی خوراک‌اند، در تابستان
    لاک‌پشت‌ها خود را روی سنگ‌های گرم بالا می‌کشند، و تپه‌های خشک پشت سر قلمرو روباه و خرگوش‌اند، و به
    هشدار اهالی، قلمرو مار هم.


    دریاچه از باران، برف و آب‌های زیرزمینی تغذیه می‌شود: در بهار پرآب‌ترین است و در طول تابستان پایین
    می‌رود، چنان‌که تا پاییز حاشیه‌ای روشن از گِل خشکیده آب را در بر می‌گیرد. همان هنگام است که هوا صاف
    می‌شود. در روزی سرد و روشن، دیوار سفید قفقاز بزرگ ممکن است در امتداد افق شمالی قد برافرازد و تفلیس
    پشت سرتان در کاسهٔ خود گسترده باشد: کوه‌ها در یک سو، پایتختی در سوی دیگر، و دریاچه‌ای در میانه.
  tip: >-
    برای یک دور کامل و یک قهوه دو ساعت وقت بگذارید. مسیر هموار و سفت است و برای کالسکه و ویلچر مناسب.
    تقریباً هیچ سایه‌ای نیست و بعدازظهرهای ژوئیه دما به ۳۷°C هم می‌رسد، پس در تابستان پیش از ساعت ده یا
    پس از شش بیایید و آب همراه داشته باشید. باد از شهر تندتر است و در زمستان گزنده، و آن هنگام اغلب کناره‌ها
    یخ می‌بندد. پلاژ برای آفتاب گرفتن است؛ خودِ آب کم‌عمق، لب‌شور و پر از جلبک است. روی تپه‌ها از راه‌های
    کوبیده بیرون نروید، چون در علف‌های بلند مار فراوان است. سرویس بهداشتی در کافه‌هاست. آخر هفته‌ها از
    اواخر صبح شلوغ است.
  route: >-
    از مرکز شهر خیابان واژا-پشاولا را به سمت شمال‌غربی از میان سابورتالو تا انتهای بالایی‌اش بپیمایید،
    سپس جاده‌ای را که به فلات بالا می‌رود دنبال کنید؛ جادهٔ فلات نوتسوبیدزه راه دیگر رسیدن است. حدود ۱۲
    کیلومتر، بیست تا بیست‌وپنج دقیقه بیرون از ساعت شلوغی. تمام راه آسفالت است؛ کیلومترهای آخر پیچان سربالا
    می‌روند اما دشواری ندارند. پارکینگ اصلی رایگان کنار ورودی جنوبی است: صبح‌ها خالی، و آخر هفته‌ها تا
    ظهر پر؛ پارکینگ کوچک‌تری هم در سمت شرقی هست. پایین، در واژا-پشاولا، سوخت بگیرید، چون بر فلات پمپ‌بنزینی
    نیست. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: אגם ליסי
  short: 'אגם מליח-למחצה על הרמה שמאחורי סבורטאלו, ומסביבו שביל ריצה: הקווקז באופק, והבירה מאחורי גבכם.'
  body: >-
    **לפני שמאגר «ים טביליסי» התמלא במים בשנות ה-50, ליסי היה גוף המים הגדול ביותר בסביבת העיר, ולעיתים
    אף כינו אותו «ים טביליסי».** כיום יומרותיו צנועות יותר: 47 הקטאר של מים רדודים ומלוחים מעט, שעומקם
    המרבי ארבעה מטרים, בגובה 624 מטר, על רמה מצפון-מערב למרכז, כמאתיים מטר מעל העיר העתיקה.


    עד שנות ה-30 השתמשו בו הכפרים הסמוכים רק להשקיית שדותיהם, ורעו את עדריהם על המדרונות. סירות הופיעו
    ב-1936; החל מ-1937 ניטעו סביב החוף כ-1,400 עצים ושיחים, ואגן צחיח הפך למקום שהעיר באה אליו לטייל.
    הפרק החדש ביותר החל ב-2007, כשקבוצה בראשות הבנקאי ממוקה חזרדזה רכשה את הקרקעות סביב האגם. השלב הראשון
    של פרויקט "גרין ליסי טאון" נפתח ב-2011, ואחריו באו שבילי ריצה ואופניים, מגרשי ספורט וחוף. ב-2016 סללה
    העירייה סביב האגם שביל הליכה מואר, ובו עמוד סימון מרחק כל 500 מטר.


    השביל הוא העיקר. קרוב לשלושה קילומטרים סביב האגם, ובשחר ובדמדומים הוא מתמלא ברצים, ברוכבי אופניים,
    בעגלות תינוק ובכלבים. עופות מים מחפשים מזון במים הרדודים, בקיץ צבים מטפסים אל האבנים החמות, והגבעות
    היבשות שמאחור הן ארץ של שועלים וארנבות – וכפי שהמקומיים יזהירו אתכם, גם של נחשים.


    האגם ניזון ממי גשמים, משלג וממי תהום: באביב מפלסו הגבוה ביותר, ובמשך הקיץ הוא יורד, כך שעד הסתיו פס
    בהיר של בוץ מיובש מקיף את המים. זה גם הזמן שבו האוויר מתבהר. ביום קר ובהיר עשוי הקיר הלבן של הקווקז
    הגדול להתרומם לאורך האופק הצפוני, בעוד טביליסי משתרעת בקערה שלה מאחוריכם: הרים מצד אחד, בירה מן הצד
    האחר, ואגם ביניהם.
  tip: >-
    הקדישו שעתיים להקפה מלאה ולקפה. השביל שטוח ויציב, מתאים לעגלות ולכיסאות גלגלים. כמעט אין צל, ובאחר
    הצהריים של יולי הטמפרטורה מגיעה ל-37°C, לכן בקיץ בואו לפני עשר או אחרי שש והביאו מים. הרוח חזקה יותר
    מאשר בעיר ובחורף היא חודרת לעצמות, ולאורך השוליים נוצר לא פעם קרח. החוף מיועד להשתזפות; המים עצמם
    רדודים, מליחים ומלאי צמחייה. על הגבעות הישארו על שבילים כבושים, כי בעשב הגבוה יש נחשים רבים. שירותים
    יש בבתי הקפה. בסופי שבוע עמוס מן הבוקר המאוחר.
  route: >-
    מן המרכז סעו בשדרת וז'ה-פשאוולה צפונה-מערבה דרך סבורטאלו עד הקצה העליון שלה, ומשם בדרך שמטפסת אל הרמה;
    הדרך דרך רמת נוצובידזה היא גישה חלופית. כ-12 ק"מ, עשרים עד עשרים וחמש דקות מחוץ לשעות העומס. כל הדרך
    סלולה; הקילומטרים האחרונים מתפתלים במעלה אך אינם קשים. החניון החינמי הראשי נמצא בכניסה הדרומית: ריק
    בבוקר, מלא עד הצהריים בסופי שבוע, ויש חניון קטן יותר בצד המזרחי. תדלקו למטה, בוז'ה-פשאוולה, כי על
    הרמה אין תחנת דלק. רכב אקונומי מספיק בהחלט.
ar:
  name: بحيرة ليسي
  short: 'بحيرة قليلة الملوحة على الهضبة خلف سابورتالو، يطوّقها مسار للجري: القوقاز في الأفق، والعاصمة
    خلف ظهوركم.'
  body: >-
    **قبل أن يُملأ خزان «بحر تبليسي» بالماء في خمسينيات القرن العشرين، كانت ليسي أكبر مسطّح مائي حول المدينة،
    وكان الناس يسمّونها أحياناً «بحر تبليسي».** أما اليوم فادّعاؤها أكثر تواضعاً: 47 هكتاراً من الماء
    الضحل المالح قليلاً، لا يتجاوز عمقه أربعة أمتار، على هضبة شمال غربي المركز، على ارتفاع 624 متراً،
    أعلى من المدينة القديمة بنحو مئتي متر.


    حتى ثلاثينيات القرن العشرين لم تستعملها القرى المجاورة إلا لسقي حقولها، وكانت ترعى مواشيها على المنحدرات.
    ظهرت القوارب عام 1936، ومنذ عام 1937 غُرست نحو 1400 شجرة وشجيرة حول الشاطئ، فتحوّل حوض قاحل إلى مكان
    تقصده المدينة للتنزّه. وبدأ الفصل الأحدث عام 2007، حين اشترت مجموعة يقودها المصرفي ماموكا خازارادزه
    الأراضي المحيطة بالبحيرة. افتُتحت المرحلة الأولى من مشروع «غرين ليسي تاون» عام 2011، ثم جاءت مسارات
    الجري والدراجات والملاعب الرياضية وشاطئ للاستلقاء. وفي عام 2016 أنشأت البلدية حول البحيرة ممشى مضاءً،
    تُنصب على امتداده علامة للمسافة كل 500 متر.


    المسار هو جوهر المكان. نحو ثلاثة كيلومترات حول البحيرة، يمتلئ عند الفجر والغسق بالعدّائين وراكبي الدراجات
    وعربات الأطفال والكلاب. تنقّب الطيور المائية في المياه الضحلة، وفي الصيف تتسلّق السلاحف الحجارة الدافئة،
    والتلال الجافة خلفها موطن للثعالب والأرانب البرية، وكما سيحذّركم السكان، موطن للأفاعي أيضاً.


    تتغذّى البحيرة من الأمطار والثلوج والمياه الجوفية، فيبلغ منسوبها ذروته في الربيع ثم تنحسر طوال الصيف،
    حتى إذا جاء الخريف أحاط بالماء إطار شاحب من الطين الجاف. وفي ذلك الوقت أيضاً يصفو الهواء. في يوم بارد
    صحو قد ينتصب الجدار الأبيض للقوقاز الكبير على امتداد الأفق الشمالي، بينما تنبسط تبليسي في حوضها خلفكم:
    جبال من جهة، وعاصمة من الجهة الأخرى، وبحيرة بينهما.
  tip: >-
    خصّصوا ساعتين لدورة كاملة وفنجان قهوة. المسار مستوٍ ومتماسك، مناسب لعربات الأطفال والكراسي المتحركة.
    لا يكاد يوجد ظل، وقد تبلغ الحرارة بعد ظهر يوليو 37°C، فتعالوا صيفاً قبل العاشرة أو بعد السادسة واحملوا
    الماء. الريح أشد منها في المدينة، وفي الشتاء لاذعة، وكثيراً ما يتكوّن الجليد على الأطراف. الشاطئ للتشمّس؛
    أما الماء نفسه فضحل قليل الملوحة كثير الأعشاب. على التلال التزموا بالدروب المطروقة، فالأفاعي كثيرة
    في العشب الطويل. دورات المياه في المقاهي. في عطلات نهاية الأسبوع يزدحم المكان منذ أواخر الصباح.
  route: >-
    من وسط المدينة اسلكوا جادة فاجا-بشافيلا شمالاً غربياً عبر سابورتالو حتى نهايتها العليا، ثم اتبعوا
    الطريق الصاعد إلى الهضبة؛ وطريق هضبة نوتسوبيدزه مدخل بديل. المسافة نحو 12 كم، عشرون إلى خمس وعشرين
    دقيقة خارج ساعات الذروة. الطريق معبّد كله؛ الكيلومترات الأخيرة تتعرّج صعوداً لكنها لا تطرح أي صعوبة.
    الموقف المجاني الرئيسي عند المدخل الجنوبي: فارغ صباحاً، ممتلئ عند الظهيرة في عطلات نهاية الأسبوع،
    وهناك موقف أصغر في الجهة الشرقية. تزوّدوا بالوقود في الأسفل على فاجا-بشافيلا، فلا محطة وقود على الهضبة.
    تكفي سيارة اقتصادية تماماً.
