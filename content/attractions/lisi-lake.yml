ka:
  name: ლისის ტბა
  short: ქალაქის ჩრდილო-დასავლეთით, პლატოზე მდებარე ტბა შემოსავლელი ბილიკით — თბილისელების სარბენი ადგილი.
  body: >-
    **ლისი თბილისელების ტბაა და არა ტურისტების.** ის ქალაქზე დაახლოებით ორასორმოცი მეტრით მაღლა, საბურთალოს
    უკან გადაჭიმულ პლატოზეა და ცენტრიდან ოციოდე წუთის სავალია, თუმცა ჰაერი, ქარი და ხედი უკვე სხვაა.


    ტბა პატარაა და ბუნებრივი, გარშემო კი დაახლოებით სამნახევარი კილომეტრის სიგრძის მოასფალტებული ბილიკი
    შემოუყვება. სწორედ ეს ბილიკია მთავარი: დილაობით და საღამოობით აქ დარბიან, ველოსიპედით დადიან, ბავშვებს
    ატარებენ და ძაღლს ასეირნებენ. სრული წრე მშვიდი ტემპით ორმოცი წუთია.


    რაც აქ არის:


    - რამდენიმე კაფე სამხრეთ ნაპირზე, ღია ტერასებით


    - ღია ცის ქვეშ სავარჯიშო მოედნები და ველოსიპედის გაქირავება


    - ცხენებით სასეირნო მარშრუტები ბორცვებზე


    - წყლის ფრინველები — იხვები, ყანჩა — და ზაფხულში კუები ნაპირზე


    დარწმუნებული იყავი ერთ რამეში: ეს საბანაო ტბა არ არის. წყალი მღვრიე და წყალმცენარეებითაა სავსე, ნაპირი
    ლამიანი; ვინც ცურვას აპირებს, კაფეების აუზებით სარგებლობს.


    კარგ, გაწმენდილ ამინდში — განსაკუთრებით წვიმის შემდეგ ან ზამთარში — ჩრდილოეთით კავკასიონის თოვლიანი
    ქედი ჩანს. ეს ალბათ საუკეთესო მიზეზია ლისზე ასასვლელად.


    ბოლო ათწლეულში ტბის აღმოსავლეთი მხარე ახალმა უბანმა დაიკავა და ველური აღარაა; დასავლეთი ნაპირი ჯერ
    კიდევ ღიაა და ბალახიანი.


    ტბა წვიმითა და თოვლის დნობით იკვებება და ზაფხულის ბოლოს შესამჩნევად იკლებს — აგვისტოში ნაპირზე ტალახის
    ფართო ზოლი რჩება. სამაგიეროდ, მაისში პლატო ველური ყვავილებით იფარება და ბორცვებზე ასასვლელი ბილიკები
    იხსნება: ტბიდან ორმოცდაათ წუთში ქედის თხემზე ხარ, საიდანაც ერთი მხრიდან ქალაქი ჩანს, მეორედან კი ცარიელი,
    უხის ბორცვები — თბილისში იშვიათი განცდაა.
  tip: >-
    ორი საათი სრული წრისთვის და კაფეში გაჩერებისთვის. ბილიკი ბრტყელია, ეტლითა და ეტლიანი ბავშვით სავსებით
    გასავლელი. ჩრდილი თითქმის არ არის — ზაფხულში ადრე დილით ან 18 საათის შემდეგ მიდი და წყალი თან იქონიე.
    ქარი აქ ქალაქზე ძლიერია და ზამთარში ცივი. ტუალეტი კაფეებშია. შაბათ-კვირას ხალხმრავალია, ორშაბათს კი
    — თითქმის ცარიელი.
  route: >-
    ცენტრიდან ვაჟა-ფშაველას გამზირით და შემდეგ თამარაშვილის ქუჩით ადიხარ, ან ნუცუბიძის პლატოს გავლით —
    12 კმ, 25 წუთი. გზა ბოლომდე ასფალტია, ბოლო კილომეტრები აღმართია მოსახვევებით, მაგრამ პრობლემას არ
    ქმნის. ტბის სამხრეთ შესასვლელთან დიდი უფასო პარკინგია — შაბათ-კვირას შუადღისთვის ივსება, დილით ცარიელია.
    მეორე, პატარა სადგომი აღმოსავლეთ მხარესაა. საწვავი ვაჟა-ფშაველაზე აიღე, ზემოთ სადგური არ არის. ეკონომკლასის
    მანქანა სავსებით საკმარისია.
en:
  name: Lisi Lake
  short: A lake on the plateau northwest of the city with a path all the way round — where Tbilisi goes
    running.
  body: >-
    **Lisi is the city's lake rather than a visitor attraction.** It sits on the plateau behind Saburtalo,
    some two hundred and forty metres above the centre, twenty-odd minutes' drive away — but the air,
    the wind and the view are already different up there.


    The lake itself is small and natural, and a surfaced path of about three and a half kilometres runs
    the whole way round it. The path is the point. Mornings and evenings it fills with runners, cyclists,
    pushchairs and dogs, and a full circuit at a gentle pace takes around forty minutes.


    What is there:


    - several cafes on the south shore with open terraces


    - outdoor gym equipment and bicycle hire


    - horses for rides up onto the surrounding hills


    - water birds, ducks and herons, and terrapins on the bank in summer


    Be clear about one thing: this is not a swimming lake. The water is silty and weedy and the margins
    are muddy; people who want to swim use the pools at the clubs beside it.


    In clear weather, particularly after rain or on a cold winter day, the snow line of the Greater Caucasus
    appears along the northern horizon. That is probably the best single reason to come up.


    Over the last decade a new residential district has taken the eastern side, and it is no longer wild
    ground. The western shore is still open and grassy, and that is the half worth walking.


    The lake is fed by rain and snowmelt and drops noticeably by late summer, leaving a wide band of mud
    around the edge in August. In exchange, May covers the plateau in wildflowers and opens the tracks
    up onto the hills behind: fifty minutes of walking from the shore puts you on the crest, with the
    city on one side and empty, treeless ridges on the other. That combination — a city view and genuine
    emptiness within the same hour — is rare this close to Tbilisi.
  tip: >-
    Two hours covers a full circuit and a stop for coffee. The path is flat and entirely manageable with
    a pushchair or wheelchair. There is almost no shade, so in summer come early or after six and carry
    water. The wind is stronger than in the city and genuinely cold in winter. Toilets are in the cafes.
    Weekends are busy from late morning; a Monday can be nearly empty, which many people prefer.
  route: >-
    From the centre take Vazha-Pshavela Avenue and then Tamarashvili Street up, or come over the Nutsubidze
    plateau — 12 km, about twenty-five minutes. The road is asphalt throughout; the last few kilometres
    climb in bends but present no difficulty. There is a large free car park at the southern entrance,
    empty in the morning and full by midday at weekends, plus a smaller one on the eastern side. Fill
    up on Vazha-Pshavela, as there is no fuel station up on the plateau. An economy car is entirely sufficient.
ru:
  name: Озеро Лиси
  short: Озеро на плато к северо-западу от города с дорожкой вокруг — сюда Тбилиси приходит бегать.
  body: >-
    **Лиси — городское озеро, а не туристический объект.** Оно лежит на плато за Сабуртало, примерно на
    двести сорок метров выше центра, в двадцати с небольшим минутах езды, но воздух, ветер и вид наверху
    уже другие.


    Само озеро небольшое и природное, а вокруг него идёт мощёная дорожка длиной около трёх с половиной
    километров. Дорожка и есть главное. Утром и вечером по ней бегают, ездят на велосипедах, катят коляски
    и выгуливают собак; полный круг спокойным шагом занимает минут сорок.


    Что здесь есть:


    - несколько кафе на южном берегу с открытыми террасами


    - уличные тренажёры и прокат велосипедов


    - лошади для прогулок по окрестным холмам


    - водоплавающие птицы, утки и цапли, а летом черепахи на берегу


    Одно уточнение: купаться здесь не стоит. Вода мутная и заросшая, берега илистые; желающие плавать
    идут в бассейны при клубах рядом.


    В ясную погоду, особенно после дождя или в морозный день, на северном горизонте проступает снежная
    линия Большого Кавказа. Это, пожалуй, лучшая причина сюда подняться.


    За последнее десятилетие восточную сторону занял новый жилой район, и дикой земли там больше нет.
    Западный берег остаётся открытым и травянистым — именно эту половину и стоит пройти пешком.


    Озеро питается дождями и талой водой и к концу лета заметно мелеет, оставляя в августе широкую полосу
    грязи по краю. Взамен май покрывает плато полевыми цветами и открывает тропы на холмы позади: пятьдесят
    минут ходьбы от берега выводят на гребень, где с одной стороны город, а с другой пустые безлесные
    хребты. Такое сочетание — вид на город и настоящая пустота в пределах одного часа — редкость так близко
    к Тбилиси.
  tip: >-
    Двух часов хватает на круг и остановку на кофе. Дорожка ровная, полностью проходима с коляской и в
    кресле. Тени почти нет, так что летом приезжайте рано или после шести и берите воду. Ветер сильнее,
    чем в городе, а зимой по-настоящему холодный. Туалеты в кафе. В выходные с позднего утра многолюдно,
    а в понедельник бывает почти пусто, что многим нравится больше.
  route: >-
    Из центра поднимайтесь по проспекту Важа-Пшавела, затем по улице Тамарашвили, либо через плато Нуцубидзе
    — 12 км, около двадцати пяти минут. Дорога асфальтированная, последние километры идут в гору с поворотами,
    но сложности не представляют. У южного входа большая бесплатная парковка: утром пустая, в выходные
    к полудню заполняется; есть и меньшая с восточной стороны. Заправляйтесь на Важа-Пшавела, наверху
    заправок нет. Машины эконом-класса вполне достаточно.
fa:
  name: دریاچهٔ لیسی
  short: دریاچه‌ای بر فلات شمال غربی شهر با مسیری گرداگردش؛ جایی که تفلیس برای دویدن به آن می‌رود.
  body: >-
    **لیسی دریاچهٔ خود شهر است نه جاذبه‌ای برای گردشگر.** بر فلات پشت ساببورتالو نشسته، حدود دویست‌وچهل
    متر بالاتر از مرکز، و بیست و چند دقیقه رانندگی فاصله دارد؛ اما هوا و باد و منظره آن بالا از همین حالا
    فرق می‌کند.


    خود دریاچه کوچک و طبیعی است و مسیری آسفالته به درازای حدود سه‌ونیم کیلومتر تمام دور آن می‌چرخد. همین
    مسیر مهم است. صبح‌ها و عصرها پر می‌شود از دونده و دوچرخه‌سوار و کالسکه و سگ، و یک دور کامل با گام
    آرام حدود چهل دقیقه می‌برد.


    آنچه اینجاست:


    - چند کافه در کرانهٔ جنوبی با ایوان‌های باز


    - دستگاه‌های ورزشی روباز و کرایهٔ دوچرخه


    - اسب برای گردش روی تپه‌های اطراف


    - پرندگان آبزی، مرغابی و حواصیل، و تابستان‌ها لاک‌پشت‌های آبی روی کرانه


    یک نکته را روشن بدانید: این دریاچهٔ شنا نیست. آب گل‌آلود و پر از علف آبی است و حاشیه‌ها گِلی؛ آنان
    که می‌خواهند شنا کنند از استخرهای باشگاه‌های کنار آن استفاده می‌کنند.


    در هوای صاف، به‌ویژه پس از باران یا در روزی سرد از زمستان، خط برف قفقاز بزرگ در افق شمالی پیدا می‌شود.
    شاید بهترین دلیل بالا آمدن همین باشد.


    در دههٔ گذشته محله‌ای مسکونی سمت شرقی را گرفته و آنجا دیگر زمین بکر نیست. کرانهٔ غربی هنوز باز و پوشیده
    از علف است و همین نیمه ارزش پیاده رفتن دارد.


    دریاچه از باران و آب‌شدن برف تغذیه می‌شود و در اواخر تابستان به‌روشنی پایین می‌رود و در اوت نواری
    پهن از گِل گرد کناره‌اش می‌ماند. در عوض، اردیبهشت فلات را از گل‌های وحشی می‌پوشاند و راه‌های تپه‌های
    پشت را باز می‌کند: پنجاه دقیقه پیاده‌روی از ساحل شما را بر ستیغ می‌گذارد، با شهر در یک سو و تیغه‌های
    خالی و بی‌درخت در سوی دیگر. این ترکیب — منظرهٔ شهر و خلوتی واقعی در یک ساعت — این‌قدر نزدیک به تفلیس
    کمیاب است.
  tip: >-
    دو ساعت برای یک دور کامل و توقفی برای قهوه کافی است. مسیر هموار است و با کالسکه و ویلچر کاملاً شدنی.
    سایه تقریباً نیست، پس تابستان صبح زود یا پس از ساعت شش بیایید و آب همراه ببرید. باد از شهر تندتر است
    و زمستان واقعاً سرد. سرویس بهداشتی در کافه‌هاست. آخر هفته از اواخر صبح شلوغ است و دوشنبه‌ها گاهی تقریباً
    خالی، که بسیاری همان را ترجیح می‌دهند.
  route: >-
    از مرکز شهر خیابان واژا پشاولا و سپس خیابان تاماراشویلی را بالا بروید، یا از فلات نوتسوبیدزه بیایید؛
    ۱۲ کیلومتر، حدود بیست‌وپنج دقیقه. جاده تا انتها آسفالت است و کیلومترهای پایانی با پیچ بالا می‌رود
    اما دشواری ندارد. کنار ورودی جنوبی پارکینگ بزرگ رایگانی هست که صبح خالی است و آخر هفته تا ظهر پر می‌شود،
    و پارکینگ کوچک‌تری هم در سمت شرقی. در واژا پشاولا سوخت بگیرید، چون بالای فلات پمپ بنزین نیست. خودروی
    اقتصادی کاملاً کافی است.
he:
  name: אגם ליסי
  short: אגם על הרמה מצפון-מערב לעיר עם שביל היקפי — לכאן טביליסי יוצאת לרוץ.
  body: >-
    **ליסי הוא האגם של העיר ולא אתר לתיירים.** הוא שוכן על הרמה שמאחורי סבורטאלו, כמאתיים ארבעים מטר מעל
    המרכז, כעשרים דקות נסיעה — אבל האוויר, הרוח והנוף שם למעלה כבר אחרים.


    האגם עצמו קטן וטבעי, ושביל סלול באורך כשלושה וחצי קילומטרים מקיף אותו כולו. השביל הוא העיקר. בבקרים
    ובערבים הוא מתמלא רצים, רוכבי אופניים, עגלות וכלבים, והקפה מלאה בקצב נינוח אורכת כארבעים דקות.


    מה יש כאן:


    - כמה בתי קפה בגדה הדרומית עם מרפסות פתוחות


    - מתקני כושר בחוץ והשכרת אופניים


    - סוסים לרכיבה אל הגבעות שמסביב


    - עופות מים, ברווזים ואנפות, ובקיץ צבי מים על הגדה


    שימו לב לדבר אחד: זה אינו אגם רחצה. המים עכורים ומלאי אצות והשוליים בוציים; מי שרוצה לשחות משתמש בבריכות
    המועדונים שלצדו.


    במזג אוויר בהיר, בייחוד אחרי גשם או ביום חורף קר, מופיע קו השלג של הקווקז הגדול באופק הצפוני. זו כנראה
    הסיבה הטובה ביותר לעלות לכאן.


    בעשור האחרון תפסה שכונת מגורים חדשה את הצד המזרחי, וזו כבר אינה קרקע פראית. הגדה המערבית עודנה פתוחה
    ומכוסה עשב, וזה החצי שכדאי ללכת בו.


    האגם ניזון מגשם ומהפשרת שלגים ויורד באופן ניכר בשלהי הקיץ, ובאוגוסט נותרת סביבו רצועת בוץ רחבה. בתמורה,
    מאי מכסה את הרמה בפרחי בר ופותח את השבילים אל הגבעות שמאחור: חמישים דקות הליכה מן החוף מעמידות אתכם
    על הרכס, כשהעיר בצד אחד ורכסים ריקים וחשופי עצים בצד השני. השילוב הזה — נוף עיר וריקנות אמיתית באותה
    שעה — נדיר כל כך קרוב לטביליסי.
  tip: >-
    שעתיים מספיקות להקפה מלאה ולעצירה לקפה. השביל מישורי ועביר לחלוטין עם עגלה או כיסא גלגלים. אין כמעט
    צל, ולכן בקיץ בואו מוקדם או אחרי שש וקחו מים. הרוח חזקה מבעיר וקרה באמת בחורף. שירותים בבתי הקפה.
    סופי שבוע עמוסים משעות הבוקר המאוחרות, ויום שני עשוי להיות כמעט ריק, מה שרבים מעדיפים.
  route: >-
    מן המרכז עלו בשדרות ואז'ה-פשאוולה ואחר כך ברחוב תמראשווילי, או דרך רמת נוצובידזה — 12 ק״מ, כעשרים
    וחמש דקות. הכביש סלול לכל אורכו, והקילומטרים האחרונים מטפסים בסיבובים אך אינם מציבים קושי. בכניסה
    הדרומית יש חניון גדול חינם, ריק בבוקר ומלא בסופי שבוע עד הצהריים, ועוד חניון קטן בצד המזרחי. תדלקו
    בוואז'ה-פשאוולה, כי על הרמה אין תחנות דלק. רכב חסכוני מספיק לחלוטין.
ar:
  name: بحيرة ليسي
  short: بحيرة على الهضبة شمال غربي المدينة يحيط بها ممر كامل؛ إلى هنا تخرج تبليسي للجري.
  body: >-
    **ليسي بحيرة أهل المدينة لا معلم للزوار.** تقع على الهضبة خلف سابورتالو، على نحو مئتين وأربعين متراً
    فوق المركز، وعلى بعد نيّف وعشرين دقيقة بالسيارة؛ غير أن الهواء والريح والمنظر هناك مختلفة أصلاً.


    والبحيرة نفسها صغيرة وطبيعية، ويدور حولها ممر معبّد بطول ثلاثة كيلومترات ونصف تقريباً. والممر هو المقصود.
    ففي الصباح والمساء يمتلئ بالعدّائين والدراجات وعربات الأطفال والكلاب، والدورة الكاملة بخطى هادئة تستغرق
    نحو أربعين دقيقة.


    وما تجده هنا:


    - عدة مقاهٍ على الضفة الجنوبية بشرفات مفتوحة


    - أجهزة رياضية في الهواء الطلق وتأجير دراجات


    - خيول للتجول على التلال المحيطة


    - طيور مائية وبط ومالك حزين، وسلاحف مائية على الضفة في الصيف


    ولتكن واضحاً في أمر: هذه ليست بحيرة سباحة. فالماء عكر مليء بالأعشاب والحواف طينية؛ ومن يريد السباحة
    يقصد مسابح النوادي المجاورة.


    وفي الجو الصافي، وخاصة بعد المطر أو في يوم شتوي بارد، يظهر خط الثلج على القوقاز الكبير في الأفق الشمالي.
    ولعل هذا أفضل سبب منفرد للصعود إلى هنا.


    وفي العقد الأخير احتل حي سكني جديد الجهة الشرقية ولم تعد أرضاً برية. أما الضفة الغربية فما زالت مفتوحة
    معشوشبة، وهي النصف الذي يستحق المشي.


    تتغذى البحيرة من المطر وذوبان الثلج وينخفض منسوبها بوضوح في أواخر الصيف، فيبقى حولها في أغسطس شريط
    عريض من الطين. وفي المقابل يكسو مايو الهضبة بالأزهار البرية ويفتح الدروب إلى التلال خلفها: خمسون دقيقة
    سيراً من الشاطئ تضعك على الحافة، والمدينة في جهة والتلال الخالية العارية في الجهة الأخرى. وهذا الجمع
    بين إطلالة المدينة والخلاء الحقيقي في الساعة نفسها نادر على هذا القرب من تبليسي.
  tip: >-
    ساعتان تكفيان لدورة كاملة ووقفة قهوة. والممر مستوٍ ويمكن اجتيازه تماماً بعربة طفل أو كرسي متحرك. ولا
    ظل يُذكر، ففي الصيف تعال باكراً أو بعد السادسة واحمل ماء. والريح أقوى منها في المدينة وباردة فعلاً
    شتاءً. ودورات المياه في المقاهي. وعطلة نهاية الأسبوع مزدحمة من أواخر الصباح، أما الاثنين فقد يكون
    شبه خالٍ، وهو ما يفضّله كثيرون.
  route: >-
    من وسط المدينة اصعد جادة فاجا بشافيلا ثم شارع تاماراشفيلي، أو تعال عبر هضبة نوتسوبيدزه؛ 12 كم ونحو
    خمس وعشرين دقيقة. الطريق معبّد على امتداده، والكيلومترات الأخيرة تصعد بمنعطفات دون صعوبة. وعند المدخل
    الجنوبي موقف كبير مجاني، فارغ صباحاً وممتلئ ظهر العطلة، وثمة موقف أصغر في الجهة الشرقية. وتزوّد بالوقود
    في فاجا بشافيلا، فلا محطة على الهضبة. وسيارة اقتصادية تكفي تماماً.
