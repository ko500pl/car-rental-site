ka:
  name: ეთნოგრაფიული მუზეუმი ღია ცის ქვეშ
  short: >-
    ვაკის თავზე, ტყიან ფერდზე აწყობილი სოფელი, სადაც ხევსურული კოშკი, თიანეთის ბაზილიკა და მეგრული სიმინდის
    სათავსო ერთმანეთის მეზობლები არიან.
  body: >-
    **სვანურ კოშკსა და კახურ მარანს შორის მთელი საქართველო ერთ ტყიან ფერდზე ეტევა.** გიორგი ჩიტაიას სახელობის
    ეთნოგრაფიული მუზეუმი ღია ცის ქვეშ ვაკის თავზე, კუს ტბის დასავლეთით მდებარეობს და უფრო სოფელს ჰგავს,
    ვიდრე მუზეუმს: სამოცდაათამდე ნაგებობა, ქვეყნის ისტორიული კუთხეებიდან ჩამოტანილი, 52 ჰექტარზე, თერთმეტ
    ზონად არის გაშლილი.


    მუზეუმი ეთნოგრაფმა გიორგი ჩიტაიამ 1966 წლის 27 აპრილს დააარსა, 2004 წლიდან კი ის საქართველოს ეროვნული
    მუზეუმის შემადგენლობაშია. აქ ყველაფერი მარტივადაა მოწყობილი: მიდიხართ და ფეხქვეშ ქვეყნის პეიზაჟი იცვლება.


    აღმოსავლეთ საქართველოდან აქ დარბაზული სახლები ჩამოუტანიათ — საფეხურებად ამოყვანილი ხის გვირგვინით,
    რომლის სარკმლიდანაც სინათლე პირდაპირ კერას ეცემა, — და ბანიანი ქვის სახლები. დასავლეთიდან — ჩალით
    ან ყავრით გადახურული ორფერდა ხის სახლები, მეგრული და იმერული წნული სიმინდის სათავსოები. ყველაფერს
    ზემოდან სვანური, ხევსურული და ფშაური კოშკები დაჰყურებს; აქვეა კახური მარანი, ქართლური წისქვილი, თიანეთიდან
    ჩამოტანილი ადრექრისტიანული „სიონის“ ბაზილიკა და VI–VII საუკუნეების საგვარეულო სამარხი სარკოფაგით.


    სახლებში 8 000-ზე მეტი ნივთია — სართავები, ხალიჩები, თიხის ჭურჭელი, ტანსაცმელი, ავეჯი — და ოთახები
    ისე გამოიყურება, თითქოს პატრონი ეს-ესაა გარეთ გავიდა.


    2004 წლიდან ყოველ ზაფხულს აქ ხალხური კულტურის ფესტივალი „არტ-გენი“ იმართება, რომელიც მუსიკოსმა ზაზა
    კორინთელმა დააარსა, და მაშინ ძველი სახლები სიმღერით ივსება. ჩვეულებრივ სამუშაო დღეს კი შეიძლება მთელი
    მთის კუთხე მარტო თქვენ შეგხვდეთ — მხოლოდ ხეებში მოშრიალე ქართან ერთად.
  tip: >-
    მთავარი ზონებისთვის ორი საათი გეყოფათ, ყველაფრისთვის — სამი. ბილიკები მიწისა და ხრეშისაა, თანაც ფერდზე,
    ამიტომ მოხერხებული ფეხსაცმელი ჩაიცვით; წვიმის შემდეგ ზოგიერთი მონაკვეთი ტალახად იქცევა. მუზეუმი ეროვნული
    მუზეუმის ფილიალია — სამუშაო დღეები და ბილეთის ფასი გასვლამდე museum.ge-ზე გადაამოწმეთ. შიგნით საჭმელ-სასმელის
    იმედი ნუ გექნებათ, წყალი თან წაიღეთ. ბავშვის ეტლით აქ სიარული ძნელია, თუმცა ბავშვებს ეს სახლები ძალიან
    უყვართ. საუკეთესო დროა ადრიანი დილა ან ოქტომბრის შუადღე, როცა დაბალი მზე ხის სახლებს ოქროსფრად ღებავს.
  route: >-
    მუზეუმი ცენტრიდან 9 კილომეტრშია, დაახლოებით 20 წუთის სავალზე. ილია ჭავჭავაძის გამზირით ვაკე ბოლომდე
    გაიარეთ, შემდეგ კი კუს ტბის გზას აუყევით, რომელიც ტყეში მიიკლაკნება; მუზეუმის შესასვლელი ტბამდე, გზისპირასაა
    და კარგად არის მონიშნული. გზა მთლიანად ასფალტიანია და მთელი წელი ღიაა, მაგრამ მოსახვევები ციცაბოა
    — ყინვიან დღეებში, როცა გზა მოიყინება, ნელა იარეთ ან ვიზიტი სხვა დღისთვის გადადეთ. შესასვლელთან უფასო
    სადგომია, თუმცა შაბათ-კვირას ადგილი ცოტაა. ეკონომკლასის მანქანა სავსებით საკმარისია. საწვავი ჭავჭავაძის
    გამზირზე ჩაასხით — მთაზე ბენზინგასამართი არ არის.
en:
  name: Open Air Museum of Ethnography
  short: >-
    A village assembled on a wooded hill above Vake, where a Khevsur tower, an early basilica from Tianeti
    and a Megrelian maize granary stand as neighbours.
  body: >-
    **Somewhere between a Svan tower and a Kakhetian wine cellar, the whole of Georgia fits on one wooded
    hillside.** The Giorgi Chitaia Open Air Museum of Ethnography sits above Vake, west of Turtle Lake,
    and it is less a museum than a village assembled from everywhere: some seventy buildings brought from
    the country's historical provinces and set out across 52 hectares in eleven zones.


    The ethnographer Giorgi Chitaia founded it on 27 April 1966, and since 2004 it has been part of the
    Georgian National Museum. The idea is simple: you walk, and the landscape of the country changes under
    your feet.


    From the east come darbazi houses, their stepped wooden domes rising to a smoke hole that drops light
    straight onto the hearth, and flat-roofed stone houses. From the west, timber houses under gabled
    roofs of straw or boards, and the wattle maize granaries of Samegrelo and Imereti. Watchtowers from
    Svaneti, Khevsureti and Pshavi look down on it all; nearby stand a Kakhetian marani, a Kartlian water
    mill, an early Christian basilica brought from Tianeti and a family burial vault of the sixth or seventh
    century, sarcophagus and all.


    Inside, more than 8,000 objects — distaffs, carpets, clay pots, clothes, furniture — make the rooms
    look as if someone has just stepped out.


    Every summer since 2004 the hill has also hosted Art-Gene, a folk-culture festival founded by the
    musician Zaza Korinteli, and then the old houses fill with song. Come on an ordinary weekday, though,
    and you may have an entire mountain province to yourself, with only the wind in the trees for company.
  tip: >-
    Allow two hours for the main zones and three for everything. The paths are earth and gravel on a slope,
    so wear proper shoes; after rain some stretches turn to mud. The museum is a branch of the Georgian
    National Museum — check opening days and the current ticket price on museum.ge before driving up.
    Don't count on food or drink inside: bring water. A pushchair is hard work here, though children tend
    to love the houses. The best hours are early morning or an October afternoon, when the low sun turns
    the timber houses gold.
  route: >-
    The museum is 9 km from the centre, about 20 minutes. Follow Ilia Chavchavadze Avenue through Vake
    to its upper end, then take the Turtle Lake road as it winds up through the woods; the museum gate
    is on this road, before the lake, and well signposted. It is asphalt all the way and open all year,
    but the bends are steep — on icy winter days drive slowly or choose another day. There is free parking
    at the gate, tight at weekends. An economy car is entirely adequate. Fill up on Chavchavadze Avenue;
    there is no fuel on the hill.
ru:
  name: Этнографический музей под открытым небом
  short: >-
    Деревня, собранная на лесистом холме над Ваке: хевсурская башня, базилика из Тианети и мегрельский
    кукурузный амбар стоят здесь по-соседски.
  body: >-
    **Где-то между сванской башней и кахетинским винным погребом вся Грузия умещается на одном лесистом
    склоне.** Этнографический музей под открытым небом имени Георгия Читая стоит над Ваке, к западу от
    Черепашьего озера, и это не столько музей, сколько деревня, собранная отовсюду: около семидесяти построек,
    перевезённых из исторических областей страны и расставленных на 52 гектарах в одиннадцати зонах.


    Этнограф Георгий Читая основал музей 27 апреля 1966 года, а с 2004 года он входит в Национальный музей
    Грузии. Замысел прост: вы идёте — и пейзаж страны меняется у вас под ногами.


    С востока пришли дома-дарбази, чьи ступенчатые деревянные купола сходятся к дымовому отверстию, роняющему
    свет прямо на очаг, и каменные дома с плоскими крышами. С запада — деревянные дома под двускатными
    кровлями из соломы или досок и плетёные кукурузные амбары Самегрело и Имерети. Сверху на всё это смотрят
    сторожевые башни из Сванетии, Хевсурети и Пшави; рядом стоят кахетинский марани, картлийская водяная
    мельница, раннехристианская базилика, привезённая из Тианети, и семейная усыпальница VI или VII века
    — вместе с саркофагом.


    Внутри более 8000 предметов — прялки, ковры, глиняные кувшины, одежда, мебель — и комнаты выглядят
    так, будто хозяева только что вышли.


    С 2004 года каждое лето холм принимает ещё и «Арт-Гене» — фестиваль народной культуры, основанный
    музыкантом Зазой Коринтели, и тогда старые дома наполняются песнями. Но приезжайте в обычный будний
    день — и, может быть, целая горная провинция достанется вам одному, а компанию составит лишь ветер
    в деревьях.
  tip: >-
    На основные зоны отведите два часа, на всё — три. Дорожки на склоне земляные и гравийные, так что
    наденьте нормальную обувь; после дождя местами бывает грязь. Музей — филиал Национального музея Грузии:
    перед поездкой проверьте дни работы и актуальную цену билета на museum.ge. На еду и напитки внутри
    не рассчитывайте — возьмите воду. С детской коляской здесь тяжело, хотя дети обычно в восторге от
    домов. Лучшее время — раннее утро или октябрьский день, когда низкое солнце золотит деревянные дома.
  route: >-
    Музей в 9 км от центра, примерно в 20 минутах. Поезжайте по проспекту Ильи Чавчавадзе через Ваке до
    самого его верхнего конца, а затем по дороге к Черепашьему озеру, которая петляет вверх через лес;
    ворота музея — на этой дороге, не доезжая до озера, указатели хорошие. Асфальт на всём пути, дорога
    открыта круглый год, но повороты крутые — в гололёд езжайте медленно или выберите другой день. У ворот
    бесплатная парковка, в выходные тесная. Машины эконом-класса вполне достаточно. Заправьтесь на проспекте
    Чавчавадзе: на холме заправок нет.
fa:
  name: موزهٔ روباز مردم‌شناسی
  short: >-
    روستایی گردآمده بر تپه‌ای جنگلی بالای واکه، جایی که برجی خوسوری، باسیلیکایی از تیانتی و انبار ذرتی
    مگرلی همسایهٔ هم‌اند.
  body: >-
    **جایی میان برجی سوانی و سرداب شرابی کاختی، سراسر گرجستان بر یک دامنهٔ جنگلی جا می‌گیرد.** موزهٔ روباز
    مردم‌شناسی گیورگی چیتایا بالای محلهٔ واکه و در غرب دریاچهٔ لاک‌پشت قرار دارد، و بیش از آنکه موزه باشد،
    روستایی است که از همه جا گرد آمده: حدود هفتاد بنا که از ایالت‌های تاریخی کشور به این‌جا آورده شده
    و در یازده بخش بر پهنه‌ای ۵۲ هکتاری چیده شده‌اند.


    گیورگی چیتایای مردم‌شناس آن را در ۲۷ آوریل ۱۹۶۶ بنیاد نهاد و از ۲۰۰۴ بخشی از موزهٔ ملی گرجستان است.
    ایده ساده است: قدم می‌زنید و چشم‌انداز کشور زیر پایتان دگرگون می‌شود.


    از شرق، خانه‌های داربازی آمده‌اند با گنبدهای چوبی پلکانی که به روزنهٔ دودکشی می‌رسند و نور را یکراست
    بر اجاق فرو می‌ریزند، و نیز خانه‌های سنگی با بام‌های تخت. از غرب، خانه‌های چوبی زیر بام‌های شیروانی
    از کاه یا تخته، و انبارهای ذرت ترکه‌بافت سامگرلو و ایمرتی. برج‌های دیده‌بانی از سوانتی، خوسورتی و
    پشاوی از بالا بر همه نظر دارند؛ در همان نزدیکی یک مارانی کاختی (سرداب سنتی شراب)، آسیاب آبی‌ای از
    کارتلی، باسیلیکایی از آغاز مسیحیت که از تیانتی آورده شده و سردابهٔ خانوادگی‌ای از سدهٔ ششم یا هفتم،
    همراه با تابوت سنگی‌اش، ایستاده‌اند.


    درون خانه‌ها بیش از ۸۰۰۰ شیء — دوک‌های نخ‌ریسی، فرش‌ها، کوزه‌های سفالی، جامه‌ها، اثاث — اتاق‌ها را
    چنان کرده که گویی کسی همین حالا بیرون رفته است.


    از ۲۰۰۴ هر تابستان این تپه میزبان «آرت‌ژن» نیز هست، جشنوارهٔ فرهنگ مردمی که زازا کورینتلیِ موسیقی‌دان
    بنیاد گذاشت، و آن‌گاه خانه‌های کهن از آواز پر می‌شوند. اما اگر در یک روز کاری معمولی بیایید، شاید
    یک ایالت کوهستانی تمام از آنِ شما باشد و تنها همدمتان باد در میان درختان.
  tip: >-
    برای بخش‌های اصلی دو ساعت و برای همه‌چیز سه ساعت وقت بگذارید. راه‌ها خاکی و شنی و بر شیب‌اند، پس کفش
    مناسب بپوشید؛ پس از باران برخی تکه‌ها گل‌آلود می‌شوند. موزه شعبه‌ای از موزهٔ ملی گرجستان است — پیش
    از راه افتادن روزهای بازگشایی و بهای کنونی بلیت را در museum.ge ببینید. روی خوراک و نوشیدنی در درون
    موزه حساب نکنید: آب همراه بیاورید. راندن کالسکهٔ بچه این‌جا دشوار است، هرچند کودکان معمولاً شیفتهٔ
    خانه‌ها می‌شوند. بهترین زمان، صبح زود یا بعدازظهری در ماه اکتبر است، وقتی خورشید پایین خانه‌های چوبی
    را طلایی می‌کند.
  route: >-
    موزه ۹ کیلومتر از مرکز شهر فاصله دارد، حدود ۲۰ دقیقه. خیابان ایلیا چاوچاوادزه را از میان واکه تا انتهای
    بالایی‌اش دنبال کنید، سپس جادهٔ دریاچهٔ لاک‌پشت را بگیرید که پیچ‌پیچان از میان جنگل بالا می‌رود؛ دروازهٔ
    موزه بر همین جاده و پیش از دریاچه است و تابلوهای راهنمای روشنی دارد. تمام راه آسفالت است و در همهٔ
    سال باز، اما پیچ‌ها تندند — در روزهای یخ‌زدهٔ زمستان آهسته برانید یا روز دیگری را برگزینید. کنار دروازه
    پارکینگ رایگان هست که آخر هفته‌ها تنگ می‌شود. خودروی اقتصادی کاملاً کافی است. در خیابان چاوچاوادزه
    باک را پر کنید؛ بر تپه پمپ بنزینی نیست.
he:
  name: מוזיאון האתנוגרפיה הפתוח
  short: כפר שהורכב על גבעה מיוערת מעל ואקה, שבו מגדל חבסורי, בזיליקה מטיאנטי ואסם תירס מגרלי עומדים זה
    לצד זה כשכנים.
  body: >-
    **איפשהו בין מגדל סוואני למרתף יין קאחתי, גאורגיה כולה מתכנסת על מדרון מיוער אחד.** מוזיאון האתנוגרפיה
    הפתוח על שם גיורגי צ'יטאיה שוכן מעל ואקה, ממערב לאגם הצבים, והוא פחות מוזיאון ויותר כפר שהורכב מכל
    קצוות הארץ: כשבעים מבנים שהובאו מן המחוזות ההיסטוריים של המדינה ונפרסו על פני 52 הקטרים באחד עשר אזורים.


    האתנוגרף גיורגי צ'יטאיה ייסד אותו ב־27 באפריל 1966, ומאז 2004 הוא חלק מן המוזיאון הלאומי של גאורגיה.
    הרעיון פשוט: אתם הולכים, והנוף של המדינה משתנה מתחת לרגליכם.


    מן המזרח באו בתי דרבזי, שכיפות העץ המדורגות שלהם מתנשאות אל פתח עשן המטיל אור ישר על האח, ובתי אבן
    בעלי גגות שטוחים. מן המערב – בתי עץ תחת גגות משופעים של קש או קרשים, ואסמי התירס הקלועים של סמגרלו
    ואימרתי. מגדלי שמירה מסוואנטי, מחבסורתי ומפשאווי צופים על הכול מלמעלה; בסמוך עומדים מרני קאחתי (מרתף
    יין מסורתי), טחנת מים מקרתלי, בזיליקה נוצרית קדומה שהובאה מטיאנטי וקבר משפחתי מן המאה השישית או השביעית,
    כולל הסרקופג.


    בפנים, יותר מ־8,000 חפצים – פלכים, שטיחים, כדי חרס, בגדים, רהיטים – גורמים לחדרים להיראות כאילו מישהו
    יצא מהם זה עתה.


    מאז 2004, בכל קיץ, מארחת הגבעה גם את ארט־ג'ן, פסטיבל לתרבות עממית שייסד המוזיקאי זאזא קורינטלי, ואז
    הבתים הישנים מתמלאים שירה. אבל בואו ביום חול רגיל, ואולי יהיה לכם מחוז הררי שלם לעצמכם, ורק הרוח בעצים
    לחברה.
  tip: >-
    הקדישו שעתיים לאזורים העיקריים ושלוש שעות לכול. השבילים עשויים עפר וחצץ על מדרון, אז נעלו נעליים מתאימות;
    אחרי גשם קטעים מסוימים הופכים לבוץ. המוזיאון הוא שלוחה של המוזיאון הלאומי של גאורגיה – בדקו ימי פתיחה
    ומחיר כרטיס עדכני ב־museum.ge לפני שאתם עולים. אל תסמכו על אוכל או שתייה בפנים: הביאו מים. עם עגלת
    תינוק קשה כאן, אף שילדים בדרך כלל מתאהבים בבתים. השעות הטובות ביותר הן מוקדם בבוקר או אחר צהריים של
    אוקטובר, כשהשמש הנמוכה מזהיבה את בתי העץ.
  route: >-
    המוזיאון נמצא 9 ק"מ מהמרכז, כ־20 דקות נסיעה. סעו בשדרות איליה צ'בצ'בדזה דרך ואקה עד הקצה העליון שלהן,
    ואז קחו את הכביש לאגם הצבים שמתפתל במעלה היער; שער המוזיאון נמצא על הכביש הזה, לפני האגם, ומשולט היטב.
    הכביש סלול כל הדרך ופתוח כל השנה, אבל הסיבובים תלולים – בימי קרח בחורף סעו לאט או בחרו יום אחר. ליד
    השער יש חנייה חינם, צפופה בסופי שבוע. רכב בקטגוריית אקונומי מספיק לגמרי. תדלקו בשדרות צ'בצ'בדזה; על
    הגבעה אין תחנת דלק.
ar:
  name: متحف الإثنوغرافيا المفتوح
  short: قرية جُمعت على تلّ مشجّر فوق حي فاكي، حيث يتجاور برج خيفسوري وبازيليكا من تيانيتي ومخزن ذرة ميغريلي.
  body: >-
    **في مكان ما بين برج سفاني وقبو نبيذ كاخيتي، تتسع جورجيا بأكملها لسفح مشجّر واحد.** يقع متحف جورجي
    تشيتايا للإثنوغرافيا في الهواء الطلق فوق حي فاكي، غربي بحيرة السلحفاة، وهو أقرب إلى قرية جُمعت من
    كل مكان منه إلى متحف: نحو سبعين مبنى نُقلت من الأقاليم التاريخية للبلاد وتوزعت على 52 هكتارًا في إحدى
    عشرة منطقة.


    أسسه عالم الإثنوغرافيا جورجي تشيتايا في 27 أبريل 1966، وهو منذ 2004 جزء من المتحف الوطني الجورجي.
    والفكرة بسيطة: تمشي، فيتبدّل مشهد البلاد تحت قدميك.


    من الشرق جاءت بيوت الداربازي، بقبابها الخشبية المتدرجة التي ترتفع نحو فتحة للدخان تُسقط الضوء مباشرة
    على الموقد، وبيوت حجرية ذات سقوف مسطحة. ومن الغرب بيوت خشبية تحت سقوف جملونية من القش أو الألواح،
    ومخازن الذرة المجدولة من الأغصان في ساميغريلو وإيميريتي. وتطلّ على ذلك كله أبراج مراقبة من سفانيتي
    وخيفسوريتي وبشافي؛ وعلى مقربة منها ماراني كاخيتي (قبو النبيذ التقليدي)، وطاحونة مائية من كارتلي، وبازيليكا
    من فجر المسيحية نُقلت من تيانيتي، ومدفن عائلي من القرن السادس أو السابع بتابوته الحجري.


    وفي الداخل أكثر من 8000 قطعة — أدوات غزل وسجاد وجرار فخارية وملابس وأثاث — تجعل الغرف تبدو كأن أحدًا
    غادرها للتو.


    ومنذ 2004 يستضيف التلّ كل صيف أيضًا مهرجان «آرت جين» للثقافة الشعبية، الذي أسسه الموسيقي زازا كورينتيلي،
    فتمتلئ البيوت القديمة بالغناء. لكن إن جئت في يوم عمل عادي، فقد تحظى بإقليم جبلي كامل لنفسك، لا يؤنسك
    فيه سوى الريح بين الأشجار.
  tip: >-
    خصّص ساعتين للمناطق الرئيسية وثلاثًا لكل شيء. الممرات ترابية ومفروشة بالحصى على منحدر، فانتعل حذاءً
    مناسبًا؛ وبعد المطر تتحول بعض المقاطع إلى وحل. المتحف فرع من المتحف الوطني الجورجي، فتحقّق من أيام
    الفتح وسعر التذكرة الحالي على museum.ge قبل أن تصعد بالسيارة. لا تعوّل على طعام أو شراب في الداخل:
    أحضر معك ماءً. دفع عربة الأطفال هنا مرهق، مع أن الأطفال يعشقون البيوت عادة. أفضل الأوقات الصباح الباكر
    أو عصر يوم من أكتوبر، حين تكسو الشمس المنخفضة البيوت الخشبية بلون ذهبي.
  route: >-
    يبعد المتحف 9 كم عن المركز، نحو 20 دقيقة. اتبع جادة إيليا تشافتشافادزه عبر حي فاكي حتى طرفها الأعلى،
    ثم خذ طريق بحيرة السلحفاة الذي يتلوّى صاعدًا عبر الغابة؛ وبوابة المتحف على هذا الطريق، قبل البحيرة،
    والإشارات إليها واضحة. الطريق معبّد بالكامل ومفتوح طوال العام، لكن المنعطفات شديدة الانحدار؛ ففي أيام
    الجليد شتاءً قُد ببطء أو اختر يومًا آخر. عند البوابة موقف مجاني يضيق في عطلات نهاية الأسبوع. وتكفي
    تمامًا سيارة من الفئة الاقتصادية. املأ خزان الوقود في جادة تشافتشافادزه، إذ لا محطة وقود على التلّ.
