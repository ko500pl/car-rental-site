ka:
  name: ეთნოგრაფიული ღია ცის ქვეშ მუზეუმი
  short: კუს ტბის კალთაზე გაშენებული სოფელი, სადაც საქართველოს ყველა კუთხის ავთენტური სახლია გადმოტანილი.
  body: >-
    **ეს არის საქართველო ერთ საათში.** ვაკის ზემოთ, კუს ტბისკენ მიმავალ ტყიან კალთაზე, 52 ჰექტარზე გაშენებულია
    მუზეუმი, სადაც ქვეყნის ყველა ისტორიული პროვინციიდან ნამდვილი, დაშლილი და ხელახლა აწყობილი სახლები
    დგას. მუზეუმი 1966 წელს ეთნოგრაფ გიორგი ჩიტაიას ინიციატივით დაარსდა.


    ბილიკი ზონებად არის დაყოფილი და თითოეული ერთ რეგიონს წარმოადგენს:


    - **ქართლი და კახეთი** — დარბაზული სახლები ცენტრალური კერითა და საკვამურით, მარნები ქვევრებით

    - **სვანეთი** — ქვის კოშკი და მაჩუბი, ჭერიდან კიდებული საოჯახო სკამებით

    - **სამეგრელო და გურია** — ხის სახლები, აწეული საძირკვლით ტენიანობის გამო

    - **აჭარა და იმერეთი** — აივნიანი ხის კონსტრუქციები, სახლის შიდა წყალსადენებით

    - **ხევსურეთი და თუშეთი** — მთის სუროგატული ქვის ნაგებობები


    უმეტესი სახლი შიგნიდან სრულად არის მოწყობილი: ჭურჭელი, ხალიჩა, საწოლი, სამუშაო იარაღი. ზოგან ადგილობრივი
    მცველი გიამბობს, როგორ ცხოვრობდნენ ამ ოთახებში.


    მუზეუმი ერთდროულად პარკიცაა — ჩრდილი, ხეები, საფეხმავლო ბილიკები. ზაფხულში აქ ქალაქზე რამდენიმე გრადუსით
    გრილა და ეს ცალკე მიზეზია მოსვლისა. საშემოდგომოდ ტერიტორია განსაკუთრებით ლამაზია.
  tip: >-
    ტერიტორია დიდია და ბილიკები დაფერდებულია — მოსახერხებელი ფეხსაცმელი აუცილებელია, ქუსლი გამორიცხულია.
    წვიმის შემდეგ მიწა ილპება, გუბეებს ვერ აუვლი. ორი საათი საკმარისია მთავარი ზონებისთვის, სამი — ყველა
    სექტორისთვის. წყალი თან წაიღე: შიგნით კაფე მცირეა და ყოველთვის არ მუშაობს. ბავშვებს აქ მოსწონთ, მაგრამ
    ეტლით მოძრაობა რთულია. საუკეთესო დროა დილა ან შემოდგომის შუადღე.
  route: >-
    ცენტრიდან ჭავჭავაძის გამზირით ვაკეში, შემდეგ კუს ტბის გზაზე ასვლა — სულ 20 წუთი უსაფრთხოდ. მუზეუმის
    შესასვლელი გზის მარჯვენა მხარესაა, კუს ტბამდე დაახლოებით ერთი კილომეტრით ადრე, ნიშანი მკაფიოა. შესასვლელთან
    უფასო პარკინგია, შაბათ-კვირას შეიძლება გაივსოს. აღმართი ასფალტია და მთელი წელი ღიაა; ზამთარში მოყინვისას
    სიფრთხილეა საჭირო, მაგრამ ეკონომ-კლასის მანქანა სავსებით საკმარისია. საწვავი ჭავჭავაძის გამზირზე ან
    ვაკის ბოლოს აიღე.
en:
  name: Open Air Museum of Ethnography
  short: A village of authentic houses from every Georgian province, rebuilt on the wooded slope below
    Turtle Lake.
  body: >-
    **This is Georgia compressed into an hour's walk.** On a wooded hillside above Vake, on the way up
    to Turtle Lake, 52 hectares hold real houses that were dismantled in their home villages and reassembled
    here. The museum was founded in 1966 on the initiative of the ethnographer Giorgi Chitaia.


    The path is organised into zones, each representing a historical province:


    - **Kartli and Kakheti** — *darbazi* houses with a central hearth and a stepped smoke hole, plus wine
    cellars with buried qvevri

    - **Svaneti** — a defensive stone tower and a *machubi*, the single room where family and cattle wintered
    together

    - **Samegrelo and Guria** — timber houses raised off the ground against damp

    - **Adjara and Imereti** — wooden buildings with wide balconies and ingenious internal water systems

    - **Khevsureti and Tusheti** — dry stone mountain structures built without mortar


    Most interiors are fully furnished with pots, rugs, beds and tools, and in several houses an attendant
    will explain how the space was actually used through the year.


    The museum doubles as a park: shade, old trees, quiet paths. In summer it is several degrees cooler
    than the city, which is a reason to come in itself, and in late October the whole slope turns yellow.
  tip: >-
    The site is large and the paths run up and down the slope, so wear comfortable shoes — heels are hopeless
    here. After rain the ground turns muddy and some sections puddle badly. Two hours covers the main
    zones, three covers everything. Bring water: the on-site café is small and not always open. Children
    enjoy the houses, but a pushchair is hard work on these paths. Early morning or an autumn afternoon
    are the best times.
  route: >-
    From the centre take Chavchavadze Avenue through Vake, then the road climbing towards Turtle Lake
    — about twenty minutes in normal traffic. The museum entrance is on the right, roughly a kilometre
    before the lake, and clearly signposted. There is free parking at the gate, which can fill at weekends.
    The climb is asphalt and open all year; it demands some care when it ices over in winter, but an economy
    car is entirely adequate. Fill up on Chavchavadze Avenue or at the top end of Vake.
ru:
  name: Этнографический музей под открытым небом
  short: Деревня из подлинных домов всех регионов Грузии, собранная на лесистом склоне под Черепашьим
    озером.
  body: >-
    **Это Грузия, сжатая до часовой прогулки.** На лесистом склоне над Ваке, по дороге к Черепашьему озеру,
    на 52 гектарах стоят настоящие дома, разобранные в родных сёлах и заново собранные здесь. Музей основан
    в 1966 году по инициативе этнографа Георгия Читая.


    Маршрут разбит на зоны, каждая представляет историческую провинцию:


    - **Картли и Кахетия** — дома-дарбази с центральным очагом и ступенчатым дымоходом, марани с закопанными
    квеври

    - **Сванетия** — оборонительная башня и мачуби, единственная комната, где семья зимовала вместе со
    скотом

    - **Самегрело и Гурия** — деревянные дома, поднятые над землёй из-за сырости

    - **Аджария и Имеретия** — постройки с широкими балконами и продуманной внутренней подачей воды

    - **Хевсуретия и Тушетия** — горные сооружения из сухого камня, без раствора


    Большинство интерьеров полностью обставлены: посуда, ковры, кровати, инструменты. В нескольких домах
    смотритель расскажет, как этим пространством пользовались в течение года.


    Музей одновременно и парк: тень, старые деревья, тихие дорожки. Летом здесь на несколько градусов
    прохладнее, чем в городе, а в конце октября весь склон становится жёлтым.
  tip: >-
    Территория большая, тропы идут вверх-вниз по склону, поэтому нужна удобная обувь — каблуки исключены.
    После дождя земля раскисает, а часть дорожек заливает. Двух часов хватает на основные зоны, трёх —
    на всё. Возьмите воду: кафе на территории маленькое и работает не всегда. Детям здесь интересно, но
    с коляской тяжело. Лучшее время — раннее утро или осенний день.
  route: >-
    Из центра по проспекту Чавчавадзе через Ваке, затем по дороге, поднимающейся к Черепашьему озеру,
    — около двадцати минут при обычном трафике. Вход в музей справа, примерно за километр до озера, указатель
    заметный. У ворот бесплатная парковка, в выходные она может заполниться. Подъём асфальтирован и открыт
    круглый год; зимой при гололёде нужна осторожность, но машины эконом-класса вполне достаточно. Заправиться
    удобно на проспекте Чавчавадзе или в конце Ваке.
fa:
  name: موزهٔ روباز مردم‌شناسی
  short: دهکده‌ای از خانه‌های اصیل هر استان گرجستان، بازسازی‌شده بر دامنهٔ جنگلی زیر دریاچهٔ لاک‌پشت.
  body: >-
    **این گرجستان است که در یک ساعت پیاده‌روی فشرده شده.** روی دامنه‌ای جنگلی بالای واکه، در راه بالا
    رفتن به سوی دریاچهٔ لاک‌پشت، 52 هکتار زمین خانه‌های واقعی را در خود جای داده است؛ خانه‌هایی که در
    روستاهای خودشان برچیده و اینجا دوباره برپا شده‌اند. موزه در 1966 به ابتکار گیورگی چیتایای مردم‌شناس
    بنیاد گذاشته شد.


    مسیر به بخش‌هایی تقسیم شده که هر کدام یک استان تاریخی را نشان می‌دهد. در **کارتلی و کاختی** خانه‌های
    «داربازی» با اجاق مرکزی و دریچهٔ پلکانی دود، همراه با سردابه‌هایی که خمره‌های کوِوری در خاکشان مدفون
    است؛ در **سوانتی** یک برج سنگی دفاعی و «ماچوبی»، همان اتاق یگانه‌ای که خانواده و دام زمستان را با
    هم در آن می‌گذراندند؛ در **سامگرلو و گوریا** خانه‌های چوبی که برای دور ماندن از رطوبت از زمین بلند
    شده‌اند؛ در **آجارا و ایمرتی** بناهای چوبی با بالکن‌های پهن و سامانه‌های هوشمندانهٔ آب در درون خانه؛
    و در **خوسورتی و توشتی** سازه‌های کوهستانی از سنگ خشک که بدون هیچ ملاتی چیده شده‌اند.


    بیشتر فضاهای داخلی کاملاً چیده شده‌اند — دیگ و قالی و رختخواب و ابزار — و در چند خانه نگهبانی توضیح
    می‌دهد که هر گوشه در طول سال واقعاً چه کاربردی داشته است. موزه در عین حال یک پارک است: سایه، درختان
    کهن و مسیرهای خلوت. در تابستان چند درجه خنک‌تر از شهر است و همین به‌تنهایی دلیل آمدن است، و در اواخر
    اکتبر تمام دامنه زرد می‌شود.
  tip: >-
    محوطه بزرگ است و مسیرها روی شیب بالا و پایین می‌روند، پس کفش راحت بپوشید — کفش پاشنه‌دار اینجا به‌کلی
    بی‌فایده است. پس از باران زمین گِلی می‌شود و در برخی بخش‌ها آب جمع می‌شود. دو ساعت بخش‌های اصلی را
    پوشش می‌دهد و سه ساعت همه‌چیز را. آب همراه بیاورید: کافهٔ محوطه کوچک است و همیشه باز نیست. بچه‌ها
    از خانه‌ها لذت می‌برند، اما هل دادن کالسکه روی این مسیرها کار سختی است. اول صبح یا یک بعدازظهر پاییزی
    بهترین زمان‌اند.
  route: >-
    از مرکز شهر خیابان چاوچاوادزه را از میان واکه بگیرید و بعد جاده‌ای را که به سوی دریاچهٔ لاک‌پشت بالا
    می‌رود — در ترافیک عادی حدود بیست دقیقه. ورودی موزه سمت راست است، تقریباً یک کیلومتر پیش از دریاچه،
    و تابلوی روشنی دارد. کنار دروازه پارکینگ رایگان هست که آخر هفته‌ها پر می‌شود. سربالایی آسفالت است
    و تمام سال باز؛ وقتی زمستان یخ می‌بندد کمی احتیاط می‌خواهد، اما خودروی اقتصادی کاملاً کافی است. باک
    را در خیابان چاوچاوادزه یا در بالای واکه پر کنید.
he:
  name: מוזיאון האתנוגרפיה הפתוח
  short: כפר של בתים אותנטיים מכל מחוזות גאורגיה, שהורכבו מחדש במדרון המיוער שמתחת לאגם הצבים.
  body: >-
    **זו גאורגיה כולה, דחוסה לשעה אחת של הליכה.** על מדרון מיוער מעל ואקה, בדרך העולה אל אגם הצבים, משתרעים
    52 הקטרים שבתוכם עומדים בתים אמיתיים שפורקו בכפרי מוצאם והורכבו כאן מחדש. המוזיאון נוסד ב-1966 ביוזמת
    האתנוגרף גיורגי צ'יטאיה.


    השביל מחולק לאזורים, וכל אחד מהם מייצג מחוז היסטורי אחר. ב**קרתלי ובקחתי** עומדים בתי "דארבאזי" עם
    אח מרכזי ופתח עשן מדורג, ולצידם מרתפי יין ובהם כדי קווברי קבורים באדמה. ב**סוואנטי** יש מגדל אבן מבוצר
    ו"מאצ'ובי", אותו חדר יחיד שבו חורפו המשפחה והבקר יחד. ב**סמגרלו ובגוריה** הבתים בנויים עץ ומורמים
    מעל פני הקרקע מפני הלחות; ב**אג'ריה ובאימרתי** מבני עץ עם מרפסות רחבות ומערכות מים פנימיות מחוכמות;
    וב**חבסורתי ובטושתי** מבני אבן הרריים שנבנו בלי טיט כלל.


    רוב חללי הפנים מרוהטים במלואם — סירים, שטיחים, מיטות וכלי עבודה — ובכמה מן הבתים שומר מסביר כיצד שימש
    המקום בפועל לאורך השנה. המוזיאון מתפקד גם כפארק: צל, עצים ותיקים ושבילים שקטים. בקיץ קריר כאן בכמה
    מעלות מאשר בעיר, וזו סיבה מספקת לבוא בפני עצמה, ובסוף אוקטובר כל המדרון מצהיב.
  tip: >-
    האתר גדול והשבילים עולים ויורדים במדרון, לכן נעלו נעליים נוחות — עקבים הם חסרי סיכוי כאן. אחרי גשם
    האדמה נעשית בוצית ובחלק מהקטעים נקוות שלוליות. שעתיים מכסות את האזורים המרכזיים, שלוש מכסות הכול.
    קחו איתכם מים: בית הקפה שבמקום קטן ואינו פתוח תמיד. ילדים נהנים מהבתים, אבל עגלת תינוק היא עבודה קשה
    בשבילים האלה. שעת בוקר מוקדמת או אחר צהריים סתווי הם הזמנים הטובים ביותר.
  route: >-
    מהמרכז סעו בשדרות צ'אבצ'אוודזה דרך ואקה, ומשם בכביש המטפס לכיוון אגם הצבים — כעשרים דקות בתנועה רגילה.
    הכניסה למוזיאון נמצאת מצד ימין, בערך קילומטר לפני האגם, והשילוט אליה ברור. בשער יש חניה חופשית, והיא
    עשויה להתמלא בסופי שבוע. העלייה סלולה ופתוחה כל השנה; היא דורשת מעט זהירות כשהיא מקרחת בחורף, אבל
    רכב חסכוני מספיק לחלוטין. תדלקו בשדרות צ'אבצ'אוודזה או בקצה העליון של ואקה.
ar:
  name: متحف الإثنوغرافيا المفتوح
  short: قرية من بيوت أصلية من كل أقاليم جورجيا، أُعيد تركيبها على المنحدر المشجر تحت بحيرة السلاحف.
  body: >-
    **هذه جورجيا كلها مضغوطة في ساعة من المشي.** على منحدر مشجر فوق فاكي، في الطريق الصاعد إلى بحيرة السلاحف،
    تضم 52 هكتاراً بيوتاً حقيقية فُككت في قراها الأصلية وأُعيد بناؤها هنا. وقد أُسس المتحف عام 1966 بمبادرة
    من عالم الإثنوغرافيا جيورجي تشيتايا.


    ينقسم المسار إلى مناطق يمثل كل منها إقليماً تاريخياً. ففي **كارتلي وكاخيتي** بيوت «داربازي» بموقد
    مركزي وفتحة دخان مدرجة، وإلى جانبها أقبية نبيذ بجرار كفيفري مدفونة في التراب. وفي **سفانيتي** برج
    حجري دفاعي و«ماتشوبي»، تلك الغرفة الواحدة التي كانت الأسرة والماشية تقضيان فيها الشتاء معاً. وفي **سامغريلو
    وغوريا** بيوت خشبية مرفوعة عن الأرض اتقاءً للرطوبة؛ وفي **أدجارا وإيميريتي** مبانٍ خشبية بشرفات عريضة
    وأنظمة مياه داخلية بارعة؛ وفي **خيفسوريتي وتوشيتي** منشآت جبلية من الحجر الجاف رُصّت بلا ملاط.


    ومعظم الدواخل مؤثثة بالكامل بالقدور والسجاد والأسرّة والأدوات، وفي عدة بيوت يشرح حارس كيف كان المكان
    يُستعمل فعلاً على مدار السنة. والمتحف حديقة أيضاً: ظل وأشجار قديمة ودروب هادئة. في الصيف تقل حرارته
    عن حرارة المدينة بعدة درجات، وهذا وحده سبب كافٍ للمجيء، وفي أواخر أكتوبر يصفرّ المنحدر كله.
  tip: >-
    الموقع واسع والدروب تصعد وتنزل مع المنحدر، فالبس حذاءً مريحاً — الكعب العالي بلا فائدة هنا. بعد المطر
    تصير الأرض طينية وتتجمع البرك في بعض المقاطع. ساعتان تغطيان المناطق الرئيسية، وثلاث تغطي كل شيء. احمل
    الماء معك: المقهى داخل الموقع صغير ولا يفتح دائماً. يستمتع الأطفال بالبيوت، لكن دفع عربة الطفل على
    هذه الدروب متعب. الصباح الباكر أو عصر يوم خريفي أفضل الأوقات.
  route: >-
    من وسط المدينة اسلك جادة تشافتشافادزي عبر فاكي، ثم الطريق الصاعد نحو بحيرة السلاحف — نحو عشرين دقيقة
    في زحام عادي. مدخل المتحف على اليمين، على بعد كيلومتر تقريباً قبل البحيرة، ولافتاته واضحة. وعند البوابة
    موقف مجاني قد يمتلئ في عطلات نهاية الأسبوع. الصعود معبّد ومفتوح طوال العام؛ ويتطلب بعض الحذر حين يتجمد
    في الشتاء، لكن سيارة اقتصادية تكفي تماماً. املأ الخزان في جادة تشافتشافادزي أو في أعلى فاكي.
