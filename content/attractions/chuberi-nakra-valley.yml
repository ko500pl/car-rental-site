ka:
  name: ჭუბერი და ნაკრის ხეობა
  short: >-
    სვანეთის დასავლეთი კარიბჭე: ნენსკრისა და ნაკრის მშვიდი ხეობები, ანტიკური ოქროს მონეტების სამაროვანი
    და ორდღიანი ბილიკი უთვირის უღელტეხილზე.
  body: >-
    **ხეობაში, რომელსაც მესტიისკენ მიმავალთა უმეტესობა ისე ჩაუვლის, თავსაც არ მოაბრუნებს, არქეოლოგებმა
    ალექსანდრე მაკედონელის სახელით მოჭრილი ოქროს სტატერები იპოვეს.**


    ჭუბერი ერთი სოფელი კი არა, ათიოდე მეზობელი სოფლის თემია მდინარე ნენსკრის ხეობაში, ზღვის დონიდან დაახლოებით
    1300 მეტრზე; თემის ცენტრი ქვემო მარღია. ზუგდიდი–მესტიის გზიდან ხაიშთან უხვევთ, ხეობა ვიწროვდება და
    მესტიისკენ მიმავალი ნაკადი უკან რჩება.


    ლარილარის სამაროვანზე აღმოჩნდა ძვ. წ. VIII–VII საუკუნეების კრემაციული სამარხები, ასევე ოქროს სტატერები,
    მოჭრილი ალექსანდრე მაკედონელისა და ლისიმაქეს — მაკედონელი სარდლის, შემდგომ თრაკიის მეფის — სახელით.
    მონეტები ყველაზე ძველ სამარხებზე საუკუნეებით გვიანდელია, მაგრამ ორივე ერთსა და იმავეს მოწმობს: ეს
    მიყრუებული ხეობა შორეულ სავაჭრო გზებს უკავშირდებოდა.


    ნაკრა აღმოსავლეთით, მეზობელ ხეობაშია. მანქანით იქ ენგურის ხეობაში ჩასვლით და ხელახლა ამოსვლით მიხვალთ,
    ფეხით კი — უთვირის უღელტეხილის (2714 მ) გადავლით: ნენსკრაზე გადებული ხიდიდან დაწყებული მარკირებული
    ბილიკი 30 კილომეტრია და ორ დღეს მოითხოვს. ჯერ ხშირ წიწვოვან ტყეში მიიკლაკნება, მერე ფოთლოვანში, ბოლოს
    ალპურ მდელოებზე გადის, სადაც უღელტეხილთან დეკა ხარობს; ზემოდან, ტურიზმის ეროვნული ადმინისტრაციის თქმით,
    თითქმის მთელი სვანეთი მოჩანს. ნაკრაში განახლებული მინერალური წყაროა, რომლის წყალსაც ადგილობრივები
    კუჭის სნეულებათა წამლად მიიჩნევენ.


    ხეობის მომავალზე აქ ერთი აზრი არ არსებობს. ნენსკრის ჰესის დიდი პროექტი, რომელიც დასრულების შემთხვევაში
    ზემო ნენსკრის ხეობის დიდ ნაწილს დატბორავს, სოფლებს ორად ყოფს: ზოგი მას ეწინააღმდეგება, ზოგი სამუშაო
    ადგილებს ელის. ჭუბერის სიჩუმე ნამდვილია — ზემო ნენსკრისთვის კი, შესაძლოა, სამუდამო არ იყოს.
  tip: >-
    ჭუბერის სოფლებშიც და ნაკრაშიც ოჯახური სასტუმროებია, ჭუბერში პატარა მაღაზიაც არის; დანარჩენი თან იქონიეთ.
    უთვირის ბილიკი ივლისიდან სექტემბრამდე გაიარეთ — ივლისის დასაწყისშიც უღელტეხილთან თოვლი შეიძლება დაგხვდეთ.
    უმეტესობისთვის ეს ორდღიანი გზაა და არა ერთდღიანი: ღამისთევა დაგეგმეთ, კარავი ან გამყოლი წინასწარ მოიძიეთ.
    ზემო ტყეებში დათვი და მგელი ბინადრობს — საკვები დახურულად შეინახეთ და მარტო ნუ ილაშქრებთ. საწვავი
    ზუგდიდში ჩაასხით.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით ზუგდიდამდე დაახლოებით 320 კილომეტრია, შემდეგ შ7-ით ჩრდილოეთით, ჯვრისა
    და ენგურის კაშხლის გავლით, ხეობას აუყევით. ჭუბერისთვის ხაიშში (თბილისიდან დაახლოებით 384 კმ) ნენსკრის
    ხეობისკენ გადაუხვიეთ და მდინარეს კიდევ 11 კილომეტრი მიჰყევით ქვემო მარღამდე. ნაკრისთვის შ7-ით ხაიშის
    შემდეგ კიდევ დაახლოებით 24 კილომეტრი იარეთ და ხუთკილომეტრიან გვერდით გზაზე გადაუხვიეთ — ვიწროზე და
    ნაწილობრივ მოუასფალტებელზე. თბილისიდან ნაკრამდე 413 კილომეტრი და დაახლოებით რვა საათია; ჭუბერიდან
    ნაკრამდე გზით — 34 კილომეტრი, საათამდე. ჩვეულებრივი მანქანა ხაიშამდე უპრობლემოდ ავა, გვერდითი ხეობებისთვის
    კი ჯიპს გირჩევთ.
en:
  name: Chuberi and the Nakra Valley
  short: >-
    Svaneti's quiet western gateway: the Nenskra and Nakra valleys, a burial ground that yielded ancient
    gold, and a two-day trail over the Utviri Pass.
  body: >-
    **Gold staters struck in the name of Alexander the Great were dug up in a valley that most drivers
    bound for Mestia flash past without a glance.**


    Chuberi is not one village but a community of about ten, strung along the Nenskra river at roughly
    1,300 metres, with Kvemo Marghi at its centre. You leave the Zugdidi–Mestia road at Khaishi; the gorge
    narrows, and the traffic heading for Mestia is left behind.


    At the Larilari burial ground archaeologists found cremation burials of the 8th–7th centuries BC,
    and gold staters minted in the names of Alexander the Great and of Lysimachus, the Macedonian general
    who became king of Thrace. The coins are centuries younger than the oldest graves, yet both say the
    same thing: this remote valley was linked to long-distance trade.


    Nakra lies in the next valley to the east. By car you drop back to the Enguri and climb again; on
    foot you cross the Utviri Pass (2,714 m) on a marked 30-km, two-day trail that starts at the bridge
    over the Nenskra. It winds through dense conifers, then broadleaf woods, then alpine meadow where
    rhododendron grows below the pass — and from the top, says the national tourism board, you see almost
    the whole of Svaneti. In Nakra a renovated mineral spring draws locals who trust its water with any
    stomach complaint.


    Not everyone here agrees on the future. The Nenskra hydropower project, which once finished would
    flood much of the upper Nenskra valley, has divided the villages: some oppose it, others want the
    jobs. Chuberi's quiet is real — and, for the upper Nenskra at least, it may not last.
  tip: >-
    Both the Chuberi villages and Nakra have family guesthouses, and Chuberi has a small shop; bring everything
    else. Walk the Utviri trail between July and September — even in early July there can be snow near
    the pass. For most walkers this is two days, not one: plan the overnight and arrange a tent or a guide
    in advance. Bears and wolves live in the upper forests, so keep food sealed and do not hike alone.
    Fill up in Zugdidi.
  route: >-
    From Tbilisi take the S1 (E60) to Zugdidi, about 320 km, then the Sh7 north past Jvari and the Enguri
    dam into the gorge. For Chuberi, turn off at Khaishi (about 384 km from Tbilisi) and follow the Nenskra
    11 km up to Kvemo Marghi. For Nakra, stay on the Sh7 some 24 km beyond Khaishi, then take the narrow,
    partly unpaved 5-km side road. Nakra is 413 km and about eight hours from Tbilisi; by road it lies
    34 km, under an hour, from Chuberi. Any car reaches Khaishi easily; an SUV is the honest choice for
    the side valleys.
ru:
  name: Чубери и долина Накры
  short: >-
    Тихий западный вход в Сванетию: долины Ненскры и Накры, могильник, подаривший археологам античное
    золото, и двухдневная тропа через перевал Утвири.
  body: >-
    **Золотые статеры, отчеканенные от имени Александра Македонского, нашли в долине, мимо которой большинство
    едущих в Местиа проносятся, даже не повернув головы.**


    Чубери — не одно село, а община примерно из десяти селений, растянувшихся вдоль реки Ненскры на высоте
    около 1300 метров; центр её — Квемо-Марги. С дороги Зугдиди — Местиа вы сворачиваете у Хаиши, ущелье
    сужается, и поток машин на Местиа остаётся позади.


    На могильнике Ларилари археологи нашли кремационные погребения VIII–VII веков до н. э., а также золотые
    статеры, отчеканенные от имени Александра Македонского и Лисимаха — македонского полководца, ставшего
    царём Фракии. Монеты на века моложе древнейших могил, но и те и другие говорят об одном: эта глухая
    долина была связана с дальней торговлей.


    Накра лежит в соседней долине, к востоку. На машине туда приходится спуститься к Ингури и снова подняться;
    пешком же вы переходите перевал Утвири (2714 м) по маркированной тропе длиной 30 км, рассчитанной
    на два дня, — она начинается у моста через Ненскру. Тропа петляет сперва в густом хвойном лесу, потом
    в лиственном, потом выходит на альпийские луга, где под перевалом растёт рододендрон, — а с вершины,
    по словам Национальной администрации туризма, видна почти вся Сванетия. В Накре есть обновлённый минеральный
    источник: местные верят, что его вода помогает при любых недугах желудка.


    О будущем здесь нет единого мнения. Проект ГЭС «Ненскра», после завершения которого вода затопит бóльшую
    часть верхней долины Ненскры, расколол сёла: одни против, другие ждут рабочих мест. Тишина Чубери
    настоящая — но для верхней Ненскры, возможно, недолговечная.
  tip: >-
    Семейные гостевые дома есть и в сёлах Чубери, и в Накре, а в Чубери — маленький магазин; всё остальное
    везите с собой. Идти по тропе через Утвири стоит с июля по сентябрь — даже в начале июля у перевала
    может лежать снег. Для большинства это два дня пути, а не один: продумайте ночёвку и заранее договоритесь
    о палатке или гиде. В верхних лесах живут медведи и волки, поэтому храните еду в герметичной упаковке
    и не ходите в одиночку. Заправьтесь в Зугдиди.
  route: >-
    Из Тбилиси по S1 (E60) до Зугдиди — около 320 км, затем по Sh7 на север, через Джвари и мимо Ингурской
    плотины, в ущелье. В Чубери сворачивайте у Хаиши (около 384 км от Тбилиси) и поднимайтесь вдоль Ненскры
    ещё 11 км до Квемо-Марги. В Накру — оставайтесь на Sh7 ещё примерно 24 км после Хаиши, затем сверните
    на узкую, местами грунтовую пятикилометровую боковую дорогу. До Накры от Тбилиси 413 км и около восьми
    часов; от Чубери по дороге до неё 34 км, меньше часа. До Хаиши легко доедет любая машина; для боковых
    долин честный выбор — внедорожник.
fa:
  name: چوبری و درهٔ ناکرا
  short: >-
    دروازهٔ آرام غربی سوانتی: دره‌های ننسکرا و ناکرا، گورستانی که طلای باستانی از آن بیرون آمد، و مسیری
    دوروزه از روی گردنهٔ اوتویری.
  body: >-
    **سکه‌های طلایی که به نام اسکندر مقدونی ضرب شده بودند، در دره‌ای از خاک بیرون آمدند که بیشتر رانندگانِ
    راهیِ مستیا بی‌آنکه نگاهی بیندازند از کنارش می‌گذرند.**


    چوبری یک روستا نیست، بلکه مجموعه‌ای از حدود ده آبادی است که در ارتفاع نزدیک به ۱,۳۰۰ متر در امتداد
    رود ننسکرا کشیده شده‌اند؛ مرکزشان کْوِمو مارغی است. در خائیشی از جادهٔ زوگدیدی–مستیا جدا می‌شوید،
    تنگه باریک‌تر می‌شود و ترافیکِ رو به مستیا پشت سر می‌ماند.


    باستان‌شناسان در گورستان لاریلاری گورهایی با مردگانِ سوزانده از سده‌های هشتم تا هفتم پیش از میلاد
    یافتند، و نیز سکه‌های طلای استاتر که به نام اسکندر مقدونی و لوسیماخوس — سردار مقدونی‌ای که پادشاه
    تراکیه شد — ضرب شده بودند. سکه‌ها چند سده از کهن‌ترین گورها جوان‌ترند، اما هر دو یک چیز می‌گویند:
    این درهٔ دورافتاده به تجارت راه‌های دور پیوند داشت.


    ناکرا در درهٔ همسایه، در شرق، است. با خودرو باید تا انگوری پایین بروید و دوباره بالا بیایید؛ پیاده
    اما از گردنهٔ اوتویری (۲,۷۱۴ متر) می‌گذرید، از مسیری نشانه‌گذاری‌شده به طول ۳۰ کیلومتر و دو روز راه
    که از پل روی ننسکرا آغاز می‌شود. راه نخست از میان جنگل انبوه سوزنی‌برگ می‌پیچد، سپس از جنگل پهن‌برگ،
    و سرانجام به چمنزارهای آلپی می‌رسد که زیر گردنه رودودندرون در آن می‌روید؛ و به گفتهٔ سازمان ملی گردشگری
    گرجستان، از بالای گردنه تقریباً تمام سوانتی پیداست. در ناکرا چشمهٔ آب معدنی نوسازی‌شده‌ای هست که مردم
    محل آبش را برای هر ناخوشی معده‌ای کارساز می‌دانند.


    دربارهٔ آینده، اینجا همه هم‌نظر نیستند. طرح نیروگاه برق‌آبی ننسکرا، که در صورت تکمیل بخش بزرگی از
    درهٔ بالایی ننسکرا را زیر آب خواهد برد، روستاها را دو دسته کرده است: برخی مخالف‌اند و برخی چشم به
    فرصت‌های شغلی‌اش دارند. سکوت چوبری واقعی است — اما دست‌کم برای ننسکرای بالایی، شاید پایدار نماند.
  tip: >-
    هم در روستاهای چوبری و هم در ناکرا مهمان‌خانه‌های خانوادگی هست و در چوبری یک مغازهٔ کوچک؛ باقی را
    خودتان بیاورید. مسیر اوتویری را میان ژوئیه و سپتامبر بپیمایید — حتی اوایل ژوئیه ممکن است نزدیک گردنه
    برف باشد. برای بیشتر پیاده‌روها این راه دو روز طول می‌کشد، نه یک روز: شب‌مانی را برنامه‌ریزی کنید
    و چادر یا راهنما را از پیش فراهم کنید. در جنگل‌های بالادست خرس و گرگ زندگی می‌کنند، پس خوراک را دربسته
    نگه دارید و تنها راه نیفتید. در زوگدیدی باک را پر کنید.
  route: >-
    از تفلیس با S1 (E60) تا زوگدیدی حدود ۳۲۰ کیلومتر است؛ سپس Sh7 را رو به شمال بگیرید و از جواری و کنار
    سد انگوری وارد تنگه شوید. برای چوبری در خائیشی (حدود ۳۸۴ کیلومتر از تفلیس) بپیچید و ۱۱ کیلومتر دیگر
    در امتداد ننسکرا تا کْوِمو مارغی بالا بروید. برای ناکرا پس از خائیشی حدود ۲۴ کیلومتر دیگر روی Sh7
    بمانید، سپس وارد جادهٔ فرعی باریک و بخشی خاکیِ ۵ کیلومتری شوید. ناکرا ۴۱۳ کیلومتر و حدود هشت ساعت
    از تفلیس فاصله دارد؛ از چوبری از راه جاده ۳۴ کیلومتر و کمتر از یک ساعت است. هر خودرویی به‌راحتی تا
    خائیشی می‌رسد؛ برای دره‌های فرعی، انتخاب صادقانه خودروی شاسی‌بلند است.
he:
  name: צ'וברי ועמק נאקרה
  short: >-
    שער הכניסה המערבי והשקט של סוואנטי: עמקי ננסקרה ונאקרה, בית קברות עתיק שהניב זהב, ושביל של יומיים
    דרך מעבר אוטבירי.
  body: >-
    **מטבעות זהב שנטבעו בשמו של אלכסנדר מוקדון נחשפו בעמק שרוב הנוסעים למסטיה חולפים על פניו בלי להפנות
    מבט.**


    צ'וברי אינה כפר אחד אלא קהילה של כעשרה כפרים, הפרושים לאורך נהר הננסקרה בגובה של כ-1,300 מטר; מרכזה
    הוא קבמו מרגי. בחאישי יורדים מכביש זוגדידי–מסטיה, הערוץ נעשה צר, והתנועה בדרך למסטיה נשארת מאחור.


    בבית הקברות של לארילארי מצאו ארכאולוגים קבורות שריפה מן המאות ה-8–7 לפני הספירה, וכן מטבעות זהב מסוג
    סטטר שנטבעו בשמם של אלכסנדר מוקדון ושל ליסימכוס, המצביא המוקדוני שנעשה מלך תרקיה. המטבעות צעירים במאות
    שנים מן הקברים הקדומים ביותר, אבל שניהם מעידים על אותו דבר: העמק הנידח הזה היה קשור למסחר למרחקים
    ארוכים.


    נאקרה שוכנת בעמק הסמוך ממזרח. במכונית יורדים חזרה אל האנגורי ועולים שוב; ברגל חוצים את מעבר אוטבירי
    (2,714 מ') בשביל מסומן של 30 ק״מ ויומיים הליכה, שמתחיל בגשר שעל הננסקרה. הוא מתפתל ביער מחטניים צפוף,
    אחר כך ביער רחבי-עלים, ולבסוף באחו אלפיני שבו גדל רודודנדרון מתחת למעבר — ומן הפסגה, כך אומרת מינהלת
    התיירות הלאומית, נשקפת כמעט כל סוואנטי. בנאקרה יש מעיין מינרלי משופץ, ותושבי המקום סומכים על מימיו
    שירפאו כל מיחוש בקיבה.


    לא כולם כאן מסכימים על העתיד. פרויקט תחנת הכוח ההידרואלקטרית ננסקרה, שעם השלמתו יציף חלק גדול מעמק
    הננסקרה העליון, פילג את הכפרים: יש המתנגדים לו, ויש המייחלים למקומות העבודה. השקט של צ'וברי אמיתי
    — אבל לפחות בננסקרה העליון, ייתכן שלא יימשך.
  tip: >-
    גם בכפרי צ'וברי וגם בנאקרה יש בתי הארחה משפחתיים, ובצ'וברי יש מכולת קטנה; את כל השאר הביאו איתכם.
    צאו לשביל אוטבירי בין יולי לספטמבר — גם בתחילת יולי עלול להיות שלג ליד המעבר. לרוב המטיילים זו הליכה
    של יומיים, לא של יום אחד: תכננו את הלינה בדרך ודאגו מראש לאוהל או למדריך. ביערות העליונים חיים דובים
    וזאבים, לכן שמרו את האוכל אטום ואל תצאו לבד. תדלקו בזוגדידי.
  route: >-
    מטביליסי סעו בכביש S1 (E60) עד זוגדידי, כ-320 ק״מ, ומשם בכביש Sh7 צפונה, דרך ג'וארי ועל פני סכר אנגורי,
    אל תוך הערוץ. לצ'וברי פנו בחאישי (כ-384 ק״מ מטביליסי) ועלו לאורך הננסקרה עוד 11 ק״מ עד קבמו מרגי.
    לנאקרה המשיכו ב-Sh7 עוד כ-24 ק״מ אחרי חאישי, ואז פנו לדרך צדדית צרה של 5 ק״מ, סלולה רק בחלקה. נאקרה
    נמצאת 413 ק״מ וכשמונה שעות נסיעה מטביליסי; ומצ'וברי המרחק אליה בכביש הוא 34 ק״מ, פחות משעה. כל רכב
    יגיע בקלות עד חאישי; לעמקים הצדדיים הבחירה הכנה היא רכב שטח.
ar:
  name: تشوبيري ووادي ناكرا
  short: 'بوابة سفانيتي الغربية الهادئة: واديا نينسكرا وناكرا، ومقبرة أخرجت ذهباً عتيقاً، ودرب يومين عبر
    ممر أوتفيري.'
  body: >-
    **عُثر على ستاتيرات ذهبية ضُربت باسم الإسكندر الأكبر في وادٍ يمرّ به معظم المتجهين إلى ميستيا مسرعين
    دون أن يلتفتوا إليه.**


    تشوبيري ليست قرية واحدة، بل تجمّع من نحو عشر قرى تمتد على طول نهر نينسكرا على ارتفاع 1,300 متر تقريباً،
    ومركزها كفيمو مارغي. عند خائيشي تغادر طريق زوغديدي–ميستيا، فيضيق المضيق وتبقى حركة السير المتجهة إلى
    ميستيا خلفك.


    في مقبرة لاريلاري وجد علماء الآثار مدافن حرق للموتى تعود إلى القرنين الثامن والسابع قبل الميلاد، إلى
    جانب ستاتيرات ذهبية ضُربت باسم الإسكندر الأكبر وباسم ليسيماخوس، القائد المقدوني الذي صار ملكاً على
    تراقيا. والعملات أحدث من أقدم القبور بقرون، لكنّ كلاً منهما يشهد بالأمر نفسه: هذا الوادي النائي كان
    مرتبطاً بتجارة المسافات البعيدة.


    تقع ناكرا في الوادي المجاور شرقاً. بالسيارة تنزل مجدداً إلى إنغوري ثم تصعد من جديد؛ أما سيراً فتعبر
    ممر أوتفيري (2,714 م) على درب معلَّم طوله 30 كم يستغرق يومين، يبدأ عند الجسر على نهر نينسكرا. يتلوّى
    الدرب أولاً في غابة صنوبرية كثيفة، ثم في غابة عريضة الأوراق، ثم في مروج ألبية ينمو فيها الرودودندرون
    تحت الممر — ومن القمة، كما تقول الهيئة الوطنية للسياحة، تنكشف سفانيتي كلها تقريباً. وفي ناكرا نبع
    مياه معدنية مُجدَّد، يثق الأهالي بمائه لعلاج أي شكوى في المعدة.


    لا يتفق الجميع هنا على المستقبل. فمشروع محطة نينسكرا الكهرومائية، الذي سيُغرق عند اكتماله جزءاً كبيراً
    من أعالي وادي نينسكرا، قسم القرى: بعضها يعارضه، وبعضها ينتظر فرص العمل. هدوء تشوبيري حقيقي — لكنه،
    في أعالي نينسكرا على الأقل، قد لا يدوم.
  tip: >-
    في قرى تشوبيري وفي ناكرا بيوت ضيافة عائلية، وفي تشوبيري متجر صغير؛ أما ما عدا ذلك فأحضره معك. امشِ
    درب أوتفيري بين يوليو وسبتمبر، فحتى في أوائل يوليو قد يبقى الثلج قرب الممر. هذه لمعظم المشّائين مسيرة
    يومين لا يوم واحد: خطّط للمبيت ورتّب مسبقاً خيمة أو مرشداً. تعيش الدببة والذئاب في الغابات العليا،
    فاحفظ الطعام في عبوات محكمة ولا تمشِ وحدك. املأ خزان الوقود في زوغديدي.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) إلى زوغديدي، نحو 320 كم، ثم الطريق Sh7 شمالاً عبر جفاري بمحاذاة سد
    إنغوري إلى داخل المضيق. للوصول إلى تشوبيري انعطف عند خائيشي (نحو 384 كم من تبليسي) واتبع نهر نينسكرا
    صعوداً 11 كم حتى كفيمو مارغي. وللوصول إلى ناكرا ابقَ على Sh7 نحو 24 كم بعد خائيشي، ثم خذ الطريق الجانبي
    الضيق غير المعبّد جزئياً بطول 5 كم. تبعد ناكرا عن تبليسي 413 كم ونحو ثماني ساعات، وعن تشوبيري بالطريق
    34 كم، أي أقل من ساعة. أي سيارة تبلغ خائيشي بسهولة؛ أما للوديان الجانبية فالخيار الصادق سيارة دفع
    رباعي.
