ka:
  name: ქუთაისის კოლხური ბოტანიკური ბაღი
  short: >-
    ტერასებად გაშენებული ბაღი ბაგრატის ტაძართან ახლოს, სადაც აღმოსავლეთაზიური სახეობები კავკასიურს თითქმის
    ცხრაჯერ აჭარბებს, ოთხასწლოვან მუხაში კი სამლოცველოა.
  body: >-
    **ქუთაისის ყველაზე უჩვეულო სამლოცველო ქვით არ არის ნაგები — ის ოთხასი წლის მუხის ტანშია მოწყობილი.**


    ბაღი რამდენიმე ბუნებრივ ტერასაზეა გაშენებული ჭომის უბანში, ბაგრატის ტაძრიდან რამდენიმე წუთის სავალზე,
    რიონის მარჯვენა სანაპიროზე, ზღვის დონიდან დაახლოებით 150 მეტრზე — იქ, სადაც კოლხეთის დაბლობი აღმოსავლეთით
    თავდება. მისი ფესვები 1840 წლამდე მიდის, როცა აქ „ფერმის ბაღი“ გააშენეს — იმერეთში ერთ-ერთი პირველი
    ადგილი, სადაც უცხო ხეებს ცდიდნენ. ადგილობრივი გადმოცემა, რომელსაც ტურიზმის ეროვნული ადმინისტრაციაც
    იმეორებს, ბაღის დასაბამს იაკობ (ჯეიმს) მარს უკავშირებს — ბრიტანელ მებაღეს, რომელიც კავკასიაში 1822
    წელს ჩამოვიდა; მისი ქუთაისში დაბადებული ვაჟი, ნიკოლოზ მარი, ცნობილი და მეტად სადავო ენათმეცნიერი გახდა.
    სამეცნიერო ბოტანიკური ბაღი აქ 1969 წელს შეიქმნა.


    აქ რაც იზრდება, გარეთა ტყეს გააოცებდა. კოლექციაში ხეების, ბუჩქებისა და ლიანების 578 სახეობაა; ყვავილოვანთაგან
    ნახევარზე მეტი აღმოსავლეთ აზიიდან და ჰიმალაიდანაა, 115 — ჩრდილოეთ ამერიკიდან, კავკასიური კი სულ 34.
    ბილიკებს მაგნოლიები და კორპის მუხები ჩრდილავს, 160 მარადმწვანე სახეობის წყალობით კი ბაღი იანვარშიც
    მწვანეა.


    მუხის სამლოცველო საქართველოს მართლმადიდებელი ეკლესიის ლოცვა-კურთხევით 2014 წლის იანვარში გაიხსნა.
    შიგნით ერთდროულად სამი ადამიანი ეტევა: ხატი, სანთლები და ირგვლივ, ხელის გაწვდენაზე, მუხის ძარღვიანი
    კედლები. ბოლო განახლებისას ბილიკებს მყარი საფარი დაედო, გაჩნდა ხელოვნური აუზები და შადრევნები, ცენტრში
    კი ამფითეატრია, სადაც კონცერტები, წარმოდგენები და კინოჩვენებები იმართება.


    ბორცვს ბაგრატის ტაძარი აგვირგვინებს. ქალაქის ყველაზე პატარა სალოცავი კი აქ, დაბლაა — და მუხისგანაა.
  tip: >-
    ნელი სეირნობისთვის ერთი საათი საკმარისია. შესასვლელთან მცირე საფასური იხდება. განახლების შემდეგ მთავარი
    ბილიკები მყარი საფარითაა, ამიტომ ეტლით ან ბავშვის ურიკით ბაღის უმეტესი ნაწილი გაივლება, თუმცა ტერასებს
    შორის აღმართ-დაღმართებია. მუხის სამლოცველოში ერთდროულად მხოლოდ სამი ადამიანი ეტევა: რიგს მშვიდად დაელოდეთ,
    ეკლესიისთვის შესაფერისად ჩაიცვით და ფლეში გამორთეთ. საუკეთესო დრო გაზაფხულია, როცა მაგნოლიები ყვავის;
    ივლისში კი მარტო ჩრდილიც ღირს მოსვლად. ამფითეატრის პროგრამას წინასწარ გადახედეთ — საღამოს კონცერტი
    ხეების ქვეშ ქუთაისის ყველაზე ნაზი სახეა.
  route: >-
    თბილისიდან S1 (E60) მაგისტრალით დასავლეთისკენ დაახლოებით 205 კილომეტრი იარეთ, მერე ქუთაისისკენ გადაუხვიეთ
    და ცენტრისკენ აიღეთ გეზი — სულ დაახლოებით 232 კმ და 3 სთ 25 წთ. ორიენტირად ბაგრატის ტაძარი აირჩიეთ:
    ბაღი მისგან რამდენიმე წუთის სავალზეა, ჭომის უბანში, კონსტანტინე ლესელიძის ქუჩა №2-ში. ირგვლივ ქუჩები
    ვიწრო და დაქანებულია, ამიტომ ჯობს, მანქანა ერთი კვარტლით ადრე დატოვოთ და ბოლო მონაკვეთი ფეხით გაიაროთ.
    საწვავი ქუთაისში ყველგან იშოვება. ეკონომკლასის მანქანა სავსებით საკმარისია.
en:
  name: Kutaisi Colchic Botanical Garden
  short: >-
    A terraced garden near Bagrati where East Asian species outnumber Caucasian ones almost nine to one,
    and a tiny chapel hides inside a 400-year-old oak.
  body: >-
    **Kutaisi's most unusual chapel is not built of stone: it sits inside the trunk of a four-hundred-year-old
    oak.**


    The garden spreads over a few natural terraces in the Choma quarter, a few minutes' walk from Bagrati
    Cathedral, on the right bank of the Rioni, at about 150 metres above sea level, where the Colchic
    lowland runs out to the east. Its roots go back to 1840, when a "farm garden" was planted here, one
    of the first places in Imereti where exotic trees were tried. Local tradition, repeated by Georgia's
    tourism board, links its beginnings to Iakob (James) Marr, a British horticulturist who came to the
    Caucasus in 1822; his Kutaisi-born son Nikolai grew up to be a famous and much-disputed linguist.
    A scientific botanical garden was founded on the site in 1969.


    What grows here would puzzle the forest outside. The collection counts 578 species of trees, shrubs
    and climbers; of the flowering ones, more than half come from East Asia and the Himalaya, 115 from
    North America, and only 34 from the Caucasus. Magnolias and cork oaks shade the paths, and with 160
    evergreen species the garden stays green even in January.


    The oak chapel was blessed by the Georgian Orthodox Church and opened in January 2014. It holds three
    people at a time: an icon, candles, and the grain of the wood close on every side. A recent renovation
    paved the paths and added pools and fountains, and an amphitheatre at the centre hosts concerts, performances
    and film screenings.


    Bagrati crowns the hill above. The city's smallest sanctuary is down here, and it is made of oak.
  tip: >-
    An hour covers the garden at a stroll. There is a small entrance fee at the gate. Since the renovation
    the main paths are paved, so pushchairs and wheelchairs manage most of it, though the terraces bring
    some slopes. The oak chapel takes only three people at once: wait your turn quietly, dress as you
    would for any church, and keep the flash off. Spring, when the magnolias flower, is the finest season;
    in July the shade alone is worth the visit. Check the amphitheatre programme before you come: an evening
    concert under the trees is Kutaisi at its gentlest.
  route: >-
    From Tbilisi take the S1 (E60) west for about 205 km, then leave at the Kutaisi turn-off and head
    for the centre: about 232 km and 3 h 25 min in all. Use Bagrati Cathedral as your landmark; the garden
    is a few minutes from it in the Choma district, at 2 Konstantine Leselidze Street. The surrounding
    streets are narrow and steep, so it is easier to park a block away and walk the last few minutes.
    Fuel is easy to find anywhere in Kutaisi. An economy car is all you need.
ru:
  name: Кутаисский Колхидский ботанический сад
  short: >-
    Террасный сад у Баграти: восточноазиатских видов здесь почти вдевятеро больше кавказских, а в четырёхсотлетнем
    дубе спрятана часовня.
  body: >-
    **Самая необычная часовня Кутаиси построена не из камня — она находится внутри ствола четырёхсотлетнего
    дуба.**


    Сад раскинулся на нескольких природных террасах в квартале Чома, в нескольких минутах ходьбы от собора
    Баграти, на правом берегу Риони, на высоте около 150 метров над уровнем моря, там, где Колхидская
    низменность заканчивается на востоке. Его корни уходят к 1840 году, когда здесь заложили «фермерский
    сад» — одно из первых мест в Имеретии, где испытывали экзотические деревья. Местное предание, которое
    повторяет и Национальная туристическая администрация Грузии, связывает его начало с Иаковом (Джеймсом)
    Марром, британским садоводом, приехавшим на Кавказ в 1822 году; его сын Николай, родившийся в Кутаиси,
    стал известным и весьма спорным лингвистом. Научный ботанический сад был основан здесь в 1969 году.


    То, что растёт здесь, удивило бы окружающий лес. Коллекция насчитывает 578 видов деревьев, кустарников
    и лиан; среди цветковых больше половины родом из Восточной Азии и Гималаев, 115 — из Северной Америки
    и только 34 — с Кавказа. Магнолии и пробковые дубы затеняют дорожки, а благодаря 160 вечнозелёным
    видам сад остаётся зелёным даже в январе.


    Дубовая часовня была освящена Грузинской православной церковью и открылась в январе 2014 года. В ней
    могут находиться одновременно три человека: икона, свечи и со всех сторон, на расстоянии вытянутой
    руки, — узор дубовой древесины. После недавней реконструкции дорожки получили твёрдое покрытие, появились
    пруды и фонтаны, а в амфитеатре в центре сада проходят концерты, спектакли и кинопоказы.


    Баграти венчает холм наверху. А самая маленькая святыня города — здесь, внизу, и она из дуба.
  tip: >-
    Часа хватит на прогулку по саду. У входа небольшая плата. После реконструкции главные дорожки получили
    твёрдое покрытие, так что коляска и инвалидное кресло проедут почти везде, хотя между террасами есть
    подъёмы и спуски. В дубовую часовню одновременно входят только три человека: спокойно ждите своей
    очереди, оденьтесь как для любой церкви и выключите вспышку. Весна, когда цветут магнолии, — лучший
    сезон; в июле стоит прийти хотя бы ради тени. Проверьте программу амфитеатра перед визитом: вечерний
    концерт под деревьями — самая нежная сторона Кутаиси.
  route: >-
    Из Тбилиси по трассе S1 (E60) на запад около 205 км, затем на съезде на Кутаиси — в сторону центра:
    всего около 232 км и 3 ч 25 мин. Ориентируйтесь на собор Баграти; сад в нескольких минутах от него,
    в районе Чома, на улице Константина Леселидзе, дом 2. Окружающие улицы узкие и крутые, так что проще
    оставить машину за квартал и пройти последние минуты пешком. Заправки легко найти по всему Кутаиси.
    Машины эконом-класса достаточно.
fa:
  name: باغ گیاه‌شناسی کلخیدی کوتایسی
  short: >-
    باغی پلکانی نزدیک باگراتی که گونه‌های شرق آسیا در آن نزدیک به نُه برابر گونه‌های قفقازی‌اند، و نمازخانه‌ای
    کوچک درون بلوطی چهارصدساله پنهان است.
  body: >-
    **نامتعارف‌ترین نمازخانهٔ کوتایسی از سنگ ساخته نشده - درون تنهٔ بلوطی چهارصدساله جای گرفته است.**


    این باغ بر چند تراسِ طبیعی در محلهٔ چوما گسترده است، چند دقیقه پیاده‌روی از کلیسای جامع باگراتی، بر
    کرانهٔ راست رود ریونی، در ارتفاع نزدیک به ۱۵۰ متری از سطح دریا، جایی که دشت کلخیس در شرق به پایان
    می‌رسد. ریشه‌های آن به سال ۱۸۴۰ می‌رسد، هنگامی که «باغی کشاورزی» در این‌جا کاشته شد - یکی از نخستین
    جاهای ایمرتی که در آن درختان غیربومی را می‌آزمودند. روایت محلی، که سازمان گردشگری ملی گرجستان نیز
    تکرارش می‌کند، آغاز آن را به یعقوب (جیمز) مار پیوند می‌دهد، باغبانی بریتانیایی که در سال ۱۸۲۲ به قفقاز
    آمد؛ فرزندش نیکولای، که در کوتایسی زاده شد، زبان‌شناسی مشهور و بسیار بحث‌برانگیز شد. باغ گیاه‌شناسی
    علمی در سال ۱۹۶۹ در این محل بنیاد گذاشته شد.


    آن‌چه این‌جا می‌روید، جنگل بیرون را به‌شگفتی می‌انداخت. مجموعه ۵۷۸ گونه از درختان، بوته‌ها و بالارونده‌ها
    را در بر دارد؛ از میان گونه‌های گلدار، بیش از نیمی از شرق آسیا و هیمالیا می‌آیند، ۱۱۵ گونه از آمریکای
    شمالی، و تنها ۳۴ گونه از قفقاز. ماگنولیاها و بلوط‌های چوب‌پنبه‌ای بر مسیرها سایه می‌افکنند، و به‌یاری
    ۱۶۰ گونهٔ همیشه‌سبز، باغ حتی در ژانویه سبز می‌ماند.


    نمازخانهٔ درون بلوط به دست کلیسای ارتدکس گرجستان تبرک شد و در ژانویهٔ ۲۰۱۴ گشوده شد. در آن هم‌زمان
    سه نفر جای می‌گیرند: شمایلی، شمع‌هایی، و از هر سو رگه‌های چوب بلوط. بازسازی اخیر مسیرها را سنگ‌فرش
    کرد و برکه‌ها و فواره‌هایی افزود، و آمفی‌تئاتری در مرکز باغ کنسرت‌ها، اجراها و نمایش فیلم را در خود
    جای می‌دهد.


    بالای تپه، باگراتی چون تاجی نشسته است. اما کوچک‌ترین پرستشگاه شهر این‌جا در پایین است - و از بلوط
    ساخته شده.
  tip: >-
    یک ساعت برای گشتی آرام در باغ کافی است. دم درِ ورودی هزینهٔ کمی گرفته می‌شود. پس از بازسازی، مسیرهای
    اصلی سنگ‌فرش شده‌اند، پس کالسکه و ویلچر بیشتر مسیر را طی می‌کنند، هرچند میان تراس‌ها شیب‌هایی هست.
    نمازخانهٔ درون بلوط هم‌زمان تنها سه نفر را می‌پذیرد: آرام در صف بمانید، مثل رفتن به هر کلیسایی لباس
    بپوشید، و فلاش را خاموش کنید. بهار، وقتی ماگنولیاها گل می‌دهند، بهترین فصل است؛ در ژوئیه حتی سایه
    به‌تنهایی ارزش آمدن را دارد. پیش از رفتن برنامهٔ آمفی‌تئاتر را بررسی کنید: کنسرتی شامگاهی زیر درختان،
    لطیف‌ترین چهرهٔ کوتایسی است.
  route: >-
    از تفلیس در بزرگراه S1 (E60) به سوی غرب نزدیک به ۲۰۵ کیلومتر برانید، سپس از خروجی کوتایسی به سوی مرکز
    شهر بروید: در کل نزدیک به ۲۳۲ کیلومتر و ۳ ساعت و ۲۵ دقیقه. کلیسای جامع باگراتی را نشانه بگیرید؛ باغ
    چند دقیقه با آن فاصله دارد، در محلهٔ چوما، خیابان کنستانتینه لِسلیدزه، شمارهٔ ۲. خیابان‌های اطراف
    باریک و پرشیب‌اند، پس بهتر است ماشین را یک بلوک دورتر بگذارید و دقایق آخر را پیاده بروید. سوخت در
    همه‌جای کوتایسی به‌آسانی یافت می‌شود. یک خودروی اقتصادی کاملاً کافی است.
he:
  name: הגן הבוטני הקולכי של קוטאיסי
  short: >-
    גן מדורג סמוך לבגרטי, שבו מינים ממזרח אסיה רבים כמעט פי תשעה מהמינים הקווקזיים, וקפלה קטנטנה מסתתרת
    בתוך אלון בן 400 שנה.
  body: >-
    **הקפלה יוצאת הדופן ביותר בקוטאיסי אינה בנויה מאבן - היא שוכנת בתוך גזע אלון בן ארבע מאות שנה.**


    הגן משתרע על כמה טרסות טבעיות ברובע צ'ומה, דקות הליכה מקתדרלת בגרטי, על הגדה הימנית של נהר ריוני,
    בגובה של כ-150 מטרים מעל פני הים, במקום שבו שפלת קולכיס מגיעה לקצה המזרחי שלה. ראשיתו בשנת 1840, כשנשתל
    כאן "גן חווה", אחד המקומות הראשונים באימרתי שבהם ניסו לגדל עצים אקזוטיים. מסורת מקומית, שגם הרשות
    הלאומית לתיירות של גאורגיה חוזרת עליה, מקשרת את התחלתו ליעקב (ג'יימס) מאר, גנן בריטי שהגיע לקווקז
    ב-1822; בנו ניקולאי, שנולד בקוטאיסי, הפך לבלשן מפורסם ורב-מחלוקת. גן בוטני מדעי נוסד באתר ב-1969.


    מה שצומח כאן היה מפתיע את היער מסביב. האוסף מונה 578 מיני עצים, שיחים ומטפסים; מבין הפורחים, יותר
    ממחצית מגיעים ממזרח אסיה והימלאיה, 115 מצפון אמריקה, ורק 34 מהקווקז. מגנוליות ואלוני שעם מטילים צל
    על השבילים, ועם 160 מינים ירוקי-עד הגן נשאר ירוק אפילו בינואר.


    הקפלה שבאלון נחנכה בברכת הכנסייה האורתודוקסית הגאורגית בינואר 2014. היא מכילה שלושה אנשים בו-זמנית:
    איקונה, נרות, ומכל עבר, במרחק יד, מרקם עץ האלון. שיפוץ שנערך לאחרונה סלל את השבילים והוסיף בריכות
    ומזרקות, ובמרכז אמפיתיאטרון המארח קונצרטים, הופעות והקרנות סרטים.


    למעלה, בגרטי מכתירה את הגבעה. והמקדש הקטן ביותר בעיר נמצא כאן למטה - והוא עשוי אלון.
  tip: >-
    שעה מספיקה להליכה נינוחה בגן. בכניסה תשלום קטן. מאז השיפוץ השבילים המרכזיים סלולים, כך שעגלות תינוק
    וכיסאות גלגלים יכולים לעבור את רוב הגן, אף שבין הטרסות יש שיפועים. הקפלה שבאלון מכילה בו-זמנית רק
    שלושה אנשים: המתינו בתורכם בשקט, התלבשו כמו לכל כנסייה, וכבו את הפלאש. האביב, כשהמגנוליות פורחות,
    הוא העונה הטובה ביותר; ביולי אפילו הצל בלבד שווה את הביקור. בדקו את תוכנית האמפיתיאטרון לפני שתגיעו
    - קונצרט ערב מתחת לעצים הוא קוטאיסי בפניה הרכות ביותר.
  route: >-
    מטביליסי סעו בכביש S1 (E60) מערבה כ-205 ק"מ, ואז פנו ביציאה לקוטאיסי והמשיכו למרכז: בסך הכול כ-232
    ק"מ ו-3 שעות ו-25 דקות. השתמשו בקתדרלת בגרטי כנקודת ציון; הגן במרחק דקות ממנה, ברובע צ'ומה, ברחוב
    קונסטנטינה לסלידזה 2. הרחובות מסביב צרים ותלולים, כך שקל יותר להשאיר את הרכב רחוב אחד לפני ולהמשיך
    ברגל את הדקות האחרונות. דלק זמין בקלות בכל קוטאיסי. רכב חסכוני מספיק.
ar:
  name: حديقة كوتايسي النباتية الكولخيدية
  short: >-
    حديقة مدرّجة قرب باغراتي، تفوق فيها أنواع شرق آسيا الأنواع القوقازية بنحو تسعة أضعاف، وتختبئ كنيسة
    صغيرة داخل بلّوطة عمرها 400 عام.
  body: >-
    **أغرب كنيسة في كوتايسي لم تُبنَ من الحجر - إنها تقوم داخل جذع بلّوطة عمرها أربعمئة عام.**


    تمتد الحديقة على عدة مصاطب طبيعية في حي تشوما، على دقائق سيراً من كاتدرائية باغراتي، على الضفة اليمنى
    لنهر ريوني، على ارتفاع نحو 150 متراً فوق سطح البحر، حيث ينتهي سهل كولخيس شرقاً. تمتد جذورها إلى عام
    1840، حين زُرعت هنا "حديقة مزرعة"، وكانت من أوائل الأماكن في إيميريتي التي جُرّبت فيها أشجار غريبة.
    تربط الرواية المحلية، التي تكرّرها هيئة السياحة الوطنية الجورجية أيضاً، بداياتها بياكوب (جيمز) مار،
    البستاني البريطاني الذي وصل إلى القوقاز عام 1822؛ وابنه نيقولاي، المولود في كوتايسي، صار لغوياً مشهوراً
    وموضع جدل كبير. أُسّست حديقة نباتية علمية في الموقع عام 1969.


    ما ينمو هنا كان ليحيّر الغابة المحيطة. تضمّ المجموعة 578 نوعاً من الأشجار والشجيرات والمتسلّقات؛ ومن
    بين النباتات المزهرة، يأتي أكثر من نصفها من شرق آسيا والهيمالايا، و115 نوعاً من أمريكا الشمالية، ولا
    يزيد عدد الأنواع القوقازية على 34. تظلّل الماغنوليا وأشجار السنديان الفلّيني الممرات، وبفضل 160 نوعاً
    دائم الخضرة تبقى الحديقة خضراء حتى في يناير.


    باركت الكنيسةُ الأرثوذكسية الجورجية الكنيسةَ الصغيرة داخل البلّوطة، وافتُتحت في يناير 2014. تستوعب
    ثلاثة أشخاص في الوقت نفسه: أيقونة، وشموع، ومن كل جانب، على مقربة، عروق خشب البلّوط. أضاف الترميم الأخير
    رصفاً للممرات وبِرَكاً ونوافير، ويستقبل مسرح مكشوف في وسط الحديقة حفلات وعروضاً وعروض أفلام.


    تتوّج كاتدرائية باغراتي التلة في الأعلى. أما أصغر مزار في المدينة فهو هنا، في الأسفل - ومصنوع من البلّوط.
  tip: >-
    تكفي ساعة للتنزّه في الحديقة بهدوء. عند البوابة رسم دخول صغير. منذ الترميم أصبحت الممرات الرئيسية
    معبّدة، فيمكن لعربات الأطفال والكراسي المتحركة عبور معظم الحديقة، مع أن هناك انحدارات بين المصاطب.
    لا تستوعب الكنيسة داخل البلّوطة أكثر من ثلاثة أشخاص في الوقت نفسه: انتظر دورك بهدوء، وارتدِ ما يلائم
    أي كنيسة، وأطفئ الفلاش. الربيع، حين تتفتّح الماغنوليا، هو أفضل الفصول؛ وفي يوليو يكفي الظلّ وحده ليستحق
    الزيارة. تحقّق من برنامج المسرح المكشوف قبل القدوم: حفلة مسائية تحت الأشجار هي أرقّ ما في كوتايسي.
  route: >-
    انطلق من تبليسي غرباً على الطريق السريع S1 (E60) نحو 205 كم، ثم عند مخرج كوتايسي توجّه نحو وسط المدينة:
    الإجمالي نحو 232 كم و3 ساعات و25 دقيقة. اتخذ كاتدرائية باغراتي علامة إرشادية؛ فالحديقة على دقائق منها،
    في حي تشوما، في شارع قسطنطين ليسيليدزه رقم 2. الشوارع المحيطة ضيقة ومنحدرة، فمن الأسهل ترك السيارة
    على بعد شارع والمشي في الدقائق الأخيرة. الوقود متوفر بسهولة في كل أنحاء كوتايسي. سيارة اقتصادية تكفي.
