ka:
  name: ქუთაისის კოლხური ბოტანიკური ბაღი
  short: 1840 წელს დაარსებული ბაღი რიონის ნაპირზე, სადაც ოთხასწლოვან მუხაში პატარა სამლოცველოა გამოკვეთილი.
  body: >-
    **ქუთაისის ბოტანიკური ბაღი 1840 წელს დაარსდა და საქართველოში ერთ-ერთი უძველესია.** ის რიონის ნაპირზე,
    ცენტრალური მოედნიდან დაახლოებით კილომეტრში მდებარეობს — ჯაჭვის ხიდიდან სანაპიროს გაუყევი და მარცხნივ,
    საფიჩხიის მხარეს ახვალ.


    ბაღი თავიდან სანერგედ შეიქმნა: იმერეთის რბილ, ნოტიო კლიმატში სუბტროპიკული სახეობების შეგუებას ცდილობდნენ.
    დღეს აქ ერთმანეთის გვერდით დგას კოლხური ტყის ნამდვილი მკვიდრი — ძელქვა, იმერული მუხა, ბზა — და შემოტანილი
    მაგნოლია, ბამბუკი, კვიპაროსი და წიწვოვნები. ბაღი პატარაა და ერთ საათში მთლიანად შემოივლი; ბილიკები
    ბრტყელია, ჩრდილიც ბევრია, და ხეებზე ციყვები დარბიან.


    ერთი კონკრეტული რამ არის, რის გამოც აქ ჩამოდიან: ოთხასწლოვანი მუხა, რომლის ხმელ ღეროშიც პაწაწინა სამლოცველოა
    გამოკვეთილი. შიგნით ერთი, დიდი-დიდი ორი ადამიანი ეტევა — ხატი, სანთელი და ხის კედლები. ეს არც უძველესი
    სიწმინდეა და არც არქიტექტურული ძეგლი, უბრალოდ იშვიათი და მოულოდნელი რამაა, და ქუთაისელებს ძალიან უყვართ.


    ბაღი ქალაქის ორ სხვა მისამართს კარგად ერწყმის: ბაგრატის ბორცვი ზემოთ ჩანს, ისტორიული მუზეუმი კი მდინარის
    გადაღმა, ათი წუთის სავალზეა. თუ ქუთაისში სამი-ოთხი საათი გაქვს და ტაძრებით უკვე დაიღალე, ეს ის ადგილია,
    სადაც სუნთქვას აღიდგენ.


    გაზაფხულზე მაგნოლიები ყვავილობს და ბაღი საუკეთესო სახითაა; ზაფხულში ჩრდილის გამო ქალაქზე გრილა; შემოდგომაზე
    ფოთოლი ჭრელდება. ზამთარში ბევრი რამ შიშველია, თუმცა მარადმწვანე ნაწილი მაინც რჩება.


    ბაღი ჯერ კიდევ კოლექციაა და არა უბრალოდ პარკი: ეტიკეტებზე ლათინური სახელებია, ნარგავები წარმომავლობის
    მიხედვითაა დაჯგუფებული, ბილიკებზე კი მერხებია გაწყობილი. სამუშაო დღეს დილით აქ სულ რამდენიმე ადამიანია
    — პენსიონერები, ეტლიანი დედები და ხანდახან სასკოლო ჯგუფი. ეს ის ადგილია, სადაც ქუთაისი ტურისტულ ქალაქად
    ყოფნას წყვეტს.
  tip: >-
    ერთი საათი საკმარისია. შესასვლელი სიმბოლურ საფასურს ითხოვს, ბილეთი კართან იყიდება. ბილიკები ხრეშიანია
    და ძირითადად ბრტყელი — ეტლით ან ურიკით უმეტესობა გასავლელია, თუმცა შესასვლელთან რამდენიმე საფეხურია.
    მუხის სამლოცველო შესასვლელიდან მარჯვნივ, ბილიკის ბოლოშია; ნიშანი პატარაა, დაკარგვა ადვილია — ჰკითხე.
    ტუალეტი შესასვლელთანაა, კაფე კი ბაღში არ არის; უახლოესი სანაპიროზეა. წვიმის შემდეგ ბილიკები ლაფიანდება.
  route: >-
    თბილისიდან E60-ით ქუთაისამდე — 232 კმ, დაახლოებით სამი საათი და ოცდახუთი წუთი. ქალაქში რიონის მარჯვენა
    ნაპირზე გადადი და მხეიძეების ქუჩას გაუყევი; ბაღის შესასვლელი ქუჩის ბოლოსაა, ცენტრიდან ხუთი წუთის სავალზე.
    პარკინგი შესასვლელის წინ, ქუჩაშია და უფასოა, თუმცა ვიწროა — უკეთესია ერთი კვარტლით ადრე დააყენო. საწვავი
    ზესტაფონსა და ქუთაისში აიღე. ეკონომ-კლასის ავტომობილი სავსებით საკმარისია.
en:
  name: Kutaisi Colchic Botanical Garden
  short: >-
    A garden founded in 1840 on the bank of the Rioni, with a tiny chapel hollowed into a four-hundred-year-old
    oak.
  body: >-
    **Kutaisi's botanical garden was founded in 1840 and is one of the oldest in Georgia.** It lies on
    the bank of the Rioni about a kilometre from the central square: follow the embankment from the Chain
    Bridge and turn up towards the Sapichkhia side.


    The garden began as a nursery, an attempt to acclimatise subtropical species in the mild, wet climate
    of Imereti. Today true natives of the Colchic forest — zelkova, Imeretian oak, box — stand next to
    introduced magnolia, bamboo, cypress and conifers. It is a small garden and an hour covers all of
    it; the paths are level, the shade is generous, and squirrels work the branches overhead.


    One specific thing brings most visitors here: a four-hundred-year-old oak with a miniature chapel
    cut into its hollow trunk. It holds one person, two at a squeeze — an icon, a candle stand and bare
    wood. It is neither an ancient shrine nor an architectural monument, simply an odd and rather touching
    thing, and the people of Kutaisi are fond of it.


    The garden fits neatly between the city's other two stops: the Bagrati hill rises above it, and the
    historical museum is ten minutes away across the river. If you have three or four hours in Kutaisi
    and have had enough of churches, this is where you get your breath back.


    In spring the magnolias flower and the garden is at its best; in summer it is noticeably cooler than
    the streets; in autumn the colour is good. Winter strips much of it back, though the evergreen sections
    hold up.


    The garden still works as a collection rather than as a park: labels carry Latin names, beds are grouped
    by origin, and benches are set along the main axis. On a weekday morning you will share it with a
    handful of pensioners, parents with pushchairs and perhaps a school group. It is one of the places
    where Kutaisi stops behaving like a city on a tourist route.
  tip: >-
    An hour is enough. Entry costs a token amount, paid at the gate. Paths are gravel and mostly flat,
    so a wheelchair or pushchair manages most of the garden, though there are a few steps at the entrance.
    The oak chapel is to the right of the gate at the end of a path; the sign is small and easy to miss,
    so ask. There is a toilet by the entrance but no cafe inside — the nearest are on the embankment.
    After rain the paths turn muddy.
  route: >-
    Take the E60 west from Tbilisi to Kutaisi — 232 km, about three hours twenty-five. In the city cross
    to the right bank of the Rioni and follow Mkheidze Street; the garden entrance is at the far end,
    five minutes from the centre. Parking is free on the street outside but the road is narrow, so it
    is easier to stop a block earlier. Fuel is available in Zestaponi and in Kutaisi itself. An economy
    car is entirely sufficient.
ru:
  name: Кутаисский колхидский ботанический сад
  short: Сад, основанный в 1840 году на берегу Риони, с крошечной часовней, вырубленной в четырёхсотлетнем
    дубе.
  body: >-
    **Ботанический сад Кутаиси основан в 1840 году и относится к старейшим в Грузии.** Он лежит на берегу
    Риони примерно в километре от центральной площади: от Цепного моста идите вдоль набережной и поднимайтесь
    в сторону Сапичхии.


    Начинался сад как питомник — попытка приучить субтропические виды к мягкому и влажному климату Имерети.
    Сегодня здесь рядом растут настоящие уроженцы колхидского леса (дзелква, имеретинский дуб, самшит)
    и привезённые магнолии, бамбук, кипарисы и хвойные. Сад невелик, часа хватает на всё; дорожки ровные,
    тени много, а по веткам носятся белки.


    Сюда приезжают ради одной конкретной вещи: четырёхсотлетнего дуба, в дупле которого вырублена крохотная
    часовня. Внутри помещается один человек, с трудом двое — икона, подсвечник и голое дерево. Это не
    древняя святыня и не архитектурный памятник, просто странная и по-своему трогательная вещь, которую
    кутаисцы любят.


    Сад хорошо ложится между двумя другими городскими точками: над ним поднимается холм Баграти, а исторический
    музей — в десяти минутах за рекой. Если у вас в Кутаиси три-четыре часа и от храмов вы уже устали,
    здесь можно отдышаться.


    Весной цветут магнолии, и сад в лучшей форме; летом здесь заметно прохладнее, чем на улицах; осенью
    хороша листва. Зимой многое оголяется, но вечнозелёная часть держится.


    Сад по-прежнему работает как коллекция, а не как парк: на этикетках латинские названия, посадки сгруппированы
    по происхождению, вдоль главной аллеи стоят скамейки. Утром в будний день здесь несколько пенсионеров,
    родители с колясками и, может быть, школьная группа. Это одно из мест, где Кутаиси перестаёт вести
    себя как город на туристическом маршруте.
  tip: >-
    Часа достаточно. Вход стоит символических денег, билет берут у ворот. Дорожки гравийные и почти везде
    ровные, так что с коляской или в кресле проходима бо́льшая часть сада, хотя у входа есть несколько
    ступеней. Дуб с часовней — справа от ворот, в конце дорожки; табличка маленькая, легко пройти мимо,
    лучше спросить. Туалет у входа, кафе внутри нет, ближайшие — на набережной. После дождя дорожки развозит.
  route: >-
    Из Тбилиси по E60 до Кутаиси — 232 км, примерно три часа двадцать пять минут. В городе переезжайте
    на правый берег Риони и держитесь улицы Мхеидзе; вход в сад в её дальнем конце, пять минут от центра.
    Парковка на улице у входа бесплатная, но проезд узкий, так что проще встать кварталом раньше. Заправиться
    можно в Зестафони и в самом Кутаиси. Машины эконом-класса вполне достаточно.
fa:
  name: باغ گیاه‌شناسی کلخی کوتایسی
  short: باغی که در ۱۸۴۰ بر کرانهٔ ریونی بنیاد شد، با نمازخانه‌ای کوچک کنده‌شده در تنهٔ بلوطی چهارصدساله.
  body: >-
    **باغ گیاه‌شناسی کوتایسی در ۱۸۴۰ بنیاد گذاشته شد و از کهن‌ترین باغ‌های گرجستان است.** بر کرانهٔ ریونی
    و حدود یک کیلومتری میدان مرکزی قرار دارد: از پل زنجیری کنار رودخانه بروید و به سمت محلهٔ ساپیچخیا
    بالا بروید.


    باغ در آغاز نهالستانی بود، تلاشی برای خو دادن گونه‌های نیمه‌گرمسیری به آب‌وهوای ملایم و مرطوب ایمرتی.
    امروز بومیان واقعی جنگل کلخی — زلکوا، بلوط ایمرتی، شمشاد — کنار مگنولیا، بامبو، سرو و سوزنی‌برگ‌های
    وارداتی ایستاده‌اند. باغ کوچک است و یک ساعت همه‌اش را پوشش می‌دهد؛ مسیرها هموارند، سایه فراوان است
    و سنجاب‌ها روی شاخه‌ها کار می‌کنند.


    یک چیز مشخص بیشتر بازدیدکنندگان را به اینجا می‌کشاند: بلوطی چهارصدساله که در تنهٔ توخالی‌اش نمازخانه‌ای
    ریز کنده شده است. یک نفر در آن جا می‌گیرد و با فشار دو نفر — یک شمایل، جای شمع و چوب برهنه. نه زیارتگاهی
    باستانی است و نه اثری معماری، فقط چیزی غریب و تا حدی دل‌نشین که مردم کوتایسی دوستش دارند.


    باغ میان دو توقف دیگر شهر خوب می‌نشیند: تپهٔ باگراتی بالای سرش است و موزهٔ تاریخی ده دقیقه آن‌سوی
    رود. اگر سه چهار ساعت در کوتایسی دارید و از کلیساها سیر شده‌اید، اینجا نفس تازه می‌کنید.


    بهار مگنولیاها گل می‌دهند و باغ در بهترین حال است؛ تابستان محسوس خنک‌تر از خیابان‌هاست؛ پاییز رنگ
    خوبی دارد. زمستان بیشترش برهنه می‌شود، هرچند بخش همیشه‌سبز پابرجاست.


    باغ هنوز مانند یک مجموعهٔ گیاه‌شناسی کار می‌کند نه یک پارک: روی برچسب‌ها نام لاتین آمده، بستر‌ها بر
    پایهٔ خاستگاه گروه‌بندی شده‌اند و در امتداد محور اصلی نیمکت گذاشته‌اند. صبح یک روز کاری آن را با چند
    بازنشسته، پدر و مادرهایی با کالسکه و شاید یک گروه مدرسه‌ای قسمت می‌کنید. اینجا یکی از جاهایی است که
    کوتایسی از شهرِ روی مسیر گردشگری بودن دست می‌کشد.
  tip: >-
    یک ساعت کافی است. ورودی مبلغی نمادین دارد و بلیت را دم دروازه می‌گیرید. مسیرها شنی و تقریباً هموارند،
    پس ویلچر یا کالسکه بیشتر باغ را طی می‌کند، هرچند نزدیک ورودی چند پله هست. بلوط نمازخانه سمت راست دروازه
    و انتهای یک مسیر است؛ تابلویش کوچک است و به‌راحتی از دست می‌رود، پس بپرسید. سرویس بهداشتی کنار ورودی
    است و کافه‌ای داخل نیست؛ نزدیک‌ترین‌ها کنار رودخانه‌اند. پس از باران مسیرها گِلی می‌شوند.
  route: >-
    از تفلیس با بزرگراه E60 تا کوتایسی — ۲۳۲ کیلومتر، حدود سه ساعت و بیست‌وپنج دقیقه. در شهر به کرانهٔ
    راست ریونی بروید و خیابان مخئیدزه را بگیرید؛ ورودی باغ در انتهای آن است، پنج دقیقه از مرکز. پارک کنار
    خیابان جلوی ورودی رایگان است اما راه باریک است، پس یک بلوک زودتر ایستادن آسان‌تر است. سوخت در زستافونی
    و خود کوتایسی موجود است. خودروی اقتصادی کاملاً کافی است.
he:
  name: הגן הבוטני הקולכי של קוטאיסי
  short: גן שנוסד ב-1840 על גדת הריוני, ובו קפלה זעירה חצובה בגזע אלון בן ארבע מאות שנה.
  body: >-
    **הגן הבוטני של קוטאיסי נוסד ב-1840 והוא מן העתיקים בגאורגיה.** הוא שוכן על גדת הריוני, כקילומטר מן
    הכיכר המרכזית: הולכים לאורך הטיילת מגשר השרשרת ועולים לכיוון רובע ספיצ'חיה.


    הגן החל כמשתלה, ניסיון להרגיל מינים סובטרופיים לאקלים הרך והלח של אימרתי. היום עומדים בו זה לצד זה
    ילידי היער הקולכי האמיתיים — זלקובה, אלון אימרתי, אשכרוע — לצד מגנוליה, במבוק, ברוש ומחטניים שהובאו
    מבחוץ. הגן קטן ושעה מכסה אותו כולו; השבילים מישוריים, הצל נדיב, וסנאים עובדים בין הענפים.


    דבר אחד מסוים מביא לכאן את רוב המבקרים: אלון בן ארבע מאות שנה שבתוך גזעו החלול חצובה קפלה זעירה. נכנס
    בה אדם אחד, שניים בדוחק — איקונה, מעמד נרות ועץ חשוף. זה לא מקדש עתיק ולא מונומנט אדריכלי, פשוט דבר
    מוזר ונוגע ללב, ותושבי קוטאיסי אוהבים אותו.


    הגן משתלב יפה בין שתי התחנות האחרות בעיר: גבעת בגראטי מתנשאת מעליו, והמוזיאון ההיסטורי במרחק עשר דקות
    מעבר לנהר. אם יש לכם שלוש-ארבע שעות בקוטאיסי ונמאס לכם מכנסיות, כאן חוזרים לנשום.


    באביב פורחות המגנוליות והגן במיטבו; בקיץ קריר בו מורגשות מן הרחובות; בסתיו הצבע יפה. החורף מפשיט חלק
    גדול ממנו, אך החלקים ירוקי העד מחזיקים.


    הגן עדיין מתפקד כאוסף ולא כפארק: על השלטים שמות לטיניים, הערוגות מקובצות לפי מוצא, וספסלים מוצבים
    לאורך הציר המרכזי. בבוקר של יום חול תחלקו אותו עם כמה גמלאים, הורים עם עגלות ואולי קבוצת בית ספר.
    זהו אחד המקומות שבהם קוטאיסי מפסיקה להתנהג כעיר על מסלול תיירים.
  tip: >-
    שעה מספיקה. הכניסה עולה סכום סמלי, והכרטיס נקנה בשער. השבילים מחצץ וברובם שטוחים, כך שכיסא גלגלים
    או עגלה עוברים ברוב הגן, אם כי בכניסה יש כמה מדרגות. אלון הקפלה נמצא מימין לשער בסוף שביל; השלט קטן
    וקל לפספס, לכן שאלו. שירותים ליד הכניסה, ואין בית קפה בפנים — הקרובים על הטיילת. אחרי גשם השבילים
    בוציים.
  route: >-
    מטביליסי בכביש E60 מערבה עד קוטאיסי — 232 ק״מ, כשלוש שעות ועשרים וחמש דקות. בעיר עוברים לגדה הימנית
    של הריוני ונוסעים ברחוב מחיידזה; הכניסה לגן בקצהו, חמש דקות מן המרכז. החניה ברחוב מול הכניסה חינם
    אך הדרך צרה, ולכן נוח לעצור בלוק אחד קודם. דלק אפשר למצוא בזסטפוני ובקוטאיסי עצמה. רכב חסכוני מספיק
    לחלוטין.
ar:
  name: حديقة كوتايسي النباتية الكولخية
  short: حديقة أُسّست عام 1840 على ضفة نهر ريوني، وفيها كنيسة صغيرة محفورة في جذع بلوطة عمرها أربعمئة
    عام.
  body: >-
    **أُسّست حديقة كوتايسي النباتية عام 1840 وهي من أقدم الحدائق في جورجيا.** تقع على ضفة نهر ريوني على
    بعد كيلومتر تقريباً من الساحة المركزية: سر على الكورنيش من الجسر السلسلي ثم اصعد نحو جهة سابيتشخيا.


    بدأت الحديقة مشتلاً، أي محاولة لتأقلم أنواع شبه استوائية مع مناخ إيميريتي الرطب المعتدل. واليوم يقف
    فيها أبناء الغابة الكولخية الأصليون — الزلكوفا وبلوط إيميريتي والبقس — إلى جانب المغنوليا والخيزران
    والسرو والصنوبريات المستقدمة. الحديقة صغيرة وساعة واحدة تغطيها كلها؛ الممرات مستوية والظل وافر والسناجب
    تعمل فوق الأغصان.


    ويأتي معظم الزائرين لشيء واحد بعينه: بلوطة عمرها أربعمئة عام حُفرت في جذعها المجوّف كنيسة صغيرة جداً.
    تتسع لشخص واحد، ولاثنين بصعوبة — أيقونة وحامل شموع وخشب عارٍ. ليست مزاراً قديماً ولا أثراً معمارياً،
    بل شيء غريب ومؤثر على نحو ما، وأهل كوتايسي يحبونه.


    وتقع الحديقة بين محطتي المدينة الأخريين على نحو مريح: تلة باغراتي تعلوها، والمتحف التاريخي على بعد
    عشر دقائق عبر النهر. فإن كان لديك ثلاث أو أربع ساعات في كوتايسي وسئمت الكنائس، فهنا تستعيد أنفاسك.


    في الربيع تزهر المغنوليا وتكون الحديقة في أفضل حالاتها؛ وفي الصيف تبرد بوضوح عن الشوارع؛ وفي الخريف
    تحسن الألوان. أما الشتاء فيعرّي كثيراً منها، وإن صمدت الأقسام دائمة الخضرة.


    ما زالت الحديقة تعمل بوصفها مجموعة نباتية لا متنزهاً: البطاقات تحمل الأسماء اللاتينية، والأحواض مجمّعة
    بحسب الموطن، والمقاعد موضوعة على امتداد المحور الرئيسي. وفي صباح يوم عمل ستقاسمها مع قلة من المتقاعدين
    وآباء يدفعون عربات أطفال وربما مجموعة مدرسية. إنها من الأماكن التي تكفّ فيها كوتايسي عن التصرف كمدينة
    على مسار سياحي.
  tip: >-
    ساعة تكفي. الدخول برسم رمزي يُدفع عند البوابة. الممرات من الحصى ومستوية في معظمها، فيمكن لكرسي متحرك
    أو عربة أطفال اجتياز أغلب الحديقة، وإن كانت هناك بضع درجات عند المدخل. بلوطة الكنيسة على يمين البوابة
    في نهاية ممر؛ لافتتها صغيرة ويسهل تفويتها، فاسأل. دورة المياه قرب المدخل ولا مقهى في الداخل، وأقربها
    على الكورنيش. وبعد المطر تصير الممرات موحلة.
  route: >-
    من تبليسي على الطريق E60 غرباً حتى كوتايسي — 232 كم، نحو ثلاث ساعات وخمس وعشرين دقيقة. في المدينة
    اعبر إلى الضفة اليمنى لنهر ريوني واسلك شارع مخيدزه؛ مدخل الحديقة في آخره، على بعد خمس دقائق من المركز.
    الوقوف في الشارع أمام المدخل مجاني لكن الطريق ضيق، فالأسهل التوقف قبل مربع سكني. الوقود متوفر في زستافوني
    وفي كوتايسي نفسها. وسيارة اقتصادية تكفي تماماً.
