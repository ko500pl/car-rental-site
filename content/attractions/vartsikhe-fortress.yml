ka:
  name: ვარციხის ციხე
  short: >-
    ნანგრევები რიონთან, სადაც ბიზანტიელები და სპარსელები „ვარდის ქალაქისთვის“ იბრძოდნენ, 1810 წელს კი
    იმერეთის უკანასკნელი მეფე რუსეთს წინ აღუდგა.
  body: >-
    **ვარციხე „ვარდის ციხეს“ ნიშნავს — ეს როდოპოლისის, „ვარდის ქალაქის“, ქართული ანარეკლია, რომელსაც VI
    საუკუნის ბიზანტიელი ისტორიკოსები იხსენიებდნენ.**


    ადგილი იმერეთის დაბლობზე, ზღვის დონიდან დაახლოებით 80 მეტრზე, ხანისწყლისა და რიონის შესართავთანაა.
    არქეოლოგიური მონაცემებით, გამაგრებული დასახლება აქ IV საუკუნიდან არსებობდა. როდოპოლისი ეგრისის მდიდარი
    ქალაქი იყო იბერიისკენ მიმავალ გზაზე, მაგრამ ღია ველზე იდგა და ეს მისი სისუსტე აღმოჩნდა: 530-იან წლებში
    ლაზებმა, სპარსელების შიშით, ციხის კედლები თავად დაანგრიეს, რომ მტერს საყრდენად არ ექცია. ეგრისის დიდი
    ომის დროს სპარსელმა სარდალმა მიჰრ-მიჰროემ ქალაქი მაინც დაიკავა და მეციხოვნეები ჩააყენა. 557 წელს ბიზანტიელმა
    სარდალმა იუსტინემ ორიათასიანი მხედრობა ჰუნი ელმინზურის მეთაურობით გაგზავნა და მხედრები ქალაქში უბრძოლველად
    შევიდნენ — მეციხოვნეებიც და მოსახლეობაც იმ დროს კედლებს გარეთ იყვნენ. გარკვეული ხნით როდოპოლისი ფასისის
    მიტროპოლიას დაქვემდებარებული საეპისკოპოსო იყო; VIII საუკუნის დასაწყისში, არაბთა შემოსევების შემდეგ,
    იგი წყაროებიდან ქრება.


    საუკუნეების შემდეგ ვარციხე იმერეთის მეფეთა ციხე და საზაფხულო რეზიდენცია გახდა; მეფეები მეზობელ აჯამეთის
    ტყეში ნადირობდნენ, ალექსანდრე V-მ (მეფობდა 1720–1752 წლებში) კი ციხე განაახლა. 1771 წელს, ოსმალთა
    წინააღმდეგ გრაფ ტოტლებენის ლაშქრობისას, ციხე მძიმედ დაზიანდა. 1809 წელს, როცა ქუთაისში უკვე რუსული
    ჯარი იდგა, მეფე სოლომონ II-მ დედაქალაქი დატოვა და ვარციხეში გამაგრდა. ციხე 1810 წლის 6 მარტს დაეცა;
    იმავე წელს იმერეთი რუსეთმა შეიერთა, ციხე კი მიტოვებულ ნანგრევად იქცა.


    დღეს ხილული კედლები იმერეთის სამეფოს ხანისაა; IV–VI საუკუნეების სიმაგრეები მიწის ქვეშაა, არქეოლოგებმა
    ისინი 1970-იან წლებში შეისწავლეს. ადგილზე წასაკითხი თითქმის არაფერია — მხოლოდ ქვა, მდინარის შუქი და
    მიღმა აჯამეთის მუხები. ესეც საკმარისია: სწორედ აქ, ამ ქვის კედლებს ამოფარებული, დაუდგა მტერს დამოუკიდებელი
    იმერეთის უკანასკნელი მეფე.
  tip: >-
    შესვლა უფასოა და ციხეს დარაჯი არ ჰყავს: არც სალაროა, არც ტუალეტი, არც კაფე და თითქმის არც საინფორმაციო
    დაფა. ერთი საათი სავსებით საკმარისია. კედლები აღდგენილი არ არის — ჩაიცვით მოუცურებელი ფეხსაცმელი და
    ბავშვებს ჩამოშლილ თხემებზე ასვლის ნება არ მისცეთ. დაბლობში ზაფხული ცხელი და ნოტიოა; დილით ან შუადღის
    შემდეგ მოდით, როცა მდინარეზე შუქი უფრო რბილია. სოფელს ღვინის დიდი ისტორიაც აქვს: XX საუკუნის დასაწყისში
    ქუთაისელმა მეწარმეებმა, ანანოვებმა, აქ ღვინის ქარხანა ააშენეს და ადგილობრივი კონიაკი ჩამოასხეს, რომელსაც
    დღემდე აწარმოებენ; ახლოსაა ღვინის სახლი „შატო ვარციხეც“ — დეგუსტაციის საათები წინასწარ გადაამოწმეთ
    და მძღოლმა თავი შეიკავოს.
  route: >-
    ვარციხე თბილისიდან დაახლოებით 220 კილომეტრშია, გზა დაახლოებით 3 საათსა და 10 წუთს გრძელდება. დასავლეთით
    ს1 (E60) გზატკეცილს მიჰყევით გორისა და ხაშურის გავლით, რიკოთის მონაკვეთსა და ზესტაფონს იქით; ბენზინგასამართი
    მთელ გზაზეა. ქუთაისამდე ცოტა ადრე ს1-დან შ14-ზე, ქუთაისი–ბაღდათის გზაზე გადადით, რამდენიმე კილომეტრის
    შემდეგ კი შ51-ით (ვარციხე–როხი) სოფელში შედით — ის ქუთაისიდან დაახლოებით 15 კილომეტრშია. მთელი გზა
    მოასფალტებულია, სადგომიდან ნანგრევებამდე კი მოკლე სავალია, ამიტომ ეკონომკლასის მანქანაც საკმარისია.
    იმერეთის უფრო გრძელი მარშრუტისთვის ახლოსაა ბაღდათი და გეგუთის სასახლის ნანგრევები.
en:
  name: Vartsikhe Fortress
  short: >-
    Ruined walls on the Rioni where Byzantines fought Persians over 'the city of the rose' and Imereti's
    last king made his stand against Russia in 1810.
  body: >-
    **Vartsikhe means 'fort of the rose' — a Georgian echo of Rhodopolis, 'the city of the rose', which
    Byzantine historians were writing about in the 6th century.**


    The site lies low in the Imereti lowlands, about 80 m above sea level, where the Khanistskali meets
    the Rioni. Archaeology puts a fortified settlement here from the 4th century. Rhodopolis was a rich
    town of Lazica on the road east to Iberia, but it sat on an open plain, and that was its weakness:
    in the 530s the Lazi pulled down its walls themselves rather than leave the Persians a stronghold.
    During the Lazic War the Persian commander Mihr-Mihroe garrisoned it anyway. In 557 the East Roman
    general Justin sent 2,000 horsemen under a Hun named Elminzur, who rode in unopposed — the garrison
    and the townspeople happened to be outside the walls. For a time Rhodopolis was a bishopric under
    Phasis; the see fades from the records in the early 8th century, after the Arab invasions.


    Centuries later the ruin became a royal castle and summer residence of the kings of Imereti, who hunted
    in the neighbouring Ajameti forest; Alexander V (r. 1720–1752) had it refurbished. It was badly damaged
    in 1771, during Count Totleben's campaign against the Ottomans. In 1809, with Russian troops already
    quartered in Kutaisi, King Solomon II left his capital and dug in here. Vartsikhe fell on 6 March
    1810; before the year was out, Imereti had been annexed by Russia, and the castle was left to the
    weeds.


    What stands today are walls of the royal period; the 4th–6th-century fortifications lie underground,
    studied by archaeologists in the 1970s. There is little to read on site — only stone, river light
    and the oaks of Ajameti beyond. It is enough. This is where the last king of an independent Imereti
    made his stand behind stone walls.
  tip: >-
    Entry is free and the ruin is unstaffed: no ticket office, no toilets, no café, and very little signage.
    An hour is plenty. The walls are unrestored — wear shoes with grip and keep children off the crumbling
    tops. Summer in the lowlands is hot and humid; come in the morning or late afternoon, when the light
    on the river is kinder. The village also has a long winemaking story: early in the 1900s the Ananovs,
    a Kutaisi family of entrepreneurs, built a winery here and bottled a local brandy that is still made,
    and the Chateau Vartsikhe winery sits close by — check its tasting hours in advance, and let the driver
    abstain.
  route: >-
    Vartsikhe is about 220 km from Tbilisi, roughly 3 hours 10 minutes. Follow the S1 (E60) west past
    Gori and Khashuri, over the Rikoti section and past Zestaponi; fuel is easy all the way. Shortly before
    Kutaisi leave the S1 for the Sh14, the Kutaisi–Baghdati road, and after a few kilometres turn onto
    the Sh51 (Vartsikhe–Rokhi) into the village, which lies about 15 km from Kutaisi. The whole route
    is asphalt and a short walk leads from the parking to the ruins, so an economy car is all you need.
    Baghdati and the Geguti palace ruins are nearby for a longer Imereti loop.
ru:
  name: Крепость Варцихе
  short: >-
    Руины стен на Риони, где византийцы бились с персами за «город розы», а последний царь Имеретии в
    1810 году держал оборону против России.
  body: >-
    **Варцихе значит «крепость розы» — грузинское эхо Родополиса, «города розы», о котором писали византийские
    историки ещё в VI веке.**


    Место лежит низко, в Имеретинской низменности, примерно в 80 м над уровнем моря, там, где Ханисцкали
    впадает в Риони. Археология относит укреплённое поселение здесь к IV веку. Родополис был богатым городом
    Лазики на дороге на восток, в Иберию, но стоял на открытой равнине — и в этом была его слабость: в
    530-х годах лазы сами срыли его стены, лишь бы не оставить персам опорного пункта. Во время Лазской
    войны персидский полководец Михр-Михрое всё же поставил здесь гарнизон. В 557 году восточноримский
    полководец Юстин послал 2000 всадников во главе с гунном по имени Элминзур, и тот вошёл в город без
    боя: гарнизон и горожане как раз оказались за стенами. Какое-то время Родополис был епископством,
    подчинённым Фасису; кафедра исчезает из источников в начале VIII века, после арабских нашествий.


    Столетия спустя руины превратились в царский замок и летнюю резиденцию имеретинских царей, охотившихся
    в соседнем Аджаметском лесу; Александр V (правил в 1720–1752 годах) велел его обновить. В 1771 году,
    во время похода графа Тотлебена против османов, замок сильно пострадал. В 1809 году, когда русские
    войска уже стояли в Кутаиси, царь Соломон II покинул свою столицу и укрепился здесь. Крепость пала
    6 марта 1810 года; не успел закончиться год, как Имеретия была присоединена к России, а замок оставлен
    сорнякам.


    То, что стоит сегодня, — стены царской эпохи; укрепления IV–VI веков лежат под землёй, их исследовали
    археологи в 1970-х годах. Читать на месте почти нечего — только камень, свет над рекой и дальше дубы
    Аджамети. Этого довольно. Здесь последний царь независимой Имеретии держал оборону за каменными стенами.
  tip: >-
    Вход свободный, персонала на руинах нет: ни кассы, ни туалетов, ни кафе и почти никаких табличек.
    Часа хватит с лихвой. Стены не отреставрированы — нужна обувь с цепкой подошвой, и не пускайте детей
    на осыпающиеся гребни. Лето в низменности жаркое и влажное; приезжайте утром или ближе к вечеру, когда
    свет на реке мягче. У села и своя долгая винодельческая история: в начале 1900-х годов Анановы, кутаисская
    семья предпринимателей, построили здесь винный завод и разливали местный бренди, который делают до
    сих пор, а совсем рядом работает винодельня «Шато Варцихе» — часы дегустаций уточните заранее, и пусть
    водитель воздержится.
  route: >-
    Варцихе примерно в 220 км от Тбилиси, около 3 часов 10 минут пути. Езжайте по S1 (E60) на запад мимо
    Гори и Хашури, через Рикотский участок и мимо Зестафони; с заправками по пути проблем нет. Незадолго
    до Кутаиси сверните с S1 на Sh14 — дорогу Кутаиси–Багдати, а через несколько километров — на Sh51
    (Варцихе–Рохи), в село, которое лежит примерно в 15 км от Кутаиси. Весь маршрут асфальтирован, от
    парковки к руинам ведёт короткая тропа, так что достаточно машины эконом-класса. Рядом Багдати и руины
    дворца Гегути — если хочется сделать петлю по Имеретии подлиннее.
fa:
  name: دژ وارتسیخه
  short: >-
    دیوارهایی ویران کنار رود ریونی، جایی که بیزانسی‌ها بر سر «شهر گل سرخ» با ایرانیان جنگیدند و واپسین
    پادشاه ایمرتی در ۱۸۱۰ در برابر روسیه ایستاد.
  body: >-
    **وارتسیخه یعنی «دژ گل سرخ» — پژواکی گرجی از رودوپولیس، «شهر گل سرخ»، که مورخان بیزانسی در سدهٔ ششم
    از آن می‌نوشتند.**


    این محوطه در دشت پست ایمرتی، تنها حدود ۸۰ متر بالاتر از سطح دریا، در جایی قرار دارد که رود خانیس‌تسکالی
    به ریونی می‌پیوندد. یافته‌های باستان‌شناسی از سکونتگاهی بارودار در اینجا از سدهٔ چهارم خبر می‌دهند.
    رودوپولیس شهری ثروتمند در لازیکا بر سر راه شرق به سوی ایبریا بود، اما در دشتی باز جای داشت و ضعفش
    همین بود: در دههٔ ۵۳۰ لازها خودشان باروهایش را فرو ریختند تا دژی برای ایرانیان باقی نگذارند. با این
    حال، در جنگ لازیکا، مهر مهروئه، سردار ایرانی، در آن پادگان گذاشت. در ۵۵۷ یوستین، سردار روم شرقی، ۲,۰۰۰
    سوار را به فرماندهی هونی به نام المینزور فرستاد که بی‌هیچ مقاومتی وارد شهر شد — پادگان و شهروندان
    در آن هنگام از قضا بیرون از باروها بودند. رودوپولیس مدتی مقرّ اسقفی تابع فاسیس بود؛ نام این اسقف‌نشین
    در آغاز سدهٔ هشتم، پس از حمله‌های عرب، از اسناد محو می‌شود.


    سده‌ها بعد، این ویرانه به دژ سلطنتی و اقامتگاه تابستانی پادشاهان ایمرتی بدل شد که در جنگل همسایهٔ
    آجامتی شکار می‌کردند؛ الکساندر پنجم (سلطنت ۱۷۲۰–۱۷۵۲) آن را نوسازی کرد. در ۱۷۷۱، هنگام لشکرکشی کنت
    توتلبن بر ضد عثمانی‌ها، آسیب سختی دید. در ۱۸۰۹، هنگامی که سپاهیان روس از پیش در کوتایسی مستقر شده
    بودند، سلیمان دوم پایتختش را ترک کرد و اینجا سنگر گرفت. وارتسیخه در ۶ مارس ۱۸۱۰ سقوط کرد؛ پیش از پایان
    همان سال، ایمرتی به روسیه ضمیمه شد و دژ به دست علف‌های هرز سپرده شد.


    آنچه امروز برپاست دیوارهای دورهٔ سلطنتی است؛ استحکامات سده‌های چهارم تا ششم زیر خاک‌اند و باستان‌شناسان
    در دههٔ ۱۹۷۰ آن‌ها را بررسی کردند. در محل چیز زیادی برای خواندن نیست — تنها سنگ، نور رود و در آن سو،
    بلوط‌های آجامتی. همین بس است. اینجا آخرین پادشاه ایمرتیِ مستقل پشت این دیوارها ایستادگی کرد.
  tip: >-
    ورود رایگان است و کسی در ویرانه‌ها کار نمی‌کند: نه گیشهٔ بلیت، نه سرویس بهداشتی، نه کافه، و تابلوی
    راهنما هم بسیار اندک است. یک ساعت کاملاً کافی است. دیوارها مرمت نشده‌اند — کفشی با کف ضدلغزش بپوشید
    و نگذارید بچه‌ها روی لبه‌های فروریزنده بروند. تابستانِ دشت گرم و شرجی است؛ صبح یا اواخر بعدازظهر بیایید،
    وقتی نور روی رود ملایم‌تر است. روستا تاریخ شراب‌سازی درازی هم دارد: در سال‌های آغازین دههٔ ۱۹۰۰ خانوادهٔ
    آنانوف، کارآفرینانی از کوتایسی، اینجا شراب‌سازی‌ای بنا کردند و براندی محلی‌ای را بطری کردند که هنوز
    تولید می‌شود؛ شراب‌سازی شاتو وارتسیخه هم همین نزدیکی است — ساعت‌های شراب‌چشی‌اش را از پیش بپرسید و
    بگذارید راننده ننوشد.
  route: >-
    وارتسیخه حدود ۲۲۰ کیلومتر از تفلیس فاصله دارد، تقریباً ۳ ساعت و ۱۰ دقیقه. جادهٔ S1 (E60) را رو به
    غرب، از کنار گوری و خاشوری، از بخش ریکوتی و از کنار زستافونی دنبال کنید؛ سوخت در سراسر راه به‌آسانی
    پیدا می‌شود. کمی پیش از کوتایسی از S1 به Sh14، جادهٔ کوتایسی–باغداتی، بپیچید و پس از چند کیلومتر وارد
    Sh51 (وارتسیخه–روخی) شوید تا به روستا برسید که حدود ۱۵ کیلومتر با کوتایسی فاصله دارد. تمام مسیر آسفالت
    است و از پارکینگ پیاده‌رویی کوتاه به ویرانه‌ها می‌رسد، پس خودروی اقتصادی همهٔ چیزی است که لازم دارید.
    باغداتی و ویرانه‌های کاخ گگوتی در همین نزدیکی‌اند، برای گشتی بلندتر در ایمرتی.
he:
  name: מבצר ורציחה
  short: >-
    חומות הרוסות על גדת הריוני, שבהן נלחמו הביזנטים בפרסים על ״עיר הוורד״, ושבהן התבצר מלך אימרתי האחרון
    מול רוסיה ב-1810.
  body: >-
    **ורציחה פירושו ״מבצר הוורד״ — הד גאורגי לרודופוליס, ״עיר הוורד״, שעליה כתבו היסטוריונים ביזנטים כבר
    במאה ה-6.**


    האתר שוכן נמוך, בשפלת אימרתי, כ-80 מטרים מעל פני הים, במקום שבו נשפך נהר חניסצקאלי אל הריוני. הממצאים
    הארכאולוגיים מעידים על יישוב מבוצר כאן מהמאה ה-4. רודופוליס הייתה עיר עשירה בלזיקה, על הדרך מזרחה
    לאיבריה, אבל היא ישבה במישור פתוח, ובכך הייתה חולשתה: בשנות ה-30 של המאה ה-6 הרסו הלאזים בעצמם את
    חומותיה, כדי לא להשאיר לפרסים מעוז. במהלך המלחמה הלאזית הציב בה המצביא הפרסי מיהר-מיהרואה חיל מצב
    בכל זאת. ב-557 שלח המצביא הרומי-המזרחי יוסטינוס 2,000 פרשים בפיקודו של הוני בשם אלמינזור, והוא נכנס
    לעיר בלי להיתקל בהתנגדות — חיל המצב ותושבי העיר היו במקרה מחוץ לחומות. לתקופה מסוימת הייתה רודופוליס
    מושב בישוף הכפוף לפאסיס; הבישופות נעלמת מן התעודות בראשית המאה ה-8, אחרי הפלישות הערביות.


    כעבור מאות שנים הפכה החורבה לטירה מלכותית ולמעון הקיץ של מלכי אימרתי, שצדו ביער אג׳מטי הסמוך; אלכסנדר
    החמישי (מלך בשנים 1720–1752) חידש אותה. היא נפגעה קשות ב-1771, במהלך מסע המלחמה של הרוזן טוטלבן נגד
    העות׳מאנים. ב-1809, כשכוחות רוסיים כבר חנו בקוטאיסי, עזב המלך סולומון השני את בירתו והתבצר כאן. ורציחה
    נפלה ב-6 במרץ 1810; עוד לפני תום השנה סופחה אימרתי לרוסיה, והטירה ננטשה לעשבים.


    מה שעומד היום הן חומות מהתקופה המלכותית; הביצורים מהמאות ה-4 עד ה-6 קבורים באדמה, וארכאולוגים חקרו
    אותם בשנות ה-70 של המאה ה-20. אין כאן הרבה מה לקרוא — רק אבן, אור הנהר, ומעבר להם אלוני אג׳מטי. וזה
    מספיק. כאן, מאחורי חומות האבן, עמד על נפשו מלכה האחרון של אימרתי העצמאית.
  tip: >-
    הכניסה חופשית ואין באתר צוות: אין קופה, אין שירותים, אין בית קפה וכמעט אין שילוט. שעה תספיק בהחלט.
    החומות לא שוחזרו — נעלו נעליים עם אחיזה טובה והרחיקו ילדים מראשי החומות המתפוררים. הקיץ בשפלה חם ולח;
    בואו בבוקר או לקראת ערב, כשהאור על הנהר רך יותר. לכפר יש גם מסורת ארוכה של ייצור יין: בראשית המאה
    ה-20 הקימה כאן משפחת אננוב, משפחת יזמים מקוטאיסי, יקב ובקבקה ברנדי מקומי שמיוצר עד היום, ויקב שאטו
    ורציחה נמצא ממש בסמוך — בדקו מראש את שעות הטעימות, ותנו לנהג לוותר על השתייה.
  route: >-
    ורציחה נמצאת כ-220 ק״מ מטביליסי, כ-3 שעות ו-10 דקות נסיעה. סעו מערבה בכביש S1 (E60) על פני גורי וחשורי,
    דרך קטע ריקוטי ועל פני זסטפוני; דלק זמין לאורך כל הדרך. זמן קצר לפני קוטאיסי צאו מ-S1 אל Sh14, כביש
    קוטאיסי–בגדאתי, ואחרי כמה קילומטרים פנו אל Sh51 (ורציחה–רוחי) והיכנסו לכפר, השוכן כ-15 ק״מ מקוטאיסי.
    כל הדרך סלולה, ומהחניה מובילה הליכה קצרה אל החורבות, כך שרכב קטן מקטגוריית אקונומי הוא כל מה שצריך.
    בגדאתי וחורבות ארמון גגוטי נמצאים בסמוך, למי שרוצה לולאה ארוכה יותר באימרתי.
ar:
  name: قلعة فارتسيخه
  short: >-
    أسوار مهدّمة على نهر ريوني، تقاتل عندها البيزنطيون والفرس على «مدينة الوردة»، وتحصّن فيها آخر ملوك
    إيميريتي في وجه روسيا عام 1810.
  body: >-
    **فارتسيخه تعني «قلعة الوردة» — صدى جورجي لرودوبوليس، «مدينة الوردة»، التي كتب عنها المؤرخون البيزنطيون
    في القرن السادس.**


    يقع الموقع منخفضاً في سهل إيميريتي، على ارتفاع نحو 80 متراً فوق سطح البحر، حيث يلتقي نهر خانيستسكالي
    بنهر ريوني. وتدل الآثار على مستوطنة محصّنة هنا منذ القرن الرابع. كانت رودوبوليس مدينة غنية في لازيكا
    على الطريق شرقاً إلى أيبيريا، لكنها قامت في سهل مكشوف، وكان ذلك موضع ضعفها: ففي ثلاثينيات القرن السادس
    هدم اللاز أسوارها بأيديهم كي لا يتركوا للفرس معقلاً. ومع ذلك أقام فيها القائد الفارسي مهر مهروي حامية
    خلال الحرب اللازية. وفي عام 557 أرسل القائد الروماني الشرقي يوستينوس 2,000 فارس بقيادة هوني يُدعى
    إلمينزور، فدخل المدينة دون مقاومة، إذ صادف أن الحامية وأهل المدينة كانوا خارج الأسوار. وكانت رودوبوليس
    لبعض الوقت مقرّاً لأسقفية تابعة لفاسيس؛ ثم يتلاشى ذكر الأسقفية من السجلات في أوائل القرن الثامن، بعد
    الغزوات العربية.


    وبعد قرون صارت الأطلال قلعة ملكية ومقرّاً صيفياً لملوك إيميريتي، الذين كانوا يصطادون في غابة أجاميتي
    المجاورة؛ وقد جدّدها ألكسندر الخامس (حكم 1720–1752). ولحقت بها أضرار جسيمة عام 1771، خلال حملة الكونت
    توتليبن على العثمانيين. وفي عام 1809، وقد كانت القوات الروسية مرابطة أصلاً في كوتايسي، غادر الملك
    سليمان الثاني عاصمته وتحصّن هنا. سقطت فارتسيخه في 6 مارس 1810؛ وقبل أن ينقضي العام ضمّت روسيا إيميريتي،
    وتُركت القلعة للأعشاب.


    وما يقف اليوم هو أسوار العهد الملكي؛ أما تحصينات القرون من الرابع إلى السادس فتقبع تحت الأرض، وقد
    درسها علماء الآثار في سبعينيات القرن العشرين. لا يوجد في الموقع الكثير مما يُقرأ — سوى الحجر وضوء
    النهر، وخلفهما أشجار بلوط أجاميتي. وهذا يكفي. فهنا، خلف هذه الأسوار، تحصّن آخر ملوك إيميريتي المستقلة.
  tip: >-
    الدخول مجاني ولا يوجد في الموقع أي موظفين: لا شبّاك تذاكر ولا دورات مياه ولا مقهى، واللافتات قليلة
    جداً. تكفي ساعة واحدة وتزيد. الأسوار غير مرمّمة — انتعل حذاءً جيد القبضة وأبعد الأطفال عن قممها المتداعية.
    الصيف في السهل حار ورطب؛ تعال صباحاً أو في آخر العصر، حين يكون الضوء على النهر ألطف. وللقرية أيضاً
    تاريخ طويل مع النبيذ: ففي مطلع القرن العشرين أنشأت عائلة أنانوف، وهي عائلة من رجال الأعمال في كوتايسي،
    معملاً للنبيذ هنا وعبّأت براندي محلياً لا يزال يُنتج حتى اليوم، ومعمل نبيذ «شاتو فارتسيخه» قريب جداً
    — تحقّق مسبقاً من مواعيد التذوق، وليمتنع السائق عن الشرب.
  route: >-
    تبعد فارتسيخه نحو 220 كم عن تبليسي، أي قرابة 3 ساعات و10 دقائق. اتبع الطريق S1 (E60) غرباً مروراً
    بغوري وخاشوري، ثم عبر مقطع ريكوتي ومروراً بزيستافوني؛ والوقود متوفر طوال الطريق. وقبيل كوتايسي اترك
    الطريق S1 إلى الطريق Sh14، أي طريق كوتايسي–باغداتي، وبعد بضعة كيلومترات انعطف إلى الطريق Sh51 (فارتسيخه–روخي)
    لتدخل القرية التي تبعد نحو 15 كم عن كوتايسي. الطريق كله معبّد، ومن الموقف يقود مشي قصير إلى الأطلال،
    لذا فسيارة من الفئة الاقتصادية هي كل ما تحتاجه. وباغداتي وأطلال قصر غيغوتي قريبة لمن يريد جولة أطول
    في إيميريتي.
