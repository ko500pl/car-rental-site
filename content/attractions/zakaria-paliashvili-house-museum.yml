ka:
  name: ზაქარია ფალიაშვილის სახლ-მუზეუმი
  short: >-
    დიდი ქართველი კომპოზიტორის მშობლიური სახლი ქუთაისში: აკვანი, ბეკერის ფორტეპიანო და „აბესალომ და ეთერის“
    ლიბრეტო მისივე შენიშვნებით.
  body: >-
    **საქართველოს ჰიმნის ისტორია, ერთი გაგებით, ქუთაისის მყუდრო ქუჩაზე მდგარ სახლში იწყება, სადაც 1871
    წელს კათოლიკურ ოჯახს თვრამეტი შვილიდან მესამე შეეძინა.**


    ზაქარია ფალიაშვილმა (1871–1933) მუსიკის პირველი გაკვეთილები ქუთაისის კათოლიკური ეკლესიის გუნდში და
    ფორტეპიანოზე ფელიქს მიზანდართან მიიღო. შემდეგ თბილისის მუსიკალურ სასწავლებელსა და მოსკოვის კონსერვატორიაში
    სწავლობდა, სადაც კონტრაპუნქტს სერგეი ტანეევთან დაეუფლა. მან ქართული ფილარმონიული საზოგადოება დააარსა,
    1908 წელს კი მასთან მუსიკალური სკოლა გახსნა, რომელსაც წლების განმავლობაში უსასყიდლოდ ხელმძღვანელობდა;
    1918 წლიდან სიცოცხლის ბოლომდე კი თბილისის კონსერვატორიის სათავეში იდგა. მისი ოპერის, „აბესალომ და
    ეთერის“, პრემიერა თბილისში 1919 წლის 21 თებერვალს შედგა; მას „დაისი“ და „ლატავრა“ მოჰყვა. თბილისის
    ოპერის თეატრი მის სახელს ატარებს, მისი მუსიკა კი საქართველოს სახელმწიფო ჰიმნს უდევს საფუძვლად.


    სახლი, სადაც კომპოზიტორი დაიბადა, ძველ ფრანგულ, ანუ კათოლიკურ, უბანში, ვარლამიშვილის ქუჩის 25 ნომერში
    დგას. მუზეუმად 1963 წელს იქცა, ნივთების დიდი ნაწილი კი ქუთაისელებმა თავად შესწირეს. პირველი ოთახი
    ოჯახის ყოფას იხსენებს, აკვნის ჩათვლით, მეორე — იმდროინდელ კერძო მუსიკალურ სალონს. მოძებნეთ:


    - მისი ფისჰარმონია და ბეკერის ფორტეპიანო, აგრეთვე მეზობლების საკრავები, რომლებზეც პატარა ზაქარია უკრავდა;

    - ნათლობის საბუთები და ოქროსფერი არშიით შემკული ქურქი, რომლითაც მესაზე დადიოდა;

    - „აბესალომ და ეთერის“ ლიბრეტოს ფურცლები მისივე შენიშვნებით და იოანე ოქროპირის ლიტურგიის საგალობლების
    ასლები.


    მუზეუმის დიდი ხნის კურატორი სიამოვნებით გაჩვენებთ, როგორ მუშაობს ძველი საკრავები, ზოგ საღამოს კი ოთახები
    კონცერტისთვის ივსება. დაელოდეთ წამს, როცა ძველი კლავიატურა ისევ გაჟღერდება: ასეთ პატარა სახლში კაცი,
    რომლის მუსიკაც ჰიმნად იქცა, უცებ მეზობელივით ახლობელი ხდება.
  tip: >-
    ჩვენი შემოწმებისას შესვლა უფასო იყო, მუზეუმი კი სამშაბათიდან კვირის ჩათვლით მუშაობდა; წასვლამდე ადგილზე
    დააზუსტეთ. თუ ჭიშკარი დაკეტილი გეჩვენებათ, გააღეთ და შედით — კურატორი, როგორც წესი, შიგნითაა. ერთი
    საათი დაუთმეთ, საკრავებს თუ ააჟღერებენ — მეტიც. იკითხეთ საღამოს კონცერტების შესახებ, რომლებიც დროდადრო
    იმართება. ქუჩა მშვიდი და საცხოვრებელია, ამიტომ მანქანის დაყენება იშვიათად არის პრობლემა. დავით კაკაბაძის
    სახელობის გალერეა დაახლოებით 600 მეტრშია, ბაგრატის ტაძარიც ფეხით მისასვლელია — ორივე ერთ აუჩქარებელ
    დილას მოათავსეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთით იარეთ — გორისა და ხაშურის გავლით, რიკოთის გვირაბებით, ზესტაფონის
    გვერდის ავლით; ბენზინგასამართი სადგურები მთელ გზაზეა. ქუთაისის გადასახვევზე გადაუხვიეთ და ცენტრისკენ
    აიღეთ გეზი: მუზეუმი ძველ კათოლიკურ უბანში, ვარლამიშვილის ქუჩის 25 ნომერშია, რუსთაველის გამზირიდან
    რამდენიმე წუთის სავალზე. გზა დაახლოებით 230 კილომეტრია და გაჩერებების გარეშე დაახლოებით 3 საათი და
    20 წუთი სჭირდება; ბოლომდე ასფალტია, ამიტომ ეკონომ კლასის მანქანა სავსებით საკმარისია. მანქანა სახლთან,
    მშვიდ ქუჩაზე, ან ცენტრში დააყენეთ და ფეხით გაიარეთ.
en:
  name: Zakaria Paliashvili House Museum
  short: >-
    The Kutaisi birth house of Georgia's great opera composer: his cradle, a Becker piano and the libretto
    of 'Abesalom and Eteri' marked in his hand.
  body: >-
    **Georgia's national anthem, in a sense, begins in a house on a quiet Kutaisi street, where in 1871
    a Catholic family welcomed the third of its eighteen children.**


    Zakaria Paliashvili (1871–1933) learned music in the choir of Kutaisi's Catholic church and at the
    piano with Felix Mizandari. He went on to the Tbilisi music college and the Moscow Conservatory, where
    he studied counterpoint with Sergei Taneyev. He founded the Georgian Philharmonic Society, and in
    1908 opened its music school, which he ran unpaid for years; from 1918 until his death he directed
    the Tbilisi Conservatory. His opera "Abesalom and Eteri" premiered in Tbilisi on 21 February 1919,
    followed by "Daisi" and "Latavra". The Tbilisi opera house bears his name, and his music underlies
    the national anthem.


    The house where he was born, at 25 Varlamishvili Street in the old French, or Catholic, Quarter, opened
    as a museum in 1963, and the people of Kutaisi donated many of the objects inside. The first room
    recalls the family home, down to the cradle; the second is a private music salon of the period. Look
    for:


    - his physharmonica and Becker piano, and the neighbours' instruments he played as a boy

    - his baptism documents and the gold-trimmed fur coat he wore to Mass

    - pages of the "Abesalom and Eteri" libretto with his own notes, and copies of hymns from the Liturgy
    of St John Chrysostom


    The long-serving curator is happy to show how the old instruments work, and on some evenings the rooms
    fill for concerts. Wait for the moment an old keyboard sounds again: in a house this small, the man
    whose music became the anthem suddenly feels like a neighbour.
  tip: >-
    At the time of our research entry was free and the museum was open Tuesday to Sunday; confirm locally
    before you go. If the front gate looks shut, open it and walk in; the curator is usually inside. Allow
    an hour, longer if the instruments come out. Ask about evening concerts, which are held from time
    to time. The street is quiet and residential, so parking is rarely a problem. The David Kakabadze
    Art Gallery is about 600 metres away and Bagrati Cathedral an easy walk, so combine them in one unhurried
    morning.
  route: >-
    From Tbilisi drive west on the S1 (E60) past Gori and Khashuri, through the Rikoti tunnels and on
    past Zestaponi, with fuel stations all along the way. Take the Kutaisi turn-off and head for the centre;
    the museum is at 25 Varlamishvili Street in the old Catholic Quarter, a few minutes on foot from Rustaveli
    Avenue. It is about 230 km and around 3 hours 20 minutes without stops, asphalt throughout, so an
    economy car is perfectly adequate. Park on the quiet street outside or in the centre and walk.
ru:
  name: Дом-музей Захария Палиашвили
  short: >-
    Кутаисский дом, где родился великий оперный композитор Грузии: его колыбель, фортепиано «Беккер» и
    либретто «Абесалома и Этери» с пометками его рукой.
  body: >-
    **Гимн Грузии в каком-то смысле начинается в доме на тихой кутаисской улице, где в 1871 году в католической
    семье родился третий из восемнадцати детей.**


    Захарий Палиашвили (1871–1933) учился музыке в хоре кутаисского католического храма и за фортепиано
    у Феликса Мизандари. Затем были музыкальное училище в Тбилиси и Московская консерватория, где он занимался
    контрапунктом у Сергея Танеева. Он основал Грузинское филармоническое общество, а в 1908 году открыл
    при нём музыкальную школу, которой несколько лет руководил безвозмездно; с 1918 года и до самой смерти
    руководил Тбилисской консерваторией. Его опера «Абесалом и Этери» впервые прозвучала в Тбилиси 21
    февраля 1919 года, за ней последовали «Даиси» и «Латавра». Тбилисский оперный театр носит его имя,
    а его музыка лежит в основе государственного гимна.


    Дом, где он родился, — на улице Варламишвили, 25, в старом Французском, или Католическом, квартале
    — стал музеем в 1963 году, и многие предметы в нём подарили жители Кутаиси. Первая комната воссоздаёт
    семейный быт, вплоть до колыбели; вторая — частный музыкальный салон той эпохи. Обратите внимание
    на:


    - его фисгармонию и фортепиано «Беккер», а также инструменты соседей, на которых играл маленький Захарий

    - документы о его крещении и шубу с золотой отделкой, в которой он ходил к мессе

    - страницы либретто «Абесалома и Этери» с его собственными пометками и копии песнопений Литургии святого
    Иоанна Златоуста


    Давний хранитель музея охотно показывает, как звучат старые инструменты, а по некоторым вечерам комнаты
    заполняются публикой на концертах. Дождитесь мига, когда старая клавиатура снова зазвучит: в таком
    маленьком доме человек, чья музыка стала гимном, вдруг кажется соседом.
  tip: >-
    На момент нашей проверки вход был бесплатным, а музей работал со вторника по воскресенье; перед поездкой
    уточните на месте. Если ворота выглядят закрытыми, откройте их и входите: хранитель обычно внутри.
    Закладывайте час, а если дело дойдёт до инструментов — больше. Спросите о вечерних концертах, которые
    проходят время от времени. Улица тихая, жилая, так что с парковкой проблем обычно нет. Художественная
    галерея имени Давида Какабадзе — примерно в 600 метрах, до собора Баграти легко дойти пешком, так
    что всё это можно объединить в одно неспешное утро.
  route: >-
    Из Тбилиси двигайтесь на запад по S1 (E60) мимо Гори и Хашури, через Рикотские тоннели и дальше мимо
    Зестафони; заправки есть на всём пути. Сверните на съезд к Кутаиси и направляйтесь в центр; музей
    находится на улице Варламишвили, 25, в старом Католическом квартале, в нескольких минутах ходьбы от
    проспекта Руставели. Это около 230 км и примерно 3 ч 20 мин без остановок, асфальт на всём протяжении,
    так что машины эконом-класса вполне достаточно. Припаркуйтесь на тихой улице у музея или в центре
    и пройдитесь пешком.
fa:
  name: خانه‌موزهٔ زاکاریا پالیاشویلی
  short: >-
    زادگاه آهنگساز بزرگ اپرای گرجستان در کوتایسی: گهواره‌اش، پیانوی بکر و لیبرتوی «آبسالوم و اتری» با
    یادداشت‌هایی به خط خودش.
  body: >-
    **سرود ملی گرجستان، به یک معنا، از خانه‌ای در خیابانی آرام در کوتایسی آغاز می‌شود؛ جایی که در ۱۸۷۱
    خانواده‌ای کاتولیک سومین فرزند از هجده فرزندش را در آغوش گرفت.**


    زاکاریا پالیاشویلی (۱۸۷۱–۱۹۳۳) موسیقی را در گروه کُر کلیسای کاتولیک کوتایسی و پیانو را نزد فلیکس میزانداری
    آموخت. سپس به هنرستان موسیقی تفلیس و کنسرواتوار مسکو رفت و در آنجا کنترپوان را نزد سرگئی تانیف فراگرفت.
    او انجمن فیلارمونیک گرجستان را بنیاد نهاد و در ۱۹۰۸ آموزشگاه موسیقیِ آن را گشود و سال‌ها بی‌مزد اداره‌اش
    کرد؛ از ۱۹۱۸ تا پایان عمر ریاست کنسرواتوار تفلیس را بر عهده داشت. اپرای او «آبسالوم و اتری» در ۲۱
    فوریهٔ ۱۹۱۹ در تفلیس نخستین بار اجرا شد و «دایسی» و «لاتاورا» از پی آن آمدند. اپرای تفلیس نام او را
    بر خود دارد و موسیقی‌اش پایهٔ سرود ملی است.


    خانه‌ای که او در آن زاده شد، در شمارهٔ ۲۵ خیابان وارلامیشویلی در محلهٔ قدیمی فرانسوی‌ها یا کاتولیک‌ها،
    در ۱۹۶۳ به موزه بدل شد و بسیاری از اشیای درونش را مردم کوتایسی اهدا کردند. اتاق نخست یادآور خانهٔ
    خانوادگی است، تا خودِ گهواره؛ اتاق دوم تالار خصوصی موسیقی از همان دوران است. در پی این‌ها باشید:


    - هارمونیوم (فیزهارمونیکا) و پیانوی بکرِ او، و سازهای همسایگان که زاکاریای خردسال با آن‌ها می‌نواخت

    - اسناد غسل تعمید او و پالتوی پوستی با حاشیهٔ زرین که با آن به مراسم عشای ربانی می‌رفت

    - برگه‌هایی از لیبرتوی «آبسالوم و اتری» با یادداشت‌های خودش، و رونوشت‌هایی از سرودهای آیین نیایش قدیس
    یوحنا زرین‌دهان


    متصدی قدیمی موزه با خوشرویی نشان می‌دهد سازهای کهنه چگونه کار می‌کنند، و برخی شب‌ها اتاق‌ها برای کنسرت
    پر می‌شوند. منتظر لحظه‌ای بمانید که یک کلاویهٔ کهنه دوباره به صدا درآید: در خانه‌ای به این کوچکی،
    مردی که موسیقی‌اش سرود ملی شد ناگهان به همسایه‌ای می‌ماند.
  tip: >-
    در زمان پژوهش ما ورود رایگان بود و موزه از سه‌شنبه تا یکشنبه باز بود؛ پیش از رفتن در محل جویا شوید.
    اگر دروازهٔ جلویی بسته به نظر می‌رسد، بازش کنید و وارد شوید؛ متصدی معمولاً داخل است. یک ساعت وقت بگذارید،
    و اگر سازها به صدا درآیند بیشتر. دربارهٔ کنسرت‌های شبانه بپرسید که هرازگاهی برگزار می‌شوند. خیابان
    آرام و مسکونی است، پس پارک کردن به‌ندرت دشوار است. نگارخانهٔ هنری داوید کاکابادزه حدود ۶۰۰ متر دورتر
    است و کلیسای جامع باگراتی با پیاده‌رویی آسان می‌رسد؛ پس آن‌ها را در یک صبحِ بی‌شتاب با هم ببینید.
  route: >-
    از تفلیس از S1 (E60) به سوی غرب بروید، از کنار گوری و خاشوری بگذرید، از تونل‌های ریکوتی عبور کنید
    و از کنار زستافونی ادامه دهید؛ در سراسر راه پمپ بنزین هست. از خروجی کوتایسی بیرون بروید و به سوی مرکز
    شهر برانید؛ موزه در شمارهٔ ۲۵ خیابان وارلامیشویلی در محلهٔ قدیمی کاتولیک‌هاست، چند دقیقه پیاده تا
    خیابان روستاولی. مسیر حدود ۲۳۰ کیلومتر و بی‌توقف حدود ۳ ساعت و ۲۰ دقیقه است، سراسر آسفالت، پس یک خودروی
    اقتصادی کاملاً کافی است. در همان خیابان آرام جلوی موزه یا در مرکز پارک کنید و پیاده بروید.
he:
  name: בית־המוזיאון של זכריה פליאשווילי
  short: >-
    בית הולדתו בקוטאיסי של מלחין האופרה הגדול של גאורגיה: העריסה שלו, פסנתר בקר והליברית של ״אבסלום ואתרי״
    עם הערות בכתב ידו.
  body: >-
    **ההמנון הלאומי של גאורגיה מתחיל, במובן מסוים, בבית ברחוב שקט בקוטאיסי, שבו קיבלה משפחה קתולית ב-1871
    את השלישי משמונה־עשר ילדיה.**


    זכריה פליאשווילי (1871–1933) למד מוזיקה במקהלת הכנסייה הקתולית של קוטאיסי ופסנתר אצל פליקס מיזנדרי.
    משם המשיך לבית הספר הגבוה למוזיקה בטביליסי ולקונסרבטוריון של מוסקבה, שם למד קונטרפונקט אצל סרגיי טנייב.
    הוא ייסד את החברה הפילהרמונית הגאורגית, וב-1908 פתח את בית הספר למוזיקה שלה וניהל אותו שנים ללא שכר;
    מ-1918 ועד מותו ניהל את הקונסרבטוריון של טביליסי. האופרה שלו ״אבסלום ואתרי״ הועלתה לראשונה בטביליסי
    ב-21 בפברואר 1919, ואחריה באו ״דאיסי״ ו״לטאורה״. בית האופרה של טביליסי נושא את שמו, והמוזיקה שלו עומדת
    ביסוד ההמנון הלאומי.


    הבית שבו נולד, ברחוב ורלמישווילי 25 שברובע הצרפתי, או הקתולי, הישן, נפתח כמוזיאון ב-1963, ורבים מהחפצים
    שבו נתרמו בידי תושבי קוטאיסי. החדר הראשון משחזר את בית המשפחה, עד העריסה; השני הוא סלון מוזיקה פרטי
    בן התקופה. חפשו את:


    - ההרמוניום (פיסהרמוניקה) ופסנתר הבקר שלו, וכלי הנגינה של השכנים, שעליהם ניגן זכריה בילדותו

    - מסמכי הטבילה שלו ומעיל הפרווה בעל השוליים המוזהבים שלבש למיסה

    - דפים מהליברית של ״אבסלום ואתרי״ עם הערותיו שלו, והעתקים של מזמורים מהליטורגיה של יוחנן כריסוסטומוס
    הקדוש


    האוצר הוותיק שמח להדגים איך הכלים הישנים פועלים, ובחלק מהערבים החדרים מתמלאים לקונצרטים. חכו לרגע
    שבו מקלדת ישנה מתעוררת שוב: בבית קטן כל כך, האיש שהמוזיקה שלו הפכה להמנון נדמה פתאום כמו שכן.
  tip: >-
    בזמן שערכנו את המחקר הכניסה הייתה חינם, והמוזיאון היה פתוח משלישי עד ראשון; ודאו זאת במקום לפני שאתם
    יוצאים. אם השער הקדמי נראה סגור, פתחו אותו והיכנסו; האוצר בדרך כלל בפנים. הקדישו שעה, ויותר אם הכלים
    יוצאים לפעולה. שאלו על קונצרטי ערב, שמתקיימים מדי פעם. זהו רחוב מגורים שקט, כך שחנייה כמעט אף פעם
    אינה בעיה. גלריית האמנות על שם דוד קקבדזה נמצאת כ-600 מטרים משם, וקתדרלת בגרטי במרחק הליכה נוח, אז
    שלבו את כולם בבוקר אחד נינוח.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60), עברו את גורי ואת חשורי, עברו במנהרות ריקוטי והמשיכו מעבר לזסטפוני;
    תחנות דלק יש לכל אורך הדרך. צאו במחלף קוטאיסי ופנו למרכז; המוזיאון נמצא ברחוב ורלמישווילי 25 שברובע
    הקתולי הישן, כמה דקות הליכה משדרות רוסתאוולי. זה כ-230 ק״מ ובערך 3 שעות ו-20 דקות בלי עצירות, אספלט
    לכל האורך, כך שרכב מקטגוריית אקונומי מספיק בהחלט. חנו ברחוב השקט שליד המוזיאון או במרכז, והמשיכו ברגל.
ar:
  name: متحف بيت زكريا بالياشفيلي
  short: >-
    بيت مولد مؤلف الأوبرا الكبير في جورجيا في كوتايسي: مهده، وبيانو «بيكر»، ونص أوبرا «أبيسالوم وإيتيري»
    وعليه ملاحظات بخط يده.
  body: >-
    **يبدأ النشيد الوطني الجورجي، بمعنى ما، في بيت على شارع هادئ في كوتايسي، حيث استقبلت أسرة كاثوليكية
    عام 1871 ثالث أبنائها الثمانية عشر.**


    تعلّم زكريا بالياشفيلي (1871–1933) الموسيقى في جوقة الكنيسة الكاثوليكية في كوتايسي، والبيانو على يد
    فيليكس ميزانداري. ثم انتقل إلى معهد تبليسي للموسيقى وإلى كونسرفتوار موسكو، حيث درس الطباق (الكونتربوان)
    على سيرغي تانييف. وأسس الجمعية الفيلهارمونية الجورجية، وفي 1908 افتتح مدرستها الموسيقية وأدارها سنوات
    بلا أجر؛ ومن 1918 حتى وفاته أدار كونسرفتوار تبليسي. عُرضت أوبراه «أبيسالوم وإيتيري» لأول مرة في تبليسي
    في 21 فبراير 1919، وتلتها «دايسي» و«لاتافرا». وتحمل دار أوبرا تبليسي اسمه، وتقوم على موسيقاه أسس النشيد
    الوطني.


    البيت الذي وُلد فيه، في شارع فارلاميشفيلي رقم 25 في الحي الفرنسي، أو الكاثوليكي، القديم، افتُتح متحفًا
    عام 1963، وقد تبرّع أهل كوتايسي بكثير مما فيه. تستعيد الغرفة الأولى بيت الأسرة، حتى المهد؛ أما الثانية
    فصالون موسيقي خاص من تلك الحقبة. ابحث عن:


    - الهارمونيوم (الفيسهارمونيكا) وبيانو «بيكر» اللذين كانا له، وآلات الجيران التي عزف عليها زكريا صغيرًا

    - وثائق معموديته، ومعطفِ الفرو ذي الحواشي الذهبية الذي كان يرتديه إلى القداس

    - صفحات من نص «أبيسالوم وإيتيري» عليها ملاحظاته، ونسخ من تراتيل قداس القديس يوحنا الذهبي الفم


    يسعد القيّم الذي يعمل في المتحف منذ عقود بأن يريك كيف تعمل الآلات القديمة، وفي بعض الأمسيات تمتلئ
    الغرف بجمهور الحفلات. انتظر اللحظة التي تصدح فيها لوحة مفاتيح قديمة من جديد: في بيت بهذا الصغر، يبدو
    الرجل الذي صارت موسيقاه نشيدًا وطنيًا فجأة كأنه جار.
  tip: >-
    كان الدخول مجانيًا وقت إعداد بحثنا، وكان المتحف يفتح من الثلاثاء إلى الأحد؛ فتحقّق من ذلك محليًا قبل
    الذهاب. إن بدت البوابة الأمامية مغلقة، فافتحها وادخل؛ القيّم في الداخل عادةً. خصّص ساعة، وأكثر إن
    أُخرجت الآلات للعزف. واسأل عن الحفلات المسائية التي تُقام من حين لآخر. الشارع هادئ وسكني، فنادرًا
    ما يكون الوقوف مشكلة. وصالة داويت كاكابادزه للفنون على بعد نحو 600 متر، وكاتدرائية باغراتي على مسافة
    مشي مريحة، فاجمعها كلها في صباح واحد على مهل.
  route: >-
    من تبليسي اتجه غربًا على الطريق S1 (E60) مرورًا بغوري وخاشوري، ثم عبر أنفاق ريكوتي ومرورًا بزستافوني،
    ومحطات الوقود منتشرة على طول الطريق. اخرج عند مخرج كوتايسي وتوجّه إلى المركز؛ يقع المتحف في شارع فارلاميشفيلي
    رقم 25 في الحي الكاثوليكي القديم، على بعد دقائق سيرًا من جادة روستافيلي. المسافة نحو 230 كم ونحو 3
    ساعات و20 دقيقة دون توقف، والطريق معبّد بالكامل، فتكفي سيارة اقتصادية تمامًا. اركن في الشارع الهادئ
    أمام المتحف أو في المركز وامشِ.
