ka:
  name: ნორაშენის ეკლესია
  short: >-
    XV–XVI საუკუნეების სომხური ეკლესია სიონის მახლობლად, 1995 წლიდან დაკეტილი — მის ამბავს დღეს კედლები,
    ჭიშკარი და ეზოს საფლავის ქვები ყვება.
  body: >-
    **სიონის ტაძრიდან ასიოდე მეტრში დგას ეკლესია, რომლის კარი 1995 წლიდან დაკეტილია — და ეს დაკეტილი კარი
    თბილისზე ბევრ ღია კარზე მეტს ამბობს.**


    „ნორაშენი“ სომხურად „ახლად აშენებულს“ ნიშნავს. ეკლესია 1467–1507 წლებში ააგო მდიდარმა სომეხმა დიდებულმა
    სატათმა და ღვთისმშობელს (სომხურად — სურბ ასტვაწაწინ) მიუძღვნა, თანაც პაპის, მამის, მეუღლის, სამი ვაჟისა
    და საკუთარი თავის სახსოვრად. 1650 წელს ეკლესია ახალი ჯულფელი ვაჭრის, ხოჯა ნაზარის, ხარჯით განაახლეს;
    მანვე ერთი წლით ადრე კედელში ხაჩქარი — სომხური ჯვარ-ქვა — ჩაატანინა. 1793 წელს ტაძარი მოხატა ჰოვნათან
    ჰოვნათანიანმა, სომეხ მხატვართა სახელგანთქმული საგვარეულოს წარმომადგენელმა. ორი წლის შემდეგ აღა-მაჰმად-ხანის
    ლაშქარმა თბილისი აიკლო; მძიმედ დაზიანებული ეკლესიის აღდგენა, სავარაუდოდ, 1808 წლამდე გაგრძელდა.


    XIX საუკუნე მისთვის ცოცხალი ხანა იყო — შეკეთებებით, ვაჟთა (1858) და ქალთა (1866) სკოლებით. 1933 წლის
    22 დეკემბერს საბჭოთა ხელისუფლებამ ეკლესია დახურა; 1972 წლისთვის მასში მეცნიერებათა აკადემიის ბიბლიოთეკა
    იყო განთავსებული.


    მერე დავა დაიწყო. 1995 წლის 15 თებერვალს ქართველმა მართლმადიდებელმა სასულიერო პირებმა შენობა ხარების
    სახელობის ეკლესიად აკურთხეს. სომხურმა ეკლესიამ პროტესტი გამოთქვა და ერთ თვეში მხარეები შეთანხმდნენ,
    რომ საკუთრების საკითხის გარკვევამდე ტაძარი დაკეტილი იქნებოდა. საკითხი დღემდე გაურკვეველია. ჟან შარდენი
    1673 წელს და ეგნატე იოსელიანი 1837 წელს მას სომხურ ეკლესიად მოიხსენიებენ; გვიანსაბჭოთა წლებიდან ამას
    ზოგიერთი ქართველი მეცნიერი და საქართველოს ეკლესია ედავებიან. 2015–2016 წლებში, კულტურული მემკვიდრეობის
    დაცვის ეროვნული სააგენტოს გადაწყვეტილებით, კედლები და გუმბათი გაამაგრეს, ეზოში კი ძველი სომხური საფლავის
    ქვები დააბრუნეს.


    დღეს ნორაშენს მხოლოდ გარედან ნახავთ. ჰოვნათანიანის მოხატულობიდან რაც შემორჩა — სომხური წყაროების თქმით,
    1990-იან წლებში ბევრი წაიშალა — დაკეტილი კარის მიღმაა. თბილისში ცოტა შენობა თუ ინახავს ქალაქის შერეულ
    წარსულს ასე აშკარად — და ასე მჭიდროდ, ჭიშკრის მიღმა.
  tip: >-
    ეკლესია დაკეტილია: არც შიგნით შესვლაა შესაძლებელი და არც წირვა-ლოცვა აღესრულება. ეზოს ჭიშკარი ზოგჯერ
    ღიაა, ზოგჯერ — არა, ასე რომ, შესაძლოა, ფასადი და საფლავის ქვები მხოლოდ ქუჩიდან დაინახოთ. 15–30 წუთი
    საკმარისია; ვიზიტი სიონის ტაძარს, დიდ სინაგოგასა და ანჩისხატს შეუთავსეთ — ყველა რამდენიმე წუთის სავალზეა.
    შესვლა უფასოა, საპირფარეშო ადგილზე არ არის, კაფეები კი ირგვლივ ყველა ქუჩაზეა. ქვაფენილი და ჭიშკართან
    კიბე ინვალიდის ეტლითა თუ ბავშვის ეტლით მოსიარულეთათვის ძნელია. ეს ორივე თემისთვის მტკივნეული ადგილია:
    ფოტო წყნარად გადაიღეთ, გამვლელებთან პოლიტიკურ კამათს ნუ გამართავთ და ისე ჩაიცვით, როგორც ნებისმიერ
    ეკლესიაში.
  route: >-
    კარამდე მანქანით ვერ მიხვალთ: კოტე აფხაზის ქუჩა (ყოფილი ლესელიძის) ეკლესიის მიდამოებში საფეხმავლოა.
    თავისუფლების მოედნიდან საავტომობილო გზა დაახლოებით 1,3 კილომეტრია და ცალმხრივი ქუჩებისა და პარკირების
    ძებნის გამო 10 წუთს წაიღებს, ფეხით კი ნახევარ კილომეტრზე ოდნავ მეტია — ჩაუყევით კოტე აფხაზის ქუჩას
    სიონისკენ და ათიოდე წუთში მიხვალთ. მანქანით თუ მოდიხართ, დატოვეთ ფასიან ავტოსადგომზე თავისუფლების
    მოედანთან ან მეიდანთან და 2–5 წუთი ფეხით გაიარეთ. უახლოესი მეტროსადგური „თავისუფლების მოედანია“ (პირველი
    ხაზი). ნებისმიერი ეკონომკლასის მანქანა გამოდგება — აქ სირთულე გზა კი არა, პარკირებაა.
en:
  name: Norashen Armenian Church
  short: >-
    A 15th–16th-century Armenian church a stone's throw from Sioni, locked since 1995 — its story now
    told by its walls, gate and courtyard gravestones.
  body: >-
    **A hundred metres from Sioni Cathedral stands a church that has been locked since 1995 — and its
    closed door says more about Tbilisi than many open ones.**


    Norashen means "newly built" in Armenian. A wealthy Armenian noble named Satat raised it between 1467
    and 1507 and dedicated it to the Holy Mother of God (Surb Astvatsatsin) — and to the memory of his
    grandfather, his father, his wife, their three sons and, last, himself. In 1650 Khoja Nazar, a New
    Julfa merchant, paid for a renovation; a year earlier he had set a khachkar, an Armenian cross-stone,
    into the wall. In 1793 Hovnatan Hovnatanian, of the celebrated family of Armenian painters, covered
    the interior with frescoes. Two years later Agha Mohammad Khan's sack of Tbilisi left it badly damaged;
    repairs probably lasted until 1808.


    After a lively nineteenth century of repairs and parish schools for boys (1858) and girls (1866),
    the Soviet authorities closed it on 22 December 1933; by 1972 it housed an Academy of Sciences library.


    Then came the dispute. On 15 February 1995 Georgian Orthodox clergy consecrated the building as a
    church of the Annunciation; the Armenian Church protested, and within a month both sides agreed to
    close it until ownership was settled. It never has been. Jean Chardin in 1673 and Egnate Ioseliani
    in 1837 both recorded it as Armenian; since the late Soviet years some Georgian scholars and the Georgian
    Church have contested that. In 2015–16 the national heritage agency strengthened the walls and dome
    and returned the original Armenian gravestones to the yard.


    Today you see Norashen only from outside. Whatever survives of Hovnatanian's frescoes — Armenian sources
    say much was erased in the 1990s — lies behind the locked door. Few buildings in Tbilisi hold the
    city's mixed past so plainly, or keep it so firmly behind a gate.
  tip: >-
    The church is closed: no interior visit and no services. The courtyard gate is sometimes open and
    sometimes not, so you may see the facade and gravestones only from the lane. Fifteen to thirty minutes
    is plenty; pair it with Sioni Cathedral, the Great Synagogue and Anchiskhati, all a few minutes' walk
    away. There is no fee and no toilet, but cafés line every surrounding street. Cobbles and steps at
    the gate make it hard going with a wheelchair or pushchair. This is a sore subject for both communities:
    photograph quietly, leave the politics out of conversations with passers-by, and dress as you would
    for any church.
  route: >-
    You cannot drive to the door: Kote Afkhazi Street (formerly Leselidze Street) is pedestrianised around
    the church. From Freedom Square it is about 1.3 km by car — around 10 minutes once you allow for one-way
    loops and the hunt for a space — but only a little over half a kilometre on foot: walk down Kote Afkhazi
    Street towards Sioni and you are there in about ten minutes. If you come by car, leave it in a paid
    car park near Freedom Square or Meidan and walk the last 2–5 minutes. The nearest metro station is
    Freedom Square (Tavisuplebis Moedani, Line 1). Any economy car will do; the challenge here is parking,
    not the road.
ru:
  name: Армянская церковь Норашен
  short: >-
    Армянская церковь XV–XVI веков в двух шагах от Сиони, запертая с 1995 года: её историю теперь рассказывают
    стены, ворота и надгробия во дворе.
  body: >-
    **В сотне метров от собора Сиони стоит церковь, запертая с 1995 года, — и её закрытая дверь говорит
    о Тбилиси больше, чем многие открытые.**


    «Норашен» по-армянски значит «новопостроенный». Церковь возвёл в 1467–1507 годах богатый армянский
    вельможа Сатат и посвятил её Святой Богородице (Сурб Аствацацин) — а заодно памяти своего деда, отца,
    жены, их трёх сыновей и, наконец, самого себя. В 1650 году обновление оплатил Ходжа Назар, купец из
    Новой Джульфы; годом раньше он вмуровал в стену хачкар — армянский крест-камень. В 1793 году Овнатан
    Овнатанян, представитель знаменитой династии армянских художников, расписал интерьер фресками. Два
    года спустя, когда Ага-Мохаммед-хан разорил Тбилиси, церковь сильно пострадала; восстановление, вероятно,
    растянулось до 1808 года.


    После оживлённого XIX века — с ремонтами и приходскими школами для мальчиков (1858) и девочек (1866)
    — советская власть закрыла церковь 22 декабря 1933 года; к 1972 году в ней размещалась библиотека
    Академии наук.


    Потом начался спор. 15 февраля 1995 года грузинское православное духовенство освятило здание как церковь
    Благовещения; Армянская церковь выразила протест, и уже через месяц стороны договорились закрыть храм,
    пока не решится вопрос о собственности. Он не решён до сих пор. И Жан Шарден в 1673 году, и Эгнатэ
    Иоселиани в 1837-м называли церковь армянской; с позднесоветских лет это оспаривают некоторые грузинские
    учёные и Грузинская церковь. В 2015–2016 годах Национальное агентство по охране культурного наследия
    укрепило стены и купол и вернуло во двор подлинные армянские надгробия.


    Сегодня Норашен можно увидеть только снаружи. Всё, что уцелело от фресок Овнатаняна, — по армянским
    источникам, многое было стёрто в 1990-е, — скрыто за запертой дверью. Мало какое здание в Тбилиси
    хранит смешанное прошлое города так откровенно — и так надёжно держит его за воротами.
  tip: >-
    Церковь закрыта: внутрь не попасть, служб нет. Калитка во двор то открыта, то нет, так что фасад и
    надгробия, возможно, придётся разглядывать с улицы. Пятнадцати–тридцати минут вполне хватит; совместите
    визит с собором Сиони, Большой синагогой и Анчисхати — все они в нескольких минутах ходьбы. Вход бесплатный,
    туалета нет, зато кафе — на каждой соседней улице. Брусчатка и ступени у ворот затруднят путь с инвалидной
    или детской коляской. Для обеих общин это больная тема: фотографируйте без шума, не заводите с прохожими
    разговоров о политике и одевайтесь так, как оделись бы в любую церковь.
  route: >-
    К самым дверям не подъехать: улица Котэ Абхази (бывшая Леселидзе) возле церкви пешеходная. От площади
    Свободы на машине около 1,3 км — примерно 10 минут с учётом петель по односторонним улицам и поисков
    парковки, — а пешком чуть больше полукилометра: пройдите по улице Котэ Абхази в сторону Сиони, и минут
    через десять вы на месте. Если едете на машине, оставьте её на платной парковке у площади Свободы
    или у Мейдана и пройдите последние 2–5 минут пешком. Ближайшая станция метро — «Площадь Свободы» (1-я
    линия). Подойдёт любая машина эконом-класса: сложность здесь не дорога, а парковка.
fa:
  name: کلیسای ارمنی نوراشن
  short: >-
    کلیسایی ارمنی از سده‌های پانزدهم و شانزدهم، در چند قدمی سیونی، که از ۱۹۹۵ قفل مانده است — امروز دیوارها،
    دروازه و سنگ‌قبرهای حیاطش داستانش را روایت می‌کنند.
  body: >-
    **در صد متری کلیسای جامع سیونی کلیسایی ایستاده که درش از سال ۱۹۹۵ قفل است — و همین درِ بسته بیش از
    بسیاری درهای گشوده از تفلیس سخن می‌گوید.**


    «نوراشن» در زبان ارمنی یعنی «نوساز». نجیب‌زادهٔ ثروتمند ارمنی‌ای به نام ساتات آن را میان سال‌های ۱۴۶۷
    و ۱۵۰۷ بنا کرد و به مریم مقدس، مادر خدا (سورپ آستوادزادزین)، تقدیم کرد — و نیز به یاد پدربزرگ، پدر،
    همسر، سه پسرشان و سرانجام خودش. در ۱۶۵۰ خواجه نظر، بازرگانی از جلفای نو، هزینهٔ نوسازی آن را پرداخت؛
    او یک سال پیش‌تر خاچکاری — سنگ‌صلیب ارمنی — در دیوار آن کار گذاشته بود. در ۱۷۹۳ هوناتان هوناتانیان،
    از خاندان نامدار نقاشان ارمنی، درون کلیسا را با نقاشی‌های دیواری پوشاند. دو سال بعد، در پی غارت تفلیس
    به دست آقامحمدخان، کلیسا آسیب سختی دید؛ مرمت آن احتمالاً تا ۱۸۰۸ به درازا کشید.


    پس از سدهٔ نوزدهمی پرجنب‌وجوش، با مرمت‌ها و مدرسه‌های کلیسایی برای پسران (۱۸۵۸) و دختران (۱۸۶۶)، مقامات
    شوروی در ۲۲ دسامبر ۱۹۳۳ کلیسا را بستند؛ و تا سال ۱۹۷۲ کتابخانهٔ آکادمی علوم در آن مستقر شده بود.


    سپس مناقشه آغاز شد. در ۱۵ فوریهٔ ۱۹۹۵ روحانیان ارتدکس گرجی بنا را به‌عنوان کلیسای بشارت تقدیس کردند؛
    کلیسای ارمنی اعتراض کرد و ظرف یک ماه دو طرف توافق کردند که تا روشن شدن تکلیف مالکیت، کلیسا بسته بماند.
    این تکلیف هرگز روشن نشد. ژان شاردن در ۱۶۷۳ و اگناته یوسلیانی در ۱۸۳۷ هر دو آن را کلیسایی ارمنی ثبت
    کرده‌اند؛ از سال‌های پایانی دوران شوروی، برخی پژوهشگران گرجی و کلیسای گرجستان این را زیر سؤال برده‌اند.
    در ۲۰۱۵–۲۰۱۶ آژانس ملی حفاظت از میراث فرهنگی دیوارها و گنبد را استحکام بخشید و سنگ‌قبرهای اصیل ارمنی
    را به حیاط بازگرداند.


    امروز نوراشن را فقط از بیرون می‌توان دید. هر آنچه از نقاشی‌های هوناتانیان بر جا مانده — به گفتهٔ منابع
    ارمنی، بخش بزرگی از آن‌ها در دههٔ ۱۹۹۰ پاک شد — پشت درِ قفل‌شده است. کمتر بنایی در تفلیس گذشتهٔ آمیختهٔ
    شهر را این‌چنین آشکار در خود دارد — و این‌چنین محکم پشت دروازه نگهش می‌دارد.
  tip: >-
    کلیسا بسته است: نه می‌توان به درون رفت و نه مراسمی برگزار می‌شود. دروازهٔ حیاط گاهی باز است و گاهی
    نه، پس شاید نما و سنگ‌قبرها را فقط از کوچه ببینید. پانزده تا سی دقیقه کافی است؛ بازدید را با کلیسای
    جامع سیونی، کنیسهٔ بزرگ و کلیسای آنچیسخاتی همراه کنید که همه تنها چند دقیقه پیاده با آن فاصله دارند.
    ورود رایگان است و سرویس بهداشتی ندارد، اما در همهٔ خیابان‌های اطراف کافه پیدا می‌شود. سنگ‌فرش و پله‌های
    کنار دروازه رفت‌وآمد با ویلچر یا کالسکهٔ بچه را دشوار می‌کند. این موضوع برای هر دو جامعه دردناک است:
    آرام عکس بگیرید، سیاست را از گفت‌وگو با رهگذران کنار بگذارید و همان‌گونه لباس بپوشید که برای هر کلیسای
    دیگری می‌پوشید.
  route: >-
    با خودرو نمی‌توانید تا دمِ در بروید: خیابان کوته آبخازی (لسلیدزهٔ سابق) در اطراف کلیسا پیاده‌راه است.
    از میدان آزادی با خودرو حدود ۱٫۳ کیلومتر راه است — با احتساب دور زدن در خیابان‌های یک‌طرفه و گشتن
    به دنبال جای پارک، حدود ۱۰ دقیقه — اما پیاده کمی بیش از نیم کیلومتر: خیابان کوته آبخازی را به سمت
    سیونی بگیرید و بروید؛ حدود ده دقیقه بعد رسیده‌اید. اگر با خودرو می‌آیید، آن را در پارکینگی پولی نزدیک
    میدان آزادی یا «مِیدان» در شهر قدیم بگذارید و ۲ تا ۵ دقیقهٔ آخر را پیاده بروید. نزدیک‌ترین ایستگاه
    مترو «میدان آزادی» است (خط ۱). هر خودروی اقتصادی کافی است؛ دشواری اینجا پارک کردن است، نه جاده.
he:
  name: כנסיית נוראשן הארמנית
  short: >-
    כנסייה ארמנית מהמאות ה-15–16, במרחק קצר מקתדרלת סיוני, נעולה מאז 1995 — את סיפורה מספרים היום קירותיה,
    השער ומצבות הקבר שבחצר.
  body: >-
    **מאה מטרים מקתדרלת סיוני עומדת כנסייה שדלתה נעולה מאז 1995 — והדלת הסגורה הזאת מספרת על טביליסי יותר
    מדלתות פתוחות רבות.**


    "נוראשן" פירושו בארמנית "שנבנה זה עתה". אציל ארמני עשיר בשם סאטאט הקים אותה בין 1467 ל-1507 והקדיש
    אותה לאם האלוהים הקדושה (סורפ אסטבאצאצין) — וגם לזכר סבו, אביו, אשתו, שלושת בניהם, ולבסוף לזכר עצמו.
    ב-1650 מימן ח'וג'ה נזאר, סוחר מג'ולפה החדשה, את חידושה; שנה קודם לכן קבע בקיר חצ'קר — אבן צלב ארמנית.
    ב-1793 כיסה הובנאטן הובנאטניאן, בן למשפחת הציירים הארמנים המהוללת, את פנים הכנסייה בציורי קיר. שנתיים
    לאחר מכן, כשאע'א מוחמד חאן בזז את טביליסי, ניזוקה הכנסייה קשות; תיקונה נמשך כנראה עד 1808.


    אחרי המאה ה-19, שהייתה תוססת — עם שיפוצים ובתי ספר קהילתיים לבנים (1858) ולבנות (1866) — סגרו אותה
    השלטונות הסובייטיים ב-22 בדצמבר 1933; ב-1972 כבר שכנה בה ספריית האקדמיה למדעים.


    אז פרץ הסכסוך. ב-15 בפברואר 1995 קידשו אנשי כמורה גאורגים אורתודוקסים את המבנה ככנסיית הבשורה; הכנסייה
    הארמנית מחתה, ותוך חודש הסכימו שני הצדדים לסגור אותה עד שתוכרע שאלת הבעלות. היא לא הוכרעה מעולם. ז'אן
    שרדן ב-1673 ואגנאטה יוסליאני ב-1837 תיעדו אותה שניהם ככנסייה ארמנית; מאז שנותיה האחרונות של התקופה
    הסובייטית מערערים על כך חלק מהחוקרים הגאורגים והכנסייה הגאורגית. ב-2015–2016 חיזקה הסוכנות הלאומית
    לשימור מורשת התרבות את הקירות ואת הכיפה, והחזירה לחצר את מצבות הקבר הארמניות המקוריות.


    היום אפשר לראות את נוראשן רק מבחוץ. מה ששרד מציורי הקיר של הובנאטניאן — לפי מקורות ארמניים, חלק גדול
    מהם נמחק בשנות ה-90 — נמצא מאחורי הדלת הנעולה. מעט בניינים בטביליסי מחזיקים את עברה המעורב של העיר
    בגלוי כל כך — ושומרים עליו בחוזקה כזאת מאחורי שער.
  tip: >-
    הכנסייה סגורה: אין כניסה פנימה ולא נערכות בה תפילות. שער החצר פתוח לפעמים ולפעמים לא, כך שייתכן שתראו
    את החזית ואת המצבות רק מהסמטה. רבע שעה עד חצי שעה מספיקות; שלבו בביקור את קתדרלת סיוני, את בית הכנסת
    הגדול ואת אנצ'יסחאטי, כולם במרחק דקות ספורות ברגל. הכניסה חינם ואין שירותים, אבל בתי קפה יש בכל הרחובות
    מסביב. אבני המרצפת והמדרגות שבשער מקשות על מי שמגיע עם כיסא גלגלים או עגלת תינוק. זה נושא כואב לשתי
    הקהילות: צלמו בשקט, השאירו את הפוליטיקה מחוץ לשיחות עם עוברים ושבים, והתלבשו כפי שהייתם מתלבשים לכל
    כנסייה.
  route: >-
    אי אפשר להגיע ברכב עד הדלת: רחוב קוטה אבחזי (לשעבר רחוב לסלידזה) הוא מדרחוב בסביבת הכנסייה. מכיכר
    החירות זה כ-1.3 ק"מ ברכב — כ-10 דקות, אם מביאים בחשבון סיבובים ברחובות חד-סטריים וחיפוש חניה — אבל
    ברגל רק קצת יותר מחצי קילומטר: לכו ברחוב קוטה אבחזי לכיוון סיוני ותגיעו בתוך כעשר דקות. אם באתם ברכב,
    השאירו אותו בחניון בתשלום ליד כיכר החירות או ליד מיידאן, ועשו את 2–5 הדקות האחרונות ברגל. תחנת המטרו
    הקרובה היא "כיכר החירות" (קו 1). כל רכב אקונומי יתאים; האתגר כאן הוא החניה, לא הדרך.
ar:
  name: كنيسة نوراشين الأرمنية
  short: >-
    كنيسة أرمنية من القرنين 15 و16 على مرمى حجر من سيوني، موصدة منذ 1995 — تروي قصتها اليوم جدرانها وبوابتها
    وشواهد القبور في فنائها.
  body: >-
    **على بعد مئة متر من كاتدرائية سيوني تقف كنيسة موصدة الباب منذ عام 1995 — وبابها المغلق يقول عن تبليسي
    أكثر مما تقوله أبواب كثيرة مفتوحة.**


    تعني «نوراشين» بالأرمنية «المبنيّ حديثًا». شيّدها نبيل أرمني ثري يُدعى ساتات بين عامَي 1467 و1507،
    وكرّسها للقديسة والدة الإله (سورب أستفاتساتسين) — ولذكرى جدّه وأبيه وزوجته وأبنائهما الثلاثة، ثم لذكرى
    نفسه أخيرًا. وفي عام 1650 موّل خوجة نزار، التاجر القادم من جلفا الجديدة، تجديدها؛ وكان قبل ذلك بعام
    قد ثبّت في جدارها خاتشكارًا، أي حجر صليب أرمنيًا. وفي عام 1793 غطّى هوفناتان هوفناتانيان، سليل أسرة
    الرسامين الأرمن الشهيرة، جدرانها الداخلية بالجداريات. وبعد عامين، حين نهب آغا محمد خان تبليسي، أصيبت
    الكنيسة بأضرار بالغة، ويُرجَّح أن ترميمها استمر حتى عام 1808.


    وبعد قرن تاسع عشر حافل بالترميمات وبمدرستين تابعتين للرعية، للبنين (1858) وللبنات (1866)، أغلقتها
    السلطات السوفيتية في 22 ديسمبر 1933، وبحلول عام 1972 كانت تضمّ مكتبة أكاديمية العلوم.


    ثم جاء النزاع. في 15 فبراير 1995 كرّس رجال دين أرثوذكس جورجيون المبنى كنيسةً للبشارة؛ فاحتجّت الكنيسة
    الأرمنية، وفي غضون شهر اتفق الطرفان على إغلاقها إلى أن يُحسم أمر ملكيتها. ولم يُحسم قط. فقد سجّلها
    كلٌّ من جان شاردان عام 1673 وإغناطي يوسيلياني عام 1837 كنيسةً أرمنية؛ ومنذ أواخر الحقبة السوفيتية
    يعترض على ذلك بعض الباحثين الجورجيين والكنيسة الجورجية. وفي 2015–2016 دعّمت الوكالة الوطنية لحماية
    التراث الثقافي الجدران والقبة، وأعادت شواهد القبور الأرمنية الأصلية إلى الفناء.


    لا يمكنك اليوم أن ترى نوراشين إلا من الخارج. فما بقي من جداريات هوفناتانيان — وتقول مصادر أرمنية إن
    كثيرًا منها مُحي في التسعينيات — يقبع خلف الباب الموصد. وقليلة هي المباني في تبليسي التي تحفظ ماضي
    المدينة المتنوّع بهذا الوضوح — وتُبقيه بهذا الإحكام خلف بوابة.
  tip: >-
    الكنيسة مغلقة: لا زيارة للداخل ولا قداديس. بوابة الفناء مفتوحة أحيانًا ومغلقة أحيانًا، فقد لا ترى
    الواجهة وشواهد القبور إلا من الزقاق. تكفي خمس عشرة إلى ثلاثين دقيقة؛ اجمع الزيارة مع كاتدرائية سيوني
    والكنيس الكبير وكنيسة أنتشيسخاتي، وكلها على بعد دقائق قليلة سيرًا. الدخول مجاني ولا توجد دورة مياه،
    لكن المقاهي تصطف في كل الشوارع المحيطة. الحجارة المرصوفة والدرجات عند البوابة تجعل الوصول صعبًا بكرسي
    متحرك أو عربة أطفال. إنها مسألة مؤلمة لكلتا الطائفتين: صوّر بهدوء، وأبقِ السياسة خارج أحاديثك مع المارّة،
    وارتدِ ما ترتديه عند زيارة أي كنيسة.
  route: >-
    لا يمكنك الوصول بالسيارة إلى الباب: فشارع كوته أبخازي (شارع ليسيليدزه سابقًا) مخصّص للمشاة حول الكنيسة.
    من ساحة الحرية تبلغ المسافة بالسيارة نحو 1.3 كم — قرابة 10 دقائق إذا احتسبت الالتفافات في الشوارع
    ذات الاتجاه الواحد والبحث عن موقف — لكنها سيرًا على الأقدام أكثر بقليل من نصف كيلومتر: امشِ في شارع
    كوته أبخازي باتجاه سيوني وستصل في نحو عشر دقائق. إن جئت بالسيارة فاتركها في موقف مدفوع قرب ساحة الحرية
    أو ميدان، وامشِ الدقائق الأخيرة (2–5 دقائق). أقرب محطة مترو هي «ساحة الحرية» (الخط 1). أي سيارة من
    الفئة الاقتصادية تفي بالغرض؛ فالتحدي هنا إيجاد موقف لا الطريق.
