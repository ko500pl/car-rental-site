ka:
  name: დმანისის არქეოლოგიური ნაქალაქარი
  short: >-
    შუა საუკუნეების აბრეშუმის ქალაქი მაშავერას თავზე, მის სარდაფებს ქვემოთ კი 1,8 მილიონი წლის ადამიანის
    წინაპართა თავის ქალები.
  body: >-
    **დმანისი ერთ კონცხზე ორ ნანგრევს ინახავს, ერთმანეთზე დაწყობილს: შუა საუკუნეების სავაჭრო ქალაქს და
    მისი სარდაფების ქვემოთ — აფრიკის გარეთ ნაპოვნ უძველეს ადამიანის წინაპრებს.**


    ქალაქი მაშავერასა და ფინეზაურის შესართავთან, კონცხზე გაიზარდა. VI საუკუნეში უკვე საეპისკოპოსო კათედრა
    იყო, არაბთა ბატონობისას — ხალხმრავალი ბაზარი; 1123 წელს დავით აღმაშენებელმა აიღო, 1125 წელს კი მისმა
    ძემ, დემეტრემ საბოლოოდ დაიმკვიდრა. აქაური ვაჭრები აბრეშუმს გაჰქონდათ, არქეოლოგებმა კი 800-ზე მეტი
    მონეტა, ირანული ფაიანსი და ჩინური სელადონი იპოვეს. არაბულწარწერიანი მუსლიმური საფლავის ქვები აქ ქრისტიანულს
    რაოდენობით აღემატება. ოქროს ხანა თემურლენგის შემოსევებმა დაასრულა, 1486 წელს კი დარჩენილი აყ-ყოიუნლუს
    ლაშქარმა აიკლო.


    ნანგრევებს შორის დმანისის სიონი დგას — VI საუკუნის ბაზილიკა უხეშად დამუშავებული რუხი ქვისა. 1213–1222
    წლებში, ლაშა-გიორგის მეფობისას, მას დასავლეთიდან ღია მწვანე თლილი ქვით მოპირკეთებული, მდიდრულად მოჩუქურთმებული
    კარიბჭე მიაშენეს და მეფის სახელიც ამოკვეთეს.


    1980-იან წლებში არქეოლოგებმა შენიშნეს, რომ შუა საუკუნეების სამეურნეო ორმოები ფერფლსა და ქვიშაში იყო
    ამოთხრილი, რომელიც პრეისტორიული ძვლებით იყო სავსე. 1991 წლის 25 სექტემბერს ახალგაზრდა ჯგუფმა კბილების
    სრული რიგით შემორჩენილი ქვედა ყბა აღმოაჩინა, ბაზალტის თავზე, რომლის ასაკიც დაახლოებით 1,8 მილიონი
    წელია. 1999–2005 წლებში ხუთი თავის ქალა იპოვეს, მათ შორის მეხუთე — იმ ეპოქის პირველი სრულად შემონახული
    ზრდასრულის თავის ქალა, და მეოთხე — ხანდაზმულისა, რომელსაც სიცოცხლეში ერთი კბილის გარდა ყველა დაეკარგა.
    ისინი ოლდუვაის ტიპის მარტივ ქვის იარაღებს ამზადებდნენ და დიდი ხნის წინ გამქრალი ტბის ნაპირზე, ტყესა
    და ველს შორის ცხოვრობდნენ.


    ღია გათხრას ფარდული ფარავს, პატარა მუზეუმში ასლებია, ორიგინალები კი თბილისში, ეროვნულ მუზეუმში ინახება.


    თხრილის კიდეზე დადექით და არითმეტიკა აზრს კარგავს: ზურგს უკან თხუთმეტი საუკუნის ტაძარი დგას — და აქ
    ის ახალმოსულია.
  tip: >-
    გათხრის ფარდულს, მუზეუმს და ნაქალაქარში გასეირნებას ორი საათი დაუთმეთ. შესვლა მცირე საფასურით, დაახლოებით
    15 ლარადაა. თუ ჯერ თბილისში, ეროვნულ მუზეუმში ორიგინალებს ნახავთ, ადგილი გაცილებით ცოცხლად აღიქმება.
    კონცხი ღიაა და ჩრდილი თითქმის არ არის: ქუდი და წყალი წაიღეთ, უსწორმასწორო მიწისთვის კი მოხერხებული
    ფეხსაცმელი ჩაიცვით. ზაფხულში გათხრები ხშირად მიმდინარეობს და ბილიკიდან მუშაობის ყურებაც შეიძლება;
    თხრილებში ნუ ჩახვალთ. მანქანა შესასვლელთან დგება. საჭმელი, კაფე და ბანკომატი დმანისის ცენტრშია, დაახლოებით
    12 კილომეტრით დასავლეთით.
  route: >-
    მთელი გზა ერთ მაგისტრალს, ს6-ს მიუყვება: თბილისიდან სამხრეთით, ფონიჭალის გავლით მარნეულამდე, შემდეგ
    დასავლეთით ბოლნისისა და სამთო ქალაქ კაზრეთის გავლით, თანდათან ადის ვულკანურ ზეგანზე მაშავერას ხეობის
    თავზე. დაახლოებით 85 კილომეტრი და ორ საათზე ცოტა ნაკლებია. მარნეულამდე გზა ფართოა, მერე ვიწროვდება,
    მაგრამ ასფალტიანია; მხოლოდ ნაქალაქარამდე ბოლო ორიოდე კილომეტრია უხეში, რასაც მშრალ ამინდში ეკონომ
    კლასის მანქანაც უმკლავდება. საწვავი მარნეულსა და ბოლნისშია. იმავე დღეს ბუნებრივად ერთვება ბოლნისის
    სიონის, წუღრუღაშენისა და ფიტარეთის ტაძრები.
en:
  name: Dmanisi
  short: >-
    A ruined medieval silk town above the Mashavera, and beneath its cellars 1.8-million-year-old skulls
    from one of humanity's earliest journeys out of Africa.
  body: >-
    **Dmanisi keeps two ruins stacked on one promontory: a medieval trading town and, below its cellars,
    the oldest human ancestors ever found outside Africa.**


    The town grew on the headland where the Mashavera and Pinezauri rivers meet. A bishop's seat by the
    6th century and a busy market under Arab rule, it was taken by David the Builder in 1123 and secured
    by his son Demetre in 1125. Its merchants exported silk, and excavators have found more than 800 coins,
    Iranian faience and Chinese celadon. The Muslim tombstones with Arabic inscriptions outnumber the
    Christian ones. Timur's invasions ended the golden age, and in 1486 an Aq Qoyunlu army sacked what
    was left.


    Among the ruins stands Dmanisi Sioni, a 6th-century basilica of rough grey stone. Between 1213 and
    1222, under King Lasha-Giorgi, it gained a west porch faced with pale green carved stone, and his
    name is cut into it.


    In the 1980s archaeologists noticed that medieval storage pits had been dug into ash and sand full
    of prehistoric bones. On 25 September 1991 a young team uncovered a jaw with a full row of teeth,
    lying above basalt dated to about 1.8 million years. Between 1999 and 2005 five skulls followed, among
    them Skull 5, the first complete adult skull of that age found anywhere, and Skull 4, an old individual
    who had lost all but one tooth. They made simple Oldowan stone tools and lived by the shore of a long-vanished
    lake, amid forest and grassland.


    A shelter covers the open dig, and a small museum shows casts; the originals are in the National Museum
    in Tbilisi.


    Stand at the edge of the trench and the arithmetic stops making sense: the church behind you is fifteen
    centuries old, and it is the newcomer.
  tip: >-
    Allow two hours for the dig shelter, the museum and a walk through the medieval town. There is a modest
    entry fee, around 15 ₾. Seeing the originals in the National Museum in Tbilisi first makes the site
    far more vivid. The promontory is open and almost shadeless, so bring a hat and water; wear shoes
    for uneven ground. In summer the excavation is often active and you may watch the team at work from
    the walkway; please stay off the trenches. Parking is at the entrance. For food, cafés and an ATM,
    go to Dmanisi town, about 12 km to the west.
  route: >-
    The whole way follows one road, the S6: south from Tbilisi past Ponichala to Marneuli, then west through
    Bolnisi and the mining town of Kazreti, climbing gradually on to the volcanic plateau above the Mashavera
    gorge. It is about 85 km and a little under two hours. The road is wide as far as Marneuli and narrower
    after it, but paved; only the last couple of kilometres to the site are rough, and an economy car
    copes in dry weather. Fuel is available in Marneuli and Bolnisi. The churches of Bolnisi Sioni, Tsughrughasheni
    and Pitareti make a natural loop on the same day.
ru:
  name: Дманиси
  short: >-
    Руины средневекового шёлкового города над Машаверой, а под его погребами — черепа возрастом 1,8 млн
    лет, свидетели одного из первых выходов человека из Африки.
  body: >-
    **Дманиси хранит на одном мысу две руины, одну над другой: средневековый торговый город, а под его
    погребами — древнейших предков человека, когда-либо найденных за пределами Африки.**


    Город вырос на мысу при слиянии рек Машавера и Пинезаури. К VI веку здесь была епископская кафедра,
    при арабах — оживлённый рынок; в 1123 году город взял Давид Строитель, а в 1125-м окончательно закрепил
    за Грузией его сын Деметре. Здешние купцы вывозили шёлк, и археологи нашли больше 800 монет, иранский
    фаянс и китайский селадон. Мусульманских надгробий с арабскими надписями здесь больше, чем христианских.
    Нашествия Тимура оборвали золотой век, а в 1486 году войско Ак-Коюнлу разорило то, что осталось.


    Среди руин стоит Дманисский Сиони — базилика VI века из грубого серого камня. Между 1213 и 1222 годами,
    при царе Лаше-Георгии, к ней пристроили западный притвор, облицованный резным бледно-зелёным камнем,
    и имя царя высечено на нём.


    В 1980-х археологи заметили, что средневековые хозяйственные ямы врезаны в пепел и песок, полные доисторических
    костей. 25 сентября 1991 года молодая команда откопала челюсть с полным рядом зубов, лежавшую над
    базальтом возрастом около 1,8 миллиона лет. С 1999 по 2005 год последовали пять черепов, среди них
    Череп 5 — первый полностью сохранившийся череп взрослого гоминина такой древности, найденный где-либо,
    и Череп 4, принадлежавший старому индивиду, потерявшему все зубы, кроме одного. Эти люди делали простые
    олдувайские каменные орудия и жили на берегу давно исчезнувшего озера, среди леса и лугов.


    Над открытым раскопом устроен навес, в небольшом музее выставлены слепки; оригиналы хранятся в Национальном
    музее в Тбилиси.


    Встаньте на краю траншеи — и арифметика перестаёт сходиться: церкви за вашей спиной пятнадцать веков,
    и здесь она новичок.
  tip: >-
    Отведите два часа на навес над раскопом, музей и прогулку по средневековому городу. Вход платный,
    но недорогой — около 15 ₾. Если сначала увидеть оригиналы в Национальном музее в Тбилиси, место оживёт
    гораздо ярче. Мыс открыт всем ветрам и почти без тени, так что возьмите головной убор и воду; для
    неровной почвы наденьте удобную обувь. Летом раскопки часто идут полным ходом, и за работой команды
    можно понаблюдать с мостков — пожалуйста, не спускайтесь в траншеи. Парковка у входа. Поесть, посидеть
    в кафе и снять деньги можно в городе Дманиси, примерно в 12 км к западу.
  route: >-
    Весь путь — по одной дороге, S6: на юг из Тбилиси мимо Поничалы до Марнеули, затем на запад через
    Болниси и горняцкий городок Казрети, постепенно поднимаясь на вулканическое плато над ущельем Машаверы.
    Около 85 км и чуть меньше двух часов. До Марнеули дорога широкая, после — уже, но асфальтированная;
    только последние пару километров до памятника неровные, и машина эконом-класса справится с ними в
    сухую погоду. Заправки есть в Марнеули и Болниси. Церкви Болнисский Сиони, Цугругашени и Питарети
    естественно складываются с Дманиси в кольцевой маршрут на один день.
fa:
  name: دمانیسی
  short: >-
    ویرانه‌های شهر ابریشمِ سده‌های میانه بر فراز ماشاورا، و زیر سرداب‌هایش جمجمه‌هایی ۱٫۸ میلیون‌ساله
    از یکی از نخستین سفرهای بشر به بیرون از آفریقا.
  body: >-
    **دمانیسی دو ویرانه را روی هم بر یک دماغه نگه داشته است: شهری تجاری از سده‌های میانه و، زیر سرداب‌هایش،
    کهن‌ترین نیاکان انسان که تاکنون بیرون از آفریقا یافته شده‌اند.**


    شهر بر دماغه‌ای در محل پیوستن رودهای ماشاورا و پینزائوری بالید. تا سدهٔ ششم مقر اسقف بود و در دوران
    فرمانروایی عرب‌ها بازاری پررونق؛ داوید سازنده در ۱۱۲۳ آن را گرفت و پسرش دمتره در ۱۱۲۵ آن را استوار
    کرد. بازرگانانش ابریشم صادر می‌کردند و کاوشگران بیش از ۸۰۰ سکه، سفالینهٔ لعابی ایرانی و سلادون چینی
    یافته‌اند. سنگ‌گورهای مسلمانان با کتیبه‌های عربی از سنگ‌گورهای مسیحی بیشترند. یورش‌های تیمور به دوران
    طلایی پایان داد و در ۱۴۸۶ سپاه آق‌قویونلو آن‌چه را مانده بود غارت کرد.


    در میان ویرانه‌ها سیونی دمانیسی ایستاده است، باسیلیکایی از سدهٔ ششم با سنگ خاکستریِ زبر. میان ۱۲۱۳
    و ۱۲۲۲، در روزگار شاه لاشا-گیورگی، ایوانی غربی با روکش سنگ کنده‌کاری‌شدهٔ سبز کم‌رنگ به آن افزوده
    شد و نام او بر آن حک شده است.


    در دههٔ ۱۹۸۰ باستان‌شناسان دریافتند که گودال‌های انبار سده‌های میانه در خاکستر و ماسه‌ای پر از استخوان‌های
    پیش‌ازتاریخی کنده شده‌اند. در ۲۵ سپتامبر ۱۹۹۱ گروهی جوان فک پایینی با ردیف کامل دندان را از خاک بیرون
    آوردند که بر بازالتی به قدمت حدود ۱٫۸ میلیون سال آرمیده بود. میان ۱۹۹۹ و ۲۰۰۵ پنج جمجمه در پی آمد،
    از جمله جمجمهٔ ۵، نخستین جمجمهٔ کامل یک فرد بالغ از آن دوران که در هیچ جای جهان یافته شده، و جمجمهٔ
    ۴، از فردی سالخورده که همهٔ دندان‌هایش جز یکی را از دست داده بود. آنان ابزارهای سنگی سادهٔ اولدوانی
    می‌ساختند و کنار دریاچه‌ای که دیرزمانی است ناپدید شده، در میان جنگل و علفزار، می‌زیستند.


    سایبانی کاوشگاه باز را پوشانده و موزه‌ای کوچک قالب‌ها را نشان می‌دهد؛ نمونه‌های اصلی در موزهٔ ملی
    تفلیس است.


    بر لبهٔ ترانشه بایستید تا حساب‌وکتاب از کار بیفتد: کلیسای پشت سرتان پانزده سده عمر دارد، و با این
    حال این‌جا اوست که تازه‌وارد است.
  tip: >-
    دو ساعت برای سایبان کاوشگاه، موزه و گشتی در شهر سده‌های میانه وقت بگذارید. ورودیه‌ای مختصر، حدود ۱۵
    لاری (₾)، دارد. اگر نخست نمونه‌های اصلی را در موزهٔ ملی تفلیس ببینید، این مکان بسیار زنده‌تر می‌شود.
    دماغه باز و تقریباً بی‌سایه است، پس کلاه و آب بردارید و برای زمین ناهموار کفش مناسب بپوشید. تابستان‌ها
    کاوش اغلب در جریان است و می‌توانید کار گروه را از روی گذرگاه چوبی تماشا کنید؛ لطفاً وارد ترانشه‌ها
    نشوید. پارکینگ کنار ورودی است. برای غذا، کافه و خودپرداز به شهر دمانیسی، حدود ۱۲ کیلومتر در غرب، بروید.
  route: >-
    سراسر راه یک جاده است، S6: از تفلیس به جنوب، از کنار پونیچالا تا مارنئولی، سپس به غرب از بولنیسی و
    شهرک معدنی کازرتی، و آرام‌آرام بالا می‌رود تا فلات آتشفشانیِ بالای درهٔ ماشاورا. مسافت حدود ۸۵ کیلومتر
    و زمان آن کمی کمتر از دو ساعت است. جاده تا مارنئولی پهن است و پس از آن باریک‌تر اما آسفالت؛ تنها دو
    کیلومتر پایانی تا محوطه ناهموار است و خودروی اکونومی در هوای خشک از پسش برمی‌آید. سوخت در مارنئولی
    و بولنیسی هست. کلیساهای سیونی بولنیسی، تسوغروغاشنی و پیتارتی در همان روز حلقه‌ای طبیعی با این‌جا می‌سازند.
he:
  name: דמניסי
  short: >-
    חורבות עיר משי מימי הביניים מעל נהר משאוורה, ומתחת למרתפיה גולגולות בנות 1.8 מיליון שנה מאחד המסעות
    הראשונים של האדם אל מחוץ לאפריקה.
  body: >-
    **דמניסי שומרת שתי חורבות זו על גבי זו על לשון קרקע אחת: עיר מסחר מימי הביניים, ומתחת למרתפיה — אבות
    האדם העתיקים ביותר שנמצאו אי פעם מחוץ לאפריקה.**


    העיר צמחה על לשון הקרקע שבה נפגשים הנהרות משאוורה ופינזאורי. במאה השישית כבר ישב בה בישוף, ותחת השלטון
    הערבי היה בה שוק הומה; דוד הבנאי כבש אותה ב-1123, ובנו דמטרה ביסס את השליטה בה ב-1125. סוחריה ייצאו
    משי, והחופרים מצאו יותר מ-800 מטבעות, קדרות מזוגגת איראנית וסלדון סיני. מצבות מוסלמיות עם כתובות בערבית
    רבות כאן מן הנוצריות. פלישות טימור שמו קץ לתור הזהב, וב-1486 בזז צבא אק קוינלו את מה שנותר.


    בין החורבות ניצבת דמניסי סיוני, בזיליקה מן המאה השישית מאבן אפורה גסה. בין 1213 ל-1222, בימי המלך
    לשה-גיורגי, נוספה לה אכסדרה מערבית מצופה אבן מגולפת בירוק חיוור, ושמו של המלך חקוק בה.


    בשנות השמונים של המאה ה-20 הבחינו הארכיאולוגים שבורות האחסון מימי הביניים נחפרו לתוך אפר וחול מלאים
    עצמות פרהיסטוריות. ב-25 בספטמבר 1991 חשף צוות צעיר לסת עם שורת שיניים שלמה, שהייתה מונחת מעל בזלת
    שגילה כ-1.8 מיליון שנה. בין 1999 ל-2005 נמצאו חמש גולגולות, ובהן גולגולת 5, הגולגולת השלמה הראשונה
    של פרט בוגר מאותה תקופה שנמצאה בעולם, וגולגולת 4, של פרט זקן שאיבד את כל שיניו מלבד אחת. הם ייצרו
    כלי אבן פשוטים מתעשיית אולדואי וחיו על שפת אגם שנעלם מזמן, בין יער לשטחי עשב.


    סככה מכסה את החפירה הפתוחה, ומוזיאון קטן מציג יציקות; הגולגולות המקוריות שמורות במוזיאון הלאומי בטביליסי.


    עמדו על שפת התעלה, והחשבון מפסיק להסתדר: הכנסייה שמאחוריכם בת חמש עשרה מאות שנה, והיא העולה החדשה
    כאן.
  tip: >-
    הקדישו שעתיים לסככת החפירה, למוזיאון ולסיור בעיר מימי הביניים. דמי הכניסה צנועים, כ-15 לארי (₾). אם
    תראו קודם את הגולגולות המקוריות במוזיאון הלאומי בטביליסי, האתר יתעורר לחיים הרבה יותר. לשון הקרקע
    חשופה וכמעט בלי צל, אז הביאו כובע ומים, ונעלו נעליים לקרקע לא אחידה. בקיץ החפירה פעילה לעתים קרובות,
    ואפשר לצפות בצוות בעבודה מן השביל המוגבה; אנא אל תרדו לתעלות. החניה בכניסה. לאוכל, לבתי קפה ולכספומט
    סעו לעיירה דמניסי, כ-12 ק"מ מערבה.
  route: >-
    כל הדרך היא כביש אחד, S6: דרומה מטביליסי על פני פוניצ'לה עד מרנאולי, ואז מערבה דרך בולניסי ועיירת
    המכרות קזרטי, בעלייה הדרגתית אל הרמה הגעשית שמעל ערוץ משאוורה. כ-85 ק"מ וקצת פחות משעתיים. הכביש רחב
    עד מרנאולי וצר יותר אחריה, אבל סלול; רק שני הקילומטרים האחרונים בערך עד האתר משובשים, ומכונית אקונומי
    מסתדרת איתם במזג אוויר יבש. דלק יש במרנאולי ובבולניסי. הכנסיות בולניסי סיוני, צוגרוגשני ופיטרטי יוצרות
    עם דמניסי לולאה טבעית באותו יום.
ar:
  name: دمانيسي
  short: >-
    أطلال مدينة حرير من العصور الوسطى فوق نهر ماشافيرا، وتحت أقبيتها جماجم عمرها 1.8 مليون سنة من أولى
    رحلات البشر خارج أفريقيا.
  body: >-
    **تحتفظ دمانيسي بأطلالين متراكبين على نتوء واحد: مدينة تجارية من العصور الوسطى، وتحت أقبيتها أقدم
    أسلاف الإنسان الذين عُثر عليهم يوماً خارج أفريقيا.**


    نشأت المدينة على الرأس الذي يلتقي عنده نهرا ماشافيرا وبينيزاوري. كانت مقراً لأسقف بحلول القرن السادس،
    وسوقاً عامرة في ظل الحكم العربي، ثم استولى عليها داود البنّاء عام 1123 وثبّت ابنه ديميتري السيطرة
    عليها عام 1125. كان تجارها يصدّرون الحرير، وعثر المنقبون على أكثر من 800 قطعة نقدية وخزف مزجّج إيراني
    وسيلادون صيني. وشواهد القبور الإسلامية ذات النقوش العربية هنا أكثر عدداً من المسيحية. وأنهت غزوات
    تيمور العصر الذهبي، وفي عام 1486 نهب جيش آق قويونلو ما تبقّى.


    وبين الأطلال تقف كنيسة سيوني دمانيسي، وهي بازيليكا من القرن السادس من الحجر الرمادي الخشن. وبين عامَي
    1213 و1222، في عهد الملك لاشا-غيورغي، أُضيف إليها رواق غربي مكسوّ بحجر منحوت أخضر شاحب، ونُقش عليه
    اسم الملك.


    في ثمانينيات القرن العشرين لاحظ علماء الآثار أن حفر التخزين من العصور الوسطى قد حُفرت في رماد ورمل
    مليئين بعظام من عصور ما قبل التاريخ. وفي 25 سبتمبر 1991 كشف فريق شاب عن فك بصف كامل من الأسنان، كان
    يرقد فوق بازلت يعود عمره إلى نحو 1.8 مليون سنة. وبين عامَي 1999 و2005 تلته خمس جماجم، منها الجمجمة
    5، أول جمجمة كاملة لفرد بالغ من تلك الحقبة يُعثر عليها في أي مكان، والجمجمة 4، لفرد مسنّ فقد أسنانه
    كلها إلا سناً واحدة. وكانوا يصنعون أدوات حجرية أولدوانية بسيطة، ويعيشون على ضفة بحيرة اختفت منذ زمن
    بعيد، بين الغابات والمراعي.


    تغطي مظلةٌ موقعَ التنقيب المكشوف، ويعرض متحف صغير نسخاً مصبوبة؛ أما الأصول ففي المتحف الوطني في تبليسي.


    قف على حافة الخندق فيكفّ الحساب عن أن يستقيم: الكنيسة التي خلفك عمرها خمسة عشر قرناً، وهي هنا الوافدة
    الجديدة.
  tip: >-
    خصّص ساعتين لمظلة التنقيب والمتحف وجولة في مدينة العصور الوسطى. رسم الدخول متواضع، نحو 15 لاري (₾).
    ورؤية الأصول أولاً في المتحف الوطني في تبليسي تجعل الموقع أكثر حياة بكثير. النتوء مكشوف ويكاد يخلو
    من الظل، فأحضر قبعة وماءً، وارتدِ حذاءً يناسب الأرض غير المستوية. في الصيف كثيراً ما يكون التنقيب
    جارياً، ويمكنك مشاهدة الفريق وهو يعمل من الممشى؛ ويُرجى عدم النزول إلى الخنادق. الموقف عند المدخل.
    وللطعام والمقاهي والصراف الآلي اذهب إلى بلدة دمانيسي، على بعد نحو 12 كم غرباً.
  route: >-
    تسلك الرحلة كلها طريقاً واحداً، S6: جنوباً من تبليسي مروراً ببونيتشالا حتى مارنيولي، ثم غرباً عبر
    بولنيسي وبلدة التعدين كازريتي، صعوداً تدريجياً إلى الهضبة البركانية فوق وادي ماشافيرا. المسافة نحو
    85 كم وأقل قليلاً من ساعتين. الطريق عريض حتى مارنيولي وأضيق بعدها لكنه معبّد؛ ولا يسوء الطريق إلا
    في الكيلومترين الأخيرين حتى الموقع، وتتدبّرهما سيارة اقتصادية في الطقس الجاف. الوقود متوفر في مارنيولي
    وبولنيسي. وتشكّل كنائس بولنيسي سيوني وتسوغروغاشيني وبيتاريتي مع دمانيسي حلقة طبيعية في اليوم نفسه.
