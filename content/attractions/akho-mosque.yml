ka:
  name: ახოს მეჩეთი
  short: >-
    აჭარის უძველესი შემორჩენილი მეჩეთი: 1818 წლის ორსართულიანი ხის სალოცავი, სოფლის ძველ სასაფლაოზე, აჭარისწყლის
    ხეობის თავზე.
  body: >-
    **1818 წელს, როცა აჭარა ჯერ კიდევ ოსმალეთის სულთანს ემორჩილებოდა, ლაზმა ოსტატმა უსტა ჰუსეინმა სოფელ
    ახოში ხის სალოცავი ააგო — და ის დღესაც დგას.**


    ეს აჭარაში შემორჩენილი ყველაზე ძველი მეჩეთია, თუმცა საფოსტო ბარათებიდან ნაცნობ მეჩეთებს არ ჰგავს —
    უფრო დიდ სოფლურ სახლს მოგაგონებთ. ორსართულიანი ხის ნაგებობა, 8,8 × 9,3 მეტრი, კრამიტითაა გადახურული
    და სოფლის ძველი სასაფლაოს საფლავებს შორის დგას. ქვედა სართული სარდაფია, ლოცულობენ ზემოთ, დარბაზში,
    რომელსაც ფანჯრების ორი რიგი ანათებს.


    შიგნით უკვე ოსტატის ხელი ლაპარაკობს. მინბარი და გალერეის მოაჯირი ამოკვეთილი, რამდენიმე ფერად შეღებილი
    ჩუქურთმითაა დაფარული: ოსმალური მოტივები აქ ქართულ ხალხურ ხუროთმოძღვრებას ხვდება. სამხრეთ კედელში მიჰრაბია,
    კბილანებიანი თაღით და არაბული წარწერით. თავი ასწიეთ: გუმბათი ოდესღაც ზეთის საღებავებით იყო მოხატული,
    დაზიანებული მხატვრობა კი ახლა უბრალო ბოჭკოვანი ფილების მიღმაა დამალული.


    შენობა თავის მძიმე საუკუნეს არ მალავს. მინარეთის ძირთან ჩადებული საძირკვლის ქვა 1921–1922 წლების განახლებას
    იუწყება. მინარეთის ქვედა ნაწილი მშრალი წყობისაა — 1920-იან წლებში დანგრეული ძველი მინარეთის ნაშთი;
    დანარჩენი 1990-იან წლებში ააშენეს. იმავე ათწლეულში დაუბრუნდა სოფელს საბჭოთა დროს დახურული მეჩეთიც.
    ორიგინალი ჩუქურთმიანი კარი ბათუმში, აჭარის სახელმწიფო მუზეუმში წაიღეს; კარი, რომელსაც დღეს აღებთ,
    მისი ასლია.


    ახოს მეჩეთი ერთდროულად მოქმედი სალოცავიცაა და ეროვნული მნიშვნელობის ძეგლიც — პატარა, წყნარი და ბოლომდე
    ნამდვილი.
  tip: >-
    ახოს მეჩეთი მოქმედი სალოცავია და არა მუზეუმი: შესვლა უფასოა, სანახავად განსაზღვრული საათები არ აქვს,
    ნახევარი საათიც საკმარისია. ლოცვის დროს ნუ მიხვალთ, პარასკევის შუადღეს — მით უმეტეს. მოკრძალებულად
    ჩაიცვით; ქალებმა თავი დაიფარონ, სალოცავ დარბაზში კი ფეხსაცმელს იხდიან. თუ კარი დაკეტილია, სოფელში
    თავაზიანად იკითხეთ. გარშემო სასაფლაო დღესაც მოქმედია, ამიტომ ბილიკებს გაჰყევით, ვინმეს გადაღებამდე
    კი ნებართვა ითხოვეთ. ახოში არც საპირფარეშოა, არც კაფე და არც საწვავი — სამივე ქედაშია. ორიგინალი ჩუქურთმიანი
    კარი ბათუმის, აჭარის სახელმწიფო მუზეუმში წაიღეს: იქ იკითხეთ, გამოფენილია თუ არა.
  route: >-
    მთელი წლის მარშრუტი ზღვისპირეთზე გადის: ს1-ით (E60) დასავლეთით, ქუთაისის გავლით, ზღვამდე და ბათუმამდე,
    იქიდან კი შ1-ით აჭარისწყლის ხეობას ქედის გავლით აუყევით — დაახლოებით 410 კილომეტრი და ექვსნახევარი
    საათი, ბოლომდე ასფალტით; ეკონომკლასის მანქანა საკმარისია. არსებობს უფრო მოკლე გზაც — დაახლოებით 340
    კილომეტრი და ექვსი საათი და ათი წუთი: ს1-ით ხაშურამდე, ს8-ით ბორჯომის გავლით ახალციხემდე, შემდეგ შ1-ით
    გოდერძის უღელტეხილზე და იქიდან ხეობაში, ხულოსა და შუახევის გავლით. უღელტეხილი მხოლოდ უთოვლო თვეებშია
    გასავლელი, თხემთან რამდენიმე კილომეტრი ჯერაც გრუნტისაა, ზოგი ქირავნობის ხელშეკრულება კი ამ გზას კრძალავს.
    ახო შ1-თან ახლოს, შუახევსა და ქედას შორისაა, ვიწრო სასოფლო გზის მოკლე აღმართის ბოლოს; გზა მეტწილად
    მოასფალტებულია, თუმცა ძლიერი წვიმის შემდეგ ფრთხილად იარეთ. საწვავი ქედაში, ხულოში ან ახალციხეში ჩაასხით.
en:
  name: Akho Mosque
  short: >-
    Adjara's oldest surviving mosque: a two-storey timber prayer house of 1818, standing among the graves
    of an old village cemetery above the Adjaristsqali.
  body: >-
    **In 1818, when Adjara still answered to the Ottoman sultan, a Laz carpenter called Usta Hussein raised
    a prayer house of timber in the village of Akho, and it is still standing.**


    It is the oldest mosque to survive anywhere in Adjara, yet it looks less like the mosques of postcards
    than like a large village house. Two storeys of wood, 8.8 by 9.3 metres, roofed with ceramic tiles,
    stand among the graves of an old cemetery. The ground floor is a cellar; prayer happens upstairs,
    in a hall lit by two tiers of windows.


    Inside, the carpenter's hand does the talking. The minbar and the balustrade of the gallery are covered
    in incised carving painted in several colours, where Ottoman motifs meet the ornament of Georgian
    vernacular building. In the south wall the mihrab sits under a toothed arch with an Arabic inscription.
    Look up: the dome was once painted in oils, but the damaged pictures now hide behind plain fibreboard.


    The building wears its hard century openly. A foundation stone at the foot of the minaret records
    a renovation in 1921/22. The minaret's lower courses are dry-stone masonry, all that is left of an
    older tower demolished in the 1920s; the rest was rebuilt in the 1990s, the same decade in which the
    mosque, closed under Soviet rule, began to serve the village again. The original carved door was taken
    to the Adjara State Museum in Batumi. The one you push open today is a replica.


    A working mosque and a national monument at once, Akho is small, quiet and entirely genuine.
  tip: >-
    Akho is a working mosque, not a museum: entry is free, there are no set visiting hours, and half an
    hour is enough. Come outside prayer times and avoid Friday midday. Dress modestly; women should cover
    their hair, and shoes come off at the door of the prayer hall. If the building is locked, ask politely
    in the village. The cemetery around it is still in use, so keep to the paths, and ask before photographing
    anyone. Akho has no toilets, café or fuel; Keda has all three. The original carved door went to the
    Adjara State Museum in Batumi, so ask there whether it is on display.
  route: >-
    All year, the way in is via the coast: the S1 (E60) west past Kutaisi to the coast and Batumi, then
    up the Adjaristsqali valley on the Sh1 through Keda — about 410 km and six and a half hours, asphalt
    throughout and fine in an economy car. There is also a shorter road, about 340 km and six hours ten
    minutes: the S1 west to Khashuri, the S8 through Borjomi to Akhaltsikhe, then the Sh1 over the Goderdzi
    Pass and down the valley through Khulo and Shuakhevi. The pass is for the snow-free months only, a
    few kilometres near the top are still dirt, and some rental contracts exclude it. Akho lies just off
    the Sh1 between Shuakhevi and Keda, up a short, narrow village lane, largely paved but slow after
    heavy rain. Fuel in Keda, Khulo or Akhaltsikhe.
ru:
  name: Мечеть Ахо
  short: >-
    Старейшая сохранившаяся мечеть Аджарии: двухэтажный деревянный молельный дом 1818 года среди могил
    старого сельского кладбища над Аджарисцкали.
  body: >-
    **В 1818 году, когда Аджария ещё подчинялась османскому султану, плотник-лаз по имени Уста Хусейн
    поставил в селе Ахо деревянный молельный дом — и тот стоит до сих пор.**


    Это старейшая из мечетей, уцелевших во всей Аджарии, но похожа она не столько на мечети с открыток,
    сколько на большой сельский дом. Два деревянных этажа размером 8,8 на 9,3 метра под черепичной крышей
    стоят среди могил старого кладбища. Нижний этаж — погреб; молятся наверху, в зале, освещённом двумя
    ярусами окон.


    Внутри говорит рука плотника. Минбар и балюстраду галереи покрывает врезная резьба, расписанная в
    несколько цветов: в ней османские мотивы встречаются с орнаментом грузинского народного зодчества.
    В южной стене — михраб под зубчатой аркой, с арабской надписью. Поднимите глаза: купол когда-то был
    расписан маслом, но повреждённые изображения теперь скрыты за простыми листами ДВП.


    Здание не скрывает своего трудного века. Закладной камень у подножия минарета сообщает о ремонте 1921/22
    года. Нижние ряды минарета сложены насухо, без раствора, — всё, что осталось от более старой башни,
    снесённой в 1920-х годах; остальное восстановили в 1990-х — в то самое десятилетие, когда закрытая
    при советской власти мечеть снова начала служить селу. Подлинную резную дверь увезли в Государственный
    музей Аджарии в Батуми. Та, которую вы открываете сегодня, — копия.


    Действующая мечеть и одновременно памятник национального значения, Ахо невелика, тиха и совершенно
    подлинна.
  tip: >-
    Ахо — действующая мечеть, а не музей: вход свободный, определённых часов посещения нет, получаса достаточно.
    Приходите вне времени молитв и не приезжайте в пятницу в полдень. Одевайтесь скромно; женщинам нужно
    покрыть волосы, а у входа в молельный зал снимают обувь. Если здание заперто, вежливо спросите в селе.
    Кладбище вокруг действующее, поэтому держитесь тропинок и спрашивайте разрешения, прежде чем кого-то
    фотографировать. В Ахо нет ни туалетов, ни кафе, ни заправки; в Кеде есть всё это. Подлинная резная
    дверь хранится в Государственном музее Аджарии в Батуми — спросите там, выставлена ли она.
  route: >-
    Круглый год можно ехать через побережье: по S1 (E60) на запад мимо Кутаиси к морю и Батуми, а оттуда
    по Sh1 вверх по долине Аджарисцкали через Кеду — около 410 км и шесть с половиной часов, асфальт на
    всём пути, машина эконом-класса справится. Есть и путь короче — около 340 км и шесть часов десять
    минут: по S1 на запад до Хашури, по S8 через Боржоми до Ахалцихе, затем по Sh1 через перевал Годердзи
    и вниз по долине через Хуло и Шуахеви. Перевал открыт только в бесснежные месяцы, несколько километров
    у вершины всё ещё грунтовые, а некоторые договоры проката его исключают. Ахо лежит чуть в стороне
    от Sh1, между Шуахеви и Кедой: к нему поднимается короткий узкий сельский проезд, в основном асфальтированный,
    но медленный после сильного дождя. Заправки — в Кеде, Хуло или Ахалцихе.
fa:
  name: مسجد آخو
  short: >-
    کهن‌ترین مسجد برجامانده در آجارا: نمازخانه‌ای چوبی و دوطبقه از سال ۱۸۱۸، در میان گورهای گورستان کهنهٔ
    روستا، بالای رود آجاریس‌تسکالی.
  body: >-
    **در ۱۸۱۸، زمانی که آجارا هنوز زیر فرمان سلطان عثمانی بود، نجاری لاز به نام اوستا حسین در روستای آخو
    نمازخانه‌ای از چوب برپا کرد — و آن نمازخانه هنوز سرپاست.**


    این کهن‌ترین مسجدی است که در سراسر آجارا برجا مانده، اما بیشتر به خانه‌ای بزرگ و روستایی می‌ماند تا
    به مسجدهای کارت‌پستالی. دو طبقهٔ چوبی به ابعاد ۸٫۸ در ۹٫۳ متر، با بامی از سفال، در میان گورهای یک
    گورستان کهنه ایستاده است. طبقهٔ همکف سرداب است؛ نماز در طبقهٔ بالا گزارده می‌شود، در تالاری که از
    دو ردیف پنجره نور می‌گیرد.


    در درون، دست نجار است که سخن می‌گوید. منبر و نردهٔ بالکن داخلی پوشیده از کنده‌کاری‌هایی است که با
    چند رنگ نقاشی شده‌اند و در آن‌ها نقش‌مایه‌های عثمانی با تزئینات معماری بومی گرجستان درمی‌آمیزند. در
    دیوار جنوبی، محراب زیر طاقی دندانه‌دار جای گرفته و کتیبه‌ای عربی دارد. سر بلند کنید: گنبد روزگاری
    با رنگ روغن نقاشی شده بود، اما نقاشی‌های آسیب‌دیده اکنون پشت تخته‌های سادهٔ فیبر پنهان‌اند.


    این بنا سدهٔ دشوارش را آشکارا بر تن دارد. سنگ بنایی در پای مناره از نوسازی‌ای در ۱۹۲۱/۲۲ خبر می‌دهد.
    ردیف‌های پایینی مناره سنگ‌چینِ خشکه و بی‌ملات است، تنها بازماندهٔ برجی قدیمی‌تر که در دههٔ ۱۹۲۰ ویران
    شد؛ باقی آن در دههٔ ۱۹۹۰ از نو ساخته شد، در همان دهه‌ای که مسجد، که در دوران شوروی بسته شده بود، دوباره
    به کار مردم روستا آمد. درِ کنده‌کاری‌شدهٔ اصلی به موزهٔ دولتی آجارا در باتومی برده شد. دری که امروز
    هل می‌دهید بدلِ آن است.


    آخو، که هم مسجدی فعال است و هم اثری ملی، کوچک، آرام و سراپا اصیل است.
  tip: >-
    آخو مسجدی فعال است، نه موزه: ورود رایگان است، ساعت بازدید مشخصی ندارد و نیم ساعت کافی است. بیرون از
    وقت نماز بیایید و از ظهر جمعه پرهیز کنید. پوشیده لباس بپوشید؛ بانوان باید موی سر را بپوشانند و کفش‌ها
    دمِ درِ نمازخانه درآورده می‌شوند. اگر در بسته بود، مؤدبانه از اهالی روستا بپرسید. گورستان اطراف هنوز
    استفاده می‌شود، پس از مسیرها بیرون نروید و پیش از عکس گرفتن از کسی اجازه بگیرید. آخو سرویس بهداشتی،
    کافه یا جایگاه سوخت ندارد؛ کدا هر سه را دارد. درِ کنده‌کاری‌شدهٔ اصلی به موزهٔ دولتی آجارا در باتومی
    رفته است، پس آنجا بپرسید که آیا به نمایش گذاشته شده است یا نه.
  route: >-
    در تمام سال راه از ساحل می‌گذرد: جادهٔ S1 (E60) را رو به غرب، از کنار کوتایسی، تا ساحل و باتومی بروید
    و سپس با Sh1 از راه کدا در درهٔ آجاریس‌تسکالی بالا بیایید: حدود ۴۱۰ کیلومتر و شش ساعت و نیم، سراسر
    آسفالت و مناسب برای خودروی اقتصادی. راه کوتاه‌تری هم هست، حدود ۳۴۰ کیلومتر و شش ساعت و ده دقیقه: S1
    رو به غرب تا خاشوری، S8 از بورجومی تا آخالتسیخه، سپس Sh1 از روی گردنهٔ گودردزی و سرازیر در دره، از
    خولو و شواخوی. گردنه تنها در ماه‌های بی‌برف گذرپذیر است، چند کیلومتر نزدیک قله هنوز خاکی است و برخی
    قراردادهای اجارهٔ خودرو آن را مستثنا کرده‌اند. آخو کمی بیرون از Sh1، میان شواخوی و کدا، در بالای راهی
    کوتاه و باریک روستایی قرار دارد که بیشترش آسفالت است اما پس از باران شدید کُند می‌شود. سوخت در کدا،
    خولو یا آخالتسیخه.
he:
  name: מסגד אחו
  short: >-
    המסגד העתיק ביותר ששרד באג׳ריה: בית תפילה דו-קומתי מעץ משנת 1818, בין קברי בית קברות כפרי ישן מעל
    נהר אג׳ריסצקאלי.
  body: >-
    **ב-1818, כשאג׳ריה עוד הייתה כפופה לסולטן העות׳מאני, הקים נגר לאזי בשם אוסטה חוסיין בית תפילה מעץ
    בכפר אחו — והוא עומד עד היום.**


    זהו המסגד העתיק ביותר ששרד בכל אג׳ריה, אך הוא נראה פחות כמו המסגדים שבגלויות ויותר כמו בית כפרי גדול.
    שתי קומות עץ, 8.8 על 9.3 מטרים, בקירוי רעפי חרס, עומדות בין קבריו של בית קברות ישן. קומת הקרקע היא
    מרתף; התפילה מתקיימת בקומה העליונה, באולם המואר בשתי שורות של חלונות.


    בפנים, ידו של הנגר היא שמדברת. המינבר ומעקה הגלריה מכוסים בגילופים חרוטים וצבועים בכמה צבעים, ובהם
    מוטיבים עות׳מאניים פוגשים את העיטור של הבנייה העממית הגאורגית. בקיר הדרומי ניצב המחראב תחת קשת משוננת,
    ועליו כתובת בערבית. הרימו את העיניים: הכיפה הייתה פעם מצוירת בצבעי שמן, אבל הציורים הפגועים מוסתרים
    כיום מאחורי לוחות סיבית פשוטים.


    הבניין אינו מסתיר את המאה הקשה שעברה עליו. אבן יסוד למרגלות הצריח מתעדת שיפוץ בשנת 1921/22. הנדבכים
    התחתונים של הצריח בנויים אבן ללא מלט, וזה כל מה שנשאר ממגדל ישן יותר שנהרס בשנות ה-20 של המאה ה-20;
    שאר הצריח נבנה מחדש בשנות ה-90, באותו עשור שבו המסגד, שנסגר בתקופת השלטון הסובייטי, חזר לשרת את הכפר.
    הדלת המגולפת המקורית הועברה למוזיאון הממלכתי של אג׳ריה בבטומי. הדלת שאתם פותחים היום היא העתק.


    מסגד פעיל ואתר מורשת לאומי בעת ובעונה אחת, אחו הוא קטן, שקט ואותנטי לחלוטין.
  tip: >-
    אחו הוא מסגד פעיל ולא מוזיאון: הכניסה חופשית, אין שעות ביקור קבועות, וחצי שעה מספיקה. בואו שלא בשעות
    התפילה והימנעו מצהרי יום שישי. התלבשו בצניעות; נשים צריכות לכסות את השיער, ואת הנעליים חולצים בפתח
    אולם התפילה. אם הבניין נעול, שאלו בנימוס בכפר. בית הקברות שסביבו עדיין פעיל, לכן הקפידו ללכת בשבילים,
    ובקשו רשות לפני שאתם מצלמים מישהו. באחו אין שירותים, בית קפה או תחנת דלק; בקדה יש את שלושתם. הדלת
    המגולפת המקורית עברה למוזיאון הממלכתי של אג׳ריה בבטומי, אז שאלו שם אם היא מוצגת.
  route: >-
    כל השנה הדרך עוברת דרך החוף: כביש S1 (E60) מערבה על פני קוטאיסי עד החוף ובטומי, ומשם בכביש Sh1 במעלה
    עמק האג׳ריסצקאלי דרך קדה — כ-410 ק״מ ושש שעות וחצי, אספלט לכל האורך, ורכב קטן מקטגוריית אקונומי יסתדר
    היטב. יש גם דרך קצרה יותר, כ-340 ק״מ ושש שעות ועשר דקות: כביש S1 מערבה עד חשורי, כביש S8 דרך בורג׳ומי
    עד אחלציחה, ואז כביש Sh1 דרך מעבר גודרדזי ובירידה לאורך העמק דרך חולו ושואחווי. המעבר עביר רק בחודשים
    שבהם אין שלג, כמה קילומטרים ליד הפסגה עדיין אינם סלולים, וחלק מחוזי ההשכרה מחריגים אותו. אחו נמצא
    ממש סמוך ל-Sh1, בין שואחווי לקדה, בראש דרך כפרית קצרה וצרה, סלולה ברובה אך איטית אחרי גשם כבד. דלק
    יש בקדה, בחולו או באחלציחה.
ar:
  name: مسجد آخو
  short: >-
    أقدم مسجد باقٍ في أجاريا: مصلّى خشبي من طابقين يعود إلى عام 1818، قائم بين قبور مقبرة قروية قديمة
    فوق نهر أجاريستسكالي.
  body: >-
    **في عام 1818، حين كانت أجاريا لا تزال تدين للسلطان العثماني، شيّد نجّار لازيّ يُدعى الأسطى حسين مصلّى
    من الخشب في قرية آخو، ولا يزال قائماً حتى اليوم.**


    إنه أقدم مسجد باقٍ في أجاريا كلها، لكنه أقرب إلى بيت ريفي كبير منه إلى مساجد البطاقات البريدية. طابقان
    من الخشب، أبعادهما 8.8 في 9.3 متر، يعلوهما سقف من القرميد الفخاري، يقومان بين قبور مقبرة قديمة. الطابق
    الأرضي قبو؛ أما الصلاة فتُقام في الطابق العلوي، في قاعة يضيئها صفّان من النوافذ.


    في الداخل تتكلم يد النجار. فالمنبر ودرابزين الرواق العلوي تغطيهما نقوش محفورة ملوّنة بعدة ألوان، تلتقي
    فيها الزخارف العثمانية بزخرفة العمارة الشعبية الجورجية. وفي الجدار الجنوبي يقوم المحراب تحت قوس مسنّن،
    وعليه نقش بالعربية. ارفع بصرك: كانت القبة مزيّنة يوماً برسوم زيتية، لكن الصور التالفة تختبئ الآن خلف
    ألواح بسيطة من الخشب الليفي.


    ويحمل المبنى قرنه العسير على وجهه دون مواربة. فحجر الأساس عند قاعدة المئذنة يسجّل ترميماً جرى عام
    1921/22. أما المداميك السفلى من المئذنة فمبنية بالحجر الجاف دون ملاط، وهي كل ما بقي من برج أقدم هُدم
    في عشرينيات القرن العشرين؛ وأُعيد بناء الباقي في التسعينيات، وهو العقد نفسه الذي عاد فيه المسجد، المغلق
    في العهد السوفييتي، إلى خدمة القرية. وقد نُقل الباب المنقوش الأصلي إلى متحف أجاريا الحكومي في باتومي.
    والباب الذي تدفعه اليوم نسخة طبق الأصل.


    مسجد عامر ومعلم وطني في آن واحد، آخو صغير وهادئ وأصيل تماماً.
  tip: >-
    آخو مسجد عامر لا متحف: الدخول مجاني، ولا مواعيد محددة للزيارة، ونصف ساعة تكفي. تعالَ في غير أوقات
    الصلاة وتجنّب ظهيرة الجمعة. البس ثياباً محتشمة؛ وعلى النساء تغطية الشعر، وتُخلع الأحذية عند باب قاعة
    الصلاة. وإن وجدت المبنى مغلقاً فاسأل أهل القرية بلطف. المقبرة المحيطة به لا تزال مستخدمة، فالزم الممرات،
    واستأذن قبل تصوير أي شخص. لا توجد في آخو دورات مياه ولا مقهى ولا محطة وقود؛ وكلها متوفرة في كيدا.
    وقد ذهب الباب المنقوش الأصلي إلى متحف أجاريا الحكومي في باتومي، فاسأل هناك إن كان معروضاً.
  route: >-
    على مدار العام يمر الطريق بالساحل: اسلك الطريق S1 (E60) غرباً مروراً بكوتايسي حتى الساحل وباتومي،
    ثم اصعد وادي أجاريستسكالي على الطريق Sh1 مروراً بكيدا: نحو 410 كم وست ساعات ونصف، معبّد بالكامل، وتكفيه
    سيارة من الفئة الاقتصادية. وثمة طريق أقصر، نحو 340 كم وست ساعات وعشر دقائق: الطريق S1 غرباً إلى خاشوري،
    ثم S8 عبر بورجومي إلى أخالتسيخه، ثم Sh1 عبر ممر غودردزي نزولاً في الوادي مروراً بخولو وشواخيفي. الممر
    صالح للعبور في الأشهر الخالية من الثلج فقط، وبضعة كيلومترات قرب القمة لا تزال ترابية، وبعض عقود التأجير
    تستثنيه. يقع آخو على مقربة من الطريق Sh1 بين شواخيفي وكيدا، في أعلى درب قروي قصير وضيق، معبّد في معظمه
    لكنه بطيء بعد المطر الغزير. الوقود في كيدا أو خولو أو أخالتسيخه.
