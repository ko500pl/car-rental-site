ka:
  name: სასვანოს ტბები
  short: >-
    ორი პატარა ტბა დაახლოებით 2680 მეტრზე, ზესხო–ღების ბილიკზე ქვემო სვანეთსა და რაჭას შორის; მხოლოდ ფეხით,
    ერთი-ორი დღის სავალზე.
  body: >-
    **სასვანომდე გზა არ ადის: ორი პატარა ტბა დაახლოებით 2680 მეტრზე წევს, უახლოესი სოფლიდან ერთი-ორი დღის
    სავალზე, იმ ბილიკზე, რომელიც ქვემო სვანეთს რაჭასთან აკავშირებს.**


    ზესხო–ღების ბილიკი ლენტეხის ხეობიდან რაჭაში გადადის. ზესხოდან ის ლაფურის ხეობას აჰყვება, ვაცისწვერის
    უნაგირს დაახლოებით 2900 მეტრზე გადაივლის და ტბებისკენ უკვე რაჭის მხარეს, ონის მუნიციპალიტეტში ეშვება.
    ღებიდან ტბებს აღმოსავლეთიდან უახლოვდებიან. რუკებზე ბილიკი რთულ სამთო ლაშქრობადაა მონიშნული და ადგილ-ადგილ
    ძლივს ჩანს; ტბებთან, როგორც წესი, ღამეს ათევენ.


    ამ ტბებს წერილობითი ისტორია თითქმის არ აქვს: არც ლეგენდაა ჩაწერილი და ჩვენც არ მოვიგონებთ. რასაც სასვანო
    გთავაზობთ, უფრო მარტივია: უღელტეხილის ქვეშ ჩამდგარი წყალი, კარვისთვის ადგილი და წყალგამყოფი ქედის
    სიჩუმე, რომელსაც ცოტა ვინმე კვეთს.


    ეს გვერდი მოლაშქრეებისთვისაა. მძღოლისთვის კი სასვანო მხოლოდ ერთი მიზეზია — მანქანა ღებში დატოვოს და
    ფეხით გააგრძელოს.
  tip: >-
    იარეთ მხოლოდ ივნისიდან სექტემბრამდე — დანარჩენ დროს აქ თოვლია. ეს მრავალდღიანი გადასვლაა: გიდის გარეშე
    წასვლას არ გირჩევთ, ბილიკი ადგილ-ადგილ იკარგება, მობილური კავშირი კი ღების ზემოთ გარანტირებული არ
    არის. წაიღეთ კარავი, თბილი საძილე ტომარა, წყლის ფილტრი და ორი დღის საკვები, მარშრუტი და დაბრუნების
    დრო კი სასტუმროს მასპინძელს დაუტოვეთ. ზესხოში ან ღებში წინასწარ იკითხეთ, სჭირდება თუ არა ქედთან გასვლას
    სასაზღვრო ზონის ნებართვა. შესვლა უფასოა.
  route: >-
    მანქანით მხოლოდ ბილიკის საწყისამდე მიხვალთ. ღებამდე: ს1 (E60) მაგისტრალით დასავლეთისკენ, ზესტაფონსა
    და ქუთაისს შორის შ19-ით თერჯოლისა და ტყიბულის გავლით, შ17-ით ნაქერალას უღელტეხილზე ამბროლაურამდე,
    შ16-ით ონამდე და უწერამდე, საგლოლოსთან კი შ121-ზე ჭიორისა და ღებისკენ გადაუხვიეთ. სულ დაახლოებით 325
    კმ და ექვსი საათი; ბოლო მონაკვეთი ხრეშიანია და წვიმის შემდეგ ირეცხება, ამიტომ მაღალი გამავლობის მანქანაა
    საჭირო. ბოლო საწვავი და ბანკომატი ონშია. ზესხოს მხრიდან გზა მხოლოდ ოთხივე წამყვანი თვლის მქონე მანქანისთვისაა.
    გადასვლა მანქანიდან შორს მთავრდება — უკან დაბრუნების ტრანსპორტი წინასწარ შეათანხმეთ.
en:
  name: Sasvano Lakes
  short: >-
    Two small lakes at about 2,680 m on the Zeskho–Ghebi crossing between Lower Svaneti and Racha, reached
    only on foot, one to two days from the road.
  body: >-
    **No road reaches Sasvano: its two small lakes lie at about 2,680 metres, a day or two on foot from
    the nearest village, on the path that links Lower Svaneti with Racha.**


    The Zeskho–Ghebi trail leads from the Lentekhi valley over into Racha. From Zeskho it climbs up the
    Lapuri stream and crosses the Vatsistsveri saddle at about 2,900 metres. It then drops to the lakes,
    already on the Racha side in Oni municipality. From Ghebi, walkers approach them from the east. Maps
    grade the path as demanding mountain hiking, and in places it all but disappears. The lakes are usually
    an overnight camp.


    Almost nothing has been written about them: no legend is on record, and we will not invent one. What
    Sasvano offers is plainer: still water under a pass, a place to pitch a tent, and the quiet of a watershed
    that few people cross.


    This page is for walkers. For drivers, Sasvano is a reason to leave the car in Ghebi and continue
    on foot.
  tip: >-
    Go only between June and September; the rest of the year there is snow. This is a multi-day crossing:
    a guide is strongly advised, the path fades in places, and mobile signal is not guaranteed above Ghebi.
    Carry a tent, a warm sleeping bag, a water filter and two days' food, and leave your route and return
    time with your guesthouse. Ask in Zeskho or Ghebi whether a border-zone permit is needed near the
    ridge. There is no fee.
  route: >-
    A car takes you only to the trailhead. For Ghebi, take the S1 (E60) west. Between Zestaponi and Kutaisi
    turn north on the Sh19 through Terjola to Tkibuli, then take the Sh17 over the Nakerala pass to Ambrolauri
    and the Sh16 through Oni to Utsera. At Saglolo take the Sh121 towards Chiora and Ghebi. In all it
    is about 325 km and six hours. The last stretch is gravel and washes out after rain, so you will need
    an SUV. The last fuel and cash machine are in Oni. From the Zeskho side, the track is 4x4 only. The
    crossing ends far from your car, so arrange transport back in advance.
ru:
  name: Озёра Сасвано
  short: >-
    Два небольших озера на высоте около 2680 м на переходе Зесхо — Геби между Нижней Сванетией и Рачей;
    только пешком, в одном-двух днях от дороги.
  body: >-
    **К Сасвано не ведёт ни одна дорога: два небольших озера лежат на высоте около 2680 метров, в дне-двух
    ходьбы от ближайшего села, на тропе, что связывает Нижнюю Сванетию с Рачей.**


    Тропа Зесхо — Геби уводит из долины Лентехи через хребет в Рачу. От Зесхо она поднимается вдоль ручья
    Лапури и переваливает через седловину Вацисцвери на высоте около 2900 метров. Затем спускается к озёрам
    — уже на рачинской стороне, в Онском муниципалитете. Из Геби к ним подходят с востока. На картах маршрут
    отмечен как сложный горный, местами тропа почти теряется. У озёр обычно ночуют.


    О них почти ничего не написано: ни одной записанной легенды нет, и выдумывать её мы не станем. Сасвано
    предлагает вещи попроще: неподвижную воду под перевалом, место для палатки и тишину водораздела, который
    мало кто пересекает.


    Эта страница — для пеших туристов. Для водителя Сасвано — повод оставить машину в Геби и идти дальше
    пешком.
  tip: >-
    Идите только с июня по сентябрь: в остальное время здесь снег. Это многодневный переход: проводник
    очень желателен, тропа местами исчезает, а мобильная связь выше Геби не гарантирована. Возьмите палатку,
    тёплый спальник, фильтр для воды и еду на два дня, а маршрут и время возвращения оставьте хозяевам
    гостевого дома. В Зесхо или Геби спросите, нужен ли у хребта пропуск в пограничную зону. Платы за
    вход нет.
  route: >-
    Машина довезёт вас только до начала тропы. Чтобы попасть в Геби, двигайтесь по S1 (E60) на запад.
    Между Зестафони и Кутаиси сверните на север, на Sh19, через Терджолу до Ткибули, затем по Sh17 через
    перевал Накерала до Амбролаури и по Sh16 через Они до Уцеры. У Саглоло выезжайте на Sh121 в сторону
    Чиоры и Геби. Всего около 325 км и шесть часов. Последний отрезок — грунтовка, которую размывает после
    дождей, так что понадобится внедорожник. Последняя заправка и банкомат — в Они. Со стороны Зесхо дорога
    только для полного привода. Переход заканчивается далеко от вашей машины, поэтому об обратном транспорте
    договоритесь заранее.
fa:
  name: دریاچه‌های ساسوانو
  short: >-
    دو دریاچهٔ کوچک در ارتفاع حدود ۲۶۸۰ متر بر گذرگاه زسخو–غبی میان سوانتی پایین و راچا؛ فقط پیاده، یک
    تا دو روز دور از جاده.
  body: >-
    **هیچ جاده‌ای به ساسوانو نمی‌رسد: دو دریاچهٔ کوچکش در ارتفاع حدود ۲۶۸۰ متری، یک یا دو روز پیاده‌روی
    دور از نزدیک‌ترین روستا، بر کوره‌راهی آرمیده‌اند که سوانتی پایین را به راچا می‌پیوندد.**


    مسیر زسخو–غبی از درّهٔ لنتخی از فراز کوه به راچا می‌رود. از زسخو در امتداد نهر لاپوری بالا می‌رود
    و در ارتفاع حدود ۲۹۰۰ متری از گردنهٔ واتسیستسوری می‌گذرد. سپس به سوی دریاچه‌ها فرود می‌آید که دیگر
    در سوی راچا و در شهرستان اونی‌اند. کوهپیمایانی که از غبی می‌آیند از شرق به آن‌ها می‌رسند. نقشه‌ها
    این مسیر را کوهپیمایی دشوار رده‌بندی کرده‌اند و کوره‌راه در جاهایی تقریباً ناپدید می‌شود. کنار دریاچه‌ها
    معمولاً شب را چادر می‌زنند.


    تقریباً چیزی دربارهٔ آن‌ها نوشته نشده است: هیچ افسانه‌ای ثبت نشده و ما هم افسانه‌ای نمی‌سازیم. آنچه
    ساسوانو پیش می‌نهد ساده‌تر است: آبی آرام زیر یک گردنه، جایی برای برپا کردن چادر، و سکوت خط‌الرأسی
    که کمتر کسی از آن می‌گذرد.


    این صفحه برای کوه‌پیمایان است. برای رانندگان، ساسوانو بهانه‌ای است تا خودرو را در غبی بگذارند و پیاده
    ادامه دهند.
  tip: >-
    فقط از ژوئن تا سپتامبر بروید؛ در باقی سال برف است. این گذری چندروزه است: همراه داشتن راهنما به‌شدت
    توصیه می‌شود، کوره‌راه در جاهایی محو می‌شود و بالاتر از غبی آنتن تلفن همراه تضمینی نیست. چادر، کیسه‌خواب
    گرم، صافی آب و خوراک دو روز همراه ببرید و مسیر و زمان بازگشت‌تان را به صاحب مهمان‌خانه بسپارید. در
    زسخو یا غبی بپرسید که آیا نزدیک خط‌الرأس مجوز منطقهٔ مرزی لازم است یا نه. ورودیه‌ای در کار نیست.
  route: >-
    خودرو شما را فقط تا سر مسیر پیاده‌روی می‌رساند. برای رفتن به غبی، از S1 (E60) به سوی غرب بروید. میان
    زستافونی و کوتائیسی به شمال، به Sh19، بپیچید و از ترجولا تا تکیبولی بروید، سپس از Sh17 و گردنهٔ ناکرالا
    تا آمبرولائوری و از Sh16 و اونی تا اوتسرا. در ساگلولو وارد Sh121 به سوی چیورا و غبی شوید. روی‌هم حدود
    ۳۲۵ کیلومتر و شش ساعت راه است. تکهٔ پایانی شنی است و پس از باران آب آن را می‌شوید، پس به خودروی شاسی‌بلند
    نیاز دارید. آخرین پمپ‌بنزین و خودپرداز در اونی است. از سوی زسخو، جاده فقط برای خودروی چهارچرخ‌محرک
    است. این گذر دور از خودروی شما به پایان می‌رسد، پس وسیلهٔ بازگشت را از پیش هماهنگ کنید.
he:
  name: אגמי סאסוואנו
  short: >-
    שני אגמים קטנים בגובה כ-2,680 מ׳ במעבר זסחו–גבי שבין סוונטי התחתונה לרצ'ה; מגיעים אליהם רק ברגל, יום
    או יומיים מהכביש.
  body: >-
    **שום כביש אינו מגיע לסאסוואנו: שני האגמים הקטנים שלו שוכנים בגובה של כ-2,680 מטר, יום או יומיים הליכה
    מהכפר הקרוב, על השביל המחבר את סוונטי התחתונה לרצ'ה.**


    שביל זסחו–גבי יוצא מעמק לנטחי וחוצה אל רצ'ה. מזסחו הוא מטפס לאורך הנחל לפורי וחוצה את אוכף וציסצוורי
    בגובה של כ-2,900 מטר. משם הוא יורד אל האגמים, שכבר נמצאים בצד של רצ'ה, במחוז אוני. מגבי מגיעים אליהם
    ממזרח. במפות השביל מדורג כהליכת הרים תובענית, ובמקומות מסוימים הוא כמעט נעלם. ליד האגמים נהוג לחנות
    ללילה.


    כמעט דבר לא נכתב עליהם: לא תועדה שום אגדה, ואנחנו לא נמציא אחת. מה שסאסוואנו מציע פשוט יותר: מים שקטים
    למרגלות מעבר, מקום להקים אוהל, ושקט של קו פרשת מים שמעטים חוצים.


    העמוד הזה מיועד למטיילים ברגל. לנהגים, סאסוואנו הוא סיבה להשאיר את הרכב בגבי ולהמשיך ברגל.
  tip: >-
    צאו רק בין יוני לספטמבר; בשאר השנה יש כאן שלג. זהו מעבר של כמה ימים: מומלץ מאוד לקחת מדריך, השביל
    נמחק במקומות, ואין ערובה לקליטה סלולרית מעל גבי. קחו אוהל, שק שינה חם, מסנן מים ואוכל ליומיים, והשאירו
    את המסלול ואת שעת החזרה אצל בעלי בית ההארחה. שאלו בזסחו או בגבי אם נדרש היתר לאזור הגבול בקרבת הרכס.
    אין דמי כניסה.
  route: >-
    הרכב מביא אתכם רק לתחילת השביל. כדי להגיע לגבי, סעו מערבה בכביש S1 (E60). בין זסטפוני לקוטאיסי פנו
    צפונה לכביש Sh19 דרך טרג'ולה עד טקיבולי, ומשם בכביש Sh17 דרך מעבר נקראלה עד אמברולאורי, ובכביש Sh16
    דרך אוני עד אוצרה. בסגלולו עלו על כביש Sh121 לכיוון צ'יורה וגבי. בסך הכול כ-325 ק״מ ושש שעות. הקטע
    האחרון הוא דרך עפר וחצץ שנסחפת אחרי גשם, ולכן תזדקקו לרכב פנאי-שטח. התחנה האחרונה לדלק ולכספומט היא
    באוני. מצד זסחו הדרך מתאימה להנעה כפולה בלבד. המעבר מסתיים הרחק מהרכב שלכם, אז תאמו מראש הסעה חזרה.
ar:
  name: بحيرتا ساسفانو
  short: >-
    بحيرتان صغيرتان على ارتفاع نحو 2680 م على معبر زيسخو–غيبي بين سوانيتي السفلى وراتشا، لا تُبلغان إلا
    سيراً، على بعد يوم أو يومين من الطريق.
  body: >-
    **لا طريق يبلغ ساسفانو: فبحيرتاها الصغيرتان ترقدان على ارتفاع نحو 2680 متراً، على مسيرة يوم أو يومين
    من أقرب قرية، على الدرب الذي يصل سوانيتي السفلى براتشا.**


    يمضي درب زيسخو–غيبي من وادي لنتيخي عابراً الجبل إلى راتشا. فمن زيسخو يصعد بمحاذاة جدول لابوري، ويجتاز
    سرج فاتسيستسفيري على ارتفاع نحو 2900 متر. ثم ينحدر إلى البحيرتين، وقد صار على جانب راتشا في بلدية
    أوني. أما القادمون من غيبي فيبلغونهما من الشرق. تصنّف الخرائط الدرب ضمن المشي الجبلي الشاق، وهو يكاد
    يختفي في بعض المواضع. وعادةً ما تكون البحيرتان محطة مبيت.


    لم يُكتب عنهما شيء يُذكر: لا أسطورة مدوّنة، ولن نخترع واحدة. ما تقدّمه ساسفانو أبسط من ذلك: ماء ساكن
    تحت ممر جبلي، وموضع لنصب خيمة، وسكون خط تقسيم مياه قلّما يعبره أحد.


    هذه الصفحة لهواة المشي الجبلي. أما للسائقين، فساسفانو سبب لترك السيارة في غيبي ومواصلة الطريق على
    الأقدام.
  tip: >-
    لا تذهب إلا بين حزيران/يونيو وأيلول/سبتمبر؛ ففي بقية العام يغطي الثلج المكان. هذا عبور يستغرق عدة
    أيام: يُنصح بشدة بمرشد، والدرب يتلاشى في مواضع، وتغطية الهاتف المحمول غير مضمونة فوق غيبي. احمل خيمة
    وكيس نوم دافئاً ومرشّح ماء وطعام يومين، واترك خط سيرك وموعد عودتك لدى صاحب بيت الضيافة. واسأل في زيسخو
    أو غيبي هل يلزم تصريح دخول المنطقة الحدودية قرب خط القمم. لا رسوم.
  route: >-
    السيارة توصلك إلى بداية الدرب فحسب. للوصول إلى غيبي اتجه غرباً على الطريق S1 (E60). وبين زيستافوني
    وكوتايسي انعطف شمالاً إلى الطريق Sh19 عبر تيرجولا حتى تكيبولي، ثم خذ الطريق Sh17 عبر ممر ناكيرالا
    إلى أمبرولاوري، والطريق Sh16 عبر أوني حتى أوتسيرا. وعند ساغلولو خذ الطريق Sh121 باتجاه تشيورا وغيبي.
    المجموع نحو 325 كم وست ساعات. المقطع الأخير حصوي تجرفه الأمطار، فستحتاج إلى سيارة مرتفعة عن الأرض.
    آخر محطة وقود وصراف آلي في أوني. ومن جهة زيسخو لا يصلح المسلك إلا للدفع الرباعي. ينتهي العبور بعيداً
    عن سيارتك، فرتّب وسيلة العودة مسبقاً.
