ka:
  name: სიონის საკათედრო ტაძარი
  short: >-
    თაფლისფერი ტაძარი ძველ ქალაქში, რომელიც თოთხმეტი საუკუნეა ინგრევა და ისევ დგება; სანთლის შუქზე აქ
    წმინდა ნინოს ვაზის ჯვარი ასვენია.
  body: >-
    **1226 წელს ხვარაზმის შაჰმა ჯალალ ედ-დინმა თბილისი აიღო, სიონს გუმბათი მოხადა და, ქართული მატიანის
    თქმით, იქ თავისი ტახტი დადგა.** გადმოცემით, იქიდან უყურებდა, როგორ ალაგებდნენ მეტეხის ხიდზე სიონიდან
    გამოტანილ ხატებს და როგორ კლავდნენ ქალაქელებს, რომლებიც მათზე ფეხის დადგმას არ თანხმდებოდნენ.


    თბილისში არც ერთი ეკლესია არ დაუნგრევიათ და არ აუშენებიათ ამდენჯერ. პირველი ტაძარი დაახლოებით 575
    წელს დაიწყეს და 639 წლისთვის დაასრულეს; არაბებმა ის დაანგრიეს, 1112 წელს კი დავით აღმაშენებელმა საძირკვლიდან
    ააშენა — დღევანდელი ტაძრის ხერხემალი მისია. ჯალალ ედ-დინის შემდეგ მოვიდნენ თემურლენგი 1386 წელს, ირანელთა
    ლაშქრები XVI–XVII საუკუნეებში, 1668 წელს კი მიწისძვრა. 1710 წელს ქართლის გამგებელმა ვახტანგმა გუმბათი
    განაახლა და კედლები ბოლნისის ყვითელი ტუფით მოაპირკეთა — სწორედ ეს თაფლისფერი ქვაა, ხელით რომ ეხებით.
    1795 წელს აღა-მაჰმად-ხანის ხანძარმა ხის კანკელი და XVII საუკუნის მოხატულობის დიდი ნაწილი შთანთქა.


    შიგნით შუადღისასაც ბნელა და ყველაფერს სანთლები აკეთებს. საკურთხევლის მარცხნივ, ვერცხლის კიდობანში,
    რომელიც XIV საუკუნის დასაწყისში ვახტანგ III-მ შესწირა, ასვენია ვაზის ჯვარი — გადმოცემით, წმინდა ნინოს
    ხელით შეკრული და მისივე თმით გადახლართული. საქართველოს ის 1801 წელს დაუბრუნდა. ირგვლივ კედლები 1850-იან
    წლებში თავადმა გრიგოლ გაგარინმა მოხატა — რუსი მხატვრის ხედვა დაკარგულ შუა საუკუნეების ფრესკებზე, რაზეც
    დღემდე დაობენ.


    ისტორია ამ კედლებში არაერთხელ შემოიჭრა. 1802 წლის 12 აპრილს გენერალმა კნორინგმა აქ ქართველი თავადაზნაურობა
    შეკრიბა, გარეთ რუსი ჯარისკაცები დააყენა და ყველას რუსეთის იმპერატორის ერთგულება დააფიცა. დასავლეთ
    ფასადზე მოძებნეთ ნაკვეთი ჯვარი და დაბმული ლომი. სიონი საპატრიარქო ტაძარი იყო, სანამ 2004 წელს სამებას
    აკურთხებდნენ; ქალაქისთვის ის დღემდე ყველაზე შინაურია.
  tip: >-
    ნახევარი საათი საკმარისია, წირვის დროს კი მეტხანს დარჩით — გალობა ამად ღირს. ეს მოქმედი ტაძარია: ქალებს
    თავსაფარი და გრძელი ქვედაბოლო სჭირდებათ, მამაკაცებს — გრძელი შარვალი; მოსასხამები კართან უფასოდ აწყვია.
    წირვა-ლოცვისას ფოტოს გადაღება არ მიიღება და ხშირად საერთოდ აკრძალულია. შესასვლელთან რამდენიმე საფეხურია,
    სიბნელეს კი თვალი წუთში შეეჩვევა. ტაძარში ტუალეტი არ არის — ისარგებლეთ სიონისა და ერეკლე II-ის ქუჩების
    კაფეებით. ქუჩის გაღმა 1812 წლის კლასიცისტურ სამრეკლოსაც შეხედეთ.
  route: >-
    სიონი მტკვრის მარჯვენა ნაპირზე, ძველ ქალაქში დგას, თავისუფლების მოედნიდან კილომეტრზე ნაკლებ მანძილზე:
    კოტე აფხაზის ქუჩით მდინარისკენ ფეხით ათიოდე წუთია, მანქანით — რამდენიმე წუთი. მოედნიდან ფეხით ჩასვლა
    პარკირების ძებნაზე ბევრად იოლია. სიონის ქუჩა ვიწროა და ნაწილობრივ საფეხმავლო, ამიტომ ტაძრის კარამდე
    მისვლას ნუ ეცდებით. რეალური არჩევანია გორგასლის მოედნის მიმდებარე ფასიანი სადგომი ან მეიდნის მიწისქვეშა
    ავტოსადგომი — ორივედან ხუთიოდე წუთის სავალია, — ან ფასიანი ადგილები ბარათაშვილის ქუჩაზე. ტაძრის გვერდით,
    შესახვევებში დატოვებული მანქანა ხშირად ევაკუატორზე ამთავრებს. გზა ბოლომდე ასფალტია, ამ უბანში კი პატარა
    ეკონომკლასის მანქანა ნამდვილი უპირატესობაა.
en:
  name: Sioni Cathedral
  short: >-
    A honey-coloured cathedral in the old town, destroyed and rebuilt for fourteen centuries, where St
    Nino's grapevine cross rests in candlelight.
  body: >-
    **In 1226 Jalal ad-Din, Shah of Khwarazm, took Tbilisi, had the dome of Sioni torn off and, the Georgian
    chronicle says, set his throne up in its place.** From there, tradition says, he watched the icons
    of Sioni laid out on Metekhi bridge, and the townspeople who refused to step on them put to death.


    No church in Tbilisi has been wrecked and raised again so often. The first was begun around 575 and
    finished around 639; Arabs destroyed it, and in 1112 David the Builder rebuilt it from the ground
    up — the bones of today's church are his. After Jalal ad-Din came Timur in 1386, Persian armies in
    the sixteenth and seventeenth centuries and an earthquake in 1668. In 1710 Vakhtang, then regent of
    Kartli, renewed the dome and faced the walls in yellow tuff from Bolnisi, the honey-coloured stone
    you can touch today. In 1795 Agha Mohammad Khan's fire consumed the wooden iconostasis and much of
    the 17th-century painting.


    Inside it is dark even at noon, and the candles do the work. To the left of the altar, in a silver
    case given by King Vakhtang III in the early fourteenth century, rests the grapevine cross that, tradition
    holds, St Nino made herself and bound with her own hair; it came home to Georgia in 1801. The walls
    around it are the work of Prince Grigory Gagarin in the 1850s, a Russian painter's vision laid over
    lost medieval frescoes and still argued about.


    History pressed into this nave more than once. On 12 April 1802 General Knorring gathered the Georgian
    nobility here, with Russian troops outside, and made them swear allegiance to the Tsar. Look for the
    carved cross and chained lion on the west façade. Sioni was the patriarch's cathedral until Sameba
    was consecrated in 2004; it still feels like the city's own.
  tip: >-
    Thirty minutes is enough, longer if a service is on — the chanting is worth staying for. This is a
    working cathedral: women need a headscarf and a long skirt, men long trousers, and wraps are kept
    free by the door. Photography during services is unwelcome and often simply not allowed. There are
    a few steps at the entrance, and your eyes need a minute to adjust to the dark. There are no toilets
    in the cathedral; use the cafés on Sioni and Erekle II streets. Across the street, a neoclassical
    bell tower of 1812 is worth a look.
  route: >-
    Sioni stands on the right bank in the old town, under a kilometre from Freedom Square: a ten-minute
    walk down Kote Apkhazi Street towards the river, or a few minutes by car. Walking from the square
    is easier than parking. Sioni Street itself is narrow and partly pedestrian, so do not aim for the
    door. The realistic options are the paid parking around Gorgasali Square or the car park beneath Meidan,
    both about five minutes' walk away, or paid bays along Baratashvili Street. A car left in the lanes
    beside the cathedral usually ends up on a tow truck. Asphalt all the way, and a small economy car
    is a real advantage in this quarter.
ru:
  name: Кафедральный собор Сиони
  short: >-
    Медовый собор Старого города, четырнадцать веков разрушаемый и отстраиваемый, где в свете свечей хранится
    крест святой Нино из виноградной лозы.
  body: >-
    **В 1226 году хорезмшах Джалал ад-Дин взял Тбилиси, велел сорвать с Сиони купол и, как сообщает грузинская
    летопись, поставил на его месте свой трон.** Оттуда, по преданию, он смотрел, как иконы Сиони раскладывают
    на Метехском мосту, а горожан, отказавшихся наступить на них, предают смерти.


    Ни одну церковь Тбилиси не разрушали и не поднимали из руин так часто. Первую начали около 575 года
    и закончили около 639-го; её уничтожили арабы, и в 1112 году Давид Строитель отстроил её заново с
    основания — костяк нынешнего храма принадлежит ему. После Джалал ад-Дина были Тимур в 1386 году, персидские
    армии в XVI и XVII веках и землетрясение 1668 года. В 1710 году Вахтанг, тогда регент Картли, обновил
    купол и облицевал стены жёлтым болнисским туфом — тем медовым камнем, которого можно коснуться и сегодня.
    В 1795 году пожар, устроенный войском Ага-Мохаммед-хана, уничтожил деревянный иконостас и бо́льшую
    часть росписей XVII века.


    Внутри темно даже в полдень, и всё решают свечи. Слева от алтаря, в серебряном киоте, подаренном царём
    Вахтангом III в начале XIV века, хранится крест из виноградной лозы, который, по преданию, святая
    Нино сделала сама и перевязала собственными волосами; в Грузию он вернулся в 1801 году. Стены вокруг
    расписал в 1850-х годах князь Григорий Гагарин — видение русского художника, наложенное на утраченные
    средневековые фрески, и споры о нём не утихают до сих пор.


    История не раз входила в этот неф. 12 апреля 1802 года генерал Кнорринг собрал здесь грузинское дворянство
    — снаружи стояли русские войска — и заставил его присягнуть царю. Найдите на западном фасаде резной
    крест и льва на цепи. До освящения Самебы в 2004 году Сиони был патриаршим собором — и до сих пор
    ощущается собором самого города.
  tip: >-
    Полчаса достаточно, дольше — если идёт служба: ради пения стоит задержаться. Это действующий собор:
    женщинам нужны платок и длинная юбка, мужчинам — длинные брюки; у входа бесплатно выдают накидки.
    Фотосъёмка во время службы нежелательна, а часто и прямо запрещена. У входа несколько ступеней, и
    глазам нужна минута, чтобы привыкнуть к темноте. Туалетов в соборе нет — пользуйтесь кафе на улицах
    Сиони и Эрекле II. Через улицу стоит колокольня 1812 года в духе классицизма — на неё тоже стоит взглянуть.
  route: >-
    Сиони стоит на правом берегу, в Старом городе, меньше чем в километре от площади Свободы: минут десять
    пешком вниз по улице Коте Апхази к реке или несколько минут на машине. Дойти от площади пешком проще,
    чем искать парковку. Сама улица Сиони узкая и частично пешеходная, так что не пытайтесь подъехать
    к дверям. Реальные варианты — платная парковка у площади Горгасали или подземный паркинг под Мейданом,
    оба примерно в пяти минутах пешком, либо платные места вдоль улицы Бараташвили. Машина, брошенная
    в переулках у собора, обычно заканчивает день на эвакуаторе. Асфальт на всём пути, а маленький автомобиль
    эконом-класса в этом квартале — настоящее преимущество.
fa:
  name: کلیسای جامع سیونی
  short: >-
    کلیسای جامعی عسلی‌رنگ در شهر قدیم که چهارده سده بارها ویران و از نو ساخته شده و صلیب تاکِ قدیسه نینو
    در نور شمع‌هایش آرمیده است.
  body: >-
    **در سال ۱۲۲۶، جلال‌الدین خوارزمشاه تفلیس را گرفت، فرمان داد گنبد سیونی را از جا بکنند و، به گفتهٔ
    وقایع‌نامهٔ گرجی، تخت خود را به جای آن نهاد.** به روایت سنت، از همان‌جا نظاره می‌کرد که شمایل‌های
    سیونی را روی پل متخی می‌گسترانند و شهروندانی را که از پا نهادن بر آن‌ها سر باز می‌زدند، می‌کشتند.


    هیچ کلیسایی در تفلیس این‌همه بار ویران نشده و از نو برنخاسته است. نخستین بنا حدود سال ۵۷۵ آغاز شد
    و حدود ۶۳۹ به پایان رسید؛ اعراب ویرانش کردند و در سال ۱۱۱۲ داوود چهارم، ملقب به «سازنده»، آن را از
    پی از نو ساخت — استخوان‌بندی کلیسای امروز از اوست. پس از جلال‌الدین، تیمور در ۱۳۸۶ آمد، سپاه ایران
    در سده‌های شانزدهم و هفدهم، و زلزلهٔ ۱۶۶۸. در سال ۱۷۱۰ وختانگ، که آن زمان نایب‌السلطنهٔ کارتلی بود،
    گنبد را نو کرد و دیوارها را با توف زرد بولنیسی روکش کرد؛ همان سنگ عسلی‌رنگی که امروز می‌توانید لمسش
    کنید. در ۱۷۹۵ آتشِ لشکر آغامحمدخان دیوار شمایل (آیکونوستاز) چوبی و بخش بزرگی از نقاشی‌های دیواری سدهٔ
    هفدهم را از میان برد.


    درون، حتی در نیمروز تاریک است و کار را شمع‌ها می‌کنند. در سمت چپ محراب، در جعبه‌ای سیمین که شاه وختانگ
    سوم در اوایل سدهٔ چهاردهم اهدا کرد، صلیبی از شاخهٔ تاک آرمیده است که به روایت سنت، قدیسه نینو خود
    آن را ساخت و با گیسوی خویش بست؛ این صلیب در سال ۱۸۰۱ به گرجستان بازگشت. نقاشی دیوارهای پیرامونش کار
    شاهزاده گریگوری گاگارین در دههٔ ۱۸۵۰ است: تصور یک نقاش روس که بر نقاشی‌های دیواریِ از دست‌رفتهٔ سده‌های
    میانه نشسته و هنوز بر سرش بحث است.


    تاریخ بیش از یک بار به درون این شبستان پا گذاشته است. در ۱۲ آوریل ۱۸۰۲، ژنرال کنورینگ اشراف گرجی را
    این‌جا گرد آورد، در حالی که سربازان روس بیرون ایستاده بودند، و آنان را به سوگند وفاداری به تزار واداشت.
    بر نمای غربی، صلیب کنده‌کاری‌شده و شیر در زنجیر را بجویید. سیونی تا زمان تقدیس کلیسای جامع سامه‌با
    در ۲۰۰۴ کلیسای جامعِ پاتریارک بود؛ و هنوز هم کلیسای خودِ شهر به نظر می‌رسد.
  tip: >-
    سی دقیقه کافی است، و اگر مراسمی برپا باشد بیشتر — سرودخوانی ارزش ماندن دارد. این کلیسای جامع فعال
    است: بانوان روسری و دامن بلند لازم دارند و آقایان شلوار بلند؛ کنار در، روپوش رایگان گذاشته‌اند. عکاسی
    در هنگام مراسم پسندیده نیست و اغلب اصلاً مجاز نیست. دم ورودی چند پله هست و چشم‌ها یک دقیقه زمان لازم
    دارند تا به تاریکی عادت کنند. کلیسا سرویس بهداشتی ندارد؛ از کافه‌های خیابان‌های سیونی و ارکله دوم
    استفاده کنید. آن سوی خیابان، برج ناقوسی نئوکلاسیک از سال ۱۸۱۲ هم ارزش نگاهی دارد.
  route: >-
    سیونی بر کرانهٔ راست رود، در شهر قدیم و کمتر از یک کیلومتر دورتر از میدان آزادی است: ده دقیقه پیاده
    از خیابان کوته آپخازی رو به پایین و به سوی رود، یا چند دقیقه با خودرو. پیاده رفتن از میدان آسان‌تر
    از پیدا کردن جای پارک است. خود خیابان سیونی باریک و بخشی از آن پیاده‌راه است، پس قصد رسیدن تا دم در
    را نکنید. گزینه‌های واقع‌بینانه پارکینگ پولی اطراف میدان گورگاسالی یا پارکینگ زیرزمینی «مِیدان» است،
    هر دو حدود پنج دقیقه پیاده، یا جاپارک‌های پولی در امتداد خیابان باراتاشویلی. خودرویی که در کوچه‌های
    کنار کلیسا رها شود، معمولاً با جرثقیل یدک‌کش برده می‌شود. تمام راه آسفالت است و خودروی کوچک اقتصادی
    در این محله امتیازی واقعی است.
he:
  name: קתדרלת סיוני
  short: >-
    קתדרלה בגוון דבש בעיר העתיקה, שנהרסה ונבנתה מחדש לאורך ארבע-עשרה מאות שנה, ובה נח לאור נרות צלב הגפן
    של נינו הקדושה.
  body: >-
    **בשנת 1226 כבש ג'לאל א-דין, שאה של ח'וארזם, את טביליסי, ציווה לתלוש את כיפת סיוני, ולפי הכרוניקה
    הגאורגית הציב במקומה את כס מלכותו.** משם, לפי המסורת, צפה כיצד פורשים את איקונות סיוני על גשר מטחי,
    וכיצד מוציאים להורג את תושבי העיר שסירבו לדרוך עליהן.


    אין כנסייה בטביליסי שנהרסה והוקמה מחדש פעמים רבות כל כך. הראשונה החלה להיבנות בסביבות שנת 575 והושלמה
    בסביבות 639; הערבים החריבו אותה, ובשנת 1112 בנה אותה דוד הבונה מחדש מן היסוד – שלד הכנסייה של היום
    הוא שלו. אחרי ג'לאל א-דין באו טימור בשנת 1386, צבאות פרס במאות ה-16 וה-17 ורעידת אדמה ב-1668. בשנת
    1710 חידש וחטנג, אז העוצר של קרתלי, את הכיפה וציפה את הקירות בטוף צהוב מבולניסי – אבן בגוון הדבש שאפשר
    לגעת בה עד היום. בשנת 1795 כילתה השרפה שהציתו אנשי אגא מוחמד ח'אן את האיקונוסטזיס העשוי עץ ואת רוב
    ציורי הקיר מן המאה ה-17.


    בפנים חשוך גם בצהרי היום, והנרות עושים את העבודה. משמאל למזבח, בתיבת כסף שהעניק המלך וחטנג השלישי
    בראשית המאה ה-14, נח צלב הגפן שלפי המסורת עשתה נינו הקדושה במו ידיה וקשרה בשערותיה; הוא שב לגאורגיה
    בשנת 1801. את הקירות סביבו צייר בשנות ה-50 של המאה ה-19 הנסיך גריגורי גגארין – חזונו של צייר רוסי
    שהונח על פני ציורי קיר מימי הביניים שאבדו, ועדיין מתווכחים עליו.


    ההיסטוריה נכנסה אל אולם התווך הזה יותר מפעם אחת. ב-12 באפריל 1802 כינס כאן הגנרל קנורינג את האצולה
    הגאורגית, כשחיילים רוסים עומדים בחוץ, ואילץ אותה להישבע אמונים לצאר. חפשו בחזית המערבית את הצלב המגולף
    ואת האריה הכבול בשלשלאות. סיוני הייתה קתדרלת הפטריארך עד שנחנכה קתדרלת סמבה (השילוש הקדוש) בשנת 2004;
    והיא עדיין נתפסת כקתדרלה של העיר עצמה.
  tip: >-
    חצי שעה מספיקה, ויותר אם מתקיימת תפילה – בשביל השירה כדאי להישאר. זו קתדרלה פעילה: נשים זקוקות למטפחת
    ראש ולחצאית ארוכה, גברים למכנסיים ארוכים, וליד הדלת מונחים כיסויים לשימוש חינם. צילום בזמן תפילה אינו
    רצוי ולעיתים קרובות פשוט אסור. בכניסה יש כמה מדרגות, והעיניים צריכות דקה להסתגל לחושך. אין שירותים
    בקתדרלה; השתמשו בבתי הקפה ברחובות סיוני וארקלה השני. מעבר לרחוב ניצב מגדל פעמונים ניאו-קלאסי משנת
    1812, וגם הוא שווה מבט.
  route: >-
    סיוני עומדת על הגדה הימנית בעיר העתיקה, פחות מקילומטר מכיכר החירות: עשר דקות הליכה במורד רחוב קוטה
    אפחאזי לכיוון הנהר, או כמה דקות נסיעה. ללכת ברגל מהכיכר קל יותר מלמצוא חניה. רחוב סיוני עצמו צר ובחלקו
    מדרחוב, לכן אל תנסו להגיע עד הדלת. האפשרויות המציאותיות הן החניון בתשלום סביב כיכר גורגסלי או החניון
    התת-קרקעי מתחת למיידאן, שניהם כחמש דקות הליכה, או מקומות חניה בתשלום לאורך רחוב ברטשווילי. מכונית
    שנשארת בסמטאות שליד הקתדרלה נגררת בדרך כלל. הדרך סלולה לכל אורכה, ורכב אקונומי קטן הוא יתרון של ממש
    ברובע הזה.
ar:
  name: كاتدرائية سيوني
  short: >-
    كاتدرائية بلون العسل في المدينة القديمة، هُدمت وأُعيد بناؤها على مدى أربعة عشر قرناً، ويرقد فيها صليب
    الكرمة للقديسة نينو في ضوء الشموع.
  body: >-
    **في عام 1226 استولى جلال الدين، شاه خوارزم، على تبليسي، وأمر بانتزاع قبة سيوني، ونصب عرشه مكانها
    كما تذكر الحوليات الجورجية.** ومن هناك، كما تروي التقاليد، راح يشاهد أيقونات سيوني تُفرش على جسر ميتيخي،
    وأهل المدينة الذين أبوا أن يطؤوها يُقتلون.


    لم تتعرّض كنيسة في تبليسي للهدم وإعادة البناء بقدر ما تعرّضت هذه. بدأ بناء الأولى نحو عام 575 واكتمل
    نحو 639؛ ثم دمّرها العرب، وفي عام 1112 أعاد داود الباني تشييدها من أساسها — وهيكل الكنيسة الحالية
    من عمله. وبعد جلال الدين جاء تيمور عام 1386، ثم الجيوش الفارسية في القرنين السادس عشر والسابع عشر،
    وزلزال عام 1668. وفي عام 1710 جدّد فاختانغ، الوصي على عرش كارتلي آنذاك، القبة وكسا الجدران بالتوف
    الأصفر من بولنيسي، ذلك الحجر العسلي الذي يمكنك أن تلمسه اليوم. وفي عام 1795 التهمت النار التي أضرمها
    جيش آغا محمد خان الأيقونسطاس الخشبي ومعظم الرسوم الجدارية العائدة إلى القرن السابع عشر.


    الداخل مظلم حتى في الظهيرة، والشموع تتكفّل بالباقي. إلى يسار المذبح، في غلاف فضي أهداه الملك فاختانغ
    الثالث في مطلع القرن الرابع عشر، يرقد صليب الكرمة الذي صنعته القديسة نينو بيدها، كما يقول التقليد،
    وربطته بشعرها؛ وقد عاد إلى جورجيا عام 1801. أما الجدران من حوله فرسمها الأمير غريغوري غاغارين في خمسينيات
    القرن التاسع عشر: رؤية رسام روسي فوق رسوم جدارية من العصور الوسطى ضاعت، ولا يزال الجدل حولها قائماً.


    وقد اقتحم التاريخ هذا الصحن أكثر من مرة. ففي 12 أبريل 1802 جمع الجنرال كنورينغ النبلاء الجورجيين هنا،
    والقوات الروسية في الخارج، وأرغمهم على أداء يمين الولاء للقيصر. ابحث على الواجهة الغربية عن الصليب
    المنحوت والأسد المقيّد بالسلاسل. وظلت سيوني كاتدرائية البطريرك حتى تكريس كاتدرائية ساميبا (الثالوث
    الأقدس) عام 2004، ولا تزال تبدو كاتدرائية المدينة نفسها.
  tip: >-
    تكفي ثلاثون دقيقة، وأطول إن كانت هناك صلاة، فالترتيل يستحق البقاء. هذه كاتدرائية عاملة تُقام فيها
    الصلوات: تحتاج النساء إلى غطاء للرأس وتنورة طويلة، والرجال إلى سراويل طويلة، وتُترك عند الباب أغطية
    مجانية. التصوير أثناء الصلوات غير مرحّب به، وكثيراً ما يكون ممنوعاً أصلاً. عند المدخل بضع درجات، وتحتاج
    العينان دقيقة لتعتادا الظلمة. لا دورات مياه في الكاتدرائية؛ استخدم المقاهي في شارعي سيوني وإريكلي
    الثاني. وعلى الجانب الآخر من الشارع برج أجراس كلاسيكي جديد يعود إلى عام 1812 يستحق نظرة.
  route: >-
    تقع سيوني على الضفة اليمنى في المدينة القديمة، على بعد أقل من كيلومتر من ساحة الحرية: عشر دقائق سيراً
    نزولاً في شارع كوتيه أبخازي نحو النهر، أو دقائق قليلة بالسيارة. والمشي من الساحة أسهل من البحث عن
    موقف. شارع سيوني نفسه ضيق ومخصّص للمشاة في جزء منه، فلا تحاول بلوغ الباب. الخيارات الواقعية هي المواقف
    المدفوعة حول ساحة غورغاسالي أو المرأب تحت «ميدان»، وكلاهما على بعد نحو خمس دقائق سيراً، أو المواقف
    المدفوعة على امتداد شارع باراتاشفيلي. والسيارة المتروكة في الأزقة المجاورة للكاتدرائية ينتهي بها الأمر
    عادةً على شاحنة سحب. الطريق معبّد بالكامل، والسيارة الاقتصادية الصغيرة ميزة حقيقية في هذا الحي.
