ka:
  name: სიონის საკათედრო ტაძარი
  short: მტკვრის ნაპირზე მდგარი ძველი საკათედრო ტაძარი, სადაც წმინდა ნინოს ვაზის ჯვარი ინახება.
  body: >-
    **სიონი ის ტაძარია, რომელსაც თბილისმა ყველაზე ხშირად დაუბრუნა სახე.** ის მტკვრის მარჯვენა ნაპირზე
    დგას, ვიწრო ქუჩების ლაბირინთში, და გარედან თითქმის მოკრძალებულად გამოიყურება — სანამ არ მიხვდები,
    რომ ეს შენობა თითქმის ყოველ საუკუნეში ინგრეოდა და ხელახლა შენდებოდა.


    პირველი ეკლესია აქ VI–VII საუკუნეებში აშენდა. შემდეგ მოვიდნენ არაბები, ჯალალ ედ-დინი 1226 წელს, თემურ
    ლენგი, სპარსელები. დღევანდელი ნაგებობის ბირთვი XIII საუკუნისაა, თუმცა გუმბათი, კედლების დიდი ნაწილი
    და ფასადის დეტალები XVII–XIX საუკუნეებში აღდგა. 1795 წელს აღა-მაჰმად-ხანის შემოსევის დროს ტაძარი კვლავ
    დაზიანდა.


    შიგნით ორი რამ იპყრობს ყურადღებას. პირველი — წმინდა ნინოს ჯვარი, ვაზისგან გაკეთებული და ტრადიციის
    თანახმად თავად წმინდანის თმით შეკრული; ის ჩრდილოეთით, საკურთხევლის მახლობლად, ვერცხლის კიოტშია. მეორე
    — კედლის მოხატულობა, რომელიც 1850-იან წლებში რუსმა მხატვარმა გრიგოლ გაგარინმა შეასრულა უფრო ძველი
    ფრესკების ადგილას; ეს გადაწყვეტილება დღემდე კამათის საგანია.


    ქუჩის მოპირდაპირე მხარეს ცალკე მდგარი აგურის სამრეკლოა, 1425 წლისა — თბილისში შემორჩენილი უძველესი.
    მის გვერდით მეორე, სამსართულიანი სამრეკლო XIX საუკუნის დასაწყისისაა.


    2004 წელს სამების აშენებამდე სიონი საპატრიარქოს მთავარი ტაძარი იყო. დღეს ის უფრო წყნარია, ვიდრე სამება,
    და გაცილებით ბნელი: შუადღისასაც სანთლების შუქზეა დამოკიდებული, რაც მას სრულიად სხვა განცდას აძლევს.


    გარედან ტაძარი ყვითელი ტუფის ქვითაა მოპირკეთებული და გუმბათი XIX საუკუნის რესტავრაციისაა — სწორედ
    ამიტომ ჩანს ის უფრო ახალი, ვიდრე არის. სიონი ქუჩას თითქმის ეხება: სახლები კედლებამდე მოსულია და ტაძარს
    გადასაღებად შორი წერტილი არ აქვს. ერთადერთი ადგილი, საიდანაც მისი მთელი მოცულობა ჩანს, მტკვრის მოპირდაპირე
    ნაპირია, მეტეხის ხიდიდან.
  tip: >-
    ოცდაათი წუთი საკმარისია. მოქმედი ტაძარია: ქალებს თავსაფარი და გრძელი კაბა ან ბიუსტამდე ჩამოსული შარფი
    სჭირდებათ, მამაკაცებს — გრძელი შარვალი; შესასვლელთან უფასოდ დევს. ღვთისმსახურების დროს ფოტოს გადაღება
    არ ღირს და ხშირად საერთოდ არ დაუშვებენ. შესასვლელი რამდენიმე საფეხურითაა. შიგნით ბნელია — თვალს ერთი-ორი
    წუთი სჭირდება შესაგუებლად. ტუალეტი ტაძარში არ არის, უახლოესი მიმდებარე კაფეებშია. ზამთარშიც სასიამოვნოა,
    რადგან შენობა თბილია.
  route: >-
    ძველ ქალაქში ხარ, ანუ მანქანით მისვლა მარტივია და დაყენება — არა. თავისუფლების მოედნიდან კოტე აფხაზის
    ქუჩით ჩამოდი, სიონის ქუჩა თავად ვიწროა და ნაწილობრივ საფეხმავლო. ყველაზე რეალური ვარიანტია გორგასლის
    მოედნის მიმდებარე ანაზღაურებადი პარკინგი ან მეიდნის ქვეშ არსებული სადგომი, საიდანაც ტაძრამდე 5 წუთის
    სავალია. ბარათაშვილის გასწვრივ ასევე არის ზონალური ადგილები. ვიწრო ქუჩებში დგომა ხშირად ევაკუატორით
    მთავრდება. ეკონომკლასის მცირე ზომის მანქანა აქ სერიოზული უპირატესობაა.
en:
  name: Sioni Cathedral
  short: The old cathedral on the bank of the Mtkvari, where the grapevine cross of St Nino is kept.
  body: >-
    **Sioni is the church Tbilisi has rebuilt more often than any other.** It stands on the right bank
    of the Mtkvari in a knot of narrow streets, and from outside it looks almost modest — until you realise
    the building has been wrecked and put back up in nearly every century of its existence.


    The first church here went up in the sixth or seventh century. Then came the Arabs, Jalal ad-Din in
    1226, Timur, and the Persians. The core of what stands now is thirteenth century, but the dome, much
    of the walling and the facade details were rebuilt between the seventeenth and nineteenth centuries.
    The invasion of Agha Mohammad Khan in 1795 damaged it again.


    Two things hold the attention inside. The first is the cross of St Nino, made of grapevine and, by
    tradition, bound with the saint's own hair; it sits in a silver case near the altar on the north side.
    The second is the wall painting, carried out in the 1850s by the Russian artist Grigory Gagarin over
    older frescoes — a decision Georgian art historians still argue about.


    Across the street stands a free-standing brick bell tower of 1425, the oldest surviving in Tbilisi,
    and beside it a second, three-storey tower from the early nineteenth century.


    Until Sameba was consecrated in 2004, Sioni was the patriarchal cathedral. It is quieter now than
    Sameba, and far darker: even at midday it depends on candlelight, which gives it a completely different
    feeling from the huge new church across the river.


    From outside the cathedral is faced in yellow tufa and the dome belongs to a nineteenth-century restoration,
    which is why it looks newer than it is. Sioni is also hemmed in: houses come right up to the walls,
    and there is no vantage point close by from which the whole building can be seen at once. The only
    place it reads as a single mass is from the opposite bank of the river, near Metekhi bridge.
  tip: >-
    Thirty minutes is enough. This is a working cathedral: women need a headscarf and a long skirt or
    a wrap, men long trousers, and both are kept free by the door. Photography during services is unwelcome
    and often simply not allowed. There are a few steps at the entrance. The interior is genuinely dark
    and your eyes need a minute or two to adjust. There are no toilets in the cathedral; the nearest are
    in the cafes around Sioni Street. It is a comfortable stop in winter, since the building holds its
    warmth.
  route: >-
    You are in the old town, which means driving here is easy and parking is not. Come down from Freedom
    Square along Kote Abkhazi Street; Sioni Street itself is narrow and partly pedestrian. The realistic
    option is the paid parking around Gorgasali Square, or the lot beneath Meidan, both about five minutes'
    walk from the cathedral. There are also metered bays along Baratashvili. Leaving a car in the lanes
    near the church usually ends with a tow truck. A small economy car is a real advantage in this quarter.
ru:
  name: Кафедральный собор Сиони
  short: Старый собор на берегу Куры, где хранится крест святой Нино, сплетённый из виноградной лозы.
  body: >-
    **Сиони — храм, который Тбилиси отстраивал чаще любого другого.** Он стоит на правом берегу Куры в
    путанице узких улиц и снаружи выглядит почти скромно, пока не поймёшь, что это здание разрушали и
    поднимали заново едва ли не в каждом столетии.


    Первая церковь появилась здесь в VI–VII веках. Затем были арабы, Джалал ад-Дин в 1226 году, Тимур,
    персы. Ядро нынешней постройки относится к XIII веку, но купол, значительная часть стен и детали фасада
    восстанавливались в XVII–XIX веках. Нашествие Ага-Мохаммед-хана в 1795 году снова повредило собор.


    Внутри внимание держат две вещи. Первая — крест святой Нино из виноградной лозы, по преданию перевязанный
    её собственными волосами; он стоит в серебряном киоте у алтаря с северной стороны. Вторая — стенопись,
    выполненная в 1850-х русским художником Григорием Гагариным поверх более древних фресок; об этом решении
    грузинские искусствоведы спорят до сих пор.


    Через улицу стоит отдельная кирпичная колокольня 1425 года — старейшая из сохранившихся в Тбилиси,
    а рядом вторая, трёхъярусная, начала XIX века.


    До освящения Самеба в 2004 году Сиони был патриаршим собором. Сейчас он тише и намного темнее: даже
    в полдень здесь полагаются на свечи, и ощущение получается совсем иное, чем в огромном новом храме
    на другом берегу.


    Снаружи собор облицован жёлтым туфом, а купол относится к реставрации XIX века, поэтому здание выглядит
    новее, чем оно есть. Сиони к тому же зажат: дома подходят вплотную к стенам, и рядом нет точки, откуда
    постройку видно целиком. Единственное место, где она читается одним объёмом, — противоположный берег
    реки, у Метехского моста.
  tip: >-
    Тридцати минут достаточно. Это действующий собор: женщинам нужен платок и длинная юбка или палантин,
    мужчинам — длинные брюки; и то и другое бесплатно лежит у входа. Снимать во время службы не стоит,
    а часто и просто не разрешают. У входа несколько ступеней. Внутри действительно темно, глазам нужна
    минута-другая. Туалета в соборе нет, ближайшие — в кафе вокруг улицы Сиони. Зимой заходить приятно:
    здание держит тепло.
  route: >-
    Вы в старом городе: доехать легко, припарковаться — нет. Спускайтесь с площади Свободы по улице Коте
    Абхази; сама улица Сиони узкая и частично пешеходная. Реальный вариант — платная парковка у площади
    Горгасали или стоянка под Мейданом, откуда до собора пять минут пешком. Есть и размеченные места вдоль
    улицы Бараташвили. Машина, брошенная в переулках у храма, обычно уезжает на эвакуаторе. Небольшой
    автомобиль эконом-класса здесь даёт заметное преимущество.
fa:
  name: کلیسای جامع سیونی
  short: کلیسای جامع کهن بر کرانهٔ رود متکواری، جایی که صلیب تاکِ سنت نینو نگهداری می‌شود.
  body: >-
    **سیونی کلیسایی است که تفلیس بیش از هر بنای دیگری آن را از نو ساخته است.** بر کرانهٔ راست متکواری
    میان گره‌ای از کوچه‌های باریک ایستاده و از بیرون تقریباً فروتن به نظر می‌رسد، تا آنکه بدانی این بنا
    در نزدیک هر سده‌ای ویران و دوباره برپا شده است.


    نخستین کلیسا در سدهٔ ششم یا هفتم اینجا ساخته شد. سپس اعراب آمدند، جلال‌الدین در ۱۲۲۶، تیمور و ایرانیان.
    هستهٔ آنچه امروز برپاست به سدهٔ سیزدهم بازمی‌گردد، اما گنبد و بخش بزرگی از دیوارها و جزئیات نما میان
    سده‌های هفدهم تا نوزدهم بازسازی شده‌اند. حملهٔ آقامحمدخان در ۱۷۹۵ بار دیگر به آن آسیب زد.


    در داخل دو چیز نگاه را نگه می‌دارد. نخست صلیب سنت نینو، ساخته از شاخهٔ تاک و بنا بر روایت بسته‌شده
    با موی خود او؛ در محفظه‌ای نقره‌ای نزدیک محراب در سمت شمالی است. دوم نقاشی دیوارها که در دههٔ ۱۸۵۰
    به دست گریگوری گاگارین نقاش روس روی فرسک‌های کهن‌تر اجرا شد؛ تصمیمی که هنرشناسان گرجی هنوز دربارهٔ
    آن بحث می‌کنند.


    آن‌سوی کوچه برج ناقوسی آجری و مستقل از سال ۱۴۲۵ ایستاده که کهن‌ترین برج بازمانده در تفلیس است، و کنارش
    برجی دیگر سه‌طبقه از اوایل سدهٔ نوزدهم.


    تا پیش از تقدیس سامبا در ۲۰۰۴، سیونی کلیسای جامع پاتریارک بود. اکنون آرام‌تر و بسیار تاریک‌تر است:
    حتی نیمروز هم به نور شمع متکی است و حسی کاملاً متفاوت از کلیسای بزرگ و تازهٔ آن‌سوی رود می‌دهد.


    از بیرون، نمای کلیسا از توف زرد است و گنبد به مرمتی از سدهٔ نوزدهم تعلق دارد، و به همین سبب تازه‌تر
    از آنچه هست می‌نماید. سیونی در تنگنا هم افتاده است: خانه‌ها تا پای دیوار پیش آمده‌اند و نزدیک آن جایی
    نیست که بتوان کل بنا را یکجا دید. تنها جایی که به‌صورت یک حجم واحد خوانده می‌شود کرانهٔ مقابل رود
    است، نزدیک پل متخی.
  tip: >-
    نیم ساعت کافی است. این کلیسایی فعال است: زنان به روسری و دامن بلند یا شال نیاز دارند و مردان به شلوار
    بلند؛ هر دو رایگان کنار در گذاشته شده‌اند. عکاسی هنگام مراسم پسندیده نیست و اغلب اجازه هم ندارد. ورودی
    چند پله دارد. داخل واقعاً تاریک است و چشم یکی دو دقیقه وقت می‌خواهد. سرویس بهداشتی در کلیسا نیست و
    نزدیک‌ترین آن در کافه‌های اطراف خیابان سیونی است. در زمستان توقف خوبی است، چون بنا گرمایش را نگه می‌دارد.
  route: >-
    شما در شهر قدیم هستید، یعنی رانندگی آسان است و پارک کردن نه. از میدان آزادی از خیابان کوته آبخازی
    پایین بیایید؛ خود کوچهٔ سیونی باریک و بخشی از آن پیاده‌رو است. گزینهٔ واقع‌بینانه پارکینگ پولی اطراف
    میدان گورگاسالی یا محوطهٔ زیر مِیدان است، هر دو حدود پنج دقیقه پیاده تا کلیسا. جای‌های خط‌کشی‌شده
    در امتداد باراتاشویلی هم هست. رها کردن خودرو در کوچه‌های کنار کلیسا معمولاً به خودروبَر ختم می‌شود.
    خودروی اقتصادی کوچک اینجا امتیاز واقعی است.
he:
  name: קתדרלת סיוני
  short: הקתדרלה העתיקה על גדת המתקוורי, שבה נשמר צלב הגפן של נינו הקדושה.
  body: >-
    **סיוני היא הכנסייה שטביליסי בנתה מחדש יותר מכל מבנה אחר.** היא עומדת על הגדה הימנית של המתקוורי בתוך
    סבך של סמטאות, ומבחוץ היא נראית כמעט צנועה — עד שמבינים שהמבנה הזה נהרס והוקם מחדש כמעט בכל מאה של
    קיומו.


    הכנסייה הראשונה נבנתה כאן במאה השישית או השביעית. אחר כך באו הערבים, ג'לאל א-דין ב-1226, טימור והפרסים.
    הגרעין של המבנה הנוכחי הוא מן המאה ה-13, אך הכיפה, חלק גדול מן הקירות ופרטי החזית שוחזרו בין המאה
    ה-17 למאה ה-19. פלישת אע'א מוחמד ח'אן ב-1795 פגעה בה שוב.


    שני דברים מחזיקים את תשומת הלב בפנים. הראשון הוא צלבה של נינו הקדושה, עשוי מגפן וקשור, על פי המסורת,
    בשערה שלה; הוא מונח בתיבת כסף סמוך למזבח בצד הצפוני. השני הוא ציורי הקיר, שביצע בשנות ה-50 של המאה
    ה-19 האמן הרוסי גריגורי גגארין מעל פרסקאות עתיקים יותר — החלטה שחוקרי אמנות גאורגים מתווכחים עליה
    עד היום.


    מעבר לרחוב עומד מגדל פעמונים עצמאי מלבנים משנת 1425, העתיק ביותר ששרד בטביליסי, ולצדו מגדל שני בן
    שלוש קומות מראשית המאה ה-19.


    עד חנוכת סמבה ב-2004 הייתה סיוני קתדרלת הפטריארך. היום היא שקטה יותר וחשוכה בהרבה: גם בצהריים היא
    נשענת על אור נרות, וזה יוצר תחושה שונה לגמרי מן הכנסייה החדשה והענקית שמעבר לנהר.


    מבחוץ הקתדרלה מחופה בטוף צהוב, והכיפה שייכת לשחזור מן המאה ה-19, ולכן היא נראית חדשה מכפי שהיא. סיוני
    גם דחוקה: הבתים מגיעים עד לחומות, ואין בקרבתה נקודה שממנה רואים את המבנה כולו בבת אחת. המקום היחיד
    שבו הוא נקרא כגוש אחד הוא הגדה שממול, ליד גשר מטחי.
  tip: >-
    שלושים דקות מספיקות. זו קתדרלה פעילה: נשים זקוקות למטפחת ראש ולחצאית ארוכה או לצעיף, גברים למכנסיים
    ארוכים, ושניהם מונחים חינם ליד הדלת. צילום בזמן תפילה אינו רצוי ולעתים פשוט אסור. בכניסה יש כמה מדרגות.
    הפנים חשוך באמת והעיניים צריכות דקה או שתיים. אין שירותים בקתדרלה, והקרובים ביותר בבתי הקפה סביב רחוב
    סיוני. בחורף זו עצירה נעימה, כי המבנה שומר על חום.
  route: >-
    אתם בעיר העתיקה, כלומר הנסיעה קלה והחניה לא. רדו מכיכר החירות ברחוב קוטה אבחזי; רחוב סיוני עצמו צר
    וחלקו להולכי רגל. האפשרות המעשית היא חניון בתשלום סביב כיכר גורגסאלי או החניון שמתחת למידאן, שניהם
    כחמש דקות הליכה מן הקתדרלה. יש גם מקומות מסומנים לאורך רחוב בראטאשווילי. רכב שנעזב בסמטאות ליד הכנסייה
    בדרך כלל נגרר. רכב חסכוני קטן הוא יתרון ממשי ברובע הזה.
ar:
  name: كاتدرائية سيوني
  short: الكاتدرائية القديمة على ضفة نهر متكفاري، وفيها يُحفظ صليب القديسة نينو المصنوع من الكرمة.
  body: >-
    **سيوني هي الكنيسة التي أعادت تبليسي بناءها أكثر من أي مبنى آخر.** تقوم على الضفة اليمنى لنهر متكفاري
    وسط عقدة من الأزقة الضيقة، وتبدو من الخارج متواضعة تقريباً، إلى أن تدرك أن هذا البناء قد هُدم وأُعيد
    رفعه في كل قرن تقريباً من عمره.


    شُيدت أول كنيسة هنا في القرن السادس أو السابع. ثم جاء العرب، وجلال الدين عام 1226، وتيمور، والفرس.
    ونواة القائم اليوم تعود إلى القرن الثالث عشر، أما القبة وجزء كبير من الجدران وتفاصيل الواجهة فأُعيد
    بناؤها بين القرنين السابع عشر والتاسع عشر. وأصابها غزو آغا محمد خان عام 1795 بأضرار جديدة.


    ويستوقف الزائر في الداخل أمران. الأول صليب القديسة نينو، المصنوع من غصن كرمة والمشدود بحسب الرواية
    بشعرها هي؛ وهو في حُقّ من فضة قرب المذبح في الجهة الشمالية. والثاني الرسوم الجدارية التي نفذها في
    خمسينيات القرن التاسع عشر الفنان الروسي غريغوري غاغارين فوق رسوم أقدم، وهو قرار ما زال مؤرخو الفن
    الجورجيون يختلفون حوله.


    وعبر الشارع يقوم برج أجراس مستقل من الآجر يعود إلى 1425، وهو أقدم ما بقي في تبليسي، وإلى جانبه برج
    ثانٍ من ثلاث طبقات من مطلع القرن التاسع عشر.


    وحتى تكريس ساميبا عام 2004 كانت سيوني كاتدرائية البطريركية. وهي اليوم أهدأ وأشد عتمة: فحتى في الظهيرة
    تعتمد على ضوء الشموع، وهو ما يمنحها إحساساً مختلفاً تماماً عن الكنيسة الجديدة الضخمة عبر النهر.


    من الخارج تُكسى الكاتدرائية بحجر التوف الأصفر، والقبة من ترميم القرن التاسع عشر، ولذلك تبدو أحدث مما
    هي. وسيوني محاصرة أيضاً: فالبيوت تلامس أسوارها ولا توجد قربها نقطة يُرى منها البناء كله دفعة واحدة.
    والموضع الوحيد الذي تبدو فيه كتلة واحدة هو الضفة المقابلة للنهر قرب جسر ميتيخي.
  tip: >-
    ثلاثون دقيقة تكفي. هذه كاتدرائية عاملة: تحتاج النساء غطاء رأس وتنورة طويلة أو شالاً، ويحتاج الرجال
    سروالاً طويلاً، وكلاهما متاح مجاناً عند الباب. والتصوير أثناء القداس غير مرحب به وكثيراً ما يُمنع.
    وفي المدخل بضع درجات. والداخل معتم فعلاً وتحتاج العين دقيقة أو دقيقتين. ولا دورات مياه داخل الكاتدرائية،
    وأقربها في مقاهي شارع سيوني. وهي محطة مريحة في الشتاء لأن البناء يحتفظ بدفئه.
  route: >-
    أنت في المدينة القديمة، أي أن القيادة سهلة والوقوف ليس كذلك. انزل من ميدان الحرية عبر شارع كوته أبخازي؛
    وشارع سيوني نفسه ضيق وجزء منه للمشاة. والخيار الواقعي هو المواقف المدفوعة حول ميدان غورغاسالي أو الموقف
    أسفل الميدان، وكلاهما على نحو خمس دقائق مشياً من الكاتدرائية. وهناك أماكن مخططة على امتداد شارع باراتاشفيلي.
    وترك السيارة في الأزقة قرب الكنيسة ينتهي عادة بسيارة السحب. وسيارة اقتصادية صغيرة ميزة حقيقية في هذا
    الحي.
