ka:
  name: მდინარე აბაშის ჩანჩქერი
  short: >-
    30-მეტრიანი ჩანჩქერი მდინარე აბაშის სათავეში, ბზის ხშირ ტყეში, მეორე ბალდიდან ხუთ კილომეტრზე — მასთან
    მხოლოდ ტყის ნელი, ძნელი გზა მიდის.
  body: >-
    **სანამ აბაშა მარტვილის კანიონებს გამოჭრის და ბარში ქალაქს სახელს დაარქმევს, ის აქ იბადება — კირქვის
    ქიმიდან ოცდაათმეტრიანი ვარდნით.**


    ბუნების ეს დაცული ძეგლი მდინარის სათავეშია, ზღვის დონიდან დაახლოებით 630 მეტრზე, ასხის კირქვიანი მასივის
    სამხრეთ-დასავლეთ ნაწილში, მარტვილის მუნიციპალიტეტში — ქალაქ აბაშიდან კი, სახელის მიუხედავად, შორსაა.
    აქაური კირქვა გვიანცარცულია; იქ, სადაც წყალი ეცემა, მას დაახლოებით თორმეტი მეტრის დიამეტრის ორმო გამოუთხრია.
    მთავარ ნაკადს მარჯვნივ ორი პატარა ნაკადი ახლავს, მარცხნივ — ერთი, ამიტომ უხვწყლიან დროს ერთი თეთრი
    ზოლის ნაცვლად მთელ პატარა ოჯახს ხედავთ.


    ტყე აქ მჭიდროდ იკვრება. დაცული ტერიტორიების სააგენტო განსაკუთრებით ბზის ხშირ კორომებს გამოყოფს — ნელა
    მზარდ მარადმწვანე ბუჩქნარს, რომელშიც გაძრომა ძნელია. ჩანჩქერის წყლის მტვერი კი ნოტიო ჰაერის პატარა
    კუნძულს ქმნის, სადაც თავისებური მცენარეები და ცხოველები ბინადრობს.


    არც ეკლესია, არც ლეგენდა, არც ჩაწერილი ისტორია — აქ მხოლოდ წყალი, ქვა და ბზაა. დანარჩენზე სააგენტო
    გულახდილია: მეორე ბალდიდან ხუთი კილომეტრი ტყის გრუნტის გზა და ერთი საათი ან მეტი სავალი.


    ოცდაათი მეტრი ჩამოქანებული წყალი — და ბზნარში ერთი საათის სავალი, რომ ის დაიმსახუროთ.
  tip: >-
    ეს ნახევარდღიანი ლაშქრობაა და არა გზისპირა გაჩერება. სააგენტოს თქმით, მეორე ბალდიდან ხუთ კილომეტრს
    რთული გზის გამო ერთი საათი ან მეტი სჭირდება; ბოლო მონაკვეთს ბზის ბარდები ანელებს, წვიმის შემდეგ კი
    თიხა სრიალებს — ჩაიცვით არასრიალა ძირიანი ფეხსაცმელი და გრძელი შარვალი. მანიშნებლებს ნუ დაეყრდნობით:
    ინფრასტრუქტურა არ არის და კავშირი სუსტია, ამიტომ ოფლაინ რუკა წინასწარ ჩამოტვირთეთ, გზა მეორე ბალდაში
    იკითხეთ, წყალი და საჭმელი მარტვილიდან წაიღეთ. ყველაზე უხვი წყალი გაზაფხულსა და ზაფხულის დასაწყისშია.
    საფასური დადასტურებული არ არის — წასვლამდე სააგენტოში გადაამოწმეთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით დასავლეთისკენ, ქუთაისისა და სამტრედიის მიმართულებით იარეთ, აბაშისკენ
    გააგრძელეთ და ჩრდილოეთით, მარტვილისკენ გადაუხვიეთ — აქამდე მთელი გზა ასფალტია. მარტვილიდან ჩრდილო-აღმოსავლეთით,
    ბალდის სოფლებისკენ აიღეთ გეზი და ბოლო დასახლებამდე, მეორე ბალდამდე მიდით. მის იქით ტყეში დაახლოებით
    ხუთი კილომეტრის გრუნტის გზა მიდის; მანქანით რამდენს გაივლით, ამინდზეა დამოკიდებული, წვიმის შემდეგ
    კი ჯობს, ფეხით იაროთ. სულ დაახლოებით 291 კმ და ხუთი საათი. აიღეთ მაღალი გამავლობის მანქანა (კროსოვერი
    ან ჯიპი): სოფლის გზები უხეშია და დაბალ მანქანას გაუჭირდება. საწვავი სამტრედიაში ან მარტვილში ჩაასხით
    — შემდეგ გასამართი აღარ არის.
en:
  name: Abasha River Waterfall
  short: >-
    A 30-metre fall at the very source of the Abasha, in dense box forest five kilometres from Second
    Balda, reached only by a slow, hard forest track.
  body: >-
    **Before the Abasha cuts Martvili's canyons and gives its name to a town on the plain, it is born
    here, dropping thirty metres off a ledge of limestone.**


    This protected natural monument lies at the source of the river, about 630 metres above sea level
    in the south-western part of the Askhi limestone massif, in Martvili municipality — and, despite the
    name, a long way from the town of Abasha. The rock is Late Cretaceous limestone, and where the water
    lands it has scoured a hole some twelve metres across. Two smaller streams spill down to the right
    of the main fall and a third to its left, so in full flow you see not one white ribbon but a small
    family of them.


    The forest closes in tightly. The Agency of Protected Areas singles out the dense stands of box, the
    slow-growing evergreen whose thickets are hard to push through, while spray from the fall keeps a
    small island of humid air with plants and animals of its own.


    No church, no legend and no recorded history belong to this place: only water, stone and box. On the
    rest the Agency is candid — five kilometres of forest dirt road from Second Balda, and an hour or
    more to get there.


    Thirty metres of falling water, and an hour of box forest to earn it.
  tip: >-
    Treat this as a half-day hike, not a roadside stop. The Agency of Protected Areas says the 5 km from
    Second Balda can take an hour or more because the path is difficult; box thickets slow the last stretch
    and the clay turns slick after rain, so wear boots with grip and long trousers. Do not rely on signs:
    there are no facilities and the signal is weak, so download an offline map, ask the way in Second
    Balda and bring water and food from Martvili. Spring and early summer give the fullest flow. Any fee
    is unconfirmed — check with the Agency before you go.
  route: >-
    From Tbilisi take the S1 west towards Kutaisi and Samtredia, continue towards Abasha and turn north
    to Martvili — asphalt all the way. From Martvili head north-east into the Balda villages as far as
    Second Balda, the last settlement. Beyond it a dirt road runs about five kilometres through the forest;
    how far a car can go depends on the weather, and after rain it is better walked. In all about 291
    km and five hours. Take an SUV: the village roads are rough and a low car will struggle. Refuel in
    Samtredia or Martvili; there is nothing beyond.
ru:
  name: Водопад реки Абаша
  short: >-
    Тридцатиметровый водопад у самого истока Абаши, в густом самшитовом лесу в пяти километрах от Второй
    Балды; путь к нему — медленная и трудная лесная дорога.
  body: >-
    **Прежде чем прорезать мартвильские каньоны и дать имя городу на равнине, Абаша рождается здесь, падая
    на тридцать метров с известнякового уступа.**


    Этот охраняемый памятник природы находится у самого истока реки, примерно в 630 метрах над уровнем
    моря, в юго-западной части известнякового массива Асхи, в Мартвильском муниципалитете — и, вопреки
    названию, далеко от города Абаша. Порода здесь — позднемеловой известняк, и там, где падает вода,
    она выбила чашу около двенадцати метров в поперечнике. Справа от главного водопада сбегают два ручья
    поменьше, слева — третий, так что в полноводье видна не одна белая лента, а целое маленькое семейство.


    Лес подступает вплотную. Агентство охраняемых территорий особо выделяет густые заросли самшита — медленнорастущего
    вечнозелёного растения, сквозь чащу которого трудно продраться, а брызги водопада поддерживают небольшой
    островок влажного воздуха со своими растениями и животными.


    Ни церкви, ни легенды, ни записанной истории у этого места нет — только вода, камень и самшит. Обо
    всём остальном Агентство говорит честно: пять километров лесной грунтовки от Второй Балды и час с
    лишним пути.


    Тридцать метров падающей воды — и час пути через самшитовый лес, чтобы их заслужить.
  tip: >-
    Считайте это полудневным походом, а не остановкой у обочины. По словам Агентства охраняемых территорий,
    5 км от Второй Балды могут занять час и больше, потому что тропа трудная; заросли самшита замедляют
    последний участок, а глина после дождя становится скользкой, так что надевайте ботинки с цепкой подошвой
    и длинные брюки. На указатели не надейтесь: инфраструктуры нет, связь слабая — скачайте офлайн-карту,
    спросите дорогу во Второй Балде и возьмите воду и еду из Мартвили. Самый полноводный сезон — весна
    и начало лета. Взимается ли плата, не подтверждено: уточните в Агентстве перед поездкой.
  route: >-
    Из Тбилиси поезжайте по S1 на запад, в сторону Кутаиси и Самтредиа, продолжайте в направлении Абаши
    и сверните на север к Мартвили — всё время по асфальту. Из Мартвили держите на северо-восток, к сёлам
    Балда, до Второй Балды, последнего населённого пункта. Дальше около пяти километров через лес идёт
    грунтовка; насколько далеко по ней проедет машина, зависит от погоды, а после дождя лучше идти пешком.
    Всего около 291 км и пять часов. Берите внедорожник: сельские дороги разбиты, и низкой машине будет
    тяжело. Заправьтесь в Самтредиа или Мартвили — дальше заправок нет.
fa:
  name: آبشار رود آباشا
  short: >-
    آبشاری ۳۰ متری درست در سرچشمهٔ رود آباشا، در جنگل انبوه شمشاد و پنج کیلومتر دورتر از بالدای دوم، که
    تنها از راهی جنگلی، کند و دشوار به آن می‌رسید.
  body: >-
    **آباشا پیش از آنکه کانیون‌های مارتویلی را بشکافد و نامش را به شهری در دشت بدهد، اینجا زاده می‌شود
    و از لبه‌ای آهکی سی متر فرو می‌ریزد.**


    این اثر طبیعی حفاظت‌شده در سرچشمهٔ رود، در ارتفاع حدود ۶۳۰ متری از سطح دریا، در بخش جنوب‌غربی تودهٔ
    آهکی اَسخی و در شهرستان مارتویلی قرار دارد — و برخلاف نامش، با شهر آباشا فاصلهٔ زیادی دارد. سنگ اینجا
    آهکِ کرتاسهٔ پسین است و آب در جایی که فرود می‌آید، گودالی به قطر حدود دوازده متر کنده است. دو جویبار
    کوچک‌تر در سمت راست آبشار اصلی و سومی در سمت چپ آن فرو می‌ریزند؛ پس در اوج پرآبی نه یک نوار سپید،
    که خانوادهٔ کوچکی از آن‌ها را می‌بینید.


    جنگل تنگ در برش گرفته است. آژانس مناطق حفاظت‌شده به‌ویژه از توده‌های انبوه شمشاد یاد می‌کند، گیاه
    همیشه‌سبزی که آهسته می‌روید و گذشتن از بیشه‌هایش دشوار است؛ و افشانهٔ آبشار جزیرهٔ کوچکی از هوای مرطوب
    پدید آورده که گیاهان و جانوران خاص خود را دارد.


    هیچ کلیسا، افسانه یا تاریخ ثبت‌شده‌ای از آنِ این مکان نیست: تنها آب، سنگ و شمشاد. دربارهٔ باقی ماجرا
    آژانس بی‌پرده سخن می‌گوید: پنج کیلومتر راه خاکی جنگلی از بالدای دوم و یک ساعت یا بیشتر تا رسیدن.


    سی متر آبِ فروریزان — و یک ساعت راه در جنگل شمشاد تا شایستهٔ دیدنش شوید.
  tip: >-
    این را پیاده‌روی نیم‌روزه بدانید، نه توقفی کنار جاده. به گفتهٔ آژانس مناطق حفاظت‌شده، ۵ کیلومتر راه
    از بالدای دوم ممکن است یک ساعت یا بیشتر طول بکشد، چون مسیر دشوار است؛ بیشه‌های شمشاد بخش پایانی را
    کند می‌کنند و گِل رسی پس از باران لغزنده می‌شود، پس پوتینی با کف چسبنده و شلوار بلند بپوشید. به تابلوها
    تکیه نکنید: هیچ امکاناتی نیست و آنتن ضعیف است؛ نقشهٔ آفلاین بارگیری کنید، راه را در بالدای دوم بپرسید
    و آب و خوراک را از مارتویلی بیاورید. بهار و اوایل تابستان پرآب‌ترین فصل است. دربارهٔ ورودیه اطلاعات
    تأییدشده‌ای نیست؛ پیش از رفتن از آژانس بپرسید.
  route: >-
    از تفلیس جادهٔ S1 را به سمت غرب، به سوی کوتائیسی و سامتردیا، بگیرید، به سمت آباشا ادامه دهید و به
    سوی شمال به مارتویلی بپیچید — همهٔ راه آسفالت است. از مارتویلی به سمت شمال‌شرق به روستاهای بالدا بروید
    تا بالدای دوم، آخرین آبادی. پس از آن جاده‌ای خاکی حدود پنج کیلومتر از میان جنگل می‌گذرد؛ اینکه خودرو
    تا کجا می‌تواند پیش برود به هوا بستگی دارد و پس از باران بهتر است پیاده بروید. روی هم حدود ۲۹۱ کیلومتر
    و پنج ساعت. خودروی شاسی‌بلند بگیرید: جاده‌های روستایی ناهموارند و خودروی کف‌کوتاه به زحمت می‌افتد.
    در سامتردیا یا مارتویلی سوخت بگیرید؛ پس از آن جایگاهی نیست.
he:
  name: מפל נהר אבשה
  short: >-
    מפל של 30 מטרים ממש במקור נהר אבשה, ביער אשכרוע סבוך, חמישה קילומטרים מבאלדה השנייה, שאליו מגיעים
    רק בדרך יער איטית וקשה.
  body: >-
    **לפני שהאבשה חוצב את קניוני מרטווילי ונותן את שמו לעיירה במישור, הוא נולד כאן, בנפילה של שלושים מטרים
    ממדף של אבן גיר.**


    אתר הטבע המוגן הזה נמצא ממש במקור הנהר, בגובה של כ-630 מטרים מעל פני הים, בחלקו הדרום-מערבי של מאסיב
    הגיר אסחי, במוניציפליטת מרטווילי — ולמרות שמו, רחוק למדי מהעיירה אבשה. הסלע כאן הוא אבן גיר מהקרטיקון
    המאוחר, ובמקום שבו המים נוחתים הם חצבו גומה שקוטרה כשנים עשר מטרים. מימין למפל הראשי נשפכים שני פלגים
    קטנים יותר ומשמאלו פלג שלישי, כך שבשיא הזרימה רואים לא סרט לבן אחד אלא משפחה קטנה של סרטים.


    היער סוגר מכל עבר. הסוכנות לשטחים מוגנים מציינת במיוחד את חורשות האשכרוע הצפופות — צמח ירוק-עד שגדל
    לאט, שקשה לפלס דרך בסבך שלו — ואילו רסס המפל שומר על אי קטן של אוויר לח, עם צמחים ובעלי חיים משלו.


    אין כאן כנסייה, אין אגדה ואין היסטוריה כתובה: רק מים, אבן ואשכרוע. לגבי השאר הסוכנות אינה מייפה דבר:
    חמישה קילומטרים של דרך עפר ביער מבאלדה השנייה, ושעה או יותר עד שמגיעים.


    שלושים מטרים של מים נופלים — ושעת הליכה ביער אשכרוע כדי לזכות בהם.
  tip: >-
    התייחסו לכך כאל טיול של חצי יום, לא כאל עצירה בצד הדרך. לפי הסוכנות לשטחים מוגנים, 5 הק"מ מבאלדה השנייה
    עשויים להימשך שעה ויותר משום שהשביל קשה; סבך האשכרוע מאט את הקטע האחרון, והחימר נעשה חלקלק אחרי גשם,
    אז נעלו נעליים עם אחיזה טובה ולבשו מכנסיים ארוכים. אל תסמכו על שלטים: אין שום מתקנים והקליטה חלשה,
    לכן הורידו מפה לא מקוונת, שאלו על הדרך בבאלדה השנייה והביאו מים ואוכל ממרטווילי. באביב ובתחילת הקיץ
    הזרימה במיטבה. לא אומת אם נגבים דמי כניסה — בדקו עם הסוכנות לפני היציאה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 לכיוון קוטאיסי וסמטרדיה, המשיכו לכיוון אבשה ופנו צפונה למרטווילי — כל
    הדרך באספלט. ממרטווילי סעו צפון-מזרחה אל כפרי באלדה עד באלדה השנייה, היישוב האחרון. מעבר לה עוברת
    דרך עפר כחמישה קילומטרים ביער; עד כמה רחוק תגיע בה מכונית תלוי במזג האוויר, ואחרי גשם עדיף ללכת ברגל.
    בסך הכול כ-291 ק"מ וחמש שעות. קחו רכב פנאי-שטח: הדרכים בכפרים משובשות, ומכונית נמוכה תתקשה. תדלקו
    בסמטרדיה או במרטווילי; בהמשך אין תחנות דלק.
ar:
  name: شلال نهر أباشا
  short: >-
    شلال بارتفاع 30 مترًا عند منبع نهر أباشا تمامًا، في غابة كثيفة من البقس على بعد خمسة كيلومترات من
    بالدا الثانية، لا يُبلغ إلا عبر مسار غابيّ بطيء وشاق.
  body: >-
    **قبل أن يشقّ نهر أباشا أخاديد مارتفيلي ويمنح اسمه لبلدة في السهل، يولد هنا، هاويًا ثلاثين مترًا عن
    حافة من الحجر الجيري.**


    يقع هذا المعلم الطبيعي المحمي عند منبع النهر، على ارتفاع نحو 630 مترًا فوق سطح البحر، في الجزء الجنوبي
    الغربي من كتلة أسخي الكلسية، ضمن بلدية مارتفيلي — وهو، على خلاف ما يوحي به اسمه، بعيد عن بلدة أباشا.
    الصخر هنا حجر جيري من العصر الطباشيري المتأخر، وحيث تهوي المياه حفرت حفرةً يبلغ قطرها نحو اثني عشر
    مترًا. وينساب جدولان أصغر إلى يمين الشلال الرئيسي وثالث إلى يساره، فترى في موسم الفيض لا شريطًا أبيض
    واحدًا بل عائلة صغيرة من الأشرطة.


    تُطبق الغابة على المكان. وتخصّ وكالة المناطق المحمية بالذكر أجماتِ البقس الكثيفة، ذلك النبات الدائم
    الخضرة البطيء النمو الذي يصعب شقّ الطريق عبر أدغاله، فيما يحفظ رذاذ الشلال جزيرة صغيرة من الهواء الرطب
    لها نباتاتها وحيواناتها الخاصة.


    لا كنيسة هنا ولا أسطورة ولا تاريخ مدوّن: فقط ماء وحجر وبقس. وعن الباقي تتحدث الوكالة بصراحة: خمسة
    كيلومترات من الطريق الترابي في الغابة انطلاقًا من بالدا الثانية، وساعة أو أكثر للوصول.


    ثلاثون مترًا من الماء المنهمر، وساعة من السير في غابة البقس لتستحقها.
  tip: >-
    اعتبر الزيارة نزهة سير لنصف يوم، لا توقفًا على جانب الطريق. تقول وكالة المناطق المحمية إن الكيلومترات
    الخمسة من بالدا الثانية قد تستغرق ساعة أو أكثر لأن الدرب صعب؛ فأجمات البقس تبطئ المقطع الأخير، والطين
    يصبح زلقًا بعد المطر، فارتدِ حذاءً ذا قبضة جيدة وسروالًا طويلًا. لا تعتمد على اللافتات: لا توجد أي
    مرافق والتغطية ضعيفة، فنزّل خريطة للاستخدام دون اتصال، واسأل عن الطريق في بالدا الثانية، واحمل الماء
    والطعام من مارتفيلي. يبلغ التدفق ذروته في الربيع وأوائل الصيف. لم نتحقق من وجود رسوم دخول، فراجع الوكالة
    قبل الذهاب.
  route: >-
    من تبليسي اسلك الطريق S1 غربًا باتجاه كوتايسي وسامتريديا، وتابع نحو أباشا ثم انعطف شمالًا إلى مارتفيلي
    — الطريق معبّد طوال المسافة. من مارتفيلي اتجه شمالًا شرقيًا إلى قرى بالدا حتى بالدا الثانية، آخر القرى
    المأهولة. بعدها يمتد طريق ترابي نحو خمسة كيلومترات عبر الغابة؛ ومدى ما تستطيع السيارة قطعه منه يتوقف
    على الطقس، وبعد المطر يُفضَّل السير على الأقدام. المجموع نحو 291 كم وخمس ساعات. خذ سيارة رياضية متعددة
    الاستخدامات: فطرق القرى وعرة وستعاني السيارة المنخفضة. تزوّد بالوقود في سامتريديا أو مارتفيلي؛ فلا
    محطات وقود بعدهما.
