ka:
  name: შაორის წყალსაცავი
  short: ფიჭვნარით შემოსაზღვრული მაღალმთიანი წყალსაცავი ნიკორწმინდასთან, ათას ას ოცდაათ მეტრზე.
  body: >
    შაორი რაჭის ზეგანზე, ზღვის დონიდან დაახლოებით ათას ას ოცდაათ მეტრზე მდებარეობს. ეს ბუნებრივი ტბა არ
    არის: წყალსაცავი საბჭოთა პერიოდში, ჰიდროელექტროსადგურისთვის შეიქმნა და შაორის ვაკე დაატბორა. ამის
    კვალი დღემდე ჩანს — წყლის დონის დაწევისას ნაპირზე ძველი ხეების ღეროები და დატბორილი მიწის კონტურები
    ჩნდება.


    ტბას ფიჭვნარი და მდელოები აკრავს, ხოლო ჰორიზონტზე რაჭის ქედები დგას. ეს რაჭაში ერთ-ერთი იშვიათი ადგილია,
    სადაც ფართო, ღია სივრცეა — დანარჩენი მხარე ვიწრო ხეობებითა და ტყით არის დაფარული.


    რას აკეთებენ აქ:


    - დგამენ კარვებს ნაპირზე, განსაკუთრებით ივლის-აგვისტოში

    - თევზაობენ; წყალსაცავში კობრი და კალმახი გვხვდება

    - დადიან ნაპირის გასწვრივ და ფიჭვნარში

    - ჩერდებიან პიკნიკზე ნიკორწმინდიდან ან ამბროლაურიდან გამოსვლისას


    ბანაობა შესაძლებელია, თუმცა წყალი მაღალმთიანია და ივლისშიც გრილი რჩება.


    ზამთარში ტბა ნაწილობრივ იყინება და მისასვლელი გზა თოვლით იფარება — ნოემბრიდან აპრილამდე აქ მისვლა
    არ ღირს. საუკეთესო დროა ივნისიდან სექტემბრამდე, როცა მდელოები მწვანეა და საღამოს ტემპერატურა კომფორტული.


    შაორთან ერთად ხშირად ახსენებენ შაორის ჰიდროელექტროსადგურსა და მიმდებარე ტყის მასივს, სადაც სოკოს კრეფა
    და ველოსიპედით სიარულია შესაძლებელი. ტბასთან ორგანიზებული ინფრასტრუქტურა არ არსებობს, ამიტომ ყველაფერი,
    რაც გჭირდება, თან უნდა გქონდეს — ეს მისი ხიბლიცაა და შეზღუდვაც.
  tip: >
    ინფრასტრუქტურა პრაქტიკულად არაა: არც კაფე, არც ტუალეტი, არც მაღაზია ნაპირზე. წყალი, საკვები და ნაგვის
    ტომარა თან წაიღე და ნაგავი უკან წამოიღე. ღამის გასათევად კარავი მშრალ, ქარისგან დაცულ ადგილას დადგი
    — ღამით თუნდაც აგვისტოში ათ გრადუსამდე ეცემა. მწერების საწინააღმდეგო საშუალება აუცილებელია. საწვავი
    და ბანკომატი ამბროლაურში, ოცდაათიოდე კილომეტრშია. ტბასთან სიბნელეში მისვლა არ ღირს: მისასვლელი გზა
    უნათებელია და ნაპირზე ორიენტირება ღამით რთულია.
  route: >
    მარშრუტი იგივეა, რაც ნიკორწმინდისკენ: E60-ით ქუთაისის მიმართულებით, შემდეგ ტყიბულზე და მთის გზით რაჭაში.
    ნიკორწმინდის შემდეგ აღმოსავლეთით უხვევ და ოციოდე კილომეტრში ტბასთან ხარ. სულ დაახლოებით სამას ხუთი
    კილომეტრი და ხუთი საათი თხუთმეტი წუთი. ბოლო მონაკვეთი ნაწილობრივ ხრეშოვანია და წვიმის შემდეგ ლაფიანი
    — მაღალი კლირენსი აქ ნამდვილად გამოგადგება. ზამთარში გზა თოვლით იკეტება. ნიკორწმინდასა და შაორს შორის
    მანძილი მცირეა, ამიტომ ორივე ერთ დღეში მშვიდად თავსდება.
en:
  name: Shaori Reservoir
  short: A pine-fringed highland reservoir near Nikortsminda, at around 1,130 metres.
  body: >-
    Shaori lies on the Racha plateau at roughly 1,130 metres above sea level. It is not a natural lake:
    the reservoir was created in the Soviet period to feed a hydroelectric scheme, flooding the Shaori
    basin. Traces of that remain visible — when the water level drops, the stumps of old trees and the
    outlines of drowned fields appear along the shore.


    Pine forest and meadow surround the water, with the ridges of Racha standing on the horizon. This
    is one of the few places in the region with genuinely wide open space; the rest of Racha is narrow
    gorges and dense forest.


    What people do here:


    - camp along the shore, especially in July and August

    - fish, mainly for carp and trout

    - walk the shoreline and the pine woods

    - stop for a picnic on the way out from Nikortsminda or Ambrolauri


    Swimming is possible, though the water is high-altitude cold and stays cool even in July.


    In winter the lake partly freezes and the access road fills with snow, so between November and April
    the trip is not worth making. The best window is June to September, when the meadows are green and
    evening temperatures are comfortable.
  tip: >-
    There is essentially no infrastructure: no cafe, no toilets, no shop at the shore. Bring water, food
    and a rubbish bag, and carry your waste back out. If you camp, pitch on dry ground sheltered from
    the wind — nights drop towards ten degrees even in August. Insect repellent is not optional here in
    midsummer. The nearest fuel and ATM are in Ambrolauri, about thirty kilometres away.
  route: >-
    The approach is the same as for Nikortsminda: E60 towards Kutaisi, then north through Tkibuli and
    up the mountain road into Racha. Past Nikortsminda turn east and drive about twenty kilometres to
    the lake — around 305 km and five hours fifteen in total. The last stretch is partly gravel and turns
    muddy after rain, which is where extra ground clearance genuinely helps. In winter the road is closed
    by snow, and there is no maintained alternative.
ru:
  name: Шаорское водохранилище
  short: Высокогорное водохранилище в сосновом обрамлении рядом с Никорцминдой, на высоте около 1 130
    метров.
  body: >
    Шаори лежит на Рачинском плато на высоте примерно 1 130 метров. Это не природное озеро: водохранилище
    создали в советское время для гидроэлектростанции, затопив Шаорскую котловину. Следы этого видны до
    сих пор — при понижении уровня у берега проступают пни старых деревьев и контуры затопленных полей.


    Воду окружают сосновый лес и луга, а на горизонте стоят рачинские хребты. Это одно из немногих мест
    региона с по-настоящему широким открытым пространством: остальная Рача — это узкие ущелья и густой
    лес.


    Чем здесь занимаются:


    - ставят палатки по берегу, особенно в июле и августе

    - ловят рыбу, в основном карпа и форель

    - гуляют вдоль воды и по сосняку

    - останавливаются на пикник по пути из Никорцминды или Амбролаури


    Купаться можно, но вода высокогорная и остаётся прохладной даже в июле.


    Зимой озеро частично замерзает, а подъездную дорогу заносит снегом, поэтому с ноября по апрель ехать
    сюда не стоит. Лучшее время — с июня по сентябрь, когда луга зелёные, а вечерние температуры комфортны.


    Вместе с Шаори обычно упоминают Шаорскую ГЭС и окрестный лесной массив, где собирают грибы и катаются
    на велосипеде. Организованной инфраструктуры у озера нет, поэтому всё необходимое нужно везти с собой
    — в этом одновременно и обаяние места, и его ограничение.
  tip: >-
    Инфраструктуры здесь практически нет: ни кафе, ни туалетов, ни магазина у берега. Возьмите воду, еду
    и мешок для мусора, весь мусор увозите с собой. Если ночуете в палатке, ставьте её на сухом месте,
    защищённом от ветра: ночью даже в августе температура падает примерно до десяти градусов. Средство
    от насекомых в разгар лета обязательно. Ближайшие заправка и банкомат — в Амбролаури, километрах в
    тридцати.
  route: >-
    Подъезд тот же, что и к Никорцминде: по E60 в сторону Кутаиси, затем на север через Ткибули и вверх
    по горной дороге в Рачу. За Никорцминдой поворот на восток и ещё около двадцати километров до озера
    — всего примерно 305 км и пять часов пятнадцать минут. Последний отрезок частично гравийный и после
    дождя становится грязным, именно здесь пригодится увеличенный клиренс. Зимой дорогу закрывает снег,
    и объезда нет.
fa:
  name: آبگیر شااوری
  short: آبگیری مرتفع در میان جنگل کاج نزدیک نیکورتسمیندا، در حدود 1,130 متر.
  body: >-
    شااوری روی فلات راچا در حدود 1,130 متری سطح دریا قرار دارد. این یک دریاچهٔ طبیعی نیست: آبگیر در دورهٔ
    شوروی برای تغذیهٔ یک طرح برق‌آبی ساخته شد و حوضهٔ شااوری را زیر آب برد. نشانه‌های آن هنوز پیداست —
    وقتی تراز آب پایین می‌رود، کُنده‌های درختان کهنه و خطوط مزارع غرق‌شده در امتداد ساحل بیرون می‌زنند.


    جنگل کاج و چمنزار گرداگرد آب را گرفته‌اند و ستیغ‌های راچا در افق ایستاده‌اند. اینجا یکی از معدود جاهای
    منطقه است که فضای باز واقعی دارد؛ باقی راچا دره‌های تنگ و جنگل انبوه است. مردم اینجا در امتداد ساحل
    چادر می‌زنند، به‌ویژه در ژوئیه و اوت؛ ماهی می‌گیرند، بیشتر کپور و قزل‌آلا؛ ساحل و بیشهٔ کاج را قدم
    می‌زنند؛ و در راه بازگشت از نیکورتسمیندا یا آمبرولاوری برای پیک‌نیک نگه می‌دارند. شنا هم ممکن است،
    هرچند آب مرتفع سرد است و حتی در ژوئیه خنک می‌ماند.


    در زمستان دریاچه تا حدی یخ می‌بندد و جادهٔ دسترسی پر از برف می‌شود، پس میان نوامبر و آوریل این سفر
    ارزش رفتن ندارد. بهترین پنجره ژوئن تا سپتامبر است، وقتی چمنزارها سبزند و دمای عصرها دلپذیر.
  tip: >-
    اینجا عملاً هیچ زیرساختی نیست: نه کافه، نه سرویس بهداشتی و نه مغازه‌ای کنار آب. آب، خوراک و یک کیسهٔ
    زباله همراه بیاورید و زباله‌تان را با خودتان برگردانید. اگر چادر می‌زنید، روی زمین خشک و پناه‌گرفته
    از باد چادر بزنید — شب‌ها حتی در اوت به ده درجه نزدیک می‌شوند. مواد ضد حشره در اوج تابستان اینجا اختیاری
    نیست. نزدیک‌ترین سوخت و خودپرداز در آمبرولاوری است، حدود سی کیلومتر دورتر.
  route: >-
    راه رسیدن همان راه نیکورتسمیندا است: با E60 به سوی کوتایسی، بعد رو به شمال از تکیبولی و بالا رفتن
    از جادهٔ کوهستانی به راچا. بعد از نیکورتسمیندا به شرق بپیچید و حدود بیست کیلومتر تا دریاچه برانید
    — روی هم حدود 305 کیلومتر و پنج ساعت و پانزده دقیقه. بخش پایانی تا حدی شنی است و پس از باران گِلی
    می‌شود، و همین‌جاست که ارتفاع کف بیشتر واقعاً به کار می‌آید. در زمستان برف جاده را می‌بندد و هیچ راه
    جایگزین نگهداری‌شده‌ای وجود ندارد.
he:
  name: מאגר שאורי
  short: מאגר מים הררי מוקף אורנים ליד ניקורצמינדה, בגובה של כ-1,130 מטר.
  body: >-
    שאורי שוכן על רמת רצ'ה בגובה של כ-1,130 מטר מעל פני הים. זהו אינו אגם טבעי: המאגר נוצר בתקופה הסובייטית
    כדי להזין מיזם הידרואלקטרי, והוא הציף את אגן שאורי. עקבות הדבר עדיין נראים לעין — כשמפלס המים יורד,
    מבצבצים לאורך החוף גדמי עצים ישנים וקווי מתאר של שדות שטבעו. הנוף נראה טבעי לגמרי, עד שמתקרבים אל
    שפת המים ורואים מה נשאר מתחתיה.


    יער אורנים ואחו מקיפים את המים, ורכסי רצ'ה עומדים באופק. זהו אחד המקומות הבודדים באזור שיש בו מרחב
    פתוח של ממש; שאר רצ'ה היא ערוצים צרים ויער סמיך. אנשים מגיעים לכאן כדי לחנות באוהלים לאורך החוף, בעיקר
    ביולי ובאוגוסט; לדוג, בעיקר קרפיונים ופורלים; לצעוד לאורך קו המים ובחורשות האורן; ולעצור לפיקניק בדרך
    חזרה מניקורצמינדה או מאמברולאורי. אפשר גם לשחות, אם כי המים ההרריים קרים ונשארים קרירים גם ביולי.


    בחורף האגם קופא בחלקו ודרך הגישה מתמלאת שלג, ולכן בין נובמבר לאפריל הנסיעה לכאן אינה שווה את המאמץ.
    החלון הטוב ביותר הוא מיוני עד ספטמבר, כשהאחו ירוק והטמפרטורות בערב נעימות. בחודשים האלה גם דרך הגישה
    יבשה, וזה משנה כאן יותר מכל דבר אחר.
  tip: >-
    אין כאן כמעט שום תשתית: אין בית קפה, אין שירותים ואין חנות על שפת המים. הביאו מים, אוכל ושקית אשפה,
    וקחו את הפסולת שלכם בחזרה. אם אתם מקימים אוהל, בחרו קרקע יבשה ומוגנת מרוח — הלילות יורדים לכיוון עשר
    מעלות גם באוגוסט. דוחה חרקים אינו מותרות כאן באמצע הקיץ. תחנת הדלק והכספומט הקרובים ביותר נמצאים באמברולאורי,
    כשלושים קילומטרים משם.
  route: >-
    הגישה זהה לזו של ניקורצמינדה: על E60 לכיוון קוטאיסי, ואז צפונה דרך טקיבולי ובמעלה כביש ההרים אל רצ'ה.
    אחרי ניקורצמינדה פנו מזרחה וסעו כעשרים קילומטרים עד האגם — כ-305 ק״מ וחמש שעות וחמש עשרה דקות בסך
    הכול. הקטע האחרון הוא חצץ בחלקו ונעשה בוצי אחרי גשם, וכאן גובה גחון נוסף באמת עוזר. בחורף השלג סוגר
    את הדרך, ואין שום חלופה מתוחזקת.
ar:
  name: خزان شاوري
  short: خزان مرتفع تحيط به غابات الصنوبر قرب نيكورتسميندا، على نحو 1,130 متراً.
  body: >-
    يقع شاوري على هضبة راتشا عند نحو 1,130 متراً فوق سطح البحر. وهو ليس بحيرة طبيعية: فقد أُنشئ الخزان
    في العهد السوفييتي لتغذية مشروع كهرومائي، فأغرق حوض شاوري. وآثار ذلك ما زالت ظاهرة — فحين ينخفض منسوب
    الماء تبرز على الضفاف جذوع أشجار قديمة وخطوط حقول غارقة. يبدو المشهد طبيعياً تماماً، إلى أن تقترب
    من حافة الماء فترى ما بقي تحتها.


    تحيط بالماء غابات الصنوبر والمروج، وتقف سلاسل راتشا في الأفق. وهذا من المواضع القليلة في الإقليم التي
    فيها فضاء مفتوح حقيقي؛ فبقية راتشا مضايق ضيقة وغابات كثيفة. يأتي الناس إلى هنا للتخييم على الضفاف،
    خاصة في يوليو وأغسطس؛ ولصيد السمك، وأغلبه الشبوط والتروتة؛ وللمشي على حافة الماء وبين أشجار الصنوبر؛
    وللتوقف في نزهة عائدين من نيكورتسميندا أو أمبرولاوري. والسباحة ممكنة أيضاً، وإن كان ماء المرتفعات
    بارداً ويبقى منعشاً حتى في يوليو.


    وفي الشتاء تتجمد البحيرة جزئياً ويمتلئ طريق الوصول بالثلج، فلا تستحق الرحلة العناء بين نوفمبر وأبريل.
    وأفضل نافذة هي من يونيو إلى سبتمبر، حين تخضرّ المروج وتصبح حرارة المساء مريحة. وفي هذه الأشهر يكون
    طريق الوصول جافاً أيضاً، وهذا هنا أهم من أي شيء آخر.
  tip: >-
    لا بنية تحتية هنا عملياً: لا مقهى ولا دورات مياه ولا متجر عند الماء. احمل ماءً وطعاماً وكيساً للنفايات،
    وأعد فضلاتك معك. وإن خيّمت فانصب الخيمة على أرض جافة محمية من الريح — فالليالي تهبط نحو عشر درجات
    حتى في أغسطس. وطارد الحشرات ليس أمراً اختيارياً هنا في عز الصيف. وأقرب وقود وصراف آلي في أمبرولاوري،
    على بعد نحو ثلاثين كيلومتراً.
  route: >-
    الوصول هو نفسه الوصول إلى نيكورتسميندا: على E60 نحو كوتايسي، ثم شمالاً عبر تكيبولي وصعوداً في الطريق
    الجبلي إلى راتشا. وبعد نيكورتسميندا انعطف شرقاً وقُد نحو عشرين كيلومتراً حتى البحيرة — أي نحو 305
    كم وخمس ساعات وخمس عشرة دقيقة إجمالاً. المقطع الأخير حصوي جزئياً ويصير طينياً بعد المطر، وهنا يفيد
    الخلوص الأرضي الإضافي فعلاً. وفي الشتاء يغلق الثلج الطريق، ولا بديل آخر تجري صيانته.
