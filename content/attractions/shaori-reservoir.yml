ka:
  name: შაორის წყალსაცავი
  short: >-
    რაჭის უდიდესი ტბა ხელოვნურია: 1950-იანი წლების წყალსაცავი კარსტულ ქვაბულში, ნაქერალას კლდეების ძირში,
    ნაპირზე დაცარიელებული დაბით.
  body: >-
    **კაშხლამდე ამ ქვაბულში ორი პატარა კარსტული ტბა იყო, ერთ-ერთს ხარისთვალი ერქვა. დღეს ორივე ცხრა კვადრატული
    კილომეტრი წყლის ქვეშ წევს.**


    შაორის ქვაბული რაჭის ქედის ჩრდილოეთ კალთაზეა, მისი ფსკერი ზღვის დონიდან 1000–1200 მეტრზე მდებარეობს,
    სამხრეთ-დასავლეთიდან კი მას ნაქერალას კირქვის კლდეები ზღუდავს. ეს კარსტის მხარეა: ნალექის დიდი ნაწილი
    პირდაპირ მიწაში, „სასულეებში“ იჟონება, თავად მდინარე შაორიც ძაბრებში იკარგებოდა. XX საუკუნის 50-იან
    წლებში ინჟინრებმა ეს ნაკლი უპირატესობად აქციეს: 1210 მეტრი სიგრძისა და 11,5 მეტრი სიმაღლის კაშხალმა
    შაორი შეაგუბა, არხმა, გვირაბმა და ფოლადის მილსადენმა კი წყალი ქედში გაატარა და თითქმის 480 მეტრით
    ქვემოთ, ტყიბულთან მდგარ ჰესზე დაუშვა. მისი პირველი აგრეგატი 1955 წელს ამუშავდა; საქართველოში ამაზე
    მაღალდაწნევიანი ჰესი არ არსებობს.


    შედეგად რაჭის უდიდესი წყალსატევი მივიღეთ: 7,1 კმ სიგრძისა, 2,7 კმ-მდე სიგანისა და არაუმეტეს 14,5 მეტრი
    სიღრმისა. ნაპირები უმეტესად დაბალი და დამრეცია, ზოგან მოკლე ფლატეებიც გვხვდება; ქვაბულის ფსკერს ბალახი
    და ბუჩქნარი ფარავს, მაღალ ფერდობებს — ფოთლოვანი და მუქწიწვიანი ტყე.


    დასავლეთ ნაპირზე ხარისთვალა დგას — დასახლება, რომელიც კაშხლის მშენებლებისა და გეოლოგებისთვის გაჩნდა.
    1956 წელს მას დაბის სტატუსი მიენიჭა, 1959 წელს აქ 827 ადამიანი ცხოვრობდა; საკურორტო გეგმები მოდიოდა
    და მიდიოდა, 2002 წლისთვის კი აქ აღარავინ დარჩა. ქაღალდზე ხარისთვალა დღემდე დაბაა.


    ზამთარი აქ მკაცრია — ქვაბულში −40°C-იც დაფიქსირებულა, თოვლის საფარი კი მეტრს აჭარბებს — ამიტომ ზაფხულის
    საღამო ცარიელ ნაპირზე ნასესხებ დროს ჰგავს.
  tip: >-
    ნაპირზე არაფერია: არც კაფე, არც ტუალეტი, არც მაღაზია. წყალი და საჭმელი თან წაიღეთ, ნაგავი კი ბოლო
    ნაგლეჯამდე უკან წამოიღეთ. ასფალტი ტბას ხარისთვალასთან ეხება; ნაპირის გასწვრივ გრუნტის გზებია, რომლებიც
    წვიმის შემდეგ ტალახდება, ასე რომ, დარბილებულ მიწაზე ჯობს ფეხით გაიაროთ. ივლისშიც ქვაბულის საშუალო
    ტემპერატურა 18 გრადუსს არ აღწევს — საღამოსთვის თბილი ტანსაცმელი წაიღეთ, კარვით თუ რჩებით — მით უმეტეს.
    საწვავი, ფული და სადილი ამბროლაურშია, ჩრდილოეთით 20-იოდე კილომეტრში; ნიკორწმინდის ტაძარი გზაზე 8 კმ-ით
    წინაა.
  route: >-
    ნიკორწმინდის გზას გაჰყევით: S1 (E60) გზით დასავლეთისკენ დაახლოებით 193 კმ თერჯოლის გასასვლელამდე,
    შ19-ით თერჯოლის გავლით ტყიბულამდე, მერე შ17 ნაქერალას კლდეებს სერპანტინებით აუყვება 1217-მეტრიან ნაქერალას
    უღელტეხილამდე. უღელტეხილიდან ხუთ კილომეტრში გზა ტბის დასავლეთ ნაპირს ხარისთვალასთან მიადგება — თბილისიდან
    დაახლოებით 242 კმ და ოთხი საათი. გაითვალისწინეთ: წყალსაცავი ნიკორწმინდამდეა, არა მის შემდეგ. გზა ასფალტიანია
    და ეკონომ-კლასის მანქანაც საკმარისია; კლირენსი მხოლოდ ნაპირის გრუნტის გზებზე დაგჭირდებათ. ზამთარში
    ნაქერალას მონაკვეთი შეიძლება თოვლმა და ყინულმა ჩაკეტოს — წასვლამდე გადაამოწმეთ.
en:
  name: Shaori Reservoir
  short: >-
    Racha's largest lake is man-made: a 1950s reservoir in a karst basin below the Nakerala cliffs, with
    an emptied Soviet town on its western shore.
  body: >-
    **Before the dam, this basin held two small karst lakes, one of them called Kharistvali — the Ox's
    Eye. Both now lie under nine square kilometres of water.**


    The Shaori basin sits on the northern flank of the Racha Range, its floor at 1,000–1,200 metres, walled
    to the south-west by the limestone cliffs of Nakerala. This is karst country: much of the rain drains
    straight into the ground, and the Shaori stream itself used to vanish into sinkholes. In the 1950s
    engineers turned that weakness into an asset. A dam 1,210 metres long and 11.5 metres high held back
    the Shaori, and a canal, a tunnel and a steel penstock carried the water through the ridge and down
    some 480 metres to a power station near Tkibuli. Its first unit started in 1955; no hydro plant in
    Georgia works with a higher head.


    The result is Racha's largest body of water: 7.1 km long, up to 2.7 km wide and no deeper than 14.5
    metres. The shores are mostly low and gently shelving, with short cliffs here and there; grass and
    scrub cover the basin floor, deciduous and dark conifer forest the higher slopes.


    On the western shore stands Kharistvala, built for the dam's workers and geologists. It became a town
    in 1956 and had 827 inhabitants in 1959; resort plans came and went, and by 2002 no one lived there
    at all. On paper it is still a town.


    Winters are hard — the basin has recorded −40°C and snow more than a metre deep — which makes a summer
    evening on the empty shore feel like time on loan.
  tip: >-
    There is nothing at the shore: no café, toilet or shop. Bring water and food, and take every scrap
    of rubbish home. The tarmac touches the lake at Kharistvala; the tracks along the shore are dirt and
    turn to mud after rain, so walk rather than drive when the ground is soft. Even in July the basin
    averages under 18°C, so pack a warm layer for the evening, and more if you camp. Fuel, cash and meals
    are in Ambrolauri, about 20 km north; Nikortsminda Cathedral is 8 km further along the road.
  route: >-
    Take the Nikortsminda road: the S1 (E60) west for about 193 km to the Terjola exit, the Sh19 through
    Terjola to Tkibuli, then the Sh17 up the Nakerala cliffs in switchbacks to the 1,217 m Nakerala Pass.
    Five kilometres beyond the pass the road reaches the western shore at Kharistvala — about 242 km and
    four hours from Tbilisi. Note that the reservoir comes before Nikortsminda, not after it. The road
    is asphalt and an economy car is enough; only the dirt shore tracks call for clearance. In winter
    snow and ice can close the Nakerala section, so check before you set off.
ru:
  name: Шаорское водохранилище
  short: >-
    Крупнейшее озеро Рачи — рукотворное: водохранилище 1950-х годов в карстовой котловине под скалами
    Накералы, с опустевшим советским городком на западном берегу.
  body: >-
    **До плотины в этой котловине лежали два маленьких карстовых озера, одно из них звалось Хариствали
    — «Бычий глаз». Теперь оба покоятся под девятью квадратными километрами воды.**


    Шаорская котловина лежит на северном склоне Рачинского хребта; её дно — на высоте 1000–1200 метров,
    а с юго-запада её замыкают известняковые скалы Накералы. Это карстовый край: значительная часть дождевой
    воды сразу уходит в землю, и сама речка Шаори когда-то исчезала в воронках. В 1950-х инженеры обратили
    эту слабость в преимущество. Плотина длиной 1210 метров и высотой 11,5 метра перегородила Шаори, а
    канал, тоннель и стальной напорный трубопровод провели воду сквозь хребет и сбросили её примерно на
    480 метров вниз, к электростанции близ Ткибули. Первый агрегат заработал в 1955 году; ни одна ГЭС
    Грузии не работает с бо́льшим напором.


    Так появился крупнейший водоём Рачи: 7,1 км в длину, до 2,7 км в ширину и не глубже 14,5 метра. Берега
    в основном низкие и пологие, кое-где с невысокими обрывами; дно котловины покрыто травой и кустарником,
    склоны выше — лиственным и темнохвойным лесом.


    На западном берегу стоит Хариствала, построенная для рабочих плотины и геологов. В 1956 году она получила
    статус посёлка городского типа, в 1959-м здесь жили 827 человек; планы курорта появлялись и исчезали,
    а к 2002 году здесь не осталось ни одного жителя. На бумаге это по-прежнему посёлок.


    Зимы здесь суровые — в котловине отмечали −40 °C и снег глубже метра, — и оттого летний вечер на пустом
    берегу кажется временем, взятым взаймы.
  tip: >-
    На берегу нет ничего: ни кафе, ни туалета, ни магазина. Везите воду и еду и увозите с собой весь мусор
    до последней бумажки. Асфальт выходит к озеру у Хариствалы; дороги вдоль берега грунтовые и после
    дождя превращаются в месиво, так что, если земля раскисла, идите пешком, а не езжайте. Даже в июле
    средняя температура в котловине ниже 18 °C: на вечер возьмите тёплую одежду, а если ночуете в палатке
    — ещё теплее. Топливо, наличные и еда — в Амбролаури, примерно в 20 км к северу; собор Никорцминда
    — ещё в 8 км дальше по дороге.
  route: >-
    Езжайте по дороге на Никорцминду: по S1 (E60) на запад около 193 км до съезда к Терджоле, по Sh19
    через Терджолу до Ткибули, затем по Sh17 серпантином вверх по Накеральским скалам к перевалу Накерала
    (1217 м). Через пять километров после перевала дорога выходит к западному берегу у Хариствалы — около
    242 км и четыре часа от Тбилиси. Учтите: водохранилище будет по пути раньше Никорцминды, а не после
    неё. Дорога асфальтирована, и машины эконом-класса достаточно; клиренс нужен лишь на грунтовках вдоль
    берега. Зимой снег и лёд могут перекрыть участок через Накералу — уточните обстановку перед выездом.
fa:
  name: دریاچهٔ سد شائوری
  short: >-
    بزرگ‌ترین دریاچهٔ راچا ساختهٔ دست انسان است: مخزن سدی از دههٔ ۱۹۵۰ در حوضه‌ای کارستی زیر صخره‌های
    ناکرالا، با شهرکی شوروی و خالی از سکنه بر کرانهٔ غربی.
  body: >-
    **پیش از سد، این حوضه دو دریاچهٔ کارستی کوچک داشت که نام یکی‌شان خاریستوالی بود — «چشم گاو نر». اکنون
    هر دو زیر نُه کیلومتر مربع آب خفته‌اند.**


    حوضهٔ شائوری بر دامنهٔ شمالی رشته‌کوه راچا جای دارد، کف آن در ارتفاع ۱,۰۰۰ تا ۱,۲۰۰ متر است و از جنوب‌غرب
    صخره‌های آهکی ناکرالا دورش را گرفته‌اند. اینجا سرزمین کارست است: بخش بزرگی از باران یکراست در زمین
    فرو می‌رود و خود نهر شائوری روزگاری در فروچاله‌ها ناپدید می‌شد. در دههٔ ۱۹۵۰ مهندسان این ضعف را به
    سرمایه بدل کردند. سدی به درازای ۱,۲۱۰ متر و بلندای ۱۱٫۵ متر آب شائوری را پشت خود نگه داشت، و یک کانال،
    یک تونل و یک لولهٔ تحت‌فشار فولادی آب را از دل رشته‌کوه گذراندند و حدود ۴۸۰ متر پایین‌تر به نیروگاهی
    نزدیک تکیبولی رساندند. نخستین واحد آن در ۱۹۵۵ به کار افتاد؛ هیچ نیروگاه برق‌آبی دیگری در گرجستان با
    اختلاف ارتفاع بیشتری کار نمی‌کند.


    حاصل کار بزرگ‌ترین پهنهٔ آبی راچاست: ۷٫۱ کیلومتر طول، تا ۲٫۷ کیلومتر پهنا و ژرفایی که از ۱۴٫۵ متر
    فراتر نمی‌رود. کرانه‌ها بیشتر پست و با شیبی ملایم‌اند و اینجا و آنجا صخره‌های کوتاهی دارند؛ کف حوضه
    را علف و بوته پوشانده و شیب‌های بالاتر را جنگل پهن‌برگ خزان‌کننده و سوزنی‌برگ تیره.


    بر کرانهٔ غربی خاریستوالا ایستاده است، که برای کارگران و زمین‌شناسان سد ساخته شد. در ۱۹۵۶ عنوان شهرک
    گرفت و در سال ۱۹۵۹ جمعیتش ۸۲۷ نفر بود؛ طرح‌های تفرجگاهی آمدند و رفتند، و تا سال ۲۰۰۲ دیگر هیچ‌کس آنجا
    زندگی نمی‌کرد. روی کاغذ هنوز شهرک است.


    زمستان‌ها سخت است — در این حوضه دمای ۴۰ درجه زیر صفر و برفی بیش از یک متر ثبت شده — و از همین رو یک
    غروب تابستانی بر کرانهٔ خلوت به زمانی قرضی می‌ماند.
  tip: >-
    کنار دریاچه هیچ چیز نیست: نه کافه، نه سرویس بهداشتی، نه مغازه. آب و خوراک همراه بیاورید و هر تکه زباله
    را با خود برگردانید. آسفالت در خاریستوالا به دریاچه می‌رسد؛ راه‌های کنارهٔ آب خاکی‌اند و پس از باران
    گل می‌شوند، پس وقتی زمین نرم است پیاده بروید، نه با خودرو. حتی در ژوئیه میانگین دمای حوضه زیر ۱۸ درجه
    است، پس برای شب یک لایه لباس گرم بردارید، و اگر چادر می‌زنید بیشتر. سوخت، پول نقد و غذا در آمبرولائوری
    است، حدود ۲۰ کیلومتر به سمت شمال؛ کلیسای جامع نیکورتسمیندا ۸ کیلومتر جلوتر در همین جاده است.
  route: >-
    جادهٔ نیکورتسمیندا را بگیرید: S1 (E60) را حدود ۱۹۳ کیلومتر به سوی غرب تا خروجی ترجولا بروید، Sh19
    را از ترجولا تا تکیبولی، و سپس Sh17 را با پیچ‌های تند از صخره‌های ناکرالا بالا تا گردنهٔ ناکرالا در
    ارتفاع ۱,۲۱۷ متری. پنج کیلومتر پس از گردنه، جاده در خاریستوالا به کرانهٔ غربی می‌رسد — حدود ۲۴۲ کیلومتر
    و چهار ساعت از تفلیس. دقت کنید که دریاچه پیش از نیکورتسمیندا سر راه است، نه پس از آن. جاده آسفالت
    است و خودروی اقتصادی کافی است؛ تنها برای راه‌های خاکی کنارهٔ آب خودرویی با فاصلهٔ بیشتر از زمین لازم
    است. در زمستان برف و یخ ممکن است بخش ناکرالا را ببندد، پس پیش از راه افتادن وضعیت را جویا شوید.
he:
  name: מאגר שאורי
  short: >-
    האגם הגדול ביותר ברצ'ה הוא מעשה ידי אדם: מאגר משנות ה-50 באגן קארסטי למרגלות מצוקי נקראלה, ולחופו
    המערבי עיירה סובייטית שהתרוקנה.
  body: >-
    **לפני הסכר שכנו באגן הזה שני אגמים קארסטיים קטנים, ואחד מהם נקרא חריסטוואלי — "עין השור". היום שניהם
    שוכבים מתחת לתשעה קילומטרים רבועים של מים.**


    אגן שאורי שוכן על המדרון הצפוני של רכס רצ'ה, קרקעיתו בגובה 1,000–1,200 מטר, ומדרום-מערב סוגרים עליו
    מצוקי הגיר של נקראלה. זה אזור קארסטי: חלק גדול ממי הגשמים מחלחל היישר לאדמה, ונחל שאורי עצמו נהג להיעלם
    בבולענים. בשנות ה-50 הפכו המהנדסים את החולשה הזאת ליתרון. סכר באורך 1,210 מטר ובגובה 11.5 מטר עצר
    את מי השאורי, ותעלה, מנהרה וצינור לחץ מפלדה הובילו את המים דרך הרכס והורידו אותם כ-480 מטר אל תחנת
    כוח ליד טקיבולי. היחידה הראשונה שלה החלה לפעול ב-1955; אין בגאורגיה תחנה הידרו-חשמלית שעובדת עם מפל
    גובה גדול יותר.


    התוצאה היא גוף המים הגדול ביותר ברצ'ה: אורכו 7.1 ק״מ, רוחבו עד 2.7 ק״מ ועומקו אינו עולה על 14.5 מטר.
    החופים ברובם נמוכים ומשתפלים בעדינות, ופה ושם מצוקים נמוכים; עשב ושיחים מכסים את קרקעית האגן, ויער
    נשיר ויער מחטני כהה את המדרונות הגבוהים יותר.


    על החוף המערבי עומדת חריסטוואלה, שנבנתה בשביל פועלי הסכר והגאולוגים. היא קיבלה מעמד של עיירה ב-1956,
    ובשנת 1959 חיו בה 827 תושבים; תוכניות לאתר נופש באו והלכו, ועד 2002 לא נותר בה אף תושב. על הנייר היא
    עדיין עיירה.


    החורפים קשים — באגן נמדדו 40 מעלות מתחת לאפס ושלג בעומק של יותר ממטר — ולכן ערב קיץ על החוף הריק מרגיש
    כמו זמן שאול.
  tip: >-
    על החוף אין כלום: לא בית קפה, לא שירותים ולא חנות. הביאו מים ואוכל, וקחו איתכם הביתה כל פיסת פסולת.
    האספלט מגיע לאגם בחריסטוואלה; הדרכים לאורך החוף הן דרכי עפר שהופכות לבוץ אחרי גשם, ולכן כשהקרקע רכה
    לכו ברגל ואל תיסעו. גם ביולי הטמפרטורה הממוצעת באגן נמוכה מ-18 מעלות, אז קחו שכבה חמה לערב, ועוד יותר
    מזה אם אתם לנים באוהל. דלק, מזומן וארוחות יש באמברולאורי, כ-20 ק״מ צפונה; קתדרלת ניקורצמינדה נמצאת
    8 ק״מ נוספים בהמשך הדרך.
  route: >-
    סעו בדרך לניקורצמינדה: מערבה בכביש S1 (E60) כ-193 ק״מ עד היציאה לטרג'ולה, בכביש Sh19 דרך טרג'ולה עד
    טקיבולי, ואז בכביש Sh17 בסרפנטינות במעלה מצוקי נקראלה עד מעבר נקראלה (1,217 מטר). חמישה קילומטרים
    אחרי המעבר מגיעה הדרך לחוף המערבי ליד חריסטוואלה — כ-242 ק״מ וארבע שעות מטביליסי. שימו לב: המאגר בא
    לפני ניקורצמינדה, לא אחריה. הכביש סלול ורכב מקטגוריית אקונומי מספיק; רק דרכי העפר שלאורך החוף דורשות
    מרווח גחון. בחורף שלג וקרח עלולים לחסום את קטע נקראלה, אז בדקו את המצב לפני שאתם יוצאים.
ar:
  name: خزان شاوري
  short: >-
    أكبر بحيرة في راتشا ليست من صنع الطبيعة: خزان من خمسينيات القرن العشرين في حوض كارستي تحت منحدرات
    ناكيرالا، وعلى شاطئه الغربي بلدة سوفييتية خلت من أهلها.
  body: >-
    **قبل السد كان في هذا الحوض بحيرتان كارستيتان صغيرتان، تُسمّى إحداهما خاريستفالي — «عين الثور». واليوم
    ترقد الاثنتان تحت تسعة كيلومترات مربعة من الماء.**


    يقع حوض شاوري على السفح الشمالي لسلسلة جبال راتشا، وقاعه على ارتفاع 1,000–1,200 متر، وتسدّه من الجنوب
    الغربي منحدرات ناكيرالا الكلسية. هذه أرض كارستية: يتسرّب معظم المطر مباشرة إلى باطن الأرض، وكان جدول
    شاوري نفسه يختفي في البالوعات الكارستية. وفي الخمسينيات حوّل المهندسون هذا الضعف إلى ميزة. فحبس سدٌّ
    طوله 1,210 أمتار وارتفاعه 11.5 متراً مياه شاوري، ونقلت قناةٌ ونفقٌ وأنبوب ضغط فولاذي الماء عبر السلسلة
    وأنزلته نحو 480 متراً إلى محطة كهرباء قرب تكيبولي. بدأت وحدتها الأولى العمل عام 1955، ولا تعمل في
    جورجيا محطة كهرومائية بفارق منسوب أعلى منها.


    والحصيلة أكبر مسطّح مائي في راتشا: طوله 7.1 كم، وعرضه حتى 2.7 كم، وعمقه لا يتجاوز 14.5 متراً. الشواطئ
    منخفضة في معظمها ولطيفة الانحدار، تتخللها هنا وهناك جروف قصيرة؛ ويكسو العشب والشجيرات قاع الحوض، والغابات
    النفضية والمخروطية الداكنة المنحدرات الأعلى.


    وعلى الشاطئ الغربي تقوم خاريستفالا، التي بُنيت لعمال السد والجيولوجيين. نالت صفة البلدة عام 1956،
    وكان يسكنها 827 نسمة في 1959؛ وجاءت خطط المنتجعات ومضت، وبحلول 2002 لم يعد فيها ساكن واحد. لكنها على
    الورق لا تزال بلدة.


    والشتاء قاسٍ — فقد سُجّلت في الحوض 40 درجة تحت الصفر وثلوج يزيد عمقها على متر — ولهذا تبدو أمسية صيفية
    على الشاطئ الخالي كأنها وقتٌ مستعار.
  tip: >-
    لا شيء على الشاطئ: لا مقهى ولا دورة مياه ولا متجر. أحضر الماء والطعام، وأعد معك كل قصاصة من نفاياتك.
    يبلغ الإسفلت البحيرة عند خاريستفالا؛ أما المسالك المحاذية للشاطئ فترابية وتتحول وحلاً بعد المطر، فامشِ
    ولا تقُد حين تكون الأرض لينة. وحتى في يوليو يقل متوسط الحرارة في الحوض عن 18 درجة، فخذ ملابس دافئة
    للمساء، وأكثر منها إن كنت ستخيّم. الوقود والنقد والوجبات في أمبرولاوري، على نحو 20 كم شمالاً؛ وكاتدرائية
    نيكورتسميندا على بعد 8 كم أخرى على الطريق نفسه.
  route: >-
    اسلك طريق نيكورتسميندا: الطريق S1 (E60) غرباً نحو 193 كم حتى مخرج تيرجولا، ثم Sh19 عبر تيرجولا إلى
    تكيبولي، ثم Sh17 صعوداً في منعطفات على منحدرات ناكيرالا حتى ممر ناكيرالا (1,217 م). وبعد الممر بخمسة
    كيلومترات يبلغ الطريق الشاطئ الغربي عند خاريستفالا — نحو 242 كم وأربع ساعات من تبليسي. لاحظ أن الخزان
    يأتي قبل نيكورتسميندا لا بعدها. الطريق معبّد وتكفي سيارة اقتصادية؛ ولا يحتاج إلى خلوص أرضي عالٍ إلا
    المسالك الترابية على الشاطئ. وفي الشتاء قد يغلق الثلج والجليد مقطع ناكيرالا، فتحقّق من الحالة قبل
    انطلاقك.
