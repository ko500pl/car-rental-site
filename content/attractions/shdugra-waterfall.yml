ka:
  name: შდუგრას (უშბის) ჩანჩქერი
  short: საქართველოს ყველაზე წყალუხვი ჩანჩქერი უშბის ძირში — მყინვარიდან ჩამომავალი კასკადების კომპლექსი
    ბეჩოს ხეობაში.
  body: >-
    **შდუგრა ის ჩანჩქერია, რომელსაც ბოლომდე ვერც კი მიუახლოვდები** — წყლის მასა ისეთ მუდმივ წვიმასა და
    ქარს აჩენს ირგვლივ, რომ ცისარტყელა თითქმის ყოველთვის ჰკიდია. ამიტომაც ითვლება საქართველოს ყველაზე
    წყალუხვ ჩანჩქერად: ეს ერთი ჭავლი კი არა, უშბის მყინვარიდან ჩამომავალი კასკადების მთელი კომპლექსია,
    ჯამში დაახლოებით 120-135 მეტრი სიმაღლის.


    ჩანჩქერი ბეჩოს ხეობის სიღრმეშია, სოფელ მაზერის (1660 მ) ზემოთ, იქ, სადაც შდუგრას ნაკადი დოლრას უერთდება.
    ბილიკი მაზერიდან ჯერ ტყეში მიდის, შემდეგ სასაზღვრო პოლიციის პოსტს ჩაუვლის და ლოდნარზე ადის — ჩანჩქერის
    ძირამდე ტრასის ბოლოდან დაახლოებით 3 კმ-ია, გრანდ ჰოტელ უშბიდან კი მთელი მარშრუტი 7 კმ-მდე იზრდება
    (3-4 საათი ერთი მიმართულებით ნელი ტემპით). ვისაც ძალა შესწევს, ზემო კასკადებამდეც ადის — იქიდან უკვე
    მყინვარი და მთელი ხეობა ჩანს.


    ფონად კი მუდმივად უშბის ორქიმიანი სილუეტი დგას. ივნისში, თოვლის დნობისას, ჩანჩქერი ყველაზე მძლავრია;
    ზამთარში ბილიკი თოვლში იკარგება და მარშრუტი პრაქტიკულად იკეტება.
  tip: >-
    პასპორტი აუცილებლად წამოიღე — ბილიკზე მესაზღვრეების პოსტია და საბუთს ხშირად ამოწმებენ. საწვიმარი ზაფხულშიც
    გამოგადგება: ძირთან წყლის მტვერი ყველაფერს ასველებს. წყალი მაზერიში ან პოსტთან შეავსე, გზაზე წყარო
    თითქმის არ არის. ზემო კასკადებისკენ ასვლისას მდინარის გადასვლაა — წვიმების შემდეგ ხიდის მდგომარეობა
    ადგილზე გადაამოწმე. ბოლო მონაკვეთამდე 4x4-ით მისვლა შეიძლება და ფეხით გზას აგიმოკლებს.
  route: >-
    თბილისიდან E60-ით სამტრედიამდე, შემდეგ ზუგდიდი–მესტიის გზით (S7) ხაიშისკენ; დობერას შემდეგ ბეჩოს ხეობაში
    ახვევ და მაზერამდე ადიხარ — ჯამში დაახლოებით 460 კმ და 8:30. ასფალტი მთავარ გზაზე კარგია, ბეჩოს შესახვევიდან
    მაზერამდე და ტრასის ბოლომდე გრუნტია — SUV ბევრად კომფორტულია, თუმცა მშრალ ამინდში ფრთხილი მძღოლი სედანითაც
    მაზერამდე ავა. საწვავი ზუგდიდში ან მესტიაში ჩაასხი.
en:
  name: Shdugra (Ushba) Waterfall
  short: >-
    Georgia's most powerful waterfall at the foot of Ushba — a glacier-fed cascade complex deep in the
    Becho valley.
  body: >-
    **Shdugra is the waterfall you cannot even approach all the way** — the sheer mass of water throws
    up such permanent rain and wind that a rainbow hangs over the base almost constantly. That is why
    it counts as Georgia's most voluminous waterfall: not a single jet but a whole complex of cascades
    pouring off the Ushba glacier, some 120–135 m tall in total.


    The falls hide deep in the Becho valley above the village of Mazeri (1,660 m), where the Shdugra stream
    meets the Dolra. The trail from Mazeri runs first through forest, passes a border police post, then
    climbs over boulder fields — about 3 km to the base from the end of the jeep track, or up to 7 km
    for the full route from Grand Hotel Ushba (3–4 hours one way at an easy pace). Those with legs left
    climb on to the upper cascades, where the glacier and the whole valley open up below.


    And behind it all, permanently, stands the twin-horned silhouette of Ushba. In June, at peak snowmelt,
    the waterfall is at its most violent; in winter the path vanishes under snow and the route effectively
    closes.
  tip: >-
    Bring your passport — there is a border guard post on the trail and documents are often checked. A
    rain shell earns its place even in summer: the spray at the base soaks everything. Fill water bottles
    in Mazeri or at the post; there is almost no spring water en route. The climb to the upper cascades
    involves a river crossing — check the state of the bridge locally after heavy rain. A 4x4 can drive
    the jeep-track section and shorten the walk considerably.
  route: >-
    From Tbilisi take the E60 to Samtredia, then the Zugdidi–Mestia road (S7) towards Khaishi; past Dobera
    turn into the Becho valley and climb to Mazeri — about 460 km and 8:30 in total. The main highway
    is good asphalt; from the Becho turnoff to Mazeri and the trailhead it is dirt, where an SUV is far
    more comfortable, though a careful driver reaches Mazeri in a sedan in dry weather. Refuel in Zugdidi
    or Mestia.
ru:
  name: Водопад Шдугра (Ушбинский)
  short: Самый мощный водопад Грузии у подножия Ушбы — питаемый ледником каскадный комплекс в глубине
    долины Бечо.
  body: >-
    **Шдугра — водопад, к которому невозможно подойти вплотную:** масса воды поднимает вокруг такой постоянный
    дождь и ветер, что радуга висит над основанием почти всегда. Потому он и считается самым полноводным
    водопадом Грузии: это не одна струя, а целый комплекс каскадов, срывающихся с Ушбинского ледника,
    общей высотой примерно 120–135 метров.


    Водопад прячется в глубине долины Бечо, выше села Мазери (1660 м), там, где поток Шдугра впадает в
    Долру. Тропа из Мазери идёт сначала лесом, минует пост пограничной полиции и поднимается по каменным
    россыпям — от конца джиповой колеи до основания около 3 км, а полный маршрут от Гранд-отеля «Ушба»
    вырастает до 7 км (3–4 часа в одну сторону спокойным темпом). У кого остались силы, поднимаются к
    верхним каскадам — оттуда открываются ледник и вся долина.


    А фоном надо всем этим неизменно стоит двурогий силуэт Ушбы. В июне, в пик таяния снегов, водопад
    особенно яростен; зимой тропа теряется под снегом, и маршрут фактически закрывается.
  tip: >-
    Обязательно возьмите паспорт — на тропе пост пограничников, документы проверяют часто. Дождевик пригодится
    даже летом: водяная пыль у основания промачивает всё. Воду наберите в Мазери или у поста — родников
    по пути почти нет. На подъёме к верхним каскадам есть переправа через реку — после сильных дождей
    уточняйте на месте состояние моста. На внедорожнике можно проехать джиповый участок и заметно сократить
    пешую часть.
  route: >-
    Из Тбилиси по E60 до Самтредиа, затем по дороге Зугдиди–Местиа (S7) в сторону Хаиши; за Доберой поворот
    в долину Бечо и подъём до Мазери — всего около 460 км и 8:30. Основная трасса — хороший асфальт; от
    поворота на Бечо до Мазери и начала тропы идёт грунтовка, где SUV заметно комфортнее, хотя в сухую
    погоду аккуратный водитель доедет до Мазери и на седане. Заправка — в Зугдиди или Местии.
fa:
  name: آبشار شدوگرا (اوشبا)
  short: پرآب‌ترین آبشار گرجستان در پای کوه اوشبا — مجموعه‌ای از آبشارهای یخچالی در ژرفای درهٔ بچو.
  body: >-
    **شدوگرا آبشاری است که حتی نمی‌توان تا انتها به آن نزدیک شد** — حجم آب چنان باران و باد دائمی به پا
    می‌کند که تقریباً همیشه رنگین‌کمانی بر پایهٔ آن آویخته است. برای همین پرآب‌ترین آبشار گرجستان شمرده
    می‌شود: نه یک ریزش تنها، بلکه مجموعه‌ای کامل از آبشارها که از یخچال اوشبا فرو می‌ریزند و روی‌هم حدود
    ۱۲۰ تا ۱۳۵ متر بلندی دارند.


    آبشار در ژرفای درهٔ بچو پنهان است، بالای روستای مازری (۱۶۶۰ متر)، جایی که رود شدوگرا به دولرا می‌پیوندد.
    کوره‌راه از مازری نخست در جنگل می‌رود، از پاسگاه پلیس مرزی می‌گذرد و سپس از میان سنگ‌ریزه‌ها بالا
    می‌رود — از پایان جیپ‌راه تا پایهٔ آبشار حدود ۳ کیلومتر است، و مسیر کامل از گراند هتل اوشبا تا ۷ کیلومتر
    می‌رسد (۳ تا ۴ ساعت یک‌طرفه با گام آرام). آنها که هنوز توان دارند تا آبشارهای بالایی هم می‌روند —
    از آنجا یخچال و تمام دره زیر پا گسترده است.


    و در پس‌زمینهٔ همه‌چیز، همیشه، سیلوئت دوشاخ اوشبا ایستاده است. در ژوئن، اوج ذوب برف، آبشار خروشان‌ترین
    حالت را دارد؛ در زمستان کوره‌راه زیر برف گم می‌شود و مسیر عملاً بسته است.
  tip: >-
    حتماً گذرنامه همراه داشته باشید — روی مسیر پاسگاه مرزبانی هست و مدارک را اغلب بازرسی می‌کنند. بادگیر
    ضدباران حتی در تابستان به کار می‌آید: غبار آب در پای آبشار همه‌چیز را خیس می‌کند. آب را در مازری یا
    کنار پاسگاه پر کنید؛ در راه تقریباً چشمه‌ای نیست. در صعود به آبشارهای بالایی گذر از رودخانه هست —
    پس از باران‌های شدید وضع پل را همان‌جا بپرسید. با شاسی‌بلند می‌توان بخش جیپ‌راه را راند و پیاده‌روی
    را بسیار کوتاه کرد.
  route: >-
    از تفلیس با E60 تا سامتردیا، سپس با جادهٔ زوگدیدی–مستیا (S7) به سوی خائیشی؛ پس از دوبرا به درهٔ بچو
    بپیچید و تا مازری بالا بروید — روی‌هم حدود ۴۶۰ کیلومتر و هشت ساعت و نیم. شاهراه اصلی آسفالت خوبی دارد؛
    از دوراهی بچو تا مازری و ابتدای مسیر خاکی است — شاسی‌بلند بسیار راحت‌تر است، هرچند در هوای خشک رانندهٔ
    محتاط با سدان هم به مازری می‌رسد. در زوگدیدی یا مستیا بنزین بزنید.
he:
  name: מפל שדוגרה (אושבה)
  short: המפל העוצמתי ביותר בגאורגיה למרגלות האושבה — מערך אשדים הניזון מקרחון, עמוק בעמק בצ'ו.
  body: >-
    **שדוגרה הוא מפל שאי אפשר אפילו להתקרב אליו עד הסוף** — מסת המים מעיפה סביבו גשם ורוח תמידיים, עד
    שקשת בענן תלויה מעל בסיסו כמעט תמיד. לכן הוא נחשב למפל שופע המים ביותר בגאורגיה: לא סילון יחיד אלא
    מערך שלם של אשדים הנשפכים מקרחון האושבה, בגובה כולל של כ-120–135 מטר.


    המפל מסתתר עמוק בעמק בצ'ו, מעל הכפר מאזרי (1,660 מ'), במקום שבו נחל השדוגרה נשפך אל הדולרה. השביל
    ממאזרי עובר תחילה ביער, חולף על פני עמדת משטרת הגבולות ומטפס על שדות בולדרים — כ-3 ק"מ עד הבסיס מסוף
    דרך הג'יפים, או עד 7 ק"מ למסלול המלא מגרנד הוטל אושבה (3–4 שעות לכיוון אחד בקצב נינוח). מי שנשאר לו
    כוח ממשיך אל האשדים העליונים — משם נגלים הקרחון והעמק כולו.


    וברקע, תמיד, ניצב הצללית הדו-קרנית של האושבה. ביוני, בשיא הפשרת השלגים, המפל בשיא עוצמתו; בחורף השביל
    נעלם תחת השלג והמסלול נסגר למעשה.
  tip: >-
    קחו דרכון — על השביל יש עמדת משמר גבול והמסמכים נבדקים לעיתים קרובות. מעיל גשם מצדיק את עצמו גם בקיץ:
    רסס המים בבסיס מרטיב הכול. מלאו מים במאזרי או ליד העמדה — כמעט אין מעיינות בדרך. בעלייה לאשדים העליונים
    יש חציית נהר — אחרי גשמים כבדים בדקו במקום את מצב הגשר. רכב 4x4 יכול לנסוע בקטע דרך הג'יפים ולקצר
    משמעותית את ההליכה.
  route: >-
    מטביליסי ב-E60 עד סמטרדיה, ואז בדרך זוגדידי–מסטיה (S7) לכיוון חאישי; אחרי דוברה פונים אל עמק בצ'ו
    ומטפסים למאזרי — בסך הכול כ-460 ק"מ ו-8:30 שעות. הכביש הראשי סלול והיטב; מהפנייה לבצ'ו עד מאזרי ותחילת
    השביל הדרך היא דרך עפר, שבה רכב שטח קל נוח בהרבה, אם כי במזג אוויר יבש נהג זהיר יגיע למאזרי גם בסדאן.
    תדלקו בזוגדידי או במסטיה.
ar:
  name: شلال شدوغرا (أوشبا)
  short: أقوى شلالات جورجيا عند سفح أوشبا — مجمع مساقط يتغذى من الجليدية في عمق وادي بيتشو.
  body: >-
    **شدوغرا شلال لا يمكنك حتى الاقتراب منه حتى النهاية** — فكتلة الماء تثير حوله مطراً وريحاً دائمين
    حتى إن قوس قزح معلق فوق قاعدته في كل حين تقريباً. ولهذا يُعد أغزر شلالات جورجيا: ليس نفثاً واحداً
    بل مجمعاً كاملاً من المساقط المنحدرة من جليدية أوشبا، يبلغ ارتفاعها الكلي نحو 120–135 متراً.


    يختبئ الشلال في عمق وادي بيتشو فوق قرية مازيري (1660 متراً)، حيث يلتقي جدول شدوغرا بنهر دولرا. الدرب
    من مازيري يمضي أولاً في الغابة، ويمر بمخفر شرطة الحدود، ثم يصعد فوق حقول الجلاميد — نحو 3 كم إلى القاعدة
    من نهاية مسار الجيب، أو حتى 7 كم للمسار الكامل من فندق غراند أوشبا (3–4 ساعات في الاتجاه الواحد بخطى
    هادئة). ومن بقيت لديه قوة يصعد إلى المساقط العليا — ومن هناك تنكشف الجليدية والوادي كله.


    وفي الخلفية، دائماً، يقف طيف أوشبا ذي القرنين. في يونيو، ذروة ذوبان الثلوج، يكون الشلال في أعنف حالاته؛
    وفي الشتاء يختفي الدرب تحت الثلج ويُغلق المسار عملياً.
  tip: >-
    خذ جواز سفرك حتماً — على الدرب مخفر لحرس الحدود وكثيراً ما تُفحص الوثائق. معطف المطر مفيد حتى في الصيف:
    فرذاذ الماء عند القاعدة يبلل كل شيء. املأ الماء في مازيري أو عند المخفر؛ فلا ينابيع تقريباً في الطريق.
    وفي الصعود إلى المساقط العليا عبور نهري — بعد الأمطار الغزيرة استفسر محلياً عن حال الجسر. ويمكن لسيارة
    الدفع الرباعي قطع مقطع مسار الجيب واختصار المشي كثيراً.
  route: >-
    من تبليسي عبر E60 حتى سامتريديا، ثم بطريق زوغديدي–مستيا (S7) نحو خاييشي؛ بعد دوبيرا انعطف إلى وادي
    بيتشو واصعد حتى مازيري — نحو 460 كم و8 ساعات ونصف إجمالاً. الطريق الرئيسي أسفلت جيد؛ ومن مفرق بيتشو
    حتى مازيري وبداية الدرب طريق ترابي تكون فيه سيارة الدفع الرباعي أريح بكثير، وإن كان سائق حذر يبلغ
    مازيري بسيارة عادية في الطقس الجاف. تزوّد بالوقود في زوغديدي أو مستيا.
