ka:
  name: შდუგრას (უშბის) ჩანჩქერი
  short: >-
    უშბის მყინვარით ნასაზრდოები ორმაგი ჩანჩქერი ბეჩოს ხეობაში: მაზერიდან ტყის ბილიკით მიდიხართ, ივნისში
    კი ყველაზე ხმაურიანია და საკუთარ ცივ ნისლშია გახვეული.
  body: >-
    **შდუგრა ჯერ თავს გაგრძნობინებთ და მერე გამოჩნდება: წიწვოვან ტყეში ჯერ ცივი სუნთქვა დაგხვდებათ, მერე
    კი ისეთი გუგუნი, რომ ერთმანეთის ხმა აღარ გესმით.**


    წყალი პირდაპირ უშბის მყინვარიდან მოდის. ტურიზმის ეროვნული ადმინისტრაცია ამ 120-მეტრიან ჩანჩქერს საქართველოში
    ყველაზე წყალუხვად მოიხსენიებს, და გვიან გაზაფხულზე თუ ადრე ზაფხულში, როცა მთის ფერდობებზე თოვლი დნება,
    ამაში დაეჭვება ძნელია. ძირთან წყლის მტვერი გვერდიდან გეცემათ და წამებში გასველებთ, მზიან დილას კი
    ლოდებს ზემოთ ცისარტყელა იშლება. გვერდით მეორე ჩანჩქერი ვარდება — უფრო მაღლიდან, მაგრამ წყალი იმდენად
    ცოტა აქვს, რომ მეზობელთან თეთრ ძაფს ჰგავს.


    გზა მაზერიდან იწყება, ბეჩოს ხეობის სვანური სოფლიდან, რომელიც ზღვის დონიდან 1660 მეტრზე, მესტიიდან
    25-იოდე კილომეტრზე მდებარეობს. სანამ ბილიკს დაადგებით, დადეშქელიანების კოშკი ნახეთ: სვანეთის მთავართა
    გვარის სახელს ატარებს და შეგახსენებთ, რომ ეს ხეობა ყოველთვის სასაზღვრო მხარე იყო — რუსეთის საზღვარი
    დღესაც ქედზე გადის. ბილიკი დოლრას მიჰყვება ხშირ წიწვოვან ტყეში, მდინარეს ბეტონის ხიდით გადადის, სასაზღვრო
    პოლიციის საგუშაგოს ჩაუვლის და ბალახმოდებულ ლოდნარზე ადის. იმის მიხედვით, სად დატოვებთ მანქანას, ძირამდე
    სამიდან ოთხ კილომეტრამდეა, დაახლოებით 400 მეტრის აღმართით; იქით-აქეთ სამიდან ოთხ საათამდე გაითვალისწინეთ.
    ვისაც ძალა დარჩება, ნაკადს გადალახავს და კიდევ დაახლოებით სამ კილომეტრს აივლის ჩანჩქერის თავამდე,
    სადაც მყინვარის ძირას უზარმაზარი ლოდებია დახვავებული.


    ყველაფერს ზემოდან, თუ ღრუბელი ნებას მისცემს, ორთავიანი უშბა დაჰყურებს.


    ივნისში ჩამოდით წყლის მძვინვარების სანახავად, სექტემბერში — ფერისა და გამჭვირვალე ჰაერისთვის. ზამთარში
    თოვლი ბილიკს კეტავს.
  tip: >-
    პასპორტი აუცილებლად თან იქონიეთ: ბილიკზე სასაზღვრო პოლიციის საგუშაგოა და საბუთებს ამოწმებენ. საწვიმარი
    აგვისტოშიც დაგჭირდებათ — ძირთან წყლის მტვერი წამებში გასველებთ. გზაზე წყარო არ არის, ამიტომ ბოთლები
    მაზერში ან საგუშაგოსთან შეავსეთ. ლოდნარზე კარგი ძირის მქონე ფეხსაცმელი გამოგადგებათ. ზედა კასკადისკენ
    მდინარე უნდა გადალახოთ: ძლიერი წვიმის შემდეგ მაზერში ჰკითხეთ, რა მდგომარეობაშია გადასასვლელი. ბილიკს
    დილით ადრე დაადექით და ხეობა თითქმის მთლიანად თქვენი იქნება. ზამთარში ბილიკი თოვლის ქვეშაა და მარშრუტი
    ფაქტობრივად დაკეტილია.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალით სამტრედიამდე იარეთ, იქიდან ისევ ს1-ით, სენაკის გავლით, ზუგდიდამდე,
    შემდეგ კი მესტიის გზით ენგურის ხეობას აუყევით, ჯვრისა და ხაიშის გავლით. მესტიამდე ცოტა ადრე ჩრდილოეთით,
    ბეჩოს ხეობაში გადაუხვიეთ და მაზერამდე ადით — სულ დაახლოებით 460 კილომეტრი; გზას რვა საათი და ოცდაათი
    წუთი დაუთმეთ. ასფალტი მაზერამდე მიდის, მაგრამ ხეობის გზა გრძელი და კლაკნილია, ძლიერი წვიმის შემდეგ
    კი ქვაცვენაც ხდება. მაზერის იქით ბილიკისკენ უხეში გრუნტის გზა გრძელდება, რომელზეც მხოლოდ 4x4 უნდა
    აუყვეს. ამიტომ ქირაობისას ჯიპი აირჩიეთ. საწვავი ზუგდიდში ან მესტიაში ჩაასხით.
en:
  name: Shdugra (Ushba) Waterfall
  short: >-
    A glacier-fed double waterfall below Ushba, reached by a forest trail from Mazeri: loudest in June
    and wrapped in its own cold spray.
  body: >-
    **Shdugra announces itself long before you see it: first a cold breath through the conifers, then
    a roar that drowns out conversation.**


    The water comes straight off the Ushba glacier. Georgia's national tourism administration calls this
    120-metre fall the most abundant in the country, and in late spring and early summer, when the snow
    on the mountain's flanks lets go, it is hard to argue. At the base the spray arrives sideways and
    soaks you in seconds; on a sunny morning it throws a rainbow across the boulders. Beside it a second
    fall drops from higher still, but carries so little water that it looks like a white thread next to
    its neighbour.


    The walk starts in Mazeri, a Svan village in the Becho valley at 1,660 metres, about 25 km from Mestia.
    Before setting off, look at the Dadeshkeliani tower, named after the Svan princely family: a reminder
    that this valley has always been frontier country, and the Russian border still runs along the ridge
    above. The trail follows the Dolra through dense conifer forest, crosses the river on a concrete bridge,
    passes a border police post and climbs over rough, overgrown scree. Depending on where you leave the
    car, the base is three to four kilometres away with some 400 metres of ascent; allow three to four
    hours there and back. Those with legs left can cross the stream and climb about three kilometres more
    to the top of the falls, where huge boulders lie piled at the foot of the glacier.


    Above it all, when the cloud allows, stands the double horn of Ushba.


    Come in June for the fury, in September for colour and clear air. In winter, snow shuts the path.
  tip: >-
    Carry your passport: the trail passes a border police post and documents are checked. Pack a rain
    shell even in August, because the spray at the base soaks you in seconds. There is no water on the
    way, so fill bottles in Mazeri or at the post. Boots with a good grip help on the scree. The climb
    to the upper falls involves a river crossing; after heavy rain, ask in Mazeri what state it is in.
    Start early and you will have the valley almost to yourself. In winter the path lies under snow and
    the route is effectively closed.
  route: >-
    From Tbilisi take the S1 (E60) west to Samtredia, continue on the S1 through Senaki to Zugdidi, then
    follow the mountain road up the Enguri gorge through Jvari and Khaishi towards Mestia. Shortly before
    Mestia turn north into the Becho valley and climb to Mazeri: about 460 km in all, so allow eight and
    a half hours. The asphalt runs to Mazeri, but the gorge road is long and winding, with rockfall after
    heavy rain. Beyond Mazeri a rough track continues towards the trail, and only a 4x4 should attempt
    it, which makes an SUV the sensible rental. Fill up in Zugdidi or Mestia.
ru:
  name: Водопад Шдугра (Ушбинский)
  short: >-
    Двойной водопад под Ушбой, питаемый ледником; к нему ведёт лесная тропа из Мазери. Громче всего он
    в июне и окутан собственной холодной водяной пылью.
  body: >-
    **Шдугра заявляет о себе задолго до того, как вы её увидите: сначала холодным дыханием сквозь хвойный
    лес, потом рёвом, который заглушает разговор.**


    Вода здесь приходит прямо с ледника Ушбы. Национальная администрация туризма Грузии называет этот
    120-метровый водопад самым полноводным в стране, и поздней весной и в начале лета, когда на склонах
    горы тает снег, спорить с этим трудно. У подножия водяная пыль летит сбоку и за считаные секунды промачивает
    насквозь; солнечным утром она перекидывает через валуны радугу. Рядом, с ещё большей высоты, падает
    второй водопад, но воды в нём так мало, что возле соседа он кажется белой нитью.


    Путь начинается в Мазери — сванском селе в долине Бечо на высоте 1660 метров, примерно в 25 км от
    Местиа. Перед выходом взгляните на башню Дадешкелиани, названную по сванскому княжескому роду: напоминание
    о том, что эта долина всегда была пограничьем, и по хребту над ней по-прежнему проходит граница с
    Россией. Тропа идёт вдоль Долры через густой хвойный лес, переходит реку по бетонному мосту, минует
    пост пограничной полиции и карабкается по неровной, заросшей осыпи. В зависимости от того, где вы
    оставили машину, до подножия три–четыре километра и около 400 метров набора высоты; туда и обратно
    закладывайте три–четыре часа. У кого остались силы, может перейти ручей и подняться ещё примерно на
    три километра, к верху водопада, где у края ледника громоздятся огромные валуны.


    Над всем этим, если позволяют облака, стоит двурогая Ушба.


    Приезжайте в июне — ради ярости воды, или в сентябре — ради красок и прозрачного воздуха. Зимой тропу
    закрывает снег.
  tip: >-
    Возьмите паспорт: тропа проходит мимо поста пограничной полиции, и документы там проверяют. Даже в
    августе положите в рюкзак непромокаемую куртку: у подножия водяная пыль промочит вас за секунды. Воды
    по пути нет, так что наполните бутылки в Мазери или на посту. На осыпи пригодятся ботинки с цепкой
    подошвой. Подъём к верхним водопадам требует переправы через реку; после сильных дождей спросите в
    Мазери, в каком она состоянии. Выйдите пораньше — и долина будет почти целиком вашей. Зимой тропа
    лежит под снегом, и маршрут фактически закрыт.
  route: >-
    Из Тбилиси поезжайте на запад по S1 (E60) до Самтредиа, дальше по S1 через Сенаки до Зугдиди, а оттуда
    горной дорогой вверх по ущелью Ингури через Джвари и Хаиши в сторону Местиа. Незадолго до Местиа сверните
    на север, в долину Бечо, и поднимитесь в Мазери: всего около 460 км, так что закладывайте восемь с
    половиной часов. Асфальт доходит до Мазери, но дорога по ущелью длинная и извилистая, а после сильных
    дождей на неё сходят камнепады. За Мазери к тропе ведёт разбитая грунтовка, и соваться на неё стоит
    только на полноприводной машине, поэтому разумный выбор — внедорожник. Заправьтесь в Зугдиди или Местиа.
fa:
  name: آبشار شدوگرا (اوشبا)
  short: >-
    آبشاری دوگانه و یخچال‌زاد در پای اوشبا که کوره‌راهی جنگلی از مازری به آن می‌رسد: در ژوئن از همیشه
    پرخروش‌تر است و در غبار سرد خودش پیچیده.
  body: >-
    **شدوگرا خیلی پیش از آنکه ببینیدش خود را خبر می‌کند: نخست با نفسی سرد از لابه‌لای سوزنی‌برگان، سپس
    با غرشی که هر گفت‌وگویی را در خود فرو می‌برد.**


    آب یکراست از یخچال اوشبا می‌آید. سازمان ملی گردشگری گرجستان این آبشار ۱۲۰ متری را پرآب‌ترین آبشار
    کشور می‌خواند، و در اواخر بهار و اوایل تابستان، وقتی برف دامنه‌های کوه آب می‌شود، سخت می‌توان با این
    حرف مخالفت کرد. در پای آبشار غبار آب از پهلو می‌رسد و در چند ثانیه خیس آبتان می‌کند؛ در صبحی آفتابی
    رنگین‌کمانی بر فراز تخته‌سنگ‌ها می‌گستراند. کنار آن آبشار دومی از ارتفاعی باز هم بلندتر فرو می‌ریزد،
    اما آبش چنان اندک است که کنار همسایه‌اش به رشته‌ای سپید می‌ماند.


    پیاده‌روی از مازری آغاز می‌شود، روستایی سوانی در درهٔ بچو در ارتفاع ۱٬۶۶۰ متری و حدود ۲۵ کیلومتری
    مستیا. پیش از راه افتادن نگاهی به برج دادشکلیانی بیندازید که نامش را از خاندان شاهزادگان سوان گرفته
    است: یادآور اینکه این دره همیشه سرزمینی مرزی بوده و مرز روسیه هنوز از ستیغ بالای آن می‌گذرد. کوره‌راه
    در امتداد رود دولرا از میان جنگل انبوه سوزنی‌برگ پیش می‌رود، از روی پلی بتنی از رود می‌گذرد، از کنار
    پاسگاه پلیس مرزی عبور می‌کند و از واریزه‌ای ناهموار و پوشیده از گیاه بالا می‌رود. بسته به اینکه خودرو
    را کجا بگذارید، تا پای آبشار سه تا چهار کیلومتر راه است با حدود ۴۰۰ متر صعود؛ برای رفت و برگشت سه
    تا چهار ساعت در نظر بگیرید. آنان که هنوز رمقی در پا دارند می‌توانند از نهر بگذرند و حدود سه کیلومتر
    دیگر تا بالای آبشارها صعود کنند، جایی که تخته‌سنگ‌های غول‌آسا پای یخچال روی هم انباشته شده‌اند.


    بر فراز همه، اگر ابرها رخصت دهند، شاخ دوگانهٔ اوشبا ایستاده است.


    در ژوئن بیایید تا خروش آب را ببینید، در سپتامبر برای رنگ‌ها و هوای شفاف. در زمستان برف راه را می‌بندد.
  tip: >-
    گذرنامه‌تان را همراه داشته باشید: مسیر از کنار پاسگاه پلیس مرزی می‌گذرد و مدارک را بررسی می‌کنند.
    حتی در اوت بارانی سبکی در کوله بگذارید، چون غبار آب در پای آبشار در چند ثانیه خیس آبتان می‌کند. در
    راه آبی نیست، پس بطری‌ها را در مازری یا کنار پاسگاه پر کنید. کفش کوه با کف پرچسب روی واریزه به کار
    می‌آید. رفتن به آبشارهای بالایی با گذر از رود همراه است؛ پس از باران‌های سنگین در مازری بپرسید وضع
    گذرگاه چگونه است. زود راه بیفتید تا دره تقریباً از آنِ شما باشد. در زمستان راه زیر برف می‌رود و مسیر
    عملاً بسته است.
  route: >-
    از تفلیس بزرگراه S1 (E60) را به سمت غرب تا سامتردیا بگیرید، روی S1 از سناکی تا زوگدیدی ادامه دهید
    و سپس جادهٔ کوهستانی تنگهٔ انگوری را از جواری و خایشی به سوی مستیا بالا بروید. کمی پیش از مستیا به
    سمت شمال، به درهٔ بچو، بپیچید و تا مازری بالا بروید: رویهم حدود ۴۶۰ کیلومتر، پس هشت ساعت و نیم در
    نظر بگیرید. آسفالت تا مازری می‌رسد، اما جادهٔ تنگه طولانی و پرپیچ‌وخم است و پس از باران‌های سنگین
    ریزش سنگ دارد. پس از مازری جاده‌ای خاکی و ناهموار تا ابتدای کوره‌راه ادامه می‌یابد که تنها خودروی
    چهارچرخ‌محرک باید واردش شود؛ از این رو اجارهٔ شاسی‌بلند انتخاب معقولی است. در زوگدیدی یا مستیا باک
    را پر کنید.
he:
  name: מפל שדוגרה (מפל אושבה)
  short: >-
    מפל כפול הניזון מקרחון למרגלות האושבה, ואליו מוביל שביל יער ממזרי: ביוני הוא רועם יותר מתמיד ועטוף
    בתרסיס הקר של עצמו.
  body: >-
    **שדוגרה מודיע על עצמו הרבה לפני שרואים אותו: תחילה בנשימה קרה בין עצי המחט, אחר כך בשאגה שמטביעה
    כל שיחה.**


    המים מגיעים היישר מקרחון האושבה. מינהל התיירות הלאומי של גאורגיה מכנה את המפל הזה, שגובהו 120 מטרים,
    העשיר במים ביותר בארץ, ובסוף האביב ובתחילת הקיץ, כשהשלג על מורדות ההר נמס, קשה להתווכח עם הקביעה.
    למרגלותיו התרסיס מגיע מן הצד ומרטיב אתכם לגמרי תוך שניות; בבוקר שמשי הוא פורש קשת בענן מעל הסלעים.
    לצדו נופל מפל שני מגובה רב עוד יותר, אך יש בו כל כך מעט מים שליד שכנו הוא נראה כמו חוט לבן.


    ההליכה מתחילה במזרי, כפר סווני בעמק בצ׳ו, בגובה 1,660 מטרים וכ-25 ק״מ ממסטיה. לפני היציאה הביטו במגדל
    דדשקליאני, הקרוי על שם משפחת הנסיכים הסוונית: תזכורת לכך שהעמק הזה היה תמיד ארץ ספר, וגבול רוסיה עובר
    עד היום לאורך הרכס שמעליו. השביל מלווה את נהר הדולרה דרך יער מחטניים סבוך, חוצה את הנהר בגשר בטון,
    עובר ליד עמדה של משטרת הגבולות ומטפס על מפולת אבנים משובשת ומגודלת. תלוי היכן השארתם את הרכב, עד למרגלות
    המפל שלושה עד ארבעה קילומטרים ועלייה של כ-400 מטרים; הקדישו שלוש עד ארבע שעות הלוך ושוב. מי שנותר
    לו כוח ברגליים יכול לחצות את הנחל ולטפס עוד כשלושה קילומטרים עד ראש המפלים, שם נערמים סלעי ענק למרגלות
    הקרחון.


    מעל הכול, כשהעננים מרשים, מזדקרות שתי הקרניים של האושבה.


    בואו ביוני כדי לראות את המים בשיא זעמם, או בספטמבר בשביל הצבעים והאוויר הצלול. בחורף השלג חוסם את
    השביל.
  tip: >-
    קחו דרכון: השביל עובר ליד עמדה של משטרת הגבולות, ושם בודקים מסמכים. ארזו מעיל גשם קל גם באוגוסט, כי
    התרסיס למרגלות המפל מרטיב לגמרי תוך שניות. אין מים בדרך, לכן מלאו בקבוקים במזרי או בעמדה. נעליים עם
    אחיזה טובה יעזרו על מפולת האבנים. העלייה אל המפלים העליונים כרוכה בחציית נהר; אחרי גשמים כבדים שאלו
    במזרי מה מצב המעבר. צאו מוקדם, והעמק יהיה כמעט כולו שלכם. בחורף השביל קבור תחת שלג והמסלול סגור למעשה.
  route: >-
    מטביליסי סעו מערבה בכביש S1 (E60) עד סמטרדיה, המשיכו ב-S1 דרך סנאקי עד זוגדידי, ומשם עלו בכביש ההררי
    של ערוץ האינגורי דרך ג׳ווארי וחאישי לכיוון מסטיה. מעט לפני מסטיה פנו צפונה אל עמק בצ׳ו וטפסו עד מזרי:
    בסך הכול כ-460 ק״מ, ולכן הקצו שמונה וחצי שעות. האספלט מגיע עד מזרי, אבל כביש הערוץ ארוך ומפותל, ואחרי
    גשמים כבדים נופלים עליו סלעים. אחרי מזרי ממשיכה דרך עפר משובשת לעבר השביל, ורק רכב 4x4 צריך לנסות
    אותה, ולכן רכב שטח הוא הבחירה הנבונה. תדלקו בזוגדידי או במסטיה.
ar:
  name: شلال شدوغرا (شلال أوشبا)
  short: >-
    شلال مزدوج تغذّيه الجليدية عند سفح أوشبا، يبلغه درب غابيّ من مازيري: أعلى ما يكون هديره في يونيو،
    ويلتفّ برذاذه البارد.
  body: >-
    **يعلن شدوغرا عن نفسه قبل أن تراه بوقت طويل: أولاً بنَفَس بارد يسري بين الصنوبريات، ثم بهدير يطغى
    على كل حديث.**


    يأتي الماء مباشرة من جليدية أوشبا. وتصف الإدارة الوطنية للسياحة في جورجيا هذا الشلال البالغ ارتفاعه
    120 متراً بأنه الأغزر ماءً في البلاد، وفي أواخر الربيع وأوائل الصيف، حين تذوب ثلوج سفوح الجبل، يصعب
    أن تجادل في ذلك. عند قاعدته يأتيك الرذاذ من الجانب فيبلّلك في ثوانٍ، وفي الصباح المشمس يمدّ قوس قزح
    فوق الصخور. وإلى جانبه يهوي شلال ثانٍ من علوّ أكبر، لكنه يحمل من الماء قليلاً إلى حدّ أنه يبدو بجوار
    جاره خيطاً أبيض.


    يبدأ المسير في مازيري، وهي قرية سفانية في وادي بيتشو على ارتفاع 1660 متراً، على بعد نحو 25 كم من ميستيا.
    وقبل الانطلاق ألقِ نظرة على برج داديشكلياني، المسمّى باسم الأسرة الأميرية السفانية: تذكير بأن هذا
    الوادي كان دوماً أرضاً حدودية، وما زالت الحدود الروسية تمتدّ على طول السلسلة الجبلية فوقه. يتبع الدرب
    نهر دولرا عبر غابة مخروطيات كثيفة، ويعبر النهر على جسر خرساني، ويمرّ بمركز لشرطة الحدود، ثم يصعد فوق
    ركام صخري وعر تكسوه الأعشاب. وبحسب المكان الذي تترك فيه السيارة، تبعد قاعدة الشلال ثلاثة إلى أربعة
    كيلومترات مع صعود نحو 400 متر؛ فخصّص ثلاث إلى أربع ساعات ذهاباً وإياباً. ومن بقيت في ساقيه قوة يمكنه
    أن يعبر الجدول ويصعد نحو ثلاثة كيلومترات أخرى إلى أعلى الشلالات، حيث تتكدّس صخور هائلة عند قدم الجليدية.


    وفوق ذلك كله، حين تسمح الغيوم، يرتفع قرنا أوشبا التوأمان.


    تعالَ في يونيو لترى الماء في ذروة هيجانه، أو في سبتمبر من أجل الألوان والهواء الصافي. في الشتاء يغلق
    الثلج الدرب.
  tip: >-
    احمل جواز سفرك: فالدرب يمرّ بمركز لشرطة الحدود حيث تُفحص الوثائق. خذ سترة واقية من المطر حتى في أغسطس،
    لأن الرذاذ عند القاعدة يبلّلك في ثوانٍ. لا ماء على الطريق، فاملأ قواريرك في مازيري أو عند المركز.
    يفيدك حذاء ذو نعل متماسك على الركام الصخري. يتطلّب الصعود إلى الشلالات العليا عبور النهر؛ وبعد الأمطار
    الغزيرة اسأل في مازيري عن حال المعبر. انطلق باكراً فيكاد الوادي يكون لك وحدك. في الشتاء يرقد الدرب
    تحت الثلج ويُعدّ المسار مغلقاً فعلياً.
  route: >-
    من تبليسي اسلك الطريق S1 (E60) غرباً حتى سامتريديا، وتابع على S1 عبر سيناكي إلى زوغديدي، ثم اصعد الطريق
    الجبلي في مضيق إنغوري مروراً بجفاري وخايشي باتجاه ميستيا. وقبيل ميستيا انعطف شمالاً إلى وادي بيتشو
    واصعد إلى مازيري: نحو 460 كم إجمالاً، فاحسب ثماني ساعات ونصفاً. يمتدّ الأسفلت حتى مازيري، لكن طريق
    المضيق طويل كثير المنعطفات، وتتساقط عليه الصخور بعد الأمطار الغزيرة. وبعد مازيري يستمرّ درب ترابي
    وعر نحو بداية المسار، ولا ينبغي أن تسلكه إلا سيارة دفع رباعي، ولذلك فإن استئجار سيارة رباعية الدفع
    هو الخيار المعقول. تزوّد بالوقود في زوغديدي أو ميستيا.
