ka:
  name: უძირო ტბა და ბუბის მყინვარი
  short: >-
    „უძირო“ ტბა 2800 მეტრზე, შოვისა და გლოლის თავზე, და მყინვარი, რომელსაც მეცნიერები 1965 წლიდან აკვირდებოდნენ
    — ორი დღე ფეხით, მოკლე გზის გარეშე.
  body: >-
    **ტბას „უძირო“ ჰქვია — დიდი სახელია პატარა ტბისთვის, რომელიც უქარო დილით მთელ კავკასიონს თავდაყირა
    ირეკლავს.** ის კატიწვერის დასავლეთ კალთაზე, ზღვის დონიდან დაახლოებით 2800 მეტრზე დევს, ზემო რაჭაში,
    ჭანჭახის ხეობის სოფლების — შოვისა და გლოლის — თავზე. მანქანით ახლოსაც ვერ მიხვალთ: ავტომობილი ხეობაში
    რჩება, დანარჩენი კი ფეხებზეა დამოკიდებული.


    კლასიკური მარშრუტი ორდღიანი წრეა, დაახლოებით 20 კილომეტრი. ბილიკი ტრადიციულად შოვიდან, გზისპირა მიმანიშნებლიდან
    იწყებოდა; 2023 წლის შემდეგ ადგილზე იკითხეთ, ღიაა თუ არა ეს მხარე, ან გლოლიდან ადით. შოვიდან ბილიკი
    ტყეში ციცაბოდ ადის და წყალი იქ თითქმის არ არის. ტყის ზოლს რომ გასცდებით, ბილიკი კატიწვერასა და დოლომისისწვერს
    შორის უღელტეხილისკენ მიემართება, იქიდან ტბამდე კი კიდევ ერთი საათი უხერხულ, ქვიან ფერდზე უნდა იაროთ:
    სულ 6–7 საათი, ხშირად — მეტიც. მოლაშქრეები ყვებიან კატიწვერის ქედზე მოკლე საცოცი მონაკვეთის შესახებ
    და იმაზეც, რომ ტყის პირას და ალპურ მდელოებზე, მდინარის გასწვრივ, მარკირება ადგილ-ადგილ იკარგება. გლოლისკენ
    დაშვება უფრო მშვიდია — დაახლოებით 9 კილომეტრი, 3–4 საათი, უკეთ გამოკვეთილი ბილიკით — ამიტომ ბევრი
    ტბისკენ სწორედ გლოლის მხრიდან ადის.


    ბუბის მყინვარი უფრო აღმოსავლეთით, შოვის ზემოთ, ბუბის ხეობის სათავეში, მწვერვალ ბუბის სამხრეთ კალთაზეა.
    სამი ყინულის ნაკადი ერთ განიერ ენად ერთდება — მყინვარის სიგრძე 2,7 კილომეტრია, ენა კი დაახლოებით 3000
    მეტრზე მთავრდება. 1965 წლიდან ვახუშტი ბაგრატიონის სახელობის გეოგრაფიის ინსტიტუტის მეცნიერები მას წლიდან
    წლამდე აკვირდებოდნენ — ეს ყოფილ საბჭოთა კავშირში მყინვარზე სტაციონარული დაკვირვების ყველაზე გრძელი
    რიგი იყო — სანამ კვლევა 1990-იან წლებში არ შეწყდა. მყინვარი ბუბისწყალს ასაზრდოებს — მდინარეს, რომლის
    კალაპოტითაც 2023 წლის 3 აგვისტოს ჩამოსულმა ღვარცოფმა შოვის დიდი ნაწილი გაანადგურა და ოცდაათზე მეტი
    ადამიანის სიცოცხლე შეიწირა.


    აქ არაფერი ჩანს მანქანის ფანჯრიდან — და სწორედ ამაშია მთელი აზრი.
  tip: >-
    ორი დღე დაგეგმეთ და არა ერთი. წაიღეთ კარგად მოჭიდებადი ძირის მქონე ფეხსაცმელი, წვიმის ქურთუკი, თბილი
    ფენა 2800 მეტრის ცივი ღამისთვის, კარავი, ქურა, საკვები და წყლის ფილტრი — ბოთლები კი ბილიკის დასაწყისშივე
    აავსეთ, რადგან ტყის მონაკვეთზე წყარო არ შეგხვდებათ. კარავი ტბის წინ, სწორ ადგილას დადგით, მაგრამ თუ
    წვიმა მოდის, უფრო მაღლა, ტბის ზედა მარცხენა მხარეს გადაინაცვლეთ, სადაც წყალი არ გროვდება. ბუბის მყინვარზე
    მხოლოდ ადგილობრივ მეგზურთან ერთად წადით და წინასწარ გაარკვიეთ, რა მდგომარეობაშია ხეობა 2023 წლის შემდეგ;
    უძიროზე პირველად ასვლისას მეგზური გონივრული არჩევანია. რეალური სეზონი ივლისიდან სექტემბრის შუა რიცხვებამდე
    გრძელდება.
  route: >-
    გზა იგივეა, რაც შოვისკენ: თბილისიდან ს1 (E60) მაგისტრალით ქუთაისამდე, შ17-ით ტყიბულისა და ნაქერალას
    უღელტეხილის გავლით ამბროლაურამდე, შემდეგ შ16-ით აღმოსავლეთით ონამდე და ჭანჭახის ხეობით გლოლამდე —
    დაახლოებით 320 კმ და თითქმის ექვსი საათი (5:45). 2023 წელს მძიმედ დაზიანებული შოვი იქიდან კიდევ 4
    კილომეტრშია. ონამდე ასფალტი კარგია, შემდეგ დაკერებული და ხრეშიანი მონაკვეთები იწყება. ჯიპი ან კროსოვერი
    სავსებით საკმარისია: მანქანით სავალი ნაწილი ოთხწამყვანიანის მარშრუტი არ არის, მაგრამ ონის ზემოთ კლირენსი
    გამოგადგება. საწვავი ონში ჩაასხით. ბაზად გლოლა აირჩიეთ: სასტუმროს წინასწარ შეუთანხმეთ, რომ ლაშქრობისას
    მანქანა მათ ეზოში დატოვოთ, და გასვლის წინა ღამე იქვე გაათიეთ.
en:
  name: Udziro Lake and Buba Glacier
  short: >-
    A lake called 'bottomless' at 2,800 metres above Shovi and Glola, and a glacier scientists watched
    from 1965 — two days on foot, no shortcuts.
  body: >-
    **In Georgian, Udziro means 'bottomless' — a large name for a small lake that, on a still morning,
    holds the whole Caucasus upside down.** It lies at about 2,800 metres on the western slope of Mount
    Katitsvera, high above the villages of Shovi and Glola in the Chanchakhi valley of upper Racha. No
    road comes near it; the rest is up to your legs.


    The classic outing is a two-day loop of roughly 20 km. The trail has traditionally started from a
    signpost by the road in Shovi; since 2023, ask locally whether that side is open, or climb from Glola.
    From Shovi the path climbs hard through trees where there is almost no water. Above the treeline it
    heads for a pass between Katitsvera and Dolomisistsveri, then needs another hour over awkward ground
    down to the shore: six to seven hours in all, and walkers often report more. They also mention a short
    scramble on the Katitsvera ridge and waymarks that fade at the forest edge and along the stream in
    the alpine meadows. The descent to Glola is kinder — about 9 km and three to four hours on a clearer
    path — which is why many people climb from the Glola side instead.


    The Buba glacier lies further east, at the head of the Buba valley above Shovi, on the southern flank
    of Buba peak. Three ice streams merge into a single broad tongue, some 2.7 km long, that ends at around
    3,000 metres. From 1965 geographers of the Vakhushti Bagrationi Institute studied it year after year
    — the longest such observation record in the former Soviet Union — until the work stopped in the 1990s.
    Its meltwater feeds the Bubistskali, down which the debris flow of 3 August 2023 swept into Shovi,
    destroying much of the resort and killing more than thirty people.


    Nothing here can be seen from a car window, and that is precisely the point.
  tip: >-
    Plan two days, not one. Bring grippy boots, a rain shell, a warm layer for a cold night at 2,800 metres,
    a tent, stove, food and a water filter — and fill your bottles at the trailhead, because the forest
    section is dry. Camp on the flat ground in front of the lake, but if rain threatens, pitch higher
    on its upper left side, where water does not collect. For the Buba glacier take a local guide without
    exception and ask first about the state of the valley since 2023; for Udziro a guide is wise on a
    first visit. The realistic season runs from July to mid-September.
  route: >-
    Drive as for Shovi: the S1 (E60) from Tbilisi to Kutaisi, the Sh17 through Tkibuli and over the Nakerala
    pass to Ambrolauri, then the Sh16 east to Oni and up the Chanchakhi valley to Glola — about 320 km
    and close to six hours (5:45). Shovi, badly damaged in 2023, lies some 4 km further on. The asphalt
    is decent to Oni; beyond it expect patched and gravel sections. An SUV is the right class: the drive
    itself is not a 4x4 route, but clearance helps above Oni. Refuel in Oni. Base yourself in Glola: ask
    your guesthouse to keep the car in its yard while you walk, and sleep there the night before you set
    off.
ru:
  name: Озеро Удзиро и ледник Буба
  short: >-
    Озеро с именем «бездонное» на высоте 2800 метров над Шови и Глолой и ледник, за которым учёные следили
    с 1965 года, — два дня пешком, без коротких путей.
  body: >-
    **По-грузински «удзиро» значит «бездонное» — громкое имя для маленького озера, которое тихим утром
    держит в себе весь Кавказ вверх ногами.** Оно лежит на высоте около 2800 метров на западном склоне
    горы Катицвера, высоко над сёлами Шови и Глола в долине Чанчахи, в Верхней Раче. Дороги к нему нет
    — дальше всё решают ваши ноги.


    Классический поход — двухдневная петля длиной около 20 км. Традиционно тропа начиналась у придорожного
    указателя в Шови; после 2023 года узнайте на месте, открыта ли эта сторона, или поднимайтесь от Глолы.
    От Шови тропа круто лезет вверх среди деревьев, где воды почти нет. Выше границы леса она берёт курс
    на перевал между Катицверой и Доломисисцвери, а оттуда ещё около часа по неудобному склону спускается
    к берегу: всего шесть-семь часов, а по рассказам туристов — нередко и больше. Они же упоминают короткий
    скальный участок на гребне Катицверы и маркировку, которая теряется на опушке и вдоль ручья на альпийских
    лугах. Спуск к Глоле легче — около 9 км и три-четыре часа по более заметной тропе, поэтому многие
    поднимаются как раз со стороны Глолы.


    Ледник Буба лежит восточнее, в верховьях долины Бубы над Шови, на южном склоне пика Буба. Три ледяных
    потока сливаются в один широкий язык длиной около 2,7 км, который заканчивается на высоте примерно
    3000 метров. С 1965 года географы Института имени Вахушти Багратиони изучали его год за годом — это
    самый длинный ряд подобных наблюдений на территории бывшего СССР, — пока в 1990-х работы не прекратились.
    Его талые воды питают Бубисцкали — по её руслу 3 августа 2023 года сошёл сель, который разрушил бо́льшую
    часть курорта Шови и унёс жизни более тридцати человек.


    Из окна машины здесь не увидеть ничего — и в этом весь смысл.
  tip: >-
    Закладывайте два дня, а не один. Возьмите ботинки с цепкой подошвой, дождевик, тёплый слой для холодной
    ночи на 2800 метрах, палатку, горелку, еду и фильтр для воды — и наполните бутылки у начала тропы,
    потому что в лесу воды нет. Лагерь ставьте на ровной площадке перед озером, но если грозит дождь,
    поднимитесь выше, на его верхний левый край, где вода не скапливается. На ледник Буба идите только
    с местным проводником, без исключений, и заранее узнайте, в каком состоянии долина после 2023 года;
    к Удзиро в первый раз тоже разумно идти с проводником. Реальный сезон — с июля до середины сентября.
  route: >-
    Дорога — как до Шови: по S1 (E60) из Тбилиси до Кутаиси, по Sh17 через Ткибули и перевал Накерала
    до Амбролаури, затем по Sh16 на восток до Они и вверх по долине Чанчахи до Глолы — около 320 км и
    почти шесть часов (5:45). Шови, сильно пострадавшее в 2023 году, — ещё примерно в 4 км дальше. До
    Они асфальт приличный, дальше ждите латаных и гравийных участков. Правильный класс — кроссовер или
    внедорожник: сама дорога не требует полного привода, но выше Они клиренс выручает. Заправьтесь в Они.
    Базой выбирайте Глолу: попросите хозяев гостевого дома оставить машину у них во дворе, пока вы в походе,
    и переночуйте там накануне выхода.
fa:
  name: دریاچهٔ اودزیرو و یخچال طبیعی بوبا
  short: >-
    دریاچه‌ای که نامش «بی‌ته» است، در ارتفاع ۲,۸۰۰ متری بالای شووی و گلولا، و یخچالی طبیعی که دانشمندان
    از ۱۹۶۵ زیر نظرش داشتند — دو روز پیاده‌روی، بی‌میان‌بر.
  body: >-
    **«اودزیرو» در زبان گرجی یعنی «بی‌ته» — نامی بزرگ برای دریاچه‌ای کوچک که در صبحی بی‌باد تمام قفقاز
    را وارونه در خود نگه می‌دارد.** در ارتفاع حدود ۲,۸۰۰ متری، بر دامنهٔ غربی کوه کاتیتسورا، بسیار بالاتر
    از روستاهای شووی و گلولا در درهٔ چانچاخیِ راچای علیا آرمیده است. هیچ جاده‌ای به آن نزدیک نمی‌شود؛
    باقی راه با پاهای شماست.


    مسیر کلاسیک یک حلقهٔ دوروزه به طول تقریبی ۲۰ کیلومتر است. مسیر به‌طور سنتی از تابلویی کنار جاده در
    شووی آغاز می‌شد؛ از ۲۰۲۳ به بعد، در محل بپرسید که این سو باز است یا نه، یا از گلولا بالا بروید. از
    شووی راه با شیبی سخت از میان درختان بالا می‌رود، جایی که تقریباً آبی نیست. بالای مرز جنگل، مسیر رو
    به گردنه‌ای میان کاتیتسورا و دولومیسیستسوری می‌رود و سپس یک ساعت دیگر روی زمینی ناهموار تا کرانه پایین
    می‌آید: روی‌هم شش تا هفت ساعت، و کوه‌پیمایان اغلب از زمانی بیشتر می‌گویند. آنها از یک بخش کوتاه سنگ‌نوردی
    روی یال کاتیتسورا هم یاد می‌کنند و از نشانه‌هایی که در لبهٔ جنگل و در امتداد نهر در چمنزارهای آلپی
    کم‌رنگ می‌شوند. فرود به گلولا مهربان‌تر است — حدود ۹ کیلومتر و سه تا چهار ساعت روی راهی روشن‌تر —
    و از همین رو بسیاری ترجیح می‌دهند از سمت گلولا بالا بروند.


    یخچال طبیعی بوبا دورتر به سمت شرق است، در سرچشمهٔ درهٔ بوبا بالای شووی، بر دامنهٔ جنوبی قلهٔ بوبا.
    سه جریان یخ به هم می‌پیوندند و زبانه‌ای پهن و یکپارچه به طول حدود ۲٫۷ کیلومتر می‌سازند که در ارتفاع
    حدود ۳,۰۰۰ متری پایان می‌یابد. از ۱۹۶۵ جغرافی‌دانان مؤسسهٔ واخوشتی باگراتیونی سال به سال آن را مطالعه
    کردند — طولانی‌ترین رشتهٔ چنین مشاهده‌ای در اتحاد شوروی سابق — تا آنکه کار در دههٔ ۱۹۹۰ متوقف شد.
    آب ذوب آن نهر بوبیستسکالی را تغذیه می‌کند؛ در ۳ اوت ۲۰۲۳ سیلاب گل و سنگ از بستر همین نهر به شووی سرازیر
    شد، بخش بزرگی از این استراحتگاه را ویران کرد و جان بیش از سی نفر را گرفت.


    هیچ‌چیز اینجا از پنجرهٔ خودرو دیده نمی‌شود، و نکته دقیقاً همین است.
  tip: >-
    دو روز برنامه بریزید، نه یک روز. کفش کوه با کف چسبنده، بادگیر ضدباران، یک لایه لباس گرم برای شب سرد
    در ارتفاع ۲,۸۰۰ متری، چادر، اجاق، غذا و فیلتر آب بردارید — و بطری‌ها را در آغاز مسیر پر کنید، چون
    بخش جنگلی بی‌آب است. روی زمین هموار جلوی دریاچه چادر بزنید، اما اگر بیم باران هست، بالاتر، در سمت
    چپ بالایی دریاچه که آب در آن جمع نمی‌شود، برپایش کنید. برای یخچال طبیعی بوبا بی‌هیچ استثنا راهنمای
    محلی بگیرید و پیش از هر چیز دربارهٔ وضع دره پس از ۲۰۲۳ بپرسید؛ برای اودزیرو هم در نخستین بار داشتن
    راهنما عاقلانه است. فصل واقع‌بینانه از ژوئیه تا میانهٔ سپتامبر است.
  route: >-
    مثل مسیر شووی بروید: S1 (E60) از تفلیس تا کوتائیسی، Sh17 از تکیبولی و گردنهٔ ناکرالا تا آمبرولائوری،
    سپس Sh16 به سوی شرق تا اونی و بالا در درهٔ چانچاخی تا گلولا — حدود ۳۲۰ کیلومتر و نزدیک به شش ساعت
    (۵:۴۵). شووی، که در ۲۰۲۳ آسیب سختی دید، حدود ۴ کیلومتر جلوتر است. آسفالت تا اونی خوب است؛ پس از آن
    منتظر تکه‌های وصله‌شده و شنی باشید. خودروی شاسی‌بلند گزینهٔ درست است: خود جاده مسیری برای چهارچرخ‌محرک
    نیست، اما بالای اونی فاصلهٔ زیاد از زمین به کار می‌آید. در اونی سوخت‌گیری کنید. گلولا را پایگاه خود
    کنید: از مهمانسرایتان بخواهید تا وقتی پیاده‌روی می‌کنید خودرو را در حیاطشان نگه دارند، و شب پیش از
    حرکت همان‌جا بخوابید.
he:
  name: אגם אודזירו וקרחון בובה
  short: >-
    אגם ששמו "חסר תחתית" בגובה 2,800 מטר מעל שובי וגלולה, וקרחון שמדענים עקבו אחריו מאז 1965 — יומיים
    ברגל, בלי קיצורי דרך.
  body: >-
    **בגאורגית "אודזירו" פירושו "חסר תחתית" — שם גדול לאגם קטן, שבבוקר ללא רוח מחזיק בתוכו את הקווקז כולו,
    הפוך.** הוא שוכן בגובה של כ-2,800 מטר על המדרון המערבי של הר קטיצוורה, הרחק מעל הכפרים שובי וגלולה
    שבעמק הצ'אנצ'אחי, ברצ'ה העילית. שום כביש לא מתקרב אליו; מכאן והלאה הכול תלוי ברגליים שלכם.


    המסלול הקלאסי הוא לולאה של יומיים באורך של כ-20 ק״מ. באופן מסורתי השביל התחיל בשלט שבצד הדרך בשובי;
    מאז 2023 בררו במקום אם הצד הזה פתוח, או עלו מגלולה. משובי השביל מטפס בתלילות בין העצים, במקום שאין
    בו כמעט מים. מעל קו העצים הוא פונה אל מעבר בין קטיצוורה לדולומיסיסצוורי, ומשם נדרשת עוד שעה של ירידה
    על קרקע לא נוחה עד לחוף: שש עד שבע שעות בסך הכול, ומטיילים מדווחים לא פעם על יותר. הם מזכירים גם קטע
    קצר של טיפוס על סלעים ברכס קטיצוורה, וסימון שביל שנעלם בשולי היער ולאורך הנחל שבכרי הדשא האלפיניים.
    הירידה לגלולה נוחה יותר — כ-9 ק״מ ושלוש עד ארבע שעות בשביל ברור יותר — ולכן רבים מעדיפים לעלות דווקא
    מצד גלולה.


    קרחון בובה נמצא מזרחה יותר, בראש עמק הבובה שמעל שובי, על המדרון הדרומי של פסגת בובה. שלושה זרמי קרח
    מתאחדים ללשון רחבה אחת, באורך של כ-2.7 ק״מ, המסתיימת בגובה של כ-3,000 מטר. משנת 1965 חקרו אותו גאוגרפים
    של מכון ואחושטי בגרטיוני שנה אחר שנה — רצף התצפיות הארוך ביותר מסוגו בברית המועצות לשעבר — עד שהעבודה
    נפסקה בשנות ה-90. מי ההפשרה שלו מזינים את הבוביסצקאלי, שבאפיקו סחפה ב-3 באוגוסט 2023 זרימת בוץ וסלעים
    אל שובי, החריבה את רוב אתר הנופש וגבתה את חייהם של יותר משלושים בני אדם.


    שום דבר כאן לא נראה מחלון המכונית, ובדיוק בזה העניין.
  tip: >-
    תכננו יומיים, לא יום. הביאו נעליים עם אחיזה טובה, מעיל גשם, שכבה חמה ללילה קר בגובה 2,800 מטר, אוהל,
    גזייה, אוכל ומסנן מים — ומלאו את הבקבוקים בתחילת השביל, כי קטע היער יבש. הקימו מחנה על השטח המישורי
    שלפני האגם, אבל אם מאיים גשם, הקימו את האוהל גבוה יותר, בצדו השמאלי העליון של האגם, שם המים לא מצטברים.
    לקרחון בובה צאו רק עם מדריך מקומי, בלי יוצא מן הכלל, ושאלו קודם על מצב העמק מאז 2023; גם לאודזירו
    כדאי לקחת מדריך בביקור הראשון. העונה המציאותית היא מיולי עד אמצע ספטמבר.
  route: >-
    סעו כמו לשובי: כביש S1 (E60) מטביליסי עד קוטאיסי, כביש Sh17 דרך טקיבולי ומעבר נקרלה עד אמברולאורי,
    ואז כביש Sh16 מזרחה עד אוני ובמעלה עמק הצ'אנצ'אחי עד גלולה — כ-320 ק״מ וקרוב לשש שעות (5:45). שובי,
    שנפגעה קשות ב-2023, נמצאת כ-4 ק״מ הלאה. האספלט סביר עד אוני; מעבר לה צפו לקטעים מטולאים ולקטעי חצץ.
    רכב פנאי-שטח הוא הקטגוריה הנכונה: הנסיעה עצמה אינה מסלול להנעה כפולה, אבל מעל אוני מרווח גחון עוזר.
    תדלקו באוני. הפכו את גלולה לבסיס שלכם: בקשו מבית ההארחה להשאיר את הרכב בחצר בזמן שאתם בשביל, ולינו
    שם בלילה שלפני היציאה.
ar:
  name: بحيرة أودزيرو ونهر بوبا الجليدي
  short: >-
    بحيرة اسمها «بلا قاع» على ارتفاع 2,800 متر فوق شوفي وغلولا، ونهر جليدي رصده العلماء منذ 1965 — يومان
    سيراً على الأقدام، بلا طرق مختصرة.
  body: >-
    **«أودزيرو» بالجورجية تعني «بلا قاع» — اسم كبير لبحيرة صغيرة تحمل في صباح ساكن القوقاز كله مقلوباً
    على صفحتها.** تقع على ارتفاع نحو 2,800 متر على السفح الغربي لجبل كاتيتسفيرا، عالياً فوق قريتي شوفي
    وغلولا في وادي تشانتشاخي بأعالي راتشا. لا طريق يقترب منها؛ وما بقي فعلى ساقيك.


    النزهة الكلاسيكية حلقة من يومين طولها نحو 20 كم. كان الدرب يبدأ تقليدياً عند لافتة على جانب الطريق
    في شوفي؛ ومنذ 2023 اسأل في المكان هل هذا الجانب مفتوح، أو اصعد من غلولا. ومن شوفي يصعد الدرب بانحدار
    قاسٍ بين أشجار لا ماء بينها تقريباً. وفوق خط الأشجار يتجه إلى ممر بين كاتيتسفيرا ودولوميسيستسفيري،
    ثم يحتاج إلى ساعة أخرى فوق أرض وعرة نزولاً إلى الشاطئ: ست إلى سبع ساعات إجمالاً، وكثيراً ما يذكر المتنزهون
    أكثر من ذلك. ويذكرون أيضاً مقطع تسلّق صخري قصيراً على حافة كاتيتسفيرا، وعلامات تتلاشى عند طرف الغابة
    وعلى امتداد الجدول في المروج الألبية. أما النزول إلى غلولا فألطف — نحو 9 كم وثلاث إلى أربع ساعات على
    درب أوضح — ولهذا يفضّل كثيرون الصعود من جهة غلولا.


    ويقع نهر بوبا الجليدي أبعد شرقاً، عند رأس وادي بوبا فوق شوفي، على السفح الجنوبي لقمة بوبا. تندمج ثلاثة
    تيارات جليدية في لسان عريض واحد يمتد نحو 2.7 كم وينتهي على ارتفاع قرابة 3,000 متر. ومنذ 1965 درسه
    جغرافيو معهد فاخوشتي باغراتيوني عاماً بعد عام — في أطول سجل رصد من نوعه في الاتحاد السوفييتي السابق
    — حتى توقف العمل في التسعينيات. ومياه ذوبانه تغذي بوبيستسكالي، الجدول الذي اندفع عبر مجراه في 3 أغسطس
    2023 سيل طيني صخري إلى شوفي، فدمّر معظم المنتجع وأودى بحياة أكثر من ثلاثين شخصاً.


    لا شيء هنا يُرى من نافذة السيارة، وهذا بالضبط هو المقصود.
  tip: >-
    خطّط ليومين لا ليوم واحد. أحضر حذاءً متين القبضة، وسترة واقية من المطر، وطبقة دافئة لليلة باردة على
    ارتفاع 2,800 متر، وخيمة وموقداً وطعاماً ومرشّحاً للماء — واملأ قواريرك عند بداية الدرب، لأن مقطع الغابة
    جاف. خيّم على الأرض المستوية أمام البحيرة، لكن إن لاح المطر فانصب خيمتك أعلى، عند جانبها العلوي الأيسر،
    حيث لا يتجمع الماء. وإلى نهر بوبا الجليدي لا تذهب إلا مع دليل محلي، دون استثناء، واسأل أولاً عن حال
    الوادي منذ 2023؛ أما إلى أودزيرو فالدليل خيار حكيم في الزيارة الأولى. الموسم الواقعي من يوليو حتى
    منتصف سبتمبر.
  route: >-
    اسلك طريق شوفي: الطريق S1 (E60) من تبليسي إلى كوتايسي، ثم Sh17 عبر تكيبولي وممر ناكيرالا إلى أمبرولاوري،
    ثم Sh16 شرقاً إلى أوني وصعوداً في وادي تشانتشاخي حتى غلولا — نحو 320 كم وقرابة ست ساعات (5:45). وتقع
    شوفي، التي تضررت بشدة عام 2023، على بعد نحو 4 كم أبعد. الإسفلت جيد حتى أوني؛ وبعدها توقّع مقاطع مرقّعة
    وأخرى من الحصى. فئة السيارات الرياضية متعددة الاستخدامات هي الخيار الصائب: فالطريق نفسه ليس مسار دفع
    رباعي، لكن الخلوص الأرضي يفيد فوق أوني. تزوّد بالوقود في أوني. اتخذ غلولا قاعدةً لك: اطلب من بيت الضيافة
    إبقاء السيارة في فنائه أثناء المشي، ونَم هناك في الليلة السابقة للانطلاق.
