ka:
  name: უძირო ტბა და ბუბის მყინვარი (ღები)
  short: რაჭის უკიდურესი სოფელი და მაღალმთიანი მარშრუტების საწყისი წერტილი — მხოლოდ 4x4-ით და მხოლოდ ზაფხულში.
  body: >
    ღები რაჭის ბოლო სოფელია: აქ გზა მთავრდება და შემდეგ მხოლოდ ბილიკებია, რომლებიც კავკასიონის მთავარ
    ქედამდე ადის. სოფლიდან ორი მთავარი მიმართულებაა — **უძირო ტბა**, მაღალმთიანი ტბა, რომელიც ორ ათას
    ხუთასი მეტრის ზემოთ დევს, და **ბუბის მყინვარის ხეობა**, საიდანაც ბუბისა და ჩიუხის მწვერვალები ჩანს.


    მნიშვნელოვანია სწორად გაიგო, რას ნიშნავს აქ „მისვლა“: **მანქანა მხოლოდ ღებამდე მიდის.** უძირო ტბამდე
    ან მყინვარამდე იქიდან ფეხითაა ასასვლელი — მთელი დღე, ერთი მიმართულებით რამდენიმე საათი, კარგი ფიზიკური
    მომზადებით და ზოგ მონაკვეთზე მდინარის ფონით გადალახვით. ბევრი ჯგუფი ღამეს კარვით ათევს.


    რის გათვალისწინება მართებს:


    - სეზონი ძალიან მოკლეა — რეალურად ივლისიდან სექტემბრის შუა რიცხვებამდე

    - მაღლა ივნისშიც თოვლის ველებია და ბილიკი ყოველთვის აშკარა არაა

    - ამინდი დღეში რამდენჯერმე იცვლება, ნისლი სწრაფად ჩამოდის

    - მობილური კავშირი სოფლის ზემოთ თითქმის აღარაა

    - ადგილობრივი მეგზური აქ არა ფუფუნება, არამედ გონივრული გადაწყვეტილებაა


    ეს მარშრუტი გამოცდილი მოგზაურებისთვისაა. თუ პირველად ხარ საქართველოს მთებში, ღებამდე მისვლა და ხეობის
    ნახვა თავისთავად ღირს, ტბამდე ასვლის გარეშეც.


    ღები ისტორიულად ტყავისა და მატყლის დამუშავებით იყო ცნობილი და დღემდე ინარჩუნებს ძველი რაჭული სოფლის
    იერს: ქვის სახლები, ხის აივნები და პატარა ეკლესიები. სტუმრებს ოჯახური სასტუმროები იღებენ, თუმცა ადგილების
    რაოდენობა მცირეა და ჯავშანი აუცილებელია.
  tip: >-
    ეს ერთდღიანი გასეირნება არ არის: ტბამდე ან მყინვარამდე ასვლა სრულ დღეს ითხოვს და ხშირად ღამის გათევასაც.
    აიღე სალაშქრო ფეხსაცმელი, წვიმის ქურთუკი, თბილი ფენა, საკვები და წყლის ფილტრი ან მარაგი. ღებში ფეხით
    ასვლამდე მეგზური იშოვე — ბილიკი ყველგან მარკირებული არაა. მაღაზია და საწვავი ონშია, ზემოთ არაფერი.
    ამინდის პროგნოზი გამგზავრებამდე აუცილებლად შეამოწმე.
  route: >-
    თბილისიდან ქუთაისის მიმართულებით, შემდეგ ტყიბულზე ამბროლაურამდე, იქიდან ონზე და შემდეგ გლოლის გავლით
    ღებამდე — სულ დაახლოებით ოთხასათი კილომეტრი და შვიდ საათზე მეტი. ონის შემდეგ ასფალტი მთავრდება და
    გზა ხრეშოვანი, ქვიანი და ადგილ-ადგილ ჩარეცხილი ხდება, მდინარის რამდენიმე გადასასვლელით. **ეს მონაკვეთი
    მაღალი გამავლობის 4x4-ს ითხოვს**; სედანით ან ჩვეულებრივი კროსოვერით აქ ასვლა არ ღირს. ღამის გათევა
    ონში ან ღებში დაგეგმე. კატეგორიები იხილე გვერდზე /fleet/.
en:
  name: Udziro Lake and Buba Glacier (Ghebi)
  short: The last village in Racha and the trailhead for high mountain routes — 4x4 only, and summer only.
  body: >-
    Ghebi is the final village in Racha: the road ends here and beyond it there are only trails climbing
    towards the main Caucasus ridge. Two routes matter from the village — **Udziro Lake**, a high mountain
    lake lying above 2,500 metres, and **the Buba glacier valley**, from which the Buba and Chiukhi peaks
    come into view.


    It is important to understand what reaching them involves: **the car only gets you as far as Ghebi.**
    From there both the lake and the glacier are reached on foot — a full day, several hours in each direction,
    requiring decent fitness and, on some sections, fording a river. Many groups camp overnight rather
    than attempt a return in one push.


    What to weigh up:


    - the season is very short, realistically July to mid-September

    - snowfields remain high up even in June, and the path is not always obvious

    - weather changes several times a day and cloud drops fast

    - mobile coverage effectively ends above the village

    - a local guide here is a sensible decision rather than a luxury


    This route is for experienced travellers. If it is your first time in the Georgian mountains, driving
    as far as Ghebi and seeing the valley is worthwhile on its own, without attempting the climb to the
    lake.
  tip: >-
    This is not a day outing: reaching the lake or the glacier takes a full day and often an overnight
    camp. Bring hiking boots, a rain shell, a warm layer, food, and either a water filter or your own
    supply. Arrange a guide in Ghebi before walking up, because the trail is not waymarked throughout.
    Shops and fuel are back in Oni and there is nothing above. Check the weather forecast before you commit
    to the drive.
  route: >-
    From Tbilisi head towards Kutaisi, north through Tkibuli to Ambrolauri, then east to Oni and on through
    Glola to Ghebi — roughly 410 km and over seven hours. Beyond Oni the asphalt ends and the road becomes
    gravel, stony and washed out in places, with several stream crossings. **This section requires a genuine
    high-clearance 4x4**; a sedan or an ordinary crossover has no business attempting it. Plan an overnight
    in Oni or Ghebi rather than driving back the same day.
ru:
  name: Озеро Удзиро и ледник Буба (Геби)
  short: Последнее село Рачи и отправная точка высокогорных маршрутов — только 4x4 и только летом.
  body: >
    Геби — последнее село Рачи: здесь дорога заканчивается, а дальше идут только тропы, поднимающиеся
    к Главному Кавказскому хребту. От села ведут два основных маршрута — к **озеру Удзиро**, высокогорному
    озеру выше 2 500 метров, и в **долину ледника Буба**, откуда открываются вершины Буба и Чиухи.


    Важно правильно понимать, что значит «добраться»: **машина довозит только до Геби.** И до озера, и
    до ледника дальше идут пешком — это полный день, по несколько часов в каждую сторону, с приличной
    физической подготовкой и бродом через реку на отдельных участках. Многие группы ночуют в палатке,
    а не пытаются вернуться за один заход.


    Что стоит учесть:


    - сезон очень короткий, реально с июля до середины сентября

    - наверху даже в июне лежат снежники, и тропа не всегда очевидна

    - погода меняется несколько раз в день, облачность опускается быстро

    - мобильная связь фактически заканчивается выше села

    - местный проводник здесь не роскошь, а разумное решение


    Маршрут рассчитан на опытных путешественников. Если вы впервые в грузинских горах, доехать до Геби
    и посмотреть ущелье стоит и само по себе, без подъёма к озеру.


    Геби исторически был известен обработкой кожи и шерсти и до сих пор сохраняет облик старого рачинского
    села: каменные дома, деревянные балконы, маленькие церкви. Гостей принимают семейные гостевые дома,
    но мест немного, и бронировать нужно заранее.
  tip: >-
    Это не прогулка на день: подъём к озеру или леднику занимает полный день и часто требует ночёвки.
    Возьмите треккинговые ботинки, дождевую куртку, тёплый слой, еду и фильтр для воды или собственный
    запас. Проводника ищите в Геби до выхода — тропа маркирована не везде. Магазины и заправки остались
    в Они, выше нет ничего. Прогноз погоды проверьте до того, как выезжать.
  route: >-
    Из Тбилиси в сторону Кутаиси, затем на север через Ткибули до Амбролаури, оттуда на восток в Они и
    дальше через Глолу до Геби — всего около 410 км и более семи часов. За Они асфальт заканчивается,
    дорога становится гравийной, каменистой и местами размытой, с несколькими переездами через ручьи.
    **Этот участок требует настоящего внедорожника с высоким клиренсом**; седану или обычному кроссоверу
    здесь делать нечего. Ночёвку планируйте в Они или Геби.
fa:
  name: دریاچهٔ اودزیرو و یخچال بوبا (غبی)
  short: آخرین روستای راچا و سرآغاز مسیرهای کوهستان بلند — فقط 4x4 و فقط تابستان.
  body: >-
    غبی آخرین روستای راچاست: جاده اینجا تمام می‌شود و آن‌سویش تنها بیراهه‌هایی است که به سوی ستیغ اصلی
    قفقاز بالا می‌روند. دو مسیر از روستا اهمیت دارند — **دریاچهٔ اودزیرو**، دریاچه‌ای کوهستانی بالاتر
    از 2,500 متر، و **درهٔ یخچال بوبا**، که از آن قله‌های بوبا و چیوخی به چشم می‌آیند.


    مهم است بدانید رسیدن به آن‌ها چه می‌طلبد: **خودرو فقط تا غبی می‌برد.** از آنجا هم دریاچه و هم یخچال
    پیاده به دست می‌آید — یک روز کامل، چند ساعت در هر جهت، با آمادگی بدنی مناسب و در بخش‌هایی گذر از رودخانه.
    بسیاری از گروه‌ها به جای تلاش برای بازگشت در یک نوبت، شب را چادر می‌زنند.


    چند نکته را بسنجید: فصل بسیار کوتاه است، واقع‌بینانه از ژوئیه تا میانهٔ سپتامبر؛ برف‌چال‌ها حتی در
    ژوئن در ارتفاعات می‌مانند و مسیر همیشه پیدا نیست؛ هوا روزی چند بار عوض می‌شود و ابر به‌سرعت پایین
    می‌آید؛ آنتن موبایل عملاً بالای روستا تمام می‌شود؛ و راهنمای محلی اینجا تصمیمی معقول است، نه تجمل.
    این مسیر برای مسافران باتجربه است. اگر نخستین بار است که به کوهستان گرجستان می‌آیید، رانندگی تا غبی
    و دیدن دره خودش ارزش دارد، بی‌آنکه صعود به دریاچه را در پیش بگیرید.
  tip: >-
    این برنامهٔ یک‌روزه نیست: رسیدن به دریاچه یا یخچال یک روز کامل می‌گیرد و اغلب یک شب چادر. کفش کوهنوردی،
    بارانی، لایهٔ گرم، غذا و یا فیلتر آب یا ذخیرهٔ خودتان را ببرید. پیش از بالا رفتن در غبی راهنما هماهنگ
    کنید، چون مسیر سرتاسر علامت‌گذاری نشده است. فروشگاه و سوخت در اونی است و بالاتر از آن هیچ چیز نیست.
    پیش از آنکه به این رانندگی متعهد شوید، پیش‌بینی هوا را ببینید.
  route: >-
    از تفلیس به سوی کوتایسی بروید، از راه تکیبولی رو به شمال تا آمبرولاوری، سپس رو به شرق تا اونی و از
    گلولا تا غبی — تقریباً 410 کیلومتر و بیش از هفت ساعت. پس از اونی آسفالت تمام می‌شود و جاده شنی، سنگلاخ
    و جابه‌جا شسته می‌شود، با چند گذر آب. **این بخش خودروی 4x4 با کلیرنس واقعاً بالا می‌خواهد**؛ سدان
    یا کراس‌اوور معمولی اینجا کاری ندارد. به جای بازگشت در همان روز، یک شب اقامت در اونی یا غبی برنامه‌ریزی
    کنید.
he:
  name: אגם אודזירו וקרחון בובה (גבי)
  short: הכפר האחרון ברצ'ה ונקודת הזינוק למסלולי ההרים הגבוהים — 4x4 בלבד ובקיץ בלבד.
  body: >-
    גבי הוא הכפר האחרון ברצ'ה: הכביש נגמר כאן, ומעבר לו יש רק שבילים המטפסים אל רכס הקווקז המרכזי. שני
    מסלולים חשובים יוצאים מהכפר — **אגם אודזירו**, אגם הרים השוכן מעל 2,500 מטר, ו**עמק קרחון בובה**,
    שממנו נגלות לעין פסגות בובה וצ'יוחי.


    חשוב להבין מה כרוך בהגעה אליהם: **הרכב מביא אתכם רק עד גבי.** משם מגיעים אל האגם ואל הקרחון ברגל —
    יום שלם, כמה שעות לכל כיוון, בכושר סביר ובכמה קטעים גם בחציית נהר. קבוצות רבות מעדיפות ללון באוהל
    במקום לנסות לחזור במאמץ אחד.


    מה כדאי לשקול: העונה קצרה מאוד, ריאלית מיולי עד אמצע ספטמבר; שדות שלג נותרים במרומים אפילו ביוני,
    והשביל אינו תמיד ברור; מזג האוויר משתנה כמה פעמים ביום והעננים יורדים במהירות; הקליטה הסלולרית נגמרת
    למעשה מעל הכפר; ומדריך מקומי כאן הוא החלטה נבונה ולא מותרות. המסלול הזה מיועד לנוסעים מנוסים. אם זו
    הפעם הראשונה שלכם בהרי גאורגיה, הנסיעה עד גבי והמבט על העמק שווים לעצמם, בלי לנסות את הטיפוס אל האגם.
  tip: >-
    זו אינה יציאה של יום קצר: ההגעה לאגם או לקרחון גוזלת יום שלם ולעיתים קרובות גם לינת שטח. הביאו נעלי
    הליכה, מעיל גשם, שכבה חמה, אוכל ומסנן מים או מלאי משלכם. סכמו מדריך בגבי לפני העלייה, כי השביל אינו
    מסומן לכל אורכו. חנויות ודלק נשארו מאחור באוני ומעליה אין דבר. בדקו את תחזית מזג האוויר לפני שאתם
    מתחייבים לנסיעה.
  route: >-
    מטביליסי סעו לכיוון קוטאיסי, צפונה דרך טקיבולי לאמברולאורי, ואז מזרחה לאוני והלאה דרך גלולה לגבי —
    כ-410 ק"מ ומעל שבע שעות. מעבר לאוני נגמר האספלט והדרך הופכת לחצץ, אבנית ושטופה במקומות, עם כמה חציות
    נחל. **הקטע הזה מחייב רכב 4x4 עם גובה גחון אמיתי**; לסדאן או לקרוסאובר רגיל אין מה לחפש כאן. תכננו
    לינה באוני או בגבי במקום לנסוע חזרה באותו יום.
ar:
  name: بحيرة أودزيرو ونهر بوبا الجليدي (غيبي)
  short: آخر قرى راتشا ونقطة انطلاق مسارات الجبال العالية — دفع رباعي فقط وفي الصيف فقط.
  body: >-
    غيبي هي القرية الأخيرة في راتشا: ينتهي الطريق هنا، وخلفها لا توجد سوى دروب تصعد نحو سلسلة القوقاز
    الرئيسية. ومن القرية يهم مساران — **بحيرة أودزيرو**، وهي بحيرة جبلية تقع فوق 2,500 متر، و**وادي نهر
    بوبا الجليدي** الذي تنكشف منه قمتا بوبا وتشيوخي.


    ومن المهم أن تدرك ما يتطلبه الوصول إليهما: **السيارة توصلك إلى غيبي فقط.** ومن هناك تُبلغ البحيرة
    والنهر الجليدي سيراً على الأقدام — يوم كامل، وعدة ساعات في كل اتجاه، مع لياقة معقولة وعبور نهر في
    بعض المقاطع. وكثير من المجموعات يبيت في الخيام بدلاً من محاولة العودة في دفعة واحدة.


    وما ينبغي وزنه: الموسم قصير جداً، وواقعياً من يوليو إلى منتصف سبتمبر؛ وتبقى حقول الثلج في الأعالي
    حتى في يونيو، والمسار ليس واضحاً دائماً؛ ويتبدل الطقس مرات عدة في اليوم وينزل الغيم سريعاً؛ وتنتهي
    التغطية الخلوية عملياً فوق القرية؛ ووجود مرشد محلي هنا قرار حصيف لا ترف. هذا المسار للمسافرين ذوي
    الخبرة. وإن كانت هذه أول مرة لك في جبال جورجيا، فالقيادة حتى غيبي ورؤية الوادي تستحقان بذاتهما، من
    دون محاولة الصعود إلى البحيرة.
  tip: >-
    هذه ليست نزهة يوم: بلوغ البحيرة أو النهر الجليدي يستغرق يوماً كاملاً وغالباً مبيتاً في الخيام. خذ
    حذاء مشي وسترة مطر وطبقة دافئة وطعاماً ومرشِّح ماء أو مخزونك الخاص. رتب مرشداً في غيبي قبل الصعود،
    فالدرب غير معلَّم على امتداده. المتاجر والوقود تُترك خلفك في أوني ولا شيء فوقها. تحقق من نشرة الطقس
    قبل أن تلتزم بهذه القيادة.
  route: >-
    من تبليسي اتجه نحو كوتايسي، ثم شمالاً عبر تكيبولي إلى أمبرولاوري، ثم شرقاً إلى أوني ومنها عبر غلولا
    إلى غيبي — نحو 410 كم وأكثر من سبع ساعات. وبعد أوني ينتهي الإسفلت ويصير الطريق حصوياً حجرياً منجرفاً
    في مواضع، مع عدة مخاضات جداول. **يتطلب هذا المقطع سيارة دفع رباعي حقيقية عالية الخلوص**؛ ولا شأن للسيارة
    الصالون أو الكروس أوفر العادي به. خطط لمبيت في أوني أو غيبي بدلاً من العودة في اليوم نفسه.
