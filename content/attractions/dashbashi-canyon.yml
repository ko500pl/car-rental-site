ka:
  name: დაშბაშის კანიონი
  short: >-
    რვაკილომეტრიანი ბაზალტის კანიონი წალკასთან, სადაც წყაროები კლდიდან ჩანჩქერებად ცვივა, ზემოდან კი შუშის
    „ბრილიანტის ხიდი“ კიდია.
  body: >-
    **წალკის შიშველ, ქარისგან გალესილ პლატოზე მიწა უცებ იხსნება და ფეხქვეშ ჩანჩქერებით სავსე მწვანე სამყარო
    გადაიშლება.**


    დაშბაშის, ანუ წალკის, კანიონი რვა კილომეტრზეა გაჭიმული. ის ქციამ — ასე ჰქვია ხრამს ზემო წელში — გამოკვეთა
    ბაზალტის ლავაში, რომლითაც ეს პლატოა აგებული. დაცული ხეობა ზღვის დონიდან დაახლოებით 1110-დან 1450 მეტრამდე
    მდებარეობს. კანიონის საიდუმლო მიწისქვეშა წყალია: უხვი წყაროები პირდაპირ კლდის პირიდან ამოხეთქავს და
    თეთრ ფარდებად ეშვება ხავსიან საფეხურებზე, მწვანე ტბორებში. ქვემოთ ჰაერი ნოტიოა, ფერდობებს წიფელი,
    მუხა და რცხილა ფარავს, ზემოთ კი, კიდეზე, ხე თითქმის არ დგას. ზამთარში ეს ფარდები ყინულის ორღანის მილებად
    იქცევა.


    2022 წელს ხეობაზე 240-მეტრიანი შუშის ხიდი გაიხსნა, რომლის შუაგულში დაწახნაგებული ბრილიანტის ფორმის
    შუშის პავილიონი კიდია. „ბრილიანტის ხიდი“ დღეს სტუმართა უმეტესობის მთავარი მიზანია და მართლაც ეფექტური
    სანახაობაა. ძველი სიამოვნება კი მის ქვემოთ გელით: ჩანჩქერებამდე ჩამავალი ბილიკები, მდინარე, რომელშიც
    დღესაც კალმახი ბინადრობს, და კანიონის მიდამოებში — X–XI საუკუნეების წმინდა გიორგის ეკლესია. XVIII
    საუკუნეში ვახუშტი ბატონიშვილი ამ კანიონში თევზით მდიდარ მორევს აღწერდა.


    გარშემო პლატოს საკუთარი ამბავი აქვს. 1990-იან წლებამდე წალკის რაიონი საბჭოთა კავშირის ერთ-ერთი ყველაზე
    ბერძნული კუთხე იყო — ცნობების უმეტესობით, მოსახლეობის ცხრა მეათედზე მეტი ბერძენი გახლდათ. დამოუკიდებლობის
    შემდეგ ამ ოჯახების უმრავლესობა საბერძნეთში გადავიდა, 1997–2006 წლებში კი მათ სოფლებში სვანეთსა და
    აჭარაში მეწყრებისგან დაზარალებული ქართველები ჩაასახლეს.


    ხიდი ამბის სათაურია, ამბავი კი წყაროებია: ისინი აქ იმაზე დიდი ხნით ადრე ჩქეფდნენ, ვიდრე ვინმე ამ ხედზე
    ბილეთის გაყიდვას მოიფიქრებდა.
  tip: >-
    „ბრილიანტის ხიდი“ ფასიანი ატრაქციაა და ფასი იცვლება, ამიტომ გზას რომ დაადგებით, მანამდე გადაამოწმეთ;
    კიდის სანახავ წერტილებამდე და ჩანჩქერებამდე ჩასასვლელად ხიდზე გავლა საჭირო არ არის. ადრე მოდით — შაბათ-კვირას
    შუადღისთვის ხიდთან რიგი დგება. ჩასასვლელი ციცაბოა და შხეფებისგან მოლიპული, ამიტომ კარგად მოჭიდებადი
    ფეხსაცმელი ჩაიცვით და ჩასვლა-ამოსვლას ორ საათამდე გამოყავით. 1100–1450 მეტრზე აგვისტოშიც გრილა — თბილი
    ტანსაცმელი იქონიეთ. თოვლი წელიწადში დაახლოებით სამ თვეს დევს; ზამთარში ბილიკები იყინება და შეიძლება
    დაიკეტოს. პარკინგი და კვების ობიექტები ხიდის კომპლექსთანაა.
  route: >-
    ყველაზე მოკლე გზა, დაახლოებით 90 კმ და საათი და სამი მეოთხედი, თბილისიდან წყნეთისა და კოჯრის გავლით
    შ36-ით მანგლისისკენ ადის, მერე კი შ31-ით დასავლეთით, ღია პლატოზე მიემართება; კანიონისკენ გასახვევი
    ქალაქ წალკამდე რამდენიმე კილომეტრით ადრეა. ალტერნატივა — ს6-ით სამხრეთით, შემდეგ კოდისა და თეთრიწყაროს
    გავლით — დაახლოებით ათი კილომეტრით გრძელია. ორივე ასფალტიანია და ეკონომ კლასის მანქანა გაართმევს თავს,
    ოღონდ კოჯრის შემდეგ მკვეთრ მოსახვევებს და პლატოზე ძლიერ გვერდით ქარს მოელოდეთ. საწვავი თბილისში ან
    წალკაში ჩაასხით. ზამთარში აქ თოვლი და ყინული ჩვეულებრივი ამბავია — ზამთრის საბურავები აუცილებელია.
en:
  name: Dashbashi Canyon
  short: >-
    An eight-kilometre basalt gorge near Tsalka where springs burst from the rock as waterfalls, while
    the glass Diamond Bridge hangs overhead.
  body: >-
    **On the bare, wind-scoured Tsalka plateau the ground simply opens, and below your feet lies a green
    world of falling water.**


    Dashbashi, also called the Tsalka Canyon, runs for eight kilometres. It was cut by the Ktsia, as the
    Khrami is called in its upper course, into the basalt lavas that built this plateau, and the protected
    gorge lies between roughly 1,110 and 1,450 metres above sea level. The canyon's secret is groundwater.
    Copious springs burst straight from the rock faces and fall in white veils over mossy ledges into
    green pools. Down there the air is damp and the slopes are wooded with beech, oak and hornbeam, while
    the rim above is almost treeless. In winter the curtains freeze into organ pipes of ice.


    In 2022 a 240-metre glass bridge opened across the gorge, with a glass pavilion shaped like a cut
    diamond hanging at its middle. The Diamond Bridge is why most visitors now come, and it is a fine
    piece of theatre. The older pleasures lie beneath it: the paths down to the falls, the river, where
    trout still swim, and, in the canyon area, a 10th–11th-century church of St George. In the 18th century
    the geographer Prince Vakhushti Bagrationi described a pool in this canyon rich in fish.


    The plateau around it has its own story. Until the 1990s Tsalka district was one of the most Greek
    places in the Soviet Union, by most accounts more than nine-tenths Greek. After independence most
    of those families left for Greece, and between 1997 and 2006 Georgians displaced by landslides in
    Svaneti and Adjara were resettled in their villages.


    The bridge is the headline, but the springs are the story: they were falling here long before anyone
    thought to sell a ticket to the view.
  tip: >-
    The Diamond Bridge is a paid attraction and prices change, so check before you set out; the rim viewpoints
    and the paths down to the falls do not require crossing it. Come early, because queues build at the
    bridge by midday at weekends. The descent is steep and slick with spray, so wear shoes with real grip
    and allow up to two hours down and back. At 1,100–1,450 metres the canyon is cool even in August;
    bring a layer. Snow lies for about three months a year, and in winter the paths ice over and may close.
    Parking and food are at the bridge complex.
  route: >-
    The shortest way, about 90 km and an hour and three-quarters, climbs out of Tbilisi through Tskneti
    and Kojori on the Sh36 to Manglisi, then runs west on the Sh31 across the open plateau; the turn for
    the canyon comes a few kilometres before Tsalka town. The alternative, the S6 south and then through
    Koda and Tetritskaro, is about ten kilometres longer. Both are asphalt, so an economy car copes, but
    expect tight bends after Kojori and strong crosswinds on the plateau. Refuel in Tbilisi or Tsalka.
    In winter snow and ice are routine up here, and winter tyres are essential.
ru:
  name: Каньон Дашбаши
  short: >-
    Восьмикилометровое базальтовое ущелье у Цалки: родники вырываются из скал водопадами, а над ними висит
    стеклянный Бриллиантовый мост.
  body: >-
    **На голом, продутом ветрами Цалкском плато земля вдруг расступается, и под ногами открывается зелёный
    мир падающей воды.**


    Дашбаши, который называют и Цалкским каньоном, тянется на восемь километров. Его прорезала в базальтовых
    лавах, из которых сложено плато, река Кция — так называют Храми в верхнем течении, — а охраняемое
    ущелье лежит на высоте примерно от 1110 до 1450 метров над уровнем моря. Секрет каньона — подземные
    воды. Обильные родники бьют прямо из скальных стен и белыми вуалями срываются по замшелым уступам
    в зелёные заводи. Внизу воздух влажен, склоны поросли буком, дубом и грабом, а край ущелья наверху
    почти безлесен. Зимой эти водяные занавесы застывают ледяными органными трубами.


    В 2022 году над ущельем открыли 240-метровый стеклянный мост, посередине которого висит стеклянный
    павильон в форме огранённого бриллианта. Ради Бриллиантового моста сегодня едет сюда большинство,
    и это действительно эффектное зрелище. Но давние радости лежат под ним: тропы вниз к водопадам, река,
    где до сих пор водится форель, а в окрестностях каньона — церковь Святого Георгия X–XI веков. Ещё
    в XVIII веке географ царевич Вахушти Багратиони описал в этом каньоне богатую рыбой заводь.


    У окрестного плато своя история. До 1990-х Цалкский район был одним из самых греческих мест Советского
    Союза: по большинству свидетельств, греки составляли здесь больше девяти десятых населения. После
    обретения независимости большинство этих семей уехало в Грецию, а в 1997–2006 годах в их сёла переселили
    грузин, лишившихся домов из-за оползней в Сванетии и Аджарии.


    Мост — это заголовок, но настоящая история — родники: они струились здесь задолго до того, как кому-то
    пришло в голову продавать билеты на этот вид.
  tip: >-
    Бриллиантовый мост — платный аттракцион, и цены меняются, так что уточните их перед поездкой; к смотровым
    площадкам на краю каньона и тропам к водопадам можно пройти, не ступая на мост. Приезжайте пораньше:
    в выходные к полудню у моста выстраиваются очереди. Спуск крутой и скользкий от брызг, поэтому нужна
    обувь с цепкой подошвой, а на спуск и подъём закладывайте до двух часов. На высоте 1100–1450 метров
    в каньоне прохладно даже в августе — возьмите тёплую кофту. Снег лежит здесь около трёх месяцев в
    году; зимой тропы обледеневают и могут закрываться. Парковка и еда — у комплекса моста.
  route: >-
    Самый короткий путь — около 90 км и час сорок пять минут — поднимается из Тбилиси через Цхнети и Коджори
    по дороге Sh36 до Манглиси, а затем уходит на запад по Sh31 через открытое плато; поворот к каньону
    будет за несколько километров до Цалки. Альтернатива — на юг по S6 и дальше через Коду и Тетрицкаро
    — длиннее примерно на десять километров. Обе дороги асфальтированы, так что справится и машина эконом-класса,
    но после Коджори ждите крутых поворотов, а на плато — сильного бокового ветра. Заправьтесь в Тбилиси
    или Цалке. Зимой снег и гололёд здесь обычное дело, и зимняя резина обязательна.
fa:
  name: درهٔ داشباشی
  short: >-
    تنگه‌ای بازالتی به طول هشت کیلومتر نزدیک تسالکا که چشمه‌هایش چون آبشار از دل صخره بیرون می‌جهند و
    پل شیشه‌ای الماس بر فرازش آویخته است.
  body: >-
    **بر فلات برهنه و بادروبِ تسالکا، زمین ناگهان دهان می‌گشاید و زیر پایتان جهانی سبز از آب‌های فروریزان
    پدیدار می‌شود.**


    داشباشی، که درهٔ تسالکا هم نامیده می‌شود، هشت کیلومتر امتداد دارد. رود کتسیا ــ نامی که خرامی در بخش
    بالایی مسیرش دارد ــ آن را در گدازه‌های بازالتیِ سازندهٔ این فلات کنده است، و این دره‌ی حفاظت‌شده
    در ارتفاع حدود ۱٬۱۱۰ تا ۱٬۴۵۰ متر از سطح دریا جای دارد. راز این دره آب‌های زیرزمینی است. چشمه‌های
    پرآب یکراست از دل دیواره‌های سنگی بیرون می‌جهند و چون پرده‌هایی سپید از لبه‌های خزه‌پوش به آبگیرهای
    سبز فرو می‌ریزند. آن پایین هوا نمناک است و دامنه‌ها پوشیده از راش، بلوط و ممرز، حال آنکه لبهٔ بالای
    دره تقریباً بی‌درخت است. در زمستان این پرده‌ها یخ می‌بندند و به لوله‌های یخیِ ارگ بدل می‌شوند.


    در سال ۲۰۲۲ پلی شیشه‌ای به طول ۲۴۰ متر بر فراز دره گشوده شد که در میانه‌اش کوشکی شیشه‌ای به شکل الماسی
    تراش‌خورده آویزان است. پل الماس امروز دلیل آمدن بیشتر بازدیدکنندگان است و به‌راستی نمایشی درخور تماشاست.
    اما لذت‌های کهن‌تر زیر آن جای دارند: کوره‌راه‌هایی که به آبشارها می‌رسند، رودی که هنوز قزل‌آلا در
    آن شنا می‌کند، و در محدوده‌ی دره، کلیسای گئورگیوس قدیس از سده‌های دهم و یازدهم. در سدهٔ هجدهم، شاهزاده
    واخوشتی باگراتیونیِ جغرافی‌دان از آبگیری پرماهی در همین دره یاد کرده است.


    فلات پیرامون نیز داستان خود را دارد. تا دههٔ ۱۹۹۰ ناحیهٔ تسالکا از یونانی‌نشین‌ترین جاهای اتحاد جماهیر
    شوروی بود؛ به گفتهٔ بیشتر منابع، بیش از نه‌دهم ساکنانش یونانی بودند. پس از استقلال، بیشتر این خانواده‌ها
    به یونان رفتند و میان سال‌های ۱۹۹۷ تا ۲۰۰۶ گرجی‌هایی که رانش زمین در سوانتی و آجارا آواره‌شان کرده
    بود، در روستاهای آنان اسکان یافتند.


    پل تیتر خبر است، اما داستان اصلی از آنِ چشمه‌هاست: آن‌ها مدت‌ها پیش از آنکه کسی به فکر فروختن بلیت
    برای این منظره بیفتد، همین‌جا فرو می‌ریختند.
  tip: >-
    پل الماس جاذبه‌ای با بلیت است و قیمت‌ها تغییر می‌کند، پس پیش از حرکت آن را بررسی کنید؛ برای رسیدن
    به دیدگاه‌های لبهٔ دره و کوره‌راه‌های آبشارها لازم نیست از پل بگذرید. زود بیایید، چون آخر هفته‌ها
    نزدیک ظهر صف‌های بلندی جلوی پل شکل می‌گیرد. سراشیبی تند است و از ترشح آب لغزنده، پس کفشی با آج محکم
    بپوشید و برای رفت‌وبرگشت تا دو ساعت وقت بگذارید. در ارتفاع ۱٬۱۰۰ تا ۱٬۴۵۰ متر، دره حتی در ماه اوت
    خنک است؛ یک لایه لباس گرم همراه داشته باشید. برف حدود سه ماه از سال بر زمین می‌ماند و در زمستان کوره‌راه‌ها
    یخ می‌زنند و ممکن است بسته شوند. پارکینگ و غذا در مجموعهٔ پل فراهم است.
  route: >-
    کوتاه‌ترین راه، حدود ۹۰ کیلومتر و یک ساعت و سه ربع، از تفلیس از راه تسخنتی و کوجوری با جادهٔ Sh36
    تا مانگلیسی بالا می‌رود و سپس با Sh31 به سوی غرب از میان فلات باز ادامه می‌یابد؛ انشعاب به سوی دره
    چند کیلومتر پیش از شهر تسالکا است. راه دیگر، رو به جنوب با S6 و سپس از کودا و تتری‌تسقارو، حدود ده
    کیلومتر طولانی‌تر است. هر دو آسفالت‌اند و خودروی اقتصادی از پسشان برمی‌آید، اما پس از کوجوری منتظر
    پیچ‌های تند و روی فلات منتظر بادهای جانبی شدید باشید. در تفلیس یا تسالکا سوخت‌گیری کنید. در زمستان
    برف و یخ‌بندان در این ارتفاع امری عادی است و لاستیک زمستانی ضروری است.
he:
  name: קניון דשבאשי
  short: >-
    ערוץ בזלת באורך שמונה קילומטרים ליד צאלקה, שבו מעיינות פורצים מן הסלע כמפלים, ומעליו תלוי גשר הזכוכית
    – גשר היהלום.
  body: >-
    **על רמת צאלקה החשופה, שהרוח מטאטאת בלי הרף, האדמה פשוט נפערת, ומתחת לרגליכם נגלה עולם ירוק של מים
    נופלים.**


    דשבאשי, המכונה גם קניון צאלקה, משתרע לאורך שמונה קילומטרים. את הערוץ חצב נהר הקציה – כך נקרא החראמי
    במהלכו העליון – בלבת הבזלת שממנה נבנתה הרמה, והערוץ המוגן שוכן בגובה של כ-1,110 עד 1,450 מטרים מעל
    פני הים. סודו של הקניון הוא מי התהום. מעיינות שופעים פורצים היישר מקירות הסלע ונופלים כהינומות לבנות
    על מדפים מכוסי טחב אל בריכות ירוקות. למטה האוויר לח והמדרונות מיוערים באשור, באלון ובקרפינוס, ואילו
    השפה למעלה כמעט חשופה מעצים. בחורף הווילונות האלה קופאים לצינורות עוגב של קרח.


    ב-2022 נפתח מעל הערוץ גשר זכוכית באורך 240 מטרים, ובאמצעו תלוי ביתן זכוכית בצורת יהלום מלוטש. גשר
    היהלום הוא הסיבה שבגללה רוב המבקרים מגיעים היום, והוא אכן מחזה מרשים. אבל ההנאות הוותיקות שוכנות מתחתיו:
    השבילים היורדים אל המפלים, הנהר, שבו עדיין שוחים דגי פורל, ובאזור הקניון גם כנסיית גאורגיוס הקדוש
    מן המאות ה-10–11. כבר במאה ה-18 תיאר הגאוגרף הנסיך וחושטי בגרטיוני בריכה עשירה בדגים בקניון הזה.


    לרמה שמסביב יש סיפור משלה. עד שנות ה-90 של המאה ה-20 היה מחוז צאלקה אחד המקומות היווניים ביותר בברית
    המועצות: לפי רוב העדויות, יותר מתשע עשיריות מתושביו היו יוונים. אחרי העצמאות עזבו רוב המשפחות האלה
    ליוון, ובין 1997 ל-2006 יושבו בכפריהן גאורגים שמפולות אדמה בסוואנתי ובאג'ריה עקרו אותם מבתיהם.


    הגשר הוא הכותרת, אבל המעיינות הם הסיפור: הם נבעו כאן הרבה לפני שמישהו חשב למכור כרטיס לנוף.
  tip: >-
    גשר היהלום הוא אטרקציה בתשלום והמחירים משתנים, לכן בדקו לפני היציאה; אל התצפיות שעל שפת הקניון ואל
    השבילים היורדים למפלים אפשר להגיע בלי לחצות אותו. הגיעו מוקדם, כי בסופי שבוע כבר בצהריים משתרכים תורים
    ליד הגשר. הירידה תלולה וחלקלקה מן הרסס, לכן נעלו נעליים עם אחיזה של ממש והקצו עד שעתיים לירידה ולעלייה.
    בגובה 1,100–1,450 מטרים הקניון קריר גם באוגוסט; קחו שכבה חמה. השלג נשאר כאן כשלושה חודשים בשנה, ובחורף
    השבילים מתכסים קרח ועלולים להיסגר. חניה ואוכל יש במתחם הגשר.
  route: >-
    הדרך הקצרה ביותר, כ-90 ק"מ ושעה ושלושה רבעים, מטפסת מטביליסי דרך צקנטי וקוג'ורי בכביש Sh36 עד מנגליסי,
    ואז פונה מערבה בכביש Sh31 על פני הרמה הפתוחה; הפנייה לקניון מגיעה כמה קילומטרים לפני העיירה צאלקה.
    החלופה – דרומה בכביש S6 ואחר כך דרך קודה וטטריצקארו – ארוכה בכעשרה קילומטרים. שתי הדרכים סלולות, כך
    שרכב חסכוני יסתדר, אבל צפו לעיקולים חדים אחרי קוג'ורי ולרוחות צד חזקות על הרמה. תדלקו בטביליסי או
    בצאלקה. בחורף שלג וקרח הם כאן עניין שגרתי, וצמיגי חורף הם הכרח.
ar:
  name: أخدود داشباشي
  short: أخدود بازلتي طوله ثمانية كيلومترات قرب تسالكا، تتفجر ينابيعه من الصخر شلالاتٍ، ويتدلى فوقه جسر
    الماس الزجاجي.
  body: >-
    **على هضبة تسالكا العارية التي تكنسها الرياح، تنشقّ الأرض فجأة، فإذا تحت قدميك عالمٌ أخضر من المياه
    المتساقطة.**


    يمتد داشباشي، المعروف أيضاً بأخدود تسالكا، ثمانية كيلومترات. حفره نهر كتسيا، وهو اسم نهر خرامي في
    مجراه الأعلى، في حِمم البازلت التي بَنَت هذه الهضبة، ويقع الأخدود المحمي بين نحو 1110 و1450 متراً
    فوق سطح البحر. سرّ الأخدود هو المياه الجوفية؛ إذ تتفجر ينابيع غزيرة مباشرة من الواجهات الصخرية وتنسدل
    كأستار بيضاء فوق حوافّ مكسوّة بالطحلب إلى برك خضراء. في الأسفل الهواء رطب والمنحدرات تكسوها أشجار
    الزان والبلوط والشَّرَد، بينما تكاد الحافة العليا تخلو من الشجر. وفي الشتاء تتجمد هذه الستائر فتغدو
    أنابيب أرغن من جليد.


    في عام 2022 افتُتح فوق الأخدود جسر زجاجي طوله 240 متراً، يتدلى في منتصفه جناح زجاجي على هيئة ماسة
    مصقولة. جسر الماس هو ما يجتذب معظم الزوار اليوم، وهو عرض مسرحي بارع حقاً. غير أن المتع الأقدم تقع
    تحته: الدروب النازلة إلى الشلالات، والنهر الذي ما زال سمك السلمون المرقط يسبح فيه، وفي محيط الأخدود
    كنيسة القديس جاورجيوس من القرنين العاشر والحادي عشر. وفي القرن الثامن عشر وصف الجغرافي الأمير فاخوشتي
    باغراتيوني بركةً غنية بالأسماك في هذا الأخدود.


    وللهضبة المحيطة حكايتها. فحتى تسعينيات القرن العشرين كانت منطقة تسالكا من أكثر بقاع الاتحاد السوفيتي
    يونانيةً، إذ كان اليونانيون، بحسب معظم الروايات، يشكّلون أكثر من تسعة أعشار سكانها. وبعد الاستقلال
    رحلت معظم تلك العائلات إلى اليونان، وبين عامي 1997 و2006 أُعيد توطين جورجيين شرّدتهم الانهيارات الأرضية
    في سفانيتي وأجاريا في قراهم.


    الجسر هو العنوان، لكن الينابيع هي الحكاية: كانت تتساقط هنا قبل أن يخطر لأحد أن يبيع تذكرة لهذا المشهد
    بزمن طويل.
  tip: >-
    جسر الماس معلم مدفوع الرسوم والأسعار تتغير، فتحقّق منها قبل الانطلاق؛ أما نقاط المشاهدة على حافة الأخدود
    والدروب النازلة إلى الشلالات فلا تتطلب عبوره. تعالَ باكراً، فالطوابير تتشكل عند الجسر بحلول الظهيرة
    في عطلات نهاية الأسبوع. النزول شديد الانحدار وزلِق من رذاذ الماء، فارتدِ حذاءً بنعل متين يمسك الأرض،
    واحسب ما يصل إلى ساعتين للنزول والصعود. على ارتفاع 1100–1450 متراً يبقى الأخدود بارداً حتى في أغسطس؛
    خذ معك طبقة دافئة. يبقى الثلج نحو ثلاثة أشهر في السنة، وفي الشتاء تتجمد الدروب وقد تُغلق. المواقف
    والطعام متوفران عند مجمّع الجسر.
  route: >-
    أقصر الطرق، نحو 90 كم وساعة وثلاثة أرباع الساعة، يصعد من تبليسي عبر تسخنيتي وكوجوري على الطريق Sh36
    حتى مانغليسي، ثم يتجه غرباً على Sh31 عبر الهضبة المفتوحة؛ ويأتي المنعطف إلى الأخدود قبل بلدة تسالكا
    ببضعة كيلومترات. أما البديل، جنوباً على S6 ثم عبر كودا وتيتريتسكارو، فأطول بنحو عشرة كيلومترات. كلا
    الطريقين معبّد، فتكفي سيارة اقتصادية، لكن توقّع منعطفات حادة بعد كوجوري ورياحاً جانبية قوية على الهضبة.
    تزوّد بالوقود في تبليسي أو تسالكا. في الشتاء يكون الثلج والجليد أمراً معتاداً هنا، والإطارات الشتوية
    ضرورية.
