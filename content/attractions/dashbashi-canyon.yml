ka:
  name: დაშბაშის კანიონი
  short: წალკის მახლობლად, ბაზალტის კანიონი ჩანჩქერებით და შუშის ხიდით, რომელიც ხეობის თავზეა გადებული.
  body: >-
    დაშბაშის კანიონი წალკიდან რამდენიმე კილომეტრში, ჯავახეთის ვულკანური პლატოს კიდეზეა. მდინარე ხრამმა
    ბაზალტის ფენებში ღრმა და ვიწრო ხეობა გამოკვეთა, რომლის კედლებიდანაც ათობით მცირე ჩანჩქერი და წყარო
    ცვივა — ზოგი პირდაპირ კლდის ნაპრალიდან. ხეობის სიღრმე ორასზე მეტ მეტრს აღწევს და ქვემოთ, მდინარესთან,
    კლიმატიც კი განსხვავებულია: ზემოთ პლატოზე ქარია და მშრალია, ქვემოთ კი ტენიანი და მწვანე.


    2022 წლიდან კანიონის მთავარი მიმზიდველი შუშის ხიდია — დაახლოებით 240 მეტრი სიგრძის კონსტრუქცია, ხეობის
    ორ კიდეს შორის გადებული, შუაში ბრილიანტის ფორმის შუშის კაფსულით. ხიდზე გასვლა ტურისტული ატრაქციაა
    და საკმაოდ ძვირი, ბილეთის ფასი კი დროდადრო იცვლება; ის, ვისაც სიმაღლის ეშინია, სავსებით კარგად გაივლის
    ხეობის ბილიკებით და ხედსაც მიიღებს.


    ხიდის გარდა ტერიტორიაზე მოწყობილია ბილიკები ხეობის ქვემოთ, ჩანჩქერების გასწვრივ; ჩასვლა და ასვლა ჯამში
    ორ საათამდე გრძელდება და საკმაოდ ციცაბოა. კომპლექსში ასევე კაფეები და პარკინგია. ზამთარში ჩანჩქერები
    იყინება და ხედი ეფექტურია, თუმცა ბილიკები მოლიპულია და ხშირად ხურავენ. თავად წალკა და მისი წყალსაცავი
    გზაზეა და მოკლე გაჩერების ღირსია; მიდამო ბერძნული და სომხური სოფლებითაა დასახლებული და პლატოს ლანდშაფტი
    ბარის საქართველოსგან სრულიად განსხვავებულია — ღია, უხეო და ქარიანი.
  tip: >-
    ბილეთის ფასი შუშის ხიდზე მაღალია და პერიოდულად იცვლება, ამიტომ წინასწარ გადაამოწმეთ; ხეობის ბილიკებზე
    სეირნობა უფრო იაფია და ბევრს უფრო საინტერესოდაც მიაჩნია. მოდით დილით — შუადღისას, განსაკუთრებით შაბათ-კვირას,
    ხიდზე რიგია. სიმაღლე 1300 მეტრია და ზაფხულშიც გრილა, ამიტომ ქურთუკი წაიღეთ. მოსახერხებელი ფეხსაცმელი
    აუცილებელია, ჩასასვლელი ციცაბოა და მოლიპული.
  route: >-
    თბილისიდან გადით მარნეულის გზატკეცილით, შემდეგ დასავლეთით — თეთრიწყაროსა და წალკის მიმართულებით, სულ
    დაახლოებით 100 კმ და საათი და ორმოცდაათი წუთი. გზა ბოლო წლებში მთლიანად განახლდა და ასფალტი კარგია,
    ამიტომ ეკონომ კლასის მანქანა სავსებით საკმარისია; მხოლოდ პლატოზე ასვლისას ქარი ძლიერია. საწვავს ავსებთ
    მარნეულში, თეთრიწყაროში ან წალკაში. ზამთარში პლატოზე თოვლი და ყინული ხშირია — ზამთრის საბურავები აუცილებელია.
en:
  name: Dashbashi Canyon
  short: A basalt canyon near Tsalka with dozens of waterfalls and a glass bridge suspended across the
    gorge.
  body: >-
    Dashbashi Canyon lies a few kilometres from Tsalka on the edge of the Javakheti volcanic plateau.
    The Khrami river has cut a deep, narrow gorge through layers of basalt, and dozens of small waterfalls
    and springs pour straight out of the rock walls — some emerging from fissures rather than from any
    visible stream above. The gorge is over two hundred metres deep, and the microclimate changes as you
    descend: windy and dry on the plateau, humid and green down by the water.


    Since 2022 the canyon's headline attraction has been the glass bridge, a structure roughly 240 metres
    long spanning the two rims with a diamond-shaped glass capsule suspended at its midpoint. Walking
    it is a commercial attraction and not cheap, and ticket prices change from time to time. Anyone uneasy
    with heights can skip it entirely and still get the view from the rim paths.


    Beyond the bridge, trails run down into the gorge alongside the waterfalls. The descent and climb
    back take up to two hours in total and are steep in places. There are cafés and a large car park at
    the entrance complex. In winter the falls freeze into something spectacular, but the paths become
    slippery and are often closed after snowfall.
  tip: >-
    The glass bridge ticket is expensive and the price changes periodically, so check before you set out;
    walking the rim and gorge paths costs far less and many visitors find it more rewarding. Come in the
    morning — midday at weekends means queues on the bridge. At 1,300 metres it stays cool even in summer,
    so bring a jacket. Proper footwear matters: the descent into the gorge is steep and slippery when
    wet.
  route: >-
    Take the Marneuli highway out of Tbilisi, then turn west towards Tetritskaro and Tsalka — about 100
    km and an hour fifty in total. The road has been completely rebuilt in recent years and the asphalt
    is good, so an economy car is entirely sufficient; the only nuisance is strong crosswind on the climb
    up to the plateau. Fuel is available in Marneuli, Tetritskaro and Tsalka. In winter snow and ice on
    the plateau are common, and winter tyres are essential.
ru:
  name: Каньон Дашбаши
  short: Базальтовый каньон у Цалки с десятками водопадов и стеклянным мостом, переброшенным через ущелье.
  body: >-
    Каньон Дашбаши находится в нескольких километрах от Цалки, у края Джавахетского вулканического плато.
    Река Храми прорезала в базальтовых пластах глубокое узкое ущелье, и из его стен прямо из скалы бьют
    десятки небольших водопадов и родников — часть выходит из трещин, а не из видимого сверху ручья. Глубина
    ущелья превышает двести метров, и микроклимат меняется по мере спуска: наверху, на плато, ветрено
    и сухо, внизу у воды влажно и зелено.


    С 2022 года главной приманкой каньона стал стеклянный мост — конструкция длиной около 240 метров,
    переброшенная между двумя краями ущелья, с подвешенной посередине стеклянной капсулой в форме бриллианта.
    Проход по мосту — коммерческий аттракцион, недешёвый, и цена билета время от времени меняется. Тот,
    кому не по себе на высоте, спокойно обойдётся тропами по краю и получит тот же вид.


    Кроме моста, вниз в ущелье вдоль водопадов проложены тропы. Спуск и подъём занимают в сумме до двух
    часов и местами довольно круты. У входа работают кафе и большая парковка. Зимой водопады замерзают
    и выглядят эффектно, но тропы становятся скользкими и после снегопадов их нередко закрывают.
  tip: >-
    Билет на стеклянный мост дорогой, а цена периодически меняется — уточняйте заранее; прогулка по тропам
    вдоль края и вниз стоит существенно дешевле, и многим она кажется интереснее. Приезжайте утром: в
    середине дня по выходным на мосту очереди. Высота 1300 метров, прохладно даже летом, так что берите
    куртку. Обувь нужна нормальная — спуск в ущелье крутой и скользкий во влажную погоду.
  route: >-
    Из Тбилиси по трассе на Марнеули, затем поворот на запад в сторону Тетрицкаро и Цалки — всего около
    100 км и час пятьдесят. Дорогу за последние годы полностью перестроили, асфальт хороший, поэтому машины
    эконом-класса вполне достаточно; единственное неудобство — сильный боковой ветер на подъёме к плато.
    Заправиться можно в Марнеули, Тетрицкаро и Цалке. Зимой на плато обычны снег и гололёд, зимняя резина
    обязательна.
fa:
  name: درهٔ داشباشی
  short: دره‌ای بازالتی نزدیک تسالکا با ده‌ها آبشار و پلی شیشه‌ای معلق بر فراز شکاف.
  body: >-
    درهٔ داشباشی چند کیلومتر با تسالکا فاصله دارد و بر لبهٔ فلات آتشفشانی جاواختی نشسته است. رود خرامی
    شکافی عمیق و باریک را در لایه‌های بازالت بریده و ده‌ها آبشار کوچک و چشمه مستقیم از دیواره‌های سنگی
    بیرون می‌زنند — بعضی از درز سنگ، بی‌آنکه بالای آن‌ها جریان آبی دیده شود. عمق دره بیش از دویست متر
    است و همان‌طور که پایین می‌روید ریزاقلیم عوض می‌شود: روی فلات بادخیز و خشک، پایین کنار آب مرطوب و
    سبز.


    از 2022 جاذبهٔ اصلی دره پل شیشه‌ای است؛ سازه‌ای حدود 240 متر که دو لبه را به هم می‌دوزد و در میانه‌اش
    کپسولی شیشه‌ای به شکل الماس آویزان است. عبور از آن یک جاذبهٔ تجاری است و ارزان نیست، و قیمت بلیت هر
    از گاهی تغییر می‌کند. هر کس با ارتفاع راحت نباشد می‌تواند کلاً از آن بگذرد و باز هم منظره را از مسیرهای
    لبهٔ دره ببیند.


    فراتر از پل، کوره‌راه‌هایی در امتداد آبشارها به ته دره می‌روند. پایین رفتن و بالا آمدن روی هم تا دو
    ساعت وقت می‌برد و جاهایی تند است. در مجموعهٔ ورودی کافه و پارکینگ بزرگ هست. در زمستان آبشارها یخ می‌زنند
    و منظره‌ای کم‌نظیر می‌سازند، اما راه‌ها لغزنده می‌شوند و پس از برف اغلب بسته‌اند.
  tip: >-
    بلیت پل شیشه‌ای گران است و قیمتش هر چند وقت عوض می‌شود، پس پیش از راه افتادن بررسی کنید؛ راه رفتن
    روی مسیرهای لبه و ته دره خیلی کمتر خرج برمی‌دارد و بسیاری از بازدیدکنندگان آن را دلچسب‌تر می‌دانند.
    صبح بیایید — ظهر آخر هفته یعنی صف روی پل. در 1,300 متری هوا حتی در تابستان خنک می‌ماند، پس ژاکت بردارید.
    کفش مناسب مهم است: سرازیری به داخل دره تند است و در خیسی لیز.
  route: >-
    از تفلیس بزرگراه مارنئولی را بگیرید و بعد به سمت غرب به سوی تتریتسکارو و تسالکا بپیچید — در مجموع
    حدود 100 کیلومتر و یک ساعت و پنجاه دقیقه. جاده در سال‌های اخیر کاملاً بازسازی شده و آسفالت خوب است،
    بنابراین خودروی اقتصادی کاملاً کافی است؛ تنها مزاحمت باد جانبی شدید در صعود به فلات است. سوخت در مارنئولی،
    تتریتسکارو و تسالکا هست. در زمستان برف و یخ روی فلات معمول است و لاستیک زمستانی الزامی.
he:
  name: קניון דשבאשי
  short: קניון בזלת ליד צלקה עם עשרות מפלים וגשר זכוכית תלוי מעל הערוץ.
  body: >-
    קניון דשבאשי שוכן כמה קילומטרים מצלקה, על שפת הרמה הוולקנית של ג'אוואחתי. נהר חראמי חתך ערוץ עמוק
    וצר בשכבות בזלת, ועשרות מפלים ומעיינות קטנים נשפכים ישירות מקירות הסלע — חלקם יוצאים מסדקים ולא מנחל
    נראה לעין שמעליהם. עומק הערוץ עולה על מאתיים מטרים, ומיקרו-האקלים משתנה ככל שיורדים: למעלה על הרמה
    יבש ורוחני, ולמטה ליד המים לח וירוק.


    מאז 2022 אטרקציית הדגל של הקניון היא גשר הזכוכית, מבנה באורך של כ-240 מטרים המחבר בין שתי גדות הערוץ,
    ובאמצעו תלויה מעל התהום קפסולת זכוכית בצורת יהלום. המעבר עליו הוא אטרקציה מסחרית ואינו זול, ומחירי
    הכרטיסים משתנים מפעם לפעם. מי שאינו חש בנוח בגבהים יכול לוותר עליו לגמרי ועדיין לקבל את הנוף המלא
    משבילי השפה.


    מעבר לגשר יורדים שבילים אל תוך הערוץ לאורך המפלים. הירידה והעלייה חזרה נמשכות עד שעתיים בסך הכול והן
    תלולות במקומות. במתחם הכניסה יש בתי קפה וחניון גדול. בחורף המפלים קופאים למראה מרהיב, אך השבילים נעשים
    חלקלקים ולעיתים קרובות נסגרים אחרי שלג.
  tip: >-
    כרטיס גשר הזכוכית יקר והמחיר משתנה מדי פעם, אז בדקו לפני היציאה; ההליכה בשבילי השפה והערוץ עולה הרבה
    פחות ורבים מוצאים אותה מתגמלת יותר. בואו בבוקר — צהריים בסוף שבוע פירושם תורים על הגשר. בגובה 1,300
    מטרים נשאר קריר גם בקיץ, אז קחו מעיל. הנעליים חשובות: הירידה לתוך הערוץ תלולה וחלקלקה כשרטוב.
  route: >-
    צאו מטביליסי בכביש מרנאולי, ואז פנו מערבה לכיוון טטריצקארו וצלקה — כ-100 ק״מ ושעה וחמישים בסך הכול.
    הכביש נבנה מחדש לגמרי בשנים האחרונות והאספלט טוב, ולכן רכב חסכוני מספיק לחלוטין; המטרד היחיד הוא רוח
    צד חזקה בעלייה אל הרמה. דלק זמין במרנאולי, בטטריצקארו ובצלקה. בחורף שלג וקרח על הרמה הם דבר שכיח,
    וצמיגי חורף הם הכרח.
ar:
  name: وادي داشباشي
  short: وادٍ بازلتي قرب تسالكا بعشرات الشلالات وجسر زجاجي معلق فوق الأخدود.
  body: >-
    يقع وادي داشباشي على بعد بضعة كيلومترات من تسالكا، على حافة هضبة جافاخيتي البركانية. حفر نهر خرامي
    أخدوداً عميقاً ضيقاً في طبقات البازلت، وتتدفق عشرات الشلالات والينابيع الصغيرة من جدران الصخر مباشرة
    — بعضها يخرج من شقوق لا من مجرى ظاهر فوقها. ويزيد عمق الأخدود على مئتي متر، ويتبدل المناخ المحلي كلما
    نزلت: ريح وجفاف على الهضبة، ورطوبة وخضرة عند الماء في الأسفل.


    ومنذ 2022 صارت واجهة الوادي هي الجسر الزجاجي، وهو منشأ بطول نحو 240 متراً يصل بين الحافتين وتتدلى
    في منتصفه كبسولة زجاجية على شكل معيّن. والمشي عليه جذب تجاري وليس رخيصاً، وأسعار التذاكر تتغير بين
    حين وآخر. ومن لا يرتاح للمرتفعات يستطيع تخطيه تماماً وأن ينال المنظر مع ذلك من دروب الحافة.


    وخلف الجسر تنزل دروب إلى داخل الأخدود بمحاذاة الشلالات. ويستغرق النزول والصعود ما يصل إلى ساعتين إجمالاً،
    وهو حاد في مواضع. وفي مجمع المدخل مقاهٍ وموقف كبير. وفي الشتاء تتجمد الشلالات في مشهد بديع، لكن الدروب
    تصير زلقة وتُغلق غالباً بعد تساقط الثلج.
  tip: >-
    تذكرة الجسر الزجاجي غالية وسعرها يتغير دورياً، فتحقق قبل الانطلاق؛ أما المشي على دروب الحافة وداخل
    الأخدود فأرخص بكثير، ويجده كثير من الزوار أكثر متعة. تعال صباحاً — فمنتصف النهار في عطلة نهاية الأسبوع
    يعني طوابير على الجسر. وعلى ارتفاع 1,300 متر يبقى الجو بارداً حتى في الصيف، فخذ سترة. والحذاء المناسب
    مهم: النزول إلى الأخدود حاد وزلق عند البلل.
  route: >-
    اخرج من تبليسي على طريق مارنيولي، ثم انعطف غرباً نحو تتريتسكارو وتسالكا — نحو 100 كم وساعة وخمسين
    دقيقة إجمالاً. أُعيد بناء الطريق بالكامل في السنوات الأخيرة والإسفلت جيد، فسيارة اقتصادية تكفي تماماً؛
    والإزعاج الوحيد رياح جانبية قوية في الصعود إلى الهضبة. والوقود متوفر في مارنيولي وتتريتسكارو وتسالكا.
    وفي الشتاء يكثر الثلج والجليد على الهضبة، وإطارات الشتاء ضرورية.
