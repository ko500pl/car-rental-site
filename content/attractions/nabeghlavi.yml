ka:
  name: ნაბეღლავი
  short: მინერალური წყლის სოფელი გურიის მთისწინეთში — წყაროები, მწვანე ხეობა და ბახმაროს გზის დასაწყისი.
  body: >-
    ნაბეღლავი ჩოხატაურის მუნიციპალიტეტის სოფელია გურიის მთისწინეთში, დაახლოებით 480 მეტრზე. მისი სახელი
    მთელ ქვეყანაში ცნობილია მინერალური წყლის წყალობით — ადგილობრივი წყარო საქართველოს ერთ-ერთი ყველაზე
    გავრცელებული სასმელი მინერალური წყლის საფუძველია და მისი ჩამოსხმა სწორედ აქ ხდება.


    თავად სოფელი კომპაქტურია და მოკრძალებული: ხეობა, მდინარე, ტყით დაფარული ფერდობები და მინერალური წყლის
    ქარხანა. ტურისტული აზრი აქ ორია. პირველი — თავად წყალი და მშვიდი, ნოტიო მთისწინა კლიმატი, რომელიც
    სამკურნალო-სარეკრეაციო ადგილად ჩამოაყალიბა. მეორე — ლოკაცია: ნაბეღლავი ბახმაროსკენ მიმავალი გზის ბუნებრივი
    გაჩერებაა და ბოლო წერტილია, სადაც ჯერ კიდევ ნორმალური გზა და მომსახურებაა.


    რას ნახავთ:


    - **წყაროები და ჩამოსხმის ზონა** — მთავარი ადგილობრივი ღირსშესანიშნაობა

    - **ხეობის ბილიკები** მოკლე გასეირნებისთვის ტყეში

    - **სოფლის ცენტრი** მცირე მაღაზიებითა და საოჯახო სასტუმროებით


    ეს არ არის ობიექტი, რომლისთვისაც სპეციალურად ჩამოხვალთ თბილისიდან — მისთვის ნახევარი დღის გამოყოფა
    გადაჭარბებული იქნებოდა. სამაგიეროდ, გურიის მარშრუტში ის ლოგიკურად ჯდება, განსაკუთრებით მაშინ, თუ ბახმაროსკენ
    მიდიხართ ან უბრალოდ სანაპიროდან მთისკენ იხრებით. ხეობა ზაფხულშიც გრილია და მწვანე, რაც ურეკის ცხელი
    პლაჟის შემდეგ სასიამოვნო კონტრასტია. ადგილობრივები აქ ჩაისა და თხილის პლანტაციებსაც უვლიან — ეს გურიის
    ტრადიციული სოფლის მეურნეობაა.
  tip: >-
    საუკეთესო დროა გვიანი გაზაფხულიდან შემოდგომამდე; ზამთარში აქ ნოტიოა და ცივი, გზა კი ზემოთ იკეტება.
    ვიზიტს ერთი-ორი საათი სჭირდება, ამიტომ მას სხვა გაჩერებასთან გააერთიანეთ. თუ ბახმაროსკენ მიდიხართ,
    სწორედ აქ ან ჩოხატაურში აავსეთ ბაკი — ზემოთ გასამართი აღარაა. ბანკომატი სოფელში არ არის, ნაღდი ფული
    წინასწარ აიღეთ. მობილური კავშირი ხეობაში ადგილ-ადგილ სუსტია, ოფლაინ რუკა გამოგადგებათ.
  route: >-
    თბილისიდან დაახლოებით 345 კმ და ხუთნახევარი საათია. E60-ით მიდიხართ ქუთაისისა და სამტრედიის გავლით,
    შემდეგ ჩოხატაურზე უხვევთ და იქიდან სამხრეთ-აღმოსავლეთით ხეობაში ადიხართ. ჩოხატაურიდან ნაბეღლავამდე
    დაახლოებით 20 კმ-ია; გზა ძირითადად ასფალტია, თუმცა ვიწრო და ადგილ-ადგილ დაზიანებული, ორმოებით. მშრალ
    ამინდში ეკონომ კლასიც გაივლის, მაგრამ მაღალი კლირენსის ავტომობილი აქ საგრძნობლად კომფორტულია. საწვავი
    ჩოხატაურში აავსეთ.
en:
  name: Nabeghlavi
  short: A mineral water village in the Guria foothills — springs, a green valley and the start of the
    Bakhmaro road.
  body: >-
    Nabeghlavi is a village in Chokhatauri municipality, in the foothills of Guria at roughly 480 metres.
    Its name is known across the country because of mineral water: the local spring is the source of one
    of Georgia's most widely sold table waters, and the bottling happens here.


    The village itself is compact and unassuming — a valley, a river, forested slopes and the water plant.
    There are two reasons a traveller stops here. The first is the water and the mild, humid foothill
    climate that established the place as a modest health and recreation destination. The second is location:
    Nabeghlavi sits naturally on the road toward Bakhmaro and is the last point where the road surface
    and the services are still normal.


    What you will find:


    - **The springs and bottling area**, the main local landmark

    - **Valley paths** for short walks through the forest

    - **The village centre** with small shops and family guesthouses


    This is not somewhere you would drive from Tbilisi specifically. It does fit logically into a Guria
    itinerary, though, particularly if you are continuing toward Bakhmaro or simply turning inland from
    the coast for an afternoon in the hills.
  tip: >-
    Late spring to autumn is the sensible window; winters here are damp and cold and the road higher up
    closes. A visit takes one to two hours, so pair it with another stop rather than treating it as a
    destination. If you are heading on to Bakhmaro, fill the tank here or in Chokhatauri — there is no
    fuel further up. There is no ATM in the village, so bring cash. Mobile coverage in the valley is uneven,
    and an offline map is useful.
  route: >-
    It is about 345 km and five and a half hours from Tbilisi. Take the E60 west through Kutaisi and Samtredia,
    then turn off toward Chokhatauri and climb south-east into the valley from there. Chokhatauri to Nabeghlavi
    is roughly 20 km on mostly asphalt road, though it is narrow and broken in places with potholes. An
    economy car will manage in dry weather, but a higher-clearance vehicle is noticeably more comfortable
    on this stretch. Fill up in Chokhatauri before turning inland.
ru:
  name: Набеглави
  short: Село минеральной воды в предгорьях Гурии — источники, зелёное ущелье и начало дороги на Бахмаро.
  body: >-
    Набеглави — село Чохатаурского муниципалитета в предгорьях Гурии, примерно на 480 метрах. Его название
    известно по всей стране благодаря минеральной воде: местный источник даёт одну из самых распространённых
    столовых вод Грузии, и разливают её именно здесь.


    Само село компактное и непритязательное: ущелье, река, покрытые лесом склоны и завод по розливу. Причин
    остановиться здесь две. Первая — сама вода и мягкий влажный предгорный климат, благодаря которому
    место сложилось как скромный лечебно-рекреационный пункт. Вторая — расположение: Набеглави естественно
    лежит на дороге в сторону Бахмаро и является последней точкой, где покрытие и сервис ещё нормальные.


    Что вы найдёте:


    - **Источники и зону розлива** — главную местную достопримечательность

    - **Тропы по ущелью** для коротких прогулок по лесу

    - **Центр села** с небольшими магазинами и семейными гостевыми домами


    Специально ехать сюда из Тбилиси не стоит. Зато в гурийский маршрут село вписывается логично — особенно
    если вы продолжаете путь к Бахмаро или просто сворачиваете с побережья вглубь, чтобы провести полдня
    в холмах.
  tip: >-
    Разумное окно — с поздней весны до осени; зимой здесь сыро и холодно, а дорога выше закрывается. На
    визит уходит один-два часа, поэтому объединяйте его с другой остановкой. Если едете дальше на Бахмаро,
    бак заправляйте здесь или в Чохатаури — выше топлива нет. Банкомата в селе нет, наличные возьмите
    заранее. Мобильная связь в ущелье местами слабая, офлайн-карта пригодится.
  route: >-
    От Тбилиси около 345 км и пять с половиной часов. По трассе E60 на запад через Кутаиси и Самтредиа,
    затем поворот на Чохатаури и подъём на юго-восток в ущелье. От Чохатаури до Набеглави примерно 20
    км по преимущественно асфальтовой дороге, но узкой и местами разбитой, с ямами. В сухую погоду проедет
    и машина эконом-класса, однако автомобиль с высоким клиренсом на этом участке заметно комфортнее.
    Заправляйтесь в Чохатаури перед поворотом вглубь.
fa:
  name: نابغلاوی
  short: روستای آب معدنی در دامنه‌های گوریا — چشمه‌ها، دره‌ای سرسبز و سرآغاز جادهٔ باخمارو.
  body: >-
    نابغلاوی روستایی است در شهرستان چوخاتاوری، در دامنه‌های گوریا و در ارتفاع حدود 480 متر. نامش در سراسر
    کشور به‌سبب آب معدنی شناخته شده است: چشمهٔ محلی سرچشمهٔ یکی از پرفروش‌ترین آب‌های سفرهٔ گرجستان است
    و بطری‌سازی هم همین‌جا انجام می‌شود.


    خود روستا جمع‌وجور و بی‌ادعا است — دره‌ای، رودخانه‌ای، دامنه‌های جنگلی و کارخانهٔ آب. مسافر به دو
    دلیل اینجا توقف می‌کند. نخست آب و اقلیم ملایم و مرطوب دامنه‌ها که این محل را به مقصدی متواضع برای
    سلامتی و آسودگی بدل کرده است. دوم موقعیت: نابغلاوی به‌طور طبیعی روی جادهٔ باخمارو نشسته و آخرین نقطه‌ای
    است که سطح جاده و خدمات در آن هنوز عادی‌اند.


    آنچه می‌یابید: **چشمه‌ها و محوطهٔ بطری‌سازی** که نشانهٔ اصلی محلی است؛ **مسیرهای درهٔ** مناسب پیاده‌روی‌های
    کوتاه در جنگل؛ و **مرکز روستا** با مغازه‌های کوچک و مهمان‌خانه‌های خانوادگی. این جایی نیست که به‌طور
    مشخص از تفلیس برایش رانندگی کنید. اما به‌روشنی در یک برنامهٔ گوریا جا می‌افتد، به‌ویژه اگر به سوی
    باخمارو ادامه می‌دهید یا فقط می‌خواهید بعدازظهری را از ساحل به سمت داخل و تپه‌ها بروید.
  tip: >-
    از اواخر بهار تا پاییز پنجرهٔ معقولی است؛ زمستان‌ها اینجا مرطوب و سرد است و جادهٔ بالادست بسته می‌شود.
    بازدید یک تا دو ساعت طول می‌کشد، پس آن را با توقفی دیگر جفت کنید نه اینکه مقصد بگیرید. اگر به باخمارو
    می‌روید، باک را همین‌جا یا در چوخاتاوری پر کنید — بالاتر سوختی نیست. در روستا خودپرداز نیست، پس پول
    نقد بیاورید. پوشش تلفن همراه در دره ناهموار است و نقشهٔ آفلاین به کار می‌آید.
  route: >-
    از تفلیس حدود 345 کیلومتر و پنج ساعت و نیم است. با E60 رو به غرب از کوتایسی و سامتردیا بروید، سپس
    به سوی چوخاتاوری منشعب شوید و از آنجا رو به جنوب‌شرق درون دره بالا بروید. از چوخاتاوری تا نابغلاوی
    تقریباً 20 کیلومتر است، بیشتر آسفالت، هرچند باریک و جاهایی با چاله شکسته. خودروی اقتصادی در هوای خشک
    از پس آن برمی‌آید، اما خودرویی با ارتفاع کف بیشتر در این مقطع به‌روشنی راحت‌تر است. پیش از پیچیدن
    به سمت داخل، در چوخاتاوری باک را پر کنید.
he:
  name: נבגלאווי
  short: כפר של מים מינרליים במורדות גוריה — מעיינות, עמק ירוק ותחילת הדרך לבחמארו.
  body: >-
    נבגלאווי הוא כפר במחוז צ'וחטאורי, במורדות ההרים של גוריה, בגובה של כ-480 מטר. שמו מוכר בכל רחבי המדינה
    בזכות המים המינרליים: המעיין המקומי הוא המקור לאחד ממי השולחן הנמכרים ביותר בגאורגיה, וגם ההשקיה לבקבוקים
    נעשית כאן במקום.


    הכפר עצמו קומפקטי וצנוע ואין בו הרבה מעבר לכמה רחובות — עמק, נחל, מדרונות מיוערים ומפעל המים שבמרכזם.
    יש שתי סיבות שבגללן מטייל עוצר כאן. הראשונה היא המים ואקלים המורדות המתון והלח, שהפך את המקום ליעד
    בריאות ונופש צנוע. השנייה היא המיקום: נבגלאווי יושב באופן טבעי על הדרך אל בחמארו והוא הנקודה האחרונה
    שבה מצב הכביש והשירותים עדיין נורמליים.


    מה שתמצאו כאן: **המעיינות ואזור הבקבוק**, שהם הציון המקומי המרכזי; **שבילי העמק** להליכות קצרות ביער;
    ו**מרכז הכפר** עם חנויות קטנות ובתי הארחה משפחתיים. זה אינו מקום שנוסעים אליו במיוחד מטביליסי, והמרחק
    אינו מצדיק זאת. הוא כן משתלב היטב במסלול גוריה, במיוחד אם אתם ממשיכים לעבר בחמארו או פשוט פונים מהחוף
    פנימה אל הגבעות לאחר צהריים אחד.
  tip: >-
    מסוף האביב ועד הסתיו זהו החלון ההגיוני; החורף כאן לח וקר והדרך שמעלה נסגרת. הביקור אורך שעה עד שעתיים,
    לכן שלבו אותו עם עצירה נוספת במקום להתייחס אליו כאל יעד. אם אתם ממשיכים לבחמארו, מלאו דלק כאן או בצ'וחטאורי
    — למעלה אין תחנות כלל. בכפר אין כספומט, אז הביאו מזומן. הקליטה הסלולרית בעמק אינה אחידה, ומפה במצב
    לא מקוון תועיל מאוד.
  route: >-
    מטביליסי מדובר בכ-345 ק"מ ובחמש שעות וחצי. סעו בכביש E60 מערבה דרך קוטאיסי וסמטרדיה, ואז פנו לכיוון
    צ'וחטאורי וטפסו משם דרום-מזרחה אל תוך העמק. מצ'וחטאורי לנבגלאווי מדובר בכ-20 ק"מ של כביש אספלט ברובו,
    אם כי צר ושבור במקומות עם בורות. רכב חסכוני יסתדר במזג אוויר יבש, אבל רכב עם גובה גחון גדול יותר נוח
    בהרבה בקטע הזה. תדלקו בצ'וחטאורי לפני שאתם פונים פנימה אל העמק.
ar:
  name: نابيغلافي
  short: قرية المياه المعدنية في سفوح غوريا — ينابيع ووادٍ أخضر وبداية طريق باخمارو.
  body: >-
    نابيغلافي قرية في بلدية تشوخاتاوري، في سفوح غوريا على ارتفاع نحو 480 متراً. واسمها معروف في أنحاء
    البلاد بفضل المياه المعدنية: فالنبع المحلي هو مصدر واحدة من أكثر مياه المائدة مبيعاً في جورجيا، وتعبئتها
    تجري هنا في الموقع نفسه.


    أما القرية فصغيرة متواضعة ولا تزيد على بضعة شوارع — وادٍ ونهر ومنحدرات مكسوة بالغابات ومصنع المياه
    في وسطها. وهناك سببان يجعلان المسافر يتوقف هنا. الأول هو الماء ومناخ السفوح المعتدل الرطب، وهو ما
    رسّخ المكان وجهةً متواضعة للاستشفاء والاستجمام. والثاني هو الموقع: فنابيغلافي تقع طبيعياً على الطريق
    نحو باخمارو، وهي آخر نقطة يبقى فيها سطح الطريق والخدمات على حالهما الطبيعي.


    وما ستجده هنا: **الينابيع ومنطقة التعبئة**، وهي المَعلم المحلي الأبرز؛ و**دروب الوادي** لنزهات قصيرة
    في الغابة؛ و**مركز القرية** بمتاجره الصغيرة وبيوت الضيافة العائلية. وهذا ليس مكاناً تقود إليه من تبليسي
    خصيصاً، فالمسافة لا تبرر ذلك. لكنه يندرج منطقياً في برنامج لغوريا، خصوصاً إن كنت متجهاً إلى باخمارو
    أو كنت تنعطف من الساحل نحو الداخل لقضاء أصيل في التلال.
  tip: >-
    من أواخر الربيع إلى الخريف هي النافذة المعقولة؛ فالشتاء هنا رطب وبارد والطريق الأعلى يُغلق. تستغرق
    الزيارة ساعة إلى ساعتين، لذا اجمعها مع محطة أخرى بدل أن تعاملها كوجهة قائمة بذاتها. وإن كنت متجهاً
    إلى باخمارو، فاملأ الخزان هنا أو في تشوخاتاوري — فلا وقود في الأعلى. ولا يوجد صراف آلي في القرية،
    فاحمل نقداً. وتغطية الهاتف في الوادي متفاوتة، وخريطة تعمل دون إنترنت مفيدة جداً.
  route: >-
    المسافة من تبليسي نحو 345 كم وخمس ساعات ونصف. اسلك الطريق E60 غرباً عبر كوتايسي وسامتريديا، ثم انعطف
    نحو تشوخاتاوري واصعد من هناك جنوباً شرقاً إلى داخل الوادي. ومن تشوخاتاوري إلى نابيغلافي نحو 20 كم
    على طريق معبّد في معظمه، وإن كان ضيقاً ومتصدعاً في مواضع بالحفر. وسيارة اقتصادية تتدبر الأمر في الطقس
    الجاف، لكن مركبة أعلى خلوصاً أريح بوضوح في هذا المقطع. املأ الخزان في تشوخاتاوري قبل الانعطاف نحو
    الداخل.
