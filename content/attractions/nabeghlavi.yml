ka:
  name: ნაბეღლავი
  short: >-
    გურიის ხეობის სოფელი, საიდანაც საქართველოს წამყვანი მინერალური წყალი მოდის — წყარო, რომელსაც, გადმოცემით,
    1905 წელს კამეჩებმა მიაგნეს.
  body: >-
    **ქიმიკოსებამდე დიდი ხნით ადრე ნაბეღლავის კამეჩებს არჩევანი უკვე გაკეთებული ჰქონდათ: გადმოცემით, ისინი
    ხეობაში სულ ერთსა და იმავე წყაროსთან მიდიოდნენ, 1905 წელს კი მათ კვალს სოფლელებიც მიჰყვნენ.**


    ნაბეღლავი ჩოხატაურის მუნიციპალიტეტის სოფელია, ჩოხატაურიდან ბახმაროს გზით დაახლოებით ოცი კილომეტრის
    ზემოთ, იქ, სადაც გურიის მთისწინეთის ტყიანი ფერდობები მდინარეს ვიწროდ შემოერტყმის. კამეჩების ნაპოვნი
    წყალი, მწარმოებლის ცნობით, ორიდან სამ კილომეტრამდე სიღრმეზე ყალიბდება და ზედაპირზე ბუნებრივად გაზიანი
    ამოდის, საკუთარი ნახშირორჟანგით. ეს ჰიდროკარბონატულ-ნატრიუმიანი წყალია — ყოველ ლიტრში სამნახევრიდან
    თითქმის ექვს გრამამდე მინერალით; ამიტომაცაა, რომ პირველ ყლუპს მსუბუქად მარილიანი, სოდისებრი გემო დაჰკრავს.


    მეცნიერება აუჩქარებლად მოვიდა. 1921 წელს წყლის პირველი ქიმიური ანალიზი ლატვიელმა მეცნიერმა რობერტ
    კუპცისმა ჩაატარა, რომელმაც სიცოცხლის დიდი ნაწილი საქართველოში გაატარა; 1930-იან წლებში ჰიდროგეოლოგებიც
    ჩამოვიდნენ. წყაროსთან საკურორტო ადგილი ჩამოყალიბდა, 1958 წელს კი ჩამოსხმა დაიწყო — მოკრძალებულად,
    მცირე ბაზრისთვის. ნამდვილი გარდატეხა 1997 წლის შემდეგ მოხდა, როცა საქმე ქართულ-შვეიცარულმა კომპანია
    „ჰელთი ვოთერმა“ ჩაიბარა. ნაბეღლავი ქართული მინერალური წყლების ბაზრის ლიდერი გახდა, უცხოეთში მცხოვრები
    ქართველებისთვის კი — სახლის გემო.


    დღეს აქ ყველაფერი უბრალო და გულწრფელია: მდინარე, ციცაბო მწვანე ფერდობები, ხეობაში ჩამოსხმის ქარხანა
    და ბახმაროს გზისპირას წყაროზე დადგმული ბეტონის უბრალო ნაგებობა, სადაც წყალს სათავესთანვე დალევთ —
    პირდაპირ მიწიდან ამოსულს, რომლის გაზიც ენას ნემსივით უჩხვლეტს.


    ერთი დღე აქ არ დაგჭირდებათ. მაგრამ გაჩერდით, ბოთლი შეავსეთ — და როცა შემდეგ თბილისში ოფიციანტი მაგიდაზე
    ნაბეღლავს დაგიდგამთ, ზუსტად გეცოდინებათ, რომელი ხეობიდან მოვიდა.
  tip: >-
    ჩამოსვლა გვიანი გაზაფხულიდან შემოდგომამდე ღირს; ზამთარი აქ ნოტიო და ცივია, ბახმაროსკენ ზემოთ გზა კი
    იკეტება. ნაბეღლავს ერთი საათი ეყოფა, ამიტომ ბახმაროს გზას ან ახლომდებარე ზოტს დაუკავშირეთ. წყაროსთვის
    ცარიელი ბოთლი წაიღეთ. საწვავი ჩოხატაურში ჩაასხით — ხეობაში ზემოთ ბენზინგასამართზე ნუ დაიმედდებით;
    ნაღდი ფულიც თან იქონიეთ, სოფელში ბანკომატი არ არის. ფერდობებს შორის მობილური კავშირი ხან ქრება, ამიტომ
    ოფლაინ რუკა წინასწარ ჩამოტვირთეთ. ნაბეღლავს პატარა მუზეუმიც აქვს — ადგილზე იკითხეთ, ღიაა თუ არა.
  route: >-
    თბილისიდან დაახლოებით 310 კმ-ია, გზას ხუთ საათზე ცოტა მეტი დასჭირდება. ს1 (E60) მაგისტრალით დასავლეთისკენ,
    ხაშურის, რიკოთის მონაკვეთისა და ქუთაისის გავლით სამტრედიამდე მიდიხართ. სამტრედიის შემდეგ ს12-იდან
    შ2 გზაზე გადადიხართ და საჯავახოს გავლით ჩოხატაურამდე დაახლოებით 18 კმ-ს გადიხართ. ჩოხატაურში შ81 გზას
    (ჩოხატაური–ბახმარო) დაადექით და ხეობას დაახლოებით 20 კმ აუყევით ნაბეღლავამდე. ეს ბოლო მონაკვეთი ძირითადად
    ასფალტია, მაგრამ ვიწრო და ორმოებიანი. მშრალ ამინდში ეკონომკლასის მანქანაც გაივლის, თუმცა მაღალი კლირენსის
    ავტომობილი აქ საგრძნობლად კომფორტულია; სოფლის იქით, ბახმაროსკენ, ძველი ასფალტი ორმოებად და ხრეშად
    იშლება და ნამდვილ გზაგარეშე ავტომობილს მოითხოვს. საწვავი ჩოხატაურში შეავსეთ.
en:
  name: Nabeghlavi
  short: >-
    The Gurian valley village behind Georgia's market-leading mineral water: a spring found in 1905, tradition
    says, by buffalo who knew better.
  body: >-
    **Long before any chemist tested it, the buffalo of Nabeghlavi had made up their minds: tradition
    says they kept wandering to one particular spring in the valley, and in 1905 the villagers followed
    them.**


    Nabeghlavi is a village in Chokhatauri municipality, some twenty kilometres up the Bakhmaro road from
    Chokhatauri, where the wooded slopes of the Gurian foothills close in around the river. The water
    the buffalo found forms, its producers say, two to three kilometres underground and rises naturally
    sparkling with its own carbon dioxide. It is a sodium bicarbonate water, carrying between three and
    a half and almost six grams of minerals in every litre — which is why the first sip tastes faintly
    of salt and soda.


    Science took its time. In 1921 the Latvian scientist Roberts Kupcis, who spent most of his life in
    Georgia, made the first chemical analysis; hydrogeologists followed in the 1930s. A health resort
    grew up around the spring, and bottling began in 1958 — modestly, for a small market. The real change
    came after 1997, when the Georgian-Swiss company Healthy Water took over. Nabeghlavi became the leader
    of the Georgian mineral-water market and, for Georgians abroad, a taste of home.


    What you find today is plain and honest: a river, steep green slopes, the bottling plant in the valley
    and a simple concrete spring house beside the Bakhmaro road, where you can drink the water at its
    source, straight from the ground and prickling with gas.


    It will not fill a day. But stop, fill a bottle, and the next time a waiter in Tbilisi sets a Nabeghlavi
    on your table, you will know exactly which valley it came from.
  tip: >-
    Come between late spring and autumn; winters are damp and cold, and the road higher up towards Bakhmaro
    closes. An hour is enough, so pair Nabeghlavi with the drive to Bakhmaro or with nearby Zoti. Bring
    an empty bottle for the spring. Fill the tank in Chokhatauri — do not count on fuel further up the
    valley — and carry cash, as there is no ATM in the village. Mobile signal comes and goes between the
    slopes, so download an offline map before you set off. There is also a small Nabeghlavi museum; ask
    locally whether it is open.
  route: >-
    From Tbilisi it is about 310 km; allow a little over five hours. Take the S1 (E60) west past Khashuri,
    through the Rikoti section and past Kutaisi to Samtredia. Beyond Samtredia leave the S12 for the Sh2
    and follow it through Sajavakho to Chokhatauri, about 18 km. In Chokhatauri turn onto the Sh81, the
    Chokhatauri–Bakhmaro road, and climb some 20 km up the valley to Nabeghlavi. This last stretch is
    mostly asphalt but narrow and potholed. An economy car will make it in dry weather, yet an SUV's clearance
    is noticeably kinder here; beyond the village, towards Bakhmaro, the old asphalt breaks up into potholes
    and gravel and needs a proper off-roader. Fill up in Chokhatauri.
ru:
  name: Набеглави
  short: >-
    Гурийское село в долине, давшее имя минеральной воде № 1 в Грузии: источник, который, по преданию,
    в 1905 году нашли буйволы, знавшие толк в этом деле.
  body: >-
    **Задолго до того, как какой-либо химик её проверил, буйволы Набеглави уже всё решили сами: по преданию,
    они упорно возвращались к одному и тому же источнику в долине, и в 1905 году сельчане пошли за ними.**


    Набеглави — село в муниципалитете Чохатаури, примерно в двадцати километрах вверх по дороге на Бахмаро
    от Чохатаури, там, где лесистые склоны гурийских предгорий тесно обступают речку. Вода, которую нашли
    буйволы, формируется, по словам производителя, на глубине двух-трёх километров и естественным образом
    выходит на поверхность, уже насыщенная собственным углекислым газом. Это гидрокарбонатная натриевая
    вода с содержанием минералов от трёх с половиной до почти шести граммов на литр — вот почему первый
    глоток отдаёт лёгкой солью и содой.


    Наука не спешила. В 1921 году латвийский учёный Робертс Купцис, проведший большую часть жизни в Грузии,
    сделал первый химический анализ; в 1930-х годах за ним последовали гидрогеологи. Вокруг источника
    вырос курорт, а в 1958 году начался розлив — скромный, для небольшого рынка. Настоящая перемена наступила
    после 1997 года, когда дело взяла в свои руки грузино-швейцарская компания Healthy Water. Набеглави
    стало лидером грузинского рынка минеральной воды, а для грузин за границей — вкусом дома.


    Сегодня здесь всё простое и честное: река, крутые зелёные склоны, разливочный завод в долине и простой
    бетонный домик над источником у дороги на Бахмаро, где можно выпить воду прямо у истока — прямо из
    земли, покалывающую газом.


    На целый день это не растянуть. Но остановитесь, наполните бутылку — и в следующий раз, когда официант
    в Тбилиси поставит перед вами «Набеглави», вы точно будете знать, из какой долины она пришла.
  tip: >-
    Приезжайте с конца весны до осени; зимой здесь влажно и холодно, а дорога выше, к Бахмаро, закрывается.
    Часа достаточно, так что совместите Набеглави с поездкой на Бахмаро или с близким Зоти. Возьмите с
    собой пустую бутылку для источника. Заправьтесь в Чохатаури — дальше вверх по долине на заправку не
    рассчитывайте — и держите при себе наличные, банкомата в селе нет. Мобильная связь среди склонов то
    есть, то нет, так что скачайте офлайн-карту перед выездом. Здесь также есть небольшой музей Набеглави
    — спросите на месте, открыт ли он.
  route: >-
    Из Тбилиси около 310 км; дорога займёт чуть больше пяти часов. Двигайтесь по S1 (E60) на запад через
    Хашури, Рикотский участок и Кутаиси до Самтредиа. За Самтредиа сверните с S12 на Sh2 и следуйте по
    ней через Саджавахо до Чохатаури — около 18 км. В Чохатаури поверните на Sh81, дорогу Чохатаури–Бахмаро,
    и поднимитесь около 20 км по долине до Набеглави. Этот последний участок в основном асфальтирован,
    но узкий и в выбоинах. Машина эконом-класса проедет в сухую погоду, но с высоким клиренсом кроссовера
    здесь заметно спокойнее; за селом, к Бахмаро, старый асфальт распадается на выбоины и гравий, и нужен
    настоящий внедорожник. Заправьтесь в Чохатаури.
fa:
  name: نابِغلاوی
  short: >-
    روستایی در دره‌ای از گوریا، خاستگاه پرفروش‌ترین آب معدنی گرجستان: چشمه‌ای که، به‌روایتی، در ۱۹۰۵ گاومیش‌هایی
    یافتند که بهتر می‌دانستند.
  body: >-
    **مدت‌ها پیش از آنکه شیمی‌دانی آن را بیازماید، گاومیش‌های نابِغلاوی تصمیم خود را گرفته بودند: به‌روایتی،
    آن‌ها پیوسته به یک چشمهٔ خاص در دره می‌رفتند، و در ۱۹۰۵ روستاییان از پی آن‌ها رفتند.**


    نابِغلاوی روستایی است در شهرستان چوخاتائوری، در حدود بیست کیلومتری بالادست راه باخمارو از چوخاتائوری،
    جایی که دامنه‌های جنگلی کوهپایه‌های گوریا گرداگرد رودخانه تنگ می‌شوند. آبی که گاومیش‌ها یافتند، به‌گفتهٔ
    تولیدکنندگانش، در عمق دو تا سه کیلومتری زمین شکل می‌گیرد و به‌طور طبیعی، گازدار با دی‌اکسید کربن خود،
    بالا می‌آید. این آبی بی‌کربناتِ سدیمی است، با سه‌ونیم تا نزدیک شش گرم مواد معدنی در هر لیتر — از همین
    رو نخستین جرعه طعمی ملایم از نمک و سودا دارد.


    علم دیر جنبید. در ۱۹۲۱ رابرتس کوپتسیس، دانشمند لتونیایی که بیشتر عمرش را در گرجستان گذراند، نخستین
    آزمایش شیمیایی را انجام داد؛ آب‌زمین‌شناسان در دههٔ ۱۹۳۰ از پی آن آمدند. استراحتگاهی درمانی گرداگرد
    چشمه شکل گرفت، و در ۱۹۵۸ بطری‌کردن آغاز شد — در مقیاسی اندک، برای بازاری کوچک. تغییر واقعی پس از ۱۹۹۷
    رخ داد، آنگاه که شرکت گرجی-سوئیسی «هلتی واتر» آن را در دست گرفت. نابِغلاوی به پیشتاز بازار آب معدنی
    گرجستان بدل شد، و برای گرجیان در خارج، طعمی از خانه.


    آنچه امروز می‌یابید ساده و صادق است: رودخانه‌ای، دامنه‌های سبز پرشیب، کارخانهٔ بطری‌سازی در دره، و
    اتاقک بتنی ساده‌ای بر سر چشمه کنار راه باخمارو، جایی که می‌توانید آب را در سرچشمه‌اش بنوشید — راست
    از زمین، با گزگزی از گاز.


    روزی کامل را پر نمی‌کند. اما بایستید، بطری‌ای پر کنید — و دفعهٔ بعد که پیشخدمتی در تفلیس نابِغلاوی‌ای
    بر میزتان می‌گذارد، دقیقاً خواهید دانست از کدام دره آمده است.
  tip: >-
    از اواخر بهار تا پایان پاییز بیایید؛ زمستان‌ها اینجا مرطوب و سردند، و راه بالاتر به‌سوی باخمارو بسته
    می‌شود. یک ساعت کافی است، پس نابِغلاوی را با سفر به باخمارو یا با زوتیِ نزدیک همراه کنید. بطری خالی‌ای
    برای چشمه همراه بیاورید. باک را در چوخاتائوری پر کنید — روی سوخت در بالای دره حساب نکنید — و پول نقد
    همراه داشته باشید، چرا که در روستا خودپردازی نیست. سیگنال موبایل میان دامنه‌ها می‌آید و می‌رود، پس
    پیش از حرکت نقشه‌ای آفلاین بارگیری کنید. موزهٔ کوچکی هم از نابِغلاوی هست؛ در محل بپرسید که باز است
    یا نه.
  route: >-
    از تفلیس نزدیک به ۳۱۰ کیلومتر است؛ کمی بیش از پنج ساعت زمان بگیرید. از S1 (E60) به سوی غرب، از خاشوری،
    بخش ریکوتی و کوتایسی گذشته، تا سامتردیا برانید. پس از سامتردیا از S12 به Sh2 بروید و از آن، از میان
    ساجاواخو، تا چوخاتائوری — نزدیک به ۱۸ کیلومتر — دنبال کنید. در چوخاتائوری به Sh81، راه چوخاتائوری–باخمارو،
    بپیچید و نزدیک به ۲۰ کیلومتر از دره بالا بروید تا نابِغلاوی. این بخش پایانی بیشتر آسفالت است اما باریک
    و چاله‌دار. خودرویی اقتصادی در هوای خشک از پس آن برمی‌آید، اما فاصلهٔ کف یک خودروی شاسی‌بلند از زمین
    اینجا کار را به‌روشنی آسان‌تر می‌کند؛ فراسوی روستا، به‌سوی باخمارو، آسفالت کهنه به چاله و شن‌ریزه
    بدل می‌شود و به خودرویی واقعاً آفرود نیاز دارد. در چوخاتائوری سوخت‌گیری کنید.
he:
  name: נבגלאווי
  short: >-
    כפר בעמק בגוריה, ביתם של המים המינרליים המובילים בשוק הגאורגי: מעיין שנמצא ב־1905, כך אומרת המסורת,
    בידי תאואים שידעו טוב יותר.
  body: >-
    **הרבה לפני שכימאי כלשהו בדק את המים, התאואים של נבגלאווי כבר החליטו בעצמם: המסורת מספרת שהם המשיכו
    לנדוד למעיין מסוים אחד בעמק, וב־1905 הכפריים הלכו בעקבותיהם.**


    נבגלאווי הוא כפר במחוז צ'וחטאורי, כעשרים קילומטרים במעלה כביש בחמארו מצ'וחטאורי, במקום שבו המדרונות
    המיוערים של רגלי ההרים הגוריאניים סוגרים על הנהר. המים שהתאואים מצאו נוצרים, לפי היצרן, בעומק של שניים
    עד שלושה קילומטרים מתחת לאדמה, ועולים באופן טבעי מוגזים בפחמן דו־חמצני משלהם. אלה מים ביקרבונטיים־נתרניים,
    הנושאים בין שלושה וחצי לכמעט שישה גרם מינרלים לכל ליטר — ומכאן שהלגימה הראשונה מותירה טעם מלוח וגזוזי
    קלוש.


    המדע לא מיהר. ב־1921 ביצע המדען הלטבי רוברטס קופציס, שחלק גדול מחייו העביר בגאורגיה, את הניתוח הכימי
    הראשון; הידרוגאולוגים המשיכו בשנות ה־1930. אתר מרפא צמח סביב המעיין, וביקבוק המים החל ב־1958 — בצנעה,
    לשוק קטן. השינוי האמיתי הגיע אחרי 1997, כשהחברה הגאורגית-שווייצרית "הלתי ווטר" נטלה את העניינים בידיה.
    המותג נבגלאווי הפך למוביל שוק המים המינרליים בגאורגיה, ולגאורגים בתפוצות — טעם של בית.


    מה שמוצאים כאן היום פשוט וישר: נהר, מדרונות ירוקים תלולים, מפעל הביקבוק בעמק, ובית מעיין פשוט מבטון
    לצד כביש בחמארו, שבו אפשר לשתות את המים במקורם — ישר מהאדמה, עוקצני מגז.


    זה לא ימלא יום שלם. אבל תעצרו, תמלאו בקבוק, ובפעם הבאה שמלצר בטביליסי יניח בקבוק נבגלאווי על השולחן
    שלכם, תדעו בדיוק מאיזה עמק הוא הגיע.
  tip: >-
    בואו בין סוף האביב לסתיו; החורפים כאן לחים וקרים, והכביש שעולה משם לכיוון בחמארו נסגר. שעה מספיקה,
    אז שלבו את נבגלאווי עם הנסיעה לבחמארו או עם זוטי הקרובה. הביאו בקבוק ריק למעיין. תדלקו בצ'וחטאורי
    — אל תסמכו על תדלוק גבוה יותר בעמק — והחזיקו מזומן, שכן אין כספומט בכפר. הקליטה הסלולרית מגיעה והולכת
    בין המדרונות, אז הורידו מפה לא מקוונת לפני היציאה. יש גם מוזיאון קטן של נבגלאווי; שאלו במקום אם הוא
    פתוח.
  route: >-
    מטביליסי כ-310 ק"מ; הקצו קצת יותר מחמש שעות. סעו ב-S1 (E60) מערבה, דרך חשורי וקטע ריקוטי, על פני קוטאיסי,
    עד סמטרדיה. מעבר לסמטרדיה עברו מ-S12 ל-Sh2 והמשיכו בה דרך סג'אווחו עד צ'וחטאורי, כ-18 ק"מ. בצ'וחטאורי
    פנו ל-Sh81, כביש צ'וחטאורי–בחמארו, וטפסו כ-20 ק"מ במעלה העמק עד נבגלאווי. הקטע האחרון הזה הוא ברובו
    אספלט אך צר ומלא מכתשים. רכב חסכוני יגיע במזג אוויר יבש, אך מרווח הגחון של רכב שטח מקל כאן באופן ניכר;
    מעבר לכפר, לכיוון בחמארו, האספלט הישן מתפורר למהמורות וחצץ ומצריך רכב שטח של ממש. תדלקו בצ'וחטאורי.
ar:
  name: نابيغلافي
  short: >-
    قرية في وادٍ من غوريا، منبع المياه المعدنية الأولى في السوق الجورجية: نبعٌ عثرت عليه، بحسب التقليد،
    جواميس عام 1905 كانت أعلم من غيرها.
  body: >-
    **قبل أن يفحصها أي كيميائي بزمن طويل، كانت جواميس نابيغلافي قد بتّت أمرها: يقول التقليد إنها ظلّت
    تتردد إلى نبع معيّن في الوادي، وفي عام 1905 تبعها القرويون.**


    نابيغلافي قرية في بلدية تشوخاتاوري، على نحو عشرين كيلومترًا صعودًا على طريق باخمارو من تشوخاتاوري،
    حيث تضيق المنحدرات الحرجية لسفوح غوريا حول النهر. الماء الذي عثرت عليه الجواميس يتشكل، بحسب المصنّعين،
    على عمق كيلومترين إلى ثلاثة تحت الأرض، ويرتفع طبيعيًا فوّارًا بغاز ثاني أكسيد الكربون الخاص به. وهو
    ماء بيكربونات الصوديوم، يحمل ما بين ثلاثة غرامات ونصف وستة غرامات تقريبًا من المعادن في كل لتر — ولهذا
    تحمل الجرعة الأولى نكهة خفيفة من الملح والصودا.


    لم يتسرّع العلم. في عام 1921 أجرى العالم اللاتفي روبرتس كوبتسيس، الذي عاش معظم حياته في جورجيا، أول
    تحليل كيميائي؛ وتبعه علماء المياه الجوفية في الثلاثينيات. نشأ منتجع صحي حول النبع، وبدأت التعبئة في
    زجاجات عام 1958 — بتواضع، لسوق صغيرة. جاء التغيير الحقيقي بعد عام 1997، حين تولّت الأمر الشركة الجورجية
    السويسرية «هيلثي ووتر». أصبحت نابيغلافي رائدة سوق المياه المعدنية في جورجيا، وبالنسبة للجورجيين في
    الخارج، نكهة الوطن.


    ما تجدونه اليوم بسيط وصادق: نهر، ومنحدرات خضراء حادة، ومصنع التعبئة في الوادي، وبيت نبع خرساني بسيط
    قرب طريق باخمارو، حيث يمكنكم شرب الماء من مصدره مباشرة — من الأرض ذاتها، يوخز بالغاز.


    لن يملأ يومًا كاملًا. لكن توقّفوا، واملؤوا زجاجة — وفي المرة القادمة التي يضع فيها نادل في تبليسي
    زجاجة نابيغلافي على طاولتكم، ستعرفون تمامًا من أي وادٍ أتت.
  tip: >-
    تعالوا بين أواخر الربيع والخريف؛ فالشتاء هنا رطب وبارد، ويُغلق الطريق الأعلى نحو باخمارو. تكفي ساعة،
    فادمجوا زيارة نابيغلافي مع الطريق إلى باخمارو أو مع زوتي القريبة. احملوا زجاجة فارغة للنبع. عبّئوا
    الخزان في تشوخاتاوري — لا تعتمدوا على الوقود أعلى الوادي — واحملوا نقدًا، فلا يوجد صراف آلي في القرية.
    تأتي إشارة الهاتف وتذهب بين المنحدرات، فحمّلوا خريطة غير متصلة بالإنترنت قبل الانطلاق. هناك أيضًا
    متحف صغير لنابيغلافي؛ اسألوا الأهالي إن كان مفتوحًا.
  route: >-
    من تبليسي نحو 310 كم؛ خصصوا أكثر من خمس ساعات بقليل. اتخذوا الطريق S1 (E60) غربًا عبر خاشوري وقطاع
    ريكوتي، مرورًا بكوتايسي حتى سامتريديا. بعد سامتريديا غادروا الطريق S12 إلى Sh2 واتبعوه عبر ساجافاخو
    حتى تشوخاتاوري، نحو 18 كم. في تشوخاتاوري انعطفوا إلى الطريق Sh81، طريق تشوخاتاوري–باخمارو، واصعدوا
    نحو 20 كم في الوادي حتى نابيغلافي. هذا المقطع الأخير معبّد في معظمه لكنه ضيق ومليء بالحفر. تستطيع
    سيارة اقتصادية اجتيازه في الطقس الجاف، لكن الخلوص الأرضي المرتفع لسيارة رباعية الدفع يريحكم هنا كثيرًا؛
    وبعد القرية، نحو باخمارو، يتفتت الأسفلت القديم إلى حفر وحصى، ويحتاج الطريق سيارة دفع رباعي حقيقية.
    تزوَّدوا بالوقود في تشوخاتاوري.
