ka:
  name: ნიკორწმინდის ტაძარი
  short: XI საუკუნის ტაძარი უმდიდრესი ქვის ჩუქურთმითა და გვიანი შუა საუკუნეების ფრესკებით.
  body: >
    ნიკორწმინდა ამბროლაურამდე ცამეტიოდე კილომეტრში, პატარა სოფელში დგას და რაჭის მთავარ ისტორიულ ძეგლად
    ითვლება. ტაძარი 1010–1014 წლებში ბაგრატ III-ის დროს აშენდა — იმავე პერიოდში, როცა გაერთიანებული სამეფო
    თავის მთავარ ეკლესიებს აგებდა.


    ნიკორწმინდის მთავარი ღირსება **ფასადის ქვის ჩუქურთმაა**. კარნიზები, სარკმლების ჩარჩოები და გუმბათის
    ყელი მთლიანად დაფარულია რელიეფური მოჩუქურთმებით: გეომეტრიული ორნამენტი, ვაზის ხვეული, ცხოველთა და
    ადამიანთა ფიგურები, მოციქულები. ქართული შუა საუკუნეების არქიტექტურაში ეს დეკორის სიმჭიდროვით ერთ-ერთი
    უმდიდრესი ნიმუშია და მასზე ახლოდან თვალიერება ცალკე დროს მოითხოვს.


    შიგნით XVI–XVII საუკუნეების მოხატულობაა, საკმაოდ კარგად შემონახული. სამრეკლო გვიანდელია, XIX საუკუნისა.


    რაზე გაამახვილო ყურადღება:


    - ჩრდილოეთისა და დასავლეთის ფასადების რელიეფები

    - გუმბათის ყელის ჩუქურთმა და სარკმლების ჩარჩოები

    - ინტერიერის ფრესკები საკურთხეველსა და გუმბათქვეშა სივრცეში


    ტაძარი მოქმედია და ღიაა თითქმის ყოველთვის. **ის საქართველოს იუნესკოს წინასწარ ნუსხაშია**, თუმცა მსოფლიო
    მემკვიდრეობის სიაში შეტანილი ჯერ არ არის. ვიზიტი ორმოცდაათ წუთს იკავებს და რაჭაში შესვლისას პირველი
    გაჩერებაა.


    ნიკორწმინდის შემდეგ რაჭაში შესვლა ბუნებრივად გრძელდება ამბროლაურისკენ, სადაც ხვანჭკარის მარნებია.
    სწორედ ამ მხარეში მოჰყავთ ალექსანდროული და მუჯურეთული — ჯიშები, რომლებისგანაც ხვანჭკარა მზადდება.
    მარნები დეგუსტაციას ჩვეულებრივ წინასწარი შეთანხმებით სთავაზობენ სტუმრებს.
  tip: >
    მოქმედი ტაძარია: ქალებს თავსაფარი და გრძელი კაბა სჭირდებათ, მამაკაცებს — გრძელი შარვალი. ჩუქურთმის
    დასათვალიერებლად შუადღე ნაკლებად გამოდგება; დილის ან საღამოს გვერდითი შუქი რელიეფს ბევრად უკეთ ავლენს.
    ტაძრის შიგნით ბნელა და თვალს შეგუება სჭირდება. მანქანა ეზოს წინ დატოვე. ტუალეტი მარტივია, კაფე და
    ბანკომატი — ამბროლაურში, ცამეტ კილომეტრში. ტაძრის ეზოში ჩრდილი მცირეა და ზაფხულის შუადღე მოუხერხებელია
    როგორც ფოტოსთვის, ისე ლოდინისთვის.
  route: >
    თბილისიდან E60-ით ქუთაისის მიმართულებით მიდიხარ, შემდეგ ჩრდილოეთით უხვევ ტყიბულზე და მთის გზით რაჭაში
    ადიხარ; ნიკორწმინდა ამბროლაურამდე ცოტა ადრეა, გზის პირას. სულ დაახლოებით სამასი კილომეტრი და ხუთი
    საათი. ასფალტი ბოლომდეა, მაგრამ ბოლო სამოცი კილომეტრი ვიწრო, კლდეში გამოკვეთილი და მოხვევებიანია —
    ორი მანქანის გაშორება ყურადღებას ითხოვს. ზამთარში ეს მონაკვეთი მოყინულია. საწვავი ქუთაისში ან ტყიბულში
    აავსე. ამბროლაურში სასტუმროებია და რაჭაში ღამის გათევა თითქმის ყოველთვის ჯობია ერთდღიან გასვლას.
en:
  name: Nikortsminda Cathedral
  short: An 11th-century cathedral covered in exceptional stone carving, with late medieval frescoes inside.
  body: >-
    Nikortsminda stands in a small village about thirteen kilometres before Ambrolauri and is regarded
    as the principal historic monument of Racha. The cathedral was built between 1010 and 1014 under Bagrat
    III, in the same wave of construction that produced the great churches of the newly united kingdom.


    What sets Nikortsminda apart is **the stone carving on its facades**. Cornices, window frames and
    the drum of the dome are covered in relief work: geometric ornament, vine scrolls, animal and human
    figures, apostles. In terms of sheer density of decoration it is among the richest examples in medieval
    Georgian architecture, and it deserves time spent looking closely rather than a glance from the gate.


    Inside are wall paintings of the 16th and 17th centuries, remarkably well preserved. The bell tower
    is a later addition from the 19th century.


    Worth looking for:


    - the reliefs on the north and west facades

    - the carved drum of the dome and the window surrounds

    - the interior frescoes in the sanctuary and under the dome


    The cathedral is active and open almost all the time. **It sits on Georgia's UNESCO tentative list**,
    but is not inscribed on the World Heritage List. A visit takes about fifty minutes and makes the natural
    first stop on entering Racha.
  tip: >-
    This is a working church: women need a headscarf and long skirt, men long trousers. Midday is the
    worst time for the carving — low side light in the morning or late afternoon brings out the relief
    far better. The interior is dark and your eyes need a few minutes to adjust before the frescoes read
    properly. Park in front of the yard. Toilets are basic; the nearest cafe and ATM are in Ambrolauri,
    thirteen kilometres on.
  route: >-
    From Tbilisi take the E60 towards Kutaisi, then turn north through Tkibuli and climb the mountain
    road into Racha; Nikortsminda sits right by the road shortly before Ambrolauri. Around 300 km and
    five hours in total. Asphalt runs the whole way, but the last sixty kilometres are narrow, cut into
    rock and full of bends where passing an oncoming car takes attention. In winter this section ices
    over. Fill up in Kutaisi or Tkibuli, as options thin out beyond.
ru:
  name: Собор Никорцминда
  short: Собор XI века с исключительной каменной резьбой и фресками позднего Средневековья.
  body: >
    Никорцминда стоит в небольшом селе примерно в тринадцати километрах не доезжая Амбролаури и считается
    главным историческим памятником Рачи. Собор построен в 1010-1014 годах при Баграте III, в ту же волну
    строительства, что дала главные храмы только что объединённого царства.


    Отличает Никорцминду прежде всего **каменная резьба фасадов**. Карнизы, обрамления окон и барабан
    купола сплошь покрыты рельефом: геометрический орнамент, виноградные побеги, фигуры животных и людей,
    апостолы. По плотности декора это один из богатейших образцов средневековой грузинской архитектуры,
    и рассматривать его стоит вблизи, а не мельком от ворот.


    Внутри — роспись XVI-XVII веков, сохранившаяся на удивление хорошо. Колокольня более поздняя, XIX
    века.


    На что обратить внимание:


    - рельефы северного и западного фасадов

    - резьба барабана купола и оконных обрамлений

    - фрески в алтаре и подкупольном пространстве


    Храм действующий и открыт практически всегда. **Он входит в предварительный список ЮНЕСКО от Грузии**,
    но в сам список Всемирного наследия не включён. Осмотр занимает около пятидесяти минут и логично становится
    первой остановкой при въезде в Рачу.


    После Никорцминды въезд в Рачу естественно продолжается в сторону Амбролаури, где расположены хванчкарские
    марани. Именно здесь выращивают александроули и муджуретули — сорта, из которых делают хванчкару.
    Дегустации в хозяйствах обычно проводят по предварительной договорённости.
  tip: >-
    Храм действующий: женщинам нужен платок и длинная юбка, мужчинам — длинные брюки. Полдень для резьбы
    — худшее время: боковой свет утром или ближе к вечеру выявляет рельеф намного лучше. Внутри темно,
    глазам нужно несколько минут, чтобы фрески стали читаться. Машину оставляйте перед двором. Туалет
    простой, ближайшее кафе и банкомат — в Амбролаури, в тринадцати километрах.
  route: >-
    Из Тбилиси по E60 в сторону Кутаиси, затем поворот на север через Ткибули и подъём по горной дороге
    в Рачу; Никорцминда стоит прямо у дороги незадолго до Амбролаури. Всего около 300 км и пять часов.
    Асфальт идёт до конца, но последние шестьдесят километров узкие, вырубленные в скале и извилистые
    — разъезд со встречной машиной требует внимания. Зимой этот участок обледеневает. Заправляйтесь в
    Кутаиси или Ткибули, дальше выбор резко сокращается.
fa:
  name: کلیسای جامع نیکورتسمیندا
  short: کلیسای جامعی از سدهٔ یازدهم پوشیده از کنده‌کاری سنگی استثنایی، با نقاشی‌های اواخر سده‌های میانه
    در درون.
  body: >-
    نیکورتسمیندا در روستایی کوچک، حدود سیزده کیلومتر پیش از آمبرولاوری، ایستاده است و مهم‌ترین بنای تاریخی
    راچا شمرده می‌شود. این کلیسای جامع میان 1010 و 1014 در روزگار باگرات سوم ساخته شد، در همان موج ساخت‌وسازی
    که کلیساهای بزرگ پادشاهی تازه‌متحد را پدید آورد.


    آنچه نیکورتسمیندا را متمایز می‌کند **کنده‌کاری سنگی نماهای آن** است. قرنیزها، قاب پنجره‌ها و گریو
    گنبد پوشیده از نقش برجسته‌اند: آرایه‌های هندسی، پیچک‌های تاک، پیکرهای جانوری و انسانی، حواریون. از
    نظر تراکم محض تزیین، در شمار غنی‌ترین نمونه‌های معماری گرجی سده‌های میانه است و شایستهٔ آن است که
    وقت بگذارید و از نزدیک نگاه کنید، نه اینکه از دروازه نگاهی بیندازید. درون، نقاشی‌های دیواری سده‌های
    شانزدهم و هفدهم به‌طرز چشمگیری خوب مانده‌اند. برج ناقوس افزوده‌ای متأخر از سدهٔ نوزدهم است.


    ارزش جست‌وجو دارند: نقش‌برجسته‌های نمای شمالی و غربی؛ گریو کنده‌کاری‌شدهٔ گنبد و حاشیهٔ پنجره‌ها؛
    و نقاشی‌های درونی در محراب و زیر گنبد. کلیسا فعال است و تقریباً همیشه باز. **در فهرست موقت یونسکوی
    گرجستان جای دارد**، اما در فهرست میراث جهانی ثبت نشده است. بازدید حدود پنجاه دقیقه می‌گیرد و نخستین
    توقف طبیعی هنگام ورود به راچا است.
  tip: >-
    این کلیسایی فعال است: زنان به روسری و دامن بلند نیاز دارند و مردان به شلوار بلند. ظهر بدترین زمان
    برای دیدن کنده‌کاری است — نور کم‌زاویهٔ صبح یا اواخر بعدازظهر برجستگی را به‌مراتب بهتر نشان می‌دهد.
    فضای درون تاریک است و چشم چند دقیقه وقت می‌خواهد تا نقاشی‌ها درست خوانده شوند. جلوی حیاط پارک کنید.
    سرویس بهداشتی ابتدایی است؛ نزدیک‌ترین کافه و خودپرداز در آمبرولاوری‌اند، سیزده کیلومتر جلوتر.
  route: >-
    از تفلیس با E60 به سوی کوتایسی بروید، سپس رو به شمال از تکیبولی بپیچید و جادهٔ کوهستانی را به درون
    راچا بالا بروید؛ نیکورتسمیندا درست کنار جاده و کمی پیش از آمبرولاوری است. روی هم حدود 300 کیلومتر
    و پنج ساعت. آسفالت در تمام مسیر ادامه دارد، اما شصت کیلومتر آخر باریک و بریده در صخره است و پر از
    پیچ‌هایی که رد شدن از کنار خودروی روبه‌رو در آن‌ها دقت می‌خواهد. در زمستان این مقطع یخ می‌بندد. در
    کوتایسی یا تکیبولی باک را پر کنید، چون فراتر از آن گزینه‌ها کم می‌شوند.
he:
  name: קתדרלת ניקורצמינדה
  short: קתדרלה מן המאה ה-11 המכוסה בגילוף אבן יוצא דופן, ובתוכה ציורי קיר מסוף ימי הביניים.
  body: >-
    ניקורצמינדה עומדת בכפר קטן, כשלושה-עשר קילומטרים לפני אמברולאורי, והיא נחשבת למונומנט ההיסטורי המרכזי
    של רצ'ה. הקתדרלה נבנתה בין 1010 ל-1014 בימי בגרט השלישי, באותו גל בנייה שהוליד את הכנסיות הגדולות
    של הממלכה המאוחדת החדשה.


    מה שמייחד את ניקורצמינדה הוא **גילוף האבן שעל חזיתותיה**. הכרכובים, מסגרות החלונות ותוף הכיפה מכוסים
    כולם בתבליטים: עיטור גיאומטרי, קנוקנות גפן, דמויות של בעלי חיים ובני אדם, ושליחים. מבחינת צפיפות הקישוט
    היא מן הדוגמאות העשירות ביותר באדריכלות הגאורגית של ימי הביניים, והיא ראויה לזמן של התבוננות מקרוב
    ולא למבט חטוף מן השער. בפנים נמצאים ציורי קיר מן המאות ה-16 וה-17, שמורים היטב באופן יוצא דופן. מגדל
    הפעמונים הוא תוספת מאוחרת מן המאה ה-19.


    כדאי לחפש: את התבליטים בחזיתות הצפונית והמערבית; את תוף הכיפה המגולף ואת מסגרות החלונות; ואת ציורי
    הפנים בקודש ומתחת לכיפה. הכנסייה פעילה ופתוחה כמעט תמיד. **היא נמצאת ברשימת המועמדים של גאורגיה לאונסקו**,
    אך אינה רשומה ברשימת מורשת עולמית. הביקור אורך כחמישים דקות והוא העצירה הראשונה הטבעית בכניסה לרצ'ה.
  tip: >-
    זוהי כנסייה פעילה: נשים זקוקות למטפחת ראש ולחצאית ארוכה, גברים למכנסיים ארוכים. שעות הצהריים הן הזמן
    הגרוע ביותר לגילוף — אור צד נמוך בבוקר או בשעות אחר הצהריים המאוחרות מבליט את התבליט הרבה יותר. הפנים
    חשוך והעיניים זקוקות לכמה דקות הסתגלות לפני שציורי הקיר נקראים כראוי. החנו מול החצר. השירותים בסיסיים;
    בית הקפה והכספומט הקרובים ביותר נמצאים באמברולאורי, שלושה-עשר קילומטרים הלאה.
  route: >-
    מטביליסי סעו בכביש E60 לכיוון קוטאיסי, ואז פנו צפונה דרך טקיבולי וטפסו בכביש ההרים אל רצ'ה; ניקורצמינדה
    יושבת ממש בצד הדרך זמן קצר לפני אמברולאורי. בסך הכול כ-300 ק"מ וחמש שעות. אספלט נמשך לכל האורך, אך
    שישים הקילומטרים האחרונים צרים, חצובים בסלע ומלאים פניות שבהן חלוף מול רכב נגדי דורש תשומת לב. בחורף
    הקטע הזה מתקרח. תדלקו בקוטאיסי או בטקיבולי, שכן מעבר להם האפשרויות מתדלדלות.
ar:
  name: كاتدرائية نيكورتسميندا
  short: كاتدرائية من القرن الحادي عشر تكسوها نقوش حجرية استثنائية، وفي داخلها جداريات من أواخر العصور
    الوسطى.
  body: >-
    تقوم نيكورتسميندا في قرية صغيرة على بعد نحو ثلاثة عشر كيلومتراً قبل أمبرولاوري، وتُعد أهم معلم تاريخي
    في راتشا. بُنيت الكاتدرائية بين عامي 1010 و1014 في عهد باغرات الثالث، ضمن موجة البناء نفسها التي أنتجت
    كنائس المملكة الموحدة الحديثة الكبرى.


    وما يميز نيكورتسميندا هو **النقش الحجري على واجهاتها**. فالأفاريز وأطر النوافذ ورقبة القبة كلها مغطاة
    بأعمال بارزة: زخارف هندسية، وأغصان كرمة، وأشكال حيوانية وبشرية، ورسل. ومن حيث كثافة الزخرفة وحدها
    فهي من أغنى الأمثلة في العمارة الجورجية الوسيطة، وتستحق وقتاً من التأمل القريب لا نظرة عابرة من البوابة.
    وفي الداخل جداريات من القرنين السادس عشر والسابع عشر، محفوظة جيداً على نحو لافت. أما برج الأجراس فإضافة
    متأخرة من القرن التاسع عشر.


    ومما يستحق البحث عنه: النقوش البارزة على الواجهتين الشمالية والغربية؛ ورقبة القبة المنقوشة وأطر النوافذ؛
    والجداريات الداخلية في الهيكل وتحت القبة. والكنيسة عاملة ومفتوحة في معظم الأوقات. **وهي مدرجة على
    القائمة التمهيدية لليونسكو في جورجيا**، لكنها ليست مسجلة على قائمة التراث العالمي. تستغرق الزيارة
    نحو خمسين دقيقة، وهي المحطة الأولى الطبيعية عند دخول راتشا.
  tip: >-
    هذه كنيسة عاملة: تحتاج النساء إلى غطاء رأس وتنورة طويلة، والرجال إلى بنطال طويل. والظهيرة أسوأ وقت
    لمشاهدة النقوش — فالضوء الجانبي المنخفض صباحاً أو في أواخر العصر يبرز النحت أفضل بكثير. والداخل معتم
    وتحتاج عيناك إلى بضع دقائق للتكيف قبل أن تتضح الجداريات. اركن أمام الفناء. دورات المياه بدائية؛ وأقرب
    مقهى وصراف آلي في أمبرولاوري، على بعد ثلاثة عشر كيلومتراً.
  route: >-
    من تبليسي اسلك الطريق E60 نحو كوتايسي، ثم انعطف شمالاً عبر تكيبولي واصعد طريق الجبل إلى راتشا؛ وتقع
    نيكورتسميندا على حافة الطريق مباشرة قبل أمبرولاوري بقليل. المسافة الإجمالية نحو 300 كم وخمس ساعات.
    والإسفلت ممتد طوال الطريق، لكن آخر ستين كيلومتراً ضيقة ومحفورة في الصخر ومليئة بالمنعطفات التي يتطلب
    فيها تجاوز سيارة قادمة انتباهاً. وفي الشتاء يتجمد هذا المقطع. املأ الخزان في كوتايسي أو تكيبولي، فالخيارات
    تقل بعدهما.
