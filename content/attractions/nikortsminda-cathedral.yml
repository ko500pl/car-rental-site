ka:
  name: ნიკორწმინდის ტაძარი
  short: >-
    ბაგრატ III-ის ტაძარი რაჭაში (1010–1014), რომლის ფასადებზეც ფერისცვალება, მეორედ მოსვლა და ნამდვილ
    და ფანტასტიკურ ცხოველთა მთელი სამყაროა ამოკვეთილი.
  body: >-
    **ნიკორწმინდის კედელზე ამოკვეთილი წარწერა ქრისტეს სთხოვს, ადიდოს „ბაგრატ აფხაზთა და რანთა მეფე“ და
    გაზარდოს მისი ძე გიორგი. ეს ლოცვა ტაძარს 1010–1014 წლებით ათარიღებს — იმ წლებით, როცა ბაგრატ III-მ
    რანი აიღო.**


    წმინდა ნიკოლოზის სახელობის ტაძარს საძირკველი ბაგრატის ბრძანებით ჩაეყარა, X საუკუნის ბოლოს რაჭის საერისთავოს
    შექმნის შემდეგ, და ის ამ მხარის კულტურულ ცენტრად იქცა. XI–XIII საუკუნეებში ნიკორწმინდა რაჭის ერისთავების,
    კახაბერიძეების საგვარეულო მონასტერი იყო, სანამ XIII საუკუნის 80-იან წლებში დავით VI ნარინმა ეს საგვარეულო
    არ ამოწყვიტა. 1534 წელს იმერეთის მეფე ბაგრატ III-მ „დაკნინებული“ მონასტერი განაახლა და საეპისკოპოსო
    კათედრად აქცია.


    ნიკორწმინდის დიდება ქვაა. აღმოსავლეთ ფასადზე ფერისცვალებაა ამოკვეთილი, სამხრეთ ფრონტონზე — ქრისტეს
    მეორედ მოსვლა და ჯვრის ამაღლება. წმინდა გიორგი და წმინდა თევდორე ნამდვილ და ფანტასტიკურ ცხოველებს
    შორის ჩანან, ბევრი მოტივი კი, მკვლევართა აზრით, წინარექრისტიანულ ხალხურ რწმენას უკავშირდება. ფასადებსა
    და თორმეტსარკმლიან გუმბათის ყელს უწყვეტი თაღედი შემოუყვება, ყოველ სარკმელს ჩუქურთმიანი არშია ამშვენებს.
    გუმბათი პირვანდელი სახითაა შემორჩენილი — ათასწლოვან ძეგლს დიდი ცვლილებები თითქმის არ განუცდია.


    შიგნით მხატვრობის ორი ფენაა, XVI და XVII საუკუნეებისა, საერო პირთა პორტრეტებითა და წარწერებით, რომლებიც
    გვამცნობს, რომ ტაძარი წულუკიძეთა საძვალე იყო. 2012 წელს კარიბჭეებში ჭვარტლის მოცილებისას XVI საუკუნის
    მანამდე უცნობი ფრესკები გამოჩნდა, მათ შორის წარწერაც, რომელიც ტაძრის მომხატველს, ვინმე ჯავახაძეს იხსენიებს.


    1991 წლის მიწისძვრით მიყენებული ზიანი აღმოფხვრილია, 2007 წლიდან კი ნიკორწმინდა იუნესკოს მსოფლიო მემკვიდრეობის
    წინასწარ სიაშია. ტაძარს ნელა, ფასადიდან ფასადამდე შემოუარეთ: აქ ქადაგება გარედანაა დაწერილი.
  tip: >-
    მოქმედი ტაძარია: ქალებს თავსაფარი და ქვედაბოლო სჭირდებათ, მამაკაცებს — გრძელი შარვალი; ხმადაბლა ილაპარაკეთ
    და წირვის დროს ნუ გადაიღებთ. ადრე მოდით: დილის მზე აღმოსავლეთ ფასადის ფერისცვალებას გვერდიდან ეცემა,
    მოგვიანებით კი სამხრეთ და დასავლეთ კედლებს უხდება — შუადღისას რელიეფი ბრტყელდება. შიგნით თვალს რამდენიმე
    წუთი სჭირდება, სანამ ფრესკები სიბნელიდან გამოიკვეთება. შაორის წყალსაცავი 4 კმ-ით სამხრეთითაა, 14 კმ-ში
    კი ამბროლაურია — კაფეებით, ბანკომატითა და ხვანჭკარის მარნებით; ეს ნახევრად ტკბილი წითელი ღვინო ალექსანდროულისა
    და მუჯურეთულისგან მზადდება.
  route: >-
    S1 (E60) გზით დასავლეთისკენ დაახლოებით 193 კმ იარეთ და თერჯოლის გასასვლელთან გადაუხვიეთ, შემდეგ შ19
    გზით თერჯოლის გავლით ტყიბულამდე მიდით. ტყიბულიდან შ17 ნაქერალას კლდეებს ციცაბო სერპანტინით აუყვება
    1217-მეტრიან ნაქერალას უღელტეხილამდე, მერე შაორის წყალსაცავის დასავლეთ ნაპირს ჩაუვლის და ტყიბულიდან
    დაახლოებით 24 კილომეტრში ნიკორწმინდას მიადგება. სულ დაახლოებით 250 კმ: გაითვალისწინეთ ოთხნახევარი
    საათი, გაჩერებებით — მეტი. მთელ გზაზე ასფალტია და ეკონომ-კლასიც საკმარისია, თუმცა ნაქერალას მონაკვეთი
    ვიწროა და ზამთარში იყინება. საწვავი ბოლოს ტყიბულში ჩაასხით.
en:
  name: Nikortsminda Cathedral
  short: >-
    Bagrat III's cathedral of 1010–1014 in Racha, its facades carved with the Transfiguration, the Second
    Coming and a bestiary of real and fabulous beasts.
  body: >-
    **An inscription on Nikortsminda's wall asks Christ to exalt Bagrat, "king of the Abkhazians and the
    Ranians", and to raise his son Giorgi — a prayer that dates the cathedral to 1010–1014, the years
    in which Bagrat III took Ran.**


    The church, dedicated to St Nicholas, was founded on Bagrat's order after the eristavate of Racha
    was created at the end of the 10th century, and it became the province's cultural centre. From the
    11th to the 13th century it was the family monastery of the Kakhaberidze, the eristavis of Racha,
    until King David VI Narin wiped out the dynasty in the 1280s. In 1534 King Bagrat III of Imereti renewed
    the dilapidated church and made it a bishop's seat.


    Nikortsminda's glory is its stone. The Transfiguration is carved on the east facade; the south gable
    carries the Second Coming and the Exaltation of the Cross. Saints George and Theodore appear among
    real and fantastic animals, and many motifs, scholars suggest, reach back to pre-Christian folk belief.
    A continuous blind arcade runs round the walls and the twelve-window drum, and every window wears
    a carved frame. The dome keeps its original form — the building has come through a thousand years
    with remarkably little change.


    Inside are two layers of painting, of the 16th and 17th centuries, with portraits of lay patrons whose
    inscriptions show the church served as the burial place of the Tsulukidze princes. In 2012, cleaning
    soot from the porches revealed unknown 16th-century frescoes, among them an inscription naming the
    painter, one Javakhadze.


    Damage from the 1991 earthquake has been repaired, and since 2007 Nikortsminda has stood on Georgia's
    UNESCO tentative list. Walk round it slowly, facade by facade: here the sermon is written on the outside.
  tip: >-
    This is a working church: women cover their hair and wear a skirt, men long trousers; keep your voice
    down and don't photograph during services. Come early — morning sun rakes across the Transfiguration
    on the east facade, while later light suits the south and west walls; midday flattens the relief.
    Inside, give your eyes a few minutes before the frescoes emerge from the dark. Shaori Reservoir lies
    4 km to the south, and Ambrolauri, 14 km on, has cafés, an ATM and the cellars of Khvanchkara, the
    semi-sweet red made from Aleksandrouli and Mujuretuli grapes.
  route: >-
    Take the S1 (E60) west for about 193 km and leave it at the Terjola exit, then follow the Sh19 through
    Terjola to Tkibuli. From Tkibuli the Sh17 climbs the Nakerala cliffs in tight switchbacks to the 1,217
    m Nakerala Pass, runs along the western shore of Shaori Reservoir and reaches Nikortsminda about 24
    km after Tkibuli. Roughly 250 km in total: allow four and a half hours, more with stops. It is asphalt
    throughout and an economy car is fine, but the Nakerala section is narrow and ices over in winter.
    Refuel in Tkibuli at the latest.
ru:
  name: Собор Никорцминда
  short: >-
    Собор Баграта III 1010–1014 годов в Раче: на его фасадах — Преображение, Второе пришествие и целый
    бестиарий настоящих и сказочных зверей.
  body: >-
    **Надпись на стене Никорцминды просит Христа возвеличить Баграта, «царя абхазов и ранов», и вырастить
    его сына Георгия, — и эта молитва датирует собор 1010–1014 годами, когда Баграт III завоевал Рани.**


    Храм во имя святого Николая заложили по приказу Баграта после того, как в конце X века было создано
    Рачинское эриставство, и он стал культурным центром края. С XI по XIII век Никорцминда была родовым
    монастырём Кахаберидзе, эриставов Рачи, пока в 1280-х годах царь Давид VI Нарин не истребил эту династию.
    В 1534 году царь Имерети Баграт III обновил обветшавший храм и сделал его епископской кафедрой.


    Слава Никорцминды — её камень. На восточном фасаде высечено Преображение; на южном фронтоне — Второе
    пришествие и Воздвижение Креста. Святые Георгий и Феодор изображены среди настоящих и фантастических
    животных, и многие мотивы, как полагают исследователи, восходят к дохристианским народным верованиям.
    Сплошная слепая аркатура опоясывает стены и двенадцатиоконный барабан, и каждое окно заключено в резное
    обрамление. Купол сохранил первоначальную форму — здание прошло сквозь тысячу лет, изменившись на
    удивление мало.


    Внутри — два слоя росписи, XVI и XVII веков, с портретами светских ктиторов; надписи при них показывают,
    что церковь служила усыпальницей князей Цулукидзе. В 2012 году, когда с притворов счищали копоть,
    открылись неизвестные фрески XVI века, а среди них — надпись с именем живописца, некоего Джавахадзе.


    Повреждения от землетрясения 1991 года устранены, а с 2007 года Никорцминда входит в предварительный
    список Всемирного наследия ЮНЕСКО от Грузии. Обходите её медленно, фасад за фасадом: здесь проповедь
    написана снаружи.
  tip: >-
    Это действующая церковь: женщинам нужны платок и юбка, мужчинам — длинные брюки; говорите вполголоса
    и не фотографируйте во время службы. Приезжайте пораньше — утреннее солнце скользит по Преображению
    на восточном фасаде, а более поздний свет хорош для южной и западной стен; в полдень рельеф становится
    плоским. Внутри дайте глазам несколько минут — и фрески проступят из темноты. Шаорское водохранилище
    — в 4 км к югу, а в Амбролаури, в 14 км дальше, есть кафе, банкомат и погреба Хванчкары — полусладкого
    красного из винограда Александроули и Муджуретули.
  route: >-
    Езжайте по S1 (E60) на запад около 193 км и сверните на съезде к Терджоле, затем по Sh19 через Терджолу
    до Ткибули. От Ткибули трасса Sh17 крутым серпантином взбирается на Накеральские скалы к перевалу
    Накерала (1217 м), идёт вдоль западного берега Шаорского водохранилища и примерно через 24 км после
    Ткибули приводит к Никорцминде. Всего около 250 км: закладывайте четыре с половиной часа, с остановками
    больше. Всюду асфальт, и машины эконом-класса достаточно, но участок через Накералу узкий и зимой
    обледеневает. Заправиться — не позже Ткибули.
fa:
  name: کلیسای جامع نیکورتسمیندا
  short: >-
    کلیسای جامع باگرات سوم (۱۰۱۰ تا ۱۰۱۴) در راچا، که بر نماهایش تبدیل هیئت مسیح، بازگشت دوم و انبوهی
    از جانوران واقعی و افسانه‌ای کنده شده است.
  body: >-
    **کتیبه‌ای بر دیوار نیکورتسمیندا از مسیح می‌خواهد که باگرات، «شاه آبخازان و رانیان»، را سربلند گرداند
    و پسرش گیورگی را بپروراند — دعایی که کلیسا را به سال‌های ۱۰۱۰ تا ۱۰۱۴ تاریخ‌گذاری می‌کند، همان سال‌هایی
    که باگرات سوم ران را گرفت.**


    این کلیسا به نام قدیس نیکلاس، به فرمان باگرات و پس از برپایی اریستاوی‌نشین راچا در پایان سدهٔ دهم
    بنیاد نهاده شد و کانون فرهنگی این سرزمین گشت. از سدهٔ یازدهم تا سیزدهم، نیکورتسمیندا صومعهٔ خاندانی
    کاخابریدزه‌ها، اریستاوهای راچا، بود تا آنکه شاه داوید ششم نارین در دههٔ ۱۲۸۰ این دودمان را برانداخت.
    در سال ۱۵۳۴ باگرات سوم، شاه ایمرتی، کلیسای فرسوده را نو کرد و آن را کرسی اسقف ساخت.


    شکوه نیکورتسمیندا در سنگ آن است. تبدیل هیئت مسیح بر نمای شرقی کنده شده و سنتوری جنوبی بازگشت دوم مسیح
    و بزرگداشت صلیب را بر خود دارد. قدیس گئورگ و قدیس تئودور در میان جانوران واقعی و خیالی دیده می‌شوند،
    و به گمان پژوهشگران بسیاری از نقش‌مایه‌ها به باورهای عامیانهٔ پیش از مسیحیت بازمی‌گردند. ردیفی پیوسته
    از طاق‌نماهای کور گرداگرد دیوارها و ساقهٔ دوازده‌پنجرهٔ گنبد می‌چرخد و هر پنجره قابی کنده‌کاری‌شده
    دارد. گنبد شکل نخستینش را نگه داشته است — بنا هزار سال را با دگرگونی‌هایی به‌شگفتی اندک پشت سر گذاشته
    است.


    درون کلیسا دو لایه نقاشی از سده‌های شانزدهم و هفدهم هست، با چهره‌هایی از بانیان غیرروحانی که کتیبه‌هایشان
    نشان می‌دهد کلیسا آرامگاه شاهزادگان تسولوکیدزه بوده است. در سال ۲۰۱۲، هنگام زدودن دوده از رواق‌ها،
    دیوارنگاره‌های ناشناخته‌ای از سدهٔ شانزدهم پدیدار شد و در میانشان کتیبه‌ای با نام نقاش: کسی به نام
    جاواخادزه.


    آسیب‌های زمین‌لرزهٔ ۱۹۹۱ ترمیم شده و نیکورتسمیندا از سال ۲۰۰۷ در فهرست موقت میراث جهانی یونسکو از
    سوی گرجستان جای دارد. آرام و نما به نما گرداگردش بگردید: اینجا موعظه را بر بیرون بنا نوشته‌اند.
  tip: >-
    این کلیسا فعال است: زنان موی سر را بپوشانند و دامن به تن کنند، مردان شلوار بلند؛ آهسته سخن بگویید
    و هنگام آیین عبادت عکس نگیرید. زود بیایید — آفتاب صبح مورب بر نقش تبدیل هیئت در نمای شرقی می‌تابد،
    و نور دیرتر برای دیوارهای جنوبی و غربی مناسب است؛ نیمروز برجستگی نقش‌ها را صاف و بی‌جان می‌کند. درون
    کلیسا چند دقیقه به چشمانتان فرصت دهید تا دیوارنگاره‌ها از تاریکی بیرون بیایند. دریاچهٔ سد شائوری ۴
    کیلومتر به سمت جنوب است و آمبرولائوری، ۱۴ کیلومتر آن‌سوتر، کافه، خودپرداز و سرداب‌های خوانچکارا را
    دارد — شراب سرخ نیمه‌شیرینی از انگورهای آلکساندروئولی و موجورتولی.
  route: >-
    جادهٔ S1 (E60) را حدود ۱۹۳ کیلومتر به سوی غرب بروید و در خروجی ترجولا از آن بیرون بیایید، سپس Sh19
    را از میان ترجولا تا تکیبولی دنبال کنید. از تکیبولی، جادهٔ Sh17 با پیچ‌های تند از صخره‌های ناکرالا
    بالا می‌رود تا گردنهٔ ناکرالا در ارتفاع ۱,۲۱۷ متری، از کنارهٔ غربی دریاچهٔ سد شائوری می‌گذرد و حدود
    ۲۴ کیلومتر پس از تکیبولی به نیکورتسمیندا می‌رسد. روی‌هم حدود ۲۵۰ کیلومتر: چهار ساعت و نیم وقت بگذارید،
    و با توقف‌ها بیشتر. سراسر راه آسفالت است و خودروی اقتصادی بس است، اما بخش ناکرالا باریک است و در زمستان
    یخ می‌بندد. حداکثر تا تکیبولی باک را پر کنید.
he:
  name: קתדרלת ניקורצמינדה
  short: >-
    הקתדרלה של בגרט השלישי מן השנים 1010–1014 ברצ'ה, שעל חזיתותיה מגולפות השתנות ישו, הביאה השנייה וחיות
    אמיתיות ודמיוניות לרוב.
  body: >-
    **כתובת על קיר ניקורצמינדה מבקשת מישו לרומם את בגרט, "מלך האבחזים והראנים", ולגדל את בנו גיורגי —
    תפילה שלפיה מתארכים את הקתדרלה לשנים 1010–1014, השנים שבהן כבש בגרט השלישי את ראן.**


    הכנסייה, המוקדשת לניקולאוס הקדוש, נוסדה בפקודת בגרט אחרי שבסוף המאה ה-10 הוקמה ברצ'ה נפה בראשות אריסטאווי
    (מושל), והפכה למרכז התרבותי של המחוז. מן המאה ה-11 ועד המאה ה-13 הייתה ניקורצמינדה המנזר המשפחתי של
    בית קאחאברידזה, האריסטאווים של רצ'ה, עד שהמלך דוד השישי נרין השמיד את השושלת בשנות ה-80 של המאה ה-13.
    ב-1534 חידש מלך אימרתי, בגרט השלישי, את הכנסייה המוזנחת והפך אותה למושב בישוף.


    תהילתה של ניקורצמינדה היא האבן. על החזית המזרחית מגולפת השתנות ישו; הגמלון הדרומי נושא את הביאה השנייה
    ואת רוממות הצלב. גאורגיוס הקדוש ותאודורוס הקדוש מופיעים בין חיות אמיתיות ודמיוניות, ומוטיבים רבים,
    כך משערים חוקרים, נטועים באמונות עממיות קדם-נוצריות. שורה רציפה של קשתות עיוורות מקיפה את הקירות ואת
    תוף הכיפה בן שנים-עשר החלונות, וכל חלון עטור מסגרת מגולפת. הכיפה שמרה על צורתה המקורית — הבניין עבר
    אלף שנה בשינויים מועטים להפליא.


    בפנים יש שתי שכבות ציור, מן המאה ה-16 ומן המאה ה-17, ובהן דיוקנאות של תורמים שאינם אנשי דת, והכתובות
    לצדם מלמדות שהכנסייה שימשה מקום קבורה לנסיכי בית צולוקידזה. ב-2012, כשניקו את הפיח מן המבואות, התגלו
    ציורי קיר לא ידועים מן המאה ה-16, וביניהם כתובת הנוקבת בשם הצייר — אדם בשם ג'אוואחדזה.


    הנזקים מרעידת האדמה של 1991 תוקנו, ומאז 2007 ניקורצמינדה נמצאת ברשימת המועמדים של גאורגיה לאתרי מורשת
    עולמית של אונסק״ו. הקיפו אותה לאט, חזית אחר חזית: כאן הדרשה כתובה מבחוץ.
  tip: >-
    זוהי כנסייה פעילה: נשים מכסות את השיער ולובשות חצאית, גברים מכנסיים ארוכים; דברו בשקט ואל תצלמו בזמן
    התפילות. באו מוקדם — שמש הבוקר נופלת באלכסון על תבליט השתנות ישו בחזית המזרחית, ואילו האור המאוחר
    יותר מתאים לקירות הדרומי והמערבי; בצהריים התבליט נראה שטוח. בפנים, תנו לעיניים כמה דקות עד שציורי
    הקיר יגיחו מן החושך. מאגר שאורי נמצא 4 ק״מ דרומה, ובאמברולאורי, 14 ק״מ הלאה, יש בתי קפה, כספומט ומרתפי
    החוונצ'קרה — היין האדום החצי-מתוק העשוי מענבי אלכסנדרולי ומוג'ורטולי.
  route: >-
    סעו מערבה בכביש S1 (E60) כ-193 ק״מ וצאו ביציאה לטרג'ולה, ומשם בכביש Sh19 דרך טרג'ולה עד טקיבולי. מטקיבולי
    מטפס כביש Sh17 בפיתולים חדים במעלה מצוקי נקראלה אל מעבר נקראלה (1,217 מטר), עובר לאורך החוף המערבי
    של מאגר שאורי ומגיע לניקורצמינדה כ-24 ק״מ אחרי טקיבולי. בסך הכול כ-250 ק״מ: הקצו ארבע וחצי שעות, ויותר
    עם עצירות. הדרך סלולה לכל אורכה ורכב מקטגוריית אקונומי יספיק, אבל הקטע של נקראלה צר ובחורף מתכסה קרח.
    תדלקו בטקיבולי לכל המאוחר.
ar:
  name: كاتدرائية نيكورتسميندا
  short: >-
    كاتدرائية باغرات الثالث في راتشا (1010–1014)، نُحتت على واجهاتها مشاهد التجلّي والمجيء الثاني وحشدٌ
    من الحيوانات الحقيقية والخرافية.
  body: >-
    **نقشٌ على جدار نيكورتسميندا يسأل المسيح أن يُعظّم باغرات، «ملك الأبخاز والرانيين»، وأن يرعى نشأة
    ابنه غيورغي — وهو دعاء يؤرّخ الكاتدرائية بين عامي 1010 و1014، وهي السنوات التي استولى فيها باغرات
    الثالث على ران.**


    أُسّست الكنيسة، المكرّسة للقديس نيقولاوس، بأمر باغرات بعد إنشاء إريستافية راتشا (ولاية يحكمها إريستافي)
    في أواخر القرن العاشر، فغدت المركز الثقافي للإقليم. ومن القرن الحادي عشر إلى الثالث عشر كانت نيكورتسميندا
    الدير العائلي لآل كاخابيريدزه، إريستافيي راتشا، إلى أن أباد الملك داود السادس نارين سلالتهم في ثمانينيات
    القرن الثالث عشر. وفي عام 1534 جدّد باغرات الثالث، ملك إيميريتي، الكنيسة المتداعية وجعلها مقراً لأسقف.


    مجد نيكورتسميندا حجرها. على الواجهة الشرقية نُحت مشهد التجلّي، ويحمل الجملون الجنوبي المجيء الثاني
    وتمجيد الصليب. ويظهر القديسان جاورجيوس وثيودوروس بين حيوانات حقيقية وخيالية، ويرجّح الباحثون أن كثيراً
    من الزخارف يعود إلى معتقدات شعبية سابقة للمسيحية. ويلتف صفّ متصل من الأقواس الصمّاء حول الجدران وحول
    رقبة القبة ذات النوافذ الاثنتي عشرة، وتتزيّن كل نافذة بإطار منحوت. وقد احتفظت القبة بشكلها الأصلي
    — فالمبنى عبر ألف عام وتغيّر تغيّراً ضئيلاً على نحو لافت.


    وفي الداخل طبقتان من الرسوم تعودان إلى القرنين السادس عشر والسابع عشر، فيهما صور لواهبين من غير رجال
    الدين، تكشف النقوش المرافقة لها أن الكنيسة كانت مدفناً لأمراء آل تسولوكيدزه. وفي عام 2012، حين أُزيل
    السخام عن الأروقة الخارجية، ظهرت جداريات مجهولة من القرن السادس عشر، بينها نقش يذكر اسم الرسام: رجل
    يُدعى جافاخادزه.


    وقد رُمّمت أضرار زلزال 1991، وفي عام 2007 أُدرجت نيكورتسميندا على القائمة التمهيدية لجورجيا للتراث
    العالمي لدى اليونسكو. طُف حولها ببطء، واجهةً بعد واجهة: فهنا كُتبت الموعظة على الخارج.
  tip: >-
    هذه كنيسة تُقام فيها الصلوات: تغطي النساء شعورهن ويرتدين تنانير، ويلبس الرجال سراويل طويلة؛ اخفض صوتك
    ولا تصوّر أثناء الصلوات. تعال باكراً — فشمس الصباح تنساب مائلةً على مشهد التجلّي في الواجهة الشرقية،
    بينما يلائم الضوء اللاحق الجدارين الجنوبي والغربي؛ أما الظهيرة فتُسطّح النقوش البارزة. وفي الداخل
    امنح عينيك بضع دقائق حتى تنبثق الجداريات من العتمة. يقع خزان شاوري على بعد 4 كم جنوباً، وفي أمبرولاوري،
    على بعد 14 كم أخرى، مقاهٍ وصراف آلي وأقبية خفانتشكارا، النبيذ الأحمر شبه الحلو المصنوع من عنبَي ألكسندرولي
    وموجوريتولي.
  route: >-
    اتجه غرباً على الطريق S1 (E60) نحو 193 كم واتركه عند مخرج تيرجولا، ثم اتبع الطريق Sh19 عبر تيرجولا
    إلى تكيبولي. من تكيبولي يتسلق الطريق Sh17 منحدرات ناكيرالا في منعطفات ضيقة حتى ممر ناكيرالا (1,217
    م)، ثم يحاذي الشاطئ الغربي لخزان شاوري ويبلغ نيكورتسميندا بعد نحو 24 كم من تكيبولي. المجموع قرابة
    250 كم: خصّص أربع ساعات ونصفاً، وأكثر مع التوقفات. الطريق معبّد بالكامل وتكفي سيارة اقتصادية، لكن
    مقطع ناكيرالا ضيق ويتجمّد في الشتاء. تزوّد بالوقود في تكيبولي على أبعد تقدير.
