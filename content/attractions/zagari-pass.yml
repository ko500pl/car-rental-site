ka:
  name: ზაგარის უღელტეხილი
  short: >-
    2620-მეტრიანი ველური უღელტეხილი ლენტეხსა და უშგულს შორის — საქართველოს ერთ-ერთი ყველაზე მაღალი და
    ლამაზი სამანქანო გზა.
  body: >-
    **ზაგარი ის გზაა, რომელიც ქვემო და ზემო სვანეთს ერთმანეთს აბამს** — და ამავდროულად საქართველოს ერთ-ერთი
    ყველაზე მაღალი სამანქანო უღელტეხილია, დაახლოებით 2620 მეტრზე. ლენტეხიდან ცხენისწყლის ხეობას აჰყვები,
    ბოლო სოფლების — მელეს, მამის, ცანას — გავლით, სანამ ტყე ალპურ მდელოებად არ გადაიქცევა და გზა ცის კიდეს
    არ მიადგება. გადაღმა კი, სულ რაღაც 6-7 კილომეტრში, უშგული გელოდება — ევროპის ერთ-ერთი ყველაზე მაღალი
    მუდმივად დასახლებული სოფელი.


    გზა უმეტესად მკაცრი გრუნტია: ქვიანი მონაკვეთები, პატარა ფონები, ვიწრო გვერდულები. ცანასთან საბჭოთა
    დარიშხანის მაღაროების მიტოვებული ნაგებობები ჩანს — მოჩვენება-ინდუსტრია შუა ველურ მთებში. სამაგიეროდ,
    უღელტეხილიდან სვანეთის ქედისა და კავკასიონის ისეთი პანორამა იშლება, რომ ბევრი მგზავრი ამ გზას თავად
    უშგულზე მეტად იმახსოვრებს.


    გზა თოვლისგან მხოლოდ ზაფხულობით იხსნება — რეალურად ივნისის შუიდან სექტემბერ-ოქტომბრამდე. ბოლო წლებში
    მონაკვეთებს აუმჯობესებენ, ამიტომ მდგომარეობა წლიდან წლამდე იცვლება — გამგზავრებამდე ადგილობრივებს
    ჰკითხე.
  tip: >-
    მხოლოდ 4x4-ით და მხოლოდ მშრალ ამინდში — წვიმის შემდეგ ფონები იზრდება და თიხა სრიალებს. სავსე ავზით
    გადი: ლენტეხსა და უშგულს შორის ბენზინგასამართი არ არის. მობილური კავშირი დიდ მონაკვეთებზე ქრება, ოფლაინ-რუკა
    ჩამოტვირთე. წყალი, საგზალი და თბილი ტანსაცმელი აუცილებელია — 2600 მეტრზე ზაფხულშიც ცივა. გზაზე მარტო
    ნუ დაიწყებ ღამის გათევას მანქანით პრობლემის შემთხვევაში — ცანამდე ან უშგულამდე მიაღწიე.
  route: >-
    თბილისიდან E60-ით ქუთაისისკენ, შემდეგ ცაგერი–ლენტეხის გზით ქვემო სვანეთში — ლენტეხამდე დაახლოებით
    367 კმ (6 საათი), უმეტესად ასფალტი. ლენტეხიდან უღელტეხილამდე კიდევ ~55 კმ მკაცრი გრუნტია, რომელსაც
    2-3 საათი უნდა დაუთმო; ჯამში დაახლოებით 420 კმ და 9 საათი. მარშრუტი მხოლოდ ივნისი-სექტემბერია გახსნილი.
    აუცილებელია ნამდვილი 4x4 მაღალი კლირენსით — ეს გზა ეკონომ და საშუალო კლასს არ ეპატიება.
en:
  name: Zagari Pass
  short: >-
    A wild 2,620 m pass between Lentekhi and Ushguli — one of the highest and most beautiful roads you
    can drive in Georgia.
  body: >-
    **Zagari is the road that ties Lower and Upper Svaneti together** — and at roughly 2,620 m it is one
    of the highest motorable passes in Georgia. From Lentekhi you follow the Tskhenistskali valley up
    through the last villages — Mele, Mami, Tsana — until forest gives way to alpine meadow and the track
    climbs to the very rim of the sky. On the far side, just 6–7 km on, waits Ushguli, one of Europe's
    highest permanently inhabited villages.


    Most of the way is hard dirt track: rocky sections, small fords, narrow shelf road. Near Tsana the
    abandoned buildings of Soviet arsenic mines appear — a ghost industry stranded in the wild mountains.
    In return, the pass unrolls a panorama of the Svaneti Range and the Greater Caucasus so vast that
    many travellers remember the road more vividly than Ushguli itself.


    Snow keeps the route shut most of the year; realistically it opens from mid-June until September or
    early October. Sections are being upgraded in recent years, so conditions change season to season
    — ask locally before you commit.
  tip: >-
    Go only with a real 4x4 and only in dry weather — after rain the fords swell and the clay turns slick.
    Start with a full tank: there is no petrol station between Lentekhi and Ushguli. Mobile signal disappears
    for long stretches, so download offline maps. Carry water, food and warm layers — at 2,600 m it is
    cold even in August. If the car gives trouble, push on to Tsana or Ushguli rather than overnighting
    alone on the pass.
  route: >-
    From Tbilisi take the E60 towards Kutaisi, then the Tsageri–Lentekhi road into Lower Svaneti — about
    367 km (6 hours) to Lentekhi, mostly asphalt. From Lentekhi it is another ~55 km of rough track to
    the pass, worth 2–3 hours; around 420 km and 9 hours in total. The route is open roughly June–September
    only. A genuine 4x4 with high clearance is mandatory — this is no place for an economy or mid-class
    rental.
ru:
  name: Перевал Загари
  short: >-
    Дикий перевал высотой 2620 м между Лентехи и Ушгули — одна из самых высоких и красивых автомобильных
    дорог Грузии.
  body: >-
    **Загари — дорога, связывающая Нижнюю и Верхнюю Сванети,** и при своих примерно 2620 м один из самых
    высоких проезжих перевалов Грузии. От Лентехи вы поднимаетесь по долине Цхенисцкали через последние
    сёла — Меле, Мами, Цана, — пока лес не сменится альпийскими лугами, а колея не выберется на самый
    край неба. А по ту сторону, всего в 6–7 км, ждёт Ушгули — одно из самых высокогорных постоянно обитаемых
    сёл Европы.


    Большая часть пути — жёсткая грунтовка: каменистые участки, небольшие броды, узкая полка над обрывом.
    У Цаны появляются заброшенные корпуса советских мышьяковых рудников — призрачная индустрия посреди
    дикой природы. Зато с перевала разворачивается такая панорама Сванетского хребта и Большого Кавказа,
    что многие запоминают дорогу ярче самого Ушгули.


    Снег держит трассу закрытой большую часть года: реально она открыта с середины июня до сентября —
    начала октября. В последние годы участки постепенно улучшают, так что состояние меняется от сезона
    к сезону — перед выездом расспросите местных.
  tip: >-
    Только настоящий 4x4 и только в сухую погоду — после дождя броды поднимаются, а глина становится скользкой.
    Выезжайте с полным баком: между Лентехи и Ушгули заправок нет. Связь пропадает на длинных участках
    — скачайте офлайн-карты. Вода, еда и тёплые вещи обязательны: на 2600 м холодно даже в августе. При
    поломке лучше дотянуть до Цаны или Ушгули, чем ночевать на перевале в одиночку.
  route: >-
    Из Тбилиси по E60 в сторону Кутаиси, затем по дороге Цагери–Лентехи в Нижнюю Сванети — до Лентехи
    около 367 км (6 часов), в основном асфальт. От Лентехи до перевала ещё ~55 км жёсткой грунтовки, на
    которые закладывайте 2–3 часа; всего около 420 км и 9 часов. Маршрут открыт примерно с июня по сентябрь.
    Обязателен настоящий внедорожник с высоким клиренсом — эконом- и среднему классу здесь делать нечего.
fa:
  name: گردنهٔ زاگاری
  short: >-
    گردنه‌ای وحشی در ارتفاع ۲۶۲۰ متر میان لنتخی و اوشگولی — یکی از بلندترین و زیباترین جاده‌های قابل‌رانندگی
    گرجستان.
  body: >-
    **زاگاری جاده‌ای است که سوانتی سفلی و علیا را به هم گره می‌زند** — و با حدود ۲۶۲۰ متر ارتفاع، یکی
    از بلندترین گردنه‌های قابل عبور با خودرو در گرجستان است. از لنتخی درهٔ تسخنیس‌تسکالی را بالا می‌روید
    و از واپسین روستاها — مله، مامی، تسانا — می‌گذرید تا جنگل جایش را به مرغزار آلپی بدهد و جاده به لبهٔ
    آسمان برسد. آن‌سوی گردنه، فقط ۶–۷ کیلومتر جلوتر، اوشگولی انتظارتان را می‌کشد — یکی از مرتفع‌ترین روستاهای
    همیشه‌مسکون اروپا.


    بیشتر مسیر خاکیِ سختی است: قطعه‌های سنگلاخ، گدارهای کوچک رودخانه، جادهٔ باریک طاقچه‌ای. نزدیک تسانا
    ساختمان‌های متروک معادن آرسنیک شوروی پیدا می‌شوند — صنعتی شبح‌وار در دل کوهستان وحشی. در عوض، از گردنه
    چنان پانورامایی از رشته‌کوه سوانتی و قفقاز بزرگ باز می‌شود که بسیاری از مسافران جاده را زنده‌تر از
    خود اوشگولی به یاد می‌آورند.


    برف بیشتر سال راه را بسته نگه می‌دارد؛ عملاً از اواسط ژوئن تا سپتامبر یا اوایل اکتبر باز است. در سال‌های
    اخیر قطعه‌هایی از مسیر بهسازی می‌شود و وضعیت هر فصل فرق می‌کند — پیش از حرکت از اهالی بپرسید.
  tip: >-
    فقط با شاسی‌بلند واقعی چهارچرخ‌محرک و فقط در هوای خشک — پس از باران گدارها بالا می‌آیند و گلِ رس لیز
    می‌شود. با باک پر راه بیفتید: میان لنتخی و اوشگولی پمپ بنزینی نیست. آنتن موبایل در قطعه‌های طولانی
    می‌رود؛ نقشهٔ آفلاین دانلود کنید. آب و خوراکی و لباس گرم ضروری است — در ۲۶۰۰ متری حتی در اوت هوا سرد
    است. اگر خودرو مشکل پیدا کرد، تا تسانا یا اوشگولی ادامه دهید و تنها روی گردنه شب نمانید.
  route: >-
    از تفلیس با E60 به سوی کوتائیسی، سپس با جادهٔ تساگری–لنتخی به سوانتی سفلی — تا لنتخی حدود ۳۶۷ کیلومتر
    (۶ ساعت)، بیشترش آسفالت. از لنتخی تا گردنه حدود ۵۵ کیلومتر خاکیِ سخت دیگر است که ۲ تا ۳ ساعت وقت می‌برد؛
    روی‌هم حدود ۴۲۰ کیلومتر و ۹ ساعت. مسیر تقریباً فقط ژوئن تا سپتامبر باز است. شاسی‌بلند واقعی با کلیرنس
    بالا الزامی است — اینجا جای خودروی اقتصادی یا متوسط نیست.
he:
  name: מעבר זאגארי
  short: מעבר פראי בגובה 2,620 מ' בין לנטחי לאושגולי — אחת הדרכים הגבוהות והיפות ביותר שאפשר לנהוג בהן
    בגאורגיה.
  body: >-
    **זאגארי היא הדרך שקושרת יחד את סוונטי התחתונה והעליונה** — ובגובה של כ-2,620 מ' זהו אחד ממעברי ההרים
    הגבוהים ביותר בגאורגיה שעבירים לרכב. מלנטחי מטפסים לאורך עמק הצחניסצקאלי דרך הכפרים האחרונים — מלה,
    מאמי, צאנה — עד שהיער מפנה מקום לאחו אלפיני והדרך מטפסת אל שפת השמיים ממש. בצד השני, במרחק 6–7 ק"מ
    בלבד, מחכה אושגולי — מהכפרים המיושבים דרך קבע הגבוהים באירופה.


    רוב הדרך היא דרך עפר קשוחה: קטעים סלעיים, מעברי נחל קטנים, מדף צר מעל התהום. ליד צאנה מופיעים המבנים
    הנטושים של מכרות הארסן הסובייטיים — תעשיית רפאים באמצע הרים פראיים. בתמורה, מהמעבר נפרשת פנורמה של
    רכס סוונטי והקווקז הגדול, כה עצומה שרבים זוכרים את הדרך חזק יותר מאושגולי עצמה.


    השלג סוגר את המסלול ברוב חודשי השנה; בפועל הוא פתוח מאמצע יוני עד ספטמבר או תחילת אוקטובר. בשנים האחרונות
    משדרגים קטעים ממנו, כך שהמצב משתנה מעונה לעונה — בררו אצל המקומיים לפני היציאה.
  tip: >-
    רק ברכב 4x4 אמיתי ורק במזג אוויר יבש — אחרי גשם מעברי הנחל עולים והחימר נעשה חלקלק. צאו עם מכל מלא:
    אין תחנת דלק בין לנטחי לאושגולי. הקליטה הסלולרית נעלמת לקטעים ארוכים — הורידו מפות אופליין. מים, אוכל
    ושכבות חמות הם חובה: ב-2,600 מ' קר גם באוגוסט. אם הרכב מתקלקל, עדיף להמשיך עד צאנה או אושגולי מאשר
    ללון לבד על המעבר.
  route: >-
    מטביליסי ב-E60 לכיוון קוטאיסי, ואז בדרך צאגרי–לנטחי אל סוונטי התחתונה — כ-367 ק"מ (6 שעות) עד לנטחי,
    רובן אספלט. מלנטחי אל המעבר עוד כ-55 ק"מ של דרך עפר קשה, שדורשים 2–3 שעות; בסך הכול כ-420 ק"מ ו-9
    שעות. המסלול פתוח בערך מיוני עד ספטמבר בלבד. חובה ג'יפ אמיתי עם מרווח גחון גבוה — אין כאן מקום לרכב
    שכור חסכוני או בינוני.
ar:
  name: ممر زاغاري
  short: ممر جبلي برّي على ارتفاع 2620 متراً بين لنتيخي وأوشغولي — من أعلى الطرق التي يمكن قيادتها في
    جورجيا وأجملها.
  body: >-
    **زاغاري هو الطريق الذي يربط سفانيتي السفلى بالعليا** — وهو بارتفاعه البالغ نحو 2620 متراً واحد من
    أعلى الممرات الصالحة للسيارات في جورجيا. من لنتيخي تصعد وادي تسخنيستسكالي عبر آخر القرى — ميله ومامي
    وتسانا — حتى تفسح الغابة مكانها للمروج الألبية ويتسلق الطريق إلى حافة السماء. وعلى الجانب الآخر، بعد
    6–7 كيلومترات فقط، تنتظرك أوشغولي — من أعلى القرى المأهولة دائماً في أوروبا.


    معظم الطريق ترابي قاسٍ: مقاطع صخرية، ومخاضات صغيرة، وطريق رفّي ضيق فوق المنحدر. وقرب تسانا تظهر المباني
    المهجورة لمناجم الزرنيخ السوفييتية — صناعة أشباح وسط جبال برية. وفي المقابل، يبسط الممر بانوراما لسلسلة
    سفانيتي والقوقاز الكبير من الاتساع بحيث يتذكر كثير من المسافرين الطريق أكثر مما يتذكرون أوشغولي نفسها.


    يبقي الثلج الطريق مغلقاً معظم السنة؛ وهو يفتح عملياً من منتصف يونيو حتى سبتمبر أو أوائل أكتوبر. وتجري
    في السنوات الأخيرة أعمال تحسين على مقاطع منه، فتتغير حاله من موسم إلى آخر — اسأل الأهالي قبل الانطلاق.
  tip: >-
    لا تذهب إلا بسيارة دفع رباعي حقيقية وفي طقس جاف فقط — بعد المطر ترتفع المخاضات ويصبح الطين زلقاً.
    انطلق بخزان ممتلئ: لا محطة وقود بين لنتيخي وأوشغولي. تنقطع إشارة الهاتف مسافات طويلة، فحمّل خرائط
    بلا إنترنت. الماء والطعام وطبقات الملابس الدافئة ضرورية — على ارتفاع 2600 متر يكون البرد قارساً حتى
    في أغسطس. وإذا تعطلت السيارة فتابع إلى تسانا أو أوشغولي بدل المبيت وحيداً على الممر.
  route: >-
    من تبليسي عبر E60 باتجاه كوتايسي، ثم بطريق تساغيري–لنتيخي إلى سفانيتي السفلى — نحو 367 كم (6 ساعات)
    حتى لنتيخي، معظمها أسفلت. ومن لنتيخي إلى الممر نحو 55 كم أخرى من الطريق الترابي القاسي تستغرق ساعتين
    إلى ثلاث؛ أي نحو 420 كم و9 ساعات إجمالاً. الطريق مفتوح تقريباً من يونيو إلى سبتمبر فقط. سيارة دفع
    رباعي حقيقية بخلوص أرضي عالٍ إلزامية — فلا مكان هنا لسيارة مستأجرة اقتصادية أو متوسطة.
