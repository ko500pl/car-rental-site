ka:
  name: ზაგარის უღელტეხილი
  short: >-
    მხოლოდ ზაფხულში გასავლელი მთის გზა ლენტეხიდან უშგულამდე — მიტოვებული დარიშხანის ქარხნის გავლით, 2600-მეტრიან
    უნაგირზე, ბენზინისა და კავშირის გარეშე.
  body: >-
    **ზაგარი ზემო სვანეთის უკანა კარია — მხოლოდ ზაფხულში გასავლელი გზა, რომელიც ცხენისწყლის ხეობიდან დაახლოებით
    2600 მეტრამდე ადის და პირდაპირ უშგულში ეშვება.**


    გზებამდე დიდი ხნით ადრე სწორედ ეს უნაგირი აკავშირებდა ცხენისწყლის ხეობას ენგურისას. წყაროები მის სიმაღლეს
    2570-იდან 2620 მეტრამდე ასახელებენ, თუმცა წლის უმეტეს ნაწილში ამ ციფრს მნიშვნელობა არა აქვს: თოვლი
    უღელტეხილს კეტავს და გზა რეალურად მხოლოდ ივნისის შუა რიცხვებიდან სექტემბრის ბოლომდე ან ოქტომბრის დასაწყისამდეა
    გახსნილი.


    ლენტეხიდან ხეობა თანდათან ვიწროვდება, სოფლები იშვიათდება, ასფალტი კი ქვებს, ფონებსა და კლდეში გაჭრილ
    ვიწრო გზას უთმობს ადგილს. უკანასკნელი დასახლება ცანაა, 1700 მეტრზე. იგი წყაროებში პირველად 1503 წლის
    საბუთში იხსენიება, XIX საუკუნის ბოლოს უშგულიდან გადმოსულმა ოჯახებმა ხელახლა დაასახლეს, 2014 წლის აღწერით
    კი აქ მუდმივად აღარავინ ცხოვრობდა. სოფლის გვერდით ცანის სამთო-ქიმიური კომბინატის ჩონჩხი დგას — აქ
    1938-იდან 1991 წლამდე დარიშხანის მადანს ამუშავებდნენ. საწარმოს დახურვის შემდეგ ტერიტორია მომწამვლელი
    ნარჩენებით დაბინძურებული დარჩა; 2023 წელს სახელმწიფომ ის შეისყიდა, რომ დარიშხანი სარკოფაგში ჩაკეტოს.


    ცანის ზემოთ ტყე მდელოს ცვლის, მდელო კი შიშველ უნაგირს, სადაც ქარი არასოდეს წყდება. მერე გადაღმა მხარე
    იხსნება: ჩრდილოეთით შხარის მასივის ყინული, ქვემოთ ენგურის სათავეები, ცოტა დაბლა კი უშგულის კოშკები.


    ბევრ მძღოლს ეს გზა თავად უშგულზე დიდხანს ახსოვს. სამართლიანადაც: ეს ხედი ოფლით აქვთ დამსახურებული.
  tip: >-
    მხოლოდ ნამდვილი, მაღალკლირენსიანი 4x4-ით და მხოლოდ მდგრად ამინდში: წვიმის შემდეგ ფონები დიდდება, თიხა
    კი საპონივით სრიალებს. ლენტეხიდან სავსე ავზით გადით — მესტიამდე ბენზინს ვერსად იშოვით. კავშირი დიდ
    მონაკვეთებზე ქრება: ოფლაინ-რუკა ჩამოტვირთეთ და ვინმეს თქვენი გეგმა გაანდეთ. ცანის კომბინატის ახლოს
    ნუ ისადილებთ, წყალს ნუ აიღებთ და ქვებს ნუ წამოიღებთ — ნიადაგი დარიშხანის ნარჩენებითაა დაბინძურებული.
    წყალი, საგზალი და თბილი ტანსაცმელი აუცილებელია: უნაგირზე აგვისტოშიც ცივა. გზა ყოველი ზამთრის შემდეგ
    იცვლება — გამგზავრებამდე ლენტეხში ან უშგულში იკითხეთ.
  route: >-
    თბილისიდან E60-ით (ს-1) ქუთაისამდე, შემდეგ შ-15-ით წყალტუბოსა და ცაგერის გავლით ლენტეხამდე — დაახლოებით
    350 კმ და ექვსი საათი, თითქმის მთლიანად ასფალტზე. ლენტეხიდან უღელტეხილამდე დაახლოებით 65 კმ თანდათან
    გაუარესებული გზაა (აქედან 56 კმ ცანამდე) — სამი საათი ან მეტი გაითვალისწინეთ. ჯამში დაახლოებით 420
    კმ და ცხრა საათი გამოდის, ამიტომ უმეტესობა ლენტეხში ათევს ღამეს. გზა მხოლოდ ივნისის შუა რიცხვებიდან
    სექტემბრის ბოლომდეა გახსნილი. ეს ნამდვილი ოფროუდია: ფონები, ქვები და კლდეზე გაჭრილი ვიწრო გზა მაღალკლირენსიან
    4x4-ს მოითხოვს — ეკონომ ან საშუალო კლასის მანქანა აქ არ გამოდგება.
en:
  name: Zagari Pass
  short: >-
    A summer-only mountain track from Lentekhi to Ushguli, past a dead arsenic works and over a 2,600-metre
    saddle, with no fuel and no signal.
  body: >-
    **Zagari is the back door into Upper Svaneti — a summer-only track that climbs out of the Tskhenistskali
    valley to around 2,600 metres, then drops straight into Ushguli.**


    Long before there were roads, this saddle was how Lower Svaneti reached the Enguri. Sources put its
    height anywhere between 2,570 and 2,620 metres, and for most of the year the figure is academic: snow
    shuts the pass, and the track is realistically open only from mid-June to late September or early
    October.


    From Lentekhi the valley narrows, the villages thin out and the asphalt gives way to stones, fords
    and shelf road. The last settlement is Tsana, at 1,700 metres. It first appears in a document of 1503,
    was resettled at the end of the 19th century by families from Ushguli, and in the 2014 census had
    no permanent residents at all. Beside it stand the carcasses of the Tsana mining and chemical works,
    which processed arsenic ore from 1938 to 1991. After it closed, the ground was left poisoned with
    waste; in 2023 the state bought the site to seal the arsenic under a sarcophagus.


    Above Tsana the forest gives way to meadow, and the meadow to a bare saddle where the wind never quite
    stops. Then the far side opens: the ice of the Shkhara massif to the north, the Enguri headwaters
    below, and the towers of Ushguli a short descent away.


    Plenty of drivers remember this road longer than Ushguli itself. That is only fair: they earned it.
  tip: >-
    Go only in a real high-clearance 4x4 and only in settled weather: after rain the fords swell and the
    clay turns to soap. Leave Lentekhi with a full tank, as there is no fuel before Mestia. Signal vanishes
    for long stretches, so download offline maps and tell someone your plan. Do not picnic, fill bottles
    or pocket stones around the Tsana works, where the soil is contaminated with arsenic waste. Carry
    water, food and warm layers, because the saddle is cold even in August. The track changes after every
    winter, so ask in Lentekhi or Ushguli before you commit.
  route: >-
    From Tbilisi take the E60 (S1) to Kutaisi, then the Sh15 through Tskaltubo and Tsageri to Lentekhi:
    roughly 350 km and six hours, nearly all asphalt. From Lentekhi about 65 km of increasingly rough
    road — 56 km of it to Tsana — lead up to the pass; allow three hours or more. That makes about 420
    km and nine hours in all, so most people split it with a night in Lentekhi. The route is open only
    from about mid-June to late September. It is strictly off-road territory: fords, rocks and a shelf
    road need a genuine 4x4 with high clearance, not an economy or mid-size car.
ru:
  name: Перевал Загари
  short: >-
    Летняя горная дорога из Лентехи в Ушгули — мимо мёртвого мышьякового комбината, через седловину на
    2600 метрах, без заправок и без связи.
  body: >-
    **Загари — чёрный ход в Верхнюю Сванетию: летняя колея, которая выбирается из долины Цхенисцкали примерно
    на 2600 метров и затем спускается прямо к Ушгули.**


    Задолго до появления дорог именно этой седловиной Нижняя Сванетия выходила к Ингури. Источники дают
    её высоту где-то между 2570 и 2620 метрами, но большую часть года цифра имеет лишь академический интерес:
    снег закрывает перевал, и реально дорога открыта только с середины июня до конца сентября или начала
    октября.


    От Лентехи долина сужается, сёла редеют, а асфальт сменяется камнями, бродами и полочной дорогой.
    Последнее поселение — Цана, на высоте 1700 метров. Впервые она упоминается в документе 1503 года,
    в конце XIX века её заново заселили семьи из Ушгули, а по переписи 2014 года постоянных жителей в
    ней не осталось вовсе. Рядом стоят остовы Цанского горно-химического комбината, который с 1938 по
    1991 год перерабатывал мышьяковую руду. После закрытия земля осталась отравленной отходами; в 2023
    году государство выкупило территорию, чтобы запечатать мышьяк под саркофагом.


    Выше Цаны лес уступает лугам, а луга — голой седловине, где ветер не стихает никогда. И тогда открывается
    другая сторона: льды массива Шхара на севере, верховья Ингури внизу и башни Ушгули — совсем недалеко
    вниз по склону.


    Многие водители помнят эту дорогу дольше, чем само Ушгули. И это справедливо: они её заслужили.
  tip: >-
    Отправляйтесь только на настоящем полноприводном внедорожнике с высоким клиренсом и только при устойчивой
    погоде: после дождя броды вздуваются, а глина становится мылом. Выезжайте из Лентехи с полным баком
    — до Местиа заправок нет. Связь надолго пропадает, поэтому скачайте офлайн-карты и сообщите кому-нибудь
    свой план. Не устраивайте пикников, не набирайте воду и не кладите в карман камни у Цанского комбината:
    почва там загрязнена мышьяковыми отходами. Возьмите воду, еду и тёплые вещи — на седловине холодно
    даже в августе. После каждой зимы дорога меняется, так что прежде чем решиться, расспросите в Лентехи
    или Ушгули.
  route: >-
    Из Тбилиси по E60 (S1) до Кутаиси, затем по Sh15 через Цхалтубо и Цагери до Лентехи: около 350 км
    и шесть часов, почти целиком по асфальту. От Лентехи к перевалу ведут около 65 км всё более тяжёлой
    дороги, из них 56 км — до Цаны; закладывайте три часа или больше. Всего выходит около 420 км и девять
    часов, поэтому большинство разбивает путь ночёвкой в Лентехи. Маршрут открыт только примерно с середины
    июня до конца сентября. Это территория исключительно для бездорожья: броды, камни и полочная дорога
    требуют настоящего полноприводного автомобиля с высоким клиренсом, а не машины эконом- или среднего
    класса.
fa:
  name: گردنهٔ زاگاری
  short: >-
    راهی کوهستانی و فقط تابستانی از لنتخی به اوشگولی، از کنار کارخانهٔ متروک آرسنیک و از روی زینی در ارتفاع
    ۲,۶۰۰ متر؛ بی‌پمپ‌بنزین و بی‌آنتن.
  body: >-
    **زاگاری درِ پشتی سوانتی علیاست: راهی فقط تابستانی که از درهٔ تسخنیستسکالی تا حدود ۲,۶۰۰ متر بالا
    می‌کشد و سپس یکراست به اوشگولی فرود می‌آید.**


    خیلی پیش از آنکه جاده‌ای باشد، سوانتی سفلی از همین زین به انگوری می‌رسید. منابع ارتفاعش را جایی میان
    ۲,۵۷۰ تا ۲,۶۲۰ متر می‌دانند، و در بیشتر روزهای سال این عدد فقط به کار کتاب‌ها می‌آید: برف گردنه را
    می‌بندد و راه در عمل تنها از نیمهٔ ژوئن تا اواخر سپتامبر یا اوایل اکتبر باز است.


    از لنتخی به بعد دره تنگ می‌شود، روستاها کم‌شمار می‌شوند و آسفالت جایش را به سنگلاخ، گدار و جادهٔ طاقچه‌ای
    بر دل کوه می‌دهد. واپسین آبادی تسانا است، در ارتفاع ۱,۷۰۰ متر. نامش نخستین بار در سندی از ۱۵۰۳ آمده،
    در پایان سدهٔ نوزدهم خانواده‌هایی از اوشگولی دوباره در آن ساکن شدند، و در سرشماری ۲۰۱۴ هیچ ساکن دائمی
    نداشت. کنار آن اسکلت مجتمع معدنی و شیمیایی تسانا ایستاده که از ۱۹۳۸ تا ۱۹۹۱ سنگ معدن آرسنیک را فرآوری
    می‌کرد. پس از تعطیلی، خاک با پسماندها مسموم ماند؛ در ۲۰۲۳ دولت این زمین را خرید تا آرسنیک را زیر یک
    سارکوفاژ مهروموم کند.


    بالاتر از تسانا جنگل به مرغزار می‌رسد و مرغزار به زینی برهنه که باد در آن هیچ‌گاه به‌تمامی آرام نمی‌گیرد.
    آنگاه سوی دیگر گشوده می‌شود: یخ‌های تودهٔ شخارا در شمال، سرچشمه‌های انگوری در پایین، و برج‌های اوشگولی
    در سراشیبی کوتاهی آن‌سوتر.


    بسیاری از رانندگان این جاده را بیش از خود اوشگولی به یاد می‌سپارند. و حق هم دارند: این خاطره را با
    زحمت به دست آورده‌اند.
  tip: >-
    فقط با یک خودروی دودیفرانسیل واقعی و مرتفع، و فقط در هوای پایدار بروید: پس از باران گدارها بالا می‌آیند
    و گِل رس مثل صابون لیز می‌شود. از لنتخی با باک پر راه بیفتید، چون تا مستیا پمپ‌بنزینی نیست. آنتن در
    مسافت‌های طولانی قطع می‌شود؛ پس نقشهٔ آفلاین دانلود کنید و برنامه‌تان را به کسی بگویید. در اطراف مجتمع
    تسانا پیک‌نیک نکنید، بطری آب پر نکنید و سنگی در جیب نگذارید؛ خاک آنجا به پسماند آرسنیک آلوده است.
    آب، خوراک و لباس گرم همراه داشته باشید، چون زین گردنه حتی در اوت سرد است. راه پس از هر زمستان تغییر
    می‌کند؛ پیش از آنکه دل به راه بزنید، در لنتخی یا اوشگولی پرس‌وجو کنید.
  route: >-
    از تفلیس با E60 (S1) تا کوتائیسی بروید، سپس با Sh15 از تسقالتوبو و تساگری بگذرید تا لنتخی: حدود ۳۵۰
    کیلومتر و شش ساعت، تقریباً همه آسفالت. از لنتخی حدود ۶۵ کیلومتر جادهٔ هرچه ناهموارتر، که ۵۶ کیلومترش
    تا تسانا است، به گردنه می‌رسد؛ سه ساعت یا بیشتر وقت بگذارید. روی هم حدود ۴۲۰ کیلومتر و نه ساعت می‌شود،
    برای همین بیشتر مسافران یک شب در لنتخی می‌مانند. مسیر تنها از حدود نیمهٔ ژوئن تا اواخر سپتامبر باز
    است. این راه تنها برای خودروهای آفرود است: گدارها، سنگ‌ها و جادهٔ باریکِ کنده در دل صخره یک خودروی
    دودیفرانسیل واقعی با ارتفاع زیاد از زمین می‌خواهند، نه خودروی اقتصادی یا میان‌رده.
he:
  name: מעבר זגרי
  short: דרך הררית לקיץ בלבד מלנטחי לאושגולי, על פני מפעל ארסן נטוש ומעל אוכף בגובה 2,600 מטר – בלי דלק
    ובלי קליטה.
  body: >-
    **זגרי היא הדלת האחורית לסוואנטי העילית: דרך לקיץ בלבד שמטפסת מעמק הצחניסצקלי לגובה של כ-2,600 מטר,
    ואז צונחת היישר אל אושגולי.**


    הרבה לפני שהיו כבישים, זה היה האוכף שדרכו הגיעה סוואנטי התחתית אל האנגורי. המקורות נותנים לו גובה
    של בין 2,570 ל-2,620 מטר, ורוב השנה המספר הוא עניין אקדמי: השלג סוגר את המעבר, והדרך פתוחה בפועל רק
    מאמצע יוני ועד סוף ספטמבר או תחילת אוקטובר.


    מלנטחי העמק מצטמצם, הכפרים מתדלדלים והאספלט מפנה את מקומו לאבנים, לחציות נחלים ולדרך מדף חצובה במדרון.
    היישוב האחרון הוא צאנה, בגובה 1,700 מטר. הוא מוזכר לראשונה במסמך מ-1503, יושב מחדש בסוף המאה ה-19
    בידי משפחות מאושגולי, ובמפקד 2014 לא נמצא בו אף תושב קבע. לידו עומדים שלדי מפעל הכרייה והכימיקלים
    של צאנה, שעיבד עפרת ארסן מ-1938 עד 1991. אחרי סגירתו נותרה האדמה מורעלת בפסולת; ב-2023 רכשה המדינה
    את האתר כדי לאטום את הארסן תחת סרקופג.


    מעל צאנה היער מפנה מקום לאחו, והאחו לאוכף חשוף שבו הרוח לעולם אינה שוככת לגמרי. ואז נפתח הצד השני:
    הקרח של גוש שחרה בצפון, מקורות האנגורי למטה, ומגדלי אושגולי במרחק ירידה קצרה.


    נהגים רבים זוכרים את הדרך הזאת יותר מאשר את אושגולי עצמה. וזה רק הוגן: הם הרוויחו אותה ביושר.
  tip: >-
    צאו רק ברכב 4x4 אמיתי עם מרווח גחון גבוה, ורק במזג אוויר יציב: אחרי גשם הנחלים בחציות גואים והחימר
    הופך לסבון. צאו מלנטחי עם מיכל מלא, כי אין דלק עד מסטיה. הקליטה נעלמת לקטעים ארוכים, אז הורידו מפות
    לא מקוונות וספרו למישהו על התוכנית שלכם. אל תעשו פיקניק, אל תמלאו בקבוקים ואל תאספו אבנים סביב מפעל
    צאנה – האדמה שם מזוהמת בפסולת ארסן. קחו מים, אוכל ושכבות חמות, כי על האוכף קר גם באוגוסט. הדרך משתנה
    אחרי כל חורף, לכן שאלו בלנטחי או באושגולי לפני שאתם מתחייבים למסלול.
  route: >-
    מטביליסי סעו בכביש E60 (S1) עד קוטאיסי, משם בכביש Sh15 דרך צקלטובו וצאגרי עד לנטחי: כ-350 ק"מ ושש
    שעות, כמעט הכול סלול. מלנטחי מובילים אל המעבר כ-65 ק"מ של דרך שהולכת ומחמירה – 56 מהם עד צאנה; הקדישו
    שלוש שעות או יותר. בסך הכול כ-420 ק"מ ותשע שעות, ולכן רוב הנוסעים מחלקים את הדרך בלינה בלנטחי. המסלול
    פתוח רק מאמצע יוני בערך ועד סוף ספטמבר. זו דרך לרכבי שטח בלבד: חציות נחלים, סלעים ודרך מדף דורשים
    רכב 4x4 אמיתי עם מרווח גחון גבוה, לא רכב אקונומי או בינוני.
ar:
  name: ممر زاغاري
  short: >-
    مسلك جبلي صيفي فقط من لينتيخي إلى أوشغولي، يمرّ بمصنع زرنيخ ميت ويعبر سرجاً على ارتفاع 2600 متر، بلا
    وقود ولا إشارة.
  body: >-
    **زاغاري هو الباب الخلفي إلى سفانيتي العليا: مسلك لا يُفتح إلا صيفاً، يصعد من وادي تسخينيستسكالي إلى
    نحو 2600 متر ثم يهبط مباشرة إلى أوشغولي.**


    قبل زمن الطرق بكثير كان هذا السرج سبيل سفانيتي السفلى إلى نهر إنغوري. وتضع المصادر ارتفاعه في مكان
    ما بين 2570 و2620 متراً، وفي معظم أيام السنة لا يعني الرقم إلا أهل الكتب: فالثلج يغلق الممر، والطريق
    لا يُفتح فعلياً إلا من منتصف يونيو إلى أواخر سبتمبر أو أوائل أكتوبر.


    من لينتيخي يضيق الوادي وتتباعد القرى، ويفسح الإسفلت مكانه للحجارة والمخاضات وطريق الرفّ المحفور في
    السفح. آخر القرى تسانا، على ارتفاع 1700 متر. ورد ذكرها أول مرة في وثيقة من عام 1503، وأعادت أسرٌ من
    أوشغولي إعمارها في أواخر القرن التاسع عشر، ولم يُسجَّل فيها في تعداد 2014 أي ساكن دائم. وإلى جوارها
    تقف هياكل مجمع تسانا للتعدين والكيماويات، الذي عالج خام الزرنيخ من 1938 إلى 1991. وبعد إغلاقه بقيت
    الأرض مسمومة بالنفايات؛ وفي عام 2023 اشترت الدولة الموقع لتعزل الزرنيخ تحت غطاء عازل.


    فوق تسانا تنحسر الغابة أمام المروج، والمروج أمام سرج عارٍ لا تهدأ فيه الريح تماماً. ثم ينفتح الجانب
    الآخر: جليد كتلة شخارا في الشمال، ومنابع إنغوري في الأسفل، وأبراج أوشغولي على مسافة نزول قصيرة.


    كثير من السائقين يتذكرون هذا الطريق أطول مما يتذكرون أوشغولي نفسها. وهذا إنصاف: فقد استحقوه.
  tip: >-
    لا تذهب إلا بسيارة دفع رباعي حقيقية ذات خلوص أرضي عالٍ، وفي طقس مستقر فقط: بعد المطر تفيض المخاضات
    ويصير الطين كالصابون. غادر لينتيخي بخزان ممتلئ، فلا وقود قبل ميستيا. تختفي الإشارة لمسافات طويلة،
    فنزّل خرائط تعمل دون اتصال وأخبر أحداً بخطتك. لا تتناول طعامك في العراء ولا تملأ القوارير ولا تجمع
    الحجارة حول مصنع تسانا، فالتربة هناك ملوثة بنفايات الزرنيخ. احمل الماء والطعام وثياباً دافئة، فالسرج
    بارد حتى في أغسطس. يتغيّر المسلك بعد كل شتاء، فاسأل في لينتيخي أو أوشغولي قبل أن تحسم أمرك.
  route: >-
    من تبليسي خذ الطريق E60 (S1) إلى كوتايسي، ثم الطريق Sh15 عبر تسكالتوبو وتساغيري إلى لينتيخي: نحو 350
    كم وست ساعات، كلها تقريباً على الإسفلت. ومن لينتيخي يقود إلى الممر نحو 65 كم من طريق يزداد وعورة،
    منها 56 كم حتى تسانا؛ فخصّص ثلاث ساعات أو أكثر. المجموع نحو 420 كم وتسع ساعات، ولذلك يقسم معظم المسافرين
    الرحلة بليلة في لينتيخي. لا يُفتح الطريق إلا من منتصف يونيو تقريباً حتى أواخر سبتمبر. إنها أرض للطرق
    الوعرة حصراً: المخاضات والصخور وطريق الرفّ تتطلب سيارة دفع رباعي حقيقية ذات خلوص أرضي عالٍ، لا سيارة
    اقتصادية أو متوسطة.
