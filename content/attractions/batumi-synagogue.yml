ka:
  name: ბათუმის სინაგოგა
  short: >-
    1904 წლის აშკენაზური სინაგოგა 1923 წელს საბჭოთა სპორტულ დარბაზად აქციეს და მხოლოდ 1998 წელს დააბრუნეს;
    დღეს კვლავ სალოცავია, ბულვარის ახლოს.
  body: >-
    **სამოცდათხუთმეტი წლის განმავლობაში, 1923-დან 1998 წლამდე, ბათუმის სინაგოგა ყველაფერი იყო, სინაგოგის
    გარდა — მათ შორის საბჭოთა სპორტული დარბაზიც, — მრევლი კი ამ ხნის მანძილზე ჩუმად, კერძო ბინებში ლოცულობდა.**


    ამბავი უფრო ადრე იწყება: XIX საუკუნის ბოლოსთვის ნავსადგურ-ქალაქის ევროპელ, აშკენაზ ებრაელებს უკვე
    ჰქონდათ არაოფიციალური სალოცავი სახლი. ნამდვილი სინაგოგის აშენების თხოვნის განხილვა ხელისუფლებამ სამჯერ
    გადადო, სანამ 1899 წელს იმპერატორმა ნიკოლოზ II-მ ნებართვა არ გასცა. თემმა თურქ მფლობელს ქონებაში 2000
    მანეთი გადაუხადა და მშენებლობა არქიტექტორ სემიონ ვულკოვიჩს მიანდო. სინაგოგა 1904 წელს გაიხსნა, თუმცა
    სამუშაოები სულ მცირე 1912 წლამდე გაგრძელდა.


    მშენებლები ამსტერდამისა და ჰააგის სინაგოგებით შთაგონდნენ, და ვაჟა-ფშაველას ქუჩაზე მდგარი ქვის შენობა
    დღესაც ისე იჭერს თავს, როგორც ჩრდილოელი ევროპელი, რომელიც შავ ზღვაზე ჩამოვიდა და აქ დარჩენა გადაწყვიტა.
    ნავსადგურში, სადაც უკვე იდგა მეჩეთიც და ეკლესიებიც, ეს მშვიდი და მკაფიო განცხადება იყო: ეს თემი აქ
    დასარჩენად მოვიდა.


    1923 წელს საბჭოთა ხელისუფლებამ შენობა თემს ჩამოართვა; მომდევნო ათწლეულებში ის სხვადასხვა დანიშნულებით,
    მათ შორის სპორტულ დარბაზად, გამოიყენებოდა. ლოცვა არ შეწყვეტილა — ის სახლებში გადაინაცვლა, თვალს მიღმა.
    სინაგოგა ებრაულ თემს მხოლოდ 1998 წლის ნოემბერში დაუბრუნდა და კვლავ სალოცავად იქცა.


    დღეს ეს მოქმედი სინაგოგაა: მრევლი შაბათობით და ებრაულ დღესასწაულებზე იკრიბება, შენობა კი ბათუმის ებრაული
    მემკვიდრეობის საფეხმავლო ტურების მუდმივი გაჩერებაა — ამ ტურებს ბევრი სტუმარი ისრაელიდან ჰყავს.


    შენობამ, რომელმაც XX საუკუნის დიდი ნაწილი სხვის როლში გაატარა, კვლავ დაიბრუნა ის, რისთვისაც აშენდა.
  tip: >-
    შესვლა უფასოა, მაგრამ ეს მოქმედი სინაგოგაა და არა მუზეუმი. ყველაზე მოსახერხებელია სამუშაო დღეს მისვლა;
    თუ კარი დაკეტილია, შესასვლელთან იკითხეთ, ჯგუფით ვიზიტი კი წინასწარ შეათანხმეთ. შაბათობით და ებრაულ
    დღესასწაულებზე ლოცვას აქვს უპირატესობა, ლოცვის დროს გადაღება კი გამორიცხულია. ჩაიცვით თავშეკავებულად;
    მამაკაცებს თავი უნდა ჰქონდეთ დაფარული, ამიტომ ქუდი იქონიეთ. ნახევარი საათი სავსებით საკმარისია. ბათუმის
    ცენტრში ქუჩის პარკირება ფასიანია, ძირითადად აპლიკაციით ან მოკლე შეტყობინებით, ამიტომ მანქანა სასტუმროსთან
    ან ბულვარის ავტოსადგომზე დატოვეთ და ფეხით იარეთ: ევროპის მოედანი და პიაცა რამდენიმე წუთის სავალზეა.
  route: >-
    თბილისიდან სინაგოგამდე დაახლოებით 370 კილომეტრია — ხუთნახევარი საათის სავალი, მთელ გზაზე ასფალტით.
    ს1-ით (E60) დასავლეთით იარეთ — გორისა და ხაშურის გავლით, რიკოთის გვირაბებში და ქუთაისის გვერდით სამტრედიამდე,
    შემდეგ ს12-ით ლანჩხუთის გავლით ზღვისპირა გრიგოლეთამდე, იქიდან კი ს2-ით სამხრეთით, ქობულეთის გავლით
    ბათუმამდე. გზის დიდი ნაწილი ოთხზოლიანია და ეკონომკლასის მანქანაც სავსებით საკმარისია; ბენზინგასამართი
    სადგურები ხშირია. ქალაქში ძველი უბნისკენ აიღეთ გეზი: სინაგოგა ვაჟა-ფშაველას ქუჩა №33-ში დგას, ბულვარიდან
    რამდენიმე ასეულ მეტრში. ზაფხულის შაბათ-კვირას თბილისიდან ადრე გამოდით, სანამ ზღვისპირა გზა გაიჭედება.
en:
  name: Batumi Synagogue
  short: >-
    Batumi's 1904 Ashkenazi synagogue became a Soviet sports hall in 1923 and was returned only in 1998;
    today it is a house of prayer again, near the boulevard.
  body: >-
    **For seventy-five years, from 1923 to 1998, Batumi's synagogue was anything but a synagogue — a Soviet
    sports hall among other things — while its congregation prayed quietly in private flats.**


    The story starts earlier, with the port's European, Ashkenazi Jews, who by the late 19th century were
    already worshipping in an unofficial house of prayer. Three times the authorities put off the community's
    request for a proper synagogue before Emperor Nicholas II finally gave permission in 1899. The community
    paid a Turkish owner 2,000 roubles ("manats", as they were called locally) for the property and engaged
    the architect Semyon Vulkovich. The synagogue opened in 1904, although work on it went on until at
    least 1912.


    Its builders looked to the synagogues of Amsterdam and The Hague, and the stone building on Vazha-Pshavela
    Street still carries itself like a northern European who came to the Black Sea and decided to stay.
    In a port that already had its mosque and its churches, it was a plain statement that this community
    meant to remain.


    In 1923 the Soviet authorities took the building; over the following decades it served various purposes,
    a sports hall among them. Worship did not stop; it moved into people's homes, out of sight. Only in
    November 1998 was the synagogue handed back to the Jewish community and opened for prayer once more.


    Today it is a working synagogue. The congregation gathers on Saturdays and on Jewish holidays, and
    the building is a fixed stop on Batumi's Jewish-heritage walks, which draw many visitors from Israel.


    A building that spent most of the twentieth century pretending to be something else is, once again,
    simply what it was built to be.
  tip: >-
    Entry is free, but this is a working synagogue, not a museum. A weekday visit is easiest; if the door
    is closed, ask at the entrance, and arrange groups in advance. On Saturdays and Jewish holidays the
    services come first, and photography during prayer is out of the question. Dress modestly; men should
    cover their heads, so bring a cap. Half an hour is plenty. Street parking in central Batumi is paid,
    mostly by app or SMS, so leave the car at your hotel or in a boulevard car park and walk: Europe Square
    and the Piazza are a few minutes away.
  route: >-
    Tbilisi to the synagogue is about 370 km, around five and a half hours, on asphalt all the way. Take
    the S1 (E60) west past Gori and Khashuri, through the Rikoti tunnels and past Kutaisi to Samtredia,
    then the S12 through Lanchkhuti to Grigoleti on the coast, and the S2 south through Kobuleti into
    Batumi. Much of the road is dual carriageway, and an economy car is entirely enough; fuel stations
    are frequent. In the city head for the old town: the synagogue stands at 33 Vazha-Pshavela Street,
    a few hundred metres from the boulevard. On summer weekends leave Tbilisi early, before the coast
    road clogs.
ru:
  name: Батумская синагога
  short: >-
    Ашкеназская синагога Батуми 1904 года в 1923-м стала советским спортзалом и вернулась к общине лишь
    в 1998-м; сегодня здесь снова молятся.
  body: >-
    **Семьдесят пять лет, с 1923 по 1998 год, батумская синагога была чем угодно, только не синагогой
    — в том числе советским спортзалом, — а община тем временем тихо молилась по частным квартирам.**


    История начинается раньше — с европейских евреев-ашкеназов портового города, которые уже к концу XIX
    века собирались на молитву в неофициальном молельном доме. Трижды община просила разрешения построить
    настоящую синагогу и трижды решение откладывали, пока в 1899 году император Николай II наконец не
    дал согласия. Участок купили у владельца-турка за 2000 манатов (так в Закавказье называли рубли),
    проект поручили архитектору Семёну Вулковичу. Синагогу открыли в 1904 году, хотя работы продолжались
    по меньшей мере до 1912-го.


    Строители равнялись на синагоги Амстердама и Гааги, и каменное здание на улице Важа-Пшавела до сих
    пор держится как северный европеец, который приехал к Чёрному морю и решил остаться. В порту, где
    уже были своя мечеть и свои церкви, это было простое и ясное заявление: эта община пришла надолго.


    В 1923 году советская власть забрала здание; в последующие десятилетия его использовали по-разному,
    в том числе как спортивный зал. Молитва не прекратилась — она ушла в дома, подальше от чужих глаз.
    Лишь в ноябре 1998 года синагогу вернули еврейской общине, и в ней снова начали молиться.


    Сегодня это действующая синагога. Община собирается по субботам и в еврейские праздники, а здание
    — непременная остановка на маршрутах по еврейскому наследию Батуми, куда приезжает много гостей из
    Израиля.


    Здание, которое большую часть XX века притворялось чем-то другим, снова стало просто тем, для чего
    его строили.
  tip: >-
    Вход свободный, но это действующая синагога, а не музей. Проще всего прийти в будний день; если дверь
    закрыта, спросите у входа, а группам лучше договориться заранее. По субботам и в еврейские праздники
    главное — богослужение, и фотографировать во время молитвы недопустимо. Одевайтесь скромно; мужчинам
    нужно покрыть голову, так что захватите кепку. Получаса вполне достаточно. Парковка на улицах центра
    Батуми платная, в основном через приложение или по СМС, поэтому оставьте машину у отеля или на стоянке
    у бульвара и пройдитесь пешком: площадь Европы и Пьяцца — в нескольких минутах.
  route: >-
    От Тбилиси до синагоги около 370 км, примерно пять с половиной часов, и всё по асфальту. Поезжайте
    по S1 (E60) на запад мимо Гори и Хашури, через Рикотские тоннели и мимо Кутаиси до Самтредиа, затем
    по S12 через Ланчхути до Григолети на побережье и по S2 на юг через Кобулети в Батуми. Большая часть
    пути — трасса с разделительной полосой, и машины эконом-класса хватит с лихвой; заправки попадаются
    часто. В городе держите курс на старый город: синагога стоит на улице Важа-Пшавела, 33, в нескольких
    сотнях метров от бульвара. В летние выходные выезжайте из Тбилиси пораньше, пока прибрежная трасса
    не встала в пробках.
fa:
  name: کنیسه‌ی باتومی
  short: >-
    کنیسه‌ی اشکنازی باتومی، ساخته‌ی ۱۹۰۴، در ۱۹۲۳ سالن ورزشی شوروی شد و تنها در ۱۹۹۸ بازگردانده شد؛ امروز
    دوباره خانه‌ی نیایش است، نزدیک بلوار.
  body: >-
    **کنیسه‌ی باتومی هفتاد و پنج سال، از ۱۹۲۳ تا ۱۹۹۸، هر چیزی بود جز کنیسه، از جمله سالن ورزشی شوروی،
    و در تمام این سال‌ها جماعتش بی‌سروصدا در خانه‌های شخصی دعا می‌خواندند.**


    داستان از پیش‌تر آغاز می‌شود، با یهودیان اروپایی و اشکنازی این بندر که تا اواخر سده‌ی نوزدهم در عبادتگاهی
    غیررسمی گرد می‌آمدند. درخواست ساختن کنیسه‌ای درخور سه بار به تعویق افتاد تا سرانجام در ۱۸۹۹ امپراتور
    نیکلای دوم اجازه داد. جامعه‌ی یهودی ملک را به ۲۰۰۰ روبل (منات به زبان محلی) از مالکی ترک خرید و ساخت
    بنا را به معمار سمیون وولکوویچ سپرد. کنیسه در ۱۹۰۴ گشایش یافت، هرچند کار روی آن دست‌کم تا ۱۹۱۲ ادامه
    داشت.


    سازندگانش کنیسه‌های آمستردام و لاهه را الگو گرفتند، و این بنای سنگی در خیابان واژا-پشاولا هنوز چنان
    قامت راست کرده که گویی اروپایی‌ای از شمال است که به کرانه‌ی دریای سیاه آمده و تصمیم گرفته بماند. در
    بندری که پیش‌تر مسجد و کلیساهای خود را داشت، این بنا اعلامی ساده و روشن بود: این جماعت آمده است که
    بماند.


    در ۱۹۲۳ مقامات شوروی بنا را گرفتند؛ در دهه‌های بعد برای کارهای گوناگون، از جمله سالن ورزشی، به کار
    رفت. عبادت متوقف نشد؛ به خانه‌ها رفت، دور از چشم‌ها. تنها در نوامبر ۱۹۹۸ کنیسه به جامعه‌ی یهودی بازگردانده
    شد و بار دیگر درهایش به روی نیایش گشوده شد.


    امروز کنیسه‌ای فعال است. جماعت شنبه‌ها و در اعیاد یهودی گرد هم می‌آیند، و این بنا ایستگاه ثابت گشت‌های
    میراث یهودی باتومی است که گردشگران بسیاری از اسرائیل را به خود می‌کشد.


    بنایی که بیشتر سده‌ی بیستم را در نقش چیز دیگری گذراند، اکنون دوباره همان است که برایش ساخته شد.
  tip: >-
    ورود رایگان است، اما این‌جا کنیسه‌ای فعال است، نه موزه. آسان‌ترین زمان بازدید روزهای میان هفته است؛
    اگر در بسته بود، دمِ ورودی بپرسید، و گروه‌ها بهتر است از پیش هماهنگ کنند. شنبه‌ها و در اعیاد یهودی
    مراسم عبادت بر همه‌چیز مقدم است و عکاسی هنگام دعا به هیچ روی پذیرفته نیست. پوشش محجوب داشته باشید؛
    مردان باید سر خود را بپوشانند، پس کلاهی همراه بیاورید. نیم ساعت کاملاً کافی است. پارک در خیابان‌های
    مرکز باتومی پولی است و بیشتر با اپلیکیشن یا پیامک پرداخت می‌شود؛ پس خودرو را در هتل یا پارکینگی نزدیک
    بلوار بگذارید و پیاده بروید: میدان اروپا و پیاتسا چند دقیقه بیشتر راه نیستند.
  route: >-
    از تفلیس تا کنیسه حدود ۳۷۰ کیلومتر راه است، نزدیک به پنج ساعت و نیم، و سراسر آسفالت. جاده‌ی S1 (E60)
    را به سمت غرب بگیرید، از کنار گوری و خاشوری بگذرید، از تونل‌های ریکوتی عبور کنید و از کنار کوتائیسی
    تا سامتردیا برانید؛ سپس با S12 از لانچخوتی تا گریگولتی در کرانه‌ی دریا بروید و از آن‌جا با S2 به سمت
    جنوب، از کوبولتی به باتومی. بخش بزرگی از مسیر جاده‌ی چهاربانده با جداکننده است و یک خودروی اکونومی
    کاملاً کافی است؛ جایگاه سوخت فراوان است. در شهر به سوی بافت قدیم بروید: کنیسه در پلاک ۳۳ خیابان واژا-پشاولا
    است، چند صد متر آن‌سوتر از بلوار. در آخر هفته‌های تابستان زود از تفلیس راه بیفتید، پیش از آن‌که جاده‌ی
    ساحلی قفل شود.
he:
  name: בית הכנסת של בטומי
  short: >-
    בית הכנסת האשכנזי של בטומי, שנחנך ב-1904, הפך ב-1923 לאולם ספורט סובייטי והוחזר רק ב-1998; היום הוא
    שוב בית תפילה, סמוך לשדרה.
  body: >-
    **במשך שבעים וחמש שנה, מ-1923 ועד 1998, היה בית הכנסת של בטומי הכול חוץ מבית כנסת – בין השאר אולם
    ספורט סובייטי – ובני הקהילה התפללו בשקט בדירות פרטיות.**


    הסיפור מתחיל מוקדם יותר, עם היהודים האירופים, האשכנזים, של עיר הנמל, שכבר בסוף המאה ה-19 התפללו בבית
    תפילה לא רשמי. הבקשה לבנות בית כנסת של ממש עוכבה שלוש פעמים, עד שב-1899 נתן סוף סוף הקיסר ניקולאי
    השני את אישורו. הקהילה שילמה לבעל קרקע טורקי 2,000 רובל ("מנאט" בלשון המקום) תמורת המגרש והזמינה את
    התכנון מהאדריכל סמיון וולקוביץ'. בית הכנסת נחנך ב-1904, אף שהעבודות בו נמשכו לפחות עד 1912.


    הבונים לקחו דוגמה מבתי הכנסת של אמסטרדם ושל האג, ומבנה האבן ברחוב ואז'ה-פשאוולה עדיין ניצב בזקיפות
    קומה של אירופי מן הצפון שהגיע לים השחור והחליט להישאר. בעיר נמל שכבר היו בה מסגד וכנסיות, זו הייתה
    הצהרה פשוטה וברורה: הקהילה הזאת באה כדי להישאר.


    ב-1923 לקחו השלטונות הסובייטיים את הבניין; בעשורים שלאחר מכן שימש למטרות שונות, ובהן אולם ספורט. התפילה
    לא פסקה; היא עברה לבתים, הרחק מעין זרה. רק בנובמבר 1998 הוחזר בית הכנסת לקהילה היהודית ונפתח שוב לתפילה.


    היום זהו בית כנסת פעיל. הקהילה מתכנסת בשבתות ובחגים, והבניין הוא תחנה קבועה בסיורי המורשת היהודית
    של בטומי, שמושכים מבקרים רבים מישראל.


    בניין שבילה את רוב המאה העשרים בהתחזות למשהו אחר חזר להיות, פשוט, מה שנבנה להיות.
  tip: >-
    הכניסה חינם, אבל זהו בית כנסת פעיל, לא מוזיאון. הכי פשוט לבוא ביום חול; אם הדלת סגורה, שאלו בכניסה,
    וקבוצות כדאי שיתאמו מראש. בשבתות ובחגים התפילה קודמת לכול, וצילום בזמן התפילה לא בא בחשבון. התלבשו
    בצניעות; גברים צריכים לכסות את הראש, אז הביאו כובע. חצי שעה מספיקה בהחלט. החנייה ברחובות מרכז בטומי
    בתשלום, בעיקר דרך אפליקציה או מסרון, לכן השאירו את הרכב במלון או בחניון ליד השדרה והמשיכו ברגל: כיכר
    אירופה והפיאצה במרחק דקות ספורות.
  route: >-
    מטביליסי לבית הכנסת כ-370 ק"מ, כחמש שעות וחצי, בכביש סלול לכל אורכו. סעו מערבה בכביש S1 (E60), על
    פני גורי וחשורי, דרך מנהרות ריקוטי ועל פני קוטאיסי עד סמטרדיה; משם בכביש S12 דרך לנצ'חוטי עד גריגולטי
    שעל החוף, ובכביש S2 דרומה דרך קובולטי אל בטומי. חלק גדול מהדרך הוא כביש מחולק, ורכב אקונומי מספיק
    בהחלט; תחנות דלק יש לרוב. בעיר כוונו לעיר העתיקה: בית הכנסת עומד ברחוב ואז'ה-פשאוולה 33, כמה מאות
    מטרים מהשדרה. בסופי שבוע בקיץ צאו מטביליסי מוקדם, לפני שכביש החוף נסתם.
ar:
  name: كنيس باتومي
  short: >-
    كنيس باتومي الأشكنازي، المشيَّد عام 1904، صار صالةً رياضية سوفييتية عام 1923 ولم يُعَد إلا عام 1998؛
    واليوم عاد بيتًا للصلاة قرب البوليفار.
  body: >-
    **طوال خمسة وسبعين عامًا، من 1923 إلى 1998، كان كنيس باتومي أي شيء إلا كنيسًا، ومن ذلك صالة رياضية
    سوفييتية، فيما كان أبناء الطائفة يصلّون بصمت في شقق خاصة.**


    تبدأ الحكاية قبل ذلك، مع يهود الميناء الأوروبيين الأشكناز، الذين كانوا منذ أواخر القرن التاسع عشر
    يصلّون في بيت صلاة غير رسمي. أُرجئ طلب بناء كنيس لائق ثلاث مرات، إلى أن أذن الإمبراطور نيقولا الثاني
    أخيرًا عام 1899. دفعت الطائفة لمالكٍ تركي 2000 روبل (أو «منات» كما كان يُسمّى محليًا) ثمنًا للعقار،
    وعهدت بالتصميم إلى المعماري سيميون فولكوفيتش. افتُتح الكنيس عام 1904، وإن ظلّ العمل فيه مستمرًّا حتى
    عام 1912 على الأقل.


    استلهم بُناته كُنُس أمستردام ولاهاي، ولا يزال المبنى الحجري في شارع فاجا-بشافيلا منتصبًا بقامة أوروبيٍّ
    من الشمال جاء إلى البحر الأسود وقرّر البقاء. وفي ميناءٍ كان له مسجده وكنائسه، كان ذلك إعلانًا بسيطًا
    وواضحًا: هذه الطائفة جاءت لتبقى.


    في عام 1923 استولت السلطات السوفييتية على المبنى، واستُخدم في العقود التالية لأغراض شتى، منها صالة
    رياضية. لم تتوقف الصلاة، بل انتقلت إلى البيوت بعيدًا عن الأعين. ولم يُعَد الكنيس إلى الطائفة اليهودية
    ويُفتح للصلاة من جديد إلا في نوفمبر 1998.


    اليوم هو كنيس عامل. تجتمع الطائفة أيام السبت وفي الأعياد اليهودية، والمبنى محطة ثابتة في جولات التراث
    اليهودي في باتومي، التي تجتذب زوّارًا كثيرين من إسرائيل.


    مبنى أمضى معظم القرن العشرين متنكّرًا في هيئة شيء آخر، عاد ببساطة إلى ما بُني من أجله.
  tip: >-
    الدخول مجاني، لكن هذا كنيس عامل وليس متحفًا. أيسر وقت للزيارة أيام الأسبوع العادية؛ فإن وجدتم الباب
    مغلقًا فاسألوا عند المدخل، وعلى المجموعات أن ترتّب زيارتها مسبقًا. أيام السبت والأعياد اليهودية تتقدّم
    الصلاة على كل شيء، والتصوير أثناءها غير وارد إطلاقًا. التزموا اللباس المحتشم؛ وعلى الرجال تغطية رؤوسهم،
    فاحملوا معكم قبعة. نصف ساعة تكفي تمامًا. الوقوف في شوارع وسط باتومي مدفوع، غالبًا عبر تطبيق أو رسالة
    نصية، فاتركوا السيارة في الفندق أو في موقف قرب البوليفار وتابعوا سيرًا على الأقدام: ساحة أوروبا والبياتسا
    على بُعد دقائق.
  route: >-
    من تبليسي إلى الكنيس نحو 370 كم، أي قرابة خمس ساعات ونصف، على طريق معبّد بالكامل. اسلكوا الطريق S1
    ‏(E60) غربًا مرورًا بغوري وخاشوري، عبر أنفاق ريكوتي ومتجاوزين كوتايسي حتى سامتريديا، ثم الطريق S12
    عبر لانتشخوتي إلى غريغوليتي على الساحل، ثم الطريق S2 جنوبًا عبر كوبوليتي إلى باتومي. معظم الطريق مزدوج
    بفاصل أوسط، وتكفي تمامًا سيارة اقتصادية؛ ومحطات الوقود كثيرة. في المدينة اتجهوا إلى البلدة القديمة:
    يقع الكنيس في 33 شارع فاجا-بشافيلا، على بُعد بضع مئات من الأمتار من البوليفار. وفي عطلات الصيف الأسبوعية
    انطلقوا من تبليسي باكرًا، قبل أن يختنق الطريق الساحلي بالسيارات.
