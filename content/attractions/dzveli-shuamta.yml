ka:
  name: ძველი შუამთა
  short: >-
    V და VII საუკუნეების სამი ქვის ეკლესია გომბორის ტყეში, თელავის თავზე — ბერები დიდი ხანია წავიდნენ,
    ეზო ხეებსა და სიჩუმეს დარჩა.
  body: >-
    **ძველ შუამთაში ქართული ხუროთმოძღვრების ორი საუკუნე ტყით გარშემორტყმულ ერთ ეზოში დგას და, უმეტეს დღეს,
    ეს ეზო მხოლოდ თქვენია.**


    შუამთა „მთებს შორის“ ნიშნავს და სახელი არ ტყუის: ეკლესიები ზღვის დონიდან დაახლოებით 1000 მეტრზე, ცივ-გომბორის
    ქედის ტყიან კალთაზე დგას, თელავიდან რამდენიმე კილომეტრში, და ტყე ყოველი მხრიდან ეკვრის. სამი ნაგებობა
    — სამი ხანა:


    - **V საუკუნის სამნავიანი ბაზილიკა** — ყველაზე ხნიერი, გრძელი და დაბალი;

    - **VII საუკუნის გუმბათოვანი ეკლესია**, მცხეთის ჯვრის ტიპისა, ოღონდ უფრო მცირე: აფსიდები ნაკლებად
    ღრმაა, გუმბათის ყელს მეტი წონა აქვს, ტრომპები კი, რომლებსაც გუმბათი ეყრდნობა, დაუფარავად ჩანს;

    - **VII საუკუნის მეორე, კიდევ უფრო პატარა გუმბათოვანი ეკლესია** — ჯვარი ტოლი მკლავებით, კუთხის სათავსების
    გარეშე.


    კედლებს ხელი შეახეთ. ისინი რიყის ქვითაა ნაგები, კუთხეებს კი შირიმის თლილი კვადრები კრავს — ასე აშენებდნენ
    ოსტატები, რომლებიც იმას იყენებდნენ, რასაც ხეობა აძლევდათ.


    XVI საუკუნისთვის ბერები აქედან უკვე წასულიყვნენ. მერე კახეთის მეფე ლევანის მეუღლემ, დედოფალმა თინათინმა,
    იმავე შესახვევ გზაზე, ცოტა ქვემოთ, ახალი მონასტერი დააარსა და სახელებიც თავისთავად დამკვიდრდა: ძველი
    და ახალი შუამთა. ძველი ეკლესიები 2008 წელს აღადგინეს — თავშეკავებულად: შიგნით დღესაც მხოლოდ შიშველი
    ქვა და პატარა სარკმლებიდან შემოსული თხელი შუქია.


    ბაზილიკიდან გვერდით მდგარ დიდ გუმბათოვან ეკლესიაში ათიოდე ნაბიჯით გადახვალთ და თან ორ საუკუნეს გადაკვეთთ
    — ორი საუკუნის ძიებას იმისა, თუ როგორ უნდა აზიდულიყო ქვა გუმბათად.
  tip: >-
    ბილეთი არ არის და ხშირად არც არავინაა; ეკლესიები უმეტესად ღიაა, მაგრამ ყოველთვის არა. თავსაფარი თან
    იქონიეთ, მხრები და მუხლები დაიფარეთ — შეიძლება ახლოს ვერავინ ნახოთ, ვინც გადასაფარებელს მოგაწვდით.
    ტუალეტი და კაფე აქ არ არის, თელავი ოცი წუთის სავალზეა. წვიმის შემდეგ მისასვლელი ტალახიანდება, ზაფხულის
    შუაგულში კი ტყეში კოღოებია — საწინააღმდეგო საშუალება წაიღეთ. მოდით დილით ან ნაშუადღევს, როცა შუქი
    ხეებიდან ირიბად ეცემა ქვას. ორმოცდახუთი წუთი სავსებით საკმარისია; იმავე გზაზე, ერთი წუთის სავალზე
    ქვემოთ, ახალი შუამთაა — ორივე ერთად მოინახულეთ.
  route: >-
    თბილისიდან გადით კახეთის გზატკეცილზე (ს5) და დაახლოებით 20 კილომეტრში, ვაზიანთან, გადაუხვიეთ შ38-ზე
    — უჯარმის, გომბორის უღელტეხილისა და თელავის მიმართულებით. უღელტეხილის შემდეგ გზა ტყეში კლაკნილად ეშვება;
    თბილისიდან დაახლოებით 85-ე კილომეტრზე, თელავამდე რვაოდე კილომეტრით ადრე, მკვეთრად მარჯვნივ გადაუხვიეთ
    შ178-ზე — აქ შუამთის მიმანიშნებელი დაგხვდებათ. დაახლოებით 600 მეტრში ახალი შუამთაა, ძველი — კიდევ
    1,7 კილომეტრით ზემოთ. სულ დაახლოებით საათი და ოცდათხუთმეტი წუთი. ბოლო მონაკვეთი ვიწროა და ნაწილობრივ
    მოუასფალტებელი: ეკონომ-კლასის მანქანა ნელი სვლით გაივლის, თოვლის შემდეგ კი ძნელია. საწვავი თბილისში
    ჩაასხით. თუ უღელტეხილი თოვლით ჩაკეტილია, საგარეჯოსა და გურჯაანის გავლით შემოიარეთ — დაახლოებით 150
    კმ.
en:
  name: Dzveli Shuamta
  short: >-
    Three stone churches of the 5th and 7th centuries in the Gombori forest above Telavi — the monks long
    gone, the clearing left to trees and quiet.
  body: >-
    **Two centuries of Georgian church-building stand in one forest clearing at Dzveli Shuamta, and on
    most days you will have them to yourself.**


    Shuamta means "between the mountains", and the name is honest. The churches stand at about 1,000 metres
    on the wooded flank of the Tsiv-Gombori range, a few kilometres west of Telavi, and the forest presses
    in from every side. Three buildings, three moments:


    - a **5th-century three-nave basilica**, the eldest, long and low;

    - a **7th-century domed church** on the plan of Jvari above Mtskheta, only smaller — shallower apses,
    a drum given more weight, and the squinches that carry the dome left plainly on show;

    - a **second 7th-century domed church**, smaller still: a cross with arms of equal length and no corner
    rooms.


    Put a hand on the walls. They are laid from rounded river stones, with squared blocks of soft shirimi
    stone locking the corners — the method of builders who used what the valley gave them.


    By the 16th century the monks had gone. Queen Tinatin, wife of King Levan of Kakheti, then founded
    a new convent a little way down the same side road, and the names settled into place: Dzveli, "old",
    and Akhali, "new", Shuamta. The old churches were restored in 2008, soberly; inside there is still
    only bare stone and the thin light of small windows.


    Walk from the basilica into the larger domed church beside it and in a dozen steps you cross two hundred
    years of argument about how to lift stone into a dome.
  tip: >-
    There is no ticket, and often nobody around; the churches are frequently open, but not always. Bring
    your own headscarf and cover shoulders and knees, since there may be no one to lend a wrap. There
    are no toilets or café here — Telavi is twenty minutes away. After rain the approach turns muddy,
    and in high summer the forest brings mosquitoes, so pack repellent. Come in the morning or late afternoon,
    when light slants through the trees onto the stone. Forty-five minutes is plenty; pair it with Akhali
    Shuamta, a minute's drive back down the same lane.
  route: >-
    Leave Tbilisi on the S5 Kakheti highway and, about 20 km out near Vaziani, branch onto the Sh38 for
    Ujarma, the Gombori Pass and Telavi. Beyond the pass the road winds down through forest; some 85 km
    from Tbilisi, roughly 8 km short of Telavi, a sharp right onto the Sh178 is signed for Shuamta. Akhali
    Shuamta comes after about 600 m, Dzveli Shuamta some 1.7 km further up. Allow about 1 h 35 min. The
    last stretch is narrow and partly unsealed — fine in an economy car taken slowly, awkward after snow.
    Fill up in Tbilisi. If the pass is snowbound, go round via Sagarejo and Gurjaani: about 150 km.
ru:
  name: Дзвели-Шуамта
  short: >-
    Три каменных храма V и VII веков в гомборском лесу над Телави: монахи давно ушли, а поляна отдана
    деревьям и тишине.
  body: >-
    **Два века грузинского храмового зодчества сошлись на одной лесной поляне в Дзвели-Шуамта, и чаще
    всего вы будете здесь одни.**


    «Шуамта» значит «между гор», и это имя не преувеличение. Храмы стоят на высоте около 1000 метров на
    лесистом склоне Цив-Гомборского хребта, в нескольких километрах западнее Телави, и лес обступает их
    со всех сторон. Три постройки — три эпохи:


    - трёхнефная **базилика V века**, старейшая, вытянутая и приземистая;

    - **купольный храм VII века**, повторяющий план Джвари над Мцхетой, только меньше — апсиды не так
    глубоки, барабан тяжелее, а тромпы, несущие купол, оставлены на виду;

    - **второй купольный храм VII века**, ещё меньше: крест с равными рукавами и без угловых помещений.


    Положите руку на стену. Она сложена из округлых речных валунов, а по углам скреплена тёсаными блоками
    мягкого камня ширими — метод строителей, бравших то, что давала долина.


    К XVI веку монахи покинули это место. Царица Тинатин, супруга кахетинского царя Левана, основала новый
    монастырь чуть ниже по той же боковой дороге, и названия закрепились: Дзвели, «старое», и Ахали, «новое»,
    Шуамта. В 2008 году старые храмы сдержанно отреставрировали; внутри до сих пор лишь голый камень и
    скудный свет из маленьких окон.


    Пройдите из базилики в больший купольный храм рядом — и за десяток шагов пересечёте двести лет спора
    о том, как поднять камень в купол.
  tip: >-
    Билетов здесь нет, и часто вокруг никого; храмы открыты часто, но не всегда. Возьмите с собой платок
    и прикройте плечи и колени — одолжить накидку может не у кого. Ни туалетов, ни кафе тут нет — Телави
    в двадцати минутах езды. После дождя подъезд превращается в грязь, а в разгар лета в лесу заводятся
    комары, так что возьмите репеллент. Приезжайте утром или под вечер, когда свет косо падает через деревья
    на камень. Сорока пяти минут достаточно; совместите с Ахали-Шуамта — минута езды назад по той же дороге.
  route: >-
    Выезжайте из Тбилиси по Кахетинскому шоссе S5 и примерно через 20 км, у Вазиани, сверните на Sh38
    — на Уджарму, Гомборский перевал и Телави. За перевалом дорога вьётся вниз через лес; примерно на
    85-м км от Тбилиси, за 8 км до Телави, указатель на Шуамту велит резко свернуть направо, на Sh178.
    Ахали-Шуамта — через 600 метров, Дзвели-Шуамта — ещё на 1,7 км выше. На дорогу уйдёт около 1 ч 35
    мин. Последний отрезок узок и местами без покрытия — для машины эконом-класса на малой скорости это
    не проблема, а после снега сложнее. Заправьтесь в Тбилиси. Если перевал завален снегом, поезжайте
    в обход через Сагареджо и Гурджаани — около 150 км.
fa:
  name: دزولی شوآمتا
  short: >-
    سه کلیسای سنگی از سده‌های پنجم و هفتم میلادی در جنگل گومبوری، بالای تلاوی؛ راهبان از دیرباز رفته‌اند
    و این فضای باز میان جنگل به درختان و سکوت سپرده شده است.
  body: >-
    **دو سده از معماری کلیسایی گرجی در فضای بازی میان جنگل در دزولی شوآمتا کنار هم ایستاده‌اند، و در بیشتر
    روزها این مکان تنها از آنِ شماست.**


    «شوآمتا» به معنای «میان کوه‌ها» است، و این نام گزافه نیست. کلیساها در ارتفاع حدود هزار متری، بر دامنهٔ
    جنگلی رشته‌کوه تسیو-گومبوری، چند کیلومتر باختر تلاوی برپاشده‌اند و جنگل از هر سو بر آن‌ها فشرده است.
    سه بنا، سه دوران:


    - یک **بازیلیکای سه‌ناو سدهٔ پنجم**، کهن‌ترین، کشیده و کوتاه؛

    - یک **کلیسای گنبددار سدهٔ هفتم**، بر نقشهٔ کلیسای جواری بالای متسختا، تنها کوچک‌تر — با آپسیدهایی
    کم‌ژرفاتر، گریوی سنگین‌تر، و سکنج‌هایی که گنبد را بر دوش می‌کشند و آشکارا نمایان‌اند؛

    - **کلیسای گنبددار دیگری از سدهٔ هفتم**، کوچک‌تر از آن دو: صلیبی با بازوهای هم‌اندازه و بدون فضاهای
    گوشه‌ای.


    دست بر دیوار بگذارید. دیوارها از سنگ‌های گردِ رودخانه چیده شده‌اند و در گوشه‌ها بلوک‌های تراشیدهٔ
    سنگ نرم شیریمی آن‌ها را به هم می‌بندد — روش سازندگانی که از هر چه دره در دسترسشان می‌گذاشت بهره می‌بردند.


    تا سدهٔ شانزدهم راهبان این‌جا را ترک کرده بودند. ملکه تیناتین، همسر لوان، پادشاه کاختی، اندکی پایین‌تر
    در همان راهِ فرعی صومعه‌ای نو بنیاد نهاد، و نام‌ها بر جای خود نشست: دزولی، یعنی «کهن»، و آخالی، یعنی
    «نو» شوآمتا. کلیساهای کهن در سال ۲۰۰۸ با فروتنی بازسازی شدند؛ درون آن‌ها هنوز جز سنگ برهنه و روشنایی
    کم‌جانِ پنجره‌های کوچک چیزی نیست.


    از بازیلیکا به کلیسای گنبددار بزرگ‌تر کنارش قدم بگذارید و در ده-دوازده گام، از میان دویست سال مجادله
    بر سرِ چگونگی برافراشتنِ سنگ به گنبد بگذرید.
  tip: >-
    بلیتی در کار نیست، و اغلب کسی هم این‌جا نیست؛ کلیساها بیشتر اوقات بازند، اما نه همیشه. روسری خودتان
    را بیاورید و شانه و زانو را بپوشانید، چون شاید کسی نباشد که چیزی به شما قرض دهد. نه سرویس بهداشتی
    و نه کافه‌ای این‌جا هست — تلاوی بیست دقیقه راه است. پس از باران، راهِ ورودی گِلی می‌شود، و در اوج
    تابستان جنگل پشه‌خیز است، پس دافع حشرات با خود بیاورید. صبح یا اواخر بعدازظهر بیایید، وقتی نور مورب
    از میان درختان بر سنگ می‌تابد. چهل‌وپنج دقیقه کافی است؛ آن را با آخالی شوآمتا، یک دقیقه پایین‌تر در
    همان راه، همراه کنید.
  route: >-
    از تفلیس در بزرگراه کاختی S5 حرکت کنید و پس از حدود ۲۰ کیلومتر، نزدیک وازیانی، به راه Sh38 به‌سوی
    اوجارما، گذرگاه گومبوری و تلاوی بپیچید. پس از گذرگاه، راه از میان جنگل سرازیر می‌شود؛ در حدود کیلومتر
    ۸۵ از تفلیس، تقریباً ۸ کیلومتر پیش از تلاوی، تابلوی شوآمتا شما را به پیچی تند به راست، به راه Sh178،
    راهنمایی می‌کند. آخالی شوآمتا پس از حدود ۶۰۰ متر می‌رسد، و دزولی شوآمتا ۱٫۷ کیلومتر بالاتر. حدود یک
    ساعت و ۳۵ دقیقه زمان لازم است. بخش پایانی راه تنگ و بخشی بدون آسفالت است — برای خودروی اکونومی با
    رانندگی آرام مشکلی نیست، اما پس از برف دشوار می‌شود. در تفلیس باک را پر کنید. اگر گذرگاه برف‌بسته
    باشد، از راه ساگارجو و گورجانی دور بزنید — حدود ۱۵۰ کیلومتر.
he:
  name: דזוולי שואמטה
  short: >-
    שלוש כנסיות אבן מהמאות החמישית והשביעית ביער גומבורי, מעל טלאווי — הנזירים נעדרים זה מכבר, והקרחת
    הופקדה בידי העצים והשקט.
  body: >-
    **מאתיים שנות אדריכלות כנסייתית גאורגית עומדות זו לצד זו על קרחת יער אחת בדזוולי שואמטה, ובימים רבים
    המקום כולו יהיה שלכם בלבד.**


    'שואמטה' פירושו 'בין ההרים', והשם נאמן למקום. הכנסיות עומדות בגובה של כאלף מטרים על מדרון היער של
    רכס ציו-גומבורי, מספר קילומטרים ממערב לטלאווי, והיער סוגר עליהן מכל עבר. שלושה מבנים, שלוש תקופות:


    - **בזיליקה תלת-ספינתית מהמאה החמישית**, העתיקה מכולן, ארוכה ונמוכה;

    - **כנסייה כיפתית מהמאה השביעית**, לפי תבנית ג'וורי שמעל מצחתה, אך קטנה יותר — אפסידות פחות עמוקות,
    תוף כבד יותר, וקשתות-פינה (טרומפים) שנושאות את הכיפה נותרות חשופות לעין;

    - **כנסייה כיפתית שנייה מהמאה השביעית**, קטנה עוד יותר: צלב בעל זרועות שוות ובלי חדרי פינה.


    הניחו יד על הקיר. הוא בנוי מאבני נחל מעוגלות, ובפינות נועלים אותו בלוקים מסותתים של אבן שירימי הרכה
    — שיטתם של בנאים שהשתמשו בכל מה שהעמק העניק להם.


    עד המאה השש-עשרה עזבו הנזירים את המקום. המלכה תינאטין, אשתו של לוואן, מלך קאחתי, הקימה מנזר חדש מעט
    למטה באותו שביל צד, והשמות התקבעו: דזוולי, 'הישן', ואחאלי, 'החדש', שואמטה. הכנסיות הישנות שוחזרו ב-2008
    בצניעות; בפנים עדיין אין אלא אבן חשופה ואור דהוי מבעד לחלונות קטנים.


    צאו מהבזיליקה לכנסייה הכיפתית הגדולה שלצדה, ובעשרה צעדים תחצו מאתיים שנות מחלוקת על האופן שבו מרימים
    אבן לכיפה.
  tip: >-
    אין כרטיס כניסה, ולעיתים קרובות אין נפש חיה בסביבה; הכנסיות פתוחות ברוב הזמן, אך לא תמיד. הביאו כיסוי
    ראש משלכם וכסו כתפיים וברכיים, שכן לא בטוח שיהיה מי שיציע לכם צעיף. אין כאן שירותים או בית קפה — טלאווי
    במרחק עשרים דקות נסיעה. אחרי גשם הדרך הופכת לבוצית, ובעיצומו של הקיץ היער מביא יתושים, אז הצטיידו
    בתכשיר דוחה יתושים. באו בבוקר או לפנות ערב, כשהאור נשבר בין העצים על האבן. ארבעים וחמש דקות מספיקות;
    שלבו עם אחאלי שואמטה, דקת נסיעה בחזרה באותו שביל.
  route: >-
    צאו מטביליסי בכביש קאחתי S5, ואחרי כ-20 ק"מ, סמוך לוואזיאני, פנו לכביש Sh38 לכיוון אוג'רמה, מעבר גומבורי
    וטלאווי. אחרי מעבר ההרים הכביש מתפתל למטה בין העצים; בסביבות הקילומטר ה-85 מטביליסי, כ-8 ק"מ לפני
    טלאווי, פנייה חדה ימינה לכביש Sh178 מסומנת לשואמטה. אחאלי שואמטה מגיעה אחרי כ-600 מטר, ודזוולי שואמטה
    עוד כ-1.7 ק"מ למעלה. הקצו כשעה ו-35 דקות. הקטע האחרון צר וחלקו ללא סלילה — רכב חסכוני יעבור אותו בנסיעה
    איטית, אך אחרי שלג הוא קשה יותר. תדלקו בטביליסי. אם המעבר חסום בשלג, סעו דרך סאגארג'ו וגורג'אני —
    כ-150 ק"מ.
ar:
  name: دزفيلي شوامتا
  short: >-
    ثلاث كنائس حجرية من القرنين الخامس والسابع في غابة غومبوري فوق تيلافي، غادرها الرهبان منذ زمن بعيد
    وتُركت الفسحة للأشجار والسكون.
  body: >-
    **يقف قرنان من العمارة الكنسية الجورجية جنبًا إلى جنب في فسحة واحدة وسط الغابة في دزفيلي شوامتا، وفي
    أغلب الأيام ستكون وحدك بينها.**


    يعني اسم «شوامتا» «بين الجبال»، والاسم صادق. تقف الكنائس على ارتفاع نحو ألف متر على السفح الحرجي لسلسلة
    تسيفي-غومبوري، على مسافة كيلومترات قليلة غرب تيلافي، وتحاصرها الغابة من كل جانب. ثلاثة مبانٍ، ثلاث
    لحظات:


    - **كنيسة بازيليكية ثلاثية الأروقة من القرن الخامس**، الأقدم، طويلة منخفضة؛

    - **كنيسة مقببة من القرن السابع** على تخطيط كنيسة جفاري فوق متسخيتا، لكنها أصغر — بحنيات أقل عمقًا،
    ورقبة قبة أثقل، وحنايا ركنية تحمل القبة وتُترك ظاهرة للعيان؛

    - **كنيسة مقببة ثانية من القرن السابع**، أصغر منهما: على شكل صليب متساوي الأذرع بلا غرف زاوية.


    ضع يدك على الجدار. إنه مبني من حجارة نهرية مدورة، تُثبَّت زواياه بكتل منحوتة مربّعة من حجر الشيريمي
    اللين — طريقة بنّائين استخدموا كل ما وفره الوادي.


    بحلول القرن السادس عشر كان الرهبان قد رحلوا. فبنت الملكة تيناتين، زوجة الملك ليفان الكاختي، ديرًا
    جديدًا على مسافة قصيرة أسفل الطريق الفرعي نفسه، فترسّخت الأسماء: دزفيلي، أي «القديمة»، وآخالي، أي
    «الجديدة»، شوامتا. رُممت الكنائس القديمة عام 2008 بتواضع؛ وما زال داخلها لا يحوي سوى الحجر العاري
    وضوء خافت يتسلل من نوافذ صغيرة.


    سِر من البازيليكا إلى الكنيسة المقببة الأكبر المجاورة لها، وفي عشر خطوات تعبر مئتي عام من الجدل حول
    كيفية رفع الحجر إلى القبة.
  tip: >-
    لا توجد تذكرة دخول، وغالبًا لا يوجد أحد حولك؛ الكنائس مفتوحة في أغلب الأوقات لكن ليس دائمًا. احمل
    وشاحًا خاصًا بك وغطِّ الكتفين والركبتين، فقد لا يكون هناك من يقرضك غطاءً. لا مراحيض ولا مقهى هنا —
    تيلافي على مسافة عشرين دقيقة بالسيارة. بعد المطر يتحول الطريق إلى وحل، وفي عز الصيف تجلب الغابة البعوض،
    فاحمل طاردًا له. تعال في الصباح أو أواخر بعد الظهر، حين ينساب الضوء مائلًا بين الأشجار على الحجر.
    خمس وأربعون دقيقة تكفي؛ اجمع الزيارة مع آخالي شوامتا، على دقيقة واحدة بالسيارة عائدًا في الطريق نفسه.
  route: >-
    اخرج من تبليسي على طريق كاختي السريع S5، وبعد نحو 20 كم قرب فازياني، انحرف إلى الطريق Sh38 نحو أوجارما
    وممر غومبوري وتيلافي. بعد الممر ينحدر الطريق متعرجًا عبر الغابة؛ عند الكيلومتر 85 تقريبًا من تبليسي،
    وقبل تيلافي بنحو 8 كم، تجد منعطفًا حادًا إلى اليمين نحو الطريق Sh178 تدلّ عليه لافتة شوامتا. تصل آخالي
    شوامتا بعد نحو 600 متر، ودزفيلي شوامتا على مسافة 1.7 كم أخرى إلى الأعلى. احسب نحو ساعة و35 دقيقة.
    المقطع الأخير ضيق وغير معبّد جزئيًا — وهذا لا يشكل مشكلة لسيارة اقتصادية إن قدتها بحذر، لكنه يصعب
    بعد الثلوج. عبّئ الوقود في تبليسي. إذا كان الممر مسدودًا بالثلوج، فالتفّ عبر ساغاريجو وغورجاني — نحو
    150 كم.
