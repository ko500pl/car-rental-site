ka:
  name: ძველი შუამთა
  short: სამი ადრექრისტიანული ეკლესია გომბორის ტყეში, თელავამდე ცოტა ხნით ადრე — მშვიდი და ძალიან ძველი
    ადგილი.
  body: >-
    **ძველი შუამთა ის ადგილია, სადაც ქართული ხუროთმოძღვრების სამი ეტაპი ერთმანეთის გვერდით დგას.** სახელი
    „მთებს შორის" ნიშნავს და ზუსტია: ეკლესიები გომბორის ქედის ჩრდილოეთ ფერდობზეა, სქელი მუხნარ-რცხილნარის
    შუაგულში, გზიდან რამდენიმე ასეული მეტრით მოშორებით.


    სამივე ნაგებობა კომპაქტურ ჯგუფშია:


    - **სამნავიანი ბაზილიკა** — უძველესი, V საუკუნით დათარიღებული, მძიმე ქვის კედლებით და ვიწრო სარკმლებით


    - **დიდი გუმბათოვანი ეკლესია** — VII საუკუნე, ჯვრის ტიპის ნაგებობა, რომელიც მცხეთის ჯვრის მონასტრის
    ლოგიკას იმეორებს უფრო მარტივად


    - **პატარა გუმბათოვანი ეკლესია** — იმავე ეპოქის, თითქმის მოდელივით მცირე, ერთი შეხედვით მაკეტი


    შიგნით ფრესკის ფრაგმენტები შემორჩა, გაცვეთილი და ბნელი, მაგრამ საკურთხევლის კონქში ფიგურები ჯერ კიდევ
    იკითხება. ინტერიერი განზრახ პატარაა და ბნელი — ადრეული ქართული ეკლესიები სინათლეს ცოტას უშვებდნენ.


    რაც აქ განსაკუთრებულია, ეს არის სიჩუმე. მონასტერი აღარ ფუნქციონირებს როგორც სამონასტრო თემი, ტურისტული
    ავტობუსები კი ჩვეულებრივ გვერდით ჩაივლიან ახალი შუამთისკენ. ხშირად მთელი ტერიტორია შენ და ტყეს გრჩება.
    შემოდგომაზე რცხილის ფოთოლი ყვითლდება და ქვის კედლებზე ლაქებად ეცემა სინათლე; გაზაფხულზე ბალახი მუხლამდე
    იზრდება და ნიადაგი წყალწყალაა.


    ეს ნახევარსაათიანი გაჩერებაა, არა მთელი დღე — მაგრამ თელავისკენ მიმავალ გზაზე ის ნახევარი საათი ღირს.
  tip: >-
    გზიდან ეკლესიებამდე მოკლე, ცუდად დაფარული გზაა და ბოლო მონაკვეთი ხრეშია — ჩვეულებრივი მანქანა გაივლის,
    ოღონდ ნელა. ტერიტორია ღიაა, კარები ჩვეულებრივ ღიაა, ბილეთი არ არის. ჩაცმის წესები მოქმედებს, თავსაფარი
    თან იქონიე — აქ ხშირად არავინაა, ვინც მოგცემს. ტუალეტი და კაფე არ არის; უახლოესი თელავშია. ზაფხულში
    კოღოები აწუხებს ტყეში. ერთი საათი ორივე შუამთისთვის საკმარისია.
  route: >-
    თბილისიდან გაემართე კახეთის მიმართულებით სართიჭალაზე და უჯარმაზე, შემდეგ გომბორის უღელტეხილით — ეს
    არის თელავის მოკლე გზა. 85 კმ, დაახლოებით საათნახევარი. გზა ბოლომდე ასფალტია და უღელტეხილის შემდეგ
    სერპანტინებით ეშვება; ზამთარში აქ თოვლი ხდება. ძველი შუამთის მიმანიშნებელი მარცხნივ დგას, თელავამდე
    დაახლოებით ათი კილომეტრით ადრე. საწვავი საგარეჯოში ან თელავში აიღე. ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Dzveli Shuamta
  short: >-
    Three early Christian churches standing together in Gombori forest, a short way before Telavi — quiet
    and very old.
  body: >-
    **Dzveli Shuamta is a place where three stages of Georgian church building stand side by side.** The
    name means "between the mountains" and is accurate: the churches sit on the northern slope of the
    Gombori range, deep in oak and hornbeam forest, a few hundred metres off the Telavi road.


    The group is compact and easy to read:


    - The **three-nave basilica**, the oldest of the three, dated to the 5th century, with heavy stone
    walls and narrow slits for windows


    - The **larger domed church** of the 7th century, a cross-in-tetraconch plan that follows the logic
    of Jvari above Mtskheta in a plainer, sturdier way


    - The **small domed church** of the same period, so reduced in scale that it reads almost as a model
    of its bigger neighbour


    Fragments of fresco survive inside, worn and dim, though figures in the apse conch can still be made
    out. The interiors are deliberately small and dark: early Georgian churches admitted very little light,
    and the effect after the forest outside is abrupt.


    What sets the site apart is silence. It is no longer a working monastic community, and tour buses
    usually drive straight past towards the nunnery at Akhali Shuamta, two kilometres further on. It is
    common to have the whole clearing to yourself. In autumn the hornbeam turns and drops light in patches
    across the grey stone; in spring the grass comes up to the knee and the ground stays soft for weeks.


    Treat it as a half-hour stop rather than a destination in itself. On the drive to Telavi, though,
    it is a half hour well spent, and it gives useful context for the much later, grander churches further
    down in the valley.
  tip: >-
    The turning off the main road is poorly signed and the last stretch is gravel, passable in an ordinary
    car if you take it slowly. The site is open, the church doors are usually unlocked and there is no
    ticket. Dress rules apply and there is often nobody around to lend a headscarf, so bring your own.
    No toilets and no cafe here; the nearest are in Telavi. Mosquitoes are persistent in the forest in
    high summer. An hour covers both Shuamta sites comfortably.
  route: >-
    Leave Tbilisi eastwards towards Sartichala and Ujarma, then climb over the Gombori Pass — this is
    the short road to Telavi. It is 85 km and about an hour and a half. The surface is asphalt the whole
    way and drops in tight bends beyond the pass, where snow does settle in winter. The Dzveli Shuamta
    turning is on the left roughly ten kilometres before Telavi. Fuel is available in Sagarejo and Telavi.
    An economy car is sufficient in any season the pass is open.
ru:
  name: Дзвели Шуамта
  short: >-
    Три раннехристианские церкви рядом друг с другом в гомборском лесу, незадолго до Телави — тихое и
    очень древнее место.
  body: >-
    **В Дзвели Шуамта три этапа грузинского храмового строительства стоят бок о бок.** Название означает
    «между гор» и вполне точно: церкви расположены на северном склоне Гомборского хребта, в густом дубово-грабовом
    лесу, в паре сотен метров от дороги на Телави.


    Группа компактна и легко читается:


    - **Трёхнефная базилика**, самая ранняя, V век, с тяжёлыми каменными стенами и узкими щелевидными
    окнами


    - **Большая купольная церковь** VII века, тетраконх с угловыми нишами, повторяющий логику мцхетского
    Джвари в более простом и приземистом варианте


    - **Малая купольная церковь** того же времени, настолько уменьшенная, что выглядит почти макетом соседней


    Внутри сохранились фрагменты фресок, стёртые и тёмные, но фигуры в конхе апсиды ещё различимы. Интерьеры
    намеренно малы и темны: ранние грузинские храмы пропускали очень мало света, и после лесной яркости
    контраст резкий.


    Отличает это место тишина. Действующей монашеской общины здесь нет, а туристические автобусы обычно
    проезжают мимо к женскому монастырю Ахали Шуамта в двух километрах дальше. Часто вся поляна оказывается
    в вашем распоряжении. Осенью граб желтеет и роняет пятна света на серый камень; весной трава поднимается
    до колена, а земля неделями остаётся сырой.


    Считайте это остановкой на полчаса, а не самостоятельной целью. Но на пути в Телави эти полчаса окупаются:
    место даёт хороший контекст для куда более поздних и нарядных храмов внизу, в долине.
  tip: >-
    Съезд с трассы обозначен плохо, последний отрезок — гравий, обычная машина проедет, если не спешить.
    Территория открыта, двери церквей обычно не заперты, билета нет. Действуют правила одежды, а платок
    здесь часто взять негде — берите свой. Туалета и кафе нет, ближайшие в Телави. В разгар лета в лесу
    донимают комары. Часа хватает, чтобы осмотреть обе Шуамты.
  route: >-
    Из Тбилиси на восток через Сартичалу и Уджарму, затем через Гомборский перевал — это короткая дорога
    на Телави. 85 км, около полутора часов. Асфальт на всём протяжении, за перевалом дорога спускается
    тугими виражами, зимой здесь ложится снег. Поворот на Дзвели Шуамта — слева, примерно за десять километров
    до Телави. Заправиться можно в Сагареджо и Телави. Машины эконом-класса достаточно в любой сезон,
    когда перевал открыт.
fa:
  name: شوآمتای کهن
  short: سه کلیسای مسیحی کهن کنار هم در جنگل گومبوری، کمی پیش از تلاوی — آرام و بسیار قدیمی.
  body: >-
    **شوآمتای کهن جایی است که سه مرحله از معماری کلیسایی گرجستان در کنار هم ایستاده‌اند.** نام آن یعنی
    «میان کوه‌ها» و توصیف درستی است: کلیساها بر دامنهٔ شمالی رشتهٔ گومبوری قرار دارند، در دل جنگل انبوه
    بلوط و ممرز، چند صد متر دورتر از جادهٔ تلاوی.


    مجموعه فشرده و به‌سادگی قابل خواندن است:


    - **بازیلیکای سه‌شبستانی**، کهن‌ترین بنا از سدهٔ پنجم، با دیوارهای سنگی سنگین و پنجره‌های باریک شکاف‌مانند


    - **کلیسای گنبددار بزرگ‌تر** از سدهٔ هفتم، با نقشهٔ چهارلختی که منطق کلیسای جواری بالای متسختا را
    ساده‌تر و ستبرتر تکرار می‌کند


    - **کلیسای گنبددار کوچک** از همان دوره، چنان کوچک‌شده که نزدیک است ماکت همسایهٔ بزرگ‌ترش به شمار آید


    درون بناها پاره‌هایی از فرسک مانده است، سایید‌ه و کم‌رنگ، هرچند پیکره‌های نیم‌گنبد محراب هنوز خوانده
    می‌شوند. فضاهای داخلی عمداً کوچک و تاریک‌اند؛ کلیساهای کهن گرجی نور بسیار اندکی به درون راه می‌دادند
    و پس از روشنایی جنگل، این تضاد ناگهانی است.


    آنچه این محوطه را متمایز می‌کند سکوت است. اینجا دیگر جماعت رهبانی فعالی ندارد و اتوبوس‌های گردشگری
    معمولاً بی‌توقف به سوی صومعهٔ زنان در شوآمتای نو، دو کیلومتر جلوتر، می‌روند. بارها تمام محوطه در اختیار
    شماست. در پاییز برگ ممرز زرد می‌شود و نور را لکه‌لکه بر سنگ خاکستری می‌ریزد؛ در بهار علف تا زانو بالا
    می‌آید و خاک هفته‌ها نمناک می‌ماند.


    آن را توقفی نیم‌ساعته بدانید نه مقصدی مستقل. با این حال در راه تلاوی، این نیم ساعت ارزش دارد و زمینهٔ
    خوبی برای درک کلیساهای بسیار متأخرتر و باشکوه‌تر درّه فراهم می‌کند.
  tip: >-
    انحراف از جادهٔ اصلی تابلوی روشنی ندارد و آخرین بخش شنی است، اما با خودروی معمولی و سرعت کم می‌شود
    رفت. محوطه باز است، درِ کلیساها معمولاً قفل نیست و بلیتی در کار نیست. قواعد پوشش برقرار است و اغلب
    کسی نیست که روسری بدهد، پس همراه ببرید. سرویس بهداشتی و کافه ندارد؛ نزدیک‌ترین‌ها در تلاوی است. اواسط
    تابستان پشه در جنگل آزاردهنده است. یک ساعت برای دیدن هر دو شوآمتا کافی است.
  route: >-
    از تفلیس به سوی شرق از سارتیچالا و اوجارما بروید و سپس از گردنهٔ گومبوری بگذرید؛ این راه کوتاه تلاوی
    است. 85 کیلومتر و حدود یک ساعت و نیم. سطح جاده تا انتها آسفالت است و پس از گردنه با پیچ‌های تند پایین
    می‌آید، جایی که در زمستان برف می‌نشیند. انحراف شوآمتای کهن سمت چپ است، تقریباً ده کیلومتر مانده به
    تلاوی. سوخت در ساگارجو و تلاوی موجود است. خودروی اقتصادی در هر فصلی که گردنه باز باشد کافی است.
he:
  name: שואמטה העתיקה
  short: שלוש כנסיות נוצריות קדומות זו לצד זו ביער גומבורי, מעט לפני טלאווי — שקטות ועתיקות מאוד.
  body: >-
    **בשואמטה העתיקה עומדים זה לצד זה שלושה שלבים בבניית הכנסייה הגאורגית.** השם פירושו "בין ההרים", וזה
    מדויק: הכנסיות יושבות במדרון הצפוני של רכס גומבורי, בתוך יער אלון וגרביל צפוף, כמה מאות מטרים מכביש
    טלאווי.


    הקבוצה קומפקטית וקלה לקריאה:


    - **הבזיליקה בת שלושת האולמות**, העתיקה מכולן, מן המאה החמישית, בעלת קירות אבן כבדים וחלונות צרים
    כחריצים


    - **הכנסייה המקומרת הגדולה** מן המאה השביעית, בתוכנית ארבע-קונכיות שחוזרת על ההיגיון של ג'ווארי שמעל
    מצחתה בגרסה פשוטה ומוצקה יותר


    - **הכנסייה המקומרת הקטנה** מאותה תקופה, מוקטנת עד כדי כך שהיא נראית כמעט דגם של שכנתה


    בפנים שרדו שברי ציורי קיר, שחוקים ואפלים, אך את הדמויות בקונכת האפסיס עוד אפשר להבחין. חלל הפנים קטן
    וחשוך במתכוון: כנסיות גאורגיות קדומות הכניסו מעט מאוד אור, והמעבר מן היער המואר חד.


    מה שמייחד את המקום הוא השקט. אין כאן עוד קהילת נזירים פעילה, ואוטובוסי תיירים נוסעים בדרך כלל ישר
    אל מנזר הנזירות בשואמטה החדשה, שני קילומטרים הלאה. לא פעם כל הקרחת כולה שלכם. בסתיו הגרביל מצהיב ומפזר
    כתמי אור על האבן האפורה; באביב העשב מגיע עד הברך והקרקע נשארת רכה שבועות.


    התייחסו לזה כאל עצירה של חצי שעה ולא כאל יעד בפני עצמו. אבל בדרך לטלאווי חצי השעה הזו משתלמת, והיא
    נותנת הקשר טוב לכנסיות המאוחרות והמפוארות הרבה יותר שבהמשך העמק.
  tip: >-
    הפנייה מן הכביש הראשי מסומנת גרוע והקטע האחרון חצץ, עביר ברכב רגיל אם נוסעים לאט. האתר פתוח, דלתות
    הכנסיות בדרך כלל אינן נעולות ואין כרטיס. חלים כללי לבוש ולעתים קרובות אין מי שישאיל מטפחת, אז הביאו
    משלכם. אין שירותים ואין בית קפה, הקרובים ביותר בטלאווי. באמצע הקיץ היתושים ביער עקשניים. שעה מספיקה
    לשתי השואמטות יחד.
  route: >-
    צאו מטביליסי מזרחה דרך סרטיצ'לה ואוג'רמה, ואז עלו במעלה מעבר גומבורי — זו הדרך הקצרה לטלאווי. 85 ק״מ
    וכשעה וחצי. הכביש סלול לכל אורכו ויורד בפניות חדות מעבר למעלה, ובחורף יורד שם שלג. הפנייה לשואמטה
    העתיקה נמצאת משמאל, כעשרה קילומטרים לפני טלאווי. דלק יש בסגרג'ו ובטלאווי. רכב חסכוני מספיק בכל עונה
    שבה המעבר פתוח.
ar:
  name: شواماتا القديمة
  short: ثلاث كنائس مسيحية مبكرة متجاورة في غابة غومبوري قبيل تيلافي — هادئة وموغلة في القدم.
  body: >-
    **في شواماتا القديمة تقف ثلاث مراحل من عمارة الكنيسة الجورجية جنباً إلى جنب.** والاسم يعني «بين الجبال»
    وهو وصف دقيق: تقع الكنائس على السفح الشمالي لسلسلة غومبوري، في عمق غابة من البلوط والزان، على بعد
    بضع مئات من الأمتار عن طريق تيلافي.


    والمجموعة متراصة وسهلة القراءة:


    - **البازيليكا ذات الصحون الثلاثة**، أقدم الثلاث، من القرن الخامس، بجدران حجرية ثقيلة ونوافذ ضيقة
    كالشقوق


    - **الكنيسة المقبّبة الكبرى** من القرن السابع، بمخطط رباعي الحنايا يعيد منطق كنيسة جواري فوق متسخيتا
    في صيغة أبسط وأمتن


    - **الكنيسة المقبّبة الصغرى** من العهد نفسه، مصغّرة إلى حد يجعلها تبدو نموذجاً لجارتها


    وفي الداخل بقايا رسوم جدارية باهتة ممسوحة، غير أن الأشكال في نصف قبة الحنية ما زالت تُقرأ. والفراغات
    الداخلية صغيرة معتمة عن قصد: فالكنائس الجورجية المبكرة كانت تدخل نوراً شحيحاً، والانتقال من ضوء الغابة
    حاد.


    وما يميز الموقع هو الصمت. لم تعد هنا جماعة رهبانية عاملة، وحافلات الزوار تمضي عادة إلى دير الراهبات
    في شواماتا الجديدة على بعد كيلومترين. وكثيراً ما تجد الساحة كلها لك وحدك. في الخريف يصفرّ ورق الزان
    وينثر بقع الضوء على الحجر الرمادي؛ وفي الربيع يبلغ العشب الركبة وتبقى الأرض طرية أسابيع.


    اعتبرها وقفة نصف ساعة لا وجهة قائمة بذاتها. لكنها في الطريق إلى تيلافي نصف ساعة مجزية، وتمنحك سياقاً
    مفيداً لفهم الكنائس المتأخرة الأفخم في أسفل الوادي.
  tip: >-
    المنعطف عن الطريق الرئيسي ضعيف اللافتات، وآخر مقطع منه حصى تعبره سيارة عادية بسرعة منخفضة. الموقع
    مفتوح، وأبواب الكنائس غير موصدة عادة، ولا تذكرة. وتُطبق قواعد اللباس ولا تجد غالباً من يعيرك غطاء
    رأس، فأحضره معك. لا دورات مياه ولا مقهى هنا؛ أقربها في تيلافي. وفي ذروة الصيف يكثر البعوض في الغابة.
    ساعة واحدة تكفي لزيارة شواماتا القديمة والجديدة معاً.
  route: >-
    غادر تبليسي شرقاً نحو سارتيتشالا وأوجارما، ثم اصعد ممر غومبوري؛ هذا هو الطريق القصير إلى تيلافي. 85
    كم ونحو ساعة ونصف. السطح معبّد على امتداده وينحدر بمنعطفات ضيقة بعد الممر، حيث يتراكم الثلج شتاءً.
    منعطف شواماتا القديمة على اليسار، قبل تيلافي بنحو عشرة كيلومترات. الوقود متوفر في ساغاريجو وتيلافي.
    وسيارة اقتصادية تكفي في أي موسم يكون فيه الممر مفتوحاً.
rating: 3.5
