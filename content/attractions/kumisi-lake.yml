ka:
  name: კუმისის ტბა
  short: >-
    არაღრმა სტეპური წყალსაცავი თბილისის სამხრეთით, ოდესღაც მწარე-მლაშე ტბა, სადაც დიდ საფრენ გზაზე მიმავალი
    ფრინველები ლერწმიან ნაპირებზე ისვენებენ.
  body: >-
    **კუმისი ოდესღაც სტეპის ტაფობში ჩამდგარი მწარე-მლაშე გუბე იყო; ინჟინრებმა წყალსაცავად აქციეს, ფრინველები
    კი მაინც აქ ჩამოდიან.**


    ტბა ზღვის დონიდან 475 მეტრზე, თავისივე სახელობის ტაფობშია, იაღლუჯის მაღლობსა და წალასყურის ვაკეს შორის,
    თბილისის ცენტრიდან 24 კილომეტრში. ჯერ კიდევ 1960-იან წლებში წყალი ნახევარ კვადრატულ კილომეტრსაც არ
    ფარავდა, სიღრმე დაახლოებით 50 სანტიმეტრი იყო, გემო კი — მწარე-მლაშე. 1967 წელს მლაშე წყალი ამორეცხეს
    და ტბას ორი არხი მიუერთეს: ერთით მტკვრის წყალი ტუმბოებით ამოჰქონდათ, მეორით ალგეთის წყალი თვითდინებით
    ჩამოდიოდა. დღეს წყალსაცავი 5,4 კმ²-ს მოიცავს, დასავლეთიდან აღმოსავლეთისკენ 3,2 კილომეტრზეა გადაჭიმული,
    სიღრმე არსად აღემატება 4 მეტრს და სამხრეთით მინდვრებს რწყავს. ფსკერის სამკურნალო სულფიდურ ტალახს დიდი
    ხანია თბილისის ბალნეოლოგიურ კურორტზე იყენებენ. სამხრეთ ნაპირზე სოფელი ახალი კუმისი და რკინიგზის სადგური
    დგას.


    კუმისი შავი ზღვისა და ხმელთაშუა ზღვის საფრენ გზაზე მდებარეობს — ერთ-ერთ უდიდეს სამიგრაციო დერეფანზე,
    რომლითაც მილიონობით ფრინველი წელიწადში ორჯერ სამ კონტინენტს შორის მოძრაობს. ისლი და ლელქაში ნაპირს
    თითქმის მთლიანად აკრავს და წყლის ფრინველებს თავს აფარებს. გაზაფხულსა და შემოდგომაზე თავთხელზე ჭაობის
    ფრინველები, იხვები და თოლიები საზრდოობენ, 2020 წელს კი ბუნების კონსერვაციის საზოგადოება „საბუკოს“
    წარმომადგენლებმა აქ მარტოხელა ფლამინგოც კი აღმოაჩინეს.


    საფოსტო ბარათის ხედისთვის ნუ ჩამოხვალთ. ნაპირი ბრტყელია, გორაკები შიშველი, ადგილობრივი პრესა კი მიტოვებულ
    სახლებსა და თევზის მასობრივ დახოცვაზეც წერდა. ჩამოდით მდორე წყალზე დაწოლილი დაბალი შუქისა და ფრთებით
    გადაჭრილი ფართო ცისთვის.


    კუმისი ადამიანის ნაკეთები ტბაა, ბუნებამ კი ის უსიტყვოდ თავისად მიიღო.
  tip: >-
    ორი საათი საკმარისია. ბინოკლი აუცილებელია, ტელესკოპი ან გრძელფოკუსიანი ობიექტივიც ძალიან გამოგადგებათ;
    წყალი, საჭმელი და ქუდი თან იქონიეთ, რადგან არც კაფეა, არც ტუალეტი და არც ნამდვილი ჩრდილი. საუკეთესო
    თვეებია მარტი-აპრილი და სექტემბერ-ოქტომბერი, საუკეთესო დრო — მზის ამოსვლიდან პირველი საათი; ზაფხულის
    შუადღე ცხელი, ბუღიანი და მდუმარეა. არსებულ გზებს არ გადაუხვიოთ: წვიმის შემდეგ ნაპირი ღრმა ტალახად
    იქცევა და მანქანა ადვილად ჯდება. წყლამდე ბოლო მონაკვეთი ფეხით გაიარეთ და მოსვენებულ გუნდებს შორიდან
    უყურეთ. ტბა თევზით მდიდარია — აქ კობრიც არის და ლოქოც, სამოყვარულო თევზჭერის შეჯიბრებებიც ეწყობა,
    ასე რომ, ნაპირზე მეთევზეებსაც შეხვდებით.
  route: >-
    თბილისიდან სამხრეთ-აღმოსავლეთით ს4 რუსთავის გზატკეცილით ფონიჭალამდე იარეთ (დაახლოებით 13 კმ), სადაც
    რუსთავისა და მარნეულის გზები იყოფა. ფონიჭალიდან ადგილობრივი გზა სამხრეთით, სოფელ კუმისისა და ტბისკენ
    მიემართება: სულ 24 კმ, დაახლოებით 35 წუთი. ბოლო რამდენიმე კილომეტრი ვიწროა და ნაწილობრივ მოუასფალტებელი
    — ზოგან ორმოიანი, წვიმის შემდეგ კი ლაფიანი. საწვავი თბილისში ან მაგისტრალზე ჩაასხით — ტბასთან ბენზინგასამართი
    არ არის. მშრალ ამინდში ეკონომ-კლასის მანქანაც გაივლის; ძლიერი წვიმის შემდეგ მანქანა მყარ ადგილას დატოვეთ
    და ფეხით გააგრძელეთ.
en:
  name: Kumisi Lake
  short: >-
    A shallow steppe reservoir south of Tbilisi, once a bitter salt pool, where migrating waterbirds rest
    among the reeds on a great flyway.
  body: >-
    **Kumisi began as a bitter, salty pool in a hollow of the steppe; engineers turned it into a reservoir,
    and the birds came anyway.**


    The lake lies at 475 metres in a basin of the same name, between the Iaghluja upland and the Tsalaskuri
    plain, 24 km south of central Tbilisi. As late as the 1960s the water covered less than half a square
    kilometre and was about 50 cm deep, bitter and salty. In 1967 the brine was flushed out and two canals
    were brought in: one carrying Mtkvari water lifted by pumps, the other letting the Algeti flow in
    by gravity. Today the reservoir covers 5.4 km², stretches 3.2 km from west to east, is nowhere deeper
    than 4 metres, and irrigates the fields to the south. The curative sulphide mud on its bed has long
    been used at Tbilisi's balneological resort. The village of Akhali Kumisi and a railway station stand
    on the southern shore.


    Kumisi sits on the Black Sea–Mediterranean flyway, one of the great routes along which millions of
    birds travel between three continents twice a year. Sedge and reeds ring almost the whole shore and
    shelter waterbirds. In spring and autumn waders, ducks and gulls work the shallows, and in 2020 members
    of the conservation group SABUKO found a lone flamingo here.


    Do not come for a postcard. The shore is flat, the hills are bare, and local press has reported abandoned
    houses and mass fish deaths. Come instead for low light on still water and a wide sky crossed by wings.


    Kumisi is a lake made by people, and nature has quietly accepted it as its own.
  tip: >-
    Two hours are plenty. Binoculars are essential, and a telescope or long lens pays off; bring water,
    food and a hat, as there is no café, toilet or real shade. March–April and September–October are the
    months, the first hour after sunrise the time; a summer midday is hot, hazy and quiet. Keep to existing
    tracks, because after rain the shore turns to deep mud and cars bog down easily. Walk the last stretch
    to the water and give resting flocks a wide berth. The lake is well stocked with carp and catfish
    and hosts amateur angling contests, so you may well share the shore with anglers.
  route: >-
    Leave Tbilisi south-east on the S4 Rustavi highway as far as Ponichala, about 13 km, where the Rustavi
    and Marneuli roads divide. From Ponichala a local road runs south towards Kumisi village and the lake:
    24 km in all, about 35 minutes. The last few kilometres are narrow and partly unsurfaced, potholed
    in places and sticky after rain. Fill up in Tbilisi or on the highway, as there is no fuel by the
    lake. An economy car copes in dry weather; after heavy rain, leave it where the ground is firm and
    walk on.
ru:
  name: Озеро Кумиси
  short: >-
    Мелкое степное водохранилище к югу от Тбилиси, когда-то горько-солёное озерцо, где на большом пролётном
    пути отдыхают в тростниках перелётные птицы.
  body: >-
    **Кумиси начинался как горько-солёное озерцо в степной котловине; инженеры превратили его в водохранилище
    — а птицы всё равно прилетели.**


    Озеро лежит на высоте 475 метров в одноимённой котловине, между Яглуджинской возвышенностью и Цаласкурской
    равниной, в 24 км к югу от центра Тбилиси. Ещё в 1960-х вода занимала меньше половины квадратного
    километра при глубине около 50 см и была горько-солёной. В 1967 году рассол вымыли и провели два канала:
    по одному насосы подают воду Мтквари, по другому самотёком поступает Алгети. Сегодня водохранилище
    занимает 5,4 км², тянется на 3,2 км с запада на восток, нигде не глубже 4 метров и орошает поля к
    югу. Лечебная сульфидная грязь с его дна давно используется на Тбилисском бальнеологическом курорте.
    На южном берегу стоят село Ахали-Кумиси и железнодорожная станция.


    Кумиси лежит на Черноморско-Средиземноморском пролётном пути — одной из великих трасс, по которым
    миллионы птиц дважды в год летят между тремя континентами. Осока и тростник окаймляют почти весь берег
    и укрывают водоплавающих. Весной и осенью на мелководье кормятся кулики, утки и чайки, а в 2020 году
    члены природоохранной организации «Сабуко» обнаружили здесь одинокого фламинго.


    Не ждите открытки. Берег плоский, холмы голые, а местная пресса писала о брошенных домах и массовой
    гибели рыбы. Приезжайте ради низкого света над неподвижной водой и широкого неба, которое пересекают
    крылья.


    Кумиси — озеро, сделанное людьми, и природа тихо признала его своим.
  tip: >-
    Двух часов вполне достаточно. Бинокль обязателен, а подзорная труба или длиннофокусный объектив окупятся
    сполна; возьмите воду, еду и шляпу — ни кафе, ни туалета, ни настоящей тени здесь нет. Лучшие месяцы
    — март–апрель и сентябрь–октябрь, лучшее время — первый час после восхода; летний полдень жаркий,
    мутный от дымки и тихий. Держитесь накатанных колей: после дождя берег превращается в глубокую грязь,
    и машины легко вязнут. Последний отрезок до воды пройдите пешком и обходите отдыхающие стаи далеко
    стороной. Озеро богато рыбой — карпом и сомом, — здесь проводят любительские соревнования по рыбной
    ловле, так что на берегу вы, скорее всего, встретите рыбаков.
  route: >-
    Выезжайте из Тбилиси на юго-восток по руставскому шоссе S4 до Поничалы — около 13 км, — где расходятся
    дороги на Рустави и Марнеули. От Поничалы местная дорога ведёт на юг, к селу Кумиси и озеру: всего
    24 км, около 35 минут. Последние несколько километров узкие и местами без покрытия, кое-где в выбоинах,
    а после дождя липкие. Заправьтесь в Тбилиси или на трассе — у озера заправок нет. В сухую погоду справится
    машина эконом-класса; после сильного дождя оставьте её там, где грунт твёрдый, и идите дальше пешком.
fa:
  name: دریاچهٔ کومیسی
  short: >-
    مخزن آبی کم‌ژرفا در استپ جنوب تفلیس که روزگاری آبگیری شور و تلخ بود و اکنون بر سر یکی از بزرگ‌ترین
    مسیرهای کوچ، پناهگاه پرندگان آبزیِ مهاجر در میان نیزارهاست.
  body: >-
    **کومیسی نخست آبگیری تلخ و شور در گودالی از استپ بود؛ مهندسان آن را به مخزن آب بدل کردند، و پرندگان
    باز هم آمدند.**


    دریاچه در ارتفاع ۴۷۵ متری، در حوضه‌ای به همین نام، میان ارتفاعات یاغلوجا و دشت تسالاسکوری، ۲۴ کیلومتری
    جنوبِ مرکز تفلیس قرار دارد. تا دههٔ ۱۹۶۰ آب کمتر از نیم کیلومتر مربع را می‌پوشاند، حدود ۵۰ سانتی‌متر
    ژرفا داشت و تلخ و شور بود. در ۱۹۶۷ شورابه را بیرون راندند و دو آبراه به دریاچه آوردند: یکی آب رود
    مِتکواری (کورا) را که با پمپ بالا کشیده می‌شود می‌رساند، و دیگری آب رود آلگتی را با شیب طبیعی به درون
    روان می‌کند. امروز این مخزن ۵٫۴ کیلومتر مربع وسعت دارد، ۳٫۲ کیلومتر از غرب تا شرق کشیده شده، هیچ‌جا
    ژرف‌تر از ۴ متر نیست و کشتزارهای جنوبش را آبیاری می‌کند. گل سولفیدیِ درمانیِ بستر آن از دیرباز در
    آسایشگاه آب‌درمانی تفلیس به کار می‌رود. روستای آخالی کومیسی و یک ایستگاه راه‌آهن بر کرانهٔ جنوبی آن
    قرار دارند.


    کومیسی بر مسیر پروازی دریای سیاه–مدیترانه قرار دارد، یکی از شاهراه‌های بزرگی که میلیون‌ها پرنده سالی
    دو بار از آن میان سه قاره رفت‌وآمد می‌کنند. جگن و نی تقریباً سراسر کرانه را در بر گرفته‌اند و پناه
    پرندگان آبزی‌اند. در بهار و پاییز کنارآبچرها، اردک‌ها و کاکایی‌ها در آب‌های کم‌عمق در پی خوراک‌اند،
    و در سال ۲۰۲۰ اعضای سازمان حفاظت از طبیعت «سابوکو» یک فلامینگوی تنها را این‌جا یافتند.


    به امید منظره‌ای کارت‌پستالی نیایید. کرانه هموار است، تپه‌ها برهنه‌اند و مطبوعات محلی از خانه‌های
    متروک و مرگ دسته‌جمعی ماهی‌ها خبر داده‌اند. به‌جایش برای نور مایلِ روی آب آرام بیایید و آسمانی پهناور
    که بال‌ها از آن می‌گذرند.


    کومیسی دریاچه‌ای است ساختهٔ دست آدمی، و طبیعت آرام‌آرام آن را از آنِ خود دانسته است.
  tip: >-
    دو ساعت کاملاً کافی است. دوربین دوچشمی ضروری است و تلسکوپ یا لنز بلند ارزشش را دارد؛ آب، خوراک و کلاه
    بیاورید، چون نه کافه‌ای هست، نه دستشویی و نه سایهٔ درست‌وحسابی. بهترین ماه‌ها مارس–آوریل و سپتامبر–اکتبرند
    و بهترین زمان، نخستین ساعت پس از طلوع؛ نیمروز تابستان داغ، غبارآلود و خاموش است. از رد چرخ‌های موجود
    بیرون نروید، چون پس از باران کرانه به گل‌ولای عمیق بدل می‌شود و خودروها به‌آسانی در آن گیر می‌کنند.
    تکهٔ آخر تا آب را پیاده بروید و از دسته‌های پرندگانِ در حال استراحت فاصلهٔ زیادی بگیرید. دریاچه پرماهی
    است، از کپور تا گربه‌ماهی، و مسابقه‌های ماهیگیری آماتوری هم در آن برگزار می‌شود؛ پس احتمالاً ماهیگیران
    را هم کنار آب خواهید دید.
  route: >-
    از تفلیس به سوی جنوب‌شرق، بزرگراه S4 روستاوی را تا پونیچالا، حدود ۱۳ کیلومتر، بروید؛ آن‌جا راه‌های
    روستاوی و مارنئولی از هم جدا می‌شوند. از پونیچالا جاده‌ای محلی به سوی جنوب، به طرف روستای کومیسی و
    دریاچه می‌رود: روی هم ۲۴ کیلومتر، حدود ۳۵ دقیقه. چند کیلومتر آخر باریک و بخشی از آن خاکی است، جابه‌جا
    چاله دارد و پس از باران چسبناک می‌شود. در تفلیس یا کنار بزرگراه باک را پر کنید، چون نزدیک دریاچه پمپ
    بنزین نیست. در هوای خشک، خودروی کلاس اقتصادی از پس راه برمی‌آید؛ پس از باران شدید آن را جایی که زمین
    سفت است بگذارید و بقیهٔ راه را پیاده بروید.
he:
  name: אגם קומיסי
  short: >-
    מאגר רדוד בערבה שמדרום לטביליסי, שהיה פעם בריכת מלח מרה; על אחד מנתיבי הנדידה הגדולים, עופות מים נודדים
    נחים כאן בין הקנים.
  body: >-
    **קומיסי התחיל כבריכה מרה ומלוחה בשקע שבערבה; מהנדסים הפכו אותו למאגר מים, והציפורים הגיעו בכל זאת.**


    האגם שוכן בגובה 475 מטר, באגן הנושא את אותו שם, בין רמת יאגלוג'ה למישור צלסקורי, 24 ק"מ דרומית למרכז
    טביליסי. עוד בשנות השישים של המאה ה־20 כיסו המים פחות מחצי קמ"ר, עומקם היה כ־50 ס"מ, והם היו מרים
    ומלוחים. ב־1967 נשטפה התמלחת החוצה ונחפרו אל האגם שתי תעלות: אחת מביאה מי מטקוורי שמועלים במשאבות,
    והשנייה מזרימה אליו את נהר האלגתי בכוח הכובד. כיום משתרע המאגר על 5.4 קמ"ר, אורכו ממערב למזרח 3.2
    ק"מ, בשום מקום עומקו אינו עולה על 4 מטרים, והוא משקה את השדות שמדרום לו. הבוץ הסולפידי המרפא שבקרקעיתו
    משמש זה שנים באתר המרפא הבלנאולוגי של טביליסי. על החוף הדרומי שוכנים הכפר אחלי קומיסי ותחנת רכבת.


    קומיסי נמצא על נתיב הנדידה של הים השחור והים התיכון, אחד הנתיבים הגדולים שלאורכם נודדות מיליוני ציפורים
    פעמיים בשנה בין שלוש יבשות. כרבז וקנים מקיפים כמעט את כל החוף ומעניקים מחסה לעופות המים. באביב ובסתיו
    מחפשים חופמאים, ברווזים ושחפים מזון במים הרדודים, וב־2020 מצאו כאן חברי ארגון השימור "סבוקו" פלמינגו
    בודד.


    אל תבואו בשביל נוף של גלויה. החוף שטוח, הגבעות חשופות, והעיתונות המקומית דיווחה על בתים נטושים ועל
    תמותה המונית של דגים. בואו בשביל אור נמוך על מים שקטים ושמיים רחבים שכנפיים חוצות אותם.


    קומיסי הוא אגם מעשה ידי אדם, והטבע קיבל אותו בשקט כשלו.
  tip: >-
    שעתיים מספיקות בהחלט. משקפת היא חובה, וטלסקופ או עדשה ארוכה משתלמים מאוד; הביאו מים, אוכל וכובע, כי
    אין כאן בית קפה, שירותים או צל של ממש. החודשים הנכונים הם מרץ–אפריל וספטמבר–אוקטובר, והזמן הנכון —
    השעה הראשונה אחרי הזריחה; צהרי הקיץ חמים, עטופים באובך ודלים בציפורים. היצמדו לדרכים הקיימות, כי אחרי
    גשם החוף הופך לבוץ עמוק ומכוניות שוקעות בו בקלות. את הקטע האחרון עד המים עשו ברגל, ושמרו מרחק רב מלהקות
    שנחות. האגם עשיר בדגים, קרפיונים ושפמנונים, ונערכות בו תחרויות דיג חובבים, כך שסביר שתפגשו על החוף
    גם דייגים.
  route: >-
    צאו מטביליסי לכיוון דרום־מזרח בכביש המהיר S4 לרוסטאווי עד פוניצ'אלה, כ־13 ק"מ, שם נפרדות הדרכים לרוסטאווי
    ולמרנאולי. מפוניצ'אלה מובילה דרך מקומית דרומה, אל הכפר קומיסי ואל האגם: 24 ק"מ בסך הכול, כ־35 דקות.
    הקילומטרים האחרונים צרים ובחלקם אינם סלולים, יש בהם בורות פה ושם, ואחרי גשם הם נעשים דביקים. תדלקו
    בטביליסי או על הכביש המהיר, כי ליד האגם אין תחנת דלק. רכב בקטגוריית אקונומי יסתדר במזג אוויר יבש;
    אחרי גשם כבד השאירו אותו היכן שהקרקע יציבה והמשיכו ברגל.
ar:
  name: بحيرة كوميسي
  short: >-
    خزّان ماء ضحل في سهوب جنوب تبليسي، كان يوماً بركة مالحة مُرّة، تستريح بين قصبه الطيور المائية المهاجرة
    على أحد أعظم مسارات الهجرة.
  body: >-
    **بدأت كوميسي بركةً مالحة مُرّة في منخفض من السهوب؛ حوّلها المهندسون إلى خزّان ماء، وجاءت الطيور على
    أي حال.**


    تقع البحيرة على ارتفاع 475 متراً في حوض يحمل الاسم نفسه، بين مرتفعات ياغلوجا وسهل تسالاسكوري، على
    بُعد 24 كم جنوب وسط تبليسي. وحتى ستينيات القرن العشرين كانت المياه تغطي أقل من نصف كيلومتر مربع بعمق
    نحو 50 سم، وكانت مُرّة مالحة. وفي عام 1967 غُسل الماء الأُجاج منها وأُدخلت إليها قناتان: إحداهما تحمل
    مياه متكفاري ترفعها المضخات، والأخرى تُجري إليها نهر ألغيتي بالانحدار الطبيعي. واليوم يغطي الخزان
    5.4 كم²، ويمتد 3.2 كم من الغرب إلى الشرق، ولا يزيد عمقه في أي موضع على 4 أمتار، ويروي الحقول الواقعة
    جنوبه. ويُستخدم الطين الكبريتيدي العلاجي في قاعه منذ زمن في منتجع تبليسي للعلاج بالمياه المعدنية.
    وعلى الشاطئ الجنوبي تقع قرية أخالي كوميسي ومحطة للسكك الحديدية.


    تقع كوميسي على مسار هجرة البحر الأسود–المتوسط، أحد الطرق الكبرى التي تعبرها ملايين الطيور مرتين في
    السنة بين ثلاث قارات. ويطوّق السُّعد والقصب الشاطئ كله تقريباً فيؤويان الطيور المائية. في الربيع والخريف
    تجوب الطيور الخوّاضة والبط والنوارس المياه الضحلة، وفي عام 2020 عثر أعضاء منظمة «سابوكو» لحماية الطبيعة
    هنا على طائر فلامنغو وحيد.


    لا تأتِ بحثاً عن منظر البطاقات البريدية. فالشاطئ منبسط، والتلال جرداء، وقد تحدثت الصحافة المحلية عن
    بيوت مهجورة ونفوق جماعي للأسماك. تعالَ بدلاً من ذلك من أجل الضوء المائل على الماء الساكن، وسماءٍ واسعة
    تعبرها الأجنحة.


    كوميسي بحيرة صنعها البشر، وقد احتضنتها الطبيعة بهدوء كأنها منها.
  tip: >-
    ساعتان تكفيان وتزيدان. المنظار ضروري، والتلسكوب أو العدسة الطويلة يستحقان العناء؛ احمل ماءً وطعاماً
    وقبعة، فلا مقهى هنا ولا دورة مياه ولا ظلّ يُعتدّ به. أفضل الأشهر مارس–أبريل وسبتمبر–أكتوبر، وأفضل
    الأوقات الساعة الأولى بعد الشروق؛ أما ظهيرة الصيف فحارّة مغبّشة هادئة. التزم بالمسارات القائمة، فبعد
    المطر يتحول الشاطئ إلى وحل عميق تغرز فيه السيارات بسهولة. امشِ المسافة الأخيرة إلى الماء، وابقَ بعيداً
    عن أسراب الطيور المستريحة. والبحيرة غنية بالأسماك كالشبّوط والسلّور، وتُقام فيها مسابقات هواة لصيد
    السمك، فلا تستغرب إن شاركت الصيادين الشاطئ.
  route: >-
    اخرج من تبليسي باتجاه الجنوب الشرقي على طريق روستافي السريع S4 حتى بونيتشالا، نحو 13 كم، حيث يفترق
    طريقا روستافي ومارنيولي. ومن بونيتشالا يتجه طريق محلي جنوباً نحو قرية كوميسي والبحيرة: 24 كم في المجموع،
    نحو 35 دقيقة. الكيلومترات الأخيرة ضيقة وغير معبّدة في جزء منها، تكثر فيها الحفر هنا وهناك، وتصير لزجة
    بعد المطر. املأ خزان الوقود في تبليسي أو على الطريق السريع، إذ لا وقود قرب البحيرة. تتدبّر السيارة
    الاقتصادية أمرها في الطقس الجاف؛ أما بعد المطر الغزير فاتركها حيث الأرض صلبة وأكمل سيراً على الأقدام.
