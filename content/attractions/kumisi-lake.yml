ka:
  name: კუმისის ტბა
  short: მარილიანი ტბა სტეპურ ქვაბულში თბილისის სამხრეთით, ფრინველთა დაკვირვების ყველაზე ახლო ადგილი დედაქალაქიდან.
  body: >-
    **კუმისი არ არის ლამაზი ტბა ჩვეულებრივი გაგებით და ეს წინასწარ უნდა იცოდეთ.** ის თბილისიდან ოცდაოთხ
    კილომეტრში, უხეო სტეპურ ქვაბულშია: მოყვითალო გორაკები, მარილიანი მიწა, ქარი და თითქმის სრული სიცარიელე.


    ტბა არაღრმა და მარილიანია. საბჭოთა პერიოდში მისი ტალახი სამკურნალოდ გამოიყენებოდა და ნაპირზე სანატორიუმი
    იდგა; ნაგებობების ნაშთები დღემდე ჩანს. ბოლო ათწლეულებში ტბა მკვეთრად შემცირდა — მშრალ წლებში ის ნახევრად
    მარილის ვაკედ იქცევა, გამომშრალი ნაპირით და თეთრი ქერქით. ეს გარემოსდაცვითი პრობლემაა და არა თავისებურება.
    სველ გაზაფხულზე წყალი ბრუნდება და კუმისი მოკლე ხნით ნამდვილ ტბას ჰგავს, გორაკების არეკვლით; მშრალი
    წლის აგვისტოში კი იმავე ადგილას თეთრი ბრტყელი ვაკეა, ტრაქტორის კვალით გადაჭრილი.


    სამაგიეროდ ფრინველებისთვის ის მნიშვნელოვანია. კუმისი მიგრაციულ დერეფანზეა და გაზაფხულსა და შემოდგომაზე
    აქ ნაპირზე მეჩხერი ფრინველები, თოლიები, იხვები და სხვადასხვა გადამფრენი ჩერდება. ორნითოლოგებისთვის
    ეს თბილისიდან ყველაზე ახლო ღია სტეპური წერტილია და ერთი დილა ბინოკლით შედეგიანი გამოდის.


    სხვისთვის ეს უცნაური, დაცარიელებული ლანდშაფტია — ნაგავი ნაპირზე, მიტოვებული შენობები, სიჩუმე. ვინც
    სილამაზეს ეძებს, სხვაგან უნდა წავიდეს; ვინც თბილისის სულ სხვა გარშემოს ხედავს, ერთი საათი ღირს.
  tip: >-
    ორი საათი საკმარისია. ბინოკლი აუცილებელია, ტელეობიექტივიც გამოგადგებათ. ჩრდილი, ტუალეტი და კაფე არ
    არის; ყველაფერი თბილისიდან წამოიღეთ. ნაპირი ტალახიანია და გაზაფხულზე მანქანა ადვილად ჯდება — გზაზე
    დარჩით. ზაფხულის შუადღე უაზროა: ცხელა და ფრინველი ცოტაა. საუკეთესო დროა მარტი-აპრილი და სექტემბერ-ოქტომბერი,
    ადრე დილით.
  route: >-
    თბილისიდან სამხრეთით მარნეულის მაგისტრალით — დაახლოებით 20 კმ, შემდეგ კუმისის მიმართულებით აღმოსავლეთით
    გაუხვევთ. სულ 24 კმ, დაახლოებით ოცდათხუთმეტი წუთი. მაგისტრალი კარგია, ბოლო სამი კილომეტრი კი ვიწრო
    ასფალტისა და მიწის გზაა, წვიმის შემდეგ ლაფიანი. საწვავი მაგისტრალზე მრავლადაა. მანქანა გზის პირას
    დატოვეთ და ნაპირამდე ფეხით ჩადით.
en:
  name: Kumisi Lake
  short: >-
    A salt lake in a steppe basin south of Tbilisi, the closest place to the capital for open-country
    birdwatching.
  body: >-
    **Kumisi is not a beautiful lake in the ordinary sense, and it is better to know that before setting
    off.** It lies twenty-four kilometres from Tbilisi in a treeless steppe basin: yellow hills, salty
    ground, wind and near-total emptiness.


    The lake is shallow and saline. In the Soviet period its mud was used for treatment and a sanatorium
    stood on the shore; the remains of the buildings are still there. Over recent decades the lake has
    shrunk sharply, and in dry years it becomes half salt flat, with a wide dried margin and a white crust.
    That is an environmental problem rather than a characteristic. After a wet spring the water returns
    and Kumisi briefly looks like a proper lake, with the bare hills reflected in it; by August of a dry
    year the same view is a white pan crossed by tractor tracks.


    For birds, though, it matters. Kumisi sits on a migration corridor, and in spring and autumn waders,
    gulls, ducks and a shifting cast of passage migrants stop on the shoreline. For birdwatchers this
    is the nearest patch of open steppe to Tbilisi, and a morning with binoculars is usually productive.


    For everyone else it is a strange, emptied landscape — litter along parts of the shore, abandoned
    buildings, silence. Anyone looking for scenery should go elsewhere; anyone who wants to see a completely
    different side of Tbilisi's surroundings will find an hour here worthwhile.
  tip: >-
    Two hours is enough. Binoculars are essential and a long lens helps. There is no shade, no toilet
    and no cafe, so bring everything from Tbilisi. The shore is muddy and cars bog down easily in spring
    — stay on the track. A summer midday is pointless: hot and almost birdless. March to April and September
    to October, early in the morning, are the times to come.
  route: >-
    Head south from Tbilisi on the Marneuli highway for about 20 km, then turn east towards Kumisi. Twenty-four
    kilometres in total, roughly thirty-five minutes. The highway is good; the last three kilometres are
    narrow asphalt and dirt that turn muddy after rain. Fuel is plentiful on the highway. Leave the car
    by the track and walk down to the shore rather than driving onto the flats.
ru:
  name: Озеро Кумиси
  short: >-
    Солёное озеро в степной котловине южнее Тбилиси, ближайшее к столице место для наблюдения за птицами
    в открытой местности.
  body: >-
    **Кумиси не красивое озеро в обычном смысле, и лучше знать это заранее.** Оно лежит в двадцати четырёх
    километрах от Тбилиси, в безлесной степной котловине: жёлтые холмы, солёная земля, ветер и почти полная
    пустота.


    Озеро мелкое и солёное. В советское время его грязь использовали в лечебных целях, на берегу стоял
    санаторий; остатки построек видны до сих пор. За последние десятилетия озеро сильно сократилось, и
    в сухие годы наполовину превращается в солончак с широкой высохшей кромкой и белой коркой. Это экологическая
    проблема, а не особенность. После влажной весны вода возвращается, и Кумиси ненадолго выглядит настоящим
    озером, в котором отражаются голые холмы; к августу сухого года на том же месте белый солончак, пересечённый
    следами тракторов.


    Зато для птиц оно важно. Кумиси лежит на миграционном коридоре, и весной и осенью на берегу останавливаются
    кулики, чайки, утки и меняющийся состав пролётных видов. Для орнитологов это ближайший к Тбилиси участок
    открытой степи, и утро с биноклем обычно бывает результативным.


    Для остальных это странный опустошённый пейзаж — мусор местами на берегу, брошенные здания, тишина.
    Кому нужны виды — лучше поехать в другое место; кто хочет увидеть совсем иную сторону окрестностей
    Тбилиси, потратит здесь час не зря.
  tip: >-
    Двух часов достаточно. Бинокль обязателен, длинный объектив пригодится. Тени, туалета и кафе нет —
    везите всё из Тбилиси. Берег илистый, весной машины легко садятся: держитесь колеи. Летний полдень
    бессмыслен: жарко и почти нет птиц. Приезжать стоит в марте-апреле и сентябре-октябре, рано утром.
  route: >-
    Из Тбилиси на юг по марнеульской трассе около 20 км, затем поворот на восток в сторону Кумиси. Всего
    24 км, примерно тридцать пять минут. Трасса хорошая; последние три километра — узкий асфальт и грунт,
    после дождя грязный. Заправок на трассе много. Машину оставьте у дороги и спуститесь к берегу пешком,
    не выезжая на такыр.
fa:
  name: دریاچهٔ کومیسی
  short: دریاچه‌ای شور در گودالی استپی جنوب تفلیس، نزدیک‌ترین جای پایتخت برای پرنده‌نگری در دشت باز.
  body: >-
    **کومیسی به معنای متعارف دریاچه‌ای زیبا نیست و بهتر است پیش از راه افتادن این را بدانید.** بیست و
    چهار کیلومتر با تفلیس فاصله دارد و در گودالی استپی و بی‌درخت نشسته است: تپه‌های زرد، خاک شور، باد،
    و تهیِ نزدیک به کامل.


    دریاچه کم‌عمق و شور است. در دورهٔ شوروی از گِل آن برای درمان استفاده می‌شد و آسایشگاهی بر کرانه‌اش
    بود؛ بازمانده‌های ساختمان‌ها هنوز آنجاست. در دهه‌های اخیر دریاچه به‌شدت کوچک شده و در سال‌های خشک
    نیمی از آن به شوره‌زار بدل می‌شود، با حاشیه‌ای پهن از خشکی و پوسته‌ای سفید. این یک مشکل زیست‌محیطی
    است نه یک ویژگی. پس از بهاری پرباران آب بازمی‌گردد و کومیسی برای مدتی کوتاه دریاچه‌ای واقعی می‌نماید
    و تپه‌های برهنه در آن بازتاب می‌یابند؛ اما در مرداد یک سال خشک، همان منظره تشتی سفید است که رد تراکتور
    آن را بریده است.


    اما برای پرندگان اهمیت دارد. کومیسی بر دالان مهاجرت نشسته است، و در بهار و پاییز آبچلیک‌ها، کاکایی‌ها،
    اردک‌ها و مجموعه‌ای متغیر از مهاجران گذری بر کرانهٔ آن توقف می‌کنند. برای پرنده‌نگرها این نزدیک‌ترین
    تکه از استپ باز به تفلیس است و یک صبح با دوربین معمولاً پربار درمی‌آید.


    برای دیگران، چشم‌اندازی است غریب و تهی‌شده — زباله در بخش‌هایی از کرانه، ساختمان‌های رهاشده، و سکوت.
    هر که دنبال منظره است باید جای دیگری برود؛ و هر که می‌خواهد روی یکسره دیگری از پیرامون تفلیس را ببیند،
    یک ساعت اینجا را بیهوده نخواهد یافت.
  tip: >-
    دو ساعت کافی است. دوربین دوچشمی ضروری است و لنز بلند کمک می‌کند. سایه، سرویس بهداشتی و کافه نیست،
    پس همه‌چیز را از تفلیس بیاورید. کرانه گِلی است و در بهار خودرو به‌آسانی گیر می‌کند — روی مسیر بمانید.
    ظهر تابستان بی‌فایده است: گرم و تقریباً بی‌پرنده. بهترین زمان اسفند تا فروردین و شهریور تا مهر است،
    سپیده‌دم.
  route: >-
    از تفلیس به جنوب روی بزرگراه مارنئولی حدود ۲۰ کیلومتر بروید، سپس به شرق و به سوی کومیسی بپیچید. روی‌هم
    ۲۴ کیلومتر، حدود سی‌وپنج دقیقه. بزرگراه خوب است؛ سه کیلومتر آخر آسفالت باریک و خاک است و پس از باران
    گِل می‌شود. سوخت روی بزرگراه فراوان است. خودرو را کنار مسیر بگذارید و پیاده به کرانه پایین بروید،
    نه با خودرو روی شوره‌زار.
he:
  name: אגם קומיסי
  short: אגם מלח באגן ערבתי מדרום לטביליסי, המקום הקרוב ביותר לבירה לצפרות בשטח פתוח.
  body: >-
    **קומיסי אינו אגם יפה במובן הרגיל, ומוטב לדעת זאת לפני שיוצאים.** הוא שוכן עשרים וארבעה קילומטרים
    מטביליסי באגן ערבתי חסר עצים: גבעות צהובות, קרקע מלוחה, רוח וריקנות כמעט מוחלטת.


    האגם רדוד ומלוח. בתקופה הסובייטית שימש הבוץ שלו לטיפולים ועל החוף עמד בית הבראה; שרידי המבנים עדיין
    שם. בעשורים האחרונים הצטמק האגם בחדות, ובשנים יבשות הוא הופך למחצה למישור מלח, עם שוליים יבשים רחבים
    וקרום לבן. זו בעיה סביבתית ולא מאפיין. אחרי אביב גשום המים חוזרים וקומיסי נראה לזמן קצר כאגם של ממש,
    והגבעות החשופות משתקפות בו; ואילו באוגוסט של שנה יבשה אותו מראה הוא משטח לבן שחוצים אותו סימני טרקטורים.


    לציפורים, לעומת זאת, יש לו חשיבות. קומיסי יושב על מסדרון נדידה, ובאביב ובסתיו עוצרים על קו החוף חופמאים,
    שחפים, ברווזים ומגוון משתנה של נודדים חולפים. לצפרים זהו כתם הערבה הפתוחה הקרוב ביותר לטביליסי, ובוקר
    עם משקפת בדרך כלל מניב.


    לכל השאר זהו נוף מוזר ומרוקן — פסולת בחלקים מן החוף, מבנים נטושים ושקט. מי שמחפש נוף שילך למקום אחר;
    מי שרוצה לראות פן שונה לגמרי של סביבות טביליסי ימצא כאן שעה מוצדקת.
  tip: >-
    שעתיים מספיקות. משקפת הכרחית ועדשה ארוכה עוזרת. אין צל, אין שירותים ואין בית קפה, לכן הביאו הכול מטביליסי.
    החוף בוצי ורכבים נתקעים בקלות באביב — הישארו על הדרך. צהרי קיץ חסרי טעם: חם וכמעט בלי ציפורים. מרץ
    עד אפריל וספטמבר עד אוקטובר, מוקדם בבוקר, הם הזמנים לבוא.
  route: >-
    צאו מטביליסי דרומה בכביש מרנאולי כ-20 ק״מ, ואז פנו מזרחה לכיוון קומיסי. 24 ק״מ בסך הכול, כשלושים וחמש
    דקות. הכביש הראשי טוב; שלושת הקילומטרים האחרונים אספלט צר ועפר שנעשים בוציים אחרי גשם. תחנות דלק רבות
    על הכביש. השאירו את הרכב ליד הדרך ורדו אל החוף ברגל במקום לנסוע אל המישורים.
ar:
  name: بحيرة كوميسي
  short: بحيرة مالحة في حوض سهبي جنوب تبليسي، وأقرب موضع إلى العاصمة لمراقبة الطيور في أرض مفتوحة.
  body: >-
    **كوميسي ليست بحيرة جميلة بالمعنى المعتاد، ومن الأفضل معرفة ذلك قبل الانطلاق.** تقع على بعد أربعة
    وعشرين كيلومتراً من تبليسي في حوض سهبي خالٍ من الشجر: تلال صفراء، وأرض مالحة، وريح، وفراغ شبه تام.


    البحيرة ضحلة مالحة. وفي العهد السوفييتي استُخدم طينها للعلاج وقام على شاطئها مصح؛ وبقايا المباني ما
    زالت هناك. وفي العقود الأخيرة انكمشت البحيرة بشدة، وفي السنوات الجافة تصير نصفها سبخة ملحية، بحافة
    جافة عريضة وقشرة بيضاء. وهذه مشكلة بيئية لا سمة مميزة. وبعد ربيع ماطر يعود الماء فتبدو كوميسي مدة
    قصيرة بحيرة حقيقية تنعكس فيها التلال العارية؛ أما في آب من سنة جافة فالمشهد نفسه صحن أبيض تشقه آثار
    الجرارات.


    أما للطيور فلها شأن. تقع كوميسي على ممر هجرة، وفي الربيع والخريف تتوقف على خطها الساحلي طيور الخواضة
    والنوارس والبط ومجموعة متبدلة من المهاجرين العابرين. ولمراقبي الطيور هذه أقرب رقعة سهب مفتوح إلى تبليسي،
    وصباح واحد بمنظار يكون مثمراً عادة.


    ولسائر الناس هو مشهد غريب مفرَّغ — نفايات في أجزاء من الشاطئ، ومبانٍ مهجورة، وصمت. من يبحث عن جمال
    المناظر فليقصد غيرها؛ ومن يريد أن يرى وجهاً مختلفاً تماماً لمحيط تبليسي سيجد ساعة هنا في محلها.
  tip: >-
    ساعتان تكفيان. المنظار ضروري والعدسة الطويلة تساعد. ولا ظل ولا دورة مياه ولا مقهى، فاحمل كل شيء من
    تبليسي. والشاطئ طيني والسيارات تغرز بسهولة في الربيع — التزم المسار. وظهيرة الصيف بلا جدوى: حارة وخالية
    من الطيور تقريباً. وآذار إلى نيسان وأيلول إلى تشرين الأول، في الصباح الباكر، هي أوقات المجيء.
  route: >-
    اتجه جنوباً من تبليسي على طريق مارنئولي السريع نحو 20 كم، ثم انعطف شرقاً باتجاه كوميسي. أربعة وعشرون
    كيلومتراً إجمالاً، نحو خمس وثلاثين دقيقة. الطريق السريع جيد؛ والكيلومترات الثلاثة الأخيرة إسفلت ضيق
    وتراب يصير موحلاً بعد المطر. والوقود وفير على الطريق السريع. اترك السيارة بجانب المسار وانزل إلى الشاطئ
    سيراً بدل القيادة فوق السبخة.
