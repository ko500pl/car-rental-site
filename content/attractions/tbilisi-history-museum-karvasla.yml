ka:
  name: თბილისის ისტორიის მუზეუმი (ქარვასლა)
  short: >-
    სიონის გვერდით, XVII საუკუნის სარდაფებზე 1818 წელს აგებული ქარვასლა — დღეს თბილისის ისტორიის მუზეუმი,
    დაახლოებით 50 000 ექსპონატით.
  body: >-
    **მექარავნეები ოდესღაც ზედა სართულზე ღამეს ათევდნენ, შუა სართულზე ვაჭრობდნენ, საქონელს კი როსტომ მეფის
    დროინდელ თაღოვან სარდაფებში ინახავდნენ — დღეს სიონის გვერდით მდგარი ეს შენობა მთლიანად თბილისის ამბავს
    ჰყვება.**


    სიტყვა „ქარვასლა“ სპარსულიდან მოდის და გზისპირა სასტუმროს, ქარავნების ღამის გასათევს ნიშნავს; XVIII
    საუკუნის თბილისში ოთხი ქარვასლა იყო. აქ, სიონის ტაძრის გვერდით, XVII საუკუნეში როსტომ მეფის აგებული
    ქარვასლა იდგა, ამ ქუჩის უდიდესი ქარვასლები კი 1795 წელს აღა-მაჰმად-ხანის შემოსევამ გაანადგურა. 1818
    წელს თბილისის მოქალაქემ, ეროვნებით სომეხმა გევორქ არწრუნმა, ძველ საძირკველზე სამსართულიანი ქარვასლა
    ააგო: ზემოთ — 33 სასტუმრო ოთახი, შუა სართულზე — 25 პატარა დუქანი, ქვემოთ — საწყობები და მეწაღეებისა
    და მკერავების სახელოსნოები, შიდა ეზოში კი აუზი. 1855 წლის ხანძარმა შენობა დააზიანა, მაგრამ მალევე
    აღადგინეს და ქარვასლა 1920-იან წლებამდე თავის საქმეს ემსახურებოდა. სანაპიროსკენ მიქცეული ფასადი (1820)
    რუსული კლასიციზმის ნიმუშია, სიონის ქუჩისა (1912) კი — მოდერნისა.


    მუზეუმი 1910 წლის 10 მაისს „თბილისის მუნიციპალურ მუზეუმად“ დაარსდა და დიდხანს შენობიდან შენობაში მოგზაურობდა,
    ვიდრე 1984 წელს, არქიტექტორ გიგა ბათიაშვილის ხელმძღვანელობით, მისთვის ქარვასლა არ აღადგინეს. 1996
    წელს მუზეუმს პოეტისა და თბილისის მემატიანის, იოსებ გრიშაშვილის სახელი მიენიჭა; 2004 წლიდან ის საქართველოს
    ეროვნული მუზეუმის ნაწილია და დაახლოებით 50 000 ექსპონატს ინახავს.


    კოლექციაშია V საუკუნის აქატის საბეჭდი გემა ვახტანგ გორგასლის გამოსახულებით, თბილისის უძველესი რუკები
    და გეგმები, XIX საუკუნის ქართველ არისტოკრატთა პორტრეტები, ფრანც რუბოდან ლადო გუდიაშვილამდე სხვადასხვა
    მხატვრის ნამუშევრები და XIX საუკუნის თბილისური შენობების მაკეტები — მათ შორის ისეთებისაც, რომლებიც
    არასოდეს აშენებულა. აქვეა ძველი რესტორნისა და ხელოსნების სახელოსნოების მაკეტები და იმდროინდელი კარეტა.


    ქარვასლა დღესაც ერთგვარი სასტუმროა — უბრალოდ, სტუმრები დაბერდნენ და აქ სამუდამოდ დარჩნენ.
  tip: >-
    მუზეუმი ყოველდღე, ორშაბათის გარდა, 10:00-დან 18:00 საათამდე მუშაობს. ზრდასრულის ბილეთი 5 ლარია, სტუდენტებისა
    და მოსწავლეების — 50 თეთრი, ექვს წლამდე ბავშვებისთვის შესვლა უფასოა. გამოყავით ერთი საათი: პირველ
    სართულზე სუვენირების მაღაზიებია, მეორეზე — XIX საუკუნის თბილისი, მესამე სართული კი, როგორც წესი, თანამედროვე
    ხელოვნების დროებით გამოფენებს ეთმობა. მეზობლად სიონის ტაძარია — იქ მხრები და მუხლები დაფარული უნდა
    გქონდეთ, ქალებს თავსაფარი დასჭირდებათ. ვიწრო ქუჩებში მანქანით ნუ შეხვალთ: სიონის ქუჩა მეტწილად საფეხმავლოა,
    ამიტომ მანქანა სანაპიროზე ან ძველი ქალაქის ფასიან ავტოსადგომზე დატოვეთ და ბოლო რამდენიმე წუთი ფეხით
    გაიარეთ.
  route: >-
    თავისუფლების მოედნიდან დაახლოებით 1 კმ და 5 წუთია, თუმცა ფეხით, 10–15 წუთში, უფრო ადრე მიხვალთ, ვიდრე
    მანქანას დააყენებთ. თუ მაინც მანქანით მიდიხართ, პუშკინის ქუჩითა და ბარათაშვილის გამზირით ჩადით მარჯვენა
    სანაპიროზე (ზვიად გამსახურდიას სანაპირო) და დაახლოებით 400 მეტრის შემდეგ მარჯვნივ, ძველი ქალაქისკენ
    გადაუხვიეთ; მუზეუმი სიონის ქუჩა №8-შია, ტაძრიდან რამდენიმე ნაბიჯზე. საკუთარი ავტოსადგომი არ აქვს,
    ქუჩა კი მეტწილად საფეხმავლო და ქვაფენილიანია, ამიტომ ძველი ქალაქის კიდეზე ფასიანი ავტოსადგომი ან ქუჩის
    პარკირება გამოიყენეთ. ნებისმიერი ეკონომ-კლასის მანქანა გამოდგება.
en:
  name: Tbilisi History Museum (Karvasla)
  short: >-
    An 1818 merchants' caravanserai on 17th-century vaults beside Sioni Cathedral, now Tbilisi's city-history
    museum with some 50,000 objects.
  body: >-
    **Caravan traders once slept on the top floor, bargained on the middle one and stacked their bales
    in vaulted cellars from King Rostom's time — now the whole building beside Sioni Cathedral tells Tbilisi's
    story instead.**


    The word karvasla comes from the Persian for a roadside inn for caravans, and 18th-century Tbilisi
    had four of them. A caravanserai built by King Rostom stood here beside Sioni in the 17th century,
    and the largest inns on this street were wrecked in Agha Mohammad Khan's raid of 1795. In 1818 Gevork
    Artsruni, an Armenian citizen of Tbilisi, raised a new three-storey caravanserai on the old foundations:
    33 guest rooms upstairs, 25 small shops on the middle floor, storerooms and the workshops of cobblers
    and tailors below, and a pool in the courtyard. Damaged by fire in 1855 and soon rebuilt, it worked
    as an inn until the 1920s. The riverside façade (1820) is Russian Classicism; the Sioni Street front
    (1912) is Art Nouveau.


    The museum, founded on 10 May 1910 as the city's municipal museum, wandered from building to building
    until the caravanserai was restored for it in 1984 under the architect Giga Batiashvili. Named in
    1996 after the poet and Tbilisi chronicler Ioseb Grishashvili, it has belonged to the Georgian National
    Museum since 2004 and holds around 50,000 objects.


    The collection includes a fifth-century agate seal bearing an image of King Vakhtang Gorgasali, the
    city's oldest maps and plans, portraits of 19th-century Georgian aristocrats, work by painters from
    Franz Roubaud to Lado Gudiashvili, and models of 19th-century Tbilisi buildings — some of them never
    built. There are mock-ups of an old restaurant and craft workshops, and a period carriage.


    It is still an inn of sorts. The guests are simply older now, and they stay for good.
  tip: >-
    Open daily except Monday, 10:00–18:00. Adults pay 5 GEL, students and schoolchildren 0.50 GEL, and
    children under six go free. Allow an hour: souvenir shops occupy the ground floor, 19th-century Tbilisi
    fills the floor above, and the top floor usually hosts temporary shows of contemporary art. Pair it
    with Sioni Cathedral next door, where shoulders and knees should be covered and women need a headscarf.
    Do not try to drive into the lanes: Sioni Street is largely pedestrian, so leave the car on the embankment
    or in an Old Town paid lot and walk the last few minutes.
  route: >-
    About 1 km and 5 minutes from Freedom Square — though on foot, in 10–15 minutes, you will arrive before
    a driver has found a space. If you do come by car, drop down Pushkin Street and Baratashvili Avenue
    to the right-bank embankment (Zviad Gamsakhurdia Embankment) and after roughly 400 metres turn right
    into the Old Town; the museum is at 8 Sioni Street, a few steps from the cathedral. There is no dedicated
    parking and the street itself is mostly pedestrian and cobbled, so use a paid lot or street parking
    at the edge of the Old Town. Any economy car will do.
ru:
  name: Музей истории Тбилиси (Карвасла)
  short: >-
    Купеческий караван-сарай 1818 года на сводах XVII века рядом с собором Сиони — ныне музей истории
    города, где хранится около 50 000 предметов.
  body: >-
    **Когда-то караванные торговцы спали на верхнем этаже, торговались на среднем и складывали тюки в
    сводчатых подвалах времён царя Ростома — теперь всё здание рядом с собором Сиони рассказывает историю
    самого Тбилиси.**


    Слово «карвасла» восходит к персидскому названию придорожного постоялого двора для караванов, и в
    Тбилиси XVIII века таких было четыре. Караван-сарай, построенный царём Ростомом, стоял здесь, у Сиони,
    ещё в XVII веке, а крупнейшие постоялые дворы этой улицы были разорены во время набега Ага-Мохаммед-хана
    в 1795 году. В 1818 году Геворк Арцруни, тбилисский горожанин-армянин, возвёл на старом фундаменте
    новый трёхэтажный караван-сарай: 33 комнаты для постояльцев наверху, 25 маленьких лавок на среднем
    этаже, склады и мастерские сапожников и портных внизу и бассейн во дворе. Пострадав от пожара в 1855
    году и вскоре восстановленный, он служил постоялым двором до 1920-х годов. Фасад со стороны реки (1820)
    выдержан в духе русского классицизма, фасад на улицу Сиони (1912) — в стиле модерн.


    Музей, основанный 10 мая 1910 года как городской муниципальный музей, кочевал из здания в здание,
    пока в 1984 году для него не отреставрировали караван-сарай под руководством архитектора Гиги Батиашвили.
    В 1996 году музею присвоили имя поэта и летописца Тбилиси Иосифа Гришашвили; с 2004 года он входит
    в Национальный музей Грузии и хранит около 50 000 предметов.


    В собрании — агатовая печать V века с изображением царя Вахтанга Горгасали, древнейшие карты и планы
    города, портреты грузинских аристократов XIX века, работы художников от Франца Рубо до Ладо Гудиашвили
    и макеты тбилисских зданий XIX века, в том числе так и не построенных. Есть воссозданные старый ресторан
    и ремесленные мастерские, а также старинная карета.


    Это и сейчас в каком-то смысле постоялый двор. Просто постояльцы стали старше — и остаются навсегда.
  tip: >-
    Открыт ежедневно, кроме понедельника, с 10:00 до 18:00. Взрослый билет — 5 лари, для студентов и школьников
    — 0,50 лари, дети до шести лет проходят бесплатно. Закладывайте час: первый этаж занимают сувенирные
    лавки, этажом выше — Тбилиси XIX века, а на верхнем этаже обычно проходят временные выставки современного
    искусства. Совместите визит с соседним собором Сиони, где плечи и колени должны быть закрыты, а женщинам
    нужен платок. Не пытайтесь заехать в переулки: улица Сиони в основном пешеходная, так что оставьте
    машину на набережной или на платной стоянке Старого города и пройдите последние несколько минут пешком.
  route: >-
    Около 1 км и 5 минут от площади Свободы — хотя пешком, за 10–15 минут, вы доберётесь раньше, чем водитель
    найдёт место для парковки. Если всё же едете на машине, спуститесь по улице Пушкина и проспекту Бараташвили
    к правобережной набережной (набережная Звиада Гамсахурдиа) и примерно через 400 метров сверните направо
    в Старый город; музей находится на улице Сиони, 8, в нескольких шагах от собора. Отдельной парковки
    нет, а сама улица в основном пешеходная и мощёная, так что воспользуйтесь платной стоянкой или уличной
    парковкой на краю Старого города. Подойдёт любая машина эконом-класса.
fa:
  name: موزهٔ تاریخ تفلیس (کاروسلا)
  short: >-
    کاروانسرای بازرگانی از سال ۱۸۱۸ بر طاق‌های سدهٔ هفدهم در کنار کلیسای جامع سیونی، که امروز موزهٔ تاریخ
    شهر تفلیس است با حدود ۵۰,۰۰۰ شیء.
  body: >-
    **روزگاری بازرگانان کاروان‌ها در طبقهٔ بالا می‌خوابیدند، در طبقهٔ میانی چانه می‌زدند و بسته‌هایشان
    را در زیرزمین‌های طاق‌دار روزگار شاه رستم انبار می‌کردند — اکنون سراسر این ساختمانِ کنار کلیسای جامع
    سیونی داستان خودِ تفلیس را بازمی‌گوید.**


    واژهٔ «کاروسلا» از واژهٔ فارسی «کاروانسرا»، یعنی مهمان‌سرای میان‌راهی کاروان‌ها، آمده است، و تفلیسِ
    سدهٔ هجدهم چهار کاروانسرا داشت. کاروانسرایی که شاه رستم ساخته بود در سدهٔ هفدهم همین‌جا، کنار سیونی،
    برپا بود، و بزرگ‌ترین مهمان‌سراهای این خیابان در یورش آقامحمدخان در ۱۷۹۵ ویران شدند. در ۱۸۱۸ گئورک
    آرتسرونی، از شهروندان ارمنی تفلیس، کاروانسرای سه‌طبقهٔ تازه‌ای بر پی‌های کهن برافراشت: ۳۳ اتاق مهمان
    در طبقهٔ بالا، ۲۵ دکان کوچک در طبقهٔ میانی، انبارها و کارگاه‌های کفاشان و خیاطان در پایین، و حوضی
    در حیاط. این بنا در ۱۸۵۵ از آتش‌سوزی آسیب دید و به‌زودی بازسازی شد و تا دههٔ ۱۹۲۰ مهمان‌سرا بود. نمای
    رو به رود (۱۸۲۰) به سبک کلاسیسیسم روسی است و نمای خیابان سیونی (۱۹۱۲) به سبک آر نوو.


    موزه، که در ۱۰ مهٔ ۱۹۱۰ به عنوان موزهٔ شهرداری بنیاد نهاده شد، از ساختمانی به ساختمان دیگر می‌رفت
    تا آنکه در ۱۹۸۴ کاروانسرا زیر نظر معمار، گیگا باتیاشویلی، برایش مرمت شد. در ۱۹۹۶ نام شاعر و وقایع‌نگار
    تفلیس، یوسب گریشاشویلی، بر آن نهاده شد؛ از ۲۰۰۴ بخشی از موزهٔ ملی گرجستان است و حدود ۵۰,۰۰۰ شیء را
    نگه می‌دارد.


    در این مجموعه مهری عقیقی از سدهٔ پنجم با نقش شاه واختانگ گورگاسالی، کهن‌ترین نقشه‌ها و طرح‌های شهر،
    چهره‌هایی از اشراف گرجی سدهٔ نوزدهم، آثاری از نقاشانی از فرانتس روبو تا لادو گودیاشویلی، و ماکت‌هایی
    از بناهای تفلیس سدهٔ نوزدهم — برخی از آن‌ها هرگز ساخته نشدند — دیده می‌شود. بازسازی یک رستوران قدیمی
    و کارگاه‌های پیشه‌وری نیز هست، و کالسکه‌ای از همان روزگار.


    این بنا هنوز هم به نوعی مهمان‌سراست. تنها مهمانانش اکنون کهن‌سال‌ترند، و برای همیشه می‌مانند.
  tip: >-
    هر روز به‌جز دوشنبه از ۱۰:۰۰ تا ۱۸:۰۰ باز است. بلیت بزرگسالان ۵ لاری، دانشجویان و دانش‌آموزان ۰٫۵۰
    لاری است و کودکان زیر شش سال رایگان وارد می‌شوند. یک ساعت وقت بگذارید: طبقهٔ همکف را دکان‌های سوغات
    گرفته‌اند، طبقهٔ بالاتر به تفلیس سدهٔ نوزدهم اختصاص دارد و طبقهٔ آخر معمولاً میزبان نمایشگاه‌های موقت
    هنر معاصر است. بازدید را با کلیسای جامع سیونیِ همسایه همراه کنید، که در آن شانه‌ها و زانوها باید پوشیده
    باشند و بانوان به روسری نیاز دارند. سعی نکنید با خودرو وارد کوچه‌ها شوید: خیابان سیونی بیشتر پیاده‌راه
    است، پس خودرو را در کنار رود یا در یکی از پارکینگ‌های پولی شهر قدیم بگذارید و چند دقیقهٔ آخر را پیاده
    بروید.
  route: >-
    حدود ۱ کیلومتر و ۵ دقیقه از میدان آزادی — هرچند پیاده، در ۱۰ تا ۱۵ دقیقه، پیش از آنکه راننده‌ای جای
    پارک پیدا کند رسیده‌اید. اگر با خودرو می‌آیید، از خیابان پوشکین و بلوار باراتاشویلی به کناره‌گذر ساحل
    راست رود (کناره‌گذر زویاد گامساخوردیا) پایین بروید و پس از حدود ۴۰۰ متر به راست، به شهر قدیم بپیچید؛
    موزه در شمارهٔ ۸ خیابان سیونی است، چند قدم دورتر از کلیسای جامع. پارکینگ ویژه‌ای ندارد و خود خیابان
    بیشتر پیاده‌راه و سنگفرش است، پس از پارکینگ پولی یا پارک کنار خیابان در حاشیهٔ شهر قدیم استفاده کنید.
    هر خودروی اقتصادی‌ای کار را راه می‌اندازد.
he:
  name: המוזיאון לתולדות טביליסי (קרוואסלה)
  short: >-
    חאן סוחרים משנת 1818 הבנוי על קמרונות מהמאה ה-17 לצד קתדרלת סיוני, וכיום המוזיאון לתולדות העיר, ובו
    כ-50,000 פריטים.
  body: >-
    **פעם ישנו סוחרי השיירות בקומה העליונה, התמקחו בקומה האמצעית ואחסנו את חבילותיהם במרתפים מקומרים מימי
    המלך רוסטום — היום הבניין כולו, לצד קתדרלת סיוני, מספר במקום זאת את סיפורה של טביליסי.**


    המילה ״קרוואסלה״ באה מן המילה הפרסית לפונדק דרכים לשיירות, ובטביליסי של המאה ה-18 היו ארבעה כאלה.
    חאן שבנה המלך רוסטום עמד כאן, לצד סיוני, במאה ה-17, והפונדקים הגדולים ביותר ברחוב הזה נהרסו בפשיטתו
    של אע'א מוחמד ח'אן ב-1795. ב-1818 הקים גבורק ארצרוני, תושב טביליסי ממוצא ארמני, חאן חדש בן שלוש קומות
    על היסודות הישנים: 33 חדרי אורחים למעלה, 25 חנויות קטנות בקומה האמצעית, מחסנים וסדנאות של סנדלרים
    וחייטים למטה, ובריכה בחצר. הבניין ניזוק בשריפה ב-1855, שוקם זמן קצר אחר כך ושימש פונדק עד שנות ה-20
    של המאה ה-20. החזית הפונה לנהר (1820) היא בסגנון הקלאסיציזם הרוסי; החזית לרחוב סיוני (1912) היא ארט
    נובו.


    המוזיאון, שנוסד ב-10 במאי 1910 כמוזיאון העירוני, נדד מבניין לבניין עד שהחאן שוקם עבורו ב-1984 בהנחיית
    האדריכל גיגה בטיאשווילי. ב-1996 נקרא על שם המשורר וכרוניקן טביליסי יוסב גרישאשווילי; מאז 2004 הוא
    חלק מהמוזיאון הלאומי של גאורגיה, ויש בו כ-50,000 פריטים.


    באוסף: חותם אגט מהמאה החמישית הנושא את דמותו של המלך וחטנג גורגסלי, המפות והתוכניות העתיקות ביותר
    של העיר, דיוקנאות של אצילים גאורגים מהמאה ה-19, יצירות של ציירים מפרנץ רובו ועד לאדו גודיאשווילי,
    ודגמים של בניינים בטביליסי של המאה ה-19 — חלקם כאלה שמעולם לא נבנו. יש גם שחזורים של מסעדה ישנה ושל
    סדנאות מלאכה, וכרכרה בת התקופה.


    זה עדיין פונדק, במובן מסוים. רק האורחים זקנים יותר עכשיו, והם נשארים לתמיד.
  tip: >-
    פתוח בכל יום מלבד יום שני, 10:00–18:00. מבוגרים משלמים 5 לארי, סטודנטים ותלמידים 0.50 לארי, וילדים
    מתחת לגיל שש נכנסים חינם. הקדישו שעה: חנויות מזכרות תופסות את קומת הקרקע, טביליסי של המאה ה-19 ממלאת
    את הקומה שמעליה, והקומה העליונה מארחת בדרך כלל תערוכות מתחלפות של אמנות עכשווית. שלבו את הביקור עם
    קתדרלת סיוני הסמוכה, שבה יש לכסות כתפיים וברכיים ונשים צריכות כיסוי ראש. אל תנסו להיכנס ברכב לסמטאות:
    רחוב סיוני הוא ברובו מדרחוב, אז השאירו את הרכב בכביש שלאורך הנהר או בחניון בתשלום בעיר העתיקה ועשו
    את הדקות האחרונות ברגל.
  route: >-
    כ-1 ק״מ ו-5 דקות נסיעה מכיכר החירות — אם כי ברגל, ב-10–15 דקות, תגיעו לפני שנהג ימצא חנייה. אם בכל
    זאת אתם באים ברכב, רדו ברחוב פושקין ובשדרות ברטשווילי אל כביש הגדה הימנית (סוללת זביאד גמסחורדיה),
    ואחרי כ-400 מטרים פנו ימינה אל העיר העתיקה; המוזיאון ברחוב סיוני 8, כמה צעדים מהקתדרלה. אין חנייה
    ייעודית, והרחוב עצמו ברובו מדרחוב מרוצף אבנים, לכן השתמשו בחניון בתשלום או בחנייה ברחוב בשולי העיר
    העתיקה. כל רכב מקטגוריית אקונומי יתאים.
ar:
  name: متحف تاريخ تبليسي (كارفاسلا)
  short: >-
    خان للتجار يعود إلى عام 1818 قائم على أقبية من القرن السابع عشر بجوار كاتدرائية سيوني، وهو اليوم متحف
    تاريخ المدينة ويضم نحو 50,000 قطعة.
  body: >-
    **كان تجار القوافل ينامون يومًا في الطابق العلوي، ويساومون في الأوسط، ويكدّسون رزمهم في أقبية معقودة
    من عهد الملك روستوم — أما اليوم فالمبنى كله، بجوار كاتدرائية سيوني، يروي بدلًا من ذلك حكاية تبليسي.**


    كلمة «كارفاسلا» مأخوذة من الكلمة الفارسية الدالة على نُزُل القوافل على الطريق (الكاروانسراي)، وكان
    في تبليسي القرن الثامن عشر أربعة منها. وقد قام هنا، بجوار سيوني، خانٌ بناه الملك روستوم في القرن السابع
    عشر، ودُمّرت أكبر خانات هذا الشارع في غارة آغا محمد خان عام 1795. وفي 1818 شيّد غيفورك أرتسروني، أحد
    أهالي تبليسي الأرمن، خانًا جديدًا من ثلاثة طوابق على الأساسات القديمة: 33 غرفة للنزلاء في الأعلى،
    و25 دكانًا صغيرًا في الطابق الأوسط، ومخازن وورش للإسكافيين والخياطين في الأسفل، وحوض ماء في الفناء.
    أصابه حريق عام 1855 وسرعان ما أُعيد بناؤه، وظل يعمل نُزُلًا حتى عشرينيات القرن العشرين. واجهته المطلة
    على النهر (1820) على طراز الكلاسيكية الروسية، وواجهته على شارع سيوني (1912) على طراز الآرت نوفو.


    أما المتحف، الذي تأسس في 10 مايو 1910 متحفًا بلديًا للمدينة، فقد تنقّل من مبنى إلى آخر حتى رُمّم له
    الخان عام 1984 بإشراف المعماري غيغا باتياشفيلي. وفي 1996 سُمّي باسم الشاعر ومؤرخ تبليسي يوسب غريشاشفيلي،
    وهو منذ 2004 جزء من المتحف الوطني الجورجي، ويضم نحو 50,000 قطعة.


    تشمل المجموعة ختمًا من العقيق من القرن الخامس يحمل صورة الملك فاختانغ غورغاسالي، وأقدم خرائط المدينة
    ومخططاتها، وصورًا لأرستقراطيين جورجيين من القرن التاسع عشر، وأعمالًا لرسامين من فرانز روبو إلى لادو
    غودياشفيلي، ومجسمات لمبانٍ في تبليسي القرن التاسع عشر — بعضها لم يُبنَ قط. وثمة نماذج لمطعم قديم وورش
    حرفية، وعربة خيل من تلك الحقبة.


    ما زال نُزُلًا على نحو ما. كل ما في الأمر أن النزلاء صاروا أكبر سنًّا، وأنهم يقيمون إلى الأبد.
  tip: >-
    يفتح يوميًا عدا الاثنين من 10:00 إلى 18:00. يدفع البالغون 5 لاري، والطلاب وتلاميذ المدارس 0.50 لاري،
    ويدخل الأطفال دون السادسة مجانًا. خصّص ساعة: تشغل متاجر الهدايا التذكارية الطابق الأرضي، وتملأ تبليسي
    القرن التاسع عشر الطابق الذي يليه، ويستضيف الطابق العلوي عادةً معارض مؤقتة للفن المعاصر. واجمع الزيارة
    مع كاتدرائية سيوني المجاورة، حيث ينبغي ستر الكتفين والركبتين وتحتاج النساء إلى غطاء للرأس. لا تحاول
    دخول الأزقة بالسيارة: فشارع سيوني مخصص للمشاة في معظمه، لذا اترك السيارة على الكورنيش أو في موقف مدفوع
    في المدينة القديمة وامشِ الدقائق القليلة الأخيرة.
  route: >-
    نحو 1 كم و5 دقائق من ساحة الحرية — مع أنك ستصل سيرًا على الأقدام، في 10–15 دقيقة، قبل أن يجد السائق
    مكانًا للوقوف. وإن جئت بالسيارة، فانزل عبر شارع بوشكين وجادة باراتاشفيلي إلى كورنيش الضفة اليمنى (كورنيش
    زفياد غامساخورديا)، وبعد نحو 400 متر انعطف يمينًا إلى المدينة القديمة؛ يقع المتحف في شارع سيوني رقم
    8، على بعد خطوات من الكاتدرائية. لا يوجد موقف مخصص، والشارع نفسه في معظمه للمشاة ومرصوف بالحجارة،
    فاستخدم موقفًا مدفوعًا أو الوقوف في الشارع على أطراف المدينة القديمة. أي سيارة اقتصادية تفي بالغرض.
