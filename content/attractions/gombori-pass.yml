ka:
  name: გომბორის უღელტეხილი
  short: >-
    1620 მეტრზე გადასასვლელი შ38 გზაზე, სადაც გარე კახეთი მთავრდება და გზა ალაზნის ველისა და კავკასიონის
    კედლისკენ ეშვება.
  body: >-
    **გომბორი მწვერვალი კი არა, კარიბჭეა: ზურგს უკან გარე კახეთი და იორი გრჩებათ, წინ ალაზნის ველი და
    მისი ვენახები გელით.**


    ცივ-გომბორის ქედი კახეთს 107 კილომეტრზე გასდევს და ყველაზე მაღლა, ცივის მთაზე, 1991 მეტრს აღწევს.
    ის ივრისა და ალაზნის წყალგამყოფია და მხარეს ოდითგანვე ორად ყოფს: ივრის მხარეს გარე კახეთია, ალაზნის
    გაყოლებაზე — შიდა კახეთი. ვაზიანიდან წამოსული შ38 ქედს აქ, 1620 მეტრზე, საგარეჯოსა და თელავის მუნიციპალიტეტების
    საზღვარზე კვეთს. თელავისკენ ეს მოკლე გზაა; გრძელი საგარეჯოსა და ბაკურციხეზე უვლის.


    აღმართი ივრის პირას იწყება. სოფელ უჯარმის შემდეგ გზა უჯარმის ციხეს ჩაუვლის — მდინარის თავზე, გორაზე
    მდგარ ციხე-ქალაქს, რომელიც V საუკუნეში ვახტანგ გორგასლის რეზიდენცია იყო. მერე მოსახვევები იწყება,
    ერთი მეორეში გადადის, ტყე იხშირება, ჰაერი თხელდება და გრილდება. თხემზე ტყე იხსნება და ადგილს მდელოს
    უთმობს, რომლის ქვეშაც ნეოგენური ხანის რბილი ქანები წევს. 1620 მეტრზე ჩვეულებრივ რამდენიმე გრადუსით
    გრილა, ვიდრე ორივე მხარის დაბლობში, და აგვისტოში ეს ნამდვილი საჩუქარია.


    ხედი, რისთვისაც აქ ამოდიან, თავად თხემზე კი არა, თელავისკენ დაშვების პირველ მოსახვევებზე იშლება: ალაზნის
    ველის სწორი ფსკერი, ვენახების გაწყობილი რიგები და მათ იქით კავკასიონის გრძელი კედელი. ყველაფერი ჰაერზეა
    დამოკიდებული. ზაფხულის ნაშუადღევს მთები შეიძლება ბურუსში გაქრეს; ნათელ დილას ან წვიმის შემდეგ კი თოვლიანი
    მწვერვალები ისე ახლოს დგას, თითქოს დათვლა შეიძლებოდეს.


    ადრე გამოდით. კახეთი საუკეთესოდ ისე გხვდებათ, როგორც ამ გზაზე: ერთბაშად და ზემოდან.
  tip: >-
    გაჩერდით მხოლოდ მოწყობილ მოედანზე ან ფართო გვერდულაზე: მოსახვევებში ხედვის მანძილი მოკლეა, მოძრაობა
    კი ორივე მიმართულებით მუდმივია. ხედის საუკეთესო წერტილები თელავის მხარეს, თხემის ოდნავ ქვემოთაა. უღელტეხილზე
    საწვავი არ არის და მომსახურების იმედი არც თხემზე უნდა გქონდეთ; თელავამდე კიდევ 25-იოდე კილომეტრია.
    ზამთარში დიდთოვლობამ შეიძლება გზა ჩაკეტოს ან ჯაჭვები გახადოს საჭირო — ასეთ დღეებში საგარეჯოსა და ბაკურციხეზე
    გამავალი ბარის გზა (ს5) აჯობებს. თბილი ტანსაცმელი ნებისმიერ სეზონში წამოიღეთ, ხოლო თუ მთები მოწმენდილი
    გინდათ, ადრე გამოდით.
  route: >-
    თბილისიდან აღმოსავლეთით, კახეთის გზატკეცილით (ს5) გადით. ვაზიანის გავლით, დაახლოებით 26-ე კილომეტრზე,
    გადაუხვიეთ შ38-ზე თელავის მიმართულებით. გზა იორს მიუყვება უჯარმამდე, ციხეს ჩაუვლის და მერე უწყვეტი
    მოსახვევებით თხემისკენ ადის: თბილისის ცენტრიდან 69 კილომეტრი, დაახლოებით საათნახევარი, მთელ გზაზე
    ასფალტი. საწვავი ს5-იდან გადასვლამდე ჩაასხით — მთაზე ბენზინგასამართი არ არის. ეკონომ-კლასის მანქანა
    სავსებით საკმარისია, დეკემბრიდან მარტამდე ზამთრის საბურავებით. უღელტეხილიდან თელავამდე 25-იოდე კილომეტრია,
    ამიტომ იყალთოს, ალავერდისა და გრემისკენ მიმავალი ბუნებრივი გზაც ესაა.
en:
  name: Gombori Pass
  short: >-
    A 1,620-metre crossing on the Sh38 where Outer Kakheti ends and the road tips down towards the Alazani
    valley and the wall of the Caucasus.
  body: >-
    **Gombori is less a summit than a doorway: behind you lie Outer Kakheti and the Iori, ahead the Alazani
    valley and its vines.**


    The Tsiv-Gombori range runs 107 kilometres through Kakheti and rises to 1,991 metres at Mount Tsivi.
    It is the watershed between the Iori and the Alazani, and it has always split the province in two:
    Gare, or Outer, Kakheti on the Iori side, Shida, or Inner, Kakheti along the Alazani. The Sh38 from
    Vaziani crosses it here at 1,620 metres, on the line between Sagarejo and Telavi municipalities. This
    is the short way to Telavi; the long way runs round through Sagarejo and Bakurtsikhe.


    The climb begins beside the Iori. Beyond Ujarma village the road passes Ujarma fortress on its hill
    above the river, a residence of King Vakhtang Gorgasali in the fifth century. Then the bends start,
    one folded into the next, the forest closes in, and the air thins and cools. At the crest the trees
    give way to open meadow over soft Neogene rock. At 1,620 metres it is usually several degrees cooler
    than in the valleys on either side, which in August feels like a gift.


    The view you come for opens not at the top but on the first bends of the descent towards Telavi: the
    flat floor of the Alazani valley, the ruled lines of vineyards, and beyond them the long wall of the
    Greater Caucasus. Everything depends on the air. A summer afternoon can reduce the mountains to a
    rumour; on a clear morning, or in the hour after rain, the snow peaks stand close enough to count.


    Cross early. Kakheti is best met the way this road delivers it: all at once, and from above.
  tip: >-
    Pull over only where there is a proper layby or a wide shoulder: sight lines on the bends are short
    and the road carries steady traffic in both directions. The best viewpoints are on the Telavi side,
    just below the crest. There is no fuel on the pass and no services to count on at the top; Telavi
    is about 25 km further on. In winter heavy snow can close the road or make chains necessary, and on
    those days the flat S5 through Sagarejo and Bakurtsikhe is the sensible alternative. Bring a warm
    layer in any season, and set off early if you want the mountains clear.
  route: >-
    Leave Tbilisi east on the S5 Kakheti highway. Just past Vaziani, about 26 km out, turn off onto the
    Sh38 towards Telavi. The road follows the Iori through Ujarma, passes the fortress and then climbs
    in continuous bends to the crest: 69 km from central Tbilisi, about an hour and a half, asphalt all
    the way. Fill up before you leave the S5, as there is nothing on the mountain. An economy car is entirely
    adequate, with winter tyres from December to March. Beyond the pass it is about 25 km down to Telavi,
    which makes this the natural approach to Ikalto, Alaverdi and Gremi.
ru:
  name: Гомборский перевал
  short: >-
    Перевал высотой 1620 метров на дороге Sh38, где заканчивается Внешняя Кахетия и дорога спускается
    к долине Алазани и стене Кавказа.
  body: >-
    **Гомбори — не столько вершина, сколько дверь: за спиной остаются Внешняя Кахетия и Иори, впереди
    — долина Алазани и её виноградники.**


    Цив-Гомборский хребет тянется на 107 километров через Кахетию и поднимается до 1991 метра на горе
    Циви. Это водораздел между Иори и Алазани, и он всегда делил провинцию на две части: Гаре, или Внешняя,
    Кахетия — со стороны Иори, Шида, или Внутренняя, Кахетия — вдоль Алазани. Дорога Sh38 из Вазиани пересекает
    его здесь на высоте 1620 метров, на границе Сагареджойского и Телавского муниципалитетов. Это короткий
    путь в Телави; длинный обходит через Сагареджо и Бакурцихе.


    Подъём начинается у самой Иори. За селом Уджарма дорога проходит мимо крепости Уджарма на холме над
    рекой, резиденции царя Вахтанга Горгасали в V веке. Затем начинаются повороты, один за другим, лес
    обступает, а воздух становится разреженнее и прохладнее. На гребне деревья уступают открытому лугу
    на мягких неогеновых породах. На высоте 1620 метров здесь обычно на несколько градусов холоднее, чем
    в долинах по обе стороны, что в августе кажется настоящим подарком.


    Вид, ради которого вы едете, открывается не на самом верху, а на первых поворотах спуска к Телави:
    ровное дно долины Алазани, ровные ряды виноградников, а за ними — длинная стена Большого Кавказа.
    Всё зависит от воздуха. Летним днём горы едва угадываются в дымке; в ясное утро или в час после дождя
    снежные вершины кажутся достаточно близкими, чтобы их сосчитать.


    Выезжайте на перевал пораньше. Кахетия лучше всего открывается так, как её преподносит эта дорога:
    сразу и сверху.
  tip: >-
    Останавливайтесь только там, где есть оборудованный карман или широкая обочина: обзор на поворотах
    короткий, а движение в обе стороны постоянное. Лучшие точки для вида — на телавской стороне, чуть
    ниже гребня. На перевале нет заправки, и рассчитывать на какой-либо сервис наверху не стоит; до Телави
    ещё около 25 км. Зимой обильный снег может закрыть дорогу или потребовать цепей, и в такие дни разумной
    альтернативой становится равнинная S5 через Сагареджо и Бакурцихе. Возьмите тёплую одежду в любое
    время года и выезжайте рано, если хотите увидеть горы без облаков.
  route: >-
    Выезжайте из Тбилиси на восток по Кахетинскому шоссе S5. Сразу за Вазиани, примерно через 26 км, сверните
    на Sh38 в сторону Телави. Дорога следует вдоль Иори через Уджарму, проходит мимо крепости и затем
    непрерывными поворотами поднимается к гребню: 69 км от центра Тбилиси, около полутора часов, дорога
    асфальтирована на всём протяжении. Заправьтесь до выезда с S5, поскольку на горе ничего нет. Машины
    эконом-класса вполне достаточно, с зимней резиной с декабря по март. За перевалом до Телави около
    25 км под уклон, поэтому эта дорога — естественный подъезд к Икалто, Алаверди и Греми.
fa:
  name: گذرگاه گومبوری
  short: >-
    گذرگاهی به بلندای ۱۶۲۰ متر بر راهِ Sh38 که کاختیِ بیرونی در آن به پایان می‌رسد و راه به‌سوی درهٔ آلازانی
    و دیوارِ قفقاز سرازیر می‌شود.
  body: >-
    **گومبوری کمتر قله‌ای است تا دری: پشتِ سرتان کاختیِ بیرونی و ایوری‌اند، پیشِ رویتان درهٔ آلازانی و
    تاکستان‌هایش.**


    رشته‌کوهِ تسیو-گومبوری ۱۰۷ کیلومتر از میانِ کاختی می‌گذرد و در کوهِ تسیوی به ۱۹۹۱ متر می‌رسد. این
    خطِ آب‌پخشانِ میانِ ایوری و آلازانی است، و همیشه استان را به دو بخش کرده: کاختیِ گاره، یا بیرونی،
    در کنارهٔ ایوری، و کاختیِ شیدا، یا درونی، در امتدادِ آلازانی. راه Sh38 از وازیانی این‌جا در بلندای
    ۱۶۲۰ متر از آن می‌گذرد، بر خطِ میانِ شهرستان‌های ساگارجو و تلاوی. این راهِ کوتاه به تلاوی است؛ راهِ
    بلند از میانِ ساگارجو و باکورتسیخه دور می‌زند.


    بالارَوی از کنارِ ایوری آغاز می‌شود. آن‌سوترِ روستای اوجارما، راه از کنارِ دژِ اوجارما بر تپه‌اش بالای
    رودخانه می‌گذرد، اقامتگاهِ شاه واختانگ گورگاسالی در سدهٔ پنجم. سپس پیچ‌ها آغاز می‌شوند، یکی در دلِ
    دیگری، جنگل نزدیک می‌شود، و هوا رقیق‌تر و خنک‌تر می‌گردد. بر تیغه، درختان جای خود را به چمنزارِ باز
    بر سنگِ نرمِ نئوژن می‌دهند. در بلندای ۱۶۲۰ متر معمولاً چند درجه از دره‌های دو سو خنک‌تر است، که در
    ماهِ اوت چون هدیه‌ای احساس می‌شود.


    چشم‌اندازی که برایش آمده‌اید نه در بالا، بلکه در نخستین پیچ‌های سرازیریِ به‌سوی تلاوی گشوده می‌شود:
    کفِ هموارِ درهٔ آلازانی، خطوطِ خط‌کش‌گونهٔ تاکستان‌ها، و آن‌سوترشان، دیوارِ درازِ قفقازِ بزرگ. همه‌چیز
    به هوا وابسته است. یک بعدازظهرِ تابستانی می‌تواند کوه‌ها را در مه به سایه‌ای کم‌رنگ بدل کند؛ در بامدادی
    صاف، یا در ساعتی پس از باران، قله‌های برفی چنان نزدیک می‌نمایند که گویی می‌توانید بشماریدشان.


    زود عبور کنید. کاختی بهترین چهرهٔ خود را همان‌گونه نشان می‌دهد که این راه پیش چشمتان می‌گذارد: یک‌باره،
    و از بالا.
  tip: >-
    تنها در توقفگاهی درست یا شانهٔ پهنِ جاده توقف کنید: خطِ دیدِ پیچ‌ها کوتاه است و راه در هر دو سو رفت‌وآمدِ
    پیوسته دارد. بهترین نقاطِ دید در سویِ تلاوی، اندکی زیرِ تیغه‌اند. بر گذرگاه سوختی نیست و خدماتی که
    بتوان بر آن حساب کرد در بالا وجود ندارد؛ تلاوی حدود ۲۵ کیلومتر آن‌سوتر است. زمستان، برفِ سنگین می‌تواند
    راه را ببندد یا زنجیرِ چرخ را لازم کند، و در چنین روزهایی راهِ هموارِ S5 از میانِ ساگارجو و باکورتسیخه
    گزینهٔ عاقلانه‌تری است. در هر فصلی پوششی گرم بیاورید، و اگر می‌خواهید کوه‌ها را صاف ببینید، زود راه
    بیفتید.
  route: >-
    از تفلیس به خاور بر بزرگراهِ کاختی S5 حرکت کنید. اندکی پس از وازیانی، حدود ۲۶ کیلومتر، به Sh38 به‌سوی
    تلاوی بپیچید. راه در کنارِ ایوری از میانِ اوجارما می‌گذرد، از کنارِ دژ می‌رود و سپس با پیچ‌هایی پیوسته
    به تیغه بالا می‌رود: ۶۹ کیلومتر از مرکز تفلیس، حدود یک ساعت و نیم، تمامِ راه آسفالته. پیش از خروج
    از S5 باک را پر کنید، چرا که بر کوه هیچ امکاناتی نیست. خودرویی معمولی به‌کلی بسنده است، با تایرِ زمستانی
    از دسامبر تا مارس. آن‌سوی گذرگاه حدود ۲۵ کیلومتر سرازیری تا تلاوی باقی می‌ماند، و از همین رو این جاده
    راهِ طبیعیِ رسیدن به ایکالتو، آلاوردی و گِرمی است.
he:
  name: מעבר גומבורי
  short: מעבר בגובה 1,620 מטרים בכביש Sh38, שבו קאחתי החיצונית מגיעה לסיומה והדרך יורדת לעמק האלאזני ולחומת
    הקווקז.
  body: >-
    **גומבורי הוא פחות פסגה ויותר דלת: מאחוריכם קאחתי החיצונית והאיורי, לפניכם עמק האלאזני וכרמיו.**


    רכס ציו-גומבורי משתרע על 107 קילומטרים בקאחתי ומתנשא ל-1,991 מטרים בהר ציווי. זהו קו פרשת המים בין
    האיורי לאלאזני, והוא חילק תמיד את הפרובינציה לשניים: קאחתי הגארה, החיצונית, בצד האיורי, וקאחתי השידה,
    הפנימית, לאורך האלאזני. כביש Sh38 מוואזיאני חוצה אותו כאן בגובה 1,620 מטרים, על הגבול בין המוניציפליות
    של סאגארג'ו וטלאווי. זו הדרך הקצרה לטלאווי; הדרך הארוכה מקיפה דרך סאגארג'ו ובקורציחה.


    העלייה מתחילה לצד האיורי. מעבר לכפר אוג'רמה הדרך עוברת לצד מצודת אוג'רמה על גבעתה מעל הנהר, מקום מושבו
    של המלך ווחטנג גורגסאלי במאה החמישית. אז מתחילים העיקולים, אחד מקופל בתוך השני, היער מתהדק סביב הדרך,
    והאוויר מתרזה ומתקרר. בפסגה מפנים העצים את מקומם לאחו פתוח על סלע נאוגני רך. בגובה 1,620 מטרים בדרך
    כלל קריר כמה מעלות יותר מבעמקים שמשני הצדדים, ובאוגוסט זה מרגיש כמו מתנה.


    הנוף שלמענו הגעתם נפתח לא בפסגה אלא בעיקולים הראשונים של הירידה לטלאווי: קרקעית שטוחה של עמק האלאזני,
    שורות ישרות של כרמים, ומעבר להם, חומתו הארוכה של הקווקז הגדול. הכל תלוי באוויר. אובך של אחר צהריים
    קיצי יכול להעלים את ההרים כמעט לגמרי; בבוקר צלול, או בשעה שאחרי גשם, פסגות השלג עומדות קרובות מספיק
    כדי לספור אותן.


    חצו מוקדם. את קאחתי כדאי לפגוש כפי שהדרך הזאת מגישה אותה: בבת אחת, ומלמעלה.
  tip: >-
    עצרו רק במפרץ חנייה מסודר או בשוליים רחבים: קווי הראייה בעיקולים קצרים, ובכביש יש תנועה ערה בשני הכיוונים.
    נקודות התצפית הטובות ביותר הן בצד טלאווי, מעט מתחת לפסגה. אין דלק במעבר ואין שירותים שאפשר לסמוך עליהם
    למעלה; טלאווי במרחק כ-25 ק"מ נוספים. בחורף שלג כבד יכול לסגור את הדרך או לדרוש שרשראות, ובימים כאלה
    הדרך השטוחה S5 דרך סאגארג'ו ובקורציחה היא החלופה הנבונה. הביאו שכבה חמה בכל עונה, וצאו מוקדם אם אתם
    רוצים לראות את ההרים צלולים.
  route: >-
    צאו מטביליסי מזרחה בכביש קאחתי S5. מעט אחרי וואזיאני, כ-26 ק"מ, פנו לכביש Sh38 לכיוון טלאווי. הדרך
    עוקבת אחרי האיורי דרך אוג'רמה, עוברת את המצודה ואז עולה בעיקולים רצופים לפסגה: 69 ק"מ ממרכז טביליסי,
    כשעה וחצי, סלולה לכל אורכה. תדלקו לפני שתעזבו את S5, שכן על ההר אין כלום. רכב רגיל מספיק בהחלט, עם
    צמיגי חורף מדצמבר עד מרץ. אחרי המעבר נותרים כ-25 ק"מ במורד לטלאווי, ולכן זו הדרך הטבעית אל איקלטו,
    אלוורדי וגרמי.
ar:
  name: ممر غومبوري
  short: ممر بارتفاع 1620 مترًا على طريق Sh38 حيث تنتهي كاختي الخارجية وينحدر الطريق نحو وادي ألازاني
    وسور القوقاز.
  body: >-
    **غومبوري ليس قمة بقدر ما هو باب: خلفك كاختي الخارجية ونهر إيوري، وأمامك وادي ألازاني وكرومه.**


    تمتد سلسلة تسيفي-غومبوري 107 كيلومترات عبر كاختي وترتفع إلى 1991 مترًا عند جبل تسيفي. إنها خط تقسيم
    المياه بين إيوري وألازاني، وقد قسمت المقاطعة دائمًا إلى نصفين: كاختي غاره، أو الخارجية، على جانب إيوري،
    وكاختي شيدا، أو الداخلية، على طول ألازاني. يعبرها طريق Sh38 من فازياني هنا عند ارتفاع 1620 مترًا،
    على الخط الفاصل بين بلديتي ساغاريجو وتيلافي. هذا الطريق القصير إلى تيلافي؛ والطريق الطويل يلتف عبر
    ساغاريجو وباكورتسيخه.


    يبدأ التسلق قرب إيوري. بعد قرية أوجارما، يمر الطريق بجانب قلعة أوجارما على تلتها فوق النهر، وكانت
    مقر الملك واختانغ غورغاسالي في القرن الخامس. ثم تبدأ المنحنيات، واحدًا تلو الآخر، وتضيق الغابة، ويصبح
    الهواء أرق وأبرد. عند القمة تتنازل الأشجار عن مكانها لمرج مفتوح على صخر نيوجيني لين. عند 1620 مترًا
    يكون الجو عادة أبرد بعدة درجات من الأودية على الجانبين، ما يبدو في أغسطس كهبة.


    المشهد الذي أتيت من أجله لا ينفتح في القمة بل في المنحنيات الأولى للنزول نحو تيلافي: قاع وادي ألازاني
    المستوي، خطوط الكروم المرسومة بالمسطرة، وخلفها، سور القوقاز الأكبر الطويل. كل شيء يتوقف على الهواء.
    قد تُخفي غلالة بعد ظهر صيفي الجبال حتى لا يكاد يبين منها شيء؛ وفي صباح صاف، أو في الساعة التالية للمطر،
    تقف قمم الثلج قريبة بما يكفي لتعدّها.


    اعبر باكرًا. تتكشف كاختي على أفضل وجه بالطريقة التي يقدّمها هذا الطريق: كلها دفعة واحدة، ومن الأعلى.
  tip: >-
    لا تتوقف إلا في موقف جانبي مهيّأ أو على كتف طريق عريض: مدى الرؤية عند المنعطفات قصير، وحركة السير
    متواصلة في الاتجاهين. أفضل نقاط المشاهدة على جانب تيلافي، أسفل القمة بقليل. لا يوجد وقود على الممر
    ولا خدمات يمكن الاعتماد عليها في القمة؛ تيلافي على نحو 25 كم أخرى. في الشتاء قد تغلق الثلوج الكثيفة
    الطريق أو تستوجب السلاسل، وفي تلك الأيام يكون طريق S5 المستوي عبر ساغاريجو وباكورتسيخه البديل المعقول.
    احمل طبقة دافئة في أي فصل، وانطلق باكرًا إن أردت رؤية الجبال صافية.
  route: >-
    اخرج من تبليسي شرقًا على طريق كاختي السريع S5. بعد فازياني بقليل، على نحو 26 كم، انحرف إلى Sh38 نحو
    تيلافي. يتبع الطريق نهر إيوري عبر أوجارما، ويمر بجانب القلعة، ثم يصعد بمنحنيات متواصلة إلى القمة:
    69 كم من وسط تبليسي، نحو ساعة ونصف، معبّد بالكامل. عبّئ الوقود قبل مغادرة S5، فلا يوجد شيء على الجبل.
    تكفي سيارة اقتصادية تمامًا، مع إطارات شتوية من ديسمبر إلى مارس. بعد الممر تبقى نحو 25 كم نزولًا إلى
    تيلافي، ما يجعل هذا الطريق المدخل الطبيعي إلى إيكالتو وألافردي وغريمي.
