ka:
  name: გომბორის უღელტეხილი
  short: >-
    1620 მეტრზე გამავალი ტყიანი უღელტეხილი, საიდანაც კახეთის ვაკე და კავკასიონი ერთბაშად იშლება.
  body: >-
    **გომბორის უღელტეხილი ის წერტილია, სადაც კახეთი უცებ იწყება.** თბილისიდან თელავამდე ორი გზაა: გრძელი, ბარით, საგარეჯოსა და ბაკურციხის გავლით, და მოკლე — ცივ-გომბორის ქედზე გადასული. მეორე ერთი საათით ხნელია და ბევრად უფრო საინტერესო.


    ასვლა უჯარმის შემდეგ იწყება. გზა მდინარის ხეობას ტოვებს და მუხნარში შედის, შემდეგ წიფლის ტყეში ადის; ჰაერი შესამჩნევად გრილდება. თავად უღელტეხილი 1620 მეტრზეა და თითქმის მთლიანად ტყიანია, ამიტომ ხედი მწვერვალიდან კი არა, ჩრდილოეთ ფერდობის პირველი მოსახვევებიდან იშლება: ალაზნის ვაკე ქვემოთ, გაშლილი ვენახები, და მის იქით კავკასიონის მთავარი ქედი.


    ეს ხედი გამჭვირვალე ჰაერზეა დამოკიდებული. ზაფხულის შუადღეს დაბლობი ნისლისფერია და მთები თითქმის არ ჩანს. ოქტომბრის დილით ან წვიმის შემდეგ კი ხედი მაღალ თოვლიან მწვერვალებამდე გადის — ეს არის მიზეზი, რომ ადრე გამოხვიდე.


    გზა რამდენიმე წლის წინ სრულად გადააკეთეს: ფართო ასფალტი, მონიშნული ზოლები, ბარიერები. ტექნიკურად ის ახლა ერთ-ერთი საუკეთესო მთის გზაა საქართველოში, თუმცა სერპანტინი გრძელია და მოძრავი სატვირთოები ხშირად ანელებენ. გომბორის სოფელთან ყოფილი სამხედრო ბაზაა, უღელტეხილის ორივე მხარეს კი დგანან თაფლის, მწნილისა და ჩურჩხელის მოვაჭრეები.


    ცალკე გაჩერების ღირსი ადგილია, თუნდაც ათი წუთით: ქვევით ტემპერატურა შვიდ-რვა გრადუსით მაღალია, ხოლო აქ, წიფლის ჩრდილში, ზაფხულშიც გრილა.
  tip: >-
    გაჩერება მხოლოდ მოწყობილ ჯიბეებში ღირს — სერპანტინზე ხედვის მანძილი მოკლეა. ხედის საუკეთესო წერტილი ჩრდილოეთ მხარეს, დაღმართის დასაწყისშია. ზამთარში უღელტეხილი დიდთოვლობისას იკეტება ან მხოლოდ ჯაჭვებით გაივლის; ასეთ დღეს ბარის გზა აჯობებს. ტუალეტი მხოლოდ სოფელ გომბორის კაფეებშია. ველოსიპედისტები და ნელი სატვირთოები ხშირია, გამოსწრება ბრმა მოსახვევში საშიშია. მთაში ამინდი მალე იცვლება, ქურთუკი თან იქონიე.
  route: >-
    თბილისიდან გამოდი ვაზისუბნის მიმართულებით და გაუყევი კახეთის ძველ გზას სართიჭალაზე; უჯარმის შემდეგ დაიწყება ასვლა. უღელტეხილამდე 62 კმ და დაახლოებით საათი და ოცი წუთი. მთელი მარშრუტი ასფალტია, კარგ მდგომარეობაში, თუმცა ბოლო ოცი კილომეტრი უწყვეტი მოსახვევია. საწვავი სართიჭალასა და საგარეჯოში აიღე — უღელტეხილზე გასამართი არ არის. ეკონომ-კლასის მანქანა სავსებით საკმარისია, ზამთარში ზამთრის საბურავებით.
en:
  name: Gombori Pass
  short: >-
    A forested pass at 1,620 m where the Alazani plain and the Greater Caucasus open up in a single turn.
  body: >-
    **Gombori Pass is the point where Kakheti suddenly begins.** There are two roads from Tbilisi to Telavi: the long one across the plain through Sagarejo and Bakurtsikhe, and the short one over the Tsiv-Gombori range. The second saves about an hour and is far more interesting to drive.


    The climb starts after Ujarma. The road leaves the Iori valley, works up through oak scrub into beech forest, and the air cools noticeably as you gain height. The pass itself, at 1,620 m, is almost entirely wooded, so the view is not from the summit but from the first bends of the northern descent: the Alazani plain below, vineyards in long straight blocks, and behind them the main ridge of the Caucasus.


    That view depends entirely on the air. On a summer afternoon the plain is hazy and the mountains barely register. On an October morning, or an hour after rain has cleared, the sight line runs all the way to snow. This is the argument for setting off early.


    The road was rebuilt a few years ago — wide asphalt, painted lines, crash barriers along the exposed sections. Technically it is now one of the better mountain roads in Georgia, though the descent is long and slow lorries hold up traffic. Near Gombori village there is a former military base, and on both sides of the summit vendors set up tables of honey, pickles and churchkhela.


    It is worth stopping for ten minutes in its own right. The temperature is often seven or eight degrees lower than in the valley, and in the shade of the beeches it stays cool even in August.


    The pass is also a real botanical boundary: dry oak and scrub on the Tbilisi side, tall beech and hornbeam on the Kakhetian one, and the change happens within a couple of kilometres of the summit.
  tip: >-
    Stop only in the marked laybys; sight lines on the bends are short and the road carries steady traffic. The best viewpoint is on the northern side, at the top of the descent. In winter the pass closes during heavy snowfall or is passable only with chains, and on those days the plain route through Bakurtsikhe is the sensible choice. Toilets exist only at the cafes in Gombori village. Cyclists and slow lorries are common, so overtaking on blind curves is a poor idea. Bring a jacket; weather here changes fast.
  route: >-
    Leave Tbilisi towards Vaziani and follow the old Kakheti road through Sartichala; the climb begins beyond Ujarma. The pass is 62 km out, about an hour and twenty minutes. The whole route is asphalt in good condition, though the last twenty kilometres are continuous bends. Fill up in Sartichala or Sagarejo, as there is no fuel station on the pass itself. An economy car is entirely sufficient, with winter tyres between December and March. Allow extra time behind lorries on the climb.
ru:
  name: Гомборский перевал
  short: >-
    Лесистый перевал на высоте 1620 м, где Алазанская долина и Кавказский хребет открываются в одном повороте.
  body: >-
    **Гомборский перевал — точка, где Кахетия начинается сразу.** Из Тбилиси в Телави ведут две дороги: длинная по равнине через Сагареджо и Бакурцихе и короткая через хребет Цив-Гомбори. Вторая экономит около часа и куда интереснее для водителя.


    Подъём начинается после Уджармы. Дорога уходит из долины Иори, поднимается через дубовое мелколесье в буковый лес, и воздух заметно свежеет с высотой. Сам перевал на 1620 м почти сплошь в лесу, поэтому вид открывается не с седловины, а на первых виражах северного спуска: Алазанская долина внизу, виноградники длинными ровными кварталами и за ними главный хребет Кавказа.


    Этот вид полностью зависит от воздуха. Летним днём равнина в дымке, и горы едва угадываются. Октябрьским утром или через час после того, как прошёл дождь, взгляд достаёт до снежных вершин. Это и есть довод в пользу раннего выезда.


    Дорогу несколько лет назад перестроили: широкий асфальт, разметка, отбойники на открытых участках. Технически это теперь одна из лучших горных дорог Грузии, хотя спуск длинный, а медленные грузовики собирают за собой хвост. У села Гомбори стоит бывшая военная база, а по обе стороны седловины торгуют мёдом, соленьями и чурчхелой.


    Сюда стоит заехать и просто так, минут на десять. Температура здесь обычно на семь-восемь градусов ниже, чем в долине, а в тени буков прохладно даже в августе.
  tip: >-
    Останавливайтесь только в оборудованных карманах: обзор на виражах короткий, а движение постоянное. Лучшая смотровая точка — с северной стороны, в начале спуска. Зимой при сильном снегопаде перевал закрывают или пропускают только с цепями; в такие дни разумнее ехать равнинной дорогой через Бакурцихе. Туалеты есть лишь в кафе села Гомбори. Часто встречаются велосипедисты и тихоходные грузовики, обгон в слепом повороте здесь плохая идея. Возьмите куртку, погода меняется быстро.
  route: >-
    Выезжайте из Тбилиси в сторону Вазиани и держитесь старой кахетинской дороги через Сартичалу; подъём начинается за Уджармой. До перевала 62 км, примерно час двадцать. Весь маршрут асфальтовый и в хорошем состоянии, но последние двадцать километров — сплошные повороты. Заправляйтесь в Сартичале или Сагареджо: на самом перевале АЗС нет. Машины эконом-класса вполне достаточно, зимой — на зимней резине. Заложите запас времени на подъём за грузовиками.
fa:
  name: گردنهٔ گومبوری
  short: >-
    گردنه‌ای جنگلی در ارتفاع 1620 متر که دشت آلازانی و رشته‌کوه بزرگ قفقاز را در یک پیچ پیش رو می‌گشاید.
  body: >-
    **گردنهٔ گومبوری نقطه‌ای است که کاختی ناگهان از آنجا آغاز می‌شود.** از تفلیس تا تلاوی دو راه هست: راه دراز دشت از ساگارجو و باکورتسیخه، و راه کوتاه از فراز رشتهٔ تسیو-گومبوری. دومی حدود یک ساعت کوتاه‌تر است و رانندگی در آن به‌مراتب دلپذیرتر.


    بالا رفتن پس از اوجارما آغاز می‌شود. جاده درّهٔ ایوری را رها می‌کند، از میان بوته‌زار بلوط به جنگل راش می‌رسد و هوا با افزایش ارتفاع محسوس خنک می‌شود. خود گردنه در 1620 متری تقریباً یکسره پوشیده از درخت است، پس منظره نه از قلهٔ گردنه بلکه از نخستین پیچ‌های سرازیری شمالی باز می‌شود: دشت آلازانی در پایین، تاکستان‌ها در قطعه‌های دراز و منظم، و پشت آنها ستیغ اصلی قفقاز.


    این منظره یکسره به شفافیت هوا وابسته است. بعدازظهر تابستان دشت غبارآلود است و کوه‌ها به‌زحمت دیده می‌شوند. اما صبح مهرماه یا یک ساعت پس از آنکه باران بند بیاید، خط دید تا برف‌ها می‌رسد. همین دلیل زود راه افتادن است.


    جاده چند سال پیش بازسازی شد: آسفالت پهن، خط‌کشی و حفاظ در بخش‌های پرشیب. از نظر فنی امروز یکی از بهترین جاده‌های کوهستانی گرجستان است، هرچند سرازیری طولانی است و کامیون‌های کند صف می‌سازند. نزدیک روستای گومبوری پادگانی متروک هست و در دو سوی گردنه دستفروشان عسل و ترشی و چورچخلا بساط می‌کنند.


    ده دقیقه توقف اینجا به‌خودی‌خود می‌ارزد. دما معمولاً هفت هشت درجه پایین‌تر از درّه است و زیر سایهٔ راش‌ها حتی در مرداد خنک می‌ماند.
  tip: >-
    فقط در جیب‌های مشخص‌شدهٔ کنار جاده توقف کنید؛ دید در پیچ‌ها کوتاه است و ترافیک پیوسته. بهترین نقطهٔ دید در سمت شمالی و ابتدای سرازیری است. در زمستان و هنگام بارش سنگین، گردنه بسته می‌شود یا فقط با زنجیر چرخ قابل عبور است؛ در چنین روزهایی راه دشت از باکورتسیخه منطقی‌تر است. سرویس بهداشتی تنها در کافه‌های روستای گومبوری هست. دوچرخه‌سوار و کامیون کند فراوان است و سبقت در پیچ کور فکر بدی است. کاپشنی همراه ببرید؛ هوا زود عوض می‌شود.
  route: >-
    از تفلیس به سمت وازیانی خارج شوید و جادهٔ قدیم کاختی را از سارتیچالا دنبال کنید؛ صعود پس از اوجارما آغاز می‌شود. تا گردنه 62 کیلومتر و حدود یک ساعت و بیست دقیقه راه است. تمام مسیر آسفالت و در وضعیت خوبی است، اما بیست کیلومتر پایانی پیچ پشت پیچ است. باک را در سارتیچالا یا ساگارجو پر کنید، چون روی خود گردنه پمپ بنزینی نیست. خودروی اقتصادی کاملاً کافی است و در زمستان با لاستیک مناسب. برای گیر افتادن پشت کامیون‌ها وقت اضافه در نظر بگیرید.
he:
  name: מעבר גומבורי
  short: >-
    מעבר הרים מיוער בגובה 1,620 מ' שבו מישור האלאזני ורכס הקווקז נפתחים בפנייה אחת.
  body: >-
    **מעבר גומבורי הוא הנקודה שבה קחתי מתחילה בבת אחת.** מטביליסי לטלאווי יש שתי דרכים: הארוכה במישור דרך סגרג'ו ובקורצחה, והקצרה מעל רכס ציב-גומבורי. השנייה חוסכת כשעה והנהיגה בה מעניינת בהרבה.


    העלייה מתחילה אחרי אוג'רמה. הכביש עוזב את עמק היורי, מטפס דרך חורש אלון אל יער אשור, והאוויר מתקרר במידה מורגשת ככל שעולים. המעבר עצמו, בגובה 1,620 מ', מיוער כמעט לגמרי, ולכן הנוף אינו נפתח בפסגה אלא בפניות הראשונות של הירידה הצפונית: מישור האלאזני מתחת, כרמים בגושים ארוכים וישרים, ומאחוריהם הרכס הראשי של הקווקז.


    הנוף הזה תלוי כולו באוויר. בצהרי קיץ המישור אפוף אובך וההרים בקושי נרשמים. בבוקר של אוקטובר, או שעה אחרי שגשם עבר, קו הראייה מגיע עד השלג. זו הסיבה לצאת מוקדם.


    הכביש נבנה מחדש לפני כמה שנים: אספלט רחב, סימון וגדרות בטיחות במקטעים החשופים. מבחינה טכנית זה היום אחד הכבישים ההרריים הטובים בגאורגיה, אם כי הירידה ארוכה ומשאיות איטיות עוצרות את התנועה. ליד הכפר גומבורי ניצב בסיס צבאי נטוש, ומשני עברי הפסגה נפרשים דוכני דבש, חמוצים וצ'ורצ'חלה.


    שווה לעצור כאן לעשר דקות גם בזכות עצמו. הטמפרטורה נמוכה בדרך כלל בשבע או שמונה מעלות מזו שבעמק, ובצל האשורים נשאר קריר גם באוגוסט.
  tip: >-
    עצרו רק במפרצי העצירה המסומנים; שדה הראייה בפניות קצר והתנועה רציפה. נקודת התצפית הטובה ביותר נמצאת בצד הצפוני, בראש הירידה. בחורף המעבר נסגר בשלג כבד או עביר רק עם שרשראות, ובימים כאלה עדיף כביש המישור דרך בקורצחה. שירותים יש רק בבתי הקפה בכפר גומבורי. רוכבי אופניים ומשאיות איטיות שכיחים, ועקיפה בפנייה עיוורת היא רעיון גרוע. קחו מעיל, מזג האוויר משתנה מהר.
  route: >-
    צאו מטביליסי לכיוון וזיאני והמשיכו בכביש קחתי הישן דרך סרטיצ'לה; העלייה מתחילה אחרי אוג'רמה. עד המעבר 62 ק״מ, כשעה ועשרים. כל המסלול סלול ובמצב טוב, אך עשרים הקילומטרים האחרונים הם פניות רצופות. תדלקו בסרטיצ'לה או בסגרג'ו, שכן במעבר עצמו אין תחנת דלק. רכב חסכוני מספיק בהחלט, ובחורף עם צמיגי חורף. תכננו זמן נוסף לנסיעה מאחורי משאיות בעלייה.
ar:
  name: ممر غومبوري
  short: >-
    ممر جبلي مشجّر على ارتفاع 1620 م ينفتح عنده سهل ألازاني وسلسلة القوقاز الكبرى في منعطف واحد.
  body: >-
    **ممر غومبوري هو النقطة التي تبدأ عندها كاخيتي دفعة واحدة.** من تبليسي إلى تيلافي طريقان: الطويل عبر السهل من ساغاريجو وباكورتسيخه، والقصير فوق سلسلة تسيف-غومبوري. والثاني يوفر نحو ساعة وقيادته أمتع بكثير.


    يبدأ الصعود بعد أوجارما. يترك الطريق وادي إيوري ويرتقي من أحراش البلوط إلى غابة الزان، ويبرد الهواء بوضوح كلما ارتفعت. والممر نفسه على 1620 م مغطى بالشجر كله تقريباً، ولذلك لا ينفتح المشهد من القمة بل من أولى منعطفات النزول الشمالي: سهل ألازاني في الأسفل، والكروم في مساحات طويلة مستقيمة، ووراءها الحيد الرئيسي للقوقاز.


    ويتوقف هذا المشهد كلياً على صفاء الهواء. في ظهيرة صيفية يغرق السهل في الضباب ولا تكاد الجبال تُرى. أما في صباح تشريني، أو بعد ساعة من انقشاع المطر، فيمتد خط النظر إلى الثلج. وهذا هو مبرر الانطلاق مبكراً.


    أُعيد بناء الطريق قبل سنوات قليلة: إسفلت عريض وخطوط واضحة وحواجز في المقاطع المكشوفة. وهو تقنياً من أفضل الطرق الجبلية في جورجيا اليوم، وإن كان النزول طويلاً وشاحنات بطيئة تعطل السير. وقرب قرية غومبوري قاعدة عسكرية سابقة، وعلى جانبي القمة تنتشر موائد العسل والمخللات والتشورتشخيلا.


    والتوقف هنا عشر دقائق يستحق بذاته. فالحرارة أدنى عادة بسبع أو ثماني درجات من الوادي، وتبقى في ظل أشجار الزان لطيفة حتى في آب.
  tip: >-
    توقف في جيوب الوقوف المخصصة فقط؛ فمدى الرؤية في المنعطفات قصير والحركة متصلة. وأفضل نقطة إطلالة في الجانب الشمالي عند رأس النزول. وفي الشتاء يُغلق الممر عند تساقط الثلج الغزير أو لا يُعبر إلا بالسلاسل، وفي تلك الأيام يكون طريق السهل عبر باكورتسيخه هو الخيار المعقول. ودورات المياه في مقاهي قرية غومبوري وحدها. وراكبو الدراجات والشاحنات البطيئة كثيرون، والتجاوز في منعطف أعمى فكرة سيئة. خذ معطفاً، فالطقس هنا يتبدل سريعاً.
  route: >-
    غادر تبليسي نحو فازياني والزم طريق كاخيتي القديم عبر سارتيتشالا؛ ويبدأ الصعود بعد أوجارما. الممر على بعد 62 كم ونحو ساعة وعشرين دقيقة. الطريق كله معبّد وبحالة جيدة، غير أن العشرين كيلومتراً الأخيرة منعطفات متتابعة. زوّد الوقود في سارتيتشالا أو ساغاريجو، إذ لا محطة على الممر نفسه. وسيارة اقتصادية كافية تماماً، مع إطارات شتوية بين كانون الأول وآذار. واحسب وقتاً إضافياً خلف الشاحنات في الصعود.
