ka:
  name: თელავი და ბატონის ციხე
  short: >-
    კახეთის დედაქალაქი ალაზნის ველზე გადმომდგარ ტერასაზე: ერეკლე II-ის სასახლე-ციხე, ცხრაასი წლის ჭადარი
    და ველს მიღმა აღმართული კავკასიონი.
  body: >-
    **ერეკლე II თელავში დაიბადა 1720 წელს და აქვე გარდაიცვალა 1798-ში — და თელავი დღემდე მისი ქალაქია.**


    ქალაქი მასზე ბევრად ძველია. II საუკუნეში პტოლემაიოსი, როგორც ჩანს, მას „ტელედას“ სახელით იცნობდა,
    X საუკუნის არაბი გეოგრაფი ალ-მუკადასი კი თბილისისა და განჯის გვერდით ასახელებს. X–XII საუკუნეებში
    თელავი კახეთის სამეფოს დედაქალაქი იყო, XVII საუკუნეში კვლავ დედაქალაქად იქცა, 1762 წლისთვის კი, თბილისის
    შემდეგ, ქართლ-კახეთის გაერთიანებული სამეფოს მეორე დედაქალაქი გახდა. საქართველოში ეს ერთადერთი ქალაქია,
    სადაც ოთხი ეპოქის ოთხი სიმაგრე დღემდე დგას — IX–X საუკუნეების „ძველი გალავნიდან“ ქორჩიბაშიშვილებისა
    და ვახვახიშვილების ციხე-სახლებამდე.


    მათ შორის ყველაზე დიდებულია **ბატონის ციხე** — XVII–XVIII საუკუნეებში კახეთის მეფეთა რეზიდენცია. ზღუდისა
    და ორი ალაყაფის კარის მიღმა დგას XVII საუკუნის 60-იან წლებში აგებული სამეფო სასახლე, კარის ორი ეკლესია,
    აბანო და ერეკლეს დაარსებული სემინარიის ნაშთი; მეფემ ქალაქს თეატრიც დაუარსა. დღეს კომპლექსი მუზეუმია,
    მის წინ კი ცხენზე ამხედრებული ბრინჯაოს ერეკლე დგას.


    რამდენიმე წუთის სავალზე ცხრაასი წლის აღმოსავლური ჭადარია — დაახლოებით 40 მეტრის სიმაღლისა, ტანის გარშემოწერილობა
    11 მეტრი აქვს. იქიდან ბაზარში გადაინაცვლეთ ჩურჩხელის, თელავური ყველისა და პლასტმასის ბიდონებიდან ჩამოსხმული
    ღვინისთვის და თავი ასწიეთ: ალაზნის ველს მიღმა ქუჩას ბოლოში კავკასიონი კეტავს.


    ქართველები ერეკლეს დღესაც „პატარა კახს“ ეძახიან — მეტსახელით და არა ტიტულით, და სწორედ ამით ჩანს,
    რომ გულით ეძახდნენ.
  tip: >-
    თელავი კახეთის მოსახერხებელი ბაზაა: ბანკები, ბანკომატები, აფთიაქები და ღამის გასათევის ყველაზე ფართო
    არჩევანი რეგიონში. ბატონის ციხის მუზეუმში ბილეთი რამდენიმე ლარი ღირს, ეზოში შესვლა კი, როგორც წესი,
    უფასოა. ერეკლეს ძეგლის ირგვლივ მანქანის დაყენება ჩვეულებრივ ადვილია. ციხეს, ჭადარსა და ბაზარს სამი
    საათი ეყოფა; ბაზარი დილით ყველაზე ცოცხალია — ნაღდი ფული იქონიეთ. ზაფხულის ნაშუადღევი მცხუნვარეა (თელავის
    რეკორდი 41,6 °C-ია), ამიტომ ფეხით დილით ან საღამოს იარეთ. ალავერდი, იყალთო და წინანდალი აქედან ნახევარ
    საათზე ნაკლები სავალია.
  route: >-
    მოკლე გზა გომბორის უღელტეხილზე გადის: თბილისიდან კახეთის გზატკეცილით (ს5) გადით, ვაზიანთან შ38-ზე
    გადაუხვიეთ და უჯარმის გავლით ქედზე გადადით — დაახლოებით 95 კმ და საათი და სამი მეოთხედი. გზა ბოლომდე
    ასფალტიანია, მაგრამ ზემოთ ვიწრო და კლაკნილია და ძლიერი თოვლის შემდეგ შეიძლება დროებით ჩაიკეტოს. გრძელი
    გზა ს5-ით საგარეჯოს გავლით ბაკურციხემდე მიდის, იქიდან კი შ42-ით, გურჯაანის გავლით, ჩრდილოეთით უხვევს:
    დაახლოებით 150 კმ და ორნახევარი საათი, სამაგიეროდ უფრო ვაკე და იოლი. ეკონომკლასის მანქანა ორივესთვის
    საკმარისია. საწვავი თბილისში, საგარეჯოში ან თელავში ჩაასხით.
en:
  name: Telavi and Batonis Tsikhe
  short: >-
    Kakheti's capital on its terrace above the Alazani: Erekle II's palace-fortress, a 900-year-old plane
    tree, and the Caucasus across the valley.
  body: >-
    **Erekle II was born in Telavi in 1720 and died here in 1798, and the town has never quite stopped
    being his.**


    It was old long before him. Ptolemy, in the 2nd century, seems to have known it as Teleda; the Arab
    geographer al-Muqaddasi, in the 10th, named it alongside Tbilisi and Ganja. From the 10th to the 12th
    century Telavi was capital of the kingdom of Kakheti, in the 17th it became capital again, and by
    1762 it was the second capital, after Tbilisi, of the united kingdom of Kartli-Kakheti. It is the
    only Georgian town where four fortifications from four eras still stand, from the 9th–10th-century
    Dzveli Galavani, "the Old Walls", to the castles of the noble Korchibashishvili and Vakhvakhishvili
    families.


    The grandest is **Batonis Tsikhe**, "the Master's Fortress", seat of the Kakhetian kings in the 17th
    and 18th centuries. Behind its wall and two gates stand the royal palace, built in the 1660s, two
    court churches, a bathhouse and the remains of the seminary Erekle founded; he gave the town a theatre,
    too. Today the complex is a museum, and outside it the king rides in bronze.


    A few minutes' walk away, an oriental plane some 900 years old rises about 40 metres, its trunk 11
    metres round. Go on to the market for churchkhela, Telavi cheese and wine poured from plastic canisters,
    then look up: across the Alazani Valley the Caucasus closes the end of the street.


    Georgians still call Erekle Patara Kakhi, "the Little Kakhetian" — a nickname, not a title, which
    is how you know they meant it.
  tip: >-
    Telavi is the practical base for Kakheti: banks, ATMs, pharmacies and the widest choice of beds in
    the region. The Batonis Tsikhe museum charges a ticket of a few lari; walking into the courtyard is
    usually free. Parking is generally easy around the Erekle statue. Three hours covers the fortress,
    the plane tree and the market, which is liveliest in the morning — bring cash. Summer afternoons can
    be fierce (the town's record is 41.6 °C), so walk early or late. Alaverdi, Ikalto and Tsinandali all
    lie within half an hour's drive.
  route: >-
    The short way is over the Gombori Pass: leave Tbilisi on the S5 Kakheti highway, branch onto the Sh38
    near Vaziani and follow it past Ujarma and over the range — about 95 km and 1 h 45 min. It is asphalt
    throughout, but narrow and winding near the top, and it can close for a while after heavy snow. The
    long way stays on the S5 through Sagarejo to Bakurtsikhe, then turns north on the Sh42 through Gurjaani:
    about 150 km and two and a half hours, but flatter and easier. An economy car handles either. Fill
    up in Tbilisi, Sagarejo or Telavi.
ru:
  name: Телави и Батонис-Цихе
  short: >-
    Столица Кахетии на террасе над Алазани: дворец-крепость Ираклия II, платан возрастом 900 лет и Кавказ
    по ту сторону долины.
  body: >-
    **Ираклий II родился в Телави в 1720 году и умер здесь же в 1798-м, и город так и не перестал быть
    его городом.**


    Город был древним задолго до него. Птолемей во II веке, судя по всему, знал его как Теледу; арабский
    географ аль-Мукаддаси в X веке называл его рядом с Тбилиси и Гянджой. С X по XII век Телави был столицей
    Кахетинского царства, в XVII веке снова стал столицей, а к 1762 году — второй, после Тбилиси, столицей
    объединённого царства Картли-Кахетии. Это единственный грузинский город, где сохранились укрепления
    четырёх эпох — от Дзвели Галавани, «Старых стен», IX–X веков, до замков княжеских родов Корчибашишвили
    и Вахвахишвили.


    Самое величественное из них — **Батонис-Цихе**, «Крепость господина», резиденция кахетинских царей
    в XVII–XVIII веках. За её стеной и двумя воротами стоят царский дворец, построенный в 1660-х годах,
    две придворные церкви, баня и остатки семинарии, основанной Ираклием; он же подарил городу театр.
    Сегодня комплекс — музей, а перед ним восседает на бронзовом коне сам царь.


    В нескольких минутах ходьбы растёт восточный платан возрастом около 900 лет, высотой около 40 метров,
    с обхватом ствола 11 метров. Дойдите до рынка за чурчхелой, телавским сыром и вином, разлитым из пластиковых
    канистр, а потом посмотрите вверх: за долиной Алазани улицу замыкает Кавказ.


    Грузины до сих пор называют Ираклия Патара Кахи, «маленький кахетинец», — прозвище, а не титул, и
    именно поэтому ясно, что оно ласковое.
  tip: >-
    Телави — практичная база для Кахетии: банки, банкоматы, аптеки и самый широкий выбор жилья в регионе.
    Билет в музей Батонис-Цихе стоит несколько лари; войти во двор обычно можно бесплатно. Парковка у
    памятника Ираклию, как правило, без проблем. Трёх часов хватит на крепость, платан и рынок, который
    живее всего по утрам — берите наличные. Летом после полудня бывает изнуряюще жарко (рекорд города
    — 41,6 °C), так что гуляйте рано утром или под вечер. Алаверди, Икалто и Цинандали — все в получасе
    езды.
  route: >-
    Короткий путь — через Гомборский перевал: выезжайте из Тбилиси по Кахетинскому шоссе S5, сверните
    на Sh38 у Вазиани и следуйте через Уджарму и перевал — около 95 км и 1 ч 45 мин. Дорога асфальтирована
    на всём протяжении, но ближе к перевалу узкая и извилистая, а после сильного снегопада может на время
    закрываться. Длинный путь идёт по S5 через Сагареджо до Бакурцихе, затем поворачивает на север по
    Sh42 через Гурджаани: около 150 км и два с половиной часа, но ровнее и проще. Машина эконом-класса
    справится с любым вариантом. Заправляйтесь в Тбилиси, Сагареджо или Телави.
fa:
  name: تلاوی و باتونیس تسیخه
  short: 'پایتخت کاختی بر بلندایی بالای رود آلازانی: کاخ-دژِ ارکله دوم، درختِ چنارِ نهصدساله، و قفقاز
    آن‌سوی دره.'
  body: >-
    **ارکله دوم در سال ۱۷۲۰ در تلاوی زاده شد و در سال ۱۷۹۸ همان‌جا درگذشت، و این شهر هرگز از آنِ او بودن
    باز نایستاد.**


    تلاوی مدت‌ها پیش از او نیز شهری کهن بود. بطلمیوس در سده‌ی دوم میلادی گویا آن را «تِلِدا» می‌شناخت؛
    جغرافی‌دان عرب المقدسی در سده‌ی دهم نامش را کنار تفلیس و گنجه آورد. از سده‌ی دهم تا دوازدهم، تلاوی
    پایتخت پادشاهی کاختی بود، در سده‌ی هفدهم بار دیگر پایتخت شد، و از سال ۱۷۶۲ دومین پایتخت پادشاهیِ متحدِ
    کارتلی-کاختی، پس از تفلیس، به‌شمار می‌رفت. این تنها شهر گرجستان است که استحکاماتی از چهار دوره در
    آن هنوز برپاست، از دزوِلی گالاوانی، «دیوارهای کهن»، از سده‌های نهم و دهم، تا قلعه‌های خاندان‌های اشرافی
    کورچی‌باشی‌شویلی و واخواخی‌شویلی.


    باشکوه‌ترین این‌ها **باتونیس تسیخه**، یعنی «دژ سرور»، مقرِ پادشاهان کاختی در سده‌های هفدهم و هجدهم
    است. پس از دیوار و دو دروازه‌اش، کاخ سلطنتی که در دهه‌ی ۱۶۶۰ ساخته شد، دو کلیسای دربار، یک حمام و
    بازمانده‌های مدرسه‌ی دینی (سمیناری) که ارکله بنیاد نهاد، برپاست؛ او همچنین تئاتری به شهر بخشید. امروز
    این مجموعه موزه‌ای است، و بیرون از آن، پادشاه بر اسبی برنزی سوار است.


    چند دقیقه پیاده‌روی آن‌سوتر، چناری شرقی به سن نزدیک به ۹۰۰ سال، به بلندای حدود ۴۰ متر سر برافراشته
    که محیط تنه‌اش ۱۱ متر است. به بازار بروید، برای چورچخلا، پنیر تلاوی و شرابی که از گالن‌های پلاستیکی
    می‌ریزند؛ سپس نگاهی به بالا بیندازید: آن‌سوی دره‌ی آلازانی، قفقاز انتهای خیابان را می‌بندد.


    گرجی‌ها هنوز ارکله را «پاتارا کاخی»، یعنی «کاختیِ کوچک»، می‌خوانند — لقبی خودمانی، نه عنوانی رسمی؛
    و همین نشان می‌دهد که از سر محبت است.
  tip: >-
    تلاوی پایگاهی کاربردی برای گشت‌وگذار در کاختی است: بانک، دستگاه خودپرداز، داروخانه و گسترده‌ترین گزینه‌های
    اقامت در منطقه. موزه‌ی باتونیس تسیخه بلیتی چند لاری می‌گیرد؛ ورود به حیاط معمولاً رایگان است. پارک
    کردن خودرو نزدیک مجسمه‌ی ارکله معمولاً آسان است. سه ساعت برای دیدن دژ، چنار و بازار کافی است؛ بازار
    در صبح شلوغ‌تر است — پول نقد همراه داشته باشید. بعدازظهرهای تابستان می‌تواند سوزان باشد (رکورد شهر
    ۴۱٫۶ درجه‌ی سلسیوس است)، پس صبح زود یا اواخر روز پیاده‌روی کنید. آلاوردی، ایکالتو و تسیناندالی همه
    در نیم‌ساعت راه‌اند.
  route: >-
    راه کوتاه از گذرگاه گومبوری می‌گذرد: از تفلیس در بزرگراه کاختی S5 حرکت کنید، نزدیک وازیانی به Sh38
    بپیچید و از اوجارما و رشته‌کوه بگذرید — حدود ۹۵ کیلومتر و یک ساعت و ۴۵ دقیقه. راه تمام مسیر آسفالته
    است، اما نزدیک گردنه تنگ و پرپیچ‌وخم است و پس از برف سنگین ممکن است مدتی بسته شود. راه بلندتر روی
    S5 از میان ساگارجو تا باکورتسیخه ادامه می‌یابد، سپس به سوی شمال روی Sh42 از میان گورجانی می‌پیچد:
    حدود ۱۵۰ کیلومتر و دو ساعت و نیم، اما هموارتر و آسان‌تر. خودروی اقتصادی در هر دو راه کارساز است. در
    تفلیس، ساگارجو یا تلاوی باک را پر کنید.
he:
  name: טלאווי ובאטוניס ציכה
  short: 'בירת קאחתי על מדרגתה מעל האלאזני: מצודת-הארמון של ארקלה השני, עץ דולב בן 900 שנה, והקווקז שמעבר
    לעמק.'
  body: >-
    **ארקלה השני נולד בטלאווי ב-1720 ומת בה ב-1798, והעיר לא ממש חדלה להיות שלו.**


    היא הייתה עתיקה הרבה לפני ימיו. תלמי, במאה השנייה, הכיר אותה כנראה בשם טלדה; הגאוגרף הערבי אל-מקדסי,
    במאה העשירית, מנה אותה לצד טביליסי וגנג'ה. מהמאה העשירית עד השתים-עשרה הייתה טלאווי בירת ממלכת קאחתי,
    במאה השבע-עשרה הפכה שוב לבירה, וב-1762 כבר הייתה הבירה השנייה (אחרי טביליסי) של הממלכה המאוחדת של
    קרתלי-קאחתי. זו העיר הגאורגית היחידה שבה שרדו ביצורים מארבע תקופות שונות: מהחומות העתיקות, דזוולי
    גלוואני, מהמאות התשיעית-עשירית, ועד מבצרי משפחות האצולה קורצ'יבשישווילי וואחוואחישווילי.


    המפוארת מכולן היא **באטוניס ציכה**, 'מצודת האדון', מקום מושבם של מלכי קאחתי במאות השבע-עשרה והשמונה-עשרה.
    מעבר לחומתה ולשני שעריה עומדים ארמון המלוכה שנבנה בשנות ה-1660, שתי כנסיות חצר, בית מרחץ ושרידי הסמינר
    שהקים ארקלה; הוא גם העניק לעיר תיאטרון. כיום המתחם משמש מוזיאון, ובחוץ רוכב המלך על סוס ברונזה.


    במרחק הליכה של דקות אחדות מתנשא דולב מזרחי בן כ-900 שנה לגובה של כ-40 מטרים, וגזעו נמדד ב-11 מטרים
    היקף. המשיכו לשוק לצ'ורצ'חלה, לגבינת טלאווי וליין שנמזג מג'ריקנים מפלסטיק, ואז הביטו מעלה: מעבר לעמק
    האלאזני סוגר הקווקז את קצה הרחוב.


    הגאורגים עדיין מכנים את ארקלה 'פאטארה קאחי', 'הקאחתי הקטן' — כינוי, לא תואר, וכך יודעים שנאמר באהבה.
  tip: >-
    טלאווי היא בסיס נוח לביקור בקאחתי: בנקים, כספומטים, בתי מרקחת והמבחר הרחב ביותר של מקומות לינה באזור.
    המוזיאון בבאטוניס ציכה גובה כרטיס של כמה לארי; הכניסה לחצר עצמה חינם בדרך כלל. חניה בקרבת פסל ארקלה
    בדרך כלל נוחה. שלוש שעות מספיקות למצודה, לדולב ולשוק, שהוא התוסס ביותר בבוקר — הביאו מזומן. אחר הצהריים
    בקיץ עלולים להיות לוהטים (השיא בעיר הוא 41.6 מעלות), אז טיילו בבוקר מוקדם או לפנות ערב. אלאוורדי,
    איקלטו וצינאנדלי כולן במרחק חצי שעת נסיעה.
  route: >-
    הדרך הקצרה עוברת במעבר גומבורי: צאו מטביליסי בכביש קאחתי S5, פנו לכביש Sh38 סמוך לוואזיאני ועקבו אחריו
    דרך אוג'רמה ומעל הרכס — כ-95 ק"מ ושעה ו-45 דקות. הכביש סלול לכל אורכו, אך צר ומתפתל סמוך למעבר, ועלול
    להיסגר לזמן מה אחרי שלג כבד. הדרך הארוכה נשארת על S5 דרך סאגארג'ו עד בקורציחה, ואז פונה צפונה על Sh42
    דרך גורג'אני: כ-150 ק"מ ושעתיים וחצי, אך שטוחה וקלה יותר. רכב חסכוני מתמודד עם כל אחת מהדרכים. תדלקו
    בטביליסי, בסאגארג'ו או בטלאווי.
ar:
  name: تيلافي وباتونيس تسيخه
  short: >-
    عاصمة كاختي على مصطبتها المشرفة على نهر ألازاني: قصر-قلعة إيريكله الثاني، وشجرة دلب عمرها 900 عام،
    والقوقاز عبر الوادي.
  body: >-
    **وُلد إيريكله الثاني في تيلافي عام 1720 وتوفي فيها عام 1798، ولم تكفّ المدينة يومًا عن كونها مدينته.**


    كانت قديمة قبله بزمن طويل. يبدو أن بطليموس، في القرن الثاني، عرفها باسم تِلِدا؛ وذكرها الجغرافي العربي
    المقدسي، في القرن العاشر، إلى جانب تبليسي وكنجة. من القرن العاشر إلى الثاني عشر كانت تيلافي عاصمة
    مملكة كاختي، وفي القرن السابع عشر أصبحت عاصمة من جديد، وبحلول عام 1762 كانت العاصمة الثانية (بعد تبليسي)
    لمملكة كارتلي-كاختي الموحدة. إنها المدينة الجورجية الوحيدة التي لا تزال تحتفظ بتحصينات من أربع عصور
    مختلفة، من دزفيلي غالافاني، «الأسوار القديمة»، من القرنين التاسع والعاشر، إلى قلاع عائلتَي النبلاء
    كورتشيباشيشفيلي وفاخفاخيشفيلي.


    وأعظمها هو **باتونيس تسيخه**، أي «قلعة السيد»، مقر ملوك كاختي في القرنين السابع عشر والثامن عشر. وخلف
    سورها وبوابتيها يقوم القصر الملكي المبني في ستينيات القرن السابع عشر، وكنيستان للبلاط، وحمّام، وبقايا
    المدرسة الدينية التي أسسها إيريكله؛ وقد وهب المدينة مسرحًا أيضًا. واليوم يُستخدم المجمّع متحفًا، وخارجه
    يمتطي الملك جواده البرونزي.


    وعلى مسافة دقائق سيرًا، ترتفع دلبة شرقية عمرها نحو 900 عام إلى حوالي 40 مترًا، ومحيط جذعها 11 مترًا.
    تابع طريقك إلى السوق لتذوق التشورتشخيلا وجبن تيلافي والنبيذ المسكوب من عبوات بلاستيكية، ثم انظر إلى
    الأعلى: عبر وادي ألازاني يُغلق القوقاز نهاية الشارع.


    ما زال الجورجيون يلقّبون إيريكله بـ«باتارا كاخي»، أي «الكاختي الصغير» — لقبٌ لا رتبة، وبهذا تعرف أنهم
    قالوه بمحبة.
  tip: >-
    تيلافي قاعدة عملية لاستكشاف كاختي: مصارف وصرافات آلية وصيدليات وأوسع خيارات الإقامة في المنطقة. ثمن
    تذكرة متحف باتونيس تسيخه بضعة لاري؛ ودخول الساحة عادة مجاني. تتوفر مواقف السيارات عادة بسهولة قرب
    تمثال إيريكله. تكفي ثلاث ساعات لزيارة القلعة والدلبة والسوق، الذي يكون أكثر حيوية في الصباح — احمل
    نقودًا. قد تكون فترات بعد الظهر في الصيف قاسية (الرقم القياسي في المدينة 41.6 درجة)، فامشِ باكرًا
    أو في وقت متأخر من اليوم. تقع ألافردي وإيكالتو وتسيناندالي جميعها على نحو نصف ساعة بالسيارة.
  route: >-
    الطريق القصير يمرّ عبر ممر غومبوري: اخرج من تبليسي على طريق كاختي السريع S5، وانحرف إلى Sh38 قرب فازياني،
    وتابع عبر أوجارما وفوق السلسلة الجبلية — نحو 95 كم وساعة و45 دقيقة. الطريق معبّد بالكامل، لكنه ضيق
    ومتعرج قرب القمة، وقد يُغلق لفترة بعد تساقط ثلوج كثيفة. الطريق الأطول يبقى على S5 عبر ساغاريجو إلى
    باكورتسيخه، ثم يتجه شمالًا على Sh42 عبر غورجاني: نحو 150 كم وساعتين ونصف، لكنه أكثر استواءً وسهولة.
    تصلح سيارة اقتصادية لأي من الطريقين. عبّئ الوقود في تبليسي أو ساغاريجو أو تيلافي.
