ka:
  name: თელავი და ბატონის ციხე
  short: კახეთის დედაქალაქი ალაზნის ველზე გადმომდგარ ტერასაზე, ერეკლე მეორის რეზიდენციითა და ცხრასაუკუნოვანი
    ჭადრით.
  body: >-
    თელავი კახეთის ადმინისტრაციული და პრაქტიკული ცენტრია — აქ არის ბაზარი, საავადმყოფო, ბანკები და ღამის
    გასათევის ყველაზე ფართო არჩევანი რეგიონში. ქალაქი ცივ-გომბორის ქედის ფერდობზე ტერასულადაა გაშენებული
    და მთავარი გამზირიდან ალაზნის ველი და კავკასიონი პირდაპირ იშლება. ეს ის ბაზაა, საიდანაც ალავერდი,
    იყალთო, წინანდალი და გრემი ერთ-ერთ დღეში მოინახულება.


    ქალაქის ცენტრში დგას **ბატონის ციხე** — XVII–XVIII საუკუნეების სამეფო რეზიდენცია, ერეკლე მეორის სასახლით,
    ორი პატარა კარის ეკლესიით, აბანოთი და გალავნით. კომპლექსი აღდგენილია და მუზეუმად მუშაობს: ისტორიული
    ექსპოზიცია, სამეფო ოთახები და ეზოს პერიმეტრზე გასეირნება. ციხის წინ ერეკლე მეორის ცნობილი ძეგლი დგას,
    საიდანაც ქალაქის მთავარი პანორამული ხედი იხსნება.


    ციხის მახლობლად, ცალკე ეზოში, დგას თელავის ჭადარი — ხე, რომლის ასაკს დაახლოებით ცხრა საუკუნით აფასებენ;
    ტანის გარშემოწერილობა თერთმეტ მეტრს აღწევს. ქალაქის ბაზარი, რომელიც ციხიდან ხუთ წუთშია, დათვალიერების
    ღირსია დამოუკიდებლადაც: ჩურჩხელა, თელავის ყველი, ხილი და ადგილობრივი ღვინო ბოთლებით ან პლასტმასის
    ბიდონებით. ქალაქში რამდენიმე მუზეუმიცაა: ბატონის ციხის კომპლექსში მოქმედებს ისტორიულ-ეთნოგრაფიული
    ექსპოზიცია და პატარა სურათების გალერეა. საღამოს ცენტრალურ გამზირზე ხალხმრავლობაა, რესტორნები გვიანობამდე
    მუშაობს და კახური სამზარეულოს არჩევანი აქ რეგიონში ყველაზე ფართოა.
  tip: >-
    თელავი კარგი ღამის გასათევია, თუ კახეთს ორ დღედ ინახავთ — სასტუმროების ფასი აქ სიღნაღზე დაბალია. ბატონის
    ციხეში ბილეთი მუზეუმისთვისაა, ეზოში შესვლა ჩვეულებრივ თავისუფალია. მანქანა დატოვეთ ერეკლეს ძეგლთან,
    უფასო ადგილია. სამი საათი ეყოფა ციხეს, ჭადარსა და ბაზარს. კაფეები და ბანკომატები ცენტრალურ გამზირზეა;
    ბაზარზე ნაღდი ფული გქონდეთ.
  route: >-
    ყველაზე სწრაფი გზაა გომბორის უღელტეხილი: თბილისიდან ვაზიანზე, უჯარმაზე და გომბორზე — სულ 95 კმ და
    დაახლოებით საათნახევარი და თხუთმეტი წუთი. გზა ასფალტიანია, მაგრამ უღელტეხილზე ვიწრო და კლაკნილი, ამიტომ
    ზამთარში თოვლის შემდეგ დროებით იკეტება. ალტერნატივა კახეთის გზატკეცილია საგარეჯოსა და გურჯაანის გავლით
    — 120 კმ, ორ საათზე მეტი, სამაგიეროდ ბრტყელი და უსაფრთხო. ეკონომ კლასი ორივესთვის საკმარისია; საწვავს
    ავსებთ საგარეჯოში ან თელავშივე.
en:
  name: Telavi and Batonis Tsikhe
  short: >-
    The capital of Kakheti on a terrace above the Alazani Valley, with King Erekle II's residence and
    a nine-century-old plane tree.
  body: >-
    Telavi is the administrative and practical centre of Kakheti — the market, the hospital, the banks
    and by far the widest choice of accommodation in the region are all here. The town is built in terraces
    on the slope of the Tsiv-Gombori range, and from the main avenue the Alazani Valley and the Caucasus
    wall open out directly ahead. This is the natural base from which Alaverdi, Ikalto, Tsinandali and
    Gremi can all be reached in a single day.


    In the centre stands **Batonis Tsikhe**, the royal residence of the seventeenth and eighteenth centuries:
    Erekle II's palace, two small court churches, a bathhouse and the enclosing wall. The complex has
    been restored and works as a museum, with a historical exhibition, the royal rooms and a walk around
    the courtyard perimeter. In front of it is the well-known equestrian statue of Erekle II, and the
    terrace beside it gives the town's best panorama.


    A short walk away, in its own small enclosure, stands the Telavi plane tree — an oriental plane estimated
    at around nine hundred years old, with a trunk some eleven metres around. The town market, five minutes
    from the castle, is worth a stop in its own right: churchkhela, Telavi cheese, fruit, and local wine
    sold by the bottle or straight from plastic canisters.
  tip: >-
    Telavi makes a sensible overnight base if you are giving Kakheti two days; room rates here run below
    Sighnaghi. The ticket at Batonis Tsikhe covers the museum, while walking into the courtyard is normally
    free. Leave the car near the Erekle statue, where parking costs nothing. Three hours covers the castle,
    the plane tree and the market. Cafés and ATMs line the central avenue, but bring cash for the market
    itself.
  route: >-
    The quickest route is over the Gombori Pass: out of Tbilisi via Vaziani, Ujarma and Gombori, about
    95 km and an hour and three quarters. The road is asphalt but narrow and winding at the top, and it
    can close briefly after heavy winter snowfall. The alternative is the Kakheti Highway through Sagarejo
    and Gurjaani — 120 km and over two hours, but flat and untroubled. An economy car is adequate on either.
    Fuel up in Sagarejo or in Telavi itself, where several stations sit on the approach road.
ru:
  name: Телави и Батонис-цихе
  short: >-
    Столица Кахетии на террасе над Алазанской долиной: резиденция Ираклия II и платан возрастом около
    девяти веков.
  body: >-
    Телави — административный и практический центр Кахетии: здесь рынок, больница, банки и самый широкий
    в регионе выбор жилья. Город выстроен террасами на склоне Цив-Гомборского хребта, и с главного проспекта
    прямо перед вами разворачивается Алазанская долина, а за ней стена Кавказа. Это естественная база:
    Алаверди, Икалто, Цинандали и Греми отсюда объезжаются за один день.


    В центре стоит **Батонис-цихе** — царская резиденция XVII–XVIII веков: дворец Ираклия II, две небольшие
    придворные церкви, баня и крепостная ограда. Комплекс отреставрирован и работает как музей: историческая
    экспозиция, царские покои и прогулка по периметру двора. Перед крепостью — известный конный памятник
    Ираклию II, а с площадки рядом открывается лучшая панорама города.


    В нескольких минутах ходьбы, в отдельной ограде, растёт телавский платан: возраст дерева оценивают
    примерно в девять столетий, обхват ствола достигает одиннадцати метров. Городской рынок в пяти минутах
    от крепости стоит отдельного визита — чурчхела, телавский сыр, фрукты и местное вино, которое продают
    бутылками или прямо из пластиковых канистр.
  tip: >-
    Телави — разумное место для ночёвки, если вы отводите Кахетии два дня: жильё здесь дешевле, чем в
    Сигнахи. Билет в Батонис-цихе покрывает музей, вход во двор обычно свободный. Машину оставьте у памятника
    Ираклию, парковка бесплатная. Трёх часов достаточно на крепость, платан и рынок. Кафе и банкоматы
    стоят вдоль центрального проспекта, но на рынок берите наличные.
  route: >-
    Быстрее всего ехать через Гомборский перевал: из Тбилиси на Вазиани, Уджарму и Гомбори — около 95
    км и час сорок пять. Дорога асфальтовая, но на перевале узкая и извилистая, после сильных снегопадов
    её ненадолго закрывают. Альтернатива — Кахетинское шоссе через Сагареджо и Гурджаани: 120 км и больше
    двух часов, зато ровно и спокойно. Машины эконом-класса хватит на обоих вариантах. Заправляйтесь в
    Сагареджо или уже в самом Телави, на въезде есть несколько АЗС.
fa:
  name: تلاوی و باتونیس تسیخه
  short: مرکز کاختی بر مصطبه‌ای مشرف به درهٔ آلازانی، با اقامتگاه ارکله دوم و چناری نه‌قرنه.
  body: >-
    تلاوی مرکز اداری و عملی کاختی است — بازار، بیمارستان، بانک‌ها و بیشترین گزینهٔ اقامت منطقه همگی اینجاست.
    شهر پلکانی بر دامنهٔ ستیغ تسیو-گومبوری ساخته شده و از خیابان اصلی، درهٔ آلازانی و دیوار قفقاز درست
    روبه‌رو باز می‌شود. این پایگاه طبیعی است که از آن می‌توان آلاوردی، ایکالتو، تسیناندالی و گرمی را در
    یک روز دید.


    در مرکز شهر **باتونیس تسیخه** ایستاده است، اقامتگاه سلطنتی سده‌های هفدهم و هجدهم: کاخ ارکله دوم، دو
    کلیسای کوچک درباری، حمام و دیوار پیرامونی. مجموعه بازسازی شده و همچون موزه کار می‌کند، با نمایشگاه
    تاریخی، اتاق‌های سلطنتی و گردشی گرد محیط حیاط. پیش روی آن مجسمهٔ سوارهٔ سرشناس ارکله دوم قرار دارد
    و مصطبهٔ کنارش بهترین چشم‌انداز شهر را می‌دهد.


    اندکی دورتر، در محوطه‌ای کوچک، چنار تلاوی ایستاده است — چنار شرقی که سن آن را حدود نهصد سال برآورد
    می‌کنند و تنه‌اش نزدیک یازده متر دور دارد. بازار شهر، پنج دقیقه از قلعه، خودش ارزش توقف دارد: چورچخلا،
    پنیر تلاوی، میوه و شراب محلی که بطری یا مستقیم از بیدون‌های پلاستیکی فروخته می‌شود.
  tip: >-
    اگر دو روز به کاختی می‌دهید، تلاوی پایگاه شبانهٔ معقولی است؛ نرخ اتاق اینجا پایین‌تر از سیغناغی است.
    بلیت باتونیس تسیخه موزه را پوشش می‌دهد، در حالی که ورود به حیاط معمولاً رایگان است. خودرو را نزدیک
    مجسمهٔ ارکله بگذارید؛ پارک آنجا هزینه‌ای ندارد. سه ساعت برای قلعه، چنار و بازار کافی است. کافه و خودپرداز
    در خیابان مرکزی هست، اما برای خود بازار پول نقد بردارید.
  route: >-
    سریع‌ترین راه از گردنهٔ گومبوری است: از تفلیس از راه وازیانی، اوجارما و گومبوری، حدود 95 کیلومتر و
    یک ساعت و سه‌ربع. جاده آسفالت است اما در بالا باریک و پرپیچ می‌شود و پس از برف سنگین زمستانی ممکن
    است کوتاه‌مدت بسته شود. گزینهٔ دیگر بزرگراه کاختی از ساگارجو و گورجانی است — 120 کیلومتر و بیش از
    دو ساعت، اما هموار و بی‌دردسر. خودروی اقتصادی برای هر دو کافی است. باک را در ساگارجو یا در خود تلاوی
    پر کنید، جایی که چند پمپ روی جادهٔ ورودی هست.
he:
  name: טלאווי ובאטוניס ציחה
  short: בירת קחתי על מדרגה מעל עמק אלאזני, עם ארמונו של המלך ארקלה השני ועץ דולב בן תשע מאות שנה.
  body: >-
    טלאווי היא המרכז המנהלי והמעשי של קחתי — השוק, בית החולים, הבנקים ומבחר הלינה הרחב ביותר באזור, ובפער
    ניכר, נמצאים כולם כאן. העיירה בנויה במדרגות על מדרון רכס ציב-גומבורי, ומן השדרה הראשית נפתחים היישר
    ממול עמק אלאזני וחומת הקווקז. זהו הבסיס הטבעי שממנו אפשר להגיע ביום אחד לאלאוורדי, לאיקלטו, לצינאנדלי
    ולגרמי.


    במרכז העיר עומד **באטוניס ציחה**, מעון המלוכה של המאות ה-17 וה-18: ארמונו של ארקלה השני, שתי כנסיות
    חצר קטנות, בית מרחץ והחומה המקיפה. המתחם שוחזר והוא פועל כמוזיאון, עם תצוגה היסטורית, חדרי המלוכה
    והליכה סביב היקף החצר. לפניו ניצב פסל הפרשים המוכר של ארקלה השני, והמרפסת שלצידו מעניקה את הפנורמה
    הטובה ביותר בעיר.


    במרחק הליכה קצרה משם, בתוך גדר קטנה משלו, עומד דולב טלאווי — עץ דולב מזרחי שגילו מוערך בכתשע מאות
    שנה, והיקף גזעו כאחד עשר מטרים. גם שוק העיר, חמש דקות מן המצודה, ראוי לעצירה בפני עצמו: צ'ורצ'חלה,
    גבינת טלאווי, פירות ויין מקומי הנמכר בבקבוקים או היישר ממיכלי פלסטיק.
  tip: >-
    טלאווי היא בסיס לינה הגיוני אם אתם מקדישים לקחתי יומיים; מחירי החדרים כאן נמוכים מאלה שבסיגנאגי. הכרטיס
    בבאטוניס ציחה מכסה את המוזיאון, ואילו הכניסה לחצר חינם בדרך כלל. השאירו את הרכב ליד פסל ארקלה, שם
    החניה אינה עולה דבר. שלוש שעות מספיקות למצודה, לדולב ולשוק. בתי קפה וכספומטים לאורך השדרה המרכזית,
    אבל לשוק עצמו הביאו מזומן.
  route: >-
    המסלול המהיר הוא דרך מעבר גומבורי: יציאה מטביליסי דרך ואזיאני, אוג'רמה וגומבורי, כ-95 ק"מ ושעה ושלושה
    רבעים. הכביש סלול אך צר ומפותל בחלקו העליון, והוא עלול להיסגר לזמן קצר אחרי שלג כבד בחורף. החלופה
    היא כביש קחתי דרך סאגארג'ו וגורג'אני — 120 ק"מ ומעל שעתיים, אך שטוח ונטול הפתעות. רכב חסכוני מספיק
    בשני המסלולים. תדלקו בסאגארג'ו או בטלאווי עצמה, שבה כמה תחנות יושבות על כביש הגישה.
ar:
  name: تيلافي وباتونيس تسيخي
  short: عاصمة كاخيتي على مصطبة تطل على وادي ألازاني، مع مقر الملك إيريكلي الثاني وشجرة دلب عمرها تسعة
    قرون.
  body: >-
    تيلافي هي المركز الإداري والعملي لكاخيتي — فالسوق والمستشفى والمصارف وأوسع خيارات الإقامة في الإقليم
    كلها هنا. بُنيت البلدة على شكل مصاطب على منحدر سلسلة تسيف-غومبوري، ومن الشارع الرئيسي ينفتح أمامك
    مباشرة وادي ألازاني وجدار القوقاز. وهي القاعدة الطبيعية التي يمكن منها بلوغ ألافيردي وإيكالتو وتسيناندالي
    وغريمي في يوم واحد.


    في الوسط يقوم **باتونيس تسيخي**، مقر الملوك في القرنين السابع عشر والثامن عشر: قصر إيريكلي الثاني،
    وكنيستان صغيرتان للبلاط، وحمّام، والسور المحيط. رُمّم المجمع ويعمل متحفاً، بمعرض تاريخي وغرف ملكية
    وجولة حول محيط الفناء. وأمامه يقف تمثال إيريكلي الثاني الفروسي المعروف، وتمنح المصطبة المجاورة له
    أجمل بانوراما في البلدة.


    وعلى مسافة مشي قصيرة، داخل سياج صغير خاص بها، تقف شجرة دلب تيلافي — دلب شرقي يُقدَّر عمره بنحو تسعمئة
    عام ومحيط جذعه أحد عشر متراً تقريباً. أما سوق البلدة، على بعد خمس دقائق من القلعة، فيستحق وقفة بذاته:
    تشورتشخيلا وجبن تيلافي والفاكهة والنبيذ المحلي يُباع بالزجاجة أو مباشرة من عبوات بلاستيكية.
  tip: >-
    تيلافي قاعدة مبيت معقولة إن منحت كاخيتي يومين؛ فأسعار الغرف هنا أدنى من سيغناغي. تذكرة باتونيس تسيخي
    تشمل المتحف، بينما الدخول إلى الفناء مجاني عادة. اترك السيارة قرب تمثال إيريكلي حيث لا يكلف الوقوف
    شيئاً. ثلاث ساعات تكفي للقلعة والشجرة والسوق. المقاهي وأجهزة الصراف تصطف على الشارع المركزي، لكن احمل
    نقداً للسوق نفسه.
  route: >-
    أسرع الطرق هو عبر ممر غومبوري: الخروج من تبليسي عبر فازياني وأوجارما وغومبوري، نحو 95 كم وساعة وثلاثة
    أرباع. الطريق معبّد لكنه ضيق وكثير المنعطفات في الأعلى، وقد يُغلق لفترة قصيرة بعد تساقط ثلج شتوي كثيف.
    البديل هو طريق كاخيتي السريع عبر ساغاريجو وغورجاني — 120 كم وأكثر من ساعتين، لكنه مستوٍ ومريح. السيارة
    الاقتصادية تكفي في الحالتين. تزود بالوقود في ساغاريجو أو في تيلافي نفسها، حيث تقع عدة محطات على طريق
    الوصول.
