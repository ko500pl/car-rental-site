ka:
  name: ბატეთის ტბა
  short: >-
    მეწყრით დაგუბებული პატარა ტბა ძამის ხეობის ტყეში, 1313 მეტრზე — ოქტომბრის ბოლოს წიფლნარი აქ ალისფრად
    ინთება და წყალში ორმაგდება.
  body: >-
    **ბატეთის ტბა ერთ წამში გაჩნდა — როცა თრიალეთის ქედის კალთა ჩამოიშალა და მთის ნაკადულს გზა გადაუღობა.**


    მეწყერი სამხრეთიდან ბატეთისწყალზე ჩამოწვა და მის უკან პატარა ტბა დადგა: 0,02 კვადრატული კილომეტრი,
    საშუალოდ 7, უღრმეს ადგილას კი 12 მეტრი სიღრმით, ზღვის დონიდან 1313 მეტრზე, ძამის აუზში, ქარელის მუნიციპალიტეტის
    სოფელ კოდმანთან. ნაპირი თითქმის არ აქვს: წიფლითა და მუქი წიწვოვნებით დაბურული ფერდობები პირდაპირ გამჭვირვალე
    წყალში ეშვება. ერთი ბოლოდან ნაკადული გამოედინება, სამხრეთი კიდე კი, საიდანაც მიწა ჩამოიქცა, დაჭაობებულა.


    ოქტომბრის მეორე ნახევარში წიფელი მუქ წიწვოვნებს შორის სპილენძისფრად და ალისფრად ინთება, უქარო დილით
    კი მთელი ქვაბული წყალში ორმაგდება. წყლიდან დამხრჩვალი ხეების ნაცრისფერი ღეროები ამოდის — სწორედ ეს
    კადრი ამოიყვანს ყოველ შემოდგომაზე ფოტოგრაფებს ამ ხეობაში. დეკემბრიდან მარტამდე ტბას ყინულის ქვეშ სძინავს.


    ტბა მხოლოდ სურათი არ არის. აქ მცირეაზიური ტრიტონი ბინადრობს — სახეობა, რომელსაც ბუნების დაცვის საერთაშორისო
    კავშირი საფრთხესთან ახლოს მყოფად აფასებს და საქართველოს წითელ წიგნშიცაა შეტანილი; იგივე წიგნი ტბაში
    კალმახსაც აღრიცხავს.


    აქ სხვა არაფერია: არც კაფე, არც ჯიხური, არც ტუალეტი. წამოიღეთ საფენი, საჭმელი და დრო, და ყველაფერი
    უკანვე წაიღეთ. შინისკენ მიმავალ გზაზე ყინწვისში შეიარეთ — იქ შუა საუკუნეების მხატვრებმა ფერით ის გააკეთეს,
    რასაც ეს ტყე ყოველ ოქტომბერს აკეთებს.
  tip: >-
    ფერების პიკი ჩვეულებრივ ოქტომბრის მეორე ნახევარში დგება და ორიოდე კვირას გრძელდება — ამინდის პროგნოზს
    თვალი ადევნეთ და უქარო დილა შეარჩიეთ, როცა ანარეკლი ყველაზე სუფთაა. ჩვეულებრივი მანქანით ქვემოთ გაჩერდებით
    და ბოლო ერთ-ორ კილომეტრს ტყეში ფეხით, 30–40 წუთში გაივლით, ამიტომ კარგი ფეხსაცმელი ჩაიცვით: წვიმის
    შემდეგ ბილიკი ტალახიანია. ნაგავს აქ არავინ აგროვებს — ყველაფერი უკან წაიღეთ. ტრიტონები ნაპირთან, თხელ
    წყალში ცხოვრობენ, ამიტომ ძაღლი და ფეხები წყალს მოარიდეთ. ზამთარში გზა ხშირად გაუვალია: ვიზიტი მაისიდან
    ოქტომბრამდე დაგეგმეთ.
  route: >-
    თბილისიდან E60 (S1) მაგისტრალით დასავლეთისკენ, გორის გავლით ქარელის გადასახვევამდე, იქიდან კი სამხრეთით,
    ძამის ხეობაში — სოფლებისა და ხეობაში მიმოფანტული ეკლესიების გვერდით. ხეობის სიღრმეში ასფალტს ხრეში
    ცვლის; მთელი გზა დაახლოებით 130 კილომეტრი და ორნახევარი საათია. მაღალი კლირენსის ჯიპი ტბასთან ყველაზე
    ახლოს მიგიყვანთ; სედანი უფრო ქვემოთ ჩერდება და ტყეში 30–40-წუთიანი სავალი გრჩებათ. წვიმის შემდეგ გრუნტი
    რბილდება და ღრმა ნაკვალევით იფარება — ასეთ დროს 4x4 ავტომობილი ჯობია. საწვავი მთავარი გზიდან გადახვევამდე,
    გორში ან ქარელში ჩაასხით.
en:
  name: Bateti Lake
  short: >-
    A tiny landslide lake in the forests of the Dzama valley at 1,313 m; in late October the beeches burn
    crimson and double themselves in the water.
  body: >-
    **Bateti was made in a single moment, when a slope of the Trialeti range gave way and dammed a mountain
    stream.**


    The landslide came down from the south across the Batetistskali, and behind it a small lake filled:
    0.02 km², about 7 metres deep on average and 12 at most, at 1,313 metres in the Dzama basin near the
    village of Kodmani, in Kareli Municipality. There is barely a shore. Slopes of beech and dark conifers
    run straight down to clear water; a stream slips out at one end, and the southern edge, where the
    earth fell, has softened into marsh.


    In the second half of October the beeches turn copper and crimson against the conifers, and on a windless
    morning the whole bowl doubles itself in the water. Grey drowned trunks stand in the shallows, the
    image that brings photographers up the gorge every autumn. From December to March the lake sleeps
    under ice.


    It is more than a picture. Bateti is home to the northern banded newt, rated Near Threatened by the
    IUCN and listed in Georgia's Red Book, which also records trout in the lake.


    There is nothing else here: no café, no kiosk, no toilet. Bring a blanket, food and time, and carry
    everything back out. On the way home, stop at Kintsvisi, where medieval painters did with colour what
    this forest does each October.
  tip: >-
    Peak colour usually falls in the second half of October and lasts about two weeks, so watch the forecast
    and aim for a still morning, when the reflection is cleanest. In an ordinary car you park lower down
    and walk the last kilometre or two through the forest, 30–40 minutes, so wear proper shoes; the track
    is muddy after rain. Nobody collects rubbish here, so take everything back with you. Newts live in
    the shallows: keep dogs and feet out of the water. In winter the road is often impassable, so plan
    for May to October.
  route: >-
    Take the E60 (S1) west past Gori to the Kareli turn-off, then head south into the Dzama valley, past
    villages and the churches scattered along the gorge. The asphalt gives way to gravel deeper in; the
    whole trip is about 130 km and roughly 2 hours 30 minutes. A high-clearance SUV gets you closest to
    the lake; a saloon stops lower down, leaving a 30–40 minute walk through the forest. After rain the
    surface turns soft and rutted, and a 4x4 is the safer choice. Fill up in Gori or Kareli before you
    leave the main road.
ru:
  name: Озеро Батети
  short: >-
    Крошечное завальное озеро в лесах Дзамского ущелья на высоте 1313 м; в конце октября буки вспыхивают
    багрянцем и отражаются в воде.
  body: >-
    **Батети родилось в одно мгновение — когда склон Триалетского хребта обрушился и перегородил горный
    ручей.**


    Оползень сошёл с юга поперёк Батетисцкали, и за ним набралось маленькое озеро: 0,02 км², средняя глубина
    около 7 метров, наибольшая — 12, высота 1313 метров, бассейн Дзамы, рядом с селом Кодмани Карельского
    муниципалитета. Берега почти нет. Склоны, поросшие буком и тёмными хвойными, уходят прямо в прозрачную
    воду; с одного конца вытекает ручей, а южный край, откуда съехала земля, превратился в болотце.


    Во второй половине октября буки загораются медью и багрянцем на фоне хвои, и в безветренное утро вся
    чаша удваивается в воде. Из мелководья поднимаются серые стволы затопленных деревьев — тот самый кадр,
    ради которого фотографы каждую осень едут вверх по ущелью. С декабря по март озеро спит подо льдом.


    Но это не только картинка. В Батети живёт малоазиатский тритон — вид, чей статус МСОП определяет как
    «близкий к уязвимому положению» и который занесён в Красную книгу Грузии; та же книга отмечает в озере
    и форель.


    Больше здесь ничего нет: ни кафе, ни киоска, ни туалета. Возьмите плед, еду и время — и увезите всё
    обратно. По дороге домой заверните в Кинцвиси, где средневековые художники сделали красками то, что
    этот лес делает каждый октябрь.
  tip: >-
    Пик красок обычно приходится на вторую половину октября и длится около двух недель, так что следите
    за прогнозом и цельтесь в тихое утро — тогда отражение чище всего. Обычную машину придётся оставить
    ниже и пройти последние километр-два лесом, 30–40 минут, поэтому нужна нормальная обувь; после дождя
    тропа раскисает. Мусор здесь никто не вывозит — забирайте всё с собой. На мелководье живут тритоны:
    не пускайте в воду собак и не заходите сами. Зимой дорога часто непроходима, так что планируйте поездку
    на май–октябрь.
  route: >-
    По E60 (S1) на запад мимо Гори до поворота на Карели, затем на юг в Дзамское ущелье — мимо сёл и церквей,
    рассыпанных по ущелью. Дальше асфальт сменяется гравием; весь путь — около 130 км и примерно 2 часа
    30 минут. Ближе всего к озеру подъедет высокий внедорожник; легковая машина остановится ниже, и останется
    30–40 минут пешком через лес. После дождя дорога раскисает и покрывается колеями, и надёжнее полный
    привод. Заправьтесь в Гори или Карели, прежде чем съехать с главной трассы.
fa:
  name: دریاچهٔ باتتی
  short: >-
    دریاچه‌ای کوچک، زادهٔ زمین‌لغزش، در جنگل‌های درهٔ دزاما در ارتفاع ۱,۳۱۳ متری؛ اواخر اکتبر راش‌ها سرخ
    می‌سوزند و در آب دوچندان می‌شوند.
  body: >-
    **باتتی در یک لحظه پدید آمد، وقتی دامنه‌ای از رشته‌کوه تریالتی فرو ریخت و راه نهری کوهستانی را بست.**


    زمین‌لغزش از جنوب بر باتتیس‌تسکالی فرود آمد و پشت آن دریاچه‌ای کوچک پر شد: ۰٫۰۲ کیلومتر مربع، با ژرفای
    میانگین حدود ۷ متر و بیشینهٔ ۱۲ متر، در ارتفاع ۱,۳۱۳ متری، در حوضهٔ دزاما، نزدیک روستای کودمانی در
    شهرستان کارلی. ساحلی در کار نیست. دامنه‌های پوشیده از راش و سوزنی‌برگان تیره یکراست تا آب زلال پایین
    می‌آیند؛ نهری از یک سو بیرون می‌لغزد، و کرانهٔ جنوبی، همان‌جا که خاک فرو ریخت، به مرداب بدل شده است.


    در نیمهٔ دوم اکتبر راش‌ها در میان سوزنی‌برگان مسی و ارغوانی می‌شوند و در صبحی بی‌باد تمام این کاسه
    در آب دوچندان می‌شود. تنه‌های خاکستری درختانِ غرق‌شده از آب‌های کم‌عمق سر برآورده‌اند؛ همان تصویری
    که هر پاییز عکاسان را به بالای دره می‌کشاند. از دسامبر تا مارس دریاچه زیر یخ به خواب می‌رود.


    اما باتتی فقط یک منظره نیست. اینجا زیستگاه سمندر نواری شمالی است که اتحادیهٔ بین‌المللی حفاظت از طبیعت
    آن را «در آستانهٔ تهدید» می‌داند و در کتاب سرخ گرجستان نیز ثبت شده است؛ همین کتاب از قزل‌آلا در دریاچه
    هم یاد می‌کند.


    دیگر هیچ چیز اینجا نیست: نه کافه، نه دکه، نه سرویس بهداشتی. زیرانداز، خوراک و حوصله بیاورید و همه
    چیز را با خود برگردانید. در راه بازگشت سری به کینتسویسی بزنید، جایی که نقاشان سده‌های میانه با رنگ
    همان کاری را کردند که این جنگل هر اکتبر می‌کند.
  tip: >-
    اوج رنگ‌ها معمولاً در نیمهٔ دوم اکتبر است و حدود دو هفته می‌پاید؛ پس پیش‌بینی هوا را دنبال کنید و
    صبحی آرام را نشانه بگیرید، که بازتاب در آب از همه وقت پاک‌تر است. با خودروی معمولی باید پایین‌تر پارک
    کنید و یکی دو کیلومتر آخر را، ۳۰ تا ۴۰ دقیقه، از میان جنگل پیاده بروید؛ پس کفش مناسب بپوشید، چون پس
    از باران مسیر گِلی است. اینجا کسی زباله جمع نمی‌کند؛ همه چیز را با خود برگردانید. سمندرها در آب‌های
    کم‌عمق زندگی می‌کنند: سگ‌ها را از آب دور نگه دارید و خودتان هم پا در آب نگذارید. زمستان جاده اغلب
    بسته است؛ برای مه تا اکتبر برنامه بریزید.
  route: >-
    از مسیر E60 (S1) به سوی غرب، از کنار گوری تا دوراهی کارلی بروید، سپس به جنوب، به درهٔ دزاما بپیچید
    و از کنار روستاها و کلیساهای پراکنده در دره بگذرید. در عمق دره آسفالت جای خود را به شن می‌دهد؛ کل
    مسیر حدود ۱۳۰ کیلومتر و حدود ۲ ساعت و ۳۰ دقیقه است. شاسی‌بلند با فاصلهٔ زیاد از زمین شما را نزدیک‌تر
    از همه به دریاچه می‌رساند؛ سواری معمولی پایین‌تر می‌ماند و ۳۰ تا ۴۰ دقیقه پیاده‌روی در جنگل باقی می‌گذارد.
    پس از باران سطح جاده نرم و پر از شیار می‌شود و خودروی چهارچرخ‌محرک انتخاب مطمئن‌تری است. پیش از ترک
    جادهٔ اصلی، در گوری یا کارلی سوخت بگیرید.
he:
  name: אגם באטטי
  short: אגם מפולת זעיר ביערות עמק דזאמה, בגובה 1,313 מ'; בסוף אוקטובר האשורים בוערים בארגמן ומשתקפים
    כפליים במים.
  body: >-
    **באטטי נוצר ברגע אחד, כשמדרון ברכס טריאלטי קרס וחסם נחל הררי.**


    המפולת ירדה מדרום אל ערוץ הבאטטיסצקאלי, ומאחוריה התמלא אגם קטן: 0.02 קמ״ר, בעומק ממוצע של כ-7 מטרים
    ומרבי של 12, בגובה 1,313 מטר, באגן הדזאמה ליד הכפר קודמאני שבמוניציפליטת קארלי. חוף כמעט אין. מדרונות
    של אשור ומחטניים כהים יורדים היישר אל המים הצלולים; נחל חומק החוצה בקצה אחד, והקצה הדרומי, שממנו נפלה
    האדמה, הפך לביצה.


    במחצית השנייה של אוקטובר מתלבשים האשורים נחושת וארגמן על רקע המחטניים, ובבוקר ללא רוח כל הקערה משתקפת
    במים. גזעים אפורים של עצים טבועים מזדקרים מן המים הרדודים — התמונה שמעלה צלמים במעלה הערוץ בכל סתיו.
    מדצמבר עד מרץ ישן האגם מתחת לקרח.


    אבל הוא יותר מתמונה. באטטי הוא ביתו של הטריטון המפוספס הצפוני, שהאיגוד הבינלאומי לשימור הטבע מדרג
    כ"קרוב לסיכון" ושרשום בספר האדום של גאורגיה; אותו ספר רושם באגם גם פורל.


    חוץ מזה אין כאן דבר: לא בית קפה, לא קיוסק, לא שירותים. הביאו שמיכה, אוכל וזמן, והוציאו הכול בחזרה.
    בדרך הביתה עצרו בקינצביסי, שם עשו ציירי ימי הביניים בצבע את מה שהיער הזה עושה בכל אוקטובר.
  tip: >-
    שיא הצבעים נופל בדרך כלל במחצית השנייה של אוקטובר ונמשך כשבועיים, אז עקבו אחר התחזית וכוונו לבוקר
    שקט, כשההשתקפות נקייה ביותר. ברכב רגיל חונים נמוך יותר והולכים את הקילומטר או השניים האחרונים ביער,
    30–40 דקות, לכן נעלו נעליים מתאימות; אחרי גשם השביל בוצי. איש אינו אוסף כאן אשפה, אז קחו הכול איתכם.
    טריטונים חיים במים הרדודים: השאירו כלבים ורגליים מחוץ למים. בחורף הדרך לרוב אינה עבירה, אז תכננו לבוא
    בין מאי לאוקטובר.
  route: >-
    סעו מערבה בכביש E60 (S1), על פני גורי, עד הפנייה לקארלי, ומשם דרומה אל עמק דזאמה, על פני כפרים וכנסיות
    הפזורים לאורך הערוץ. בהמשך מתחלף האספלט בחצץ; הדרך כולה כ-130 ק״מ וכשעתיים וחצי. רכב שטח גבוה יביא
    אתכם הכי קרוב לאגם; רכב פרטי רגיל נעצר נמוך יותר, ונשארת הליכה של 30–40 דקות ביער. אחרי גשם פני הדרך
    נעשים רכים ומלאי תלמים, ו-4x4 היא הבחירה הבטוחה יותר. תדלקו בגורי או בקארלי לפני שעוזבים את הכביש
    הראשי.
ar:
  name: بحيرة باتيتي
  short: >-
    بحيرة صغيرة نشأت عن انهيار أرضي في غابات وادي دزاما على ارتفاع 1,313 م؛ في أواخر أكتوبر يشتعل الزان
    قرمزياً ويتضاعف في صفحة الماء.
  body: >-
    **وُلدت باتيتي في لحظة واحدة، حين انهار سفح من سلسلة تريالتي وسدّ مجرى جدول جبلي.**


    انحدر الانهيار الأرضي من الجنوب عبر نهر باتيتيستسكالي، وامتلأت خلفه بحيرة صغيرة: 0.02 كم²، بعمق متوسط
    نحو 7 أمتار وأقصى 12، على ارتفاع 1,313 متراً، في حوض دزاما قرب قرية كودماني في بلدية كاريلي. لا شاطئ
    يكاد يُذكر. تنحدر السفوح المكسوة بالزان والصنوبريات الداكنة مباشرة إلى الماء الصافي؛ ينساب جدول خارجاً
    من أحد طرفيها، أما الحافة الجنوبية، حيث سقطت الأرض، فقد لانت وصارت مستنقعاً.


    في النصف الثاني من أكتوبر يتلوّن الزان بالنحاسي والقرمزي على خلفية الصنوبريات، وفي صباح بلا ريح يتضاعف
    الحوض كله على صفحة الماء. وتنتصب في المياه الضحلة جذوع رمادية لأشجار غرقى، وهي الصورة التي تجذب المصوّرين
    صعوداً في الوادي كل خريف. ومن ديسمبر إلى مارس تنام البحيرة تحت الجليد.


    لكنها أكثر من مجرد صورة. فباتيتي موطن السمندل المخطط الشمالي، الذي يصنّفه الاتحاد الدولي لحفظ الطبيعة
    «قريباً من التهديد»، وهو مدرج في الكتاب الأحمر لجورجيا، الذي يسجّل كذلك وجود السلمون المرقّط في البحيرة.


    ولا شيء غير ذلك هنا: لا مقهى ولا كشك ولا دورة مياه. أحضر بطانية وطعاماً ووقتاً، واحمل كل شيء معك عند
    العودة. وفي طريق الرجوع عرّج على كينتسفيسي، حيث صنع رسامو العصور الوسطى بالألوان ما تصنعه هذه الغابة
    كل أكتوبر.
  tip: >-
    تبلغ الألوان ذروتها عادة في النصف الثاني من أكتوبر وتدوم نحو أسبوعين، فتابع النشرة الجوية واقصد صباحاً
    ساكناً، حين يكون الانعكاس في أصفى حالاته. بالسيارة العادية تركن في موضع أدنى وتمشي الكيلومتر أو الاثنين
    الأخيرين عبر الغابة، 30–40 دقيقة، فالبس حذاءً مناسباً؛ فالدرب موحل بعد المطر. لا أحد يجمع النفايات
    هنا، فاحمل كل شيء معك. تعيش السمندلات في المياه الضحلة: أبقِ الكلاب وقدميك خارج الماء. في الشتاء كثيراً
    ما يتعذر سلوك الطريق، فخطّط لزيارتك بين مايو وأكتوبر.
  route: >-
    اسلك الطريق E60 (S1) غرباً مروراً بغوري حتى منعطف كاريلي، ثم اتجه جنوباً إلى وادي دزاما، مروراً بالقرى
    والكنائس المتناثرة على امتداده. وفي عمق الوادي يُفسح الإسفلت المجال للحصى؛ والرحلة كلها نحو 130 كم
    وتستغرق نحو ساعتين ونصف. سيارة دفع رباعي عالية تبلغ بك أقرب نقطة إلى البحيرة؛ أما السيارة الصالون
    فتتوقف أدنى، فيبقى أمامك 30–40 دقيقة سيراً عبر الغابة. بعد المطر تلين أرضية الطريق وتمتلئ بالأخاديد،
    فيكون الدفع الرباعي الخيار الأسلم. املأ الخزان في غوري أو كاريلي قبل مغادرة الطريق الرئيسي.
