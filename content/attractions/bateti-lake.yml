ka:
  name: ბატეთის ტბა
  short: პატარა მეწყრული ტბა ძამის ხეობის ტყეში, 1313 მეტრზე — საქართველოს ერთ-ერთი ყველაზე ფოტოგენური
    შემოდგომის ადგილი, როცა წიფლნარი წითლდება და მწვანე წყალში ირეკლება.
  body: >-
    **ბატეთის ტბა შემოდგომაზე საქართველოს ერთ-ერთ ყველაზე ფოტოგენურ ადგილად იქცევა.** პატარა ტბა — მხოლოდ
    0.02 კმ², მაქსიმალური სიღრმით 12 მეტრი — მდინარე ბატეთისწყალზე მეწყერმა შექმნა, ძამის ხეობის ზემო
    წელის ტყიან კალთებზე, ქარელის მუნიციპალიტეტში, სოფელ კოდმანთან, ზღვის დონიდან 1313 მეტრზე.


    ოქტომბრის ბოლოს აქ განსაკუთრებული სანახაობაა: წიფლნარი ჟოლოსფრად და ალისფრად იღებება და უძრავ მომწვანო
    წყალში სარკესავით ირეკლება, წყლიდან კი გამხმარი ხეების ტანები ამოშვერილა — სწორედ ეს კადრი აქცევს
    ბატეთს ფოტოგრაფების სალოცავად. ტბა ბუნებისთვისაც ფასეულია: აქ ბინადრობს ზოლიანი ტრიტონი, გადაშენების
    საფრთხესთან მიახლოებული სახეობა.


    ინფრასტრუქტურა არ არსებობს — არც კაფე, არც მაღაზია, არც ტუალეტი. ეს პიკნიკისა და ფოტოაპარატის ადგილია:
    წაიღე საბანი, საჭმელი და დრო. გზად ძამის ხეობა თავად ღირს ნახვად — მონასტრები და სოფლები ერთმანეთს
    მისდევს, ხოლო კინწვისის მონასტრის ფრესკებთან დაწყვილება ამ დღეს სრულყოფილს ხდის.
  tip: >-
    პიკი ოქტომბრის ბოლოა — ფოთოლცვენის ფერებისთვის ორკვირიანი ფანჯარა გაითვალისწინე და ამინდს დააკვირდი.
    ჩვეულებრივი მანქანით ქვემოთ გაჩერდები და ბოლო ტყის კილომეტრს-ორს ფეხით გაივლი (30–40 წუთი) — მშრალი
    საფეხმავლო ფეხსაცმელი გქონდეს. ნაგავი უკან წაიღე: ტბას მოვლა-პატრონობა თითქმის არ აქვს. ზამთარში
    გზა ხშირად გაუვალია — მაისიდან ოქტომბრამდე დაგეგმე ვიზიტი.
  route: >-
    თბილისიდან ავტობანით ქარელამდე, შემდეგ ძამის ხეობის გზით სამხრეთისკენ — მონასტრებსა და სოფლებზე გავლით.
    ასფალტი ხეობაში მალე გრუნტად იქცევა: სულ 115 კმ და დაახლოებით 2:15. მაღალი კლირენსის ჯიპი ყველაზე
    ახლოს მიგიყვანს ტბასთან; ჩვეულებრივი სედანი უფრო ქვემოთ ჩერდება და ბოლო მონაკვეთი ტყის ბილიკით ფეხით
    ივლება (30–40 წუთი). წვიმების შემდეგ გრუნტი რბილდება — 4x4-ს მიენდე.
en:
  name: Bateti Lake
  short: A tiny landslide-dammed lake in the forested Dzama valley at 1,313 m — one of Georgia's most
    photogenic autumn spots, when the beech forest turns crimson over green water.
  body: >-
    **In autumn, Bateti Lake becomes one of the most photogenic places in Georgia.** The tiny lake — just
    0.02 km², with a maximum depth of 12 metres — was formed by a landslide damming the Batetistskali
    stream, on the forested slopes of the upper Dzama valley in Kareli Municipality, near the village
    of Kodmani, at 1,313 metres above sea level.


    Late October is the show: the beech forest turns crimson and scarlet and mirrors itself in the still,
    green water, while the trunks of dead trees rise straight out of the lake — the image that has made
    Bateti a pilgrimage site for photographers. The lake matters to naturalists too: it is a habitat of
    the banded newt, a near-threatened species.


    There are no facilities at all — no café, no shop, no toilets. This is a picnic-and-photography destination:
    bring a blanket, food and time. The drive itself rewards: the Dzama gorge road strings together monasteries
    and villages, and pairing the lake with the frescoes of Kintsvisi Monastery makes the day complete.
  tip: >-
    Peak color is late October — the foliage window lasts about two weeks, so watch the weather. In an
    ordinary car you will park lower down and walk the final forest kilometre or two (30–40 minutes),
    so bring dry walking shoes. Pack out your rubbish: the lake has almost no upkeep. In winter the road
    is often impassable — plan the visit between May and October.
  route: >-
    From Tbilisi take the highway to Kareli, then turn south onto the Dzama valley road, past monasteries
    and villages. The asphalt soon gives way to gravel in the gorge: about 115 km and 2:15 in total. A
    high-clearance SUV gets you closest to the lake; an ordinary sedan stops lower down, leaving the last
    stretch as a 30–40 minute forest walk. After rain the surface turns soft — trust a 4x4.
ru:
  name: Озеро Батети
  short: Крошечное завальное озеро в лесистой Дзамской долине на высоте 1313 м — одно из самых фотогеничных
    осенних мест Грузии, когда буковый лес багровеет над зелёной водой.
  body: >-
    **Осенью озеро Батети становится одним из самых фотогеничных мест Грузии.** Крошечное озеро — всего
    0,02 км² при максимальной глубине 12 метров — образовалось, когда оползень перегородил речку Батетисцкали
    на лесистых склонах верхней Дзамской долины в Карельском муниципалитете, у села Кодмани, на высоте
    1313 метров над уровнем моря.


    Конец октября — главное представление: буковый лес окрашивается в багровые и алые тона и зеркально
    отражается в неподвижной зелёной воде, а из озера поднимаются стволы мёртвых деревьев — тот самый
    кадр, который сделал Батети местом паломничества фотографов. Озеро ценно и для натуралистов: здесь
    обитает малоазиатский тритон — вид, близкий к уязвимому положению.


    Инфраструктуры нет никакой — ни кафе, ни магазина, ни туалета. Это место для пикника и фотоаппарата:
    берите плед, еду и время. Сама дорога — отдельная награда: путь по Дзамскому ущелью нанизывает монастыри
    и сёла, а в паре с фресками монастыря Кинцвиси день складывается полностью.
  tip: >-
    Пик красок — конец октября; окно листопада длится около двух недель, следите за погодой. На обычной
    машине вы остановитесь ниже и пройдёте последние километр-два леса пешком (30–40 минут) — возьмите
    сухую обувь для ходьбы. Мусор увозите с собой: за озером почти никто не ухаживает. Зимой дорога часто
    непроезжая — планируйте визит с мая по октябрь.
  route: >-
    Из Тбилиси по автомагистрали до Карели, затем на юг по дороге Дзамского ущелья, мимо монастырей и
    сёл. Асфальт в ущелье вскоре сменяется гравием: всего около 115 км и 2:15. Внедорожник с высоким клиренсом
    подвезёт ближе всего к озеру; обычный седан останавливается ниже, и последний отрезок проходится пешком
    по лесной тропе (30–40 минут). После дождей грунт раскисает — доверьтесь 4x4.
fa:
  name: دریاچهٔ باتتی
  short: دریاچه‌ای کوچک حاصل زمین‌لغزش در درهٔ جنگلی دزاما در ارتفاع 1,313 متر — از عکاسانه‌ترین مقاصد
    پاییزی گرجستان، وقتی جنگل راش بر فراز آب سبز سرخ می‌شود.
  body: >-
    **در پاییز، دریاچهٔ باتتی به یکی از عکاسانه‌ترین جاهای گرجستان بدل می‌شود.** این دریاچهٔ کوچک — تنها
    0.02 کیلومتر مربع با ژرفای بیشینهٔ 12 متر — وقتی پدید آمد که زمین‌لغزشی جلوی رود باتتیس‌تسکالی را
    بست؛ بر دامنه‌های جنگلی بالادست درهٔ دزاما در شهرستان کارلی، نزدیک روستای کودمانی، در ارتفاع 1,313
    متر از سطح دریا.


    اواخر اکتبر وقت نمایش است: جنگل راش به سرخی و ارغوان درمی‌آید و در آب سبز و بی‌جنبش آینه‌وار می‌نشیند،
    و تنه‌های درختان خشکیده یکراست از دل دریاچه بیرون زده‌اند — همان قابی که باتتی را زیارتگاه عکاسان
    کرده است. دریاچه برای طبیعت‌دوستان هم ارزشمند است: زیستگاه سمندر نواری است، گونه‌ای نزدیک به تهدید.


    هیچ امکاناتی وجود ندارد — نه کافه، نه فروشگاه، نه سرویس بهداشتی. اینجا مقصد پیک‌نیک و عکاسی است: زیرانداز،
    خوراک و وقت با خود ببرید. خود راه هم پاداش است: جادهٔ تنگهٔ دزاما صومعه‌ها و روستاها را پشت هم می‌چیند
    و همراه کردن دریاچه با دیوارنگاره‌های صومعهٔ کینتسویسی روز را کامل می‌کند.
  tip: >-
    اوج رنگ‌ها اواخر اکتبر است؛ پنجرهٔ برگ‌ریزان حدود دو هفته می‌پاید، پس هوا را زیر نظر بگیرید. با خودروی
    معمولی پایین‌تر پارک می‌کنید و یکی-دو کیلومتر پایانی جنگل را پیاده می‌روید (30 تا 40 دقیقه) — کفش
    پیاده‌روی خشک همراه داشته باشید. زباله‌تان را برگردانید: دریاچه تقریباً هیچ نگهداری‌ای ندارد. در زمستان
    راه اغلب بسته است — سفر را بین مه تا اکتبر برنامه‌ریزی کنید.
  route: >-
    از تفلیس با بزرگراه تا کارلی، سپس به سمت جنوب در جادهٔ درهٔ دزاما، از کنار صومعه‌ها و روستاها. آسفالت
    در تنگه به‌زودی به شن بدل می‌شود: روی هم حدود 115 کیلومتر و 2:15. شاسی‌بلند با کلیرنس بالا شما را
    نزدیک‌ترین نقطه به دریاچه می‌رساند؛ سدان معمولی پایین‌تر می‌ماند و تکهٔ آخر با پیاده‌روی جنگلی 30
    تا 40 دقیقه‌ای طی می‌شود. پس از باران زمین نرم می‌شود — به 4x4 اعتماد کنید.
he:
  name: אגם באטטי
  short: אגם זעיר שנוצר ממפולת בעמק דזאמה המיוער בגובה 1,313 מטר — מיעדי הסתיו המצולמים ביותר בגאורגיה,
    כשיער האשור מאדים מעל מים ירוקים.
  body: >-
    **בסתיו הופך אגם באטטי לאחד המקומות הפוטוגניים ביותר בגאורגיה.** האגם הזעיר — 0.02 קמ״ר בלבד, בעומק
    מרבי של 12 מטר — נוצר כשמפולת אדמה סכרה את נחל באטטיסצקאלי, על המדרונות המיוערים של עמק דזאמה העליון
    בנפת קארלי, ליד הכפר קודמאני, בגובה 1,313 מטר מעל פני הים.


    סוף אוקטובר הוא ההצגה: יער האשור לובש ארגמן ושני ומשתקף כמראה במים הירוקים והדוממים, וגזעי עצים מתים
    מזדקרים היישר מתוך האגם — התמונה שהפכה את באטטי לאתר עלייה לרגל של צלמים. האגם חשוב גם לחובבי טבע:
    הוא בית גידול של הטריטון הפסים, מין קרוב לסיכון.


    אין שום מתקנים — לא בית קפה, לא חנות, לא שירותים. זהו יעד של פיקניק וצילום: הביאו שמיכה, אוכל וזמן.
    גם הנסיעה עצמה מתגמלת: דרך ערוץ הדזאמה משחילה מנזרים וכפרים, ושילוב האגם עם ציורי הקיר של מנזר קינצוויסי
    משלים את היום.
  tip: >-
    שיא הצבעים בסוף אוקטובר; חלון השלכת נמשך כשבועיים, אז עקבו אחרי מזג האוויר. ברכב רגיל תחנו נמוך יותר
    ותלכו את הקילומטר-שניים האחרונים ביער ברגל (30–40 דקות) — קחו נעלי הליכה יבשות. קחו את האשפה חזרה
    איתכם: לאגם אין כמעט תחזוקה. בחורף הדרך לרוב אינה עבירה — תכננו את הביקור בין מאי לאוקטובר.
  route: >-
    מטביליסי בכביש המהיר עד קארלי, ואז דרומה בדרך עמק הדזאמה, לאורך מנזרים וכפרים. האספלט בערוץ מתחלף
    מהר בכורכר: בסך הכול כ-115 ק״מ ו-2:15. רכב שטח גבוה יביא אתכם הכי קרוב לאגם; סדאן רגיל עוצר נמוך יותר,
    והקטע האחרון נעשה בהליכת יער של 30–40 דקות. אחרי גשם הקרקע מתרככת — סמכו על 4x4.
ar:
  name: بحيرة باتيتي
  short: بحيرة صغيرة نشأت عن انهيار أرضي في وادي دزاما الحرجي على ارتفاع 1,313 متراً — من أكثر وجهات الخريف
    تصويرية في جورجيا حين يحمرّ غاب الزان فوق الماء الأخضر.
  body: >-
    **في الخريف تغدو بحيرة باتيتي من أكثر الأماكن تصويريةً في جورجيا.** هذه البحيرة الصغيرة — 0.02 كم²
    فقط بعمق أقصاه 12 متراً — نشأت حين سدّ انهيار أرضي مجرى نهر باتيتيستسكالي، على السفوح الحرجية لأعالي
    وادي دزاما في بلدية كاريلي قرب قرية كودماني، على ارتفاع 1,313 متراً فوق سطح البحر.


    وأواخر أكتوبر هو موعد العرض: يكتسي غاب الزان بالقرمزي والأحمر القاني وينعكس كالمرآة في الماء الأخضر
    الساكن، فيما تنتصب جذوع الأشجار الميتة من قلب البحيرة — وهي الصورة التي جعلت من باتيتي مزاراً للمصورين.
    وللبحيرة قيمة طبيعية أيضاً: فهي موئل سمندل الماء المخطط، وهو نوع قريب من التهديد.


    لا خدمات على الإطلاق — لا مقهى ولا متجر ولا مراحيض. هذه وجهة نزهة وتصوير: خذ بطانية وطعاماً ووقتاً.
    والطريق نفسه مكافأة: يصفّ طريق مضيق دزاما الأديرة والقرى واحدة تلو الأخرى، وإقران البحيرة بجداريات
    دير كينتسفيسي يجعل اليوم مكتملاً.
  tip: >-
    ذروة الألوان أواخر أكتوبر؛ ونافذة تساقط الأوراق تدوم نحو أسبوعين، فراقب الطقس. بسيارة عادية ستركن
    في الأسفل وتمشي الكيلومتر أو الكيلومترين الأخيرين في الغابة (30 إلى 40 دقيقة) — خذ حذاء مشي جافاً.
    أعد نفاياتك معك: فالبحيرة تكاد تخلو من أي صيانة. وفي الشتاء كثيراً ما يتعذر الطريق — خطط للزيارة بين
    مايو وأكتوبر.
  route: >-
    من تبليسي عبر الطريق السريع حتى كاريلي، ثم جنوباً على طريق وادي دزاما مروراً بالأديرة والقرى. يتحول
    الأسفلت في المضيق سريعاً إلى حصى: الإجمالي نحو 115 كم وساعتان وربع. سيارة دفع رباعي مرتفعة توصلك إلى
    أقرب نقطة من البحيرة؛ أما السيدان العادية فتتوقف أدنى، ويُقطع المقطع الأخير مشياً في الغابة 30 إلى
    40 دقيقة. بعد الأمطار تلين الأرض — فاعتمد على الدفع الرباعي.
