ka:
  name: ახტალის ტალახის აბაზანები
  short: >-
    გურჯაანის შუაგულში მიწა თბილ, ნაცრისფერ ტალახს ამოსცემს: 1920 წლიდან აქ ბალნეოლოგიური კურორტია, ოქტომბრობით
    კი ქვეყნის უდიდესი ღვინის ფესტივალი.
  body: >-
    **გურჯაანის შუაგულში მიწა სუნთქავს: აირის ბუშტუკებით ამოძრავებული თბილი, ნაცრისფერი ტალახი ქვემოდან
    ამოდის და ადამიანები მას დასნეულებულ სახსრებს ორ საუკუნეზე მეტია ანდობენ.**


    ეს კახეთის ახტალაა — არ აგერიოთ ჩრდილოეთ სომხეთის ახტალასა და მის მონასტერში. ტალახის სათავეს ადგილობრივები
    მიძინებული ვულკანის კრატერს უწოდებენ: ქალაქის დიდების მემორიალის უმაღლესი წერტილიდან ის მწვანე, შემაღლებულ
    ბორცვად მოჩანს. სულ მცირე XVIII საუკუნიდან ექიმები ამ ტალახს ართრიტისა და ლიმფური სისტემის დაავადებების
    დროს უნიშნავდნენ.


    1920 წელს ტალახის ორმოები ოფიციალურ ბალნეოლოგიურ კურორტად იქცა — წყალტუბოს, საირმისა და აბასთუმნის
    მსგავსად. მათ გვერდით სამკურნალო კორპუსი აშენდა, ცოტა მოგვიანებით კი — სანატორიუმი. შესასვლელს დღესაც
    საბჭოთა ქანდაკება დარაჯობს: ქალი ყურძნის მტევნით ხელში, თავსაბურავზე კი კადუცეუსი, მედიცინის ნიშანი.
    მკურნალობა და ვაზი — ერთ ფიგურაში.


    დღეს კურორტი „ახტალა სპას“ სახელით მუშაობს, ტალახის პროცედურები კი ცალკე ოთახებში ტარდება. ორმოები
    უსაფრთხოებისთვის შემოღობილია, მაგრამ ირგვლივ თავისუფლად შემოივლით და ტალახის მუშაობას თვალითაც დაინახავთ
    და ცხვირითაც იგრძნობთ. მათ გარშემო გაშენებული ტყე-პარკი მთელი წლის განმავლობაში ღიაა, ყოველ ოქტომბერს
    კი აქ გურჯაანის ღვინის ფესტივალი იმართება; 2024 წელს მას 30 000-ზე მეტი ადამიანი დაესწრო, რითაც ის
    საქართველოს უდიდეს ღვინის ფესტივალად იქცა.


    გურჯაანში წამალს მიწა იძლევა, მისი საჭიროების მიზეზს კი ყოველ ოქტომბერს — ვენახები.
  tip: >-
    პარკი და შემოღობილი ორმოები სანახავად უფასოა; პროცედურები თავად სპაში იჯავშნება და იქვე იხდება, ფასები
    კი ადგილზე დააზუსტეთ — კურორტს ცოტა ხნის წინ მფლობელი შეეცვალა და განახლება დაიწყო, ამიტომ წინასწარ
    გაარკვიეთ, რა მუშაობს. თან წაიღეთ ძველი საცურაო კოსტიუმი და პირსახოცი, რომლის გასვრაც არ დაგენანებათ;
    ერთი საათი საკმარისია. ტალახით მკურნალობა ყველასთვის არ არის: გულის პრობლემების, მაღალი წნევის ან
    ორსულობის შემთხვევაში ჯერ ექიმს ჰკითხეთ. კაფეები, მაღაზიები და ბენზინგასამართი გურჯაანშია, ორგუმბათიანი
    ყველაწმინდის ეკლესია კი დაახლოებით ორ კილომეტრშია.
  route: >-
    თბილისიდან ს5-ით (კახეთის გზატკეცილი) აღმოსავლეთით, საგარეჯოსა და ბადიაურის გავლით ბაკურციხემდე იარეთ,
    შემდეგ შ42-ით ჩრდილოეთით გურჯაანში შედით. სპა და მისი პარკი ქალაქის ცენტრშია: მანქანა ქუჩაზე დააყენეთ
    და ჭიშკრამდე მოკლე, სწორი გზა ფეხით გაიარეთ. სულ დაახლოებით 103 კილომეტრი და საათი და ორმოცდახუთი
    წუთი, მთელ გზაზე კარგი ასფალტით. ეკონომკლასის მანქანა ნებისმიერ სეზონზე სავსებით საკმარისია. საწვავი,
    მაღაზიები და კაფეები თავად გურჯაანშია. აქედან ყველაწმინდა ხელის გაწვდენაზეა, შემდეგ კი ბუნებრივად
    სიღნაღისკენ ან თელავისკენ გააგრძელებთ.
en:
  name: Akhtala Mud Baths
  short: >-
    Warm grey mud wells up in the middle of Gurjaani: a mud-cure resort since 1920, and every October
    the grounds of Georgia's biggest wine festival.
  body: >-
    **In the middle of Gurjaani the ground breathes: warm grey mud oozes up from below, pushed by bubbling
    gas, and people have trusted it with aching joints for more than two centuries.**


    This is the Akhtala of Kakheti, not to be confused with Akhtala in northern Armenia and its monastery.
    Locals describe the source as a dormant volcanic crater; from the highest point of the town's Memorial
    of Glory it shows as a raised green mound. From at least the 18th century doctors prescribed its mud
    for arthritic joints and lymphatic complaints.


    In 1920 the mud pits became a formal balneological resort, in the same family as the spa towns of
    Tskaltubo, Sairme and Abastumani. A treatment centre went up beside them, and a sanatorium hotel soon
    after. A Soviet statue still keeps the entrance: a woman holding a bunch of grapes, the caduceus of
    medicine on her headdress. Healing and the vine, in a single figure.


    Today the resort works as Akhtala Spa, with private rooms for mud treatments. The pits are fenced
    for safety, but you can walk right round them and see, and smell, the mud at work. The wooded park
    around them is open all year, and each October it hosts the Gurjaani Wine Festival; in 2024 it drew
    more than 30,000 people, making it the largest wine festival in Georgia.


    In Gurjaani the earth supplies the cure, and every October the vineyards supply the reason for needing
    one.
  tip: >-
    The park and the fenced pits are free to walk round; treatments are booked and paid at the spa itself.
    Check prices there, and ask what is open before you plan around it: the resort has recently changed
    hands and gone into refurbishment. Bring an old swimsuit and a towel you will not mind staining, and
    allow about an hour. Mud treatments are not for everyone: with heart trouble, high blood pressure
    or pregnancy, ask a doctor first. Cafés, shops and fuel are all in Gurjaani, and the two-domed church
    of Kvelatsminda is about 2 km away.
  route: >-
    From Tbilisi take the Kakheti Highway (S5) east past Sagarejo and Badiauri to Bakurtsikhe, then turn
    north on the Sh42 into Gurjaani. The spa and its park lie in the centre of town: park on the street
    and walk a short, flat distance to the gates. That makes about 103 km and an hour and three-quarters,
    on good asphalt the whole way. An economy car is entirely sufficient in any season. Fuel, shops and
    cafés are in Gurjaani itself. Kvelatsminda is a short hop from here, and Sighnaghi or Telavi make
    natural next stops.
ru:
  name: Грязевой курорт Ахтала
  short: >-
    Тёплая серая грязь выходит из-под земли посреди Гурджаани: грязелечебница с 1920 года, а в октябре
    — крупнейший винный фестиваль Грузии.
  body: >-
    **Посреди Гурджаани земля дышит: тёплая серая грязь, подталкиваемая пузырьками газа, сочится из глубины,
    и уже больше двух веков люди доверяют ей свои ноющие суставы.**


    Это кахетинская Ахтала — не путать с Ахталой на севере Армении и её монастырём. Местные называют источник
    спящим вулканическим кратером; с самой высокой точки городского Мемориала Славы он виден как приподнятый
    зелёный холм. По меньшей мере с XVIII века врачи назначали здешнюю грязь при артритах и лимфатических
    недугах.


    В 1920 году грязевые ямы стали официальным бальнеологическим курортом — из той же семьи, что и Цхалтубо,
    Саирме и Абастумани. Рядом вырос лечебный корпус, а вскоре и гостиница-санаторий. Вход по-прежнему
    охраняет советская статуя: женщина с гроздью винограда в руках, на её головном уборе — кадуцей, символ
    медицины. Врачевание и лоза в одной фигуре.


    Сегодня курорт работает как «Ахтала Спа», с отдельными кабинетами для грязевых процедур. Ямы огорожены
    ради безопасности, но их можно обойти кругом и увидеть — и учуять, — как работает грязь. Лесистый
    парк вокруг открыт круглый год, а каждый октябрь в нём проходит Гурджаанский винный фестиваль; в 2024
    году он собрал больше 30 000 человек — это крупнейший винный фестиваль Грузии.


    В Гурджаани лекарство даёт земля, а повод в нём нуждаться каждый октябрь дают виноградники.
  tip: >-
    Парк и огороженные ямы можно обойти бесплатно; процедуры бронируют и оплачивают в самом спа. Цены
    уточняйте там же и заранее спросите, что работает: курорт недавно сменил владельца и находится на
    реконструкции. Возьмите старый купальник и полотенце, которое не жалко испачкать, и заложите около
    часа. Грязевые процедуры подходят не всем: при болезнях сердца, повышенном давлении или беременности
    сначала посоветуйтесь с врачом. Кафе, магазины и заправки — в Гурджаани, а двухкупольная церковь Квелацминда
    примерно в 2 км.
  route: >-
    Из Тбилиси поезжайте на восток по Кахетинскому шоссе (S5) мимо Сагареджо и Бадиаури до Бакурцихе,
    затем сверните на север по Sh42 в Гурджаани. Спа и парк — в центре города: оставьте машину на улице
    и пройдите короткий ровный путь до ворот. Всего около 103 км и час сорок пять минут, по хорошему асфальту
    на всём пути. Машины эконом-класса хватит в любое время года. Топливо, магазины и кафе — в самом Гурджаани.
    До Квелацминды отсюда рукой подать, а Сигнахи или Телави — естественные следующие остановки.
fa:
  name: حمام‌های گِل آختالا
  short: >-
    گِل گرم و خاکستری در میانهٔ گورجانی از زمین بیرون می‌آید: استراحتگاه گِل‌درمانی از ۱۹۲۰، و هر اکتبر
    محوطهٔ بزرگ‌ترین جشنوارهٔ شراب گرجستان.
  body: >-
    **در میانهٔ گورجانی زمین نفس می‌کشد: گِل گرم و خاکستری، که حباب‌های گاز آن را به بالا می‌رانند، از
    ژرفا بیرون می‌تراود، و مردم بیش از دو سده است که مفصل‌های دردمندشان را به آن می‌سپارند.**


    این آختالای کاختی است، که نباید آن را با آختالا در شمال ارمنستان و صومعه‌اش اشتباه گرفت. مردم محل
    سرچشمه را دهانهٔ آتشفشانی خفته‌ای می‌دانند؛ از بلندترین نقطهٔ «یادمان افتخار» شهر، به شکل پشته‌ای
    سبز و برآمده دیده می‌شود. دست‌کم از سدهٔ هجدهم، پزشکان گِل آن را برای آرتریت و بیماری‌های لنفاوی تجویز
    می‌کردند.


    در ۱۹۲۰ گودال‌های گِل رسماً به استراحتگاهی درمانی با آب و گِل معدنی بدل شد، از همان خانوادهٔ شهرهای
    درمانی تسخالتوبو، سایرمه و آباستومانی. کنار آن مرکزی درمانی ساخته شد و اندکی بعد هتلی آسایشگاهی. مجسمه‌ای
    از دوران شوروی هنوز نگهبان ورودی است: زنی با خوشه‌ای انگور در دست، و بر سرپوشش عصای کادوسئوس، نماد
    پزشکی. درمان و تاک، در یک پیکره.


    امروز این استراحتگاه با نام «آختالا اسپا» کار می‌کند و اتاق‌های خصوصی برای گِل‌درمانی دارد. گودال‌ها
    برای ایمنی حصارکشی شده‌اند، اما می‌توانید دورتادورشان قدم بزنید و کار گِل را ببینید — و بو کنید. پارک
    جنگلیِ پیرامونشان در همهٔ سال باز است و هر اکتبر میزبان جشنوارهٔ شراب گورجانی است؛ در ۲۰۲۴ بیش از
    ۳۰,۰۰۰ نفر به آن آمدند و همین آن را بزرگ‌ترین جشنوارهٔ شراب گرجستان می‌کند.


    در گورجانی درمان را زمین می‌دهد، و هر اکتبر تاکستان‌ها بهانهٔ نیاز به آن را.
  tip: >-
    قدم زدن در پارک و دور گودال‌های حصاردار رایگان است؛ درمان‌ها را در خود اسپا رزرو و پرداخت می‌کنند.
    قیمت‌ها را همان‌جا بپرسید، و پیش از برنامه‌ریزی جویا شوید چه بخش‌هایی باز است: استراحتگاه به‌تازگی
    دست‌به‌دست شده و در حال نوسازی است. مایوی کهنه و حوله‌ای بیاورید که لکه‌دار شدنش برایتان مهم نباشد،
    و حدود یک ساعت وقت بگذارید. گِل‌درمانی برای همه مناسب نیست: اگر بیماری قلبی یا فشار خون بالا دارید
    یا باردارید، اول با پزشک مشورت کنید. کافه، فروشگاه و پمپ بنزین همه در گورجانی است، و کلیسای دوگنبدی
    کوِلاتسمیندا حدود ۲ کیلومتر فاصله دارد.
  route: >-
    از تفلیس بزرگراه کاختی (S5) را به سوی شرق بگیرید و از ساگارجو و بادیائوری بگذرید تا باکورتسیخه، سپس
    با Sh42 به شمال بپیچید و وارد گورجانی شوید. اسپا و پارکش در مرکز شهرند: خودرو را کنار خیابان پارک
    کنید و مسیری کوتاه و هموار را تا دروازه پیاده بروید. روی هم حدود ۱۰۳ کیلومتر و یک ساعت و سه‌ربع، سراسر
    روی آسفالت خوب. خودروی اقتصادی در هر فصلی کاملاً کافی است. سوخت، فروشگاه و کافه در خود گورجانی است.
    کوِلاتسمیندا از اینجا فاصلهٔ کوتاهی دارد، و سیغناغی یا تلاوی ایستگاه‌های طبیعیِ بعدی‌اند.
he:
  name: אמבטיות הבוץ של אחטלה
  short: >-
    בוץ אפור וחמים עולה מן האדמה בלב גורג'אני: אתר מרפא בבוץ מאז 1920, ובכל אוקטובר גם מתחם פסטיבל היין
    הגדול בגאורגיה.
  body: >-
    **בלב גורג'אני האדמה נושמת: בוץ אפור וחמים מחלחל מלמטה, נדחף מעלה בבועות גז, וכבר יותר ממאתיים שנה
    אנשים מפקידים בידיו מפרקים כואבים.**


    זוהי אחטלה של קאחתי, ואין לבלבל אותה עם אחטלה שבצפון ארמניה ועם המנזר שלה. המקומיים מתארים את המקור
    כלוע געשי רדום; מהנקודה הגבוהה ביותר של אנדרטת התהילה בעיר הוא נראה כתלולית ירוקה ובולטת. לפחות מהמאה
    ה-18 רשמו רופאים את הבוץ שלו לדלקת מפרקים ולבעיות לימפה.


    ב-1920 הפכו בורות הבוץ לאתר מרפא רשמי של מרחצאות ובוץ מינרלי, מאותה משפחה של עיירות המרפא צחלטובו,
    סאירמה ואבסטומני. לצדם הוקם מרכז טיפולים, וזמן קצר אחר כך גם מלון-סנטוריום. פסל סובייטי עדיין שומר
    על הכניסה: אישה אוחזת אשכול ענבים, ועל כיסוי ראשה מטה הקדוקאוס, סמל הרפואה. ריפוי וגפן בדמות אחת.


    כיום פועל המקום בשם „אחטלה ספא“, עם חדרים פרטיים לטיפולי בוץ. הבורות מגודרים מטעמי בטיחות, אבל אפשר
    להקיף אותם ברגל ולראות — ולהריח — את הבוץ בפעולה. הפארק המיוער שסביבם פתוח כל השנה, ובכל אוקטובר מתקיים
    בו פסטיבל היין של גורג'אני; ב-2024 הגיעו אליו יותר מ-30,000 איש, וכך הוא פסטיבל היין הגדול ביותר בגאורגיה.


    בגורג'אני האדמה מספקת את התרופה, ובכל אוקטובר הכרמים מספקים את הסיבה להזדקק לה.
  tip: >-
    ההליכה בפארק ומסביב לבורות המגודרים היא בחינם; את הטיפולים מזמינים ומשלמים בספא עצמו. בדקו את המחירים
    שם, ושאלו מה פתוח לפני שאתם בונים על כך: המקום עבר לאחרונה לבעלים חדשים ונמצא בשיפוץ. הביאו בגד ים
    ישן ומגבת שלא אכפת לכם שתוכתם, והקצו כשעה. טיפולי בוץ אינם מתאימים לכולם: אם יש לכם בעיות לב או לחץ
    דם גבוה, או אם את בהריון, התייעצו קודם עם רופא. בתי קפה, חנויות ודלק יש בגורג'אני, והכנסייה הדו-כיפתית
    קוולצמינדה נמצאת במרחק כ-2 ק"מ.
  route: >-
    מטביליסי קחו את כביש קאחתי (S5) מזרחה, על פני סגרג'ו ובדיאורי, עד בקורציחה, ואז פנו צפונה בכביש Sh42
    אל גורג'אני. הספא והפארק שלו נמצאים במרכז העיר: חנו ברחוב ולכו מרחק קצר ומישורי עד השערים. בסך הכול
    כ-103 ק"מ ושעה ושלושה רבעים, על אספלט טוב לכל האורך. רכב חסכוני מספיק בהחלט בכל עונה. דלק, חנויות
    ובתי קפה יש בגורג'אני עצמה. קוולצמינדה במרחק קפיצה מכאן, וסיגנאגי או טלאווי הן התחנות הטבעיות הבאות.
ar:
  name: حمّامات الطين في أختالا
  short: >-
    طين رمادي دافئ ينبثق من الأرض في قلب غورجاني: منتجع للعلاج بالطين منذ 1920، وفي كل أكتوبر ساحةٌ لأكبر
    مهرجان للنبيذ في جورجيا.
  body: >-
    **في قلب غورجاني تتنفّس الأرض: طين رمادي دافئ يرشح من الأعماق تدفعه فقاعات الغاز، وقد ائتمنه الناس
    على مفاصلهم الموجوعة منذ أكثر من قرنين.**


    هذه أختالا الكاختية، ولا ينبغي الخلط بينها وبين أختالا في شمال أرمينيا وديرها. يصف السكان المصدر بأنه
    فوهة بركانية هاجعة؛ ومن أعلى نقطة في «نصب المجد» بالمدينة يبدو ربوةً خضراء ناتئة. ومنذ القرن الثامن
    عشر على الأقل كان الأطباء يصفون طينه لالتهاب المفاصل وأمراض الجهاز اللمفاوي.


    في عام 1920 تحوّلت حفر الطين إلى منتجع رسمي للاستشفاء بالمياه والطين المعدني، من العائلة نفسها التي
    تضم بلدات الاستشفاء تسخالتوبو وسايرمه وأباستوماني. وأُقيم بجانبها مركز للعلاج، ثم بعد قليل فندقٌ مصحّة.
    ولا يزال تمثال سوفييتي يحرس المدخل: امرأة تحمل عنقود عنب، وعلى غطاء رأسها عصا الكادوسيوس، رمز الطب.
    الشفاء والكرمة في تمثال واحد.


    واليوم يعمل المنتجع باسم «أختالا سبا»، وفيه غرف خاصة للعلاج بالطين. الحفر مسيّجة حفاظًا على السلامة،
    لكن يمكنك أن تطوف حولها وترى الطين وهو يعمل — وتشمّه أيضًا. الحديقة المشجّرة المحيطة بها مفتوحة طوال
    العام، وفي كل أكتوبر تستضيف مهرجان غورجاني للنبيذ؛ وفي عام 2024 استقطب أكثر من 30,000 زائر، ما يجعله
    أكبر مهرجان للنبيذ في جورجيا.


    في غورجاني تمنح الأرض الدواء، وفي كل أكتوبر تمنح الكروم سببًا للحاجة إليه.
  tip: >-
    التجوّل في الحديقة وحول الحفر المسيّجة مجاني؛ أما العلاجات فتُحجز وتُدفع في المنتجع نفسه. استفسر عن
    الأسعار هناك، واسأل عمّا هو مفتوح قبل أن تبني خطتك عليه: فقد انتقل المنتجع مؤخرًا إلى مالك جديد ودخل
    مرحلة تجديد. احمل ثوب سباحة قديمًا ومنشفة لا تمانع أن تتلطخ، وخصّص نحو ساعة. العلاج بالطين لا يناسب
    الجميع: فعلى من يعاني من مشكلات في القلب أو ارتفاع ضغط الدم، وعلى الحوامل، استشارة الطبيب أولًا. المقاهي
    والمتاجر ومحطات الوقود كلها في غورجاني، وكنيسة كفيلاتسميندا ذات القبتين على بُعد نحو 2 كم.
  route: >-
    من تبليسي خذ طريق كاختي السريع (S5) شرقًا متجاوزًا ساغاريجو وبادياوري حتى باكورتسيخي، ثم انعطف شمالًا
    على Sh42 إلى غورجاني. يقع المنتجع وحديقته في وسط البلدة: اركن سيارتك في الشارع وامشِ مسافة قصيرة مستوية
    إلى البوابة. المجموع نحو 103 كم وساعة وثلاثة أرباع الساعة، على أسفلت جيد طوال الطريق. السيارة الاقتصادية
    كافية تمامًا في كل الفصول. الوقود والمتاجر والمقاهي في غورجاني نفسها. كفيلاتسميندا على مرمى حجر من
    هنا، وسيغناغي أو تيلافي محطتان تاليتان طبيعيتان.
