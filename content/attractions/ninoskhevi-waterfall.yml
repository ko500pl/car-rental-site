ka:
  name: ნინოსხევის ჩანჩქერი
  short: რვა კილომეტრი წიფლნარში, ნაკადულების გადაკვეთით, საქართველოს უძველეს ნაკრძალში — და ბოლოს ჩანჩქერი
    ცივი აუზით.
  body: >-
    **ნინოსხევის ჩანჩქერამდე რვა კილომეტრი ტყეა, უკან კიდევ რვა — და ეს ტყე 1912 წლიდან არის დაცული, საქართველოში
    ყველაზე დიდხანს.**


    ლაგოდეხის ნაკრძალი ერთი ადამიანის დაჟინებას უნდა ვუმადლოდეთ. პოლონელი ლუდვიკ მლოკოსევიჩი 1853 წელს
    რუსეთის არმიის კავკასიურ დივიზიასთან ერთად ლაგოდეხში მოხვდა და, წლების მოგზაურობისა და გადასახლების
    შემდეგ, აქ სამუდამოდ დაბრუნდა — ბოტანიკოსი, ზოოლოგი, მკვლევარი, ბოლოს სიღნაღის მაზრის ტყეების ინსპექტორი.
    1889 წლიდან ითხოვდა ამ ტყის დაცვას; ნაკრძალი 1912 წელს გამოცხადდა, მისი გარდაცვალებიდან სამი წლის
    შემდეგ. თავად ლაგოდეხშია დაკრძალული, მის სახელს კი კავკასიური როჭო და ყვითელი იორდასალამი — Paeonia
    mlokosewitschii — ატარებს.


    ბილიკი თეთრ-წითელ-თეთრი ნიშნებითაა მონიშნული და წიფლის, რცხილისა და ნეკერჩხლის ტყეში მიიკლაკნება;
    რამდენჯერმე ნაკადულის გადალახვა მოგიწევთ. ასვლას ორიდან სამ საათამდე სჭირდება, დაშვებას — ერთიდან
    ორამდე. ბილიკის ბოლოს წყალი რამდენიმე საფეხურად ეშვება და ძირში აუზად გროვდება, რომელშიც თამამები
    ბანაობენ.


    ნაკრძალში მურა დათვი, ფოცხვერი, მგელი, კეთილშობილი ირემი, არჩვი და აღმოსავლეთკავკასიური ჯიხვი ბინადრობენ.
    ბილიკიდან მათ, სავარაუდოდ, ვერ დაინახავთ, მაგრამ იმის ცოდნა, რომ ისინი სადღაც აქვე არიან, ტყის ყოველ
    შრიალს სხვა მნიშვნელობას სძენს.
  tip: >-
    რეგისტრაცია სავალდებულო და უფასოა — ლაგოდეხის ვიზიტორთა ცენტრში; რეინჯერები ბილიკის ახლანდელ მდგომარეობასაც
    გეტყვიან. ეს სერიოზული ნახევარდღიანი ლაშქრობაა, 4–5 საათი ორივე მიმართულებით, ამიტომ დილით ადრე დაიძარით.
    ჩაიცვით მყარი, წყალგაუმტარი ფეხსაცმელი: ქვები და ფესვები სველია, ნაკადულებს ფეხით გადაკვეთთ. ტყეში
    ტკიპებია — დაბრუნების შემდეგ თავი გულდასმით შეამოწმეთ. წყალი და საჭმელი თან წაიღეთ. საუკეთესო დრო
    მაისიდან ოქტომბრამდეა; წვიმის შემდეგ ბილიკი ტალახიანი და მოლიპულია.
  route: >-
    თბილისიდან ლაგოდეხამდე დაახლოებით 160 კმ-ია — 2 სთ 40 წთ, მთელი გზა ასფალტზე. კახეთის გზატკეცილს (ს5)
    გაჰყევით საგარეჯოს, ბაკურციხისა და წნორის გავლით ლაგოდეხამდე. ვიზიტორთა ცენტრი ქალაქის ჩრდილოეთ პირასაა,
    ნიშნებით მიხვალთ. საწვავი ლაგოდეხში ჩაასხით. მანქანა ცენტრთან დატოვეთ — ჩანჩქერამდე მხოლოდ ფეხით,
    დაახლოებით 8 კმ ცალ მხარეს. ეკონომ-კლასის მანქანა ბილიკის სათავემდე უპრობლემოდ მიგიყვანთ; ტყეში ის
    აღარ დაგჭირდებათ.
en:
  name: Ninoskhevi Waterfall
  short: >-
    Eight kilometres of beech forest and stream crossings in Georgia's oldest reserve, ending at a stepped
    waterfall with a cold pool.
  body: >-
    **The waterfall at Ninoskhevi lies 8 km into the forest, and 8 km back — through woods that have been
    protected since 1912, longer than anywhere else in Georgia.**


    Lagodekhi's reserve owes its existence to one man's persistence. Ludwik Młokosiewicz, a Pole, arrived
    in Lagodekhi in 1853 with the Russian army's Caucasian Division and, after years of travel and exile,
    came back to stay — botanist, zoologist, explorer and finally Inspector of Forests for the Sighnaghi
    district. From 1889 he pressed for this forest to be protected; the reserve was declared in 1912,
    three years after his death. He is buried in Lagodekhi, and his name lives on in the Caucasian black
    grouse and the golden peony, Paeonia mlokosewitschii.


    The trail is marked white-red-white and winds through beech, hornbeam and maple, crossing streams
    more than once. Allow two to three hours up and one to two down. At the end the water drops in several
    steps into a pool at its foot, where the bold swim.


    Brown bear, lynx, wolf, red deer, chamois and East Caucasian tur all live in the reserve. You are
    unlikely to see any of them from the path, but knowing they are out there changes the way you listen
    to the forest.
  tip: >-
    Registration at the Lagodekhi visitor centre is free and mandatory, and the rangers will tell you
    the trail's current state. This is a serious half-day hike — four to five hours for the round trip
    — so start early. Wear sturdy, waterproof footwear: roots and stones stay wet, and you will wade the
    streams. Ticks live in the forest, so check yourself carefully afterwards. Carry water and food. The
    best months are May to October; after rain the path turns muddy and slippery.
  route: >-
    Lagodekhi is about 160 km from Tbilisi — roughly 2 hours 40 minutes, asphalt the whole way. Follow
    the Kakheti Highway (S5) through Sagarejo, Bakurtsikhe and Tsnori to Lagodekhi. The visitor centre
    is signposted at the northern edge of town; fill up with fuel in Lagodekhi itself. Leave the car at
    the centre — the waterfall is on foot only, about 8 km each way. An economy car reaches the trailhead
    without any trouble; in the forest you will not need it.
ru:
  name: Водопад Ниносхеви
  short: >-
    Восемь километров букового леса и бродов через ручьи в старейшем заповеднике Грузии — а в конце ступенчатый
    водопад и холодная чаша.
  body: >-
    **До водопада Ниносхеви 8 км лесом — и 8 км обратно, через лес, который охраняют с 1912 года, дольше,
    чем где-либо ещё в Грузии.**


    Лагодехский заповедник обязан своим существованием упорству одного человека. Поляк Людвик Млокосевич
    прибыл в Лагодехи в 1853 году с Кавказской дивизией русской армии и после долгих лет странствий и
    ссылки вернулся сюда навсегда — ботаник, зоолог, исследователь, а в итоге инспектор лесов Сигнахского
    уезда. С 1889 года он добивался охраны этого леса; заповедник объявили в 1912 году, через три года
    после его смерти. Он похоронен в Лагодехи, а его имя живёт в кавказском тетереве и в золотистом пионе
    Млокосевича.


    Тропа размечена бело-красно-белыми знаками и петляет среди буков, грабов и клёнов, не раз пересекая
    ручьи. На подъём закладывайте два-три часа, на спуск — час-два. В конце вода несколькими ступенями
    падает в чашу-омут у подножия, где купаются самые смелые.


    В заповеднике живут бурый медведь, рысь, волк, благородный олень, серна и восточнокавказский тур.
    С тропы вы их, скорее всего, не увидите, но само знание, что они где-то рядом, меняет то, как вы слушаете
    лес.
  tip: >-
    Регистрация в визит-центре Лагодехи бесплатная и обязательная; рейнджеры расскажут, в каком состоянии
    сейчас тропа. Это серьёзный поход на полдня — четыре-пять часов туда и обратно, — так что выходите
    рано. Наденьте крепкую непромокаемую обувь: корни и камни не просыхают, а ручьи придётся переходить
    вброд. В лесу водятся клещи, поэтому после похода внимательно осмотрите себя. Возьмите воду и еду.
    Лучшие месяцы — с мая по октябрь; после дождя тропа становится грязной и скользкой.
  route: >-
    Лагодехи — примерно в 160 км от Тбилиси, около 2 часов 40 минут, асфальт на всём пути. Следуйте по
    Кахетинскому шоссе (S5) через Сагареджо, Бакурцихе и Цнори до Лагодехи. Визит-центр обозначен указателями
    на северной окраине города; заправиться можно в самом Лагодехи. Оставьте машину у центра — к водопаду
    только пешком, около 8 км в одну сторону. Машина эконом-класса без труда доберётся до начала тропы,
    а в лесу она вам не понадобится.
fa:
  name: آبشار نینوسخوی
  short: >-
    هشت کیلومتر جنگل راش و گذر از جویبارها در کهن‌ترین ذخیره‌گاه گرجستان، که به آبشاری پلکانی با برکه‌ای
    سرد می‌رسد.
  body: >-
    **آبشار نینوسخوی ۸ کیلومتر در دل جنگل است، و ۸ کیلومتر هم راه بازگشت — از میان جنگلی که از ۱۹۱۲ حفاظت
    می‌شود، بیش از هر جای دیگری در گرجستان.**


    ذخیره‌گاه لاگودخی وجود خود را مدیون پافشاری یک مرد است. لودویک ملوکوسیه‌ویچ لهستانی در سال ۱۸۵۳ همراه
    لشکر قفقاز ارتش روسیه به لاگودخی آمد و پس از سال‌ها سفر و تبعید، برای ماندن بازگشت — گیاه‌شناس، جانورشناس،
    کاوشگر و سرانجام بازرس جنگل‌های ناحیهٔ سیغناغی. او از ۱۸۸۹ برای حفاظت از این جنگل پای فشرد؛ ذخیره‌گاه
    در ۱۹۱۲، سه سال پس از مرگش، اعلام شد. او در لاگودخی به خاک سپرده شده و نامش در سیاه‌خروس قفقازی و
    گل صدتومانی طلایی (صدتومانی ملوکوسیه‌ویچ) زنده مانده است.


    مسیر با نشانه‌های سفید-قرمز-سفید مشخص شده و از میان راش، ممرز و افرا پیچ‌وتاب می‌خورد و بیش از یک
    بار از جویبارها می‌گذرد. برای بالا رفتن دو تا سه ساعت و برای پایین آمدن یک تا دو ساعت در نظر بگیرید.
    در پایان، آب در چند پله به برکه‌ای در پای خود فرو می‌ریزد که دلیران در آن شنا می‌کنند.


    خرس قهوه‌ای، سیاه‌گوش، گرگ، گوزن قرمز، شاموا و تور قفقاز شرقی همه در این ذخیره‌گاه زندگی می‌کنند.
    بعید است از روی مسیر هیچ‌کدامشان را ببینید، اما دانستن این‌که همین نزدیکی‌اند، شیوهٔ گوش سپردنتان
    به جنگل را دگرگون می‌کند.
  tip: >-
    ثبت‌نام در مرکز بازدیدکنندگان لاگودخی رایگان و الزامی است و جنگلبانان وضعیت کنونی مسیر را به شما می‌گویند.
    این یک پیاده‌رویِ جدی و نیم‌روزه است — چهار تا پنج ساعت رفت و برگشت — پس زود راه بیفتید. کفش محکم
    و ضدآب بپوشید: ریشه‌ها و سنگ‌ها خیس می‌مانند و باید از میان آب جویبارها بگذرید. در جنگل کنه هست؛ پس
    از بازگشت بدنتان را با دقت وارسی کنید. آب و خوراک همراه داشته باشید. بهترین ماه‌ها مه تا اکتبر است؛
    پس از باران مسیر گِلی و لغزنده می‌شود.
  route: >-
    لاگودخی حدود ۱۶۰ کیلومتر با تفلیس فاصله دارد — تقریباً ۲ ساعت و ۴۰ دقیقه، سراسر آسفالت. بزرگراه کاختی
    (S5) را از ساگارجو، باکورتسیخه و تسنوری تا لاگودخی دنبال کنید. مرکز بازدیدکنندگان در لبهٔ شمالی شهر
    تابلو دارد؛ باک را در خود لاگودخی پر کنید. خودرو را کنار مرکز بگذارید — به آبشار فقط پیاده می‌شود
    رسید، حدود ۸ کیلومتر هر طرف. خودروی اقتصادی بی‌هیچ دردسری به سر مسیر می‌رسد؛ در جنگل به آن نیازی نخواهید
    داشت.
he:
  name: מפל נינוסחווי
  short: שמונה קילומטרים של יער אשור וחציות נחלים בשמורה הוותיקה ביותר בגאורגיה, המסתיימים במפל מדורג
    ובבריכה קרה.
  body: >-
    **המפל של נינוסחווי נמצא 8 ק״מ בתוך היער, ועוד 8 ק״מ בדרך חזרה — דרך יער שמוגן מאז 1912, זמן רב יותר
    מכל מקום אחר בגאורגיה.**


    שמורת לגודחי חבה את קיומה להתמדתו של אדם אחד. לודוויק מלוקוסייביץ', פולני, הגיע ללגודחי ב-1853 עם
    הדיוויזיה הקווקזית של הצבא הרוסי, ואחרי שנים של מסעות וגלות חזר לכאן כדי להישאר — בוטנאי, זואולוג,
    חוקר, ולבסוף מפקח היערות של מחוז סיגנאגי. מ-1889 לחץ שיגנו על היער הזה; השמורה הוכרזה ב-1912, שלוש
    שנים אחרי מותו. הוא קבור בלגודחי, ושמו חי בתרנגול הבר הקווקזי ובאדמונית הזהובה – אדמונית מלוקוסייביץ'.


    השביל מסומן לבן-אדום-לבן ומתפתל בין עצי אשור, קרפינוס ואדר, וחוצה נחלים יותר מפעם אחת. הקצו שעתיים
    עד שלוש לעלייה ושעה עד שעתיים לירידה. בסוף השביל צונחים המים בכמה מדרגות אל בריכה למרגלותיהם, שבה
    האמיצים שוחים.


    בשמורה חיים דוב חום, שונר, זאב, אייל אדום, צפיר האלפים ויעל קווקזי מזרחי. סביר שלא תראו אף אחד מהם
    מהשביל, אבל הידיעה שהם שם, אי-שם, משנה את הדרך שבה אתם מקשיבים ליער.
  tip: >-
    ההרשמה במרכז המבקרים של לגודחי חינם וחובה, והריינג'רים יספרו לכם מה מצב השביל כעת. זה טיול רגלי רציני
    של חצי יום — ארבע עד חמש שעות הלוך ושוב — לכן צאו מוקדם. נעלו נעליים יציבות ועמידות למים: השורשים
    והאבנים נשארים רטובים, ואת הנחלים תחצו בהליכה בתוך המים. ביער יש קרציות, אז בדקו את עצמכם היטב בסוף
    הטיול. קחו מים ואוכל. החודשים הטובים ביותר הם מאי עד אוקטובר; אחרי גשם השביל נעשה בוצי וחלקלק.
  route: >-
    לגודחי נמצאת כ-160 ק״מ מטביליסי — כשעתיים ו-40 דקות, אספלט לכל אורך הדרך. סעו בכביש קאחתי (S5) דרך
    סגרג'ו, בקורציחה וצנורי עד לגודחי. מרכז המבקרים מסומן בשלטים בקצה הצפוני של העיירה; תדלקו בלגודחי
    עצמה. השאירו את הרכב במרכז — אל המפל מגיעים רק ברגל, כ-8 ק״מ לכל כיוון. רכב חסכוני יגיע לראש השביל
    בלי שום בעיה; ביער לא תזדקקו לו.
ar:
  name: شلال نينوسخيفي
  short: ثمانية كيلومترات من غابات الزان وعبور الجداول في أقدم محمية بجورجيا، تنتهي عند شلال متدرّج وبركة
    باردة.
  body: >-
    **يقع شلال نينوسخيفي على بعد 8 كم في عمق الغابة، و8 كم أخرى للعودة — عبر غابة محمية منذ عام 1912،
    أي منذ زمن أطول من أي مكان آخر في جورجيا.**


    تدين محمية لاغوديخي بوجودها لإصرار رجل واحد. فقد وصل البولندي لودفيك ملوكوسيفيتش إلى لاغوديخي عام
    1853 مع الفرقة القوقازية في الجيش الروسي، وبعد سنوات من الترحال والنفي عاد ليستقر فيها — عالم نبات
    وعالم حيوان ومستكشفاً، وأخيراً مفتشاً لغابات قضاء سيغناغي. ومنذ عام 1889 راح يطالب بحماية هذه الغابة؛
    وأُعلنت المحمية عام 1912، بعد وفاته بثلاث سنوات. دُفن في لاغوديخي، ويبقى اسمه حياً في الطيهوج القوقازي
    والفاوانيا الذهبية (فاوانيا ملوكوسيفيتش).


    الدرب معلَّم بالأبيض والأحمر والأبيض، ويتعرج بين أشجار الزان والشرد والقيقب، ويعبر الجداول أكثر من
    مرة. خصّص ساعتين إلى ثلاث للصعود، وساعة إلى ساعتين للنزول. وفي النهاية يهبط الماء على عدة درجات إلى
    بركة عند قدمه، يسبح فيها الجريئون.


    تعيش في المحمية الدببة البنية والوشق والذئاب والأيائل الحمراء والشمواة وطور شرق القوقاز. من غير المرجح
    أن ترى أياً منها من الدرب، لكن معرفتك بأنها هناك تغيّر طريقة إصغائك إلى الغابة.
  tip: >-
    التسجيل في مركز زوار لاغوديخي مجاني وإلزامي، وسيخبرك الحراس بحالة الدرب الراهنة. إنها رحلة مشي جادة
    تستغرق نصف يوم — أربع إلى خمس ساعات ذهاباً وإياباً — فانطلق باكراً. ارتدِ حذاءً متيناً مقاوماً للماء:
    فالجذور والحجارة تبقى مبللة، وستخوض الجداول. في الغابة قراد، فافحص جسمك بعناية بعد العودة. احمل الماء
    والطعام. أفضل الأشهر من مايو إلى أكتوبر؛ وبعد المطر يصبح الدرب موحلاً وزلقاً.
  route: >-
    تبعد لاغوديخي نحو 160 كم عن تبليسي — قرابة ساعتين و40 دقيقة، على الإسفلت طوال الطريق. اتبع طريق كاخيتي
    السريع (S5) عبر ساغاريجو وباكورتسيخي وتسنوري حتى لاغوديخي. مركز الزوار مشار إليه باللافتات عند الطرف
    الشمالي للبلدة؛ واملأ الخزان في لاغوديخي نفسها. اترك السيارة عند المركز — فالوصول إلى الشلال سيراً
    على الأقدام فقط، نحو 8 كم في كل اتجاه. تصل السيارة الاقتصادية إلى بداية الدرب دون أي عناء؛ أما في
    الغابة فلن تحتاج إليها.
