ka:
  name: არგოს საბაგირო (ბათუმის საბაგირო)
  short: >-
    ორნახევარი კილომეტრი ჰაერში ბათუმის სახურავებსა და პორტზე, ანურიის მთაზე მდებარე სახედავ ტერასამდე.
  body: >-
    **არგოს საბაგირო ბათუმის ყველაზე სწრაფი გზაა იმისთვის, რომ ქალაქი მთლიანად ერთ კადრში დაინახო.**
    ქვედა სადგური პორტთან ახლოსაა, ზედა — ანურიის მთაზე, დაახლოებით 250 მეტრზე. მანძილი ორნახევარ კილომეტრს
    სცილდება, ასვლა ათი-თორმეტი წუთი გრძელდება, კაბინები დახურული და გამჭვირვალეა.

    ხედი გზაში იცვლება სამჯერ. თავიდან ძველი ბათუმის თუნუქის სახურავები და ეზოები გაივლის ფეხქვეშ —
    სწორედ ისეთი ხედი, რომელსაც ქუჩიდან ვერასდროს მიიღებ. შემდეგ პორტი და ტანკერები, კრანები, კონტეინერების
    რიგები. ბოლოს ქალაქი უკან რჩება და მარცხნივ იშლება მთელი სანაპირო ზოლი ჩრდილოეთისკენ — ქობულეთი,
    და ნათელ დღეს კიდევ უფრო შორს.

    ზედა სადგურზე არის ტერასა, კაფე და მოკლე ბილიკი ტყეში. თვითონ სადგური არქიტექტურულად ჩვეულებრივია
    და კაფე ძვირია — მთავარი აქ პარაპეტია. საღამოს, მზის ჩასვლამდე ნახევარი საათით ადრე, სინათლე ზღვაზე
    ეცემა და ქალაქი ჯერ ოქროსფერი ხდება, მერე კი ნელ-ნელა ინთება.

    ორი პრაქტიკული შენიშვნა. პირველი: აჭარაში ღრუბლიანი დღეები ბევრია და ზედა სადგური ხშირად ნისლშია
    — ასვლამდე ზემოთ აიხედე. მეორე: საბაგირო ქარის დროს ჩერდება, ხოლო ზამთარში ტექნიკური შემოწმებისთვის
    შეიძლება რამდენიმე დღით დაიხუროს. ორივე შემთხვევაში ბოტანიკური ბაღი ან ბულვარი ლოგიკური ჩანაცვლებაა.
  tip: >-
    ჯამში საათნახევარი: ასვლა, ტერასა, ჩამოსვლა. ბილეთი ორმხრივია და ქვედა სადგურზე იყიდება; ზაფხულის
    საღამოს რიგი ოცდაათ წუთამდე იზრდება — უმჯობესია დღის პირველ ნახევარში ან ვახშმის დროს. კაბინა დახურულია,
    ამიტომ სიმაღლის შიშის მქონეც უძლებს. ზემოთ ქარია და ორიოდე გრადუსით გრილა — ქურთუკი წაიღე. ტუალეტი
    ორივე სადგურშია.
  route: >-
    თბილისიდან E60-ით ქუთაისსა და სამტრედიაზე, მერე ზღვის გზით ქობულეთის გავლით ბათუმამდე — 370 კმ,
    ხუთი საათი ნახევარი, ბოლომდე ასფალტი. ქვედა სადგური ქალაქის სამხრეთ-აღმოსავლეთ ნაწილშია, ნავსადგურთან
    ახლოს, გოგებაშვილის ქუჩის მიდამოებში; ნიშნები ცენტრიდან მკაფიოა. მცირე პარკინგი სადგურთანაა, სავსეობისას
    მიმდებარე ქუჩებზე დგება. საწვავი ქობულეთსა და ბათუმის შესასვლელშია. ეკონომ-კლასი სავსებით საკმარისია.
en:
  name: Argo Cable Car
  short: >-
    Two and a half kilometres of air over Batumi's roofs to a viewing terrace on Anuria hill.
  body: >-
    **The Argo cable car is the quickest way to see the whole of Batumi in one frame.** The lower station
    sits near the port, the upper one on Anuria hill at around 250 metres. The span is over two and a half
    kilometres and the ride takes ten to twelve minutes in closed glazed cabins.

    The view changes three times on the way up. First the tin roofs and inner courtyards of old Batumi
    pass beneath you — the one angle you can never get from the street. Then the working port: tankers,
    cranes, rows of containers stacked by colour. Finally the city drops behind and the coast opens northwards
    on the left, past Kobuleti and, on a clear day, well beyond it.

    At the top there is a terrace, a cafe and a short forest path. The station building is unremarkable
    and the cafe is expensive; the parapet is the reason you came. Half an hour before sunset the light
    falls flat across the sea, the city turns gold, and then the lights come on below in an order you can
    almost follow.

    Two practical warnings. Adjara has a great many cloudy days and the top station spends a fair share
    of them inside the cloud — look up before you buy a ticket. And the line stops in strong wind, and
    can close for several days of technical inspection in winter. In either case the botanical garden or
    the boulevard is the sensible substitute.
  tip: >-
    Allow an hour and a half in total: up, terrace, down. Tickets are return and sold at the lower station;
    on summer evenings the queue can reach half an hour, so go in the morning or around dinner time instead.
    Cabins are fully enclosed, which makes the ride manageable for people who dislike heights. It is windy
    at the top and a couple of degrees cooler — take a jacket. Both stations have toilets.
  route: >-
    From Tbilisi take the E60 through Kutaisi and Samtredia, then the coast road south past Kobuleti into
    Batumi — 370 km, five and a half hours, asphalt the whole way. The lower station is in the south-eastern
    part of the city near the harbour, in the Gogebashvili street area; signs from the centre are clear.
    There is a small car park at the station, and street parking nearby when it fills. Fuel at Kobuleti
    and on the approach to Batumi. An economy car is entirely sufficient.
ru:
  name: Канатная дорога «Арго»
  short: >-
    Два с половиной километра по воздуху над крышами Батуми к смотровой террасе на горе Ануриа.
  body: >-
    **«Арго» — самый быстрый способ увидеть весь Батуми в одном кадре.** Нижняя станция стоит у порта,
    верхняя — на горе Ануриа, примерно на 250 метрах. Длина линии превышает два с половиной километра,
    подъём занимает десять-двенадцать минут в закрытых остеклённых кабинах.

    Вид по дороге меняется трижды. Сначала под ногами проходят жестяные крыши и внутренние дворы старого
    Батуми — ракурс, который с улицы не получить никогда. Потом рабочий порт: танкеры, краны, ряды контейнеров,
    сложенных по цветам. Наконец город остаётся позади, и слева открывается побережье на север — Кобулети
    и, в ясный день, куда дальше.

    Наверху есть терраса, кафе и короткая лесная тропа. Само здание станции ничем не примечательно, кафе
    дорогое; ради парапета сюда и едут. За полчаса до заката свет ложится плашмя на море, город становится
    золотым, а потом внизу один за другим зажигаются огни.

    Два практических предупреждения. В Аджарии много облачных дней, и верхняя станция изрядную их часть
    проводит внутри облака — посмотрите вверх, прежде чем брать билет. И дорога останавливается при сильном
    ветре, а зимой может закрыться на несколько дней технического осмотра. В обоих случаях разумная замена
    — ботанический сад или бульвар.
  tip: >-
    Полтора часа на всё: подъём, терраса, спуск. Билет туда-обратно продают на нижней станции; летними
    вечерами очередь доходит до получаса, так что лучше ехать утром или ближе к ужину. Кабины закрытые,
    поэтому подъём переносят и те, кто не любит высоту. Наверху ветрено и на пару градусов прохладнее
    — возьмите куртку. Туалеты есть на обеих станциях.
  route: >-
    Из Тбилиси по E60 через Кутаиси и Самтредиа, затем по приморской дороге на юг мимо Кобулети в Батуми
    — 370 км, пять с половиной часов, асфальт всю дорогу. Нижняя станция в юго-восточной части города
    у гавани, в районе улицы Гогебашвили; указатели из центра понятные. У станции небольшая парковка,
    при её заполнении ставят на соседних улицах. Заправки в Кобулети и на въезде в Батуми. Машины эконом-класса
    вполне достаточно.
fa:
  name: تله‌کابین آرگو
  short: >-
    دو و نیم کیلومتر پرواز بر فراز بام‌های باتومی تا ایوان تماشای تپهٔ آنوریا.
  body: >-
    **تله‌کابین آرگو سریع‌ترین راه دیدن کل باتومی در یک قاب است.** ایستگاه پایین نزدیک بندر است و ایستگاه
    بالا روی تپهٔ آنوریا در ارتفاع حدود ۲۵۰ متر. طول خط بیش از دو و نیم کیلومتر است و صعود ده تا دوازده
    دقیقه طول می‌کشد، در کابین‌های بستهٔ شیشه‌ای.

    منظره در راه سه بار عوض می‌شود. نخست بام‌های حلبی و حیاط‌های درونی باتومی کهنه زیر پا می‌گذرند —
    همان زاویه‌ای که هرگز از خیابان به دست نمی‌آید. سپس بندر فعال: نفتکش‌ها، جرثقیل‌ها و ردیف کانتینرها
    که بر پایهٔ رنگ چیده شده‌اند. سرانجام شهر عقب می‌ماند و ساحل از سمت چپ به شمال باز می‌شود، تا کوبولتی
    و در روز صاف بسی دورتر.

    بالا ایوانی هست و کافه‌ای و مسیر کوتاهی در جنگل. ساختمان ایستگاه چیز خاصی نیست و کافه گران است؛ آنچه
    برایش آمده‌اید نردهٔ ایوان است. نیم ساعت پیش از غروب نور روی دریا پهن می‌شود، شهر طلایی می‌گردد و
    بعد چراغ‌ها یکی پس از دیگری پایین روشن می‌شوند.

    دو هشدار عملی. آجارا روزهای ابری بسیار دارد و ایستگاه بالا سهم قابل توجهی از آن‌ها را درون ابر می‌گذراند
    — پیش از خرید بلیت به بالا نگاه کنید. خط در باد شدید متوقف می‌شود و در زمستان ممکن است چند روز برای
    بازرسی فنی بسته باشد. در هر دو حال باغ گیاه‌شناسی یا بلوار جایگزین منطقی است.
  tip: >-
    روی‌هم‌رفته یک ساعت و نیم: بالا، ایوان، پایین. بلیت رفت‌وبرگشت است و در ایستگاه پایین فروخته می‌شود؛
    عصرهای تابستان صف تا نیم ساعت می‌رسد، پس صبح یا نزدیک شام بروید. کابین‌ها کاملاً بسته‌اند و همین
    سفر را برای کسانی که از ارتفاع خوششان نمی‌آید قابل تحمل می‌کند. بالا باد می‌آید و دو درجه خنک‌تر است
    — کاپشن بردارید. هر دو ایستگاه سرویس بهداشتی دارند.
  route: >-
    از تفلیس با E60 از کوتایسی و سامترِدیا، سپس جادهٔ ساحلی به جنوب از کنار کوبولتی تا باتومی — ۳۷۰ کیلومتر،
    پنج ساعت و نیم، سرتاسر آسفالت. ایستگاه پایین در بخش جنوب‌شرقی شهر نزدیک لنگرگاه و در محدودهٔ خیابان
    گوگباشویلی است؛ تابلوها از مرکز روشن‌اند. کنار ایستگاه پارکینگ کوچکی هست و در صورت پرشدن، خیابان‌های
    مجاور. سوخت در کوبولتی و ورودی باتومی. خودروی اقتصادی کاملاً کافی است.
he:
  name: רכבל ארגו
  short: >-
    שני קילומטרים וחצי באוויר מעל גגות באטומי אל מרפסת תצפית על גבעת אנוריה.
  body: >-
    **רכבל ארגו הוא הדרך המהירה ביותר לראות את באטומי כולה בפריים אחד.** התחנה התחתונה נמצאת ליד הנמל,
    והעליונה על גבעת אנוריה בגובה כ-250 מטר. אורך הקו עולה על שני קילומטרים וחצי והנסיעה נמשכת עשר עד
    שתים עשרה דקות בתאים סגורים ומזוגגים.

    הנוף משתנה שלוש פעמים בדרך למעלה. תחילה חולפים מתחתיכם גגות הפח והחצרות הפנימיות של באטומי הישנה
    — הזווית שאי אפשר לקבל מן הרחוב. אחר כך הנמל הפעיל: מכליות, מנופים ושורות מכולות מסודרות לפי צבע.
    לבסוף העיר נשארת מאחור והחוף נפתח שמאלה צפונה, עד קובולטי וביום בהיר הרבה מעבר לה.

    למעלה יש מרפסת, בית קפה ושביל יער קצר. מבנה התחנה אינו מיוחד ובית הקפה יקר; המעקה הוא הסיבה שבאתם.
    חצי שעה לפני השקיעה האור נשטח על הים, העיר מזהיבה, ואז נדלקים למטה האורות בזה אחר זה.

    שתי אזהרות מעשיות. באג׳ריה יש ימים מעוננים רבים, והתחנה העליונה מבלה חלק נכבד מהם בתוך הענן — הביטו
    למעלה לפני שאתם קונים כרטיס. הקו נעצר ברוח חזקה, ובחורף עשוי להיסגר לכמה ימי בדיקה טכנית. בשני המקרים
    הגן הבוטני או השדרה הם התחליף ההגיוני.
  tip: >-
    הקצו שעה וחצי בסך הכול: עלייה, מרפסת, ירידה. הכרטיס הוא הלוך ושוב ונמכר בתחנה התחתונה; בערבי קיץ
    התור מגיע לחצי שעה, אז עדיף בבוקר או סביב שעת הערב. התאים סגורים לגמרי, מה שמקל על מי שאינו אוהב
    גבהים. למעלה נושבת רוח וקריר בשתי מעלות — קחו ז׳קט. בשתי התחנות יש שירותים.
  route: >-
    מטביליסי בכביש E60 דרך קוטאיסי וסמטרדיה, ואז בכביש החוף דרומה על יד קובולטי אל באטומי — 370 ק״מ,
    חמש שעות וחצי, סלול לכל האורך. התחנה התחתונה בחלק הדרום-מזרחי של העיר ליד הנמל, באזור רחוב גוגבשווילי;
    השילוט מן המרכז ברור. ליד התחנה חניון קטן, וכשהוא מתמלא חונים ברחובות הסמוכים. תדלוק בקובולטי ובכניסה
    לבאטומי. רכב חסכוני מספיק לחלוטין.
ar:
  name: تلفريك أرغو
  short: >-
    كيلومتران ونصف في الهواء فوق سطوح باتومي إلى شرفة إطلال على تل أنوريا.
  body: >-
    **تلفريك أرغو أسرع وسيلة لرؤية باتومي كلها في إطار واحد.** المحطة السفلى قرب الميناء، والعليا على
    تل أنوريا عند نحو 250 متراً. طول الخط يتجاوز كيلومترين ونصف، والصعود يستغرق عشر إلى اثنتي عشرة دقيقة
    في مقصورات مغلقة مزججة.

    يتبدل المنظر ثلاث مرات في الطريق. أولاً تمر تحتك سطوح الصفيح والأفنية الداخلية لباتومي القديمة، وهي
    الزاوية التي لا تحصل عليها من الشارع أبداً. ثم الميناء العامل: ناقلات ورافعات وصفوف حاويات مرصوفة
    بحسب اللون. وأخيراً تتخلف المدينة ويفتح الساحل شمالاً على اليسار، حتى كوبوليتي وأبعد منها بكثير في
    يوم صافٍ.

    في الأعلى شرفة ومقهى ومسار قصير في الغابة. مبنى المحطة عادي والمقهى غالٍ؛ الحاجز الأمامي هو سبب مجيئك.
    وقبل الغروب بنصف ساعة ينبسط الضوء على البحر فتصير المدينة ذهبية، ثم تشتعل الأضواء في الأسفل واحدة
    بعد أخرى.

    تحذيران عمليان. في أجاريا أيام غائمة كثيرة، والمحطة العليا تقضي نصيباً منها داخل الغيم، فانظر إلى
    الأعلى قبل شراء التذكرة. ويتوقف الخط عند اشتداد الريح، وقد يغلق شتاءً بضعة أيام للفحص الفني. وفي الحالتين
    تبقى الحديقة النباتية أو الشارع البحري بديلاً معقولاً.
  tip: >-
    احسب ساعة ونصفاً إجمالاً: صعود وشرفة ونزول. التذكرة ذهاباً وإياباً وتُباع في المحطة السفلى؛ وفي أمسيات
    الصيف يبلغ الطابور نصف ساعة، فالأفضل الصباح أو قرب العشاء. المقصورات مغلقة تماماً وهذا يريح من يخشى
    المرتفعات. في الأعلى ريح ودرجتان أبرد، فخذ سترة. وفي المحطتين دورات مياه.
  route: >-
    من تبليسي على E60 عبر كوتايسي وسامتريديا، ثم طريق الساحل جنوباً بمحاذاة كوبوليتي إلى باتومي — 370 كم،
    خمس ساعات ونصف، معبّد كله. المحطة السفلى في الجزء الجنوبي الشرقي من المدينة قرب المرفأ، في محيط شارع
    غوغباشفيلي، واللافتات من الوسط واضحة. عند المحطة موقف صغير، وعند امتلائه يُركن في الشوارع المجاورة.
    الوقود في كوبوليتي وعند مدخل باتومي. وسيارة اقتصادية تكفي تماماً.
