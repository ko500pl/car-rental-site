ka:
  name: საბაგირო „არგო“
  short: >-
    ორნახევარი კილომეტრი ჰაერში — ბათუმის ნავსადგურიდან ანურიის მთამდე, სადაც ქალაქი ზღვის პირას გაშლილ
    რუკად იქცევა.
  body: >-
    **ბათუმის საბაგიროს იმ ხომალდის სახელი ჰქვია, რომლითაც იასონი კოლხეთში ჩამოვიდა — და ასვლა მართლაც
    ნავსადგურიდან გასვლას ჰგავს: პორტი ქვემოთ რჩება, ზღვა ფართოვდება, ქალაქი კი რუკად პატარავდება.**


    „არგო“ 2013 წლის 17 აგვისტოს გაიხსნა, დაახლოებით ხუთწლიანი მშენებლობის შემდეგ. ხაზი ავსტრიულმა კომპანია
    „დოპელმაირმა“ დააპროექტა და დაამზადა: სადგურებს შორის 2 586 მეტრია, ბაგირს შვიდი ანძა იჭერს, ოცი რვაადგილიანი
    კაბინა კი ცალ მხარეს დაახლოებით თხუთმეტ წუთს მიდის. ქვედა სადგური გოგებაშვილის ქუჩაზეა, ნავსადგურთან;
    ზედა — ანურიის მთაზე, ზღვის დონიდან 256 მეტრზე.


    ხედი გზაში სამჯერ იცვლება. ჯერ სახურავები და შიდა ეზოები ჩაივლის ფეხქვეშ — ბათუმი ისეთი, როგორსაც
    ქუჩიდან ვერასდროს დაინახავთ. მერე სამუშაო ნავსადგური: ამწეები, ტანკერები, ფერადი კონტეინერების მწკრივები.
    ბოლოს ქალაქი უკან იხევს და ჩრდილოეთით მთელი სანაპირო იშლება, ნათელ დღეს — ქობულეთსაც იქით.


    ზედა კომპლექსი არგონავტების მითზეა აგებული: კაფე-ბარი, ღვინისა და სუვენირების მაღაზია, სადამკვირვებლო
    მოედანი და ღია კაფე ხომალდის „გემბანზე“. მაგრამ აქ მაინც მოაჯირისთვის ამოდიხართ. მზის ჩასვლამდე ნახევარი
    საათით ადრე შუქი ზღვაზე დაბლა წვება და ქალაქი ოქროსფრად ინთება.


    ორი გაფრთხილება. აჭარაში ღრუბლიანი დღე ბევრია და ზედა სადგური ხშირად ღრუბელშია გახვეული — ბილეთის
    ყიდვამდე ზემოთ აიხედეთ. ძლიერ ქარში საბაგირო ჩერდება, ზამთარში კი ტექნიკური შემოწმებისთვის შეიძლება
    რამდენიმე დღით დაიკეტოს.


    ასვლა დღის ბოლოს სცადეთ, ჩამოსვლა კი სიბნელეში: ბათუმი კაბინის ქვეშ ქუჩა-ქუჩა აინთება.
  tip: >-
    ჯამში საათნახევარი გამოყავით: ასვლა, მოედანი, ჩამოსვლა. ორმხრივი ბილეთი ქვედა სადგურზე იყიდება; ბოლოს
    რომ გადავამოწმეთ, 30 ლარი ღირდა, ხაზი კი მთელი წელი დაახლოებით დილის თერთმეტიდან საღამოს რვის ნახევრამდე
    მუშაობდა — ფასი და საათები იცვლება, ამიტომ წინასწარ დააზუსტეთ. ზაფხულის საღამოს რიგი ნახევარ საათამდე
    იზრდება, ამიტომ დღის პირველი ნახევარი ჯობია. კაბინები სრულიად დახურულია, სიმაღლის შიშის მქონეც მშვიდად
    იმგზავრებს. ზემოთ ქარია და ორიოდე გრადუსით გრილა — თხელი ქურთუკი წაიღეთ. თუ მწვერვალი ღრუბელშია, ბოტანიკური
    ბაღი ან ბულვარი უკეთესი არჩევანია.
  route: >-
    თბილისიდან 370 კილომეტრი და დაახლოებით ხუთნახევარი საათია, ბოლომდე ასფალტით. E60-ით ქუთაისისა და სამტრედიის
    გავლით მიდიხართ, შემდეგ S12-ით ზღვაზე გადიხართ და ქობულეთის გავლით ბათუმში შედიხართ. ქვედა სადგური
    გოგებაშვილის ქუჩაზეა, ნავსადგურის გვერდით, სასწაულების პარკიდან დაახლოებით 650 მეტრში — ანბანის კოშკიდან
    ფეხითაც მოხვალთ. სადგურთან პატარა ავტოსადგომია, სავსე თუ დაგხვდათ, მიმდებარე ქუჩებში დააყენეთ მანქანა.
    საწვავი ქობულეთში ან ბათუმის შესასვლელთან აიღეთ. ეკონომ-კლასის მანქანა სავსებით საკმარისია.
en:
  name: Argo Cable Car
  short: >-
    Two and a half kilometres of air from Batumi's port to Anuria hill, where the whole city lies spread
    out like a map by the sea.
  body: >-
    **Batumi's cable car is named after the ship that carried Jason to Colchis, and the ride up does feel
    like leaving harbour: the port drops away, the sea widens and the city shrinks to a map.**


    Argo opened on 17 August 2013 after some five years of construction. The Austrian firm Doppelmayr
    designed and built the line: 2,586 metres between stations, seven towers, and twenty eight-seat cabins
    that take about fifteen minutes each way. The lower station stands on Gogebashvili Street by the port;
    the upper one sits on Anuria hill, 256 metres above the sea.


    The view changes three times. First roofs and inner courtyards slide beneath you, a Batumi you never
    see from the street. Then the working port: cranes, tankers, rows of coloured containers. Finally
    the city falls behind and the whole coast opens to the north, past Kobuleti on a clear day.


    The upper complex is built around the Argonaut myth: a café-bar, a wine and souvenir shop, a viewing
    platform and an open-air café on the ship's "deck". Still, the railing is what you came for. Half
    an hour before sunset the light lies low across the sea and the city turns gold.


    Two warnings. Adjara has many cloudy days, and the top station often sits inside the cloud, so look
    up before you buy a ticket. The line stops in strong wind, and in winter it can close for several
    days of technical inspection.


    Go up at the end of the day and come down in the dark, as Batumi lights itself street by street beneath
    the cabin.
  tip: >-
    Allow an hour and a half in all: up, terrace, down. Return tickets are sold at the lower station;
    at our last check they cost 30 ₾ and the line ran year-round from about 11 am to 8.30 pm, but prices
    and hours change, so confirm before you go. Summer-evening queues can reach half an hour, so mornings
    are easier. Cabins are fully enclosed, which makes the ride manageable for anyone uneasy with heights.
    It is windier and a couple of degrees cooler at the top, so bring a light jacket. If the summit is
    in cloud, the botanical garden or the boulevard is the better choice.
  route: >-
    From Tbilisi it is 370 km, about five and a half hours on asphalt all the way. Take the E60 through
    Kutaisi to Samtredia, then the S12 to the coast and south through Kobuleti into Batumi. The lower
    station is on Gogebashvili Street beside the port, about 650 metres from Miracle Park, so you can
    walk over from the Alphabetic Tower. There is a small car park at the station, with street parking
    nearby when it fills. Fuel up in Kobuleti or on the approach to Batumi. An economy car is entirely
    sufficient.
ru:
  name: Канатная дорога «Арго»
  short: >-
    Два с половиной километра по воздуху — от батумского порта до горы Анурия, где весь город раскинулся
    у моря, словно карта.
  body: >-
    **Батумская канатная дорога названа в честь корабля, на котором Ясон прибыл в Колхиду, — и подъём
    действительно похож на выход из порта: гавань остаётся внизу, море расширяется, а город уменьшается
    до размеров карты.**


    «Арго» открылась 17 августа 2013 года после примерно пяти лет строительства. Линию спроектировала
    и построила австрийская компания «Доппельмайр»: между станциями 2586 метров, трос держат семь опор,
    а двадцать восьмиместных кабин идут в одну сторону около пятнадцати минут. Нижняя станция стоит на
    улице Гогебашвили, у порта; верхняя — на горе Анурия, на высоте 256 метров над морем.


    Вид меняется трижды за дорогу. Сначала под ногами проплывают крыши и внутренние дворы — Батуми таким,
    каким его никогда не увидишь с улицы. Потом рабочий порт: краны, танкеры, ряды цветных контейнеров.
    Наконец город остаётся позади, и на север открывается всё побережье, в ясный день — и дальше Кобулети.


    Верхний комплекс построен по мотивам мифа об аргонавтах: кафе-бар, магазин вина и сувениров, смотровая
    площадка и открытое кафе на «палубе» корабля. Но всё же именно к перилам вы сюда и поднимаетесь. За
    полчаса до заката свет ложится низко над морем, и город наливается золотом.


    Два предупреждения. В Аджарии много облачных дней, и верхняя станция часто утопает в облаке — посмотрите
    вверх, прежде чем покупать билет. При сильном ветре дорогу останавливают, а зимой она может закрываться
    на несколько дней для технического осмотра.


    Поднимайтесь в конце дня, а спускайтесь в темноте: Батуми под кабиной зажигается улица за улицей.
  tip: >-
    В целом хватит полутора часов: подъём, площадка, спуск. Билет туда-обратно продаётся на нижней станции;
    на момент нашей последней проверки он стоил 30 лари, а линия работала весь год приблизительно с 11
    утра до 20:30 — цены и часы меняются, так что уточните заранее. Летним вечером очередь может растянуться
    на полчаса, поэтому утро удобнее. Кабины полностью закрытые, так что поездка вполне спокойна даже
    для тех, кто боится высоты. Наверху ветрено и на пару градусов холоднее — возьмите лёгкую куртку.
    Если вершина в облаке, ботанический сад или бульвар — лучший выбор.
  route: >-
    От Тбилиси 370 км, около пяти с половиной часов, дорога заасфальтирована целиком. Двигайтесь по E60
    через Кутаиси до Самтредиа, затем по S12 к побережью и на юг через Кобулети в Батуми. Нижняя станция
    — на улице Гогебашвили, у порта, примерно в 650 метрах от Парка чудес, так что дойти сюда можно и
    пешком от Башни алфавита. У станции небольшая парковка, а если она заполнена — оставьте машину на
    соседних улицах. Заправляйтесь в Кобулети или на подъезде к Батуми. Машины экономкласса вполне достаточно.
fa:
  name: تله‌کابین آرگو
  short: دو کیلومتر و نیم در هوا، از بندر باتومی تا تپهٔ آنوریا، جایی که کل شهر همچون نقشه‌ای کنار دریا
    گسترده شده است.
  body: >-
    **تله‌کابین باتومی به نام همان کشتی‌ای خوانده شده که یاسون را به کولخیس رساند - و صعود با آن واقعاً
    حسّ ترک‌کردن بندر را می‌دهد: بندر پایین می‌ماند، دریا پهناور می‌شود و شهر به اندازهٔ نقشه‌ای کوچک
    می‌شود.**


    آرگو در ۱۷ اوت ۲۰۱۳، پس از نزدیک به پنج سال ساخت‌وساز، گشوده شد. شرکت اتریشی «دوپلمایر» این خط را
    طراحی و ساخت: میان دو ایستگاه ۲٬۵۸۶ متر فاصله است، هفت برج سیم را نگه می‌دارند، و بیست کابین هشت‌نفره
    هر یک راه را در حدود پانزده دقیقه می‌پیمایند. ایستگاه پایین در خیابان گوگباشویلی، کنار بندر است؛ ایستگاه
    بالا بر تپهٔ آنوریا، در ارتفاع ۲۵۶ متری از سطح دریا.


    در طول راه، منظره سه بار تغییر می‌کند. نخست بام‌ها و حیاط‌های درونی زیر پایتان می‌گذرند - باتومی‌ای
    که هرگز از خیابان نمی‌بینید. سپس بندرِ فعال: جرثقیل‌ها، نفت‌کش‌ها، ردیف‌های کانتینرهای رنگی. سرانجام
    شهر پس می‌نشیند و تمام ساحل به سوی شمال گشوده می‌شود، و در روزی صاف تا فراتر از کوبولتی پیداست.


    مجموعهٔ بالا بر پایهٔ افسانهٔ آرگوناوت‌ها بنا شده: کافه‌بار، مغازهٔ شراب و سوغات، سکوی دیدبانی و کافهٔ
    روباز بر «عرشهٔ» کشتی. اما با این‌همه، به‌خاطر نرده‌هاست که به این‌جا آمده‌اید. نیم‌ساعت پیش از غروب،
    نور کم‌ارتفاع بر دریا می‌افتد و شهر طلایی می‌شود.


    دو هشدار. آجارا روزهای ابری بسیار دارد و ایستگاه بالا غالباً درون ابر است - پیش از خریدن بلیت به بالا
    نگاه کنید. در باد شدید خط متوقف می‌شود، و در زمستان ممکن است چند روز برای بازرسی فنی بسته شود.


    صعود را در پایان روز تجربه کنید و فرود را در تاریکی، درحالی‌که باتومی زیر کابین خیابان‌به‌خیابان روشن
    می‌شود.
  tip: >-
    در مجموع یک ساعت و نیم کافی است: صعود، سکو، فرود. بلیت رفت‌وبرگشت در ایستگاه پایین فروخته می‌شود؛
    در آخرین بازبینی ما، سی لاری بود و خط تمام سال، تقریباً از ساعت یازده صبح تا هشت‌ونیم شب، کار می‌کرد
    - قیمت و ساعت‌ها تغییر می‌کنند، پس از پیش مطمئن شوید. عصرهای تابستان صف تا نیم‌ساعت طول می‌کشد، پس
    صبح راحت‌تر است. کابین‌ها کاملاً بسته‌اند، به‌طوری‌که سفر برای کسانی که از ارتفاع می‌ترسند نیز آسان
    است. بالا بادی‌تر و یکی دو درجه خنک‌تر است - ژاکتی نازک همراه داشته باشید. اگر قله در ابر است، باغ
    گیاه‌شناسی یا بلوار انتخاب بهتری است.
  route: >-
    از تفلیس ۳۷۰ کیلومتر است، حدود پنج ساعت و نیم، تمامًا آسفالته. از E60 از میان کوتایسی تا سامترِدیا
    بروید، سپس از S12 به ساحل برسید و به‌سوی جنوب، از میان کوبولتی، به باتومی وارد شوید. ایستگاه پایین
    در خیابان گوگباشویلی، کنار بندر، حدود ۶۵۰ متر از پارک معجزات است، پس می‌توانید از برج الفبا پیاده
    هم بیایید. کنار ایستگاه پارکینگی کوچک هست؛ اگر پر بود، در خیابان‌های اطراف پارک کنید. در کوبولتی یا
    در نزدیکی باتومی سوخت‌گیری کنید. خودروی اقتصادی کاملاً کافی است.
he:
  name: רכבל ארגו
  short: שני קילומטרים וחצי של אוויר מנמל בטומי לגבעת אנוריה, שם כל העיר משתרעת כמו מפה לצד הים.
  body: >-
    **הרכבל של בטומי נקרא על שם האונייה שהביאה את יאסון לקולכיס - והעלייה בו מרגישה כמו יציאה מנמל: הנמל
    נשאר מתחת, הים מתרחב, והעיר מתכווצת למפה.**


    ארגו נפתח ב-17 באוגוסט 2013, לאחר כחמש שנות בנייה. החברה האוסטרית דופלמאייר תכננה ובנתה את הקו: 2,586
    מטרים בין התחנות, שבעה עמודים, ועשרים תאים בני שמונה מקומות הנוסעים כל כיוון בכרבע שעה. התחנה התחתונה
    נמצאת ברחוב גוגבשווילי לצד הנמל; העליונה על גבעת אנוריה, בגובה 256 מטרים מעל הים.


    הנוף משתנה שלוש פעמים בדרך. קודם גגות וחצרות פנימיות חולפים מתחתיכם - בטומי כפי שלא תראו אותה מהרחוב.
    אחר כך הנמל העובד: מנופים, מכליות, שורות של מכולות צבעוניות. לבסוף העיר נסוגה לאחור וכל החוף נפתח
    צפונה, ביום בהיר ואף מעבר לקובולטי.


    המתחם העליון נבנה על פי מיתוס הארגונאוטים: קפה-בר, חנות יין ומזכרות, מרפסת תצפית ובית קפה פתוח על
    "סיפון" האונייה. ובכל זאת, בשביל המעקה עליתם לכאן. חצי שעה לפני השקיעה האור שוכב נמוך על הים והעיר
    מתכסה זהב.


    שתי אזהרות. באג'ריה יש ימים מעוננים רבים, והתחנה העליונה שוכנת לרוב בתוך העננים - הביטו מעלה לפני
    שתקנו כרטיס. ברוח חזקה הרכבל נעצר, ובחורף הוא עשוי להיסגר לימים אחדים לבדיקה טכנית.


    עלו בסוף היום ורדו בחשכה: בטומי מתחת לתא מתחילה להידלק רחוב אחר רחוב.
  tip: >-
    שעה וחצי בסך הכול מספיקה: עלייה, מרפסת, ירידה. כרטיסי הלוך ושוב נמכרים בתחנה התחתונה; בבדיקתנו האחרונה
    עלו 30 לארי, והקו פעל כל השנה בערך מ-11:00 עד 20:30 - מחירים ושעות משתנים, אז אשרו מראש. בערבי קיץ
    התור עלול להגיע לחצי שעה, כך שהבוקר נוח יותר. התאים סגורים לחלוטין, כך שהנסיעה נוחה גם למי שמפחד מגובה.
    בפסגה יש יותר רוח ומעלה או שתיים קריר יותר - הביאו מעיל קל. אם הפסגה בתוך עננים, הגן הבוטני או הטיילת
    הם הבחירה הטובה יותר.
  route: >-
    מטביליסי המרחק הוא 370 ק"מ, כחמש שעות וחצי, סלול לכל אורכו. סעו בכביש E60 דרך קוטאיסי עד סמטרדיה,
    ואז ב-S12 לחוף ומשם דרומה דרך קובולטי לבטומי. התחנה התחתונה נמצאת ברחוב גוגבשווילי לצד הנמל, כ-650
    מטרים מפארק הנפלאות, כך שאפשר להגיע ברגל ממגדל האלף-בית. יש חנייה קטנה בתחנה, וכשהיא מלאה, חנו ברחובות
    שמסביב. תדלקו בקובולטי או בכניסה לבטומי. רכב אקונומי מספיק בהחלט.
ar:
  name: تلفريك أرغو
  short: مسافة كيلومترين ونصف في الهواء من ميناء باتومي إلى تلة أنوريا، حيث تنبسط المدينة كلها عند البحر
    كخريطة.
  body: >-
    **سُمّي تلفريك باتومي على اسم السفينة التي حملت ياسون إلى كولخيس - والصعود فيه يشبه فعلًا مغادرة الميناء:
    يبقى الميناء في الأسفل، ويتوسّع البحر، وتتقلّص المدينة إلى خريطة.**


    افتُتح أرغو في 17 أغسطس 2013 بعد نحو خمس سنوات من البناء. صمّمت الشركة النمساوية "دوبلماير" هذا الخط
    وبنته: 2,586 مترًا بين المحطتين، وسبعة أبراج تحمل الكابل، وعشرون عربة تتّسع كلٌّ منها لثمانية ركاب
    تقطع كلّ اتجاه في نحو خمس عشرة دقيقة. تقع المحطة السفلى في شارع غوغباشفيلي، بجانب الميناء؛ والمحطة
    العلوية على تلة أنوريا، على ارتفاع 256 مترًا فوق البحر.


    يتغيّر المشهد ثلاث مرات في الطريق. أولًا تمرّ الأسطح والأفنية الداخلية تحتك - باتومي كما لا تراها
    أبدًا من الشارع. ثم الميناء العامل: الرافعات والناقلات وصفوف الحاويات الملوّنة. وأخيرًا تتراجع المدينة
    خلفك وينفتح الساحل كله شمالًا، وفي يوم صافٍ إلى ما بعد كوبوليتي.


    المجمّع العلوي مبني على أسطورة الأرغونوتيين: مقهى-بار، ومتجر نبيذ وهدايا تذكارية، ومنصة مراقبة، ومقهى
    مكشوف على "سطح" السفينة. ومع ذلك، فمن أجل الدرابزين صعدت إلى هنا. قبل الغروب بنصف ساعة ينبسط الضوء
    منخفضًا فوق البحر وتتلوّن المدينة بالذهب.


    تحذيران. تكثر الأيام الغائمة في أدجارا، وغالبًا ما تكون المحطة العلوية داخل الغيوم - انظر إلى الأعلى
    قبل شراء التذكرة. يتوقّف الخط عند هبوب رياح قوية، وقد يُغلق في الشتاء أيامًا للفحص الفني.


    اصعد في نهاية اليوم وانزل في الظلام، فباتومي تحتك تُشعل نفسها شارعًا بعد شارع.
  tip: >-
    خصّص ساعة ونصفًا إجمالًا: الصعود، والمنصة، والنزول. تُباع تذاكر الذهاب والعودة في المحطة السفلى؛ وفي
    آخر تحقق لنا كانت بسعر 30 لاري، وكان الخط يعمل طوال السنة من نحو الساعة 11 صباحًا حتى 8:30 مساءً -
    تتغير الأسعار والمواعيد، فتأكّد قبل الذهاب. قد يمتدّ طابور المساء الصيفي إلى نصف ساعة، فالصباح أسهل.
    العربات مغلقة بالكامل، مما يجعل الرحلة مريحة حتى لمن ينزعج من المرتفعات. الجو في القمة أشدّ ريحًا
    وأبرد بدرجة أو درجتين، فاحمل سترة خفيفة. إن كانت القمة داخل الغيم، فالحديقة النباتية أو الكورنيش خيار
    أفضل.
  route: >-
    تبعد باتومي عن تبليسي 370 كم، أي نحو خمس ساعات ونصف، على طريق معبّد بالكامل. سِر على الطريق E60 عبر
    كوتايسي إلى سامتريديا، ثم على S12 إلى الساحل، ثم جنوبًا عبر كوبوليتي إلى باتومي. تقع المحطة السفلى
    في شارع غوغباشفيلي بجانب الميناء، على نحو 650 مترًا من حديقة المعجزات، فيمكنك المشي إليها من برج الأبجدية.
    يوجد موقف صغير عند المحطة، وإن كان ممتلئًا فاترك السيارة في الشوارع المجاورة. تزوّد بالوقود في كوبوليتي
    أو عند مدخل باتومي. تكفي سيارة اقتصادية تمامًا.
