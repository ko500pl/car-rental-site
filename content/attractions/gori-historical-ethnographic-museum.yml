ka:
  name: გორის სერგი მაკალათიას სახელობის ისტორიულ-ეთნოგრაფიული მუზეუმი
  short: >-
    გორის მეორე ამბავი: თამარ მეფის დროის მონეტები, ალექსანდრე მაკედონელის დრაქმა, ოქრომკედით ნაქარგი
    შესამოსელი და ძველი ხელნაწერები — ციხიდან რამდენიმე ნაბიჯზე.
  body: >-
    **ქალაქში, რომელსაც მსოფლიო ერთი მკვიდრის გამო იცნობს, ყველაზე საინტერესო მუზეუმი სულაც არ ეძღვნება
    მას.**


    ისტორიულ-ეთნოგრაფიული მუზეუმი 1935 წელს დაარსდა და ისტორიკოს სერგი მაკალათიას სახელს ატარებს, რომელიც
    მისი ერთ-ერთი პირველი დირექტორი იყო. მუზეუმი ძველ უბანში, კირიონ II-ის ქუჩაზე დგას, მთავარი მოედნიდან
    და ციხიდან რამდენიმე წუთის სავალზე, და არა ერთი კაცის, არამედ გორისა და მისი მხარის ამბავს ჰყვება.
    ფონდებში ათეულ ათასობით ნივთი ინახება: ლითონის ნაკეთობები, კედლის მხატვრობა, მცირე პლასტიკა, ჰერალდიკა
    და სოფლის ყოფის მასალა.


    დაიწყეთ მონეტებით — ისინი საუკუნეებს ერთ ვიტრინაში ატევენ: თამარ მეფისა და დავით ნარინის დროს მოჭრილი
    ფული და ალექსანდრე მაკედონელის დრაქმა. შემდეგ ქსოვილები — ქართული და ყარაბაღული ხალიჩები, აბრეშუმითა
    და ოქრომკედით ნაქარგი საეკლესიო შესამოსელი — და მუსიკალური საკრავები. ყველაზე გრძელ გზას იარაღი გადის:
    კაჟის უძველესი სატევრებიდან XX საუკუნის ცეცხლსასროლ იარაღამდე.


    მუზეუმის მშვიდი გული ხელნაწერთა განყოფილებაა. აქ ინახება „ამირან-დარეჯანიანისა“ და „ქარამანიანის“
    1729 წელს გადაწერილი ნუსხები, ქართველ მეფეთა სიგელები, კურთხევანის ადრეული ნაბეჭდი გამოცემები და გაზეთ
    „ივერიის“ ძველი ნომრები.


    მერე ისევ ციხისკენ გაისეირნეთ. ქალაქი სხვაგვარად დაგენახებათ: არა იმდენად განთქმული დაბადების ადგილი,
    რამდენადაც გზაჯვარედინი, რომელიც უკვე ცხრა ათწლეულია საკუთარ წარსულს აგროვებს.
  tip: >-
    საქართველოს ტურიზმის ეროვნული ადმინისტრაციის ცნობით, მუზეუმი 9:30-დან 17:30-მდე მუშაობს, კვირასა და
    ორშაბათს კი დაკეტილია; რეგიონულ მუზეუმებში საათები ხშირად იცვლება, ამიტომ სპეციალურად ჩამოსვლამდე
    ადგილზე გადაამოწმეთ. ბილეთის ფასი სალაროსთან დააზუსტეთ და ცოტაოდენი ნაღდი ფული იქონიეთ. ექსპოზიციისთვის
    ერთი საათი საკმარისია. მანქანა ახლომახლო ქუჩაზე დააყენეთ და ძველი ცენტრი ფეხით მოიარეთ: ციხე უფასო
    და ახლოსაა, სტალინის მუზეუმიც მოკლე სავალზეა — თუ კონტრასტი გაინტერესებთ.
  route: >-
    თბილისიდან ს1 (E60) მაგისტრალს დასავლეთისკენ დაახლოებით ერთი საათი გაჰყევით და გორის გასასვლელზე გადაუხვიეთ.
    მისასვლელი გზა პირდაპირ ცენტრში შეგიყვანთ; მუზეუმი ციხის ძირას, ძველ უბანში, კირიონ II-ის ქუჩაზეა.
    სულ დაახლოებით 85 კმ და 1 საათი და 10 წუთია, მთელ გზაზე ასფალტია, ამიტომ ეკონომ კლასის მანქანა იდეალურია.
    ბენზინგასამართი სადგურები ს1-ზეც და ქალაქის შესასვლელშიც ბევრია. მანქანა ახლომახლო ქუჩაზე დატოვეთ
    — ცენტრი კომპაქტურია და ციხე, მთავარი მოედანი და სტალინის მუზეუმი ფეხით სავალ მანძილზეა.
en:
  name: Gori Historical and Ethnographic Museum (Sergi Makalatia Museum)
  short: >-
    Gori's other story: coins of Queen Tamar's reign, a drachma of Alexander the Great, gold-embroidered
    vestments and old manuscripts, near the fortress.
  body: >-
    **In a town the world knows for a single native son, the most rewarding museum is not about him at
    all.**


    The Historical and Ethnographic Museum was founded in 1935 and carries the name of the historian Sergi
    Makalatia, one of its first directors. It stands on Kirion II Street in the old centre, a few minutes'
    walk from the main square and the fortress, and it tells the story of Gori and its district rather
    than of any one man. Its stores run to tens of thousands of objects: metalwork, wall paintings, small
    sculpture, heraldry and the material of everyday country life.


    Start with the coins, because they fold centuries into a single glass case: pieces minted under Queen
    Tamar and King David Narin, and a drachma of Alexander the Great. Then the cloth — Georgian and Karabakh
    carpets, church vestments embroidered in silk and gold thread — and the musical instruments. The weapons
    trace the longest arc of all, from ancient flint daggers to 20th-century firearms.


    The manuscript department is the quiet heart of the place. It keeps copies, made in 1729, of the romances
    Amiran-Darejaniani and Qaramaniani; charters issued by Georgian kings; early printed editions of the
    Euchologion, the Orthodox book of blessings and services; and old issues of the newspaper Iveria.


    Walk back towards the fortress afterwards. The town looks different: less a famous birthplace, more
    a crossroads that has spent nine decades collecting its own past.
  tip: >-
    According to Georgia's National Tourism Administration, the museum opens 9:30–17:30 and closes on
    Sundays and Mondays; regional museum hours do shift, so confirm locally before making a special trip.
    Check the ticket price at the desk and carry a little cash. An hour covers the displays. Park on a
    nearby street and see the old centre on foot: the fortress is free and close by, and the Stalin Museum
    is a short walk away if you want the contrast.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi for about an hour and leave at the Gori exit. The access
    road brings you straight into the centre; the museum is on Kirion II Street in the old town below
    the fortress. Total: about 85 km and 1 hour 10 minutes, paved all the way, so an economy car is ideal.
    Fuel stations are plentiful on the S1 and on the approaches to town. Park on a nearby street — the
    centre is compact, and the fortress, the main square and the Stalin Museum are all within walking
    distance.
ru:
  name: Историко-этнографический музей Гори (музей Серги Макалатия)
  short: >-
    Другая история Гори: монеты времён царицы Тамары, драхма Александра Македонского, облачения с золотым
    шитьём и старинные рукописи — рядом с крепостью.
  body: >-
    **В городе, который весь мир знает по одному-единственному уроженцу, самый интересный музей посвящён
    вовсе не ему.**


    Историко-этнографический музей основан в 1935 году и носит имя историка Серги Макалатия, одного из
    первых его директоров. Он стоит на улице Кириона II в старом центре, в нескольких минутах ходьбы от
    главной площади и крепости, и рассказывает историю Гори и его края, а не одного человека. В фондах
    — десятки тысяч предметов: изделия из металла, настенная живопись, мелкая пластика, геральдика, вещи
    повседневного сельского быта.


    Начните с монет: в одной витрине умещаются целые века — монеты, отчеканенные при царице Тамаре и царе
    Давиде Нарине, и драхма Александра Македонского. Затем ткани — грузинские и карабахские ковры, церковные
    облачения, расшитые шёлком и золотой нитью, — и музыкальные инструменты. Длиннее всех путь у оружия:
    от древних кремнёвых кинжалов до огнестрельного оружия XX века.


    Отдел рукописей — тихое сердце музея. Здесь хранятся списки романов «Амиран-Дареджаниани» и «Караманиани»,
    сделанные в 1729 году; грамоты грузинских царей; ранние печатные издания Евхология — православной
    книги благословений и чинопоследований; и старые номера газеты «Иверия».


    Потом снова пройдитесь к крепости. Город покажется другим: уже не столько знаменитой родиной, сколько
    перекрёстком, который девять десятилетий собирает собственное прошлое.
  tip: >-
    По данным Национальной администрации туризма Грузии, музей открыт с 9:30 до 17:30, выходные — воскресенье
    и понедельник; часы работы региональных музеев меняются, так что, если едете специально, уточните
    на месте. Цену билета узнайте в кассе и возьмите немного наличных. На экспозицию хватит часа. Оставьте
    машину на соседней улице и обойдите старый центр пешком: крепость бесплатна и совсем рядом, а до Музея
    Сталина — короткая прогулка, если хочется контраста.
  route: >-
    Из Тбилиси около часа поезжайте на запад по автомагистрали S1 (E60) и сверните на съезде к Гори. Подъездная
    дорога приведёт прямо в центр; музей — на улице Кириона II в старом городе, под крепостью. Всего около
    85 км и 1 час 10 минут, асфальт на всём протяжении, так что машина эконом-класса — идеальный выбор.
    Заправок хватает и на S1, и на въездах в город. Паркуйтесь на соседней улице: центр компактный, и
    крепость, главная площадь и Музей Сталина — в пешей доступности.
fa:
  name: موزه‌ی تاریخی و مردم‌نگاری گوری (موزه‌ی سرگی ماکالاتیا)
  short: >-
    روایت دیگر گوری: سکه‌های دوران ملکه تامار، درهمی از اسکندر مقدونی، جامه‌های زربفت کلیسایی و نسخه‌های
    خطی کهن، در نزدیکی دژ.
  body: >-
    **در شهری که جهان آن را به خاطر تنها یکی از فرزندانش می‌شناسد، دیدنی‌ترین موزه اصلاً درباره‌ی او نیست.**


    موزه‌ی تاریخی و مردم‌نگاری در ۱۹۳۵ بنیان نهاده شد و نام تاریخ‌نگار، سرگی ماکالاتیا، یکی از نخستین
    مدیرانش، را بر خود دارد. موزه در خیابان کیریون دوم در مرکز قدیمی شهر است، چند دقیقه پیاده از میدان
    اصلی و دژ، و داستان گوری و پیرامونش را روایت می‌کند، نه داستان یک مرد را. گنجینه‌هایش به ده‌ها هزار
    شیء می‌رسد: فلزکاری، نقاشی دیواری، پیکره‌های کوچک، نشان‌شناسی و اسباب زندگی روزمره‌ی روستایی.


    از سکه‌ها شروع کنید، چون چند سده را در یک ویترین شیشه‌ای جمع می‌کنند: سکه‌هایی که در روزگار ملکه تامار
    و شاه داوید نارین ضرب شده‌اند، و یک درهم (دراخما) از اسکندر مقدونی. سپس نوبت پارچه‌هاست — فرش‌های
    گرجی و قره‌باغی، جامه‌های کلیسایی دوخته با ابریشم و نخ زر — و سازهای موسیقی. جنگ‌افزارها بلندترین
    مسیر را می‌پیمایند: از خنجرهای سنگ چخماقی باستانی تا سلاح‌های گرم سده‌ی بیستم.


    بخش نسخه‌های خطی قلب آرام موزه است. در آن رونوشت‌هایی از داستان‌های «امیران-دارجانیانی» و «قرامانیانی»
    که در ۱۷۲۹ کتابت شده‌اند، فرمان‌های شاهان گرجی، چاپ‌های نخستین اوخولوگیون (کتاب دعاها و آیین‌های کلیسای
    ارتدکس) و شماره‌های قدیمی روزنامه‌ی «ایوریا» نگهداری می‌شود.


    پس از آن، دوباره به سوی دژ قدم بزنید. شهر دیگرگون به چشم می‌آید: کمتر زادگاهی نامدار، بیشتر گذرگاهی
    تاریخی که نُه دهه است گذشته‌ی خود را گرد می‌آورد.
  tip: >-
    به گفته‌ی سازمان ملی گردشگری گرجستان، موزه از ۹:۳۰ تا ۱۷:۳۰ باز است و یکشنبه‌ها و دوشنبه‌ها تعطیل؛
    ساعت کار موزه‌های شهرستانی گاهی تغییر می‌کند، پس اگر فقط برای آن می‌آیید، پیش از سفر از خود موزه بپرسید.
    بهای بلیت را پای گیشه بپرسید و کمی پول نقد همراه داشته باشید. یک ساعت برای دیدن نمایشگاه بس است. خودرو
    را در خیابانی نزدیک پارک کنید و مرکز قدیمی را پیاده بگردید: دژ رایگان است و همین نزدیکی است، و اگر
    دلتان تضاد می‌خواهد، موزه‌ی استالین هم چند قدم آن‌سوتر است.
  route: >-
    از تفلیس حدود یک ساعت در آزادراه S1 (E60) به سمت غرب برانید و از خروجی گوری بیرون بروید. جاده‌ی دسترسی
    شما را یکراست به مرکز شهر می‌برد؛ موزه در خیابان کیریون دوم، در بافت قدیم و پای دژ است. روی‌هم حدود
    ۸۵ کیلومتر و ۱ ساعت و ۱۰ دقیقه، سراسر آسفالت، پس خودروی اکونومی بهترین انتخاب است. جایگاه سوخت هم
    در S1 و هم در ورودی‌های شهر فراوان است. در خیابانی نزدیک پارک کنید: مرکز شهر جمع‌وجور است و دژ، میدان
    اصلی و موزه‌ی استالین همه با پای پیاده در دسترس‌اند.
he:
  name: המוזיאון ההיסטורי-אתנוגרפי של גורי (מוזיאון סרגי מקלתיה)
  short: >-
    הסיפור האחר של גורי: מטבעות מימי המלכה תמר, דרכמה של אלכסנדר מוקדון, גלימות כנסייה רקומות זהב וכתבי
    יד עתיקים, סמוך למבצר.
  body: >-
    **בעיר שהעולם מכיר בזכות בן אחד שנולד בה, המוזיאון המעניין ביותר בכלל לא עוסק בו.**


    המוזיאון ההיסטורי-אתנוגרפי נוסד ב-1935 ונקרא על שם ההיסטוריון סרגי מקלתיה, אחד ממנהליו הראשונים. הוא
    שוכן ברחוב קיריון השני שבמרכז העתיק, דקות הליכה ספורות מהכיכר הראשית ומהמבצר, ומספר את סיפורם של גורי
    ושל הסביבה שלה, ולא של אדם אחד. באוספים עשרות אלפי פריטים: עבודות מתכת, ציורי קיר, פיסול זעיר, הרלדיקה
    וחפצי היומיום של חיי הכפר.


    התחילו במטבעות, כי הם מקפלים מאות שנים לתוך ויטרינה אחת: מטבעות שנטבעו בימי המלכה תמר והמלך דוד נארין,
    ודרכמה של אלכסנדר מוקדון. אחר כך הבדים — שטיחים גאורגיים ושטיחי קרבאך, גלימות כנסייה רקומות במשי ובחוטי
    זהב — וכלי הנגינה. כלי הנשק משרטטים את הקשת הארוכה מכולן: מפגיונות צור קדומים ועד כלי ירייה של המאה
    ה-20.


    מחלקת כתבי היד היא הלב השקט של המקום. שמורים בה העתקים מ-1729 של הרומנסות "אמירן-דרג'ניאני" ו"קרמניאני";
    כתבי הענקה של מלכי גאורגיה; מהדורות דפוס מוקדמות של האוכולוגיון, ספר הברכות והטקסים של הכנסייה האורתודוקסית;
    וגיליונות ישנים של העיתון "איבריה".


    אחר כך טיילו בחזרה אל המבצר. העיר נראית אחרת: פחות מקום הולדתו של מישהו מפורסם, יותר צומת דרכים שכבר
    תשעה עשורים אוסף את עברו.
  tip: >-
    לפי הרשות הלאומית לתיירות של גאורגיה, המוזיאון פתוח בשעות 9:30–17:30 וסגור בימי ראשון ושני; שעות הפתיחה
    של מוזיאונים אזוריים משתנות, אז אם אתם נוסעים במיוחד, ודאו מראש במקום. את מחיר הכרטיס בררו בקופה,
    והחזיקו מעט מזומן. שעה מספיקה לתצוגות. החנו ברחוב סמוך וסיירו במרכז העתיק ברגל: הכניסה למבצר חינם
    והוא ממש קרוב, ומוזיאון סטלין במרחק הליכה קצרה, אם בא לכם על הניגוד.
  route: >-
    מטביליסי סעו כשעה מערבה בכביש המהיר S1 (E60) וצאו במחלף גורי. כביש הגישה מוביל ישר למרכז; המוזיאון
    נמצא ברחוב קיריון השני בעיר העתיקה, למרגלות המבצר. בסך הכול כ-85 ק"מ ושעה ועשר דקות, בכביש סלול לכל
    אורכו, כך שרכב אקונומי הוא הבחירה האידיאלית. תחנות דלק יש בשפע גם על S1 וגם בכניסות לעיר. החנו ברחוב
    סמוך: המרכז קומפקטי, והמבצר, הכיכר הראשית ומוזיאון סטלין כולם במרחק הליכה.
ar:
  name: متحف غوري التاريخي والإثنوغرافي (متحف سيرغي ماكالاتيا)
  short: >-
    الحكاية الأخرى لغوري: نقود من عهد الملكة تمار، ودرخمة للإسكندر الأكبر، وحُلل كنسية مطرّزة بالذهب،
    ومخطوطات قديمة، على مقربة من القلعة.
  body: >-
    **في مدينة يعرفها العالم بسبب ابنٍ واحد من أبنائها، لا يدور أجدر متاحفها بالزيارة حوله على الإطلاق.**


    تأسّس المتحف التاريخي والإثنوغرافي عام 1935، ويحمل اسم المؤرخ سيرغي ماكالاتيا، أحد أوائل مديريه. يقع
    في شارع كيريون الثاني في الوسط القديم، على بُعد دقائق سيرًا من الساحة الرئيسية والقلعة، ويروي حكاية
    غوري ومنطقتها لا حكاية رجل واحد. وتضمّ مخازنه عشرات الآلاف من القطع: مشغولات معدنية، ورسومًا جدارية،
    ومنحوتات صغيرة، وشعارات نبالة، ومقتنيات الحياة الريفية اليومية.


    ابدأوا بالنقود، فهي تطوي قرونًا في واجهة زجاجية واحدة: قطع سُكّت في عهد الملكة تمار والملك داود نارين،
    ودرخمة للإسكندر الأكبر. ثم المنسوجات — سجاد جورجي وآخر من قره باغ، وحُلل كنسية مطرّزة بالحرير وخيوط
    الذهب — والآلات الموسيقية. أما الأسلحة فترسم أطول الأقواس جميعًا: من خناجر الصوّان القديمة إلى الأسلحة
    النارية في القرن العشرين.


    قسم المخطوطات هو القلب الهادئ للمكان. يحفظ نُسخًا منسوخة عام 1729 من حكايتَي «أميران-داريجانياني»
    و«قرمانياني»؛ ومراسيم أصدرها ملوك جورجيا؛ وطبعات مبكرة من الأفخولوجي، كتاب البركات والخِدَم الأرثوذكسي؛
    وأعدادًا قديمة من صحيفة «إيفيريا».


    بعدها عودوا سيرًا نحو القلعة. ستبدو لكم المدينة مختلفة: ليست مسقط رأسٍ شهيرًا بقدر ما هي ملتقى طرق
    يجمع ماضيه منذ تسعة عقود.
  tip: >-
    بحسب الإدارة الوطنية للسياحة في جورجيا، يفتح المتحف من 9:30 إلى 17:30 ويغلق يومي الأحد والاثنين؛ غير
    أن مواعيد المتاحف الإقليمية تتغيّر، فتحقّقوا منها محليًا قبل أن تقصدوه خصيصًا. اسألوا عن سعر التذكرة
    عند شبّاك التذاكر واحملوا قليلًا من النقد. ساعة واحدة تكفي للمعروضات. أوقفوا سيارتكم في شارع قريب
    وتجوّلوا في الوسط القديم سيرًا: القلعة مجانية وقريبة جدًا، ومتحف ستالين على مسافة قصيرة إن أردتم أن
    تروا النقيض.
  route: >-
    من تبليسي سيروا نحو ساعة غربًا على الطريق السريع S1 ‏(E60) واخرجوا عند مخرج غوري. يقودكم الطريق الفرعي
    مباشرة إلى الوسط؛ والمتحف في شارع كيريون الثاني في البلدة القديمة أسفل القلعة. المجموع نحو 85 كم وساعة
    وعشر دقائق، على طريق معبّد بالكامل، لذا فالسيارة الاقتصادية هي الخيار الأمثل. محطات الوقود وفيرة على
    S1 وعند مداخل المدينة. أوقفوا السيارة في شارع قريب: الوسط صغير، والقلعة والساحة الرئيسية ومتحف ستالين
    كلها في متناول المشي.
