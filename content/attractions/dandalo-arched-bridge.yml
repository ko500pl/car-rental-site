ka:
  name: დანდალოს თაღოვანი ხიდი
  short: >-
    XI–XII საუკუნეების კირქვის ხიდი, რომელიც აჭარისწყალზე S-ის ფორმით გადებულა ბათუმიდან 60 კილომეტრში.
    მოაჯირი მას დღემდე არ აქვს.
  body: >-
    **დაახლოებით ცხრაასი წლის წინ ოსტატებმა აჭარისწყალს 21-მეტრიანი ქვის თაღი გადააბეს, მთელ ხიდს S-ის
    მოყვანილობა მისცეს, და ის დღემდე დგას.**


    დანდალოს ხიდი XI–XII საუკუნეებით თარიღდება. მასზე გადიოდა ძველი დიდი გზა, რომელიც შავი ზღვის სანაპიროს
    ახალციხესთან აკავშირებდა. მშენებლებმა ადგილობრივი კირქვა და კირის დუღაბი გამოიყენეს, ხიდის გეგმა კი
    მდინარეს მიანდეს: მარჯვენა ბურჯი პირდაპირ კლდეზეა დაშენებული, მარცხენა კი წყალშია შეჭრილი, რათა მალი
    შემცირებულიყო. ზემოდან ხიდის სავალი ლათინურ S-ს ჰგავს. ასეთ ხიდზე დატვირთვა არათანაბრად ნაწილდება,
    ამიტომ მისი აგება სწორ ხიდზე გაცილებით ძნელია. ხიდის სიგრძე 34,5 მეტრია, თაღი კი 21-მეტრიან მალზე
    მხოლოდ ოთხი მეტრით მაღლდება: ეს დამრეცი კამარაა და არა აჭარის ბევრი სხვა ხიდისთვის ნიშანდობლივი მაღალი
    ნახევარწრე.


    ბურჯს კარგად დააკვირდით და ოთხკუთხა ფოსოების ორ რიგს დაინახავთ, თითო რიგში სამ-სამს. მათში ხის ხარაჩოები
    იყო ჩამჯდარი, ორ იარუსად, თაღი კი ოსტატებმა სწორედ ამ ხარაჩოებზე შეკრეს. სამ მეტრზე ვიწრო სავალს მოაჯირი
    არასოდეს ჰქონია, მხოლოდ მტკაველის სისქის თხელი ქვის ლავგარდანი გასდევს.


    რუსეთის მმართველობის დროს ხეობაში ბათუმი–ახალციხის გზატკეცილი გაიყვანეს და ძველი ხიდის გვერდით დიდი
    რკინის ხიდი ააგეს. დღეს ისიც გაუქმებულია, 300 მეტრით ქვემოთ კი ახალი ხიდი დგას. სოფელი დანდალო, რომელიც
    წერილობით XVI საუკუნიდან იხსენიება, ქვემო და ზემო აჭარას ყოფს. მის აღმოსავლეთ განაპირას, მაღალ კლდეზე,
    კავიანის ციხის ნანგრევებია. გადმოცემით, ციხეს ეს სახელი იმიტომ ჰქვია, რომ მასზე ასვლა მხოლოდ კავით
    შეიძლებოდა.


    თაღის ქვეშ, რიყეზე დადექით და ყური მიუგდეთ. ახალი ხიდი მანქანებს ატარებს, ძველი კი მხოლოდ მდინარის
    ხმას.
  tip: >-
    ნახევარი საათი საკმარისია, მეტი, თუ რიყეზე წასახემსებლად დარჩებით. საუკეთესო ხედი ქვემოდან, ხრეშიანი
    ნაპირიდან იშლება, საიდანაც S-ის მოყვანილობაც და ხარაჩოს ფოსოებიც კარგად ჩანს. ხიდზე მხოლოდ მშრალ ამინდში
    გადადით: მოაჯირი არ აქვს, კირქვა წვიმაში სრიალებს, ბავშვებს კი ხელი ჩაჭიდეთ. გზიდან ჩამავალი ბილიკი
    მოკლეა, მაგრამ შეიძლება ბალახით იყოს გადაზრდილი, ამიტომ გამძლე ფეხსაცმელი ჩაიცვით. ტუალეტი და კაფე
    აქ არ არის, უახლოესი ქედაშია. ვიზიტი მახუნცეთის ხიდსა და ჩანჩქერს შეუთავსეთ: ზემოთ ამოსვლისას მათ
    გვერდით ჩაივლით.
  route: >-
    თბილისიდან ს1-ით (E60), ს12-ით (E692) და ს2-ით (E70) ბათუმამდე იარეთ, შემდეგ შ1-ზე, ბათუმი–ახალციხის
    გზაზე, მთისკენ გადაუხვიეთ და აჭარისწყალს აღმა აჰყევით, მახუნცეთისა და ქედის გავლით. ხიდი დანდალოშია,
    ქედიდან დაახლოებით 18 კილომეტრზე, ბათუმიდან კი 60-იოდე კილომეტრში: თბილისიდან დაახლოებით 415 კილომეტრი,
    ექვსნახევარი საათის სავალი. გზა ბოლომდე ასფალტია, ვიწრო და კლაკნილი. ხიდი მთავარი გზის ქვემოთ, ახალ
    ხიდთან ახლოსაა, ნიშნები პატარაა, ამიტომ კოორდინატებით იარეთ. მანქანა გზისპირას დატოვეთ, ჩიხში ნუ ჩახვალთ.
    ეკონომ-კლასის მანქანა საკმარისია.
en:
  name: Dandalo Arched Bridge
  short: >-
    An 11th–12th-century limestone bridge that bends across the Adjaristsqali in an S, 60 km upriver from
    Batumi, still with no parapet.
  body: >-
    **Some nine hundred years ago, masons threw a single stone arch 21 metres across the Adjaristsqali,
    bent the whole bridge into an S, and it is still standing.**


    Dandalo bridge dates from the eleventh or twelfth century and carried the old trunk route from the
    Black Sea coast to Akhaltsikhe. Its builders used local limestone set in lime mortar and let the river
    dictate the plan: the right-hand abutment sits straight on bedrock, while the left steps out into
    the water to shorten the span. Seen from above, the deck curves like a Latin S, a shape that loads
    the arch unevenly and is far harder to build. It runs 34.5 metres in all, and the arch rises just
    four metres over its 21-metre span: a long, shallow vault rather than the tall half-circle of many
    Adjaran bridges.


    Look closely at the abutment and you will find two rows of square sockets, three to a row. They held
    the timber scaffolding, set in two tiers, on which the masons turned the arch. The deck, less than
    three metres wide, has never had a parapet, only a thin stone cornice about a hand's breadth thick.


    Under Russian rule the Batumi–Akhaltsikhe road was pushed through the valley and a large iron bridge
    was built beside the old one; that too has been retired, replaced by a new crossing 300 metres downstream.
    The village of Dandalo, first recorded in the sixteenth century, marks the line between Lower and
    Upper Adjara. On a high rock at its eastern edge stand the ruins of Kaviani fortress, named, tradition
    says, because the only way up was with a hook, a kavi.


    Stand on the shingle beneath the arch and listen. The new bridge carries the traffic; the old one
    carries only the sound of the river.
  tip: >-
    Half an hour is enough, longer if you picnic on the shingle. The best view is from the gravel bank
    below, where the S-curve and the scaffold sockets show clearly. Cross only in dry weather: there is
    no parapet, the limestone turns slick in rain, and children should be held by the hand. The path down
    from the road is short but can be overgrown, so wear proper shoes. There are no toilets or cafés here;
    the nearest are in Keda. Pair the visit with the Makhuntseti bridge and waterfall, which you pass
    on the way up.
  route: >-
    From Tbilisi follow the S1 (E60), S12 (E692) and S2 (E70) to Batumi, then turn inland onto the Sh1
    Batumi–Akhaltsikhe road up the Adjaristsqali, past Makhuntseti and Keda. The bridge lies at Dandalo,
    about 18 km beyond Keda and some 60 km from Batumi: about 415 km from Tbilisi, around six and a half
    hours. The road is asphalt throughout, narrow and winding. The bridge sits below the main road near
    the modern crossing, and signs are small, so navigate by coordinates. Park on the verge rather than
    driving down the dead-end track. An economy car is enough.
ru:
  name: Арочный мост Дандало
  short: >-
    Известняковый мост XI–XII веков, изогнутый над Аджарисцкали в форме буквы S, в 60 км выше Батуми по
    течению; до сих пор без перил.
  body: >-
    **Примерно девятьсот лет назад каменщики перебросили через Аджарисцкали единую каменную арку в 21
    метр, изогнули весь мост в форму латинской S — и он стоит до сих пор.**


    Мост Дандало датируется XI или XII веком и когда-то нёс на себе старую магистральную дорогу от черноморского
    побережья до Ахалцихе. Его строители использовали местный известняк на известковом растворе и позволили
    реке диктовать план: правая опора стоит прямо на скале, а левая выходит в воду, чтобы сократить пролёт.
    Сверху проезжая часть изгибается, как латинская S, — форма, которая нагружает арку неравномерно и
    куда сложнее в исполнении. Общая длина моста — 34,5 метра, а сама арка поднимается всего на четыре
    метра над 21-метровым пролётом: длинный, невысокий свод, а не высокий полукруг, характерный для многих
    мостов Аджарии.


    Присмотритесь к опоре — и увидите два ряда квадратных гнёзд, по три в ряду. В них держались деревянные
    леса, установленные в два яруса, на которых каменщики выводили арку. Проезжая часть, шириной меньше
    трёх метров, никогда не имела перил — только тонкий каменный карниз толщиной в ладонь.


    При русском владычестве по долине провели дорогу Батуми–Ахалцихе и рядом со старым мостом построили
    большой железный; сегодня и он выведен из эксплуатации, заменён новым мостом в 300 метрах ниже по
    течению. Село Дандало, впервые упомянутое в XVI веке, отмечает границу между Нижней и Верхней Аджарией.
    На высокой скале у его восточной окраины стоят развалины крепости Кавиани — по преданию, названной
    так потому, что подняться на неё можно было только с помощью крюка, «кави».


    Встаньте на галечнике под сводом и слушайте. Новый мост несёт машины; старый несёт только звук реки.
  tip: >-
    Хватит получаса, дольше — если устроите пикник на галечнике. Лучший вид открывается с гравийного берега
    внизу, откуда хорошо видны и S-образный изгиб, и гнёзда лесов. Переходите только в сухую погоду: перил
    нет, известняк становится скользким в дождь, а детей нужно держать за руку. Тропа от дороги короткая,
    но может быть заросшей, так что наденьте нормальную обувь. Туалетов и кафе здесь нет, ближайшие —
    в Кеде. Совместите визит с мостом и водопадом Махунцети, которые встретятся вам на пути вверх.
  route: >-
    Из Тбилиси по S1 (E60), S12 (E692) и S2 (E70) до Батуми, затем сверните от побережья на Ш1, дорогу
    Батуми–Ахалцихе, вверх по Аджарисцкали, минуя Махунцети и Кеду. Мост находится в Дандало, примерно
    в 18 км за Кедой и около 60 км от Батуми: около 415 км от Тбилиси, примерно шесть с половиной часов.
    Дорога асфальтирована на всём протяжении, узкая и петляющая. Мост лежит ниже главной дороги, рядом
    с новым мостом, а указатели небольшие, так что ориентируйтесь по координатам. Оставьте машину на обочине,
    а не на тупиковой грунтовке. Хватит машины экономкласса.
fa:
  name: پل طاق‌دار داندالو
  short: >-
    پلی از سنگ آهک، متعلق به سده‌های یازدهم و دوازدهم، که به شکل حرف S بر رودخانه‌ی آجاریستسکالی خم شده
    است، در ۶۰ کیلومتری بالادست باتومی؛ هنوز بدون نرده.
  body: >-
    **نزدیک به نهصد سال پیش، بنایانی طاقی سنگی با دهانه‌ی ۲۱ متر بر رودخانه‌ی آجاریستسکالی افراشتند، تمام
    پل را به شکل حرف S خم کردند، و آن پل هنوز ایستاده است.**


    پل داندالو به سده‌ی یازدهم یا دوازدهم بازمی‌گردد و بر آن راه بزرگ کهنی می‌گذشت که ساحل دریای سیاه
    را به آخالتسیخه می‌پیوست. سازندگانش سنگ آهک محلی را با ملاط آهکی به کار بردند و طرح پل را به خواست
    رودخانه سپردند: پایه‌ی راست مستقیم بر صخره نشسته، و پایه‌ی چپ درون آب پیش رفته تا دهانه کوتاه‌تر شود.
    از بالا، عرشه‌ی پل مانند حرف لاتین S خمیده است، شکلی که بار را نامتوازن بر طاق می‌نشاند و ساختنش بسیار
    دشوارتر است. طول کل پل ۳۴٫۵ متر است، و طاق آن تنها چهار متر بر دهانه‌ی ۲۱ متری بلندی می‌گیرد: طاقی
    کشیده و کم‌قوس، نه آن نیم‌دایره‌ی بلندی که در بسیاری از پل‌های آجارا دیده می‌شود.


    به پایه‌ی پل دقیق شوید و دو ردیف حفره‌ی چهارگوش خواهید دید، سه‌تا در هر ردیف. در آن‌ها داربست‌های
    چوبی جای می‌گرفت، در دو طبقه، و بنایان بر همان داربست‌ها طاق را بستند. عرشه، که کمتر از سه متر پهنا
    دارد، هرگز نرده نداشته، تنها لبه‌ای باریک از سنگ به ضخامت یک کف دست.


    در دوران فرمانروایی روسیه، راه باتومی-آخالتسیخه از میان دره کشیده شد و پلی بزرگ از آهن در کنار پل
    کهن ساخته شد؛ امروز آن نیز از کار افتاده و پلی تازه، سیصد متر پایین‌تر، جای آن را گرفته است. روستای
    داندالو، که نخستین‌بار در سده‌ی شانزدهم ثبت شده، مرز میان آجارای زیرین و بالایی را می‌کشد. بر صخره‌ای
    بلند در کنار خاوری آن، ویرانه‌های قلعه‌ی کاویانی برجاست؛ به گفته‌ی روایت، نامش را از آن گرفته که تنها
    راه بالا رفتن از آن با یک قلاب، یک «کاوی»، بوده است.


    بر سنگریزه‌های زیر طاق بایستید و گوش دهید. پل تازه ماشین‌ها را می‌برد؛ پل کهن تنها صدای رودخانه را.
  tip: >-
    نیم‌ساعت کافی است، بیشتر اگر بر سنگریزه‌ها پیک‌نیک کنید. بهترین چشم‌انداز از کرانهٔ ریگی پایین پل
    است، جایی که خمیدگی S و حفره‌های داربست به‌خوبی دیده می‌شوند. تنها در هوای خشک از پل بگذرید: نرده
    ندارد، سنگ آهک در باران لیز می‌شود، و باید دست کودکان را گرفت. مسیر از راه تا پل کوتاه است اما ممکن
    است پوشیده از علف باشد، پس کفشی مناسب بپوشید. سرویس بهداشتی و کافه‌ای این‌جا نیست؛ نزدیک‌ترین در کدا
    است. دیدار را با پل و آبشار ماخونتسِتی، که در راه بالا از کنارشان می‌گذرید، همراه کنید.
  route: >-
    از تفلیس مسیرهای S1 (E60)، S12 (E692) و S2 (E70) را تا باتومی دنبال کنید، سپس به سوی داخل، به Sh1،
    راه باتومی-آخالتسیخه، بپیچید و در طول آجاریستسکالی رو به بالا، از کنار ماخونتسِتی و کدا، بروید. پل
    در داندالو است، نزدیک ۱۸ کیلومتر پس از کدا و نزدیک ۶۰ کیلومتر از باتومی: از تفلیس حدود ۴۱۵ کیلومتر،
    نزدیک به شش ساعت و نیم. راه تا آخر آسفالت، باریک و پرپیچ‌وخم است. پل پایین‌تر از راه اصلی، نزدیک به
    پل تازه، جای دارد، و تابلوها کوچک‌اند، پس با کمک مختصات جغرافیایی راه را پیدا کنید. ماشین را کنار
    راه بگذارید، نه در راه بن‌بست. خودرویی اقتصادی کافی است.
he:
  name: הגשר המקושת של דנדלו
  short: גשר אבן גיר מהמאה ה-11–12, המתעקל בצורת S מעל האג'ריסצקלי, 60 ק"מ במעלה הנהר מבטומי, עדיין בלי
    מעקה.
  body: >-
    **לפני כתשע מאות שנה מתחו בנאים קשת אבן אחת של 21 מטרים על פני האג'ריסצקלי, כיפפו את הגשר כולו לצורת
    S, והוא עדיין עומד.**


    גשר דנדלו מתוארך למאה ה-11 או ה-12, ועליו עברה הדרך הראשית הישנה מחוף הים השחור לאחלציחה. בוניו השתמשו
    באבן גיר מקומית עם טיט סיד, והשאירו לנהר לקבוע את התוכנית: הבסיס הימני יושב היישר על הסלע, ואילו השמאלי
    יוצא לתוך המים כדי לקצר את המפתח. מלמעלה, סיפון הגשר מתעקל כמו האות הלטינית S, צורה שמעמיסה על הקשת
    בצורה לא-אחידה והרבה יותר קשה לבנייה. אורכו הכולל 34.5 מטרים, והקשת עולה רק ארבעה מטרים מעל מפתח של
    21 מטרים: קמרון ארוך ושטוח, ולא חצי-העיגול הגבוה שמאפיין גשרים רבים באג'ריה.


    התבוננו היטב בבסיס ותמצאו שתי שורות של שקעים מרובעים, שלושה בכל שורה. בהם ישבו פיגומי עץ, בשתי שכבות,
    שעליהם בנו הבנאים את הקשת. הסיפון, שרוחבו פחות משלושה מטרים, לא היה לו מעקה מעולם, רק כרכוב אבן דק
    בעובי כף יד.


    בתקופת השלטון הרוסי נסללה דרך בטומי-אחלציחה בעמק ונבנה גשר ברזל גדול לצד הישן; גם הוא כבר מוצא משימוש,
    ותחתיו מעבר חדש שנבנה 300 מטרים במורד הנהר. הכפר דנדלו, שתועד לראשונה במאה ה-16, מסמן את הקו בין אג'ריה
    התחתית והעליונה. על סלע גבוה בקצהו המזרחי עומדות חורבות מצודת קוויאני, שעל פי המסורת נקראה כך משום
    שהדרך היחידה לעלות אליה הייתה בעזרת קרס – "קאווי" בגאורגית.


    עמדו על החצץ מתחת לקשת והאזינו. הגשר החדש נושא את התנועה; הישן נושא רק את קול הנהר.
  tip: >-
    חצי שעה מספיקה, יותר אם עושים פיקניק על החצץ. התצפית הטובה ביותר היא מהגדה החצצית שמתחת, שממנה נראים
    היטב גם עיקול ה-S וגם שקעי הפיגומים. חצו רק במזג אוויר יבש: אין מעקה, אבן הגיר מחליקה בגשם, וילדים
    צריך להחזיק ביד. השביל היורד מהדרך קצר אבל יכול להיות מכוסה עשבים, אז נעלו נעליים מתאימות. אין כאן
    שירותים או בתי קפה; הקרובים ביותר בקדה. שלבו את הביקור עם גשר ומפל מאחונצטי, שעל פניהם תעברו בעלייה.
  route: >-
    מטביליסי המשיכו ב-S1 (E60), S12 (E692) ו-S2 (E70) עד בטומי, ואז פנו פנימה ל-Sh1, דרך בטומי-אחלציחה,
    במעלה האג'ריסצקלי, דרך מאחונצטי וקדה. הגשר נמצא בדנדלו, כ-18 ק"מ אחרי קדה וכ-60 ק"מ מבטומי: כ-415
    ק"מ מטביליסי, כשש שעות וחצי. הדרך סלולה מתחילתה ועד סופה, צרה ומתפתלת. הגשר נמצא מתחת לדרך הראשית,
    קרוב למעבר המודרני, והשלטים קטנים, אז נווטו לפי קואורדינטות. חנו בשוליים ואל תרדו בשביל העפר המוביל
    למבוי סתום. מכונית אקונומית מספיקה.
ar:
  name: جسر داندالو المقوّس
  short: >-
    جسر من الحجر الجيري يعود إلى القرنين الحادي عشر والثاني عشر، يلتوي على شكل حرف S فوق نهر أدجاريستسكالي،
    على بعد 60 كم من باتومي صعودًا؛ لا يزال بلا درابزين.
  body: >-
    **قبل نحو تسعمئة عام، مدّ البنّاؤون قوسًا حجريًا واحدًا بطول 21 مترًا عبر أدجاريستسكالي، وثنَوا الجسر
    كله على شكل حرف S، وهو لا يزال قائمًا.**


    يعود جسر داندالو إلى القرن الحادي عشر أو الثاني عشر، وكان يحمل الطريق الرئيسي القديم من ساحل البحر
    الأسود إلى أخالتسيخه. استخدم بناؤوه الحجر الجيري المحلي بمونة الجير، وتركوا للنهر أن يحدد التصميم:
    الدعامة اليمنى تقوم مباشرة على الصخر، بينما تتقدم اليسرى داخل الماء لتقليص طول الفتحة. من الأعلى،
    ينحني سطح الجسر كحرف S لاتيني، وهو شكل يوزّع الحمل على القوس توزيعًا غير متكافئ ويجعل البناء أصعب
    كثيرًا. يبلغ طوله الإجمالي 34.5 مترًا، ولا يرتفع القوس إلا أربعة أمتار فوق فتحة طولها 21 مترًا: قبو
    طويل منخفض، لا نصف الدائرة العالي الذي يميّز كثيرًا من جسور أدجارا.


    انظروا جيدًا إلى الدعامة فسترون صفّين من الفجوات المربعة، ثلاثة في كل صف. كانت تحمل سقالات خشبية،
    على طبقتين، بنى البناؤون القوس عليها. سطح الجسر، الذي يقل عرضه عن ثلاثة أمتار، لم يكن له درابزين قط،
    بل فقط إفريز حجري رقيق بسماكة راحة اليد.


    في عهد الحكم الروسي، شُقّ طريق باتومي-أخالتسيخه عبر الوادي، وبُني جسر حديدي كبير إلى جانب القديم؛
    وهو أيضًا خارج الخدمة اليوم، وحلّ محله معبر جديد على بعد 300 متر إلى الأسفل. قرية داندالو، المذكورة
    لأول مرة في سجلّات القرن السادس عشر، تحدّد الخط بين أدجارا السفلى والعليا. على صخرة عالية عند طرفها
    الشرقي تقوم أنقاض قلعة كافياني، التي يقول التراث إنها سُمّيت بذلك لأن الطريق الوحيد للصعود إليها كان
    بخطّاف، أي "كافي".


    قفوا على الحصى تحت القوس واستمعوا. الجسر الجديد يحمل السيارات؛ والقديم يحمل صوت النهر فقط.
  tip: >-
    نصف ساعة تكفي، وأكثر إن أقمتم نزهة على الحصى. أفضل منظر من الضفة الحصوية أسفله، حيث يظهر انحناء الـS
    وفجوات السقالات بوضوح. لا تعبروا الجسر إلا في طقس جافّ: لا درابزين فيه، والحجر الجيري يصبح زلقًا في
    المطر، وأمسكوا بأيدي الأطفال. المسار النازل من الطريق قصير لكنه قد يكون مغطى بالأعشاب، فارتدوا حذاءً
    مناسبًا. لا مراحيض أو مقاهي هنا؛ أقربها في كِدا. اجمعوا بين الزيارة وجسر وشلال ماخونتسِتي، اللذين
    ستمرّون بهما في الطريق صعودًا.
  route: >-
    من تبليسي اتبعوا S1 (E60) و S12 (E692) و S2 (E70) إلى باتومي، ثم انحرفوا نحو الداخل إلى Sh1، طريق
    باتومي-أخالتسيخه، صعودًا بمحاذاة أدجاريستسكالي، عبر ماخونتسِتي وكِدا. يقع الجسر في داندالو، على بعد
    نحو 18 كم بعد كِدا ونحو 60 كم من باتومي: نحو 415 كم من تبليسي، أي قرابة ست ساعات ونصف. الطريق مُعبّد
    بالكامل، ضيق ومتعرّج. يقع الجسر أسفل الطريق الرئيسي، قرب المعبر الحديث، واللوحات صغيرة، فاعتمدوا على
    الإحداثيات للتوجه. اتركوا السيارة على جانب الطريق لا في المسار الترابي المسدود. سيارة اقتصادية تكفي.
