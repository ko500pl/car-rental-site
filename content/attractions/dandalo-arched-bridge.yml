ka:
  name: დანდალოს თაღოვანი ხიდი
  short: შუა საუკუნეების ერთთაღიანი ქვის ხიდი აჭარისწყალზე, ქედის ზემოთ, კვლავ ფეხით გასავლელი.
  body: >-
    **აჭარაში ორმოცამდე ძველი თაღოვანი ხიდი შემორჩა — ეს ევროპის ერთ-ერთი ყველაზე მკვრივი კონცენტრაციაა.**
    დანდალო მათგან ერთ-ერთი ყველაზე მოხდენილია: ერთი თაღი, დაახლოებით ოცდაათმეტრიანი გადაფარვით, აჭარისწყლის
    ვიწრო ნაწილზე გადებული, ქედიდან ცოტა ზემოთ.

    ხიდები XI-XIII საუკუნეებით თარიღდება, ზოგი მოგვიანებითაც. მშენებლობის ხერხი მარტივია და ჭკვიანი: მდინარის
    ორივე ნაპირზე კლდის ბუნებრივი გამონაშვერი გამოიყენეს ბურჯად, თაღი კი ხის კარკასზე აიგო და შემდეგ კარკასი
    მოხსნეს. დუღაბში კირსა და კვერცხის ცილას ურევდნენ — სწორედ ამიტომ დგანან ეს ხიდები ჯერ კიდევ, მაშინ
    როცა მათ გვერდით საბჭოთა ბეტონის ხიდები დაინგრა.

    დანდალოსთან რამდენიმე რამ საყურადღებოა:

    - თაღი **წრიული კი არა, ოდნავ წაწვეტებულია** — მუშაობს უფრო ეფექტურად და ხიდსაც სიმაღლეს მატებს

    - **ბრტყელი ქვის ფილები** ზედაპირზე ისეა დაწყობილი, რომ წყალი გვერდზე გადიოდეს

    - მოაჯირი არასდროს ყოფილა: ხიდი პირუტყვისა და ტვირთისთვის აშენდა, არა გასეირნებისთვის

    ნახვას ოციოდე წუთი სჭირდება. თუ დროც გაქვს და ინტერესიც, ხეობაში კიდევ რამდენიმე ხიდია — წაბლანა და
    ფურტიო ქედის მუნიციპალიტეტში, მახუნცეთის ხიდი კი ჩანჩქერთან, უფრო ცნობილი და უფრო ხალხმრავალი. დანდალო
    სწორედ იმით სჯობს, რომ აქ თითქმის არავინაა: მდინარის ხმა, თაღი და ტყე ორივე ნაპირზე.
  tip: >-
    ოცი წუთი სავსებით საკმარისია. ხიდზე ფეხით გასვლა შეიძლება, მაგრამ მოაჯირი არ არის და ქვა წვიმაში მოლიპულია
    — ბავშვს ხელი მოკიდე. მისასვლელი ბილიკი გზიდან მოკლეა, თუმცა ბალახიანი და ცოცხიანი; ღია ფეხსაცმელი
    არ გამოდგება. ტუალეტი და კაფე ადგილზე არ არის — უახლოესი ქედაშია. ნისლიან დილას ხიდი ყველაზე კარგად
    ჩანს, შუადღის სინათლე ბრტყელია.
  route: >-
    ბათუმიდან აჭარისწყლის ხეობით აღმოსავლეთით მახუნცეთისა და ქედის გავლით, შემდეგ კიდევ ხუთიოდე კილომეტრი
    — თბილისიდან ჯამში 402 კმ, დაახლოებით ექვსი საათი. ხეობის გზა ასფალტია, ვიწრო და კლაკნილი. ხიდი მთავარი
    გზიდან ცოტა ჩამოსაშვებია, ნიშანი პატარაა და ადვილად გამოგრჩება — ნავიგატორზე დაეყრდენი. მანქანა გზის
    პირას დგება, ჩიხში არ შეხვიდე. საწვავი ქედაშია. ეკონომ-კლასი საკმარისია.
en:
  name: Dandalo Arched Bridge
  short: A medieval single-span stone bridge over the Adjaristsqali above Keda, still crossable on foot.
  body: >-
    **Around forty old arched bridges survive in Adjara, one of the densest concentrations anywhere in
    Europe.** Dandalo is among the most elegant of them: a single arch of roughly thirty metres thrown
    across a narrow point of the Adjaristsqali, a short way upstream from Keda.

    The bridges date mostly from the 11th to 13th centuries, some later. The method was simple and clever.
    Natural rock outcrops on both banks served as abutments; the arch was built over a timber frame that
    was then knocked away. Lime mortar was mixed with egg white, which is a large part of why these bridges
    are still standing while Soviet concrete crossings beside them have washed out.

    A few things to notice at Dandalo:

    - The arch is **slightly pointed rather than semicircular** — structurally more efficient, and it
    lifts the deck higher above flood level

    - The **flat stone slabs** on the roadway are laid to shed water sideways rather than let it pool

    - There was never a parapet: this was built for pack animals and loads, not for strolling

    Twenty minutes is enough to see it. If you have the time and the interest, more bridges lie in the
    same valley — Tsablana and Purtio in Keda municipality, and the Makhuntseti bridge beside the waterfall,
    which is better known and much busier. Dandalo's advantage is precisely that almost nobody is here:
    the sound of the river, the arch, and forest on both banks.
  tip: >-
    Twenty minutes is ample. You can walk across, but there is no parapet and the stone is slippery in
    rain, so hold onto children. The approach path from the road is short but grassy and often overgrown;
    open sandals are a poor choice. There are no toilets or cafe on site — the nearest are in Keda. Misty
    mornings show the bridge best; midday light here is flat.
  route: >-
    From Batumi head east up the Adjaristsqali valley through Makhuntseti and Keda, then continue about
    five kilometres further — 402 km from Tbilisi in total, roughly six hours. The valley road is asphalt,
    narrow and winding. The bridge sits slightly below the main road, the sign is small and easy to miss,
    so rely on satellite navigation. Park on the verge rather than driving down the dead-end track. Fuel
    is available in Keda. An economy car is sufficient.
ru:
  name: Арочный мост Дандало
  short: Средневековый однопролётный каменный мост через Аджарисцкали выше Кеды, по которому и сейчас
    можно пройти.
  body: >-
    **В Аджарии сохранилось около сорока старых арочных мостов — одна из самых плотных концентраций в
    Европе.** Дандало — из самых изящных: единственная арка пролётом примерно тридцать метров, переброшенная
    через узкое место Аджарисцкали чуть выше Кеды.

    Мосты датируются в основном XI-XIII веками, некоторые позже. Способ постройки прост и умён. Естественные
    скальные выходы на обоих берегах служили опорами; арку выкладывали по деревянному кружалу, которое
    потом убирали. В известковый раствор добавляли яичный белок — во многом поэтому эти мосты стоят до
    сих пор, тогда как советские бетонные переправы рядом с ними размыло.

    На что стоит посмотреть в Дандало:

    - Арка **не полуциркульная, а слегка стрельчатая** — конструктивно эффективнее и поднимает полотно
    выше паводка

    - **Плоские каменные плиты** проезжей части уложены так, чтобы вода сходила вбок, а не стояла

    - Перил здесь никогда не было: мост строили для вьючных животных и грузов, а не для прогулок

    Двадцати минут достаточно. Если есть время и интерес, в той же долине есть и другие мосты — Цаблана
    и Пуртио в Кедском муниципалитете, а также мост Махунцети у водопада, куда более известный и людный.
    Преимущество Дандало именно в том, что здесь почти никого нет: шум реки, арка и лес по обоим берегам.
  tip: >-
    Двадцати минут хватает. Пройти по мосту можно, но перил нет, а камень в дождь скользит — детей держите
    за руку. Тропа от дороги короткая, но травянистая и часто заросшая; открытые сандалии — плохой выбор.
    Ни туалета, ни кафе на месте нет, ближайшие в Кеде. Лучше всего мост смотрится туманным утром, полуденный
    свет здесь плоский.
  route: >-
    Из Батуми на восток по ущелью Аджарисцкали через Махунцети и Кеду, затем ещё около пяти километров
    — от Тбилиси всего 402 км, примерно шесть часов. Дорога по ущелью асфальтированная, узкая и извилистая.
    Мост лежит чуть ниже главной дороги, указатель маленький и легко теряется, так что полагайтесь на
    навигатор. Машину ставьте на обочине, а не съезжайте в тупиковый съезд. Заправка есть в Кеде. Машины
    эконом-класса достаточно.
fa:
  name: پل طاقی داندالو
  short: پلی سنگی و یک‌دهانه از سده‌های میانه بر آجاریسْتسقالی، بالاتر از کدا، که هنوز پیاده از آن می‌گذرند.
  body: >-
    **در آجارا حدود چهل پل طاقی کهن بر جای مانده است؛ یکی از متراکم‌ترین مجموعه‌ها در سراسر اروپا.** داندالو
    از خوش‌ترکیب‌ترین آن‌هاست: یک طاق با دهانهٔ حدود سی متر که بر تنگ‌ترین نقطهٔ آجاریسْتسقالی، اندکی
    بالاتر از کدا، انداخته شده است.

    این پل‌ها بیشتر به سده‌های یازدهم تا سیزدهم بازمی‌گردند و برخی متأخرترند. شیوهٔ ساخت ساده و هوشمندانه
    بود: بیرون‌زدگی‌های طبیعی صخره در دو کرانه پایه شدند، طاق روی قالبی چوبی چیده شد و سپس قالب برداشته
    شد. در ملاط آهکی سفیدهٔ تخم‌مرغ می‌آمیختند، و بخش بزرگی از ماندگاری این پل‌ها از همین است — در حالی
    که پل‌های بتنی دورهٔ شوروی در کنارشان شسته شده‌اند.

    چند نکته در داندالو:

    - طاق **کمی تیزه‌دار است نه نیم‌دایره** — از نظر سازه‌ای کاراتر است و کف پل را بالاتر از سیلاب می‌برد

    - **دال‌های سنگی تخت** روی گذرگاه چنان چیده شده‌اند که آب را به کناره براند نه آنکه جمع کند

    - هرگز جان‌پناهی نداشته است: این پل برای چارپای بارکش و بار ساخته شد، نه برای گردش

    بیست دقیقه برای دیدنش کافی است. اگر وقت و علاقه دارید، در همین دره پل‌های دیگری هم هست — تسابلانا
    و پورتیو در شهرستان کدا، و پل ماخونتستی کنار آبشار که مشهورتر و بسیار شلوغ‌تر است. برتری داندالو دقیقاً
    همین است که کسی اینجا نیست: صدای رود، طاق، و جنگل در دو کرانه.
  tip: >-
    بیست دقیقه کاملاً بس است. می‌توان از روی پل گذشت، اما جان‌پناه ندارد و سنگ در باران لیز است، پس دست
    کودکان را بگیرید. مسیر دسترسی از جاده کوتاه اما علفی و اغلب انبوه است؛ صندل باز انتخاب بدی است. سرویس
    بهداشتی و کافه در محل نیست و نزدیک‌ترین‌ها در کداست. صبح‌های مه‌آلود پل را بهتر نشان می‌دهند؛ نور
    ظهر اینجا تخت است.
  route: >-
    از باتومی به شرق در درهٔ آجاریسْتسقالی از ماخونتستی و کدا، سپس حدود پنج کیلومتر دیگر — از تفلیس روی‌هم
    ۴۰۲ کیلومتر، تقریباً شش ساعت. جادهٔ دره آسفالت و باریک و پرپیچ است. پل کمی پایین‌تر از جادهٔ اصلی
    است، تابلو کوچک است و آسان از دست می‌رود، پس به مسیریاب تکیه کنید. خودرو را کنار جاده بگذارید و وارد
    خاکی بن‌بست نشوید. سوخت در کدا هست. خودروی اقتصادی کافی است.
he:
  name: גשר הקשת של דנדאלו
  short: גשר אבן מימי הביניים במפתח יחיד מעל אג׳ריסצקאלי מעל קדה, ועדיין אפשר לחצות אותו ברגל.
  body: >-
    **באג׳ריה שרדו כארבעים גשרי קשת עתיקים — אחד הריכוזים הצפופים ביותר באירופה.** דנדאלו הוא מן המחוטבים
    שבהם: קשת אחת במפתח של כשלושים מטרים, מוטלת מעל נקודה צרה של אג׳ריסצקאלי, מעט במעלה הזרם מקדה.

    הגשרים מתוארכים ברובם למאות ה-11 עד ה-13, וחלקם מאוחרים יותר. שיטת הבנייה פשוטה וחכמה: בליטות סלע
    טבעיות בשתי הגדות שימשו כתמוכות, הקשת נבנתה מעל תבנית עץ שהוסרה אחר כך. לטיט הסיד ערבבו חלבון ביצה,
    וזו סיבה לא קטנה לכך שהגשרים האלה עדיין עומדים בזמן שמעברי בטון סובייטיים לצדם נשטפו.

    כמה דברים לשים לב אליהם בדנדאלו:

    - הקשת **מחודדת מעט ולא חצי-עגולה** — יעילה יותר מבחינה קונסטרוקטיבית ומרימה את המשטח מעל גובה השיטפון

    - **לוחות האבן השטוחים** של המעבר מונחים כך שהמים יזלגו הצידה ולא ייעצרו

    - מעולם לא היה כאן מעקה: הגשר נבנה לבהמות משא ולמטענים, לא לטיולים

    עשרים דקות מספיקות. אם יש זמן ועניין, יש עוד גשרים באותו עמק — צאבלאנה ופורטיו במחוז קדה, וגשר מאחונצטי
    ליד המפל, המוכר יותר וההומה בהרבה. היתרון של דנדאלו הוא בדיוק שאין כאן כמעט איש: קול הנהר, הקשת, ויער
    בשתי הגדות.
  tip: >-
    עשרים דקות בהחלט מספיקות. אפשר לחצות ברגל, אך אין מעקה והאבן חלקלקה בגשם, אז החזיקו ילדים ביד. שביל
    הגישה מן הכביש קצר אך עשבי ולעתים סבוך; סנדלים פתוחים הם בחירה גרועה. אין שירותים ואין בית קפה במקום
    — הקרובים ביותר בקדה. בבקרים ערפיליים הגשר נראה במיטבו; אור הצהריים כאן שטוח.
  route: >-
    מבאטומי מזרחה בעמק אג׳ריסצקאלי דרך מאחונצטי וקדה, ואז עוד כחמישה קילומטרים — 402 ק״מ מטביליסי בסך
    הכול, כשש שעות. כביש העמק סלול, צר ומתפתל. הגשר נמצא מעט מתחת לכביש הראשי, השילוט קטן וקל לפספסו,
    לכן הסתמכו על ניווט לוויני. החנו בשוליים ואל תרדו לדרך העפר ללא מוצא. תדלוק בקדה. רכב חסכוני מספיק.
ar:
  name: جسر دانْدالو المقوس
  short: جسر حجري بقوس واحد من العصور الوسطى فوق أجاريستسقالي أعلى كيدا، ولا يزال يُعبر سيراً.
  body: >-
    **بقي في أجاريا نحو أربعين جسراً مقوساً قديماً، وهو من أكثف التجمعات في أوروبا كلها.** ودانْدالو من
    أرشقها: قوس واحد بفتحة نحو ثلاثين متراً، ألقي فوق نقطة ضيقة من أجاريستسقالي على مسافة قصيرة أعلى كيدا.

    تعود هذه الجسور في معظمها إلى القرون الحادي عشر والثالث عشر، وبعضها متأخر. وكانت طريقة البناء بسيطة
    وذكية: استُخدمت نتوءات الصخر الطبيعية في الضفتين ركائز، وبُني القوس فوق هيكل خشبي أزيل بعد ذلك. وكان
    ملاط الجير يُخلط ببياض البيض، وهذا سبب كبير لبقاء هذه الجسور واقفة بينما جرفت المياه معابر إسمنتية
    سوفيتية إلى جوارها.

    ما يستحق الانتباه في دانْدالو:

    - القوس **مدبب قليلاً لا نصف دائري** — أكفأ إنشائياً ويرفع سطح الجسر فوق منسوب الفيضان

    - **البلاطات الحجرية المسطحة** على الممر مرصوفة لتصريف الماء جانباً لا لتجميعه

    - لم يكن هنا حاجز قط: بُني الجسر لدواب الحمل والأثقال لا للتنزه

    عشرون دقيقة تكفي لرؤيته. وإن كان لديك وقت واهتمام فثمة جسور أخرى في الوادي نفسه — تسابلانا وبورتيو
    في بلدية كيدا، وجسر ماخونتسيتي عند الشلال وهو أشهر وأكثر ازدحاماً بكثير. وميزة دانْدالو أنه لا أحد
    هنا تقريباً: صوت النهر والقوس والغابة على الضفتين.
  tip: >-
    عشرون دقيقة كافية تماماً. يمكنك العبور سيراً، لكن لا حاجز هناك والحجر زلق في المطر، فأمسك بيد الأطفال.
    مسار الوصول من الطريق قصير لكنه عشبي وكثيراً ما يكون كثيفاً؛ والصنادل المفتوحة اختيار سيئ. لا دورات
    مياه ولا مقهى في الموقع، وأقربها في كيدا. الصباحات الضبابية تظهر الجسر في أحسن حال؛ وضوء الظهيرة هنا
    مسطح.
  route: >-
    من باتومي شرقاً في وادي أجاريستسقالي عبر ماخونتسيتي وكيدا، ثم خمسة كيلومترات أخرى — 402 كم من تبليسي
    إجمالاً، نحو ست ساعات. طريق الوادي معبّد وضيق وكثير الالتواء. والجسر أخفض قليلاً من الطريق الرئيسي،
    واللافتة صغيرة يسهل تفويتها، فاعتمد على الملاحة. أوقف السيارة على الكتف ولا تنزل إلى الدرب المسدود.
    الوقود في كيدا. وسيارة اقتصادية تكفي.
