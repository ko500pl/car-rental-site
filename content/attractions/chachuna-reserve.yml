ka:
  name: ჭაჭუნას აღკვეთილი
  short: თიხის ხრიოკები და ივრის ჭალის ტყე აზერბაიჯანის საზღვართან — ორბების, ფასკუნჯებისა და ბეგობების
    სამფლობელო.
  body: >-
    **იქ, სადაც იორი საქართველოს ტოვებს და აზერბაიჯანისკენ მიედინება, მიწა თიხის ხრიოკებად იბზარება, ცა
    კი ორბებს ეკუთვნის.**


    ჭაჭუნა 1965 წელს სატყეო მეურნეობად შეიქმნა, აღკვეთილის სტატუსი კი 1996 წელს მიიღო. მისი 52 კვადრატული
    კილომეტრი, დედოფლისწყაროდან 37 კილომეტრში, იცავს ივრის ჭალის ტყეს, დალის მთის წყალსაცავის ნაპირებსა
    და ირგვლივ გადაშლილ ნახევარუდაბნოს — წვიმისა და ქარისგან დაღარულ თიხის ბორცვებს.


    აქ 82 სახეობის ფრინველია აღრიცხული, მათგან ათი საქართველოს წითელ ნუსხაშია. ორბი და ფასკუნჯი კირქვის
    კლდეებზე ბუდობენ, სვავი — ღვიებზე, ცაში კი ბეგობი ტრიალებს. ხევების თიხის კედლებში ამოთხრილ სოროებში
    კვირიონები და ყაპყაპები ბინადრობენ, მათ მეზობლად — ჭოტი, ბორცვებიდან კი კაკაბის ხმა ისმის.


    ძუძუმწოვრებიდან აქ მელა, გარეული ღორი, ლელიანის კატა და ფოცხვერი ბინადრობენ; ზოლიანი აფთრის შესახებ
    ცნობები დაუდასტურებელია. ქვეწარმავლებს შორის ხმელთაშუაზღვის კუ და შხამიანი გველგესლები არიან, მათ
    შორის გიურზა.


    ეს ადგილი შემთხვევით მგზავრს კი არა, მომთმენ მოგზაურს ელოდება. ჩამოდით განთიადისას: შუადღის სიცხეში
    ხრიოკები დუმს და ფრინველებიც მათთან ერთად.
  tip: >-
    შესვლა უფასოა, მაგრამ ჯერ დედოფლისწყაროში, აღკვეთილის ადმინისტრაციაში, რომელიც ვაშლოვანთან საერთოა,
    უნდა დარეგისტრირდეთ; რეინჯერი ან ფრინველებზე დამკვირვებელი გიდი დიდ დროს დაგიზოგავთ. ადმინისტრაციას
    სტუმრებისთვის რამდენიმე უბრალო ოთახი აქვს, დალის მთის წყალსაცავთან კოტეჯებიცაა, მაგრამ მაისში, პიკზე,
    ადგილები არ ჰყოფნის — ბევრი დედოფლისწყაროში ათევს ღამეს და ალიონზე გადის. წყალი, საჭმელი და დურბინდი
    თან იქონიეთ: აქ არაფერი იყიდება. ზაფხულში სიცხე მკაცრია. მაისში, გიურზას შეწყვილების პერიოდში, ფეხქვეშ
    იყურეთ.
  route: >-
    თბილისიდან ჭაჭუნამდე დაახლოებით 166 კმ-ია — 3 სთ 15 წთ. კახეთის გზატკეცილით (ს5) საგარეჯოს გავლით
    მიდით სიღნაღის გზამდე (შ40), შემდეგ ბოდბის გავლით წნორი–დედოფლისწყაროს გზაზე (შ39) გადადით და დედოფლისწყარომდე
    ჩადით — დაახლოებით 130 კმ კარგი ასფალტი, ორ საათზე ცოტა მეტი. ქალაქის იქით დაახლოებით 35 კმ გრუნტისა
    და თიხის გზაა; წვიმის შემდეგ თიხა შეიძლება გაუვალი გახდეს. საჭიროა მაღალი კლირენსის მანქანა (SUV).
    საწვავი დედოფლისწყაროში ჩაასხით — მის იქით ბენზინგასამართი აღარ არის.
en:
  name: Chachuna Managed Reserve
  short: >-
    Clay badlands and Iori riverine forest on the Azerbaijani border, where griffon and Egyptian vultures
    breed and imperial eagles hunt.
  body: >-
    **Where the Iori leaves Georgia for Azerbaijan, the land cracks into clay badlands and the sky belongs
    to vultures.**


    Chachuna began in 1965 as a state forestry unit and became a managed reserve in 1996. Its 52 square
    kilometres, 37 km from Dedoplistskaro, protect the riverine forest along the Iori, the shores of the
    Dali Reservoir and the semi-desert around them — clay hills furrowed by wind and rain into strange
    ribs and gullies.


    Some 82 bird species have been recorded here, ten of them on Georgia's Red List. Griffon and Egyptian
    vultures nest on the limestone cliffs and cinereous vultures in the junipers; eastern imperial eagles
    work the thermals overhead. In the clay walls of the ravines, bee-eaters and rollers nest in burrows,
    with little owls for neighbours, and partridges call from the hills.


    Among the mammals are red fox, wild boar, jungle cat and lynx; reports of striped hyena remain unconfirmed.
    The reptiles include the Greek tortoise and venomous vipers, among them the blunt-nosed viper.


    This is a place for the patient rather than the casual traveller. Come at first light: in the heat
    of the day the badlands fall silent, and the birds with them.
  tip: >-
    Entry is free, but you must first register at the reserve administration in Dedoplistskaro (shared
    with Vashlovani); a ranger or birding guide will save you hours of searching. The administration has
    a few simple guest rooms and there are cottages near the Dali Reservoir, but in May, the peak month,
    beds run out — many birders sleep in Dedoplistskaro and leave before dawn. Carry water, food and binoculars:
    nothing is sold out here. Summer heat is fierce. In May, the blunt-nosed viper's mating season, watch
    where you step.
  route: >-
    Chachuna is about 166 km from Tbilisi — roughly 3 hours 15 minutes. Take the Kakheti Highway (S5)
    through Sagarejo to the Sighnaghi road (Sh40), then pass Bodbe onto the Tsnori–Dedoplistskaro road
    (Sh39) and follow it to Dedoplistskaro: about 130 km of good asphalt, a little over two hours. Beyond
    the town come roughly 35 km of gravel and clay track, which rain can turn impassable. Use a high-clearance
    SUV rather than an economy car. Fill up in Dedoplistskaro — there is no fuel beyond it.
ru:
  name: Заказник Чачуна
  short: >-
    Глинистые бедленды и пойменный лес Иори у границы с Азербайджаном, где гнездятся белоголовые сипы
    и стервятники и охотятся могильники.
  body: >-
    **Там, где Иори покидает Грузию и уходит в Азербайджан, земля растрескивается глинистыми бедлендами,
    а небо принадлежит грифам.**


    Чачуна начиналась в 1965 году как государственное лесное хозяйство, а заказником стала в 1996-м. Её
    52 квадратных километра, в 37 км от Дедоплисцкаро, охраняют пойменный лес вдоль Иори, берега водохранилища
    Дали и окружающую их полупустыню — глинистые холмы, которые ветер и дождь изрезали причудливыми рёбрами
    и промоинами.


    Здесь отмечено около 82 видов птиц, десять из них — в Красном списке Грузии. Белоголовые сипы и стервятники
    гнездятся на известняковых скалах, чёрные грифы — на можжевельниках; в восходящих потоках над заказником
    кружат восточные могильники. В глинистых стенах оврагов в норах гнездятся щурки и сизоворонки, по
    соседству с ними — домовые сычи, а с холмов доносится голос кекликов.


    Среди млекопитающих — лисица, кабан, камышовый кот и рысь; сведения о полосатой гиене пока не подтверждены.
    Из рептилий здесь водятся средиземноморская черепаха и ядовитые гадюки, в том числе гюрза.


    Это место для терпеливых путешественников, а не для случайных. Приезжайте на рассвете: в дневной жаре
    бедленды замолкают, а вместе с ними и птицы.
  tip: >-
    Вход бесплатный, но сначала нужно зарегистрироваться в администрации заказника в Дедоплисцкаро (она
    общая с Вашловани); рейнджер или гид-орнитолог сэкономит вам часы поисков. У администрации есть несколько
    простых гостевых комнат, у водохранилища Дали — домики, но в мае, в самый сезон, мест не хватает:
    многие любители птиц ночуют в Дедоплисцкаро и выезжают затемно. Возьмите воду, еду и бинокль — здесь
    ничего не продаётся. Летом жара беспощадная. В мае, когда у гюрзы брачный сезон, смотрите под ноги.
  route: >-
    До Чачуны от Тбилиси около 166 км — примерно 3 часа 15 минут. Поезжайте по Кахетинскому шоссе (S5)
    через Сагареджо до дороги на Сигнахи (Sh40), затем мимо Бодбе выезжайте на трассу Цнори — Дедоплисцкаро
    (Sh39) и следуйте по ней до Дедоплисцкаро: около 130 км хорошего асфальта, чуть больше двух часов.
    За городом — примерно 35 км гравийной и глинистой грунтовки, которую дождь может сделать непроезжей.
    Берите внедорожник с высоким клиренсом, а не машину эконом-класса. Заправьтесь в Дедоплисцкаро — дальше
    топлива нет.
fa:
  name: ذخیره‌گاه مدیریت‌شدهٔ چاچونا
  short: >-
    هزاردره‌های رسی و جنگل کرانه‌ای ایوری در مرز آذربایجان، جایی که دال‌ها و کرکس‌های مصری زادآوری می‌کنند
    و عقاب‌های شاهی شکار.
  body: >-
    **آن‌جا که ایوری گرجستان را به سوی آذربایجان ترک می‌کند، زمین به هزاردره‌های رسی ترک برمی‌دارد و آسمان
    از آنِ کرکس‌هاست.**


    چاچونا در سال ۱۹۶۵ به عنوان یک واحد جنگلداری دولتی آغاز به کار کرد و در ۱۹۹۶ به ذخیره‌گاه مدیریت‌شده
    بدل شد. پهنهٔ ۵۲ کیلومترمربعی آن، در ۳۷ کیلومتری ددوپلیستسکارو، از جنگل کرانه‌ای امتداد ایوری، کرانه‌های
    مخزن دالی و نیمه‌بیابان پیرامونشان پاسداری می‌کند — تپه‌هایی رسی که باد و باران آن‌ها را به تیغه‌ها
    و آبکندهایی غریب شیار زده‌اند.


    در این‌جا حدود ۸۲ گونه پرنده ثبت شده که ده گونه‌شان در فهرست سرخ گرجستان جای دارند. دال و کرکس مصری
    بر صخره‌های آهکی لانه می‌سازند و دال سیاه بر درختان ارس؛ عقاب شاهی بر ستون‌های هوای گرم بالای سر چرخ
    می‌زند. در دیوارهٔ رسی آبکندها، زنبورخوارها و سبزقباها در لانه‌هایی حفره‌ای جوجه می‌آورند و جغدهای
    کوچک همسایه‌شان‌اند، و از تپه‌ها آواز کبک‌ها به گوش می‌رسد.


    از میان پستانداران، روباه قرمز، گراز، گربهٔ جنگلی و سیاه‌گوش در این‌جا زندگی می‌کنند؛ گزارش‌های مربوط
    به کفتار راه‌راه هنوز تأیید نشده است. خزندگان این‌جا لاک‌پشت مهمیزدار و افعی‌های زهرآگین‌اند، از جمله
    گرزه‌مار.


    این‌جا جای مسافران شکیباست، نه رهگذران شتاب‌زده. سپیده‌دم بیایید: در گرمای روز هزاردره‌ها خاموش می‌شوند
    و پرندگان نیز با آن‌ها.
  tip: >-
    ورود رایگان است، اما نخست باید در ادارهٔ ذخیره‌گاه در ددوپلیستسکارو (که با واشلووانی مشترک است) ثبت‌نام
    کنید؛ یک جنگلبان یا راهنمای پرنده‌نگری ساعت‌ها جست‌وجو را از دوش شما برمی‌دارد. اداره چند اتاق سادهٔ
    مهمان دارد و کنار مخزن دالی هم کلبه‌هایی هست، اما در ماه مه، اوج فصل، جا کم می‌آید — بسیاری از پرنده‌نگران
    شب را در ددوپلیستسکارو می‌گذرانند و پیش از سپیده راه می‌افتند. آب، خوراک و دوربین دوچشمی همراه داشته
    باشید: این‌جا هیچ چیز فروخته نمی‌شود. گرمای تابستان بی‌امان است. در ماه مه، فصل جفت‌گیری گرزه‌مار،
    مراقب جای پایتان باشید.
  route: >-
    چاچونا حدود ۱۶۶ کیلومتر با تفلیس فاصله دارد — تقریباً ۳ ساعت و ۱۵ دقیقه. بزرگراه کاختی (S5) را از
    راه ساگارجو تا جادهٔ سیغناغی (Sh40) بروید، سپس از کنار بودبه بگذرید، وارد جادهٔ تسنوری–ددوپلیستسکارو
    (Sh39) شوید و آن را تا ددوپلیستسکارو دنبال کنید: حدود ۱۳۰ کیلومتر آسفالت خوب، کمی بیش از دو ساعت.
    پس از شهر حدود ۳۵ کیلومتر راه شنی و رسی در پیش است که باران می‌تواند آن را غیرقابل‌عبور کند. به جای
    خودروی اقتصادی، شاسی‌بلندی با فاصلهٔ زیاد از زمین بگیرید. در ددوپلیستسکارو باک را پر کنید — پس از
    آن سوختی در کار نیست.
he:
  name: שמורת צ'צ'ונה
  short: גבעות חרסית שחוקות ויער גדות לאורך האיורי על גבול אזרבייג'ן, שבו מקננים נשרים ורחמים, ועיטי שמש
    יוצאים לצוד.
  body: >-
    **במקום שבו האיורי עוזב את גאורגיה אל אזרבייג'ן, האדמה נסדקת לבתרונות חרסית, והשמיים שייכים לנשרים.**


    צ'צ'ונה החלה את דרכה ב-1965 כיחידת ייעור ממלכתית והפכה לשמורה מנוהלת ב-1996. 52 הקילומטרים הרבועים
    שלה, 37 ק״מ מדדופליסצקרו, מגינים על יער הגדות לאורך האיורי, על חופי מאגר דאלי ועל המדבר למחצה שסביבם
    — גבעות חרסית שהרוח והגשם חרצו לצלעות ולערוצונים משונים.


    כ-82 מיני עופות נרשמו כאן, עשרה מהם ברשימה האדומה של גאורגיה. נשרים ורחמים מקננים על מצוקי הגיר, ועוזניות
    שחורות בעצי הערער; עיטי שמש דואים מעל בזרמי האוויר החם. בקירות החרסית של הגאיות מקננים במחילות שרקרקים
    וכחלים, ולצדם כוסות החורבות, ומהגבעות נשמעת קריאת החוגלות.


    בין היונקים — שועל מצוי, חזיר בר, חתול ביצות ושונר; הדיווחים על צבוע מפוספס טרם אומתו. בין הזוחלים
    — צב יבשה מצוי וצפעים ארסיים, ובהם הצפע הלבנטיני (גיורזה).


    זהו מקום למטיילים סבלניים, לא לעוברי אורח. בואו עם אור ראשון: בחום היום הבתרונות משתתקים, ואיתם גם
    הציפורים.
  tip: >-
    הכניסה חינם, אבל קודם יש להירשם במינהלת השמורה בדדופליסצקרו (המשותפת לה ולוואשלובני); ריינג'ר או מדריך
    צפרות יחסכו לכם שעות של חיפוש. למינהלת יש כמה חדרי אירוח פשוטים, וליד מאגר דאלי יש בקתות, אבל במאי,
    חודש השיא, המיטות אוזלות — צפרים רבים לנים בדדופליסצקרו ויוצאים לפני עלות השחר. קחו מים, אוכל ומשקפת:
    שום דבר לא נמכר כאן. חום הקיץ עז. במאי, עונת ההזדווגות של הצפע הלבנטיני, הסתכלו היטב היכן אתם דורכים.
  route: >-
    צ'צ'ונה נמצאת כ-166 ק״מ מטביליסי — כשלוש שעות ורבע. סעו בכביש קאחתי (S5) דרך סגרג'ו עד כביש סיגנאגי
    (Sh40), ואז עברו על פני בודבה אל כביש צנורי–דדופליסצקרו (Sh39) והמשיכו בו עד דדופליסצקרו: כ-130 ק״מ
    של אספלט טוב, קצת יותר משעתיים. מעבר לעיירה מחכים כ-35 ק״מ של דרך חצץ וחרסית, שגשם עלול להפוך לבלתי
    עבירה. קחו רכב שטח עם מרווח גחון גבוה, לא רכב חסכוני. תדלקו בדדופליסצקרו — הלאה אין דלק.
ar:
  name: محمية تشاتشونا المُدارة
  short: >-
    تلال طينية وعرة وغابة ضفاف نهر إيوري على الحدود الأذربيجانية، حيث تعشّش النسور السمراء والرخم وتصطاد
    العقبان الملكية.
  body: >-
    **حيث يغادر نهر إيوري جورجيا نحو أذربيجان، تتشقق الأرض إلى تلال طينية وعرة، وتصبح السماء ملكاً للنسور.**


    بدأت تشاتشونا عام 1965 وحدةً حرجية حكومية، وصارت محمية مُدارة عام 1996. وتحمي مساحتها البالغة 52 كيلومتراً
    مربعاً، على بعد 37 كم من ديدوبليستسكارو، غابة الضفاف على امتداد إيوري، وشواطئ خزان دالي، وشبه الصحراء
    المحيطة بهما — تلالاً طينية حفرتها الريح والمطر أضلاعاً وأخاديد غريبة.


    سُجّل هنا نحو 82 نوعاً من الطيور، عشرة منها في القائمة الحمراء لجورجيا. تعشّش النسور السمراء والرخم
    على الجروف الكلسية، والنسور السوداء في أشجار العرعر، فيما تحوم العقبان الملكية الشرقية في التيارات
    الهوائية الصاعدة فوقها. وفي الجدران الطينية للأخاديد تعشّش طيور الوروار والشقراق في جحور، وتجاورها
    البوم الصغيرة، ومن التلال يتردد نداء الحجل.


    ومن الثدييات الثعلب الأحمر والخنزير البري وقط المستنقعات والوشق؛ أما التقارير عن الضبع المخطط فلم
    تتأكد بعد. ومن الزواحف السلحفاة الإغريقية والأفاعي السامة، ومنها الأفعى كليلة الأنف (الغيورزا).


    هذا مكان للصبورين لا للعابرين على عجل. تعالَ مع أول الضوء: ففي حرّ النهار تصمت التلال الوعرة، وتصمت
    معها الطيور.
  tip: >-
    الدخول مجاني، لكن عليك أولاً التسجيل لدى إدارة المحمية في ديدوبليستسكارو (وهي مشتركة مع فاشلوفاني)؛
    وسيوفّر عليك حارس أو دليل لمراقبة الطيور ساعات من البحث. لدى الإدارة بضع غرف ضيافة بسيطة، وهناك أكواخ
    قرب خزان دالي، لكن في مايو، ذروة الموسم، تنفد الأسرّة — فكثير من مراقبي الطيور يبيتون في ديدوبليستسكارو
    وينطلقون قبل الفجر. احمل الماء والطعام والمنظار: لا شيء يُباع هنا. حرّ الصيف قاسٍ. وفي مايو، موسم
    تزاوج الغيورزا، انتبه لموضع قدميك.
  route: >-
    تبعد تشاتشونا نحو 166 كم عن تبليسي — قرابة 3 ساعات و15 دقيقة. اسلك طريق كاخيتي السريع (S5) عبر ساغاريجو
    حتى طريق سيغناغي (Sh40)، ثم تجاوز بودبي إلى طريق تسنوري–ديدوبليستسكارو (Sh39) واتبعه حتى ديدوبليستسكارو:
    نحو 130 كم من الإسفلت الجيد، في ما يزيد قليلاً على ساعتين. بعد البلدة يمتد نحو 35 كم من المسار الحصوي
    والطيني، وقد يجعله المطر غير صالح للعبور. استخدم سيارة دفع رباعي عالية الخلوص الأرضي لا سيارة اقتصادية.
    املأ الخزان في ديدوبليستسكارو، فلا وقود بعدها.
