ka:
  name: წუღრუღაშენის ეკლესია
  short: >-
    1212–1222 წლების პატარა, მაღლა აზიდული გუმბათოვანი ეკლესია ბოლნისთან — ოქროსფერი, ღვინისფერი და ცისფერი
    ქვით ნაგები და ჩუქურთმით მოსილი.
  body: >-
    **საქართველოს უძველესი დათარიღებული ეკლესიიდან ორ კილომეტრში მისი ერთ-ერთი ყველაზე მდიდრულად მოჩუქურთმებული
    ტაძარი დგას — და მათ შორის შვიდი საუკუნეა.**


    წუღრუღაშენი 1212–1222 წლებში აიგო, ბოლნისისწყლის მარჯვენა ნაპირას, მთის ფერდზე. წარწერებში მოხსენიებულია
    ეკლესიის მშენებელი, ჰასან არსენის ძე, და გიორგი მეფე. პირველმა გამომცემლებმა ის გიორგი ბრწყინვალედ
    მიიჩნიეს და ტაძარი XIV საუკუნით დაათარიღეს; დღეს მას გიორგი IV ლაშას მეფობას უკავშირებენ — ოქროს ხანის
    უკანასკნელ ნათელ წლებს, მონღოლთა მოსვლამდე. ტაძარი ხუთშაბათის წმინდა გიორგის ჯვრის სახელზეა აგებული:
    ამგვარი სახელის სხვა ეკლესია ქართულმა ხუროთმოძღვრებამ არ იცის. ადგილის სახელი კიდევ უფრო უცნაურია
    — ის მონღოლური წარმოშობის პირსახელიდან, წუღრუღადან მომდინარეობს.


    ტაძარი ბეთანია-ქვათახევ-ფიტარეთის ჯგუფს ეკუთვნის, მაგრამ მათზე პატარაა — 12,5 მეტრი სიგრძით, 9 სიგანით
    და 17 სიმაღლით, — გუმბათის ყელი კი ისე აქვს აზიდული, თითქოს მთელი შენობა ფეხის წვერებზე შემდგარა.
    ოსტატებმა ქვა მხატვარივით შეარჩიეს: თბილი მოყვითალო-ოქროსფერი, ღვინისფერი და ცისფერი. ყელის საპირე
    მუქი ყვითელი ქვისაა, კარნიზი — ბაცი მოყვითალოსი; წნული, როზეტები და ჯვრები მთელ კედლებს მოსდებია.
    დაბალ მზეზე მოდით, დილით ან საღამოს, როცა ბრტყელი რელიეფი ჩრდილს ისვრის და ორნამენტი ქვიდან ამოიწევს.


    დასავლეთის კარის მარჯვნივ, დიდ ცისფერ ქვაზე, ათსტრიქონიანი ასომთავრული წარწერა დღემდე კარგად იკითხება.
    ოდესღაც მოხატულ ინტერიერში შეისრული თაღებია, ჩრდილოეთისა და სამხრეთის მკლავები კი ორიარუსიანია — ზედა
    იარუსი იატაკიდან ექვს მეტრზეა, ასასვლელი კიბე კი დიდი ხანია აღარ არსებობს.


    1721 წლის აღწერით აქ ორი სოფელი იყო, წუღრუღაშენი და ახალი წუღრუღაშენი, თითოეულში ცხრა კომლი გლეხით.
    იმავე საუკუნეში ორივე დაცარიელდა და ტაძარიც დადუმდა; ის 1938–1939 წლებში შეაკეთეს.


    წასვლამდე ტაძარს ირგვლივ შემოუარეთ: ამ ეკლესიას უბრალო, მოურთავი მხარე არ აქვს და ყოველი კედელი დაკვირვებულ
    მზერას იმსახურებს.
  tip: >-
    ერთი საათი სავსებით საკმარისია და ეს ვიზიტი ბოლნისის სიონთან ერთად, იმავე დილით უნდა დაგეგმოთ — სიონი
    გზაზე ორი კილომეტრით უკანაა. ეკლესია შეიძლება დაკეტილი დაგხვდეთ, მაგრამ მისი მთავარი სიმდიდრე გარეთაა,
    ასე რომ, დაკეტილი კარი დიდ დანაკლისს არ ნიშნავს. დილის ან გვიანი ნაშუადღევის შუქი ჩუქურთმას აცოცხლებს,
    შუადღისას კი ის ბრტყელდება. დასავლეთის კარის მარჯვნივ, ცისფერ ქვაზე, ათსტრიქონიანი წარწერა მოძებნეთ.
    გალავნამდე ამავალი მოკლე გზა უსწორმასწოროა და წვიმის შემდეგ ლაფიანი, ჩრდილი კი ცოტაა. კაფე და ტუალეტი
    ქალაქ ბოლნისშია, დაახლოებით ათი კილომეტრით ჩრდილოეთით. ჩაიცვით ისე, როგორც ნებისმიერ ქართულ ეკლესიაში.
  route: >-
    თბილისიდან ს6-ით სამხრეთით, მარნეულის გავლით ბოლნისამდე იარეთ, მერე შ154-ზე (სიონის ქუჩა) სამხრეთით
    გადაუხვიეთ და ქვემო ბოლნისში ბოლნისის სიონს ჩაუარეთ. წუღრუღაშენი დაახლოებით ორი კილომეტრით მოშორებით,
    ბოლნისისწყლის მარჯვენა ნაპირის ფერდზე დგას. სულ დაახლოებით 74 კმ-ია, საათი და ოცდახუთი წუთი. გზა თითქმის
    ბოლომდე ასფალტიანია; მხოლოდ გალავნამდე მისასვლელი მონაკვეთია ვიწრო და ნაწილობრივ ხრეშიანი, რასაც ეკონომ-კლასის
    მანქანა მშრალ ამინდში უპრობლემოდ გაართმევს თავს. საწვავი მარნეულში ან ბოლნისში ჩაასხით. 630 მეტრ სიმაღლეზე
    აქ ჩამოსვლა წლის ნებისმიერ დროს შეიძლება.
en:
  name: Tsughrughasheni Church
  short: >-
    A small, soaring domed church of 1212–1222 near Bolnisi, built of golden, wine-red and blue stone
    and carved from drum to doorway.
  body: >-
    **Two kilometres from Georgia's oldest dated church stands one of its most lavishly carved, and seven
    centuries lie between them.**


    Tsughrughasheni was built in 1212–1222 on a hillside above the right bank of the Bolnisistsqali. Its
    inscriptions name the builder, Hasan son of Arsen, and a King George. Early scholars took him for
    George V the Brilliant and dated the church to the 14th century; it is now attributed to George IV
    Lasha, in the last bright years before the Mongols came. The dedication is unique in Georgia, to the
    Cross of St George of Thursday. The place name is stranger still: it comes from Tsughrugha, a personal
    name of Mongol origin.


    It is kin to Betania, Kvatakhevi and Pitareti, but smaller: 12.5 metres long, 9 wide and 17 high,
    and its drum is pulled upwards so that the whole building seems to stand on tiptoe. The masons chose
    their stone like painters: warm golden yellow, wine red and blue. The drum is faced in deep yellow,
    the cornice in pale; interlace, rosettes and crosses spread across the walls. Come in low sun, early
    or late, when the shallow relief casts shadows and the pattern lifts off the stone.


    To the right of the west door, on a large blue block, a ten-line Asomtavruli inscription still reads
    clearly. The interior, once painted, is spanned by pointed arches; the north and south arms have upper
    tiers six metres above the floor, their stairs long gone.


    The 1721 census found two villages here, Tsughrughasheni and New Tsughrughasheni, each with nine peasant
    households. Later that century both were deserted and the church fell silent; its walls were repaired
    in 1938–39.


    Before you leave, walk all the way round: there is no plain side to this church, and every wall repays
    a slow look.
  tip: >-
    An hour is plenty, and it belongs in the same morning as Bolnisi Sioni, two kilometres back down the
    road. The church may be locked, but its glory is the exterior, so a closed door costs you little.
    Morning or late-afternoon light brings the carving out; at noon it flattens. Look for the ten-line
    inscription on the blue stone right of the west door. The short track up to the enclosure is rough
    and muddy after rain, and there is little shade. Cafés and toilets are in Bolnisi town, about ten
    kilometres north. Dress as you would for any Georgian church.
  route: >-
    Take the S6 south from Tbilisi through Marneuli to Bolnisi, then turn south onto the Sh154 (Sioni
    Street) and follow it past Bolnisi Sioni in Kvemo Bolnisi. Tsughrughasheni stands about two kilometres
    further on, on the hillside above the right bank of the Bolnisistsqali. In total about 74 km and an
    hour and twenty-five minutes. The road is asphalt almost to the end; only the final approach to the
    enclosure is narrow and partly gravel, which an economy car handles comfortably in dry weather. Refuel
    in Marneuli or Bolnisi. At 630 metres, this is a year-round trip.
ru:
  name: Церковь Цугругашени
  short: >-
    Небольшая, устремлённая ввысь купольная церковь 1212–1222 годов близ Болниси из золотистого, винно-красного
    и голубого камня, в резьбе от барабана до портала.
  body: >-
    **В двух километрах от древнейшей датированной церкви Грузии стоит одна из самых щедро украшенных
    резьбой — и между ними семь веков.**


    Цугругашени построили в 1212–1222 годах на склоне над правым берегом Болнисисцкали. В надписях названы
    строитель, Хасан, сын Арсена, и некий царь Георгий. Первые публикаторы приняли его за Георгия V Блистательного
    и отнесли церковь к XIV веку; теперь её связывают с Георгием IV Лашой — последними светлыми годами
    перед приходом монголов. Посвящение для Грузии уникально: Кресту святого Георгия Четвергового. Название
    места ещё загадочнее: оно происходит от Цугруги — личного имени монгольского происхождения.


    Церковь родственна Бетании, Кватахеви и Питарети, но меньше их: 12,5 метра в длину, 9 в ширину и 17
    в высоту, а барабан так вытянут вверх, что всё здание будто привстало на цыпочки. Мастера подбирали
    камень, как живописцы — краски: тёплый золотисто-жёлтый, винно-красный и голубой. Барабан облицован
    тёмно-жёлтым камнем, карниз — бледно-жёлтым; плетёнка, розетки и кресты расходятся по стенам. Приезжайте
    при низком солнце, утром или ближе к вечеру, когда неглубокий рельеф отбрасывает тени и узор словно
    отделяется от камня.


    Справа от западного входа, на большом голубом блоке, до сих пор отчётливо читается десятистрочная
    надпись асомтаврули. Некогда расписанный интерьер перекрыт стрельчатыми арками; в северном и южном
    рукавах есть верхние ярусы на высоте шести метров над полом, но лестницы к ним давно исчезли.


    Перепись 1721 года застала здесь два села — Цугругашени и Новое Цугругашени, по девять крестьянских
    дворов в каждом. Позже в том же веке оба опустели, и церковь замолчала; её стены отремонтировали в
    1938–1939 годах.


    Перед отъездом обойдите церковь кругом: простой, неукрашенной стороны у неё нет, и каждая стена стоит
    неторопливого взгляда.
  tip: >-
    Часа здесь достаточно, и эта остановка естественно ложится в одно утро с Болнисским Сиони, что в двух
    километрах назад по дороге. Церковь может быть заперта, но главное её богатство снаружи, так что закрытая
    дверь отнимает немного. Утренний или предвечерний свет проявляет резьбу, в полдень она становится
    плоской. Найдите десятистрочную надпись на голубом камне справа от западного входа. Короткая дорожка
    к ограде неровная и после дождя раскисает, тени почти нет. Кафе и туалеты — в городе Болниси, примерно
    в десяти километрах к северу. Одевайтесь так, как для любой грузинской церкви.
  route: >-
    Из Тбилиси езжайте на юг по S6 через Марнеули до Болниси, затем сверните на юг на Sh154 (улица Сиони)
    и держитесь её мимо Болнисского Сиони в Квемо-Болниси. Цугругашени стоит примерно в двух километрах
    дальше, на склоне над правым берегом Болнисисцкали. Всего около 74 км и час двадцать пять минут. Асфальт
    почти до конца; лишь последний подъезд к ограде узкий и местами гравийный, но в сухую погоду машина
    эконом-класса справится с ним без труда. Заправьтесь в Марнеули или Болниси. Высота здесь 630 метров,
    так что ехать можно круглый год.
fa:
  name: کلیسای تسوغروغاشنی
  short: >-
    کلیسایی گنبددار، کوچک و بلندقامت از سال‌های ۱۲۱۲ تا ۱۲۲۲ نزدیک بولنیسی، از سنگ زرین، شرابی و آبی،
    کنده‌کاری‌شده از ساقهٔ گنبد تا درگاه.
  body: >-
    **دو کیلومتر دورتر از کهن‌ترین کلیسای تاریخ‌دار گرجستان، یکی از پرنقش‌ترین کلیساهای آن ایستاده است،
    و هفت سده میانشان فاصله است.**


    تسوغروغاشنی در سال‌های ۱۲۱۲ تا ۱۲۲۲ بر دامنهٔ تپه‌ای بالای کرانهٔ راست رود بولنیسیس‌تسقالی ساخته شد.
    کتیبه‌هایش نام سازنده، حسن پسر آرسن، و پادشاهی به نام گیورگی را آورده‌اند. نخستین پژوهشگران او را
    گیورگی پنجم درخشان پنداشتند و کلیسا را به سدهٔ چهاردهم نسبت دادند؛ امروز آن را به گیورگی چهارم لاشا
    نسبت می‌دهند، به آخرین سال‌های درخشان پیش از آمدن مغولان. نام‌گذاری آن در گرجستان بی‌همتاست: این کلیسا
    به نام «صلیب گیورگی مقدسِ پنجشنبه» تقدیس شده است. نام مکان از این هم غریب‌تر است: از «تسوغروغا»، نامی
    شخصی با ریشهٔ مغولی، می‌آید.


    این کلیسا خویشاوند بتانیا، کواتاخِوی و پیتارتی است، اما از آن‌ها کوچک‌تر: ۱۲٫۵ متر درازا، ۹ متر پهنا
    و ۱۷ متر بلندا؛ و ساقهٔ گنبدش چنان به بالا کشیده شده که گویی کل بنا روی نوک پا ایستاده است. استادکاران
    سنگ را همچون نقاشان برگزیدند: زرد طلایی گرم، سرخ شرابی و آبی. ساقهٔ گنبد با سنگ زرد تیره روکش شده
    و قرنیز با زرد کم‌رنگ؛ نقش‌های درهم‌بافته، گل‌نقش‌ها و صلیب‌ها سراسر دیوارها را پوشانده‌اند. در نور
    مایل خورشید، صبح زود یا نزدیک غروب، بیایید؛ آن‌گاه نقش برجستهٔ کم‌عمق سایه می‌اندازد و نقش‌ها از سنگ
    جدا می‌شوند.


    سمت راست درِ غربی، بر قطعه‌سنگی بزرگ و آبی، کتیبه‌ای ده‌سطری به خط اسومتاورولی هنوز به‌روشنی خوانده
    می‌شود. درون کلیسا، که روزگاری نقاشی دیواری داشت، با طاق‌های جناغی پوشانده شده است؛ بازوهای شمالی
    و جنوبی طبقه‌هایی بالایی در شش متری کف دارند که پلکان‌هایشان دیری است از میان رفته.


    سرشماری سال ۱۷۲۱ دو روستا را اینجا ثبت کرد، تسوغروغاشنی و تسوغروغاشنیِ نو، هر یک با نُه خانوار روستایی.
    در همان سده هر دو خالی از سکنه شدند و کلیسا خاموش ماند؛ دیوارهایش در سال‌های ۱۹۳۸ تا ۱۹۳۹ مرمت شد.


    پیش از رفتن، گرداگرد کلیسا را بگردید: این کلیسا هیچ سوی ساده و بی‌نقشی ندارد و هر دیوارش ارزش نگاهی
    آرام و درنگ‌آمیز را دارد.
  tip: >-
    یک ساعت کافی است، و این بازدید با سیونی بولنیسی، دو کیلومتر عقب‌تر در همین جاده، در یک صبح جا می‌گیرد.
    ممکن است درِ کلیسا قفل باشد، اما شکوه آن در نمای بیرونی است، پس درِ بسته چیز زیادی از شما نمی‌گیرد.
    نور صبح یا اواخر بعدازظهر کنده‌کاری‌ها را برجسته می‌کند؛ در نیمروز همه‌چیز تخت می‌نماید. کتیبهٔ ده‌سطری
    را بر سنگ آبیِ سمت راست درِ غربی پیدا کنید. راه کوتاه تا محوطه ناهموار است و پس از باران گل‌آلود،
    و سایهٔ چندانی ندارد. کافه و سرویس بهداشتی در شهر بولنیسی، حدود ده کیلومتر به سمت شمال، هست. همان‌گونه
    لباس بپوشید که برای هر کلیسای گرجی.
  route: >-
    از تفلیس با جادهٔ S6 به جنوب بروید و از مارنئولی بگذرید تا بولنیسی، سپس به جنوب، به جادهٔ Sh154 (خیابان
    سیونی)، بپیچید و آن را از کنار سیونی بولنیسی در کوِمو بولنیسی دنبال کنید. تسوغروغاشنی حدود دو کیلومتر
    جلوتر، بر دامنهٔ بالای کرانهٔ راست بولنیسیس‌تسقالی، ایستاده است. در مجموع حدود ۷۴ کیلومتر و یک ساعت
    و بیست‌وپنج دقیقه. جاده تقریباً تا انتها آسفالت است؛ فقط راه دسترسی پایانی به محوطه باریک و بخشی از
    آن شنی است که خودروی اقتصادی در هوای خشک به‌راحتی از پسش برمی‌آید. در مارنئولی یا بولنیسی سوخت‌گیری
    کنید. در ارتفاع ۶۳۰ متر، این سفری برای همهٔ فصل‌هاست.
he:
  name: כנסיית צוגרוגאשני
  short: >-
    כנסיית כיפה קטנה ונישאת מן השנים 1212–1222 ליד בולניסי, בנויה מאבן זהובה, אדומה כיין וכחולה, ומגולפת
    מן התוף ועד הפתח.
  body: >-
    **במרחק שני קילומטרים מן הכנסייה המתוארכת העתיקה ביותר בגאורגיה עומדת אחת הכנסיות המגולפות בשפע הרב
    ביותר בה, ושבע מאות שנה מפרידות ביניהן.**


    צוגרוגאשני נבנתה בשנים 1212–1222 על צלע גבעה מעל הגדה הימנית של נהר הבולניסיסצקאלי. הכתובות שבה נוקבות
    בשם הבונה, חסן בן ארסן, ובשמו של מלך בשם גיורגי. המהדירים הראשונים זיהו אותו כגיורגי החמישי המזהיר
    ותיארכו את הכנסייה למאה ה-14; כיום מייחסים אותה לגיורגי הרביעי לשה, לשנים הזוהרות האחרונות שלפני בוא
    המונגולים. ההקדשה ייחודית בגאורגיה: לצלבו של גאורגיוס הקדוש של יום חמישי. שם המקום מוזר עוד יותר:
    מקורו בצוגרוגה, שם פרטי ממוצא מונגולי.


    היא קרובה לבטניה, לקוואטחבי ולפיטארתי, אך קטנה מהן: אורכה 12.5 מטרים, רוחבה 9 וגובהה 17, והתוף שלה
    מתוח כלפי מעלה כך שהמבנה כולו נראה כעומד על קצות האצבעות. הבנאים בחרו את האבן כמו ציירים: צהוב־זהוב
    חמים, אדום יין וכחול. התוף מצופה אבן צהובה כהה, הכרכוב צהוב חיוור; שזירות, רוזטות וצלבים מתפשטים על
    פני הקירות. בואו באור שמש נמוכה, מוקדם בבוקר או לקראת ערב, כשהתבליט הרדוד מטיל צללים והעיטור מתרומם
    מן האבן.


    מימין לפתח המערבי, על גוש אבן כחול גדול, עדיין נקראת בבירור כתובת בת עשר שורות בכתב אסומטברולי. החלל
    הפנימי, שהיה מצויר פעם, מקורה בקשתות מחודדות; בזרועות הצפונית והדרומית יש קומות עליונות בגובה שישה
    מטרים מעל הרצפה, והמדרגות אליהן אבדו מזמן.


    מפקד 1721 מצא כאן שני כפרים, צוגרוגאשני וצוגרוגאשני החדשה, ובכל אחד תשעה משקי בית של איכרים. מאוחר
    יותר באותה מאה ננטשו שניהם והכנסייה שקעה בדממה; קירותיה תוקנו ב-1938–1939.


    לפני שאתם עוזבים, הקיפו את הכנסייה כולה: אין לה צד פשוט וחסר עיטור, וכל קיר בה שווה מבט איטי.
  tip: >-
    שעה מספיקה, והביקור משתלב באותו בוקר עם סיוני של בולניסי, שני קילומטרים אחורה בדרך. ייתכן שהכנסייה
    נעולה, אבל הדרה בחוץ, כך שדלת סגורה גורעת מעט. אור הבוקר או אור אחר הצהריים המאוחרים מבליט את הגילופים;
    בצהריים הם משתטחים. חפשו את הכתובת בת עשר השורות על האבן הכחולה מימין לפתח המערבי. השביל הקצר אל המתחם
    משובש ובוצי אחרי גשם, וצל כמעט אין. בתי קפה ושירותים יש בעיירה בולניסי, כעשרה קילומטרים צפונה. התלבשו
    כפי שמתלבשים לכל כנסייה גאורגית.
  route: >-
    סעו מטביליסי דרומה בכביש S6 דרך מרנאולי עד בולניסי, ואז פנו דרומה לכביש Sh154 (רחוב סיוני) והמשיכו
    בו על פני סיוני של בולניסי שבקוומו בולניסי. צוגרוגאשני עומדת כשני קילומטרים הלאה, על צלע הגבעה מעל
    הגדה הימנית של הבולניסיסצקאלי. בסך הכול כ-74 ק״מ ושעה ועשרים וחמש דקות. הכביש סלול כמעט עד הסוף; רק
    קטע הגישה האחרון אל המתחם צר וחלקו חצץ, ורכב אקונומי מסתדר איתו בנוחות במזג אוויר יבש. תדלקו במרנאולי
    או בבולניסי. בגובה 630 מטרים זהו טיול לכל ימות השנה.
ar:
  name: كنيسة تسوغروغاشيني
  short: >-
    كنيسة صغيرة شاهقة ذات قبة من الأعوام 1212–1222 قرب بولنيسي، من حجر ذهبي وخمري وأزرق، ومنقوشة من رقبة
    القبة حتى المدخل.
  body: >-
    **على بعد كيلومترين من أقدم كنيسة مؤرَّخة في جورجيا تقوم واحدة من أغنى كنائسها نقشاً، وبينهما سبعة
    قرون.**


    بُنيت تسوغروغاشيني بين عامي 1212 و1222 على سفح تلّ فوق الضفة اليمنى لنهر بولنيسيستسكالي. تذكر نقوشها
    اسم البنّاء، حسن بن أرسين، وملكاً يُدعى جيورجي. ظنّه ناشرو النقوش الأوائل جيورجي الخامس اللامع، فأرّخوا
    الكنيسة بالقرن الرابع عشر؛ أما اليوم فتُنسب إلى جيورجي الرابع لاشا، إلى آخر السنوات المشرقة قبل مجيء
    المغول. وتكريسها فريد في جورجيا: لصليب القديس جاورجيوس المنسوب إلى يوم الخميس. أما اسم المكان فأغرب
    من ذلك: فهو مشتق من «تسوغروغا»، وهو اسم علم مغولي الأصل.


    وهي قريبة الشبه ببيتانيا وكفاتاخيفي وبيتاريتي، لكنها أصغر منها: طولها 12.5 متراً، وعرضها 9، وارتفاعها
    17، ورقبة قبتها مشدودة إلى الأعلى حتى ليبدو المبنى كله واقفاً على رؤوس أصابعه. انتقى البنّاؤون الحجر
    كما ينتقي الرسامون ألوانهم: أصفر ذهبي دافئ، وأحمر خمري، وأزرق. كُسيت رقبة القبة بحجر أصفر داكن، والإفريز
    بأصفر باهت؛ وتنتشر الضفائر والوريدات والصلبان على الجدران. تعالَ في ضوء الشمس المنخفضة، باكراً أو
    قرب المساء، حين يلقي النقش البارز الضحل ظلاله فيبرز الزخرف عن الحجر.


    إلى يمين الباب الغربي، على كتلة زرقاء كبيرة، ما زال نقش من عشرة أسطر بخط الأسومتافرولي يُقرأ بوضوح.
    أما الداخل، الذي كان مزيّناً بالرسوم ذات يوم، فتعلوه أقواس مدببة؛ وفي الذراعين الشمالية والجنوبية
    طبقتان علويتان على ارتفاع ستة أمتار فوق الأرضية، زالت سلالمهما منذ زمن بعيد.


    وجد إحصاء عام 1721 هنا قريتين، تسوغروغاشيني وتسوغروغاشيني الجديدة، في كل منهما تسعة بيوت فلاحين. وفي
    وقت لاحق من ذلك القرن هُجرت القريتان وسكتت الكنيسة؛ ورُمّمت جدرانها في 1938–1939.


    قبل أن تغادر، طُف حول الكنيسة كلها: فليس فيها جانب عارٍ من الزخرفة، وكل جدار فيها يستحق نظرة متأنية.
  tip: >-
    تكفي ساعة واحدة، ومكانها في الصباح نفسه مع سيوني بولنيسي، على بعد كيلومترين إلى الوراء على الطريق.
    قد تكون الكنيسة مقفلة، لكن مجدها في واجهاتها الخارجية، فالباب المغلق لا يفوّت عليك الكثير. ضوء الصباح
    أو آخر العصر يُبرز النقوش، أما عند الظهيرة فتبدو مسطحة. ابحث عن النقش ذي الأسطر العشرة على الحجر الأزرق
    يمين الباب الغربي. الممر القصير الصاعد إلى السور وعر ويصير موحلاً بعد المطر، والظل قليل. المقاهي ودورات
    المياه في بلدة بولنيسي، على بعد نحو عشرة كيلومترات شمالاً. البس كما تلبس لزيارة أي كنيسة جورجية.
  route: >-
    اتجه جنوباً من تبليسي على الطريق S6 عبر مارنيولي حتى بولنيسي، ثم انعطف جنوباً إلى Sh154 (شارع سيوني)
    وتابع عليه مروراً بسيوني بولنيسي في كفيمو بولنيسي. تقع تسوغروغاشيني على بعد نحو كيلومترين بعد ذلك،
    على السفح فوق الضفة اليمنى لنهر بولنيسيستسكالي. المجموع نحو 74 كم وساعة وخمس وعشرون دقيقة. الطريق
    معبّد تقريباً حتى النهاية؛ وحده المدخل الأخير إلى السور ضيق ومفروش بالحصى جزئياً، وتجتازه سيارة اقتصادية
    بسهولة في الطقس الجاف. تزوّد بالوقود في مارنيولي أو بولنيسي. على ارتفاع 630 متراً، هذه رحلة ممكنة
    طوال العام.
