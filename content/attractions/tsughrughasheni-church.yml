ka:
  name: წუღრუღაშენის ეკლესია
  short: 1212-1222 წლების გუმბათოვანი ეკლესია ბოლნისთან, დაფარული ქართული კვეთის ერთ-ერთი ყველაზე მკვრივი
    ორნამენტით.
  body: >-
    **წუღრუღაშენი და ბოლნისის სიონი ერთმანეთს ხეობის გავლით უყურებენ და შვიდი საუკუნე დგას მათ შორის.**
    ერთი V საუკუნის მკაცრი, დაბალი ბაზილიკაა; მეორე — მაღალი, ვიწრო, თითქმის მთლიანად მოჩუქურთმებული გუმბათოვანი
    ეკლესია XIII საუკუნის დასაწყისისა. ორივეს ერთად ნახვა ქართული არქიტექტურის მოკლე კურსია.


    წუღრუღაშენი 1212-1222 წლებში აშენდა, გიორგი IV ლაშას მეფობის დროს — ოქროს ხანის ბოლო წლებში, მონღოლების
    შემოსევამდე ცოტა ხნით ადრე. შენობა მცირეა, მაგრამ პროპორციები აზიდულია: მაღალი გუმბათის ყელი თორმეტწახნაგოვანია
    და თითოეული წახნაგი დამოუკიდებელი ორნამენტული ველია.


    დეკორი ის არის, რისთვისაც აქ მოდიან. ფასადებზე გეომეტრიული წნული, ვაზის რტოები, როზეტები და ჯვრები
    ისეა განაწილებული, რომ თვალი მუდმივად მოძრაობს; ბრტყელი, ღრმად კვეთილი რელიეფი მზის დაბალ სხივზე ყველაზე
    კარგად იკითხება — დილით ან საღამოს. ქვა მოყვითალო-მოწითალო ტუფია, ბოლნისის რაიონისთვის დამახასიათებელი.


    შიგნით თითქმის ცარიელია: მოხატულობა არ შემორჩენილა, სივრცე ვიწრო და მაღალია. ეს ნორმალურია — ამ პერიოდის
    ეკლესიების უმეტესობა გარედან უფრო მდიდარია, ვიდრე შიგნიდან. ეზო პატარაა, ირგვლივ ბაღები და მდინარე
    მაშავერა. ადგილი მშვიდია და ტურისტული ავტობუსები აქ იშვიათად ჩერდებიან.
  tip: >-
    ორმოცდაათი წუთი საკმარისია, თუ ბოლნისის სიონთან ერთად დაგეგმავთ — ისინი ხუთ კილომეტრშია ერთმანეთისგან
    და ერთად უფრო აზრიანია. ეკლესია ხშირად დაკეტილია, მაგრამ მთავარი გარეთაა; შიგნით შესვლა აუცილებელი
    არ არის. ეზოს გზა ხრეშიანია და წვიმის შემდეგ ლაფიანი. ჩრდილი მცირეა. კაფე და ტუალეტი ბოლნისშია, ხუთ
    კილომეტრში. საუკეთესო შუქი დილის ან საღამოს საათებია.
  route: >-
    თბილისიდან სამხრეთით მარნეულის გზით, შემდეგ დასავლეთით ბოლნისისკენ — 70 კმ კარგი ასფალტით. ბოლნისში
    ზემო ბოლნისის მიმართულებით გაუხვევთ და მაშავერას გადაკვეთთ; ეკლესია ბორცვზე მარჯვნივ ჩანს. სულ 74
    კმ, დაახლოებით საათი და ოცდახუთი წუთი. ბოლო ორი კილომეტრი ვიწრო ასფალტი და ხრეშია, მაგრამ ეკონომ-კლასის
    მანქანისთვის პრობლემა არ არის. საწვავი მარნეულსა და ბოლნისში აიღეთ.
en:
  name: Tsughrughasheni Church
  short: A domed church of 1212-1222 near Bolnisi, covered in some of the densest ornamental carving in
    Georgia.
  body: >-
    **Tsughrughasheni and Bolnisi Sioni face each other across a valley with seven centuries between them.**
    One is a severe, low basilica of the 5th century; the other is a tall, narrow, almost entirely carved
    domed church of the early 13th. Seeing both in one morning is a short course in Georgian architecture.


    Tsughrughasheni was built between 1212 and 1222, in the reign of George IV Lasha — the last years
    of the Golden Age, shortly before the Mongols arrived. The building is small but stretched upwards:
    the drum is twelve-sided and unusually tall, and each face of it is treated as a separate panel of
    ornament.


    The carving is what people come for. Geometric interlace, vine scrolls, rosettes and crosses are spread
    across the facades so that the eye never settles; the relief is shallow but cut deeply enough to read
    best in low sun, early or late in the day. The stone is the yellowish-red tuff typical of the Bolnisi
    district, and it takes the light warmly.


    Inside is nearly bare. No wall painting survives and the space is narrow and high. That is normal
    for the period — churches of these decades put their wealth on the outside. The yard is small, with
    orchards around it and the Mashavera river below. The place stays quiet; tour buses rarely stop here.
  tip: >-
    Fifty minutes is enough, and it makes far more sense combined with Bolnisi Sioni five kilometres away.
    The church is often locked, but the point of the building is the exterior, so a closed door matters
    less than usual. The track into the yard is gravel and muddy after rain. There is little shade. Cafes
    and toilets are in Bolnisi. Morning or late afternoon light shows the carving best.
  route: >-
    Head south from Tbilisi on the Marneuli road, then west towards Bolnisi — 70 km of good asphalt. In
    Bolnisi follow signs for Zemo Bolnisi and cross the Mashavera; the church stands on a rise to the
    right. Seventy-four kilometres in total, about an hour and twenty-five minutes. The last two kilometres
    are narrow asphalt and gravel, but present no problem for an economy car. Refuel in Marneuli or Bolnisi.
ru:
  name: Церковь Цугругашени
  short: Купольная церковь 1212-1222 годов близ Болниси, покрытая одной из самых плотных орнаментальных
    резьб в Грузии.
  body: >-
    **Цугругашени и Болнисский Сиони смотрят друг на друга через долину, и между ними семь столетий.**
    Один — суровая низкая базилика V века; другая — высокая, узкая, почти сплошь резная купольная церковь
    начала XIII. Увидеть обе за одно утро — краткий курс грузинской архитектуры.


    Цугругашени построен между 1212 и 1222 годами, в правление Георгия IV Лаши — в последние годы золотого
    века, незадолго до прихода монголов. Здание невелико, но вытянуто вверх: барабан двенадцатигранный
    и необычно высокий, и каждая его грань решена как отдельная панель орнамента.


    Ради резьбы сюда и едут. Геометрическое плетение, виноградные побеги, розетки и кресты распределены
    по фасадам так, что взгляд нигде не останавливается; рельеф неглубокий, но вырезан достаточно чётко,
    чтобы лучше всего читаться при низком солнце — рано утром или под вечер. Камень — желтовато-красный
    туф, характерный для Болнисского района, и он тепло принимает свет.


    Внутри почти пусто. Роспись не сохранилась, пространство узкое и высокое. Для этого времени это обычно:
    церкви тех десятилетий тратили богатство на внешние стены. Двор небольшой, вокруг сады, внизу река
    Машавера. Здесь тихо, туристические автобусы заезжают редко.
  tip: >-
    Пятидесяти минут достаточно, и поездку разумнее объединить с Болнисским Сиони в пяти километрах. Церковь
    часто заперта, но смысл здания снаружи, так что закрытая дверь здесь мешает меньше обычного. Съезд
    во двор гравийный и после дождя грязный. Тени мало. Кафе и туалеты — в Болниси. Резьбу лучше всего
    показывает утренний или вечерний свет.
  route: >-
    Из Тбилиси на юг по марнеульской дороге, затем на запад в сторону Болниси — 70 км хорошего асфальта.
    В Болниси следуйте указателям на Земо-Болниси и пересеките Машаверу; церковь стоит на возвышении справа.
    Всего 74 км, примерно час двадцать пять. Последние два километра — узкий асфальт и гравий, но для
    машины эконом-класса это не проблема. Заправляйтесь в Марнеули или Болниси.
fa:
  name: کلیسای تسوغروغاشنی
  short: >-
    کلیسایی گنبددار از سال‌های ۱۲۱۲ تا ۱۲۲۲ نزدیک بولنیسی، پوشیده از یکی از متراکم‌ترین کنده‌کاری‌های
    تزیینی گرجستان.
  body: >-
    **تسوغروغاشنی و سیونی بولنیسی از دو سوی درّه به هم می‌نگرند و هفت سده میانشان فاصله است.** یکی بازیلیکایی
    کوتاه و سخت‌گیرانه از سدهٔ پنجم است؛ دیگری کلیسایی گنبددار، بلند، باریک و تقریباً یکسره کنده‌کاری‌شده
    از آغاز سدهٔ سیزدهم. دیدن هر دو در یک صبح، دوره‌ای فشرده در معماری گرجستان است.


    تسوغروغاشنی میان ۱۲۱۲ و ۱۲۲۲ در دوران گیورگی چهارم لاشا ساخته شد؛ واپسین سال‌های عصر زرین، اندکی پیش
    از رسیدن مغولان. بنا کوچک است اما رو به بالا کشیده شده: گردن گنبد دوازده‌ضلعی و به‌طرز غیرعادی بلند
    است و هر وجه آن همچون قابی مستقل از تزیین پرداخته شده است.


    کنده‌کاری همان چیزی است که مردم برای آن می‌آیند. گره‌های هندسی، پیچک‌های تاک، گل‌های چندپر و صلیب‌ها
    چنان بر نماها پخش شده‌اند که چشم هرگز آرام نمی‌گیرد؛ برجستگی کم‌ژرفاست اما به‌قدری قاطع بریده شده
    که در آفتاب کم‌ارتفاع، صبح زود یا نزدیک غروب، بهترین خوانش را می‌دهد. سنگ، توفِ زردْ-سرخِ ویژهٔ ناحیهٔ
    بولنیسی است و نور را گرم می‌پذیرد.


    درون بنا تقریباً برهنه است. نقاشی دیواری برجای نمانده و فضا باریک و بلند است. این برای آن دوره طبیعی
    است؛ کلیساهای این دهه‌ها ثروت خود را بر دیوار بیرونی می‌گذاشتند. حیاط کوچک است، با باغ‌ها در پیرامون
    و رود ماشاورا در پایین. اینجا آرام می‌ماند و اتوبوس‌های گردشگری به‌ندرت توقف می‌کنند.
  tip: >-
    پنجاه دقیقه کافی است، و جمع کردن آن با سیونی بولنیسی در پنج کیلومتری معنای بیشتری دارد. کلیسا اغلب
    قفل است، اما جانِ این بنا بیرون آن است، پس درِ بسته اینجا کمتر از معمول اهمیت دارد. راه ورودی حیاط
    شنی است و پس از باران گِل‌آلود. سایه کم است. کافه و سرویس بهداشتی در بولنیسی است. نور صبح یا اواخر
    بعدازظهر کنده‌کاری را بهتر نشان می‌دهد.
  route: >-
    از تفلیس به جنوب روی جادهٔ مارنئولی بروید، سپس به غرب به سوی بولنیسی — ۷۰ کیلومتر آسفالت خوب. در بولنیسی
    نشانه‌های زمو بولنیسی را دنبال کنید و از ماشاورا بگذرید؛ کلیسا بر بلندی سمت راست ایستاده است. روی‌هم
    ۷۴ کیلومتر، حدود یک ساعت و بیست‌وپنج دقیقه. دو کیلومتر آخر آسفالت باریک و شن است، اما برای خودروی
    اقتصادی مشکلی ندارد. سوخت را در مارنئولی یا بولنیسی بگیرید.
he:
  name: כנסיית צוגרוגאשני
  short: כנסייה מכופפת מן השנים 1212-1222 ליד בולניסי, מכוסה באחד הגילופים העיטוריים הצפופים בגאורגיה.
  body: >-
    **צוגרוגאשני ובולניסי סיוני ניצבות זו מול זו משני עברי עמק, ושבע מאות שנים מפרידות ביניהן.** האחת
    בזיליקה נמוכה וחמורה מן המאה ה-5; השנייה כנסייה מכופפת גבוהה, צרה ומגולפת כמעט כולה, מראשית המאה ה-13.
    לראות את שתיהן בבוקר אחד זה קורס מזורז באדריכלות גאורגית.


    צוגרוגאשני נבנתה בין 1212 ל-1222, בימי גיאורגי הרביעי לאשה — שנותיו האחרונות של תור הזהב, זמן קצר
    לפני בוא המונגולים. המבנה קטן אך מתוח כלפי מעלה: התוף בן שנים-עשר צלעות וגבוה באופן חריג, וכל פאה
    שלו מטופלת כלוח עיטור נפרד.


    הגילוף הוא הסיבה שבאים. שזירה גיאומטרית, שריגי גפן, רוזטות וצלבים פרושים על החזיתות כך שהעין אינה
    נחה לרגע; התבליט רדוד אך חתוך די הצורך כדי להיקרא במיטבו באור שמש נמוך, מוקדם או מאוחר ביום. האבן
    היא טוף צהבהב-אדמדם האופייני למחוז בולניסי, והיא סופגת את האור בחמימות.


    בפנים כמעט ריק. ציורי קיר לא שרדו והחלל צר וגבוה. זה רגיל לתקופה; כנסיות העשורים ההם השקיעו את עושרן
    בחוץ. החצר קטנה, סביבה מטעים ולמטה נהר המשאוורה. המקום נותר שקט ואוטובוסי תיירים כמעט אינם עוצרים.
  tip: >-
    חמישים דקות מספיקות, והשילוב עם בולניסי סיוני במרחק חמישה קילומטרים הגיוני הרבה יותר. הכנסייה נעולה
    לעיתים קרובות, אך עיקרו של המבנה בחוץ, ולכן דלת סגורה מפריעה כאן פחות מן הרגיל. הדרך לחצר חצץ ובוצית
    אחרי גשם. יש מעט צל. בתי קפה ושירותים נמצאים בבולניסי. אור הבוקר או שעות אחר הצהריים המאוחרות מציגים
    את הגילוף במיטבו.
  route: >-
    צאו מטביליסי דרומה בכביש למרנאולי, ואז מערבה לכיוון בולניסי — 70 ק״מ של אספלט טוב. בבולניסי לכו לפי
    השילוט לזמו בולניסי וחצו את המשאוורה; הכנסייה עומדת על גבעה מימין. 74 ק״מ בסך הכול, כשעה ועשרים וחמש.
    שני הקילומטרים האחרונים אספלט צר וחצץ, אך אינם מציבים בעיה לרכב חסכוני. תדלקו במרנאולי או בבולניסי.
ar:
  name: كنيسة تسوغروغاشيني
  short: كنيسة ذات قبة من سنوات 1212-1222 قرب بولنيسي، مغطاة بأحد أكثف النقوش الزخرفية في جورجيا.
  body: >-
    **تتقابل تسوغروغاشيني وسيوني بولنيسي عبر وادٍ، وبينهما سبعة قرون.** إحداهما بازيليكا واطئة صارمة من
    القرن الخامس؛ والأخرى كنيسة مقببة عالية ضيقة منقوشة كلها تقريباً من مطلع القرن الثالث عشر. ورؤيتهما
    في صباح واحد درس مكثف في العمارة الجورجية.


    بُنيت تسوغروغاشيني بين 1212 و1222 في عهد غيورغي الرابع لاشا، أي في أواخر سنوات العصر الذهبي وقبيل
    وصول المغول. والبناء صغير لكنه ممدود إلى الأعلى: رقبة القبة ذات اثني عشر ضلعاً وعالية على نحو غير
    مألوف، وكل وجه منها مُعالج كلوحة زخرفية مستقلة.


    والنقش هو ما يأتي الناس من أجله. فالتضفير الهندسي وأغصان الكرمة والورود الحجرية والصلبان موزعة على
    الواجهات بحيث لا تستقر العين لحظة؛ والنحت ضحل لكنه قاطع بما يكفي ليُقرأ في أفضل حال تحت شمس منخفضة،
    باكراً أو قرب الغروب. والحجر توف مائل إلى الصفرة والحمرة، وهو الحجر المميز لمنطقة بولنيسي، ويستقبل
    الضوء بدفء.


    والداخل شبه عارٍ. لم يبقَ تصوير جداري، والفراغ ضيق مرتفع. وهذا معتاد في تلك الحقبة؛ فكنائس تلك العقود
    كانت تضع ثروتها على الخارج. والفناء صغير، حوله بساتين وتحته نهر ماشافيرا. والمكان يبقى هادئاً، وحافلات
    السياحة نادراً ما تتوقف هنا.
  tip: >-
    خمسون دقيقة تكفي، والجمع بينها وبين سيوني بولنيسي على بعد خمسة كيلومترات أكثر منطقية بكثير. الكنيسة
    مغلقة غالباً، لكن جوهر البناء في الخارج، فالباب المغلق أقل أثراً هنا من غيرها. والطريق إلى الفناء
    حصوي وموحل بعد المطر. والظل قليل. والمقاهي ودورات المياه في بولنيسي. وضوء الصباح أو أواخر العصر يُظهر
    النقش في أحسن صوره.
  route: >-
    اتجه جنوباً من تبليسي على طريق مارنئولي، ثم غرباً نحو بولنيسي — 70 كم من الإسفلت الجيد. وفي بولنيسي
    اتبع لافتات زيمو بولنيسي واعبر نهر ماشافيرا؛ فالكنيسة على مرتفع إلى اليمين. أربعة وسبعون كيلومتراً
    إجمالاً، نحو ساعة وخمس وعشرين دقيقة. والكيلومتران الأخيران إسفلت ضيق وحصى، لكنهما لا يشكلان مشكلة
    لسيارة اقتصادية. تزوّد بالوقود في مارنئولي أو بولنيسي.
