ka:
  name: ურბნისის სიონი
  short: >-
    V-VI საუკუნეების სამნავიანი ბაზილიკა ქარელის მუნიციპალიტეტში, საქართველოს უძველესი ეკლესიების
    რიცხვში.
  body: >-
    **ურბნისი იმ ადგილთაგანია, სადაც ქართული ისტორია ეკლესიაზე ბევრად ღრმად იწყება.** სოფელი მტკვრის
    მარცხენა ნაპირზე დგას და ქართული მატიანეები მას ქართლის უძველეს ქალაქებს შორის ასახელებენ.
    არქეოლოგებმა აქ ელინისტური ხანის ნაქალაქარი, ქუჩების ქსელი და ხელოსნური უბნები გამოავლინეს. ქალაქი
    მრავალჯერ დაინგრა — არაბებმა, შემდეგ თემურ-ლენგმა — და აღარასოდეს აღდგა ძველი მასშტაბით.


    ტაძარი, სიონად წოდებული, სამნავიანი ბაზილიკაა და ძირითადი ბირთვი V-VI საუკუნეებს განეკუთვნება. ეს
    იმავე თაობის ნაგებობაა, რასაც ბოლნისის სიონი, ანუ ქართული ქრისტიანული არქიტექტურის პირველი
    შემორჩენილი ფენა. გეგმა მარტივია: სამი ნავი, სვეტების ორი რიგი, აღმოსავლეთით აფსიდი. მოგვიანებით — X
    და XVII საუკუნეებში — მნიშვნელოვნად გადააკეთეს, ამიტომ კედლებში სხვადასხვა ეპოქის ქვა და აგური
    ერთმანეთს ენაცვლება. ეს შერევა თავად კითხვადია და საინტერესო.


    ტაძარს გალავანი და სამრეკლო აკრავს; ეზო დიდი და მშვიდია, ძველი ხეებით. შიგნით სივრცე დაბალი და
    განიერია — სრულიად სხვა შეგრძნება, ვიდრე გვიანი გუმბათოვანი ეკლესიების ვერტიკალი.


    1103 წელს დავით აღმაშენებელმა აქ და მეზობელ რუისში მოიწვია საეკლესიო კრება, რომელმაც ეპისკოპოსები
    გადააყენა, ეკლესია სახელმწიფოს დაუქვემდებარა და ქვეყნის გაერთიანების გზა გაუხსნა. ეს ურბნისს ქართული
    შუასაუკუნეების პოლიტიკურ რუკაზეც აყენებს, არა მხოლოდ არქიტექტურულზე.
  tip: >-
    საათი საკმარისია, თუ რუისთან ერთად დაგეგმავთ — ორივე ერთ დღეში ადვილად ჯდება. ტაძარი მოქმედია, ჩაცმის
    წესები მოქმედებს, თავსაფრები კართან დევს. ეზო ბრტყელია და ხანდაზმულთათვისაც მოსახერხებელი. ტუალეტი
    მარტივია. სოფელში მცირე მაღაზიაა, კაფე კი არა — ჭამა გორში ან ქარელში სჯობს. ზაფხულში ეზოს ხეები კარგ
    ჩრდილს იძლევა, ზამთარში კი შიგნით სუსხია.
  route: >-
    თბილისიდან E60-ით გორის მიმართულებით, გორის შემდეგ ქარელისკენ განაგრძეთ და ურბნისის მაჩვენებელზე
    გაუხვიეთ — სულ 96 კმ, დაახლოებით საათი და ოცი წუთი. მაგისტრალი ავტობანია და სწრაფი; ბოლო ხუთი
    კილომეტრი ვიწრო სოფლის ასფალტია, ორმოებით მოსახვევებთან. საწვავი გორში ან ქარელში აიღეთ. ტაძრის
    გალავნის წინ მიწის მოედანია, სადაც უფასოდ დგება მანქანა. ეკონომ-კლასის ავტომობილი მთელი წლის
    განმავლობაში საკმარისია.
en:
  name: Urbnisi Cathedral
  short: >-
    A three-aisled basilica of the 5th and 6th centuries in Kareli municipality, among the oldest
    surviving churches in Georgia.
  body: >-
    **Urbnisi is one of those places where Georgian history begins much deeper than the church.** The
    village sits on the left bank of the Mtkvari, and the Georgian chronicles name it among the oldest
    towns of Kartli. Archaeologists have uncovered a Hellenistic-period settlement here, with a street
    grid and craft quarters. The town was destroyed repeatedly — by the Arabs, later by Timur — and never
    rebuilt at its old scale.


    The cathedral, known as the Sioni, is a three-aisled basilica whose core belongs to the 5th and 6th
    centuries. That puts it in the same generation as Bolnisi Sioni: the first surviving layer of
    Georgian Christian architecture. The plan is plain — three aisles, two rows of piers, an apse at the
    east. Substantial rebuilding in the 10th and 17th centuries means the walls now mix stone and brick
    from different eras, and that mixture is legible and interesting in itself.


    A wall and a bell tower enclose the church. The yard is large and quiet, with old trees. Inside, the
    space is low and wide, an entirely different sensation from the vertical pull of later domed
    churches, and closer to the way a late antique congregation would have experienced a building.


    In 1103 David the Builder convened a church council here and in neighbouring Ruisi. It removed
    corrupt bishops, brought the church under royal authority and cleared the political ground for the
    unification of Georgia. That places Urbnisi on the medieval political map as much as the
    architectural one.
  tip: >-
    An hour is enough, and it pairs naturally with Ruisi a few kilometres away; both fit comfortably into
    one outing. The church is in use, dress rules apply and scarves are kept by the door. The yard is
    flat and easy for older visitors. Toilets are basic. The village has a small shop but no cafe, so eat
    in Gori or Kareli. In summer the trees in the yard give good shade; in winter the interior is
    genuinely cold.
  route: >-
    Take the E60 west from Tbilisi towards Gori, continue past Gori towards Kareli and turn off at the
    sign for Urbnisi — 96 km in all, roughly an hour and twenty minutes. The main road is fast dual
    carriageway; the last five kilometres are narrow village asphalt with potholes on the bends. Refuel
    in Gori or Kareli. There is a gravel area in front of the enclosure where you can leave the car for
    nothing. An economy car is sufficient all year round.
ru:
  name: Урбнисский Сиони
  short: >-
    Трёхнефная базилика V-VI веков в Карельском муниципалитете, одна из древнейших сохранившихся церквей
    Грузии.
  body: >-
    **Урбниси — из тех мест, где грузинская история начинается гораздо глубже, чем церковь.** Село стоит
    на левом берегу Мтквари, и грузинские летописи называют его среди древнейших городов Картли.
    Археологи нашли здесь поселение эллинистического времени с сеткой улиц и ремесленными кварталами.
    Город разрушали не раз — арабы, позже Тимур — и в прежнем масштабе он больше не восстановился.


    Храм, известный как Сиони, — трёхнефная базилика, ядро которой относится к V-VI векам. Это то же
    поколение, что и Болнисский Сиони: первый сохранившийся слой грузинской христианской архитектуры.
    План прост: три нефа, два ряда столбов, апсида на востоке. Существенные перестройки X и XVII веков
    оставили в стенах камень и кирпич разных эпох, и эта смесь сама по себе читается и любопытна.


    Храм окружён оградой с колокольней. Двор большой и тихий, со старыми деревьями. Внутри пространство
    низкое и широкое — совсем иное ощущение, чем вертикальная тяга поздних купольных церквей, и ближе к
    тому, как воспринимала здание позднеантичная община.


    В 1103 году Давид Строитель созвал здесь и в соседнем Руиси церковный собор. Он сместил недостойных
    епископов, подчинил церковь царской власти и расчистил политическую почву для объединения Грузии. Это
    ставит Урбниси на средневековую политическую карту не меньше, чем на архитектурную.
  tip: >-
    Часа достаточно, и поездку естественно объединить с Руиси в нескольких километрах — оба легко
    умещаются в один выезд. Храм действующий, правила одежды действуют, платки лежат у входа. Двор
    ровный, удобен и для пожилых. Туалет простой. В селе есть маленький магазин, но кафе нет — обедать
    лучше в Гори или Карели. Летом деревья во дворе дают хорошую тень, зимой внутри по-настоящему
    холодно.
  route: >-
    Из Тбилиси на запад по E60 в сторону Гори, дальше мимо Гори в направлении Карели и поворот по
    указателю на Урбниси — всего 96 км, примерно час двадцать. Магистраль скоростная; последние пять
    километров — узкий сельский асфальт с ямами на поворотах. Заправляйтесь в Гори или Карели. Перед
    оградой есть гравийная площадка, оставить машину можно бесплатно. Машины эконом-класса достаточно
    круглый год.
fa:
  name: کلیسای جامع اوربنیسی
  short: >-
    بازیلیکایی سه‌شبستانی از سده‌های پنجم و ششم در شهرستان کارلی، از کهن‌ترین کلیساهای برجای‌مانده در
    گرجستان.
  body: >-
    **اوربنیسی از جاهایی است که تاریخ گرجی در آن بسیار ژرف‌تر از کلیسا آغاز می‌شود.** روستا بر کرانهٔ چپ
    مْتکواری نشسته و تواریخ گرجی آن را در شمار کهن‌ترین شهرهای کارتلی می‌آورند. باستان‌شناسان اینجا
    سکونتگاهی از دورهٔ هلنی با شبکهٔ خیابان و محله‌های پیشه‌وری یافته‌اند. شهر بارها ویران شد، نخست به
    دست عرب‌ها و سپس تیمور، و هرگز به مقیاس پیشین بازنگشت.


    کلیسای جامع، معروف به سیونی، بازیلیکایی سه‌شبستانی است که هستهٔ آن به سده‌های پنجم و ششم تعلق دارد.
    این یعنی هم‌نسل سیونی بولنیسی: نخستین لایهٔ برجای‌ماندهٔ معماری مسیحی گرجستان. نقشه ساده است: سه
    شبستان، دو ردیف جرز و محرابی در شرق. بازسازی‌های گستردهٔ سده‌های دهم و هفدهم سبب شده دیوارها آمیزه‌ای
    از سنگ و آجرِ دوره‌های گوناگون باشند، و همین آمیختگی خود خواندنی و جذاب است.


    دیواری و برج ناقوسی کلیسا را در بر گرفته‌اند. حیاط بزرگ و آرام است، با درختان کهن. در درون، فضا کوتاه
    و پهن است؛ حسی یکسره متفاوت با کشش عمودی کلیساهای گنبددار متأخر، و نزدیک‌تر به تجربهٔ جماعتی از اواخر
    دوران باستان.


    در سال ۱۱۰۳ داوید سازنده در همین‌جا و در روئیسی همسایه شورایی کلیسایی برگزار کرد. آن شورا اسقفان فاسد
    را برکنار کرد، کلیسا را زیر اقتدار پادشاه آورد و زمین سیاسی را برای یکپارچگی گرجستان هموار ساخت. همین
    اوربنیسی را به‌اندازهٔ نقشهٔ معماری، بر نقشهٔ سیاسی سده‌های میانه می‌نشاند.
  tip: >-
    یک ساعت کافی است و به‌طبع با روئیسی که چند کیلومتر آن‌سوتر است جفت می‌شود؛ هر دو در یک بیرون‌رفت جا
    می‌گیرند. کلیسا فعال است، قواعد پوشش برقرار است و روسری‌ها کنار در گذاشته شده‌اند. حیاط هموار است و
    برای سالمندان آسان. سرویس بهداشتی ساده است. روستا مغازه‌ای کوچک دارد اما کافه ندارد، پس در گوری یا
    کارلی غذا بخورید. تابستان درختان حیاط سایهٔ خوبی می‌دهند و زمستان درون بنا واقعاً سرد است.
  route: >-
    از تفلیس به غرب روی E60 به سوی گوری بروید، از گوری بگذرید و به سمت کارلی ادامه دهید و سر تابلوی
    اوربنیسی بپیچید — روی‌هم ۹۶ کیلومتر، نزدیک یک ساعت و بیست دقیقه. جادهٔ اصلی دوبانده و تند است؛ پنج
    کیلومتر آخر آسفالت باریک روستایی با چاله‌هایی در پیچ‌هاست. سوخت را در گوری یا کارلی بگیرید. پیش از
    دیوار محوطه زمینی شنی هست که می‌توان خودرو را رایگان در آن گذاشت. خودروی اقتصادی در تمام سال کافی
    است.
he:
  name: קתדרלת אורבניסי
  short: >-
    בזיליקה תלת-אולמית מן המאות ה-5 וה-6 במחוז קארלי, מן הכנסיות העתיקות ביותר ששרדו בגאורגיה.
  body: >-
    **אורבניסי היא מן המקומות שבהם ההיסטוריה הגאורגית מתחילה עמוק הרבה יותר מן הכנסייה.** הכפר יושב על
    הגדה השמאלית של המטקווארי, והכרוניקות הגאורגיות מונות אותו בין הערים העתיקות של קרתלי. ארכיאולוגים
    חשפו כאן יישוב מן התקופה ההלניסטית, עם רשת רחובות ורובעי מלאכה. העיר נהרסה שוב ושוב, בידי הערבים ואחר
    כך בידי תימור, ומעולם לא נבנתה מחדש בקנה המידה הישן.


    הקתדרלה, הידועה בשם סיוני, היא בזיליקה תלת-אולמית שגרעינה מן המאות ה-5 וה-6. זהו אותו דור של בולניסי
    סיוני: השכבה הראשונה ששרדה מן האדריכלות הנוצרית הגאורגית. התוכנית פשוטה: שלושה אולמות, שתי שורות
    עמודים ואפסיס במזרח. בנייה מחדש נרחבת במאה ה-10 ובמאה ה-17 הותירה בקירות אבן ולבנים מתקופות שונות,
    והתערובת הזו קריאה ומעניינת בפני עצמה.


    חומה ומגדל פעמונים מקיפים את הכנסייה. החצר גדולה ושקטה, עם עצים ותיקים. בפנים החלל נמוך ורחב, תחושה
    שונה לגמרי מן המשיכה האנכית של כנסיות מכופפות מאוחרות, וקרובה יותר לאופן שבו חוותה קהילה מן העת
    העתיקה המאוחרת מבנה כזה.


    בשנת 1103 כינס דוד הבנאי כאן ובראוויסי הסמוכה ועידת כנסייה. היא הדיחה בישופים מושחתים, הכפיפה את
    הכנסייה לסמכות המלך ופינתה את הקרקע הפוליטית לאיחוד גאורגיה. הדבר מציב את אורבניסי על המפה הפוליטית
    של ימי הביניים לא פחות מאשר על המפה האדריכלית.
  tip: >-
    שעה מספיקה, וזה מתחבר באופן טבעי לראוויסי שכמה קילומטרים משם; שניהם נכנסים בנוחות ליציאה אחת. הכנסייה
    פעילה, כללי לבוש חלים, ומטפחות מונחות ליד הדלת. החצר מישורית ונוחה גם למבוגרים. השירותים בסיסיים.
    בכפר יש חנות קטנה אך אין בית קפה, לכן אכלו בגורי או בקארלי. בקיץ העצים בחצר נותנים צל טוב, ובחורף
    בפנים קר באמת.
  route: >-
    סעו מטביליסי מערבה בכביש E60 לכיוון גורי, המשיכו מעבר לגורי לכיוון קארלי ופנו בשילוט לאורבניסי — 96
    ק״מ בסך הכול, כשעה ועשרים. הכביש הראשי מהיר ודו-מסלולי; חמשת הקילומטרים האחרונים הם אספלט כפרי צר עם
    בורות בעיקולים. תדלקו בגורי או בקארלי. לפני החומה יש מגרש חצץ שבו אפשר להשאיר את הרכב בחינם. רכב
    חסכוני מספיק בכל ימות השנה.
ar:
  name: كاتدرائية أوربنيسي
  short: >-
    بازيليكا ثلاثية الأروقة من القرنين الخامس والسادس في بلدية كاريلي، من أقدم الكنائس الباقية في جورجيا.
  body: >-
    **أوربنيسي من الأماكن التي يبدأ فيها التاريخ الجورجي أعمق بكثير من الكنيسة.** تقع القرية على الضفة
    اليسرى لنهر متكفاري، وتذكرها الحوليات الجورجية بين أقدم مدن كارتلي. وقد كشف علماء الآثار هنا مستوطنة
    من العصر الهلنستي بشبكة شوارع وأحياء للحرف. ودُمّرت المدينة مراراً، على يد العرب ثم على يد تيمور، ولم
    تُبنَ قط بحجمها القديم.


    والكاتدرائية، المعروفة بالسيوني، بازيليكا ثلاثية الأروقة يعود قلبها إلى القرنين الخامس والسادس. وهذا
    يضعها في جيل سيوني بولنيسي نفسه: أول طبقة باقية من العمارة المسيحية الجورجية. والمخطط بسيط: ثلاثة
    أروقة، وصفّان من الدعامات، وحنية في الشرق. وقد تركت إعادات البناء الواسعة في القرنين العاشر والسابع
    عشر في الجدران حجراً وآجرّاً من عصور مختلفة، وهذا المزيج نفسه قابل للقراءة ومثير للاهتمام.


    يحيط بالكنيسة سور وبرج أجراس. والفناء واسع هادئ، فيه أشجار معمّرة. وفي الداخل يبدو الفراغ منخفضاً
    عريضاً، وهو إحساس مختلف تماماً عن الجذب الرأسي في الكنائس المقببة المتأخرة، وأقرب إلى ما كانت تعيشه
    جماعة من أواخر العصور القديمة.


    وفي عام 1103 عقد داوود البنّاء هنا وفي روئيسي المجاورة مجمعاً كنسياً. أقال أساقفة فاسدين، وأخضع
    الكنيسة لسلطة الملك، ومهّد الأرض السياسية لتوحيد جورجيا. وهذا يضع أوربنيسي على الخريطة السياسية
    للعصور الوسطى لا على الخريطة المعمارية وحدها.
  tip: >-
    ساعة تكفي، والزيارة تقترن طبيعياً بروئيسي على بعد كيلومترات قليلة؛ وكلاهما يدخل بيسر في خرجة واحدة.
    الكنيسة عاملة، وقواعد اللباس سارية، والأغطية موضوعة عند الباب. والفناء مستوٍ ومريح لكبار السن. ودورات
    المياه بسيطة. في القرية متجر صغير لكن لا مقهى، فتناول الطعام في غوري أو كاريلي. وفي الصيف تعطي أشجار
    الفناء ظلاً جيداً، وفي الشتاء يكون الداخل بارداً فعلاً.
  route: >-
    خذ الطريق E60 غرباً من تبليسي نحو غوري، وواصل بعد غوري باتجاه كاريلي وانعطف عند لافتة أوربنيسي — 96
    كم إجمالاً، نحو ساعة وعشرين دقيقة. الطريق الرئيسي مزدوج وسريع؛ والكيلومترات الخمسة الأخيرة إسفلت قروي
    ضيق فيه حفر عند المنعطفات. تزوّد بالوقود في غوري أو كاريلي. وأمام السور ساحة حصوية يمكن ترك السيارة
    فيها بلا مقابل. وسيارة اقتصادية تكفي على مدار السنة.
