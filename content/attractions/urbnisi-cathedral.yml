ka:
  name: ურბნისის სიონი
  short: >-
    V–VI საუკუნეების დაბალი, გრძელი ბაზილიკა ძველი იბერიის მეორე ქალაქში, სადაც 1103 წელს დავით აღმაშენებლის
    საეკლესიო კრება შეიკრიბა.
  body: >-
    **ურბნისი ქალაქი იყო ტაძრამდე დიდი ხნით ადრე — ძველი იბერიის მეორე ქალაქი მცხეთის შემდეგ — და აქაურ
    მიწას ალყის კვალი დღემდე ახსოვს.**


    სოფელი მტკვრის მაღალ მარცხენა ნაპირზე დგას. არქეოლოგების მიხედვით, აქ ადამიანი ძვ. წ. III ათასწლეულში
    უკვე ცხოვრობდა, ძვ. წ. IV საუკუნისთვის კი ურბნისი გალავნიანი ქალაქი იყო — აბანოებით, წარმართული სალოცავებით
    და ებრაული სამლოცველოთიც კი. დამწვარი ნაგებობები და მრგვალი ქვის ჭურვები მოწმობს, რომ ქალაქი დაახლოებით
    ძვ. წ. III საუკუნეში ალყაში მოაქციეს და გაანადგურეს. ქართლის გაქრისტიანების შემდეგ ურბნისი საეპისკოპოსო
    კათედრა გახდა და 25-კოშკიანი ზღუდე შემოირტყა, რამაც, თუმცა, VIII საუკუნის 30-იან წლებში არაბ სარდალ
    მარვანს ქალაქის აღება ვერ დაუშალა. ქალაქი სოფლად დაპატარავდა, ტაძარმა კი ეპისკოპოსი შეინარჩუნა.


    სიონი სამნავიანი ბაზილიკაა, 32 მეტრი სიგრძისა და 22 მეტრი სიგანის. ჩრდილოეთ კედლის ასომთავრული წარწერა
    ქტიტორებს ასახელებს — ვინმე კონსტანტის და მამა მიქელს; ასოების მოხაზულობის მიხედვით ქართველი მეცნიერები
    ტაძარს V–VI საუკუნეების მიჯნით ათარიღებენ, ზოგი წყარო კი საუკუნით გვიანდელად მიიჩნევს. კედლები ფენებივით
    იკითხება: ქვემოთ კარგად გათლილი ქვიშაქვა, ზემოთ — შემდგომი აღდგენების უსწორმასწორო ქვა და აგური; ყველაზე
    დიდი აღდგენა 1668 წელს ჩატარდა. შიგნით ჯვრისებრი ბოძების ორი რიგი და აგურის თაღები შუა ნავს ხუთ მონაკვეთად
    ყოფს, ზემოდან კი აგურის ცილინდრული კამარა ფარავს. სივრცე დაბალი და განიერია — მაღლა კი არ გეზიდებათ,
    თავის სიგანეში გიტევთ.


    დაუკვირდით აგურით გამოყვანილ ჯვრებს აღმოსავლეთ და დასავლეთ ფასადებზე, ჩრდილოეთით კი ქვას ჯვრის გამოსახულებით,
    მის ქვემოთ — პატარა ცხენს. დასავლეთით მდგარი სამრეკლო-კარიბჭე 1706 წელს ვახტანგ VI-ისა და დედოფალ
    რუსუდანის ბრძანებით აიგო.


    1103 წელს დავით აღმაშენებელმა სწორედ აქ და რუისში მოიწვია კრება, რომელმაც უღირსი ეპისკოპოსები გადააყენა
    და ეკლესია სამეფო ხელისუფლებას დაუმორჩილა. ლაშქრები ურბნისზე გაივლიდნენ და სხვაგან მიიჩქაროდნენ; ბაზილიკა
    კი უბრალოდ დარჩა.
  tip: >-
    საათი სავსებით საკმარისია, რუისი კი გზით სულ 7 კმ-შია — ორივე ერთ გასვლაზე ნახეთ. სიონი მოქმედი ტაძარია:
    მხრები და მუხლები დაფარული, ქალებს თავსაფარი. ეზო ბრტყელია და ძველი ხეების ჩრდილით სავსე, ხანდაზმულებისთვისაც
    მოსახერხებელი; ზამთარში ქვის ინტერიერი მართლა ცივია. სოფლის პატარა მაღაზიაში წყალს იყიდით, სადილისთვის
    კი გორში ან ქარელში წადით. ჯერ გარედან შემოუარეთ, დინჯად: წარწერები და ამოკვეთილი ცხენი ადვილად შეუმჩნეველი
    რჩება.
  route: >-
    თბილისიდან ს1 (E60) ავტომაგისტრალით დასავლეთისკენ, გორის გავლით — დაახლოებით 94 კმ სწრაფი, ოთხზოლიანი
    გზა — და რუისისა და ურბნისის გასასვლელზე გადაუხვიეთ. წრიული მოედნიდან ადგილობრივი გზა (შ136) სამხრეთისკენ
    დაახლოებით ერთ კილომეტრში ურბნისში შეგიყვანთ. სულ დაახლოებით 96 კმ და საათი და ოცი წუთი. სოფლის ასფალტი
    ვიწროა, მოსახვევებში ორმოებით, ამიტომ ნელა იარეთ. საწვავი გორსა და ქარელშია. ტაძრის გალავნის წინ ხრეშიან
    მოედანზე მანქანა უფასოდ დგება; ეკონომ-კლასის ავტომობილი მთელი წლის განმავლობაში საკმარისია.
en:
  name: Urbnisi Cathedral
  short: >-
    A long, low basilica of c. 500–600 in what was once ancient Iberia's second city, where David the
    Builder's church council met in 1103.
  body: >-
    **Long before it had a cathedral, Urbnisi was a city — the second of ancient Iberia after Mtskheta
    — and the ground here still keeps the marks of a siege.**


    The village sits on a high left bank of the Mtkvari. People lived here by the third millennium BC;
    by the fourth century BC Urbnisi was a walled town with baths, pagan sanctuaries and even a Jewish
    house of worship. Burnt buildings and round catapult stones tell of a siege and sack around the third
    century BC. Christian Urbnisi became a bishop's seat behind a wall of 25 towers, which did not stop
    the Arab commander Marwan taking it in the 730s. The city shrank to a village; the cathedral kept
    its bishop.


    The Sioni is a three-aisled basilica, 32 by 22 metres. On its north wall an asomtavruli inscription
    names the builders, one Konstanti and Father Mikel, and its lettering dates the church to around 500,
    though some accounts say a century later. The walls read like strata: neat sandstone below, rougher
    stone and brick above from repairs, the largest in 1668. Inside, two rows of cruciform piers and brick
    arches divide the nave into five bays under a brick barrel vault — a low, wide room that holds you
    horizontally rather than lifting you upward.


    Look for the brick crosses in the east and west façades and, on the north side, a stone carved with
    a cross and, beneath it, a small horse. The gate-tower to the west was raised in 1706 by order of
    King Vakhtang VI and Queen Rusudan.


    In 1103 David the Builder called the church council that met here and at Ruisi, purging venal bishops
    and binding the church to the crown. Armies passed through Urbnisi on their way somewhere else; the
    basilica simply stayed.
  tip: >-
    An hour is plenty, and Ruisi is only 7 km away by road — see both in one outing. The Sioni is a working
    church: shoulders and knees covered, headscarves for women. The yard is flat and shaded by old trees,
    easy for older visitors; in winter the stone interior is properly cold. The small shop in the village
    will do for water, but for lunch head to Gori or Kareli. Walk the outside first, slowly: the inscriptions
    and the carved horse are easy to miss.
  route: >-
    Take the S1 (E60) motorway west from Tbilisi past Gori, about 94 km of fast dual carriageway, and
    leave it at the junction for Ruisi and Urbnisi. From the roundabout a short local road (Sh136) runs
    about a kilometre south into Urbnisi. Around 96 km and 1 hour 20 minutes in all. The village asphalt
    is narrow and potholed on the bends, so take it slowly. Fuel in Gori or Kareli. Free gravel parking
    in front of the churchyard wall; an economy car is enough all year round.
ru:
  name: Урбнисский собор
  short: >-
    Длинная приземистая базилика около 500–600 годов в бывшем втором городе древней Иберии, где в 1103
    году собирался церковный собор Давида Строителя.
  body: >-
    **Задолго до того, как в Урбниси появился собор, он был городом — вторым в древней Иберии после Мцхеты,
    — и земля здесь до сих пор хранит следы осады.**


    Село стоит на высоком левом берегу Куры. Люди жили здесь уже в III тысячелетии до н. э.; к IV веку
    до н. э. Урбниси был обнесённым стеной городом с банями, языческими святилищами и даже иудейским молельным
    домом. Сгоревшие постройки и круглые камни для катапульт говорят об осаде и разграблении около III
    века до н. э. Христианский Урбниси стал резиденцией епископа за стеной с 25 башнями, но это не помешало
    арабскому полководцу Марвану взять его в 730-х годах. Город сжался до села; собор сохранил своего
    епископа.


    Сиони — трёхнефная базилика размером 32 на 22 метра. Надпись асомтаврули на северной стене называет
    строителей — некоего Константи и отца Микела, а начертание букв датирует церковь примерно 500 годом,
    хотя по некоторым данным она на столетие моложе. Стены читаются как геологические пласты: ровный песчаник
    внизу, выше — более грубый камень и кирпич ремонтов, крупнейший из которых пришёлся на 1668 год. Внутри
    два ряда крестчатых столбов и кирпичные арки делят центральный неф на пять пролётов под кирпичным
    коробовым сводом — низкое, широкое пространство, которое держит вас по горизонтали, а не тянет ввысь.


    Найдите кирпичные кресты на восточном и западном фасадах, а на северной стороне — камень с резным
    крестом и маленьким конём под ним. Надвратную башню на западе возвели в 1706 году по повелению царя
    Вахтанга VI и царицы Русудан.


    В 1103 году Давид Строитель созвал церковный собор, заседавший здесь и в Руиси: он очистил церковь
    от продажных епископов и привязал её к короне. Армии проходили через Урбниси по пути куда-то ещё;
    базилика просто оставалась на месте.
  tip: >-
    Часа вполне достаточно, а Руиси всего в 7 км по дороге — посмотрите оба храма за одну поездку. Сиони
    — действующая церковь: плечи и колени закрыты, женщинам нужен платок. Двор ровный и затенён старыми
    деревьями, пожилым посетителям здесь легко; зимой в каменном интерьере по-настоящему холодно. Воду
    можно купить в маленьком сельском магазине, а обедать лучше ехать в Гори или Карели. Сначала не спеша
    обойдите храм снаружи: надписи и резного коня легко пропустить.
  route: >-
    Из Тбилиси по автомагистрали S1 (E60) на запад мимо Гори — около 94 км быстрой дороги с разделёнными
    полосами; съезжайте на развязке на Руиси и Урбниси. От кольца короткая местная дорога (Sh136) ведёт
    около километра на юг, в Урбниси. Всего около 96 км и 1 час 20 минут. Сельский асфальт узкий, на поворотах
    — выбоины, так что не торопитесь. Заправка — в Гори или Карели. Бесплатная гравийная парковка перед
    оградой церковного двора; машины эконом-класса хватит круглый год.
fa:
  name: کلیسای جامع اوربنیسی
  short: >-
    بازیلیکایی دراز و کوتاه‌قامت از حدود سال‌های ۵۰۰ تا ۶۰۰، در شهری که روزگاری دومین شهر ایبریای باستان
    بود؛ جایی که شورای کلیسایی داوید سازنده در ۱۱۰۳ گرد آمد.
  body: >-
    **اوربنیسی دیرزمانی پیش از آنکه کلیسای جامعی داشته باشد شهر بود — دومین شهر ایبریای باستان پس از متسختا
    — و خاک اینجا هنوز نشانه‌های یک محاصره را در خود نگه داشته است.**


    روستا بر کرانهٔ بلند چپ متکواری نشسته است. مردم از هزارهٔ سوم پیش از میلاد اینجا می‌زیستند؛ تا سدهٔ
    چهارم پیش از میلاد، اوربنیسی شهری بارودار بود با گرمابه‌ها، پرستشگاه‌های مشرکان و حتی عبادتگاهی یهودی.
    ساختمان‌های سوخته و سنگ‌های گرد منجنیق از محاصره و غارتی در حدود سدهٔ سوم پیش از میلاد خبر می‌دهند.
    اوربنیسیِ مسیحی کرسی اسقفی شد، پشت دیواری با ۲۵ برج، که با این همه مانع نشد مروان، سردار عرب، در دههٔ
    ۷۳۰ آن را بگیرد. شهر به روستایی کوچک شد؛ کلیسای جامع اسقفش را نگه داشت.


    سیونی بازیلیکایی سه‌شبستانی است به ابعاد ۳۲ در ۲۲ متر. بر دیوار شمالی آن کتیبه‌ای به خط اسومتاورولی
    نام سازندگان را آورده است، کسی به نام کنستانتی و پدر میکل، و شکل حروفش کلیسا را به حدود سال ۵۰۰ می‌رساند،
    هرچند برخی منابع آن را یک سده جوان‌تر می‌دانند. دیوارها همچون لایه‌های زمین خوانده می‌شوند: ماسه‌سنگ
    منظم در پایین، و بالاتر سنگ زبرتر و آجرِ تعمیرها، که بزرگ‌ترینشان در ۱۶۶۸ انجام شد. درون، دو ردیف
    پایهٔ صلیبی‌شکل و طاق‌های آجری شبستان میانی را به پنج دهانه بخش می‌کنند، زیر طاق آهنگی از آجر — فضایی
    کوتاه و پهن که شما را افقی در بر می‌گیرد، نه آنکه به سوی بالا بکشد.


    صلیب‌های آجری را در نماهای شرقی و غربی بجویید و، در سوی شمالی، سنگی که صلیبی بر آن کنده‌اند و زیرش
    اسبی کوچک. برج دروازه در غرب در ۱۷۰۶ به فرمان شاه واختانگ ششم و ملکه روسودان برافراشته شد.


    در ۱۱۰۳ داوید سازنده شورای کلیسایی را فراخواند که اینجا و در رویسی تشکیل شد؛ شورا اسقفان رشوه‌خوار
    را کنار نهاد و کلیسا را به تاج پادشاهی پیوند زد. سپاهیان از اوربنیسی می‌گذشتند تا به جایی دیگر بروند؛
    بازیلیکا تنها سر جایش ماند.
  tip: >-
    یک ساعت بس است، و رویسی تنها ۷ کیلومتر راه دارد؛ هر دو را در یک گردش ببینید. سیونی کلیسایی فعال است:
    شانه‌ها و زانوها پوشیده، و روسری برای بانوان. حیاط هموار است و سایهٔ درختان کهن بر آن افتاده، و برای
    بازدیدکنندگان سالمند آسان است؛ در زمستان درون سنگی کلیسا به‌راستی سرد است. مغازهٔ کوچک روستا برای
    خرید آب کافی است، اما برای ناهار به گوری یا کارلی بروید. نخست، آهسته، بیرون بنا را دور بزنید: کتیبه‌ها
    و اسب کنده‌کاری‌شده به‌آسانی از چشم می‌افتند.
  route: >-
    از تفلیس آزادراه S1 (E60) را به سوی غرب، از کنار گوری، بگیرید: حدود ۹۴ کیلومتر بزرگراه تندرو با مسیرهای
    جدا؛ در تقاطع رویسی و اوربنیسی خارج شوید. از میدان، جاده‌ای محلی و کوتاه (Sh136) حدود یک کیلومتر به
    سوی جنوب تا اوربنیسی می‌رود. روی‌هم حدود ۹۶ کیلومتر و ۱ ساعت و ۲۰ دقیقه. آسفالت روستا باریک است و
    در پیچ‌ها چاله دارد، پس آرام برانید. سوخت را در گوری یا کارلی بزنید. جلوی دیوار حیاط کلیسا پارکینگ
    شنی رایگان هست؛ خودروی اقتصادی در همهٔ فصل‌ها کافی است.
he:
  name: קתדרלת אורבניסי
  short: >-
    בזיליקה ארוכה ונמוכה מסביבות השנים 500–600, במקום שהיה פעם העיר השנייה בחשיבותה באיבריה העתיקה, ושבו
    התכנסה ב-1103 ועידת הכנסייה של דוד הבונה.
  body: >-
    **הרבה לפני שהייתה בה קתדרלה, הייתה אורבניסי עיר – השנייה באיבריה העתיקה אחרי מצחתה – והאדמה כאן עדיין
    שומרת את סימניו של מצור.**


    הכפר יושב על גדה שמאלית גבוהה של המטקווארי. בני אדם חיו כאן כבר באלף השלישי לפני הספירה; עד המאה ה-4
    לפני הספירה הייתה אורבניסי עיר מוקפת חומה, ובה מרחצאות, מקדשים פגאניים ואפילו בית תפילה יהודי. מבנים
    שרופים ואבני קטפולטה עגולות מעידים על מצור ועל ביזה בסביבות המאה ה-3 לפני הספירה. אורבניסי הנוצרית
    הפכה למושב בישוף מאחורי חומה בת 25 מגדלים, אך זו לא מנעה מן המצביא הערבי מרואן לכבוש אותה בשנות ה-30
    של המאה ה-8. העיר הצטמקה לכפר; הקתדרלה שמרה על הבישוף שלה.


    הסיוני היא בזיליקה תלת-ספינתית, 32 על 22 מטרים. כתובת בכתב אסומתוורולי על הקיר הצפוני מזכירה את הבונים,
    אדם בשם קונסטנטי והאב מיקל, וצורת אותיותיה מתארכת את הכנסייה לסביבות שנת 500, אם כי יש מקורות המאחרים
    אותה במאה שנה. הקירות נקראים כמו שכבות גאולוגיות: אבן חול מסודרת למטה, ומעליה אבן גסה יותר ולבנים
    מתיקונים, שהגדול שבהם נעשה ב-1668. בפנים מחלקים שני טורים של עמודים צלביים וקשתות לבנים את הספינה
    המרכזית לחמישה מפתחים, תחת קמרון חבית מלבנים – חלל נמוך ורחב שאוחז בכם לרוחב ולא מושך אתכם מעלה.


    חפשו את צלבי הלבנים בחזיתות המזרחית והמערבית, ובצד הצפוני – אבן שגולפו בה צלב ומתחתיו סוס קטן. מגדל
    השער שממערב הוקם ב-1706 בפקודת המלך וחטנג השישי והמלכה רוסודן.


    ב-1103 כינס דוד הבונה את ועידת הכנסייה שהתכנסה כאן וברואיסי; הוועידה טיהרה את הכנסייה מבישופים מושחתים
    וכבלה אותה לכתר. צבאות עברו דרך אורבניסי בדרכם למקום אחר; הבזיליקה פשוט נשארה.
  tip: >-
    שעה מספיקה בהחלט, ורואיסי נמצאת במרחק 7 ק"מ בלבד בכביש – ראו את שתיהן בסיור אחד. הסיוני היא כנסייה
    פעילה: כתפיים וברכיים מכוסות, כיסוי ראש לנשים. החצר מישורית ומוצלת בעצים ותיקים, נוחה למבקרים מבוגרים;
    בחורף חלל האבן בפנים קר באמת. החנות הקטנה בכפר תספיק לקניית מים, אבל לארוחת צהריים סעו לגורי או לקארלי.
    הקיפו קודם את המבנה מבחוץ, לאט: קל לפספס את הכתובות ואת הסוס המגולף.
  route: >-
    מטביליסי סעו מערבה בכביש המהיר S1 (E60) על פני גורי – כ-94 ק"מ של כביש מהיר ומופרד – וצאו ממנו במחלף
    לרואיסי ולאורבניסי. מהכיכר מוביל כביש מקומי קצר (Sh136) כקילומטר דרומה אל אורבניסי. בסך הכול כ-96
    ק"מ ושעה ו-20 דקות. האספלט בכפר צר ומלא בורות בעיקולים, לכן סעו לאט. דלק בגורי או בקארלי. חניית חצץ
    חינם מול חומת חצר הכנסייה; רכב חסכוני מספיק בכל ימות השנה.
ar:
  name: كاتدرائية أوربنيسي
  short: >-
    بازيليكا طويلة منخفضة من نحو 500–600، في ما كان يومًا ثاني مدن إيبيريا القديمة، حيث انعقد عام 1103
    المجمع الكنسي الذي دعا إليه داود البنّاء.
  body: >-
    **قبل أن تكون لأوربنيسي كاتدرائية بزمن طويل، كانت مدينة — الثانية في إيبيريا القديمة بعد متسخيتا —
    ولا تزال الأرض هنا تحفظ آثار حصار.**


    تقع القرية على ضفة يسرى عالية لنهر متكفاري. سكن الناس هنا منذ الألف الثالث قبل الميلاد؛ وبحلول القرن
    الرابع قبل الميلاد كانت أوربنيسي مدينة مسوّرة فيها حمّامات ومعابد وثنية، بل ودار عبادة يهودية. وتشهد
    المباني المحترقة وحجارة المنجنيق المستديرة على حصار ونهب نحو القرن الثالث قبل الميلاد. وصارت أوربنيسي
    المسيحية مقرًّا لأسقف خلف سور ذي 25 برجًا، لكن ذلك لم يمنع القائد العربي مروان من الاستيلاء عليها
    في ثلاثينيات القرن الثامن. فانكمشت المدينة إلى قرية، واحتفظت الكاتدرائية بأسقفها.


    السيوني بازيليكا ثلاثية الأروقة، أبعادها 32 في 22 مترًا. يذكر نقش بخط الأسومتافرولي على جدارها الشمالي
    اسمَي البنّاءين: رجلٍ يُدعى كونستانتي، والأبِ ميكيل، ويؤرّخ شكلُ حروفه الكنيسةَ بنحو عام 500، وإن
    كانت بعض الروايات تجعلها بعد ذلك بقرن. وتُقرأ الجدران كأنها طبقات جيولوجية: حجر رملي منتظم في الأسفل،
    وفوقه حجر أخشن وآجرّ من الترميمات، وأكبرها عام 1668. وفي الداخل يقسم صفّان من الدعامات الصليبية وعقود
    من الآجرّ الصحنَ إلى خمسة أقسام تحت قبو أسطواني من الآجرّ — فضاء منخفض عريض يحتضنك أفقيًا بدل أن يرفعك
    إلى الأعلى.


    ابحث عن الصلبان الآجرّية في الواجهتين الشرقية والغربية، وفي الجهة الشمالية عن حجر نُحت عليه صليب وتحته
    حصان صغير. أمّا برج البوابة في الغرب فقد شُيّد عام 1706 بأمر الملك فاختانغ السادس والملكة روسودان.


    في عام 1103 دعا داود البنّاء إلى المجمع الكنسي الذي انعقد هنا وفي رويسي، فطهّر الكنيسة من الأساقفة
    المرتشين وربطها بالتاج. مرّت الجيوش بأوربنيسي في طريقها إلى أماكن أخرى؛ أمّا البازيليكا فبقيت في مكانها
    ببساطة.
  tip: >-
    تكفي ساعة، ورويسي على بعد 7 كم فقط بالطريق، فزُر الاثنتين في جولة واحدة. السيوني كنيسة عاملة تُقام
    فيها الصلوات: يجب أن تكون الأكتاف والرُّكب مغطّاة، وعلى النساء تغطية الرأس. الفناء مستوٍ تظلّله أشجار
    معمّرة، فيسهل على كبار السن؛ وفي الشتاء يكون الداخل الحجري باردًا حقًّا. يفي المتجر الصغير في القرية
    بشراء الماء، أمّا الغداء فاذهب لأجله إلى غوري أو كاريلي. طُف بالمبنى من الخارج أولًا، على مهل: فمن
    السهل أن تفوتك النقوش والحصان المنحوت.
  route: >-
    اسلك الطريق السريع S1 (E60) غربًا من تبليسي مرورًا بغوري، نحو 94 كم من طريق سريع مزدوج، واخرج منه
    عند التقاطع المؤدي إلى رويسي وأوربنيسي. من الدوّار يمتدّ طريق محلي قصير (Sh136) نحو كيلومتر جنوبًا
    إلى أوربنيسي. المجموع نحو 96 كم وساعة و20 دقيقة. الإسفلت في القرية ضيق وتكثر الحفر عند المنعطفات،
    فتمهّل. الوقود في غوري أو كاريلي. موقف حصوي مجاني أمام سور فناء الكنيسة؛ وتكفي سيارة اقتصادية طوال
    العام.
