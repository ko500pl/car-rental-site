ka:
  name: თელოვნის ჯვარპატიოსნის ეკლესია
  short: >-
    VIII–IX საუკუნეების ტრიკონქი ქსნის ხეობის ფერდობზე, სადაც მანდილიონის — მაცხოვრის ხელთუქმნელი სახის
    — ერთ-ერთი უადრესი ქართული გამოსახულება შემორჩა.
  body: >-
    **აფსიდის პატარა სარკმლის თავზე, გაუქმებული სოფლის ეკლესიაში, ათას წელზე მეტი ხნის წინ დახატული მაცხოვრის
    სახე დღესაც იყურება — გახუნებული, დაზიანებული და საქართველოში თავისი ტიპის ერთ-ერთი უძველესი.**


    თელოვანი აღარ არსებობს. სოფლისგან, რომელიც დღევანდელი ქსოვრისის აღმოსავლეთით, დაახლოებით სამ კილომეტრზე
    იდგა, მხოლოდ შენობათა ნანგრევები, კერამიკის ნატეხები და დიდი მარნის ნაშთი დარჩა, რამდენიმე ჰექტარზე
    მიმოფანტული. სოფელი გაქრა, ჯვარპატიოსნის ეკლესია კი დარჩა. იგი VIII–IX საუკუნეებში ტრიკონქის გეგმით
    აუგიათ: სამი აფსიდი გუმბათქვეშა სივრცის გარშემო, სულ 9,7 × 10,5 მეტრი, საკურთხევლის ორივე მხარეს —
    სამკვეთლო და სადიაკვნე. კედლები რიყის ქვითაა ნაგები, კუთხეები, კარ-სარკმლის თავსართები და კონსტრუქციული
    ნაწილები კი კირქვისა და შირიმის თლილი კვადრებითაა გამოყვანილი. რვაწახნაგა გუმბათის ყელს ოთხი ვიწრო
    სარკმელი ჭრის და დეკორატიული თაღედი ამკობს.


    შიგნით ორი ეპოქის მხატვრობის ნაშთებია. IX საუკუნის ფენა მხოლოდ საკურთხეველშია: აფსიდის სარკმლის ორივე
    მხარეს, ნაცრისფერ ფონზე, მოციქულები დგანან, სარკმლის თავზე კი, მედალიონში, მაცხოვრის სახეა — მანდილიონი,
    ხელთუქმნელი ხატი, რომელსაც წარწერა ღმრთის წმიდა სახედ მოიხსენიებს. მკვლევრები მას ამ სიუჟეტის უადრეს
    ქართულ გამოსახულებათა შორის ასახელებენ. X საუკუნის მხატვრებმა დასავლეთისა და ჩრდილოეთის მკლავები მოხატეს
    ოქროსფერი ოხრით, მოწითალო-ყავისფრითა და მუქი ლურჯით; დასავლეთის მკლავის პილასტრზე დღესაც მთელი ტანით
    დგას წმინდა მეომარი.


    ხატის ამბავი გადმოცემაა: თქმულების მიხედვით, მძიმედ დასნეულებულმა ედესის მეფე აბგარმა ქრისტესთან განკურნების
    თხოვნით კაცი გაგზავნა და პასუხად ტილო მიიღო, რომელზეც მაცხოვრის სახე აღბეჭდილიყო.


    სამრეკლო დასავლეთის კედელს XVIII საუკუნეში მიაშენეს. 1952–1954 წლებში რესტავრატორებმა ეკლესიას სახურავი
    შეუცვალეს და გალავანი ძველ კვალზე აღუდგინეს, სამუშაოები 2007 წელსაც ჩატარდა. პატარა სახე პატარა ეკლესიაში
    — ის დღესაც იქ იყურება, სადაც მისი მლოცველებიდან აღარავინ დარჩა.
  tip: >-
    შესვლა უფასოა; აქ არც მცველია, არც სალარო, არც საპირფარეშო თუ კაფე. სოფლის პატარა ეკლესიები ხშირად
    დაკეტილია — თუ კარი ჩარაზულია, გუმბათის ყელის თაღედისა და ქვის წყობის სანახავად ნელა შემოვლაც ღირს,
    თუმცა ფრესკების ნახვის იმედი ყოველთვის არ გამართლდება. თუ შიგნით შეხვალთ, ფანარი გამოგადგებათ: მხატვრობა
    მკრთალია, მანდილიონი კი სარკმლის ზემოთ, მაღლაა. ჩაიცვით ისე, როგორც ქართულ ეკლესიაში შეეფერება: მხრები
    და მუხლები დაფარული, ქალებს — თავსაბურავი. ნახევარი საათი საკმარისია; გეგმაში სამთავისის ტაძარი ან
    შატო მუხრანიც ჩასვით. წყალი თან იქონიეთ — ეკლესიასთან მაღაზია არ არის.
  route: >-
    53 კმ, დაახლოებით 55 წუთი. თბილისიდან დასავლეთისკენ, ს1 მაგისტრალით გაემართეთ და მცხეთის გადასახვევებს
    გასცდით. ქალაქის ცენტრიდან დაახლოებით 39-ე კილომეტრზე, ციხისძირთან, ჩრდილოეთით, შ28 გზაზე გადაუხვიეთ,
    რომელიც ქსნის ხეობას ახალგორისკენ მიუყვება. 8–9 კილომეტრის შემდეგ ეკლესიამდე ბოლო 2 კილომეტრს ვიწრო
    გზა ადის: მოუასფალტებელია, მაგრამ მშრალ ამინდში ეკონომ-კლასის მანქანაც გაივლის; ძლიერი წვიმის შემდეგ
    ნელა იარეთ ან ბოლო მონაკვეთი ფეხით გაიარეთ. საწვავი ს1-ის ბენზინგასამართ სადგურებში შეავსეთ — ადგილზე
    არაფერია. ხეობაში ზემოთ ნუ გააგრძელებთ: ახალგორი 2008 წლიდან საოკუპაციო ხაზს მიღმაა.
en:
  name: Telovani Church of the Holy Cross
  short: >-
    An 8th–9th-century triconch on a slope above the Ksani valley, keeping one of Georgia's earliest painted
    images of the Mandylion, Christ's Holy Face.
  body: >-
    **Above a small apse window, in the church of a village that no longer exists, a face of Christ painted
    more than a thousand years ago still looks out: faded, scarred, and one of the oldest of its kind
    in Georgia.**


    Telovani itself is gone. The village that stood here, about 3 km east of today's Ksovrisi, survives
    as foundations, potsherds and a ruined wine cellar spread over several hectares. Its Church of the
    Holy Cross (Jvarpatiosani) remains, built in the 8th–9th century to a triconch plan, three apses around
    a domed centre, a compact 9.7 by 10.5 metres with side chambers flanking the sanctuary. The walls
    are river cobbles; corners, door lintels and structural members are dressed limestone and travertine.
    An octagonal drum, pierced by four narrow windows and ringed with blind arches, carries the dome.


    Inside, fragments of two campaigns of painting survive. The 9th-century layer is confined to the sanctuary:
    apostles on a grey ground either side of the apse window and, above it in a medallion, the face of
    Christ, the Mandylion or 'image not made by hands', which its inscription names the Holy Face of God.
    Scholars count it among the earliest Georgian renderings of the subject. In the west and north arms,
    10th-century painters worked in golden ochre, red-brown and deep blue; a warrior saint still stands
    full length on a pilaster.


    The image carries a legend: tradition says King Abgar of Edessa, gravely ill, sent to Christ for healing
    and received a cloth on which His face was imprinted.


    The belfry on the west wall is an 18th-century addition; restorers re-roofed the church and rebuilt
    its enclosure wall in 1952–54, and returned in 2007. A small face in a small church, still looking
    out over a place where none of those who prayed beneath it remain.
  tip: >-
    Entry is free, and there is no warden, ticket desk, toilet or café. Small rural churches like this
    are often locked: if the door is shut, the blind arcading of the drum and the cobble-and-travertine
    masonry still reward a slow circuit, but you will not always see the frescoes. If you do get in, bring
    a torch, as the murals are faint and the Mandylion sits high above the apse window. Dress as for any
    Georgian church: shoulders and knees covered, a headscarf for women. Half an hour is enough; pair
    it with Samtavisi Cathedral or Château Mukhrani, and carry water, because there is no shop at the
    church.
  route: >-
    53 km, about 55 minutes. Leave Tbilisi westwards on the S1 motorway and carry on past the Mtskheta
    exits. About 39 km from the city centre, at Tsikhisdziri, turn north onto the Sh28, which follows
    the Ksani valley towards Akhalgori. After 8–9 km a narrow lane climbs the last 2 km or so to the church.
    It is unpaved, but an economy car manages it in dry weather; after heavy rain take it slowly or walk
    the final stretch. Fill up at the stations along the S1, as there is nothing at the site. Do not drive
    on up the valley: Akhalgori has been beyond the occupation line since 2008.
ru:
  name: Церковь Святого Креста в Теловани
  short: >-
    Триконх VIII–IX веков на склоне над долиной Ксани хранит одно из самых ранних в Грузии изображений
    Мандилиона — Святого Лика Христа.
  body: >-
    **Над маленьким окном апсиды, в церкви села, которого больше нет, всё ещё смотрит лик Христа, написанный
    больше тысячи лет назад: выцветший, израненный — и одно из древнейших изображений такого рода в Грузии.**


    Самого Теловани уже нет. От села, стоявшего примерно в 3 км к востоку от нынешнего Ксовриси, остались
    фундаменты, черепки и руины винного погреба, разбросанные на нескольких гектарах. Уцелела лишь его
    церковь Святого Креста (Джварпатиосани), построенная в VIII–IX веках по плану триконха — три апсиды
    вокруг подкупольного центра, — компактная, 9,7 на 10,5 метра, с боковыми помещениями по сторонам алтаря.
    Стены сложены из речного булыжника; углы, дверные перемычки и конструктивные элементы — из тёсаного
    известняка и травертина. Купол несёт восьмигранный барабан, прорезанный четырьмя узкими окнами и опоясанный
    глухими арками.


    Внутри сохранились фрагменты росписи двух эпох. Слой IX века — только в алтаре: апостолы на сером
    фоне по обе стороны от окна апсиды, а над окном, в медальоне, — лик Христа, Мандилион, или «Нерукотворный
    образ», который надпись называет Святым Ликом Божьим. Исследователи относят его к самым ранним грузинским
    изображениям этого сюжета. В западном и северном рукавах работали мастера X века — золотистой охрой,
    красно-коричневым и глубоким синим; на пилястре до сих пор стоит в полный рост святой воин.


    С образом связана легенда: предание гласит, что тяжело больной царь Эдессы Авгарь послал к Христу
    просить исцеления и получил плат, на котором отпечатался Его лик.


    Звонница у западной стены пристроена в XVIII веке; в 1952–1954 годах реставраторы перекрыли церковь
    и восстановили ограду, а в 2007 году вернулись сюда снова. Маленький лик в маленькой церкви — он всё
    так же смотрит на место, где не осталось никого из тех, кто молился под ним.
  tip: >-
    Вход свободный; ни смотрителя, ни кассы, ни туалета, ни кафе здесь нет. Маленькие сельские церкви
    вроде этой часто заперты: если дверь закрыта, глухая аркатура барабана и кладка из булыжника и травертина
    всё равно стоят неспешного обхода, но фрески удаётся увидеть не всегда. Если попадёте внутрь, возьмите
    фонарик: росписи бледные, а Мандилион расположен высоко над окном апсиды. Одевайтесь как для любой
    грузинской церкви: закрывайте плечи и колени, женщинам нужен платок. Получаса достаточно; совместите
    поездку с Самтависским собором или Шато Мухрани и возьмите воду — магазина у церкви нет.
  route: >-
    53 км, около 55 минут. Выезжайте из Тбилиси на запад по трассе S1 и двигайтесь дальше, мимо съездов
    на Мцхету. Примерно в 39 км от центра города, у Цихисдзири, поверните на север на Sh28, которая идёт
    по долине Ксани в сторону Ахалгори. Через 8–9 км к церкви уходит узкая дорога — последние 2 км подъёма.
    Она без асфальта, но в сухую погоду машина эконом-класса справится; после сильного дождя езжайте медленно
    или пройдите последний отрезок пешком. Заправьтесь на станциях вдоль S1 — на месте ничего нет. Не
    поднимайтесь дальше по долине: Ахалгори с 2008 года находится за линией оккупации.
fa:
  name: کلیسای صلیب مقدس تلوانی
  short: >-
    کلیسایی سه‌آپسیدی از سده‌های هشتم و نهم بر شیبی مشرف به درهٔ کسانی، نگهبان یکی از کهن‌ترین تصویرهای
    ماندیلیون، چهرهٔ مقدس مسیح، در گرجستان.
  body: >-
    **بالای پنجرهٔ کوچک آپسید، در کلیسای روستایی که دیگر وجود ندارد، چهره‌ای از مسیح که بیش از هزار سال
    پیش نقش شده هنوز به بیرون می‌نگرد: رنگ‌باخته، زخمی، و یکی از کهن‌ترین نمونه‌های خود در گرجستان.**


    از خودِ تلوانی چیزی نمانده است. روستایی که حدود ۳ کیلومتری شرق کسووریسیِ امروز قرار داشت، اکنون فقط
    به شکل پی‌ها، سفال‌شکسته‌ها و ویرانهٔ یک سرداب شراب، پراکنده در چند هکتار، باقی است. اما کلیسای صلیب
    مقدس آن (جوارپاتیوسانی) پابرجاست: بنایی از سده‌های هشتم و نهم با نقشهٔ سه‌آپسیدی (تری‌کُنخ) — سه آپسید
    گرداگرد فضایی گنبددار در میانه — جمع‌وجور، به ابعاد ۹٫۷ در ۱۰٫۵ متر، با اتاقک‌هایی در دو سوی محراب.
    دیوارها از قلوه‌سنگ رودخانه‌اند؛ گوشه‌ها، سردرها و اجزای سازه‌ای از سنگ آهک و تراورتنِ تراش‌خورده.
    گنبد بر گریوی هشت‌ضلعی استوار است که چهار پنجرهٔ باریک آن را می‌شکافند و طاق‌نماهای کور گرداگردش را
    گرفته‌اند.


    در درون، پاره‌هایی از دو دورهٔ نقاشی بر جا مانده است. لایهٔ سدهٔ نهم تنها به محراب محدود است: حواریون
    بر زمینه‌ای خاکستری در دو سوی پنجرهٔ آپسید، و بالای آن، درون یک مدالیون، چهرهٔ مسیح — ماندیلیون یا
    «تصویری که به دست ساخته نشده» — که کتیبه‌اش آن را «چهرهٔ مقدس خدا» می‌نامد. پژوهشگران آن را از نخستین
    تصویرهای گرجی این موضوع می‌شمارند. در بازوهای غربی و شمالی، نقاشان سدهٔ دهم با اُخرای طلایی، قرمزِ
    مایل به قهوه‌ای و آبی سیر کار کرده‌اند؛ قدیسی جنگاور هنوز تمام‌قد بر یک ستون‌نما ایستاده است.


    این تصویر افسانه‌ای با خود دارد: روایت است که آبگار، شاه اِدِسا، که سخت بیمار بود، کسی را نزد مسیح
    فرستاد تا شفا بخواهد و پارچه‌ای دریافت کرد که چهرهٔ او بر آن نقش بسته بود.


    ناقوس‌خانهٔ دیوار غربی افزوده‌ای از سدهٔ هجدهم است؛ مرمت‌گران در سال‌های ۱۹۵۲ تا ۱۹۵۴ بام کلیسا را
    از نو پوشاندند و دیوار حصار آن را بازسازی کردند، و در ۲۰۰۷ دوباره بازگشتند. چهره‌ای کوچک در کلیسایی
    کوچک، که هنوز به جایی می‌نگرد که از نیایشگرانِ زیر آن هیچ‌کس نمانده است.
  tip: >-
    ورود رایگان است و نه نگهبانی هست، نه باجهٔ بلیت، نه سرویس بهداشتی و نه کافه‌ای. کلیساهای کوچک روستایی
    مانند این اغلب قفل‌اند: اگر در بسته بود، طاق‌نماهای کور گریو و سنگ‌کاریِ قلوه‌سنگ و تراورتن باز هم
    ارزش یک دور آرام زدن را دارند، اما همیشه نمی‌توان نقاشی‌های دیواری را دید. اگر به درون راه یافتید،
    چراغ‌قوه ببرید؛ نقاشی‌ها کم‌رنگ‌اند و ماندیلیون بالای پنجرهٔ آپسید قرار دارد. مانند هر کلیسای گرجی
    لباس بپوشید: شانه‌ها و زانوها پوشیده و روسری برای بانوان. نیم ساعت کافی است؛ آن را با کلیسای جامع
    سامتاویسی یا شاتو موخرانی همراه کنید و آب بردارید، چون کنار کلیسا مغازه‌ای نیست.
  route: >-
    ۵۳ کیلومتر، حدود ۵۵ دقیقه. از تفلیس از بزرگراه S1 به سمت غرب بروید و از خروجی‌های متسختا بگذرید. حدود
    ۳۹ کیلومتر از مرکز شهر، در تسیخیسدزیری، به سمت شمال وارد Sh28 شوید که درهٔ کسانی را به‌سوی آخالگوری
    دنبال می‌کند. پس از ۸ تا ۹ کیلومتر، راهی باریک حدود ۲ کیلومتر پایانی را تا کلیسا بالا می‌رود. این
    راه آسفالت نیست، اما در هوای خشک یک خودروی سواری معمولی از پسش برمی‌آید؛ پس از باران شدید آهسته برانید
    یا بخش پایانی را پیاده بروید. در جایگاه‌های سوخت کنار S1 باک را پر کنید، چون در محل هیچ چیز نیست.
    در دره بالاتر نروید: آخالگوری از سال ۲۰۰۸ آن سوی خط اشغال قرار دارد.
he:
  name: כנסיית הצלב הקדוש בטלובאני
  short: >-
    כנסייה טריקונכית מהמאות ה-8–9 על מדרון מעל עמק הקסאני, ובה אחד מתיאורי המנדיליון — פני ישו הקדושים
    — הקדומים בגאורגיה.
  body: >-
    **מעל חלון אפסיס קטן, בכנסייה של כפר שכבר איננו, עדיין משקיפות פני ישו שצוירו לפני יותר מאלף שנה:
    דהויות, פגועות, ואחד התיאורים הקדומים מסוגם בגאורגיה.**


    טלובאני עצמה נעלמה. מהכפר שעמד כאן, כ-3 ק״מ מזרחית לקסובריסי של היום, נותרו רק יסודות, שברי חרס ומרתף
    יין הרוס, פזורים על פני כמה הקטרים. כנסיית הצלב הקדוש שלו (ג'ווארפטיוסני) נותרה על כנה: היא נבנתה
    במאות ה-8–9 בתוכנית טריקונכית — שלושה אפסיסים סביב חלל מרכזי מקורה בכיפה — קומפקטית, 9.7 על 10.5 מטר,
    ובה חדרי צד משני צדי אזור המזבח. הקירות בנויים מאבני נחל; הפינות, משקופי הדלתות והרכיבים הקונסטרוקטיביים
    עשויים אבן גיר וטרוורטין מסותתים. את הכיפה נושא תוף מתומן, שארבעה חלונות צרים פרוצים בו וקשתות עיוורות
    מקיפות אותו.


    בפנים שרדו שברי ציורים משני שלבים. השכבה מהמאה ה-9 מוגבלת לאזור המזבח: שליחים על רקע אפור משני צדי
    חלון האפסיס, ומעליו, במדליון, פני ישו — המנדיליון, או "הדיוקן שלא נעשה בידי אדם", שהכתובת שלצידו מכנה
    אותו "פני האל הקדושים". חוקרים מונים אותו בין התיאורים הגאורגיים הקדומים ביותר של הנושא. בזרועות המערבית
    והצפונית עבדו ציירי המאה ה-10 באוכרה זהובה, באדום-חום ובכחול עמוק; קדוש לוחם עדיין עומד במלוא קומתו
    על פילסטר.


    לדיוקן נלווית אגדה: המסורת מספרת שאבגר מלך אדסה, שחלה קשות, שלח אל ישו לבקש מרפא וקיבל בד שעליו הוטבעו
    פניו.


    מגדל הפעמונים שעל הקיר המערבי הוא תוספת מהמאה ה-18; ב-1952–1954 החליפו משקמים את גג הכנסייה ובנו מחדש
    את חומת החצר שלה, ושבו לעבוד בה ב-2007. פנים קטנות בכנסייה קטנה, שעדיין משקיפות על מקום שלא נותר בו
    איש מאלה שהתפללו תחתיהן.
  tip: >-
    הכניסה חופשית, ואין כאן שומר, קופה, שירותים או בית קפה. כנסיות כפריות קטנות כמו זו נעולות לעיתים קרובות:
    אם הדלת סגורה, הקשתות העיוורות של התוף והבנייה מאבני נחל וטרוורטין עדיין שווים הקפה איטית, אבל לא
    תמיד תזכו לראות את ציורי הקיר. אם תצליחו להיכנס, הביאו פנס: הציורים דהויים, והמנדיליון נמצא גבוה מעל
    חלון האפסיס. התלבשו כמו לכל כנסייה גאורגית: כתפיים וברכיים מכוסות, וכיסוי ראש לנשים. חצי שעה מספיקה;
    שלבו עם קתדרלת סמטאביסי או שאטו מוחראני, והביאו מים, כי אין חנות ליד הכנסייה.
  route: >-
    53 ק״מ, כ-55 דקות. צאו מטביליסי מערבה בכביש המהיר S1 והמשיכו מעבר ליציאות למצחתה. כ-39 ק״מ ממרכז העיר,
    בציחיסדזירי, פנו צפונה לכביש Sh28, שעולה לאורך עמק הקסאני לכיוון אחלגורי. אחרי 8–9 ק״מ מטפסת דרך צרה
    את כ-2 הק״מ האחרונים אל הכנסייה. היא אינה סלולה, אבל רכב פרטי רגיל יעבור בה במזג אוויר יבש; אחרי גשם
    חזק סעו לאט או לכו ברגל את הקטע האחרון. תדלקו בתחנות שלאורך S1, כי באתר אין דבר. אל תמשיכו במעלה העמק:
    אחלגורי נמצאת מעבר לקו הכיבוש מאז 2008.
ar:
  name: كنيسة الصليب المقدس في تيلوفاني
  short: >-
    كنيسة ثلاثية الحنايا من القرنين الثامن والتاسع على منحدر فوق وادي كساني، تحفظ واحدة من أقدم صور «المنديل»،
    وجه المسيح المقدس، في جورجيا.
  body: >-
    **فوق نافذة حنية صغيرة، في كنيسة قرية لم تعد موجودة، لا يزال وجهٌ للمسيح رُسم قبل أكثر من ألف عام
    يطلّ على الناظرين: باهتًا، مجروحًا، وواحدًا من أقدم الصور من نوعها في جورجيا.**


    لقد زالت تيلوفاني نفسها. فمن القرية التي كانت قائمة على بعد نحو 3 كم شرق كسوفريسي الحالية لم يبقَ
    سوى أساسات وكِسَر فخار وأطلال قبو نبيذ، متناثرة على عدة هكتارات. أما كنيسة الصليب المقدس (جفاربَتيوساني)
    فباقية، وقد شُيّدت في القرنين الثامن والتاسع على مخطط ثلاثي الحنايا — ثلاث حنايا حول مركز تعلوه قبة
    — صغيرة الحجم، 9.7 في 10.5 أمتار، ولها حجرتان جانبيتان على جانبي الهيكل. الجدران من حصى الأنهار، أما
    الزوايا وعتبات الأبواب العليا والعناصر الإنشائية فمن الحجر الجيري والترافرتين المنحوتين. وتحمل القبةَ
    رقبةٌ ثُمانية الأضلاع تخترقها أربع نوافذ ضيقة وتطوّقها أقواس صمّاء.


    وفي الداخل بقيت أجزاء من مرحلتين من التصوير الجداري. تقتصر طبقة القرن التاسع على الهيكل: رسل على خلفية
    رمادية عن جانبي نافذة الحنية، وفوقها، داخل إطار دائري (رصيعة)، وجه المسيح — «المنديل» أو «الصورة غير
    المصنوعة بيد» — الذي يسمّيه النقش المرافق «وجه الله المقدس». ويعدّه الباحثون من أقدم التصاوير الجورجية
    لهذا الموضوع. وفي الذراعين الغربية والشمالية عمل رسّامو القرن العاشر بالمغرة الذهبية والأحمر البنّي
    والأزرق العميق؛ ولا يزال قدّيس محارب واقفًا بكامل قامته على دعامة جدارية.


    وترافق الصورةَ أسطورة: يروي التراث أن أبجر ملك الرها، وقد اشتد به المرض، أرسل إلى المسيح يطلب الشفاء،
    فتلقّى قطعة قماش انطبع عليها وجهه.


    أما برج الأجراس عند الجدار الغربي فإضافة من القرن الثامن عشر؛ وقد أعاد المرمّمون تسقيف الكنيسة وبناء
    سورها في 1952–1954، ثم عادوا إليها عام 2007. وجهٌ صغير في كنيسة صغيرة، لا يزال يطلّ على مكان لم يبقَ
    فيه أحد ممن صلّوا تحته.
  tip: >-
    الدخول مجاني، ولا يوجد حارس ولا شباك تذاكر ولا دورة مياه ولا مقهى. كثيرًا ما تكون الكنائس الريفية
    الصغيرة مثل هذه مغلقة: فإن وجدت الباب موصدًا، فالأقواس الصمّاء حول الرقبة والبناء من الحصى والترافرتين
    يستحقان جولة متأنية حولها، لكنك لن ترى الجداريات دائمًا. وإن تمكنت من الدخول فاحمل مصباحًا يدويًا،
    فالرسوم باهتة و«المنديل» يقع عاليًا فوق نافذة الحنية. التزم باللباس المعتاد لأي كنيسة جورجية: غطِّ
    الكتفين والركبتين، وعلى النساء غطاء للرأس. نصف ساعة تكفي؛ اجمع الزيارة مع كاتدرائية سامتافيسي أو شاتو
    موخراني، واحمل الماء، إذ لا يوجد متجر عند الكنيسة.
  route: >-
    53 كم، نحو 55 دقيقة. اخرج من تبليسي غربًا على الطريق السريع S1 وتابع متجاوزًا مخارج متسخيتا. وعلى
    بعد نحو 39 كم من وسط المدينة، عند تسيخيسدزيري، انعطف شمالًا إلى الطريق Sh28 الذي يتبع وادي كساني نحو
    أخالغوري. وبعد 8–9 كم يصعد درب ضيق آخر 2 كم تقريبًا حتى الكنيسة. الدرب غير معبّد، لكن سيارة عادية
    تجتازه في الطقس الجاف؛ أما بعد مطر غزير فسِر ببطء أو امشِ المقطع الأخير. املأ الخزان في محطات الطريق
    S1، إذ لا شيء في الموقع. لا تتابع صعودًا في الوادي: فأخالغوري تقع خلف خط الاحتلال منذ 2008.
