  # ---------------------------------------------------------------------
  # Blog post fallback — /blog/{slug}/
  # placeholders: title, excerpt
  # Real posts already carry their own title/desc in content/posts/*.yml
  # (render_post appends "| {BRAND}" to the post's own title already, see
  # build.py:1222). This template is a fallback only for a post missing
  # its own desc, and documents the same "{title} | RentUp" pattern for
  # every language so the suffix stays consistent if that logic changes.
  # ---------------------------------------------------------------------
  post:
    en:
      title: "{title} | RentUp"
