      description: "بگویید کجا هستید، به چه علاقه دارید و چند ساعت وقت دارید. بهترین گزینه را از میان {count} مکان در دسترس انتخاب می‌کنیم و می‌گوییم چه چیز دیگری در همان روز جا می‌شود."
