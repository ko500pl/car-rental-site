      title: "დღეს რა ვქნა? — დღის მარშრუტი შენი ადგილიდან | RentUp"
      description: "თქვი საიდან იწყებ, რა გაინტერესებს და რამდენი საათი გაქვს — {count} ადგილიდან შეგირჩევთ საუკეთესოს და ვეტყვით, რას მოასწრებ დამატებით."
    en:
      title: "What Can I Do Today? — Day Trip Finder | RentUp"
      description: "Say where you are, what interests you and how many hours you have. We pick the best of {count} places within reach and show what else fits in the same day."
    ru:
