# SEO metadata for RentUp.ge — Release A5 (SEO_IMPLEMENTATION_PLAN.md)
#
# This file is data only. It is NOT yet wired into build.py / head_html().
# A future change to build.py should read this file and:
#   1. For flat templates (home, fleet, planner, routes_hub, region, blog,
#      post, terms, faq, about, contact, community, software, car_rental_hub,
#      car_rental_category, itineraries_hub, itinerary, car) — substitute the
#      placeholders listed below directly into templates.<name>.<lang>.title
#      and .description.
#   2. For `attraction` — look up templates.attraction.by_type[<attraction.type>][<lang>];
#      if the attraction's type is not a key in by_type, fall back to
#      templates.attraction.default[<lang>].
#   3. For `route` — look up templates.route.by_purpose[<route.purpose>][<lang>];
#      if the route's purpose is not a key in by_purpose, fall back to
#      templates.route.default[<lang>].
#   4. For `car_rental_location` — use .city[<lang>] for a place with
#      kind: city and .airport[<lang>] for a place with kind: airport
#      (content/settings/places.yml).
#
# All titles end with the literal Latin brand suffix "| RentUp" in every
# language, matching the existing convention in content/pages/*.yml (which
# keeps "RentUp" in Latin at the end of ka/ru/fa/he/ar titles today).
# `software` is the one exception: the product name "RentUp Manager" already
# carries the brand, so no separate "| RentUp" suffix is appended (avoids
# repeating the brand per the no-repeated-brand rule).

brand: RentUp

# Every placeholder used anywhere below, with what it means and where the
# build code should source the value from.
placeholders:
  name: "Entity display name — car.<lang>.name, route.<lang>.name, attraction.<lang>.name, region.<lang>.name, or the curated itinerary's title"
  type: "Attraction type label, translated (tl(lang,'type',attraction.type)) — used only by the attraction fallback entry; the by_type variants bake the type into the wording instead"
  region: "Region display name housing the attraction/itinerary (region.<lang>.name)"
  days: "Number of days — route.days or the itinerary's day count (3/5/7/10/14)"
  km: "Distance in kilometers — route.distance_km, attraction.distance_tbilisi_km, or the itinerary's total km"
  drive: "Total drive time as stored in the source data (route.drive_time_total or attraction.drive_time_tbilisi, e.g. '5:00')"
  car: "Recommended car category label, translated (car_cat_label(route.car_category, lang))"
  price: "Starting daily price in GEL — car.price_1_6, or the cheapest car.price_1_6 in a category (no currency symbol, the templates add ₾)"
  category: "Vehicle category display label (cat_label(category.key, lang)), e.g. 'SUV', 'Economy class'"
  seats: "Seat count for a car — car.seats"
  count: "Item count — attractions in a region, routes in /tours/, cars in a category, or itineraries in the itineraries hub"
  city: "City or location display name (places.yml <place>.<lang>) — for an airport entry this is the city name, not 'X Airport'"
  iata: "Airport IATA code, e.g. TBS, KUT, BUS — not present in places.yml today; supply per place when wiring this up (tbilisi-airport -> TBS, kutaisi-airport -> KUT, batumi-airport -> BUS)"
  title: "Source title of a blog post (post.<lang>.title) — post template only"
  excerpt: "Fallback description text for a blog post that has no post.<lang>.desc of its own — post template only; real posts already carry their own desc and should keep using it instead of this fallback"
  stops: "Number of stops/attractions on an itinerary"

templates:

