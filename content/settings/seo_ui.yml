attractions_hub_lead:
  ka: 'ყველა ადგილი, რომელსაც ვიცნობთ — რეგიონების მიხედვით, მანძილით თბილისიდან, გზის მდგომარეობითა და საჭირო ავტომობილით.'
  en: 'Every place we track, by region — with the distance from Tbilisi, the drive time, the road surface and the car it needs.'
  ru: 'Все места, которые мы отслеживаем, по регионам: расстояние от Тбилиси, время в пути, состояние дороги и нужный автомобиль.'
  fa: 'همهٔ مکان‌هایی که ثبت کرده‌ایم، بر پایهٔ منطقه: فاصله از تفلیس، زمان رانندگی، وضعیت جاده و خودروی لازم.'
  he: 'כל המקומות שאנחנו מתעדים, לפי אזור: המרחק מטביליסי, זמן הנסיעה, מצב הדרך והרכב הנדרש.'
  ar: 'كل الأماكن التي نوثّقها، حسب المنطقة: المسافة من تبليسي، وزمن القيادة، وحالة الطريق، والسيارة اللازمة.'

routes_hub_lead:
  ka: 'მზა მარშრუტები დღეების, კილომეტრებისა და გზაში გასატარებელი დროის მიხედვით — თითოეულთან რეკომენდებული ავტომობილი.'
  en: 'Ready-made road trips by days, distance and time behind the wheel — each with the vehicle class it actually needs.'
  ru: 'Готовые маршруты по числу дней, километражу и времени за рулём — с классом автомобиля для каждого.'
  fa: 'مسیرهای آماده بر پایهٔ تعداد روز، مسافت و زمان رانندگی؛ هرکدام با کلاس خودروی موردنیاز.'
  he: 'מסלולים מוכנים לפי ימים, מרחק וזמן נהיגה, וכל אחד עם סוג הרכב שהוא באמת דורש.'
  ar: 'مسارات جاهزة حسب الأيام والمسافة وزمن القيادة، ولكل منها فئة السيارة التي يحتاجها فعلاً.'

regions_hub_lead:
  ka: 'საქართველოს რეგიონები — რამდენი სანახავი ადგილია თითოეულში და რა გამოარჩევს მათ.'
  en: 'Georgia region by region — how many places each one holds and what sets it apart.'
  ru: 'Грузия по регионам: сколько мест в каждом и чем он отличается.'
  fa: 'گرجستان منطقه به منطقه: هر منطقه چند مکان دارد و چه چیزی آن را متمایز می‌کند.'
  he: 'גאורגיה אזור אחר אזור: כמה מקומות יש בכל אחד ומה מייחד אותו.'
  ar: 'جورجيا منطقة بمنطقة: كم مكاناً في كل منها وما الذي يميزها.'

day_trip_h1:
  ka: 'დღეს რა ვქნა?'
  en: 'What can I do today?'
  ru: 'Чем заняться сегодня?'
  fa: 'امروز چه کار کنم؟'
  he: 'מה אפשר לעשות היום?'
  ar: 'ماذا أفعل اليوم؟'

day_trip_lead:
  ka: 'თქვი საიდან იწყებ, რამდენნი ხართ, რა გაინტერესებს და რამდენი საათი გაქვს — გაჩვენებთ საუკეთესო ადგილს და რას მოასწრებ დამატებით.'
  en: 'Say where you are starting from, how many of you there are, what interests you and how many hours you have — we show the best place to go and what else fits.'
  ru: 'Укажите, откуда начинаете, сколько вас, что вам интересно и сколько часов есть — покажем лучшее место и что ещё успеете.'
  fa: 'بگویید از کجا شروع می‌کنید، چند نفرید، به چه چیزی علاقه دارید و چند ساعت وقت دارید — بهترین مقصد و آنچه دیگر جا می‌شود را نشان می‌دهیم.'
  he: 'אמרו מאיפה אתם יוצאים, כמה אתם, מה מעניין אתכם וכמה שעות יש לכם — נראה לכם את המקום הכי טוב ומה עוד נכנס ביום.'
  ar: 'أخبرنا من أين تبدأ، وكم عددكم، وما الذي يهمّك، وكم ساعة لديك — نعرض أفضل وجهة وما الذي يمكن إضافته.'

