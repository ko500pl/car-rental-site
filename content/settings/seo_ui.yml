# UI strings for the SEO internal-linking blocks and the new SEO templates
# (car-rental cluster, itineraries, trip-planner landing) — see
# docs/seo/SEO_INTERNAL_LINKING.md and docs/seo/SEO_IMPLEMENTATION_PLAN.md.
#
# Style matches content/settings/ui.yml and content/settings/travel.yml:
# short, plain, no marketing exclamation. Headings are noun phrases; buttons
# are short imperatives.
#
# season/road value sets below cover exactly the values found in
# content/routes/*.yml, content/attractions/*.yml and content/itineraries/*.yml
# as of 2026-08-29 (see validation script output).

