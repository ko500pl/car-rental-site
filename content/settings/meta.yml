en:
  country: Georgia
  payments: Cash, Visa, Mastercard, bank transfer
  org_desc: >-
    Fleet House is a car rental company operating across Georgia. 17 vehicles, daily, weekly
    and monthly rentals, delivery to Tbilisi, Kutaisi and Batumi airports, full insurance coverage and
    unlimited mileage within Georgia.
  software_subcat: Fleet management system
  software_desc: >-
    Fleet House Manager is a management app for the car rental business: fleet, bookings, customers, expenses,
    loans, insurance and per-vehicle profitability (ROI, ROA, payback period) in a single system.
  software_offer: The basic version is free; advanced features are priced on request
  software_features:
  - Fleet register with maintenance windows
  - Bookings with automatic booking-conflict detection
  - 'Full rental lifecycle: start, extension, early termination'
  - Daily P&L with revenue recognised across the rental period
  - Per-vehicle ROI, ROA, payback period and utilisation rate
  - Expense categories, loans and insurance policies
  - Customer database, ratings and rental history
  - Photo documentation at handover and return
  - Excel export and automatic backups
  - Georgian and English interface, offline mode
  offers:
  - name: Economy class
    price: '75'
  - name: Crossover / SUV
    price: '130'
  - name: Business class
    price: '210'
  - name: Off-road 4x4
    price: '240'
  - name: Minivan, 7–8 seats
    price: '200'
  - name: Commercial van
    price: '185'
  llms_facts:
  - - Business
    - Car rental company operating across Georgia (country)
  - - Founded
    - '2019'
  - - Fleet size
    - 17 vehicles in 6 categories, average age 4 years
  - - Daily rate from
    - 75 GEL (~28 USD) for economy class
  - - Locations
    - Tbilisi head office plus Tbilisi (TBS), Kutaisi (KUT) and Batumi (BUS) airports — 6 pickup points
      in total
  - - Minimum driver age
    - 21 for economy, 23 for SUV/minivan, 25 for business class and 4x4; 2+ years of driving experience
  - - Mileage
    - Unlimited within Georgia; 300 km/day limit on cross-border trips
  - - Fuel policy
    - Full to full
  - - Insurance
    - CDW and TPL included; SCDW zero-excess option for 25–45 GEL/day
  - - Deposit
    - 300–1,200 GEL depending on category, blocked on card and released within 3 business days
  - - Cross-border
    - Armenia (150 GEL) and Turkey (250 GEL) allowed with permit; Azerbaijan and Russia prohibited
  - - Booking
    - Booking requests are submitted online and require payment before confirmation
  - - Own software
    - Fleet House Manager, an in-house fleet management app also offered to other rental companies
