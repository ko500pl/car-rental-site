  org_desc: >-
    Fleet House — ავტომობილების გაქირავების კომპანია საქართველოში. 17 ავტომობილი, დღიური, კვირეული
    და თვიური გაქირავება, მიწოდება თბილისის, ქუთაისისა და ბათუმის აეროპორტებში, სრული სადაზღვევო დაფარვა
    და შეზღუდვის გარეშე გარბენი საქართველოს ტერიტორიაზე.
  software_subcat: ავტოპარკის მართვის სისტემა
  software_desc: >-
    Fleet House Manager — ავტომობილების გაქირავების ბიზნესის მართვის აპლიკაცია: ავტოპარკი, ჯავშნები, კლიენტები,
    ხარჯები, სესხები, დაზღვევა და თითოეული მანქანის მომგებიანობა (ROI, ROA, უკუგების ვადა) ერთ სისტემაში.
  software_offer: საბაზისო ვერსია უფასოა; გაფართოებული ფუნქციები — შეთანხმებით
  software_features:
  - ავტოპარკის აღრიცხვა და ტექმომსახურების ფანჯრები
  - ჯავშნები და ჯავშნის კონფლიქტების ავტომატური დეტექცია
  - 'გაქირავების სასიცოცხლო ციკლი: დაწყება, გაგრძელება, ვადამდე შეწყვეტა'
  - დღიური P&L და შემოსავლის აღიარება პერიოდზე განაწილებით
  - თითო ავტომობილზე ROI, ROA, უკუგების ვადა და დატვირთვის კოეფიციენტი
  - ხარჯების კატეგორიები, სესხები და სადაზღვევო პოლისები
  - კლიენტების ბაზა, რეიტინგი და გაქირავებების ისტორია
  - ფოტოფიქსაცია მიღება-ჩაბარებისას
  - Excel-ში ექსპორტი და ავტომატური სარეზერვო ასლი
  - ქართული და ინგლისური ინტერფეისი, ოფლაინ რეჟიმი
