  - ROI, ROA, срок окупаемости и коэффициент загрузки по каждой машине
  - категории расходов, кредиты и страховые полисы
  - база клиентов, рейтинг и история аренд
  - фотофиксация при выдаче и возврате
  - экспорт в Excel и автоматическое резервное копирование
