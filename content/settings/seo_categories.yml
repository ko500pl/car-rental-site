      a: برای جاده‌های خاکی مناسب SUV — راچا، بورجومی-خاراگائولی، جاده‌های فرعی
        آجاریا — بله. برای مسیرهایی که فقط با 4x4 قابل عبورند، مانند جاده توشتی یا عمق سوانتی، خیر؛ نیاز
        به رده اختصاصی 4x4 دارید.
    - q: تفاوت SUV و رده 4x4 چیست؟
      a: خودروهای SUV (توسان، اوتلندر، RAV4) ارتفاع ۱۸۱ تا ۱۹۵ میلی‌متر دارند و از پس آسفالت و خاکی نگهداری‌شده
        برمی‌آیند. رده 4x4 (پاجرو، دلیکا، لندکروزر پرادو) ارتفاع ۲۱۰ تا ۲۳۵ میلی‌متر و دنده سرعت پایین/سیستم
        چهارچرخ‌محرک بخشی برای سخت‌ترین مسیرهای فقط-4x4 دارد.
    - q: چند نفر و چقدر بار در SUV جا می‌شود؟
      a: ۵ تا ۷ نفر بسته به مدل (RAV4 و توسان ۵ نفره، اوتلندر ۷ نفره) و ۳ تا ۴ چمدان.
    - q: ودیعه رده SUV چقدر است؟
      a: ۶۰۰ لاری، که هنگام تحویل روی کارت یا به‌صورت نقد بلوکه می‌شود و ظرف ۳ روز کاری پس از بازگشت آزاد
        می‌شود.
