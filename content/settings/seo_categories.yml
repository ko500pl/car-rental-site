    lead: 'مینی‌ون رده گروهی و خانوادگی RentUp است: سه ون اتوماتیک با ظرفیت ۷ تا ۹ نفر، که به‌خاطر فضای
      سرنشین و بار روی جاده‌های معمولی آسفالته انتخاب شده‌اند، نه برای یک مسیر کوهستانی خاص.'
    when_to_choose: 'مینی‌ون را زمانی انتخاب کنید که عامل تعیین‌کننده تعداد افراد و مقدار بار همراه باشد،
      نه نوع جاده: خانواده‌ای هفت‌نفره، گروهی کوچک که می‌خواهند به جای دو خودرو از یک خودرو استفاده کنند،
      یا انتقال از فرودگاه با چند مسافر و چمدان‌های پر. هیوندای استاریا، مرسدس-بنز ویتو و تویوتا آلفارد
      در این رده ۷ تا ۹ نفر جا می‌دهند و ۴ تا ۵ چمدان حمل می‌کنند — بالاترین ظرفیت در ناوگان همراه با
      رده آفرود. قیمت‌ها از ۲۰۰ لاری در روز شروع می‌شود، و سیستم چهارچرخ‌محرک استاریا کمی اطمینان بیشتری
      روی سطوح مرطوب یا کمی ناهموار نسبت به ویتو یا آلفارد می‌دهد، هرچند هیچ‌کدام از این سه در داده‌های
      ما برای مسیرهای خاکی یا کوهستانی رده‌بندی نشده‌اند. ارتفاع از سطح زمین در این رده (۱۶۰ تا ۱۸۶ میلی‌متر)
      بین اکونومی و SUV قرار دارد، مناسب برای خیابان‌های شهری، ورودی هتل‌ها و بزرگراه‌های آسفالته. اگر
      سفر شما بین شهرها روی جاده‌های آسفالته با یک گروه کامل است، این رده دقیقاً برای همین ساخته شده،
      نه برای برنامه‌ریزی مسیر.'
    limitations: هیچ‌یک از سه مینی‌ون این رده در داده‌های ما به مسیر یا جاذبه خاکی یا فقط-4x4 اختصاص نیافته
      است — RentUp در حال حاضر مسیرهای اختصاصی برای رده مینی‌ون فهرست نکرده، بنابراین برای رانندگی کوهستانی
      دیدنی، صفحات رده SUV یا 4x4 را ببینید. این رده همچنین روزانه گران‌تر از اکونومی یا SUV است و مصرف
      سوخت آن (۸ تا ۱۰.۵ لیتر در ۱۰۰ کیلومتر) بالاتر است، بنابراین برای یک یا دو نفر گزینه اقتصادی نیست.
    terms_note: ودیعه رده مینی‌ون مبلغ ۱۰۰۰ لاری است، هنگام تحویل روی کارت بلوکه می‌شود (نقد نیز پذیرفته
      می‌شود) و ظرف ۳ روز کاری پس از بازگشت خودرو آزاد می‌شود. بیمه مسئولیت شخص ثالث و CDW هر دو در نرخ
      گنجانده شده‌اند؛ فرانشیز ۱۰۰۰ لاری است و SCDW اختیاری با ۲۵ تا ۴۵ لاری در روز در دسترس است که فرانشیز
      را به صفر می‌رساند. حداقل سن راننده ۲۳ سال با حداقل ۳ سال سابقه گواهینامه است.
    faq:
