      mm clearance, built for paved highways and the gravel roads that lead to them — not the 4x4-only
      tracks beyond.'
    when_to_choose: Choose an SUV when your route leaves asphalt for well-maintained gravel but never
      needs low-range 4x4 gearing — the Military Highway to Kazbegi, the Racha mountain loop, Borjomi-Kharagauli's
      park roads or the Adjara green-road villages are typical examples. All three cars — Hyundai Tucson,
      Mitsubishi Outlander and Toyota RAV4 — are automatic, seat 5–7 and start at 130 ₾/day. Clearance
      of 181–195 mm and, on the Outlander, real 4WD, handle rutted gravel, light snow and rough hotel
      driveways that would scrape an economy car. Luggage capacity of 3–4 suitcases suits a family or
      small group better than the economy class. If your plan mixes highway driving with the moderate-difficulty
      gravel routes RentUp lists (Racha, Samtskhe, Adjara backroads), this is the class built for it.
    limitations: SUV clearance and AWD/4WD handle gravel, not the 4x4-only tracks into Tusheti, Svaneti's
      remoter villages or Khevsureti — those routes are rated for the Off-road 4x4 class specifically,
      and RentUp's own route data assigns them to that class, not SUV. This class also costs more per
      day than economy and is not the cheapest option for pure city or paved-highway use.
    terms_note: Deposit for SUV class is 600 ₾, held on card at pickup (cash accepted) and released within
      3 working days of return. Third-party liability insurance and CDW are both included; the excess is
      600 ₾, and optional SCDW is available for 25–45 ₾/day, bringing it to zero. Minimum driver age is
      23 with at least 3 years' licence held.
    faq:
    - q: Is an SUV enough for Georgia's mountain roads?
      a: 'For gravel roads suited to an SUV — Racha, Borjomi-Kharagauli, the Adjara backroads
        — yes. For 4x4-only tracks such as the roads into Tusheti or deep Svaneti, no: those need the
        dedicated 4x4 class.'
    - q: What's the difference between SUV and the 4x4 class?
      a: SUV cars (Tucson, Outlander, RAV4) have 181–195 mm clearance and handle paved roads plus maintained
        gravel. The 4x4 class (Pajero, Delica, Land Cruiser Prado) has 210–235 mm clearance and low-range/part-time
        4WD for the roughest, 4x4-only tracks.
    - q: How many people and bags fit in an SUV?
      a: 5 to 7 seats depending on the model (RAV4 and Tucson seat 5, the Outlander seats 7) and 3–4 suitcases.
    - q: What's the deposit for the SUV class?
      a: 600 ₾, held on card or cash at pickup and released within 3 working days after return.
