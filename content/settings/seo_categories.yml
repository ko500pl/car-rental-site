      תיירים מתאימה קטגוריית המיניוואן. אף אחד משני הואנים אינו מסומן בנתונים שלנו למסלול עפר או הררי — שניהם בנויים למשלוחים
      ולעבודת שליחויות בכבישים רגילים, לא לנהיגה ציורית. יש לקשור את המטען: נזק לתא המטען אינו מכוסה בביטוח הסטנדרטי, ושימוש
      באחד הואנים לעבודת שליחויות או הובלה עבור צד שלישי מחייב הסכמה בכתב מראש. גובהו של הספרינטר גם סוגר בפניו חלק מהחניונים
      התת-קרקעיים וקשתות הכניסה לחצרות במרכז טביליסי — בדקו את המסלול לפני ההעמסה.'
    terms_note: הפיקדון לקטגוריית הואן המסחרי הוא 800 ₾, מוקפא בכרטיס האשראי באיסוף (מזומן מתקבל גם כן) ומשוחרר תוך 3 ימי
      עסקים לאחר ההחזרה. ביטוח צד ג' ו-CDW כלולים שניהם בתעריף; ההשתתפות העצמית היא 800 ₾, ו-SCDW זמין כתוספת ב-25-45 ₾
      ליום ומאפס אותה. גיל הנהג המינימלי הוא 25 עם ותק רישיון של 3 שנים לפחות.
    faq:
    - q: למה מיועדת קטגוריית הואן המסחרי?
      a: למטען, לא לנוסעים — מילוי חנות, מעברי דירה, צוותי התקנה ומשלוחים לערים אחרות. לשני הואנים בקטגוריה זו שלושה מקומות
        בתא הנהג ו-11 עד 14 מ"ק נפח העמסה מאחוריהם.
    - q: אפשר לשכור ואן בקטגוריה הזו כדי להעביר משפחה או קבוצת אנשים?
      a: לא — לשני הואנים שלושה מקומות בתא הנהג. לקבוצת אנשים, ולא למטען, הקטגוריה המתאימה היא מיניוואן (7-9 מקומות).
    - q: כמה מטען נכנס לקטגוריית הואן המסחרי?
      a: 11 מ"ק וכושר העמסה של 1,200 ק"ג בפורד טרנזיט; 14 מ"ק ו-1,500 ק"ג במרצדס-בנץ ספרינטר.
    - q: מה גובה הפיקדון לקטגוריית הואן המסחרי?
