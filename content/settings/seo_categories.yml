  en:
    h1: Economy Car Rental in Georgia
    meta_title: Economy Car Rental in Georgia | From 75 ₾/day – RentUp.ge
    meta_description: Rent an economy car in Georgia from 75 ₾/day. Automatic Hyundai, Toyota Corolla
      and Prius — low fuel use, easy city and highway driving, unlimited mileage.
    lead: 'Economy class is RentUp''s lightest and cheapest tier: three automatic sedans built for city
      driving, airport transfers and paved highway trips, not mountain tracks.'
    when_to_choose: 'Choose economy when your trip stays on asphalt: Tbilisi city driving, the Kakheti
      wine roads, the Mtskheta–Gori heritage loop or a straight highway run to Batumi or Kutaisi. All
      three cars in this class — Hyundai Elantra, Toyota Corolla and Toyota Prius — are automatic, seat
      five and cost from 75 ₾/day, the lowest daily rate in the fleet. Fuel use is also the lowest in
      the fleet (4.5–6.5 l/100km on the Prius and Corolla), which matters on longer paved routes like
      Kakheti or the Black Sea coast. Ground clearance is 135–145 mm, enough for normal parking, cobbled
      Old Tbilisi streets and unpaved courtyards, but not for mountain passes. If your itinerary is city
      sightseeing, wine-region day trips or a coastal run, this class does the job at the lowest price.'
    limitations: Economy cars are not built for gravel mountain roads, high passes or the 4x4-only tracks
      into Svaneti, Tusheti or Khevsureti — the low 135–145 mm clearance and lack of 4-wheel drive rule
      that out. Luggage space is also the smallest in the fleet at 2 suitcases per car, tight for a group
      of five with full bags. If your route includes any of RentUp's SUV- or 4x4-tagged roads, choose
      a higher class instead.
    terms_note: Deposit for economy class is 300 ₾, held on card at pickup (cash accepted) and released
      within 3 working days of return. Third-party liability insurance and CDW are both included; the
      excess is 300 ₾, and optional SCDW is available for 25–45 ₾/day, bringing it to zero. Minimum
      driver age is 21 with at least 2 years' licence held.
    faq:
    - q: What is included in the daily rate for an economy car?
      a: Unlimited mileage, third-party liability insurance and free pickup at the RentUp office. Airport
        and city delivery carry a fee — see the rental terms page.
    - q: Can an economy car handle Georgia's mountain roads?
      a: On paved mountain roads like the Kazbegi highway or Borjomi's main road, yes. On gravel or 4x4-only
        routes (e.g. Tusheti, Svaneti backroads) the low clearance and front-wheel drive of this class
        are not suitable — choose the SUV or 4x4 class instead.
    - q: How much luggage fits in an economy car?
      a: About 2 mid-size suitcases, based on the actual trunk capacity of the Elantra, Corolla and Prius
        in our fleet.
    - q: What's the deposit for economy class?
      a: 300 ₾, held on card or cash at pickup and released within 3 working days after the car is returned.
  ru:
    h1: Аренда экономичного автомобиля в Грузии
    meta_title: Аренда авто эконом-класса в Грузии | от 75 ₾/день — RentUp.ge
    meta_description: Арендуйте автомобиль эконом-класса в Грузии от 75 ₾ в день. Автомат Hyundai, Toyota
      Corolla и Prius — низкий расход топлива, лёгкое вождение в городе и на трассе, безлимитный пробег.
    lead: 'Эконом-класс — самая доступная и лёгкая категория RentUp: три автомобиля с АКПП для города,
      трансфера из аэропорта и поездок по асфальтированным трассам, а не по горным грунтовкам.'
    when_to_choose: 'Выбирайте эконом-класс, если маршрут проходит по асфальту: поездки по Тбилиси, винные
      дороги Кахетии, историческая петля Мцхета–Гори или прямая трасса до Батуми или Кутаиси. Все три
      автомобиля этого класса — Hyundai Elantra, Toyota Corolla и Toyota Prius — автоматы, вмещают 5 человек
      и стоят от 75 ₾ в день, это самый низкий тариф в парке. Расход топлива тоже самый низкий в парке
      (4.5–6.5 л/100км у Prius и Corolla), что важно на длинных асфальтированных маршрутах вроде Кахетии
      или черноморского побережья. Клиренс 135–145 мм достаточен для обычной парковки, брусчатки старого
      Тбилиси и немощёных дворов, но не для горных перевалов. Если ваш план — осмотр города, однодневные
      поездки по винным регионам или поездка на побережье, этот класс справится по самой низкой цене.'
    limitations: 'Автомобили эконом-класса не предназначены для грунтовых горных дорог, высоких перевалов
      или дорог, отмеченных как «только 4x4», — в Сванети, Тушети или Хевсурети: низкий клиренс (135–145
      мм) и отсутствие полного привода это исключают. Багажное отделение тоже самое маленькое в парке
      — 2 чемодана на машину, что мало для группы из пяти человек с полным багажом. Если в вашем маршруте
      есть дороги, отмеченные RentUp для категории SUV или 4x4, выбирайте более высокий класс.'
    terms_note: Залог для эконом-класса — 300 ₾, блокируется на карте при получении (наличные тоже принимаются)
      и возвращается в течение 3 рабочих дней после сдачи авто. Страхование ответственности перед третьими
      лицами и CDW уже включены в тариф; франшиза — 300 ₾, а SCDW доступен дополнительно за 25–45
      ₾/день и снижает франшизу до нуля. Минимальный возраст водителя — 21 год, стаж вождения — не менее 2 лет.
    faq:
    - q: Что включено в суточный тариф эконом-класса?
      a: Безлимитный пробег, страхование ответственности перед третьими лицами и бесплатное получение
        в офисе. Доставка в аэропорт или по городу оплачивается отдельно — см. страницу условий.
    - q: Справится ли автомобиль эконом-класса с горными дорогами Грузии?
      a: На асфальтированных горных дорогах, таких как трасса на Казбеги или главная дорога Боржоми, —
        да. На грунтовых или маркированных «только 4x4» маршрутах (например, Тушети, боковые дороги Сванети)
        низкий клиренс и передний привод этого класса не подходят — выбирайте SUV или 4x4.
    - q: Сколько багажа помещается в машину эконом-класса?
      a: Около 2 чемоданов среднего размера — по реальному объёму багажника Elantra, Corolla и Prius в
        нашем парке.
    - q: Какой залог для эконом-класса?
      a: 300 ₾, блокируется на карте или наличными при получении и возвращается в течение 3 рабочих дней
        после сдачи.
  fa:
    h1: اجاره خودروی اکونومی در گرجستان
    meta_title: اجاره خودروی اکونومی در گرجستان | از ۷۵ لاری در روز — RentUp.ge
    meta_description: خودروی اکونومی در گرجستان را از ۷۵ لاری در روز اجاره کنید. هیوندای، تویوتا کرولا
      و پریوس با گیربکس اتوماتیک — مصرف سوخت پایین، رانندگی راحت در شهر و بزرگراه، بدون محدودیت کیلومتر.
    lead: 'کلاس اکونومی ارزان‌ترین و سبک‌ترین رده در RentUp است: سه سدان اتوماتیک مناسب رانندگی درون‌شهری،
      ترانسفر فرودگاهی و سفر در بزرگراه‌های آسفالته، نه جاده‌های خاکی کوهستانی.'
    when_to_choose: 'کلاس اکونومی را زمانی انتخاب کنید که مسیر شما روی آسفالت باقی می‌ماند: رانندگی در
      تفلیس، جاده‌های شراب کاختی، مسیر تاریخی متسخته-گوری یا حرکت مستقیم در بزرگراه به سمت باتومی یا کوتایسی.
      هر سه خودروی این رده — هیوندای النترا، تویوتا کرولا و تویوتا پریوس — اتوماتیک هستند، پنج‌نفره‌اند
      و قیمت آن‌ها از ۷۵ لاری در روز شروع می‌شود که پایین‌ترین نرخ روزانه در کل ناوگان است. مصرف سوخت
      نیز در این رده پایین‌ترین است (۴.۵ تا ۶.۵ لیتر در ۱۰۰ کیلومتر برای پریوس و کرولا)، که در مسیرهای
      آسفالته طولانی مانند کاختی یا ساحل دریای سیاه اهمیت دارد. ارتفاع از سطح زمین ۱۳۵ تا ۱۴۵ میلی‌متر
      است، کافی برای پارکینگ معمولی، خیابان‌های سنگ‌فرش تفلیس قدیم و حیاط‌های خاکی، اما نه برای گردنه‌های
      کوهستانی. اگر برنامه شما گردش در شهر، سفر روزانه به مناطق شراب‌سازی یا حرکت به سمت ساحل است، این
      رده با پایین‌ترین قیمت کار را انجام می‌دهد.'
    limitations: خودروهای اکونومی برای جاده‌های خاکی کوهستانی، گردنه‌های مرتفع یا مسیرهایی که فقط با 4x4
      قابل عبورند — در سوانتی، توشتی یا خِوسورتی — مناسب نیستند؛ ارتفاع پایین (۱۳۵ تا ۱۴۵ میلی‌متر) و
      نبود سیستم چهارچرخ‌محرک این را غیرممکن می‌کند. فضای بار نیز کوچک‌ترین در ناوگان است — ۲ چمدان برای
      هر خودرو، که برای گروه پنج‌نفره با بار کامل کم است. اگر مسیر شما شامل جاده‌هایی است که RentUp آن‌ها
      را برای رده SUV یا 4x4 مشخص کرده، رده بالاتری انتخاب کنید.
    terms_note: ودیعه برای کلاس اکونومی ۳۰۰ لاری است، که هنگام تحویل روی کارت بلوکه می‌شود (نقد نیز پذیرفته
      می‌شود) و ظرف ۳ روز کاری پس از بازگشت خودرو آزاد می‌شود. بیمه مسئولیت شخص ثالث و CDW هر دو در نرخ
      گنجانده شده‌اند؛ فرانشیز ۳۰۰ لاری است و SCDW اختیاری با ۲۵ تا ۴۵ لاری در روز در دسترس است که فرانشیز
      را به صفر می‌رساند. حداقل سن راننده ۲۱ سال با حداقل ۲ سال سابقه گواهینامه است.
    faq:
    - q: نرخ روزانه کلاس اکونومی شامل چه مواردی است؟
