      შავი ზღვის სანაპირო. კლირენსი 135–145 მმ-ია — საკმარისი ჩვეულებრივი პარკინგისთვის, ძველი თბილისის
      დაფენილი ქუჩებისა და ეზოს შესასვლელებისთვის, მაგრამ არა მთის უღელტეხილებისთვის. თუ თქვენი გეგმა
