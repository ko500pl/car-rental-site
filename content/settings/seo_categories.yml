  en:
    h1: 4x4 / Off-Road Rental in Georgia
    meta_title: 4x4 Rental in Georgia | From 240 ₾/day – RentUp.ge
    meta_description: Rent a real 4x4 in Georgia from 240 ₾/day. Mitsubishi Pajero, Delica D:5, Toyota
      Land Cruiser Prado — for Tusheti, Svaneti and Khevsureti's 4x4-only roads.
    lead: 4x4 is RentUp's highest-clearance class (210–235 mm), built specifically for the handful of
      Georgian roads that our own route and attraction data marks as gravel or 4x4-only — not a comfort
      upgrade for paved driving.
    when_to_choose: 'Choose the 4x4 class when your itinerary actually includes a road our data marks
      4x4-only or gravel: the route to Omalo and on to Dartlo and Shenako-Diklo in Tusheti, Shatili and
      Mutso in Khevsureti, or Ushguli and the higher Svaneti villages beyond Mestia. RentUp''s own route
      list assigns the Tusheti Highland Hike and all three Svaneti routes to this class specifically,
      not to SUV. All three cars — Mitsubishi Pajero, Mitsubishi Delica D:5 and Toyota Land Cruiser Prado
      — have real 4WD, 210–235 mm clearance and start at 240 ₾/day. Seven or eight seats also make this
      class practical for a group heading to the same remote village. If even one leg of your trip is
      a 4x4-only road, this is the class that data says you need — not a suggestion, a route requirement.'
    limitations: '4x4 is the most expensive class in the fleet and higher fuel use (9–12.5 l/100km) than
      economy or SUV, so it is not worth booking for a trip that stays on paved roads or well-maintained
      gravel — the SUV class covers that at a lower price. We do not claim these vehicles make any road
      safe in any weather: seasonal closures, snow and river crossings on routes like Tusheti''s Abano
      Pass depend on conditions on the day, not on the vehicle. Some 4x4-only roads (Abano Pass to Tusheti)
      are seasonally closed regardless of vehicle — check current conditions before booking.'
    terms_note: Deposit for the 4x4 class is 1200 ₾, the highest in the fleet, held on card at pickup
      (cash accepted) and released within 3 working days of return. Third-party liability insurance and
      CDW are both included; the excess is 1200 ₾, and optional SCDW is available for 25–45 ₾/day, bringing
      it to zero. Minimum driver age is 25 with at least 4 years' licence held.
    faq:
    - q: Do I actually need a 4x4 for Georgia, or is it marketing?
      a: 'For most of the country — Tbilisi, Kakheti, the coast, even the Kazbegi highway — no, economy
        or SUV is enough. A 4x4 is genuinely required only for roads our data tags 4x4-only: the approach
        to Tusheti (via Abano Pass), Khevsureti''s Shatili/Mutso road, and the track to Ushguli and beyond
        in upper Svaneti.'
    - q: Is the road to Tusheti open all year?
      a: No. Abano Pass, the only road into Tusheti, is seasonally closed and its opening depends on snow
        conditions each year — check current status before booking, whatever vehicle you rent.
    - q: What's the difference between the 4x4 class and SUV?
      a: 4x4 cars (Pajero, Delica D:5, Land Cruiser Prado) have 210–235 mm clearance versus 181–195 mm
        on the SUV class, and are rated for 4x4-only roads in our route data, not just gravel.
