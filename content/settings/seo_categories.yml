      лицами и CDW уже включены в тариф; франшиза — 600 ₾, а SCDW доступен дополнительно за 25–45 ₾/день
      и снижает франшизу до нуля. Минимальный возраст водителя — 23 года, стаж вождения — не менее 3 лет.
    faq:
    - q: Достаточно ли SUV для горных дорог Грузии?
      a: Для грунтовых дорог, подходящих для SUV, — Рача, Боржоми-Харагаули, боковые
        дороги Аджарии — да. Для маршрутов «только 4x4», таких как дорога в Тушети или вглубь Сванети,
        — нет, нужна отдельная категория 4x4.
    - q: В чём разница между SUV и категорией 4x4?
      a: У SUV (Tucson, Outlander, RAV4) клиренс 181–195 мм, они справляются с асфальтом и укатанным грунтом.
