      بخلوص أرضي 181–195 ملم، مخصصة للطرق السريعة المعبّدة والطرق الترابية المؤدية إليها — وليست للمسارات
      المخصصة للدفع الرباعي فقط.'
    when_to_choose: اختر SUV عندما يغادر مسارك الأسفلت إلى طريق ترابي جيد الصيانة، لكنه لا يحتاج أبدًا
      إلى ناقل حركة منخفض للدفع الرباعي — مثل الطريق العسكري إلى قازبيغي، حلقة جبال راتشا، طرق حديقة بورجومي-خاراغاولي،
      أو قرى الطريق الأخضر في أدجارا. السيارات الثلاث في هذه الفئة — هيونداي توسان وميتسوبيشي أوتلاندر
      وتويوتا RAV4 — أوتوماتيكية وتتسع لـ5 إلى 7 ركاب ويبدأ سعرها من 130 ₾ يوميًا. الخلوص الأرضي 181–195
      ملم، ودفع رباعي حقيقي في أوتلاندر، يتعاملان مع الطرق الترابية الوعرة والثلج الخفيف ومداخل الفنادق
      غير الممهدة التي قد تحك بها سيارة اقتصادية. سعة الأمتعة من 3 إلى 4 حقائب تناسب عائلة أو مجموعة صغيرة
      أفضل من الفئة الاقتصادية. إذا كانت خطتك تجمع بين القيادة على الطريق السريع ومسارات ترابية متوسطة
      الصعوبة من قائمتنا (راتشا، سامتسخه، طرق أدجارا الفرعية)، فهذه هي الفئة المصممة لذلك تحديدًا.
    limitations: يتعامل خلوص SUV ونظام الدفع الرباعي/على العجلات الأربع مع الطرق الترابية، لكن ليس مع
      المسارات المخصصة للدفع الرباعي فقط — طرق توشيتي أو قرى سفانيتي النائية أو خيفسوريتي؛ فهذه المسارات
      مخصصة في بيانات RentUp لفئة الأوف-رود/الدفع الرباعي، لا لفئة SUV. كما أن هذه الفئة أغلى يوميًا من
      الفئة الاقتصادية وليست الخيار الأكثر اقتصادًا للاستخدام داخل المدينة أو على الطريق السريع فقط.
    terms_note: التأمين المسترد لفئة SUV هو 600 ₾، يُحجز على البطاقة عند الاستلام (وتُقبل النقود أيضًا)
      ويُعاد خلال 3 أيام عمل بعد الإرجاع. تأمين المسؤولية تجاه الغير وCDW كلاهما مشمولان في السعر؛ التحمل
      هو 600 ₾، ويتوفر SCDW اختياريًا مقابل 25 إلى 45 ₾ يوميًا، وهو ما يخفّضه إلى صفر. الحد الأدنى لعمر
      السائق 23 عامًا مع رخصة قيادة لا تقل مدتها عن 3 سنوات.
    faq:
    - q: هل تكفي سيارة SUV لطرق الجبال في جورجيا؟
      a: بالنسبة للطرق الترابية المصنّفة في بياناتنا ضمن SUV — راتشا، بورجومي-خاراغاولي، طرق أدجارا الفرعية
        — نعم. أما المسارات المخصصة للدفع الرباعي فقط، مثل الطريق إلى توشيتي أو عمق سفانيتي، فلا؛ يلزم
        فئة 4x4 المخصصة.
    - q: ما الفرق بين SUV وفئة 4x4؟
      a: سيارات SUV (توسان، أوتلاندر، RAV4) لها خلوص أرضي 181–195 ملم وتتحمل الأسفلت والطرق الترابية المُعتنى
        بها. فئة 4x4 (باجيرو، ديليكا، لاند كروزر برادو) لها خلوص 210–235 ملم وناقل حركة منخفض/دفع رباعي
        جزئي لأصعب المسارات المخصصة للدفع الرباعي فقط.
    - q: كم عدد الركاب والأمتعة التي تتسع لها SUV؟
      a: من 5 إلى 7 مقاعد حسب الطراز (RAV4 وتوسان بخمسة مقاعد، أوتلاندر بسبعة) و3 إلى 4 حقائب.
    - q: ما مقدار التأمين المسترد لفئة SUV؟
      a: 600 ₾، يُحجز على البطاقة أو نقدًا عند الاستلام ويُعاد خلال 3 أيام عمل بعد الإرجاع.
