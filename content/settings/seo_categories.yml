      a: مسافة غير محدودة، تأمين المسؤولية تجاه الغير، والاستلام المجاني من المكتب. التوصيل إلى المطار
        أو داخل المدينة يخضع لرسوم — راجع صفحة شروط الإيجار.
    - q: هل تتحمل السيارة الاقتصادية طرق الجبال في جورجيا؟
      a: على الطرق الجبلية المعبّدة مثل طريق قازبيغي السريع أو الطريق الرئيسي في بورجومي، نعم. أما على
        الطرق الترابية أو المخصصة للدفع الرباعي فقط (مثل توشيتي أو الطرق الفرعية في سفانيتي)، فإن الخلوص
        المنخفض والدفع الأمامي لهذه الفئة غير مناسبين — اختر فئة SUV أو 4x4.
    - q: كم حقيبة تتسع لها السيارة الاقتصادية؟
      a: حوالي حقيبتين متوسطتي الحجم، استنادًا إلى السعة الفعلية لصندوق سيارات إلنترا وكورولا وبريوس في
        أسطولنا.
    - q: ما مقدار التأمين المسترد لفئة الاقتصادية؟
      a: 300 ₾، يُحجز على البطاقة أو نقدًا عند الاستلام ويُعاد خلال 3 أيام عمل بعد الإرجاع.
