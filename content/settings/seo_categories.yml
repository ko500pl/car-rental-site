        أو داخل المدينة يخضع لرسوم — راجع صفحة شروط الإيجار.
    - q: هل تتحمل السيارة الاقتصادية طرق الجبال في جورجيا؟
      a: على الطرق الجبلية المعبّدة مثل طريق قازبيغي السريع أو الطريق الرئيسي في بورجومي، نعم. أما على
        الطرق الترابية أو المخصصة للدفع الرباعي فقط (مثل توشيتي أو الطرق الفرعية في سفانيتي)، فإن الخلوص
