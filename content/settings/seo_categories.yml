      а не за SUV. Все три автомобиля этого класса — Mitsubishi Pajero, Mitsubishi Delica D:5 и Toyota
      Land Cruiser Prado — имеют настоящий полный привод, клиренс 210–235 мм и стоят от 240 ₾ в день.
      Семь-восемь мест также делают этот класс практичным для группы, направляющейся в одно и то же отдалённое
      село. Если хотя бы один отрезок вашей поездки — дорога «только 4x4», это тот класс, который требуют
      данные, а не просто рекомендация.'
    limitations: '4x4 — самая дорогая категория в парке, с более высоким расходом топлива (9–12.5 л/100км),
      чем у эконом или SUV, поэтому её не стоит бронировать для поездки, которая остаётся на асфальте
      или хорошо укатанном грунте — это дешевле покрывает категория SUV. Мы не утверждаем, что эти автомобили
      делают какую-либо дорогу безопасной в любую погоду: сезонные закрытия, снег и переправы через реки
      на маршрутах вроде перевала Абано в Тушети зависят от условий в конкретный день, а не от автомобиля.
      Некоторые дороги «только 4x4» (перевал Абано в Тушети) сезонно закрыты независимо от автомобиля
      — проверяйте актуальные условия перед бронированием.'
    terms_note: Залог для категории 4x4 — 1200 ₾, самый высокий в парке, блокируется на карте при получении
      (наличные тоже принимаются) и возвращается в течение 3 рабочих дней после сдачи авто. Страхование
      ответственности перед третьими лицами и CDW уже включены в тариф; франшиза — 1200 ₾, а SCDW доступен
      дополнительно за 25–45 ₾/день и снижает франшизу до нуля. Минимальный возраст водителя — 25 лет, стаж
      вождения — не менее 4 лет.
    faq:
    - q: Мне правда нужен 4x4 в Грузии, или это маркетинг?
      a: 'Для большей части страны — Тбилиси, Кахетия, побережье, даже трасса на Казбеги — нет, достаточно
        эконом или SUV. 4x4 действительно необходим только на дорогах, отмеченных в наших данных как «только
        4x4»: подъезд к Тушети (через перевал Абано), дорога Хевсурети на Шатили/Муцо и путь в Ушгули
        и дальше в верхнюю Сванети.'
    - q: Дорога в Тушети открыта круглый год?
      a: Нет. Перевал Абано, единственная дорога в Тушети, сезонно закрывается, и его открытие каждый
        год зависит от снежных условий — проверяйте текущий статус перед бронированием, независимо от
        того, какой автомобиль вы арендуете.
    - q: В чём разница между категорией 4x4 и SUV?
      a: У автомобилей 4x4 (Pajero, Delica D:5, Land Cruiser Prado) клиренс 210–235 мм против 181–195
        мм у SUV, и в наших данных о маршрутах они закреплены за дорогами «только 4x4», а не просто за
        грунтовыми.
    - q: Какой залог для категории 4x4?
      a: 1200 ₾, самый высокий уровень залога в парке, блокируется на карте или наличными при получении
        и возвращается в течение 3 рабочих дней после сдачи.
