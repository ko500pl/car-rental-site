      განკუთვნილია ქალაქში მოძრაობის, აეროპორტის ტრანსფერისა და ასფალტიანი მაგისტრალის მოგზაურობისთვის
      და არა მთის გრუნტიანი გზებისთვის.'
    when_to_choose: 'აირჩიეთ ეკონომ კლასი, თუ თქვენი მარშრუტი ასფალტზეა: თბილისში მოძრაობა, კახეთის ღვინის
      გზები, მცხეთა-გორის საისტორიო წრე ან პირდაპირი მაგისტრალი ბათუმისკენ ან ქუთაისისკენ. ამ კატეგორიის
