        این رده مناسب نیست — رده SUV یا 4x4 را انتخاب کنید.
    - q: چقدر بار در خودروی اکونومی جا می‌شود؟
      a: حدود ۲ چمدان متوسط، بر اساس ظرفیت واقعی صندوق عقب النترا، کرولا و پریوس در ناوگان ما.
    - q: ودیعه کلاس اکونومی چقدر است؟
