      — ოჯახს ან ტურისტულ ჯგუფს მინივენის კატეგორია სჭირდება. ჩვენს მონაცემებში არცერთი ფურგონი გრუნტიან ან მთის მარშრუტზე
      არ არის მინიშნებული — ორივე შექმნილია მიწოდებისა და საკურიერო სამუშაოსთვის ჩვეულებრივ გზებზე და არა თვალწარმტაცი მოგზაურობისთვის.
      ტვირთი დამაგრებული უნდა იყოს: სატვირთო განყოფილების დაზიანებას სტანდარტული დაზღვევა არ ფარავს, ხოლო რომელიმე ფურგონის
      გამოყენება მესამე პირისთვის საკურიერო თუ სატრანსპორტო საქმიანობისთვის წინასწარ წერილობით თანხმობას საჭიროებს. Sprinter-ის
      სიმაღლეც კეტავს ზოგიერთ მიწისქვეშა პარკინგსა და ძველი თბილისის ეზოს თაღს — დატვირთვამდე მარშრუტი წინასწარ შეამოწმეთ.'
    terms_note: კომერციული ფურგონის კატეგორიის დეპოზიტია 800 ₾, ჩამოიჭრება ბარათზე აღების დროს (ნაღდიც მიიღება) და უბრუნდება
      3 სამუშაო დღეში დაბრუნების შემდეგ. მესამე პირის წინაშე პასუხისმგებლობის დაზღვევა და CDW ორივე ჩართულია ტარიფში; ფრანშიზაა
      800 ₾, ხოლო SCDW დამატებით ხელმისაწვდომია 25–45 ₾/დღეში და მას ნულამდე დაჰყავს. მძღოლის მინიმალური ასაკია 25 წელი,
      მინიმუმ 3 წლის მართვის მოწმობით.
    faq:
    - q: რისთვისაა კომერციული ფურგონის კატეგორია?
      a: ტვირთისთვის და არა მგზავრებისთვის — მაღაზიის შევსება, ბინის გადატანა, სამონტაჟო ბრიგადა და მიწოდება სხვა ქალაქებში.
        ამ კატეგორიის ორივე ფურგონს კაბინაში სამი ადგილი აქვს და მის უკან 11-დან 14 მ³-მდე სატვირთო სივრცე.
    - q: შემიძლია თუ არა ამ კატეგორიის ფურგონით ოჯახის ან ჯგუფის გადაყვანა?
      a: არა — ორივე ფურგონს კაბინაში სამი ადგილი აქვს. ადამიანების ჯგუფისთვის, ტვირთის ნაცვლად, სწორი კატეგორია მინივენია
        (7-დან 9-მდე ადგილი).
    - q: რამდენი ტვირთი ეტევა კომერციული ფურგონის კატეგორიაში?
      a: Ford Transit-ში — 11 მ³ და 1200 კგ ტვირთამწეობა; Mercedes-Benz Sprinter-ში — 14 მ³ და 1500 კგ.
    - q: რა არის დეპოზიტი კომერციული ფურგონის კატეგორიისთვის?
      a: 800 ₾, ჩამოიჭრება ბარათზე ან ნაღდად აღების დროს და უბრუნდება დაბრუნებიდან 3 სამუშაო დღეში.
  en:
    h1: Commercial Van Rental in Georgia
    meta_title: Commercial Van Rental in Georgia | From 185 ₾/day – RentUp.ge
    meta_description: Rent a commercial van in Georgia from 185 ₾/day. Ford Transit, Mercedes-Benz Sprinter — 11–14 m³ of
      cargo space for moves, deliveries and installation work.
    lead: 'Commercial van is RentUp''''s cargo tier: two manual diesel vans built to move goods, not people — three seats
      in the cab and 11 to 14 m³ of load space behind them, for businesses and movers rather than sightseeing groups.'
    when_to_choose: 'Choose the commercial van category when the job is cargo, not passengers: restocking a shop, moving
      a flat across Tbilisi, an installation crew''s tools, or a delivery run to Batumi or the port at Poti. The Ford Transit
      carries 11 m³ and a 1,200 kg payload from 185 ₾/day; the Mercedes-Benz Sprinter steps up to 14 m³ and 1,500 kg from
      215 ₾/day, enough for a full apartment move or a pallet and a half of stock in one run. Both are manual with three
      seats in the cab — room for a driver and two crew, not a family or a tour group. Monthly and annual corporate contracts
      are available, and branding on the bodywork is permitted by arrangement, which is why long bookings are the norm in
      this category rather than the exception.'
    limitations: 'The commercial van category seats three, so it is not a passenger or group-travel option — a family or
      a tour group needs the minivan class instead. Neither van is rated for gravel or mountain routes in our data, and
      both are built for delivery and courier work on ordinary roads, not scenic driving. Cargo must be secured: damage
      to the load compartment is not covered by the standard insurance, and using either van for courier or haulage work
      on behalf of a third party needs written consent in advance. The Sprinter''s height also closes off some underground
      car parks and courtyard arches in central Tbilisi, so check the route before loading there.'
    terms_note: Deposit for the commercial van category is 800 ₾, held on card at pickup (cash accepted) and released within
      3 working days of return. Third-party liability insurance and CDW are both included; the excess is 800 ₾, and optional
      SCDW is available for 25–45 ₾/day, bringing it to zero. Minimum driver age is 25 with at least 3 years' licence held.
    faq:
    - q: What is the commercial van category for?
      a: Cargo, not passengers — shop restocking, flat moves, installation crews and deliveries to other cities. Both vans
        in this class carry three people in the cab and 11–14 m³ of load space behind them.
    - q: Can I rent a van in this category to move a family or a group of people?
      a: No — both vans seat three in the cab. For a group of people rather than cargo, the minivan class (7–9 seats) is
        the right category.
    - q: How much cargo fits in the commercial van category?
      a: 11 m³ and a 1,200 kg payload in the Ford Transit; 14 m³ and 1,500 kg in the Mercedes-Benz Sprinter.
    - q: What's the deposit for the commercial van category?
      a: 800 ₾, held on card or cash at pickup and released within 3 working days after return.
  ru:
    h1: Аренда коммерческого фургона в Грузии
    meta_title: Аренда коммерческого фургона в Грузии | от 185 ₾/день — RentUp.ge
    meta_description: Арендуйте коммерческий фургон в Грузии от 185 ₾ в день. Ford Transit, Mercedes-Benz Sprinter — 11–14
      м³ грузового пространства для переездов, доставки и монтажных работ.
    lead: 'Коммерческий фургон — грузовая категория RentUp: два механических дизельных фургона, созданных для перевозки
      груза, а не людей — три места в кабине и от 11 до 14 м³ грузового пространства за ними, для бизнеса и переездов, а
      не для туристических групп.'
    when_to_choose: 'Выбирайте категорию коммерческого фургона, когда задача — груз, а не пассажиры: пополнение магазина,
      переезд квартиры по Тбилиси, инструменты монтажной бригады или доставка в Батуми или в порт Поти. Ford Transit везёт
      11 м³ и 1200 кг груза от 185 ₾ в день; Mercedes-Benz Sprinter — до 14 м³ и 1500 кг от 215 ₾ в день, чего хватает на
      полный переезд квартиры или полтора паллета товара за один рейс. Оба с механической коробкой и тремя местами в кабине
      — для водителя и двух членов бригады, а не для семьи или туристической группы. Доступны помесячные и годовые корпоративные
      договоры, а брендирование кузова разрешено по согласованию, поэтому долгая аренда здесь норма, а не исключение.'
    limitations: 'В категории коммерческого фургона три места, поэтому это не вариант для пассажиров или групповых поездок
      — семье или туристической группе нужен минивэн. Ни один из фургонов не отмечен в наших данных для грунтовых или горных
      маршрутов — оба созданы для доставки и курьерской работы по обычным дорогам, а не для живописной поездки. Груз обязательно
      нужно закрепить: повреждения грузового отсека не покрываются стандартной страховкой, а использование любого фургона
      для курьерской работы или перевозок в интересах третьих лиц требует предварительного письменного согласия. Высота
      Sprinter также закрывает доступ в некоторые подземные паркинги и дворовые арки в центре Тбилиси — проверяйте маршрут
      заранее.'
    terms_note: Залог для категории коммерческого фургона — 800 ₾, блокируется на карте при получении (наличные тоже принимаются)
      и возвращается в течение 3 рабочих дней после сдачи авто. Страхование ответственности перед третьими лицами и CDW
      уже включены в тариф; франшиза — 800 ₾, а SCDW доступен дополнительно за 25–45 ₾/день и снижает франшизу до нуля.
      Минимальный возраст водителя — 25 лет, стаж вождения — не менее 3 лет.
    faq:
    - q: Для чего нужна категория коммерческого фургона?
      a: Для груза, а не пассажиров — пополнение магазина, переезды, монтажные бригады и доставка в другие города. Оба фургона
        этого класса везут трёх человек в кабине и от 11 до 14 м³ груза за ними.
    - q: Можно ли арендовать фургон этой категории, чтобы перевезти семью или группу людей?
      a: Нет — у обоих фургонов три места в кабине. Для группы людей, а не груза, подходит категория минивэн (7–9 мест).
    - q: Сколько груза помещается в категории коммерческого фургона?
      a: 11 м³ и 1200 кг у Ford Transit; 14 м³ и 1500 кг у Mercedes-Benz Sprinter.
    - q: Какой залог для категории коммерческого фургона?
      a: 800 ₾, блокируется на карте или наличными при получении и возвращается в течение 3 рабочих дней после сдачи.
