  ka:
    h1: 4x4 / მაღალი გამავლობის მანქანის გაქირავება საქართველოში
    meta_title: 4x4 გაქირავება საქართველოში | 240 ₾-დან/დღეში — RentUp.ge
    meta_description: იქირავეთ ნამდვილი 4x4 საქართველოში 240 ₾-დან დღეში. Mitsubishi Pajero, Delica D:5,
      Toyota Land Cruiser Prado — თუშეთის, სვანეთისა და ხევსურეთის მხოლოდ 4x4-სთვის განკუთვნილი გზებისთვის.
    lead: 4x4 RentUp-ის ყველაზე მაღალი კლირენსის კატეგორიაა (210–235 მმ), შექმნილი კონკრეტულად საქართველოს
      იმ გზებისთვის, რომლებსაც ჩვენივე მარშრუტებისა და ღირსშესანიშნაობების მონაცემები გრუნტად ან მხოლოდ
      4x4-სთვის განკუთვნილად აღნიშნავს — და არა ასფალტზე მოსახმარი კომფორტის დამატებისთვის.
    when_to_choose: 'აირჩიეთ 4x4 კატეგორია, თუ თქვენს მარშრუტში ნამდვილად შედის გზა, რომელსაც ჩვენი მონაცემები
      მხოლოდ 4x4-სთვის განკუთვნილად ან გრუნტად აღნიშნავს: გზა ომალომდე და შემდეგ დართლომდე და შენაქო-დიკლომდე
      თუშეთში, შატილი და მუცო ხევსურეთში, ან უშგული და მესტიის იქითა სვანეთის სოფლები. RentUp-ის საკუთარი
      მარშრუტების სია სპეციალურად ამ კატეგორიას ანიჭებს „თუშეთის მთიანეთის ლაშქრობას" და სვანეთის სამივე
      მარშრუტს, და არა SUV-ს. ამ კატეგორიის სამივე მანქანას — Mitsubishi Pajero, Mitsubishi Delica D:5
      და Toyota Land Cruiser Prado — აქვს რეალური 4WD, 210–235 მმ კლირენსი და ღირს 240 ₾-დან დღეში. შვიდი
      ან რვა ადგილი ასევე პრაქტიკულს ხდის ამ კატეგორიას ჯგუფისთვის, რომელიც ერთი და იმავე შორეული სოფლისკენ
      მიემართება. თუ თქვენი მოგზაურობის თუნდაც ერთი მონაკვეთი მხოლოდ 4x4-სთვის განკუთვნილ გზას მოიცავს,
