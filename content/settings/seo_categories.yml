    - q: რამდენი ბარგი ეტევა ეკონომ კლასის მანქანაში?
      a: დაახლოებით 2 საშუალო ზომის ჩემოდანი — პარკში არსებული Elantra-ს, Corolla-სა და Prius-ის რეალური
