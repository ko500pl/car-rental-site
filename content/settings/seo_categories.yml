      a: 'ქვეყნის უმეტესი ნაწილისთვის — თბილისი, კახეთი, სანაპირო, ყაზბეგის მაგისტრალიც კი — არა, ეკონომ
        ან SUV საკმარისია. 4x4 ნამდვილად საჭიროა მხოლოდ იმ გზებზე, რომლებსაც ჩვენი მონაცემები „მხოლოდ
