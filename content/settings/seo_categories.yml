      تفلیس، جاده‌های شراب کاختی، مسیر تاریخی متسخته-گوری یا حرکت مستقیم در بزرگراه به سمت باتومی یا کوتایسی.
      هر سه خودروی این رده — هیوندای النترا، تویوتا کرولا و تویوتا پریوس — اتوماتیک هستند، پنج‌نفره‌اند
      و قیمت آن‌ها از ۷۵ لاری در روز شروع می‌شود که پایین‌ترین نرخ روزانه در کل ناوگان است. مصرف سوخت
      نیز در این رده پایین‌ترین است (۴.۵ تا ۶.۵ لیتر در ۱۰۰ کیلومتر برای پریوس و کرولا)، که در مسیرهای
      آسفالته طولانی مانند کاختی یا ساحل دریای سیاه اهمیت دارد. ارتفاع از سطح زمین ۱۳۵ تا ۱۴۵ میلی‌متر
      است، کافی برای پارکینگ معمولی، خیابان‌های سنگ‌فرش تفلیس قدیم و حیاط‌های خاکی، اما نه برای گردنه‌های
      کوهستانی. اگر برنامه شما گردش در شهر، سفر روزانه به مناطق شراب‌سازی یا حرکت به سمت ساحل است، این
      رده با پایین‌ترین قیمت کار را انجام می‌دهد.'
    limitations: خودروهای اکونومی برای جاده‌های خاکی کوهستانی، گردنه‌های مرتفع یا مسیرهایی که فقط با 4x4
      قابل عبورند — در سوانتی، توشتی یا خِوسورتی — مناسب نیستند؛ ارتفاع پایین (۱۳۵ تا ۱۴۵ میلی‌متر) و
      نبود سیستم چهارچرخ‌محرک این را غیرممکن می‌کند. فضای بار نیز کوچک‌ترین در ناوگان است — ۲ چمدان برای
      هر خودرو، که برای گروه پنج‌نفره با بار کامل کم است. اگر مسیر شما شامل جاده‌هایی است که RentUp آن‌ها
      را برای رده SUV یا 4x4 مشخص کرده، رده بالاتری انتخاب کنید.
    terms_note: ودیعه برای کلاس اکونومی ۳۰۰ لاری است، که هنگام تحویل روی کارت بلوکه می‌شود (نقد نیز پذیرفته
      می‌شود) و ظرف ۳ روز کاری پس از بازگشت خودرو آزاد می‌شود. بیمه مسئولیت شخص ثالث و CDW هر دو در نرخ
      گنجانده شده‌اند؛ فرانشیز ۳۰۰ لاری است و SCDW اختیاری با ۲۵ تا ۴۵ لاری در روز در دسترس است که فرانشیز
      را به صفر می‌رساند. حداقل سن راننده ۲۱ سال با حداقل ۲ سال سابقه گواهینامه است.
