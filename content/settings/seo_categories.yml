      فقط، فهذه هي الفئة التي تقول البيانات إنك تحتاجها — ليست اقتراحًا، بل متطلب مسار.'
    limitations: 'فئة 4x4 هي الأغلى في الأسطول واستهلاك وقودها أعلى (9 إلى 12.5 لتر لكل 100 كم) من الفئة
      الاقتصادية أو SUV، لذا لا يستحق حجزها لرحلة تبقى على الأسفلت أو طريق ترابي جيد الصيانة — فئة SUV
      تغطي ذلك بسعر أقل. نحن لا ندّعي أن هذه المركبات تجعل أي طريق آمنًا في أي طقس: الإغلاقات الموسمية
      والثلوج وعبور الأنهار في مسارات مثل ممر أبانو في توشيتي تعتمد على ظروف اليوم، وليس على المركبة.
      بعض الطرق المخصصة للدفع الرباعي فقط (ممر أبانو نحو توشيتي) تُغلق موسميًا بغض النظر عن المركبة —
      تحقق من الحالة الراهنة قبل الحجز.'
    terms_note: التأمين المسترد لفئة 4x4 هو 1200 ₾، الأعلى في الأسطول، يُحجز على البطاقة عند الاستلام
      (وتُقبل النقود أيضًا) ويُعاد خلال 3 أيام عمل بعد الإرجاع. تأمين المسؤولية تجاه الغير وCDW كلاهما
      مشمولان في السعر؛ التحمل هو 1200 ₾، ويتوفر SCDW اختياريًا مقابل 25 إلى 45 ₾ يوميًا، وهو ما يخفّضه
      إلى صفر. الحد الأدنى لعمر السائق 25 عامًا مع رخصة قيادة لا تقل مدتها عن 4 سنوات.
    faq:
    - q: هل أحتاج فعلًا إلى دفع رباعي في جورجيا أم أن هذا مجرد تسويق؟
      a: 'بالنسبة لمعظم البلاد — تبليسي وكاختي والساحل وحتى طريق قازبيغي السريع — لا، تكفي الفئة الاقتصادية
        أو SUV. الدفع الرباعي مطلوب فعليًا فقط للطرق التي تصنّفها بياناتنا كمخصصة للدفع الرباعي فقط: طريق
        الوصول إلى توشيتي (عبر ممر أبانو)، طريق شاتيلي-موتسو في خيفسوريتي، والطريق إلى أوشغولي وما بعده
        في سفانيتي العليا.'
    - q: هل طريق توشيتي مفتوح طوال العام؟
      a: لا. ممر أبانو، الطريق الوحيد إلى توشيتي، يُغلق موسميًا ويعتمد فتحه كل عام على أحوال الثلوج —
        تحقق من الحالة الراهنة قبل الحجز، أيًا كانت المركبة التي تستأجرها.
    - q: ما الفرق بين فئة 4x4 وفئة SUV؟
      a: سيارات 4x4 (باجيرو، ديليكا D:5، لاند كروزر برادو) لها خلوص أرضي 210–235 ملم مقابل 181–195 ملم
        في فئة SUV، وهي مخصصة في بيانات مساراتنا للطرق المخصصة للدفع الرباعي فقط، وليس فقط الطرق الترابية.
    - q: ما مقدار التأمين المسترد لفئة 4x4؟
      a: 1200 ₾، أعلى مستوى تأمين مسترد في الأسطول، يُحجز على البطاقة أو نقدًا عند الاستلام ويُعاد خلال
        3 أيام عمل بعد الإرجاع.
