    limitations: ეკონომ კლასის მანქანები არ არის განკუთვნილი გრუნტიანი მთის გზებისთვის, მაღალი უღელტეხილებისთვის
      ან მხოლოდ 4x4-სთვის განკუთვნილი გზებისთვის სვანეთში, თუშეთსა თუ ხევსურეთში — დაბალი, 135–145 მმ
      კლირენსი და ოთხთვალა წამყვანის არქონა ამას გამორიცხავს. ბარგის ადგილიც პარკში ყველაზე მცირეა — 2
