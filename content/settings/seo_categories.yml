      маршрутами средней сложности из нашего списка (Рача, Самцхе, боковые дороги Аджарии), это именно
      тот класс, который под это создан.
    limitations: 'Клиренс и полный/постоянный привод SUV справляются с грунтом, но не с маршрутами, отмеченными
      «только 4x4» — дорогами в Тушети, отдалённые сёла Сванети или Хевсурети: эти маршруты в данных RentUp
      закреплены за категорией «Внедорожник 4x4», а не SUV. Этот класс также дороже эконом-класса за сутки и
      не самый экономичный вариант для чисто городской или трассовой поездки.'
    terms_note: Залог для категории SUV — 600 ₾, блокируется на карте при получении (наличные тоже принимаются)
