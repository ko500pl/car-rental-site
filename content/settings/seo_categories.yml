      انتخاب شده‌اند، نه برای ارتفاع بیشتر از سطح زمین — هر سه در همان محدوده کلاس اکونومی یا پایین‌تر از آن قرار دارند.'
    when_to_choose: 'کلاس بیزنس را زمانی انتخاب کنید که راحتی و ظاهر خودرو اهمیت دارد، نه نوع جاده: بازدید هیئت، عروسی،
      سفر شرکتی با جلسات در سراسر تفلیس یا انتقال از فرودگاه که راننده از قرارداد اجاره کاربردی‌تر است. هر سه خودروی این
      رده — تویوتا کمری، مرسدس-بنز E-Class و بی‌ام‌و سری ۵ — اتوماتیک هستند، ۵ نفره‌اند و ۳ چمدان جا می‌دهند. قیمت‌ها از
      ۲۱۰ لاری در روز برای کمری شروع می‌شود که نسخه هیبریدی ۲.۵ آن به‌طور میانگین حدود ۵.۵ لیتر در ۱۰۰ کیلومتر مصرف می‌کند
      — کمترین مصرف در کل ناوگان، حتی نسبت به کلاس اکونومی. E-Class کروز کنترل تطبیقی برای بزرگراه تفلیس-باتومی دارد و شاسی
      دیفرانسیل عقب بی‌ام‌و برای رانندگانی ساخته شده که پیچ‌های میان گودائوری و کازبگی را لذت‌بخش می‌دانند، نه فقط قابل
      تحمل. خدمات راننده روی هر سه خودرو در دسترس است، اگر ترجیح می‌دهید از صندلی عقب کار کنید. اگر سفر شما جلسه با مشتری،
      همایش یا میزبانی از مهمانان روی بزرگراه‌های آسفالته گرجستان است، این همان رده‌ای است که برای همین تأثیر ساخته شده.'
    limitations: خودروهای کلاس بیزنس برای جاده‌های خاکی یا کوهستانی مناسب نیستند — ارتفاع ۱۳۰ تا ۱۴۵ میلی‌متر آن‌ها در همان
      محدوده کلاس اکونومی یا پایین‌تر است، و اوشگولی، اومالو و دیگر جاده‌های فقط-4x4 گرجستان، صرف‌نظر از قیمت خودرو، مخصوص
      رده آفرود 4x4 باقی می‌مانند. دو مورد از سه خودرو — E-Class و بی‌ام‌و — دیفرانسیل عقب دارند که در سربالایی برف‌روبی‌نشده
      زمستانی به دقت بیشتری نیاز دارد تا دیفرانسیل جلو یا چهارچرخ‌محرک. با ۵ صندلی و ۳ چمدان، این رده نسبت به اکونومی مزیتی
      در ظرفیت گروه یا بار ندارد — برای خانواده شش‌نفره یا گروهی با بار سنگین، رده مینی‌ون مناسب‌تر است. علاوه بر این، نرخ
      روزانه این رده به‌طور محسوس از اکونومی بالاتر است، پس کلاس بیزنس را برای راحتی و وجهه انتخاب کنید، نه گذر از جاده
      یا قیمت.
    terms_note: ودیعه کلاس بیزنس مبلغ ۱۰۰۰ لاری است، هنگام تحویل روی کارت بلوکه می‌شود (نقد نیز پذیرفته می‌شود) و ظرف ۳
      روز کاری پس از بازگشت خودرو آزاد می‌شود. بیمه مسئولیت شخص ثالث و CDW هر دو در نرخ گنجانده شده‌اند؛ فرانشیز ۱۰۰۰ لاری
      است و SCDW اختیاری با ۲۵ تا ۴۵ لاری در روز در دسترس است که فرانشیز را به صفر می‌رساند. حداقل سن راننده ۲۵ سال با حداقل
      ۵ سال سابقه گواهینامه است.
