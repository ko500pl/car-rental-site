      მიერ SUV ან 4x4 კატეგორიისთვის მონიშნული გზა, აირჩიეთ უფრო მაღალი კლასი.
    terms_note: ეკონომ კლასის დეპოზიტია 300 ₾, ჩამოიჭრება ბარათზე აღების დროს (ნაღდიც მიიღება) და უბრუნდება
      3 სამუშაო დღეში დაბრუნების შემდეგ. მესამე პირის წინაშე პასუხისმგებლობის დაზღვევა და CDW ორივე
