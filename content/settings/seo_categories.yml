# SEO copy + computed data for the 6 car-rental category pages
# (/car-rental/economy/, /car-rental/suv/, /car-rental/4x4/, /car-rental/minivan/,
# /car-rental/business/, /car-rental/van/) — one entry per key in
# content/settings/categories.yml.
#
# All `data:` values are computed from content/cars/*.yml, content/routes/*.yml
# and content/attractions/*.yml — not invented. See docs/seo/SEO_KEYWORD_MAP.md
# for the keyword -> page mapping this file supports.
#
# minivan/business/van.data.route_slugs / attraction_slugs are intentionally
# empty: content/routes/*.yml and content/attractions/*.yml only ever tag
# car_category as economy, suv or offroad (road-surface classes) — never
# minivan, business or van. minivan and business are party-size/comfort
# classes, not road-type ones, so they can never win that join; van's own
# passenger count (3) also falls short of the "who needs a bigger vehicle"
# threshold. docs/seo/INTERNAL_LINKING_REVIEW.md §12 proposes one honest
# substitute join for minivan specifically (all-paved routes with
# max_people >= 7, which minivan's 7-9 seats satisfy) — that join was
# checked against business (5 seats) and van (3 seats, cargo-only) and does
# not hold for either, so both were left with empty route/attraction lists
# rather than borrowed or padded. Copy for all three categories avoids
# naming specific routes/attractions accordingly. Applying that join in
# code is a build.py change and out of scope for this file.
#
# CATEGORY_SLUG in build.py already maps business -> "business" and
# van -> "van", but the four hardcoded ("economy", "suv", "offroad",
# "minivan") tuples that drive rendering/sitemap/llms.txt (build.py lines
# ~2992, ~3082, ~3599, ~4760) do not yet include them — see
# docs/seo/CATEGORY_PAGES.md for exactly what to change.

seo_categories:
- key: economy
  public_slug: economy
  ka:
    h1: ეკონომ კლასის მანქანების გაქირავება საქართველოში
    meta_title: ეკონომ კლასის ავტომობილის გაქირავება საქართველოში | 75 ₾-დან/დღეში — RentUp.ge
    meta_description: იქირავეთ ეკონომ კლასის ავტომობილი საქართველოში 75 ₾-დან დღეში. ავტომატური Hyundai,
      Toyota Corolla და Prius — დაბალი საწვავის ხარჯი, მარტივი მართვა ქალაქსა და მაგისტრალზე, კილომეტრაჟის
      შეზღუდვის გარეშე.
