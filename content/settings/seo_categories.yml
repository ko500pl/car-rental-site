      در تفلیس، ابزار یک تیم نصب یا تحویل بار به باتومی یا بندر پوتی. فورد ترانزیت ۱۱ متر مکعب و ظرفیت ۱٬۲۰۰ کیلوگرم دارد
      و از ۱۸۵ لاری در روز شروع می‌شود؛ مرسدس-بنز اسپرینتر به ۱۴ متر مکعب و ۱٬۵۰۰ کیلوگرم می‌رسد و از ۲۱۵ لاری در روز شروع
      می‌شود، کافی برای یک اسباب‌کشی کامل آپارتمان یا یک‌ونیم پالت کالا در یک نوبت. هر دو گیربکس دستی دارند و در کابین سه
      صندلی — جا برای راننده و دو نفر از تیم، نه یک خانواده یا گروه گردشگری. قرارداد شرکتی ماهانه و سالانه در دسترس است
      و برندینگ روی بدنه با هماهنگی مجاز است — به همین دلیل رزروهای بلندمدت در این رده قاعده‌اند، نه استثنا.'
    limitations: 'رده ون تجاری سه صندلی دارد، پس گزینه‌ای برای مسافر یا سفر گروهی نیست — خانواده یا گروه گردشگری به رده
      مینی‌ون نیاز دارد. هیچ‌یک از دو ون در داده‌های ما برای مسیرهای خاکی یا کوهستانی رده‌بندی نشده — هر دو برای تحویل بار
      و کار پیک روی جاده‌های معمولی ساخته شده‌اند، نه رانندگی دیدنی. بار باید مهار شود: خسارت محفظه بار در بیمه استاندارد
      پوشش داده نمی‌شود، و استفاده از هر یک از این ون‌ها برای کار پیک یا باربری به نفع اشخاص ثالث به رضایت کتبی پیشین نیاز
      دارد. ارتفاع اسپرینتر نیز برخی پارکینگ‌های زیرزمینی و طاق‌های ورودی حیاط در مرکز تفلیس را به رویش می‌بندد — پیش از
      بارگیری مسیر را بررسی کنید.'
    terms_note: ودیعه رده ون تجاری مبلغ ۸۰۰ لاری است، هنگام تحویل روی کارت بلوکه می‌شود (نقد نیز پذیرفته می‌شود) و ظرف ۳
      روز کاری پس از بازگشت خودرو آزاد می‌شود. بیمه مسئولیت شخص ثالث و CDW هر دو در نرخ گنجانده شده‌اند؛ فرانشیز ۸۰۰ لاری
      است و SCDW اختیاری با ۲۵ تا ۴۵ لاری در روز در دسترس است که فرانشیز را به صفر می‌رساند. حداقل سن راننده ۲۵ سال با حداقل
      ۳ سال سابقه گواهینامه است.
    faq:
    - q: رده ون تجاری برای چیست؟
