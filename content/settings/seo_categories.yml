    when_to_choose: SUV را زمانی انتخاب کنید که مسیر شما از آسفالت به جاده خاکی خوب نگهداری‌شده می‌رود،
      اما هرگز به دنده سرعت پایین 4x4 نیاز ندارد — مانند بزرگراه نظامی به سمت قزبگی، حلقه کوهستانی راچا،
      جاده‌های پارک بورجومی-خاراگائولی یا روستاهای جاده سبز آجاریا. هر سه خودروی این رده — هیوندای توسان،
      میتسوبیشی اوتلندر و تویوتا RAV4 — اتوماتیک هستند، ۵ تا ۷ نفر جا می‌دهند و قیمت از ۱۳۰ لاری در روز
      شروع می‌شود. ارتفاع ۱۸۱ تا ۱۹۵ میلی‌متر و در اوتلندر، سیستم چهارچرخ‌محرک واقعی، از پس جاده‌های خاکی
      ناهموار، برف سبک و ورودی‌های ناهموار هتل برمی‌آیند، جایی که خودروی اکونومی کف خود را می‌خراشد. ظرفیت
      بار ۳ تا ۴ چمدان برای خانواده یا گروه کوچک مناسب‌تر از رده اکونومی است. اگر برنامه شما ترکیبی از
      رانندگی در بزرگراه و مسیرهای خاکی با دشواری متوسط است (راچا، سامتسخه، جاده‌های فرعی آجاریا)، این
      رده دقیقاً برای همین ساخته شده است.
    limitations: ارتفاع و سیستم چهارچرخ‌محرک SUV از پس جاده‌های خاکی برمی‌آید، اما نه مسیرهایی که فقط
      با 4x4 قابل عبورند — جاده‌های توشتی، روستاهای دورافتاده سوانتی یا خوسورتی؛ این مسیرها در داده‌های
      RentUp به رده آفرود/4x4 اختصاص یافته‌اند، نه SUV. این رده همچنین روزانه گران‌تر از اکونومی است و
      برای استفاده صرفاً شهری یا بزرگراهی، اقتصادی‌ترین گزینه نیست.
    terms_note: ودیعه رده SUV مبلغ ۶۰۰ لاری است، هنگام تحویل روی کارت بلوکه می‌شود (نقد نیز پذیرفته می‌شود)
      و ظرف ۳ روز کاری پس از بازگشت خودرو آزاد می‌شود. بیمه مسئولیت شخص ثالث و CDW هر دو در نرخ گنجانده
      شده‌اند؛ فرانشیز ۶۰۰ لاری است و SCDW اختیاری با ۲۵ تا ۴۵ لاری در روز در دسترس است که فرانشیز را به صفر
      می‌رساند. حداقل سن راننده ۲۳ سال با حداقل ۳ سال سابقه گواهینامه است.
