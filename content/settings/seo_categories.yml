      მოვლილ გრუნტზე რჩება — ამას SUV კატეგორია დაბალ ფასად ფარავს. ჩვენ არ ვამტკიცებთ, რომ ეს მანქანები
      რომელიმე გზას ნებისმიერ ამინდში უსაფრთხოს ხდიან: სეზონური ჩაკეტვები, თოვლი და მდინარის გადალახვები
      ისეთ მარშრუტებზე, როგორიცაა თუშეთის აბანოს უღელტეხილი, დამოკიდებულია დღის პირობებზე და არა მანქანაზე.
      ზოგიერთი მხოლოდ 4x4-სთვის განკუთვნილი გზა (აბანოს უღელტეხილი თუშეთისკენ) სეზონურად იკეტება მანქანის
      მიუხედავად — დაჯავშნამდე შეამოწმეთ მიმდინარე მდგომარეობა.'
