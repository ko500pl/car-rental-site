        نفر در کابین و ۱۱ تا ۱۴ متر مکعب فضای بار پشت آن حمل می‌کنند.
    - q: می‌توانم با ون این رده خانواده یا گروهی از افراد را جابه‌جا کنم؟
      a: خیر — هر دو ون سه صندلی در کابین دارند. برای گروهی از افراد، نه بار، رده مینی‌ون (۷ تا ۹ صندلی) گزینه درست است.
    - q: چقدر بار در رده ون تجاری جا می‌شود؟
      a: در فورد ترانزیت ۱۱ متر مکعب و ظرفیت ۱٬۲۰۰ کیلوگرم؛ در مرسدس-بنز اسپرینتر ۱۴ متر مکعب و ۱٬۵۰۰ کیلوگرم.
    - q: ودیعه رده ون تجاری چقدر است؟
      a: ۸۰۰ لاری، که هنگام تحویل روی کارت یا به‌صورت نقد بلوکه می‌شود و ظرف ۳ روز کاری پس از بازگشت آزاد می‌شود.
