  ar:
    h1: تأجير فان تجاري في جورجيا
    meta_title: تأجير فان تجاري في جورجيا | من 185 ₾ يوميًا — RentUp.ge
    meta_description: استأجر فان تجاريًا في جورجيا من 185 ₾ يوميًا. فورد ترانزيت، مرسيدس-بنز سبرينتر — 11-14 م³ من حيز التحميل
      لأعمال النقل والتوصيل والتركيب.
    lead: 'فئة الفان التجاري هي فئة الشحن لدى RentUp: مركبتان بمحرك ديزل وناقل حركة يدوي، مصممتان لنقل البضائع لا الأشخاص
      — ثلاثة مقاعد في المقصورة وما بين 11 و14 م³ من حيز التحميل خلفها، للشركات وأعمال النقل، لا لمجموعات السياحة.'
    when_to_choose: 'اختر فئة الفان التجاري عندما تكون المهمة شحن بضائع لا ركابًا: إعادة تعبئة متجر، نقل شقة داخل تبليسي،
      أدوات فريق تركيب، أو توصيل إلى باتومي أو ميناء بوتي. تحمل فورد ترانزيت 11 م³ وحمولة 1,200 كغ بسعر يبدأ من 185 ₾ يوميًا؛
      وترتفع مرسيدس-بنز سبرينتر إلى 14 م³ و1,500 كغ بسعر يبدأ من 215 ₾ يوميًا — يكفي لنقل شقة كاملة أو منصة ونصف من البضاعة
      في رحلة واحدة. كلتاهما بناقل حركة يدوي وثلاثة مقاعد في المقصورة — مكان للسائق واثنين من الفريق، لا لعائلة أو مجموعة
      سياحية. عقود الشركات الشهرية والسنوية متاحة، ووضع العلامة التجارية على الهيكل مسموح بالاتفاق — ولهذا فإن الحجوزات
      الطويلة هي القاعدة في هذه الفئة، لا الاستثناء.'
    limitations: 'تتسع فئة الفان التجاري لثلاثة أشخاص فقط، لذا فهي ليست خيارًا للركاب أو السفر الجماعي — تحتاج العائلة أو
      المجموعة السياحية إلى فئة الميني فان بدلًا من ذلك. لم يتم تصنيف أي من المركبتين في بياناتنا لمسار ترابي أو جبلي —
      فكلتاهما مصممة للتوصيل وأعمال البريد على الطرق العادية، لا للقيادة السياحية. يجب تثبيت الحمولة: الضرر الذي يلحق بحيز
      الشحن غير مشمول بالتأمين القياسي، كما أن استخدام أي من المركبتين في أعمال البريد أو النقل لحساب طرف ثالث يستلزم موافقة
      خطية مسبقة. كما أن ارتفاع سبرينتر يغلق أمامها بعض مواقف السيارات تحت الأرض وأقواس مداخل الأفنية في وسط تبليسي — تحقق
      من المسار قبل التحميل.'
    terms_note: التأمين المسترد لفئة الفان التجاري هو 800 ₾، يُحجز على البطاقة عند الاستلام (وتُقبل النقود أيضًا) ويُعاد
      خلال 3 أيام عمل بعد الإرجاع. تأمين المسؤولية تجاه الغير وCDW كلاهما مشمولان في السعر؛ التحمل هو 800 ₾، ويتوفر SCDW
      اختياريًا مقابل 25 إلى 45 ₾ يوميًا، وهو ما يخفّضه إلى صفر. الحد الأدنى لعمر السائق 25 عامًا مع رخصة قيادة لا تقل مدتها
      عن 3 سنوات.
    faq:
    - q: ما الغرض من فئة الفان التجاري؟
      a: نقل البضائع لا الركاب — إعادة تعبئة متجر، نقل شقق، فرق التركيب والتوصيل إلى مدن أخرى. تحمل كلتا المركبتين في هذه
        الفئة ثلاثة أشخاص في المقصورة وما بين 11 و14 م³ من حيز التحميل خلفها.
    - q: هل يمكنني استئجار فان من هذه الفئة لنقل عائلة أو مجموعة من الأشخاص؟
      a: لا — تتسع كلتا المركبتين لثلاثة مقاعد في المقصورة فقط. لمجموعة من الأشخاص، لا للبضائع، فئة الميني فان (7 إلى 9
        مقاعد) هي الخيار المناسب.
    - q: كم من البضائع تتسع لها فئة الفان التجاري؟
      a: 11 م³ وحمولة 1,200 كغ في فورد ترانزيت؛ 14 م³ و1,500 كغ في مرسيدس-بنز سبرينتر.
    - q: ما مقدار التأمين المسترد لفئة الفان التجاري؟
      a: 800 ₾، يُحجز على البطاقة أو نقدًا عند الاستلام ويُعاد خلال 3 أيام عمل بعد الإرجاع.
