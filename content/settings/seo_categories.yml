      a: کیلومتر نامحدود، بیمه مسئولیت شخص ثالث و تحویل رایگان در دفتر. تحویل در فرودگاه یا داخل شهر هزینه
        جداگانه دارد — صفحه شرایط اجاره را ببینید.
    - q: آیا خودروی اکونومی از پس جاده‌های کوهستانی گرجستان برمی‌آید؟
      a: در جاده‌های کوهستانی آسفالته مانند بزرگراه قزبگی یا جاده اصلی بورجومی، بله. در مسیرهای خاکی یا
