      المدينة والانتقال من المطار والرحلات على الطرق المعبّدة، وليست للطرق الترابية الجبلية.'
    when_to_choose: 'اختر الفئة الاقتصادية عندما يبقى مسارك على الأسفلت: التنقل داخل تبليسي، طرق النبيذ
      في كاختي، الجولة التراثية بين متسخيتا وغوري، أو الطريق السريع المباشر إلى باتومي أو كوتايسي. السيارات
      الثلاث في هذه الفئة — هيونداي إلنترا وتويوتا كورولا وتويوتا بريوس — أوتوماتيكية وتتسع لخمسة ركاب
      ويبدأ سعرها من 75 ₾ يوميًا، وهو أقل سعر يومي في الأسطول. استهلاك الوقود أيضًا هو الأقل في الأسطول
      (4.5 إلى 6.5 لتر لكل 100 كم في بريوس وكورولا)، وهو أمر مهم في الطرق المعبّدة الطويلة مثل كاختي أو
      ساحل البحر الأسود. الخلوص الأرضي 135 إلى 145 ملم، وهو كافٍ لمواقف السيارات العادية وشوارع تبليسي
      القديمة المرصوفة والساحات غير المعبّدة، لكنه غير كافٍ لممرات الجبال. إذا كانت خطتك جولة في المدينة
      أو رحلة يومية إلى مناطق النبيذ أو التوجه إلى الساحل، فهذه الفئة تؤدي المهمة بأقل سعر.'
    limitations: سيارات الفئة الاقتصادية غير مخصصة للطرق الترابية الجبلية أو الممرات المرتفعة أو الطرق
      المخصصة للدفع الرباعي فقط في سفانيتي أو توشيتي أو خيفسوريتي — فالخلوص المنخفض (135–145 ملم) وغياب
      نظام الدفع الرباعي يستبعدان ذلك. مساحة الأمتعة أيضًا هي الأصغر في الأسطول — حقيبتان لكل سيارة، وهو
      قليل لمجموعة من خمسة أشخاص بأمتعة كاملة. إذا كان مسارك يتضمن طريقًا صنّفته RentUp ضمن فئة SUV أو
      4x4، فاختر فئة أعلى.
    terms_note: التأمين المسترد لفئة الاقتصادية هو 300 ₾، يُحجز على البطاقة عند الاستلام (وتُقبل النقود
      أيضًا) ويُعاد خلال 3 أيام عمل بعد الإرجاع. تأمين المسؤولية تجاه الغير وCDW كلاهما مشمولان في السعر؛
      التحمل هو 300 ₾، ويتوفر SCDW اختياريًا مقابل 25 إلى 45 ₾ يوميًا، وهو ما يخفّضه إلى صفر. الحد الأدنى
