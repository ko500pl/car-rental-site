      وليس نوع سطح الطريق: عائلة من سبعة أفراد، مجموعة صغيرة تفضل سيارة واحدة بدلًا من سيارتين، أو رحلة
      من المطار مع عدة ركاب وحقائب كاملة. تتسع هيونداي ستاريا ومرسيدس-بنز فيتو وتويوتا ألفارد في هذه الفئة
      لـ7 إلى 9 ركاب وتحمل 4 إلى 5 حقائب — أعلى سعة في الأسطول إلى جانب فئة الأوف-رود. تبدأ الأسعار من
      200 ₾ يوميًا، ويمنح الدفع الرباعي في ستاريا ثقة أكبر قليلًا على الأسطح الرطبة أو الوعرة قليلًا مقارنة
      بفيتو أو ألفارد، رغم أن أيًا من الثلاث غير مصنّف في بياناتنا لمسار ترابي أو جبلي. يقع الخلوص الأرضي
      في هذه الفئة (160-186 ملم) بين الفئة الاقتصادية وSUV، وهو مناسب لشوارع المدينة ومداخل الفنادق والطرق
      السريعة المعبّدة. إذا كانت رحلتك بين المدن على طرق معبّدة مع مجموعة كاملة، فهذه الفئة مصممة لذلك
      تحديدًا، وليس لتخطيط المسار.'
