        مانند اوشگولی یا اومالو، خیر — نیاز به رده اختصاصی 4x4 دارید.
    - q: چند نفر و چقدر بار در خودروی کلاس بیزنس جا می‌شود؟
      a: ۵ صندلی و ۳ چمدان در هر سه خودرو — تویوتا کمری، مرسدس-بنز E-Class و بی‌ام‌و سری ۵.
    - q: ودیعه کلاس بیزنس چقدر است؟
      a: ۱۰۰۰ لاری، که هنگام تحویل روی کارت یا به‌صورت نقد بلوکه می‌شود و ظرف ۳ روز کاری پس از بازگشت آزاد می‌شود.
