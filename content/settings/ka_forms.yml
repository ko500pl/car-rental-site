# Hand-checked Georgian case forms for place and region names.
#
# Read by build.py → ka_case(name, case). The key must match the *rendered*
# Georgian name character for character: places.yml → <place>.ka and
# content/regions/*.yml → ka.name. Anything not listed here falls back to the
# rules in ka_case(); this file exists for the names those rules get wrong and
# — for safety — for the ones they happen to get right.
#
# Cases (see docs/seo/TRANSLATION_QA.md §3.1 and Appendix A):
#   gen  ნათესაობითი   -ის   "of X"          თბილისის
#   loc  ვითარებითი    -ში   "in X"          თბილისში
#   abl  მოქმედებითი   -დან  "from X"        თბილისიდან
#   dat  მიცემითი      -ს    "to X"          თბილისს
#
# Never write a hyphen before a Georgian case ending (`თბილისი-ში` is the
# machine-translation tell this table exists to remove). The hyphen is correct
# only after a Latin stem, an acronym or a numeral: `SUV-ის`, `4x4-ის`.
#
# Entries marked "fallback wrong" are the ones that actually matter — the rule
# engine produces a different, incorrect form for them.

places:
  # ── Rental locations ──────────────────────────────────────────────────
  თბილისი:            {gen: თბილისის, loc: თბილისში, abl: თბილისიდან, dat: თბილისს}
  თბილისის აეროპორტი: {gen: "თბილისის აეროპორტის", loc: "თბილისის აეროპორტში", abl: "თბილისის აეროპორტიდან", dat: "თბილისის აეროპორტს"}
  ქუთაისი:            {gen: ქუთაისის, loc: ქუთაისში, abl: ქუთაისიდან, dat: ქუთაისს}
  ქუთაისის აეროპორტი: {gen: "ქუთაისის აეროპორტის", loc: "ქუთაისის აეროპორტში", abl: "ქუთაისის აეროპორტიდან", dat: "ქუთაისის აეროპორტს"}
  ბათუმი:             {gen: ბათუმის, loc: ბათუმში, abl: ბათუმიდან, dat: ბათუმს}
  ბათუმის აეროპორტი:  {gen: "ბათუმის აეროპორტის", loc: "ბათუმის აეროპორტში", abl: "ბათუმის აეროპორტიდან", dat: "ბათუმის აეროპორტს"}

  # ── Shida Kartli / Kvemo Kartli / Mtskheta-Mtianeti ───────────────────
  რუსთავი:            {gen: რუსთავის, loc: რუსთავში, abl: რუსთავიდან, dat: რუსთავს}
  მცხეთა:             {gen: მცხეთის, loc: მცხეთაში, abl: მცხეთიდან, dat: მცხეთას}
  გორი:               {gen: გორის, loc: გორში, abl: გორიდან, dat: გორს}
  ხაშური:             {gen: ხაშურის, loc: ხაშურში, abl: ხაშურიდან, dat: ხაშურს}
  დუშეთი:             {gen: დუშეთის, loc: დუშეთში, abl: დუშეთიდან, dat: დუშეთს}
  მარნეული:           {gen: მარნეულის, loc: მარნეულში, abl: მარნეულიდან, dat: მარნეულს}
  ბოლნისი:            {gen: ბოლნისის, loc: ბოლნისში, abl: ბოლნისიდან, dat: ბოლნისს}
  # fallback wrong (gen/loc/abl/dat): the display name ends in a parenthesis,
  # which no case ending can attach to. Both members are declined here.
  სტეფანწმინდა (ყაზბეგი): {gen: "სტეფანწმინდის (ყაზბეგის)", loc: "სტეფანწმინდაში (ყაზბეგში)", abl: "სტეფანწმინდიდან (ყაზბეგიდან)", dat: "სტეფანწმინდას (ყაზბეგს)"}

  # ── Samtskhe-Javakheti ────────────────────────────────────────────────
  ბორჯომი:            {gen: ბორჯომის, loc: ბორჯომში, abl: ბორჯომიდან, dat: ბორჯომს}
  ბაკურიანი:          {gen: ბაკურიანის, loc: ბაკურიანში, abl: ბაკურიანიდან, dat: ბაკურიანს}
  # fallback wrong (gen, abl): -ე truncates before -ის / -იდან
  ახალციხე:           {gen: ახალციხის, loc: ახალციხეში, abl: ახალციხიდან, dat: ახალციხეს}
  ახალქალაქი:         {gen: ახალქალაქის, loc: ახალქალაქში, abl: ახალქალაქიდან, dat: ახალქალაქს}

  # ── Imereti ───────────────────────────────────────────────────────────
  ზესტაფონი:          {gen: ზესტაფონის, loc: ზესტაფონში, abl: ზესტაფონიდან, dat: ზესტაფონს}
  ჭიათურა:            {gen: ჭიათურის, loc: ჭიათურაში, abl: ჭიათურიდან, dat: ჭიათურას}
  # fallback wrong (gen, abl): -ე truncates before -ის / -იდან
  საჩხერე:            {gen: საჩხერის, loc: საჩხერეში, abl: საჩხერიდან, dat: საჩხერეს}
  ტყიბული:            {gen: ტყიბულის, loc: ტყიბულში, abl: ტყიბულიდან, dat: ტყიბულს}
  სამტრედია:          {gen: სამტრედიის, loc: სამტრედიაში, abl: სამტრედიიდან, dat: სამტრედიას}

  # ── Samegrelo-Zemo Svaneti ────────────────────────────────────────────
  სენაკი:             {gen: სენაკის, loc: სენაკში, abl: სენაკიდან, dat: სენაკს}
  ფოთი:               {gen: ფოთის, loc: ფოთში, abl: ფოთიდან, dat: ფოთს}
  ზუგდიდი:            {gen: ზუგდიდის, loc: ზუგდიდში, abl: ზუგდიდიდან, dat: ზუგდიდს}
  ანაკლია:            {gen: ანაკლიის, loc: ანაკლიაში, abl: ანაკლიიდან, dat: ანაკლიას}
  მესტია:             {gen: მესტიის, loc: მესტიაში, abl: მესტიიდან, dat: მესტიას}

  # ── Racha-Lechkhumi ───────────────────────────────────────────────────
  ამბროლაური:         {gen: ამბროლაურის, loc: ამბროლაურში, abl: ამბროლაურიდან, dat: ამბროლაურს}
  ონი:                {gen: ონის, loc: ონში, abl: ონიდან, dat: ონს}

  # ── Guria / Adjara ────────────────────────────────────────────────────
