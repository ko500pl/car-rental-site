  შეკვეთილი:          {gen: შეკვეთილის, loc: შეკვეთილში, abl: შეკვეთილიდან, dat: შეკვეთილს}
  ხულო:               {gen: ხულოს, loc: ხულოში, abl: ხულოდან, dat: ხულოს}

  # ── Kakheti ───────────────────────────────────────────────────────────
  თელავი:             {gen: თელავის, loc: თელავში, abl: თელავიდან, dat: თელავს}
  გურჯაანი:           {gen: გურჯაანის, loc: გურჯაანში, abl: გურჯაანიდან, dat: გურჯაანს}
  # fallback wrong (gen, abl): syncopating stem — ყვარელი → ყვარლ-
