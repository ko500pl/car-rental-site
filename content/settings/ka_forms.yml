  ლაგოდეხი:           {gen: ლაგოდეხის, loc: ლაგოდეხში, abl: ლაგოდეხიდან, dat: ლაგოდეხს}
  საგარეჯო:           {gen: საგარეჯოს, loc: საგარეჯოში, abl: საგარეჯოდან, dat: საგარეჯოს}
  ახმეტა:             {gen: ახმეტის, loc: ახმეტაში, abl: ახმეტიდან, dat: ახმეტას}
  დედოფლისწყარო:      {gen: დედოფლისწყაროს, loc: დედოფლისწყაროში, abl: დედოფლისწყაროდან, dat: დედოფლისწყაროს}

