      h1: اجارهٔ یک‌طرفهٔ خودرو در گرجستان
      meta_title: اجارهٔ یک‌طرفهٔ خودرو در گرجستان — 100 ₾ میان شهرها | RentUp
      meta_description: >-
        خودرو را در تفلیس، کوتایسی یا باتومی تحویل بگیرید، در شهر یا فرودگاه، و
        در شهری دیگر با 100 ₾ هزینهٔ یک‌طرفه پس بدهید. بدون پیش‌پرداخت، کیلومتر
        نامحدود.
      lead: >-
        خودرو را در یکی از سه شهر ما تحویل بگیرید، در دفتر، در یک نشانی یا در
        فرودگاه، و در شهری دیگر پس بدهید. هزینهٔ یک‌طرفه میان تفلیس، کوتایسی و
        باتومی 100 ₾ است و یک بار به قیمت اجاره اضافه می‌شود؛ شهرهای دیگر با
        هماهنگی.
      pickup: >-
        محل تحویل و محل بازگرداندن را در فرم رزرو بنویسید، برای هر کدام یک فیلد
        جداگانه هست، یا تلفنی به ما بگویید. شهر بازگرداندن را همراه با خودرو
        تأیید می‌کنیم و پرداخت فقط هنگام تحویل انجام می‌شود. سمت تحویل همان
        هزینه‌ای را دارد که در هر اجاره‌ای دارد: دفتر ما و هر نشانی در تفلیس
        رایگان است، فرودگاه تفلیس در اجارهٔ 1 تا 2 روزه 40 ₾ و از روز سوم
        رایگان، فرودگاه کوتایسی 60 ₾ و فرودگاه باتومی 50 ₾ تا چهار روز و از روز
        پنجم رایگان، و یک نشانی در کوتایسی یا باتومی 40 ₾ تا چهار روز و از روز
        پنجم رایگان. تحویل یا بازگرداندن میان ساعت 22:00 تا 07:00 در هر سمتی که
        بیفتد 40 ₾ هزینهٔ شبانه اضافه می‌کند. پاسپورت (شهروندان گرجستان، کارت
        شناسایی)، گواهینامه‌ای که دست‌کم دو سال از صدور آن گذشته باشد، همراه با
        گواهینامهٔ بین‌المللی (IDP) اگر با حروف لاتین چاپ نشده است، و یک کارت
        برای ودیعه همراه بیاورید: 300 ₾ اقتصادی، 600 ₾ کراس‌اوور، 800 ₾ ون
        تجاری، 1000 ₾ کلاس بیزنس و مینی‌ون، 1200 ₾ آفرود 4x4.
      getting_around: >-
        خود مسیر جزو اجاره است: کیلومتر در داخل گرجستان نامحدود است، پس جادهٔ
        تفلیس تا باتومی فقط هزینهٔ سوخت دارد، و خودرو با باک پر تحویل داده می‌شود
        و با باک پر برمی‌گردد؛ برای باکی که در شهر بازگرداندن پر نشده باشد، بهای
        سوخت به‌علاوهٔ 20 ₾ هزینهٔ خدمات گرفته می‌شود. بازگرداندن مانند تحویل
        انجام می‌شود: در صورت‌جلسهٔ تحویل در هر دو سمت از چهار طرف خودرو، داخل
        کابین، کیلومترشمار و سطح سوخت عکس می‌گیریم، و همین است که هر پرسشی
        دربارهٔ آسیب میان دو شهر را حل می‌کند. CDW و TPL در نرخ گنجانده شده و
        فرانشیز به رده بستگی دارد: 300 ₾ اقتصادی، 600 ₾ کراس‌اوور، 800 ₾ ون
        تجاری، 1000 ₾ بیزنس و مینی‌ون، 1200 ₾ آفرود 4x4؛ و SCDW با روزی 25 تا
        45 ₾ آن را به صفر می‌رساند. امدادرسانی جاده‌ای در سراسر کشور و در تمام
        مسیر شبانه‌روزی کار می‌کند و اگر خرابی فنی تقصیر شما نباشد، خودروی
        جایگزین ظرف شش ساعت و رایگان می‌رسد.
      good_to_know:
      - >-
        هزینهٔ یک‌طرفه میان تفلیس، کوتایسی و باتومی 100 ₾ است، در شهر یا
        فرودگاه. بازگرداندن در شهرهای دیگر با هماهنگی و با قیمت جداگانه است؛
        هنگام رزرو بپرسید.
      - >-
        تحویل در محل تحویل‌گیری با جدول تحویل قیمت‌گذاری می‌شود، نه با هزینهٔ
        یک‌طرفه. از روز پنجم فرودگاه کوتایسی، فرودگاه باتومی و نشانی‌ها در
        کوتایسی و باتومی رایگان‌اند؛ فرودگاه تفلیس از روز سوم؛ خود تفلیس همیشه
        رایگان است.
      - >-
        زمان بازگرداندن به همان سختگیری سفر رفت‌وبرگشت بررسی می‌شود: تا دو ساعت
        تأخیر رایگان است، پس از آن برای هر سه ساعت شروع‌شده یک‌سوم نرخ روزانه، و
        بیش از هشت ساعت یک روز کامل اضافی حساب می‌شود.
      - >-
        بازگرداندن میان ساعت 22:00 تا 07:00 مانند تحویل شبانه 40 ₾ هزینهٔ شبانه
        دارد؛ وقتی پس دادن خودرو به پرواز صبح زود یا آخر شب گره خورده، دانستنش
        مفید است.
      - >-
        تغییر تاریخ رایگان است اگر خودرو در تاریخ‌های تازه آزاد باشد. لغو بیش
        از 48 ساعت پیش از شروع رایگان است، در بازهٔ 24 تا 48 ساعت نرخ یک روز و
        کمتر از 24 ساعت یا در صورت نیامدن نرخ دو روز گرفته می‌شود.
      - >-
        ملاقات در فرودگاه در هر یک از دو سمت همان‌طور است که در صفحهٔ تحویل در
        فرودگاه آمده: شمارهٔ پرواز هنگام رزرو، تابلوی نام در سالن ورودی، تحویل
        در پارکینگ ترمینال.
