        לקוטאיסי מתומחר לפי השעות ולא לפי הקילומטרים, וההוצאה השוטפת היחידה מחוץ
        לתעריף היא דלק: הרכב יוצא עם מכל מלא וחוזר עם מכל מלא, ואחרת נגבה מחיר
