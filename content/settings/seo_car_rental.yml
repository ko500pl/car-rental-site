        თბილისის ძველი ქალაქი ფეხით მოსახერხებელია და პარკირება იქ
        რთულია, ამიტომ ბევრი მოქირავე მანქანას მხოლოდ ქალაქიდან
        გასვლის წინ იღებს, ვიდრე ცენტრში სამოძრაოდ. ოფისიდან
        ხელმისაწვდომია როგორც კახეთის გზატკეცილი აღმოსავლეთით, ისე
        ჩრდილოეთით მცხეთის გავლით საქართველოს სამხედრო გზისკენ მიმავალი
        გზა — სწორედ ამიტომ, ერთდღიანი გასვლებიც და კვირიანი მარშრუტებიც
        ხშირად აქედან იწყება და არა აეროპორტიდან.
