        Турцию возможен по предварительной договорённости (250 ₾, отдельные
        категории); иначе автомобиль остаётся в Грузии.
      - Доставка здесь стоит 50 ₾ — меньше, чем 60 ₾ в Кутаиси, и больше,
        чем 40 ₾ в Тбилиси.
      - Если вы едете покорять горную дорогу на Хуло, для крутых участков
        стоит выбрать SUV, а не машину эконом-класса.
