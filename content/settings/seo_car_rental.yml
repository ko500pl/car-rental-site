# SEO copy for the /car-rental/ hub and the six pickup-location pages
# (Tbilisi, Tbilisi Airport, Kutaisi, Kutaisi Airport, Batumi, Batumi Airport).
#
# Source of truth for every commercial fact below: content/settings/rental_policy.yml
# and content/cars/*.yml (deposit range, category prices). Do not add a price,
# fee or policy claim here that is not already stated in those files — if a
# template needs a new fact, add it to rental_policy.yml first, then reflect
# it here.
#
# Structure:
#   hub:
#     <lang>: { h1, lead, meta_title, meta_description, sections: {...}, faq: [...] }
#   locations:
#     <place-key>:
#       <lang>: { h1, meta_title, meta_description, lead, pickup, getting_around, good_to_know: [...] }
#       data: { route_slugs, category_keys, nearest_attraction_slugs }   # language-independent
#   durations:
#     <duration-key>:
#       <lang>: { h1, meta_title, meta_description, lead, pickup, getting_around, good_to_know: [...] }
#       data: { category_keys, tier_days, fleet_min_price_30, fleet_max_price_30,
#               saving_pct_min, saving_pct_max, price_table: [...] }     # language-independent

hub:
  en:
    h1: Car Rental in Georgia
    answer: >-
      RentUp is a car rental company in Tbilisi, Georgia (the country), with 17 vehicles in six
      categories, from 75 ₾ a day for an economy car to 240 ₾ for an off-road 4x4. Every rental
      includes unlimited mileage inside Georgia, CDW and TPL insurance and 24/7 roadside assistance.
      Drivers must be 21 or over with a licence held 2 years. The deposit is 300–1,200 ₾ by category,
      blocked on a card and released within 3 business days. Fuel is full to full. Nothing is prepaid;
      cancellation is free more than 48 hours ahead.
    lead: Rent one of our 17 cars by the day, week or month, with unlimited mileage
      anywhere in Georgia and pickup in Tbilisi, Kutaisi or Batumi.
    meta_title: Car Rental in Georgia — Unlimited Mileage, No Hidden Fees | RentUp
    meta_description: Rent a car in Georgia from RentUp — economy to 4x4, unlimited
      mileage, pickup in Tbilisi, Kutaisi or Batumi. Real deposit, insurance and
      fuel terms, no invented small print.
    sections:
      intro:
        heading: Renting a car in Georgia
        body: >-
          RentUp keeps a fleet of 17 vehicles across six categories, from economy
          hatchbacks to 4x4s built for gravel mountain roads. Every rental includes
          unlimited mileage within Georgia, so a day trip to Mtskheta costs the
          same as a fortnight touring the whole country. Rates are quoted per day
          and fall the longer you keep the car — a week costs less per day than
          a weekend, and a month less still.
      how_it_works:
        heading: How booking works
        steps:
        - Pick a car and dates on the fleet page. Nothing is charged yet — no
          prepayment is required to hold a booking.
        - Bring a driver's licence and passport to pickup. A national licence
          printed in Latin script is enough on its own; otherwise bring it together
          with an International Driving Permit.
        - At handover we take the deposit for the car's category, walk around
          the vehicle together and note its condition, then hand over the keys.
        - Return the car with the same fuel level you received it with. The
          deposit is released within 3 working days.
      requirements:
        heading: Who can rent
        body: >-
          Drivers must be at least 21 years old and have held a licence for at
          least 2 years. We accept a national driving licence in Latin script,
          or a national licence together with an International Driving Permit,
          plus a valid passport at pickup. Economy class has no young-driver
          surcharge; higher categories add 15–25 ₾ a day for drivers under 27.
      deposit_explained:
        heading: The security deposit
        body: >-
          Every rental carries a refundable deposit sized to the car's category
          — from 300 ₾ on an economy car up to 1200 ₾ on a 4x4. We hold it on
          a card, or take it in cash if you'd rather not block a card limit,
          and release it within 3 working days of the car coming back undamaged.
          There is no deposit-free option; every rental requires one, regardless
          of category.
      mileage:
        heading: Mileage
        body: >-
          Every rental comes with unlimited mileage anywhere inside Georgia.
          Loop through Kakheti and Svaneti in the same trip, drive to Kazbegi
          and back twice in a week, or just use the car around town — the daily
          rate doesn't change with distance.
      fuel:
        heading: Fuel policy
        body: >-
          Cars go out with a full tank and come back full — full to full.
          Return it lower and we charge for the missing fuel plus a service fee,
          so there's no advantage to running it down. Average consumption varies
          by model, from around 6 l/100 km for the hybrids to nearer 11 l/100
          km for the vans; each fleet page lists the figure for that car.
      insurance:
        heading: Insurance and the deposit excess
        body: >-
          Third-party liability insurance and CDW are both included in the
          daily rate. Beyond that, the car carries an excess that varies by
          category — 300 ₾ on an economy car up to 1200 ₾ on a 4x4 — the
          most you're responsible for if it's damaged — unless you add SCDW
          for 25–45 ₾ a day, depending on category, which brings the excess
          down to zero.
      delivery:
        heading: Pickup and delivery
        body: >-
          Picking the car up at our office on Vazha-Pshavela Avenue in Tbilisi
          is free, and so is delivery anywhere else in the city. Airport delivery
          is 40 ₾ at Tbilisi International, 60 ₾ at Kutaisi and 50 ₾ at Batumi
          airport. Delivery to an address in Kutaisi or Batumi (not the airport)
          is 40 ₾. Any pickup or return between 22:00 and 07:00 carries a 40 ₾
          night surcharge, wherever it happens.
      one_way:
        heading: One-way rentals
        body: >-
          Pick the car up in one city and drop it off in another for a 100 ₾
          fee between the cities we serve — useful if you're flying into Tbilisi
          and out of Batumi, say, rather than doubling back to return the car.
          That fee covers drop-offs within Georgia only; crossing into Armenia
          or Turkey is a separate arrangement with its own fee and 48 hours'
          notice.
      extras:
        heading: Extras
        body: >-
          A child seat is 10 ₾ a day, an extra driver is 20 ₾ a day for up to
          two extra drivers, and a GPS navigator with offline maps is 15 ₾
          a day. Our own trip planner works just as well if you'd rather use
          your phone.
      cancellation:
        heading: Cancellation
        body: >-
          Cancel free of charge up to 48 hours before pickup. Cancelling
          24–48 hours ahead costs one day's rate; less than 24 hours ahead,
          or not showing up, costs two days' rate. Nothing is prepaid when
          you book, so cancelling early costs you nothing at all.
      support:
        heading: Support
        body: >-
          Roadside assistance is included on every rental. Our office is open
          09:00–21:00, and the team speaks Georgian, English and Russian. Call
          ahead if you'll arrive outside those hours so we can arrange the handover.
    faq:
    - q: How old do I need to be to rent a car in Georgia?
      a: You need to be at least 21 and have held a driving licence for at least
        2 years. Economy class has no young-driver surcharge; higher categories
        add 15–25 ₾ a day for drivers under 27.
    - q: Do I need an International Driving Permit?
      a: Not if your national licence is printed in Latin script — that's accepted
        on its own. If it isn't, bring it together with an International Driving
        Permit and your passport.
    - q: Is the mileage really unlimited?
      a: Yes, on every rental, anywhere inside Georgia. The daily rate is the
        same whether you drive 20 km or 400 km.
    - q: How much is the security deposit, and do I get it back?
      a: It depends on the car's category — from 300 ₾ on an economy car to
        1200 ₾ on a 4x4. We hold it on a card or take it in cash, and release
        it within 3 working days of the car coming back undamaged.
    - q: Can I take the car to Armenia, Turkey or Azerbaijan?
      a: Armenia and Turkey, yes — 150 ₾ and 250 ₾ (selected categories),
        arranged at least 48 hours ahead. Azerbaijan and Russia aren't
        permitted.
    - q: What if my flight lands late at night?
      a: You can still pick up the car — a night surcharge of 40 ₾ applies to
        any pickup or return between 22:00 and 07:00.
    - q: Can I pick up in one city and drop off in another?
      a: Yes. One-way drop-off between the cities we serve costs 100 ₾, on top
        of the rental rate.
    - q: Do I have to pay in advance to book?
      a: No — nothing is charged when you book. You pay at pickup, and you can
        cancel free of charge up to 48 hours before; later cancellations cost
        one or two days' rate depending on how close to pickup you are.
  ka:
    h1: მანქანის გაქირავება საქართველოში
    answer: >-
      RentUp მანქანის გაქირავების კომპანიაა თბილისში, საქართველოში: 17 ავტომობილი ექვს კატეგორიაში —
      დღეში 75 ₾-დან ეკონომ კლასზე 240 ₾-მდე მაღალი გამავლობის 4x4-ზე. ყველა გაქირავებაში შედის
      შეუზღუდავი გარბენი საქართველოს ტერიტორიაზე, CDW და TPL დაზღვევა ფრანშიზით და საგზაო დახმარება
      24/7. მძღოლი უნდა იყოს მინიმუმ 21 წლის, მართვის მოწმობა — მინიმუმ 2 წლის. დეპოზიტი კატეგორიის
      მიხედვით 300–1200 ₾-ია, ბარათზე იბლოკება და 3 სამუშაო დღეში ბრუნდება. საწვავი — სავსედან
      სავსემდე. წინასწარ არაფერი იხდება; გაუქმება 48 საათზე ადრე უფასოა.
    lead: აირჩიეთ ერთი ჩვენი 17 მანქანიდან დღით, კვირით ან თვით — გარბენის შეზღუდვის
      გარეშე მთელი საქართველოს მასშტაბით და აღებით თბილისში, ქუთაისში ან ბათუმში.
    meta_title: მანქანის გაქირავება საქართველოში — შეუზღუდავი გარბენი | RentUp
    meta_description: იქირავეთ მანქანა საქართველოში RentUp-თან — ეკონომ კლასიდან
      4x4-მდე, შეზღუდვის გარეშე გარბენი, აღება თბილისში, ქუთაისში ან ბათუმში.
      რეალური პირობები დეპოზიტზე, დაზღვევასა და საწვავზე, გამონაგონი პირობების
      გარეშე.
    sections:
      intro:
        heading: მანქანის გაქირავება საქართველოში
        body: >-
          RentUp-ს 17 ავტომობილი აქვს ექვს კატეგორიაში — ეკონომ ჰეტჩბეკებიდან
          მაღალი გამავლობის 4x4-მდე, გრუნტიანი მთის გზებისთვის. ყველა ჯავშანში
          გარბენი შეზღუდვის გარეშეა საქართველოს ტერიტორიაზე, ასე რომ ერთდღიანი
          გასვლა მცხეთაში იმავე ფასად ჯდება, რაც ორკვირიანი მოგზაურობა მთელ
          ქვეყანაზე. ტარიფი დღიურია და მით უფრო იკლებს, რაც უფრო ხანგრძლივია
          გაქირავების ვადა — კვირა უფრო იაფია დღეზე გათვლით, ვიდრე შაბათ-კვირა, თვე კი
          კიდევ უფრო იაფია.
      how_it_works:
        heading: როგორ მუშაობს ჯავშანი
        steps:
        - აირჩიეთ მანქანა და თარიღები ავტოპარკის გვერდზე. ჯერჯერობით არაფერი
          იხდით — ჯავშნისთვის წინასწარი გადახდა საჭირო არ არის.
        - აღებისას თან იქონიეთ მართვის მოწმობა და პასპორტი. ლათინური შრიფტით
          გაცემული ეროვნული მოწმობა საკმარისია; სხვა შემთხვევაში საჭიროა
          საერთაშორისო მართვის მოწმობაც.
        - გადაცემისას ვიღებთ დეპოზიტს მანქანის კატეგორიის შესაბამისად, ერთად
          დავათვალიერებთ მანქანას და დავაფიქსირებთ მდგომარეობას, შემდეგ
          გადმოგცემთ გასაღებს.
        - მანქანა დააბრუნეთ იმავე დონის საწვავით, რითაც მიიღეთ. დეპოზიტი
          ბრუნდება დაბრუნებიდან 3 სამუშაო დღეში.
      requirements:
        heading: ვის შეუძლია მანქანის დაქირავება
        body: >-
          მძღოლი უნდა იყოს მინიმუმ 21 წლის და მართვის მოწმობა ჰქონდეს მინიმუმ
          2 წელი. ვღებულობთ ლათინური შრიფტით გაცემულ ეროვნულ მართვის მოწმობას,
          ან ეროვნულ მოწმობას საერთაშორისო მართვის მოწმობასთან ერთად, პლუს
          მოქმედ პასპორტს აღების დროს. ეკონომ კლასს ახალგაზრდა მძღოლის
          დამატებითი გადასახადი არ აქვს; უფრო მაღალ კატეგორიებში 27 წლამდე
          მძღოლებისთვის ემატება 15–25 ₾ დღეში.
      deposit_explained:
        heading: უზრუნველყოფის დეპოზიტი
        body: >-
          ყოველი ჯავშანი მოითხოვს დასაბრუნებელ დეპოზიტს, რომლის ოდენობა
          მანქანის კატეგორიაზეა დამოკიდებული — 300 ₾-დან ეკონომ კლასის მანქანაზე
          1200 ₾-მდე 4x4-ზე. დეპოზიტს ვიჭერთ ბარათზე, ან ვიღებთ ნაღდად, თუ
          სასურველია ბარათის ლიმიტის დაბლოკვის თავიდან აცილება, და ვაბრუნებთ
          დაზიანების გარეშე დაბრუნებიდან 3 სამუშაო დღეში. დეპოზიტის გარეშე
          ვარიანტი არ არსებობს — ის ყოველ ჯავშანზეა საჭირო, კატეგორიის
          მიუხედავად.
      mileage:
        heading: გარბენი
        body: >-
          ყოველ ჯავშანს თან ახლავს შეზღუდვის გარეშე გარბენი საქართველოს
          ტერიტორიაზე. გაიარეთ კახეთი და სვანეთი ერთ მოგზაურობაში, ორჯერ
          იმგზავრეთ ყაზბეგამდე ერთი კვირის განმავლობაში, ან უბრალოდ
          გამოიყენეთ მანქანა ქალაქში — დღიური ტარიფი მანძილზე არ იცვლება.
      fuel:
        heading: საწვავის პოლიტიკა
        body: >-
          მანქანა სავსე ავზით გადმოგეცემათ და იმავე დონით უნდა დააბრუნოთ —
          „იმდენივე, რამდენიც აიღეთ". ნაკლები საწვავით დაბრუნებისას ვაწერთ
          ნაკლული საწვავის ღირებულებას მომსახურების საფასურთან ერთად, ასე
          რომ ავზის დაცლას აზრი არ აქვს. საშუალო ხარჯვა მოდელზეა დამოკიდებული
          — დაახლოებით 6 ლ/100 კმ ჰიბრიდებზე, 11 ლ/100 კმ-მდე ფურგონებზე;
          თითოეული მანქანის ზუსტი მაჩვენებელი მისივე გვერდზეა მითითებული.
      insurance:
        heading: დაზღვევა და დეპოზიტის ექსცესი
        body: >-
          მესამე პირის წინაშე პასუხისმგებლობის დაზღვევა და CDW ორივე დღიურ
          ტარიფშია ჩართული. ამის მიღმა მანქანას აქვს კატეგორიის მიხედვით
          ცვლადი ექსცესი — 300 ₾-დან ეკონომ კლასის მანქანაზე 1200 ₾-მდე
          4x4-ზე — მაქსიმუმი, რასაც პასუხისმგებელი ხართ დაზიანების შემთხვევაში
          — თუ არ დაამატებთ SCDW-ს 25–45 ₾/დღეში, კატეგორიის მიხედვით, რაც
          ექსცესს ნულამდე დაჰყავს.
      delivery:
        heading: აღება და მიწოდება
        body: >-
          მანქანის აღება ჩვენს ოფისში, ვაჟა-ფშაველას გამზირზე თბილისში,
          უფასოა, ისევე როგორც მიწოდება ქალაქის ნებისმიერ სხვა წერტილში.
          აეროპორტში მიწოდება 40 ₾ ღირს თბილისის აეროპორტში, 60 ₾ — ქუთაისის
          აეროპორტში და 50 ₾ — ბათუმის აეროპორტში. მისამართზე მიწოდება ქუთაისში
          ან ბათუმში (არა აეროპორტში) 40 ₾-ია. ნებისმიერი აღება თუ დაბრუნება
          22:00-დან 07:00-მდე დამატებით 40 ₾-ს ითვალისწინებს, სად და როგორც
          არ უნდა მოხდეს ეს.
      one_way:
        heading: ცალმხრივი გაქირავება
        body: >-
          მანქანის აღება შესაძლებელია ერთ ქალაქში და დაბრუნება მეორეში,
          ჩვენი მომსახურების ქალაქებს შორის, 100 ₾ საფასურად — მოსახერხებელია,
          თუ თბილისში ჩამოფრინდებით და ბათუმიდან გაფრინდებით, მაგალითად,
          უკან დაბრუნების ნაცვლად. ეს საფასური მხოლოდ საქართველოს შიგნით
          გადაადგილებას მოიცავს — სომხეთსა თუ თურქეთში გასვლა ცალკე
          ფორმდება, საკუთარი საფასურითა და 48-საათიანი წინასწარი
          შეტყობინებით.
      extras:
        heading: დამატებითი სერვისები
        body: >-
          საბავშვო სავარძელი 10 ₾ ღირს დღეში, დამატებითი მძღოლი — 20 ₾
          დღეში (მაქსიმუმ ორამდე), ხოლო GPS ნავიგატორი ოფლაინ რუკებით —
          15 ₾ დღეში. ჩვენი საკუთარი მარშრუტების დამგეგმავიც კარგად
          მუშაობს, თუ ტელეფონის გამოყენებას ამჯობინებთ.
      cancellation:
        heading: გაუქმება
        body: >-
          გაუქმება უფასოა აღებამდე 48 საათით ადრე. გაუქმება 24-48 საათით
          ადრე ერთი დღის ტარიფით ფასდება, ხოლო 24 საათზე ნაკლები დროით ან
          გამოუცხადებლობა — ორი დღის ტარიფით. ჯავშნისას წინასწარი გადახდა
          არ ხდება, ასე რომ ადრეული გაუქმება სრულიად უფასოა.
      support:
        heading: მხარდაჭერა
        body: >-
          გზაზე დახმარება ყველა ჯავშანშია ჩართული. ჩვენი ოფისი ღიაა
          09:00-დან 21:00-მდე, გუნდი კი ქართულად, ინგლისურად და რუსულად
          საუბრობს. თუ ამ საათებს გარეთ ჩამოხვალთ, დარეკეთ წინასწარ, რომ
          გადაცემა შევათანხმოთ.
    faq:
    - q: რამდენი წლის უნდა ვიყო, რომ საქართველოში მანქანა ვიქირაო?
      a: მინიმუმ 21 წლის უნდა იყოთ და მართვის მოწმობა მინიმუმ 2 წელი გქონდეთ.
        ეკონომ კლასს ახალგაზრდა მძღოლის დამატებითი გადასახადი არ აქვს;
        უფრო მაღალ კატეგორიებში 27 წლამდე მძღოლებისთვის ემატება 15–25 ₾
        დღეში.
    - q: საჭიროა თუ არა საერთაშორისო მართვის მოწმობა?
      a: არა, თუ თქვენი ეროვნული მოწმობა ლათინური შრიფტითაა გაცემული — ეს
        საკმარისია. თუ არადა, თან უნდა იქონიოთ საერთაშორისო მართვის
        მოწმობაც პასპორტთან ერთად.
    - q: მართლა შეზღუდვის გარეშეა გარბენი?
      a: დიახ, ყოველ ჯავშანზე, მთელ საქართველოში. დღიური ტარიფი იგივეა,
        20 კმ გაივლით თუ 400 კმ-ს.
    - q: რამდენია დეპოზიტი და დამიბრუნდება თუ არა?
      a: ეს კატეგორიაზეა დამოკიდებული — 300 ₾-დან ეკონომ კლასზე 1200 ₾-მდე
        4x4-ზე. ვიჭერთ ბარათზე ან ვიღებთ ნაღდად, და ვაბრუნებთ დაზიანების
        გარეშე დაბრუნებიდან 3 სამუშაო დღეში.
    - q: შემიძლია მანქანით სომხეთში, თურქეთში ან აზერბაიჯანში გავიდე?
      a: სომხეთსა და თურქეთში — დიახ, შესაბამისად 150 ₾ და 250 ₾ (შერჩეულ
        კატეგორიებზე), დაჯავშნილი მინიმუმ 48 საათით ადრე. აზერბაიჯანსა და
        რუსეთში გასვლა დაუშვებელია.
    - q: რა ხდება, თუ ჩემი ფრენა ღამით დაფრინდება?
      a: მანქანის აღება მაინც შესაძლებელია — 22:00-დან 07:00-მდე ნებისმიერ
        აღება-ჩაბარებაზე 40 ₾ ღამის დანამატი ვრცელდება.
    - q: შემიძლია ერთ ქალაქში ავიღო და მეორეში დავაბრუნო?
      a: დიახ. ცალმხრივი დაბრუნება ჩვენი მომსახურების ქალაქებს შორის 100
        ₾-ად ჯდება, ქირის ტარიფის ზემოთ.
    - q: საჭიროა თუ არა წინასწარი გადახდა ჯავშნისას?
      a: არა — ჯავშნის დროს არაფერს იხდით. თანხას იხდით აღებისას, ხოლო
        გაუქმება აღებამდე 48 საათით ადრე სრულიად უფასოა; უფრო გვიანი
        გაუქმება ერთი ან ორი დღის ტარიფის ტოლფასია, ვადის მიხედვით.
  ru:
    h1: Аренда авто в Грузии
    answer: >-
      RentUp — компания по аренде автомобилей в Тбилиси, Грузия: 17 машин в шести категориях, от 75 ₾
      в сутки за эконом-класс до 240 ₾ за внедорожник 4x4. В каждую аренду входят пробег без
      ограничений по Грузии, страховка CDW и TPL с франшизой и помощь на дороге 24/7. Водителю должно
      быть не меньше 21 года, стаж — не меньше 2 лет. Депозит — 300–1200 ₾ в зависимости от категории,
      блокируется на карте и возвращается в течение 3 рабочих дней. Топливо — полный бак к полному.
      Предоплаты нет; отмена бесплатна более чем за 48 часов.
    lead: Возьмите в аренду одну из наших 17 машин на день, неделю или месяц —
      без ограничения пробега по всей Грузии, с получением в Тбилиси, Кутаиси
      или Батуми.
    meta_title: Аренда авто в Грузии — без ограничения пробега | RentUp
    meta_description: Арендуйте машину в Грузии у RentUp — от эконом-класса до
      4x4, пробег без ограничений, выдача в Тбилиси, Кутаиси или Батуми.
      Реальные условия по депозиту, страховке и топливу, без выдуманных
      мелких пунктов.
    sections:
      intro:
        heading: Аренда автомобиля в Грузии
        body: >-
          У RentUp 17 автомобилей в шести категориях — от эконом-хэтчбеков
          до внедорожников 4x4 для грунтовых горных дорог. Каждая аренда
          включает пробег без ограничений по территории Грузии, так что
          однодневная поездка в Мцхету стоит столько же, сколько двухнедельное
          путешествие по всей стране. Тариф суточный и снижается с увеличением
          срока аренды: неделя обходится дешевле в пересчёте на день, чем
          выходные, а месяц — ещё дешевле.
      how_it_works:
        heading: Как проходит бронирование
        steps:
        - Выберите машину и даты на странице автопарка. Пока ничего не
          оплачивается — предоплата для брони не нужна.
        - При получении возьмите с собой водительское удостоверение и
          паспорт. Национальных прав латиницей достаточно; в остальных
          случаях нужны ещё и международные права.
        - При передаче машины мы берём депозит по категории автомобиля,
          вместе осматриваем машину и фиксируем её состояние, затем
          передаём ключи.
        - Верните машину с тем же уровнем топлива, с каким получили.
          Депозит возвращается в течение 3 рабочих дней.
      requirements:
        heading: Кто может арендовать
        body: >-
          Водителю должно быть не менее 21 года, а стаж вождения — не менее
          2 лет. Мы принимаем национальные права латиницей, либо
          национальные права вместе с международным водительским
          удостоверением, плюс действующий паспорт при получении. Для
          эконом-класса наценки за молодого водителя нет; в старших
          категориях она составляет 15–25 ₾ в сутки для водителей до 27 лет.
      deposit_explained:
        heading: Депозит
        body: >-
          Каждая аренда предполагает возвратный депозит, размер которого
          зависит от категории машины — от 300 ₾ на эконом-классе до 1200
          ₾ на 4x4. Мы держим его на карте либо принимаем наличными, если
          вы не хотите блокировать лимит карты, и возвращаем в течение 3
          рабочих дней после сдачи машины без повреждений. Варианта без
          депозита нет — он требуется при любой аренде, независимо от
          категории.
      mileage:
        heading: Пробег
        body: >-
          Любая аренда включает неограниченный пробег по всей территории
          Грузии. Проедьте Кахетию и Сванетию в одной поездке, съездите
          в Казбеги и обратно дважды за неделю, или просто пользуйтесь
          машиной по городу — суточная ставка от расстояния не зависит.
      fuel:
        heading: Политика по топливу
        body: >-
          Машина выдаётся с полным баком и должна вернуться с тем же
          уровнем — «сколько взяли, столько и верните». Если вернёте с
          меньшим количеством топлива, мы выставим счёт за недостающее
          топливо плюс сервисный сбор, так что смысла экономить на этом
          нет. Средний расход зависит от модели — от примерно 6 л/100 км
          у гибридов до почти 11 л/100 км у фургонов; точная цифра указана
          на странице каждой машины.
      insurance:
        heading: Страховка и франшиза по депозиту
        body: >-
          Страхование гражданской ответственности перед третьими лицами
          и CDW уже включены в суточный тариф. Сверх этого на машине
          действует франшиза, которая меняется по категории — от 300 ₾
          на эконом-классе до 1200 ₾ на 4x4, — максимум, за который вы
          отвечаете при повреждении, если не добавите SCDW за 25–45 ₾
          в сутки, в зависимости от категории, что снижает франшизу до нуля.
      delivery:
        heading: Получение и доставка
        body: >-
          Получить машину в нашем офисе на проспекте Важа-Пшавела в Тбилиси
          — бесплатно, как и доставка в любую другую точку города. Доставка
          в аэропорт стоит 40 ₾ в Тбилиси, 60 ₾ в Кутаиси и 50 ₾ в Батуми.
          Доставка по адресу в Кутаиси или Батуми (не в аэропорт) — 40 ₾.
          Любое получение или возврат с 22:00 до 07:00 — ночная доплата 40 ₾,
          независимо от места.
      one_way:
        heading: Аренда с возвратом в другом городе
        body: >-
          Машину можно взять в одном городе, а вернуть в другом из тех,
          где мы работаем, за доплату 100 ₾ — удобно, если вы прилетаете
          в Тбилиси, а улетаете из Батуми, например, вместо того чтобы
          возвращаться за машиной. Эта доплата покрывает только поездки
          внутри Грузии — выезд в Армению или Турцию оформляется отдельно,
          со своей платой и уведомлением за 48 часов.
      extras:
        heading: Дополнительные опции
        body: >-
          Детское кресло — 10 ₾ в день, дополнительный водитель — 20 ₾ в
          день (максимум два), а GPS-навигатор с офлайн-картами — 15 ₾
          в день. Наш собственный планировщик маршрутов работает не хуже,
          если вы предпочитаете пользоваться телефоном.
      cancellation:
        heading: Отмена бронирования
        body: >-
          Отмена бесплатна вплоть до 48 часов до получения машины. Отмена
          за 24–48 часов стоит один день аренды, а отмена менее чем за
          24 часа или неявка — два дня аренды. При бронировании ничего не
          предоплачивается, поэтому ранняя отмена не стоит вам ничего.
      support:
        heading: Поддержка
        body: >-
          Помощь на дороге включена в любую аренду. Наш офис работает с
          09:00 до 21:00, команда говорит на грузинском, английском и
          русском. Если вы прилетаете вне этих часов, позвоните заранее,
          чтобы согласовать передачу машины.
    faq:
    - q: Со скольки лет можно арендовать машину в Грузии?
      a: Минимум с 21 года и при стаже вождения не менее 2 лет. Для
        эконом-класса наценки за молодого водителя нет; в старших
        категориях она составляет 15–25 ₾ в сутки для водителей до 27 лет.
    - q: Нужны ли международные водительские права?
      a: Нет, если ваши национальные права выданы латиницей — этого
        достаточно. Если нет, возьмите с собой ещё и международное
        водительское удостоверение вместе с паспортом.
    - q: Пробег правда не ограничен?
      a: Да, при любой аренде, по всей Грузии. Суточная ставка одинакова,
        проедете вы 20 км или 400 км.
    - q: Какой размер депозита и вернут ли его?
      a: Зависит от категории машины — от 300 ₾ на эконом-классе до 1200
        ₾ на 4x4. Мы держим его на карте или принимаем наличными и
        возвращаем в течение 3 рабочих дней после сдачи машины без
        повреждений.
    - q: Можно ли поехать на машине в Армению, Турцию или Азербайджан?
      a: В Армению и Турцию — да, за 150 ₾ и 250 ₾ (отдельные категории)
        соответственно, с оформлением минимум за 48 часов. В Азербайджан
        и Россию выезд не разрешён.
    - q: Что если мой рейс прилетает ночью?
      a: Получить машину можно и в это время — на любое получение или
        возврат с 22:00 до 07:00 действует ночная доплата 40 ₾.
    - q: Можно ли взять машину в одном городе, а вернуть в другом?
      a: Да. Возврат в другом городе из тех, где мы работаем, стоит 100 ₾
        сверх стоимости аренды.
    - q: Нужно ли платить заранее при бронировании?
      a: Нет — при бронировании вы ничего не платите. Оплата — при
        получении машины, а отмена бесплатна вплоть до 48 часов до этого;
        более поздняя отмена стоит один или два дня аренды, в зависимости
        от срока.
