      meta_title: Аренда авто в Тбилиси — получение в офисе или бесплатная доставка | RentUp
      meta_description: Арендуйте машину в Тбилиси у RentUp — бесплатное
        получение в офисе на Важа-Пшавела или бесплатная доставка в любую
        точку города. Пробег без ограничений, реальные условия по депозиту
        и страховке.
      lead: Наш офис находится на проспекте Важа-Пшавела, в нескольких
        минутах от центра, и получение там бесплатное — как и доставка в
        любую другую точку Тбилиси.
      pickup: >-
        Заберите машину в нашем офисе по адресу проспект Важа-Пшавела 71,
        режим работы 09:00–21:00, без дополнительной платы. Если это неудобно,
        бесплатно доставим машину в любую другую точку города — Тбилиси
        единственное место в нашем списке, где доставка по городу бесплатна.
        Получение вне часов работы офиса — ночная доплата 40 ₾, как и везде.
      getting_around: >-
        Старый город Тбилиси удобен для прогулок пешком и неудобен для
        парковки, поэтому многие забирают машину только перед выездом из
        города, а не для передвижения по центру. От офиса легко выехать
        и на Кахетинское шоссе на восток, и на север через Мцхету к
        Военно-Грузинской дороге — поэтому и однодневные поездки, и
        недельные маршруты чаще начинаются именно отсюда, а не из аэропорта.
      good_to_know:
      - Офис по адресу проспект Важа-Пшавела 71 — единственная точка, где
