  with-driver:
    en:
      h1: Car Rental with a Driver in Georgia
      meta_title: Car Rental with a Driver in Georgia — 120 ₾ a Day | RentUp
      meta_description: >-
        Car with a driver in Georgia: 120 ₾ a day for an eight-hour day,
        overtime 20 ₾ an hour, on business class, minivans and off-road 4x4s.
        No prepayment.
      lead: >-
        The driver service costs 120 ₾ a day for an eight-hour day, with every
        further hour at 20 ₾, on top of the car's own daily rate. It is offered
        on business class, minivans and off-road 4x4s — tick “I need a driver”
        in the booking form and we confirm the car and the driver together.
      pickup: >-
        Book the car as usual and tick “I need a driver”; the driver is
        arranged when we confirm availability by phone or email, and nothing is
        charged before pickup. The 120 ₾ covers eight hours of the driver's day
        — a longer day is billed at 20 ₾ an hour on top, so a twelve-hour day
        comes to 200 ₾ for the driver. The car is priced separately at its own
        rate: business class from 210 ₾ a day, a minivan from 200 ₾, an off-road
        4x4 from 240 ₾, so the cheapest chauffeured car works out at 320 ₾ for
        an eight-hour day. Where the car meets you follows the delivery table:
        our Tbilisi office and any Tbilisi address are free, Tbilisi Airport is
        40 ₾ on a 1–2 day rental and free from the third day, Kutaisi Airport
        60 ₾ and Batumi Airport 50 ₾ up to four days and free from the fifth. A
        handover between 22:00 and 07:00 adds the 40 ₾ night surcharge.
      getting_around: >-
        Mileage inside Georgia is unlimited, so a driver day to Kazbegi,
        Kakheti or Kutaisi is priced by the hours, not the kilometres, and fuel
        is the only running cost outside the rate — the car goes out full and
        comes back full, with the missing fuel plus a 20 ₾ service fee charged
        if it does not. Roadside assistance runs 24/7 nationwide, and a
        technical fault that is not the renter's doing gets a replacement car
        within six hours at no charge. Multi-day trips are the same arithmetic
        repeated: 120 ₾ per driver day plus the car's daily rate, with the car
        moving to its 7–29 day price from the seventh day and its 30+ day price
        from the thirtieth. If someone in your party wants to take the wheel
        for part of the trip, they need to be named on the agreement and meet
        the age and licence rules for the category — 25 with five years'
        experience on business class, 23 with three years on a minivan, 25 with
        four years on an off-road 4x4 — because the insurance does not cover
        driving by anyone not named as a driver.
      good_to_know:
      - >-
        The rate is per driver day: 120 ₾ for eight hours, then 20 ₾ for each
        further hour. Two eight-hour days are 240 ₾ for the driver, plus the
        car for two days.
      - >-
        A driver is offered on three categories — business class, minivans and
        off-road 4x4s — not on economy cars or crossovers.
      - >-
        The request goes through the ordinary booking form with the “I need a
        driver” box ticked, or by phone. We confirm by phone or email, and
        nothing is paid until pickup.
      - >-
        A handover or return between 22:00 and 07:00 carries the 40 ₾ night
        surcharge, the same as on a self-drive rental.
      - >-
        Child seats are 10 ₾ a day in three age groups — 0–3, 3–7 and 7–12 —
        and Georgian law requires children under 12 to travel in one, driver or
        no driver.
      - >-
        Anyone who wants to drive part of the way must be named on the
        agreement and meet the category's age and licence rules; driving by a
        person not named on it is not covered by the insurance.
      - >-
        Meeting at Tbilisi, Kutaisi or Batumi airport is priced by the delivery
        table, exactly as on a self-drive rental — see the airport pickup page.
