      meta_description: იქირავეთ მანქანა თბილისში RentUp-თან — უფასო აღება ჩვენს
        ოფისში ვაჟა-ფშაველაზე ან უფასო მიწოდება ქალაქის ნებისმიერ წერტილში.
        შეზღუდვის გარეშე გარბენი, რეალური პირობები დეპოზიტსა და დაზღვევაზე.
      lead: ჩვენი ოფისი ვაჟა-ფშაველას გამზირზეა, ცენტრიდან რამდენიმე წუთის
        დაშორებით, და აღება იქ უფასოა — ისევე როგორც მიწოდება თბილისის
        ნებისმიერ სხვა წერტილში.
      pickup: >-
        მანქანის აღება შესაძლებელია ჩვენს ოფისში, ვაჟა-ფშაველას გამზირი 71-ზე,
        ღიაა 09:00-დან 21:00-მდე, დამატებითი გადასახადის გარეშე. თუ ეს
        არახერხემდელია, უფასოდ მოგაწვდით ქალაქის ნებისმიერ სხვა წერტილში —
        თბილისი ერთადერთი ადგილია ჩვენს სიაში, სადაც ქალაქში მიწოდება
        უფასოა. ოფისის საათებს გარეთ ჩამოსვლა 40 ₾ ღამის დანამატს
        ითვალისწინებს, ისევე როგორც ყველგან სხვაგან.
