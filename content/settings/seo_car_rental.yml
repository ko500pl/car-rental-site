    ar:
      h1: تأجير سيارة مع سائق في جورجيا
      meta_title: تأجير سيارة مع سائق في جورجيا — 120 ₾ في اليوم | RentUp
      meta_description: >-
        سيارة مع سائق في جورجيا: 120 ₾ في اليوم لثماني ساعات، والساعة الإضافية
        بـ 20 ₾، على فئة رجال الأعمال والميني فان والدفع الرباعي 4x4. دون دفع
        مسبق.
      lead: >-
        تكلف خدمة السائق 120 ₾ في اليوم ليوم من ثماني ساعات، وكل ساعة إضافية
        20 ₾، فوق التعرفة اليومية للسيارة نفسها. وهي متاحة على فئة رجال الأعمال
        والميني فان والدفع الرباعي 4x4؛ ضع علامة على «أحتاج سائقاً» في نموذج
        الحجز، فنؤكد السيارة والسائق معاً.
      pickup: >-
        احجز السيارة كالمعتاد وضع علامة على «أحتاج سائقاً»؛ يُرتَّب السائق عندما
        نؤكد التوفر هاتفياً أو بالبريد الإلكتروني، ولا يُدفع شيء قبل الاستلام.
        تغطي 120 ₾ ثماني ساعات من يوم السائق؛ واليوم الأطول يُحتسب بـ 20 ₾ عن كل
        ساعة فوقها، فيوم من اثنتي عشرة ساعة يبلغ 200 ₾ للسائق. أما السيارة
        فتُسعَّر على حدة بتعرفتها الخاصة: فئة رجال الأعمال من 210 ₾ في اليوم،
        والميني فان من 200 ₾، والدفع الرباعي 4x4 من 240 ₾، فأرخص سيارة مع سائق
        تبلغ 320 ₾ ليوم من ثماني ساعات. ومكان لقاء السيارة بك يتبع جدول
        التوصيل: مكتبنا وأي عنوان في تبليسي مجاناً، ومطار تبليسي 40 ₾ في إيجار
        من 1 إلى 2 يوم ومجاناً من اليوم الثالث، ومطار كوتايسي 60 ₾ ومطار باتومي
        50 ₾ حتى أربعة أيام ومجاناً من اليوم الخامس. التسليم بين الساعة 22:00
        و07:00 يضيف رسم الليل 40 ₾.
      getting_around: >-
        المسافة المقطوعة داخل جورجيا غير محدودة، فيوم مع سائق إلى كازبيغي أو
        كاخيتي أو كوتايسي يُسعَّر بالساعات لا بالكيلومترات، والتكلفة الجارية
        الوحيدة خارج التعرفة هي الوقود: تُسلَّم السيارة بخزان ممتلئ وتعود بخزان
        ممتلئ، وإلا احتُسب ثمن الوقود الناقص إضافة إلى رسم خدمة قدره 20 ₾.
        المساعدة على الطريق تعمل على مدار الساعة في أنحاء البلاد، وإذا تعطلت
        السيارة لخلل فني ليس بسبب المستأجر تصل سيارة بديلة خلال ست ساعات ودون
        رسوم. الرحلات متعددة الأيام هي الحساب نفسه مكرراً: 120 ₾ عن كل يوم
        للسائق زائد التعرفة اليومية للسيارة، مع انتقال السيارة إلى سعر 7 إلى 29
        يوماً من اليوم السابع وإلى سعر 30 يوماً فأكثر من اليوم الثلاثين. وإن
        أراد أحد من رفقتك القيادة بنفسه في جزء من الطريق، فعليه أن يكون مذكوراً
        في العقد وأن يستوفي شروط السن والرخصة للفئة: 25 سنة مع خبرة خمس سنوات
        لفئة رجال الأعمال، و23 سنة مع ثلاث سنوات للميني فان، و25 سنة مع أربع
        سنوات للدفع الرباعي 4x4، لأن التأمين لا يغطي قيادة شخص غير مذكور في
        العقد سائقاً.
      good_to_know:
      - >-
        التعرفة عن يوم السائق: 120 ₾ لثماني ساعات، ثم 20 ₾ عن كل ساعة إضافية.
        يومان من ثماني ساعات يبلغان 240 ₾ للسائق، زائد السيارة ليومين.
      - >-
        السائق متاح على ثلاث فئات: رجال الأعمال والميني فان والدفع الرباعي 4x4،
        لا على السيارات الاقتصادية والكروس أوفر.
      - >-
        يمر الطلب عبر نموذج الحجز العادي مع علامة على «أحتاج سائقاً»، أو
        هاتفياً. نؤكد هاتفياً أو بالبريد الإلكتروني، ولا يُدفع شيء حتى الاستلام.
      - >-
        التسليم أو الإرجاع بين الساعة 22:00 و07:00 يحمل رسم الليل 40 ₾، كما في
        الإيجار دون سائق.
      - >-
        مقاعد الأطفال بـ 10 ₾ في اليوم في ثلاث فئات عمرية: من 0 إلى 3، ومن 3 إلى
        7، ومن 7 إلى 12 سنة، ويُلزم القانون الجورجي الأطفال دون 12 سنة بالجلوس
        فيها، مع سائق أو من دونه.
      - >-
        من أراد القيادة في جزء من الطريق فعليه أن يكون مذكوراً في العقد وأن
        يستوفي شروط السن والرخصة للفئة؛ فالتأمين لا يغطي قيادة شخص غير مذكور في
        العقد.
      - >-
        اللقاء في مطار تبليسي أو كوتايسي أو باتومي يُسعَّر وفق جدول التوصيل،
        تماماً كما في الإيجار دون سائق؛ انظر صفحة الاستلام من المطار.
