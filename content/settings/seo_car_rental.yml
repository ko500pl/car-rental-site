  # ── Service pages (added 2026-09-01) ─────────────────────────────────
  # Three service landing pages rendered as /car-rental/<key>/. They are not
  # price-tier pages, so they carry no price_table; every figure comes from
  # content/settings/rental_policy.yml, content/pages/pricing.yml,
  # content/pages/faq.yml, content/pages/terms.yml or the location entries
  # above. Source list per figure: docs/seo/SERVICE_PAGES.md.
  one-way:
    en:
      h1: One-Way Car Rental in Georgia
      meta_title: One-Way Car Rental in Georgia — 100 ₾ Between Cities | RentUp
      meta_description: >-
        Pick up in Tbilisi, Kutaisi or Batumi — city or airport — and drop off
        in another city for a flat 100 ₾ one-way fee. No prepayment, unlimited
        mileage.
      lead: >-
        Collect the car in one of our three cities — at the office, at an
        address or at the airport — and hand it back in another. The one-way
        fee between Tbilisi, Kutaisi and Batumi is 100 ₾, added once to the
        rental price; other cities are by arrangement.
      pickup: >-
        Put the pickup and return places in the booking form — it has a field
        for each — or tell us by phone. We confirm the drop-off city together
        with the car, and nothing is charged until pickup. The pickup end costs
        what it costs on any rental: our Tbilisi office and any Tbilisi address
        are free, Tbilisi Airport is 40 ₾ on a 1–2 day rental and free from the
        third day, Kutaisi Airport is 60 ₾ and Batumi Airport 50 ₾ up to four
        days and free from the fifth, and an address in central Kutaisi or
        Batumi is 40 ₾ up to four days and free from the fifth. A handover or
        return between 22:00 and 07:00 adds the 40 ₾ night surcharge at
        whichever end it falls. Bring a passport (Georgian citizens, an ID
        card), a driving licence held for at least two years — with an
        International Driving Permit if it is not printed in the Latin alphabet
        — and a card for the deposit: 300 ₾ economy, 600 ₾ crossover, 800 ₾
        commercial van, 1000 ₾ business class and minivan, 1200 ₾ off-road 4x4.
      getting_around: >-
        The drive itself is on the rental: mileage inside Georgia is unlimited,
        so the Tbilisi–Batumi road costs you fuel and nothing else, and the car
        goes out full and comes back full — a tank not refilled at the drop-off
        city is charged as the fuel plus a 20 ₾ service fee. The return works
        the same way as the pickup: we photograph all four sides, the interior,
        the odometer and the fuel level in the handover report at both ends,
        which is what settles any question about damage between two cities.
        CDW and TPL are included in the rate, with an excess that depends on
        the category — 300 ₾ economy, 600 ₾ crossover, 800 ₾ commercial van,
        1000 ₾ business class and minivan, 1200 ₾ off-road 4x4 — and SCDW
        brings it to zero for 25–45 ₾ a day. Roadside assistance runs 24/7
        nationwide along the whole route, and a technical fault that is not
        your doing gets a replacement car within six hours at no charge.
      good_to_know:
      - >-
        The one-way fee is 100 ₾ between Tbilisi, Kutaisi and Batumi, city or
        airport. Drop-offs in other cities are by arrangement and quoted
        individually — ask when you book.
      - >-
        Delivery to the pickup point is priced by the delivery table, not by
        the one-way. From the fifth day Kutaisi Airport, Batumi Airport and
        addresses in Kutaisi and Batumi are free; Tbilisi Airport is free from
        the third day; Tbilisi itself is always free.
      - >-
        The return time is checked as strictly as on a round trip: up to two
        hours late is free, after that one third of the daily rate for every
        three hours started, and more than eight hours counts as a full extra
        day.
      - >-
        A return between 22:00 and 07:00 carries the 40 ₾ night surcharge, the
        same as a night pickup — worth knowing when the drop-off is timed to an
        early or late flight.
      - >-
        Changing your dates is free if the car is free on the new ones.
        Cancellation is free more than 48 hours ahead, one day's rate at 24–48
        hours, and two days' rate under 24 hours or for a no-show.
      - >-
        Meeting at an airport at either end works as on our airport pickup
        page: flight number at booking, a name sign at arrivals, handover in
        the terminal car park.
    ka:
      h1: მანქანის ერთმხრივი გაქირავება საქართველოში
      meta_title: მანქანის ერთმხრივი გაქირავება — 100 ₾ ქალაქებს შორის | RentUp
      meta_description: >-
        აიღეთ მანქანა თბილისში, ქუთაისში ან ბათუმში და დააბრუნეთ სხვა ქალაქში
        100 ₾ ერთმხრივი საფასურით — ქალაქში ან აეროპორტში. წინასწარი გადახდის
        გარეშე.
      lead: >-
        აიღეთ მანქანა ჩვენს სამი ქალაქიდან ერთ-ერთში — ოფისში, მისამართზე ან
        აეროპორტში — და ჩააბარეთ მეორეში. ერთმხრივი საფასური თბილისს, ქუთაისსა
        და ბათუმს შორის 100 ₾-ია და ქირის ფასს ერთხელ ემატება; სხვა ქალაქები —
        შეთანხმებით.
      pickup: >-
        ჯავშნის ფორმაში მიუთითეთ აღებისა და დაბრუნების ადგილი — თითოეულისთვის
        ცალკე ველია — ან ტელეფონით გვითხარით. დაბრუნების ქალაქს მანქანასთან
        ერთად ვადასტურებთ, გადახდა კი მხოლოდ აღებისას ხდება. აღების მხარე
        იმდენივე ღირს, რამდენიც ნებისმიერ გაქირავებაზე: ჩვენი ოფისი და
        თბილისში ნებისმიერი მისამართი უფასოა, თბილისის აეროპორტში 1–2-დღიან
        ქირაზე 40 ₾-ია და მესამე დღიდან უფასო, ქუთაისის აეროპორტში 60 ₾ და
        ბათუმის აეროპორტში 50 ₾ ოთხ დღემდე და მეხუთე დღიდან უფასო, ქუთაისსა და
        ბათუმში მისამართზე კი 40 ₾ ოთხ დღემდე და მეხუთე დღიდან უფასო. გადაცემა
        ან დაბრუნება 22:00-დან 07:00-მდე 40 ₾ ღამის დანამატს ითვალისწინებს,
        რომელ მხარესაც არ უნდა მოხვდეს. თან იქონიეთ პასპორტი (საქართველოს
        მოქალაქეებმა — პირადობის მოწმობა), სულ მცირე ორი წლის მართვის მოწმობა —
        საერთაშორისო მართვის მოწმობასთან (IDP) ერთად, თუ ლათინური ასოებით არ
        არის დაბეჭდილი — და ბარათი დეპოზიტისთვის: 300 ₾ ეკონომ კლასზე, 600 ₾
        კროსოვერზე, 800 ₾ კომერციულ ფურგონზე, 1000 ₾ ბიზნეს კლასსა და
        მინივენზე, 1200 ₾ მაღალი გამავლობის 4x4-ზე.
      getting_around: >-
        თავად გზა ქირაში შედის: გარბენი საქართველოში შეუზღუდავია, ამიტომ
        თბილისი–ბათუმის გზა მხოლოდ საწვავად გიჯდებათ, მანქანა კი სავსე ავზით
        გაიცემა და სავსეთი ბრუნდება — დაბრუნების ქალაქში შეუვსებელ ავზს
        საწვავის ღირებულება და 20 ₾ მომსახურების საფასური ემატება. დაბრუნება
        ისევე მიმდინარეობს, როგორც აღება: მიღება-ჩაბარების აქტში ორივე მხარეს
        ვიღებთ მანქანის ოთხივე მხარეს, სალონს, გარბენსა და საწვავის დონეს —
        სწორედ ეს წყვეტს ორ ქალაქს შორის დაზიანებაზე ნებისმიერ კითხვას. CDW და
        TPL ფასში შედის, ფრანშიზა კი კატეგორიაზეა დამოკიდებული — 300 ₾ ეკონომ
        კლასზე, 600 ₾ კროსოვერზე, 800 ₾ კომერციულ ფურგონზე, 1000 ₾ ბიზნეს
        კლასსა და მინივენზე, 1200 ₾ მაღალი გამავლობის 4x4-ზე — SCDW კი მას
        ნულამდე ამცირებს დღეში 25–45 ₾-ად. საგზაო დახმარება 24/7 მუშაობს მთელი
        მარშრუტის გასწვრივ, ხოლო თქვენი ბრალის გარეშე დამდგარ ტექნიკურ
        გაუმართაობაზე სამაგიერო მანქანას ექვს საათში და უფასოდ მოგაწვდით.
      good_to_know:
      - >-
        ერთმხრივი საფასური თბილისს, ქუთაისსა და ბათუმს შორის 100 ₾-ია, ქალაქში
        ან აეროპორტში. სხვა ქალაქში დაბრუნება შეთანხმებით ხდება და ცალკე
        ფასდება — ჯავშნისას გვკითხეთ.
      - >-
        აღების ადგილზე მიწოდება მიწოდების ცხრილით ფასდება და არა ერთმხრივი
        საფასურით. მეხუთე დღიდან ქუთაისის აეროპორტი, ბათუმის აეროპორტი და
        ქუთაისსა და ბათუმში მისამართები უფასოა; თბილისის აეროპორტი — მესამე
        დღიდან; თბილისი ყოველთვის უფასოა.
      - >-
        დაბრუნების დრო ისევე მკაცრად მოწმდება, როგორც წრიულ მარშრუტზე: 2
        საათამდე დაგვიანება უფასოა, შემდეგ ყოველ დაწყებულ 3 საათზე დღიური
        ტარიფის ერთი მესამედი ერიცხება, 8 საათზე მეტი დაგვიანება კი სრულ
        დამატებით დღედ ითვლება.
      - >-
        დაბრუნება 22:00-დან 07:00-მდე 40 ₾ ღამის დანამატს ითვალისწინებს,
        ისევე როგორც ღამით აღება — გასათვალისწინებელია, როცა ჩაბარება ადრეულ
        ან გვიან ფრენას ერგება.
      - >-
        თარიღების შეცვლა უფასოა, თუ ახალ თარიღებზე მანქანა თავისუფალია.
        გაუქმება 48 საათზე ადრე უფასოა, 24–48 საათში ერთი დღის ტარიფი
        ერიცხება, 24 საათზე ნაკლებში ან გამოუცხადებლობისას — ორი დღის.
      - >-
        აეროპორტში შეხვედრა ორივე მხარეს ისე მუშაობს, როგორც აეროპორტში აღების
        გვერდზეა აღწერილი: ფრენის ნომერი ჯავშნისას, სახელიანი დაფა ჩამოსვლისას,
        გადაცემა ტერმინალის ავტოსადგომზე.
    ru:
      h1: Аренда авто в один конец в Грузии
      meta_title: Аренда авто в один конец в Грузии — 100 ₾ между городами | RentUp
      meta_description: >-
        Заберите машину в Тбилиси, Кутаиси или Батуми — в городе или аэропорту —
        и сдайте в другом городе за 100 ₾. Без предоплаты, пробег по Грузии не
        ограничен.
      lead: >-
        Получите машину в одном из наших трёх городов — в офисе, по адресу или в
        аэропорту — и сдайте в другом. Сбор за аренду в одну сторону между
        Тбилиси, Кутаиси и Батуми — 100 ₾, он прибавляется к стоимости аренды
        один раз; другие города — по договорённости.
      pickup: >-
        Укажите место получения и место возврата в форме бронирования — для
        каждого есть отдельное поле — или назовите их по телефону. Город
        возврата мы подтверждаем вместе с машиной, а оплата происходит только
        при получении. Сторона получения стоит столько же, сколько на любой
        аренде: наш офис и любой адрес в Тбилиси бесплатны, аэропорт Тбилиси —
        40 ₾ при аренде на 1–2 дня и бесплатно с третьего дня, аэропорт Кутаиси
        — 60 ₾, аэропорт Батуми — 50 ₾ до четырёх дней и бесплатно с пятого,
        адрес в Кутаиси или Батуми — 40 ₾ до четырёх дней и бесплатно с пятого.
        Выдача или возврат между 22:00 и 07:00 добавляет ночную доплату 40 ₾ на
        той стороне, где она выпадает. Возьмите паспорт (гражданам Грузии —
        удостоверение личности), водительское удостоверение со стажем не менее
        двух лет — вместе с международным (IDP), если оно напечатано не
        латиницей, — и карту для депозита: 300 ₾ эконом-класс, 600 ₾ кроссовер,
        800 ₾ коммерческий фургон, 1000 ₾ бизнес-класс и минивэн, 1200 ₾
        внедорожник 4x4.
      getting_around: >-
        Сама дорога входит в аренду: пробег по Грузии не ограничен, так что
        трасса Тбилиси–Батуми стоит вам только топлива, а машина выдаётся с
        полным баком и возвращается с полным — за не заправленный в городе
        возврата бак берут стоимость топлива плюс сервисный сбор 20 ₾. Возврат
        проходит так же, как получение: в акте приёма-передачи на обеих
        сторонах мы фотографируем все четыре стороны машины, салон, одометр и
        уровень топлива — именно это снимает любой вопрос о повреждениях между
        двумя городами. CDW и TPL входят в тариф, франшиза зависит от категории
        — 300 ₾ эконом, 600 ₾ кроссовер, 800 ₾ коммерческий фургон, 1000 ₾
        бизнес-класс и минивэн, 1200 ₾ внедорожник 4x4, — а SCDW сводит её к
        нулю за 25–45 ₾ в день. Техпомощь на дороге работает круглосуточно по
        всей стране вдоль всего маршрута, а при технической неисправности не по
        вашей вине подменную машину привезут в течение шести часов бесплатно.
      good_to_know:
      - >-
        Сбор за аренду в одну сторону — 100 ₾ между Тбилиси, Кутаиси и Батуми,
        в городе или в аэропорту. Возврат в других городах — по договорённости
        и с индивидуальным расчётом, спросите при бронировании.
      - >-
        Подача к месту получения считается по таблице доставки, а не по сбору
        за одну сторону. С пятого дня аэропорт Кутаиси, аэропорт Батуми и адреса
        в Кутаиси и Батуми бесплатны; аэропорт Тбилиси — с третьего дня; сам
        Тбилиси бесплатен всегда.
