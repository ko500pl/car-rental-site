durations:
  monthly:
    en:
      h1: Monthly and Long-Term Car Rental in Georgia
      meta_title: Monthly Car Rental in Georgia — from 56 ₾ a Day | RentUp
      meta_description: >-
        Rent a car in Georgia for a month or longer from 56 ₾ a day — 1680 ₾
        for thirty days. Real prices by category, real deposits, real
        insurance excess.
      lead: >-
        From the thirtieth day every car moves onto its long-stay rate —
        between 24.4% and 25.3% below the same car's 1–6 day price, across
        all 17 vehicles. The cheapest works out at 56 ₾ a day, or 1680 ₾ for
        a month.
      pickup: >-
        Nothing is charged when you book. A request is confirmed by phone or
        email and payment is made at pickup, whatever the length of the
        rental. Bring a passport (Georgian citizens, an ID card), a driving
        licence held for at least two years, and a card for the deposit —
        300 ₾ on economy class, 600 ₾ on a crossover, 800 ₾ on a commercial
        van, 1000 ₾ on business class and minivans, 1200 ₾ on an off-road
        4x4. If your licence is not printed in the Latin alphabet, bring an
        International Driving Permit with it. Delivery charges fall away
        from the fifth day, so on a monthly rental office pickup, delivery
        to any address in Tbilisi and all three airports are free; Telavi,
        Gori or Zugdidi cost 50 ₾, and a handover at the Sarpi or Kazbegi
        border starts at 120 ₾.
      getting_around: >-
        Mileage inside Georgia is unlimited and stays unlimited at any
        length — nothing about the driving changes at thirty days. Servicing
        and wear items, meaning oil, filters and tyres, are included in the
        rate, so an ordinary month costs you fuel and nothing else, and
        every car carries winter tyres from 1 December to 1 April. Roadside
        assistance runs 24/7 nationwide; if a technical fault that is not
        your doing takes the car off the road, a replacement arrives within
        six hours at no charge. CDW and TPL are included in the rate, but
        CDW leaves an excess that varies by category — 300 ₾ economy, 600 ₾
        crossover, 800 ₾ commercial van, 1000 ₾ business class and minivan,
        1200 ₾ off-road 4x4 — and it does not cover tyres, wheels, the
        underbody, the mirrors or the interior, where a replacement tyre
        runs 120–400 ₾. SCDW is a paid upgrade at 25–45 ₾ a day depending on
        category. Fuel is full to full, with the missing fuel plus a 20 ₾
        service fee charged if the tank comes back low. Traffic fines can
        reach us up to thirty days after the car goes back, which on a long
        rental usually means after you have already returned it.
      good_to_know:
      - >-
        There is no maximum rental length. The 30+ day rate applies from the
        thirtieth day onwards, however long you keep the car after that.
      - >-
        Changing your dates costs nothing if the car is free on the new
        ones. An early return is refunded, but the whole rental is
        recalculated at the rate for the days actually used — end a 30-day
        booking on day 20 and it is billed at the 7–29 day rate, not the
        30+ one.
      - >-
        Drivers under 27 pay the young-driver surcharge on every day of a
        long rental: 15 ₾ a day on crossovers and minivans at ages 23–25,
        25 ₾ a day on business class and 4x4s at ages 25–27 — 450 ₾ and
        750 ₾ respectively over thirty days. Economy class carries no
        surcharge.
      - >-
        A seasonal adjustment of +15% applies in July and August, and +10%
        in the Easter and New Year weeks. Ask for a written quote if your
        month crosses one of them.
      - >-
        The deposit does not shrink because the rental is long. It is the
        same per-category amount as on a one-day booking, blocked on a card
        or taken in cash and returned on the spot, and released within 3
        working days of the car coming back undamaged.
      - >-
        Companies taking three or more cars for longer than three months are
        quoted individually, and a 12–36 month operating rental is a
        separate product. Neither is priced from the table above.
    ka:
      h1: მანქანის გაქირავება თვიურად საქართველოში
      meta_title: მანქანის გაქირავება თვიურად — დღეში 56 ₾-დან | RentUp
      meta_description: >-
        იქირავეთ მანქანა საქართველოში ერთი თვით ან მეტი ხნით — დღეში 56 ₾-დან,
        1680 ₾ ოცდაათ დღეზე. რეალური ფასები, დეპოზიტი და ფრანშიზა, წინასწარი
        გადახდის გარეშე.
      lead: >-
        ოცდაათი დღიდან ყველა მანქანა გრძელვადიან ტარიფზე გადადის — იმავე
        მანქანის 1–6-დღიან ფასზე 24.4–25.3%-ით ნაკლებზე, ჩვენს 17-ვე
        ავტომობილზე. ყველაზე იაფი დღეში 56 ₾ გამოდის, ანუ 1680 ₾ თვეზე.
      pickup: >-
        ჯავშნისას წინასწარ არაფერი იხდება. განაცხადს ტელეფონით ან ელფოსტით
        ვადასტურებთ, გადახდა კი მანქანის აღებისას ხდება, ვადის მიუხედავად.
        თან იქონიეთ პასპორტი (საქართველოს მოქალაქეებმა — პირადობის მოწმობა),
        სულ მცირე ორი წლის მართვის მოწმობა და ბარათი დეპოზიტისთვის: 300 ₾
        ეკონომ კლასზე, 600 ₾ კროსოვერზე, 800 ₾ კომერციულ ფურგონზე, 1000 ₾
        ბიზნეს კლასსა და მინივენზე, 1200 ₾ მაღალი გამავლობის 4x4-ზე. თუ
        მართვის მოწმობა ლათინური ასოებით არ არის დაბეჭდილი, საერთაშორისო
        მართვის მოწმობაც (IDP) დაგჭირდებათ. მიწოდების საფასური მეხუთე დღიდან
        ქრება, ამიტომ თვიურ დაქირავებაზე ოფისში აღება, თბილისში ნებისმიერ
        მისამართზე მიწოდება და სამივე აეროპორტი უფასოა; თელავი, გორი და
        ზუგდიდი 50 ₾ ღირს, სარფის ან ყაზბეგის საზღვართან გადაცემა კი 120 ₾-დან
        იწყება.
      getting_around: >-
        გარბენი საქართველოში შეუზღუდავია და ნებისმიერ ვადაზე შეუზღუდავი რჩება
        — ოცდაათ დღეზე მართვის მხრივ არაფერი იცვლება. ტექმომსახურება და
        ცვეთადი ნაწილები, ანუ ზეთი, ფილტრები და საბურავები, ფასში შედის,
        ამიტომ ჩვეულებრივი თვე მხოლოდ საწვავად გიჯდებათ, 1 დეკემბრიდან
        1 აპრილამდე კი ყველა მანქანაზე ზამთრის საბურავებია. საგზაო დახმარება
        24/7 მუშაობს მთელი ქვეყნის მასშტაბით; თუ ტექნიკური გაუმართაობა თქვენი
        ბრალით არ დამდგარა, სამაგიერო მანქანას ექვს საათში და უფასოდ
        მოგაწვდით. CDW და TPL ფასში შედის, თუმცა CDW-ს ფრანშიზა რჩება და
        კატეგორიაზეა დამოკიდებული — 300 ₾ ეკონომ კლასზე, 600 ₾ კროსოვერზე,
        800 ₾ კომერციულ ფურგონზე, 1000 ₾ ბიზნეს კლასსა და მინივენზე, 1200 ₾
        მაღალი გამავლობის 4x4-ზე — და არ ფარავს საბურავებს, დისკებს, ძარის
        ქვედა ნაწილს, სარკეებსა და სალონს; ერთი საბურავის შეცვლა 120–400 ₾
        ღირს. SCDW ცალკე, ფასიანი დამატებაა — დღეში 25–45 ₾ კატეგორიის
        მიხედვით. საწვავი სავსედან სავსემდე გაიცემა, ნაკლულ საწვავს კი
        20 ₾ მომსახურების საფასური ემატება. ჯარიმა მანქანის დაბრუნებიდან
        30 დღემდე შეიძლება მოვიდეს, რაც გრძელვადიან ვადაზე ხშირად უკვე
        დაბრუნების შემდეგ ხდება.
      good_to_know:
      - >-
        დაქირავების მაქსიმალური ვადა არ არსებობს. 30+ დღის ტარიფი ოცდაათი
        დღიდან მოქმედებს, რამდენ ხანსაც არ უნდა დაგრჩეთ მანქანა.
      - >-
        თარიღების შეცვლა უფასოა, თუ ახალ თარიღებზე მანქანა თავისუფალია.
        ვადამდე დაბრუნებისას თანხა ბრუნდება, მაგრამ მთელი ქირა ფაქტობრივად
        გამოყენებული დღეების ტარიფით გადაითვლება — ოცდაათდღიანი ჯავშნის
        მეოცე დღეს დასრულება 7–29 დღის ფასად ჩაითვლება და არა 30+ დღისად.
      - >-
        27 წლამდე მძღოლები ახალგაზრდა მძღოლის დანამატს ყოველ დღეზე იხდიან:
        დღეში 15 ₾ კროსოვერსა და მინივენზე 23–25 წლის ასაკში, დღეში 25 ₾
        ბიზნეს კლასსა და 4x4-ზე 25–27 წლის ასაკში — ოცდაათ დღეზე ეს 450 ₾ და
        750 ₾-ია. ეკონომ კლასზე დანამატი არ არის.
      - >-
        ივლისსა და აგვისტოში ფასს +15% სეზონური კოეფიციენტი ემატება, აღდგომისა
        და საახალწლო კვირებში კი +10%. თუ თქვენი თვე ერთ-ერთს ემთხვევა,
        წერილობითი შეთავაზება მოგვთხოვეთ.
      - >-
        დეპოზიტი გრძელვადიან ვადაზე არ მცირდება. ის იმავე ოდენობისაა, რაც
        ერთდღიან ჯავშანზე, იბლოკება ბარათზე ან ნაღდად აიღება და ადგილზევე
        ბრუნდება, ხოლო დაზიანების გარეშე დაბრუნებიდან 3 სამუშაო დღეში
        თავისუფლდება.
      - >-
        სამი ან მეტი მანქანა სამ თვეზე მეტი ხნით კომპანიებისთვის
        ინდივიდუალურად ფასდება, 12–36-თვიანი საოპერაციო ქირა კი ცალკე
        პროდუქტია. არცერთი მათგანი ზემოთ მოცემული ცხრილით არ ითვლება.
    ru:
      h1: Аренда авто на месяц в Грузии
      meta_title: Аренда авто на месяц в Грузии — от 56 ₾/день | RentUp
      meta_description: >-
        Аренда авто в Грузии на месяц и дольше от 56 ₾ в день, 1680 ₾ за
        тридцать дней. Реальные цены по категориям, депозиты и франшиза, без
        предоплаты.
      lead: >-
        С тридцатого дня каждая машина переходит на долгосрочный тариф — на
        24,4–25,3% ниже цены той же машины за 1–6 дней, и так по всем 17
        автомобилям. Самый доступный выходит в 56 ₾ в день, то есть 1680 ₾
        за месяц.
      pickup: >-
        При бронировании ничего не списывается. Заявку мы подтверждаем по
        телефону или почте, а оплата происходит при получении машины —
        независимо от срока аренды. Возьмите с собой паспорт (гражданам
        Грузии — удостоверение личности), водительское удостоверение со
        стажем не менее двух лет и карту для депозита: 300 ₾ на эконом-класс,
        600 ₾ на кроссовер, 800 ₾ на коммерческий фургон, 1000 ₾ на
        бизнес-класс и минивэн, 1200 ₾ на внедорожник 4x4. Если права
        напечатаны не латиницей, нужно и международное водительское
        удостоверение (IDP). Плата за доставку исчезает с пятого дня, поэтому
        на месячной аренде получение в офисе, доставка по любому адресу в
        Тбилиси и все три аэропорта бесплатны; Телави, Гори и Зугдиди стоят
        50 ₾, а передача на границе в Сарпи или Казбеги — от 120 ₾.
      getting_around: >-
        Пробег внутри Грузии не ограничен и остаётся таким при любом сроке —
        на тридцатом дне в самой езде не меняется ничего. Обслуживание и
        расходники, то есть масло, фильтры и шины, входят в тариф, так что
        обычный месяц стоит вам только топлива, а с 1 декабря по 1 апреля на
        каждой машине стоит зимняя резина. Техпомощь на дороге работает
        круглосуточно по всей стране; если техническая неисправность
        возникла не по вашей вине, подменную машину привезут в течение шести
        часов бесплатно. CDW и TPL входят в цену, но у CDW остаётся франшиза,
        и она зависит от категории — 300 ₾ эконом, 600 ₾ кроссовер, 800 ₾
        коммерческий фургон, 1000 ₾ бизнес-класс и минивэн, 1200 ₾
        внедорожник 4x4 — и она не покрывает шины, диски, днище, зеркала и
        салон; замена одной шины обходится в 120–400 ₾. SCDW — платная
        опция, 25–45 ₾ в день в зависимости от категории. Топливо по принципу
        «полный к полному»: за недостающее берут стоимость плюс сервисный
        сбор 20 ₾. Штраф может прийти в течение 30 дней после возврата машины
        — на долгой аренде это обычно уже после того, как вы её сдали.
      good_to_know:
      - >-
        Максимального срока аренды нет. Тариф «30+ дней» действует начиная с
        тридцатого дня и дальше, сколько бы вы ни держали машину.
      - >-
        Перенос дат бесплатен, если машина свободна на новые даты. Ранний
        возврат возвращается деньгами, но вся аренда пересчитывается по
        тарифу фактически использованных дней — закончив тридцатидневную
        бронь на двадцатый день, вы платите по ставке 7–29 дней, а не 30+.
      - >-
        Водители младше 27 лет платят надбавку за каждый день долгой аренды:
        15 ₾ в день на кроссовер и минивэн в возрасте 23–25 лет, 25 ₾ в день
        на бизнес-класс и 4x4 в возрасте 25–27 лет — за тридцать дней это
        450 ₾ и 750 ₾. На эконом-классе надбавки нет.
      - >-
        В июле и августе к цене применяется сезонный коэффициент +15%, на
        пасхальной и новогодней неделях +10%. Если ваш месяц попадает на них,
        попросите письменный расчёт.
      - >-
        Депозит не уменьшается оттого, что аренда длинная. Это та же сумма по
        категории, что и на однодневной брони: блокируется на карте или
        берётся наличными и возвращается на месте, а разблокируется в течение
        3 рабочих дней после возврата машины без повреждений.
      - >-
        Компаниям, которым нужно три и более машины дольше трёх месяцев, цену
        считают индивидуально, а операционная аренда на 12–36 месяцев — это
        отдельный продукт. Ни то, ни другое не считается по таблице выше.
    fa:
      h1: اجارهٔ ماهانه و بلندمدت خودرو در گرجستان
      meta_title: اجارهٔ ماهانهٔ خودرو در گرجستان — از 56 ₾ در روز | RentUp
      meta_description: >-
        خودرو را در گرجستان برای یک ماه یا بیشتر از 56 ₾ در روز اجاره کنید،
        1680 ₾ برای سی روز. قیمت واقعی هر رده، ودیعه، فرانشیز بیمه و بدون
        پیش‌پرداخت هنگام رزرو.
      lead: >-
        از روز سی‌ام هر خودرو به نرخ بلندمدت خود می‌رود؛ یعنی 24.4% تا 25.3%
        کمتر از قیمت 1 تا 6 روزهٔ همان خودرو، در هر 17 خودروی ناوگان.
        ارزان‌ترین گزینه روزی 56 ₾ در می‌آید، یعنی 1680 ₾ برای یک ماه.
      pickup: >-
        هنگام رزرو هیچ مبلغی گرفته نمی‌شود. درخواست را تلفنی یا با ایمیل تأیید
        می‌کنیم و پرداخت هنگام تحویل خودرو انجام می‌شود، هر چقدر هم که مدت
        اجاره باشد. پاسپورت (شهروندان گرجستان، کارت شناسایی)، گواهینامه‌ای که
        دست‌کم دو سال از صدور آن گذشته باشد و یک کارت برای ودیعه همراه بیاورید:
        300 ₾ برای کلاس اقتصادی، 600 ₾ برای کراس‌اوور، 800 ₾ برای ون تجاری،
        1000 ₾ برای کلاس بیزنس و مینی‌ون و 1200 ₾ برای آفرود 4x4. اگر
        گواهینامهٔ شما با حروف لاتین چاپ نشده است، گواهینامهٔ بین‌المللی (IDP)
        را هم بیاورید. هزینهٔ تحویل از روز پنجم حذف می‌شود، پس در اجارهٔ ماهانه
        تحویل‌گیری از دفتر، تحویل به هر نشانی در تفلیس و هر سه فرودگاه رایگان
        است؛ تلاوی، گوری و زوگدیدی 50 ₾ و تحویل در مرز ساربی یا کازبگی از
        120 ₾ شروع می‌شود.
      getting_around: >-
        کیلومتر در داخل گرجستان نامحدود است و در هر مدتی نامحدود می‌ماند؛ در روز
        سی‌ام چیزی در خود رانندگی تغییر نمی‌کند. سرویس دوره‌ای و قطعات مصرفی،
        یعنی روغن، فیلتر و لاستیک، در نرخ گنجانده شده است، بنابراین یک ماه
        رانندگی معمولی فقط هزینهٔ سوخت دارد، و از 1 دسامبر تا 1 آوریل روی هر
        خودرو لاستیک زمستانی بسته می‌شود. امدادرسانی جاده‌ای شبانه‌روزی و در
        سراسر کشور کار می‌کند؛ اگر خرابی فنی تقصیر شما نباشد، خودروی جایگزین
        ظرف شش ساعت و رایگان می‌رسد. CDW و TPL در نرخ گنجانده شده است، اما CDW
        فرانشیزی باقی می‌گذارد که به رده بستگی دارد: 300 ₾ اقتصادی، 600 ₾
        کراس‌اوور، 800 ₾ ون تجاری، 1000 ₾ بیزنس و مینی‌ون، 1200 ₾ آفرود 4x4؛
        و لاستیک، رینگ، کف خودرو، آینه‌ها و داخل کابین را پوشش نمی‌دهد، جایی که
        تعویض یک لاستیک 120 تا 400 ₾ هزینه دارد. SCDW یک ارتقای پولی جداگانه
        است، روزی 25 تا 45 ₾ بسته به رده. سوخت «پر تحویل، پر برگشت» است و برای
        کمبود آن بهای سوخت به‌علاوهٔ 20 ₾ هزینهٔ خدمات گرفته می‌شود. جریمهٔ
        رانندگی تا 30 روز پس از بازگرداندن خودرو ممکن است برسد، که در اجاره‌های
        بلند معمولاً بعد از تحویل دادن خودرو اتفاق می‌افتد.
      good_to_know:
      - >-
        حداکثری برای مدت اجاره وجود ندارد. نرخ «30 روز به بالا» از روز سی‌ام به
        بعد اعمال می‌شود، هر چقدر هم که خودرو را نگه دارید.
      - >-
        تغییر تاریخ رایگان است اگر خودرو در تاریخ‌های تازه آزاد باشد. بازگرداندن
        زودهنگام بازپرداخت می‌شود، اما کل اجاره با نرخ روزهایی که واقعاً استفاده
        شده دوباره حساب می‌شود؛ اگر رزرو سی‌روزه را روز بیستم تمام کنید، با نرخ
        7 تا 29 روز حساب می‌شود، نه نرخ 30 روز به بالا.
      - >-
        رانندگان زیر 27 سال هزینهٔ رانندهٔ جوان را برای هر روز اجارهٔ بلند
        می‌پردازند: روزی 15 ₾ برای کراس‌اوور و مینی‌ون در سنین 23 تا 25 سال و
        روزی 25 ₾ برای کلاس بیزنس و 4x4 در سنین 25 تا 27 سال، یعنی 450 ₾ و
        750 ₾ در سی روز. کلاس اقتصادی این هزینه را ندارد.
      - >-
        در ژوئیه و اوت ضریب فصلی 15%+ و در هفته‌های عید پاک و سال نو 10%+ به
        قیمت اضافه می‌شود. اگر ماه شما با یکی از این‌ها هم‌پوشانی دارد، پیشنهاد
        کتبی بخواهید.
      - >-
        ودیعه به دلیل بلند بودن مدت اجاره کم نمی‌شود. همان مبلغ ردهٔ خودرو است
        که در رزرو یک‌روزه هم گرفته می‌شود، روی کارت بلوکه یا نقدی دریافت و
        همان‌جا برگردانده می‌شود، و ظرف 3 روز کاری پس از بازگشت بی‌آسیب خودرو
        آزاد می‌گردد.
      - >-
        برای شرکت‌هایی که سه خودرو یا بیشتر را بیش از سه ماه می‌خواهند، قیمت
        جداگانه محاسبه می‌شود، و اجارهٔ عملیاتی 12 تا 36 ماهه محصولی جداست.
        هیچ‌کدام با جدول بالا قیمت‌گذاری نمی‌شود.
    he:
      h1: השכרת רכב לחודש ולטווח ארוך בגאורגיה
      meta_title: השכרת רכב לחודש בגאורגיה — החל מ-56 ₾ ליום | RentUp
      meta_description: >-
        השכירו רכב בגאורגיה לחודש או יותר החל מ-56 ₾ ליום, 1680 ₾ לשלושים
        יום. מחירים אמיתיים לכל קטגוריה, פיקדון, השתתפות עצמית וללא תשלום
        מראש בהזמנה.
      lead: >-
        מהיום השלושים כל רכב עובר לתעריף הארוך שלו, כלומר 24.4% עד 25.3% פחות
        ממחיר 1 עד 6 ימים של אותו רכב, בכל 17 הרכבים בצי. הזול ביותר יוצא
        56 ₾ ליום, כלומר 1680 ₾ לחודש.
      pickup: >-
        בהזמנה לא נגבה דבר. את הבקשה אנחנו מאשרים בטלפון או במייל, והתשלום
        מתבצע באיסוף הרכב, לא משנה לכמה זמן השכרתם. הביאו דרכון (אזרחי
        גאורגיה, תעודת זהות), רישיון נהיגה שברשותכם שנתיים לפחות, וכרטיס
        לפיקדון: 300 ₾ במחלקת אקונומי, 600 ₾ בקרוסאובר, 800 ₾ בוואן מסחרי,
        1000 ₾ במחלקת עסקים ובמיניוואן ו-1200 ₾ ברכב שטח 4x4. אם הרישיון שלכם
        אינו מודפס באותיות לטיניות, הביאו איתו גם רישיון נהיגה בינלאומי (IDP).
        דמי המשלוח נעלמים מהיום החמישי, ולכן בהשכרה חודשית האיסוף מהמשרד,
        האספקה לכל כתובת בטביליסי ושלושת שדות התעופה הם ללא תשלום; טלאווי,
        גורי וזוגדידי עולים 50 ₾, ומסירה במעבר הגבול בסארפי או בקזבגי מתחילה
        ב-120 ₾.
      getting_around: >-
        הקילומטראז' בתוך גאורגיה אינו מוגבל ונשאר כזה בכל אורך השכרה; ביום
        השלושים שום דבר בנסיעה עצמה לא משתנה. טיפולים ופריטי בלאי, כלומר שמן,
        מסננים וצמיגים, כלולים בתעריף, כך שחודש נהיגה רגיל עולה לכם דלק בלבד,
        ומ-1 בדצמבר עד 1 באפריל כל רכב מצויד בצמיגי חורף. שירותי דרך פועלים
        מסביב לשעון בכל הארץ; אם תקלה טכנית שאינה באשמתכם משביתה את הרכב, רכב
        חלופי מגיע תוך שש שעות וללא תשלום. CDW ו-TPL כלולים בתעריף, אבל CDW
        משאיר השתתפות עצמית שמשתנה לפי קטגוריה: 300 ₾ אקונומי, 600 ₾ קרוסאובר,
        800 ₾ ואן מסחרי, 1000 ₾ מחלקת עסקים ומיניוואן, 1200 ₾ רכב שטח 4x4, והיא
        אינה מכסה צמיגים, חישוקים, תחתית הרכב, מראות ופנים הרכב, כשהחלפת צמיג
        עולה 120 עד 400 ₾. SCDW הוא שדרוג בתשלום, 25 עד 45 ₾ ליום לפי קטגוריה.
        הדלק הוא מלא למלא, ועל חוסר נגבה מחיר הדלק בתוספת דמי טיפול של 20 ₾.
        דוח תנועה יכול להגיע עד 30 יום אחרי החזרת הרכב, ובהשכרה ארוכה זה בדרך
        כלל כבר אחרי שהחזרתם אותו.
      good_to_know:
      - >-
        אין אורך השכרה מרבי. תעריף 30 יום ומעלה חל מהיום השלושים והלאה, כמה
        שלא תחזיקו את הרכב אחר כך.
      - >-
        שינוי תאריכים אינו עולה דבר אם הרכב פנוי בתאריכים החדשים. החזרה מוקדמת
        מזוכה, אבל כל ההשכרה מחושבת מחדש לפי התעריף של הימים שנוצלו בפועל, כך
        שסיום הזמנה של 30 יום ביום העשרים מחויב בתעריף 7 עד 29 יום ולא בתעריף
        30 יום ומעלה.
      - >-
        נהגים מתחת לגיל 27 משלמים תוספת נהג צעיר על כל יום של השכרה ארוכה:
        15 ₾ ליום בקרוסאובר ובמיניוואן בגילי 23 עד 25, ו-25 ₾ ליום במחלקת
        עסקים וברכבי 4x4 בגילי 25 עד 27, כלומר 450 ₾ ו-750 ₾ לשלושים יום.
        במחלקת אקונומי אין תוספת.
      - >-
        ביולי ובאוגוסט מתווסף מקדם עונתי של 15%+, ובשבועות הפסחא והשנה החדשה
        10%+. אם החודש שלכם נופל על אחד מהם, בקשו הצעת מחיר בכתב.
      - >-
        הפיקדון אינו קטן בגלל שההשכרה ארוכה. זהו אותו סכום לפי קטגוריה כמו
        בהזמנה ליום אחד, נחסם בכרטיס או נלקח במזומן ומוחזר במקום, ומשוחרר תוך
        3 ימי עסקים מרגע שהרכב חוזר ללא נזק.
      - >-
        לחברות שלוקחות שלושה רכבים או יותר ליותר משלושה חודשים המחיר נקבע
        פרטנית, והשכרה תפעולית ל-12 עד 36 חודשים היא מוצר נפרד. אף אחד משניהם
        אינו מתומחר לפי הטבלה שלמעלה.
    ar:
      h1: تأجير السيارات الشهري وطويل الأمد في جورجيا
      meta_title: تأجير سيارة شهرياً في جورجيا — من 56 ₾ يومياً | RentUp
      meta_description: >-
        استأجر سيارة في جورجيا لشهر أو أكثر من 56 ₾ في اليوم، أي 1680 ₾ لثلاثين
        يوماً. أسعار حقيقية لكل فئة، ووديعة، وتحمّل تأميني، ودون دفع مسبق عند
        الحجز.
      lead: >-
        من اليوم الثلاثين تنتقل كل سيارة إلى تعرفتها طويلة الأمد، أي أقل بنسبة
        24.4% إلى 25.3% من سعر السيارة نفسها لمدة 1 إلى 6 أيام، في كل سيارات
        الأسطول السبع عشرة. أرخص خيار يبلغ 56 ₾ في اليوم، أي 1680 ₾ للشهر.
      pickup: >-
        لا يُخصم شيء عند الحجز. نؤكد الطلب هاتفياً أو بالبريد الإلكتروني، ويتم
        الدفع عند استلام السيارة مهما طالت مدة الإيجار. أحضر جواز السفر
        (لمواطني جورجيا، بطاقة الهوية)، ورخصة قيادة مضى على إصدارها سنتان على
        الأقل، وبطاقة للوديعة: 300 ₾ للفئة الاقتصادية، و600 ₾ للكروس أوفر،
        و800 ₾ للفان التجاري، و1000 ₾ لفئة رجال الأعمال والميني فان، و1200 ₾
        للدفع الرباعي 4x4. وإن لم تكن رخصتك مطبوعة بالحروف اللاتينية، أحضر معها
        رخصة القيادة الدولية (IDP). رسوم التوصيل تسقط اعتباراً من اليوم الخامس،
        لذا في الإيجار الشهري يكون الاستلام من المكتب والتوصيل إلى أي عنوان في
        تبليسي والمطارات الثلاثة كلها مجاناً؛ أما تيلافي وغوري وزوغديدي فتكلف
        50 ₾، والتسليم عند معبر ساربي أو كازبيغي يبدأ من 120 ₾.
      getting_around: >-
        المسافة المقطوعة داخل جورجيا غير محدودة وتبقى كذلك مهما طالت المدة؛ لا
        يتغير شيء في القيادة نفسها عند اليوم الثلاثين. الصيانة وقطع الاستهلاك،
        أي الزيت والفلاتر والإطارات، مشمولة في التعرفة، فشهر من القيادة
        الاعتيادية يكلفك الوقود فقط، ومن 1 ديسمبر إلى 1 أبريل تُركّب إطارات
        شتوية على كل سيارة. المساعدة على الطريق تعمل على مدار الساعة في أنحاء
        البلاد؛ وإذا تعطلت السيارة لخلل فني ليس بسببك، تصل سيارة بديلة خلال ست
        ساعات ودون رسوم. تشمل التعرفة CDW وTPL، لكن CDW يترك تحمّلاً تأميناً
        يختلف بحسب الفئة: 300 ₾ للاقتصادية، و600 ₾ للكروس أوفر، و800 ₾ للفان
        التجاري، و1000 ₾ لفئة رجال الأعمال والميني فان، و1200 ₾ للدفع الرباعي
        4x4، وهو لا يغطي الإطارات والجنوط وأسفل الهيكل والمرايا والمقصورة، حيث
        يكلف تبديل إطار واحد من 120 إلى 400 ₾. أما SCDW فهو ترقية مدفوعة
        منفصلة، من 25 إلى 45 ₾ في اليوم بحسب الفئة. الوقود ممتلئ عند التسليم
        وممتلئ عند الإعادة، وإن نقص يُحتسب ثمنه إضافة إلى رسم خدمة قدره 20 ₾.
        وقد تصل مخالفة السير حتى 30 يوماً بعد إعادة السيارة، وهو في الإيجارات
        الطويلة يحدث عادةً بعد أن تكون قد سلّمتها.
      good_to_know:
      - >-
        لا يوجد حد أقصى لمدة الإيجار. تسري تعرفة 30 يوماً فأكثر من اليوم
        الثلاثين فصاعداً، مهما طالت مدة احتفاظك بالسيارة بعد ذلك.
      - >-
        تغيير التواريخ مجاني إذا كانت السيارة متاحة في التواريخ الجديدة. وتُردّ
        قيمة الإعادة المبكرة، لكن يُعاد حساب الإيجار كله بتعرفة الأيام
        المستخدمة فعلياً، فإنهاء حجز من 30 يوماً في اليوم العشرين يُحتسب بتعرفة
        7 إلى 29 يوماً لا بتعرفة 30 يوماً فأكثر.
      - >-
        يدفع السائقون دون سن 27 رسم السائق الصغير عن كل يوم من الإيجار الطويل:
        15 ₾ يومياً على الكروس أوفر والميني فان في سن 23 إلى 25، و25 ₾ يومياً
        على فئة رجال الأعمال والدفع الرباعي في سن 25 إلى 27، أي 450 ₾ و750 ₾
        على مدى ثلاثين يوماً. ولا يوجد رسم على الفئة الاقتصادية.
      - >-
        يُضاف معامل موسمي قدره 15%+ في يوليو وأغسطس، و10%+ في أسبوعي عيد الفصح
        ورأس السنة. إن وقع شهرك على أحدهما، فاطلب عرض سعر مكتوباً.
      - >-
        لا تنخفض الوديعة لأن الإيجار طويل. هي المبلغ نفسه بحسب الفئة كما في حجز
        ليوم واحد، يُحجز على البطاقة أو يؤخذ نقداً ويُعاد في المكان، ويُفرج عنه
        خلال 3 أيام عمل من إعادة السيارة دون أضرار.
      - >-
        الشركات التي تأخذ ثلاث سيارات أو أكثر لمدة تزيد على ثلاثة أشهر يُحدَّد
        سعرها بشكل فردي، والإيجار التشغيلي من 12 إلى 36 شهراً منتج منفصل. ولا
        يُسعَّر أي منهما وفق الجدول أعلاه.
