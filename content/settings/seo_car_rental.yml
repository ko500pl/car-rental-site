    ru:
      h1: Аренда авто с водителем в Грузии
      meta_title: Аренда авто с водителем в Грузии — 120 ₾ в день | RentUp
      meta_description: >-
        Авто с водителем в Грузии: 120 ₾ в день за восемь часов, сверхурочные
        20 ₾ в час, на бизнес-классе, минивэнах и внедорожниках 4x4. Без
        предоплаты.
      lead: >-
        Услуга водителя стоит 120 ₾ в день за восьмичасовой день, каждый
        следующий час — 20 ₾, сверх дневного тарифа самой машины. Она доступна
        на бизнес-классе, минивэнах и внедорожниках 4x4 — отметьте «Нужен
        водитель» в форме бронирования, и мы подтвердим машину и водителя
        вместе.
      pickup: >-
        Забронируйте машину как обычно и отметьте «Нужен водитель»; водителя мы
        назначаем, когда подтверждаем наличие по телефону или почте, а до
        получения ничего не списывается. 120 ₾ покрывают восемь часов рабочего
        дня водителя — более длинный день считается по 20 ₾ за час сверху, так
        что двенадцатичасовой день обходится в 200 ₾ за водителя. Машина
        считается отдельно по своему тарифу: бизнес-класс от 210 ₾ в день,
        минивэн от 200 ₾, внедорожник 4x4 от 240 ₾, то есть самая доступная
        машина с водителем выходит в 320 ₾ за восьмичасовой день. Где машина
        вас встречает, определяет таблица доставки: наш офис и любой адрес в
        Тбилиси бесплатны, аэропорт Тбилиси — 40 ₾ при аренде на 1–2 дня и
        бесплатно с третьего дня, аэропорт Кутаиси — 60 ₾, аэропорт Батуми —
        50 ₾ до четырёх дней и бесплатно с пятого. Выдача между 22:00 и 07:00
        добавляет ночную доплату 40 ₾.
      getting_around: >-
        Пробег по Грузии не ограничен, так что день с водителем в Казбеги,
        Кахетию или Кутаиси считается по часам, а не по километрам, и
        единственный расход сверх тарифа — топливо: машина выдаётся с полным
        баком и возвращается с полным, иначе берут стоимость недостающего
        топлива плюс сервисный сбор 20 ₾. Техпомощь на дороге работает
        круглосуточно по всей стране, а при технической неисправности не по
        вине арендатора подменную машину привезут в течение шести часов
        бесплатно. Многодневные поездки — та же арифметика: 120 ₾ за каждый
        день водителя плюс дневной тариф машины, причём машина переходит на
        цену 7–29 дней с седьмого дня и на цену 30+ дней с тридцатого. Если
        кто-то из вашей компании хочет сесть за руль на части маршрута, он
        должен быть вписан в договор и соответствовать требованиям категории по
        возрасту и стажу — 25 лет и пять лет стажа на бизнес-классе, 23 года и
        три года на минивэне, 25 лет и четыре года на внедорожнике 4x4, —
        потому что страховка не покрывает управление лицом, не указанным в
        договоре водителем.
      good_to_know:
      - >-
        Тариф считается за день водителя: 120 ₾ за восемь часов, затем 20 ₾ за
        каждый следующий час. Два восьмичасовых дня — 240 ₾ за водителя плюс
        машина на два дня.
      - >-
        Водитель предлагается на трёх категориях — бизнес-класс, минивэны и
        внедорожники 4x4, — но не на эконом-классе и кроссоверах.
      - >-
        Запрос идёт через обычную форму бронирования с отмеченным пунктом
        «Нужен водитель» или по телефону. Мы подтверждаем по телефону или
        почте, и до получения ничего не оплачивается.
      - >-
        Выдача или возврат между 22:00 и 07:00 идёт с ночной доплатой 40 ₾ —
        так же, как при аренде без водителя.
      - >-
        Детские кресла стоят 10 ₾ в день в трёх возрастных группах — 0–3, 3–7 и
        7–12 лет, — и по закону Грузии ребёнок до 12 лет должен ехать в кресле,
        с водителем или без.
      - >-
        Тот, кто хочет вести машину на части пути, должен быть вписан в договор
        и соответствовать требованиям категории по возрасту и стажу; управление
        не вписанным в договор лицом страховка не покрывает.
      - >-
        Встреча в аэропорту Тбилиси, Кутаиси или Батуми считается по таблице
        доставки, точно так же, как при аренде без водителя — см. страницу
        получения в аэропорту.
