        أياً كانت شركة الطيران؛ ويجري التسليم في موقف سيارات المبنى بالفحص
        نفسه والأوراق نفسها كما في الاستلام من المكتب: محضر تسليم بصور جوانب
        السيارة الأربعة والمقصورة وعداد المسافة ومستوى الوقود. التسليم يعمل على
        مدار 24 ساعة؛ والهبوط بين الساعة 22:00 و07:00 يضيف رسم ليل 40 ₾، وينطبق
        الأمر نفسه على الإرجاع الليلي. يعتمد رسم التوصيل على المطار ومدة
        الإيجار: مطار تبليسي 40 ₾ في إيجار من 1 إلى 2 يوم ومجاناً من اليوم
        الثالث؛ ومطار كوتايسي 60 ₾ ومطار باتومي 50 ₾ حتى أربعة أيام ومجاناً من
        اليوم الخامس. أحضر جواز السفر (لمواطني جورجيا، بطاقة الهوية)، ورخصة
        قيادة مضى على إصدارها سنتان على الأقل، مع رخصة القيادة الدولية (IDP) إن
        لم تكن مطبوعة بالحروف اللاتينية، وبطاقة للوديعة: 300 ₾ للاقتصادية،
        و600 ₾ للكروس أوفر، و800 ₾ للفان التجاري، و1000 ₾ لفئة رجال الأعمال
        والميني فان، و1200 ₾ للدفع الرباعي 4x4. لا يُدفع شيء عند الحجز؛ الدفع
        عند الاستلام.
      getting_around: >-
        كل مطار يقودك في اتجاه مختلف. يقع مطار تبليسي على نحو 13 كم شرق المركز
        على طريق كاخيتي السريع، فتبدأ جولة منطقة النبيذ من دون عبور المدينة،
        والطريق الدائري يتجاوزها كلياً. ويبعد مطار كوتايسي نحو 21 كم عن كوتايسي
        نفسها، وهو أقرب إلى فاني منه إلى مركز المدينة، وطرقه تفضي مباشرة إلى
        إيميريتي ثم إلى الساحل أو سفانيتي. أما مطار باتومي فلا يبعد سوى نحو 5 كم
        جنوب وسط باتومي، وهو أقرب بعدُ إلى معبر ساربي الحدودي إلى تركيا؛ والرحلة
        إلى تركيا ممكنة بترتيب مسبق قبل 48 ساعة، بـ 250 ₾ على فئات مختارة، وإلا
        بقيت السيارة داخل جورجيا. المسافة المقطوعة داخل جورجيا غير محدودة،
        والوقود ممتلئ عند التسليم وممتلئ عند الإعادة وإن نقص يُحتسب ثمنه إضافة
        إلى رسم خدمة قدره 20 ₾، وتشمل التعرفة CDW وTPL مع تحمّل تأميني بحسب
        الفئة: 300 ₾ للاقتصادية، و600 ₾ للكروس أوفر، و800 ₾ للفان التجاري،
        و1000 ₾ لفئة رجال الأعمال والميني فان، و1200 ₾ للدفع الرباعي 4x4، ويُصفّره
        SCDW مقابل 25 إلى 45 ₾ في اليوم. المساعدة على الطريق تعمل على مدار
        الساعة في أنحاء البلاد.
      good_to_know:
      - >-
        مطار تبليسي هو الأرخص بين الثلاثة بـ 40 ₾ ويصبح مجانياً من اليوم الثالث؛
        وكوتايسي (60 ₾) وباتومي (50 ₾) يصبحان مجانيين من اليوم الخامس. في إيجار
        لأسبوع تكون المطارات الثلاثة كلها مجاناً.
      - >-
        الرحلات إلى تبليسي ورحلات الطيران الاقتصادي إلى كوتايسي كثيراً ما تهبط
        متأخرة؛ وفي هذه الحال توقّع رسم الليل 40 ₾ عن الفترة من 22:00 إلى
        07:00، فوق رسم التوصيل.
      - >-
        إن كنت تسافر من مدينة أخرى: الإرجاع باتجاه واحد بين تبليسي وكوتايسي
        وباتومي يكلف 100 ₾؛ انظر صفحة الإيجار باتجاه واحد.
      - >-
        عند الإرجاع إلى المطار للحاق برحلة: التأخر حتى ساعتين مجاني، ثم ثلث
        التعرفة اليومية عن كل ثلاث ساعات تبدأ، والتأخر أكثر من ثماني ساعات
        يُحتسب يوماً إضافياً كاملاً.
      - >-
        تُسلَّم السيارة بخزان ممتلئ؛ أعدها ممتلئة في المطار، وإلا احتُسب ثمن
        الوقود الناقص إضافة إلى رسم خدمة قدره 20 ₾.
      - >-
        لكل مطار صفحته الخاصة بالطرق الخارجة منه وأقرب الأماكن إليه: مطار
        تبليسي ومطار كوتايسي ومطار باتومي.
      - >-
        الإلغاء قبل أكثر من 48 ساعة مجاني، وقبل 24 إلى 48 ساعة يُحتسب تعرفة يوم
        واحد، وقبل أقل من 24 ساعة أو عند عدم الحضور تعرفة يومين. وتغيير
        التواريخ مجاني إذا كانت السيارة متاحة في التواريخ الجديدة.
