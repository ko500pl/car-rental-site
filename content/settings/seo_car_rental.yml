      h1: Airport Car Rental in Georgia — Tbilisi, Kutaisi and Batumi
      answer: >-
        RentUp delivers rental cars to all three international airports in Georgia and meets you at
        arrivals with a name sign: Tbilisi (TBS) costs 40 ₾ and is free from the third rental day;
        Batumi (BUS) 50 ₾ and Kutaisi (KUT) 60 ₾, both free from the fifth day. Handover runs 24 hours;
        a pickup or return between 22:00 and 07:00 adds a 40 ₾ night surcharge. Give your flight number
        when booking and bring a passport, licence and a card for the 300–1,200 ₾ deposit. A one-way
        return between the three cities costs 100 ₾.
      meta_title: Airport Car Rental in Georgia — TBS, KUT and BUS | RentUp
      meta_description: >-
        Meet-and-greet car rental at Tbilisi, Kutaisi and Batumi airports: 40,
        60 or 50 ₾ delivery, free on longer rentals, 24-hour handover, 40 ₾
        night surcharge.
      lead: >-
        We meet arrivals at all three international airports with the car
        ready — Tbilisi (TBS) for 40 ₾, Batumi (BUS) for 50 ₾, Kutaisi (KUT)
        for 60 ₾ — and on longer rentals the fee falls away altogether.
      pickup: >-
        Give us your flight number when you book and we wait at arrivals with
        a name sign, whatever the airline; the handover happens in the terminal
        car park with the same walk-around and paperwork as an office pickup —
        a handover report with photos of all four sides, the interior, the
        odometer and the fuel level. Handover runs 24 hours a day; landing
        between 22:00 and 07:00 adds a 40 ₾ night surcharge, and the same
        applies to a night return. The delivery fee depends on the airport and
        the rental length: Tbilisi Airport is 40 ₾ on a 1–2 day rental and free
        from the third day; Kutaisi Airport is 60 ₾ and Batumi Airport 50 ₾ up
        to four days and free from the fifth. Bring a passport (Georgian
        citizens, an ID card), a driving licence held for at least two years —
        with an International Driving Permit if it is not printed in the Latin
        alphabet — and a card for the deposit: 300 ₾ economy, 600 ₾ crossover,
        800 ₾ commercial van, 1000 ₾ business class and minivan, 1200 ₾
        off-road 4x4. Nothing is paid when you book; payment is at pickup.
      getting_around: >-
        Each airport points a different way. Tbilisi Airport sits about 13 km
        east of the centre on the Kakheti highway, so a wine-region loop starts
        without crossing the city and the ring road skips it entirely. Kutaisi
        Airport is about 21 km from Kutaisi itself, nearer Vani than the city
        centre, and its roads feed straight into Imereti and on to the coast or
        Svaneti. Batumi Airport is only about 5 km south of central Batumi and
        closer still to the Sarpi border crossing into Turkey — a trip into
        Turkey is possible with 48 hours' notice, 250 ₾ on selected categories,
        otherwise the car stays inside Georgia. Mileage inside Georgia is
        unlimited, fuel is full to full with the fuel plus a 20 ₾ service fee
        charged if the tank comes back short, and CDW and TPL are included in
        the rate with an excess by category — 300 ₾ economy, 600 ₾ crossover,
        800 ₾ commercial van, 1000 ₾ business class and minivan, 1200 ₾
        off-road 4x4 — which SCDW reduces to zero for 25–45 ₾ a day. Roadside
        assistance runs 24/7 nationwide.
      good_to_know:
      - >-
        Tbilisi Airport is the cheapest of the three at 40 ₾ and becomes free
        from the third day; Kutaisi (60 ₾) and Batumi (50 ₾) become free from
        the fifth. On a week's rental every airport is free.
      - >-
        Flights into Tbilisi and the low-cost slots into Kutaisi often land
        late; the 40 ₾ night surcharge for 22:00–07:00 is the charge to expect
        in that case, on top of any delivery fee.
      - >-
        Flying out of a different city: a one-way return between Tbilisi,
        Kutaisi and Batumi costs 100 ₾ — see the one-way page.
      - >-
        Returning to the airport for a flight: up to two hours late is free,
        then one third of the daily rate for every three hours started, and
        more than eight hours counts as a full extra day.
      - >-
        The car goes out with a full tank; return it full at the airport, or
        the missing fuel is charged plus a 20 ₾ service fee.
      - >-
        Each airport has its own page with the roads out and the nearest
        places: Tbilisi Airport, Kutaisi Airport and Batumi Airport.
      - >-
        Cancellation is free more than 48 hours ahead, one day's rate at 24–48
        hours, two days' rate under 24 hours or for a no-show. Changing the
        dates is free if the car is free on the new ones.
    ka:
      h1: მანქანის გაქირავება აეროპორტში — თბილისი, ქუთაისი, ბათუმი
      answer: >-
        RentUp მანქანას საქართველოს სამივე საერთაშორისო აეროპორტში მოგაწვდით და ჩამოსვლისას სახელიანი
        დაფით დაგხვდებათ: თბილისში (TBS) მიწოდება 40 ₾-ია და მესამე დღიდან უფასო; ბათუმში (BUS) 50 ₾ და
        ქუთაისში (KUT) 60 ₾ — ორივე მეხუთე დღიდან უფასო. გადაცემა 24 საათი მუშაობს; აღება ან დაბრუნება
        22:00-დან 07:00-მდე 40 ₾ ღამის დანამატს ამატებს. ჯავშნისას გვითხარით ფრენის ნომერი და თან
        იქონიეთ პასპორტი, მართვის მოწმობა და ბარათი 300–1200 ₾ დეპოზიტისთვის. ერთი მიმართულებით
        დაბრუნება სამ ქალაქს შორის 100 ₾ ღირს.
      meta_title: მანქანის გაქირავება აეროპორტში — TBS, KUT და BUS | RentUp
      meta_description: >-
        შეხვედრა ჩამოსვლისას თბილისის, ქუთაისისა და ბათუმის აეროპორტში — 40, 60
        ან 50 ₾ მიწოდება, გრძელ ვადაზე უფასო, გადაცემა 24 საათი 40 ₾ ღამის
        დანამატით.
      lead: >-
        სამივე საერთაშორისო აეროპორტში ჩამოსვლისას მზა მანქანით შეგხვდებით —
        თბილისში (TBS) 40 ₾-ად, ბათუმში (BUS) 50 ₾-ად, ქუთაისში (KUT) 60 ₾-ად —
        გრძელ ვადაზე კი საფასური საერთოდ ქრება.
      pickup: >-
        ჯავშნისას გვითხარით ფრენის ნომერი და ჩამოსვლისას სახელიანი დაფით
        დაგელოდებით, რომელი ავიახაზითაც არ უნდა ჩამოხვიდეთ; გადაცემა ტერმინალის
        ავტოსადგომზე ხდება, ისეთივე დათვალიერებითა და დოკუმენტაციით, როგორც
        ოფისში აღებისას — მიღება-ჩაბარების აქტით, რომელშიც ოთხივე მხარეს,
        სალონს, გარბენსა და საწვავის დონეს ვიღებთ. გადაცემა 24 საათი მუშაობს;
        ჩამოსვლა 22:00-დან 07:00-მდე 40 ₾ ღამის დანამატს ითვალისწინებს და იგივე
        ღამით დაბრუნებაზეც ვრცელდება. მიწოდების საფასური აეროპორტსა და ვადაზეა
        დამოკიდებული: თბილისის აეროპორტში 1–2-დღიან ქირაზე 40 ₾-ია და მესამე
        დღიდან უფასო; ქუთაისის აეროპორტში 60 ₾ და ბათუმის აეროპორტში 50 ₾ ოთხ
        დღემდე და მეხუთე დღიდან უფასო. თან იქონიეთ პასპორტი (საქართველოს
        მოქალაქეებმა — პირადობის მოწმობა), სულ მცირე ორი წლის მართვის მოწმობა —
        საერთაშორისო მართვის მოწმობასთან (IDP) ერთად, თუ ლათინური ასოებით არ
        არის დაბეჭდილი — და ბარათი დეპოზიტისთვის: 300 ₾ ეკონომ კლასზე, 600 ₾
        კროსოვერზე, 800 ₾ კომერციულ ფურგონზე, 1000 ₾ ბიზნეს კლასსა და
        მინივენზე, 1200 ₾ მაღალი გამავლობის 4x4-ზე. ჯავშნისას არაფერი იხდება —
        გადახდა აღებისას ხდება.
      getting_around: >-
        თითოეული აეროპორტი სხვა მიმართულებით გიშვებთ. თბილისის აეროპორტი
        ცენტრიდან დაახლოებით 13 კმ-ით აღმოსავლეთით, კახეთის გზატკეცილზეა,
        ამიტომ ღვინის რეგიონის მარშრუტი ქალაქის გავლის გარეშე იწყება, შემოვლითი
        გზა კი მას მთლიანად გამოტოვებს. ქუთაისის აეროპორტი თავად ქუთაისიდან
        დაახლოებით 21 კმ-შია, ვანთან უფრო ახლოს, ვიდრე ქალაქის ცენტრთან, და
        მისი გზები პირდაპირ იმერეთში და შემდეგ სანაპიროსკენ ან სვანეთისკენ
        გადის. ბათუმის აეროპორტი ცენტრალური ბათუმიდან მხოლოდ დაახლოებით 5 კმ-ით
        სამხრეთითაა და კიდევ უფრო ახლოს — სარფის სასაზღვრო პუნქტთან თურქეთისკენ;
        თურქეთში გასვლა 48 საათით ადრე შეთანხმებით შესაძლებელია, 250 ₾ შერჩეულ
        კატეგორიებზე, წინააღმდეგ შემთხვევაში მანქანა საქართველოში რჩება.
        გარბენი საქართველოში შეუზღუდავია, საწვავი სავსედან სავსემდე გაიცემა და
        ნაკლულ საწვავს 20 ₾ მომსახურების საფასური ემატება, CDW და TPL კი ფასში
        შედის ფრანშიზით კატეგორიის მიხედვით — 300 ₾ ეკონომ კლასზე, 600 ₾
        კროსოვერზე, 800 ₾ კომერციულ ფურგონზე, 1000 ₾ ბიზნეს კლასსა და
        მინივენზე, 1200 ₾ მაღალი გამავლობის 4x4-ზე — რომელსაც SCDW დღეში
        25–45 ₾-ად ნულამდე ამცირებს. საგზაო დახმარება 24/7 მუშაობს მთელი ქვეყნის
        მასშტაბით.
      good_to_know:
      - >-
        თბილისის აეროპორტი სამიდან ყველაზე იაფია — 40 ₾ — და მესამე დღიდან
        უფასო ხდება; ქუთაისი (60 ₾) და ბათუმი (50 ₾) მეხუთე დღიდან. ერთკვირიან
        ქირაზე სამივე აეროპორტი უფასოა.
      - >-
        თბილისში ფრენები და ქუთაისში დაბალბიუჯეტიანი რეისები ხშირად გვიან
        ჩამოდის; ასეთ შემთხვევაში 22:00-დან 07:00-მდე 40 ₾ ღამის დანამატია
        მოსალოდნელი, მიწოდების საფასურის ზემოთ.
      - >-
        თუ სხვა ქალაქიდან გაფრინდებით: ერთმხრივი დაბრუნება თბილისს, ქუთაისსა და
        ბათუმს შორის 100 ₾ ღირს — იხილეთ ერთმხრივი გაქირავების გვერდი.
      - >-
        აეროპორტში ფრენაზე დაბრუნებისას: 2 საათამდე დაგვიანება უფასოა, შემდეგ
        ყოველ დაწყებულ 3 საათზე დღიური ტარიფის ერთი მესამედი, 8 საათზე მეტი კი
        სრულ დამატებით დღედ ითვლება.
      - >-
        მანქანა სავსე ავზით გაიცემა; აეროპორტში სავსეთივე დააბრუნეთ, თორემ
        ნაკლულ საწვავს 20 ₾ მომსახურების საფასური დაემატება.
      - >-
        თითოეულ აეროპორტს საკუთარი გვერდი აქვს გასასვლელი გზებითა და უახლოესი
        ადგილებით: თბილისის აეროპორტი, ქუთაისის აეროპორტი და ბათუმის აეროპორტი.
      - >-
        გაუქმება 48 საათზე ადრე უფასოა, 24–48 საათში ერთი დღის ტარიფი ერიცხება,
        24 საათზე ნაკლებში ან გამოუცხადებლობისას — ორი დღის. თარიღების შეცვლა
        უფასოა, თუ ახალ თარიღებზე მანქანა თავისუფალია.
    ru:
      h1: Аренда авто в аэропорту в Грузии — Тбилиси, Кутаиси и Батуми
      answer: >-
        RentUp подаёт арендованные машины во все три международных аэропорта Грузии и встречает вас в
        зале прилёта с табличкой с именем: в Тбилиси (TBS) подача стоит 40 ₾ и бесплатна с третьего дня
        аренды; в Батуми (BUS) 50 ₾ и в Кутаиси (KUT) 60 ₾ — оба бесплатно с пятого дня. Выдача работает
        24 часа в сутки; получение или возврат с 22:00 до 07:00 добавляет ночную надбавку 40 ₾. Укажите
        номер рейса при бронировании и возьмите паспорт, права и карту для депозита 300–1200 ₾. Возврат
        в одну сторону между тремя городами стоит 100 ₾.
      meta_title: Аренда авто в аэропорту в Грузии — TBS, KUT и BUS | RentUp
      meta_description: >-
        Встреча с машиной в аэропортах Тбилиси, Кутаиси и Батуми — подача за 40,
        60 или 50 ₾, бесплатно на долгих арендах, выдача круглосуточно, ночная
        доплата 40 ₾.
      lead: >-
        Мы встречаем прилетающих во всех трёх международных аэропортах с готовой
        машиной — в Тбилиси (TBS) за 40 ₾, в Батуми (BUS) за 50 ₾, в Кутаиси
        (KUT) за 60 ₾, — а на более долгих арендах сбор исчезает вовсе.
      pickup: >-
        Назовите номер рейса при бронировании, и мы будем ждать на выходе из
        зоны прилёта с табличкой с вашим именем, какой бы ни была авиакомпания;
        передача проходит на парковке терминала с тем же осмотром и теми же
        документами, что и в офисе, — акт приёма-передачи с фотографиями всех
        четырёх сторон, салона, одометра и уровня топлива. Выдача работает
        круглосуточно; прилёт между 22:00 и 07:00 добавляет ночную доплату
        40 ₾, и то же касается ночного возврата. Сбор за подачу зависит от
        аэропорта и срока аренды: аэропорт Тбилиси — 40 ₾ при аренде на 1–2 дня
        и бесплатно с третьего дня; аэропорт Кутаиси — 60 ₾, аэропорт Батуми —
        50 ₾ до четырёх дней и бесплатно с пятого. Возьмите паспорт (гражданам
        Грузии — удостоверение личности), водительское удостоверение со стажем
        не менее двух лет — вместе с международным (IDP), если оно напечатано
        не латиницей, — и карту для депозита: 300 ₾ эконом-класс, 600 ₾
        кроссовер, 800 ₾ коммерческий фургон, 1000 ₾ бизнес-класс и минивэн,
        1200 ₾ внедорожник 4x4. При бронировании ничего не платится — оплата при
        получении.
      getting_around: >-
        Каждый аэропорт выводит в свою сторону. Аэропорт Тбилиси расположен
        примерно в 13 км к востоку от центра, на кахетинской трассе, так что
        винный маршрут начинается без проезда через город, а объездная дорога
        позволяет миновать его целиком. Аэропорт Кутаиси — примерно в 21 км от
        самого Кутаиси, ближе к Вани, чем к центру города, и его дороги ведут
        прямо в Имеретию и дальше к побережью или в Сванетию. Аэропорт Батуми —
        всего примерно в 5 км к югу от центра Батуми и ещё ближе к пограничному
        переходу Сарпи в Турцию; поездка в Турцию возможна при согласовании за
        48 часов, 250 ₾ на отдельных категориях, иначе машина остаётся в Грузии.
        Пробег по Грузии не ограничен, топливо — «полный к полному», за
        недостающее берут его стоимость плюс сервисный сбор 20 ₾, а CDW и TPL
        входят в тариф с франшизой по категории — 300 ₾ эконом, 600 ₾
        кроссовер, 800 ₾ коммерческий фургон, 1000 ₾ бизнес-класс и минивэн,
        1200 ₾ внедорожник 4x4, — которую SCDW сводит к нулю за 25–45 ₾ в день.
