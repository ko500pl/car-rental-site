          این مبلغ را روی کارت نگه می‌داریم یا در صورت تمایل به‌صورت نقد
          دریافت می‌کنیم تا سقف کارت شما مسدود نشود، و آن را ظرف 3 روز کاری
          پس از بازگشت سالم خودرو آزاد می‌کنیم. گزینهٔ بدون ودیعه وجود ندارد
          — این مبلغ برای هر اجاره، صرف‌نظر از دسته، لازم است.
      mileage:
        heading: کیلومتر
        body: >-
          هر اجاره شامل کیلومتر نامحدود در سراسر گرجستان است. کاختی و
          سوانتی را در یک سفر بگردید، در یک هفته دو بار به کازبگی بروید
          و برگردید، یا فقط خودرو را در شهر استفاده کنید — نرخ روزانه با
          مسافت تغییر نمی‌کند.
      fuel:
        heading: سیاست سوخت
        body: >-
          خودرو با باک پر تحویل داده می‌شود و باید به همان شکل برگردد —
          «به همان اندازه که گرفتید». اگر با سوخت کمتر برگردانید، هزینهٔ
          سوخت کسری به‌علاوهٔ هزینهٔ خدمات محاسبه می‌شود، پس خالی برگرداندن
          باک هیچ فایده‌ای ندارد. میانگین مصرف بسته به مدل متفاوت است — از
          حدود 6 لیتر در 100 کیلومتر برای هیبریدها تا نزدیک به 11 لیتر برای
          ون‌ها؛ عدد دقیق هر خودرو در صفحهٔ همان خودرو آمده است.
      insurance:
        heading: بیمه و فرانشیز ودیعه
        body: >-
          بیمهٔ مسئولیت در برابر شخص ثالث و CDW هر دو در نرخ روزانه لحاظ
          شده‌اند. فراتر از آن، خودرو فرانشیزی دارد که بسته به دسته متفاوت
          است — از 300 ₾ برای خودروی اقتصادی تا 1200 ₾ برای 4x4 — بیشترین
          مبلغی که در صورت خسارت مسئول آن هستید — مگر آنکه SCDW را به مبلغ
          25 تا 45 ₾ در روز، بسته به دسته، اضافه کنید که فرانشیز را به صفر
          می‌رساند.
      delivery:
        heading: تحویل‌گیری و تحویل
        body: >-
          تحویل‌گیری خودرو در دفتر ما در خیابان وژا-پشاولا در تفلیس رایگان
          است، و تحویل به هر نقطهٔ دیگر شهر نیز همین‌طور. تحویل در فرودگاه
          40 ₾ در فرودگاه بین‌المللی تفلیس، 60 ₾ در فرودگاه کوتایسی و 50 ₾
          در فرودگاه باتومی هزینه دارد. تحویل به آدرسی در کوتایسی یا باتومی
          (نه فرودگاه) 40 ₾ است. هر تحویل‌گیری یا بازگشتی بین ساعت 22:00 تا
          07:00 شامل هزینهٔ اضافهٔ شبانهٔ 40 ₾ می‌شود، در هر جا که انجام شود.
      one_way:
        heading: اجارهٔ یک‌طرفه
        body: >-
          می‌توانید خودرو را در یک شهر تحویل بگیرید و در شهر دیگری از میان
          شهرهایی که پوشش می‌دهیم، تحویل دهید، با هزینهٔ 100 ₾ — مفید است
          اگر مثلاً به تفلیس پرواز می‌کنید و از باتومی برمی‌گردید، به‌جای
          بازگشت با خودرو. این هزینه فقط جابه‌جایی داخل گرجستان را پوشش
          می‌دهد؛ سفر به ارمنستان یا ترکیه جداگانه هماهنگ می‌شود، با هزینهٔ
          خاص خود و اطلاع‌رسانی 48 ساعت پیش از آن.
      extras:
        heading: خدمات اضافی
        body: >-
          صندلی کودک روزانه 10 ₾، راننده اضافه روزانه 20 ₾ (حداکثر دو نفر)،
          و دستگاه GPS با نقشهٔ آفلاین روزانه 15 ₾. برنامهٔ مسیریابی خودمان
          هم به همان خوبی کار می‌کند اگر ترجیح می‌دهید از گوشی خود استفاده
          کنید.
      cancellation:
        heading: لغو رزرو
        body: >-
          لغو تا 48 ساعت قبل از تحویل‌گیری رایگان است. لغو بین 24 تا 48
          ساعت قبل، معادل هزینهٔ یک روز اجاره است؛ لغو کمتر از 24 ساعت
          قبل یا عدم حضور، معادل هزینهٔ دو روز اجاره است. هنگام رزرو هیچ
          پیش‌پرداختی انجام نمی‌شود، پس لغو زودهنگام کاملاً رایگان است.
      support:
        heading: پشتیبانی
        body: >-
          کمک در جاده در هر اجاره‌ای لحاظ شده است. دفتر ما از 09:00 تا 21:00
          باز است و تیم به زبان‌های گرجی، انگلیسی و روسی صحبت می‌کند. اگر
          خارج از این ساعات می‌رسید، از پیش تماس بگیرید تا زمان تحویل را
          هماهنگ کنیم.
    faq:
    - q: برای اجارهٔ خودرو در گرجستان باید چند سال سن داشته باشم؟
      a: حداقل 21 سال سن و حداقل 2 سال سابقهٔ گواهینامه لازم است. کلاس
        اقتصادی هزینهٔ اضافی برای راننده جوان ندارد؛ در رده‌های بالاتر
        برای رانندگان زیر 27 سال روزانه 15 تا 25 ₾ اضافه می‌شود.
    - q: آیا به گواهینامهٔ بین‌المللی رانندگی نیاز دارم؟
      a: خیر، اگر گواهینامهٔ ملی شما به خط لاتین باشد، همین کافی است. در
        غیر این صورت آن را همراه با گواهینامهٔ بین‌المللی رانندگی و پاسپورت
        بیاورید.
    - q: واقعاً کیلومتر نامحدود است؟
      a: بله، در هر اجاره‌ای، در سراسر گرجستان. نرخ روزانه چه 20 کیلومتر
        برانید و چه 400 کیلومتر، یکسان است.
    - q: ودیعه چقدر است و آیا برگردانده می‌شود؟
      a: بسته به دستهٔ خودرو دارد — از 300 ₾ برای اقتصادی تا 1200 ₾ برای
        4x4. آن را روی کارت نگه می‌داریم یا نقد دریافت می‌کنیم، و ظرف 3
        روز کاری پس از بازگشت سالم خودرو آزاد می‌شود.
    - q: می‌توانم با خودرو به ارمنستان، ترکیه یا آذربایجان بروم؟
      a: به ارمنستان و ترکیه بله — به ترتیب 150 ₾ و 250 ₾ (دسته‌های
        منتخب)، با هماهنگی حداقل 48 ساعت پیش. سفر به آذربایجان و روسیه
        مجاز نیست.
    - q: اگر پرواز من نیمه‌شب برسد چه می‌شود؟
      a: باز هم می‌توانید خودرو را تحویل بگیرید — برای هر تحویل‌گیری یا
        بازگشتی بین 22:00 و 07:00 هزینهٔ اضافهٔ شبانهٔ 40 ₾ اعمال می‌شود.
    - q: می‌توانم در یک شهر تحویل بگیرم و در شهر دیگری تحویل دهم؟
      a: بله. تحویل در شهر دیگری از میان شهرهایی که پوشش می‌دهیم 100 ₾
        علاوه بر نرخ اجاره هزینه دارد.
    - q: آیا باید هنگام رزرو پیش‌پرداخت کنم؟
      a: خیر — هنگام رزرو چیزی پرداخت نمی‌کنید. پرداخت هنگام تحویل‌گیری
        است، و لغو تا 48 ساعت قبل از آن کاملاً رایگان است؛ لغو دیرتر بسته
        به فاصلهٔ زمانی، معادل هزینهٔ یک یا دو روز اجاره است.
  he:
    h1: השכרת רכב בגאורגיה
    lead: שכרו אחד מ-17 הרכבים שלנו ליום, לשבוע או לחודש, עם קילומטראז' ללא
      הגבלה בכל גאורגיה ואיסוף בטביליסי, קוטאיסי או בטומי.
    meta_title: השכרת רכב בגאורגיה — קילומטראז' ללא הגבלה, בלי עמלות נסתרות | RentUp
    meta_description: שכרו רכב בגאורגיה מ-RentUp — ממחלקת אקונומי ועד 4x4,
      קילומטראז' ללא הגבלה, איסוף בטביליסי, קוטאיסי או בטומי. תנאים אמיתיים
      לפיקדון, ביטוח ודלק, בלי סעיפים קטנים מומצאים.
    sections:
      intro:
        heading: השכרת רכב בגאורגיה
        body: >-
          ל-RentUp צי של 17 רכבים בשש קטגוריות, מהאצ'בקים חסכוניים ועד רכבי
          4x4 לדרכי עפר הרריות. כל השכרה כוללת קילומטראז' ללא הגבלה בתוך
          גאורגיה, כך שטיול יום למצחתה עולה בדיוק כמו שבועיים סיור בכל
          המדינה. התעריף יומי ויורד ככל שההשכרה ארוכה יותר — שבוע עולה
          פחות ליום מסוף שבוע, וחודש עולה עוד פחות.
      how_it_works:
        heading: איך עובד ההזמנה
        steps:
        - בחרו רכב ותאריכים בעמוד הצי. שום דבר לא מחויב עדיין — אין צורך
          בתשלום מראש כדי לשריין הזמנה.
        - הביאו רישיון נהיגה ודרכון לאיסוף. רישיון לאומי שכתוב באותיות
          לטיניות מספיק כשלעצמו; אחרת יש להביא אותו יחד עם רישיון נהיגה
          בינלאומי.
        - במסירה אנחנו גובים את הפיקדון לפי קטגוריית הרכב, סוקרים יחד את
          מצב הרכב, ואז מוסרים את המפתחות.
        - החזירו את הרכב באותה רמת דלק שקיבלתם אותו. הפיקדון משוחרר תוך
          3 ימי עסקים.
      requirements:
        heading: מי יכול לשכור
        body: >-
          נהגים חייבים להיות בני 21 לפחות ובעלי רישיון נהיגה של 2 שנים
          לפחות. אנחנו מקבלים רישיון נהיגה לאומי באותיות לטיניות, או
          רישיון לאומי יחד עם רישיון נהיגה בינלאומי, ובנוסף דרכון בתוקף
          באיסוף. במחלקת אקונומי אין תוספת לנהג צעיר; בקטגוריות הגבוהות
          יותר מתווספים 15–25 ₾ ליום לנהגים מתחת לגיל 27.
      deposit_explained:
        heading: הפיקדון
        body: >-
          כל השכרה כוללת פיקדון בר-החזרה שגודלו נקבע לפי קטגוריית הרכב —
          מ-300 ₾ ברכב אקונומי ועד 1200 ₾ ברכב 4x4. אנחנו מחזיקים אותו על
          כרטיס אשראי, או גובים אותו במזומן אם אתם מעדיפים לא לחסום מסגרת
          אשראי, ומשחררים אותו תוך 3 ימי עסקים מרגע שהרכב חוזר ללא נזק.
          אין אפשרות להשכרה בלי פיקדון — הוא נדרש בכל השכרה, ללא קשר
          לקטגוריה.
      mileage:
        heading: קילומטראז'
        body: >-
          כל השכרה כוללת קילומטראז' ללא הגבלה בכל שטח גאורגיה. סעו דרך
          קחתי וסוואנטי באותו טיול, נסעו לקזבגי וחזרה פעמיים בשבוע אחד,
          או פשוט השתמשו ברכב בעיר — התעריף היומי לא משתנה לפי המרחק.
      fuel:
        heading: מדיניות דלק
        body: >-
          הרכב יוצא עם מיכל מלא וצריך לחזור באותו אופן — מלא-תמורת-מלא.
          אם תחזירו אותו עם פחות דלק, נחייב על הדלק החסר בתוספת דמי טיפול,
          כך שאין שום יתרון בהחזרה עם מיכל ריק. הצריכה הממוצעת משתנה לפי
          דגם — מסביב ל-6 ליטר ל-100 ק"מ ברכבים היברידיים עד קרוב ל-11
          ליטר בוואנים; המספר המדויק לכל רכב מופיע בעמוד שלו.
      insurance:
        heading: ביטוח וההשתתפות העצמית על הפיקדון
        body: >-
          ביטוח צד ג' ו-CDW כלולים שניהם בתעריף היומי. מעבר לכך, על הרכב
          חלה השתתפות עצמית משתנה לפי קטגוריה — מ-300 ₾ ברכב אקונומי ועד
          1200 ₾ ברכב 4x4 — המקסימום שאתם אחראים לו במקרה של נזק — אלא
          אם תוסיפו SCDW תמורת 25–45 ₾ ליום, בהתאם לקטגוריה, שמאפס את
          ההשתתפות העצמית.
      delivery:
        heading: איסוף ואספקה
        body: >-
          איסוף הרכב במשרד שלנו בשדרות ואז'ה-פשאוולה בטביליסי הוא חינם,
          וכך גם אספקה לכל נקודה אחרת בעיר. אספקה לשדה התעופה עולה 40 ₾
          בשדה התעופה הבינלאומי של טביליסי, 60 ₾ בשדה התעופה של קוטאיסי
          ו-50 ₾ בשדה התעופה של בטומי. אספקה לכתובת בקוטאיסי או בטומי (לא
          שדה התעופה) עולה 40 ₾. כל איסוף או החזרה בין השעות 22:00 ל-07:00 כרוכים בתוספת
          לילה של 40 ₾, בכל מקום שבו זה קורה.
      one_way:
        heading: השכרה עם החזרה בעיר אחרת
        body: >-
          אפשר לאסוף את הרכב בעיר אחת ולהחזיר אותו באחרת מבין הערים שאנחנו
          משרתים, תמורת 100 ₾ — שימושי אם אתם טסים לטביליסי וממריאים
          מבטומי, למשל, במקום לחזור עם הרכב. תשלום זה מכסה רק נסיעות בתוך
          גאורגיה — נסיעה לארמניה או טורקיה מתואמת בנפרד, בתשלום משלה
          ובהודעה מראש של 48 שעות.
      extras:
        heading: תוספות
        body: >-
          כיסא בטיחות לילדים עולה 10 ₾ ליום, נהג נוסף 20 ₾ ליום (עד שני
          נהגים נוספים), ומכשיר GPS עם מפות אופליין 15 ₾ ליום. מתכנן
          הטיולים שלנו עובד לא פחות טוב אם אתם מעדיפים להשתמש בטלפון.
      cancellation:
        heading: ביטול
        body: >-
          ביטול חינם עד 48 שעות לפני האיסוף. ביטול 24–48 שעות לפני עולה
          כמו יום השכרה אחד; ביטול פחות מ-24 שעות לפני, או אי-הגעה, עולה
          כמו יומיים השכרה. שום דבר לא משולם מראש בעת ההזמנה, כך שביטול
          מוקדם לא עולה כלום.
      support:
        heading: תמיכה
        body: >-
          סיוע בדרכים כלול בכל השכרה. המשרד שלנו פתוח בין 09:00 ל-21:00,
          והצוות דובר גאורגית, אנגלית ורוסית. אם תגיעו מחוץ לשעות אלה,
          התקשרו מראש כדי שנתאם את המסירה.
    faq:
    - q: בן כמה אני צריך להיות כדי לשכור רכב בגאורגיה?
      a: לפחות בן 21, עם רישיון נהיגה של לפחות שנתיים. במחלקת אקונומי אין
        תוספת לנהג צעיר; בקטגוריות הגבוהות יותר מתווספים 15–25 ₾ ליום
        לנהגים מתחת לגיל 27.
    - q: האם אני צריך רישיון נהיגה בינלאומי?
      a: לא, אם הרישיון הלאומי שלכם כתוב באותיות לטיניות — זה מספיק
        כשלעצמו. אם לא, הביאו אותו יחד עם רישיון נהיגה בינלאומי ודרכון.
    - q: הקילומטראז' באמת ללא הגבלה?
      a: כן, בכל השכרה, בכל שטח גאורגיה. התעריף היומי זהה בין אם תנסעו
        20 ק"מ או 400 ק"מ.
    - q: כמה עולה הפיקדון, והאם הוא מוחזר?
      a: זה תלוי בקטגוריית הרכב — מ-300 ₾ ברכב אקונומי עד 1200 ₾ ברכב
        4x4. אנחנו מחזיקים אותו על כרטיס או גובים אותו במזומן, ומשחררים
        אותו תוך 3 ימי עסקים מרגע שהרכב חוזר ללא נזק.
    - q: אפשר לקחת את הרכב לארמניה, טורקיה או אזרבייג'ן?
      a: לארמניה וטורקיה — כן, תמורת 150 ₾ ו-250 ₾ (קטגוריות נבחרות)
        בהתאמה, בתיאום של 48 שעות לפחות מראש. לאזרבייג'ן ורוסיה הנסיעה
        אינה מותרת.
    - q: מה קורה אם הטיסה שלי נוחתת בלילה?
      a: אפשר עדיין לאסוף את הרכב — תוספת לילה של 40 ₾ חלה על כל איסוף
        או החזרה בין 22:00 ל-07:00.
    - q: אפשר לאסוף בעיר אחת ולהחזיר באחרת?
      a: כן. החזרה בעיר אחרת מבין הערים שאנחנו משרתים עולה 100 ₾ בנוסף
        לתעריף ההשכרה.
    - q: האם צריך לשלם מראש כדי להזמין?
      a: לא — שום דבר לא משולם בעת ההזמנה. משלמים באיסוף, וביטול חינם
        עד 48 שעות לפני כן; ביטול מאוחר יותר עולה כמו יום או יומיים
        השכרה, בהתאם למועד.
  ar:
    h1: تأجير السيارات في جورجيا
    lead: استأجر واحدة من سياراتنا السبع عشرة يومياً أو أسبوعياً أو شهرياً،
      بمسافة قيادة غير محدودة في أنحاء جورجيا واستلام في تبليسي أو كوتايسي
      أو باتومي.
    meta_title: تأجير السيارات في جورجيا — مسافة قيادة غير محدودة، بلا رسوم خفية | RentUp
    meta_description: استأجر سيارة في جورجيا من RentUp — من الفئة الاقتصادية
      إلى الدفع الرباعي، مسافة قيادة غير محدودة، استلام في تبليسي أو كوتايسي
      أو باتومي. شروط حقيقية للتأمين والوديعة والوقود، بلا بنود مختلقة.
    sections:
      intro:
        heading: تأجير سيارة في جورجيا
        body: >-
          تمتلك RentUp أسطولاً من 17 سيارة موزعة على ست فئات، من السيارات
          الاقتصادية الصغيرة إلى سيارات الدفع الرباعي المخصصة للطرق الترابية
          الجبلية. كل عقد إيجار يشمل مسافة قيادة غير محدودة داخل جورجيا،
          فرحلة يوم واحد إلى متسختا تكلف نفس تكلفة جولة أسبوعين في أنحاء
          البلاد كلها. الأسعار محسوبة يومياً وتنخفض كلما طالت مدة الإيجار
          — الأسبوع أرخص للحساب اليومي من عطلة نهاية الأسبوع، والشهر أرخص
          منه.
      how_it_works:
        heading: كيف يتم الحجز
        steps:
        - اختر السيارة والتواريخ في صفحة الأسطول. لا يُخصم أي مبلغ بعد —
          لا حاجة لدفعة مقدمة لتثبيت الحجز.
        - أحضر رخصة القيادة وجواز السفر عند الاستلام. تكفي رخصة القيادة
          الوطنية المكتوبة بالأحرف اللاتينية وحدها؛ وإلا فيجب إحضارها مع
          رخصة قيادة دولية.
        - عند التسليم نأخذ الوديعة الخاصة بفئة السيارة، ونتفقد السيارة
          معاً ونسجل حالتها، ثم نسلّم المفاتيح.
        - أعد السيارة بنفس مستوى الوقود الذي استلمتها به. تُعاد الوديعة
          خلال 3 أيام عمل.
      requirements:
        heading: من يمكنه الاستئجار
        body: >-
          يجب أن يكون السائق 21 عاماً على الأقل وحاملاً لرخصة قيادة منذ
          عامين على الأقل. نقبل رخصة قيادة وطنية بالأحرف اللاتينية، أو
          رخصة وطنية مع رخصة قيادة دولية، بالإضافة إلى جواز سفر ساري عند
          الاستلام. لا توجد رسوم إضافية للسائق الشاب في الفئة الاقتصادية؛
          الفئات الأعلى تضيف 15 إلى 25 ₾ يومياً للسائقين دون 27 عاماً.
      deposit_explained:
        heading: الوديعة التأمينية
        body: >-
          كل إيجار يستلزم وديعة قابلة للاسترداد يحدد حجمها فئة السيارة —
          من 300 ₾ للسيارة الاقتصادية إلى 1200 ₾ لسيارة الدفع الرباعي.
          نحتفظ بها على البطاقة، أو نقبلها نقداً إن كنت تفضل عدم تجميد
          سقف البطاقة، ونعيدها خلال 3 أيام عمل من عودة السيارة دون أضرار.
          لا يوجد خيار بلا وديعة؛ فهي مطلوبة في كل إيجار، بغض النظر عن
          الفئة.
      mileage:
        heading: مسافة القيادة
        body: >-
          كل إيجار يشمل مسافة قيادة غير محدودة في أي مكان داخل جورجيا. جُل
          كاخيتي وسفانيتي في رحلة واحدة، أو اذهب إلى كازبيغي وعُد مرتين
          في أسبوع واحد، أو استخدم السيارة ببساطة داخل المدينة — السعر
          اليومي لا يتغير حسب المسافة.
      fuel:
        heading: سياسة الوقود
        body: >-
          تُسلَّم السيارة بخزان ممتلئ ويجب أن تعود بالطريقة نفسها — الوقود
          مقابل الوقود. إن أعدتها بوقود أقل، نحتسب تكلفة الوقود الناقص
          بالإضافة إلى رسم خدمة، فلا فائدة من إعادتها فارغة. يختلف متوسط
          الاستهلاك حسب الطراز — من نحو 6 لترات لكل 100 كم للسيارات الهجينة
          إلى قرابة 11 لتراً للشاحنات الصغيرة؛ والرقم الدقيق لكل سيارة
          مذكور في صفحتها.
      insurance:
        heading: التأمين والتحمّل على الوديعة
        body: >-
          تأمين المسؤولية تجاه الغير وCDW كلاهما مشمولان في السعر اليومي.
          وفيما عدا ذلك، تحمل السيارة تحملاً يختلف حسب الفئة — من 300 ₾
          للسيارة الاقتصادية إلى 1200 ₾ لسيارة الدفع الرباعي — وهو الحد
          الأقصى الذي تكون مسؤولاً عنه في حال حدوث ضرر — ما لم تضف SCDW
          مقابل 25 إلى 45 ₾ يومياً، حسب الفئة، وهو ما يخفّض التحمل إلى صفر.
      delivery:
        heading: الاستلام والتوصيل
        body: >-
          استلام السيارة من مكتبنا في جادة فاجا-بشافيلا بتبليسي مجاني،
          وكذلك التوصيل إلى أي نقطة أخرى في المدينة. يبلغ رسم التوصيل إلى
          المطار 40 ₾ في مطار تبليسي الدولي، و60 ₾ في مطار كوتايسي، و50 ₾
          في مطار باتومي. أما التوصيل إلى عنوان في كوتايسي أو باتومي (وليس
          المطار) فتكلفته 40 ₾. أي استلام أو إعادة بين الساعة 22:00 و07:00 يترتب
          عليه رسم إضافي ليلي قدره 40 ₾، أينما حدث ذلك.
      one_way:
        heading: الإيجار باتجاه واحد
        body: >-
          يمكنك استلام السيارة في مدينة وتسليمها في أخرى من المدن التي
          نخدمها مقابل رسم 100 ₾ — وهو مفيد إن كنت تصل جواً إلى تبليسي
          وتغادر من باتومي مثلاً، بدلاً من العودة بالسيارة. هذا الرسم
          يغطي التنقل داخل جورجيا فقط؛ السفر إلى أرمينيا أو تركيا يُرتَّب
          بشكل منفصل، برسمه الخاص وبإشعار قبل 48 ساعة.
      extras:
        heading: الإضافات
        body: >-
          مقعد الطفل بسعر 10 ₾ يومياً، والسائق الإضافي 20 ₾ يومياً (بحد
          أقصى سائقَين إضافيَين)، وجهاز GPS بخرائط دون اتصال 15 ₾ يومياً.
          مخطط الرحلات الخاص بنا يعمل بنفس الكفاءة إن كنت تفضل استخدام هاتفك.
      cancellation:
        heading: الإلغاء
        body: >-
          الإلغاء مجاني حتى 48 ساعة قبل الاستلام. الإلغاء قبل 24 إلى 48
          ساعة يُحتسب بقيمة يوم إيجار واحد؛ الإلغاء قبل أقل من 24 ساعة، أو
          عدم الحضور، يُحتسب بقيمة يومي إيجار. لا يُدفع أي مبلغ مسبقاً عند
          الحجز، لذا فإن الإلغاء المبكر لا يكلفك شيئاً على الإطلاق.
      support:
        heading: الدعم
        body: >-
          المساعدة على الطريق مشمولة في كل إيجار. مكتبنا مفتوح من 09:00
          إلى 21:00، والفريق يتحدث الجورجية والإنجليزية والروسية. اتصل
          مسبقاً إن كنت ستصل خارج هذه الساعات لنرتّب التسليم.
    faq:
    - q: كم يجب أن يكون عمري لاستئجار سيارة في جورجيا؟
      a: يجب أن تكون 21 عاماً على الأقل وحاملاً لرخصة قيادة منذ عامين على
        الأقل. لا توجد رسوم إضافية للسائق الشاب في الفئة الاقتصادية؛
        الفئات الأعلى تضيف 15 إلى 25 ₾ يومياً للسائقين دون 27 عاماً.
    - q: هل أحتاج إلى رخصة قيادة دولية؟
      a: لا، إن كانت رخصتك الوطنية مكتوبة بالأحرف اللاتينية — فهذا يكفي
        وحده. وإن لم تكن كذلك، أحضرها مع رخصة قيادة دولية وجواز سفرك.
    - q: هل مسافة القيادة غير محدودة فعلاً؟
      a: نعم، في كل إيجار، في أي مكان داخل جورجيا. السعر اليومي واحد سواء
        قدت 20 كم أو 400 كم.
    - q: كم قيمة الوديعة، وهل تُسترد؟
      a: يعتمد ذلك على فئة السيارة — من 300 ₾ للاقتصادية إلى 1200 ₾
        للدفع الرباعي. نحتفظ بها على البطاقة أو نقبلها نقداً، ونعيدها
        خلال 3 أيام عمل من عودة السيارة دون أضرار.
    - q: هل يمكنني أخذ السيارة إلى أرمينيا أو تركيا أو أذربيجان؟
      a: إلى أرمينيا وتركيا نعم — مقابل 150 ₾ و250 ₾ (فئات مختارة) على
        التوالي، بترتيب قبل 48 ساعة على الأقل. السفر إلى أذربيجان وروسيا
        غير مسموح.
    - q: ماذا لو وصلت رحلتي في منتصف الليل؟
      a: لا يزال بإمكانك استلام السيارة — يطبَّق رسم إضافي ليلي قدره 40 ₾
        على أي استلام أو إعادة بين 22:00 و07:00.
    - q: هل يمكنني الاستلام في مدينة والتسليم في أخرى؟
      a: نعم. التسليم في مدينة أخرى من المدن التي نخدمها يكلف 100 ₾ إضافة
        إلى سعر الإيجار.
    - q: هل يجب أن أدفع مقدماً عند الحجز؟
      a: لا — لا يُدفع شيء عند الحجز. الدفع يكون عند الاستلام، ويمكن
        الإلغاء مجاناً حتى 48 ساعة قبل ذلك؛ الإلغاء الأقرب يكلف يوماً أو
        يومي إيجار حسب التوقيت.

locations:
  tbilisi:
    en:
      h1: Car Rental in Tbilisi
      meta_title: Car Rental in Tbilisi — Office Pickup or Free Delivery | RentUp
      meta_description: Rent a car in Tbilisi from RentUp — pick up free at our
        Vazha-Pshavela office or get free delivery anywhere in the city. Unlimited
        mileage, real deposit and insurance terms.
      lead: Our office sits on Vazha-Pshavela Avenue, a few minutes from the
        centre, and pickup there is free — as is delivery anywhere else in
        Tbilisi.
      pickup: >-
        Collect the car at our office at 71 Vazha-Pshavela Avenue, open 09:00–21:00,
        at no extra cost. If that's out of your way, we'll deliver it free
        anywhere else in the city — Tbilisi is the one place on our list where
        city delivery doesn't carry a fee. Arriving outside office hours costs
        a 40 ₾ night surcharge, same as everywhere else.
      getting_around: >-
        Tbilisi's Old Town is walkable and awkward to park in, so most renters
        pick the car up once they're ready to leave the city rather than for
        getting around the centre itself. From the office, the Kakheti highway
        east and the road north through Mtskheta towards the Georgian Military
        Highway are both a short drive, which is why day trips and week-long
        loops alike tend to start from here rather than the airport.
      good_to_know:
      - The office at 71 Vazha-Pshavela Avenue is the only rental location
        with free delivery anywhere in the city.
      - If you're combining a Tbilisi rental with an onward flight from Batumi
        or Kutaisi, a one-way drop-off costs 100 ₾.
      - Parking in the Old Town's narrow streets is limited — plan to leave
        the car near your accommodation rather than driving in and out of the
        centre.
    ka:
