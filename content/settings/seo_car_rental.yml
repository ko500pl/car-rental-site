      h1: השכרת רכב בכיוון אחד בגאורגיה
      meta_title: השכרת רכב בכיוון אחד בגאורגיה — 100 ₾ בין הערים | RentUp
      meta_description: >-
        אספו את הרכב בטביליסי, בקוטאיסי או בבטומי, בעיר או בשדה התעופה, והחזירו
        בעיר אחרת תמורת 100 ₾ דמי כיוון אחד. ללא תשלום מראש, קילומטראז' ללא
        הגבלה.
      lead: >-
        אספו את הרכב באחת משלוש הערים שלנו, במשרד, בכתובת או בשדה התעופה,
        והחזירו אותו בעיר אחרת. דמי הכיוון האחד בין טביליסי, קוטאיסי ובטומי הם
        100 ₾, והם מתווספים פעם אחת למחיר ההשכרה; ערים אחרות בתיאום מראש.
      pickup: >-
        ציינו את מקום האיסוף ואת מקום ההחזרה בטופס ההזמנה, יש בו שדה לכל אחד
        מהם, או אמרו לנו בטלפון. את עיר ההחזרה אנחנו מאשרים יחד עם הרכב, ולא
        נגבה דבר עד האיסוף. צד האיסוף עולה מה שהוא עולה בכל השכרה: המשרד שלנו
        וכל כתובת בטביליסי ללא תשלום, שדה התעופה טביליסי 40 ₾ בהשכרה של 1 עד 2
        ימים וחינם מהיום השלישי, שדה התעופה קוטאיסי 60 ₾ ושדה התעופה בטומי 50 ₾
        עד ארבעה ימים וחינם מהיום החמישי, וכתובת בקוטאיסי או בבטומי 40 ₾ עד
        ארבעה ימים וחינם מהיום החמישי. מסירה או החזרה בין 22:00 ל-07:00 מוסיפה
        תוספת לילה של 40 ₾ בצד שבו היא נופלת. הביאו דרכון (אזרחי גאורגיה, תעודת
        זהות), רישיון נהיגה שברשותכם שנתיים לפחות, עם רישיון נהיגה בינלאומי
        (IDP) אם הוא אינו מודפס באותיות לטיניות, וכרטיס לפיקדון: 300 ₾ אקונומי,
        600 ₾ קרוסאובר, 800 ₾ ואן מסחרי, 1000 ₾ מחלקת עסקים ומיניוואן, 1200 ₾
        רכב שטח 4x4.
      getting_around: >-
        הנסיעה עצמה כלולה בהשכרה: הקילומטראז' בתוך גאורגיה אינו מוגבל, כך
        שהכביש מטביליסי לבטומי עולה לכם דלק בלבד, והרכב יוצא עם מכל מלא וחוזר
        עם מכל מלא; על מכל שלא מולא בעיר ההחזרה נגבה מחיר הדלק בתוספת דמי טיפול
        של 20 ₾. ההחזרה מתנהלת בדיוק כמו האיסוף: בדוח המסירה בשני הצדדים אנחנו
        מצלמים את ארבעת צדי הרכב, את פנים הרכב, את מד המרחק ואת מפלס הדלק, וזה
        מה שמכריע כל שאלה על נזק בין שתי ערים. CDW ו-TPL כלולים בתעריף,
        וההשתתפות העצמית תלויה בקטגוריה: 300 ₾ אקונומי, 600 ₾ קרוסאובר, 800 ₾
        ואן מסחרי, 1000 ₾ מחלקת עסקים ומיניוואן, 1200 ₾ רכב שטח 4x4, ו-SCDW
        מאפס אותה תמורת 25 עד 45 ₾ ליום. שירותי דרך פועלים מסביב לשעון בכל
        הארץ לאורך כל המסלול, ובתקלה טכנית שאינה באשמתכם רכב חלופי מגיע תוך שש
        שעות וללא תשלום.
      good_to_know:
      - >-
        דמי הכיוון האחד הם 100 ₾ בין טביליסי, קוטאיסי ובטומי, בעיר או בשדה
        התעופה. החזרה בערים אחרות היא בתיאום מראש ובתמחור פרטני, שאלו בעת
        ההזמנה.
      - >-
        המשלוח לנקודת האיסוף מתומחר לפי טבלת המשלוחים, לא לפי דמי הכיוון האחד.
        מהיום החמישי שדה התעופה קוטאיסי, שדה התעופה בטומי וכתובות בקוטאיסי
        ובבטומי הם חינם; שדה התעופה טביליסי מהיום השלישי; טביליסי עצמה תמיד
        חינם.
      - >-
        שעת ההחזרה נבדקת באותה קפדנות כמו בהחזרה לאותה עיר: עד שעתיים איחור
        ללא תשלום, אחר כך שליש מהתעריף היומי על כל שלוש שעות שהחלו, ויותר
        משמונה שעות נחשב ליום נוסף מלא.
      - >-
        החזרה בין 22:00 ל-07:00 נושאת תוספת לילה של 40 ₾, בדיוק כמו איסוף
        לילי, וכדאי לדעת זאת כשההחזרה מתוזמנת לטיסה מוקדמת או מאוחרת.
      - >-
        שינוי תאריכים אינו עולה דבר אם הרכב פנוי בתאריכים החדשים. ביטול יותר
        מ-48 שעות מראש הוא חינם, 24 עד 48 שעות מראש מחויב בתעריף של יום אחד,
        ופחות מ-24 שעות או אי-הגעה בתעריף של יומיים.
      - >-
        פגישה בשדה התעופה בכל אחד מהצדדים מתנהלת כמתואר בעמוד האיסוף בשדה
        התעופה: מספר טיסה בהזמנה, שלט עם השם באולם הנחיתות, מסירה בחניון
        הטרמינל.
    ar:
      h1: تأجير سيارة باتجاه واحد في جورجيا
      meta_title: تأجير سيارة باتجاه واحد في جورجيا — 100 ₾ بين المدن | RentUp
      meta_description: >-
        استلم السيارة في تبليسي أو كوتايسي أو باتومي، في المدينة أو المطار،
        وأعدها في مدينة أخرى مقابل رسم اتجاه واحد 100 ₾. دون دفع مسبق ومسافة
        غير محدودة.
      lead: >-
        استلم السيارة في إحدى مدننا الثلاث، من المكتب أو عند عنوان أو في المطار،
        وسلّمها في مدينة أخرى. رسم الاتجاه الواحد بين تبليسي وكوتايسي وباتومي هو
        100 ₾، يُضاف مرة واحدة إلى سعر الإيجار؛ أما المدن الأخرى فبالاتفاق
        المسبق.
      pickup: >-
        اكتب مكان الاستلام ومكان الإرجاع في نموذج الحجز، فلكل منهما حقل خاص، أو
        أخبرنا هاتفياً. نؤكد مدينة الإرجاع مع السيارة، ولا يُدفع شيء قبل
        الاستلام. جهة الاستلام تكلف ما تكلفه في أي إيجار: مكتبنا وأي عنوان في
        تبليسي مجاناً، ومطار تبليسي 40 ₾ في إيجار من 1 إلى 2 يوم ومجاناً من
        اليوم الثالث، ومطار كوتايسي 60 ₾ ومطار باتومي 50 ₾ حتى أربعة أيام
        ومجاناً من اليوم الخامس، وعنوان في كوتايسي أو باتومي 40 ₾ حتى أربعة
        أيام ومجاناً من اليوم الخامس. التسليم أو الإرجاع بين الساعة 22:00 و07:00
        يضيف رسم الليل 40 ₾ في الجهة التي يقع فيها. أحضر جواز السفر (لمواطني
        جورجيا، بطاقة الهوية)، ورخصة قيادة مضى على إصدارها سنتان على الأقل، مع
        رخصة القيادة الدولية (IDP) إن لم تكن مطبوعة بالحروف اللاتينية، وبطاقة
        للوديعة: 300 ₾ للاقتصادية، و600 ₾ للكروس أوفر، و800 ₾ للفان التجاري،
        و1000 ₾ لفئة رجال الأعمال والميني فان، و1200 ₾ للدفع الرباعي 4x4.
      getting_around: >-
        الطريق نفسه مشمول في الإيجار: المسافة المقطوعة داخل جورجيا غير محدودة،
        فطريق تبليسي إلى باتومي لا يكلفك سوى الوقود، والسيارة تُسلَّم بخزان
        ممتلئ وتعود بخزان ممتلئ؛ وإن لم يُملأ الخزان في مدينة الإرجاع يُحتسب ثمن
        الوقود إضافة إلى رسم خدمة قدره 20 ₾. الإرجاع يجري كما يجري الاستلام: في
        محضر التسليم على الجهتين نصوّر جوانب السيارة الأربعة والمقصورة وعداد
        المسافة ومستوى الوقود، وهذا ما يحسم أي سؤال عن الأضرار بين مدينتين.
        تشمل التعرفة CDW وTPL، والتحمّل التأميني يختلف بحسب الفئة: 300 ₾
        للاقتصادية، و600 ₾ للكروس أوفر، و800 ₾ للفان التجاري، و1000 ₾ لفئة رجال
        الأعمال والميني فان، و1200 ₾ للدفع الرباعي 4x4؛ ويُصفّره SCDW مقابل 25
        إلى 45 ₾ في اليوم. المساعدة على الطريق تعمل على مدار الساعة في أنحاء
        البلاد على طول المسار كله، وإذا تعطلت السيارة لخلل فني ليس بسببك تصل
        سيارة بديلة خلال ست ساعات ودون رسوم.
      good_to_know:
      - >-
        رسم الاتجاه الواحد 100 ₾ بين تبليسي وكوتايسي وباتومي، في المدينة أو
        المطار. أما الإرجاع في مدن أخرى فبالاتفاق المسبق وبتسعير فردي؛ اسأل عند
        الحجز.
      - >-
        التوصيل إلى نقطة الاستلام يُسعَّر وفق جدول التوصيل لا وفق رسم الاتجاه
        الواحد. من اليوم الخامس يكون مطار كوتايسي ومطار باتومي والعناوين في
        كوتايسي وباتومي مجاناً؛ ومطار تبليسي من اليوم الثالث؛ وتبليسي نفسها
        مجاناً دائماً.
      - >-
        يُدقَّق في وقت الإرجاع بالصرامة نفسها كما في الإرجاع إلى المدينة نفسها:
        التأخر حتى ساعتين مجاني، ثم ثلث التعرفة اليومية عن كل ثلاث ساعات تبدأ،
        والتأخر أكثر من ثماني ساعات يُحتسب يوماً إضافياً كاملاً.
      - >-
        الإرجاع بين الساعة 22:00 و07:00 يحمل رسم الليل 40 ₾ كما الاستلام
