        پرداخت نمی‌شود.
      - >-
        تحویل یا بازگرداندن میان ساعت 22:00 تا 07:00 هزینهٔ شبانهٔ 40 ₾ دارد،
        همان‌طور که در اجارهٔ بدون راننده.
      - >-
        صندلی کودک روزی 10 ₾ در سه گروه سنی 0 تا 3، 3 تا 7 و 7 تا 12 سال است و
        قانون گرجستان کودکان زیر 12 سال را ملزم به نشستن در آن می‌کند، با راننده
        یا بی‌راننده.
      - >-
        هر کس بخواهد بخشی از راه را خودش براند باید در قرارداد نامش باشد و
        شرایط سن و گواهینامهٔ رده را داشته باشد؛ بیمه رانندگی کسی را که در
        قرارداد نیامده پوشش نمی‌دهد.
      - >-
        ملاقات در فرودگاه تفلیس، کوتایسی یا باتومی با جدول تحویل قیمت‌گذاری
        می‌شود، درست مانند اجارهٔ بدون راننده؛ صفحهٔ تحویل در فرودگاه را
        ببینید.
