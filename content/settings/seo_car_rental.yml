        მიწოდება ქალაქის ნებისმიერ ადგილას უფასოა.
      - თუ თბილისში აღებულ მანქანას აბრუნებთ ბათუმში ან ქუთაისში
        გასვლის წინ, ცალმხრივი დაბრუნება 100 ₾ ღირს.
      - ძველი ქალაქის ვიწრო ქუჩებში პარკირება შეზღუდულია — მანქანა
        დატოვეთ თქვენს საცხოვრებელთან ახლოს, ცენტრში მუდმივი შესვლა-გასვლის
        ნაცვლად.
    ru:
