        и ещё ближе к пограничному переходу Сарпи в Турцию — некоторые
        путешественники прилетают именно из-за близости к границе. Выезд
        в Турцию возможен по предварительной договорённости — 250 ₾ для
        отдельных категорий, с оформлением минимум за 48 часов — иначе
        машина остаётся в Грузии. Дорога на север в Батуми или дальше в
        горы Аджарии в любом случае короткая и ровная.
      good_to_know:
