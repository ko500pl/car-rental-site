        راننده زمانی ترتیب داده می‌شود که موجودی را تلفنی یا با ایمیل تأیید
        می‌کنیم، و پیش از تحویل چیزی پرداخت نمی‌شود. 120 ₾ هشت ساعت از روز
        راننده را پوشش می‌دهد؛ روز طولانی‌تر ساعتی 20 ₾ روی آن حساب می‌شود، پس
        یک روز دوازده‌ساعته برای راننده 200 ₾ می‌شود. خودرو جداگانه و با نرخ
        خودش قیمت می‌خورد: کلاس بیزنس از روزی 210 ₾، مینی‌ون از 200 ₾، آفرود
        4x4 از 240 ₾، بنابراین ارزان‌ترین خودروی با راننده برای یک روز هشت‌ساعته
        320 ₾ در می‌آید. این‌که خودرو کجا به دیدارتان می‌آید از جدول تحویل پیروی
        می‌کند: دفتر ما و هر نشانی در تفلیس رایگان است، فرودگاه تفلیس در اجارهٔ
        1 تا 2 روزه 40 ₾ و از روز سوم رایگان، فرودگاه کوتایسی 60 ₾ و فرودگاه
