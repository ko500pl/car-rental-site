ka:
  kicker: დაგეგმე · გააზიარე · იმოგზაურე
  h1: შენი მოგზაურობა საქართველოში.
  lead: შექმენი ტური, შეცვალე მარშრუტი და გაუზიარე მეგობრებსა თუ თანამგზავრებს.
en:
  kicker: Plan · Share · Travel
  h1: Your trip across Georgia.
  lead: Build a trip, shape the route, and share it with friends or fellow travellers.
ru:
  kicker: Планируйте · Делитесь · Путешествуйте
  h1: Ваше путешествие по Грузии.
  lead: Создайте поездку, настройте маршрут и поделитесь им с друзьями или попутчиками.
fa:
  kicker: برنامه‌ریزی · اشتراک‌گذاری · سفر
  h1: سفر شما در گرجستان.
  lead: سفرتان را بسازید، مسیر را تنظیم کنید و با دوستان یا هم‌سفران به اشتراک بگذارید.
he:
  kicker: מתכננים · משתפים · מטיילים
  h1: הטיול שלכם בגאורגיה.
  lead: צרו טיול, התאימו את המסלול ושתפו אותו עם חברים או שותפים למסע.
ar:
  kicker: خطط · شارك · سافر
  h1: رحلتك في جورجيا.
  lead: أنشئ رحلتك وعدّل المسار وشاركه مع الأصدقاء أو رفقاء السفر.
