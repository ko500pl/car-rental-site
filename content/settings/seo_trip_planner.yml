# SEO copy for the trip-planner product: the /trip-planner/ landing page and
# the /map/ app page heading (block `planner`), plus semantic homepage copy
# that states in crawlable HTML what RentUp actually is (block `home`).
#
# Every feature named below is real and traceable to static/workspace.js and
# build.py's travel_workspace_block / planner_form_html / render_map_page —
# see the delivery report for the exact function/symbol behind each claim.
# Counts (17 cars, 257 places, 32 routes) are verified against
# content/cars/*.yml, content/attractions/*.yml, content/routes/*.yml and
# must be re-checked against those directories before this file is reused.
#
# Structure:
#   planner:
#     <lang>: { h1, meta_title, meta_description, lead, what_it_does,
#               steps: [{title, text}], features: [...], for_whom,
#               faq: [{q, a}], cta_open, cta_routes, cta_places, cta_car }
#   home:
#     <lang>: { h1, lead, sections: { rent_a_car, plan_your_trip,
#               ready_made_routes, places_to_visit, cars_for_every_route }
#               each section: { h2, body } }

planner:
  en:
    h1: Georgia Trip Planner
    meta_title: Georgia Trip Planner — Build a Self-Drive Road Trip Itinerary | RentUp
    meta_description: >-
      Plan a self-drive Georgia road trip on a map: add stops or load one of
      32 ready-made routes, and the planner counts real drive time against
      your daily hours, then matches you a rental car for the roads you'll
      drive.
    lead: >-
      Build your own Georgia road trip on the map, or start from one of 32
      ready-made routes — the planner counts driving and visiting time
      against how many hours you want on the road each day.
    what_it_does: >-
      RentUp's trip planner is a live route builder for Georgia, not a
      static itinerary list. Add stops from 257 mapped attractions or load
      one of 32 ready-made routes, and it lays them out on the map with
      drive times worked out from real road data — gravel sections,
      high-mountain passes and the roads where a car simply moves slower
      all change the estimate. Every stop counts against a day-by-day time
      budget, so you always see how many hours are left before a day is
      overbooked. Add a place and the planner shows exactly how much
      detour it adds to your route; tap once and it can reorder your whole
      route for less total driving. Once the route is set, it suggests a
      rental car class based on the actual roads you'll drive — a standard
      car on paved routes, an SUV or 4x4 once the route touches gravel or
      high elevation.
    steps:
      - title: Set your starting point and dates
        text: >-
          Pick a starting town, or use your current location, choose your
          travel dates, and set how many days you're driving — the end
          date follows automatically.
      - title: Choose places on the map, or load a ready-made route
        text: >-
          Tap pins on the map or the places list to add stops, or open the
          32 standard tours and apply one in a single click to start from
          a finished route instead.
      - title: Watch the day-by-day time budget
        text: >-
          Each stop adds its visit time plus the real drive time to it
          onto a running total, checked against your daily hour budget —
          8 hours by default, adjustable per day — with a live meter.
      - title: Reorder or auto-optimise the stops
        text: >-
          Drag stops up or down in the list, or tap "sort for the
          shortest time" and let the planner reorder the whole route for
          less driving.
      - title: Get a recommended car and book
        text: >-
          The planner suggests a car class from your route's roads and
          your party size, then lets you send a booking request, save the
          trip to your account, or share the link.
    features:
      - Day-by-day driving time budget, not just a trip total
      - Drive times worked out from real road data — gravel, mountain
        passes and speed limits, not straight-line distance
      - 257 mapped places to choose from
      - 32 ready-made routes you can load and adjust in one click
      - Shows the shortest detour for any place before you add it
      - One-tap route reordering for the least total driving time
      - Drag-and-drop stop reordering
      - Car class matched to your route's actual roads — standard, SUV or 4x4
    for_whom: >-
      Built for anyone planning their own driving route through Georgia —
      a first-time visitor deciding between Kazbegi and Kakheti, or a
      returning traveller stitching together a longer loop. It works
      whether you're renting from us, bringing your own car, or hiring a
      driver.
    faq:
      - q: How does the planner know how many places fit in a day?
        a: >-
          Each attraction has a typical visit length, and the planner adds
          the real drive time between stops, based on road type and
          elevation rather than straight-line distance. It totals both
          against the hours you've set for that day and warns you before a
          stop pushes you over budget.
      - q: Can I start from a ready-made route and still change it?
        a: >-
          Yes. Loading one of the 32 standard tours fills in the stops and
          days for you, and you can then add, remove, or drag-reorder any
          of them exactly as if you'd built the route from scratch.
      - q: Does it account for Georgia's mountain roads, not just distance?
        a: >-
          Yes. Drive-time estimates slow down on roads flagged as gravel or
          4x4-only and at high elevation, so a mountain leg is timed
          differently from the same distance on a highway.
      - q: What car does it recommend?
        a: >-
          It checks whether your route touches high-mountain or unpaved
          roads; if it does, it suggests an SUV or 4x4, otherwise a
          standard class is enough. You can override the suggestion and
          pick any car from the fleet yourself.
      - q: Do I need an account to plan a trip?
        a: >-
          No — you can build and share a route without signing in. An
          account is only needed if you want the trip saved to your
          profile rather than just kept as a shareable link.
      - q: Can I share the trip I planned with someone else?
        a: >-
          Yes. Every route gets a link that encodes your stops, dates and
          days, so you can send it to a travel partner or reopen it
          yourself later.
    cta_open: Open the trip planner
    cta_routes: Browse the 32 routes
    cta_places: Browse 257 places
    cta_car: See the cars

  ka:
    h1: საქართველოს ტურის დამგეგმავი
    meta_title: საქართველოს ტურის დამგეგმავი — შეადგინე მარშრუტი საკუთარი მანქანით | RentUp
    meta_description: >-
      დაგეგმე მოგზაურობა საქართველოში რუკაზე — დაამატე გაჩერებები ან
      ჩატვირთე ერთ-ერთი 32 მზა მარშრუტიდან. დამგეგმავი ითვლის რეალურ სავალ
      დროს დღიური ბიუჯეტის მიხედვით და გირჩევს მანქანის კლასს გზების
      მიხედვით.
    lead: >-
      შეადგინე საკუთარი მარშრუტი რუკაზე, ან დაიწყე 32 მზა მარშრუტიდან
      ერთით — დამგეგმავი ითვლის სავალსა და დათვალიერების დროს იმის
      მიხედვით, რამდენი საათის სიარული გინდა დღეში.
    what_it_does: >-
      RentUp-ის ტურის დამგეგმავი ცოცხალი მარშრუტის შემდგენია საქართველოსთვის,
      და არა მზა სიების გვერდი. დაამატე გაჩერებები 257 დატანილი
      ღირსშესანიშნაობიდან ან ჩატვირთე ერთ-ერთი 32 მზა მარშრუტიდან — ის
      რუკაზე დაალაგებს ყველაფერს და სავალ დროს დაითვლის რეალური საგზაო
      მონაცემებით: გრუნტიანი მონაკვეთები, მაღალმთიანი უღელტეხილები და გზები,
      სადაც მანქანა უბრალოდ ნელა მიდის. ყოველი გაჩერება ჩაითვლება დღიურ
      დროის ბიუჯეტში, ასე რომ ყოველთვის ხედავ, რამდენი საათი დაგრჩა, სანამ
      დღე გადატვირთვამდე მიდის. ახალი ადგილის დამატებისას დამგეგმავი
      გიჩვენებს, ზუსტად რამდენ გადახვევას მოიმატებს ის მარშრუტში; ერთი
      შეხებით კი შეუძლია მთელი მარშრუტი გადაალაგოს ნაკლები სავალი დროისთვის.
      მარშრუტის ჩამოყალიბების შემდეგ დამგეგმავი გირჩევს მანქანის კლასს
      იმ გზების მიხედვით, რომლებზეც რეალურად გაივლი — სტანდარტული მანქანა
      ასფალტზე, ჯიპი ან 4x4, თუ მარშრუტში გრუნტიანი ან მაღალმთიანი
      მონაკვეთია.
    steps:
      - title: მიუთითე საწყისი წერტილი და თარიღები
        text: >-
          აირჩიე საწყისი ქალაქი ან გამოიყენე შენი მდებარეობა, მიუთითე
          მოგზაურობის თარიღები და დღეების რაოდენობა — დასრულების თარიღი
          თავად გამოითვლება.
      - title: აირჩიე ადგილები რუკაზე ან ჩატვირთე მზა მარშრუტი
        text: >-
          დააჭირე ნიშნებს რუკაზე ან სიაში გაჩერებების დასამატებლად, ან
          გახსენი 32 სტანდარტული ტური და ერთი დაწკაპუნებით გამოიყენე
          მზა მარშრუტი.
      - title: აკონტროლე დღიური დროის ბიუჯეტი
        text: >-
          თითოეული გაჩერება ემატება საერთო ჯამს — დათვალიერების დროსთან
          ერთად რეალურ სავალ დროსაც — და მოწმდება დღიურ ბიუჯეტთან, რომელიც
          ნაგულისხმევად 8 საათია და დღეების მიხედვით რეგულირდება.
      - title: გადაალაგე ან ავტომატურად ოპტიმიზირე გაჩერებები
        text: >-
          გადაათრიე გაჩერებები სიაში, ან დააჭირე „უმოკლეს დროზე
          გადალაგებას", რომ დამგეგმავმა მთელი მარშრუტი ნაკლები სავალი
          დროისთვის გადაალაგოს.
      - title: მიიღე რეკომენდირებული მანქანა და დაჯავშნე
        text: >-
          დამგეგმავი გირჩევს მანქანის კლასს მარშრუტის გზებისა და
          თანმხლებთა რაოდენობის მიხედვით, შემდეგ შეგიძლია ჯავშნის
          მოთხოვნა გააგზავნო, ტური შეინახო ანგარიშზე ან ბმული გააზიარო.
    features:
      - დღიური სავალი დროის ბიუჯეტი, უბრალო საერთო ჯამის ნაცვლად
      - სავალი დრო ითვლება რეალური საგზაო მონაცემებით — გრუნტი, მთის
        უღელტეხილები და სიჩქარის შეზღუდვები, და არა სწორი ხაზით
      - 257 დატანილი ადგილი ასარჩევად
      - 32 მზა მარშრუტი, ერთი დაწკაპუნებით ჩასატვირთი და შესარჩელად
      - გვიჩვენებს უმოკლეს გადახვევას ნებისმიერი ადგილისთვის დამატებამდე
      - ერთი ღილაკით მარშრუტის გადალაგება უმოკლესი სავალი დროისთვის
      - გაჩერებების გადათრევით გადალაგება
      - მანქანის კლასი მარშრუტის რეალური გზების მიხედვით — სტანდარტული,
        ჯიპი ან 4x4
    for_whom: >-
      გამოადგება ყველას, ვინც საკუთარ მარშრუტს გეგმავს საქართველოში —
      პირველად მოსულს, რომელიც ყაზბეგსა და კახეთს შორის ირჩევს, თუ
      გამოცდილ მოგზაურს, რომელიც გრძელ მარშრუტს ალაგებს. მუშაობს იმისგან
      დამოუკიდებლად, ჩვენგან იქირავებ მანქანას, საკუთარით მოგზაურობ თუ
      მძღოლს ირჩევ.
    faq:
      - q: როგორ იგებს დამგეგმავი, რამდენი ადგილი ეტევა ერთ დღეში?
        a: >-
          თითოეულ ღირსშესანიშნაობას აქვს დათვალიერების ჩვეული ხანგრძლივობა,
          დამგეგმავი კი ამატებს რეალურ სავალ დროს გაჩერებებს შორის —
          გზის ტიპისა და სიმაღლის მიხედვით, და არა სწორი ხაზით
          გამოთვლილს. ჯამი მოწმდება იმ დღის ბიუჯეტთან და გაფრთხილებს,
          სანამ გაჩერება ბიუჯეტს გადააჭარბებდეს.
      - q: შემიძლია მზა მარშრუტიდან დავიწყო და მაინც შევცვალო?
        a: >-
          დიახ. 32 სტანდარტული ტურიდან ერთის ჩატვირთვა ავსებს გაჩერებებსა
          და დღეებს შენს მაგივრად, შემდეგ კი შეგიძლია ნებისმიერი
          დაამატო, წაშალო ან გადათრიო — ისევე, როგორც ნულიდან აგებულში.
      - q: ითვალისწინებს თუ არა საქართველოს მთის გზებს, უბრალო მანძილს
          ნაცვლად?
        a: >-
          დიახ. სავალი დროის შეფასება ანელებს გამოთვლას გრუნტიან ან
          მხოლოდ 4x4-სთვის განკუთვნილ გზებზე და მაღალ სიმაღლეზე, ასე
          რომ მთის მონაკვეთი განსხვავებულად ითვლება, ვიდრე იმავე
          სიგრძის ავტობანი.
      - q: რომელ მანქანას მირჩევს?
        a: >-
          ის ამოწმებს, გადის თუ არა მარშრუტი მაღალმთიან ან
          გრუნტიან გზებზე; თუ გადის — გირჩევს ჯიპს ან 4x4-ს, სხვა
          შემთხვევაში სტანდარტული კლასი საკმარისია. რეკომენდაცია
          შეგიძლია თავად შეცვალო და ავტოპარკიდან ნებისმიერი მანქანა
          აირჩიო.
      - q: საჭიროა თუ არა ანგარიში ტურის დასაგეგმად?
        a: >-
          არა — მარშრუტის აგება და გაზიარება შესვლის გარეშეც შეგიძლია.
          ანგარიში მხოლოდ იმ შემთხვევაშია საჭირო, თუ გინდა ტური პროფილზე
          შეინახო და არა უბრალოდ ბმულის სახით ჰქონდეს დარჩენილი.
      - q: შემიძლია დაგეგმილი ტური სხვასთან გავაზიარო?
        a: >-
          დიახ. ყოველ მარშრუტს აქვს ბმული, რომელშიც შენი გაჩერებები,
          თარიღები და დღეებია კოდირებული — შეგიძლია გაუგზავნო
          თანამგზავრს ან თავად ხელახლა გახსნა მოგვიანებით.
    cta_open: დამგეგმავის გახსნა
    cta_routes: 32 მარშრუტის ნახვა
    cta_places: 257 ადგილის ნახვა
    cta_car: ავტოპარკის ნახვა

  ru:
    h1: Планировщик поездки по Грузии
    meta_title: Планировщик поездки по Грузии — маршрут для самостоятельного путешествия | RentUp
    meta_description: >-
      Спланируйте поездку по Грузии на машине: добавляйте точки на карте
      или загрузите один из 32 готовых маршрутов — планировщик считает
      реальное время в пути по дневному бюджету и подбирает машину под
      дорогу.
    lead: >-
      Постройте свой маршрут по Грузии на карте или начните с одного из 32
      готовых маршрутов — планировщик считает время в пути и на осмотр по
      тому, сколько часов в день вы хотите ехать.
    what_it_does: >-
      Планировщик поездок RentUp — это живой конструктор маршрута по
      Грузии, а не статический список. Добавляйте точки из 257 нанесённых
      на карту достопримечательностей или загрузите один из 32 готовых
      маршрутов — он расставит всё на карте и посчитает время в пути по
      реальным дорожным данным: грунтовые участки, высокогорные перевалы
      и дороги, где машина просто едет медленнее. Каждая остановка
      учитывается в дневном бюджете времени, так что вы всегда видите,
      сколько часов осталось до перегруза дня. Добавляя новое место, вы
      сразу видите, насколько это удлинит маршрут; одним нажатием
      планировщик может перестроить весь маршрут для меньшего суммарного
      времени в пути. Когда маршрут готов, он предлагает класс машины
      исходя из реальных дорог маршрута — стандартный класс на асфальте,
      внедорожник или 4x4, если маршрут затрагивает грунт или высокогорье.
    steps:
      - title: Укажите начальную точку и даты
        text: >-
          Выберите город отправления или используйте своё местоположение,
          укажите даты поездки и количество дней — дата окончания
          посчитается сама.
      - title: Выберите места на карте или загрузите готовый маршрут
        text: >-
          Отмечайте точки на карте или в списке мест, либо откройте 32
          стандартных тура и примените один в один клик, чтобы начать с
          готового маршрута.
      - title: Следите за дневным бюджетом времени
        text: >-
          Каждая остановка добавляет к общей сумме время на осмотр и
          реальное время в пути, и это сверяется с дневным бюджетом — по
          умолчанию 8 часов, регулируется по дням — с наглядным
          индикатором.
      - title: Перестройте или автоматически оптимизируйте порядок
        text: >-
          Перетащите остановки в списке или нажмите «кратчайший маршрут»,
          чтобы планировщик перестроил весь маршрут для меньшего времени
          в пути.
      - title: Получите рекомендацию по машине и забронируйте
        text: >-
          Планировщик предлагает класс машины исходя из дорог маршрута и
          числа пассажиров, а затем позволяет отправить заявку на
          бронирование, сохранить поездку в аккаунт или поделиться ссылкой.
    features:
      - Дневной бюджет времени в пути, а не просто итог по поездке
      - Время в пути считается по реальным дорожным данным — грунт,
        горные перевалы и ограничения скорости, а не по прямой
      - 257 нанесённых на карту мест на выбор
      - 32 готовых маршрута, которые можно загрузить и изменить в один клик
      - Показывает кратчайший крюк для любого места перед добавлением
      - Перестройка маршрута в один клик для минимального суммарного
        времени в пути
      - Перетаскивание остановок для смены порядка
      - Класс машины подбирается под реальные дороги маршрута —
        стандартный, внедорожник или 4x4
    for_whom: >-
      Подходит всем, кто планирует собственный маршрут по Грузии — тем,
      кто впервые выбирает между Казбеги и Кахетией, и тем, кто собирает
      длинный маршрут во второй или третий раз. Работает независимо от
      того, берёте вы машину у нас, едете на своей или с водителем.
    faq:
      - q: Как планировщик понимает, сколько мест поместится в день?
        a: >-
          У каждой достопримечательности есть типичная продолжительность
          осмотра, и планировщик добавляет к ней реальное время в пути
          между точками — по типу дороги и высоте, а не по прямой. Сумма
          сверяется с бюджетом на этот день, и вы получите предупреждение
          до того, как остановка выйдет за бюджет.
      - q: Могу я начать с готового маршрута и потом его изменить?
        a: >-
          Да. Загрузка одного из 32 стандартных туров сразу заполняет
          остановки и дни, а дальше вы можете добавлять, убирать или
          перетаскивать любые из них — точно так же, как в маршруте,
          построенном с нуля.
      - q: Учитываются ли горные дороги Грузии, а не только расстояние?
        a: >-
          Да. Оценка времени в пути замедляется на дорогах, отмеченных
          как грунтовые или только для 4x4, и на большой высоте, поэтому
          горный участок считается иначе, чем такое же расстояние по
          шоссе.
      - q: Какую машину он рекомендует?
        a: >-
          Он проверяет, проходит ли маршрут по высокогорным или
          немощёным дорогам; если да — рекомендует внедорожник или 4x4,
          иначе достаточно стандартного класса. Рекомендацию можно
          изменить и выбрать любую машину из автопарка самостоятельно.
      - q: Нужен ли аккаунт, чтобы спланировать поездку?
        a: >-
          Нет — маршрут можно построить и поделиться им без входа.
          Аккаунт нужен только если вы хотите, чтобы поездка сохранилась
          в профиле, а не просто осталась по ссылке.
      - q: Могу я поделиться спланированной поездкой с кем-то ещё?
        a: >-
          Да. У каждого маршрута есть ссылка, в которой закодированы
          остановки, даты и дни — её можно отправить попутчику или
          открыть самому позже.
    cta_open: Открыть планировщик
    cta_routes: Смотреть 32 маршрута
    cta_places: Смотреть 257 мест
    cta_car: Смотреть машины

  fa:
    h1: برنامه‌ریز سفر گرجستان
    meta_title: برنامه‌ریز سفر گرجستان — ساخت مسیر سفر جاده‌ای با خودروی شخصی | RentUp
    meta_description: >-
      سفر جاده‌ای خودتان را در گرجستان روی نقشه بچینید: توقف‌ها را اضافه
      کنید یا یکی از ۳۲ مسیر آماده را بارگذاری کنید — برنامه‌ریز زمان
      واقعی رانندگی را با ساعت روزانه شما می‌سنجد و کلاس خودرو متناسب را
      پیشنهاد می‌دهد.
    lead: >-
      مسیر سفر خودتان در گرجستان را روی نقشه بسازید یا از یکی از ۳۲ مسیر
      آماده شروع کنید — برنامه‌ریز زمان رانندگی و بازدید را بر اساس
      ساعاتی که می‌خواهید هر روز در جاده باشید حساب می‌کند.
    what_it_does: >-
      برنامه‌ریز سفر RentUp یک سازندهٔ زندهٔ مسیر برای گرجستان است، نه
      فهرست ثابت یک برنامهٔ سفر. توقف‌ها را از میان ۲۵۷ مکان ثبت‌شده روی
      نقشه اضافه کنید یا یکی از ۳۲ مسیر آماده را بارگذاری کنید؛ برنامه‌ریز
      همه را روی نقشه می‌چیند و زمان رانندگی را بر اساس داده‌های واقعی
      جاده حساب می‌کند — بخش‌های خاکی، گردنه‌های کوهستانی و جاده‌هایی که
      خودرو در آن‌ها کندتر می‌رود، همه در برآورد اثر می‌گذارند. هر توقف در
      بودجهٔ زمانی روزانه محاسبه می‌شود، پس همیشه می‌بینید چند ساعت تا پر
      شدن برنامهٔ آن روز باقی مانده است. با افزودن یک مکان جدید،
      برنامه‌ریز دقیقاً نشان می‌دهد چقدر به مسیر شما انحراف اضافه
      می‌کند؛ و با یک لمس می‌تواند کل مسیر را برای کمترین زمان رانندگی
      دوباره بچیند. وقتی مسیر آماده شد، بر اساس جاده‌هایی که واقعاً در
      آن‌ها رانندگی خواهید کرد، کلاس خودرو پیشنهاد می‌دهد — خودروی معمولی
      برای جاده‌های آسفالت، و شاسی‌بلند یا ۴×۴ اگر مسیر به بخش خاکی یا
      ارتفاع زیاد برسد.
    steps:
      - title: نقطهٔ شروع و تاریخ‌ها را مشخص کنید
        text: >-
          شهر شروع را انتخاب کنید یا از موقعیت فعلی خود استفاده کنید،
          تاریخ سفر را مشخص کنید و تعداد روزها را بگذارید — تاریخ پایان
          خودکار محاسبه می‌شود.
      - title: مکان‌ها را روی نقشه انتخاب کنید یا مسیر آماده بارگذاری کنید
        text: >-
          روی نشانه‌های نقشه یا فهرست مکان‌ها بزنید تا توقف اضافه کنید،
          یا ۳۲ تور استاندارد را باز کنید و با یک کلیک یکی را برای شروع
          از یک مسیر آماده اعمال کنید.
      - title: بودجهٔ زمانی روزانه را زیر نظر داشته باشید
        text: >-
          هر توقف زمان بازدید به‌علاوهٔ زمان واقعی رانندگی تا آن را به
          جمع کل اضافه می‌کند و با بودجهٔ ساعتی روزانهٔ شما — پیش‌فرض ۸
          ساعت، قابل تنظیم برای هر روز — با یک نشانگر زنده مقایسه می‌شود.
      - title: توقف‌ها را جابه‌جا یا خودکار بهینه کنید
        text: >-
          توقف‌ها را در فهرست بکشید و رها کنید، یا روی «چیدمان کوتاه‌ترین
          زمان» بزنید تا برنامه‌ریز کل مسیر را برای رانندگی کمتر دوباره
          بچیند.
      - title: خودروی پیشنهادی را دریافت و رزرو کنید
        text: >-
          برنامه‌ریز بر اساس جاده‌های مسیر و تعداد همراهان کلاس خودرو
          پیشنهاد می‌دهد، سپس می‌توانید درخواست رزرو ارسال کنید، سفر را
          در حساب خود ذخیره کنید یا پیوند آن را به اشتراک بگذارید.
    features:
      - بودجهٔ زمانی رانندگی به تفکیک روز، نه فقط یک جمع کل
      - زمان رانندگی بر اساس داده‌های واقعی جاده — خاکی، گردنه‌های
        کوهستانی و محدودیت سرعت، نه فاصلهٔ خط‌مستقیم
      - ۲۵۷ مکان ثبت‌شده روی نقشه برای انتخاب
      - ۳۲ مسیر آماده که با یک کلیک بارگذاری و تنظیم می‌شوند
      - نمایش کوتاه‌ترین انحراف برای هر مکان پیش از افزودن آن
      - چیدمان مسیر با یک لمس برای کمترین زمان کل رانندگی
      - جابه‌جایی توقف‌ها با کشیدن و رها کردن
      - کلاس خودرو متناسب با جاده‌های واقعی مسیر — معمولی، شاسی‌بلند یا ۴×۴
    for_whom: >-
      برای هرکسی که مسیر رانندگی خودش را در گرجستان برنامه‌ریزی می‌کند
      مناسب است — از بازدیدکنندهٔ اولی که میان قزبگی و کاختی مردد است تا
      مسافری که مسیر بلندتری را از نو می‌چیند. چه از ما خودرو اجاره کنید،
      چه با خودروی خودتان بروید و چه راننده بگیرید، همان‌طور کار می‌کند.
    faq:
      - q: برنامه‌ریز چطور می‌فهمد چند مکان در یک روز جا می‌شود؟
        a: >-
          هر جاذبه یک مدت بازدید معمول دارد و برنامه‌ریز زمان واقعی
          رانندگی بین توقف‌ها را — بر اساس نوع جاده و ارتفاع، نه فاصلهٔ
          خط‌مستقیم — به آن اضافه می‌کند. جمع آن با ساعت‌هایی که برای آن
          روز تعیین کرده‌اید سنجیده می‌شود و پیش از آنکه توقفی از بودجه
          فراتر برود هشدار می‌دهد.
      - q: می‌توانم از یک مسیر آماده شروع کنم و باز هم آن را تغییر دهم؟
        a: >-
          بله. بارگذاری یکی از ۳۲ تور استاندارد توقف‌ها و روزها را
          برایتان پر می‌کند و بعد می‌توانید هرکدام را اضافه، حذف یا
          جابه‌جا کنید — درست مثل مسیری که از صفر ساخته باشید.
      - q: آیا جاده‌های کوهستانی گرجستان را در نظر می‌گیرد، نه فقط فاصله را؟
        a: >-
          بله. برآورد زمان رانندگی در جاده‌های خاکی یا مخصوص ۴×۴ و در
          ارتفاع زیاد کندتر می‌شود، پس یک بخش کوهستانی با همان فاصله روی
          بزرگراه زمان متفاوتی می‌گیرد.
      - q: چه خودرویی پیشنهاد می‌دهد؟
        a: >-
          بررسی می‌کند آیا مسیر از جاده‌های مرتفع یا خاکی می‌گذرد؛ اگر
          بله، شاسی‌بلند یا ۴×۴ پیشنهاد می‌دهد، در غیر این صورت کلاس
          معمولی کافی است. می‌توانید پیشنهاد را تغییر دهید و خودتان هر
          خودرویی از ناوگان را انتخاب کنید.
      - q: برای برنامه‌ریزی سفر به حساب کاربری نیاز دارم؟
        a: >-
          نه — می‌توانید بدون ورود مسیر بسازید و به اشتراک بگذارید. حساب
          کاربری فقط وقتی لازم است که بخواهید سفر در پروفایل شما ذخیره
          شود، نه فقط به‌صورت یک پیوند قابل اشتراک باقی بماند.
      - q: می‌توانم سفری را که برنامه‌ریزی کرده‌ام با دیگری به اشتراک بگذارم؟
        a: >-
          بله. هر مسیر پیوندی دارد که توقف‌ها، تاریخ‌ها و روزها را در
          خود دارد، پس می‌توانید آن را برای همسفرتان بفرستید یا بعداً
          خودتان دوباره باز کنید.
    cta_open: باز کردن برنامه‌ریز سفر
    cta_routes: مشاهدهٔ ۳۲ مسیر
    cta_places: مشاهدهٔ ۲۵۷ مکان
    cta_car: مشاهدهٔ خودروها

  he:
    h1: מתכנן הטיולים בגאורגיה
    meta_title: מתכנן טיולים בגאורגיה — בנו מסלול טיול עצמאי ברכב | RentUp
    meta_description: >-
      תכננו טיול עצמאי ברכב בגאורגיה על גבי מפה: הוסיפו עצירות או טענו
      אחד מ-32 מסלולים מוכנים — המתכנן סופר זמן נסיעה אמיתי מול התקציב
      היומי שלכם ומתאים לכם רכב לפי הדרכים במסלול.
    lead: >-
      בנו מסלול טיול משלכם בגאורגיה על גבי מפה, או התחילו מאחד מ-32
      מסלולים מוכנים — המתכנן סופר את זמן הנסיעה והביקור מול כמה שעות
      אתם רוצים להיות בדרך בכל יום.
    what_it_does: >-
      מתכנן הטיולים של RentUp הוא בונה מסלול חי לגאורגיה, לא רשימת מסלול
      קבועה. הוסיפו עצירות מתוך 257 אתרים המסומנים על המפה, או טענו אחד
      מ-32 מסלולים מוכנים — הוא מסדר הכול על המפה ומחשב זמני נסיעה לפי
      נתוני דרך אמיתיים: קטעי חצץ, מעברי הרים גבוהים ודרכים שבהן הרכב
      פשוט נוסע לאט יותר — כולם משפיעים על ההערכה. כל עצירה נספרת בתקציב
      הזמן היומי, כך שתמיד רואים כמה שעות נותרו לפני שהיום נהיה עמוס
      מדי. הוספת מקום חדש מציגה מיד כמה סטייה זה מוסיף למסלול; ובלחיצה
      אחת המתכנן יכול לסדר מחדש את כל המסלול לזמן נסיעה כולל קצר יותר.
      כשהמסלול מוכן, הוא מציע קטגוריית רכב לפי הדרכים שבאמת תיסעו בהן —
      רכב רגיל בכבישים סלולים, רכב שטח או 4x4 אם המסלול נוגע בחצץ או
      בגובה רב.
    steps:
      - title: קבעו נקודת מוצא ותאריכים
        text: >-
          בחרו עיר יציאה, או השתמשו במיקום הנוכחי שלכם, קבעו תאריכי
          נסיעה ומספר ימים — תאריך הסיום מחושב אוטומטית.
      - title: בחרו מקומות על המפה או טענו מסלול מוכן
        text: >-
          לחצו על סיכות במפה או ברשימת המקומות כדי להוסיף עצירות, או
          פתחו את 32 הטיולים הסטנדרטיים והחילו אחד בלחיצה אחת כדי
          להתחיל ממסלול מוכן.
      - title: עקבו אחרי תקציב הזמן היומי
        text: >-
          כל עצירה מוסיפה את זמן הביקור וזמן הנסיעה האמיתי אליה לסכום
          המצטבר, שנבדק מול תקציב השעות היומי שלכם — 8 שעות כברירת
          מחדל, ניתן לשינוי לכל יום — עם מד חי.
      - title: סדרו מחדש או ייעלו אוטומטית את העצירות
        text: >-
          גררו עצירות למעלה או למטה ברשימה, או לחצו על "סידור לזמן הקצר
          ביותר" כדי שהמתכנן יסדר מחדש את כל המסלול לפחות נסיעה.
      - title: קבלו רכב מומלץ והזמינו
        text: >-
          המתכנן מציע קטגוריית רכב לפי הדרכים במסלול ומספר הנוסעים, ואז
          מאפשר לשלוח בקשת הזמנה, לשמור את הטיול לחשבון שלכם או לשתף
          את הקישור.
    features:
      - תקציב זמן נסיעה לפי ימים, לא רק סכום כולל לטיול
      - זמני נסיעה מחושבים לפי נתוני דרך אמיתיים — חצץ, מעברי הרים
        ומגבלות מהירות, לא מרחק בקו ישר
      - 257 מקומות מסומנים על המפה לבחירה
      - 32 מסלולים מוכנים שניתן לטעון ולהתאים בלחיצה אחת
      - מציג את הסטייה הקצרה ביותר לכל מקום לפני שמוסיפים אותו
      - סידור מסלול בלחיצה אחת לזמן הנסיעה הכולל הקצר ביותר
      - שינוי סדר עצירות בגרירה
      - קטגוריית רכב מותאמת לדרכים האמיתיות במסלול — רגיל, רכב שטח או 4x4
    for_whom: >-
      מתאים לכל מי שמתכנן מסלול נהיגה משלו בגאורגיה — מבקר בפעם הראשונה
      שמתלבט בין קזבגי לקחתי, או מטייל חוזר שמרכיב מסלול ארוך יותר. הוא
      עובד בין אם אתם שוכרים רכב מאיתנו, מגיעים ברכב שלכם או שוכרים נהג.
    faq:
      - q: איך המתכנן יודע כמה מקומות נכנסים ליום אחד?
        a: >-
          לכל אתר יש משך ביקור טיפוסי, והמתכנן מוסיף לו את זמן הנסיעה
          האמיתי בין העצירות — לפי סוג הדרך והגובה, לא מרחק בקו ישר.
          הסכום נבדק מול השעות שקבעתם לאותו יום, והוא מתריע לפני שעצירה
          חורגת מהתקציב.
      - q: אפשר להתחיל ממסלול מוכן ועדיין לשנות אותו?
        a: >-
          כן. טעינת אחד מ-32 הטיולים הסטנדרטיים ממלאת את העצירות והימים
          עבורכם, ומשם אפשר להוסיף, להסיר או לגרור כל אחת מהן בדיוק כמו
          במסלול שנבנה מאפס.
      - q: האם הוא מתחשב בדרכי ההרים של גאורגיה, ולא רק במרחק?
        a: >-
          כן. הערכת זמן הנסיעה מואטת בדרכים המסומנות כחצץ או ל-4x4 בלבד
          ובגובה רב, כך שקטע הררי מחושב אחרת מאותו מרחק בכביש מהיר.
      - q: איזה רכב הוא ממליץ?
        a: >-
          הוא בודק אם המסלול נוגע בדרכי הרים גבוהים או לא סלולות; אם כן,
          הוא ממליץ על רכב שטח או 4x4, אחרת מספיקה קטגוריה רגילה. אפשר
          לשנות את ההמלצה ולבחור בעצמכם כל רכב מהצי.
      - q: צריך חשבון כדי לתכנן טיול?
        a: >-
          לא — אפשר לבנות ולשתף מסלול בלי להתחבר. חשבון נדרש רק אם רוצים
          שהטיול יישמר בפרופיל ולא רק יישאר כקישור לשיתוף.
      - q: אפשר לשתף את הטיול שתכננתי עם מישהו אחר?
        a: >-
          כן. לכל מסלול יש קישור שמקודדות בו העצירות, התאריכים והימים,
          כך שאפשר לשלוח אותו לחבר לדרך או לפתוח אותו בעצמכם מאוחר יותר.
    cta_open: פתחו את מתכנן הטיולים
    cta_routes: עיינו ב-32 המסלולים
    cta_places: עיינו ב-257 המקומות
    cta_car: צפו ברכבים

  ar:
    h1: مخطط رحلات جورجيا
    meta_title: مخطط رحلات جورجيا — خطط مسار رحلة برية بقيادتك | RentUp
    meta_description: >-
      خطط رحلتك البرية في جورجيا على خريطة: أضف محطات أو حمّل إحدى 32
      جولة جاهزة — يحسب المخطط زمن القيادة الفعلي مقابل ساعاتك اليومية
      ويقترح فئة سيارة تناسب طرق مسارك.
    lead: >-
      ابنِ مسار رحلتك في جورجيا على الخريطة، أو ابدأ من إحدى 32 جولة
      جاهزة — يحسب المخطط زمن القيادة والزيارة مقابل عدد الساعات التي
      تريد قضاءها على الطريق كل يوم.
    what_it_does: >-
      مخطط الرحلات في RentUp هو أداة حيّة لبناء المسار في جورجيا، وليس
      قائمة مسار ثابتة. أضف محطات من بين 257 معلماً مثبتاً على الخريطة،
      أو حمّل إحدى 32 جولة جاهزة — يرتّب كل شيء على الخريطة ويحسب أزمنة
      القيادة من بيانات طرق حقيقية: مقاطع ترابية، ممرات جبلية عالية،
      وطرق تسير فيها السيارة ببساطة أبطأ — كلها تؤثر في التقدير. كل محطة
      تُحتسب ضمن ميزانية زمنية يومية، فترى دائماً كم ساعة تبقّت قبل أن
      يصبح اليوم مزدحماً جداً. عند إضافة مكان جديد، يُظهر المخطط بالضبط
      كم انحرافاً سيضيفه إلى مسارك؛ وبلمسة واحدة يمكنه إعادة ترتيب
      المسار بالكامل لأقل وقت قيادة إجمالي. وحين يكتمل المسار، يقترح
      فئة سيارة بناءً على الطرق التي ستقودها فعلاً — سيارة عادية على
      الطرق المعبّدة، أو دفع رباعي إذا لامس المسار طرقاً ترابية أو
      ارتفاعات عالية.
    steps:
      - title: حدد نقطة انطلاقك والتواريخ
        text: >-
          اختر مدينة الانطلاق، أو استخدم موقعك الحالي، وحدد تواريخ رحلتك
          وعدد الأيام — يُحسب تاريخ الانتهاء تلقائياً.
      - title: اختر أماكن على الخريطة أو حمّل جولة جاهزة
        text: >-
          انقر على العلامات في الخريطة أو قائمة الأماكن لإضافة محطات، أو
          افتح الجولات القياسية الـ32 وطبّق إحداها بنقرة واحدة لتبدأ من
          مسار جاهز.
      - title: راقب الميزانية الزمنية اليومية
        text: >-
          تضيف كل محطة زمن زيارتها وزمن القيادة الفعلي إليها إلى المجموع،
          ويُقارَن بميزانية ساعاتك اليومية — 8 ساعات افتراضياً، وقابلة
          للتعديل لكل يوم — عبر مؤشر حي.
      - title: أعد ترتيب المحطات أو حسّنها تلقائياً
        text: >-
          اسحب المحطات لأعلى أو لأسفل في القائمة، أو انقر "ترتيب لأقصر
          وقت" ليعيد المخطط ترتيب المسار بالكامل لقيادة أقل.
      - title: احصل على سيارة موصى بها واحجز
        text: >-
          يقترح المخطط فئة سيارة بناءً على طرق مسارك وعدد أفراد رحلتك،
          ثم يتيح لك إرسال طلب حجز أو حفظ الرحلة في حسابك أو مشاركة
          الرابط.
    features:
      - ميزانية زمن قيادة يومية، لا مجرد مجموع إجمالي للرحلة
      - أزمنة قيادة محسوبة من بيانات طرق حقيقية — الحصى والممرات الجبلية
        وحدود السرعة، لا المسافة المستقيمة
      - 257 مكاناً مثبتاً على الخريطة للاختيار من بينها
      - 32 جولة جاهزة يمكن تحميلها وتعديلها بنقرة واحدة
      - يعرض أقصر انحراف لأي مكان قبل إضافته
      - إعادة ترتيب المسار بنقرة واحدة لأقل زمن قيادة إجمالي
      - إعادة ترتيب المحطات بالسحب والإفلات
      - فئة سيارة تناسب طرق مسارك الفعلية — عادية أو دفع رباعي جزئي أو كامل
    for_whom: >-
      مناسب لكل من يخطط مسار قيادته الخاص في جورجيا — زائر لأول مرة
      يتردد بين قزبيغي وكاخيتي، أو مسافر عائد يبني مساراً أطول. يعمل
      سواء استأجرت سيارة منا، أو أحضرت سيارتك الخاصة، أو استعنت بسائق.
    faq:
      - q: كيف يعرف المخطط كم مكاناً يتسع في يوم واحد؟
        a: >-
          لكل معلم مدة زيارة معتادة، ويضيف إليها المخطط زمن القيادة
          الفعلي بين المحطات — حسب نوع الطريق والارتفاع، لا المسافة
          المستقيمة. يُقارَن المجموع بالساعات التي حددتها لذلك اليوم،
          ويحذرك قبل أن تتجاوز محطة الميزانية.
      - q: هل يمكنني البدء من جولة جاهزة وما زلت أستطيع تعديلها؟
        a: >-
          نعم. تحميل إحدى الجولات القياسية الـ32 يملأ المحطات والأيام
          نيابة عنك، ثم يمكنك إضافة أو إزالة أو سحب أي منها تماماً كما
          لو بنيت المسار من الصفر.
      - q: هل يراعي طرق جورجيا الجبلية، لا المسافة فقط؟
        a: >-
          نعم. يتباطأ تقدير زمن القيادة على الطرق المصنّفة ترابية أو
          للدفع الرباعي فقط وعند الارتفاعات العالية، لذا يُحسب المقطع
          الجبلي بشكل مختلف عن نفس المسافة على طريق سريع.
      - q: ما السيارة التي يوصي بها؟
        a: >-
          يتحقق مما إذا كان مسارك يمر بطرق جبلية عالية أو غير معبّدة؛
          إن كان كذلك يقترح دفعاً رباعياً، وإلا فالفئة العادية كافية.
          يمكنك تجاوز الاقتراح واختيار أي سيارة من الأسطول بنفسك.
      - q: هل أحتاج حساباً لتخطيط رحلة؟
        a: >-
          لا — يمكنك بناء مسار ومشاركته دون تسجيل الدخول. الحساب مطلوب
          فقط إن أردت حفظ الرحلة في ملفك الشخصي بدلاً من الاكتفاء برابط
          قابل للمشاركة.
      - q: هل يمكنني مشاركة الرحلة التي خططتها مع شخص آخر؟
        a: >-
          نعم. لكل مسار رابط يتضمن محطاتك وتواريخك وأيامك، فيمكنك
          إرساله لرفيق سفرك أو فتحه بنفسك لاحقاً.
    cta_open: افتح مخطط الرحلات
    cta_routes: تصفح الجولات الـ32
    cta_places: تصفح الأماكن الـ257
    cta_car: شاهد السيارات

home:
  en:
    h1: Car Rental & Road Trip Planning in Georgia
    lead: >-
      RentUp rents cars across Georgia and gives you a free tool to plan
      the drive itself — pick your own stops or start from a ready-made
      route.
    sections:
      rent_a_car:
        h2: Car rental in Georgia
        body: >-
          RentUp keeps a fleet of 17 cars, from economy sedans to 4x4s
          built for gravel mountain roads. Every rental includes
          unlimited mileage inside Georgia, with pickup in Tbilisi,
          Kutaisi or Batumi, including the airports. Rates are quoted
          per day and fall the longer you keep the car.
      plan_your_trip:
        h2: Plan your trip
        body: >-
          The trip planner builds a day-by-day Georgia itinerary on a
          map: add stops and it counts real drive time and visit time
          against how many hours you want on the road each day. Drag
          stops to reorder them, or let the planner sort the route for
          the shortest driving time, then get a car class recommendation
          matched to the roads you'll actually drive.
      ready_made_routes:
        h2: Ready-made routes
        body: >-
          Not sure where to start? Choose from 32 ready-made routes
          covering the country's regions, from a single day walking
          Tbilisi to a ten-day loop across the whole country. Load one
          into the planner and adjust the stops, days or pace to fit
          your own trip.
      places_to_visit:
        h2: Places to visit
        body: >-
          The map holds 257 attractions across Georgia — monasteries,
          fortresses, canyons, waterfalls, wineries and mountain
          villages — each with a typical visit length, distance from
          Tbilisi and the kind of road you need to reach it. Use them
          to build your own route, or see what's nearby on one of the
          ready-made ones.
      cars_for_every_route:
        h2: A car for every route
        body: >-
          Not every route needs the same car. Paved roads to Kakheti or
          Kutaisi are fine in a standard sedan, but a route into the
          high mountains — passes above 2,000 metres, or roads marked
          4x4-only — needs a proper off-roader. The planner checks your
          route's roads and elevation and recommends the right class
          from the 17-car fleet automatically.

  ka:
    h1: მანქანის გაქირავება და მოგზაურობის დაგეგმვა საქართველოში
    lead: >-
      RentUp გთავაზობთ მანქანის გაქირავებას საქართველოში და უფასო
      ინსტრუმენტს თავად მარშრუტის დასაგეგმად — აირჩიე საკუთარი
      გაჩერებები ან დაიწყე მზა მარშრუტიდან.
    sections:
      rent_a_car:
        h2: მანქანის გაქირავება საქართველოში
        body: >-
          RentUp-ს 17 მანქანა აქვს — ეკონომ სედანებიდან 4x4-მდე,
          გრუნტიანი მთის გზებისთვის. ყველა ქირაობა შეზღუდვის გარეშე
          გარბენს მოიცავს საქართველოს მასშტაბით, აღება კი შესაძლებელია
          თბილისში, ქუთაისში ან ბათუმში, აეროპორტების ჩათვლით. ტარიფი
          დღიურია და მით უფრო იკლებს, რაც უფრო ხანგრძლივია ქირაობა.
      plan_your_trip:
        h2: დაგეგმე შენი მოგზაურობა
        body: >-
          ტურის დამგეგმავი აგებს დღეების მიხედვით მარშრუტს რუკაზე —
          დაამატე გაჩერებები და ის დაითვლის რეალურ სავალ და
          დათვალიერების დროს იმის მიხედვით, რამდენი საათი გინდა
          იმგზავრო დღეში. გადაათრიე გაჩერებები გადასალაგებლად, ან
          მიანდე დამგეგმავს უმოკლესი სავალი დროის მოძებნა, შემდეგ
          მიიღე მანქანის კლასის რეკომენდაცია იმ გზების მიხედვით,
          რომლებზეც რეალურად გაივლი.
      ready_made_routes:
        h2: მზა მარშრუტები
        body: >-
          არ იცი საიდან დაიწყო? აირჩიე 32 მზა მარშრუტიდან, რომლებიც
          ქვეყნის ყველა რეგიონს მოიცავს — ერთდღიანი სეირნობიდან
          თბილისში ათდღიან მარშრუტამდე მთელ ქვეყანაზე. ჩატვირთე ერთი
          დამგეგმავში და მოარგე გაჩერებები, დღეები ან ტემპი შენს
          მოგზაურობას.
      places_to_visit:
        h2: სანახაობები
        body: >-
          რუკაზე დატანილია 257 ღირსშესანიშნაობა საქართველოში —
          მონასტრები, ციხე-სიმაგრეები, კანიონები, ჩანჩქერები, მარნები
          და მთის სოფლები — თითოეული დათვალიერების ჩვეული
          ხანგრძლივობით, თბილისიდან მანძილითა და საჭირო გზის ტიპით.
          გამოიყენე ისინი საკუთარი მარშრუტის ასაგებად ან იმისთვის, რომ
          ნახო, რა არის ახლოს რომელიმე მზა მარშრუტზე.
      cars_for_every_route:
        h2: მანქანა ყველა მარშრუტისთვის
        body: >-
          ყველა მარშრუტს ერთი მანქანა არ სჭირდება. ასფალტიანი გზა
          კახეთამდე ან ქუთაისამდე სტანდარტულ სედანშიც კარგად გადის,
          მაგრამ მარშრუტი მაღალმთაში — 2000 მეტრზე მაღალი
          უღელტეხილებით ან მხოლოდ 4x4-სთვის მონიშნული გზებით — ნამდვილ
          სრულ წამყვან მანქანას საჭიროებს. დამგეგმავი ამოწმებს
          მარშრუტის გზებსა და სიმაღლეს და ავტომატურად გირჩევს სწორ
          კლასს 17 მანქანიანი ავტოპარკიდან.

  ru:
    h1: Аренда авто и планирование путешествий по Грузии
    lead: >-
      RentUp сдаёт машины по всей Грузии и даёт бесплатный инструмент для
      планирования самой поездки — выбирайте свои остановки или начните
      с готового маршрута.
    sections:
      rent_a_car:
        h2: Аренда авто в Грузии
        body: >-
          У RentUp 17 машин — от эконом-седанов до 4x4 для грунтовых
          горных дорог. Каждая аренда включает неограниченный пробег по
          Грузии, а забрать машину можно в Тбилиси, Кутаиси или Батуми,
          включая аэропорты. Тариф дневной и снижается, чем дольше вы
          держите машину.
      plan_your_trip:
        h2: Спланируйте поездку
        body: >-
          Планировщик строит маршрут по Грузии по дням на карте —
          добавляйте остановки, и он посчитает реальное время в пути и
          на осмотр относительно того, сколько часов в день вы хотите
          ехать. Перетаскивайте остановки, чтобы менять порядок, или
          доверьте планировщику найти кратчайший маршрут, а затем
          получите рекомендацию по классу машины под реальные дороги
          маршрута.
      ready_made_routes:
        h2: Готовые маршруты
        body: >-
          Не знаете, с чего начать? Выберите один из 32 готовых
          маршрутов по всем регионам страны — от однодневной прогулки по
          Тбилиси до десятидневного маршрута по всей стране. Загрузите
          его в планировщик и подгоните остановки, дни или темп под
          свою поездку.
      places_to_visit:
        h2: Что посмотреть
        body: >-
          На карте отмечено 257 достопримечательностей Грузии —
          монастыри, крепости, каньоны, водопады, винодельни и горные
          сёла — у каждой указана типичная продолжительность осмотра,
          расстояние от Тбилиси и тип дороги, нужной, чтобы туда
          добраться. Стройте с их помощью свой маршрут или смотрите, что
          рядом с одним из готовых.
      cars_for_every_route:
        h2: Машина под любой маршрут
        body: >-
          Не для каждого маршрута нужна одна и та же машина. По асфальту
          до Кахетии или Кутаиси хватит обычного седана, а маршрут в
          высокие горы — перевалы выше 2000 метров или дороги только для
          4x4 — требует настоящего внедорожника. Планировщик проверяет
          дороги и высоту вашего маршрута и автоматически рекомендует
          нужный класс из автопарка на 17 машин.

  fa:
    h1: اجارهٔ خودرو و برنامه‌ریزی سفر جاده‌ای در گرجستان
    lead: >-
      RentUp در سراسر گرجستان خودرو اجاره می‌دهد و ابزاری رایگان برای
      برنامه‌ریزی خود سفر در اختیار شما می‌گذارد — توقف‌های خودتان را
      انتخاب کنید یا از یک مسیر آماده شروع کنید.
    sections:
      rent_a_car:
        h2: اجارهٔ خودرو در گرجستان
        body: >-
          RentUp ناوگانی از ۱۷ خودرو دارد، از سدان‌های اقتصادی تا ۴×۴
          برای جاده‌های خاکی کوهستانی. هر اجاره شامل کیلومتر نامحدود در
          سراسر گرجستان است و تحویل در تفلیس، کوتایسی یا باتومی، از
          جمله فرودگاه‌ها، ممکن است. نرخ‌ها روزانه هستند و هرچه خودرو را
          بیشتر نگه دارید، ارزان‌تر می‌شوند.
      plan_your_trip:
        h2: سفرتان را برنامه‌ریزی کنید
        body: >-
          برنامه‌ریز سفر یک مسیر روزبه‌روز در گرجستان روی نقشه می‌سازد —
          توقف‌ها را اضافه کنید تا زمان واقعی رانندگی و بازدید را بر
          اساس ساعاتی که می‌خواهید هر روز در جاده باشید حساب کند.
          توقف‌ها را برای تغییر ترتیب بکشید، یا اجازه دهید برنامه‌ریز
          کوتاه‌ترین مسیر را پیدا کند، سپس کلاس خودروی متناسب با
          جاده‌های واقعی مسیرتان را دریافت کنید.
      ready_made_routes:
        h2: مسیرهای آماده
        body: >-
          نمی‌دانید از کجا شروع کنید؟ از میان ۳۲ مسیر آماده که همهٔ
          مناطق کشور را پوشش می‌دهند انتخاب کنید — از یک روز پیاده‌روی
          در تفلیس تا مسیری ده‌روزه در سراسر کشور. یکی را در برنامه‌ریز
          بارگذاری کنید و توقف‌ها، روزها یا سرعت را متناسب با سفر خودتان
          تنظیم کنید.
      places_to_visit:
        h2: مکان‌های دیدنی
        body: >-
          روی نقشه ۲۵۷ جاذبه در سراسر گرجستان ثبت شده است — صومعه‌ها،
          دژها، دره‌ها، آبشارها، شراب‌خانه‌ها و روستاهای کوهستانی —
          هرکدام با مدت بازدید معمول، فاصله از تفلیس و نوع جاده‌ای که
          برای رسیدن به آن لازم است. از آن‌ها برای ساختن مسیر خودتان
          استفاده کنید یا ببینید در نزدیکی یکی از مسیرهای آماده چه
          چیزی هست.
      cars_for_every_route:
        h2: خودرویی برای هر مسیر
        body: >-
          هر مسیر به یک نوع خودرو نیاز ندارد. جاده‌های آسفالت به سمت
          کاختی یا کوتایسی با یک سدان معمولی به‌راحتی طی می‌شود، اما
          مسیری به دل کوه‌های مرتفع — گردنه‌های بالای ۲۰۰۰ متر یا
          جاده‌های مخصوص ۴×۴ — به یک خودروی واقعی آفرود نیاز دارد.
          برنامه‌ریز جاده‌ها و ارتفاع مسیر شما را بررسی می‌کند و
          به‌طور خودکار کلاس مناسب را از ناوگان ۱۷ خودرویی پیشنهاد
          می‌دهد.

  he:
    h1: השכרת רכב ותכנון טיולים בגאורגיה
    lead: >-
      RentUp משכירה רכבים בכל רחבי גאורגיה ומעניקה לכם כלי חינמי לתכנון
      הנסיעה עצמה — בחרו את העצירות שלכם או התחילו ממסלול מוכן.
    sections:
      rent_a_car:
        h2: השכרת רכב בגאורגיה
        body: >-
          ל-RentUp צי של 17 רכבים, מסדאנים חסכוניים ועד רכבי 4x4 לדרכי
          הרים לא סלולות. כל השכרה כוללת קילומטראז' בלתי מוגבל בתוך
          גאורגיה, עם איסוף בטביליסי, בקוטאיסי או בבאתומי, כולל שדות
          התעופה. התעריפים יומיים ויורדים ככל שמחזיקים את הרכב זמן רב
          יותר.
      plan_your_trip:
        h2: תכננו את הטיול שלכם
        body: >-
          מתכנן הטיולים בונה מסלול יומיומי בגאורגיה על גבי מפה — הוסיפו
          עצירות, והוא סופר את זמן הנסיעה והביקור האמיתיים מול כמה
          שעות אתם רוצים להיות בדרך בכל יום. גררו עצירות לשינוי סדר, או
          תנו למתכנן למצוא את המסלול הקצר ביותר, ואז קבלו המלצה על
          קטגוריית רכב שמתאימה לדרכים שבאמת תיסעו בהן.
      ready_made_routes:
        h2: מסלולים מוכנים
        body: >-
          לא בטוחים מאיפה להתחיל? בחרו מבין 32 מסלולים מוכנים שמכסים
          את כל אזורי הארץ — מיום אחד של הליכה בטביליסי ועד מסלול בן
          עשרה ימים ברחבי המדינה כולה. טענו אחד למתכנן והתאימו את
          העצירות, הימים או הקצב לטיול שלכם.
      places_to_visit:
        h2: מקומות לביקור
        body: >-
          על המפה מסומנים 257 אתרים ברחבי גאורגיה — מנזרים, מבצרים,
          קניונים, מפלים, יקבים וכפרי הרים — לכל אחד משך ביקור טיפוסי,
          מרחק מטביליסי וסוג הדרך הדרושה כדי להגיע אליו. השתמשו בהם כדי
          לבנות מסלול משלכם, או בדקו מה נמצא בקרבת אחד המסלולים
          המוכנים.
      cars_for_every_route:
        h2: רכב לכל מסלול
        body: >-
          לא כל מסלול דורש אותו רכב. כביש סלול לקחתי או לקוטאיסי מתאים
          היטב לסדאן רגיל, אבל מסלול אל ההרים הגבוהים — מעברים מעל
          2,000 מטר, או דרכים המסומנות ל-4x4 בלבד — דורש רכב שטח אמיתי.
          המתכנן בודק את הדרכים והגובה במסלול שלכם וממליץ אוטומטית על
          הקטגוריה הנכונה מתוך צי בן 17 הרכבים.

  ar:
    h1: تأجير السيارات وتخطيط الرحلات البرية في جورجيا
    lead: >-
      تؤجّر RentUp سيارات في أنحاء جورجيا وتمنحك أداة مجانية لتخطيط
      الرحلة نفسها — اختر محطاتك الخاصة أو ابدأ من جولة جاهزة.
    sections:
      rent_a_car:
        h2: تأجير السيارات في جورجيا
        body: >-
          تمتلك RentUp أسطولاً من 17 سيارة، من السيدان الاقتصادية إلى
          سيارات الدفع الرباعي المخصصة للطرق الجبلية الترابية. يشمل كل
          إيجار مسافة غير محدودة داخل جورجيا، مع الاستلام في تبليسي أو
          كوتايسي أو باتومي، بما في ذلك المطارات. الأسعار يومية وتنخفض
          كلما احتفظت بالسيارة مدة أطول.
      plan_your_trip:
        h2: خطط رحلتك
        body: >-
          يبني مخطط الرحلات مساراً يومياً في جورجيا على الخريطة — أضف
          محطات ليحسب زمن القيادة والزيارة الفعليين مقابل عدد الساعات
          التي تريد قضاءها على الطريق كل يوم. اسحب المحطات لإعادة
          ترتيبها، أو دع المخطط يجد أقصر مسار، ثم احصل على توصية بفئة
          سيارة تناسب الطرق التي ستقودها فعلاً.
      ready_made_routes:
        h2: جولات جاهزة
        body: >-
          لست متأكداً من أين تبدأ؟ اختر من بين 32 جولة جاهزة تغطي مناطق
          البلاد كلها — من يوم واحد للتجول في تبليسي إلى مسار من عشرة
          أيام عبر البلاد بأكملها. حمّل إحداها في المخطط وعدّل المحطات
          أو الأيام أو الوتيرة لتناسب رحلتك.
      places_to_visit:
        h2: أماكن تستحق الزيارة
        body: >-
          تحتوي الخريطة على 257 معلماً في أنحاء جورجيا — أديرة وقلاعاً
          وأودية وشلالات ومصانع نبيذ وقرى جبلية — لكل منها مدة زيارة
          معتادة، ومسافة من تبليسي، ونوع الطريق اللازم للوصول إليه.
          استخدمها لبناء مسارك الخاص، أو لمعرفة ما هو قريب من إحدى
          الجولات الجاهزة.
      cars_for_every_route:
        h2: سيارة لكل مسار
        body: >-
          لا يحتاج كل مسار إلى نفس السيارة. الطرق المعبّدة إلى كاخيتي
          أو كوتايسي تكفيها سيارة سيدان عادية، لكن مساراً إلى الجبال
          العالية — ممرات فوق 2000 متر أو طرق مخصصة للدفع الرباعي فقط —
          يحتاج سيارة دفع رباعي حقيقية. يتحقق المخطط من طرق مسارك
          وارتفاعه ويوصي تلقائياً بالفئة المناسبة من أسطول الـ17 سيارة.
