ka:
  name: სამცხე-ჯავახეთის დიდი ისტორიული გზა
  short: ოთხი დღე ბორჯომიდან რაბათის, ვარძიისა და ჯავახეთის ტბების გავლით.
  body: სამხრეთის მთავარი ისტორიული რგოლი აერთიანებს ციხეებს, კლდეში ნაკვეთ კომპლექსებსა და მაღალმთიან ტბებს; ბოლო მონაკვეთზე SUV უფრო კომფორტულია.
  plan: "**დღე 1:** ბორჯომი → რაბათი. **დღე 2:** საფარა → ხერთვისი → ვარძია. **დღე 3:** ვანის ქვაბები → კუმურდო. **დღე 4:** ფარავანი → თბილისი."
  tips: [ვარძიისთვის მინიმუმ ორი საათი დატოვეთ., ზეგანზე თბილი ფენა ყოველთვის იქონიეთ.]
en:
  name: Grand Samtskhe-Javakheti Heritage Road
  short: Four days via Borjomi, Rabati, Vardzia and the Javakheti lakes.
  body: Southern Georgia's core heritage loop combines fortresses, cave complexes and highland lakes.
  plan: "**Day 1:** Borjomi → Rabati. **Day 2:** Sapara → Khertvisi → Vardzia. **Day 3:** Vanis Kvabebi → Kumurdo. **Day 4:** Paravani → Tbilisi."
  tips: [Allow at least two hours for Vardzia., Carry a warm layer on the plateau.]
ru:
  name: Большой исторический путь Самцхе-Джавахети
  short: Четыре дня через Боржоми, Рабат, Вардзию и озёра Джавахети.
  body: Главный южный маршрут объединяет крепости, пещерные комплексы и высокогорные озёра.
  plan: "**День 1:** Боржоми → Рабат. **День 2:** Сапара → Хертвиси → Вардзия. **День 3:** Ванис-Квабеби → Кумурдо. **День 4:** Паравани → Тбилиси."
  tips: [На Вардзию отведите два часа., Возьмите тёплую одежду.]
fa:
  name: جاده بزرگ تاریخی سامتسخه-جاواختی
  short: چهار روز از برجومی تا رباتی، واردزیا و دریاچه‌های جاواختی.
  body: حلقه جنوبی شامل قلعه‌ها، مجموعه‌های صخره‌ای و دریاچه‌های مرتفع است.
  plan: "**روز ۱:** برجومی → رباتی. **روز ۲:** ساپارا → خرتویسی → واردزیا. **روز ۳:** وانیس کواببی → کوموردو. **روز ۴:** پاراوانی → تفلیس."
  tips: [دو ساعت برای واردزیا بگذارید., لباس گرم همراه داشته باشید.]
he:
  name: דרך המורשת הגדולה של סמצחה-ג'אוואחתי
  short: ארבעה ימים דרך בורג'ומי, רבאטי, ורדזיה ואגמי ג'אוואחתי.
  body: מסלול הדרום משלב מבצרים, מערות ואגמים גבוהים.
  plan: "**יום 1:** בורג'ומי → רבאטי. **יום 2:** ספארה → חרטוויסי → ורדזיה. **יום 3:** ואניס קוואבבי → קומורדו. **יום 4:** פאראוואני → טביליסי."
  tips: [הקדישו שעתיים לוורדזיה., קחו שכבה חמה.]
ar:
  name: طريق سامتسخه-جافاخيتي التاريخي الكبير
  short: أربعة أيام عبر بورجومي ورباتي وفاردزيا وبحيرات جافاخيتي.
  body: حلقة الجنوب تجمع القلاع والمجمعات الصخرية والبحيرات المرتفعة.
  plan: "**اليوم 1:** بورجومي ← رباتي. **اليوم 2:** سابارا ← خيرتفيسي ← فاردزيا. **اليوم 3:** فانيس كفابيبي ← كوموردو. **اليوم 4:** بارافاني ← تبليسي."
  tips: [خصصوا ساعتين لفاردزيا., احملوا طبقة دافئة.]
