ka:
  name: თუშეთის მაღალმთიანი ჰაიქინგი
  short: ხუთი დღე აბანოს უღელტეხილზე, ომალოში, დართლოსა და შენაქო-დიკლოში.
  body: მხოლოდ ზაფხულის, მაღალი რისკის მარშრუტია. აბანოს გზა საჭიროებს გამართულ 4x4-სა და გამოცდილ ადგილობრივ მძღოლს; ამინდის გაუარესებისას ტური გადაიდება.
  plan: "**დღე 1:** ალავერდი → აბანოს უღელტეხილი → ომალო. **დღე 2:** ომალო. **დღე 3:** დართლო. **დღე 4:** შენაქო–დიკლო. **დღე 5:** დაბრუნება."
  tips: [გამოცდილი ადგილობრივი მძღოლი სავალდებულოა., ამინდის რეზერვისთვის ერთი დღე დატოვეთ.]
en:
  name: Tusheti Highland Hiking
  short: Five days over Abano Pass to Omalo, Dartlo, Shenako and Diklo.
  body: A summer-only high-risk route requiring a capable 4x4 and experienced local driver; postpone in poor weather.
  plan: "**Day 1:** Alaverdi → Abano Pass → Omalo. **Day 2:** Omalo. **Day 3:** Dartlo. **Day 4:** Shenako–Diklo. **Day 5:** return."
  tips: [An experienced local driver is essential., Keep one weather-buffer day.]
ru:
  name: Высокогорный хайкинг в Тушети
  short: Пять дней через перевал Абано в Омало, Дартло, Шенако и Дикло.
  body: Только летний маршрут повышенного риска; необходимы исправный 4x4 и опытный местный водитель.
  plan: "**День 1:** Алаверди → Абано → Омало. **День 2:** Омало. **День 3:** Дартло. **День 4:** Шенако–Дикло. **День 5:** возвращение."
  tips: [Обязателен местный водитель., Оставьте резервный день.]
fa:
  name: پیاده‌روی ارتفاعات توشتی
  short: پنج روز از گردنه آبانو تا اومالو، دارتلو، شناکو و دیکلو.
  body: مسیر پرخطر فقط تابستان با 4x4 سالم و راننده محلی باتجربه.
  plan: "**روز ۱:** آلاوردی → آبانو → اومالو. **روز ۲:** اومالو. **روز ۳:** دارتلو. **روز ۴:** شناکو–دیکلو. **روز ۵:** بازگشت."
  tips: [راننده محلی ضروری است., یک روز ذخیره بگذارید.]
he:
  name: טיול הרים בטושתי
  short: חמישה ימים דרך מעבר אבאנו לאומאלו, דרטלו, שנאקו ודיקלו.
  body: מסלול קיץ בסיכון גבוה הדורש 4x4 תקין ונהג מקומי מנוסה.
  plan: "**יום 1:** אלאוורדי → אבאנו → אומאלו. **יום 2:** אומאלו. **יום 3:** דרטלו. **יום 4:** שנאקו–דיקלו. **יום 5:** חזרה."
  tips: [נהג מקומי חיוני., השאירו יום גיבוי.]
ar:
  name: مشي مرتفعات توشيتي
  short: خمسة أيام عبر ممر أبانو إلى أومالو ودارتلو وشيناكو وديكلو.
  body: مسار صيفي عالي المخاطر يتطلب 4x4 جيداً وسائقاً محلياً خبيراً.
  plan: "**اليوم 1:** ألافيردي ← أبانو ← أومالو. **اليوم 2:** أومالو. **اليوم 3:** دارتلو. **اليوم 4:** شيناكو–ديكلو. **اليوم 5:** العودة."
  tips: [السائق المحلي ضروري., اتركوا يوماً احتياطياً.]
