ka:
  name: სამხედრო გზა და ყაზბეგი
  short: ორი დღე საქართველოს მთავარ სამთო გზაზე — ჟინვალი, ანანური, გუდაური და გერგეტის სამება.
  body: >-
    საქართველოს სამხედრო გზა ქვეყნის ყველაზე ცნობილი სამთო მარშრუტია: 155 კილომეტრი თბილისიდან სტეფანწმინდამდე,
    რომელიც ჯერ არაგვის, შემდეგ კი თერგის ხეობას მიუყვება და ჯვრის უღელტეხილზე 2 379 მეტრს აღწევს. ორი
    დღე სწორედ ის დროა, რომ ეს გზა აჩქარების გარეშე გაიარო: პირველ დღეს ჩრდილოეთისკენ მიდიხარ, მეორეს
    კი ნელა ბრუნდები და გზაში დარჩენილ გაჩერებებს აგროვებ.


    მარშრუტზე პეიზაჟი რამდენჯერმე იცვლება. ჯერ მცხეთა და ჯვრის მონასტერი, მერე ჟინვალის წყალსაცავის ფირუზისფერი
    წყალი და მის კონცხზე მდგარი **ანანურის ციხე** — პირველი დიდი გაჩერება. შემდეგ არაგვის ვიწრო ხეობა,
    ფასანაური და მლეთა-გუდაურის სერპანტინი მოდის, ბოლოს კი გუდაურის პლატო და მეგობრობის მონუმენტი, საიდანაც
    დევდორაკის ხეობა იშლება. უღელტეხილის მიღმა ლანდშაფტი მკვეთრად სხვაა: მინერალური წყლის ნარინჯისფერი
    ტრავერტინები ქობთან, თერგის ვიწრობი და ბოლოს სტეფანწმინდა, რომლის თავზეც გერგეტის სამება და ყაზბეგის
    5 047-მეტრიანი მწვერვალი დგას.


    მარშრუტი გამოდგება მათთვის, ვისაც ბევრი დრო არ აქვს, მაგრამ ნამდვილი მთა უნდა ნახოს — ბავშვებიანი
    ოჯახებისთვისაც კომფორტულია, რადგან ასფალტი ბოლომდე გრძელდება. გზა მთელი წელი მუშაობს, თუმცა ზამთარში
    უღელტეხილი ზვავის საფრთხის გამო დროებით იკეტება ხოლმე, გერგეტამდე ასასვლელი კი მაღალი კლირენსის ავტომობილს
    ითხოვს. შესაფერისი მანქანა [ავტოპარკში](/fleet/) აირჩიე.
  plan: >-
    **დღე 1 · თბილისი → სტეფანწმინდა (170 კმ, 3 სთ 30 წთ)**

    - 09:00 გასვლა თბილისიდან, 25 კმ-ში მცხეთა და ჯვრის მონასტერი (1 სთ).

    - 11:00 ჟინვალის წყალსაცავი — ხედის მოედანი და ფოტოგაჩერება (30 წთ).

    - 11:45 ანანურის ციხე, ღვთისმშობლის ეკლესია და კოშკი (1 სთ 15 წთ).

    - 13:30 სადილი ფასანაურში ან ქვეშეთში (1 სთ).

    - 15:30 გუდაური და მეგობრობის მონუმენტი (1 სთ), საჭიროებისას ბენზინი.

    - 18:00 ჩამოსვლა სტეფანწმინდაში, ღამისთევა სტეფანწმინდაში.


    **დღე 2 · სტეფანწმინდა → თბილისი (170 კმ, 3 სთ 10 წთ)**

    - 08:30 ასვლა **გერგეტის სამებამდე** — 6 კმ ციცაბო გზა ან 1,5 სთ ფეხით (2 სთ).

    - 11:00 დარიალის ხეობა და გველეთის ჩანჩქერები (1 სთ 30 წთ).

    - 13:00 სადილი სტეფანწმინდაში (1 სთ).

    - 14:30 დაბრუნება უღელტეხილით, გაჩერება ქობის ტრავერტინებთან (30 წთ).

    - 17:00 ბოლო შესვენება ანანურთან ან ჟინვალთან (30 წთ).

    - 19:00 თბილისში დაბრუნება.
  tips:
  - საწვავი ბოლოს ფასანაურსა და გუდაურში აავსე — სტეფანწმინდაში სადგურები ცოტაა.
  - >-
    ზამთარში უღელტეხილი ზვავის გამო რამდენიმე საათით ან დღით შეიძლება დაიკეტოს; გასვლამდე გზების მდგომარეობა
    შეამოწმე.
  - გერგეტამდე ასასვლელი გზა ვიწრო და ციცაბოა — მაღალი კლირენსი და მშრალი ამინდი აუცილებელია.
  - 'მონასტრებში ჩაცმის კოდია: ქალებს თავსაფარი და გრძელი კაბა, მამაკაცებს გრძელი შარვალი.'
  - მთაში 15-20 გრადუსით ცივა, ვიდრე თბილისში — ქურთუკი ზაფხულშიც წაიღე.
  - სასტუმრო სტეფანწმინდაში წინასწარ დაჯავშნე, განსაკუთრებით ივლის-აგვისტოში.
en:
  name: Georgian Military Highway and Kazbegi
  short: Two days on Georgia's great mountain road — Zhinvali, Ananuri, Gudauri and Gergeti Trinity.
  body: >-
    The Georgian Military Highway is the country's most famous mountain road: 155 kilometres from Tbilisi
    to Stepantsminda, following first the Aragvi and then the Tergi valley and crossing the Jvari Pass
    at 2,379 metres. Two days is exactly the right amount of time to drive it without rushing — you head
    north on the first day and drift back on the second, picking up the stops you skipped on the way up.


    The scenery changes character several times. First Mtskheta and Jvari Monastery on their confluence
    hill, then the turquoise water of the Zhinvali reservoir and **Ananuri Fortress** standing on its
    headland — the first real stop. After that come the narrow Aragvi gorge, Pasanauri, and the switchbacks
    up to Gudauri, where the Friendship Monument looks straight into the Devdoraki valley. Beyond the
    pass the landscape shifts again: rust-orange mineral travertines near Kobi, the tight Tergi defile,
    and finally Stepantsminda under Gergeti Trinity Church and the 5,047-metre summit of Mount Kazbek.


    This route suits travellers who are short on time but want genuine high mountains. It works for families
    too, because the asphalt runs all the way. The highway is open year round, though in winter the pass
    closes for a few hours or days after heavy snow, and the last climb to Gergeti needs real ground clearance.
    Pick a car with enough clearance from our [fleet](/fleet/) before you set off.
  plan: >-
    **Day 1 · Tbilisi → Stepantsminda (170 km, 3 h 30 min)**

    - 09:00 Leave Tbilisi; after 25 km stop in Mtskheta and at Jvari Monastery (1 h).

    - 11:00 Zhinvali reservoir viewpoint, photo stop (30 min).

    - 11:45 Ananuri Fortress — the church, the carved facade and the tower (1 h 15 min).

    - 13:30 Lunch in Pasanauri or Kvesheti (1 h).

    - 15:30 Gudauri and the Friendship Monument (1 h); refuel here if needed.

    - 18:00 Arrive Stepantsminda; overnight in Stepantsminda.


    **Day 2 · Stepantsminda → Tbilisi (170 km, 3 h 10 min)**

    - 08:30 Climb to **Gergeti Trinity Church** — 6 km of steep track or a 1.5 h walk (2 h).

    - 11:00 Dariali Gorge and the Gveleti waterfalls (1 h 30 min).

    - 13:00 Lunch in Stepantsminda (1 h).

    - 14:30 Drive back over the pass, stopping at the Kobi travertines (30 min).

    - 17:00 Final break at Ananuri or Zhinvali (30 min).

    - 19:00 Back in Tbilisi.
  tips:
  - Fill up in Pasanauri or Gudauri — petrol stations thin out beyond the pass.
  - In winter the Jvari Pass can close for hours or days after snowfall; check road status before leaving.
  - The track up to Gergeti is narrow and steep — high clearance and dry weather are essential.
  - 'Monasteries have a dress code: headscarf and long skirt for women, long trousers for men.'
  - It is 15-20°C colder in the mountains than in Tbilisi; bring a jacket even in July.
  - Book your Stepantsminda hotel in advance, especially in July and August.
ru:
  name: Военно-Грузинская дорога и Казбеги
  short: Два дня на главной горной дороге Грузии — Жинвали, Ананури, Гудаури и Гергети.
  body: >-
    Военно-Грузинская дорога — самый известный горный маршрут страны: 155 километров от Тбилиси до Степанцминды.
    Она идёт сначала вдоль Арагви, потом вдоль Терека и перебирается через Крестовый перевал на высоте
    2 379 метров. Двух дней достаточно, чтобы проехать её без спешки: в первый день вы поднимаетесь на
    север, во второй неторопливо возвращаетесь и собираете то, что пропустили по дороге вверх.


    Пейзаж меняется несколько раз. Сначала Мцхета и монастырь Джвари над слиянием рек, затем бирюзовая
    вода Жинвальского водохранилища и **крепость Ананури** на мысу — первая большая остановка. Дальше
    узкое ущелье Арагви, Пасанаури и серпантин Млета — Гудаури, где смотровая площадка Монумента дружбы
    смотрит прямо в Девдоракское ущелье. За перевалом всё снова другое: рыжие травертины минеральных источников
    у Коби, теснина Терека и, наконец, Степанцминда под храмом Гергети и пятитысячником Казбек.


    Маршрут подойдёт тем, у кого мало времени, но хочется настоящих гор; он удобен и с детьми, потому
    что асфальт идёт до самого конца. Дорога работает круглый год, но зимой перевал закрывают на несколько
    часов или дней после снегопада, а подъём к Гергети требует высокого клиренса. Подходящую машину выбирайте
    в нашем [автопарке](/fleet/).
  plan: >-
    **День 1 · Тбилиси → Степанцминда (170 км, 3 ч 30 мин)**

    - 09:00 Выезд из Тбилиси, через 25 км — Мцхета и монастырь Джвари (1 ч).

    - 11:00 Смотровая над Жинвальским водохранилищем, фотопауза (30 мин).

    - 11:45 Крепость Ананури: церковь с резным фасадом и башня (1 ч 15 мин).

    - 13:30 Обед в Пасанаури или Квешети (1 ч).

    - 15:30 Гудаури и Монумент дружбы (1 ч), при необходимости заправка.

    - 18:00 Приезд в Степанцминду, ночёвка в Степанцминде.


    **День 2 · Степанцминда → Тбилиси (170 км, 3 ч 10 мин)**

    - 08:30 Подъём к **храму Гергети** — 6 км крутой дороги или 1,5 ч пешком (2 ч).

    - 11:00 Дарьяльское ущелье и Гвелетские водопады (1 ч 30 мин).

    - 13:00 Обед в Степанцминде (1 ч).

    - 14:30 Обратно через перевал, остановка у травертинов Коби (30 мин).

    - 17:00 Последняя пауза у Ананури или Жинвали (30 мин).

    - 19:00 Возвращение в Тбилиси.
  tips:
  - Заправляйтесь в Пасанаури или Гудаури — за перевалом заправок мало.
  - Зимой Крестовый перевал закрывают на часы или дни после снегопада; проверяйте статус дороги перед
    выездом.
  - Дорога к Гергети узкая и крутая — нужен высокий клиренс и сухая погода.
  - 'В монастырях дресс-код: платок и длинная юбка для женщин, длинные брюки для мужчин.'
  - В горах на 15-20 градусов холоднее, чем в Тбилиси, — куртка нужна даже в июле.
  - Отель в Степанцминде бронируйте заранее, особенно в июле и августе.
fa:
  name: بزرگراه نظامی گرجستان و کازبگی
  short: دو روز روی بزرگ‌ترین جادهٔ کوهستانی گرجستان — ژینوالی، آنانوری، گودائوری و تثلیث گرگتی.
  body: >-
    بزرگراه نظامی گرجستان معروف‌ترین جادهٔ کوهستانی کشور است: 155 کیلومتر از تفلیس تا کازبگی که نخست درهٔ
    آراگوی و سپس درهٔ ترگی را دنبال می‌کند و از گردنهٔ جواری در ارتفاع 2,379 متر می‌گذرد. دو روز دقیقاً
    همان اندازه زمانی است که برای رانندگی بدون شتاب لازم است — روز اول رو به شمال می‌روید و روز دوم آرام
    برمی‌گردید و توقف‌هایی را که در راه بالا جا گذاشته‌اید جمع می‌کنید.

    منظره چند بار عوض می‌شود. نخست متسختا و صومعهٔ جواری بر تپهٔ محل تلاقی رودها، سپس آب فیروزه‌ای آبگیر
    ژینوالی و **قلعهٔ آنانوری** بر دماغهٔ خود — نخستین توقف واقعی. پس از آن تنگهٔ باریک آراگوی، پاساناوری
    و سرپیچ‌های صعود به گودائوری می‌آید، جایی که بنای یادبود دوستی مستقیم به درهٔ دودوراکی نگاه می‌کند.
    آن سوی گردنه چشم‌انداز دوباره تغییر می‌کند: تراورتن‌های معدنی نارنجی-زنگاری نزدیک کوبی، تنگنای فشردهٔ
    ترگی، و سرانجام کازبگی زیر کلیسای تثلیث گرگتی و قلهٔ 5,047 متری کوه کازبک.

    این مسیر مناسب مسافرانی است که وقت کمی دارند اما کوهستان واقعی می‌خواهند. برای خانواده‌ها هم جواب
    می‌دهد، چون آسفالت تا انتها ادامه دارد. جاده تمام سال باز است، هرچند در زمستان گردنه پس از برف سنگین
    چند ساعت یا چند روز بسته می‌شود، و آخرین صعود تا گرگتی به ارتفاع کف واقعی نیاز دارد. پیش از راه افتادن
    خودرویی با ارتفاع کف کافی از [ناوگان](/fleet/) ما انتخاب کنید.
  plan: >-
    **روز 1 · تفلیس → کازبگی (170 کیلومتر، 3 ساعت و 30 دقیقه)**

    - 09:00 حرکت از تفلیس؛ پس از 25 کیلومتر توقف در متسختا و صومعهٔ جواری (1 ساعت).

    - 11:00 نقطهٔ دید آبگیر ژینوالی، توقف عکاسی (30 دقیقه).

    - 11:45 قلعهٔ آنانوری — کلیسا، نمای کنده‌کاری‌شده و برج (1 ساعت و 15 دقیقه).

    - 13:30 ناهار در پاساناوری یا کوشتی (1 ساعت).

    - 15:30 گودائوری و بنای یادبود دوستی (1 ساعت)؛ در صورت نیاز اینجا سوخت‌گیری کنید.

    - 18:00 رسیدن به کازبگی؛ شب در کازبگی.


    **روز 2 · کازبگی → تفلیس (170 کیلومتر، 3 ساعت و 10 دقیقه)**

    - 08:30 صعود به **کلیسای تثلیث گرگتی** — 6 کیلومتر جادهٔ تند یا 1.5 ساعت پیاده‌روی (2 ساعت).

    - 11:00 تنگهٔ داریالی و آبشارهای گولتی (1 ساعت و 30 دقیقه).

    - 13:00 ناهار در کازبگی (1 ساعت).

    - 14:30 بازگشت از گردنه، توقف کنار تراورتن‌های کوبی (30 دقیقه).

    - 17:00 آخرین استراحت در آنانوری یا ژینوالی (30 دقیقه).

    - 19:00 بازگشت به تفلیس.
  tips:
  - باک را در پاساناوری یا گودائوری پر کنید — آن سوی گردنه پمپ‌بنزین کم می‌شود.
  - >-
    در زمستان گردنهٔ جواری پس از بارش برف ممکن است ساعت‌ها یا روزها بسته شود؛ پیش از حرکت وضعیت جاده را
    بررسی کنید.
  - جادهٔ صعود به گرگتی باریک و تند است — ارتفاع کف بالا و هوای خشک ضروری است.
  - 'در صومعه‌ها پوشش مشخصی لازم است: روسری و دامن بلند برای زنان، شلوار بلند برای مردان.'
  - در کوهستان 15-20°C سردتر از تفلیس است؛ حتی در ژوئیه کاپشن بردارید.
  - هتل کازبگی را از پیش رزرو کنید، به‌ویژه در ژوئیه و اوت.
he:
  name: כביש הצבא הגאורגי וקזבגי
  short: יומיים על כביש ההרים הגדול של גאורגיה — ז'ינוואלי, אנאנורי, גודאורי וכנסיית השילוש בגרגטי.
  body: >-
    כביש הצבא הגאורגי הוא כביש ההרים המפורסם ביותר במדינה: 155 קילומטרים מטביליסי לקזבגי, לאורך עמק האראגווי
    ואחר כך עמק התרגי, וחציית מעבר ג'וארי בגובה 2,379 מטר. יומיים הם בדיוק הזמן הנכון כדי לנסוע בו בלי
    למהר — ביום הראשון עולים צפונה, וביום השני חוזרים לאט ואוספים את העצירות שדילגתם עליהן בדרך למעלה.

    הנוף מחליף אופי כמה פעמים. תחילה מצחתה ומנזר ג'וארי על גבעת מפגש הנהרות, אחר כך המים הטורקיז של מאגר
    ז'ינוואלי ו**מבצר אנאנורי** הניצב על הלשון שמעליו — העצירה הגדולה הראשונה. אחריהם באים ערוץ האראגווי
    הצר, פסאנאורי והסרפנטינות אל גודאורי, שם אנדרטת הידידות מביטה היישר אל עמק דבדוראקי. מעבר לרכס הנוף
    משתנה שוב: טרוורטינים מינרליים בגוון חלודה ליד קובי, מצר התרגי הצר, ולבסוף קזבגי מתחת לכנסיית השילוש
    בגרגטי ולפסגת הר קזבק בגובה 5,047 מטר.

    המסלול מתאים לנוסעים שזמנם קצר אך רוצים הרים גבוהים אמיתיים. הוא עובד גם עם משפחות, כי האספלט נמשך
    עד הסוף. הכביש פתוח כל השנה, אם כי בחורף המעבר נסגר לשעות או לימים אחרי שלג כבד, והטיפוס האחרון לגרגטי
    דורש גובה גחון אמיתי. בחרו רכב עם מספיק גובה גחון מ[צי הרכבים](/fleet/) שלנו לפני היציאה.
  plan: >-
    **יום 1 · טביליסי → קזבגי (170 ק״מ, 3 שעות 30 דקות)**

    - 09:00 יציאה מטביליסי; אחרי 25 ק״מ עצירה במצחתה ובמנזר ג'וארי (1 שעה).

    - 11:00 תצפית על מאגר ז'ינוואלי, עצירת צילום (30 דקות).

    - 11:45 מבצר אנאנורי — הכנסייה, החזית המגולפת והמגדל (1 שעה 15 דקות).

    - 13:30 ארוחת צהריים בפסאנאורי או בקווישתי (1 שעה).

    - 15:30 גודאורי ואנדרטת הידידות (1 שעה); תדלוק כאן במידת הצורך.

    - 18:00 הגעה לקזבגי; לינה בקזבגי.


    **יום 2 · קזבגי → טביליסי (170 ק״מ, 3 שעות 10 דקות)**

    - 08:30 טיפוס אל **כנסיית השילוש בגרגטי** — 6 ק״מ של דרך תלולה או הליכה של 1.5 שעות (2 שעות).

    - 11:00 ערוץ דריאלי ומפלי גוולטי (1 שעה 30 דקות).

    - 13:00 ארוחת צהריים בקזבגי (1 שעה).

    - 14:30 חזרה מעל המעבר, עצירה בטרוורטינים של קובי (30 דקות).

    - 17:00 הפסקה אחרונה באנאנורי או בז'ינוואלי (30 דקות).

    - 19:00 חזרה לטביליסי.
  tips:
  - תדלקו בפסאנאורי או בגודאורי — מעבר לגדנה תחנות הדלק מתמעטות.
  - בחורף מעבר ג'וארי עלול להיסגר לשעות או לימים אחרי שלג; בדקו את מצב הכביש לפני היציאה.
  - הדרך העולה לגרגטי צרה ותלולה — גובה גחון ומזג אוויר יבש הם חובה.
  - 'במנזרים יש קוד לבוש: מטפחת וחצאית ארוכה לנשים, מכנסיים ארוכים לגברים.'
  - בהרים קר ב-15-20°C יותר מאשר בטביליסי; קחו מעיל גם ביולי.
  - הזמינו מלון בקזבגי מראש, במיוחד ביולי ובאוגוסט.
ar:
  name: الطريق العسكري الجورجي وكازبيغي
  short: يومان على أعظم طريق جبلي في جورجيا — جينفالي وأنانوري وغوداوري وكنيسة الثالوث في غيرغيتي.
  body: >-
    الطريق العسكري الجورجي هو أشهر طريق جبلي في البلاد: 155 كيلومتراً من تبليسي إلى كازبيغي، يتبع وادي
    أراغفي ثم وادي تيرغي ويعبر ممر جفاري على ارتفاع 2,379 متراً. ويومان هما تماماً الوقت المناسب لقطعه
    بلا عجلة — تصعد شمالاً في اليوم الأول وتعود مهلاً في الثاني، ملتقطاً المحطات التي تجاوزتها في طريق
    الصعود.

    يبدل المشهد طابعه مرات عدة. أولاً متسخيتا ودير جفاري على تل ملتقى النهرين، ثم المياه الفيروزية لخزان
    جينفالي و**قلعة أنانوري** القائمة على نتوئها — أول محطة حقيقية. بعد ذلك يأتي مضيق أراغفي الضيق وباسانوري
    ومنعطفات الصعود إلى غوداوري، حيث يطل نصب الصداقة مباشرة على وادي ديفدوراكي. وخلف الممر يتغير المشهد
    ثانية: ترافرتين معدني بلون الصدأ قرب كوبي، ومضيق تيرغي الخانق، وأخيراً كازبيغي تحت كنيسة الثالوث في
    غيرغيتي وقمة جبل كازبك البالغة 5,047 متراً.

    يناسب هذا المسار المسافرين الذين يضيق بهم الوقت لكنهم يريدون جبالاً عالية حقيقية. وهو يصلح للعائلات
    أيضاً، لأن الإسفلت يمتد حتى النهاية. الطريق مفتوح طوال العام، وإن كان الممر يُغلق في الشتاء ساعات
    أو أياماً بعد الثلوج الكثيفة، والصعود الأخير إلى غيرغيتي يحتاج خلوصاً أرضياً حقيقياً. اختر سيارة بخلوص
    كافٍ من [أسطولنا](/fleet/) قبل الانطلاق.
  plan: >-
    **اليوم 1 · تبليسي → كازبيغي (170 كم، 3 ساعات و30 دقيقة)**

    - 09:00 المغادرة من تبليسي؛ وبعد 25 كم توقف في متسخيتا وعند دير جفاري (1 ساعة).

    - 11:00 مطل خزان جينفالي، وقفة تصوير (30 دقيقة).

    - 11:45 قلعة أنانوري — الكنيسة والواجهة المنقوشة والبرج (1 ساعة و15 دقيقة).

    - 13:30 الغداء في باسانوري أو كفيشيتي (1 ساعة).

    - 15:30 غوداوري ونصب الصداقة (1 ساعة)؛ التزود بالوقود هنا عند الحاجة.

    - 18:00 الوصول إلى كازبيغي؛ المبيت في كازبيغي.


    **اليوم 2 · كازبيغي → تبليسي (170 كم، 3 ساعات و10 دقائق)**

    - 08:30 الصعود إلى **كنيسة الثالوث في غيرغيتي** — 6 كم من الطريق الحاد أو 1.5 ساعة مشياً (2 ساعة).

    - 11:00 مضيق داريالي وشلالات غفيليتي (1 ساعة و30 دقيقة).

    - 13:00 الغداء في كازبيغي (1 ساعة).

    - 14:30 العودة عبر الممر مع وقفة عند ترافرتينات كوبي (30 دقيقة).

    - 17:00 استراحة أخيرة عند أنانوري أو جينفالي (30 دقيقة).

    - 19:00 العودة إلى تبليسي.
  tips:
  - املأ الخزان في باسانوري أو غوداوري — فمحطات الوقود تقل خلف الممر.
  - في الشتاء قد يُغلق ممر جفاري ساعات أو أياماً بعد تساقط الثلج؛ تحقق من حالة الطريق قبل الانطلاق.
  - الطريق الصاعد إلى غيرغيتي ضيق وحاد — الخلوص الأرضي العالي والطقس الجاف ضروريان.
  - 'في الأديرة قواعد لباس: غطاء رأس وتنورة طويلة للنساء، وسروال طويل للرجال.'
  - الجو في الجبال أبرد بمقدار 15-20°C منه في تبليسي؛ خذ سترة حتى في يوليو.
  - احجز فندقك في كازبيغي مسبقاً، خاصة في يوليو وأغسطس.
