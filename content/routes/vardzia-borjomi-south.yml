ka:
  name: ვარძია და ბორჯომი — სამხრეთის მარშრუტი
  short: 'ორი დღე სამცხე-ჯავახეთში: ბორჯომის პარკი, რაბათი, ხერთვისი და კლდეში ნაკვეთი ვარძია.'
  body: >-
    ეს არის სამხრეთის მიმართულება — მტკვრის ხეობა, რომელიც თბილისიდან ბორჯომსა და ახალციხეზე გადის და
    თურქეთის საზღვართან, ვარძიის კლდოვან ქალაქთან სრულდება. მთელი 265 კილომეტრი ასფალტია, ამიტომ ეკონომ-კლასის
    მანქანაც ბოლომდე მიდის, თუმცა უკანასკნელი მონაკვეთი ვიწრო და ხვეული ხდება.


    პირველი დღე დაბლობიდან მთაში გადასვლაა. **ბორჯომი** — XIX საუკუნის კურორტი, რომლის ცენტრალურ პარკში
    მინერალური წყალი პირდაპირ წყაროდან ისმება; შემდეგ მტკვრის ხეობა ვიწროვდება და ახალციხეში აღდგენილი
    **რაბათის ციხე** ჩნდება, სადაც მეჩეთი, ეკლესია, სინაგოგა და ციხის კოშკები ერთ კომპლექსშია. მეორე დღეს
    გზა სამხრეთისკენ აგრძელებს: ხერთვისის ციხე ორი მდინარის შესართავზე, შემდეგ კი ვარძია — XII საუკუნის
    მონასტერი, თამარ მეფის დროს კლდეში ამოკვეთილი, ცამეტ იარუსად, ასობით ოთახითა და ფრესკებიანი ღვთისმშობლის
    მიძინების ეკლესიით.


    მარშრუტი გამოდგება მათთვის, ვისაც ისტორია და არქიტექტურა უყვარს — ორ დღეში ორი ათასწლეულის ძეგლებს
    ნახავ, ბრინჯაოს ხანის ნამოსახლარიდან ოსმალურ მეჩეთამდე. იმავე ხეობაში, ცოტა გვერდით, საფარის მონასტერი
    და აბასთუმნის ობსერვატორიაც დგას, თუ დამატებითი დღე გაქვს.


    გაითვალისწინე მანძილი: მხოლოდ გზაში დღეში ოთხ საათზე მეტს ატარებ, ამიტომ ღამისთევა ახალციხეში ან ვარძიასთან
    აუცილებელია — ერთ დღეში დაბრუნება 530 კილომეტრია და სრულიად გამოფიტავს. ზამთარში გზა ღიაა და გაწმენდილი,
    მაგრამ ჯავახეთის პლატოზე ყინვაა და ზამთრის საბურავები აუცილებელია; ზაფხულში კი პირიქით, ვარძიის კლდე
    შუადღისას ძალიან ცხელდება, ამიტომ დილის საათებში მისვლა ჯობია.
  plan: >-
    **დღე 1 · თბილისი → ბორჯომი → ახალციხე (205 კმ, 3 სთ 20 წთ)**

    - 08:30 გასვლა თბილისიდან E60-ით, გორისა და ხაშურის გავლით.

    - 11:00 ბორჯომის ცენტრალური პარკი, მინერალური წყალი და საბაგირო (2 სთ).

    - 13:30 სადილი ბორჯომში (1 სთ).

    - 15:00 მტკვრის ხეობა ახალციხემდე, გაჩერება აწყურთან (30 წთ).

    - 16:30 **რაბათის ციხე** ახალციხეში — ზედა ციხე, მეჩეთი და მუზეუმი (2 სთ).

    - ღამისთევა ახალციხეში.


    **დღე 2 · ახალციხე → ვარძია → თბილისი (345 კმ, 5 სთ 40 წთ)**

    - 09:00 გასვლა ასპინძის მიმართულებით მტკვრის ხეობით.

    - 10:00 ხერთვისის ციხე შესართავზე (45 წთ).

    - 11:15 **ვარძია** — კლდის ქალაქი, ტაძარი და ფრესკები (2 სთ 30 წთ).

    - 14:00 სადილი ვარძიასთან ან ასპინძაში (1 სთ).

    - 15:30 დაბრუნება ახალციხისა და ბორჯომის გავლით.

    - 21:00 თბილისში დაბრუნება.
  tips:
  - საწვავი ახალციხეში აავსე — ასპინძის მიღმა სადგურები იშვიათია.
  - 'ვარძიაში ბევრი კიბე და ვიწრო გვირაბია: მოსახერხებელი ფეხსაცმელი და პატარა ფანარი გამოგადგება.'
  - ზაფხულში ვარძია ღია მზეზეა და ძალიან ცხელა — მიდი დილით ან 16:00-ის შემდეგ, წყალი და ქუდი წაიღე.
  - ჯავახეთის პლატო წელიწადში რვა თვე ცივია; ზამთარში ზამთრის საბურავები სავალდებულოა.
  - ერთ დღეში ვარძიაში ჩასვლა და დაბრუნება 530 კმ-ია — ღამისთევა ახალციხეში ბევრად კომფორტულია.
en:
  name: Vardzia and Borjomi — the Southern Route
  short: 'Two days in Samtskhe-Javakheti: Borjomi park, Rabati castle, Khertvisi and the cave city of
    Vardzia.'
  body: >-
    This is the southern direction — the Mtkvari valley, which leads out of Tbilisi through Borjomi and
    Akhaltsikhe and ends close to the Turkish border at the rock-cut city of Vardzia. All 265 kilometres
    are asphalt, so an economy car reaches the end comfortably, although the final stretch narrows and
    winds along the gorge.


    Day one is the climb from the plain into the mountains. **Borjomi** is a nineteenth-century spa town
    where you drink the famous mineral water straight from the spring in the central park. Then the valley
    tightens and Akhaltsikhe appears with **Rabati Castle**, a rebuilt citadel that holds a mosque, a
    church, a synagogue and the old fortress towers inside a single wall. Day two continues south: Khertvisi
    Fortress guards the confluence of two rivers, and then comes Vardzia itself — a twelfth-century monastery
    carved into the cliff under Queen Tamar, thirteen storeys deep, with hundreds of chambers and the
    frescoed Church of the Dormition at its heart.


    The route suits travellers who care about history and architecture: in two days you cover two millennia.
    Respect the distances, though — you spend over four hours a day behind the wheel, so the overnight
    in Akhaltsikhe or near Vardzia is not optional. Doing it as a day trip means 530 kilometres in one
    go. The road stays open in winter, but the Javakheti plateau is genuinely cold.
  plan: >-
    **Day 1 · Tbilisi → Borjomi → Akhaltsikhe (205 km, 3 h 20 min)**

    - 08:30 Leave Tbilisi on the E60 via Gori and Khashuri.

    - 11:00 Borjomi Central Park, the mineral spring and the cable car (2 h).

    - 13:30 Lunch in Borjomi (1 h).

    - 15:00 The Mtkvari gorge towards Akhaltsikhe, stop at Atskuri (30 min).

    - 16:30 **Rabati Castle** in Akhaltsikhe — upper citadel, mosque and museum (2 h).

    - Overnight in Akhaltsikhe.


    **Day 2 · Akhaltsikhe → Vardzia → Tbilisi (345 km, 5 h 40 min)**

    - 09:00 Set off towards Aspindza along the river.

    - 10:00 Khertvisi Fortress at the confluence (45 min).

    - 11:15 **Vardzia** — the cave city, the church and its frescoes (2 h 30 min).

    - 14:00 Lunch near Vardzia or in Aspindza (1 h).

    - 15:30 Drive back via Akhaltsikhe and Borjomi.

    - 21:00 Back in Tbilisi.
  tips:
  - Fill the tank in Akhaltsikhe — stations are rare beyond Aspindza.
  - 'Vardzia means many stairs and narrow tunnels: wear proper shoes and bring a small torch.'
  - In summer Vardzia bakes in full sun — go early morning or after 16:00, with water and a hat.
  - The Javakheti plateau is cold eight months a year; winter tyres are mandatory in the cold season.
  - Vardzia and back in one day is 530 km — the overnight in Akhaltsikhe makes the trip far more pleasant.
ru:
  name: Вардзиа и Боржоми — южный маршрут
  short: 'Два дня в Самцхе-Джавахети: парк Боржоми, крепость Рабати, Хертвиси и пещерный город Вардзиа.'
  body: >-
    Это южное направление — долина Куры, которая уводит из Тбилиси через Боржоми и Ахалцихе и заканчивается
    у турецкой границы, у высеченного в скале города Вардзиа. Все 265 километров — асфальт, поэтому машина
    эконом-класса доезжает до конца без проблем, хотя последний отрезок становится узким и извилистым.


    Первый день — это подъём с равнины в горы. **Боржоми** — курорт XIX века, где знаменитую минеральную
    воду пьют прямо из источника в центральном парке. Дальше долина сужается, и в Ахалцихе появляется
    **крепость Рабати**: восстановленная цитадель, внутри которой в одних стенах уживаются мечеть, церковь,
    синагога и старые башни. Второй день ведёт дальше на юг: крепость Хертвиси стоит на слиянии двух рек,
    а затем открывается Вардзиа — монастырь XII века, вырубленный в скале при царице Тамаре, тринадцать
    ярусов, сотни помещений и церковь Успения с фресками.


    Маршрут для тех, кто любит историю и архитектуру: за два дня вы проходите два тысячелетия. Но расстояния
    здесь серьёзные — за рулём выходит больше четырёх часов в день, так что ночёвка в Ахалцихе или у Вардзии
    обязательна. Одним днём это 530 километров подряд. Зимой дорога открыта, но на Джавахетском плато
    по-настоящему холодно.
  plan: >-
    **День 1 · Тбилиси → Боржоми → Ахалцихе (205 км, 3 ч 20 мин)**

    - 08:30 Выезд из Тбилиси по E60 через Гори и Хашури.

    - 11:00 Центральный парк Боржоми, источник и канатная дорога (2 ч).

    - 13:30 Обед в Боржоми (1 ч).

    - 15:00 Ущелье Куры в сторону Ахалцихе, остановка у Ацкури (30 мин).

    - 16:30 **Крепость Рабати** в Ахалцихе: верхняя цитадель, мечеть, музей (2 ч).

    - Ночёвка в Ахалцихе.


    **День 2 · Ахалцихе → Вардзиа → Тбилиси (345 км, 5 ч 40 мин)**

    - 09:00 Выезд в сторону Аспиндзы вдоль реки.

    - 10:00 Крепость Хертвиси на слиянии рек (45 мин).

    - 11:15 **Вардзиа** — пещерный город, храм и фрески (2 ч 30 мин).

    - 14:00 Обед у Вардзии или в Аспиндзе (1 ч).

    - 15:30 Обратная дорога через Ахалцихе и Боржоми.

    - 21:00 Возвращение в Тбилиси.
  tips:
  - Заправляйтесь в Ахалцихе — за Аспиндзой заправки редкость.
  - 'В Вардзии много лестниц и узких тоннелей: нужна удобная обувь и маленький фонарик.'
  - Летом Вардзиа стоит на открытом солнце — приезжайте рано утром или после 16:00, с водой и головным
    убором.
  - Джавахетское плато холодное восемь месяцев в году; в холодный сезон зимняя резина обязательна.
  - Съездить в Вардзию за один день — это 530 км подряд; с ночёвкой в Ахалцихе поездка куда приятнее.
fa:
  name: واردزیا و بورجومی — مسیر جنوبی
  short: 'دو روز در سامتسخه-جاواختی: پارک بورجومی، قلعهٔ راباتی، خرتویسی و شهر غاری واردزیا.'
  body: >-
    این مسیر جنوبی است — درهٔ متکواری که از تفلیس بیرون می‌رود، از بورجومی و آخالتسیخه می‌گذرد و نزدیک
    مرز ترکیه در شهر صخره‌ای واردزیا پایان می‌یابد. هر 265 کیلومتر آن آسفالت است، پس خودروی اقتصادی راحت
    به انتها می‌رسد، هرچند بخش پایانی باریک می‌شود و در امتداد تنگه می‌پیچد.

    روز اول صعود از دشت به کوهستان است. **بورجومی** شهر آب‌درمانی سدهٔ نوزدهم است که در پارک مرکزی‌اش
    آب معدنی مشهور را مستقیم از چشمه می‌نوشند. سپس دره تنگ می‌شود و آخالتسیخه با **قلعهٔ راباتی** پیدا
    می‌شود، ارگی بازسازی‌شده که یک مسجد، یک کلیسا، یک کنیسه و برج‌های دژ قدیمی را درون یک حصار جای داده
    است. روز دوم به جنوب ادامه می‌یابد: دژ خرتویسی محل تلاقی دو رود را پاس می‌دارد، و سپس خود واردزیا
    می‌آید — صومعه‌ای از سدهٔ دوازدهم که در زمان ملکه تامار در صخره کنده شده، سیزده طبقه در عمق، با صدها
    حجره و کلیسای نقاشی‌شدهٔ خوابیدگی مریم در دل آن.

    این مسیر مناسب مسافرانی است که به تاریخ و معماری اهمیت می‌دهند: در دو روز دو هزاره را می‌پیمایید.
    اما فاصله‌ها را جدی بگیرید — روزی بیش از چهار ساعت پشت فرمان هستید، پس شب ماندن در آخالتسیخه یا نزدیک
    واردزیا اختیاری نیست. انجام آن در یک روز یعنی 530 کیلومتر یک‌سره. جاده در زمستان باز می‌ماند، اما
    فلات جاواختی واقعاً سرد است.
  plan: >-
    **روز 1 · تفلیس → بورجومی → آخالتسیخه (205 کیلومتر، 3 ساعت و 20 دقیقه)**

    - 08:30 حرکت از تفلیس روی E60 از راه گوری و خاشوری.

    - 11:00 پارک مرکزی بورجومی، چشمهٔ معدنی و تله‌کابین (2 ساعت).

    - 13:30 ناهار در بورجومی (1 ساعت).

    - 15:00 تنگهٔ متکواری به سوی آخالتسیخه، توقف در اتسکوری (30 دقیقه).

    - 16:30 **قلعهٔ راباتی** در آخالتسیخه — ارگ بالایی، مسجد و موزه (2 ساعت).

    - شب در آخالتسیخه.


    **روز 2 · آخالتسیخه → واردزیا → تفلیس (345 کیلومتر، 5 ساعت و 40 دقیقه)**

    - 09:00 حرکت به سوی اسپیندزا در امتداد رودخانه.

    - 10:00 دژ خرتویسی در محل تلاقی رودها (45 دقیقه).

    - 11:15 **واردزیا** — شهر غاری، کلیسا و نقاشی‌های دیواری آن (2 ساعت و 30 دقیقه).

    - 14:00 ناهار نزدیک واردزیا یا در اسپیندزا (1 ساعت).

    - 15:30 بازگشت از راه آخالتسیخه و بورجومی.

    - 21:00 بازگشت به تفلیس.
  tips:
  - باک را در آخالتسیخه پر کنید — آن سوی اسپیندزا پمپ‌بنزین کمیاب است.
  - 'واردزیا یعنی پله‌های فراوان و تونل‌های باریک: کفش مناسب بپوشید و یک چراغ‌قوهٔ کوچک همراه ببرید.'
  - در تابستان واردزیا زیر آفتاب مستقیم داغ می‌شود — صبح زود یا بعد از 16:00 بروید، با آب و کلاه.
  - فلات جاواختی هشت ماه سال سرد است؛ در فصل سرد لاستیک زمستانی الزامی است.
  - رفت و برگشت واردزیا در یک روز 530 کیلومتر است — شب ماندن در آخالتسیخه سفر را بسیار دلپذیرتر می‌کند.
he:
  name: ורדזיה ובורג'ומי — המסלול הדרומי
  short: 'יומיים בסמצחה-ג''אוואחתי: פארק בורג''ומי, מבצר רבאטי, חרתוויסי ועיר המערות ורדזיה.'
  body: >-
    זהו הכיוון הדרומי — עמק המטקווארי, שיוצא מטביליסי דרך בורג'ומי ואחאלציחה ומסתיים סמוך לגבול הטורקי
    בעיר החצובה בסלע ורדזיה. כל 265 הקילומטרים סלולים, ולכן רכב חסכוני מגיע עד הסוף בנוחות, אף שהקטע האחרון
    מצטמצם ומתפתל לאורך הערוץ.

    היום הראשון הוא הטיפוס מן המישור אל ההרים. **בורג'ומי** היא עיירת מרפא מן המאה ה-19, שבפארק המרכזי
    שלה שותים את המים המינרליים המפורסמים היישר מהמעיין. אחר כך העמק מתהדק ומופיעה אחאלציחה עם **מבצר
    רבאטי**, מצודה משוחזרת המכילה מסגד, כנסייה, בית כנסת ואת מגדלי המבצר הישן בתוך חומה אחת. היום השני
    ממשיך דרומה: מבצר חרתוויסי שומר על מפגש שני נהרות, ואז מגיעה ורדזיה עצמה — מנזר מן המאה ה-12 שנחצב
    בצוק בימי המלכה תמר, שלוש עשרה קומות לעומק, עם מאות תאים וכנסיית ההירדמות המצוירת בליבו.

    המסלול מתאים לנוסעים שאכפת להם מהיסטוריה ומאדריכלות: בתוך יומיים אתם עוברים אלפיים שנה. אבל כבדו את
    המרחקים — אתם מבלים יותר מארבע שעות ביום מאחורי ההגה, ולכן הלינה באחאלציחה או ליד ורדזיה אינה אופציונלית.
    לעשות את זה כטיול יום פירושו 530 קילומטרים ברצף. הכביש נשאר פתוח בחורף, אבל רמת ג'אוואחתי קרה באמת.
  plan: >-
    **יום 1 · טביליסי → בורג'ומי → אחאלציחה (205 ק״מ, 3 שעות 20 דקות)**

    - 08:30 יציאה מטביליסי בכביש E60 דרך גורי וחשורי.

    - 11:00 הפארק המרכזי של בורג'ומי, המעיין המינרלי והרכבל (2 שעות).

    - 13:30 ארוחת צהריים בבורג'ומי (1 שעה).

    - 15:00 ערוץ המטקווארי לעבר אחאלציחה, עצירה באצקורי (30 דקות).

    - 16:30 **מבצר רבאטי** באחאלציחה — המצודה העליונה, המסגד והמוזיאון (2 שעות).

    - לינה באחאלציחה.


    **יום 2 · אחאלציחה → ורדזיה → טביליסי (345 ק״מ, 5 שעות 40 דקות)**

    - 09:00 יציאה לכיוון אספינדזה לאורך הנהר.

    - 10:00 מבצר חרתוויסי במפגש הנהרות (45 דקות).

    - 11:15 **ורדזיה** — עיר המערות, הכנסייה וציורי הקיר שלה (2 שעות 30 דקות).

    - 14:00 ארוחת צהריים ליד ורדזיה או באספינדזה (1 שעה).

    - 15:30 חזרה דרך אחאלציחה ובורג'ומי.

    - 21:00 חזרה לטביליסי.
  tips:
  - מלאו את המכל באחאלציחה — מעבר לאספינדזה התחנות נדירות.
  - 'ורדזיה פירושה הרבה מדרגות ומנהרות צרות: נעלו נעליים מתאימות וקחו פנס קטן.'
  - בקיץ ורדזיה נצלית בשמש מלאה — לכו מוקדם בבוקר או אחרי 16:00, עם מים וכובע.
  - רמת ג'אוואחתי קרה שמונה חודשים בשנה; צמיגי חורף הם חובה בעונה הקרה.
  - ורדזיה וחזרה ביום אחד הם 530 ק״מ — הלינה באחאלציחה הופכת את הטיול לנעים בהרבה.
ar:
  name: فاردزيا وبورجومي — المسار الجنوبي
  short: 'يومان في سامتسخي-جافاخيتي: حديقة بورجومي وقلعة راباتي وخيرتفيسي ومدينة فاردزيا الكهفية.'
  body: >-
    هذا هو الاتجاه الجنوبي — وادي متكفاري الذي يخرج من تبليسي عبر بورجومي وأخالتسيخي وينتهي قرب الحدود
    التركية عند مدينة فاردزيا المنحوتة في الصخر. الكيلومترات الـ265 كلها معبّدة، ولذلك تصل سيارة اقتصادية
    إلى النهاية براحة، وإن كان المقطع الأخير يضيق ويتلوى على امتداد المضيق.

    اليوم الأول هو الصعود من السهل إلى الجبال. **بورجومي** بلدة استشفاء من القرن التاسع عشر، وفي حديقتها
    المركزية تُشرب المياه المعدنية الشهيرة من النبع مباشرة. ثم يضيق الوادي وتظهر أخالتسيخي بـ**قلعة راباتي**،
    وهي قلعة أُعيد بناؤها وتضم مسجداً وكنيسة وكنيساً وأبراج الحصن القديم داخل سور واحد. ويواصل اليوم الثاني
    جنوباً: يحرس حصن خيرتفيسي ملتقى نهرين، ثم تأتي فاردزيا نفسها — دير من القرن الثاني عشر نُحت في الجرف
    في عهد الملكة تامار، بعمق ثلاث عشرة طبقة، بمئات الحجرات وكنيسة رقاد العذراء المزينة بالرسوم في قلبه.

    يناسب هذا المسار المسافرين المهتمين بالتاريخ والعمارة: ففي يومين تقطع ألفَي سنة. لكن احترم المسافات
    — فأنت تقضي أكثر من أربع ساعات يومياً خلف المقود، ولذلك فالمبيت في أخالتسيخي أو قرب فاردزيا ليس اختيارياً.
    وأداؤه كرحلة يوم واحد يعني 530 كيلومتراً دفعة واحدة. يبقى الطريق مفتوحاً في الشتاء، لكن هضبة جافاخيتي
    باردة فعلاً.
  plan: >-
    **اليوم 1 · تبليسي → بورجومي → أخالتسيخي (205 كم، 3 ساعات و20 دقيقة)**

    - 08:30 المغادرة من تبليسي على الطريق E60 عبر غوري وخاشوري.

    - 11:00 حديقة بورجومي المركزية والنبع المعدني والتلفريك (2 ساعة).

    - 13:30 الغداء في بورجومي (1 ساعة).

    - 15:00 مضيق متكفاري نحو أخالتسيخي، مع وقفة في أتسكوري (30 دقيقة).

    - 16:30 **قلعة راباتي** في أخالتسيخي — القلعة العليا والمسجد والمتحف (2 ساعة).

    - المبيت في أخالتسيخي.


    **اليوم 2 · أخالتسيخي → فاردزيا → تبليسي (345 كم، 5 ساعات و40 دقيقة)**

    - 09:00 الانطلاق نحو أسبيندزا على امتداد النهر.

    - 10:00 حصن خيرتفيسي عند ملتقى النهرين (45 دقيقة).

    - 11:15 **فاردزيا** — مدينة الكهوف والكنيسة ورسومها الجدارية (2 ساعة و30 دقيقة).

    - 14:00 الغداء قرب فاردزيا أو في أسبيندزا (1 ساعة).

    - 15:30 العودة عبر أخالتسيخي وبورجومي.

    - 21:00 العودة إلى تبليسي.
  tips:
  - املأ الخزان في أخالتسيخي — فالمحطات نادرة خلف أسبيندزا.
  - 'فاردزيا تعني أدراجاً كثيرة وأنفاقاً ضيقة: انتعل حذاءً مناسباً واحمل مصباحاً صغيراً.'
  - في الصيف تشتوي فاردزيا تحت الشمس الكاملة — اذهب في الصباح الباكر أو بعد 16:00، ومعك ماء وقبعة.
  - هضبة جافاخيتي باردة ثمانية أشهر في السنة؛ وإطارات الشتاء إلزامية في الموسم البارد.
  - فاردزيا والعودة في يوم واحد 530 كم — والمبيت في أخالتسيخي يجعل الرحلة أمتع بكثير.
