ka:
  name: კახეთის ღვინის მარშრუტი
  short: 'სამი დღე ალაზნის ველზე: სიღნაღი, ბოდბე, თელავი, წინანდალი, ალავერდი და ყვარელი.'
  body: >-
    კახეთი საქართველოს ღვინის გული და ყველაზე მარტივი სამოგზაურო რეგიონია: მთელი მარშრუტი ასფალტზე გადის,
    მანძილები მოკლეა და თბილისამდე ორ საათზე მეტი არსად რჩება. სამი დღე იმისთვისაა საჭირო, რომ მარნებში
    აჩქარებით კი არ შეიარო, არამედ დაჯდე, დააგემოვნო და ღამე იქვე გაათენო.


    პირველი დღე **სიღნაღს** ეთმობა — ქვაფენილიან ქუჩებსა და ციხის კედელს, საიდანაც ალაზნის ველი და კავკასიონის
    ქედი ერთ კადრში ეტევა; მახლობლად წმინდა ნინოს საძვალე, ბოდბის მონასტერია. მეორე დღეს რეგიონის ცენტრი,
    თელავი და ბატონის ციხე გელოდება, შემდეგ კი წინანდლის ჩარჩავაძეების სახლ-მუზეუმი მისი ისტორიული ბაღითა
    და 1841 წლის მარნით. მესამე დღე ალავერდის ტაძრით იწყება — XI საუკუნის ორმოცდაათმეტრიანი კათედრალი
    ველის შუაგულში დგას — და ყვარლის კინძმარაულის ზონაში სრულდება.


    რას ნახავს სტუმარი კონკრეტულად: ქვევრის მარნებს, სადაც ღვინო მიწაშია დამარხული, ოჯახურ სუფრებს, ალაზნის
    ველის უსასრულო ვენახებს და ქართული ხუროთმოძღვრების რამდენიმე მთავარ ძეგლს. კახეთი ისეთი რეგიონია,
    სადაც ღვინო არ არის მხოლოდ პროდუქტი — ის ოჯახის, სუფრისა და სოფლის რიტმის ნაწილია, და ეს ყველაზე კარგად
    პატარა, სამ-ოთხკაციან მარნებში იგრძნობა.


    მარშრუტი მთელი წელი მუშაობს: ზამთარში ველი მშვიდი და იაფია, გაზაფხულზე ყვავილობს, ყველაზე ლამაზი კი
    სექტემბერ-ოქტომბერია, რთველის დროს, როცა სოფლები ერთ დიდ სამზარეულოდ იქცევა. გზები ბოლომდე ასფალტია,
    ამიტომ ეკონომ-კლასის მანქანა სავსებით საკმარისია და დამატებით ხარჯს არ ითხოვს. მთავარი წესი კი ერთია:
    ვინც მართავს, ის არ სვამს — გეგმა ისე ააწყვე, რომ ღამისთევა დაგემოვნების ადგილთან ახლოს იყოს.
  plan: >-
    **დღე 1 · თბილისი → სიღნაღი (115 კმ, 2 სთ)**

    - 09:30 გასვლა თბილისიდან კახეთის გზატკეცილით, გაჩერება გომბორის ან საგარეჯოს გზაზე.

    - 11:30 ჩამოსვლა სიღნაღში, სასტუმროში განთავსება.

    - 12:30 სადილი და ქალაქის ქვაფენილიანი ცენტრი, ციხის კედელი და ხედი ალაზანზე (2 სთ).

    - 15:30 ბოდბის მონასტერი და წმინდა ნინოს წყარო (1 სთ 30 წთ).

    - 18:00 დაგემოვნება ოჯახურ მარანში სიღნაღში ან ბოდბეში.

    - ღამისთევა სიღნაღში.


    **დღე 2 · სიღნაღი → თელავი (60 კმ, 1 სთ 15 წთ)**

    - 10:00 გასვლა წნორისა და გურჯაანის გავლით, ალაზნის ველის ხედები.

    - 11:30 თელავი: ბატონის ციხე, ერეკლე II-ის სასახლე და 900-წლოვანი ჭადარი (2 სთ).

    - 14:00 სადილი თელავის ბაზრობასთან (1 სთ).

    - 16:00 შუამთის მონასტრები ან ქალაქის სეირნობა (1 სთ 30 წთ).

    - 19:00 ვახშამი ღვინის დაგემოვნებით; ღამისთევა თელავში.


    **დღე 3 · თელავი → წინანდალი → ალავერდი → ყვარელი → თბილისი (215 კმ, 4 სთ 15 წთ)**

    - 09:00 წინანდლის სახლ-მუზეუმი, ბაღი და ისტორიული მარანი (2 სთ).

    - 11:30 ალავერდის საკათედრო ტაძარი (1 სთ).

    - 13:30 ყვარელი: კინძმარაულის მარანი და ღვინის გვირაბები (2 სთ).

    - 15:30 სადილი ყვარელში ან ილიას ტბასთან (1 სთ).

    - 17:00 დაბრუნება გურჯაანისა და საგარეჯოს გავლით.

    - 20:00 თბილისში დაბრუნება.
  tips:
  - >-
    მძღოლმა ღვინო არ უნდა დააგემოვნოს — საქართველოში ალკოჰოლის ნულოვანი ზღვარია; ჯგუფში წინასწარ შეათანხმეთ,
    ვინ მართავს.
  - >-
    რთველი სექტემბრის ბოლოს და ოქტომბერში ხდება — ამ დროს მარნები ყველაზე საინტერესოა, სასტუმროები კი
    ადრევე იჯავშნება.
  - პატარა ოჯახურ მარნებში დაგემოვნება წინასწარი ზარით ჯობია — ბევრი მათგანი მხოლოდ ჯავშნით მუშაობს.
  - ალავერდსა და ბოდბეში ჩაცმის კოდია; თავსაფრები ხშირად შესასვლელთანაა.
  - ღვინის ყიდვისას გაითვალისწინე ბარგის ადგილი — ქვევრის ღვინო მძიმეა და კარგად უნდა ჩალაგდეს.
en:
  name: Kakheti Wine Loop
  short: 'Three days across the Alazani valley: Sighnaghi, Bodbe, Telavi, Tsinandali, Alaverdi and Kvareli.'
  body: >-
    Kakheti is the heart of Georgian wine and the easiest region in the country to drive. The whole loop
    is on asphalt, the legs between stops are short, and you are never more than two hours from Tbilisi.
    Three days is what it takes to stop rushing through cellars and instead sit down, taste properly and
    sleep where you tasted.


    Day one belongs to **Sighnaghi**, the walled hill town whose cobbled lanes and rampart walk frame
    the Alazani valley and the whole Caucasus ridge in a single view; two kilometres away is Bodbe Monastery,
    the burial place of St Nino. Day two is the regional capital, Telavi, with the Batonis Tsikhe palace
    of King Erekle II, followed by Tsinandali — the Chavchavadze estate with its English-style garden
    and the 1841 cellar that produced Georgia's first bottled wine. Day three opens with Alaverdi, a fifty-metre
    eleventh-century cathedral standing alone in the fields, and ends in the Kindzmarauli zone around
    Kvareli.


    What you actually see: qvevri cellars where wine ferments in buried clay jars, family tables that
    turn into long lunches, endless vineyards under the mountains, and several of the greatest monuments
    of Georgian architecture. The route works all year, but late September and October, during the rtveli
    harvest, is unbeatable. An economy car is entirely enough. One rule matters above all: whoever drives
    does not taste.
  plan: >-
    **Day 1 · Tbilisi → Sighnaghi (115 km, 2 h)**

    - 09:30 Leave Tbilisi on the Kakheti highway, coffee stop near Sagarejo.

    - 11:30 Arrive Sighnaghi and check in.

    - 12:30 Lunch, then the cobbled centre, the town wall and the valley view (2 h).

    - 15:30 Bodbe Monastery and the spring of St Nino (1 h 30 min).

    - 18:00 Tasting at a family cellar in Sighnaghi or Bodbe.

    - Overnight in Sighnaghi.


    **Day 2 · Sighnaghi → Telavi (60 km, 1 h 15 min)**

    - 10:00 Drive via Tsnori and Gurjaani with views over the Alazani valley.

    - 11:30 Telavi: Batonis Tsikhe, the royal palace and the 900-year-old plane tree (2 h).

    - 14:00 Lunch near the Telavi market (1 h).

    - 16:00 The two Shuamta monasteries or a walk through town (1 h 30 min).

    - 19:00 Dinner with a tasting; overnight in Telavi.


    **Day 3 · Telavi → Tsinandali → Alaverdi → Kvareli → Tbilisi (215 km, 4 h 15 min)**

    - 09:00 Tsinandali estate, garden and historic cellar (2 h).

    - 11:30 Alaverdi Cathedral (1 h).

    - 13:30 Kvareli: the Kindzmarauli winery and the wine tunnels (2 h).

    - 15:30 Late lunch in Kvareli or by Ilia Lake (1 h).

    - 17:00 Return via Gurjaani and Sagarejo.

    - 20:00 Back in Tbilisi.
  tips:
  - The driver does not taste — Georgia enforces a zero alcohol limit; agree in advance who drives each
    day.
  - >-
    The rtveli harvest runs from late September through October: the best time for cellars, and the time
    hotels fill first.
  - Call small family cellars ahead — many receive guests by appointment only.
  - Alaverdi and Bodbe have a dress code; scarves and wraps are usually available at the gate.
  - Leave boot space for bottles, and pack them upright and padded for the drive home.
ru:
  name: Винный маршрут по Кахетии
  short: 'Три дня в Алазанской долине: Сигнахи, Бодбе, Телави, Цинандали, Алаверди и Кварели.'
  body: >-
    Кахетия — сердце грузинского виноделия и самый простой для поездки регион страны. Весь круг идёт по
    асфальту, перегоны между остановками короткие, и вы нигде не оказываетесь дальше двух часов от Тбилиси.
    Три дня нужны для того, чтобы не пробегать марани галопом, а сесть за стол, распробовать вино и заночевать
    там же.


    Первый день отдан **Сигнахи** — городку на холме внутри крепостной стены, откуда Алазанская долина
    и весь Кавказский хребет помещаются в один кадр; в двух километрах находится монастырь Бодбе с усыпальницей
    святой Нино. Второй день — столица региона Телави с крепостью Батонис-цихе и дворцом Ираклия II, а
    затем Цинандали: усадьба Чавчавадзе с английским парком и погребом 1841 года, где разлили первое грузинское
    бутылочное вино. Третий день начинается Алаверди — пятидесятиметровым собором XI века посреди полей
    — и заканчивается в зоне Киндзмараули у Кварели.


    Что именно вы увидите: марани с квеври, где вино бродит в закопанных глиняных кувшинах, семейные застолья,
    бесконечные виноградники под горами и несколько главных памятников грузинской архитектуры. Маршрут
    работает круглый год, но лучше всего — конец сентября и октябрь, во время ртвели. Машины эконом-класса
    вполне достаточно. Главное правило одно: кто за рулём, тот не пробует.
  plan: >-
    **День 1 · Тбилиси → Сигнахи (115 км, 2 ч)**

    - 09:30 Выезд по Кахетинскому шоссе, кофейная пауза у Сагареджо.

    - 11:30 Приезд в Сигнахи, заселение.

    - 12:30 Обед, затем брусчатый центр, крепостная стена и вид на долину (2 ч).

    - 15:30 Монастырь Бодбе и источник святой Нино (1 ч 30 мин).

    - 18:00 Дегустация в семейном марани в Сигнахи или Бодбе.

    - Ночёвка в Сигнахи.


    **День 2 · Сигнахи → Телави (60 км, 1 ч 15 мин)**

    - 10:00 Дорога через Цнори и Гурджаани с видами на Алазанскую долину.

    - 11:30 Телави: Батонис-цихе, дворец царя и 900-летний платан (2 ч).

    - 14:00 Обед у телавского рынка (1 ч).

    - 16:00 Монастыри Старая и Новая Шуамта либо прогулка по городу (1 ч 30 мин).

    - 19:00 Ужин с дегустацией; ночёвка в Телави.


    **День 3 · Телави → Цинандали → Алаверди → Кварели → Тбилиси (215 км, 4 ч 15 мин)**

    - 09:00 Усадьба Цинандали, парк и исторический погреб (2 ч).

    - 11:30 Собор Алаверди (1 ч).

    - 13:30 Кварели: винзавод Киндзмараули и винные тоннели (2 ч).

    - 15:30 Поздний обед в Кварели или у озера Илии (1 ч).

    - 17:00 Возвращение через Гурджаани и Сагареджо.

    - 20:00 Приезд в Тбилиси.
  tips:
  - 'Водитель не дегустирует: в Грузии нулевой промилле — заранее договоритесь, кто за рулём.'
  - 'Ртвели идёт с конца сентября по октябрь: лучшее время для марани и время, когда отели разбирают первыми.'
  - В маленькие семейные марани звоните заранее — многие принимают только по записи.
  - В Алаверди и Бодбе действует дресс-код; платки и накидки обычно выдают у входа.
  - Оставьте место в багажнике под бутылки и упакуйте их стоя, проложив мягким.
fa:
  name: حلقهٔ شراب کاختی
  short: 'سه روز در درهٔ آلازانی: سیغناغی، بودبه، تلاوی، تسیناندالی، آلاوردی و کوارلی.'
  body: >-
    کاختی قلب شراب گرجی است و آسان‌ترین منطقهٔ کشور برای رانندگی. تمام حلقه روی آسفالت است، فاصلهٔ میان
    توقف‌ها کوتاه است و هیچ‌گاه بیش از دو ساعت از تفلیس دور نمی‌شوید. سه روز همان زمانی است که لازم است
    تا از شتاب میان سردابه‌ها دست بردارید و به‌جایش بنشینید، درست مزه کنید و همان‌جا که مزه کرده‌اید بخوابید.

    روز اول از آن **سیغناغی** است، شهرک تپه‌ای حصاردار که کوچه‌های سنگفرش و پیاده‌روی روی بارویش درهٔ
    آلازانی و تمام ستیغ قفقاز را در یک قاب جمع می‌کند؛ دو کیلومتر آن‌سوتر صومعهٔ بودبه است، آرامگاه سنت
    نینو. روز دوم مرکز منطقه است، تلاوی، با کاخ باتونیس تسیخهٔ ارکله دوم، و پس از آن تسیناندالی — ملک
    چاوچاوادزه با باغ انگلیسی و سردابهٔ 1841 که نخستین شراب بطری‌شدهٔ گرجستان از آن بیرون آمد. روز سوم
    با آلاوردی آغاز می‌شود، کلیسای جامعی پنجاه‌متری از سدهٔ یازدهم که تنها در میان دشت ایستاده است، و
    در منطقهٔ کیندزماراولی پیرامون کوارلی پایان می‌یابد.

    آنچه واقعاً می‌بینید: سردابه‌های کوِوری که شراب در خمره‌های سفالی مدفون تخمیر می‌شود، سفره‌های خانوادگی
    که به ناهارهای طولانی بدل می‌شوند، تاکستان‌های بی‌پایان زیر کوه، و چند تا از بزرگ‌ترین آثار معماری
    گرجی. مسیر تمام سال کار می‌کند، اما اواخر سپتامبر و اکتبر، در فصل برداشت رتولی، بی‌رقیب است. خودروی
    اقتصادی کاملاً کافی است. یک قاعده از همه مهم‌تر است: هر کس رانندگی می‌کند، مزه نمی‌کند.
  plan: >-
    **روز 1 · تفلیس → سیغناغی (115 کیلومتر، 2 ساعت)**

    - 09:30 حرکت از تفلیس روی بزرگراه کاختی، توقف قهوه نزدیک ساگارجو.

    - 11:30 رسیدن به سیغناغی و ورود به اقامتگاه.

    - 12:30 ناهار، سپس مرکز سنگفرش، دیوار شهر و منظرهٔ دره (2 ساعت).

    - 15:30 صومعهٔ بودبه و چشمهٔ سنت نینو (1 ساعت و 30 دقیقه).

    - 18:00 مزه‌کردن در یک سردابهٔ خانوادگی در سیغناغی یا بودبه.

    - شب در سیغناغی.


    **روز 2 · سیغناغی → تلاوی (60 کیلومتر، 1 ساعت و 15 دقیقه)**

    - 10:00 حرکت از راه تسنوری و گورجاانی با نمای درهٔ آلازانی.

    - 11:30 تلاوی: باتونیس تسیخه، کاخ سلطنتی و چنار 900 ساله (2 ساعت).

    - 14:00 ناهار نزدیک بازار تلاوی (1 ساعت).

    - 16:00 دو صومعهٔ شوآمتا یا گشتی پیاده در شهر (1 ساعت و 30 دقیقه).

    - 19:00 شام همراه با مزه‌کردن؛ شب در تلاوی.


    **روز 3 · تلاوی → تسیناندالی → آلاوردی → کوارلی → تفلیس (215 کیلومتر، 4 ساعت و 15 دقیقه)**

    - 09:00 ملک تسیناندالی، باغ و سردابهٔ تاریخی (2 ساعت).

    - 11:30 کلیسای جامع آلاوردی (1 ساعت).

    - 13:30 کوارلی: کارخانهٔ شراب کیندزماراولی و تونل‌های شراب (2 ساعت).

    - 15:30 ناهار دیرهنگام در کوارلی یا کنار دریاچهٔ ایلیا (1 ساعت).

    - 17:00 بازگشت از راه گورجاانی و ساگارجو.

    - 20:00 بازگشت به تفلیس.
  tips:
  - راننده مزه نمی‌کند — گرجستان حد صفر الکل را اجرا می‌کند؛ از پیش تعیین کنید هر روز چه کسی رانندگی می‌کند.
  - >-
    برداشت رتولی از اواخر سپتامبر تا پایان اکتبر ادامه دارد: بهترین زمان برای سردابه‌ها و همان زمانی که
    هتل‌ها زودتر از همه پر می‌شوند.
  - به سردابه‌های کوچک خانوادگی از پیش زنگ بزنید — بسیاری فقط با وقت قبلی مهمان می‌پذیرند.
  - آلاوردی و بودبه پوشش مشخصی می‌خواهند؛ روسری و شال معمولاً دم در موجود است.
  - در صندوق عقب برای بطری‌ها جا بگذارید و آن‌ها را ایستاده و لای پارچه برای راه بازگشت بسته‌بندی کنید.
he:
  name: לולאת היין של קחתי
  short: 'שלושה ימים בעמק אלאזני: סיגנאגי, בודבה, טלאווי, צינאנדלי, אלאוורדי וקווארלי.'
  body: >-
    קחתי היא לב היין הגאורגי והאזור הקל ביותר לנהיגה במדינה. כל הלולאה על אספלט, המקטעים בין העצירות קצרים,
    ואתם אף פעם לא יותר משעתיים מטביליסי. שלושה ימים הם בדיוק מה שנדרש כדי להפסיק לרוץ בין מרתפים ובמקום
    זה לשבת, לטעום כמו שצריך ולישון במקום שבו טעמתם.

    היום הראשון שייך ל**סיגנאגי**, עיירת הגבעה המוקפת חומה, שסמטאות האבן שלה וההליכה על החומה ממסגרות
    בתמונה אחת את עמק אלאזני ואת כל רכס הקווקז; שני קילומטרים משם נמצא מנזר בודבה, מקום קבורתה של נינו
    הקדושה. היום השני מוקדש לבירת האזור, טלאווי, עם ארמון באטוניס ציחה של המלך ארקלה השני, ואחריו צינאנדלי
    — אחוזת צ'אבצ'אוודזה עם הגן בסגנון האנגלי והמרתף מ-1841 שממנו יצא היין המבוקבק הראשון בגאורגיה. היום
    השלישי נפתח באלאוורדי, קתדרלה בת חמישים מטר מן המאה ה-11 העומדת לבדה בשדות, ומסתיים באזור קינדזמראולי
    סביב קווארלי.

    מה שרואים בפועל: מרתפי קווברי שבהם היין מתסיס בכדי חרס קבורים, שולחנות משפחתיים שהופכים לארוחות צהריים
    ארוכות, כרמים אינסופיים מתחת להרים וכמה מגדולי המונומנטים של האדריכלות הגאורגית. המסלול עובד כל השנה,
    אך סוף ספטמבר ואוקטובר, בעונת בציר הרתוולי, הם ללא תחרות. רכב חסכוני מספיק לגמרי. כלל אחד חשוב מכולם:
    מי שנוהג לא טועם.
  plan: >-
    **יום 1 · טביליסי → סיגנאגי (115 ק״מ, 2 שעות)**

    - 09:30 יציאה מטביליסי בכביש קחתי, עצירת קפה ליד סאגארג'ו.

    - 11:30 הגעה לסיגנאגי ורישום במקום הלינה.

    - 12:30 ארוחת צהריים, ואחריה המרכז המרוצף, חומת העיר והתצפית על העמק (2 שעות).

    - 15:30 מנזר בודבה ומעיין נינו הקדושה (1 שעה 30 דקות).

    - 18:00 טעימה במרתף משפחתי בסיגנאגי או בבודבה.

    - לינה בסיגנאגי.


    **יום 2 · סיגנאגי → טלאווי (60 ק״מ, 1 שעה 15 דקות)**

    - 10:00 נסיעה דרך צנורי וגורג'אני עם נופים אל עמק אלאזני.

    - 11:30 טלאווי: באטוניס ציחה, הארמון המלכותי ועץ הדולב בן 900 השנה (2 שעות).

    - 14:00 ארוחת צהריים ליד השוק של טלאווי (1 שעה).

    - 16:00 שני מנזרי שואמתה או סיבוב רגלי בעיר (1 שעה 30 דקות).

    - 19:00 ארוחת ערב עם טעימה; לינה בטלאווי.


    **יום 3 · טלאווי → צינאנדלי → אלאוורדי → קווארלי → טביליסי (215 ק״מ, 4 שעות 15 דקות)**

    - 09:00 אחוזת צינאנדלי, הגן והמרתף ההיסטורי (2 שעות).

    - 11:30 קתדרלת אלאוורדי (1 שעה).

    - 13:30 קווארלי: יקב קינדזמראולי ומנהרות היין (2 שעות).

    - 15:30 ארוחת צהריים מאוחרת בקווארלי או ליד אגם איליה (1 שעה).

    - 17:00 חזרה דרך גורג'אני וסאגארג'ו.

    - 20:00 חזרה לטביליסי.
  tips:
  - הנהג לא טועם — גאורגיה אוכפת סף אלכוהול אפס; סכמו מראש מי נוהג בכל יום.
  - 'בציר הרתוולי נמשך מסוף ספטמבר לאורך אוקטובר: הזמן הטוב ביותר למרתפים, וגם הזמן שבו המלונות מתמלאים
    ראשונים.'
  - התקשרו מראש למרתפים משפחתיים קטנים — רבים מהם מקבלים אורחים בתיאום בלבד.
  - באלאוורדי ובבודבה יש קוד לבוש; מטפחות וכיסויים נמצאים בדרך כלל בשער.
  - השאירו מקום בתא המטען לבקבוקים, וארזו אותם עומדים ומרופדים לדרך חזרה.
ar:
  name: حلقة نبيذ كاخيتي
  short: 'ثلاثة أيام عبر وادي ألازاني: سيغناغي وبودبي وتيلافي وتسيناندالي وألافيردي وكفاريلي.'
  body: >-
    كاخيتي قلب النبيذ الجورجي وأسهل مناطق البلاد للقيادة. الحلقة كلها على الإسفلت، والمسافات بين المحطات
    قصيرة، ولن تبتعد يوماً أكثر من ساعتين عن تبليسي. وثلاثة أيام هي ما يلزم لتتوقف عن الركض بين الأقبية
    وتجلس بدل ذلك وتتذوق كما ينبغي وتنام حيث تذوقت.

    اليوم الأول لـ**سيغناغي**، بلدة التل المسوّرة التي تجمع أزقتها المرصوفة والمسير فوق سورها وادي ألازاني
    وسلسلة القوقاز كلها في مشهد واحد؛ وعلى بعد كيلومترين منها دير بودبي، مدفن القديسة نينو. واليوم الثاني
    لعاصمة الإقليم تيلافي، بقصر باتونيس تسيخي للملك إيريكلي الثاني، ثم تسيناندالي — ضيعة تشافتشافادزي
    بحديقتها على الطراز الإنجليزي وقبوها المبني عام 1841 الذي خرج منه أول نبيذ جورجي معبأ في زجاجات. ويفتتح
    اليوم الثالث بألافيردي، كاتدرائية بارتفاع خمسين متراً من القرن الحادي عشر تقف وحدها في الحقول، وينتهي
    في منطقة كيندزماراولي حول كفاريلي.

    وما تراه فعلاً: أقبية كفيفري حيث يختمر النبيذ في جرار طينية مدفونة، وموائد عائلية تتحول إلى غداء طويل،
    وكروم لا تنتهي تحت الجبال، وعدد من أعظم آثار العمارة الجورجية. المسار يعمل طوال العام، لكن أواخر سبتمبر
    وأكتوبر، في موسم قطاف رتفيلي، لا يُبارى. وسيارة اقتصادية تكفي تماماً. وقاعدة واحدة تعلو ما عداها:
    من يقود لا يتذوق.
  plan: >-
    **اليوم 1 · تبليسي → سيغناغي (115 كم، 2 ساعة)**

    - 09:30 المغادرة من تبليسي على طريق كاخيتي، ووقفة قهوة قرب ساغاريجو.

    - 11:30 الوصول إلى سيغناغي وتسجيل الدخول.

    - 12:30 الغداء، ثم المركز المرصوف وسور البلدة وإطلالة الوادي (2 ساعة).

    - 15:30 دير بودبي ونبع القديسة نينو (1 ساعة و30 دقيقة).

    - 18:00 تذوق في قبو عائلي في سيغناغي أو بودبي.

    - المبيت في سيغناغي.


    **اليوم 2 · سيغناغي → تيلافي (60 كم، 1 ساعة و15 دقيقة)**

    - 10:00 القيادة عبر تسنوري وغورجاني مع إطلالات على وادي ألازاني.

    - 11:30 تيلافي: باتونيس تسيخي والقصر الملكي وشجرة الدلب البالغة 900 سنة (2 ساعة).

    - 14:00 الغداء قرب سوق تيلافي (1 ساعة).

    - 16:00 ديرا شوآمتا أو جولة سيراً في البلدة (1 ساعة و30 دقيقة).

    - 19:00 العشاء مع تذوق؛ المبيت في تيلافي.


    **اليوم 3 · تيلافي → تسيناندالي → ألافيردي → كفاريلي → تبليسي (215 كم، 4 ساعات و15 دقيقة)**

    - 09:00 ضيعة تسيناندالي وحديقتها وقبوها التاريخي (2 ساعة).

    - 11:30 كاتدرائية ألافيردي (1 ساعة).

    - 13:30 كفاريلي: معمل نبيذ كيندزماراولي وأنفاق النبيذ (2 ساعة).

    - 15:30 غداء متأخر في كفاريلي أو عند بحيرة إيليا (1 ساعة).

    - 17:00 العودة عبر غورجاني وساغاريجو.

    - 20:00 العودة إلى تبليسي.
  tips:
  - السائق لا يتذوق — جورجيا تطبق حد صفر للكحول؛ اتفقوا مسبقاً على من يقود كل يوم.
  - 'يمتد قطاف رتفيلي من أواخر سبتمبر حتى نهاية أكتوبر: أفضل وقت للأقبية، وأول وقت تمتلئ فيه الفنادق.'
  - اتصل بالأقبية العائلية الصغيرة مسبقاً — كثير منها يستقبل الضيوف بموعد فقط.
  - في ألافيردي وبودبي قواعد لباس؛ وتتوفر الأوشحة والأغطية عادة عند البوابة.
  - اترك مساحة في الصندوق للزجاجات، واحزمها واقفة ومبطنة لرحلة العودة.
