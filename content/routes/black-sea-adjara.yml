ka:
  name: შავი ზღვა და აჭარა
  short: 'ოთხი დღე დასავლეთში: ქუთაისი, ქობულეთი, ბათუმი, გონიო, მახუნცეთი და მთირალა.'
  body: >-
    თბილისიდან ბათუმამდე 370 კილომეტრია და ხუთნახევარი საათი — ერთი დღის სავალი, რომელიც ჯობია ორად გაყო
    და ქუთაისში შეისვენო. ოთხი დღე იმისთვისაა, რომ სანაპიროც ნახო და აჭარის მთებიც: ბათუმი მარტო პლაჟი
    არ არის, მისგან ნახევარ საათში სუბტროპიკული ტყე და ჩანჩქერები იწყება.


    პირველი დღე გზაშია, ქუთაისის გაჩერებით. მეორე დღე სანაპიროზე გადის: **ქობულეთის** გრძელი კენჭოვანი
    პლაჟი, მწვანე კონცხის ბოტანიკური ბაღი — ერთ ჰექტარზე იაპონური, ჰიმალაური და ხმელთაშუაზღვისპირა კოლექციები
    — და ბოლოს ბათუმი თავისი ბულვარით, ძველი ქალაქითა და საღამოს განათებული ცათამბჯენებით. მესამე დღეს
    სამხრეთისკენ, **გონიოს ციხე** გელოდება, რომაული კასტელუმი, სადაც ლეგენდით მოციქული მატათა განისვენებს.
    მეოთხე დღე მთაშია: აჭარისწყლის ხეობა, მახუნცეთის თაღოვანი ხიდი და ჩანჩქერი, შემდეგ კი მთირალას ეროვნული
    პარკი, საქართველოს ყველაზე წვიმიანი ადგილი.


    გაითვალისწინე კლიმატი: აჭარაში წელიწადში 2 500 მილიმეტრამდე ნალექი მოდის და წვიმა ზაფხულშიც არაა იშვიათი,
    თუმცა სწორედ ამ ტენიანობას უმადლის რეგიონი თავის ლიანებიან, თითქმის ტროპიკულ ტყეს. მთირალას შიდა გზები
    და აჭარისწყლის ხეობის ზოგი მონაკვეთი მაღალ კლირენსს ითხოვს, ძირითადი სანაპირო გზა კი შესანიშნავი ხარისხისაა.
    საზღვაო სეზონი ივნისიდან სექტემბრამდეა, ხოლო მთისა და ჩანჩქერებისთვის მაისი და ოქტომბერიც შესანიშნავია
    — ამ დროს ბათუმი ბევრად მშვიდი და იაფია.
  plan: >-
    **დღე 1 · თბილისი → ქუთაისი → ბათუმი (370 კმ, 5 სთ 30 წთ)**

    - 08:00 გასვლა თბილისიდან E60-ით.

    - 11:30 ქუთაისი: ბაგრატის ტაძარი და სადილი (2 სთ).

    - 17:00 ჩამოსვლა ბათუმში, განთავსება და საღამო ბულვარზე (2 სთ).

    - ღამისთევა ბათუმში.


    **დღე 2 · ქობულეთი და ბოტანიკური ბაღი (90 კმ, 1 სთ 30 წთ)**

    - 09:30 გასვლა ჩრდილოეთით, **ქობულეთის** პლაჟი და ბულვარი (2 სთ 30 წთ).

    - 13:00 სადილი ქობულეთში (1 სთ).

    - 15:00 ბათუმის ბოტანიკური ბაღი მწვანე კონცხზე (2 სთ 30 წთ).

    - 19:00 ბათუმის ძველი ქალაქი და პიაცა (1 სთ 30 წთ).

    - ღამისთევა ბათუმში.


    **დღე 3 · გონიო და ბათუმი (40 კმ, 1 სთ)**

    - 10:00 **გონიო-აფსაროსის ციხე** და მუზეუმი (1 სთ 30 წთ).

    - 12:00 პლაჟი გონიოსა და კვარიათში (2 სთ).

    - 15:00 სადილი ზღვისპირა რესტორანში (1 სთ 30 წთ).

    - 18:00 ბათუმის საბაგირო და ალფავიტის კოშკი (2 სთ).

    - ღამისთევა ბათუმში.


    **დღე 4 · მახუნცეთი, მთირალა → თბილისი (400 კმ, 6 სთ 30 წთ)**

    - 08:00 აჭარისწყლის ხეობა, მახუნცეთის თაღოვანი ხიდი და ჩანჩქერი (1 სთ 30 წთ).

    - 10:30 მთირალას ეროვნული პარკი, მოკლე ბილიკი და დაკიდული ხიდი (2 სთ).

    - 13:00 სადილი ჩაქვსა ან ქობულეთში (1 სთ).

    - 14:30 დაბრუნება სამტრედიისა და ქუთაისის გავლით.

    - 21:00 თბილისში დაბრუნება.
  tips:
  - აჭარაში ხშირად წვიმს — წყალგაუმტარი ქურთუკი და დამატებითი ფეხსაცმელი წაიღე ზაფხულშიც.
  - მთირალას შიდა გზა და ხეობის ზოგი მონაკვეთი მაღალ კლირენსს ითხოვს.
  - ბათუმში ზაფხულში პარკირება ძვირი და გადატვირთულია — სასტუმრო პარკინგით აირჩიე.
  - პლაჟები კენჭოვანია, არა ქვიშიანი (გარდა ურეკისა) — წყლის ფეხსაცმელი გამოგადგება.
  - ივლის-აგვისტოში სანაპიროზე ფასები ორმაგდება; მაისი, ივნისი და სექტემბერი ბევრად მშვიდია.
  - თბილისი-ბათუმი ერთ დღეში 5 სთ 30 წთია — გასვლა დილით ადრე დაგეგმე.
en:
  name: Black Sea and Adjara
  short: 'Four days in the west: Kutaisi, Kobuleti, Batumi, Gonio, Makhuntseti and Mtirala.'
  body: >-
    Tbilisi to Batumi is 370 kilometres and five and a half hours — a full driving day that is much better
    broken with a stop in Kutaisi. Four days gives you both halves of Adjara: the coast and the mountains
    behind it. Batumi is not only a beach; half an hour inland the subtropical forest and the waterfalls
    begin.


    Day one is mostly driving, with Kutaisi as the break. Day two runs along the coast: the long pebble
    beach of **Kobuleti**, the Batumi Botanical Garden on Green Cape with its Japanese, Himalayan and
    Mediterranean sections spilling down to the sea, and finally Batumi itself — the boulevard, the old
    town and the lit-up towers at night. Day three heads south to **Gonio-Apsaros Fortress**, a Roman
    castellum where, by tradition, the Apostle Matthias is buried. Day four goes up into the hills: the
    Adjaristsqali valley, the arched stone bridge and waterfall at Makhuntseti, then Mtirala National
    Park, the wettest place in Georgia.


    Take the climate seriously: Adjara receives up to 2,500 millimetres of rain a year and summer downpours
    are common. Some sections inside Mtirala and up the valley need real ground clearance. The swimming
    season runs June to September, while May and October are excellent for the mountains, the waterfalls
    and the empty coastal road.
  plan: >-
    **Day 1 · Tbilisi → Kutaisi → Batumi (370 km, 5 h 30 min)**

    - 08:00 Leave Tbilisi on the E60.

    - 11:30 Kutaisi: Bagrati Cathedral and lunch (2 h).

    - 17:00 Arrive Batumi, check in, evening on the boulevard (2 h).

    - Overnight in Batumi.


    **Day 2 · Kobuleti and the Botanical Garden (90 km, 1 h 30 min)**

    - 09:30 Drive north to **Kobuleti** for the beach and promenade (2 h 30 min).

    - 13:00 Lunch in Kobuleti (1 h).

    - 15:00 Batumi Botanical Garden on Green Cape (2 h 30 min).

    - 19:00 Batumi old town and Piazza (1 h 30 min).

    - Overnight in Batumi.


    **Day 3 · Gonio and Batumi (40 km, 1 h)**

    - 10:00 **Gonio-Apsaros Fortress** and its museum (1 h 30 min).

    - 12:00 Beach time at Gonio or Kvariati (2 h).

    - 15:00 Late lunch at a seafront restaurant (1 h 30 min).

    - 18:00 Batumi cable car and the Alphabet Tower (2 h).

    - Overnight in Batumi.


    **Day 4 · Makhuntseti, Mtirala → Tbilisi (400 km, 6 h 30 min)**

    - 08:00 Up the Adjaristsqali valley to the Makhuntseti bridge and waterfall (1 h 30 min).

    - 10:30 Mtirala National Park, short trail and suspension bridge (2 h).

    - 13:00 Lunch in Chakvi or Kobuleti (1 h).

    - 14:30 Drive back via Samtredia and Kutaisi.

    - 21:00 Back in Tbilisi.
  tips:
  - It rains often in Adjara — pack a waterproof and a spare pair of shoes even in summer.
  - The park road inside Mtirala and parts of the valley need proper ground clearance.
  - Parking in Batumi is expensive and scarce in summer; choose a hotel with its own parking.
  - The beaches are pebble, not sand (except Ureki) — water shoes make a real difference.
  - Coastal prices double in July and August; May, June and September are calmer and cheaper.
  - Tbilisi-Batumi is 5 h 30 min in one go — plan an early start on day one.
ru:
  name: Чёрное море и Аджария
  short: 'Четыре дня на западе: Кутаиси, Кобулети, Батуми, Гонио, Махунцети и Мтирала.'
  body: >-
    От Тбилиси до Батуми 370 километров и пять с половиной часов — полный ходовой день, который лучше
    разбить остановкой в Кутаиси. Четыре дня дают обе половины Аджарии: побережье и горы за ним. Батуми
    — это не только пляж: в получасе от города начинаются субтропический лес и водопады.


    Первый день почти весь в дороге, с паузой в Кутаиси. Второй проходит вдоль моря: длинный галечный
    пляж **Кобулети**, Батумский ботанический сад на Зелёном мысу с японским, гималайским и средиземноморским
    участками, спускающимися прямо к воде, и, наконец, сам Батуми — бульвар, старый город и подсвеченные
    башни вечером. Третий день ведёт на юг, к **крепости Гонио-Апсарос**, римскому кастеллуму, где по
    преданию похоронен апостол Матфий. Четвёртый день — в горах: ущелье Аджарисцкали, каменный арочный
    мост и водопад Махунцети, затем национальный парк Мтирала, самое дождливое место Грузии.


    К климату отнеситесь серьёзно: в Аджарии выпадает до 2 500 миллиметров осадков в год, и летние ливни
    здесь обычное дело. Часть дорог внутри Мтиралы и в ущелье требует высокого клиренса. Купальный сезон
    — с июня по сентябрь, а май и октябрь отлично подходят для гор, водопадов и пустого приморского шоссе.
  plan: >-
    **День 1 · Тбилиси → Кутаиси → Батуми (370 км, 5 ч 30 мин)**

    - 08:00 Выезд из Тбилиси по E60.

    - 11:30 Кутаиси: собор Баграти и обед (2 ч).

    - 17:00 Приезд в Батуми, заселение, вечер на бульваре (2 ч).

    - Ночёвка в Батуми.


    **День 2 · Кобулети и ботанический сад (90 км, 1 ч 30 мин)**

    - 09:30 Поездка на север, пляж и набережная **Кобулети** (2 ч 30 мин).

    - 13:00 Обед в Кобулети (1 ч).

    - 15:00 Батумский ботанический сад на Зелёном мысу (2 ч 30 мин).

    - 19:00 Старый город Батуми и площадь Пьяцца (1 ч 30 мин).

    - Ночёвка в Батуми.


    **День 3 · Гонио и Батуми (40 км, 1 ч)**

    - 10:00 **Крепость Гонио-Апсарос** и музей (1 ч 30 мин).

    - 12:00 Пляж в Гонио или Квариати (2 ч).

    - 15:00 Поздний обед в ресторане у моря (1 ч 30 мин).

    - 18:00 Канатная дорога и Башня алфавита (2 ч).

    - Ночёвка в Батуми.


    **День 4 · Махунцети, Мтирала → Тбилиси (400 км, 6 ч 30 мин)**

    - 08:00 Ущелье Аджарисцкали, арочный мост и водопад Махунцети (1 ч 30 мин).

    - 10:30 Национальный парк Мтирала, короткая тропа и подвесной мост (2 ч).

    - 13:00 Обед в Чакви или Кобулети (1 ч).

    - 14:30 Обратный путь через Самтредиа и Кутаиси.

    - 21:00 Возвращение в Тбилиси.
  tips:
  - В Аджарии часто идут дожди — дождевик и запасная пара обуви нужны даже летом.
  - Дорога внутри Мтиралы и отдельные участки в ущелье требуют высокого клиренса.
  - Парковка в Батуми летом дорогая и переполнена; выбирайте отель со своей стоянкой.
  - Пляжи галечные, а не песчаные (кроме Уреки) — обувь для воды заметно помогает.
  - В июле и августе цены на побережье удваиваются; май, июнь и сентябрь спокойнее.
  - 'Тбилиси — Батуми это 5 ч 30 мин без остановок: планируйте ранний выезд в первый день.'
fa:
  name: دریای سیاه و آجارا
  short: 'چهار روز در غرب: کوتایسی، کوبولتی، باتومی، گونیو، ماخونتستی و متیرالا.'
  body: >-
    از تفلیس تا باتومی 370 کیلومتر و پنج ساعت و نیم راه است — یک روز کامل رانندگی که با توقف در کوتایسی
    بسیار بهتر شکسته می‌شود. چهار روز هر دو نیمهٔ آجارا را به شما می‌دهد: ساحل و کوه‌های پشت آن. باتومی
    فقط ساحل نیست؛ نیم ساعت به سمت داخل، جنگل نیمه‌گرمسیری و آبشارها شروع می‌شوند.

    روز اول بیشتر رانندگی است و کوتایسی وقفهٔ آن. روز دوم در امتداد ساحل می‌گذرد: ساحل سنگریزه‌ای بلند
    **کوبولتی**، باغ گیاه‌شناسی باتومی روی دماغهٔ سبز با بخش‌های ژاپنی، هیمالیایی و مدیترانه‌ای که تا
    لب دریا سرازیر می‌شوند، و سرانجام خود باتومی — گردشگاه، شهر قدیم و برج‌های نورانی در شب. روز سوم رو
    به جنوب به **دژ گونیو-آپساروس** می‌رود، دژی رومی که بنا بر روایت، متیاس حواری در آن به خاک سپرده شده
    است. روز چهارم به تپه‌ها بالا می‌رود: درهٔ آجاریس‌تسکالی، پل سنگی طاق‌دار و آبشار ماخونتستی، سپس پارک
    ملی متیرالا، مرطوب‌ترین نقطهٔ گرجستان.

    اقلیم را جدی بگیرید: آجارا تا 2,500 میلی‌متر باران در سال دریافت می‌کند و رگبارهای تابستانی رایج‌اند.
    برخی مقاطع داخل متیرالا و بالای دره به ارتفاع کف واقعی نیاز دارند. فصل شنا از ژوئن تا سپتامبر است،
    در حالی که ماه مه و اکتبر برای کوهستان، آبشارها و جادهٔ خلوت ساحلی عالی‌اند.
  plan: >-
    **روز 1 · تفلیس → کوتایسی → باتومی (370 کیلومتر، 5 ساعت و 30 دقیقه)**

    - 08:00 حرکت از تفلیس روی E60.

    - 11:30 کوتایسی: کلیسای جامع باگراتی و ناهار (2 ساعت).

    - 17:00 رسیدن به باتومی، ورود به هتل، عصر روی گردشگاه (2 ساعت).

    - شب در باتومی.


    **روز 2 · کوبولتی و باغ گیاه‌شناسی (90 کیلومتر، 1 ساعت و 30 دقیقه)**

    - 09:30 حرکت به شمال به سوی **کوبولتی** برای ساحل و پیاده‌راه (2 ساعت و 30 دقیقه).

    - 13:00 ناهار در کوبولتی (1 ساعت).

    - 15:00 باغ گیاه‌شناسی باتومی روی دماغهٔ سبز (2 ساعت و 30 دقیقه).

    - 19:00 شهر قدیم باتومی و میدان پیاتزا (1 ساعت و 30 دقیقه).

    - شب در باتومی.


    **روز 3 · گونیو و باتومی (40 کیلومتر، 1 ساعت)**

    - 10:00 **دژ گونیو-آپساروس** و موزهٔ آن (1 ساعت و 30 دقیقه).

    - 12:00 وقت ساحل در گونیو یا کواریاتی (2 ساعت).

    - 15:00 ناهار دیرهنگام در رستورانی رو به دریا (1 ساعت و 30 دقیقه).

    - 18:00 تله‌کابین باتومی و برج الفبا (2 ساعت).

    - شب در باتومی.


    **روز 4 · ماخونتستی، متیرالا → تفلیس (400 کیلومتر، 6 ساعت و 30 دقیقه)**

    - 08:00 بالا رفتن از درهٔ آجاریس‌تسکالی تا پل و آبشار ماخونتستی (1 ساعت و 30 دقیقه).

    - 10:30 پارک ملی متیرالا، مسیر کوتاه و پل معلق (2 ساعت).

    - 13:00 ناهار در چاکوی یا کوبولتی (1 ساعت).

    - 14:30 بازگشت از راه سامتردیا و کوتایسی.

    - 21:00 بازگشت به تفلیس.
  tips:
  - در آجارا زیاد باران می‌بارد — حتی در تابستان بارانی و یک جفت کفش اضافه بردارید.
  - جادهٔ داخل پارک متیرالا و بخش‌هایی از دره به ارتفاع کف مناسب نیاز دارند.
  - پارکینگ در باتومی گران و در تابستان کمیاب است؛ هتلی با پارکینگ اختصاصی انتخاب کنید.
  - ساحل‌ها سنگریزه‌ای‌اند نه شنی (به جز اورکی) — کفش دریایی تفاوت واقعی ایجاد می‌کند.
  - قیمت‌های ساحلی در ژوئیه و اوت دو برابر می‌شود؛ ماه مه، ژوئن و سپتامبر آرام‌تر و ارزان‌ترند.
  - تفلیس تا باتومی یک‌سره 5 ساعت و 30 دقیقه است — روز اول زود راه بیفتید.
he:
  name: הים השחור ואג'ריה
  short: 'ארבעה ימים במערב: קוטאיסי, קובולטי, בטומי, גוניו, מאחונצטי ומטירלה.'
  body: >-
    מטביליסי לבטומי 370 קילומטרים וחמש שעות וחצי — יום נהיגה מלא, ועדיף בהרבה לשבור אותו בעצירה בקוטאיסי.
    ארבעה ימים נותנים לכם את שני חצאיה של אג'ריה: החוף וההרים שמאחוריו. בטומי אינה רק חוף; חצי שעה פנימה
    מתחילים היער הסובטרופי והמפלים.

    היום הראשון הוא בעיקר נסיעה, וקוטאיסי היא ההפוגה. היום השני נמשך לאורך החוף: חוף החלוקים הארוך של
    **קובולטי**, הגן הבוטני של בטומי בכף הירוק עם החלקות היפניות, ההימלאיות והים-תיכוניות היורדות עד המים,
    ולבסוף בטומי עצמה — הטיילת, העיר העתיקה והמגדלים המוארים בלילה. היום השלישי פונה דרומה אל **מבצר גוניו-אפסארוס**,
    מצודה רומית שלפי המסורת קבור בה השליח מתיא. היום הרביעי עולה אל הגבעות: עמק אג'ריסצקאלי, גשר האבן
    המקומר והמפל במאחונצטי, ואחריהם הפארק הלאומי מטירלה, המקום הגשום ביותר בגאורגיה.

    קחו את האקלים ברצינות: אג'ריה מקבלת עד 2,500 מילימטר גשם בשנה וממטרי קיץ הם דבר שבשגרה. חלק מהקטעים
    בתוך מטירלה ובמעלה העמק דורשים גובה גחון אמיתי. עונת הרחצה נמשכת מיוני עד ספטמבר, ואילו מאי ואוקטובר
    מצוינים להרים, למפלים ולכביש החוף הריק.
  plan: >-
    **יום 1 · טביליסי → קוטאיסי → בטומי (370 ק״מ, 5 שעות 30 דקות)**

    - 08:00 יציאה מטביליסי בכביש E60.

    - 11:30 קוטאיסי: קתדרלת בגראטי וארוחת צהריים (2 שעות).

    - 17:00 הגעה לבטומי, רישום במלון, ערב על הטיילת (2 שעות).

    - לינה בבטומי.


    **יום 2 · קובולטי והגן הבוטני (90 ק״מ, 1 שעה 30 דקות)**

    - 09:30 נסיעה צפונה אל **קובולטי** לחוף ולטיילת (2 שעות 30 דקות).

    - 13:00 ארוחת צהריים בקובולטי (1 שעה).

    - 15:00 הגן הבוטני של בטומי בכף הירוק (2 שעות 30 דקות).

    - 19:00 העיר העתיקה של בטומי וכיכר הפיאצה (1 שעה 30 דקות).

    - לינה בבטומי.


    **יום 3 · גוניו ובטומי (40 ק״מ, 1 שעה)**

    - 10:00 **מבצר גוניו-אפסארוס** והמוזיאון שבו (1 שעה 30 דקות).

    - 12:00 זמן חוף בגוניו או בקווריאטי (2 שעות).

    - 15:00 ארוחת צהריים מאוחרת במסעדה על קו המים (1 שעה 30 דקות).

    - 18:00 הרכבל של בטומי ומגדל האלפבית (2 שעות).

    - לינה בבטומי.


    **יום 4 · מאחונצטי, מטירלה → טביליסי (400 ק״מ, 6 שעות 30 דקות)**

    - 08:00 עלייה בעמק אג'ריסצקאלי אל גשר מאחונצטי והמפל (1 שעה 30 דקות).

    - 10:30 הפארק הלאומי מטירלה, שביל קצר וגשר תלוי (2 שעות).

    - 13:00 ארוחת צהריים בצ'קווי או בקובולטי (1 שעה).

    - 14:30 חזרה דרך סמטרדיה וקוטאיסי.

    - 21:00 חזרה לטביליסי.
  tips:
  - באג'ריה יורד גשם לעיתים קרובות — קחו מעיל גשם וזוג נעליים נוסף גם בקיץ.
  - דרך הפארק בתוך מטירלה וחלקים מהעמק דורשים גובה גחון הולם.
  - החניה בבטומי יקרה ומועטה בקיץ; בחרו מלון עם חניה משלו.
  - החופים הם חלוקים ולא חול (למעט אורקי) — נעלי מים עושות הבדל אמיתי.
  - מחירי החוף מכפילים את עצמם ביולי ובאוגוסט; מאי, יוני וספטמבר רגועים וזולים יותר.
  - טביליסי-בטומי היא 5 שעות ו-30 דקות ברצף — תכננו יציאה מוקדמת ביום הראשון.
ar:
  name: البحر الأسود وأدجارا
  short: 'أربعة أيام في الغرب: كوتايسي وكوبوليتي وباتومي وغونيو وماخونتسيتي ومتيرالا.'
  body: >-
    من تبليسي إلى باتومي 370 كيلومتراً وخمس ساعات ونصف — يوم قيادة كامل يُستحسن كثيراً كسره بوقفة في كوتايسي.
    وأربعة أيام تمنحك نصفَي أدجارا: الساحل والجبال التي خلفه. فباتومي ليست شاطئاً فحسب؛ فعلى بعد نصف ساعة
    نحو الداخل تبدأ الغابة شبه المدارية والشلالات.

    اليوم الأول قيادة في معظمه، وكوتايسي هي الاستراحة. واليوم الثاني يمتد على الساحل: شاطئ الحصى الطويل
    في **كوبوليتي**، وحديقة باتومي النباتية على الرأس الأخضر بأقسامها اليابانية والهيمالائية والمتوسطية
    المنحدرة حتى الماء، وأخيراً باتومي نفسها — الكورنيش والمدينة القديمة والأبراج المضاءة ليلاً. واليوم
    الثالث يتجه جنوباً إلى **حصن غونيو-أبساروس**، وهو حصن روماني يُروى أن الرسول متياس مدفون فيه. واليوم
    الرابع يصعد إلى التلال: وادي أدجاريستسكالي، والجسر الحجري المقوّس وشلال ماخونتسيتي، ثم منتزه متيرالا
    الوطني، أكثر بقاع جورجيا مطراً.

    خذ المناخ على محمل الجد: تتلقى أدجارا حتى 2,500 مليمتر من المطر سنوياً، وزخات الصيف الغزيرة معتادة.
    وبعض المقاطع داخل متيرالا وفي أعلى الوادي تحتاج خلوصاً أرضياً حقيقياً. موسم السباحة من يونيو إلى سبتمبر،
    بينما مايو وأكتوبر ممتازان للجبال والشلالات ولطريق الساحل الخالي.
  plan: >-
    **اليوم 1 · تبليسي → كوتايسي → باتومي (370 كم، 5 ساعات و30 دقيقة)**

    - 08:00 المغادرة من تبليسي على الطريق E60.

    - 11:30 كوتايسي: كاتدرائية باغراتي والغداء (2 ساعة).

    - 17:00 الوصول إلى باتومي وتسجيل الدخول وأمسية على الكورنيش (2 ساعة).

    - المبيت في باتومي.


    **اليوم 2 · كوبوليتي والحديقة النباتية (90 كم، 1 ساعة و30 دقيقة)**

    - 09:30 القيادة شمالاً إلى **كوبوليتي** للشاطئ والممشى (2 ساعة و30 دقيقة).

    - 13:00 الغداء في كوبوليتي (1 ساعة).

    - 15:00 حديقة باتومي النباتية على الرأس الأخضر (2 ساعة و30 دقيقة).

    - 19:00 مدينة باتومي القديمة وساحة بياتزا (1 ساعة و30 دقيقة).

    - المبيت في باتومي.


    **اليوم 3 · غونيو وباتومي (40 كم، 1 ساعة)**

    - 10:00 **حصن غونيو-أبساروس** ومتحفه (1 ساعة و30 دقيقة).

    - 12:00 وقت على شاطئ غونيو أو كفارياتي (2 ساعة).

    - 15:00 غداء متأخر في مطعم على البحر (1 ساعة و30 دقيقة).

    - 18:00 تلفريك باتومي وبرج الأبجدية (2 ساعة).

    - المبيت في باتومي.


    **اليوم 4 · ماخونتسيتي ومتيرالا → تبليسي (400 كم، 6 ساعات و30 دقيقة)**

    - 08:00 الصعود في وادي أدجاريستسكالي إلى جسر ماخونتسيتي وشلاله (1 ساعة و30 دقيقة).

    - 10:30 منتزه متيرالا الوطني، مسار قصير وجسر معلق (2 ساعة).

    - 13:00 الغداء في تشاكفي أو كوبوليتي (1 ساعة).

    - 14:30 العودة عبر سامتريديا وكوتايسي.

    - 21:00 العودة إلى تبليسي.
  tips:
  - تمطر كثيراً في أدجارا — احمل معطفاً واقياً وزوج حذاء إضافياً حتى في الصيف.
  - طريق المنتزه داخل متيرالا وأجزاء من الوادي تحتاج خلوصاً أرضياً مناسباً.
  - مواقف السيارات في باتومي غالية وشحيحة صيفاً؛ اختر فندقاً له موقف خاص.
  - الشواطئ حصوية لا رملية (باستثناء أوريكي) — وأحذية الماء تحدث فرقاً حقيقياً.
  - تتضاعف أسعار الساحل في يوليو وأغسطس؛ ومايو ويونيو وسبتمبر أهدأ وأرخص.
  - تبليسي-باتومي 5 ساعات و30 دقيقة دفعة واحدة — خطط لانطلاقة مبكرة في اليوم الأول.
