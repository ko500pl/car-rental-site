en: {name: Tbilisi Theatre and Performance Day, short: Four major theatres in one cultural circuit with a chosen evening performance., body: Explore the venues and neighbourhoods by day and attend whichever production is scheduled for your date., plan: "Marjanishvili Theatre → Opera and Ballet Theatre → Rustaveli Theatre → Gabriadze Theatre and Clock Tower → pre-booked evening performance.", tips: [Schedules change frequently; buy through the official venue in advance., Walk or use the metro in the centre.]}
