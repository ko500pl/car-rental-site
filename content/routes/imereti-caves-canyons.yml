ka:
  name: 'იმერეთი: ღრმულები და კანიონები'
  short: 'სამი დღე დასავლეთში: უფლისციხე, ქუთაისი, გელათი, პრომეთე, სათაფლია და ოკაცე-კინჩხა.'
  body: >-
    იმერეთი საქართველოს ის კუთხეა, სადაც კირქვაა და კირქვა ნიშნავს ღრმულებს, კანიონებსა და ჩანჩქერებს.
    ქუთაისი, ქვეყნის მეორე ქალაქი, ამ ყველაფრის იდეალური ბაზაა: აქედან ყველა მთავარ ობიექტამდე ერთ საათზე
    ნაკლებია. მარშრუტი სამ დღეზეა გათვლილი, რადგან ერთ დღეში ბუნებრივი და ისტორიული ძეგლების ეს კონცენტრაცია
    უბრალოდ არ ეტევა.


    გზაზე პირველი გაჩერება **უფლისციხეა** — კლდეში ნაკვეთი ქალაქი გორთან, სადაც წარმართული სამსხვერპლოები
    და ელინისტური დარბაზები შემორჩა. ქუთაისში ბაგრატის ტაძარი და უძველესი ბაზრობაა, ხოლო ქალაქის გარეთ
    — **გელათი**, დავით აღმაშენებლის აკადემია და მისი მოზაიკები, იუნესკოს სიაში შეტანილი, და მოწამეთას
    პატარა მონასტერი კლდის თავზე. მეორე დღე მიწისქვეშეთია: პრომეთეს ღრმულის სტალაქტიტები, მიწისქვეშა მდინარე
    და სათაფლიის დინოზავრების ნაკვალევი. მესამე დღეს ოკაცეს კანიონის 700-მეტრიანი დაკიდული ბილიკი და კინჩხის
    ჩანჩქერი გელოდება.


    გაითვალისწინე: ოკაცესა და კინჩხასთან მისასვლელი გზა გორდის შემდეგ გრუნტოვანია და წვიმაში ცუდად ითმენს
    — მაღალი კლირენსის ავტომობილი აქ ნამდვილად საჭიროა. სეზონი მაისიდან ოქტომბრამდეა; ზამთარში კანიონები
    ხშირად იკეტება, ღრმულები კი მთელი წელი მუშაობს, რადგან მიწისქვეშ ტემპერატურა არასდროს იცვლება.


    თუ დამატებითი დღე გაქვს, იმავე რადიუსში მოხვდება ცხალტუბოს საბჭოთა სანატორიუმები, კაცხის სვეტი და
    მარტვილის კანიონი — იმერეთის მთავარი უპირატესობა სწორედ ის არის, რომ ერთი ბაზიდან ათამდე სრულიად განსხვავებული
    ადგილი მიიწვდომება.
  plan: >-
    **დღე 1 · თბილისი → უფლისციხე → ქუთაისი (245 კმ, 4 სთ)**

    - 08:30 გასვლა თბილისიდან E60-ით.

    - 10:00 უფლისციხე — კლდის ქალაქი და მუზეუმი (2 სთ).

    - 12:30 სადილი გორში (1 სთ).

    - 16:00 ჩამოსვლა ქუთაისში, ბაგრატის ტაძარი და მდინარე რიონის სანაპირო (1 სთ 30 წთ).

    - 19:00 ვახშამი ქუთაისის ცენტრში; ღამისთევა ქუთაისში.


    **დღე 2 · გელათი, პრომეთე და სათაფლია (90 კმ, 2 სთ)**

    - 09:00 მოწამეთას მონასტერი კლდის კონცხზე (45 წთ).

    - 10:15 **გელათის მონასტერი** — მოზაიკა, აკადემია, დავითის საფლავი (1 სთ 30 წთ).

    - 13:00 სადილი ცხალტუბოში ან ქუთაისში (1 სთ).

    - 14:30 პრომეთეს ღრმული, ექსკურსია და მიწისქვეშა ნავით სიარული (2 სთ).

    - 17:00 სათაფლიის ნაკრძალი: დინოზავრის კვალი და მინის ხედის მოედანი (1 სთ 30 წთ).

    - ღამისთევა ქუთაისში.


    **დღე 3 · ოკაცე, კინჩხა → თბილისი (305 კმ, 4 სთ 30 წთ)**

    - 08:30 გასვლა გორდისკენ, გრუნტოვანი მონაკვეთი ბოლო 6 კმ-ზე.

    - 09:45 **ოკაცეს კანიონი** — დაკიდული ბილიკი და ხედის მოედანი (2 სთ).

    - 12:15 კინჩხის ჩანჩქერი (1 სთ).

    - 13:30 სადილი გორდსა ან ხონში (1 სთ).

    - 15:00 დაბრუნება ზესტაფონისა და რიკოთის უღელტეხილის გავლით.

    - 20:00 თბილისში დაბრუნება.
  tips:
  - ოკაცესა და კინჩხასთან ბოლო კილომეტრები გრუნტოვანია — მაღალი კლირენსი აუცილებელია, წვიმის შემდეგ კი
    ორმაგად.
  - პრომეთეს ღრმულში 14 გრადუსია მთელი წელი — ქურთუკი წაიღე, ფეხსაცმელი კი არასრიალა უნდა იყოს.
  - ღრმულებში ექსკურსია ჯგუფებით მიდის და ბილეთი ადგილზე იყიდება; დღის შუა საათებში რიგია.
  - გელათსა და მოწამეთაში ჩაცმის კოდია — თავსაფარი და დახურული მხრები.
  - ქუთაისში დარჩენა ბევრად იაფია, ვიდრე კანიონებთან ახლოს; ქალაქიდან ყველგან 40-60 წუთია.
  - საწვავი ქუთაისში აავსე — გორდის მიმართულებით სადგური აღარ არის.
en:
  name: 'Imereti: Caves and Canyons'
  short: 'Three days in western Georgia: Uplistsikhe, Kutaisi, Gelati, Prometheus, Sataplia and Okatse.'
  body: >-
    Imereti is the limestone corner of Georgia, and limestone means caves, canyons and waterfalls. Kutaisi,
    the country's second city, is the perfect base for all of it: nothing on this route is more than an
    hour's drive from the centre. Three days is the honest minimum, because this density of natural and
    historical sights simply does not compress into one.


    The first stop on the way west is **Uplistsikhe**, the rock-cut town near Gori where pagan sacrificial
    halls and Hellenistic chambers survive above the Mtkvari. In Kutaisi you get Bagrati Cathedral on
    its hill and one of the liveliest markets in the country, and just outside town stand **Gelati**,
    the UNESCO-listed academy founded by David the Builder with its great apse mosaic, and tiny Motsameta
    perched over a river bend. Day two goes underground: the stalactite halls and subterranean river of
    Prometheus Cave, then Sataplia with its fossilised dinosaur footprints and glass viewing platform.
    Day three is the Okatse canyon walkway, 700 metres of steel path bolted to the cliff, and the Kinchkha
    waterfall.


    One warning: the approach to Okatse and Kinchkha turns to gravel after Gordi and does not forgive
    rain, so decent ground clearance genuinely matters here. The season runs May to October — the canyons
    often close in winter, while the caves stay open all year.
  plan: >-
    **Day 1 · Tbilisi → Uplistsikhe → Kutaisi (245 km, 4 h)**

    - 08:30 Leave Tbilisi on the E60.

    - 10:00 Uplistsikhe — the cave town and its museum (2 h).

    - 12:30 Lunch in Gori (1 h).

    - 16:00 Arrive Kutaisi: Bagrati Cathedral and the Rioni embankment (1 h 30 min).

    - 19:00 Dinner in the centre; overnight in Kutaisi.


    **Day 2 · Gelati, Prometheus and Sataplia (90 km, 2 h)**

    - 09:00 Motsameta Monastery on its rock spur (45 min).

    - 10:15 **Gelati Monastery** — mosaic, academy, tomb of King David (1 h 30 min).

    - 13:00 Lunch in Tskaltubo or Kutaisi (1 h).

    - 14:30 Prometheus Cave, guided walk and the underground boat ride (2 h).

    - 17:00 Sataplia Reserve: dinosaur footprints and the glass platform (1 h 30 min).

    - Overnight in Kutaisi.


    **Day 3 · Okatse, Kinchkha → Tbilisi (305 km, 4 h 30 min)**

    - 08:30 Drive to Gordi; the last 6 km are gravel.

    - 09:45 **Okatse Canyon** — the hanging walkway and viewpoint (2 h).

    - 12:15 Kinchkha waterfall (1 h).

    - 13:30 Lunch in Gordi or Khoni (1 h).

    - 15:00 Return via Zestafoni and the Rikoti pass.

    - 20:00 Back in Tbilisi.
  tips:
  - The final kilometres to Okatse and Kinchkha are gravel — high clearance is needed, doubly so after
    rain.
  - 'Prometheus Cave holds 14°C year round: bring a jacket and non-slip shoes.'
  - Cave visits run in guided groups with tickets sold on site; midday queues are the longest.
  - Gelati and Motsameta enforce a dress code — headscarf and covered shoulders.
  - Staying in Kutaisi is far cheaper than near the canyons, and everything is 40-60 minutes away.
  - Fill up in Kutaisi — there is no station on the road towards Gordi.
ru:
  name: 'Имеретия: пещеры и каньоны'
  short: 'Три дня на западе: Уплисцихе, Кутаиси, Гелати, Прометей, Сатаплия и Окаце с Кинчхой.'
  body: >-
    Имеретия — известняковый угол Грузии, а известняк означает пещеры, каньоны и водопады. Кутаиси, второй
    город страны, идеальная база: ни один объект маршрута не дальше часа езды от центра. Три дня — честный
    минимум, потому что такая концентрация природы и истории просто не помещается в один день.


    Первая остановка по дороге на запад — **Уплисцихе**, вырубленный в скале город у Гори с языческими
    жертвенными залами и эллинистическими помещениями над Курой. В самом Кутаиси вас ждут собор Баграти
    на холме и один из самых живых рынков страны, а сразу за городом — **Гелати**, академия Давида Строителя
    из списка ЮНЕСКО со знаменитой мозаикой в апсиде, и крошечная Моцамета на скале над излучиной реки.
    Второй день уходит под землю: сталактитовые залы и подземная река пещеры Прометея, затем Сатаплия
    со следами динозавров и стеклянной смотровой площадкой. Третий день — каньон Окаце с 700-метровой
    навесной тропой на отвесной стене и водопад Кинчха.


    Одно предупреждение: подъезд к Окаце и Кинчхе после Горди становится грунтовым и плохо переносит дождь,
    так что высокий клиренс здесь действительно нужен. Сезон — с мая по октябрь: каньоны зимой часто закрывают,
    а пещеры работают круглый год.
  plan: >-
    **День 1 · Тбилиси → Уплисцихе → Кутаиси (245 км, 4 ч)**

    - 08:30 Выезд из Тбилиси по E60.

    - 10:00 Уплисцихе — пещерный город и музей (2 ч).

    - 12:30 Обед в Гори (1 ч).

    - 16:00 Приезд в Кутаиси: собор Баграти и набережная Риони (1 ч 30 мин).

    - 19:00 Ужин в центре; ночёвка в Кутаиси.


    **День 2 · Гелати, Прометей и Сатаплия (90 км, 2 ч)**

    - 09:00 Монастырь Моцамета на скальном мысу (45 мин).

    - 10:15 **Монастырь Гелати** — мозаика, академия, могила Давида Строителя (1 ч 30 мин).

    - 13:00 Обед в Цхалтубо или Кутаиси (1 ч).

    - 14:30 Пещера Прометея: экскурсия и подземная лодочная прогулка (2 ч).

    - 17:00 Заповедник Сатаплия: следы динозавров и стеклянная площадка (1 ч 30 мин).

    - Ночёвка в Кутаиси.


    **День 3 · Окаце, Кинчха → Тбилиси (305 км, 4 ч 30 мин)**

    - 08:30 Выезд в сторону Горди, последние 6 км — грунт.

    - 09:45 **Каньон Окаце** — навесная тропа и смотровая (2 ч).

    - 12:15 Водопад Кинчха (1 ч).

    - 13:30 Обед в Горди или Хони (1 ч).

    - 15:00 Обратный путь через Зестафони и Рикотский перевал.

    - 20:00 Возвращение в Тбилиси.
  tips:
  - Последние километры к Окаце и Кинчхе — грунтовка; нужен высокий клиренс, а после дождя тем более.
  - 'В пещере Прометея круглый год 14°C: возьмите куртку и обувь с нескользкой подошвой.'
  - В пещеры пускают группами, билеты продают на месте; самые длинные очереди — в середине дня.
  - 'В Гелати и Моцамете действует дресс-код: платок и закрытые плечи.'
  - Жильё в Кутаиси заметно дешевле, чем у каньонов, а ехать оттуда всюду 40-60 минут.
  - Заправляйтесь в Кутаиси — на дороге к Горди заправок нет.
fa:
  name: 'ایمرتی: غارها و دره‌ها'
  short: 'سه روز در غرب گرجستان: اوپلیستسیخه، کوتایسی، گلاتی، پرومتئوس، ساتاپلیا و اوکاتسه.'
  body: >-
    ایمرتی گوشهٔ آهکی گرجستان است، و آهک یعنی غار، دره و آبشار. کوتایسی، دومین شهر بزرگ کشور، پایگاه کاملی
    برای همهٔ این‌هاست: هیچ‌کدام از نقاط این مسیر بیش از یک ساعت از مرکز شهر فاصله ندارد. سه روز حداقل
    صادقانه است، چون این تراکم از دیدنی‌های طبیعی و تاریخی به‌سادگی در یک روز جا نمی‌شود.

    نخستین توقف در راه غرب **اوپلیستسیخه** است، شهر کنده‌شده در سنگ نزدیک گوری، جایی که تالارهای قربانی
    بت‌پرستی و اتاق‌های هلنیستی بالای متکواری باقی مانده‌اند. در کوتایسی کلیسای جامع باگراتی روی تپه و
    یکی از پرجنب‌وجوش‌ترین بازارهای کشور را می‌بینید، و درست بیرون شهر **گلاتی** ایستاده است، آکادمی ثبت‌شده
    در یونسکو که داوود سازنده بنیاد نهاد، با موزاییک بزرگ محرابش، و موتسامتای کوچک بر پیچ رودخانه. روز
    دوم زیر زمین می‌گذرد: تالارهای چکیده‌سنگ و رود زیرزمینی غار پرومتئوس، سپس ساتاپلیا با رد پای سنگ‌شدهٔ
    دایناسورها و سکوی دید شیشه‌ای. روز سوم گذرگاه درهٔ اوکاتسه است، 700 متر مسیر فولادی که به صخره پیچ
    شده، و آبشار کینچخا.

    یک هشدار: راه دسترسی به اوکاتسه و کینچخا بعد از گوردی شنی می‌شود و باران را نمی‌بخشد، پس ارتفاع کف
    مناسب اینجا واقعاً اهمیت دارد. فصل از ماه مه تا اکتبر است — دره‌ها اغلب در زمستان بسته می‌شوند، در
    حالی که غارها تمام سال باز می‌مانند.
  plan: >-
    **روز 1 · تفلیس → اوپلیستسیخه → کوتایسی (245 کیلومتر، 4 ساعت)**

    - 08:30 حرکت از تفلیس روی E60.

    - 10:00 اوپلیستسیخه — شهر غاری و موزهٔ آن (2 ساعت).

    - 12:30 ناهار در گوری (1 ساعت).

    - 16:00 رسیدن به کوتایسی: کلیسای جامع باگراتی و کرانهٔ ریونی (1 ساعت و 30 دقیقه).

    - 19:00 شام در مرکز شهر؛ شب در کوتایسی.


    **روز 2 · گلاتی، پرومتئوس و ساتاپلیا (90 کیلومتر، 2 ساعت)**

    - 09:00 صومعهٔ موتسامتا بر زبانهٔ صخره‌ای (45 دقیقه).

    - 10:15 **صومعهٔ گلاتی** — موزاییک، آکادمی، آرامگاه داوود پادشاه (1 ساعت و 30 دقیقه).

    - 13:00 ناهار در تسکالتوبو یا کوتایسی (1 ساعت).

    - 14:30 غار پرومتئوس، گشت با راهنما و قایق‌سواری زیرزمینی (2 ساعت).

    - 17:00 ذخیرهٔ ساتاپلیا: رد پای دایناسور و سکوی شیشه‌ای (1 ساعت و 30 دقیقه).

    - شب در کوتایسی.


    **روز 3 · اوکاتسه، کینچخا → تفلیس (305 کیلومتر، 4 ساعت و 30 دقیقه)**

    - 08:30 حرکت به سوی گوردی؛ 6 کیلومتر آخر شنی است.

    - 09:45 **درهٔ اوکاتسه** — گذرگاه معلق و نقطهٔ دید (2 ساعت).

    - 12:15 آبشار کینچخا (1 ساعت).

    - 13:30 ناهار در گوردی یا خونی (1 ساعت).

    - 15:00 بازگشت از راه زستافونی و گردنهٔ ریکوتی.

    - 20:00 بازگشت به تفلیس.
  tips:
  - کیلومترهای پایانی تا اوکاتسه و کینچخا شنی است — ارتفاع کف بالا لازم است، و پس از باران دوچندان.
  - 'دمای غار پرومتئوس تمام سال 14°C است: کاپشن و کفش نالغزنده بردارید.'
  - >-
    بازدید از غارها در گروه‌های همراه راهنما انجام می‌شود و بلیت در محل فروخته می‌شود؛ طولانی‌ترین صف‌ها
    حوالی ظهر است.
  - گلاتی و موتسامتا پوشش مشخصی می‌خواهند — روسری و شانه‌های پوشیده.
  - اقامت در کوتایسی بسیار ارزان‌تر از نزدیکی دره‌هاست و همه چیز 40-60 دقیقه فاصله دارد.
  - در کوتایسی سوخت‌گیری کنید — در جادهٔ گوردی هیچ پمپ‌بنزینی نیست.
he:
  name: 'אימרתי: מערות וקניונים'
  short: 'שלושה ימים במערב גאורגיה: אופליסציחה, קוטאיסי, גלאטי, פרומתאוס, סאטאפליה ואוקאצה.'
  body: >-
    אימרתי היא פינת אבן הגיר של גאורגיה, ואבן גיר פירושה מערות, קניונים ומפלים. קוטאיסי, העיר השנייה בגודלה
    במדינה, היא הבסיס המושלם לכל אלה: שום אתר במסלול הזה אינו רחוק יותר משעת נסיעה מהמרכז. שלושה ימים
    הם המינימום הכן, כי צפיפות כזאת של אתרי טבע והיסטוריה פשוט אינה נדחסת ליום אחד.

    העצירה הראשונה בדרך מערבה היא **אופליסציחה**, העיר החצובה בסלע ליד גורי, שבה שרדו אולמות קורבן פגאניים
    ותאים הלניסטיים מעל המטקווארי. בקוטאיסי מחכות קתדרלת בגראטי על גבעתה ואחד השווקים התוססים במדינה,
    וממש מחוץ לעיר עומדים **גלאטי**, האקדמיה הרשומה באונסקו שייסד דוד הבנאי, עם פסיפס האפסיס הגדול שלה,
    ומוצמטה הזעיר על פיתול הנהר. היום השני יורד מתחת לאדמה: אולמות הנטיפים והנהר התת-קרקעי של מערת פרומתאוס,
    ואחר כך סאטאפליה עם עקבות הדינוזאורים המאובנות ומרפסת הזכוכית. היום השלישי הוא שביל קניון אוקאצה,
    700 מטר של מסלול פלדה מקובע אל הצוק, ומפל קינצחה.

    אזהרה אחת: הגישה לאוקאצה ולקינצחה הופכת לחצץ אחרי גורדי ואינה סלחנית לגשם, ולכן גובה גחון סביר באמת
    חשוב כאן. העונה נמשכת ממאי עד אוקטובר — הקניונים נסגרים לא פעם בחורף, ואילו המערות פתוחות כל השנה.
  plan: >-
    **יום 1 · טביליסי → אופליסציחה → קוטאיסי (245 ק״מ, 4 שעות)**

    - 08:30 יציאה מטביליסי בכביש E60.

    - 10:00 אופליסציחה — עיר המערות והמוזיאון שלה (2 שעות).

    - 12:30 ארוחת צהריים בגורי (1 שעה).

    - 16:00 הגעה לקוטאיסי: קתדרלת בגראטי וטיילת הריוני (1 שעה 30 דקות).

    - 19:00 ארוחת ערב במרכז; לינה בקוטאיסי.


    **יום 2 · גלאטי, פרומתאוס וסאטאפליה (90 ק״מ, 2 שעות)**

    - 09:00 מנזר מוצמטה על צוק הסלע (45 דקות).

    - 10:15 **מנזר גלאטי** — פסיפס, אקדמיה וקברו של המלך דוד (1 שעה 30 דקות).

    - 13:00 ארוחת צהריים בצקאלטובו או בקוטאיסי (1 שעה).

    - 14:30 מערת פרומתאוס, סיור מודרך ושיט תת-קרקעי (2 שעות).

    - 17:00 שמורת סאטאפליה: עקבות דינוזאורים ומרפסת הזכוכית (1 שעה 30 דקות).

    - לינה בקוטאיסי.


    **יום 3 · אוקאצה, קינצחה → טביליסי (305 ק״מ, 4 שעות 30 דקות)**

    - 08:30 נסיעה לגורדי; הדרך הופכת לחצץ ב-6 הקילומטרים האחרונים.

    - 09:45 **קניון אוקאצה** — השביל התלוי ונקודת התצפית (2 שעות).

    - 12:15 מפל קינצחה (1 שעה).

    - 13:30 ארוחת צהריים בגורדי או בחוני (1 שעה).

    - 15:00 חזרה דרך זסטפוני ומעבר ריקוטי.

    - 20:00 חזרה לטביליסי.
  tips:
  - הקילומטרים האחרונים לאוקאצה ולקינצחה הם חצץ — נדרש גובה גחון, ופי כמה אחרי גשם.
  - 'במערת פרומתאוס שוררים 14°C כל השנה: קחו מעיל ונעליים שאינן מחליקות.'
  - הביקור במערות מתבצע בקבוצות מודרכות עם כרטיסים הנמכרים במקום; התורים הארוכים ביותר הם בשעות הצהריים.
  - בגלאטי ובמוצמטה נאכף קוד לבוש — מטפחת וכתפיים מכוסות.
  - לינה בקוטאיסי זולה בהרבה מלינה ליד הקניונים, והכול נמצא במרחק 40-60 דקות.
  - תדלקו בקוטאיסי — בדרך לגורדי אין אף תחנה.
ar:
  name: 'إيميريتي: الكهوف والأودية'
  short: 'ثلاثة أيام في غرب جورجيا: أوبليستسيخي وكوتايسي وغيلاتي وبروميثيوس وساتابليا وأوكاتسي.'
  body: >-
    إيميريتي هي ركن الحجر الجيري في جورجيا، والحجر الجيري يعني كهوفاً وأودية وشلالات. وكوتايسي، ثاني مدن
    البلاد، قاعدة مثالية لكل ذلك: فلا موقع في هذا المسار يبعد أكثر من ساعة قيادة عن المركز. وثلاثة أيام
    هي الحد الأدنى الصادق، لأن هذا التكاثف من المعالم الطبيعية والتاريخية لا ينضغط ببساطة في يوم واحد.

    أول محطة في الطريق غرباً هي **أوبليستسيخي**، المدينة المنحوتة في الصخر قرب غوري، حيث بقيت قاعات القرابين
    الوثنية والحجرات الهلنستية فوق نهر متكفاري. وفي كوتايسي تنتظرك كاتدرائية باغراتي على تلها وأحد أنشط
    أسواق البلاد، وخارج المدينة مباشرة يقوم **غيلاتي**، الأكاديمية المدرجة على قائمة اليونسكو التي أسسها
    داود الباني بفسيفساء حنيتها الكبرى، ودير موتساميتا الصغير فوق منعطف النهر. اليوم الثاني ينزل تحت الأرض:
    قاعات الهوابط والنهر الجوفي في كهف بروميثيوس، ثم ساتابليا بآثار أقدام الديناصورات المتحجرة ومنصتها
    الزجاجية. واليوم الثالث هو ممشى وادي أوكاتسي، 700 متر من الممر الفولاذي المثبت في الجرف، وشلال كينتشخا.

    تحذير واحد: يتحول الطريق إلى أوكاتسي وكينتشخا إلى حصى بعد غوردي ولا يتسامح مع المطر، ولذلك فالخلوص
    الأرضي المناسب مهم هنا فعلاً. الموسم من مايو إلى أكتوبر — إذ تُغلق الأودية غالباً في الشتاء، بينما
    تبقى الكهوف مفتوحة طوال العام.
  plan: >-
    **اليوم 1 · تبليسي → أوبليستسيخي → كوتايسي (245 كم، 4 ساعات)**

    - 08:30 المغادرة من تبليسي على الطريق E60.

    - 10:00 أوبليستسيخي — مدينة الكهوف ومتحفها (2 ساعة).

    - 12:30 الغداء في غوري (1 ساعة).

    - 16:00 الوصول إلى كوتايسي: كاتدرائية باغراتي وكورنيش ريوني (1 ساعة و30 دقيقة).

    - 19:00 العشاء في المركز؛ المبيت في كوتايسي.


    **اليوم 2 · غيلاتي وبروميثيوس وساتابليا (90 كم، 2 ساعة)**

    - 09:00 دير موتساميتا على نتوئه الصخري (45 دقيقة).

    - 10:15 **دير غيلاتي** — الفسيفساء والأكاديمية وقبر الملك داود (1 ساعة و30 دقيقة).

    - 13:00 الغداء في تسكالتوبو أو كوتايسي (1 ساعة).

    - 14:30 كهف بروميثيوس، جولة بمرشد ورحلة القارب الجوفية (2 ساعة).

    - 17:00 محمية ساتابليا: آثار أقدام الديناصورات والمنصة الزجاجية (1 ساعة و30 دقيقة).

    - المبيت في كوتايسي.


    **اليوم 3 · أوكاتسي وكينتشخا → تبليسي (305 كم، 4 ساعات و30 دقيقة)**

    - 08:30 القيادة إلى غوردي؛ آخر 6 كم منه حصوية.

    - 09:45 **وادي أوكاتسي** — الممشى المعلق ونقطة الإطلالة (2 ساعة).

    - 12:15 شلال كينتشخا (1 ساعة).

    - 13:30 الغداء في غوردي أو خوني (1 ساعة).

    - 15:00 العودة عبر زيستافوني وممر ريكوتي.

    - 20:00 العودة إلى تبليسي.
  tips:
  - الكيلومترات الأخيرة إلى أوكاتسي وكينتشخا حصوية — يلزم خلوص أرضي عالٍ، وأكثر من ذلك بعد المطر.
  - 'تبقى حرارة كهف بروميثيوس 14°C طوال العام: خذ سترة وحذاءً غير قابل للانزلاق.'
  - تجري زيارات الكهوف في مجموعات بمرشد وتُباع التذاكر في الموقع؛ وأطول الطوابير في منتصف النهار.
  - في غيلاتي وموتساميتا قواعد لباس — غطاء رأس وأكتاف مغطاة.
  - الإقامة في كوتايسي أرخص بكثير من الإقامة قرب الأودية، وكل شيء على بعد 40-60 دقيقة.
  - املأ الخزان في كوتايسي — فلا توجد محطة على الطريق نحو غوردي.
