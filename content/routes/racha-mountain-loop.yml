ka:
  name: რაჭა ორ დღეში — ტაძრები, ტბა და მთის სოფლები
  short: ქუთაისიდან დაწყებული რეალისტური 2-დღიანი წრე შაორის, ნიკორწმინდის, ამბროლაურის, ონისა და უწერის გავლით.
  body: მარშრუტი ქუთაისიდან იწყება, პირველ ღამეს ამბროლაურში ან ონში ითვალისწინებს და მეორე დღეს რიონის ხეობით სრულდება. შოვი განზრახ არ შედის სტანდარტულ გეგმაში — იქ მიმდინარე დაშვებისა და გზის მდგომარეობა გამგზავრებამდე ცალკე უნდა შემოწმდეს.
  plan: "**დღე 1:** ქუთაისი → გოგოლათი → ნაქერალას უღელტეხილი → შაორის წყალსაცავი → ნიკორწმინდა → ამბროლაური → სიყვარულის ჩანჩქერი. ღამე ამბროლაურში ან ონში.\n\n**დღე 2:** ბარაკონი → ონის სინაგოგა და ონი → უწერა → დაბრუნება ქუთაისში რიონის ხეობით."
  tips: [დილით ადრე დაიწყეთ — ნაქერალაზე ნისლი და სველი ასფალტი ხშირია., საწვავი და ნაღდი ფული ამბროლაურში შეავსეთ., შოვში წასვლამდე ადგილობრივი გზისა და უსაფრთხოების ოფიციალური მდგომარეობა ცალკე გადაამოწმეთ.]
en:
  name: Racha in Two Days — Churches, Lake and Mountain Villages
  short: A realistic two-day loop from Kutaisi through Shaori, Nikortsminda, Ambrolauri, Oni and Utsera.
  body: Start in Kutaisi, stay in Ambrolauri or Oni, and return through the Rioni valley. Shovi is deliberately excluded from this standard plan because access and safety conditions must be checked separately before travel.
  plan: "**Day 1:** Kutaisi → Gogolati → Nakerala Pass → Shaori Reservoir → Nikortsminda → Ambrolauri → Waterfall of Love. Overnight in Ambrolauri or Oni.\n\n**Day 2:** Barakoni → Oni Synagogue and Oni → Utsera → return to Kutaisi through the Rioni valley."
  tips: [Start early because fog and wet pavement are common on Nakerala., Refuel and carry cash in Ambrolauri., Check current official access information separately before considering Shovi.]
ru:
  name: Рача за два дня — храмы, озеро и горные сёла
  short: Реалистичный двухдневный круг из Кутаиси через Шаори, Никорцминду, Амбролаури, Они и Уцеру.
  body: Маршрут начинается в Кутаиси, включает ночёвку в Амбролаури или Они и возвращение по долине Риони. Шови намеренно не включён — доступ и безопасность нужно проверять отдельно перед поездкой.
  plan: "**День 1:** Кутаиси → Гоголати → перевал Накерала → Шаори → Никорцминда → Амбролаури → Водопад любви.\n\n**День 2:** Баракони → синагога Они и город Они → Уцера → возвращение в Кутаиси."
  tips: [Начните рано — на Накерала бывает туман., Заправьтесь и возьмите наличные в Амбролаури., Перед поездкой в Шови отдельно проверяйте официальную информацию.]
fa:
  name: راچا در دو روز — کلیساها، دریاچه و روستاهای کوهستانی
  short: مسیر دو روزه واقعی از کوتایسی از شائوری، نیکورتسمیندا، آمبرولائوری، اونی و اوتسرا.
  body: سفر از کوتایسی شروع می‌شود و یک شب در آمبرولائوری یا اونی دارد. شووی عمداً در برنامه استاندارد نیست و وضعیت دسترسی باید جداگانه بررسی شود.
  plan: "**روز ۱:** کوتایسی ← گوگولاتی ← گردنه ناکرالا ← شائوری ← نیکورتسمیندا ← آمبرولائوری ← آبشار عشق.\n\n**روز ۲:** باراکونی ← کنیسه و شهر اونی ← اوتسرا ← بازگشت به کوتایسی."
  tips: [صبح زود حرکت کنید., در آمبرولائوری سوخت و پول نقد تهیه کنید., وضعیت شووی را جداگانه بررسی کنید.]
he:
  name: ראצ'ה ביומיים — כנסיות, אגם וכפרי הרים
  short: מסלול מציאותי בן יומיים מכותאיסי דרך שאורי, ניקורצמינדה, אמברולאורי, אוני ואוצירה.
  body: התחלה בכותאיסי, לינה באמברולאורי או אוני וחזרה דרך עמק ריוני. שווי אינה כלולה עקב הצורך לבדוק בנפרד גישה ובטיחות.
  plan: "**יום 1:** כותאיסי ← גוגולאטי ← מעבר נקרלה ← שאורי ← ניקורצמינדה ← אמברולאורי ← מפל האהבה.\n\n**יום 2:** ברקוני ← בית הכנסת ואוני ← אוצירה ← חזרה לכותאיסי."
  tips: [צאו מוקדם בגלל ערפל במעבר., תדלקו וקחו מזומן באמברולאורי., בדקו בנפרד מידע רשמי על שווי.]
ar:
  name: راتشا في يومين — كنائس وبحيرة وقرى جبلية
  short: مسار واقعي ليومين من كوتايسي عبر شاوري ونيكورتسميندا وأمبرولاوري وأوني وأوتسيرا.
  body: يبدأ من كوتايسي مع ليلة في أمبرولاوري أو أوني والعودة عبر وادي ريوني. لم تُدرج شوفي لأن الوصول والسلامة يجب التحقق منهما بشكل منفصل.
  plan: "**اليوم 1:** كوتايسي ← غوغولاتي ← ممر ناكيرالا ← شاوري ← نيكورتسميندا ← أمبرولاوري ← شلال الحب.\n\n**اليوم 2:** باراكوني ← كنيس ومدينة أوني ← أوتسيرا ← العودة إلى كوتايسي."
  tips: [ابدأ مبكراً بسبب الضباب., تزود بالوقود والنقد في أمبرولاوري., تحقق منفصلاً من المعلومات الرسمية عن شوفي.]
