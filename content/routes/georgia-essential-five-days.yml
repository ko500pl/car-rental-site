en: {name: Georgia Essentials in Six Days, short: Tbilisi Mtskheta Kazbegi Kakheti Uplistsikhe and Kutaisi in six balanced days., body: A compact first-visit classic combining old towns Caucasus views wine country and the principal heritage of Imereti., plan: 'Day 1: Tbilisi. Day 2: Mtskheta and Ananuri. Day 3: Kazbegi. Day 4: Bodbe and Sighnaghi. Day 5: Uplistsikhe and transfer to Kutaisi. Day 6: Gelati Bagrati and Prometheus Cave.', tips: [Use overnights in Tbilisi Kazbegi and Kutaisi to reduce driving., Check cave tickets and opening hours in advance.]}
ru: {name: Главное в Грузии за шесть дней, short: Тбилиси Мцхета Казбеги Кахетия Уплисцихе и Кутаиси за шесть сбалансированных дней., body: Компактный классический маршрут для первой поездки с городами Кавказом винным краем и памятниками Имеретии., plan: 'День 1: Тбилиси. День 2: Мцхета и Ананури. День 3: Казбеги. День 4: Бодбе и Сигнахи. День 5: Уплисцихе и переезд в Кутаиси. День 6: Гелати Баграти и пещера Прометея.', tips: [Ночуйте в Тбилиси Казбеги и Кутаиси чтобы сократить дорогу., Заранее проверьте билеты и часы пещеры.]}
fa: {name: مهم‌ترین‌های گرجستان در شش روز, short: تفلیس متسختا کازبگی کاختی اوپلیستسیخه و کوتایسی در شش روز متعادل., body: برنامه کلاسیک فشرده برای سفر اول با شهرهای قدیمی مناظر قفقاز سرزمین شراب و آثار ایمرتی., plan: 'روز ۱: تفلیس. روز ۲: متسختا و آنانوری. روز ۳: کازبگی. روز ۴: بودبه و سیغناغی. روز ۵: اوپلیستسیخه و انتقال به کوتایسی. روز ۶: گلاتی باگراتی و غار پرومتئوس.', tips: [برای کاهش رانندگی در تفلیس کازبگی و کوتایسی اقامت کنید., بلیت و ساعت غار را پیشاپیش بررسی کنید.]}
he: {name: עיקרי גאורגיה בשישה ימים, short: טביליסי מצחתה קזבגי קאחתי אופליסציחה וכותאיסי בשישה ימים מאוזנים., body: מסלול קלאסי קומפקטי לביקור ראשון עם ערים עתיקות נופי הקווקז אזור היין ואתרי אימרתי., plan: 'יום 1: טביליסי. יום 2: מצחתה ואנאנורי. יום 3: קזבגי. יום 4: בודבה וסיגנאגי. יום 5: אופליסציחה והעברה לכותאיסי. יום 6: גלאתי בגרתי ומערת פרומתאוס.', tips: [לונו בטביליסי קזבגי וכותאיסי כדי לצמצם נסיעות., בדקו כרטיסים ושעות למערה מראש.]}
ar: {name: أساسيات جورجيا في ستة أيام, short: تبليسي ومتسخيتا وكازبيغي وكاخيتي وأوبليستسيخي وكوتايسي في ستة أيام متوازنة., body: مسار كلاسيكي مدمج للزيارة الأولى يجمع المدن القديمة والقوقاز وبلاد النبيذ وأهم معالم إيميريتي., plan: 'اليوم 1: تبليسي. اليوم 2: متسخيتا وأنانوري. اليوم 3: كازبيغي. اليوم 4: بودبي وسيغناغي. اليوم 5: أوبليستسيخي والانتقال إلى كوتايسي. اليوم 6: غيلاتي وباغراتي وكهف بروميثيوس.', tips: [بيتوا في تبليسي وكازبيغي وكوتايسي لتقليل القيادة., تحققوا من تذاكر الكهف وساعاته مسبقاً.]}
