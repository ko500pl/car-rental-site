  body: პირველი ვიზიტისთვის განკუთვნილი კომპაქტური კლასიკური ტური რომელიც აერთიანებს ძველ ქალაქებს კავკასიონის ხედებს ღვინის მხარეს და იმერეთის მთავარ ძეგლებს.
