ka:
  name: სვანეთის ექსპედიცია
  short: 'ხუთი დღე ზემო სვანეთში: ქუთაისი, ზუგდიდი, ენგურის კაშხალი, მესტია და უშგული.'
  body: >-
    ზემო სვანეთი საქართველოს ყველაზე შორეული და ყველაზე დასამახსოვრებელი კუთხეა. თბილისიდან მესტიამდე
    470 კილომეტრი და რვანახევარი საათია — ეს ერთი დღის სავალია, ამიტომ მარშრუტი ხუთ დღეზეა გათვლილი: ორი
    დღე გზაზე, სამი კი ადგილზე. აჩქარებას აქ აზრი არ აქვს.


    გზა თანდათან იცვლის ხასიათს: ჯერ ქუთაისი და კოლხეთის დაბლობი, შემდეგ ზუგდიდი დადიანების სასახლით,
    მერე **ენგურის კაშხალი** — 271 მეტრი სიმაღლის თაღოვანი ნაგებობა და მის უკან ფირუზისფერი წყალსაცავი.
    კაშხლიდან იწყება ენგურის ხეობა, რომელიც სამოცდაათი კილომეტრის მანძილზე ვიწროვდება და მაღლდება, სანამ
    **მესტიის** ქვის კოშკებამდე მიგიყვანს. მესტიიდან შორის აღარაფერია: ჭალაადის მყინვარამდე საათნახევრის
    ფეხით სავალია, ხაცვალის საბაგირო უშბას პანორამას გიხსნის, უშგულამდე კი — 45 კილომეტრი ორ საათში, ევროპის
    ერთ-ერთი უმაღლესი მუდმივად დასახლებული სოფლისკენ.


    ეს მარშრუტი მოსამზადებელ სამუშაოს ითხოვს და ყველასთვის არ არის. მესტია-უშგულის გზა ნაწილობრივ გრუნტოვანია
    და მდინარის ფონებს კვეთს, რომელთა დონეც დნობის წყალზეა დამოკიდებული — მხოლოდ ოთხთვალა წამყვანი ავტომობილით.
    სეზონი ივნისიდან სექტემბრამდეა; ოქტომბრიდან უღელტეხილები თოვლს იჭერს და სოფლები კვირებით შეიძლება
    მოწყდეს. სამაგიეროდ, ჯილდო შესაბამისია: ქვის კოშკები, რომლებიც ათასი წელია დგას, შხარის ხუთკილომეტრიანი
    კედელი და სიჩუმე, რომელსაც სხვაგან ვერსად იპოვი. შესაფერისი მანქანის პირობები [ფასებში](/pricing/)
    ნახე.
  plan: >-
    **დღე 1 · თბილისი → ქუთაისი → ზუგდიდი (320 კმ, 4 სთ 50 წთ)**

    - 08:00 გასვლა თბილისიდან E60-ით.

    - 11:30 ქუთაისი: ბაგრატის ტაძარი და სადილი (2 სთ).

    - 15:30 ზუგდიდი, დადიანების სასახლე და ბოტანიკური ბაღი (1 სთ 30 წთ).

    - ღამისთევა ზუგდიდში.


    **დღე 2 · ზუგდიდი → ენგური → მესტია (150 კმ, 3 სთ 20 წთ)**

    - 09:00 გასვლა ჯვრის მიმართულებით.

    - 09:45 **ენგურის კაშხალი** და წყალსაცავის ხედის მოედანი (1 სთ).

    - 11:00 ენგურის ხეობა: ხაიშის გაჩერება და სადილი (1 სთ).

    - 15:00 ჩამოსვლა მესტიაში, სვანური კოშკები და მუზეუმი (2 სთ).

    - ღამისთევა მესტიაში.


    **დღე 3 · მესტია და ჭალაადი (30 კმ, 1 სთ)**

    - 09:00 გასვლა ჭალაადის ხიდამდე, შემდეგ 1 სთ 30 წთ ფეხით მყინვარამდე.

    - 13:00 სადილი მესტიაში (1 სთ).

    - 15:00 ხაცვალის საბაგირო და უშბის პანორამა (2 სთ 30 წთ).

    - ღამისთევა მესტიაში.


    **დღე 4 · მესტია → უშგული → მესტია (90 კმ, 4 სთ)**

    - 08:30 გასვლა უშგულისკენ, გრუნტოვანი მონაკვეთები და ფონები.

    - 10:30 **უშგული** — ჩაჟაშის კოშკები და ლამარიას ეკლესია (2 სთ).

    - 13:00 სადილი უშგულში, ხედი შხარაზე (1 სთ 30 წთ).

    - 16:00 დაბრუნება მესტიაში იფარისა და კალას გავლით.

    - ღამისთევა მესტიაში.


    **დღე 5 · მესტია → თბილისი (470 კმ, 8 სთ 30 წთ)**

    - 07:30 ადრეული გასვლა ენგურის ხეობით.

    - 11:00 ზუგდიდი, ყავა და საწვავი (45 წთ).

    - 13:30 სადილი ქუთაისში ან სამტრედიაში (1 სთ).

    - 18:00 გაჩერება რიკოთის უღელტეხილთან (30 წთ).

    - 20:30 თბილისში დაბრუნება.
  tips:
  - >-
    მესტია-უშგულის მონაკვეთი გრუნტოვანია და მდინარის ფონებს კვეთს — მხოლოდ 4x4, ერთი მიმართულებით დაახლოებით
    2 საათი.
  - სეზონი ივნისი-სექტემბერია; მაისში და ოქტომბერში უშგულის გზა თოვლმა შეიძლება დახუროს.
  - საწვავი ზუგდიდსა და მესტიაში აავსე — შუალედში სადგური თითქმის არ არის.
  - მობილური კავშირი ხეობაში წყვეტილია; ოფლაინ რუკა ჩამოტვირთე გასვლამდე.
  - მესტიაში ღამისთევა ივლის-აგვისტოში ადრევე იჯავშნება; უშგულში პირობები უფრო მარტივია.
  - მთის ამინდი მკვეთრად იცვლება — წვიმის ქურთუკი და თბილი ტანსაცმელი ზაფხულშიც აუცილებელია.
en:
  name: Svaneti Expedition
  short: 'Five days in Upper Svaneti: Kutaisi, Zugdidi, the Enguri dam, Mestia and Ushguli.'
  body: >-
    Upper Svaneti is the most remote and the most memorable corner of Georgia. Tbilisi to Mestia is 470
    kilometres and eight and a half hours — a full day behind the wheel — which is why this route is built
    around five days: two on the road, three in the mountains. Rushing it makes no sense.


    The drive changes character as you go. First Kutaisi and the Colchis lowland, then Zugdidi with the
    Dadiani palace, then the **Enguri Dam**, a 271-metre arch wall with a turquoise reservoir behind it.
    From the dam the Enguri gorge begins and climbs for seventy kilometres, narrowing until the stone
    towers of **Mestia** appear. From Mestia nothing is far: the Chalaadi glacier is a ninety-minute walk
    from the road bridge, the Hatsvali cable car opens a full panorama of Ushba, and Ushguli is 45 kilometres
    and roughly two hours away — one of the highest permanently inhabited villages in Europe, under the
    wall of Shkhara.


    This trip demands preparation. The Mestia-Ushguli road is partly gravel and crosses shallow fords
    that rise with the meltwater, so a genuine four-wheel-drive vehicle is not a suggestion. The season
    runs June to September; from October the passes start catching snow. Conditions for off-road vehicles
    are set out on our [pricing page](/pricing/).
  plan: >-
    **Day 1 · Tbilisi → Kutaisi → Zugdidi (320 km, 4 h 50 min)**

    - 08:00 Leave Tbilisi on the E60.

    - 11:30 Kutaisi: Bagrati Cathedral and lunch (2 h).

    - 15:30 Zugdidi, the Dadiani Palace and its botanical garden (1 h 30 min).

    - Overnight in Zugdidi.


    **Day 2 · Zugdidi → Enguri → Mestia (150 km, 3 h 20 min)**

    - 09:00 Set off towards Jvari.

    - 09:45 **Enguri Dam** and the reservoir viewpoint (1 h).

    - 11:00 Up the Enguri gorge; stop and lunch at Khaishi (1 h).

    - 15:00 Arrive Mestia: Svan towers and the museum (2 h).

    - Overnight in Mestia.


    **Day 3 · Mestia and Chalaadi (30 km, 1 h)**

    - 09:00 Drive to the Chalaadi bridge, then a 1 h 30 min walk to the glacier.

    - 13:00 Lunch in Mestia (1 h).

    - 15:00 Hatsvali cable car and the Ushba panorama (2 h 30 min).

    - Overnight in Mestia.


    **Day 4 · Mestia → Ushguli → Mestia (90 km, 4 h)**

    - 08:30 Leave for Ushguli — gravel sections and fords.

    - 10:30 **Ushguli** — the towers of Chazhashi and Lamaria church (2 h).

    - 13:00 Lunch in Ushguli with the Shkhara view (1 h 30 min).

    - 16:00 Drive back through Ipari and Kala.

    - Overnight in Mestia.


    **Day 5 · Mestia → Tbilisi (470 km, 8 h 30 min)**

    - 07:30 Early start down the Enguri gorge.

    - 11:00 Zugdidi: coffee and fuel (45 min).

    - 13:30 Lunch in Kutaisi or Samtredia (1 h).

    - 18:00 Break at the Rikoti pass (30 min).

    - 20:30 Back in Tbilisi.
  tips:
  - The Mestia-Ushguli section is gravel with river fords — 4x4 only, about two hours each way.
  - The season is June to September; in May and October snow can close the Ushguli road without warning.
  - Refuel in Zugdidi and in Mestia — there is almost nothing in between.
  - Mobile coverage drops out in the gorge; download offline maps before you leave.
  - Mestia beds sell out early in July and August; Ushguli guesthouses are simpler and colder.
  - Mountain weather turns fast — a rain shell and warm layers are needed even in midsummer.
ru:
  name: Экспедиция в Сванетию
  short: 'Пять дней в Верхней Сванетии: Кутаиси, Зугдиди, плотина Ингури, Местия и Ушгули.'
  body: >-
    Верхняя Сванетия — самый дальний и самый запоминающийся угол Грузии. От Тбилиси до Местии 470 километров
    и восемь с половиной часов — полный день за рулём, поэтому маршрут рассчитан на пять дней: два в дороге
    и три в горах. Спешить здесь бессмысленно.


    Дорога несколько раз меняет характер. Сначала Кутаиси и Колхидская низменность, затем Зугдиди с дворцом
    Дадиани, потом **плотина Ингури** — арочная стена высотой 271 метр и бирюзовое водохранилище за ней.
    От плотины начинается Ингурское ущелье, которое семьдесят километров сужается и набирает высоту, пока
    не появятся каменные башни **Местии**. Из Местии всё близко: до ледника Чалаади полтора часа пешком
    от моста, канатка Хацвали открывает панораму Ушбы, а до Ушгули — 45 километров и около двух часов,
    к одному из самых высокогорных постоянно обитаемых сёл Европы под стеной Шхары.


    Эта поездка требует подготовки. Дорога Местия — Ушгули частично грунтовая и пересекает броды, которые
    поднимаются вместе с талой водой, так что полный привод здесь не пожелание, а условие. Сезон — с июня
    по сентябрь; с октября перевалы начинают ловить снег. Условия аренды внедорожников смотрите в разделе
    [цены](/pricing/).
  plan: >-
    **День 1 · Тбилиси → Кутаиси → Зугдиди (320 км, 4 ч 50 мин)**

    - 08:00 Выезд из Тбилиси по E60.

    - 11:30 Кутаиси: собор Баграти и обед (2 ч).

    - 15:30 Зугдиди, дворец Дадиани и ботанический сад (1 ч 30 мин).

    - Ночёвка в Зугдиди.


    **День 2 · Зугдиди → Ингури → Местия (150 км, 3 ч 20 мин)**

    - 09:00 Выезд в сторону Джвари.

    - 09:45 **Плотина Ингури** и смотровая над водохранилищем (1 ч).

    - 11:00 Ингурское ущелье, остановка и обед в Хаиши (1 ч).

    - 15:00 Приезд в Местию: сванские башни и музей (2 ч).

    - Ночёвка в Местии.


    **День 3 · Местия и Чалаади (30 км, 1 ч)**

    - 09:00 Доезд до моста Чалаади, затем 1 ч 30 мин пешком к леднику.

    - 13:00 Обед в Местии (1 ч).

    - 15:00 Канатная дорога Хацвали и панорама Ушбы (2 ч 30 мин).

    - Ночёвка в Местии.


    **День 4 · Местия → Ушгули → Местия (90 км, 4 ч)**

    - 08:30 Выезд в Ушгули: грунтовые участки и броды.

    - 10:30 **Ушгули** — башни Чажаши и церковь Ламария (2 ч).

    - 13:00 Обед в Ушгули с видом на Шхару (1 ч 30 мин).

    - 16:00 Обратная дорога через Ипари и Калу.

    - Ночёвка в Местии.


    **День 5 · Местия → Тбилиси (470 км, 8 ч 30 мин)**

    - 07:30 Ранний выезд вниз по Ингурскому ущелью.

    - 11:00 Зугдиди: кофе и заправка (45 мин).

    - 13:30 Обед в Кутаиси или Самтредиа (1 ч).

    - 18:00 Пауза на Рикотском перевале (30 мин).

    - 20:30 Возвращение в Тбилиси.
  tips:
  - 'Участок Местия — Ушгули грунтовый, с бродами: только полный привод, около двух часов в одну сторону.'
  - Сезон — июнь-сентябрь; в мае и октябре снег может закрыть дорогу на Ушгули без предупреждения.
  - Заправляйтесь в Зугдиди и в Местии — между ними заправок практически нет.
  - Мобильная связь в ущелье пропадает; скачайте офлайн-карты заранее.
  - Жильё в Местии в июле и августе разбирают заранее; в Ушгули условия проще и холоднее.
  - Погода в горах меняется быстро — дождевик и тёплые вещи нужны даже в разгар лета.
fa:
  name: سفر اکتشافی سوانتی
  short: 'پنج روز در سوانتی علیا: کوتایسی، زوگدیدی، سد انگوری، مستیا و اوشگولی.'
  body: >-
    سوانتی علیا دورافتاده‌ترین و به‌یادماندنی‌ترین گوشهٔ گرجستان است. از تفلیس تا مستیا 470 کیلومتر و
    هشت ساعت و نیم راه است — یک روز کامل پشت فرمان — و به همین دلیل این مسیر بر پایهٔ پنج روز چیده شده
    است: دو روز در جاده و سه روز در کوهستان. عجله کردن در آن معنایی ندارد.

    مسیر در راه چند بار تغییر ماهیت می‌دهد. نخست کوتایسی و دشت پست کلخیس، سپس زوگدیدی با کاخ دادیانی،
    و پس از آن **سد انگوری**، دیواره‌ای قوسی به بلندی 271 متر با آبگیری فیروزه‌ای پشت آن. از سد، تنگهٔ
    انگوری آغاز می‌شود و هفتاد کیلومتر بالا می‌رود و باریک‌تر می‌شود تا برج‌های سنگی **مستیا** پیدا شوند.
    از مستیا هیچ چیز دور نیست: یخچال چالاادی نود دقیقه پیاده از پل جاده است، تله‌کابین هاتسوالی نمای کامل
    اوشبا را باز می‌کند، و اوشگولی 45 کیلومتر و تقریباً دو ساعت فاصله دارد — یکی از بلندترین روستاهای
    دائماً مسکون اروپا، زیر دیوارهٔ شخارا.

    این سفر آمادگی می‌خواهد. جادهٔ مستیا-اوشگولی تا حدی شنی است و از گدارهای کم‌عمقی می‌گذرد که با آب‌شدن
    برف بالا می‌آیند، پس خودروی چهارچرخ‌محرک واقعی پیشنهاد نیست بلکه شرط است. فصل از ژوئن تا سپتامبر است؛
    از اکتبر گردنه‌ها برف می‌گیرند. شرایط خودروهای آفرود در [صفحهٔ قیمت‌ها](/pricing/) آمده است.
  plan: >-
    **روز 1 · تفلیس → کوتایسی → زوگدیدی (320 کیلومتر، 4 ساعت و 50 دقیقه)**

    - 08:00 حرکت از تفلیس روی E60.

    - 11:30 کوتایسی: کلیسای جامع باگراتی و ناهار (2 ساعت).

    - 15:30 زوگدیدی، کاخ دادیانی و باغ گیاه‌شناسی آن (1 ساعت و 30 دقیقه).

    - شب در زوگدیدی.


    **روز 2 · زوگدیدی → انگوری → مستیا (150 کیلومتر، 3 ساعت و 20 دقیقه)**

    - 09:00 حرکت به سوی جواری.

    - 09:45 **سد انگوری** و نقطهٔ دید آبگیر (1 ساعت).

    - 11:00 بالا رفتن از تنگهٔ انگوری؛ توقف و ناهار در خایشی (1 ساعت).

    - 15:00 رسیدن به مستیا: برج‌های سوان و موزه (2 ساعت).

    - شب در مستیا.


    **روز 3 · مستیا و چالاادی (30 کیلومتر، 1 ساعت)**

    - 09:00 رانندگی تا پل چالاادی، سپس 1 ساعت و 30 دقیقه پیاده‌روی تا یخچال.

    - 13:00 ناهار در مستیا (1 ساعت).

    - 15:00 تله‌کابین هاتسوالی و پانورامای اوشبا (2 ساعت و 30 دقیقه).

    - شب در مستیا.


    **روز 4 · مستیا → اوشگولی → مستیا (90 کیلومتر، 4 ساعت)**

    - 08:30 حرکت به سوی اوشگولی — مقاطع شنی و گدارها.

    - 10:30 **اوشگولی** — برج‌های چاژاشی و کلیسای لاماریا (2 ساعت).

    - 13:00 ناهار در اوشگولی با منظرهٔ شخارا (1 ساعت و 30 دقیقه).

    - 16:00 بازگشت از راه ایپاری و کالا.

    - شب در مستیا.


    **روز 5 · مستیا → تفلیس (470 کیلومتر، 8 ساعت و 30 دقیقه)**

    - 07:30 حرکت زودهنگام به پایین تنگهٔ انگوری.

    - 11:00 زوگدیدی: قهوه و سوخت (45 دقیقه).

    - 13:30 ناهار در کوتایسی یا سامتردیا (1 ساعت).

    - 18:00 استراحت در گردنهٔ ریکوتی (30 دقیقه).

    - 20:30 بازگشت به تفلیس.
  tips:
  - مقطع مستیا-اوشگولی شنی و همراه با گدار رودخانه است — فقط 4x4، حدود دو ساعت در هر جهت.
  - فصل از ژوئن تا سپتامبر است؛ در ماه مه و اکتبر برف می‌تواند جادهٔ اوشگولی را بی‌هشدار ببندد.
  - در زوگدیدی و مستیا سوخت‌گیری کنید — میان آن دو تقریباً هیچ چیز نیست.
  - پوشش تلفن همراه در تنگه قطع می‌شود؛ پیش از حرکت نقشه‌های آفلاین را دانلود کنید.
  - تخت‌های مستیا در ژوئیه و اوت زود تمام می‌شود؛ مهمان‌خانه‌های اوشگولی ساده‌تر و سردترند.
  - هوای کوهستان سریع تغییر می‌کند — بارانی و لایه‌های گرم حتی در اوج تابستان لازم است.
he:
  name: משלחת סוואנטי
  short: 'חמישה ימים בסוואנטי העילית: קוטאיסי, זוגדידי, סכר אנגורי, מסטיה ואושגולי.'
  body: >-
    סוואנטי העילית היא הפינה המרוחקת והבלתי נשכחת ביותר בגאורגיה. מטביליסי למסטיה 470 קילומטרים ושמונה
    שעות וחצי — יום שלם מאחורי ההגה — ולכן המסלול הזה בנוי סביב חמישה ימים: שניים בדרך ושלושה בהרים. אין
    שום היגיון למהר בו.

    הנסיעה מחליפה אופי לאורך הדרך. תחילה קוטאיסי ושפלת קולכיס, אחר כך זוגדידי עם ארמון דדיאני, ואז **סכר
    אנגורי**, קיר קשתי בגובה 271 מטר שמאחוריו מאגר טורקיז. מהסכר מתחיל ערוץ אנגורי ומטפס שבעים קילומטרים,
    מצטמצם עד שמופיעים מגדלי האבן של **מסטיה**. ממסטיה שום דבר אינו רחוק: קרחון צ'לאדי במרחק תשעים דקות
    הליכה מגשר הכביש, רכבל הצוואלי פותח פנורמה מלאה של אושבה, ואושגולי במרחק 45 קילומטרים וכשעתיים נסיעה
    — אחד הכפרים המאוכלסים דרך קבע הגבוהים באירופה, מתחת לקיר שחרה.

    הטיול הזה דורש הכנה. הכביש ממסטיה לאושגולי הוא חלקית חצץ וחוצה מעברות רדודות שעולות עם מי ההפשרה,
    ולכן רכב הנעה כפולה אמיתי אינו בגדר המלצה בלבד. העונה נמשכת מיוני עד ספטמבר; מאוקטובר המעברים מתחילים
    לתפוס שלג. התנאים לרכבי שטח מפורטים ב[עמוד המחירים](/pricing/) שלנו.
  plan: >-
    **יום 1 · טביליסי → קוטאיסי → זוגדידי (320 ק״מ, 4 שעות 50 דקות)**

    - 08:00 יציאה מטביליסי בכביש E60.

    - 11:30 קוטאיסי: קתדרלת בגראטי וארוחת צהריים (2 שעות).

    - 15:30 זוגדידי, ארמון דדיאני והגן הבוטני שלו (1 שעה 30 דקות).

    - לינה בזוגדידי.


    **יום 2 · זוגדידי → אנגורי → מסטיה (150 ק״מ, 3 שעות 20 דקות)**

    - 09:00 יציאה לכיוון ג'וארי.

    - 09:45 **סכר אנגורי** ותצפית המאגר (1 שעה).

    - 11:00 עלייה בערוץ אנגורי; עצירה וארוחת צהריים בחאישי (1 שעה).

    - 15:00 הגעה למסטיה: מגדלי הסוואן והמוזיאון (2 שעות).

    - לינה במסטיה.


    **יום 3 · מסטיה וצ'לאדי (30 ק״מ, 1 שעה)**

    - 09:00 נסיעה לגשר צ'לאדי, ואחריה הליכה של 1 שעה 30 דקות אל הקרחון.

    - 13:00 ארוחת צהריים במסטיה (1 שעה).

    - 15:00 רכבל הצוואלי ופנורמת אושבה (2 שעות 30 דקות).

    - לינה במסטיה.


    **יום 4 · מסטיה → אושגולי → מסטיה (90 ק״מ, 4 שעות)**

    - 08:30 יציאה לאושגולי — קטעי חצץ ומעברות.

    - 10:30 **אושגולי** — מגדלי צ'אז'אשי וכנסיית למריה (2 שעות).

    - 13:00 ארוחת צהריים באושגולי עם נוף שחרה (1 שעה 30 דקות).

    - 16:00 חזרה דרך איפארי וקלה.

    - לינה במסטיה.


    **יום 5 · מסטיה → טביליסי (470 ק״מ, 8 שעות 30 דקות)**

    - 07:30 יציאה מוקדמת במורד ערוץ אנגורי.

    - 11:00 זוגדידי: קפה ותדלוק (45 דקות).

    - 13:30 ארוחת צהריים בקוטאיסי או בסמטרדיה (1 שעה).

    - 18:00 הפסקה במעבר ריקוטי (30 דקות).

    - 20:30 חזרה לטביליסי.
  tips:
  - הקטע מסטיה-אושגולי הוא חצץ עם מעברות נחל — 4x4 בלבד, כשעתיים לכל כיוון.
  - העונה היא מיוני עד ספטמבר; במאי ובאוקטובר שלג עלול לסגור את הדרך לאושגולי בלי התראה.
  - תדלקו בזוגדידי ובמסטיה — ביניהן כמעט אין כלום.
  - הקליטה הסלולרית נעלמת בערוץ; הורידו מפות לא מקוונות לפני היציאה.
  - המיטות במסטיה נחטפות מוקדם ביולי ובאוגוסט; אכסניות אושגולי פשוטות וקרות יותר.
  - מזג האוויר בהרים מתהפך מהר — מעיל גשם ושכבות חמות נחוצים גם באמצע הקיץ.
ar:
  name: بعثة سفانيتي
  short: 'خمسة أيام في سفانيتي العليا: كوتايسي وزوغديدي وسد إنغوري وميستيا وأوشغولي.'
  body: >-
    سفانيتي العليا هي أبعد أركان جورجيا وأكثرها رسوخاً في الذاكرة. من تبليسي إلى ميستيا 470 كيلومتراً
    وثماني ساعات ونصف — يوم كامل خلف المقود — ولذلك بُني هذا المسار على خمسة أيام: يومان على الطريق وثلاثة
    في الجبال. ولا معنى للاستعجال فيه.

    تتبدل الرحلة في طابعها كلما تقدمت. أولاً كوتايسي وسهل كولخيس المنخفض، ثم زوغديدي بقصر دادياني، ثم
    **سد إنغوري**، وهو جدار قوسي بارتفاع 271 متراً يقف خلفه خزان فيروزي. ومن السد يبدأ مضيق إنغوري ويصعد
    سبعين كيلومتراً، يضيق شيئاً فشيئاً حتى تظهر أبراج **ميستيا** الحجرية. ومن ميستيا لا شيء بعيد: نهر
    تشالادي الجليدي على بعد تسعين دقيقة سيراً من جسر الطريق، وتلفريك هاتسفالي يفتح بانوراما كاملة لجبل
    أوشبا، وأوشغولي على بعد 45 كيلومتراً وساعتين تقريباً — إحدى أعلى القرى المأهولة دائماً في أوروبا،
    تحت جدار شخارا.

    تتطلب هذه الرحلة استعداداً. طريق ميستيا-أوشغولي حصوي جزئياً ويعبر مخاضات ضحلة يرتفع منسوبها مع ذوبان
    الثلوج، ولذلك فسيارة الدفع الرباعي الحقيقية ليست مجرد اقتراح. الموسم من يونيو إلى سبتمبر؛ ومن أكتوبر
    تبدأ الممرات في احتجاز الثلج. وشروط مركبات الطرق الوعرة موضحة في [صفحة الأسعار](/pricing/) لدينا.
  plan: >-
    **اليوم 1 · تبليسي → كوتايسي → زوغديدي (320 كم، 4 ساعات و50 دقيقة)**

    - 08:00 المغادرة من تبليسي على الطريق E60.

    - 11:30 كوتايسي: كاتدرائية باغراتي والغداء (2 ساعة).

    - 15:30 زوغديدي وقصر دادياني وحديقته النباتية (1 ساعة و30 دقيقة).

    - المبيت في زوغديدي.


    **اليوم 2 · زوغديدي → إنغوري → ميستيا (150 كم، 3 ساعات و20 دقيقة)**

    - 09:00 الانطلاق نحو جفاري.

    - 09:45 **سد إنغوري** ومطل الخزان (1 ساعة).

    - 11:00 الصعود في مضيق إنغوري؛ وقفة وغداء في خايشي (1 ساعة).

    - 15:00 الوصول إلى ميستيا: أبراج سفان والمتحف (2 ساعة).

    - المبيت في ميستيا.


    **اليوم 3 · ميستيا وتشالادي (30 كم، 1 ساعة)**

    - 09:00 القيادة إلى جسر تشالادي، ثم مشي 1 ساعة و30 دقيقة إلى النهر الجليدي.

    - 13:00 الغداء في ميستيا (1 ساعة).

    - 15:00 تلفريك هاتسفالي وبانوراما أوشبا (2 ساعة و30 دقيقة).

    - المبيت في ميستيا.


    **اليوم 4 · ميستيا → أوشغولي → ميستيا (90 كم، 4 ساعات)**

    - 08:30 الانطلاق إلى أوشغولي — مقاطع حصوية ومخاضات.

    - 10:30 **أوشغولي** — أبراج تشاجاشي وكنيسة لاماريا (2 ساعة).

    - 13:00 الغداء في أوشغولي مع إطلالة شخارا (1 ساعة و30 دقيقة).

    - 16:00 العودة عبر إيباري وكالا.

    - المبيت في ميستيا.


    **اليوم 5 · ميستيا → تبليسي (470 كم، 8 ساعات و30 دقيقة)**

    - 07:30 انطلاقة مبكرة نزولاً في مضيق إنغوري.

    - 11:00 زوغديدي: قهوة ووقود (45 دقيقة).

    - 13:30 الغداء في كوتايسي أو سامتريديا (1 ساعة).

    - 18:00 استراحة عند ممر ريكوتي (30 دقيقة).

    - 20:30 العودة إلى تبليسي.
  tips:
  - مقطع ميستيا-أوشغولي حصوي وفيه مخاضات نهرية — دفع رباعي فقط، ونحو ساعتين في كل اتجاه.
  - الموسم من يونيو إلى سبتمبر؛ وفي مايو وأكتوبر قد يغلق الثلج طريق أوشغولي من دون إنذار.
  - تزود بالوقود في زوغديدي وفي ميستيا — فبينهما لا يكاد يوجد شيء.
  - تنقطع تغطية الهاتف في المضيق؛ حمّل خرائط تعمل بلا إنترنت قبل الانطلاق.
  - تنفد أسرّة ميستيا مبكراً في يوليو وأغسطس؛ وبيوت الضيافة في أوشغولي أبسط وأبرد.
  - يتقلب طقس الجبال سريعاً — سترة مطر وطبقات دافئة ضرورية حتى في عز الصيف.
