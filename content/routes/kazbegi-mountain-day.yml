en: {name: Two Days in Kazbegi Mountains, short: Georgian Military Highway Zhinvali Ananuri Jvari Pass and Gergeti in a safer two-day plan., body: A two-day route for seeing the main Caucasus views at a comfortable pace with an overnight stay in the Kazbegi area., plan: 'Day 1: Tbilisi → Zhinvali → Ananuri → Jvari Pass → Stepantsminda. Day 2: Gergeti Trinity → Tbilisi.', tips: [Check road and weather conditions before departure., In winter use a suitable vehicle and verify current road restrictions.]}
ru: {name: Два дня в горах Казбеги, short: Военно-Грузинская дорога Жинвали Ананури Крестовый перевал и Гергети в безопасном двухдневном плане., body: Двухдневный маршрут для главных видов Кавказа в спокойном темпе с ночёвкой в районе Казбеги., plan: 'День 1: Тбилиси → Жинвали → Ананури → Крестовый перевал → Степанцминда. День 2: Гергети → Тбилиси.', tips: [Перед выездом проверьте дорогу и погоду., Зимой используйте подходящий автомобиль и проверяйте ограничения движения.]}
fa: {name: دو روز در کوهستان کازبگی, short: جاده نظامی ژینوالی آنانوری گذرگاه جواری و گرگتی در برنامه‌ای ایمن‌تر و دو روزه., body: مسیر دو روزه برای دیدن مناظر اصلی قفقاز با ریتم آرام و یک شب اقامت در منطقه کازبگی., plan: 'روز ۱: تفلیس ← ژینوالی ← آنانوری ← گذرگاه جواری ← استپانتسمیندا. روز ۲: گرگتی ← تفلیس.', tips: [پیش از حرکت وضع جاده و هوا را بررسی کنید., زمستان از خودروی مناسب استفاده و محدودیت‌های جاده را بررسی کنید.]}
he: {name: יומיים בהרי קזבגי, short: הדרך הצבאית ז׳ינוואלי אנאנורי מעבר ג׳ווארי וגרגטי בתוכנית בטוחה יותר של יומיים., body: מסלול של יומיים לנופי הקווקז המרכזיים בקצב נוח ועם לינה באזור קזבגי., plan: 'יום 1: טביליסי ← ז׳ינוואלי ← אנאנורי ← מעבר ג׳ווארי ← סטפנצמינדה. יום 2: גרגטי ← טביליסי.', tips: [בדקו דרך ומזג אוויר לפני היציאה., בחורף השתמשו ברכב מתאים ובדקו מגבלות דרך עדכניות.]}
ar: {name: يومان في جبال كازبيغي, short: الطريق العسكري وجينفالي وأنانوري وممر جفاري وغيرغيتي ضمن خطة أكثر أماناً ليومين., body: مسار ليومين لرؤية أهم مناظر القوقاز بوتيرة مريحة مع مبيت في منطقة كازبيغي., plan: 'اليوم 1: تبليسي ← جينفالي ← أنانوري ← ممر جفاري ← ستيبانتسميندا. اليوم 2: غيرغيتي ← تبليسي.', tips: [افحصوا الطريق والطقس قبل الانطلاق., شتاء استخدموا سيارة مناسبة وتحققوا من قيود الطريق الحالية.]}
